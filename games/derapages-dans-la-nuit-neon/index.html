<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.

    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];

    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }

    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });

    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script id="derapage-moteur">
// ===========================================================================
// Moteur de la course : tracés, voiture, câble, rivaux. Aucun dessin, aucune
// page : ces fonctions servent au jeu, à la démonstration de l'écran titre et
// au calcul du temps de référence de chaque circuit (course parfaite du robot).
// ===========================================================================
window.MOTEUR = (function () {
  'use strict';
  const PAS = 5;            // écart entre deux points du tracé (unités du monde)
  const PI = Math.PI;
  const RAMPE = 60;         // longueur d'une rampe de saut
  const ATTERRISSAGE = 150; // route après le trou d'un saut
  const RAYON_PIECE = 26;   // distance pour ramasser une pièce

  // Hasard fixé par une graine : un circuit est toujours le même.
  function alea(graine) {
    let s = (graine * 2654435761) >>> 0 || 1;
    return function () { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
  }
  function ecartAngle(a, b) { let d = a - b; while (d > PI) d -= 2 * PI; while (d < -PI) d += 2 * PI; return d; }

  // ---------------------------------------------------------------------------
  // Les 20 circuits : q = quartier (0 port, 1 tours, 2 tunnel, 3 pont, 4 sommet),
  // v = vitesse, w = largeur de la route, n = nombre de virages, mix = poids des
  // types de virage (v angle droit, l grand virage, s serré, e épingle, c chicane),
  // pc pièces, pr rampes, pf flaques, pt turbo, pm poteaux qui bougent (probabilités),
  // rv rivaux, pluie, eclairs, nouveau = démonstration, force = nouveauté posée tôt.
  // ---------------------------------------------------------------------------
  const D = (o) => Object.assign({ mix: { v: 1 }, sMin: 240, sMax: 380, pc: 0, pr: 0, pf: 0, pt: 0, pm: 0, rv: 0,
    pluie: false, eclairs: false, nouveau: null, force: null, trouMax: 160 }, o);
  const NIVEAUX = [
    D({ q: 0, v: 290, w: 150, n: 8, sMin: 300, sMax: 430, nouveau: 'base', graine: 11 }),
    D({ q: 0, v: 300, w: 146, n: 10, mix: { v: 1, l: 0.7 }, nouveau: 'cotes', graine: 23 }),
    D({ q: 0, v: 305, w: 142, n: 12, mix: { v: 1, l: 0.5 }, pc: 0.75, nouveau: 'pieces', force: 'pieces', graine: 37 }),
    D({ q: 0, v: 310, w: 138, n: 13, mix: { v: 1, l: 0.4, e: 0.8 }, pc: 0.55, nouveau: 'epingle', force: 'epingle', graine: 41 }),
    D({ q: 1, v: 315, w: 136, n: 14, mix: { v: 1, l: 0.3, e: 0.4 }, pc: 0.5, pr: 0.35, nouveau: 'rampe', force: 'rampe', graine: 53 }),
    D({ q: 1, v: 320, w: 134, n: 15, mix: { v: 1, e: 0.35, c: 0.8 }, pc: 0.5, pr: 0.25, nouveau: 'chicane', force: 'chicane', graine: 67 }),
    D({ q: 1, v: 325, w: 132, n: 16, mix: { v: 1, e: 0.4, c: 0.4, s: 0.4 }, pc: 0.5, pr: 0.25, pf: 0.4, nouveau: 'flaque', force: 'flaque', graine: 71 }),
    D({ q: 1, v: 330, w: 118, n: 17, mix: { v: 1, e: 0.5, c: 0.5, s: 0.5, l: 0.3 }, pc: 0.5, pr: 0.3, pf: 0.3, nouveau: 'etroit', graine: 83 }),
    D({ q: 2, v: 335, w: 128, n: 17, mix: { v: 1, e: 0.4, c: 0.4, s: 0.3 }, pc: 0.5, pr: 0.2, pf: 0.2, rv: 4, nouveau: 'rivaux', graine: 97 }),
    D({ q: 2, v: 340, w: 126, n: 18, mix: { v: 1, e: 0.4, c: 0.5, s: 0.4 }, pc: 0.5, pr: 0.2, pf: 0.2, pt: 0.4, rv: 3, nouveau: 'turbo', force: 'turbo', graine: 101 }),
    D({ q: 2, v: 345, w: 124, n: 19, mix: { v: 1, e: 0.3, c: 0.4, s: 0.5, l: 0.3 }, pc: 0.5, pr: 0.2, pf: 0.2, pt: 0.25, pm: 0.45, rv: 3, nouveau: 'bouge', force: 'bouge', graine: 113 }),
    D({ q: 2, v: 350, w: 118, n: 21, mix: { v: 1, e: 0.5, c: 0.5, s: 0.5 }, pc: 0.55, pr: 0.25, pf: 0.3, pt: 0.3, pm: 0.3, rv: 5, graine: 127 }),
    D({ q: 3, v: 345, w: 128, n: 19, mix: { v: 1, e: 0.3, c: 0.4, s: 0.3, l: 0.4 }, pc: 0.5, pr: 0.2, pf: 0.2, pluie: true, nouveau: 'pluie', graine: 131 }),
    D({ q: 3, v: 355, w: 122, n: 20, mix: { v: 1, e: 0.3, c: 0.3, s: 0.4 }, pc: 0.5, pr: 0.55, pf: 0.2, pt: 0.25, trouMax: 240, nouveau: 'sauts', force: 'rampe', graine: 149 }),
    D({ q: 3, v: 360, w: 120, n: 22, mix: { v: 1, e: 0.4, c: 0.4, s: 0.4 }, pc: 0.5, pr: 0.25, pf: 0.25, pt: 0.25, pm: 0.35, rv: 4, pluie: true, graine: 157 }),
    D({ q: 3, v: 365, w: 116, n: 24, mix: { v: 1, e: 0.5, c: 0.5, s: 0.5, l: 0.3 }, pc: 0.55, pr: 0.35, pf: 0.3, pt: 0.3, pm: 0.35, rv: 5, trouMax: 210, graine: 163 }),
    D({ q: 4, v: 360, w: 116, n: 24, mix: { v: 0.6, e: 1.8, c: 0.4, s: 0.6 }, pc: 0.5, pr: 0.2, pf: 0.25, pt: 0.25, pm: 0.2, rv: 3, sMin: 190, sMax: 300, nouveau: 'lacets', force: 'epingle', graine: 173 }),
    D({ q: 4, v: 365, w: 118, n: 25, mix: { v: 1, e: 0.6, c: 0.4, s: 0.5 }, pc: 0.5, pr: 0.3, pf: 0.3, pt: 0.25, pm: 0.3, rv: 4, pluie: true, eclairs: true, nouveau: 'orage', graine: 181 }),
    D({ q: 4, v: 372, w: 112, n: 28, mix: { v: 1, e: 0.7, c: 0.5, s: 0.6, l: 0.2 }, pc: 0.55, pr: 0.35, pf: 0.3, pt: 0.3, pm: 0.35, rv: 5, trouMax: 220, graine: 191 }),
    D({ q: 4, v: 380, w: 110, n: 32, mix: { v: 1, e: 0.7, c: 0.5, s: 0.6, l: 0.3 }, pc: 0.55, pr: 0.35, pf: 0.35, pt: 0.3, pm: 0.4, rv: 6, pluie: true, eclairs: true, trouMax: 220, nouveau: 'finale', graine: 199 }),
  ];

  // ---------------------------------------------------------------------------
  // Tracé : une liste de morceaux posés bout à bout.
  //   { t: 'S', L }            ligne droite (pieces, turbo)
  //   { t: 'J', L, trou }      rampe, trou, puis atterrissage
  //   { t: 'T', ang, R }       virage autour d'un poteau (ang > 0 : à droite)
  // poser() ajoute les points du tracé à « sortie » et les poteaux à « poteaux ».
  // ---------------------------------------------------------------------------
  function poser(liste, x, y, a, sortie, poteaux, hw, depart) {
    let X = x, Y = y, A = a;
    for (const m of liste) {
      const p = depart + (m.rang || 0);
      m.debut = sortie.length;
      if (m.t === 'T') {
        const sens = m.ang > 0 ? 1 : -1;
        const nx = -Math.sin(A) * sens, ny = Math.cos(A) * sens;
        const cx = X + nx * m.R, cy = Y + ny * m.R;
        const rx0 = X - cx, ry0 = Y - cy;
        const n = Math.max(2, Math.ceil(Math.abs(m.ang) * m.R / PAS));
        const largeur = hw + (m.bouge ? m.bouge.A : 0) + (m.flaque ? 8 : 0);
        for (let j = 1; j <= n; j++) {
          const f = j / n, th = m.ang * f, c = Math.cos(th), s = Math.sin(th);
          const px = cx + rx0 * c - ry0 * s, py = cy + rx0 * s + ry0 * c;
          sortie.push({ x: px, y: py, a: A + th, p, k: 'T', hw: largeur, f, flaque: !!(m.flaque && f > 0.12 && f < 0.62) });
        }
        // milieu de l'arc → centre : direction du rail d'un poteau mobile
        const tm = m.ang / 2, mxr = rx0 * Math.cos(tm) - ry0 * Math.sin(tm), myr = rx0 * Math.sin(tm) + ry0 * Math.cos(tm);
        const l = Math.hypot(mxr, myr) || 1;
        m.poteau = poteaux.length;
        poteaux.push({ x: cx, y: cy, R: m.R, p, ux: -mxr / l, uy: -myr / l, bouge: m.bouge || null, ang: m.ang, debut: m.debut });
        A += m.ang;
        X = sortie[sortie.length - 1].x; Y = sortie[sortie.length - 1].y;
      } else {
        const n = Math.max(1, Math.ceil(m.L / PAS));
        const dx = Math.cos(A), dy = Math.sin(A);
        for (let j = 1; j <= n; j++) {
          const d = j * m.L / n;
          const pt = { x: X + dx * d, y: Y + dy * d, a: A, p, k: m.t, hw, f: j / n };
          if (m.t === 'J') {
            const e0 = m.elan || 0; // ligne d'élan avant la rampe
            if (d >= e0 && d < e0 + RAMPE) { pt.rampe = true; if (d >= e0 + RAMPE - 12) pt.saut = true; }
            else if (d >= e0 + RAMPE && d < e0 + RAMPE + m.trou) pt.vide = true;
          }
          if (m.turbo && d >= m.L * 0.3 && d < m.L * 0.3 + 45) pt.turbo = true;
          sortie.push(pt);
        }
        X += dx * m.L; Y += dy * m.L;
      }
    }
    return { x: X, y: Y, a: A };
  }

  // Fabrique la liste des morceaux d'un circuit (toujours la même pour un circuit) :
  // chaque virage est tiré au hasard (graine), puis refusé s'il passerait trop près
  // d'une route déjà posée ou d'un poteau ; la route monte en gros vers le haut.
  function genererMorceaux(def) {
    const r = alea(def.graine);
    const hw = def.w / 2;
    const morceaux = [];
    const pts = [], poteaux = [];
    const CEL = 90, grille = new Map();
    const cle = (x, y) => Math.floor(x / CEL) + ',' + Math.floor(y / CEL);
    const ranger = (debut) => { for (let i = debut; i < pts.length; i++) { const k = cle(pts[i].x, pts[i].y); let l = grille.get(k); if (!l) grille.set(k, l = []); l.push(i); } };
    const ecart = def.w * 1.45 + 30;
    function libre(cpts, cpot, limite) {
      for (const q of cpts) {
        const gx = Math.floor(q.x / CEL), gy = Math.floor(q.y / CEL);
        for (let ix = -2; ix <= 2; ix++) for (let iy = -2; iy <= 2; iy++) {
          const l = grille.get((gx + ix) + ',' + (gy + iy)); if (!l) continue;
          for (const i of l) { if (i >= limite) continue; const dx = pts[i].x - q.x, dy = pts[i].y - q.y; if (dx * dx + dy * dy < ecart * ecart) return false; }
        }
        for (const o of poteaux) { const dx = o.x - q.x, dy = o.y - q.y; if (dx * dx + dy * dy < (hw + 34) * (hw + 34)) return false; }
      }
      for (const o of cpot) {
        const gx = Math.floor(o.x / CEL), gy = Math.floor(o.y / CEL);
        for (let ix = -2; ix <= 2; ix++) for (let iy = -2; iy <= 2; iy++) {
          const l = grille.get((gx + ix) + ',' + (gy + iy)); if (!l) continue;
          for (const i of l) { const dx = pts[i].x - o.x, dy = pts[i].y - o.y; if (dx * dx + dy * dy < (hw + 34) * (hw + 34)) return false; }
        }
      }
      return true;
    }
    const tirer = (mix) => { let tot = 0; for (const k in mix) tot += mix[k]; let u = r() * tot; for (const k in mix) { u -= mix[k]; if (u <= 0) return k; } return 'v'; };
    const entre = (a, b) => a + r() * (b - a);
    let etat = { x: 0, y: 0, a: -PI / 2 };
    const ajouter = (liste) => {
      for (const m of liste) { m.rang = morceaux.length; morceaux.push(m); }
      const d0 = pts.length;
      etat = poser(liste, etat.x, etat.y, etat.a, pts, poteaux, hw, 0);
      ranger(d0);
    };
    ajouter([{ t: 'S', L: 420, depart: true }]);
    let droites = 0, virages = 0;
    for (let k = 0; k < def.n; k++) {
      let pris = null;
      for (let essai = 0; essai < 40 && !pris; essai++) {
        const tot = virages;
        let type = tirer(def.mix);
        if (def.force === 'epingle' && tot < 3 && essai < 16) type = 'e';
        if (def.force === 'chicane' && tot < 3 && essai < 16) type = 'c';
        if (essai > 30) type = r() < 0.5 ? 'v' : 'l';
        const rel = ecartAngle(etat.a, -PI / 2); // 0 = vers le haut, > 0 vers la droite
        let tours;
        if (type === 'c') {
          const ang = entre(0.85, 1.05), R = hw + entre(85, 105), s = r() < 0.5 ? 1 : -1;
          if (Math.abs(rel + s * ang) > 1.75) continue;
          tours = [{ t: 'T', ang: s * ang, R }, { t: 'S', L: entre(40, 70) }, { t: 'T', ang: -s * ang, R }];
        } else {
          let ang, R;
          if (type === 'e') { ang = PI; R = hw + entre(38, 50); }
          else if (type === 's') { ang = entre(1.95, 2.15); R = hw + entre(55, 70); }
          else if (type === 'l') { ang = entre(0.75, 1.05); R = hw + entre(150, 210); }
          else { ang = PI / 2 + entre(-0.12, 0.12); R = hw + entre(85, 110); }
          const sens = [1, -1].filter((s) => Math.abs(rel + s * ang) <= 1.8);
          if (!sens.length) continue;
          const s = sens[Math.floor(r() * sens.length)];
          tours = [{ t: 'T', ang: s * ang, R }];
          const tFlaque = def.pf > 0 && (r() < def.pf || (def.force === 'flaque' && tot < 3));
          const tBouge = def.pm > 0 && type !== 'e' && (r() < def.pm || (def.force === 'bouge' && tot < 3));
          if (tFlaque) tours[0].flaque = true;
          if (tBouge) tours[0].bouge = { A: 24, w: entre(1.3, 2.0), ph: entre(0, 6.28) };
          if (def.pc > 0 && r() < def.pc * 0.5) tours[0].pieces = 3 + Math.floor(r() * 3);
        }
        // ligne droite après le virage : simple, avec turbo, ou saut
        let droite;
        const L = entre(def.sMin, def.sMax);
        const forceSaut = def.force === 'rampe' && droites < 2;
        if (k > 0 && k < def.n - 1 && def.pr > 0 && (forceSaut || r() < def.pr)) {
          const trou = entre(110, def.trouMax);
          droite = { t: 'J', elan: 130, L: 130 + RAMPE + trou + ATTERRISSAGE, trou };
          if (def.pc > 0 && r() < 0.7) droite.pieces = 3 + Math.floor(r() * 3);
        } else {
          droite = { t: 'S', L };
          if (def.pt > 0 && (r() < def.pt || (def.force === 'turbo' && droites < 3))) droite.turbo = true;
          if (def.pc > 0 && (r() < def.pc || (def.force === 'pieces' && droites < 3))) {
            droite.pieces = Math.max(3, Math.floor(L / 70));
            droite.ligne = ['milieu', 'milieu', 'zigzag', 'vague'][Math.floor(r() * 4)];
          }
        }
        const essaiListe = tours.concat([droite]).map((m) => Object.assign({}, m, { rang: 0 }));
        const cpts = [], cpot = [];
        poser(essaiListe, etat.x, etat.y, etat.a, cpts, cpot, hw, 0);
        if (libre(cpts, cpot, pts.length - Math.ceil(ecart * 1.6 / PAS))) pris = tours.concat([droite]);
      }
      if (!pris) pris = [{ t: 'S', L: 160 }];
      else { virages++; droites++; }
      ajouter(pris);
    }
    ajouter([{ t: 'S', L: 900, arrivee: true }]);
    return morceaux;
  }

  // Construit un circuit complet : points, poteaux, pièces, points de contrôle, temps.
  const cache = {};
  function construireCircuit(n) {
    if (cache[n]) return cache[n];
    const def = NIVEAUX[n];
    const morceaux = genererMorceaux(def);
    const pts = [], poteaux = [];
    poser(morceaux, 0, 0, -PI / 2, pts, poteaux, def.w / 2, 0);
    const hw = def.w / 2;
    const pieces = [], controles = [0];
    let finIdx = pts.length - 1;
    const flaques = [], turbos = [];
    for (const m of morceaux) {
      if ((m.t === 'S' && m.L >= 100) || m.t === 'J') controles.push(m.debut);
      if (m.arrivee) finIdx = m.debut + Math.round(380 / PAS);
      if (m.pieces && m.t === 'S') {
        const n = m.pieces, fin = m.debut + Math.ceil(m.L / PAS);
        for (let j = 0; j < n; j++) {
          const f = 0.22 + 0.58 * (n > 1 ? j / (n - 1) : 0.5);
          const i = Math.min(fin - 1, m.debut + Math.round(f * (fin - m.debut)));
          let o = 0;
          // pièces sur la ligne : au milieu, en zigzag ou en vague (toujours à portée d'une voiture bien placée)
          if (m.ligne === 'zigzag') o = (j % 2 ? 0.2 : -0.2); else if (m.ligne === 'vague') o = 0.22 * Math.sin(j * 1.3);
          const q = pts[i];
          pieces.push({ x: q.x - Math.sin(q.a) * o * hw, y: q.y + Math.cos(q.a) * o * hw, i });
        }
      }
      if (m.pieces && m.t === 'J') {
        const n = m.pieces;
        for (let j = 0; j < n; j++) {
          const d = (m.elan || 0) + RAMPE + 20 + (m.trou - 20) * (n > 1 ? j / (n - 1) : 0.5);
          const i = m.debut + Math.round(d / PAS); const q = pts[i];
          pieces.push({ x: q.x, y: q.y, i, air: true });
        }
      }
      if (m.pieces && m.t === 'T') {
        const P = poteaux[m.poteau]; const n = m.pieces;
        const nbp = Math.ceil(Math.abs(m.ang) * m.R / PAS);
        for (let j = 0; j < n; j++) {
          const f = 0.18 + 0.55 * (n > 1 ? j / (n - 1) : 0.5);
          const i = m.debut + Math.round(f * nbp); const q = pts[i];
          const dx = q.x - P.x, dy = q.y - P.y, l = Math.hypot(dx, dy) || 1;
          pieces.push({ x: P.x + dx / l * (m.R + hw * 0.5), y: P.y + dy / l * (m.R + hw * 0.5), i, large: true });
        }
      }
    }
    for (let i = 0; i < pts.length; i++) {

  // ---------------------------------------------------------------------------
  // Course : état et pas de simulation

  function nouvelleCourse(c, options) {

        vx: 0, vy: 0, vr: 0, idx: 6, boost: 0, choc: 0, attendLache: false, bordCd: 0, dist: 0, flaque: false, tourne: 0 },

  function pas1(e, dt, appui, ev) {

    e.t += dt;
    if (!e.fini) e.chrono += dt;

    if (car.choc > 0) car.choc -= dt;

      if (dx * dx + dy * dy < RAYON_PIECE * RAYON_PIECE) { e.prises[k] = true; e.nbPieces++; ev.push({ t: 'piece', k }); }

    for (let k = 0; k < e.rivaux.length; k++) {
      const rv = e.rivaux[k];
      if (rv.s >= pts.length - 2) continue;
      if (car.air <= 0 && !rv.air && rv.cd <= 0) {

    // reflets, phares avant, feux arrière
    c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-2, -5, 5, 3);
    c.fillStyle = '#fffbe0'; c.fillRect(21, -9, 4, 4); c.fillRect(21, 5, 4, 4);
    c.fillStyle = '#ff3050'; c.fillRect(-25, -10, 3, 5); c.fillRect(-25, 5, 3, 5);
    c.restore();
  }
  function dessinerPiece(c, x, y, k, temps, ph) {
    const s = k * (1 + 0.08 * Math.sin(temps * 6 + ph));
    c.save(); c.translate(x, y); c.scale(s, s);
    const lg = c.createRadialGradient(0, 0, 2, 0, 0, 20);
    lg.addColorStop(0, 'rgba(255,225,74,.7)'); lg.addColorStop(1, 'rgba(255,225,74,0)');
    c.fillStyle = lg; c.beginPath(); c.arc(0, 0, 20, 0, 2 * PI); c.fill();
    c.fillStyle = '#3a2a00'; c.beginPath(); c.arc(0, 0, 11, 0, 2 * PI); c.fill();
    c.strokeStyle = '#ffe14a'; c.lineWidth = 2.5; c.stroke();
    c.fillStyle = '#ffe14a';
    c.beginPath(); c.moveTo(2, -8); c.lineTo(-5, 1); c.lineTo(-0.5, 1); c.lineTo(-2.5, 8); c.lineTo(5, -1.5); c.lineTo(0.5, -1.5); c.closePath(); c.fill();
    c.restore();
  }
  function dessinerPoteau(c, x, y, k, couleur, temps, vise, accroche) {
    c.save(); c.translate(x, y); c.scale(k, k);
    const lg = c.createRadialGradient(0, 0, 4, 0, 0, 46);
    lg.addColorStop(0, hexA(couleur, accroche ? 0.85 : 0.55)); lg.addColorStop(1, hexA(couleur, 0));
    c.fillStyle = lg; c.beginPath(); c.arc(0, 0, 46, 0, 2 * PI); c.fill();
    c.fillStyle = '#1c1840'; c.beginPath(); c.arc(0, 0, 15, 0, 2 * PI); c.fill();
    c.strokeStyle = couleur; c.lineWidth = 4; c.stroke();
    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(0, 0, 6.5, 0, 2 * PI); c.fill();
    c.fillStyle = couleur; c.beginPath(); c.arc(0, 0, 3.5, 0, 2 * PI); c.fill();
    if (vise) {
      c.strokeStyle = '#ffffff'; c.lineWidth = 2.5; c.setLineDash([6, 6]); c.lineDashOffset = -temps * 30;
      c.beginPath(); c.arc(0, 0, 25 + 3 * Math.sin(temps * 8), 0, 2 * PI); c.stroke(); c.setLineDash([]);
    }
    c.restore();
  }

  // ---------------------------------------------------------------------------
  // Particules et traînée
  // ---------------------------------------------------------------------------
  let parts = [];
  function jaillir(x, y, n, couleur, vit, vie, taille, sorte) {
    if (parts.length > 500) parts.splice(0, parts.length - 500);
    for (let i = 0; i < n; i++) {
      const a = aleaVisuel() * 2 * PI, v = vit * (0.3 + aleaVisuel() * 0.7);
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie, max: vie, c: couleur, s: taille * (0.6 + aleaVisuel() * 0.6), sorte: sorte || 'point', rot: aleaVisuel() * 6 });
    }
  }
  function majParticules(dt) {
    for (const p of parts) {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 1 - dt * 2; p.vy *= 1 - dt * 2;
      if (p.sorte === 'fumee') p.s += dt * 18;
      if (p.sorte === 'confetti') { p.vy += 30 * dt; p.rot += dt * 8; }
    }
    parts = parts.filter((p) => p.vie > 0);
  }
  function dessinerParticules(c) {
    for (const p of parts) {
      const al = Math.max(0, p.vie / p.max);
      if (p.sorte === 'fumee') { c.fillStyle = 'rgba(200,190,255,' + (al * 0.22) + ')'; c.beginPath(); c.arc(p.x, p.y, p.s, 0, 2 * PI); c.fill(); }
      else if (p.sorte === 'confetti') { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.c; c.globalAlpha = al; c.fillRect(-p.s, -p.s / 2, p.s * 2, p.s); c.restore(); }
      else { c.fillStyle = hexA(p.c, al); c.beginPath(); c.arc(p.x, p.y, p.s * (0.5 + al * 0.5), 0, 2 * PI); c.fill(); }
    }
  }
  function dessinerTrainee(c, trace, type, neon, temps) {
    const n = trace.length; if (n < 2) return;
    c.lineCap = 'round'; c.lineJoin = 'round';
    if (type === 3) { // bulles
      for (let i = 0; i < n; i += 2) { const u = i / n; c.strokeStyle = hexA(neon, u * 0.8); c.lineWidth = 2; c.beginPath(); c.arc(trace[i].x, trace[i].y, 3 + (1 - u) * 9, 0, 2 * PI); c.stroke(); }
      return;
    }
    for (let i = 1; i < n; i++) {
      const u = i / n, p0 = trace[i - 1], p1 = trace[i];
      let col = neon;
      if (type === 5) col = 'hsl(' + Math.round((i * 12 + temps * 200) % 360) + ',100%,62%)';
      if (type === 2) { // ruban double
        const nx = -Math.sin(p1.a) * 9, ny = Math.cos(p1.a) * 9;
        c.strokeStyle = type === 5 ? col : hexA(neon, u * 0.85); c.lineWidth = 5 * u + 1;
        c.beginPath(); c.moveTo(p0.x + nx, p0.y + ny); c.lineTo(p1.x + nx, p1.y + ny); c.moveTo(p0.x - nx, p0.y - ny); c.lineTo(p1.x - nx, p1.y - ny); c.stroke();
        continue;
      }
      if (type === 4) { // zigzag d'éclair
        const z = (i % 2 ? 1 : -1) * 7 * u, nx = -Math.sin(p1.a) * z, ny = Math.cos(p1.a) * z;
        c.strokeStyle = hexA(neon, u); c.lineWidth = 6 * u + 1;
        c.beginPath(); c.moveTo(p0.x, p0.y); c.lineTo(p1.x + nx, p1.y + ny); c.stroke();
        c.strokeStyle = 'rgba(255,255,255,' + u + ')'; c.lineWidth = 2; c.stroke();
        continue;
      }
      c.globalAlpha = u * 0.9;
      c.strokeStyle = col; c.lineWidth = (type === 1 ? 4 : 10) * u + 1;
      c.beginPath(); c.moveTo(p0.x, p0.y); c.lineTo(p1.x, p1.y); c.stroke();
      c.globalAlpha = 1;
    }
  }

  // ---------------------------------------------------------------------------
  // Dessin d'une course (monde + effets)
  // ---------------------------------------------------------------------------
  function dessinerCourse(sim, dt, opts) {
    opts = opts || {};
    const e = sim.e, c = e.c, def = c.def, Q = QUARTIERS[def.q], R = prepRendu(c);
    const S = echelle();
    const car = e.car;
    // caméra : devant la voiture
    const regard = 150;
    const tx = car.x + Math.cos(car.a) * regard * (car.chute > 0 ? 0.3 : 1), ty = car.y + Math.sin(car.a) * regard * (car.chute > 0 ? 0.3 : 1);
    if (opts.cale) { cam.x = tx; cam.y = ty; }
    else { const f = 1 - Math.exp(-dt * 3.2); cam.x += (tx - cam.x) * f; cam.y += (ty - cam.y) * f; }
    cam.secousse = Math.max(0, cam.secousse - dt * 2.5);
    const sx = cam.secousse > 0 ? (aleaVisuel() - 0.5) * cam.secousse * 22 : 0, sy = cam.secousse > 0 ? (aleaVisuel() - 0.5) * cam.secousse * 22 : 0;
    const temps = e.t;
    dessinerFond(Q, cam.x, cam.y, S, sim.tempsVisuel || temps);
    g.setTransform(DPR * S, 0, 0, DPR * S, DPR * (W / 2 - cam.x * S + sx), DPR * (H / 2 - cam.y * S + sy));
    const vx0 = cam.x - W / 2 / S - 200, vx1 = cam.x + W / 2 / S + 200, vy0 = cam.y - H / 2 / S - 200, vy1 = cam.y + H / 2 / S + 200;
    const visibles = R.runs.filter((r) => r.x1 + r.hw > vx0 && r.x0 - r.hw < vx1 && r.y1 + r.hw > vy0 && r.y0 - r.hw < vy1);
    g.lineCap = 'butt'; g.lineJoin = 'round';
    // tunnel : murs sombres autour de la route
    if (Q.tunnel) {
      for (const r of visibles) { g.strokeStyle = '#150b1e'; g.lineWidth = r.hw * 2 + 96; g.stroke(r.path); }
      for (const r of visibles) { g.strokeStyle = '#3b2238'; g.lineWidth = r.hw * 2 + 56; g.stroke(r.path); }
    }
    // ombre de la route suspendue
    g.save(); g.translate(16, 22);
    for (const r of visibles) { g.strokeStyle = 'rgba(0,0,10,.38)'; g.lineWidth = r.hw * 2 + 14; g.stroke(r.path); }
    g.restore();
    for (const r of visibles) { g.strokeStyle = hexA(Q.bord, 0.22); g.lineWidth = r.hw * 2 + 30; g.stroke(r.path); }
    for (const r of visibles) { g.strokeStyle = Q.bord; g.lineWidth = r.hw * 2 + 9; g.stroke(r.path); }
    for (const r of visibles) { g.strokeStyle = '#ffffff'; g.lineWidth = r.hw * 2 + 2; g.stroke(r.path); }
    for (const r of visibles) { g.strokeStyle = Q.route; g.lineWidth = r.hw * 2 - 3; g.stroke(r.path); }
    g.setLineDash([18, 24]); g.lineDashOffset = 0;
    for (const r of visibles) { g.strokeStyle = 'rgba(255,255,255,.22)'; g.lineWidth = 3; g.stroke(r.path); }
    g.setLineDash([]);
    const vu = (x, y, m) => x > vx0 - m && x < vx1 + m && y > vy0 - m && y < vy1 + m;
    // lampes du tunnel, haubans du pont
    if (Q.tunnel) for (const l of R.lampes) if (vu(l.x, l.y, 20)) {
      g.fillStyle = 'rgba(255,170,60,.28)'; g.beginPath(); g.arc(l.x, l.y, 16, 0, 2 * PI); g.fill();
      g.fillStyle = '#ffd08a'; g.beginPath(); g.arc(l.x, l.y, 4.5, 0, 2 * PI); g.fill();
    }
    if (Q.pont) {
      g.strokeStyle = hexA(Q.bord, 0.75); g.lineWidth = 2.5;
      for (const cb of R.cables) g.stroke(cb);
      for (const cote of R.haubans) for (const h of cote) if (vu(h.x, h.y, 20)) { g.fillStyle = '#e8fff0'; g.beginPath(); g.arc(h.x, h.y, 6.5, 0, 2 * PI); g.fill(); g.fillStyle = Q.bord; g.beginPath(); g.arc(h.x, h.y, 3, 0, 2 * PI); g.fill(); }
    }
    // rampes et bords des trous
    for (const m of c.morceaux) {
      if (m.t !== 'J') continue;
      const q0 = c.pts[m.debut]; if (!vu(q0.x, q0.y, 400)) continue;
      const e0 = m.elan || 0;
      const qa = c.pts[m.debut + Math.round((e0 + M.RAMPE / 2) / PAS)], hw = q0.hw;
      g.save(); g.translate(qa.x, qa.y); g.rotate(qa.a);
      g.fillStyle = '#ffd23f'; g.fillRect(-M.RAMPE / 2, -hw + 2, M.RAMPE, hw * 2 - 4);
      g.fillStyle = '#1a1430';
      for (let s = -hw; s < hw; s += 16) { g.beginPath(); g.moveTo(-M.RAMPE / 2, s); g.lineTo(-M.RAMPE / 2 + 12, s); g.lineTo(M.RAMPE / 2, s + 20); g.lineTo(M.RAMPE / 2 - 12, s + 20); g.closePath(); g.fill(); }
      g.fillStyle = '#ffffff'; g.fillRect(M.RAMPE / 2 - 4, -hw, 4, hw * 2);
      g.restore();
      const qf = c.pts[m.debut + Math.round((e0 + M.RAMPE + m.trou) / PAS)];
      if (qf) { g.save(); g.translate(qf.x, qf.y); g.rotate(qf.a); g.fillStyle = Q.bord; g.fillRect(0, -hw - 6, 6, hw * 2 + 12); g.restore(); }
    }
    // départ et arrivée (damier)
    const damier = (i, larg) => {
      const q = c.pts[i]; if (!q || !vu(q.x, q.y, 200)) return;
      g.save(); g.translate(q.x, q.y); g.rotate(q.a);
      const n = 10, cw = q.hw * 2 / n;
      for (let a = 0; a < 2; a++) for (let b = 0; b < n; b++) { g.fillStyle = (a + b) % 2 ? '#111' : '#fff'; g.fillRect(a * cw - cw, -q.hw + b * cw, cw, cw); }
      if (larg) for (const s of [-1, 1]) {
        g.fillStyle = hexA(Q.bord2, 0.35); g.beginPath(); g.arc(0, s * (q.hw + 18), 22, 0, 2 * PI); g.fill();
        g.fillStyle = Q.bord2; g.beginPath(); g.arc(0, s * (q.hw + 18), 8, 0, 2 * PI); g.fill();
      }
      g.restore();
    };
    damier(4, false); damier(c.finIdx, true);
    // flaques
    for (const i of c.flaques) {
      const q = c.pts[i]; if (!vu(q.x, q.y, 80)) continue;
      g.fillStyle = 'rgba(80,170,255,.32)'; g.beginPath(); g.ellipse(q.x, q.y, q.hw * 0.75, q.hw * 0.42, q.a, 0, 2 * PI); g.fill();
      g.strokeStyle = 'rgba(180,230,255,.55)'; g.lineWidth = 2; g.beginPath(); g.ellipse(q.x + 6, q.y - 4, q.hw * 0.35, q.hw * 0.16, q.a, 0, PI); g.stroke();
    }
    // bandes turbo
    for (const i of c.turbos) {
      const q = c.pts[i]; if (!vu(q.x, q.y, 80)) continue;
      g.save(); g.translate(q.x, q.y); g.rotate(q.a);
      for (let k = 0; k < 3; k++) {
        const al = 0.45 + 0.55 * Math.max(0, Math.sin(temps * 8 - k * 1.2));
        g.strokeStyle = 'rgba(255,225,74,' + al + ')'; g.lineWidth = 7;
        g.beginPath(); g.moveTo(k * 15, -q.hw * 0.6); g.lineTo(k * 15 + 14, 0); g.lineTo(k * 15, q.hw * 0.6); g.stroke();
      }
      g.restore();
    }
    // pièces
    for (let k = 0; k < c.pieces.length; k++) {
      if (e.prises[k]) continue;
      const pc = c.pieces[k]; if (!vu(pc.x, pc.y, 30)) continue;
      dessinerPiece(g, pc.x, pc.y, pc.air ? 1.15 : 1, temps, k);
    }
    // rails des poteaux mobiles, poteaux
    for (let j = 0; j < c.poteaux.length; j++) {
      const o = c.poteaux[j]; if (!vu(o.x, o.y, 80)) continue;
      if (o.bouge) {
        g.strokeStyle = hexA(Q.bord2, 0.5); g.lineWidth = 5; g.lineCap = 'round';
        g.beginPath(); g.moveTo(o.x - o.ux * o.bouge.A, o.y - o.uy * o.bouge.A); g.lineTo(o.x + o.ux * o.bouge.A, o.y + o.uy * o.bouge.A); g.stroke();
        g.lineCap = 'butt';
      }
      const p = M.positionPoteau(e, j);
      dessinerPoteau(g, p.x, p.y, 1, Q.bord2, temps, !opts.sansVise && e.cible === j && !car.acc && car.chute <= 0, car.acc && car.acc.j === j);
    }
    // rivaux
    for (const rv of e.rivaux) {
      if (rv.s >= c.pts.length - 2 || !vu(rv.x, rv.y, 60)) continue;
      const k = rv.air ? 1.25 : 1;
      if (rv.air) { g.fillStyle = 'rgba(0,0,10,.35)'; g.beginPath(); g.ellipse(rv.x + 14, rv.y + 18, 24, 14, rv.a, 0, 2 * PI); g.fill(); }
      dessinerVoiture(g, rv.x, rv.y, rv.a, rv.coul % 5, RIVAUX_COUL[rv.coul], RIVAUX_COUL[(rv.coul + 2) % 6], k, { phares: true });
    }
    // traînée, câble, voiture
    dessinerTrainee(g, sim.trace, P.trainee, NEONS[P.neon], temps);
    let ka = 1;
    if (car.air > 0 && car.airTot > 0) { const u = 1 - car.air / car.airTot; ka = 1 + Math.sin(u * PI) * 0.45; }
    if (car.chute > 0) ka = car.chuteVide ? Math.max(0.2, car.chute / 0.9) : 1 + (0.9 - car.chute) * 0.8;
    if (car.acc) {
      const p = M.positionPoteau(e, car.acc.j);
      g.lineCap = 'round';
      g.strokeStyle = hexA(NEONS[P.neon], 0.35); g.lineWidth = 12; g.beginPath(); g.moveTo(car.x, car.y); g.lineTo(p.x, p.y); g.stroke();
      g.strokeStyle = '#ffffff'; g.lineWidth = 3.5; g.stroke();
      g.lineCap = 'butt';
    }
    if (car.air > 0 || car.chute > 0) { g.fillStyle = 'rgba(0,0,10,.35)'; g.beginPath(); g.ellipse(car.x + 16 * ka, car.y + 20 * ka, 24, 14, car.a, 0, 2 * PI); g.fill(); }
    const angleCorps = car.a + (sim.derive || 0);
    if (!(car.chute > 0 && car.chuteVide && car.chute < 0.25)) dessinerVoiture(g, car.x, car.y, angleCorps, P.voiture, CORPS[P.voiture], NEONS[P.neon], ka, { phares: true });
    dessinerParticules(g);
    // pluie : on ne voit que près de la voiture ; les poteaux brillent toujours
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const csx = W / 2 + (car.x - cam.x) * S, csy = H / 2 + (car.y - cam.y) * S;
    if (def.pluie) {
      const flash = sim.eclair > 0;
      if (!flash) {
        const r0 = 150 * S, r1 = 330 * S;
        const gr = g.createRadialGradient(csx + Math.cos(car.a) * 60 * S, csy + Math.sin(car.a) * 60 * S, r0, csx, csy, r1);
        gr.addColorStop(0, 'rgba(6,6,22,0)'); gr.addColorStop(1, 'rgba(6,6,22,.86)');
        g.fillStyle = gr; g.fillRect(0, 0, W, H);
        for (let j = 0; j < c.poteaux.length; j++) {
          const o = c.poteaux[j]; if (!vu(o.x, o.y, 60)) continue;
          const p = M.positionPoteau(e, j), px = W / 2 + (p.x - cam.x) * S, py = H / 2 + (p.y - cam.y) * S;
          const lg = g.createRadialGradient(px, py, 2, px, py, 26 * S);
          lg.addColorStop(0, hexA(Q.bord2, 0.9)); lg.addColorStop(1, hexA(Q.bord2, 0));
          g.fillStyle = lg; g.beginPath(); g.arc(px, py, 26 * S, 0, 2 * PI); g.fill();
        }
      } else {
        g.fillStyle = 'rgba(230,235,255,' + Math.min(0.55, sim.eclair * 2.2) + ')'; g.fillRect(0, 0, W, H);
      }
      g.strokeStyle = 'rgba(180,200,255,.38)'; g.lineWidth = 1.4;
      g.beginPath();
      const tp = sim.tempsVisuel || temps;
      for (let k = 0; k < 120; k++) {
        const x = ((k * 97.3 + tp * 160) % (W + 60)) - 30, y = ((k * 53.7 + tp * 900 + k * k) % (H + 60)) - 30;
        g.moveTo(x, y); g.lineTo(x - 6, y + 18);
      }
      g.stroke();
    }
    // feux de départ (sans texte : trois lumières rouges, puis vertes)
    if (sim.feux !== undefined && sim.feux >= 0) {
      const n = Math.min(4, Math.floor(sim.feux / 0.6));
      const bw = 190, bx = W / 2 - bw / 2, by = H * 0.22;
      g.fillStyle = 'rgba(10,8,30,.85)'; rr(g, bx, by, bw, 64, 20); g.fill();
      g.strokeStyle = '#5cf0ff'; g.lineWidth = 2; g.stroke();
      for (let k = 0; k < 3; k++) {
        const x = bx + 38 + k * 57, y = by + 32, on = n > k, vert = n >= 3;
        g.fillStyle = vert ? '#4dff7a' : (on ? '#ff3050' : '#3a2a3a');
        if (on || vert) { g.shadowColor = g.fillStyle; g.shadowBlur = 18; }
        g.beginPath(); g.arc(x, y, 19, 0, 2 * PI); g.fill(); g.shadowBlur = 0;
      }
    }
    // vignette douce sur les bords
    const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,20,0)'); vg.addColorStop(1, 'rgba(0,0,20,.35)');
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }

  // ---------------------------------------------------------------------------
  // Une course : création, mise à jour, événements
  // ---------------------------------------------------------------------------
  let course = null;   // course du joueur
  let fond = null;     // course de démonstration derrière les menus
  let ecran = 'titre';
  let appuiDoigt = false;
  const touches = new Set();
  const appuiJoueur = () => appuiDoigt || touches.size > 0;

  function creerSim(n, options) {
    const c = M.construireCircuit(n);
    prepRendu(c);
    return { n, c, e: M.nouvelleCourse(c, options), trace: [], derive: 0, eclair: 0, prochainEclair: 3 + aleaVisuel() * 4, tempsVisuel: 0, chuteVue: 0 };
  }
  function majTrace(sim, dt) {
    const car = sim.e.car;
    if (car.chute > 0) { if (sim.trace.length) sim.trace.shift(); return; }
    const ax = car.x - Math.cos(car.a) * 20, ay = car.y - Math.sin(car.a) * 20;
    sim.trace.push({ x: ax, y: ay, a: car.a });
    const max = P.trainee === 0 || P.trainee === 5 ? 34 : 26;
    while (sim.trace.length > max) sim.trace.shift();
    // dérive visuelle : le nez de la voiture rentre dans le virage
    const cible = car.acc ? car.acc.s * 0.42 : 0;
    sim.derive += (cible - sim.derive) * Math.min(1, dt * 7);
    if (car.acc && aleaVisuel() < 0.6) {
      const nx = -Math.sin(car.a), ny = Math.cos(car.a);
      for (const s of [-1, 1]) parts.push({ x: ax + nx * s * 11, y: ay + ny * s * 11, vx: (aleaVisuel() - 0.5) * 30, vy: (aleaVisuel() - 0.5) * 30, vie: 0.6, max: 0.6, c: '#fff', s: 5, sorte: 'fumee' });
    }
    if (P.trainee === 1 && aleaVisuel() < 0.8) jaillir(ax, ay, 1, NEONS[P.neon], 60, 0.45, 3);
  }
  function majOrage(sim, dt) {
    if (!sim.c.def.eclairs) { sim.eclair = 0; return; }
    if (sim.eclair > 0) sim.eclair -= dt;
    sim.prochainEclair -= dt;
    if (sim.prochainEclair <= 0) { sim.eclair = 0.28; sim.prochainEclair = 4 + aleaVisuel() * 5; if (sim === course) SONS.tonnerre(); }
  }

  function annonce(texte, classe) {
    const d = document.createElement('div');
    d.className = 'annonce' + (classe ? ' ' + classe : '');
    d.textContent = texte;

  function traiterEvenements(sim, ev, joueur) {
    const e = sim.e, car = e.car, neon = NEONS[P.neon];
    for (const x of ev) {
      if (x.t === 'piece') {
        const pc = e.c.pieces[x.k]; jaillir(pc.x, pc.y, 14, '#ffe14a', 160, 0.5, 4);
        if (joueur) { SONS.piece(); const b = $('hud-pieces'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
      } else if (x.t === 'chute' || x.t === 'plouf') {
        if (x.t === 'plouf') jaillir(car.x, car.y, 26, '#7fd0ff', 220, 0.8, 5); else jaillir(car.x, car.y, 22, '#ffb03a', 260, 0.6, 4);
        if (joueur) { cam.secousse = 1; SONS[x.t](); annonce(tr('annonce.oups'), 'bleu'); }
        sim.trace = [];
      } else if (x.t === 'bord') {
        const nx = -Math.sin(car.a), ny = Math.cos(car.a);
        jaillir(car.x + nx * 12, car.y + ny * 12, 6, '#ffe9a0', 200, 0.3, 2.5);
        if (joueur) SONS.bord();
      } else if (x.t === 'atterrit') {
        jaillir(car.x, car.y, 12, '#c9c2ff', 120, 0.5, 4);
        if (joueur) { cam.secousse = Math.max(cam.secousse, 0.35); SONS.atterrit(); }
      } else if (x.t === 'choc') {
        jaillir(car.x, car.y, 14, '#ff8a3d', 220, 0.4, 3);
        if (joueur) { cam.secousse = Math.max(cam.secousse, 0.5); SONS.choc(); }
      } else if (x.t === 'turbo') {
        jaillir(car.x, car.y, 16, '#ffe14a', 200, 0.5, 4);
        if (joueur) { SONS.turbo(); annonce(tr('annonce.turbo'), 'or'); }
      } else if (x.t === 'depasse') {
        if (joueur) { SONS.depasse(); annonce(tr('annonce.depasse', { n: nb(50) })); }
      } else if (x.t === 'accroche') {
        const p = M.positionPoteau(e, x.j); jaillir(p.x, p.y, 8, neon, 120, 0.35, 3);
        if (joueur) SONS.accroche();
      } else if (x.t === 'lache') { if (joueur) SONS.lache(); }
      else if (x.t === 'saut') { if (joueur) SONS.saut(); }
      else if (x.t === 'flaque') { jaillir(car.x, car.y, 8, '#9fdcff', 90, 0.5, 3); if (joueur) SONS.flaque(); }
      else if (x.t === 'repart') { if (joueur) SONS.repart(); }
      else if (x.t === 'arrivee' && joueur) arrivee();
    }
  }

  // ---------------------------------------------------------------------------
  // Écrans

  const ECRANS = ['ecran-titre', 'ecran-intro', 'ecran-pause', 'ecran-fin', 'ecran-niveaux', 'ecran-garage', 'ecran-bilan'];
  function montrer(id) {
    for (const x of ECRANS) $(x).hidden = x !== id;
    const enCourse = ['course', 'depart', 'arrivee', 'pause'].includes(ecran);
    $('hud').hidden = !enCourse;

  }
  function allerTitre() {
    ecran = 'titre'; course = null; majMoteur(0, false, false);

  function nomCircuit(n) { return tr('circuit.label', { n: nb(n + 1) }) + ' · ' + tr('circuit.' + (n + 1)); }

    const ul = $('intro-objectifs'); ul.innerHTML = '';
    const objectifs = [tr('objectif.arriver', { t: fmtTemps(c.limite) }), tr('objectif.chrono', { t: fmtTemps(c.reference) }),
      c.pieces.length ? tr('objectif.pieces', { n: nb(c.objectifPieces), total: nb(c.pieces.length) }) : tr('objectif.sansChute')];
    const deja = P.etoiles[n];

    });
    if (P.records[n]) { const li = document.createElement('li'); const s = document.createElement('span'); s.className = 'et'; s.textContent = '⏱'; const b = document.createElement('span'); b.textContent = tr('fin.record', { t: fmtTemps(P.records[n]) }); li.append(s, b); ul.appendChild(li); }

  function lancerFeux() {
    audio(); demarrerMoteur();
    ecran = 'depart'; course.feux = 0; course.feuxSon = -1;

    appuiDoigt = false;
  }
  function majHud(force) {
    if (!course) return;
    const e = course.e, c = course.c;
    const txt = fmtTemps(e.chrono);
    if (force || txt !== majHud.dernier) { $('hud-chrono').textContent = txt; majHud.dernier = txt; }
    const reste = c.limite - e.chrono;
    const lim = tr('hud.limite', { t: fmtTemps(Math.max(0, reste)) });
    if (force || lim !== majHud.lim) { $('hud-limite').textContent = lim; majHud.lim = lim; }

  // Conseils animés sur les deux premiers circuits
  function majConseil() {
    const el = $('conseil');

    const e = course.e, car = e.car, pts = course.c.pts, q = pts[car.idx];
    let mode = '';

      if (car.acc) { if ((q.k === 'T' && q.f > 0.8) || q.k !== 'T') mode = 'leve'; }
      else if (q.k === 'T' && q.f < 0.55) mode = 'appui';
      else { for (let i = car.idx + 1; i < Math.min(pts.length, car.idx + 22); i++) if (pts[i].k === 'T') { mode = 'appui'; break; } }
    }
    if (!mode) { el.hidden = true; return; }
    el.hidden = false;
    el.className = mode;
    const txt = tr(mode === 'appui' ? 'conseil.maintiens' : 'conseil.lache');
    if ($('conseil-txt').textContent !== txt) $('conseil-txt').textContent = txt;
  }

  function majCourse(dt) {
    const sim = course;
    if (ecran === 'depart') {
      sim.feux += dt;
      const n = Math.floor(sim.feux / 0.6);
      if (n !== sim.feuxSon) { sim.feuxSon = n; if (n < 3) SONS.feu(); else if (n === 3) SONS.vert(); }
      if (sim.feux >= 1.8) { ecran = 'course'; sim.feux = sim.feux < 2.6 ? sim.feux : -1; }
      majMoteur(sim.c.def.v * 0.4, false, true);
      return;
    }
    if (sim.feux >= 0) { sim.feux += dt; if (sim.feux > 2.6) sim.feux = -1; }
    const avant = sim.e.chutes;
    const ev = M.pas(sim.e, dt, ecran === 'course' ? appuiJoueur() : M.appuiRobot(sim.e));
    sim.tempsVisuel += dt;
    traiterEvenements(sim, ev, true);
    majTrace(sim, dt); majOrage(sim, dt);
    if (ecran === 'course') {
      majMoteur(sim.e.car.v, !!sim.e.car.acc, sim.e.car.chute <= 0);
      majHud(false); majConseil();
      if (!sim.e.fini && sim.e.chrono >= sim.c.limite) defaite();
    } else if (ecran === 'arrivee') {
      sim.finT += dt;
      majMoteur(sim.e.car.v, false, true);
      if (aleaVisuel() < 0.5) { const car = sim.e.car; parts.push({ x: car.x + (aleaVisuel() - 0.5) * 300, y: car.y - 150 - aleaVisuel() * 150, vx: (aleaVisuel() - 0.5) * 80, vy: 60, vie: 1.6, max: 1.6, c: NEONS[Math.floor(aleaVisuel() * 6)], s: 6, sorte: 'confetti', rot: 0 }); }
      if (sim.finT > 1.6) victoire();
    }
    if (avant !== sim.e.chutes) sim.chuteVue = 0.6;
  }

  function arrivee() {
    ecran = 'arrivee'; course.finT = 0;
    SONS.arrivee();
    $('conseil').hidden = true;
    const car = course.e.car;
    jaillir(car.x, car.y, 40, NEONS[P.neon], 300, 1, 5);
    jaillir(car.x, car.y, 30, '#ffe14a', 260, 1, 4);
    majHud(true);
  }

  function boutonsFin(liste) {
    const bx = $('fin-boutons'); bx.innerHTML = '';
    liste.forEach(([cle, action, gros], i) => {
      const b = document.createElement('button');
      b.className = gros ? 'gros' : 'moyen'; b.textContent = tr(cle);
      b.addEventListener('click', () => { SONS.clic(); action(); });
