  }
  function ligne(parent, texte, classe) { const p = document.createElement('p'); p.textContent = texte; if (classe) p.className = classe; parent.appendChild(p); }

  function victoire() {
    const sim = course, e = sim.e, c = sim.c, n = sim.n;
    ecran = 'fin'; majMoteur(0, false, false);
    const avecPieces = c.pieces.length > 0;
    const parfait = e.chutes === 0 && e.bords === 0;
    const etoiles = 1 + (e.chrono <= c.reference ? 1 : 0) + ((avecPieces ? e.nbPieces >= c.objectifPieces : e.chutes === 0) ? 1 : 0);
    const bonusTemps = Math.max(0, Math.round((c.reference - e.chrono) * 20));
    const score = e.nbPieces * 10 + e.depasses * 50 + bonusTemps + (parfait ? 200 : 0) + etoiles * 100;
    const avant = totalEtoiles();
    const ancienRecord = P.records[n];
    const record = !ancienRecord || e.chrono < ancienRecord;
    P.etoiles[n] = Math.max(P.etoiles[n], etoiles);
    if (record) P.records[n] = Math.round(e.chrono * 10) / 10;
    P.pieces[n] = Math.max(P.pieces[n], e.nbPieces);
    P.scores[n] = Math.max(P.scores[n], score);
    if (parfait) P.parfaits[n] = 1;
    P.ouvert = Math.max(P.ouvert, Math.min(NIVEAUX.length, n + 2));
    const apres = totalEtoiles();
    sauverProgression(Math.min(NIVEAUX.length, n + 2));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
    if (P.etoiles.every((x) => x > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
    // écran
    montrer('ecran-fin');
    $('fin-titre').textContent = tr('fin.victoire');
    const spans = $('fin-etoiles').querySelectorAll('span');
    spans.forEach((s) => s.classList.remove('on'));
    $('fin-etoiles').hidden = false;
    for (let i = 0; i < etoiles; i++) setTimeout(() => { spans[i].classList.add('on'); SONS.etoile(i); }, 350 + i * 380);
    const lignes = $('fin-lignes'); lignes.innerHTML = '';
    ligne(lignes, tr('fin.chrono', { t: fmtTemps(e.chrono) }));
    if (record) { ligne(lignes, tr('fin.nouveauRecord'), 'record'); setTimeout(SONS.record, 350 + etoiles * 380); }
    else ligne(lignes, tr('fin.record', { t: fmtTemps(ancienRecord) }));
    if (avecPieces) ligne(lignes, tr('fin.pieces', { n: nb(e.nbPieces), total: nb(c.pieces.length) }));
    if (c.rivaux.length) ligne(lignes, tr('fin.depasses', { n: e.depasses }));
    ligne(lignes, parfait ? tr('fin.parfait') : tr('fin.chutes', { n: e.chutes }), parfait ? 'record' : '');
    // score qui défile
    const sc = $('fin-score'); let v = 0; const pasScore = Math.max(1, Math.round(score / 30));
    sc.textContent = tr('fin.score', { n: nb(0) });
    const tic = setInterval(() => { v = Math.min(score, v + pasScore); sc.textContent = tr('fin.score', { n: nb(v) }); if (v >= score) clearInterval(tic); }, 30);
    // objets débloqués
    const neufs = [];
    for (const type of ['voiture', 'neon', 'trainee']) SEUILS[type].forEach((s, i) => { if (s > avant && s <= apres) neufs.push(tr(type + '.' + i)); });
    const db = $('fin-debloque');
    db.hidden = !neufs.length;
    if (neufs.length) db.textContent = tr('fin.debloque', { nom: neufs.join(', ') });
    const dernier = n === NIVEAUX.length - 1;
    const suite = dernier ? ['bouton.bilan', () => montrerBilan(), true] : ['bouton.suivant', () => preparerCourse(n + 1, true), true];
    boutonsFin([suite, ['bouton.rejouer', () => preparerCourse(n, false)], ['bouton.niveaux', () => montrerNiveaux()]]);
  }

        c2.save(); c2.scale(0.9, 0.9); dessinerTrainee(c2, trace, i, neon, 1); c2.restore();
        dessinerVoiture(c2, 112, 46, -0.15, mod, CORPS[mod], neon, 0.95, {});

  function dessinerGarageApercu(dt) {
    const cv = $('garage-apercu'), c2 = cv.getContext('2d');
    const w = cv.width, h = cv.height, tps = performance.now() / 1000;
    c2.setTransform(1, 0, 0, 1, 0, 0);
    const gr = c2.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#2a1f6e'); gr.addColorStop(1, '#120f3a');
    c2.fillStyle = gr; c2.fillRect(0, 0, w, h);
    // petite piste ronde autour d'un poteau
    const cx = w / 2, cy = h / 2, R = 86;
    c2.strokeStyle = NEONS[P.neon]; c2.lineWidth = 62; c2.beginPath(); c2.ellipse(cx, cy, R * 1.6, R, 0, 0, 2 * PI); c2.stroke();
    c2.strokeStyle = '#231e52'; c2.lineWidth = 54; c2.stroke();
    dessinerPoteau(c2, cx, cy, 1, '#ff4fd8', tps, false, true);
    if (!dessinerGarageApercu.trace) dessinerGarageApercu.trace = [];
    const tr0 = dessinerGarageApercu.trace;
    const a = tps * 1.4, x = cx + Math.cos(a) * R * 1.6, y = cy + Math.sin(a) * R;
    const dir = Math.atan2(Math.cos(a) * R, -Math.sin(a) * R * 1.6);
    tr0.push({ x: x - Math.cos(dir) * 20, y: y - Math.sin(dir) * 20, a: dir }); while (tr0.length > 30) tr0.shift();
    dessinerTrainee(c2, tr0, P.trainee, NEONS[P.neon], tps);
    c2.lineCap = 'round'; c2.strokeStyle = 'rgba(255,255,255,.85)'; c2.lineWidth = 3; c2.beginPath(); c2.moveTo(x, y); c2.lineTo(cx, cy); c2.stroke(); c2.lineCap = 'butt';
    dessinerVoiture(c2, x, y, dir + 0.4, P.voiture, CORPS[P.voiture], NEONS[P.neon], 1.3, { phares: true });
  }

  // ---------------------------------------------------------------------------
  // Démonstration animée d'une nouveauté (carte d'avant-course)
  // ---------------------------------------------------------------------------
  let demo = null;
  function preparerDemo(sorte) {
    const S = (L, o) => Object.assign({ t: 'S', L }, o || {});
    const T = (deg, R, o) => Object.assign({ t: 'T', ang: deg * PI / 180, R }, o || {});
    let liste, hw = 34, extra = {};
    switch (sorte) {
      case 'cotes': liste = [S(90), T(-90, 80), S(70), T(90, 80), S(130)]; break;
      case 'pieces': liste = [S(150, { pieces: 1 }), T(90, 90), S(160, { pieces: 1 })]; break;
      case 'epingle': liste = [S(150), T(180, 62), S(150)]; break;
      case 'rampe': case 'sauts': liste = [S(110), { t: 'J', L: 60 + (sorte === 'sauts' ? 160 : 110) + 120, trou: sorte === 'sauts' ? 160 : 110 }]; break;
      case 'chicane': liste = [S(100), T(55, 90), S(30), T(-55, 90), S(150)]; break;
      case 'flaque': liste = [S(140), T(90, 90, { flaque: true }), S(170)]; break;
      case 'etroit': liste = [S(140), T(90, 90), S(170)]; hw = 24; break;
      case 'rivaux': liste = [S(560)]; extra.rival = true; break;
      case 'turbo': liste = [S(220, { turbo: true }), T(90, 90), S(150)]; break;
      case 'bouge': liste = [S(140), T(90, 95, { bouge: { A: 22, w: 2.2, ph: 0 } }), S(170)]; break;
      case 'lacets': liste = [S(60), T(-180, 55), S(50), T(180, 55), S(110)]; break;
      case 'finale': liste = [S(100), T(55, 90), S(30), T(-55, 90), S(150)]; extra.rival = true; extra.pluie = true; break;
      default: liste = [S(160), T(90, 90), S(190)];
    }
    if (sorte === 'pluie' || sorte === 'orage') extra.pluie = true;
    if (sorte === 'orage') extra.orage = true;
    liste.forEach((m, i) => { m.rang = i; });
    const pts = [], pot = [];
    M.poser(liste, 0, 0, sorte === 'lacets' ? PI / 2 : 0, pts, pot, hw, 0);
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const q of pts.concat(pot)) { minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x); minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y); }
    const pieces = [];
    for (const m of liste) if (m.pieces) for (let k = 1; k <= 3; k++) { const q = pts[m.debut + Math.round(k / 4 * m.L / PAS)]; pieces.push({ x: q.x, y: q.y, i: m.debut + Math.round(k / 4 * m.L / PAS) }); }
    const path = new Path2D(); let ouvert = false;
    for (const q of pts) { if (q.vide) { ouvert = false; continue; } if (ouvert) path.lineTo(q.x, q.y); else { path.moveTo(q.x, q.y); ouvert = true; } }
    demo = { sorte, liste, pts, pot, hw, path, pieces, extra, u: 0, temps: 0, bornes: { minX: minX - hw - 30, maxX: maxX + hw + 30, minY: minY - hw - 30, maxY: maxY + hw + 30 }, trace: [] };
  }
  function dessinerDemo(dt) {
    if (!demo || $('intro-nouveau').hidden) return;
    const cv = $('demo'), c2 = cv.getContext('2d'), w = cv.width, h = cv.height;
    const d = demo, b = d.bornes;
    d.temps += dt;
    const vit = 46; // points par seconde
    d.u += dt * vit * (d.sorte === 'turbo' && d.pts[Math.floor(d.u)] && d.u > 50 && d.u < 120 ? 1.6 : 1);
    const n = d.pts.length;
    if (d.u > n + 25) { d.u = 0; d.trace = []; }
    const k = Math.min(w / (b.maxX - b.minX), h / (b.maxY - b.minY));
    const ox = w / 2 - (b.minX + b.maxX) / 2 * k, oy = h / 2 - (b.minY + b.maxY) / 2 * k;
    c2.setTransform(1, 0, 0, 1, 0, 0);
    c2.fillStyle = '#1a1650'; c2.fillRect(0, 0, w, h);
    c2.setTransform(k, 0, 0, k, ox, oy);
    c2.lineJoin = 'round';
    c2.strokeStyle = '#2fe6ff'; c2.lineWidth = d.hw * 2 + 8; c2.stroke(d.path);
    c2.strokeStyle = '#fff'; c2.lineWidth = d.hw * 2 + 2; c2.stroke(d.path);
    c2.strokeStyle = '#231e52'; c2.lineWidth = d.hw * 2 - 3; c2.stroke(d.path);
    // éléments
    for (const q of d.pts) if (q.turbo) { c2.strokeStyle = 'rgba(255,225,74,.8)'; c2.lineWidth = 4; c2.beginPath(); c2.moveTo(q.x - 6, q.y - d.hw * 0.5); c2.lineTo(q.x + 4, q.y); c2.lineTo(q.x - 6, q.y + d.hw * 0.5); c2.stroke(); }
    for (let i = 0; i < d.pts.length; i += 6) { const q = d.pts[i]; if (q.flaque) { c2.fillStyle = 'rgba(80,170,255,.4)'; c2.beginPath(); c2.ellipse(q.x, q.y, d.hw * 0.8, d.hw * 0.45, q.a, 0, 2 * PI); c2.fill(); } }
    const rampe = d.liste.find((m) => m.t === 'J');
    if (rampe) { const q = d.pts[rampe.debut + 6]; c2.save(); c2.translate(q.x, q.y); c2.rotate(q.a); c2.fillStyle = '#ffd23f'; c2.fillRect(-30, -d.hw, 60, d.hw * 2); c2.fillStyle = '#1a1430'; for (let s = -d.hw; s < d.hw; s += 14) c2.fillRect(-30, s, 60, 6); c2.restore(); }
    const iu = Math.min(n - 1, Math.floor(d.u));
    const q = d.pts[iu];
    for (const pc of d.pieces) if (pc.i > iu || d.u > n) dessinerPiece(c2, pc.x, pc.y, 1.2, d.temps, pc.i);
    // poteaux
    const tenu = q.k === 'T' && d.u < n;
    d.pot.forEach((o) => {
      let px = o.x, py = o.y;
      if (o.bouge) { const dd = o.bouge.A * Math.sin(d.temps * o.bouge.w); px += o.ux * dd; py += o.uy * dd; }
      o.px = px; o.py = py;
      const proche = Math.hypot(px - q.x, py - q.y) < o.R * 2 + 60;
      dessinerPoteau(c2, px, py, 0.9, '#ff4fd8', d.temps, proche && !tenu, tenu && Math.hypot(px - q.x, py - q.y) < o.R * 1.4);
    });
    // voiture de démonstration
    let x = q.x, y = q.y, a = q.a, ka = 1;
    if (q.flaque) { const o = d.pot[0]; const dx = x - o.x, dy = y - o.y, l = Math.hypot(dx, dy); x += dx / l * q.f * 30; y += dy / l * q.f * 30; }

    if (d.extra.rival) {

      dessinerTrainee(c2, d.trace, P.trainee, NEONS[P.neon], d.temps);
      if (tenu) {
        let best = d.pot[0], bd = Infinity; for (const o of d.pot) { const dd = Math.hypot(o.px - x, o.py - y); if (dd < bd) { bd = dd; best = o; } }
        c2.lineCap = 'round'; c2.strokeStyle = '#ffffff'; c2.lineWidth = 3; c2.beginPath(); c2.moveTo(x, y); c2.lineTo(best.px, best.py); c2.stroke(); c2.lineCap = 'butt';
      }
      dessinerVoiture(c2, x, y, a + (tenu ? Math.sign(d.liste[q.p].ang || 0) * 0.4 : 0), P.voiture, CORPS[P.voiture], NEONS[P.neon], 0.9 * ka, { phares: true });
    }
    // pluie et éclairs
    c2.setTransform(1, 0, 0, 1, 0, 0);
    if (d.extra.pluie) {
      const flash = d.extra.orage && (d.temps % 3.2) < 0.2;
      if (!flash) {
        const sx = x * k + ox, sy = y * k + oy;
        const gr = c2.createRadialGradient(sx, sy, 50, sx, sy, 150);
        gr.addColorStop(0, 'rgba(6,6,22,0)'); gr.addColorStop(1, 'rgba(6,6,22,.82)');
        c2.fillStyle = gr; c2.fillRect(0, 0, w, h);
        for (const o of d.pot) { const px = o.x * k + ox, py = o.y * k + oy; c2.fillStyle = 'rgba(255,79,216,.8)'; c2.beginPath(); c2.arc(px, py, 7, 0, 2 * PI); c2.fill(); }
      } else { c2.fillStyle = 'rgba(230,235,255,.5)'; c2.fillRect(0, 0, w, h); }
      c2.strokeStyle = 'rgba(180,200,255,.4)'; c2.lineWidth = 1.2; c2.beginPath();
      for (let i = 0; i < 60; i++) { const rx = (i * 83 + d.temps * 90) % w, ry = (i * 47 + d.temps * 500) % h; c2.moveTo(rx, ry); c2.lineTo(rx - 4, ry + 12); }
      c2.stroke();
    }
    // main qui appuie (en bas à droite)
    const appuie = tenu || (d.sorte === 'rampe' && false);
    c2.save(); c2.translate(w - 60, h - 58 + (appuie ? 8 : 0)); c2.scale(appuie ? 0.92 : 1, appuie ? 0.92 : 1);
    if (appuie) { c2.fillStyle = 'rgba(255,225,74,.45)'; c2.beginPath(); c2.arc(-2, -30, 22, 0, 2 * PI); c2.fill(); }
    c2.fillStyle = '#fff'; c2.strokeStyle = '#2a1d5e'; c2.lineWidth = 2.5;
    c2.beginPath(); c2.moveTo(-8, -32); c2.quadraticCurveTo(-8, -40, 0, -40); c2.quadraticCurveTo(8, -40, 8, -32); c2.lineTo(8, -8); c2.lineTo(20, -6); c2.quadraticCurveTo(28, -4, 26, 8); c2.lineTo(22, 30); c2.lineTo(-14, 30); c2.lineTo(-22, 2); c2.quadraticCurveTo(-24, -6, -14, -6); c2.lineTo(-8, -2); c2.closePath(); c2.fill(); c2.stroke();

    else etape = tenu ? tr('conseil.maintiens') : tr('conseil.lache');
    if ($('demo-etape').textContent !== etape) $('demo-etape').textContent = etape;
  }

  // ---------------------------------------------------------------------------

  function dessinerAffiche() {

  function peindreAffiche(tps) {
    g.setTransform(DPR, 0, 0, DPR, 0, 0);

    route.lineTo(Px + Math.cos(1.05) * Rr, Py + Math.sin(1.05) * Rr);
    route.arc(Px, Py, Rr, 1.05, 3.95);
    route.lineTo(Px + Math.cos(3.95) * Rr - 300 * Math.sin(3.95) * -1, Py + Math.sin(3.95) * Rr - 300 * Math.cos(3.95));
    g.lineJoin = 'round'; g.lineCap = 'butt';
    g.save(); g.translate(18, 26); g.strokeStyle = 'rgba(0,0,10,.4)'; g.lineWidth = hw * 2 + 14; g.stroke(route); g.restore();
    g.strokeStyle = 'rgba(47,230,255,.3)'; g.lineWidth = hw * 2 + 40; g.stroke(route);
    g.strokeStyle = '#2fe6ff'; g.lineWidth = hw * 2 + 12; g.stroke(route);
    g.strokeStyle = '#ffffff'; g.lineWidth = hw * 2 + 3; g.stroke(route);
    const asphalte = g.createLinearGradient(0, 0, 600, 800); asphalte.addColorStop(0, '#3a2c7a'); asphalte.addColorStop(1, '#2a2064');
    g.strokeStyle = asphalte; g.lineWidth = hw * 2 - 4; g.stroke(route);
    g.setLineDash([22, 26]); g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 4; g.stroke(route); g.setLineDash([]);

    for (let i = 0; i < 40; i++) { const a = 1.25 + i * 0.022; trace.push({ x: Px + Math.cos(a) * (Rr + 6), y: Py + Math.sin(a) * (Rr + 6), a: a + PI / 2 }); }
    g.save(); g.lineCap = 'round';
    for (let i = 1; i < trace.length; i++) {
      const u = i / trace.length;
      g.strokeStyle = 'rgba(255,79,216,' + (u * 0.7) + ')'; g.lineWidth = 40 * u + 4; g.beginPath(); g.moveTo(trace[i - 1].x, trace[i - 1].y); g.lineTo(trace[i].x, trace[i].y); g.stroke();
      g.strokeStyle = 'rgba(255,255,255,' + (u * 0.8) + ')'; g.lineWidth = 8 * u + 1; g.stroke();
    }
    g.restore();
    // la voiture, en grand, qui dérape
    const ac = 2.25, Cx = Px + Math.cos(ac) * Rr, Cy = Py + Math.sin(ac) * Rr;
    const cap = ac + PI / 2;      // sens de la course : autour du poteau
    // fumée des pneus
    for (let i = 0; i < 14; i++) {
      const a = ac - 0.12 - i * 0.03, rr0 = Rr + 30 + (i % 3) * 12;
      g.fillStyle = 'rgba(220,210,255,' + (0.28 - i * 0.016) + ')';
      g.beginPath(); g.arc(Px + Math.cos(a) * rr0, Py + Math.sin(a) * rr0, 20 + i * 3, 0, 2 * PI); g.fill();

    g.strokeStyle = 'rgba(255,255,255,.95)'; g.lineWidth = 9; g.stroke();
    g.lineCap = 'butt';

    // étincelles sous la voiture
    for (let i = 0; i < 26; i++) {
      const a = cap + PI + (hash2(i, 3) - 0.5) * 1.1, d = 120 + hash2(i, 9) * 110;
      g.fillStyle = i % 2 ? '#ffe9a0' : '#2fe6ff';
      g.beginPath(); g.arc(Cx + Math.cos(a) * d, Cy + Math.sin(a) * d, 3 + hash2(i, 5) * 4, 0, 2 * PI); g.fill();
    }
    lg = g.createRadialGradient(Cx, Cy, 20, Cx, Cy, 260);
    lg.addColorStop(0, 'rgba(47,230,255,.45)'); lg.addColorStop(1, 'rgba(47,230,255,0)');
    g.fillStyle = lg; g.beginPath(); g.arc(Cx, Cy, 260, 0, 2 * PI); g.fill();
    dessinerVoiture(g, Cx, Cy, cap + 0.5, 4, '#2a2f86', '#2fe6ff', 6.2, { phares: true });
    // contour lumineux et reflet sur le capot
    g.save(); g.translate(Cx, Cy); g.rotate(cap + 0.5); g.scale(6.2, 6.2);
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 0.7;
    g.beginPath(); g.moveTo(16, -12); g.lineTo(-22, -12); g.stroke();
    g.restore();
    // premier plan : grosse pièce coupée par le bord, gouttes de lumière
    dessinerPiece(g, 40, 640, 3.4, tps, 9);
    for (let i = 0; i < 30; i++) {
      g.fillStyle = 'rgba(255,255,255,' + (0.25 + hash2(i, 1) * 0.5) + ')';
      g.beginPath(); g.arc(hash2(i, 2) * 600, hash2(i, 4) * 600, 1 + hash2(i, 6) * 2.5, 0, 2 * PI); g.fill();
    }
  }

  // ---------------------------------------------------------------------------
  // Images du jeu (window.JEL_APERCU = 1, 2 ou 3, posé par le robot du site) :
  // le jeu s'ouvre en pleine course, avec son interface, puis se fige.
  // ---------------------------------------------------------------------------
  function ouvrirApercu(k, nForce) {
    apercu = k;
    const n = nForce !== undefined ? nForce : (k === 1 ? 0 : (k === 2 ? 6 : 14));
    for (const x of ECRANS) $(x).hidden = true;
    course = creerSim(n);
    const c = course.c, e = course.e;
    // un virage choisi pour l'image : flaque et pièces (2), poteau mobile (3)
    const virages = c.morceaux.filter((m) => m.t === 'T');
    const milieu = (liste, f) => liste.slice().sort((a, b) => Math.abs(a.debut - c.finIdx * f) - Math.abs(b.debut - c.finIdx * f))[0];
    let m = virages[1];
    if (k === 2) m = milieu(virages.filter((x) => x.flaque && x.pieces).concat(virages.filter((x) => x.flaque)), 0.45) || m;
    if (k === 3) m = milieu(virages.filter((x) => x.bouge), 0.55) || m;
    // la voiture part un peu avant et roule toute seule jusqu'au milieu du virage
    const depart = Math.max(8, m.debut - 70);
    const q = c.pts[depart];
    Object.assign(e.car, { x: q.x, y: q.y, a: q.a, idx: depart, v: c.def.v });
    e.chrono = c.tempsParfait * depart / c.finIdx * 1.05;
    for (let i = 0; i < c.pieces.length; i++) if (c.pieces[i].i < depart) { e.prises[i] = true; e.nbPieces++; }
    if (k === 3 && e.rivaux.length) { e.rivaux[0].s = m.debut + 40; e.rivaux[0].f = 0.3; }
    $('hud-nom').textContent = nomCourt(n);
    $('hud-pieces').hidden = c.pieces.length === 0;
    ecran = 'course';
    montrer(null);
    const fin = m.debut + Math.round(Math.abs(m.ang) * m.R / PAS * (k === 1 ? 0.35 : 0.45));
    let garde = 0;
    while (e.car.idx < fin && garde < 600) {
      const ev = M.pas(e, 1 / 60, M.appuiRobot(e));
      course.tempsVisuel += 1 / 60;
      traiterEvenements(course, ev, false);
      majTrace(course, 1 / 60); garde++;
    }
    course.eclair = 0;
    majHud(true);
    const car = e.car;
    cam.x = car.x + Math.cos(car.a) * 150; cam.y = car.y + Math.sin(car.a) * 150;
    figer = true;
  }

  // ---------------------------------------------------------------------------
  // Démarrage
  // ---------------------------------------------------------------------------
  function demarrer() {
    redimensionner();
    chargerProgression();
    appliquerSon();
    if (window.JEL_AFFICHE) { dessinerAffiche(); return; }
    if (window.JEL_APERCU) { ouvrirApercu(Number(window.JEL_APERCU) || 1); requestAnimationFrame(boucle); return; }
    allerTitre();
    requestAnimationFrame(boucle);
  }
  demarrer();
})();
</script>
