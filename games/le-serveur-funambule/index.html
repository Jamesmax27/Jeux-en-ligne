function dessinerDecorMur(c, s, camX, repas, temps) {
  const R = REPAS[repas];
  const sol = SOL;
  const fond = sol - 10 * s;
  // mur
  const g = c.createLinearGradient(0, 0, 0, fond);
  g.addColorStop(0, R.mur2); g.addColorStop(1, R.mur);
  c.fillStyle = g; c.fillRect(0, 0, W, fond);
  const par = camX * 0.7;
  const pas = 46;
  const debut = Math.floor((par - 30) / pas) - 1, finI = Math.ceil((par + W / s) / pas) + 1;
  for (let i = debut; i <= finI; i++) {
    const x = (i * pas - par) * s;
    c.save(); c.translate(x, fond); c.scale(s, s);
    if (R.id === 'chateau') {
      // pierres
      c.fillStyle = 'rgba(0,0,0,.08)';
      for (let r = 0; r < 12; r++) for (let k = 0; k < 4; k++) { rrect(c, k * 11.5 + (r % 2) * 5.7 - 2, -8 - r * 7, 10.8, 6.4, 1); c.fill(); }
      if (i % 2 === 0) {
        // bannière
        const coul = ['#c0392b', '#3d5bb5', '#2e8b57'][((i % 3) + 3) % 3];
        c.fillStyle = coul; c.beginPath(); c.moveTo(14, -78); c.lineTo(32, -78); c.lineTo(32, -46); c.lineTo(23, -51); c.lineTo(14, -46); c.closePath(); c.fill();
        c.fillStyle = '#f3c443'; c.beginPath(); c.moveTo(23, -70); c.lineTo(27, -63); c.lineTo(23, -56); c.lineTo(19, -63); c.closePath(); c.fill();
        c.fillStyle = '#5d554b'; c.fillRect(12, -79, 22, 1.4);
      } else {
        // torche
        c.fillStyle = '#5d3a1e'; c.fillRect(22, -52, 2, 10);
        const fl = Math.sin(temps * 12 + i) * 0.6;
        const gl = c.createRadialGradient(23, -55, 0, 23, -55, 14); gl.addColorStop(0, 'rgba(255,200,90,.5)'); gl.addColorStop(1, 'rgba(255,200,90,0)');
        c.fillStyle = gl; c.fillRect(9, -69, 28, 28);
        ellipse(c, 23, -55 + fl * 0.3, 2 + fl * 0.2, 3.4, '#ff9f43'); ellipse(c, 23, -54.5, 1, 1.8, '#ffe08a');
      }
    } else {
      // fenêtre ou tableau
      if (i % 2 === 0) {
        c.fillStyle = R.plinthe; rrect(c, 8, -74, 30, 40, 2); c.fill();
        const gc = c.createLinearGradient(0, -72, 0, -36); gc.addColorStop(0, R.ciel); gc.addColorStop(1, '#ffffff');
        c.fillStyle = gc; c.fillRect(10, -72, 26, 36);
        if (R.id === 'automne') { cercle(c, 18, -58, 4, '#e2702b'); cercle(c, 27, -52, 4.5, '#c94f1d'); c.fillStyle = '#6b3a1e'; c.fillRect(17.5, -55, 1, 19); c.fillRect(26.5, -48, 1, 12); }
        else { cercle(c, 28, -64, 3.5, '#ffe27a'); ellipse(c, 16, -48, 6, 2.5, '#ffffff'); c.fillStyle = '#7cc56a'; c.fillRect(10, -40, 26, 4); }
        c.fillStyle = R.plinthe; c.fillRect(22.3, -72, 1.4, 36); c.fillRect(10, -55, 26, 1.4);
        // rideaux
        c.fillStyle = R.bord; c.globalAlpha = 0.85;
        c.beginPath(); c.moveTo(6, -76); c.lineTo(13, -76); c.quadraticCurveTo(10, -55, 12, -34); c.lineTo(6, -34); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(40, -76); c.lineTo(33, -76); c.quadraticCurveTo(36, -55, 34, -34); c.lineTo(40, -34); c.closePath(); c.fill();
        c.globalAlpha = 1;
      } else {
        c.fillStyle = '#c99a4a'; rrect(c, 10, -66, 24, 18, 1.5); c.fill();
        c.fillStyle = R.id === 'mariage' ? '#fde2ea' : '#cfe8f7'; c.fillRect(12, -64, 20, 14);
        if (R.id === 'mariage') { c.fillStyle = '#f08bb0'; c.beginPath(); c.moveTo(22, -53); c.bezierCurveTo(14, -59, 18, -64, 22, -60); c.bezierCurveTo(26, -64, 30, -59, 22, -53); c.fill(); }
        else { c.fillStyle = '#6fb35a'; c.beginPath(); c.moveTo(12, -50); c.lineTo(19, -58); c.lineTo(24, -53); c.lineTo(28, -57); c.lineTo(32, -50); c.closePath(); c.fill(); cercle(c, 27, -61, 1.6, '#ffd36b'); }
        // plante
        c.fillStyle = '#b8603a'; rrect(c, 17, -8, 10, 8, 1.4); c.fill();
        for (let k = 0; k < 5; k++) ellipse(c, 18 + k * 2, -12 - (k % 2) * 3, 1.8, 4, R.id === 'automne' ? '#c96a2b' : '#5cb848');
      }
      // guirlande
      if (R.id === 'mariage' || R.id === 'automne') {
        c.strokeStyle = R.id === 'mariage' ? '#f3b6c9' : '#a8522a'; c.lineWidth = 0.4;
        c.beginPath(); c.moveTo(0, -84); c.quadraticCurveTo(23, -76, 46, -84); c.stroke();
        for (let k = 1; k < 6; k++) {
          const px = k * 7.7, py = -84 + Math.sin(k / 6 * Math.PI) * 6;
          if (R.id === 'mariage') cercle(c, px, py + 1, 1.3, k % 2 ? '#ffffff' : '#f08bb0');
          else { c.fillStyle = ['#e2702b', '#c94f1d', '#f3b532'][k % 3]; c.beginPath(); c.moveTo(px, py); c.lineTo(px - 1.3, py + 2.4); c.lineTo(px + 1.3, py + 2.4); c.closePath(); c.fill(); }
        }
      }
      if (R.id === 'automne' && i % 3 === 1) { ellipse(c, 6, -2.4, 3.2, 2.4, '#ef8a2b'); c.fillStyle = '#4e7d2b'; c.fillRect(5.6, -5.6, 0.8, 1.4); }
    }
    c.restore();
  }
  // plinthe
  c.fillStyle = R.plinthe; c.fillRect(0, fond - 2 * s, W, 2 * s);
  // parquet
  const gs = c.createLinearGradient(0, fond, 0, H);
  gs.addColorStop(0, R.sol2); gs.addColorStop(1, R.sol);
  c.fillStyle = gs; c.fillRect(0, fond, W, H - fond);
  c.strokeStyle = 'rgba(0,0,0,.1)'; c.lineWidth = Math.max(1, s * 0.2);
  for (let r = 1; r < 6; r++) { const y = fond + (H - fond) * r / 6; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  const decal = camX % 24;
  for (let i = -1; i < W / (24 * s) + 2; i++) {
    for (let r = 0; r < 6; r++) {
      const x = (i * 24 - decal + (r % 2) * 12) * s;
      const y0 = fond + (H - fond) * r / 6, y1 = fond + (H - fond) * (r + 1) / 6;
      c.beginPath(); c.moveTo(x, y0); c.lineTo(x, y1); c.stroke();
    }
  }
  // tapis rouge sous le passage
  c.fillStyle = repas === 3 ? 'rgba(160,30,40,.45)' : 'rgba(255,255,255,.08)';
  c.fillRect(0, sol - 2 * s, W, 5 * s);
}

function dessinerScene(c, opts) {
  opts = opts || {};
  const temps = G.t;
  const repas = G.P.repas;
  // zoom : la pile reste dans l'écran
  const pile = positionsPile(G.items, G.th, -G.uVu * 0.15, mainServeur());
  const haut = 32 + elevation(G.wx) + pile.hTot + 8;
  const dispo = (SOL - (opts.margeHaut != null ? opts.margeHaut : 96)) / U;
  const zCible = clamp(dispo / haut, 0.42, 1);
  G.zoom = opts.direct ? zCible : lerp(G.zoom, zCible, 0.05);
  const s = U * G.zoom;
  const camCible = G.wx - (W * (opts.place || 0.32)) / s;
  G.cam = camCible;
  const camX = G.cam;
  c.save();
  if (G.secousse > 0) c.translate((Math.random() - 0.5) * G.secousse * 14, (Math.random() - 0.5) * G.secousse * 10);
  dessinerDecorMur(c, s, camX, repas, temps);
  const X = (x) => (x - camX) * s;
  const visible = (x, marge) => X(x) > -marge * s && X(x) < W + marge * s;
  const monde = (x, y, f) => { c.save(); c.translate(X(x), SOL + y * s); c.scale(s, s); f(); c.restore(); };

  // fenêtres des courants d'air (rideau qui se gonfle)
  for (const w of G.L.vents) {
    if (!visible(w.x, 40)) continue;
    monde(w.x, -10, () => {
      c.fillStyle = REPAS[repas].plinthe; rrect(c, -14, -72, 28, 44, 2); c.fill();
      c.fillStyle = REPAS[repas].ciel; c.fillRect(-12, -70, 24, 40);
      c.fillStyle = '#ffffff'; ellipse(c, -4, -60, 5, 2, '#ffffff'); ellipse(c, 5, -50, 4, 1.6, '#ffffff');
      const b = w.souffle * w.dir * (6 + Math.sin(temps * 9) * 1.5);
      c.fillStyle = REPAS[repas].bord;
      c.beginPath(); c.moveTo(-14, -74); c.lineTo(-6, -74); c.quadraticCurveTo(-6 + b, -50, -8 + b * 1.3, -28); c.lineTo(-14 + b * 0.4, -28); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(14, -74); c.lineTo(6, -74); c.quadraticCurveTo(6 + b, -50, 8 + b * 1.3, -28); c.lineTo(14 + b * 0.4, -28); c.closePath(); c.fill();
      if (w.souffle > 0.3) {
        c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 0.6; c.lineCap = 'round';
        for (let k = 0; k < 3; k++) { const yy = -58 + k * 9, dx = ((temps * 30 + k * 13) % 30) * w.dir; c.beginPath(); c.moveTo(dx, yy); c.quadraticCurveTo(dx + w.dir * 5, yy - 2, dx + w.dir * 10, yy); c.stroke(); }
      }
    });
  }
  // buffets et tables
  for (const st of G.stations) {
    if (!visible(st.x, 40)) continue;
    if (st.type === 'buffet') monde(st.x, -8, () => dessinerBuffet(c, st, temps, repas));
  }
  for (const st of G.stations) {
    if (st.type !== 'table' || !visible(st.x, 40)) continue;
    monde(st.x, -4, () => { c.translate(-st.x, 0); dessinerTable(c, st, temps, repas); });
  }
  // chats qui attendent sur leur tabouret
  for (const ch of G.L.chats) {
    if (!visible(ch.x, 30)) continue;
    monde(ch.x + 4, -4, () => {
      c.fillStyle = '#7a4a2a'; c.fillRect(-3, -8, 6, 1.4); c.fillRect(-2.6, -7, 1, 7); c.fillRect(1.6, -7, 1, 7);
      if (ch.etat === 'attend') { c.translate(0, -8); const prep = G.wx > ch.x - 22 ? Math.sin(temps * 20) * 0.3 : 0; c.translate(prep, 0); dessinerChat(c, ch.couleur, temps, true, false); }
      else if (ch.etat === 'parti' && ch.t < 6) { c.translate(-10 - ch.t * 6, 2); dessinerChat(c, ch.couleur, temps, false, false); }
    });
  }
  // taches de purée et de soupe
  for (const tc of G.taches) {
    if (!visible(tc.x, 10)) continue;
    c.fillStyle = tc.c; c.globalAlpha = 0.85;
    c.beginPath(); c.ellipse(X(tc.x), SOL + 0.6 * s, tc.r * s, tc.r * 0.35 * s, 0, 0, TAU); c.fill();
    c.globalAlpha = 1;
  }
  // parquet ciré
  for (const z of G.L.cire) {
    if (X(z.x1) < -10 || X(z.x0) > W + 10) continue;
    const x0 = X(z.x0), x1 = X(z.x1);
    const gz = c.createLinearGradient(x0, 0, x1, 0);
    gz.addColorStop(0, 'rgba(200,240,255,0)'); gz.addColorStop(0.15, 'rgba(200,240,255,.55)'); gz.addColorStop(0.85, 'rgba(200,240,255,.55)'); gz.addColorStop(1, 'rgba(200,240,255,0)');
    c.fillStyle = gz; c.fillRect(x0, SOL - 2.5 * s, x1 - x0, 6 * s);
    for (let k = 0; k < (z.x1 - z.x0) / 6; k++) {
      const sx = X(z.x0 + k * 6 + 3), sy = SOL + ((k * 37) % 5 - 1.5) * s;
      const a = 0.5 + 0.5 * Math.sin(temps * 6 + k);
      c.fillStyle = `rgba(255,255,255,${a})`;
      c.save(); c.translate(sx, sy); c.scale(s, s); etoile(c, 0, 0, 0.9); c.restore();
    }
  }
  // estrade
  for (const m of G.L.marches) {
    if (X(m.x1) < -10 || X(m.x0) > W + 10) continue;
    c.fillStyle = '#8a5530'; c.strokeStyle = '#5e3518'; c.lineWidth = Math.max(1, s * 0.3);
    c.beginPath(); c.moveTo(X(m.x0), SOL + 3 * s);
    for (let k = 0; k < 3; k++) { const y = SOL - (k + 1) * MARCHE_H * s; c.lineTo(X(m.x0 + k * MARCHE_L), y); c.lineTo(X(m.x0 + (k + 1) * MARCHE_L), y); }
    for (let k = 2; k >= 0; k--) { const y = SOL - (k + 1) * MARCHE_H * s; c.lineTo(X(m.x1 - (k + 1) * MARCHE_L), y); c.lineTo(X(m.x1 - k * MARCHE_L), SOL - k * MARCHE_H * s); }
    c.lineTo(X(m.x1), SOL + 3 * s); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = REPAS[repas].bord; c.globalAlpha = 0.6; c.fillRect(X(m.x0 + 3 * MARCHE_L), SOL - 3 * MARCHE_H * s, X(m.x1 - 3 * MARCHE_L) - X(m.x0 + 3 * MARCHE_L), 1 * s); c.globalAlpha = 1;
  }

  // le serveur et sa pile
  const e = elevation(G.wx);
  const enfantsDerriere = G.L.enfants.filter((k) => k.actif && k.vk > 0);
  for (const k of enfantsDerriere) if (visible(k.kx, 20)) monde(k.kx, 1.5, () => dessinerEnfant(c, k, temps));
  const cligne = G.invul > 0 && Math.floor(G.invul * 10) % 2 === 0;
  if (!cligne) {
    monde(G.wx, -e, () => dessinerServeur(c, { pas: G.plat * 0.42, glisse: surCire(G.wx), th: G.th, u: G.uVu, temps, rit: G.termine }));
    // plateau
    const main = mainServeur();
    monde(main.x, main.y, () => { c.rotate(-G.uVu * 0.15); dessinerPlateau(c, PLATEAUX.find((p) => p.id === prog.plateau) || PLATEAUX[0]); });
    // plats
    pile.liste.forEach((p, k) => {
      const it = G.items[k];
      const chute = it.chute || 0;
      monde(p.x, p.y - chute * 18, () => { c.rotate(p.a + chute * 0.4); dessinerPlat(c, it, temps, repas); });
    });
    if (G.chat) monde(pile.sommet.x + G.chat.pos * 4, pile.sommet.y, () => { c.rotate(G.th * 0.8); dessinerChat(c, G.chat.couleur, temps, false, false); });
    // alerte de pente : petites gouttes de sueur
    if (G.alerte > 0.2) monde(G.wx + 0.6, -e - 28, () => { c.globalAlpha = G.alerte; ellipse(c, -2.5, 0, 0.6, 0.9, '#7cc8ff'); ellipse(c, 4.5, -1, 0.5, 0.8, '#7cc8ff'); c.globalAlpha = 1; });
  }
  // plats qui volent vers la table
  for (const v of G.volants) {
    const k = clamp(v.t, 0, 1);
    const x = lerp(v.x0, v.x1, k), y = lerp(v.y0, v.y1, k) - Math.sin(k * Math.PI) * 8;
    monde(x, y, () => { const sc = lerp(1, 0.55, k); c.scale(sc, sc); dessinerPlat(c, v.it, temps, repas); });
  }
  // enfants qui arrivent de face (devant)
  for (const k of G.L.enfants) if (k.actif && k.vk < 0 && visible(k.kx, 20)) monde(k.kx, 1.5, () => dessinerEnfant(c, k, temps));
  // bulles de commande
  for (const st of G.stations) if (st.type === 'table' && visible(st.x, 40)) monde(st.x, -4, () => { c.translate(-st.x, 0); dessinerBulle(c, st, temps, G.dansTable === st && G.items.length > 0); });
  // particules
  for (const p of G.parts) {
    if (!visible(p.x, 20)) continue;
    monde(p.x, p.y, () => {
      if (p.type === 'confetti') { c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-0.6, -0.3, 1.2, 0.6); }
      else if (p.type === 'feuille') { c.rotate(p.r); c.fillStyle = repas === 1 ? '#f8bfd2' : repas === 2 ? '#e2702b' : '#d9d2c2'; c.beginPath(); c.ellipse(0, 0, 1.2, 0.5, 0, 0, TAU); c.fill(); }
      else if (p.type === 'goutte') cercle(c, 0, 0, 0.5, p.c);
      else if (p.type === 'eclat') { c.fillStyle = p.c; c.fillRect(-0.4, -0.4, 0.8, 0.8); }
      else if (p.type === 'plat') { c.rotate(p.r); dessinerPlat(c, p.it, temps, repas); }
    });
  }
  // flèches d'annonce : enfant ou courant d'air → côté où la pile va pencher
  if (G.items.length) {
    let fl = 0;
    for (const k of G.L.enfants) if (k.actif && !k.fait) fl = k.dir;
    for (const w of G.L.vents) { const d = G.wx - w.x; if (d > -40 && d < 26) fl = w.dir; }
    if (fl) {
      const main = mainServeur();
      monde(pile.sommet.x + fl * 9, Math.min(pile.sommet.y, main.y - 6) - 2, () => {
        c.scale(fl, 1);
        const a = 0.6 + 0.4 * Math.sin(temps * 10);
        c.globalAlpha = a; c.fillStyle = '#ff8a2b'; c.strokeStyle = '#ffffff'; c.lineWidth = 0.4;
        c.beginPath(); c.moveTo(-3, -1.2); c.lineTo(1, -1.2); c.lineTo(1, -3); c.lineTo(4.4, 0); c.lineTo(1, 3); c.lineTo(1, 1.2); c.lineTo(-3, 1.2); c.closePath(); c.fill(); c.stroke();
        c.globalAlpha = 1;
      });
    }
  }
  c.restore();
  if (!opts.sansJauge && G.items.length) dessinerJauge(c);
}

// Niveau à bulle : montre la pente de la pile.
function dessinerJauge(c) {
  const r = Math.min(W * 0.2, 90);
  const cx = W / 2, cy = H - Math.max(18, r * 0.35) - 8;
  c.save();
  c.lineCap = 'round';
  c.lineWidth = Math.max(8, r * 0.16);
  const zones = [[-1, -0.7, '#e2553a'], [-0.7, -0.35, '#f3b532'], [-0.35, 0.35, '#5bbf7a'], [0.35, 0.7, '#f3b532'], [0.7, 1, '#e2553a']];
  for (const [a, b, col] of zones) {
    c.strokeStyle = col; c.beginPath(); c.arc(cx, cy + r, r, -Math.PI / 2 + a * 0.9, -Math.PI / 2 + b * 0.9); c.stroke();
  }
  const k = clamp(G.th / 0.62, -1, 1);
  const ang = -Math.PI / 2 + k * 0.9;
  const bx = cx + Math.cos(ang) * r, by = cy + r + Math.sin(ang) * r;
  c.fillStyle = '#ffffff'; c.strokeStyle = '#4a2c1a'; c.lineWidth = 3;
  c.beginPath(); c.arc(bx, by, Math.max(7, r * 0.11), 0, TAU); c.fill(); c.stroke();
  // anneau du service (lâcher)
  if (G.dansTable && G.relache > 0) {
    c.strokeStyle = '#ffffff'; c.lineWidth = 4;
    c.beginPath(); c.arc(cx, cy + r * 0.55, r * 0.22, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(G.relache / 0.28, 0, 1)); c.stroke();
  }
  c.restore();
}

// Petite scène animée dans la carte d'introduction.
function dessinerIntro(dt) {
  if (etat !== 'intro') return;
  introT += dt;
  const can = $('#introCanvas'), c = can.getContext('2d');
  const w = can.width, h = can.height;
  const cle = introEtapes[introI];
  const R = REPAS[G ? G.P.repas : 0];
  c.setTransform(1, 0, 0, 1, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, R.mur2); g.addColorStop(0.75, R.mur); g.addColorStop(0.75, R.sol2); g.addColorStop(1, R.sol);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  const s = 7.2, t = introT;
  const cycle = (p) => (t % p) / p;
  // valeurs propres à chaque scène
  let th = 0, u = 0, items = ['puree', 'salade', 'gateau'], main = 0, mainOuverte = false, extra = null;
  if (cle === 'tuto.1') {
    const k = cycle(3);
    th = k < 0.4 ? k / 0.4 * 0.45 : 0.45 * (1 - (k - 0.4) / 0.6);
    u = k > 0.35 && k < 0.85 ? 1 : 0; main = u ? 1 : 0;
  } else if (cle === 'tuto.2' || cle === 'intro.double') {
    extra = 'chute';
  } else if (cle === 'tuto.3' || cle === 'intro.honneur') {
    extra = 'service'; mainOuverte = true;
  } else if (cle === 'intro.gelee') {
    items = ['puree', 'gelee', 'salade']; th = Math.sin(t * 9) * 0.08 + Math.sin(t * 2) * 0.12;
  } else if (cle === 'intro.dinde') {
    items = ['puree', 'dinde', 'salade']; th = 0.08 + Math.sin(t * 2) * 0.04; u = -1; main = -1;
  } else if (cle === 'intro.enfant') {
    extra = 'enfant'; const k = cycle(3); th = k > 0.5 ? Math.sin((k - 0.5) * 6) * 0.3 * (1 - k) * 2 : 0; u = k > 0.3 && k < 0.6 ? 1 : 0; main = u;
  } else if (cle === 'intro.cire') {
    extra = 'cire'; th = Math.sin(t * 1.3) * 0.2;
  } else if (cle === 'intro.marches') {
    extra = 'marches'; th = Math.sin(t * 3) * 0.12;
  } else if (cle === 'intro.soupe') {
    items = ['puree', 'soupe']; th = Math.sin(t * 1.5) * 0.35; extra = 'soupe';
  } else if (cle === 'intro.chat') {
    extra = 'chat'; th = Math.sin(t * 1.6) * 0.15;
  } else if (cle === 'intro.vent') {
    extra = 'vent'; th = 0.15 + Math.sin(t * 2) * 0.05; u = -1; main = -1;
  }
  const bx = w * 0.42;
  let by = h * 0.78;
  if (extra === 'marches') {
    by -= (Math.floor(cycle(2) * 3) + 1) * MARCHE_H * s * 0.5;
    c.fillStyle = '#8a5530';
    for (let k = 0; k < 3; k++) c.fillRect(bx - 60 + k * 40, h * 0.78 - (k + 1) * 7, 300, (k + 1) * 7);
  }
  if (extra === 'cire') {
    c.fillStyle = 'rgba(200,240,255,.6)'; c.fillRect(0, h * 0.75, w, h * 0.1);
    c.fillStyle = '#fff'; for (let k = 0; k < 8; k++) { c.globalAlpha = 0.5 + 0.5 * Math.sin(t * 6 + k); c.save(); c.translate(((k * 90 - t * 80) % w + w) % w, h * 0.8); c.scale(6, 6); etoile(c, 0, 0, 0.9); c.restore(); }
    c.globalAlpha = 1;
  }
  if (extra === 'service') {
    // table à droite
    c.save(); c.translate(w * 0.8, h * 0.78); c.scale(s, s);
    const tableIntro = { x: 0, honneur: cle === 'intro.honneur', invites: genInvites(rng(5), cle === 'intro.honneur', G ? G.P.repas : 0), plats: [], joie: cycle(2.4) > 0.5 ? 1 : 0, rire: 0, triste: 0 };
    dessinerTable(c, tableIntro, t, G ? G.P.repas : 0);
    c.restore();
  }
  c.save(); c.translate(bx, by); c.scale(s, s);
  dessinerServeur(c, { pas: t * 6, th, u, temps: t, glisse: extra === 'cire' });
  c.restore();
  // pile
  const base = { x: 6.4 + u * 1.6, y: -29.2 };
  let liste = items.map((type) => ({ type, v: 1, f: extra === 'soupe' ? clamp(1 - cycle(6) * 1.2, 0, 1) : 1, cote: 1, chute: 0 }));
  if (extra === 'service') { const k = cycle(2.4); if (k > 0.35) liste = liste.slice(0, 1); }
  const pile = positionsPile(liste, th, -u * 0.15, base);
  c.save(); c.translate(bx, by); c.scale(s, s);
  c.save(); c.translate(base.x, base.y); c.rotate(-u * 0.15); dessinerPlateau(c, PLATEAUX[0]); c.restore();
  pile.liste.forEach((p, k) => { c.save(); c.translate(p.x, p.y); c.rotate(p.a); dessinerPlat(c, liste[k], t, G ? G.P.repas : 0); c.restore(); });
  if (extra === 'chute') {
    const k = cycle(1.8);
    const y = lerp(pile.sommet.y - 30, pile.sommet.y, Math.min(1, k * 1.6));
    c.save(); c.translate(pile.sommet.x + (1 - Math.min(1, k * 1.6)) * -14, y); dessinerPlat(c, { type: 'tarte', v: 0, f: 1 }, t, 0); c.restore();
  }
  if (extra === 'service') {
    const k = cycle(2.4);
    if (k > 0.2 && k < 0.5) {
      const q = (k - 0.2) / 0.3;
      for (let j = 0; j < 2; j++) { c.save(); c.translate(lerp(pile.sommet.x, 40, q), lerp(pile.sommet.y - j * 3, -10, q) - Math.sin(q * Math.PI) * 8); c.scale(lerp(1, 0.55, q), lerp(1, 0.55, q)); dessinerPlat(c, { type: j ? 'gateau' : 'salade', v: 0, f: 1 }, t, 0); c.restore(); }
    }
  }
  if (extra === 'chat') { c.save(); c.translate(pile.sommet.x + Math.sin(t * 1.6) * 3.6, pile.sommet.y); dessinerChat(c, '#f0a04b', t, false, false); c.restore(); }
  if (extra === 'soupe' && Math.abs(th) > 0.22) { for (let k = 0; k < 4; k++) cercle(c, pile.liste[1].x + Math.sign(th) * (5 + k * 1.3), pile.liste[1].y - 3 + ((t * 20 + k * 4) % 12), 0.5, '#f08a3c'); }
  c.restore();
  if (extra === 'enfant') {
    const k = cycle(3);
    c.save(); c.translate(lerp(w + 40, -40, k), h * 0.8); c.scale(s, s);
    dessinerEnfant(c, { vk: -1, couleur: '#5b8def', fille: true }, t); c.restore();
    if (k < 0.5) { c.save(); c.translate(bx + 120, by - 260); c.scale(s, s); c.globalAlpha = 0.6 + 0.4 * Math.sin(t * 10); c.fillStyle = '#ff8a2b'; c.beginPath(); c.moveTo(-3, -1.2); c.lineTo(1, -1.2); c.lineTo(1, -3); c.lineTo(4.4, 0); c.lineTo(1, 3); c.lineTo(1, 1.2); c.lineTo(-3, 1.2); c.closePath(); c.fill(); c.restore(); c.globalAlpha = 1; }
  }
  if (extra === 'vent') {
    c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 5; c.lineCap = 'round';
    for (let k = 0; k < 4; k++) { const x = ((t * 260 + k * 160) % (w + 200)) - 100, y = 60 + k * 50; c.beginPath(); c.moveTo(w - x, y); c.quadraticCurveTo(w - x - 30, y - 12, w - x - 60, y); c.stroke(); }
  }
  // main qui montre le geste
  if (main || mainOuverte) {
    c.save();
    const mx = mainOuverte ? w * 0.42 : (main > 0 ? w * 0.86 : w * 0.14);
    const my = mainOuverte ? h * 0.18 - Math.abs(Math.sin(t * 4)) * 10 : h * 0.62 + (main ? 6 : 0);
    if (!mainOuverte) { c.fillStyle = 'rgba(255,196,90,.5)'; c.beginPath(); c.arc(mx, my, 44, 0, TAU); c.fill(); }
    c.translate(mx, my); c.scale(9, 9);
    dessinerMain(c, mainOuverte);
    c.restore();
  }
}

const NOUVEAUTE_CLES = { equilibre: ['tuto.1', 'tuto.2', 'tuto.3'], gelee: ['intro.gelee'], double: ['intro.double'], honneur: ['intro.honneur'], dinde: ['intro.dinde'], enfant: ['intro.enfant'], cire: ['intro.cire'], marches: ['intro.marches'], soupe: ['intro.soupe'], chat: ['intro.chat'], vent: ['intro.vent'] };

  doigts.clear();

}

let finVictoire = false;
function finirNiveau() {
  const ratio = G.total ? G.servis / G.total : 0;
  const P = G.P;
  const gagne = !G.chute && G.plateaux > 0 && ratio >= P.obj - 1e-9;
  finVictoire = gagne;
  let etoiles = 0;
  if (gagne) {
    etoiles = ratio >= 0.999 && G.casses === 0 ? 3 : ratio >= 0.75 ? 2 : 1;
    if (G.casses === 0) G.score += 300;
  }
  const ancienRecord = prog.records[niv];
  const recordBattu = gagne && G.score > ancienRecord;
  const avantEtoiles = totalEtoiles();
  if (G.hauteurMax > prog.hauteur) prog.hauteur = G.hauteurMax;
  let debloques = [];
  if (gagne) {
    prog.etoiles[niv] = Math.max(prog.etoiles[niv], etoiles);
    if (recordBattu) prog.records[niv] = G.score;
    prog.niveau = Math.max(prog.niveau, Math.min(niv + 2, NIVEAUX.length));
    const apres = totalEtoiles();
    for (const [liste, pre] of [[TABLIERS, 'tablier.'], [PLATEAUX, 'plateau.'], [DESSERTS, 'dessert.']]) {
      for (const o of liste) if (o.etoiles > avantEtoiles && o.etoiles <= apres) debloques.push(tr(pre + o.id));
    }
    ecrireSauvegarde({ niveau: Math.min(niv + 2, NIVEAUX.length), score: totalScore() });
  } else {
    ecrireSauvegarde({ niveau: niv + 1 });
  }
  montrerFin(gagne, etoiles, ratio, recordBattu, debloques);
}

function montrerFin(gagne, etoiles, ratio, recordBattu, debloques) {
  cacherEcrans();
  etat = 'fin';
  montrerPads(false);
  doigts.clear();
  if (gagne) {
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: niv + 1 });
    if (tousGagnes()) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    Son.victoire();
    confettis(G.wx, -40, 60);
  } else {
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: niv + 1 });
    Son.defaite();
  }
  $('#finTitre').textContent = tr(gagne ? 'fin.victoire' : 'fin.defaite');
  $('#finSous').textContent = gagne ? tr('fin.sous.' + etoiles) : tr(G.chute ? 'fin.sous.plateaux' : 'fin.sous.peu', { n: Math.round(G.P.obj * 100) });
  const box = $('#finEtoiles');
  box.innerHTML = '';
  for (let k = 0; k < 3; k++) {
    const d = document.createElement('span');
    d.innerHTML = SVG_ETOILE(k < etoiles);
    box.append(d);
    const svg = d.firstChild;
    if (k < etoiles) setTimeout(() => { svg.classList.add('on'); Son.etoile(k); }, 350 + k * 320);
    else setTimeout(() => { svg.style.transform = 'scale(.8)'; }, 200);
  }
  $('#finServis').textContent = tr('fin.servis', { a: nb(G.servis), b: nb(G.total) });
  $('#finCasses').textContent = tr('fin.casses', { n: G.casses });
  // compteur qui défile
  const cible = G.score;
  const debut = performance.now();
  const el = $('#finScore');
  const pasScore = () => {
    const k = clamp((performance.now() - debut) / 900, 0, 1);
    el.textContent = tr('fin.score', { n: nb(Math.round(cible * k)) });
    if (k < 1 && etat === 'fin') requestAnimationFrame(pasScore);
  };
  pasScore();
  const rec = $('#finRecord');
  rec.className = recordBattu ? 'record' : '';
  rec.textContent = recordBattu ? tr('fin.nouveauRecord') : tr('fin.record', { n: nb(prog.records[niv]) });
  $('#finDebloque').textContent = debloques.length ? tr('fin.debloque', { nom: debloques.join(', ') }) : '';
  $('#finSuivant').hidden = !gagne || niv >= NIVEAUX.length - 1;
  $('#finReessayer').hidden = gagne;
  $('#finRejouer').hidden = !gagne;
  if (gagne && niv === NIVEAUX.length - 1) $('#finNiveaux').textContent = tr('fin.bilan');
  else $('#finNiveaux').textContent = tr('fin.niveaux');
  $('#fin').hidden = false;
}
function montrerBilan() {
  cacherEcrans();
  etat = 'bilan';
  $('#hud').hidden = true;
  const box = $('#bilanEtoiles');
  box.innerHTML = SVG_ETOILE(true) + SVG_ETOILE(true) + SVG_ETOILE(true);
  box.querySelectorAll('svg').forEach((s, k) => setTimeout(() => s.classList.add('on'), 200 + k * 250));
  $('#bilanTexte').textContent = tr('bilan.texte', { n: nb(totalEtoiles()), max: nb(NIVEAUX.length * 3) });
  $('#bilanHauteur').textContent = tr('hud.record', { n: prog.hauteur });
  $('#bilan').hidden = false;
}

/* ---------------------------------------------------------------------
   Affiche (jaquette du jeu) : window.JEL_AFFICHE
   --------------------------------------------------------------------- */
function dessinerAffiche(temps) {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const R = REPAS[1];
  // salle du mariage, lumière du lustre
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f6d7e2'); g.addColorStop(0.62, '#fbeef2'); g.addColorStop(0.62, '#e2c8ae'); g.addColorStop(1, '#c9a98a');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const s = Math.min(W / 60, H / 80);
  const ox = W / 2, sol = H * 0.74;
  const M = (x, y, f) => { c.save(); c.translate(ox + x * s, sol + y * s); c.scale(s, s); f(); c.restore(); };
  // fenêtres lointaines et halo
  for (const fx of [-24, 18]) M(fx, -22, () => {
    c.fillStyle = '#d8b4c4'; rrect(c, -7, -40, 14, 30, 2); c.fill();
    c.fillStyle = '#d7ecff'; c.fillRect(-6, -39, 12, 28);
    c.fillStyle = '#d8b4c4'; c.fillRect(-0.4, -39, 0.8, 28);
  });
  const halo = c.createRadialGradient(ox + 12 * s, H * 0.08, 0, ox + 12 * s, H * 0.08, H * 0.6);
  halo.addColorStop(0, 'rgba(255,236,170,.95)'); halo.addColorStop(0.35, 'rgba(255,220,150,.35)'); halo.addColorStop(1, 'rgba(255,220,150,0)');
  c.fillStyle = halo; c.fillRect(0, 0, W, H);
  // lustre
  M(12, -66, () => {
    c.strokeStyle = '#b8892a'; c.lineWidth = 0.4; c.beginPath(); c.moveTo(0, -20); c.lineTo(0, -4); c.stroke();
    c.fillStyle = '#e8b84a'; ellipse(c, 0, -3, 7, 1.6, '#e8b84a');
    for (let k = -2; k <= 2; k++) { c.fillStyle = '#fff6dc'; c.fillRect(k * 3 - 0.3, -6, 0.6, 2.4); ellipse(c, k * 3, -6.8, 0.6, 1, '#ffd36b'); }
    for (let k = -3; k <= 3; k++) cercle(c, k * 2.2, -1 + Math.abs(k) * 0.3, 0.5, 'rgba(255,255,255,.9)');
  });
  // guirlande
  c.strokeStyle = '#f3b6c9'; c.lineWidth = s * 0.4;
  c.beginPath(); c.moveTo(0, H * 0.06); c.quadraticCurveTo(W / 2, H * 0.17, W, H * 0.06); c.stroke();
  for (let k = 1; k < 9; k++) { const x = W * k / 9, y = H * 0.06 + Math.sin(k / 9 * Math.PI) * H * 0.07; cercle(c, x, y + 4, s * 1.1, k % 2 ? '#ffffff' : '#f08bb0'); }
  // table des invités au fond (plus petite)
  M(20, -10, () => {
    c.scale(0.75, 0.75);
    const tbl = { x: 0, honneur: true, invites: genInvites(rng(42), true, 1), plats: [{ type: 'gateau', v: 0, f: 1 }, null, { type: 'salade', v: 0, f: 1 }], joie: 1, rire: 0, triste: 0 };
    dessinerTable(c, tbl, temps, 1);
  });
  // parquet
  c.strokeStyle = 'rgba(0,0,0,.08)'; c.lineWidth = 1.5;
  for (let r = 0; r < 6; r++) { const y = H * 0.62 + (H * 0.38) * r / 6; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
  // le serveur, en grand, la pile qui penche
  const th = 0.2 + Math.sin(temps * 2) * 0.03;
  const items = ['puree', 'salade', 'dinde', 'gelee', 'tarte', 'gateau'].map((type, k) => ({ type, v: k, f: 1, cote: 1, chute: 0 }));
  let hTot = 0; items.forEach((it) => { hTot += PLATS[it.type].h; });
  const sk = (sol - H * 0.13) / (31 + hTot);
  c.save(); c.translate(ox - 4 * s, sol); c.scale(sk, sk);
  ellipse(c, 0, 0.3, 9, 1.4, 'rgba(0,0,0,.25)');
  dessinerServeur(c, { pas: 0.6, th: 0.5, u: -0.6, temps, tablier: 'rouge' });
  const base = { x: 6.4 - 0.6 * 1.6, y: -29.2 };
  c.save(); c.translate(base.x, base.y); c.rotate(0.09); dessinerPlateau(c, PLATEAUX[4]); c.restore();
  const pile = positionsPile(items, th, 0.09, base);
  pile.liste.forEach((p, j) => { c.save(); c.translate(p.x, p.y); c.rotate(p.a); dessinerPlat(c, items[j], temps, 1); c.restore(); });
  // une assiette s'envole, petits pois en l'air
  c.save(); c.translate(pile.sommet.x + 11, pile.sommet.y + 3); c.rotate(0.7); dessinerPlat(c, { type: 'puree', v: 0, f: 1 }, temps, 1); c.restore();
  for (let j = 0; j < 6; j++) cercle(c, pile.sommet.x + 6 + j * 1.6, pile.sommet.y - 1 - (j % 3) * 1.8, 0.45, '#4fae3f');
  // contour lumineux
  c.restore();
  // étincelles de lumière
  for (let j = 0; j < 14; j++) {
    const x = (j * 97) % W, y = H * 0.12 + ((j * 53) % (H * 0.5));
    c.fillStyle = `rgba(255,255,255,${0.4 + 0.4 * Math.sin(temps * 3 + j)})`;
    c.save(); c.translate(x, y); c.scale(s * 0.5, s * 0.5); etoile(c, 0, 0, 1.5); c.restore();
  }
  // premier plan : un enfant qui court, et le coin d'une nappe
  M(-20, 6, () => { c.scale(1.35, 1.35); dessinerEnfant(c, { vk: 1, couleur: '#5b8def', fille: false }, temps); });
  M(26, 10, () => {
    c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(-10, -12); c.lineTo(20, -12); c.lineTo(20, 10); c.lineTo(-11, 10); c.closePath(); c.fill();
    c.fillStyle = R.bord; for (let j = 0; j < 8; j++) { c.beginPath(); c.arc(-10 + j * 4 + 2, -12, 2, Math.PI, TAU); c.fill(); }
    c.save(); c.translate(0, -12); c.scale(1.2, 1.2); dessinerSoupiere(c, { f: 1 }, temps); c.restore();
  });
}

/* ---------------------------------------------------------------------
   Images du jeu (page du jeu) : window.JEL_APERCU = 1, 2 ou 3
   --------------------------------------------------------------------- */
function ouvrirApercu(n) {
  const i = n === 1 ? 0 : n === 2 ? 7 : 17;
  niv = i;
  nouvellePartie(i, false);
  etat = 'jeu';
  cacherEcrans();
  $('#hud').hidden = false; montrerPads(true);
  const P = G.P;
  const R = rng(77 + n);
  const tables = G.stations.filter((s) => s.type === 'table');
  if (n === 1) {
    const t0 = tables[0];
    G.wx = t0.x - 12;
    G.stations.forEach((s) => { if (s.type === 'buffet' && s.x < G.wx) s.fait = true; });
    G.items = ['puree', 'salade', 'gateau', 'poulet'].map((type) => creerPlat(type, R));
    G.th = 0.16; G.uVu = -0.4;
    G.dansTable = t0;
    G.servis = 0; G.hauteurMax = 4;
  } else if (n === 2) {
    const t1 = tables[1], t0 = tables[0];
    G.wx = t1.x - 40;
    G.stations.forEach((s) => { if (s.type === 'buffet' && s.x < G.wx) s.fait = true; });
    t0.etat = 'servie'; t0.servis = t0.cmd; t0.plats = Array.from({ length: t0.cmd }, () => creerPlat('pates', R));
    G.items = ['puree', 'tarte', 'dinde', 'salade', 'gelee', 'gateau', 'poulet'].map((type) => creerPlat(type, R));
    G.items[2].cote = 1;
    G.th = -0.24; G.uVu = 1;
    const k = G.L.enfants[0] || { x: G.wx + 10, dir: 1, couleur: '#ef6b5b', fille: true };
    if (!G.L.enfants.length) G.L.enfants.push(k);
    k.actif = true; k.vk = -26; k.kx = G.wx + 14; k.dir = 1;
    G.servis = t0.cmd; G.hauteurMax = 7;
    t1.joie = 0;
  } else {
    const m = G.L.marches[0];
    G.wx = m ? (m.x0 + m.x1) / 2 : tables[2].x - 30;
    G.stations.forEach((s) => { if (s.type === 'buffet' && s.x < G.wx) s.fait = true; });
    tables.forEach((t) => { if (t.x < G.wx) { t.etat = 'servie'; t.servis = t.cmd; t.plats = Array.from({ length: Math.min(4, t.cmd) }, (_, j) => creerPlat(SIMPLES[j % 6], R)); } });
    G.items = ['puree', 'soupe', 'tarte', 'gelee', 'salade', 'dinde', 'pates', 'gateau', 'soupe', 'poulet'].map((type) => creerPlat(type, R));
    G.items[8].f = 0.55;
    G.th = 0.3; G.uVu = -1;
    const ch = G.L.chats[0];
    if (ch) { ch.etat = 'dessus'; ch.t = 1; ch.pos = 0.6; G.chat = ch; }
    const w = G.L.vents[0];
    if (w) { w.x = G.wx + 30; w.souffle = 1; }
    for (let j = 0; j < 8; j++) G.parts.push({ type: 'goutte', x: G.wx + 8 + j * 0.8, y: -60 + j * 4, vx: 0, vy: 0, vie: 99, c: '#f08a3c' });
    G.servis = tables.filter((t) => t.x < G.wx).reduce((a, t) => a + t.cmd, 0);
    G.plateaux = 2; G.hauteurMax = 10;
  }
  G.zoom = 1;
  G.fige = true;
  majHud();
  hudCache = '';
}

/* ---------------------------------------------------------------------
   Boucle principale
   --------------------------------------------------------------------- */
let dernier = performance.now(), cumul = 0;
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - dernier) / 1000);
  dernier = maintenant;
  if (affiche) {
    dessinerAffiche(maintenant / 1000);
    requestAnimationFrame(boucle);
    return;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G) {
    const actif = etat === 'jeu' || etat === 'titre' || etat === 'niveaux' || etat === 'vestiaire';
    if (actif && !(apercu && G.fige)) {
      cumul += dt;
      while (cumul >= PAS) { majPartie(PAS); cumul -= PAS; }
    } else if (apercu) {
      G.t += dt; majParticules(0);
    } else if (etat === 'fin') {
      G.t += dt; majParticules(dt);
    }
    dessinerScene(ctx, { margeHaut: G.demo ? Math.min(H * 0.55, 470) : 96, place: G.demo ? 0.4 : 0.32, direct: !!apercu, sansJauge: G.demo });
    majHud();
  }
  // pads lumineux
  const u = etat === 'jeu' ? entree() : 0;
  $('#padG').classList.toggle('actif', u < 0);
  $('#padD').classList.toggle('actif', u > 0);
  dessinerIntro(dt);
  requestAnimationFrame(boucle);
}

/* ---------------------------------------------------------------------
   Boutons
   --------------------------------------------------------------------- */
$('#btnJouer').addEventListener('click', () => {
  Son.init(); Son.clic();
  window.JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { lireSauvegarde(); lancerNiveau(clamp((parseInt(d.niveau, 10) || 1) - 1, 0, NIVEAUX.length - 1)); },
    onNouvelle: () => { lancerNiveau(0); },
    onEffacer: () => { lireSauvegarde(); montrerTitre(); },
  });
});
$('#btnNiveaux').addEventListener('click', () => { Son.init(); Son.clic(); montrerNiveaux(); });
$('#btnVestiaire').addEventListener('click', () => { Son.init(); Son.clic(); montrerVestiaire(); });
$$('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
$('#btnPause').innerHTML = SVG_PAUSE;
$('#btnPause').addEventListener('click', () => { Son.init(); Son.clic(); mettrePause(); });
$('#padG').innerHTML = SVG_FLECHE(-1);
$('#padD').innerHTML = SVG_FLECHE(1);
$$('.retour').forEach((b) => b.addEventListener('click', () => { Son.clic(); montrerTitre(); }));
$$('.onglets button').forEach((b) => b.addEventListener('click', () => { Son.clic(); onglet = b.dataset.onglet; montrerVestiaire(); }));
$('#pause').addEventListener('click', (e) => {
  const a = e.target.closest('[data-action]'); if (!a) return;
  Son.clic();
  const act = a.dataset.action;
  if (act === 'reprendre') reprendre();
  else if (act === 'recommencer') { reprendre(); lancerNiveau(niv); }
  else if (act === 'accueil') { reprendre(); ecrireSauvegarde({ niveau: niv + 1 }); montrerTitre(); }
});
$('#introOk').addEventListener('click', fermerIntro);
$('#finSuivant').addEventListener('click', () => { Son.clic(); lancerNiveau(niv + 1); });
$('#finReessayer').addEventListener('click', () => { Son.clic(); lancerNiveau(niv); });
$('#finRejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(niv); });
$('#finNiveaux').addEventListener('click', () => { Son.clic(); if (finVictoire && niv === NIVEAUX.length - 1) montrerBilan(); else montrerNiveaux(); });
$('#bilanNiveaux').addEventListener('click', () => { Son.clic(); montrerNiveaux(); });
$('#bilanVestiaire').addEventListener('click', () => { Son.clic(); montrerVestiaire(); });
$('#bilanAccueil').addEventListener('click', () => { Son.clic(); montrerTitre(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });
if (window.JEL_I18N && window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(() => {
  majBoutonsSon(); hudCache = '';
  if (etat === 'titre') montrerTitre(); else if (etat === 'niveaux') montrerNiveaux(); else if (etat === 'vestiaire') montrerVestiaire(); else if (etat === 'intro') majIntro();
});

// Fermeture de la page pendant une partie : on garde le niveau en cours.
window.JEL_SAVE.surFermeture(() => {
  if (apercu || affiche) return;
  if (G && !G.demo && (etat === 'jeu' || etat === 'pause' || etat === 'intro')) ecrireSauvegarde({ niveau: niv + 1, score: totalScore() });
});

/* ---------------------------------------------------------------------
   Démarrage
   --------------------------------------------------------------------- */
window.addEventListener('resize', redimensionner);
lireSauvegarde();
majBoutonsSon();
redimensionner();
function cacherLangue() { $$('.jel-langue, jel-langue, [class*="jel-langue"]').forEach((el) => { el.style.display = 'none'; }); }
if (window.JEL_AFFICHE) {
  affiche = true;
  cacherEcrans(); $('#hud').hidden = true; montrerPads(false);
  cacherLangue(); setTimeout(cacherLangue, 300);
  requestAnimationFrame(boucle);
  return;
}
if (window.JEL_APERCU) {
  apercu = Number(window.JEL_APERCU) || 1;
  ouvrirApercu(apercu);
  requestAnimationFrame(boucle);
  return;
}
montrerTitre();
requestAnimationFrame(boucle);
})();
</script>
