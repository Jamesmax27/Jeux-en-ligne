<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);

      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.

  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

    '.jel-langue *{box-sizing:border-box}' +

    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +

    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {

      if (isole && !coin && hote) {

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);

      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();

    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }

      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];

    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
(() => {
'use strict';
/* =====================================================================
   Le Serveur Funambule
   Un serveur avance tout seul dans la salle d'un repas de fête. On garde
   la pile de plats droite en appuyant du côté où elle penche ; au buffet
   un plat s'ajoute, devant une table on lâche pour servir.
   ===================================================================== */
const JEU = 'le-serveur-funambule';
const tr = (cle, v) => window.JEL_I18N.t(cle, v);
const nb = (x) => window.JEL_I18N.nombre(x);
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;

// Hasard reproductible (même disposition pour un niveau donné).
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const ri = (R, a, b) => a + Math.floor(R() * (b - a + 1));

/* ---------------------------------------------------------------------
   Données : repas (décors), niveaux, vestiaire
   --------------------------------------------------------------------- */
const REPAS = [
  { id: 'dimanche', mur: '#f7e4c6', mur2: '#efd3a9', plinthe: '#9b6a43', sol: '#c98f5a', sol2: '#b77c49', nappe: '#ffffff', bord: '#e2553a', ciel: '#bfe6ff', gelee: '#ff5f6d' },
  { id: 'mariage', mur: '#fbeef2', mur2: '#f3d8e2', plinthe: '#b88aa0', sol: '#e9d6c0', sol2: '#d9c2a8', nappe: '#ffffff', bord: '#f08bb0', ciel: '#d7ecff', gelee: '#ff8fc4' },
  { id: 'automne', mur: '#f1c58e', mur2: '#e3a96b', plinthe: '#7a4524', sol: '#a8683c', sol2: '#925733', nappe: '#fff4e0', bord: '#d9622b', ciel: '#ffd59a', gelee: '#ffa62b' },
  { id: 'chateau', mur: '#b9b2a6', mur2: '#a39b8e', plinthe: '#5d554b', sol: '#8a6a4b', sol2: '#77593d', nappe: '#fff6dc', bord: '#3d5bb5', ciel: '#2f3b6b', gelee: '#6fd36a' },
];

// Fabrique d'un niveau (valeurs par défaut, puis ce qui change).
const N_ = (o) => Object.assign({
  repas: 0, tables: 3, depart: 3, ajout: [1, 1], cmd: [1, 2], vitesse: 18, grav: 0.7, bruit: 0.4, obj: 0.4,
  gelee: 0, dinde: 0, soupe: 0, enfants: 0, cire: 0, marches: 0, chats: 0, vents: 0, final: false, nouveau: null,
}, o);
const NIVEAUX = [
  // Déjeuner du dimanche
  N_({ repas: 0, tables: 2, depart: 3, ajout: [1, 1], cmd: [2, 2], vitesse: 16, grav: 0.5, bruit: 0.2, obj: 0.4, nouveau: 'equilibre' }),
  N_({ repas: 0, tables: 3, depart: 3, ajout: [1, 1], cmd: [1, 2], vitesse: 17, grav: 0.6, bruit: 0.3, obj: 0.4 }),

function lireSauvegarde() {
  let d = null;

  d = d && typeof d === 'object' ? d : {};

  prog.etoiles = NIVEAUX.map((_, i) => clamp(parseInt((d.etoiles || [])[i], 10) || 0, 0, 3));
  prog.records = NIVEAUX.map((_, i) => Math.max(0, parseInt((d.records || [])[i], 10) || 0));

  prog.vus = Array.isArray(d.vus) ? d.vus.filter((x) => typeof x === 'string').slice(0, 30) : [];

function totalEtoiles() { return prog.etoiles.reduce((a, b) => a + b, 0); }

let W = 0, H = 0, DPR = 1, U = 6, SOL = 0;
function redimensionner() {

/* ---------------------------------------------------------------------
   Fabrication d'un niveau
   --------------------------------------------------------------------- */
function creerPlat(type, R) {
  const p = { type, chute: 0, f: 1, cote: 0, v: Math.floor(R() * 3) };
  if (type === 'dinde') p.cote = R() < 0.5 ? -1 : 1;
  return p;
}
function choisirPlat(P, R, force) {
  if (force) return creerPlat(force, R);
  const r = R();
  let s = P.gelee;
  if (r < s) return creerPlat('gelee', R);
  s += P.dinde; if (r < s) return creerPlat('dinde', R);
  s += P.soupe; if (r < s) return creerPlat('soupe', R);
  return creerPlat(SIMPLES[Math.floor(R() * SIMPLES.length)], R);
}
function genInvites(R, honneur, repas) {
  const nbre = honneur ? 6 : 3 + Math.floor(R() * 2);
  const peaux = ['#f2c9a0', '#e0ac7e', '#c68a5e', '#8d5a3b', '#f6d5b8'];
  const cheveux = ['#3b2414', '#d9a441', '#7a3b1c', '#1d1d1d', '#c9c9c9', '#a8522a'];
  const habits = ['#5b8def', '#ef6b5b', '#5bbf7a', '#b06bd6', '#f2b84b', '#4fb5c4'];
  const liste = [];
  for (let i = 0; i < nbre; i++) {
    liste.push({
      peau: peaux[Math.floor(R() * peaux.length)], cheveux: cheveux[Math.floor(R() * cheveux.length)],
      habit: habits[Math.floor(R() * habits.length)], enfant: R() < 0.3, phase: R() * TAU,
      chapeau: honneur ? (repas === 3 ? 'couronne' : repas === 1 ? (i === 2 ? 'voile' : i === 3 ? 'haut' : '') : repas === 2 ? 'beret' : '') : (repas === 2 && R() < 0.3 ? 'beret' : ''),
    });
  }
  return liste;
}
function genererNiveau(i) {
  const P = NIVEAUX[i];
  const R = rng(9137 + i * 7919);
  const ESP = 104;
  let x = 46;
  const stations = [];
  const depart = [];
  for (let k = 0; k < P.depart; k++) depart.push(creerPlat(SIMPLES[Math.floor(R() * SIMPLES.length)], R));
  let c = P.depart, total = P.depart;
  let forceFait = false;
  const force = ['gelee', 'dinde', 'soupe'].includes(P.nouveau) ? P.nouveau : null;
  for (let k = 0; k < P.tables; k++) {
    let nAj = ri(R, P.ajout[0], P.ajout[1]);
    if (P.nouveau === 'double' && k === 0) nAj = 2;
    const items = [];
    for (let j = 0; j < nAj; j++) {
      const f = force && !forceFait ? force : null;
      if (f) forceFait = true;
      items.push(choisirPlat(P, R, f));
    }
    stations.push({ type: 'buffet', x, items, fait: false, lance: 0 });
    total += nAj; c += nAj;
    x += ESP * 0.78;
    const honneur = k === P.tables - 1;
    const cmd = honneur ? c : Math.min(c, ri(R, P.cmd[0], P.cmd[1]));
    stations.push({ type: 'table', x, cmd, servis: 0, etat: 'attente', honneur, invites: genInvites(R, honneur, P.repas), plats: [], joie: 0, rire: 0, triste: 0 });
    c -= cmd;
    x += ESP * (honneur ? 0.6 : 1);
  }
  const fin = stations[stations.length - 1].x + 38;
  // Intervalles entre deux stations : là se placent les surprises.
  const ecarts = [];
  for (let j = 0; j < stations.length - 1; j++) {
    ecarts.push({ a: stations[j].x + 17, b: stations[j + 1].x - 17, plage: null, points: 0 });
  }
  const libres = (filtre) => ecarts.map((e, j) => j).filter((j) => j > 0 && filtre(ecarts[j]));
  const prendre = (liste) => liste.length ? liste.splice(Math.floor(R() * liste.length), 1)[0] : -1;
  const cire = [], marches = [], enfants = [], chats = [], vents = [];
  for (const [nom, n] of [['marches', P.marches], ['cire', P.cire]]) {
    for (let k = 0; k < n; k++) {
      const j = prendre(libres((e) => !e.plage && e.b - e.a > 46));
      if (j < 0) break;
      const e = ecarts[j]; e.plage = nom;
      if (nom === 'cire') cire.push({ x0: e.a + 4, x1: e.b - 4 });
      else marches.push({ x0: e.a + 5, x1: e.b - 5 });
    }
  }
  const points = [];
  for (let k = 0; k < P.enfants; k++) points.push('enfant');
  for (let k = 0; k < P.chats; k++) points.push('chat');
  for (let k = 0; k < P.vents; k++) points.push('vent');
  for (const nom of points) {
    let j = prendre(libres((e) => e.plage !== 'marches' && e.points === 0));
    if (j < 0) j = prendre(libres((e) => e.plage !== 'marches' && e.points < 2));
    if (j < 0) continue;
    const e = ecarts[j]; e.points++;
    const px = lerp(e.a + 10, e.b - 10, e.points === 1 ? 0.35 + R() * 0.2 : 0.75);
    if (nom === 'enfant') enfants.push({ x: px, dir: R() < 0.5 ? 1 : -1, actif: false, fait: false, kx: 0, couleur: ['#ef6b5b', '#5b8def', '#f2b84b', '#5bbf7a'][Math.floor(R() * 4)], fille: R() < 0.5 });
    if (nom === 'chat') chats.push({ x: px, etat: 'attend', t: 0, pos: 0, couleur: R() < 0.5 ? '#f0a04b' : '#6b6b78' });
    if (nom === 'vent') vents.push({ x: px, dir: R() < 0.5 ? 1 : -1, souffle: 0, joue: false });
  }
  return { P, stations, fin, depart, total, cire, marches, enfants, chats, vents };
}

const doigts = new Map();
const touches = { g: false, d: false };
function entree() {
  let g = touches.g, d = touches.d;
  for (const cote of doigts.values()) { if (cote < 0) g = true; else d = true; }
  return (d ? 1 : 0) - (g ? 1 : 0);
}
function cibleJeu(e) { return !(e.target && e.target.closest && e.target.closest('button, .ecran, .jel-langue, a, input')); }
window.addEventListener('pointerdown', (e) => {
  if (etat !== 'jeu' || !cibleJeu(e)) return;
  Son.init();
  doigts.set(e.pointerId, e.clientX < W / 2 ? -1 : 1);
  e.preventDefault();
}, { passive: false });
window.addEventListener('pointermove', (e) => { if (doigts.has(e.pointerId)) doigts.set(e.pointerId, e.clientX < W / 2 ? -1 : 1); });
const lacher = (e) => { doigts.delete(e.pointerId); };
window.addEventListener('pointerup', lacher);
window.addEventListener('pointercancel', lacher);
window.addEventListener('blur', () => { doigts.clear(); touches.g = touches.d = false; });
window.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') { touches.g = true; Son.init(); if (etat === 'jeu') e.preventDefault(); }
  else if (c === 'ArrowRight' || c === 'KeyD') { touches.d = true; Son.init(); if (etat === 'jeu') e.preventDefault(); }
  else if (c === 'Escape' || c === 'KeyP') {
    if (etat === 'jeu') { mettrePause(); e.preventDefault(); }
    else if (etat === 'pause') { reprendre(); e.preventDefault(); }
  } else if (c === 'Enter' || c === 'Space') {
    if (etat === 'intro') { e.preventDefault(); $('#introOk').click(); }
    else if (etat === 'fin') { e.preventDefault(); (finVictoire ? $('#finSuivant') : $('#finReessayer')).click(); }
    else if (etat === 'titre' && !document.getElementById('jel-sauvegarde-titre')) { e.preventDefault(); $('#btnJouer').click(); }
  }
});
window.addEventListener('keyup', (e) => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA' || c === 'KeyQ') touches.g = false;
  else if (c === 'ArrowRight' || c === 'KeyD') touches.d = false;
});

// Démonstration de l'écran titre : le serveur se débrouille tout seul.
function autopilote() {
  const val = G.th * 4 + G.om * 1.6;
  if (G.dansTable && Math.abs(G.th) < 0.2 && Math.abs(G.om) < 0.6) return 0;
  return val > 0.12 ? 1 : val < -0.12 ? -1 : 0;
}

/* ---------------------------------------------------------------------
   Terrain : estrade, parquet ciré
   --------------------------------------------------------------------- */
const MARCHE_L = 5, MARCHE_H = 2;
function elevation(x) {
  for (const m of G.L.marches) {
    if (x < m.x0 || x > m.x1) continue;
    const up = Math.min(3, Math.floor((x - m.x0) / MARCHE_L) + 1);
    const down = Math.min(3, Math.floor((m.x1 - x) / MARCHE_L) + 1);
    return Math.min(up, down) * MARCHE_H;
  }
  return 0;
}
function surCire(x) { return G.L.cire.some((z) => x >= z.x0 && x <= z.x1); }

/* ---------------------------------------------------------------------
   Pile : positions des plats (unités du monde, y vers le bas, sol = 0)
   --------------------------------------------------------------------- */
function mainServeur() {
  const e = elevation(G.wx);
  return { x: G.wx + 6.4 + G.uVu * 1.6, y: -29.2 - e };
}
function positionsPile(items, th, ang0, base) {
  const res = [];
  let hTot = 0;
  for (const it of items) hTot += PLATS[it.type].h;
  const hRef = Math.max(hTot, 12);
  let px = base.x, py = base.y - 0.9, cumul = 0;
  for (const it of items) {
    const h = PLATS[it.type].h;
    const a = ang0 * 0.6 + th * (0.3 + 0.7 * (cumul + h / 2) / hRef);
    res.push({ x: px, y: py, a, h });
    px += Math.sin(a) * h;
    py -= Math.cos(a) * h;
    cumul += h;
  }
  return { liste: res, sommet: { x: px, y: py }, hTot };
}

/* ---------------------------------------------------------------------
   Mise à jour (pas fixe)
   --------------------------------------------------------------------- */
const PAS = 1 / 120;
function majPartie(dt) {
  if (!G) return;
  G.t += dt;
  majParticules(dt);
  if (G.fige) return;
  const P = G.P;
  const u = G.demo ? autopilote() : (etat === 'jeu' ? entree() : 0);
  G.u = u;
  G.uVu = lerp(G.uVu, u, Math.min(1, dt * 14));

  // Avancée du serveur
  const cire = surCire(G.wx);
  let v = P.vitesse * (cire ? 1.3 : 1);
  const hon = G.stations[G.stations.length - 1];
  if (hon.etat === 'attente' && Math.abs(G.wx - hon.x) < 24 && G.items.length) v *= 0.6;
  if (G.termine || G.chute) v = 0;
  G.v = lerp(G.v, v, Math.min(1, dt * 4));
  const avant = G.wx;
  G.wx += G.v * dt;
  G.plat += G.v * dt;

  // Marches de l'estrade : un à-coup à chaque marche
  const e0 = elevation(avant), e1 = elevation(G.wx);
  if (e1 !== e0 && G.items.length) {
    G.om += e1 > e0 ? -0.6 : 0.6;
    Son.toc();
    G.secousse = Math.max(G.secousse, 0.15);
  }

  // Buffets : le chef lance un plat sur la pile
  for (const s of G.stations) {
    if (s.type !== 'buffet' || s.fait) continue;
    if (G.wx >= s.x - 2 && !G.chute) {
      s.fait = true;
      s.lance = 1;
      s.items.forEach((p, k) => {
        const q = Object.assign({}, p);
        q.chute = 1 + k * 0.6;
        G.items.push(q);
      });
      G.om += (Math.random() - 0.5) * 0.25;
      Son.pose();
      if (s.items.some((p) => p.type === 'gelee')) Son.boing();
      if (G.items.length > G.hauteurMax) G.hauteurMax = G.items.length;
      if (!G.demo && G.items.length > prog.hauteur && G.items.length > G.recordAvant && !G.recordVu && G.recordAvant > 0) {
        G.recordVu = true; toast(tr('toast.record')); Son.record();
      }
    }
  }
  for (const it of G.items) if (it.chute > 0) it.chute = Math.max(0, it.chute - dt * 3.2);

  // Enfants qui courent
  for (const k of G.L.enfants) {
    if (k.fait) { k.kx += k.vk * dt; continue; }
    if (!k.actif && G.wx >= k.x - 32) {
      k.actif = true;
      const T = 32 / P.vitesse;
      if (k.dir > 0) { k.vk = -26; k.kx = k.x + 26 * T; }     // arrive de face : la pile part en avant
      else { k.vk = P.vitesse + 22; k.kx = k.x - (P.vitesse + 22) * T; } // double par derrière
    }
    if (k.actif) {
      k.kx += k.vk * dt;
      if (Math.abs(k.kx - G.wx) < 2.5) {
        k.fait = true;
        if (G.items.length) G.om += k.dir * 1.2;
        Son.pouet();
        G.secousse = Math.max(G.secousse, 0.2);
      }
    }
  }

  // Chat du château : il saute sur la pile, se promène, puis redescend
  if (G.chat && G.chat.etat === 'dessus') {
    const c = G.chat;
    c.t += dt;
    c.pos = Math.sin(c.t * 1.6) * 0.9;
    if (c.t > 4.2 || !G.items.length) { c.etat = 'parti'; c.t = 0; G.chat = null; G.om -= c.pos * 0.3; }
  }
  for (const c of G.L.chats) {
    if (c.etat === 'attend' && G.wx >= c.x - 5 && !G.chute) {
      c.etat = 'dessus'; c.t = 0; G.chat = c; Son.miaou(); G.om += 0.2;
    }
    if (c.etat === 'parti') c.t += dt;
  }

  // Courant d'air
  G.vent = 0;
  for (const w of G.L.vents) {
    const d = G.wx - w.x;
    w.souffle = d > -40 && d < 30 ? 1 : lerp(w.souffle, 0, dt * 2);
    if (d > -12 && d < 26) {
      const env = Math.sin(clamp((d + 12) / 38, 0, 1) * Math.PI);
      G.vent += w.dir * 1.55 * env;
      if (!w.joue) { w.joue = true; Son.vent(); }
      if (Math.random() < dt * 20) G.parts.push({ type: 'feuille', x: G.wx - w.dir * 30 + Math.random() * 10, y: -10 - Math.random() * 40, vx: w.dir * (30 + Math.random() * 20), vy: (Math.random() - 0.5) * 6, r: Math.random() * TAU, vr: (Math.random() - 0.5) * 8, vie: 2 });
    }
  }

  // Équilibre de la pile (pendule renversé)
  const n = G.items.length;
  if (G.invul > 0) G.invul -= dt;
  if (!n || G.chute) {
    G.om += (-G.th * 10 - G.om * 5) * dt;
    G.th += G.om * dt;
  } else {
    let gel = 0, biais = 0;
    for (const it of G.items) {
      if (it.type === 'gelee') gel = Math.min(3, gel + 1);
      if (it.type === 'dinde') biais += it.cote * 0.8;
    }
    if (G.chat) biais += G.chat.pos * 1.25;
    biais += G.vent;
    if (cire) biais += Math.sin(G.t * 1.3) * 0.85;
    // A : la pile veut tomber (plus elle est haute, plus vite) ; D : amortissement
    // (l'appui donne une vitesse de redressement limitée, pas une accélération sans fin) ;
    // C : force de l'appui, toujours assez forte pour rattraper la pile.
    const A = P.grav * (2.2 + 0.16 * n) * (G.chat ? 1.15 : 1);
    const D = Math.max(1.7, 2.6 - 0.22 * gel);
    let C = (2.2 + 0.08 * n) * (cire ? 0.62 : 1);
    C = Math.max(C, A * 0.62 + Math.abs(biais) + 0.8);
    const bm = P.bruit * (1 + 0.45 * gel);
    const perturb = Math.sin(G.t * 6.2) * 1.2 * bm + Math.sin(G.t * 21) * 1.6 * gel * P.bruit;
    G.kick -= dt;
    if (G.kick <= 0) { G.om += (Math.random() - 0.5) * 0.8 * bm; G.kick = 0.5 + Math.random() * 0.9; }
    const acc = A * Math.sin(G.th) - C * u + biais + perturb - D * G.om;
    G.om += acc * dt;
    G.th += G.om * dt;

    // Soupières : elles débordent si la pile penche trop
    if (Math.abs(G.th) > 0.22) {
      const pile = positionsPile(G.items, G.th, -G.uVu * 0.15, mainServeur());
      G.items.forEach((it, k) => {
        if (it.type !== 'soupe' || it.f <= 0) return;
        const avantF = it.f;
        it.f = Math.max(0, it.f - dt * 0.55 * (Math.abs(G.th) - 0.22) / 0.1);
        if (Math.random() < dt * 30) {
          const p = pile.liste[k];
          G.parts.push({ type: 'goutte', x: p.x + Math.sign(G.th) * 4, y: p.y - 4, vx: Math.sign(G.th) * (6 + Math.random() * 6), vy: -4, vie: 1.5, c: '#f08a3c' });
        }
        if (avantF > 0.35 && it.f <= 0.35) Son.plouf();
      });
    }
    if (Math.abs(G.th) > 0.44) { G.alerte = 1; Son.alerte(); } else G.alerte = Math.max(0, G.alerte - dt * 3);
    if (Math.abs(G.th) > 0.62) patatras();
  }

  // Tables : on lâche pour servir
  G.dansTable = null;
  for (const s of G.stations) {
    if (s.type !== 'table') continue;
    s.joie = Math.max(0, s.joie - dt); s.rire = Math.max(0, s.rire - dt); s.triste = Math.max(0, s.triste - dt);
    if (s.etat !== 'attente') continue;
    const zone = s.honneur ? 20 : 13;
    const d = G.wx - s.x;
    if (Math.abs(d) < zone) {
      G.dansTable = s;
      if (G.items.length && u === 0 && Math.abs(G.th) < 0.4 && !G.chute) {
        G.relache += dt;
        if (G.relache >= 0.28) servir(s);
      } else if (u !== 0) G.relache = 0;
    } else if (d >= zone) {
      s.etat = s.servis > 0 ? 'servie' : 'ratee';
      if (s.servis === 0) { s.triste = 3; if (!G.demo) { toast(tr('toast.rate')); Son.rate(); } }
    }
  }
  if (!G.dansTable) G.relache = 0;

  // Fin du niveau
  if (!G.termine && !G.chute && G.wx >= G.fin) {
    G.termine = true; G.finT = 1.1;
  }
  if (G.termine || G.chute) {
    G.finT -= dt;
    if (G.finT <= 0 && !G.fini) {
      G.fini = true;
      if (G.demo) { nouvellePartie(0, true); return; }
      finirNiveau();
    }
  }
  if (G.secousse > 0) G.secousse = Math.max(0, G.secousse - dt);
}

function servir(s) {
  const k = Math.min(s.cmd - s.servis, G.items.length);
  if (k <= 0) return;
  const pile = positionsPile(G.items, G.th, -G.uVu * 0.15, mainServeur());
  const partis = G.items.splice(G.items.length - k, k);
  const debut = pile.liste.slice(pile.liste.length - k);
  partis.forEach((it, j) => {
    const slot = s.plats.length;
    s.plats.push(null);
    const larg = s.honneur ? 42 : 26;
    const cols = s.honneur ? 7 : 4;
    const tx = s.x - larg / 2 + 4 + (slot % cols) * ((larg - 8) / Math.max(1, cols - 1));
    const ty = -18.2 - Math.floor(slot / cols) * 0.6;
    G.volants.push({ it, x0: debut[j].x, y0: debut[j].y, x1: tx, y1: ty, t: -j * 0.08, table: s, slot });
    if (it.type === 'soupe' && it.f < 0.35) { G.casses++; }
    else {
      G.servis++; G.score += 100;
      if (it.type === 'soupe' && it.f > 0.8) { G.score += 20; G.bonusSoupe++; }
    }
  });
  s.servis += k;
  s.etat = 'servie';
  if (s.servis >= s.cmd) { G.score += 50; G.tablesPleines++; }
  s.joie = 2.6;
  G.relache = 0;
  Son.service();
  confettis(s.x, -30, 26);
  if (!G.demo) toast(tr(s.honneur ? 'toast.honneur' : 'toast.servi'));
}

function patatras() {
  if (G.chute || G.invul > 0) return;
  const pile = positionsPile(G.items, G.th, -G.uVu * 0.15, mainServeur());
  const dir = Math.sign(G.th) || 1;
  G.items.forEach((it, k) => {
    const p = pile.liste[k];
    G.parts.push({ type: 'plat', it, x: p.x, y: p.y, vx: dir * (6 + Math.random() * 16) + (Math.random() - 0.5) * 6, vy: -8 - Math.random() * 14, r: p.a, vr: dir * (3 + Math.random() * 6), vie: 3 });
  });
  G.casses += G.items.length;
  G.items = [];
  G.chat = null;
  G.plateaux--;
  G.secousse = 0.5;
  Son.patatras(); Son.rires();
  for (const s of G.stations) if (s.type === 'table' && Math.abs(s.x - G.wx) < 120) s.rire = 2.8;
  if (G.demo) { G.invul = 1.2; G.th = 0; G.om = 0; return; }
  if (G.plateaux <= 0) {
    G.chute = true; G.finT = 1.8;
    toast(tr('toast.patatras'));
  } else {
    G.invul = 1.2; G.th = 0; G.om = 0;
    toast(tr(G.plateaux === 1 ? 'toast.dernier' : 'toast.patatras'));
  }
}

/* ---------------------------------------------------------------------
   Particules et effets
   --------------------------------------------------------------------- */
function confettis(x, y, n) {
  const cs = ['#ff5f6d', '#ffd36b', '#5bbf7a', '#5b8def', '#b06bd6', '#ff9f43'];
  for (let i = 0; i < n; i++) G.parts.push({ type: 'confetti', x: x + (Math.random() - 0.5) * 10, y, vx: (Math.random() - 0.5) * 34, vy: -16 - Math.random() * 18, r: Math.random() * TAU, vr: (Math.random() - 0.5) * 14, vie: 1.8 + Math.random(), c: cs[i % cs.length] });
}
function majParticules(dt) {
  for (const p of G.parts) {
    p.vie -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.type === 'confetti') { p.vy += 30 * dt; p.vx *= 1 - dt * 1.5; p.r += p.vr * dt; }
    else if (p.type === 'feuille') { p.vy += Math.sin(G.t * 5 + p.r) * 10 * dt; p.r += p.vr * dt; }
    else if (p.type === 'goutte') { p.vy += 60 * dt; if (p.y > 0) { p.vie = 0; G.taches.push({ x: p.x, r: 0.8 + Math.random() * 0.6, c: p.c }); } }
    else if (p.type === 'plat') {
      p.vy += 60 * dt; p.r += p.vr * dt;
      if (p.y > -0.5) {
        p.vie = 0;
        const c = p.it.type === 'gelee' ? REPAS[G.P.repas].gelee : COULEUR_PLAT[p.it.type];
        G.taches.push({ x: p.x, r: 2.2 + Math.random() * 1.5, c });
        for (let i = 0; i < 6; i++) G.parts.push({ type: 'eclat', x: p.x, y: -0.5, vx: (Math.random() - 0.5) * 26, vy: -6 - Math.random() * 10, vie: 0.8, c: i % 2 ? '#ffffff' : c });
      }
    } else if (p.type === 'eclat') { p.vy += 60 * dt; if (p.y > 0) { p.y = 0; p.vy *= -0.3; p.vx *= 0.6; } }
  }
  G.parts = G.parts.filter((p) => p.vie > 0);
  if (G.parts.length > 400) G.parts.splice(0, G.parts.length - 400);
  if (G.taches.length > 80) G.taches.splice(0, G.taches.length - 80);
  for (const v of G.volants) {
    v.t += dt * 2.2;
    if (v.t >= 1 && !v.pose) { v.pose = true; v.table.plats[v.slot] = v.it; }
  }
  G.volants = G.volants.filter((v) => !v.pose);
}

/* ---------------------------------------------------------------------
   Dessin : outils
   --------------------------------------------------------------------- */
function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function ellipse(c, x, y, rx, ry, couleur) { c.beginPath(); c.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, TAU); c.fillStyle = couleur; c.fill(); }
function cercle(c, x, y, r, couleur) { c.beginPath(); c.arc(x, y, Math.max(0.01, r), 0, TAU); c.fillStyle = couleur; c.fill(); }

// Un plat, dessiné en unités du jeu, l'origine au milieu du bas.
function dessinerPlat(c, it, temps, repas) {
  const T = it.type;
  if (T === 'soupe') { dessinerSoupiere(c, it, temps); return; }
  const lw = T === 'dinde' ? 7 : 6;
  // assiette
  ellipse(c, 0, -0.55, lw + 0.2, 1.05, 'rgba(0,0,0,.18)');
  ellipse(c, 0, -0.8, lw, 1.1, '#ffffff');
  ellipse(c, 0, -0.95, lw - 1.4, 0.7, '#eef1f5');
  c.strokeStyle = '#c9d2dc'; c.lineWidth = 0.18; c.beginPath(); c.ellipse(0, -0.8, lw, 1.1, 0, 0, TAU); c.stroke();
  if (T === 'puree') {
    ellipse(c, -0.6, -1.9, 3.1, 1.4, '#f6d264'); ellipse(c, -1.2, -2.4, 1.4, 0.6, '#fff0a8');
    for (let i = 0; i < 5; i++) cercle(c, 1.8 + (i % 3) * 0.8, -1.5 - Math.floor(i / 3) * 0.6, 0.42, '#4fae3f');
  } else if (T === 'poulet') {
    ellipse(c, 0.3, -2.0, 3, 1.25, '#b8692c'); ellipse(c, -0.3, -2.4, 1.6, 0.5, '#d88c48');
    c.fillStyle = '#fff6e6'; rrect(c, 3.1, -2.4, 1.6, 0.6, 0.3); c.fill();
    cercle(c, -3, -1.5, 0.6, '#5cb848'); cercle(c, -3.7, -1.3, 0.5, '#e2553a');
  } else if (T === 'salade') {
    for (let i = 0; i < 6; i++) ellipse(c, -2.6 + i * 1.05, -1.7 - (i % 2) * 0.5, 1.2, 0.8, i % 2 ? '#5cb848' : '#7fd35f');
    cercle(c, -0.8, -2.4, 0.6, '#e2553a'); cercle(c, 1.4, -2.2, 0.55, '#e2553a'); cercle(c, 0.4, -2.7, 0.35, '#f6d264');
  } else if (T === 'pates') {
    ellipse(c, 0, -1.8, 3.2, 1.2, '#f2c14e');
    c.strokeStyle = '#e0a832'; c.lineWidth = 0.25;
    for (let i = 0; i < 4; i++) { c.beginPath(); c.ellipse(-1.4 + i, -1.9, 1, 0.5, 0.4, 0, Math.PI * 1.6); c.stroke(); }
    ellipse(c, 0, -2.5, 1.5, 0.6, '#d94a2c'); cercle(c, 0.5, -2.7, 0.3, '#5cb848');
  } else if (T === 'gateau') {
    c.fillStyle = '#fff3e0'; c.beginPath(); c.moveTo(-3.4, -1); c.lineTo(3.4, -1); c.lineTo(3.4, -3.3); c.lineTo(-3.4, -3.3); c.closePath(); c.fill();
    c.fillStyle = '#f59ab5'; c.fillRect(-3.4, -2.2, 6.8, 0.6);
    c.fillStyle = '#f9c6d6'; rrect(c, -3.6, -4, 7.2, 0.9, 0.45); c.fill();
    cercle(c, 0, -4.4, 0.6, '#e2253a'); c.fillStyle = '#3f9b4f'; c.fillRect(-0.1, -5.2, 0.2, 0.6);
  } else if (T === 'tarte') {
    ellipse(c, 0, -1.6, 4.4, 1.05, '#c9752e'); ellipse(c, 0, -1.8, 3.7, 0.8, '#f2a33a');

    c.beginPath(); c.moveTo(-2, -4.5); c.lineTo(-3 + a, -9); c.stroke();
    c.beginPath(); c.moveTo(2, -4.5); c.lineTo(3 - a, -9); c.stroke();

  c.fillStyle = g.cheveux; c.beginPath(); c.arc(0, -8.7, 2.75, Math.PI, TAU); c.fill();

  else if (g.chapeau === 'voile') { c.fillStyle = 'rgba(255,255,255,.9)'; c.beginPath(); c.moveTo(-2.4, -10); c.quadraticCurveTo(0, -12.4, 2.4, -10); c.lineTo(3.6, -4); c.lineTo(-3.6, -4); c.closePath(); c.fill(); cercle(c, 0, -10.8, 0.6, '#f08bb0'); }
  else if (g.chapeau === 'haut') { c.fillStyle = '#222'; c.fillRect(-1.8, -14.2, 3.6, 3.4); c.fillRect(-2.8, -11, 5.6, 0.6); }
  else if (g.chapeau === 'beret') { ellipse(c, 0.4, -10.6, 2.8, 0.9, '#a8322a'); }

  if (humeur === 'rire') {

    c.beginPath(); c.arc(-0.9, -8.4, 0.45, Math.PI, TAU); c.stroke();
    c.beginPath(); c.arc(0.9, -8.4, 0.45, Math.PI, TAU); c.stroke();

    c.stroke();
  }
  c.restore();
}

function dessinerTable(c, s, temps, repas) {
  const R = REPAS[repas];
  const larg = s.honneur ? 46 : 30;
  const x = s.x;
  const humeur = s.rire > 0 ? 'rire' : s.joie > 0 ? 'joie' : s.triste > 0 ? 'triste' : '';
  // invités derrière
  const n = s.invites.length;
  s.invites.forEach((g, i) => dessinerInvite(c, g, x - larg / 2 + 4 + i * (larg - 8) / Math.max(1, n - 1), temps, humeur));
  // pieds et nappe
  c.fillStyle = '#7a4a2a'; c.fillRect(x - larg / 2 + 2, -13, 1.6, 13); c.fillRect(x + larg / 2 - 3.6, -13, 1.6, 13);
  c.fillStyle = R.nappe;
  c.beginPath(); c.moveTo(x - larg / 2 - 1, -14); c.lineTo(x + larg / 2 + 1, -14); c.lineTo(x + larg / 2 + 1.5, -6); c.lineTo(x - larg / 2 - 1.5, -6); c.closePath(); c.fill();
  c.fillStyle = R.bord;
  for (let i = 0; i < larg / 3; i++) { c.beginPath(); c.arc(x - larg / 2 - 1 + i * 3 + 1.5, -6, 1.5, 0, Math.PI); c.fill(); }
  c.fillStyle = 'rgba(0,0,0,.06)'; c.fillRect(x - larg / 2 - 1, -13, larg + 2, 1);
  if (s.honneur) {
    // dessert géant au milieu de la table d'honneur
    c.save(); c.translate(x, -14); c.scale(1.1, 1.1); dessinerDessert(c, prog.dessert, temps); c.restore();
  } else {
    // bougies
    cercle(c, x, -15.5, 0.6, '#ffd36b');
  }
  // plats servis
  s.plats.forEach((it, k) => {
    if (!it) return;
    const cols = s.honneur ? 7 : 4;
    const lx = s.x - larg / 2 + 4 + (k % cols) * ((larg - 8) / Math.max(1, cols - 1));
    c.save(); c.translate(lx, -14.2 - Math.floor(k / cols) * 0.6); c.scale(0.55, 0.55); dessinerPlat(c, it, temps, repas); c.restore();
  });
}

// Bulle de commande au-dessus d'une table : une assiette dessinée par plat voulu.
function dessinerBulle(c, s, temps, actif) {
  if (s.etat === 'ratee' && s.triste <= 0) return;
  const x = s.x, y = s.honneur ? -40 : -36;
  const n = s.etat === 'attente' ? s.cmd : s.servis;
  const w = Math.min(7, Math.max(1, n)) * 3.2 + 3;
  const pul = actif ? 1 + Math.sin(temps * 8) * 0.06 : 1;
  c.save(); c.translate(x, y); c.scale(pul, pul);
  c.fillStyle = s.etat === 'servie' ? '#dff5d8' : s.etat === 'ratee' ? '#e5e5e5' : '#ffffff';
  rrect(c, -w / 2, -2.6, w, 5.2, 2.4); c.fill();
  c.beginPath(); c.moveTo(-1.2, 2.5); c.lineTo(0, 4.4); c.lineTo(1.2, 2.5); c.fill();
  c.strokeStyle = actif ? '#f3b532' : 'rgba(0,0,0,.15)'; c.lineWidth = actif ? 0.5 : 0.25;
  rrect(c, -w / 2, -2.6, w, 5.2, 2.4); c.stroke();
  const m = Math.min(7, n);
  for (let i = 0; i < m; i++) {
    const px = -w / 2 + 3.1 + i * 3.2;
    ellipse(c, px, 0.4, 1.3, 0.5, '#c9d2dc');
    ellipse(c, px, 0.2, 1.2, 0.45, '#ffffff');
    ellipse(c, px, -0.2, 0.7, 0.35, s.etat === 'servie' ? '#5cb848' : '#f6a24a');
  }
  if (n > 7) { c.fillStyle = '#f6a24a'; for (let i = 0; i < 3; i++) cercle(c, w / 2 - 1.2, -1 + i * 1, 0.25, '#f6a24a'); }
  c.restore();
  // main ouverte : « lâche pour servir »
  if (actif && s.etat === 'attente') {
    c.save(); c.translate(x, y - 6.5 - Math.abs(Math.sin(temps * 5)) * 1); c.scale(0.9, 0.9);
    dessinerMain(c, true);
    c.restore();
  }
}
function dessinerMain(c, ouverte) {
  c.fillStyle = '#ffffff'; c.strokeStyle = '#4a2c1a'; c.lineWidth = 0.35;

  } else if (id === 'choux') {
    for (let r = 0; r < 5; r++) for (let i = 0; i <= 4 - r; i++) cercle(c, -4 + r + i * 2, -1.2 - r * 1.9, 1.1, '#e5a44a');
    c.strokeStyle = '#f7d27a'; c.lineWidth = 0.25; for (let i = 0; i < 6; i++) { c.beginPath(); c.moveTo(-4 + i * 0.4, -9 + i); c.lineTo(4 - i * 0.4, -9 + i * 1.2); c.stroke(); }
    cercle(c, 0, -10.4, 0.8, '#ffffff');
  } else if (id === 'tarte') {
    ellipse(c, 0, -1.3, 7.4, 1.7, '#c9752e'); ellipse(c, 0, -1.7, 6.6, 1.3, '#f2a33a');
    for (let i = 0; i < 7; i++) ellipse(c, -5 + i * 1.65, -1.8, 0.9, 0.5, '#ffe08a');
  } else if (id === 'glace') {
    c.fillStyle = '#d9a35a'; c.beginPath(); c.moveTo(-3, -4); c.lineTo(3, -4); c.lineTo(0, 0); c.closePath(); c.fill();
    cercle(c, -1.6, -5.4, 2.3, '#ffc3d6'); cercle(c, 1.6, -5.4, 2.3, '#bff0c4'); cercle(c, 0, -8.3, 2.4, '#fff2b0');
    cercle(c, 0, -10.8, 0.7, '#e2253a');
  } else if (id === 'buche') {
    c.fillStyle = '#6b3a1e'; rrect(c, -7, -5, 14, 5, 2.4); c.fill();
    c.strokeStyle = '#8d5130'; c.lineWidth = 0.35; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(-6, -1 - i); c.lineTo(6, -1.4 - i); c.stroke(); }
    ellipse(c, 7, -2.5, 1.2, 2.5, '#f1d1a6');
    c.fillStyle = '#3f9b4f'; c.beginPath(); c.ellipse(-2, -5.6, 1.4, 0.6, 0.4, 0, TAU); c.fill();
    cercle(c, -0.8, -5.8, 0.45, '#e2253a');
  } else {
    const cs = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc'];

    c.fillStyle = '#ffffff'; rrect(c, -4, -11, 8, 1.6, 0.8); c.fill();
    for (let i = 0; i < 4; i++) cercle(c, -3 + i * 2, -11.6, 0.4, cs[i]);
  }
  void temps;
}

function dessinerEnfant(c, k, temps) {
  const pas = temps * 18;
  c.save();
  const sens = k.vk >= 0 ? 1 : -1;
  c.scale(sens, 1);
  ellipse(c, 0, 0.2, 3.2, 0.6, 'rgba(0,0,0,.2)');
  c.strokeStyle = '#2c4a7a'; c.lineWidth = 1.3; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, -5); c.lineTo(Math.sin(pas) * 2.4, 0); c.stroke();
  c.beginPath(); c.moveTo(0, -5); c.lineTo(-Math.sin(pas) * 2.4, 0); c.stroke();
  c.fillStyle = k.couleur; rrect(c, -2, -10, 4, 5.6, 1.6); c.fill();
  c.strokeStyle = k.couleur; c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, -9); c.lineTo(2.6, -10.8 + Math.sin(pas) * 1.2); c.stroke();
  c.beginPath(); c.moveTo(0, -9); c.lineTo(-2.4, -7.6 - Math.sin(pas) * 1.2); c.stroke();
  cercle(c, 0.4, -12.4, 2.2, '#f2c9a0');
  c.fillStyle = k.fille ? '#a8522a' : '#3b2414';
  c.beginPath(); c.arc(0.4, -12.8, 2.3, Math.PI, TAU); c.fill();
  if (k.fille) { cercle(c, -2, -12, 0.9, '#a8522a'); }
  cercle(c, 1.4, -12.6, 0.3, '#2b1a10');
  c.strokeStyle = '#8a3b2a'; c.lineWidth = 0.3; c.beginPath(); c.arc(1.3, -11.6, 0.5, 0, Math.PI); c.stroke();
  c.restore();
}

function dessinerChat(c, couleur, temps, assis, saut) {
  c.save();
  if (saut) c.rotate(-0.3);
  ellipse(c, 0, -1.6, 2.6, 1.5, couleur);
  cercle(c, 2.3, -3.2, 1.3, couleur);
  c.fillStyle = couleur;
  c.beginPath(); c.moveTo(1.5, -4); c.lineTo(1.8, -5.3); c.lineTo(2.5, -4.3); c.fill();
  c.beginPath(); c.moveTo(2.6, -4.3); c.lineTo(3.3, -5.3); c.lineTo(3.4, -3.9); c.fill();
  c.strokeStyle = couleur; c.lineWidth = 0.6; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-2.4, -1.8); c.quadraticCurveTo(-4.2, -3 + Math.sin(temps * 4) * 0.8, -3.6, -4.6); c.stroke();
  cercle(c, 2.8, -3.4, 0.25, '#1d1d1d'); cercle(c, 1.9, -3.4, 0.25, '#1d1d1d');
  ellipse(c, 2.4, -2.7, 0.3, 0.2, '#f08bb0');
  if (!assis) { c.lineWidth = 0.5; for (let i = 0; i < 4; i++) { c.beginPath(); c.moveTo(-1.6 + i * 1.1, -0.5); c.lineTo(-1.6 + i * 1.1 + Math.sin(temps * 10 + i) * 0.4, 0); c.stroke(); } }
  c.restore();
}

/* ---------------------------------------------------------------------
   Dessin de la scène
