      c.moveTo(px - lk, yk); c.lineTo(px + lk * 0.9, yk - ph / 14); c.moveTo(px + lk, yk); c.lineTo(px - lk * 0.9, yk - ph / 14);
    }
    c.stroke();
    const feu = 0.5 + 0.5 * Math.sin(t / 400);
    c.fillStyle = 'rgba(255,60,80,' + (0.4 + 0.6 * feu) + ')'; rond(c, px, pb - ph, 3.5); c.fill();
    const gf = c.createRadialGradient(px, pb - ph, 1, px, pb - ph, 22);
    gf.addColorStop(0, 'rgba(255,60,80,' + (0.5 * feu) + ')'); gf.addColorStop(1, 'rgba(255,60,80,0)');
    c.fillStyle = gf; c.fillRect(px - 22, pb - ph - 22, 44, 44);
    // ondes radio qui partent du pylône
    c.strokeStyle = 'rgba(124,247,200,.35)'; c.lineWidth = 1.5;
    for (let k = 0; k < 3; k++) {
      const ph2 = ((t / 2200) + k / 3) % 1;
      c.globalAlpha = 1 - ph2;
      c.beginPath(); c.arc(px, pb - ph, 12 + ph2 * w * 0.22, -Math.PI * 0.35, Math.PI * 0.05); c.stroke();
    }
    c.globalAlpha = 1;
    // rue et brume
    c.fillStyle = '#07090b'; c.fillRect(0, sol, w, h - sol);
    for (let k = 0; k < 3; k++) {
      const by = sol - h * 0.04 + k * h * 0.05, dec = Math.sin(t / 5000 + k) * w * 0.05;
      const gb = c.createLinearGradient(0, by - 30, 0, by + 30);
      gb.addColorStop(0, 'rgba(120,200,190,0)'); gb.addColorStop(0.5, 'rgba(120,200,190,' + (0.06 + k * 0.02) + ')'); gb.addColorStop(1, 'rgba(120,200,190,0)');
      c.fillStyle = gb; c.fillRect(-w * 0.1 + dec, by - 30, w * 1.2, 60);
    }
    // réverbère cassé
    const rx = w * 0.9;
    c.strokeStyle = '#1d1a2c'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(rx, h); c.lineTo(rx, sol - h * 0.22); c.quadraticCurveTo(rx, sol - h * 0.26, rx - w * 0.06, sol - h * 0.26); c.stroke();
    const clig = Math.sin(t / 130) > 0.75 || Math.sin(t / 1700) > 0.2 ? 1 : 0.15;
    c.fillStyle = 'rgba(255,230,170,' + (0.8 * clig) + ')'; rond(c, rx - w * 0.06, sol - h * 0.25, 4); c.fill();
    if (clig > 0.5) {
      const gr = c.createRadialGradient(rx - w * 0.06, sol - h * 0.25, 2, rx - w * 0.06, sol, h * 0.25);
      gr.addColorStop(0, 'rgba(255,230,170,.18)'); gr.addColorStop(1, 'rgba(255,230,170,0)');
      c.fillStyle = gr; c.beginPath(); c.moveTo(rx - w * 0.06, sol - h * 0.25); c.lineTo(rx - w * 0.2, h); c.lineTo(rx + w * 0.08, h); c.closePath(); c.fill();
    }
  }

  // Écran titre (et fond des autres écrans).
  function dessinerFond(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (ecran === 'jeu') { dessinerVille(c, w, h, t, { sol: 0.62, luneY: 0.3 }); c.fillStyle = 'rgba(5,4,14,.55)'; c.fillRect(0, 0, w, h); return; }
    dessinerVille(c, w, h, t, { sol: 0.66 });
    if (ecran !== 'titre') { c.fillStyle = 'rgba(5,4,14,.6)'; c.fillRect(0, 0, w, h); return; }
    // la radio posée sur une caisse, entre le titre et le panneau des boutons
    let haut = h * 0.3, bas = h * 0.62;
    try {
      const a = $('age').getBoundingClientRect(), p = document.querySelector('#ecran-titre .panneau').getBoundingClientRect();
      if (a.bottom > 0 && p.top > a.bottom + 60) { haut = a.bottom + 30; bas = p.top - 6; }
    } catch (e) { /* mise en page pas prête */ }
    const place = Math.max(60, bas - haut);
    const rw = Math.min(w * 0.62, 300, place / 1.5 / 0.62), rh = rw * 0.62;
    const rx = w / 2 - rw / 2, ry = haut + (place - rh * 1.46) / 2;
    c.fillStyle = '#3b2a1c'; rr(c, rx - rw * 0.08, ry + rh * 1.04, rw * 1.16, rh * 0.42, 6); c.fill();
    c.strokeStyle = '#24170d'; c.lineWidth = 3;
    for (let k = 1; k < 3; k++) { c.beginPath(); c.moveTo(rx - rw * 0.08, ry + rh * (1.04 + k * 0.14)); c.lineTo(rx + rw * 1.08, ry + rh * (1.04 + k * 0.14)); c.stroke(); }
    // halo vert de la radio
    const gh = c.createRadialGradient(w / 2, ry + rh * 0.4, 10, w / 2, ry + rh * 0.4, rw);
    gh.addColorStop(0, 'rgba(92,242,180,.25)'); gh.addColorStop(1, 'rgba(92,242,180,0)');
    c.fillStyle = gh; c.fillRect(0, ry - rw, w, rw * 2.4);
    dessinerRadio(c, rx, ry, rw, rh, { radio: prog.radio, aiguille: 0.5 + Math.sin(t / 1300) * 0.25, lueur: 0.8 + 0.2 * Math.sin(t / 200), t: t, ondes: 1 });
    // notes qui s'échappent (formes des boutons)
    for (let k = 0; k < 6; k++) {
      const ph = ((t / 4200) + k / 6) % 1;
      const nx = w / 2 + Math.sin(ph * 6 + k * 2) * rw * 0.5 + (k - 2.5) * rw * 0.12, ny = ry - ph * Math.max(20, ry - haut + 10);
      c.globalAlpha = Math.sin(ph * Math.PI) * 0.9;
      c.fillStyle = TOUCHES[k].c; c.strokeStyle = TOUCHES[k].c;
      c.shadowColor = TOUCHES[k].c; c.shadowBlur = 10;
      forme(c, k, nx, ny, 9 + 3 * Math.sin(ph * 3));
      c.shadowBlur = 0;
    }
    c.globalAlpha = 1;
  }

  // Une cassette (sans aucune inscription), pour la collection.
  function dessinerCassette(c, w, h, k, ouverte, t) {
    c.clearRect(0, 0, w, h);
    const al = graineHasard(300 + k * 17);
    const teintes = ['#7a1f3d', '#1f4d7a', '#3d7a1f', '#6b3d8f', '#8f5a1f', '#1f7a6b', '#8f1f1f', '#4d4d6b', '#2a6b8f', '#7a6b1f'];
    c.save();
    c.fillStyle = ouverte ? teintes[k] : '#2b2747';
    rr(c, w * 0.05, h * 0.1, w * 0.9, h * 0.8, 10); c.fill();
    c.strokeStyle = '#0008'; c.lineWidth = 2; c.stroke();
    c.fillStyle = ouverte ? '#e9e2cf' : '#3a3560';
    rr(c, w * 0.14, h * 0.18, w * 0.72, h * 0.4, 6); c.fill();
    // griffures et taches de l'étiquette (sans texte)
    if (ouverte) {
      c.strokeStyle = '#7a1f3d88'; c.lineWidth = 2;
      for (let i = 0; i < 4; i++) { c.beginPath(); const x0 = w * (0.2 + al() * 0.5), y0 = h * (0.22 + al() * 0.25); c.moveTo(x0, y0); c.lineTo(x0 + w * 0.12, y0 + (al() - 0.5) * h * 0.1); c.stroke(); }
    }
    c.fillStyle = '#120e0a'; rr(c, w * 0.26, h * 0.3, w * 0.48, h * 0.18, h * 0.09); c.fill();
    const a = ouverte ? t / 400 : 0;
    [0.36, 0.64].forEach((p) => {
      c.fillStyle = '#e9e2cf'; rond(c, w * p, h * 0.39, h * 0.07); c.fill();
      c.strokeStyle = '#120e0a'; c.lineWidth = 2;
      for (let i = 0; i < 3; i++) { const b = a + i * 2.09; c.beginPath(); c.moveTo(w * p, h * 0.39); c.lineTo(w * p + Math.cos(b) * h * 0.06, h * 0.39 + Math.sin(b) * h * 0.06); c.stroke(); }
    });
    c.fillStyle = '#0006'; rr(c, w * 0.3, h * 0.66, w * 0.4, h * 0.18, 4); c.fill();
    if (!ouverte) {
      c.fillStyle = '#9a94c0';
      rr(c, w * 0.43, h * 0.62, w * 0.14, h * 0.2, 3); c.fill();
      c.strokeStyle = '#9a94c0'; c.lineWidth = 3; c.beginPath(); c.arc(w * 0.5, h * 0.62, w * 0.045, Math.PI, 0); c.stroke();
    }
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  État de l'écran de jeu
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  let partie = null;
  let session = null;          // 'solo' | 'ligne'
  let niveau = 1;
  let vue = null;              // état affiché (copie de l'état de la partie)
  let enPause = false;
  let enPartie = false;        // partie solo en cours (pour la sauvegarde à la fermeture)
  let jeton = 0;
  let debutTour = Date.now();
  let dernierTic = -1;
  let humainsAvant = null;
  let dernierAttends = 0;
  let attenteTuto = false;
  let finManche = 0;

  // Horloge du jeu : elle s'arrête pendant la pause et les tutoriels.
  let horloge = 0;
  let mode = 'idle';           // 'idle' | 'diffusion' | 'saisie' | 'envoi'
  let diff = null;             // diffusion de la suite (à son tour)
  let saisie = null;           // { att, entree }
  let anim = null;             // coup d'un auditeur en cours d'affichage
  const lumieres = TOUCHES.map(() => ({ t0: -1e9, d: 0, k: '' }));
  let aiguille = 0.5, aiguilleCible = 0.5, couleurAiguille = '#ff3b3b';
  let parasiteT = -1e9;
  const etincelles = [];
  let indexEnCours = -1;       // point de la suite allumé pendant la diffusion
  let dernierRes = null;       // dernier résultat affiché (message)

  function allumer(b, d, k) { lumieres[b] = { t0: horloge, d: d, k: k }; }
  function viserAiguille(b) { aiguilleCible = (b + 0.5) / B; }

  // ---------------------------------------------------------------------
  //  Écrans
  // ---------------------------------------------------------------------

  let rafFond = 0;
  function boucleFond(t) {
    rafFond = 0;
    if (ecran === 'jeu') return;
    dessinerFond(t);
    rafFond = requestAnimationFrame(boucleFond);
  }
  function afficherEcran(nom) {
    ecran = nom;
    document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === 'ecran-' + nom));
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') { dessinerFond(performance.now()); tPrec = 0; relancerBoucle(); }
    else if (!rafFond) rafFond = requestAnimationFrame(boucleFond);
  }

  function construirePave() {
    const pave = $('pave');
    pave.textContent = '';
    for (let b = 0; b < B; b++) {
      const bt = document.createElement('button');
      bt.type = 'button';
      bt.className = 'touche';
      bt.id = 'touche-' + b;
      bt.style.setProperty('--c', TOUCHES[b].c);
      bt.style.setProperty('--s', TOUCHES[b].s);
      bt.innerHTML = '<svg viewBox="0 0 40 40" aria-hidden="true">' + FORMES_SVG[b] + '</svg>';
      bt.setAttribute('aria-label', tr('touche.' + b, { n: b + 1 }));
      bt.addEventListener('pointerdown', (ev) => { ev.preventDefault(); audio(); clavier = false; toucher(b); });
      bt.addEventListener('click', (ev) => { if (ev.detail === 0) { audio(); toucher(b); } });
      pave.appendChild(bt);
    }
  }

  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s;
      d.style.setProperty('--c', COUL[s]);
      d.setAttribute('role', 'group');
      const cv = document.createElement('canvas'); cv.className = 'embleme'; cv.width = 84; cv.height = 84;
      const co = document.createElement('canvas'); co.className = 'couronne'; co.width = 44; co.height = 34;
      couronne(co.getContext('2d'), 22, 18, 36);
      const indic = document.createElement('span'); indic.className = 'indic';
      const tag = document.createElement('span'); tag.className = 'tag';
      const piles = document.createElement('span'); piles.className = 'piles';
      d.append(cv, co, indic, tag, piles);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 92; cv.height = 92;
      const indic = document.createElement('span'); indic.className = 'indic'; indic.style.color = COUL[s];
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, indic, tag);
      salon.appendChild(d);
    }
  }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : role === 'robot' ? ICONE_ROBOT : '');
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  // Nom court d'une place pour les messages : pseudo, « Toi », ou l'indicatif du robot.
  function nomCourt(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    if (info.humain && info.nom) return info.nom;
    return tr('indicatif.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && O.enVie(e).length > 1 ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const absent = e ? e.pi[s] < 0 : false;
      const piles = e ? Math.max(0, e.pi[s]) : 3, max = e ? Math.max(0, e.p0[s]) : 3;
      const cle = (absent ? 'a' : 'p') + piles + '/' + max;
      if (d.dataset.piles !== cle) {
        d.dataset.piles = cle;
        const boite = d.querySelector('.piles');
        boite.textContent = '';
        for (let k = 0; k < max; k++) { const p = document.createElement('span'); p.className = 'pile' + (k < piles ? '' : ' vide'); boite.appendChild(p); }
        const cv = d.querySelector('canvas.embleme').getContext('2d');
        cv.clearRect(0, 0, 84, 84);
        embleme(cv, s, 42, 42, 40, absent || (e && piles <= 0));
      }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('absent', absent);
      d.classList.toggle('out', !absent && !!e && piles <= 0);
      const role = absent ? 'absent' : roleDe(info);
      const indic = tr('indicatif.' + s);
      if (d.querySelector('.indic').textContent !== indic) d.querySelector('.indic').textContent = indic;
      remplirTag(d.querySelector('.tag'), role, role === 'absent' ? tr('place.absent') : nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { indicatif: indic, n: piles }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function moiElimine() { return vue && partie && partie.siege >= 0 && vue.pi[partie.siege] === 0; }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (partie.siege < 0) return tr('multi.attente');
    if (anim) return '';
    if (mode === 'diffusion') return tr('tour.ecoute');
    if (mode === 'saisie' && saisie) {
      if (saisie.entree.length >= saisie.att.length) return tr('tour.ajoute');
      return tr('tour.rejoue', { k: saisie.entree.length, n: saisie.att.length });
    }
    if (moiElimine()) return tr('tour.elimine');
    const s = R.aQui(e);
    if (s === partie.siege) return tr('tour.toi');
    return tr('tour.de', { nom: nomCourt(s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') {
      const c = NIVEAUX[niveau - 1].c;
      info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + ' · ' + tr('jeu.cible', { a: c[0], b: c[1] });
    } else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    let m = texteMessage();
    const res = dernierRes && horloge - dernierRes.t < 900 && mode !== 'diffusion' && mode !== 'saisie' ? dernierRes : null;
    if (anim && !anim.moi && anim.phase !== 'res') m = tr('tour.rejouePour', { nom: nomCourt(anim.siege) });
    else if (res) m = tr(res.moi ? (res.ok ? 'res.okToi' : 'res.errToi') : (res.ok ? 'res.ok' : 'res.err'), { nom: nomCourt(res.s) });
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Phrase des pièges actifs pendant ce tour.
  function textePieges(e) {
    if (!e) return '';
    const l = [];
    if (O.nbVoix(e) > 0) l.push(tr('piege.voix'));
    if (e.inv) l.push(tr('piege.inv'));
    if (e.ec) l.push(tr('piege.echo'));
    if (e.an >= 0) l.push(tr('piege.antenne'));
    if (e.nu) l.push(tr('piege.nuit'));
    return l.join(' · ');
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain && O.enVie(e).length > 1) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  let toastMinuteur = 0;
  function toast(texte, duree, rouge) {
    const t = $('toast');
    t.textContent = texte;
    t.classList.toggle('rouge', !!rouge);
    t.classList.add('actif');
    clearTimeout(toastMinuteur);
    toastMinuteur = setTimeout(() => t.classList.remove('actif'), duree || 2200);
  }

  // ---------------------------------------------------------------------
  //  Diffusion (à son tour), saisie, et coups des autres
  // ---------------------------------------------------------------------

  const INTRO = 650;

  // Prépare la diffusion de la suite pour le joueur de l'appareil.
  function lancerDiffusion() {
    const e = vue;
    const att = O.attendu(e);
    const L = O.base(e).length;
    let pas = Math.max(400, 640 - L * 12);
    if (e.ec) pas = Math.round(pas / 2);
    // Chaque note de la suite, avec sa place dans ce qu'il faut rejouer.
    const liste = [];
    let k = 0;
    e.ch.forEach((x, i) => {
      if (x >= O.VOIX) liste.push({ b: x - O.VOIX, voix: true, i: i });
      else { liste.push({ b: x, voix: false, i: i, k: k, inv: !!(e.inv && k >= e.inv[0] && k < e.inv[0] + e.inv[1]) }); k++; }
    });
    diff = { liste: liste, pas: pas, t0: horloge, idx: -1, nuit: !!e.nu, an: e.an };
    saisie = { att: att, entree: [] };
    mode = 'diffusion';
    indexEnCours = -1;
    $('piege').textContent = textePieges(e);
    sons.debut();
    parasiteT = horloge - 300;
    majInfos();
  }

  function finDiffusion() {
    diff = null;
    indexEnCours = -1;
    mode = 'saisie';
    aiguilleCible = 0.5;
    sons.tour();
    if (!saisie.att.length) { /* suite vide : seulement ajouter */ }
    majInfos();
    if (clavier) { try { $('touche-0').focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  }
  let clavier = false;          // le joueur se sert du clavier (focus sur les boutons)

  function avancerDiffusion() {
    if (!diff) return;
    const t = horloge - diff.t0 - INTRO;
    const i = Math.floor(t / diff.pas);
    if (i > diff.idx && i < diff.liste.length) {
      diff.idx = i;
      const n = diff.liste[i];
      indexEnCours = n.i;
      const d = diff.pas * 0.62;
      viserAiguille(n.b);
      couleurAiguille = n.voix ? '#ff1f4b' : '#ff3b3b';
      if (n.voix) {
        if (!diff.nuit) allumer(n.b, d, 'voix');
        sons.voix(n.b, d / 1000);
      } else {
        if (diff.nuit) { /* nuit sans lumière : son et aiguille seulement */ }
        else if (n.b === diff.an) { allumer(n.b, d, 'gres'); sons.gres(); }
        else allumer(n.b, d, 'on');
        sons.ton(n.b, d / 1000);
      }
    }
    if (t > diff.liste.length * diff.pas + 150) finDiffusion();
  }

  // Le joueur touche un bouton.
  function toucher(b) {
    if (ecran !== 'jeu' || enPause || attenteTuto) return;
    if (mode === 'saisie' && saisie && partie && partie.monTour()) {
      const k = saisie.entree.length;
      saisie.entree.push(b);
      viserAiguille(b);
      couleurAiguille = '#ff3b3b';
      if (k < saisie.att.length) {
        if (saisie.att[k] !== b) {
          // erreur : le coup part tout de suite
          allumer(b, 260, 'on');
          sons.ton(b, 0.22);
          envoyer();
          return;
        }
        allumer(b, 260, 'on');
        sons.ton(b, 0.26);
        majInfos();
        return;
      }
      // la note ajoutée
      allumer(b, 420, 'ajout');
      sons.ton(b, 0.3);
      envoyer();
      return;
    }
    // Hors de son tour : le bouton sonne quand même, doucement.
    allumer(b, 160, 'fantome');
    sons.ton(b, 0.15);
    if (partie && partie.phase === 'jeu' && mode === 'diffusion') return;
    if (partie && partie.phase === 'jeu' && !moiElimine() && Date.now() - dernierAttends > 1800) {
      dernierAttends = Date.now();
      toast(tr('tour.attends'), 1300);
    }
  }

  function envoyer() {
    if (!partie || !saisie) return;
    const a = saisie.entree.slice();
    mode = 'envoi';
    if (!partie.jouer(a)) { mode = 'idle'; saisie = null; }
    majInfos();
  }

  // Un coup arrive (le sien ou celui d'un autre).
  function surAction(ev) {
    terminerAnim();
    debutTour = Date.now();
    dernierTic = -1;
    const a = Array.isArray(ev.action) ? ev.action : [];
    const ok = ev.apres.der ? ev.apres.der.ok === 1 : false;
    const rejouer = !ev.moi || ev.auto;
    // Les coups des autres arrivent toutes les R.delaiBot ms : leur reprise
    // s'affiche en accéléré (380 ms au plus), puis le résultat.
    const n = rejouer ? a.length : 0;
    const dur = n ? Math.min(95, 380 / n) : 0;
    anim = { t0: horloge, notes: a, dur: dur, n: n, siege: ev.siege, ok: ok, apres: ev.apres, avant: ev.avant, moi: ev.moi, phase: 'rejoue', idx: -1, auto: ev.auto };
    if (ev.moi) { mode = 'idle'; saisie = null; diff = null; }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    $('piege').textContent = '';
  }

  function avancerAnim() {
    if (!anim) return;
    const t = horloge - anim.t0;
    if (anim.phase === 'rejoue') {
      const i = Math.floor(t / Math.max(1, anim.dur));
      if (anim.n && i > anim.idx && i < anim.n) {
        anim.idx = i;
        const b = anim.notes[i];
        allumer(b, anim.dur * 0.75, 'fantome');
        viserAiguille(b);
        sons.ton(b, Math.min(0.18, anim.dur / 1000));
      }
      if (t >= anim.n * anim.dur + 40) {
        anim.phase = 'res';
        anim.tRes = horloge;
        resultatCoup();
      }
    } else if (t - (anim.tRes - anim.t0) > 200) terminerAnim();
  }

  // Résultat d'un coup : note ajoutée, ou parasites et pile perdue.
  function resultatCoup() {
    const a = anim, carte = $('place-' + a.siege);
    vue = JSON.parse(JSON.stringify(a.apres));
    dernierRes = { s: a.siege, ok: a.ok, moi: a.moi && !a.auto, t: horloge };
    if (a.ok) {
      const b = a.notes[a.notes.length - 1];
      allumer(b, 500, 'ajout');
      sons.ajout();
      jaillir(b);
      carte.classList.remove('gagne'); void carte.offsetWidth; carte.classList.add('gagne');
      if (a.apres.der && a.apres.der.v >= 0) setTimeout(() => { if (anim === a || !anim) { sons.voix(a.apres.ch[a.apres.der.v] - O.VOIX, 0.5); } }, 380);
    } else {
      parasiteT = horloge;
      sons.erreur();
      sons.pile();
      if (a.notes.length) { const b = a.notes[a.notes.length - 1]; const bt = $('touche-' + b); bt.classList.remove('erreur'); void bt.offsetWidth; bt.classList.add('erreur'); }
      carte.classList.remove('perd'); void carte.offsetWidth; carte.classList.add('perd');
      if (a.apres.pi[a.siege] === 0 && !R.fin(a.apres)) toast(tr(a.moi ? 'res.elimineToi' : 'res.elimine', { nom: nomCourt(a.siege) }), 2200, true);
    }
    majInterface();
  }

  function terminerAnim() {
    if (!anim) return;
    if (anim.phase !== 'res') { anim.phase = 'res'; resultatCoup(); }
    vue = JSON.parse(JSON.stringify(anim.apres));
    anim = null;
    majInterface();
  }

  // Étincelles quand une note est ajoutée (au-dessus de la radio).
  function jaillir(b) {
    const z = $('zone'), w = z.clientWidth, h = z.clientHeight;
    const x = w * 0.5 + (b - 2.5) * w * 0.12, y = h * 0.82;
    for (let k = 0; k < 16; k++) {
      const an = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 90 + Math.random() * 170;
      etincelles.push({ x: x, y: y, vx: Math.cos(an) * v, vy: Math.sin(an) * v, vie: 0.7 + Math.random() * 0.4, k: 3 + Math.random() * 4, coul: k % 2 ? TOUCHES[b].c : '#ffe08a', b: b });
    }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu') return;
    const dt = Math.min(0.1, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (!enPause && !attenteTuto) {
      horloge += dt * 1000;
      avancerAnim();
      avancerDiffusion();
      // Son tour commence : la radio diffuse la suite.
      if (mode === 'idle' && !anim && partie && vue && partie.monTour()) lancerDiffusion();
      if ((mode === 'diffusion' || mode === 'saisie') && partie && !partie.monTour() && !anim) { mode = 'idle'; diff = null; saisie = null; $('piege').textContent = ''; }
    }
    aiguille += (aiguilleCible - aiguille) * Math.min(1, dt * 12);
    majTouches();
    dessinerZone(performance.now(), dt);
    majTemps();
    majCompte();
    majInfos();
    rafId = requestAnimationFrame(boucle);
  }

  // Lumières des 6 boutons.
  function majTouches() {
    const morte = mode === 'diffusion' && diff && diff.an >= 0 ? diff.an : -1;
    for (let b = 0; b < B; b++) {
      const l = lumieres[b];
      let k = horloge - l.t0 < l.d ? l.k : '';
      const bt = $('touche-' + b);
      if (!bt) continue;
      const cle = k + (b === morte ? '|m' : '') + (mode === 'diffusion' && diff && diff.nuit ? '|n' : '');
      if (bt.dataset.lum === cle) continue;
      bt.dataset.lum = cle;
      bt.classList.toggle('on', k === 'on');
      bt.classList.toggle('fantome', k === 'fantome');
      bt.classList.toggle('ajout', k === 'ajout');
      bt.classList.toggle('voix', k === 'voix');
      bt.classList.toggle('gres', k === 'gres');
      bt.classList.toggle('morte', b === morte || (mode === 'diffusion' && diff && diff.nuit));
    }
  }

  // La radio : cadran, aiguille, pièges, suite en points, parasites.
  function dessinerZone(t, dt) {
    const cv = $('radio'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const sec = Math.max(0, 1 - (horloge - parasiteT) / 650);
    c.save();
    if (sec > 0) c.translate((Math.random() - 0.5) * 10 * sec, (Math.random() - 0.5) * 6 * sec);
    // radio
    const rw = Math.min(w * 0.82, h * 1.25, 420), rh = Math.min(rw * 0.58, h * 0.6);
    const rx = (w - rw) / 2, ry = Math.max(h * 0.2, h * 0.5 - rh * 0.62);
    const sonRecent = Math.max(0, 1 - (performance.now() - dernierSon) / 500);
    dessinerRadio(c, rx, ry, rw, rh, {
      radio: prog.radio, aiguille: aiguille, lueur: (diff && diff.nuit) ? 0.05 : 0.4 + 0.6 * sonRecent, t: t,
      ondes: sonRecent, couleurAiguille: couleurAiguille,
      yeux: Math.max(0, 1 - (performance.now() - dernierVoix) / 900)
    });
    // pièges du tour : icônes au-dessus de la radio
    if (vue && (mode === 'diffusion' || mode === 'saisie')) {
      const ic = [];
      if (O.nbVoix(vue) > 0) ic.push('voix');
      if (vue.inv) ic.push('inv');
      if (vue.ec) ic.push('echo');
      if (vue.an >= 0) ic.push('ant');
      if (vue.nu) ic.push('nuit');
      ic.forEach((k, i) => iconePiege(c, k, w / 2 + (i - (ic.length - 1) / 2) * 40, Math.max(18, ry - rh * 0.42), 15, t));
    }
    // la suite en points (sans couleur : il faut s'en souvenir)
    if (vue) dessinerSuite(c, w, ry + rh + rh * 0.12, Math.min(h - 6, ry + rh + rh * 0.12 + 40));
    // parasites
    if (sec > 0) {
      for (let i = 0; i < 70 * sec; i++) {
        c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,' + (0.5 * sec) + ')' : 'rgba(255,60,90,' + (0.4 * sec) + ')';
        c.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 30, 1.5);
      }
    }
    c.restore();
    // étincelles
    for (let i = etincelles.length - 1; i >= 0; i--) {
      const p = etincelles[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      if (p.vie <= 0) { etincelles.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      forme(c, p.b, p.x, p.y, p.k);
      c.globalAlpha = 1;
    }
    // nuit sans lumière : tout s'assombrit autour de la radio
    if (diff && diff.nuit) {
      const g = c.createRadialGradient(w / 2, ry + rh * 0.3, rw * 0.15, w / 2, ry + rh * 0.3, rw * 0.9);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.7)');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
    }
  }

  // Points de la suite : rouges pour la Voix, rayés pour l'interférence,
  // remplis au fur et à mesure de la saisie, un point « + » pour la note à ajouter.
  function dessinerSuite(c, w, y0, y1) {
    const e = vue, n = e.ch.length + 1;
    const y = (y0 + y1) / 2;
    const pas = Math.min(26, (w - 30) / n), r = Math.max(4, Math.min(8, pas * 0.32));
    const x0 = w / 2 - (n - 1) * pas / 2;
    let k = 0;
    const tape = mode === 'saisie' && saisie ? saisie.entree.length : (mode === 'envoi' && saisie ? saisie.entree.length : -1);
    // passage inversé : les positions à rejouer à l'envers
    for (let i = 0; i < e.ch.length; i++) {
      const x = x0 + i * pas, voix = e.ch[i] >= O.VOIX;
      const inv = !voix && e.inv && k >= e.inv[0] && k < e.inv[0] + e.inv[1];
      const allume = i === indexEnCours;
      c.save();
      if (voix) {
        c.strokeStyle = '#ff4d6d'; c.lineWidth = 2; c.fillStyle = allume ? '#ff4d6d' : 'rgba(255,77,109,.18)';
        rond(c, x, y, r); c.fill(); c.stroke();
        c.strokeStyle = '#ff4d6d'; c.beginPath(); c.moveTo(x - r, y - r); c.lineTo(x + r, y + r); c.stroke();
      } else {
        const fait = tape > k;
        c.fillStyle = allume ? '#ffffff' : fait ? '#5cf2b4' : '#2c2750';
        if (allume) { c.shadowColor = '#fff'; c.shadowBlur = 12; }
        rond(c, x, y, r); c.fill();
        c.shadowBlur = 0;
        c.strokeStyle = inv ? '#ffd166' : '#5e5794'; c.lineWidth = inv ? 2 : 1.4; c.stroke();
        if (inv) {
          c.save(); rond(c, x, y, r); c.clip();
          c.strokeStyle = '#ffd16699'; c.lineWidth = 1.5;
          for (let s2 = -2; s2 <= 2; s2++) { c.beginPath(); c.moveTo(x - r + s2 * 4, y + r); c.lineTo(x + r + s2 * 4, y - r); c.stroke(); }
          c.restore();
        }
        k++;
      }
      c.restore();
    }
    // flèche sous le passage inversé
    if (e.inv && (mode === 'diffusion' || mode === 'saisie')) {
      let kk = 0, xa = null, xb = null;
      for (let i = 0; i < e.ch.length; i++) {
        if (e.ch[i] >= O.VOIX) continue;
        if (kk === e.inv[0]) xa = x0 + i * pas;
        if (kk === e.inv[0] + e.inv[1] - 1) xb = x0 + i * pas;
        kk++;
      }
      if (xa !== null && xb !== null) {
        c.strokeStyle = '#ffd166'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(xb, y + r + 6); c.lineTo(xa, y + r + 6); c.lineTo(xa + 6, y + r + 2); c.moveTo(xa, y + r + 6); c.lineTo(xa + 6, y + r + 10); c.stroke();
      }
    }
    // la place de la note à ajouter
    const xp = x0 + e.ch.length * pas;
    c.strokeStyle = '#ffe08a'; c.setLineDash([3, 3]); c.lineWidth = 1.5;
    rond(c, xp, y, r); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.moveTo(xp - r * 0.5, y); c.lineTo(xp + r * 0.5, y); c.moveTo(xp, y - r * 0.5); c.lineTo(xp, y + r * 0.5); c.stroke();
  }

  // Icône d'un piège (dessin, sans texte).
  function iconePiege(c, k, x, y, r, t) {
    c.save();
    c.fillStyle = '#120f24'; c.strokeStyle = k === 'voix' ? '#ff4d6d' : '#ffd166'; c.lineWidth = 2;
    rond(c, x, y, r); c.fill(); c.stroke();
    c.lineWidth = 2; c.lineCap = 'round';
    if (k === 'voix') {      // bouche ouverte qui chante
      c.fillStyle = '#ff4d6d'; ell(c, x, y + 1, r * 0.45, r * 0.32 + Math.sin(t / 150) * r * 0.08); c.fill();
      c.fillStyle = '#120f24'; ell(c, x, y + 1, r * 0.28, r * 0.15); c.fill();
    } else if (k === 'inv') { // deux flèches qui se croisent
      c.beginPath(); c.moveTo(x - r * 0.5, y - r * 0.25); c.lineTo(x + r * 0.5, y - r * 0.25); c.lineTo(x + r * 0.3, y - r * 0.45);
      c.moveTo(x + r * 0.5, y + r * 0.25); c.lineTo(x - r * 0.5, y + r * 0.25); c.lineTo(x - r * 0.3, y + r * 0.45); c.stroke();
    } else if (k === 'echo') { // doubles chevrons
      [-0.35, 0.05].forEach((d) => { c.beginPath(); c.moveTo(x + r * d, y - r * 0.4); c.lineTo(x + r * (d + 0.3), y); c.lineTo(x + r * d, y + r * 0.4); c.stroke(); });
    } else if (k === 'ant') {  // antenne
      c.beginPath(); c.moveTo(x, y + r * 0.55); c.lineTo(x, y - r * 0.3); c.moveTo(x - r * 0.35, y + r * 0.55); c.lineTo(x, y - r * 0.05); c.lineTo(x + r * 0.35, y + r * 0.55); c.stroke();
      c.beginPath(); c.arc(x, y - r * 0.35, r * 0.3, -Math.PI * 0.8, -Math.PI * 0.2); c.stroke();
    } else if (k === 'nuit') { // lune
      c.fillStyle = '#ffd166'; rond(c, x, y, r * 0.5); c.fill();
      c.fillStyle = '#120f24'; rond(c, x + r * 0.22, y - r * 0.15, r * 0.42); c.fill();
    }
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function remiseAZeroTour() {
    anim = null; diff = null; saisie = null; mode = 'idle'; indexEnCours = -1; dernierRes = null;
    $('piege').textContent = '';
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    remiseAZeroTour();
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 92, 92);
        embleme(c, s, 46, 50, 38, false);
        if (info.chef) couronne(c, 46, 12, 26);
        d.querySelector('.indic').textContent = tr('indicatif.' + s);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { indicatif: tr('indicatif.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef || tr('indicatif.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';

  function surManche() {
    jeton++;
    remiseAZeroTour();

    debutTour = Date.now();

    fermerVoile('voile-salon');

    finEnAttente = false;

    else enPartie = true;

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }

    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;

      terminerAnim();

  function gagnant(e) {
    const r = R.fin(e);
    return r ? r.classement[0] : -1;

    finEnAttente = false;

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3, 4];
    let rang = 0;
    ordre.forEach((s) => {
      if (e.pi[s] < 0) return;          // place absente (solo)
      rang++;
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; embleme(cv.getContext('2d'), s, 30, 30, 28, e.pi[s] === 0);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span');
      nom.textContent = role === 'robot' ? tr('indicatif.' + s) : tr('indicatif.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = tr('fin.piles', { n: e.pi[s] }) + ' · ' + tr('fin.chaineCourt', { n: e.be[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

    return b;
  }

  function etoilesPour(gagne, best, c) {
    if (!gagne) return 0;
    return best >= c[1] ? 3 : best >= c[0] ? 2 : 1;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const best = moi >= 0 ? e.be[moi] : 0;
    const gagne = moi >= 0 && gagnant(e) === moi;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = (e.nt >= O.TOURS_MAX ? tr('fin.aube') + ' ' : '') + (moi >= 0 ? tr('fin.chaine', { n: best }) : '');
    $('fin-bonus').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1, nuit = NIVEAUX[i];
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(gagne, best, nuit.c);
      const ancienRecord = prog.records[i];
      const record = best > ancienRecord;
      if (record) prog.records[i] = best;
      let debloque = false;
      const bonus = [];
      if (gagne) {
        const avant = totalEtoiles();
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        // Cassette maudite : une toutes les 2 nuits gagnées.
        if (niveau % 2 === 0) {
          const k = niveau / 2 - 1;
          if (prog.cassettes.indexOf(k) < 0) { prog.cassettes.push(k); bonus.push(tr('fin.cassette', { titre: tr('cassette.' + k + '.titre') })); }
        }
        // Radios débloquées par les étoiles.
        const total = totalEtoiles();
        RADIOS.forEach((r, k) => { if (k >= prog.radiosVues && r.seuil <= total && r.seuil > avant) bonus.push(tr('fin.radio', { nom: tr('radio.' + k + '.nom') })); });
        prog.radiosVues = Math.max(prog.radiosVues, RADIOS.filter((r) => r.seuil <= total).length);
        sauver(Math.min(niveau + 1, NIVEAUX.length), best);
        // Parcours solo terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (record) sauver(niveau, best);
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord', { n: best }) : tr('fin.record', { n: Math.max(ancienRecord, best) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : (gagne ? '' : tr('fin.cible', { a: nuit.c[0], b: nuit.c[1] })));
      $('fin-bonus').textContent = bonus.join(' · ');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {

    else if ($('bandeau').classList.contains('actif')) bandeau(texte);

  // Confettis de victoire : des notes de toutes les formes.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 80; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, b: i % B, k: 5 + Math.random() * 5 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt;
        c.fillStyle = TOUCHES[b.b].c; c.strokeStyle = TOUCHES[b.b].c;
        forme(c, b.b, b.x, b.y, b.k);
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  // Parcours solo : nuit n contre des robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    remiseAZeroTour();
    // aperçu de la nuit (places, piles) pendant le tutoriel ; la vraie manche le remplace
    try { vue = R.depart(window.JEL_MULTI.hasard(niveau), PLACES, { niveau: niveau }); } catch (e) { vue = null; }
    etincelles.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');

  function ecouterCassette(k) {
    casChoisie = k;
    document.querySelectorAll('.cassette').forEach((x) => x.classList.toggle('joue', x.id === 'cassette-' + k));
    const det = $('cas-detail');

    notes.forEach((b, i) => setTimeout(() => { if (j === casAnim && ecran === 'cassettes') { sons.ton(b, 0.3); parasites(0.1, 0.02, 2500); } }, i * 330));
    setTimeout(() => { if (j === casAnim && ecran === 'cassettes') sons.voix(notes[0], 0.9); }, notes.length * 330 + 150);
    // bobines qui tournent pendant l'écoute
    const cv = $('cassette-' + k).querySelector('canvas');

  // dif : notes diffusées [bouton, genre] (genre : 0 normal, 1 Voix, 2 rayé, 3 éteint) ;
  // tap : boutons que la main touche (la dernière = la note ajoutée).
  const TUTOS = {
    base: { dif: [[0, 0], [3, 0]], tap: [0, 3, 5], pas: 650 },
    voix: { dif: [[1, 0], [4, 1], [2, 0]], tap: [1, 2, 0], pas: 650 },
    inv: { dif: [[5, 0], [0, 2], [2, 2], [4, 2]], tap: [5, 4, 2, 0, 1], pas: 620 },
    echo: { dif: [[2, 0], [5, 0], [1, 0], [3, 0]], tap: [2, 5, 1, 3, 4], pas: 300 },
    ant: { dif: [[0, 0], [4, 3], [1, 0]], tap: [0, 4, 1, 2], pas: 650, an: 4 },
    nuit: { dif: [[3, 0], [1, 0], [5, 0]], tap: [3, 1, 5, 0], pas: 650, nuit: true }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const j = ++tutoAnim;
    let debut = 0, dernier = -1;
    const T_INTRO = 500, T_PAUSE = 600, T_TAP = 700;
    const tDif = d.dif.length * d.pas, tTot = T_INTRO + tDif + T_PAUSE + d.tap.length * T_TAP + 1300;
    // positions des boutons dans la démo
    const pos = (b) => [150 + (b % 3) * 130, 248 + Math.floor(b / 3) * 70];
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const e = (t - debut) % tTot;
      const cycle = Math.floor((t - debut) / tTot);
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#0d0b1c'; c.fillRect(0, 0, 560, 360);
      // ce qui est allumé
      let lum = -1, genre = 0, aig = 0.5, ajout = false, mainB = -1, appui = 0, faits = 0;
      const td = e - T_INTRO;
      if (td >= 0 && td < tDif) {
        const i = Math.floor(td / d.pas), dans = td - i * d.pas;
        if (dans < d.pas * 0.62) { lum = d.dif[i][0]; genre = d.dif[i][1]; }
        aig = (d.dif[i][0] + 0.5) / B;
        const id = cycle * 100 + i;
        if (id !== dernier) { dernier = id; if (d.dif[i][1] === 1) sons.voix(d.dif[i][0], 0.35); else sons.ton(d.dif[i][0], 0.25); }
      }
      const tt = e - T_INTRO - tDif - T_PAUSE;
      if (tt >= 0) {
        const i = Math.min(d.tap.length - 1, Math.floor(tt / T_TAP)), dans = tt - i * T_TAP;
        faits = Math.min(d.tap.length, Math.floor(tt / T_TAP) + (dans > 380 ? 1 : 0));
        if (tt < d.tap.length * T_TAP) {
          mainB = d.tap[i];
          appui = dans > 380 ? Math.min(1, (dans - 380) / 250) : 0;
          if (dans > 380 && dans < 560) { lum = d.tap[i]; genre = 0; ajout = i === d.tap.length - 1; aig = (lum + 0.5) / B; }
          const id = 1000 + cycle * 100 + i;
          if (dans > 380 && id !== dernier) { dernier = id; sons.ton(d.tap[i], 0.2); if (ajout) sons.ajout(); }
        } else mainB = d.tap[d.tap.length - 1];
      }
      // radio miniature
      dessinerRadio(c, 170, 34, 220, 110, { radio: prog.radio, aiguille: aig, lueur: d.nuit ? 0.1 : 0.7, t: t, ondes: lum >= 0 ? 1 : 0 });
      // boutons
      for (let b = 0; b < B; b++) {
        const p = pos(b);
        const allume = b === lum && !(td >= 0 && td < tDif && (d.nuit || genre === 3));
        const couleur = allume ? (genre === 1 ? '#ff2d55' : ajout ? '#ffe08a' : TOUCHES[b].c) : TOUCHES[b].s;
        c.save();
        if (allume) { c.shadowColor = couleur; c.shadowBlur = 24; }
        c.fillStyle = couleur;
        rr(c, p[0] - 52, p[1] - 28, 104, 56, 14); c.fill();
        c.shadowBlur = 0;
        if ((d.an === b && td >= 0 && td < tDif) || (d.nuit && td >= 0 && td < tDif)) {
          c.fillStyle = 'rgba(0,0,0,.55)'; rr(c, p[0] - 52, p[1] - 28, 104, 56, 14); c.fill();
          if (b === lum && genre === 3) { c.strokeStyle = '#999'; c.setLineDash([4, 3]); c.lineWidth = 2; rr(c, p[0] - 46, p[1] - 22, 92, 44, 10); c.stroke(); c.setLineDash([]); }
        }
        c.fillStyle = allume ? '#fff' : 'rgba(255,255,255,.45)'; c.strokeStyle = c.fillStyle;
        forme(c, b, p[0], p[1], 15);
        c.restore();
      }
      // la suite en points
      const n = d.dif.length + 1;
      for (let i = 0; i < n; i++) {
        const x = 280 - (n - 1) * 13 + i * 26, y = 172;
        const g = i < d.dif.length ? d.dif[i][1] : -1;
        c.strokeStyle = g === 1 ? '#ff4d6d' : g === 2 ? '#ffd166' : i === n - 1 ? '#ffe08a' : '#5e5794';
        c.fillStyle = g === 1 ? 'rgba(255,77,109,.25)' : '#2c2750';
        c.lineWidth = 2; rond(c, x, y, 7); c.fill(); c.stroke();
      }
      // pièges en icônes
      if (cle === 'voix') iconePiege(c, 'voix', 470, 70, 18, t);
      if (cle === 'inv') iconePiege(c, 'inv', 470, 70, 18, t);
      if (cle === 'echo') iconePiege(c, 'echo', 470, 70, 18, t);
      if (cle === 'ant') iconePiege(c, 'ant', 470, 70, 18, t);
      if (cle === 'nuit') iconePiege(c, 'nuit', 470, 70, 18, t);
      // la main
      if (mainB >= 0) {
        const p = pos(mainB);
        main(c, p[0] + 6, p[1] + 2, 1.3, appui);
      } else main(c, 500, 330, 1.3, 0);
      // coche des notes déjà rejouées
      c.fillStyle = '#5cf2b4';
      for (let i = 0; i < faits && i < d.tap.length - 1; i++) { const x = 280 - (n - 1) * 13 + i * 26; rond(c, x, 172, 4); c.fill(); }
      tutoId = requestAnimationFrame(image);
    }
    let tutoId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Clavier : 1 à 6 pour les boutons, flèches pour se déplacer
  // ---------------------------------------------------------------------

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') {
      if (ev.code === 'Escape' && ecran !== 'titre') { ev.preventDefault(); afficherEcran('titre'); }
      return;
    }
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const m = /^(?:Digit|Numpad)([1-6])$/.exec(ev.code);
    if (m) { ev.preventDefault(); audio(); clavier = true; toucher(Number(m[1]) - 1); return; }
    const dirs = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -3, ArrowDown: 3 };
    if (dirs[ev.code] !== undefined) {
      ev.preventDefault();
      clavier = true;
      const actuel = document.activeElement && /^touche-(\d)$/.exec(document.activeElement.id || '');
      let b = actuel ? Number(actuel[1]) : 0;
      if (actuel) b = (b + dirs[ev.code] + B) % B;
      try { $('touche-' + b).focus({ preventScroll: true }); } catch (e) { /* rien */ }
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-cassettes').addEventListener('click', () => { audio(); sons.clic(); ouvrirCassettes(); });
  $('btn-radios').addEventListener('click', () => { audio(); sons.clic(); ouvrirRadios(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('cas-retour').addEventListener('click', () => { audio(); sons.clic(); casAnim++; afficherEcran('titre'); });
  $('rad-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.be[partie.siege] : 0);
  });

  // Titre : le nom en grand, le sous-titre en dessous.
  function remplirTitre() {
    const h = $('titre-h1');
    h.textContent = tr('titre.court');
    const s = document.createElement('small'); s.textContent = tr('titre.sous');
    h.appendChild(s);
  }

  document.title = tr('titre');
  remplirTitre();
  chargerProgression();
  construirePlaces();
  construirePave();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
