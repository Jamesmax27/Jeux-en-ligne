  }

  // Une cassette (étiquette blanche, bobines ; marques rouges sur les cassettes maudites).
  function dessinerCassette(c, w, h, i, ouvert) {
    c.save();
    const x = 14, y = 16, cw = w - 28, ch = h - 32;
    c.fillStyle = ouvert ? '#1c2024' : '#14181b'; rr(c, x, y, cw, ch, 10); c.fill();
    c.strokeStyle = ouvert ? COUL[i % 5] : '#2c3840'; c.lineWidth = 3; c.stroke();
    c.fillStyle = ouvert ? '#e8e2cf' : '#2a3036'; rr(c, x + 12, y + 10, cw - 24, ch * 0.42, 6); c.fill();
    if (ouvert) {
      // portée dessinée de la mélodie (des traits, pas de texte)
      c.strokeStyle = '#8a7a5a'; c.lineWidth = 1;
      for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(x + 18, y + 18 + k * 7); c.lineTo(x + cw - 18, y + 18 + k * 7); c.stroke(); }
      CASSETTES[i].chant.forEach((v, k) => {
        const voix = v >= 10, b = voix ? v - 10 : v;
        c.fillStyle = voix ? '#b0101a' : TEINTES[b];
        rond(c, x + 22 + k * ((cw - 44) / Math.max(1, CASSETTES[i].chant.length - 1)), y + 39 - b * 4, 3.4); c.fill();
      });
    }
    // bobines
    const by = y + ch * 0.72;
    [x + cw * 0.3, x + cw * 0.7].forEach((bx) => {
      c.fillStyle = '#0a0c0e'; rond(c, bx, by, 13); c.fill();
      c.fillStyle = ouvert ? '#5a4a3a' : '#22282c'; rond(c, bx, by, 9); c.fill();
      c.fillStyle = '#0a0c0e'; rond(c, bx, by, 3.5); c.fill();
    });
    if (ouvert) {
      c.strokeStyle = '#b0101a'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(x + cw - 30, y + ch - 10); c.lineTo(x + cw - 14, y + ch - 26); c.moveTo(x + cw - 14, y + ch - 10); c.lineTo(x + cw - 30, y + ch - 26); c.stroke();
    }
    c.restore();
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause || attenteTuto) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    pomperAff();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const g = geometrieRadio(560, 360);
    const j = ++tutoAnim;
    const PAS = 760;
    let debut = 0, boucleNo = 0, dernierPas = -1;
    const lu = {}, luV = {}, luN = {};
    let rouge = 0, pilesAff = d.piles || 0, neige = 0, capte = 0;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const pasDe = (k) => (d.etapes[k] && d.etapes[k][2] === 'e' ? PAS * 0.5 : PAS);
      let total = PAS * 2;
      d.etapes.forEach((_, k) => { total += pasDe(k); });
      const ecoule = t - debut;
      if (ecoule > total) { debut = t; boucleNo++; dernierPas = -1; [lu, luV, luN].forEach((o) => Object.keys(o).forEach((k) => delete o[k])); rouge = 0; pilesAff = d.piles || 0; capte = 0; tutoId = requestAnimationFrame(image); return; }
      // étape en cours
      let k = -1, dans = ecoule - PAS * 0.6, acc = 0;
      for (let q = 0; q < d.etapes.length; q++) { if (dans >= acc && dans < acc + pasDe(q)) { k = q; dans -= acc; break; } acc += pasDe(q); }
      if (k >= 0 && k !== dernierPas && dans > (d.etapes[k][0] === 'm' ? 380 : 0)) {
        dernierPas = k;
        const et = d.etapes[k], b = et[1], f = et[2];
        const son = boucleNo === 0;
        if (f === 'c') { capte = t; if (son) sons.capte(); }
        else if (f === 'v') { luV[b] = t; if (son) voixGrave(b, 0.5); }
        else if (f === 'd') { luN[b] = t; if (son) sons.craque(); }
        else if (f === 'x') { neige = t + 400; for (let i = 0; i < K; i++) luN[i] = t; if (son) sons.trou(); }
        else if (f === 's') { /* la main passe sans toucher */ }
        else if (f === 'f') { rouge = t; neige = t + 500; pilesAff = Math.max(0, pilesAff - 1); lu[b] = t; if (son) { sons.faux(); setTimeout(() => sons.pile(), 260); } }
        else {
          if (f !== 'n' || et[0] === 'm') lu[b] = t;
          if (f === 'i') neige = t + PAS;
          if (son) { tonalite(b, 0.35); if (f === 'a') sons.ajout(); if (f === 'i') sons.inter(); }
        }
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(decorVille(560, 360, cle === 'rouge' ? 1 : 0), 0, 0);
      c.save();
      const lums = [], voix = [], nb2 = [];
      for (let i = 0; i < K; i++) {
        lums.push(Math.min(1, lumiere(lu, i, t, 520) + (capte ? Math.max(0, 1 - Math.abs(t - capte - i * 90) / 300) : 0)));
        voix.push(lumiere(luV, i, t, 600) || (rouge && lu[i] === rouge ? lumiere(lu, i, t, 600) : 0));
        nb2.push(lumiere(luN, i, t, 450));
      }
      const enDiff = k >= 0 && d.etapes[k][0] === 'r';
      dessinerRadio(c, g, {
        radio: prog.radio, lums: lums, voix: voix, neigeB: nb2, neige: neige > t ? 1 : 0, noir: !!(d.noir && enDiff),
        morte: d.morte !== undefined ? d.morte : -1, antenneTombee: d.morte !== undefined, aiguille: 0.5, eclat: rouge && t - rouge < 900
      }, t);
      c.restore();
      if (d.noir && enDiff) { c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(0, 0, 560, 360); }
      if (d.piles) { c.save(); c.fillStyle = '#12181cdd'; rr(c, 452, 12, 96, 40, 10); c.fill(); piles(c, 500, 20, pilesAff, d.piles, pilesAff <= 1 ? '#ff5a5a' : '#7dffb0', 1.5); c.restore(); }
      if (rouge && t - rouge < 400) { c.fillStyle = 'rgba(255,40,40,' + (0.3 * (1 - (t - rouge) / 400)) + ')'; c.fillRect(0, 0, 560, 360); }
      // la main pour les gestes du joueur
      if (k >= 0 && d.etapes[k][0] === 'm') {
        const et = d.etapes[k], p = g.boutons[et[1]];
        const precEt = k > 0 && d.etapes[k - 1][0] === 'm' ? g.boutons[d.etapes[k - 1][1]] : { x: 470, y: 380 };
        const q = Math.min(1, dans / 380);
        const x = precEt.x + (p.x - precEt.x) * q;
        let y = precEt.y - 20 + (p.y - 20 - (precEt.y - 20)) * q;
        if (et[2] === 's') y -= Math.sin(dans / 60) * 6 + 34; // la main hésite au-dessus, puis passe
        main(c, x, y, 1.4, et[2] !== 's' && dans > 380 ? Math.min(1, (dans - 380) / 120) : 0);
      }
      tutoId = requestAnimationFrame(image);
    }
    let tutoId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.35);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#0a0c0e'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function boutonSous(px, py) {
    if (!geo) return -1;
    for (let i = 0; i < K; i++) {
      const b = geo.boutons[i];
      if (Math.hypot(px - b.x, py - b.y) <= b.r * 1.18) return i;
    }
    return -1;
  }

  // Appui sur un bouton pendant mon tour : vérifié tout de suite, envoyé au
  // moteur dès la première faute ou une fois la note ajoutée.
  function toucherBouton(i) {
    if (i < 0 || !vue) return;
    if (!peutJouer()) {
      if (partie && partie.phase === 'jeu' && Date.now() - dernierAttends > 1500 && !enPause && !attenteTuto) {
        dernierAttends = Date.now();
        const moi = monSiege();
        toast(tr(moi >= 0 && vue.el[moi] > 0 ? 'tour.aplat' : (vue.tour === moi ? 'tour.ecoute' : 'tour.attends')), 1400);
        sons.non();
      }
      return;
    }
    const e = vue, t = performance.now();
    const L = e.att.length;
    if (saisie.length >= L && i === e.morte) {
      // Pas de note ajoutée sur un bouton coupé : simple refus.
      neigeB[i] = t; sons.craque(); toast(tr('tour.pasMorte'), 1500);
      return;
    }
    saisie.push(i);
    const pos = saisie.length - 1;
    const ajout = pos >= L;
    const juste = ajout || i === e.att[pos];
    lueursMoi[i] = t;
    if (juste) {
      tonalite(i, 0.32);
      jaillir(i, TEINTES[i], 7);
      if (points) { points.k = saisie.length; points.coul[pos] = TEINTES[i]; }
      if (!ajout) {
        // Suite pas finie : on attend l'appui suivant (ou la note ajoutée).
        if (saisie.length === L) annonce(tr('annonce.aToiAjoute'), 900);
        majInfos();
        return;
      }
    } else if (points) { points.k = saisie.length; points.coul[pos] = '#ff2a3a'; }
    const action = saisie.slice();
    if (!partie.jouer(action)) { saisie = []; if (points) points.k = 0; }
    majInfos();
  }

  const scene = $('scene');
  scene.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const r = scene.getBoundingClientRect();
    toucherBouton(boutonSous(ev.clientX - r.left, ev.clientY - r.top));
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape' || ev.code === 'NumpadEnter') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue) return;
    const m = /^(?:Digit|Numpad)([1-6])$/.exec(ev.code);
    if (m) {
      const i = parseInt(m[1], 10) - 1;
      ev.preventDefault(); audio(); clavier = true; curseur = i; toucherBouton(i);
      return;
    }
    const fleches = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -3, ArrowDown: 3 };
    if (fleches[ev.code] !== undefined) {
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; curseur = 0; return; }
      curseur = (curseur + fleches[ev.code] + K) % K;
      sons.clic();
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; curseur = 0; return; }
      toucherBouton(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue ? vue.sc[0] : 0);
  });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
