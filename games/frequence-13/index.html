    capte: { etapes: [['r', 0], ['r', 1], ['r', 2], ['m', 0], ['m', 1], ['m', 2], ['m', 5, 'a'], ['r', -1, 'c']] },
    voix: { etapes: [['r', 2], ['r', 4, 'v'], ['r', 1], ['m', 2], ['m', 4, 's'], ['m', 1], ['m', 3, 'a']] },
    inter: { etapes: [['r', 0], ['r', 5, 'i'], ['r', 3, 'i'], ['m', 0], ['m', 3], ['m', 5], ['m', 1, 'a']] },
    echo: { echo: true, etapes: [['r', 1, 'e'], ['r', 2, 'e'], ['r', 4, 'e'], ['m', 1], ['m', 2], ['m', 4], ['m', 0, 'a']] },
    rouge: { piles: 2, etapes: [['r', 3], ['r', 0], ['m', 3], ['m', 2, 'f']] },
    antenne: { morte: 4, etapes: [['r', 0], ['r', 4, 'd'], ['r', 2], ['m', 0], ['m', 4, 's'], ['m', 2], ['m', 1, 'a']] },
    noir: { noir: true, etapes: [['r', 5, 'n'], ['r', 1, 'n'], ['r', 3, 'n'], ['m', 5], ['m', 1], ['m', 3], ['m', 0, 'a']] },
    trou: { etapes: [['r', 2], ['r', 0, 'x'], ['r', 3], ['m', 2], ['m', 0], ['m', 3], ['m', 4, 'a']] }
  };

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), chaines: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    radio: 0, cassettes: CASSETTES.map(() => false), options: { son: true }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 99999, 0));
      if (Array.isArray(d.chaines)) prog.chaines = NIVEAUX.map((_, i) => entier(d.chaines[i], 0, 99, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (Array.isArray(d.cassettes)) prog.cassettes = CASSETTES.map((_, i) => d.cassettes[i] === true);
      prog.radio = entier(d.radio, 0, RADIOS.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (!radioOuverte(prog.radio)) prog.radio = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.chaines = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.radio = 0;
    prog.cassettes = CASSETTES.map(() => false);
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(), chaines: prog.chaines.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), radio: prog.radio, cassettes: prog.cassettes.slice(),
        options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Réglages changés hors d'une partie (son, radio) : seulement si une sauvegarde existe déjà.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, radio: prog.radio }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const radioOuverte = (i) => totalEtoiles() >= RADIOS[i].seuil;

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, bruit = null;
  function audio() {
    try {
      if (!ac) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (C) {
          ac = new C();
          const n = ac.sampleRate * 1.2;
          bruit = ac.createBuffer(1, n, ac.sampleRate);
          const data = bruit.getChannelData(0);
          for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
        }
      }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }

  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      if (o.detune) osc.detune.value = o.detune;
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.attaque || Math.min(0.02, d / 4)));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      if (o.vibrato) {
        const lfo = ac.createOscillator(), lg = ac.createGain();
        lfo.frequency.value = o.vibrato; lg.gain.value = f * 0.03;
        lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(t + d + 0.05);
      }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }

  function souffle(d, o) {
    o = o || {};
    if (!ac || !prog.options.son || !bruit) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(); src.buffer = bruit;
      src.playbackRate.value = o.vitesse || 1;
      const fl = ac.createBiquadFilter(); fl.type = o.passe || 'bandpass'; fl.frequency.setValueAtTime(o.f1 || 800, t);
      if (o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2, t + d);
      fl.Q.value = o.q || 1;
      const g = ac.createGain();
      const v = o.vol || 0.1;
      if (o.monte) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + d * 0.95); g.gain.setValueAtTime(0.0001, t + d); }
      else { g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); }
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t, Math.random() * 0.5); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }

  // Tonalité d'un bouton de la radio : fondamentale et octave, un léger souffle de poste.
  function tonalite(b, duree, radio) {
    const r = RADIOS[radio === undefined ? prog.radio : radio];
    const f = r.gamme[Math.max(0, Math.min(K - 1, b))];
    const d = duree || 0.4;
    note(f, d, { type: r.type, vol: 0.085, filtre: r.filtre, attaque: 0.015, vibrato: 5.5 });
    note(f * 2, d * 0.8, { type: 'sine', vol: 0.03 });
    souffle(d * 0.6, { f1: 3000, q: 0.7, vol: 0.012 });
  }

  // La Voix : un grondement grave, deux octaves sous le bouton.
  function voixGrave(b, duree) {
    const r = RADIOS[prog.radio];
    const f = r.gamme[Math.max(0, Math.min(K - 1, b))] / 4;
    const d = Math.max(0.35, duree || 0.5);
    note(f, d, { type: 'sawtooth', vol: 0.09, filtre: 500, vibrato: 3 });
    note(f * 1.01, d, { type: 'sawtooth', vol: 0.06, filtre: 420, detune: 25 });
    souffle(d, { passe: 'lowpass', f1: 300, vol: 0.05 });
  }

  const sons = {
    clic: () => note(820, 0.05, { type: 'triangle', vol: 0.05 }),
    neige: (d) => souffle(d || 0.3, { f1: 2400, q: 0.5, vol: 0.09 }),
    craque: () => { [0, 0.05, 0.11].forEach((r) => souffle(0.03, { f1: 3500, q: 5, vol: 0.12, retard: r })); },
    faux: () => {
      souffle(0.7, { f1: 1800, f2: 400, q: 0.6, vol: 0.16 });
      [110, 116.5].forEach((f, i) => note(f, 0.5, { type: 'square', vol: 0.05, filtre: 900, detune: i * 20 }));
    },
    pile: () => { note(620, 0.12, { type: 'square', vol: 0.05, filtre: 2000 }); note(310, 0.22, { type: 'square', vol: 0.05, filtre: 1500, retard: 0.12 }); },
    aplat: () => { note(440, 0.9, { type: 'sawtooth', vol: 0.07, vers: 55, filtre: 1200 }); souffle(0.9, { passe: 'lowpass', f1: 1500, f2: 100, vol: 0.12, retard: 0.2 }); },
    capte: () => {
      souffle(0.6, { f1: 300, f2: 4000, q: 4, vol: 0.08, monte: true });
      const g = RADIOS[prog.radio].gamme;
      [0, 2, 4, 5].forEach((k, i) => note(g[k] * 2, 0.3, { type: 'triangle', vol: 0.06, retard: 0.55 + i * 0.1 }));
    },
    voix: () => voixGrave(1, 0.8),
    inter: () => { note(500, 0.7, { vol: 0.05, vibrato: 14 }); souffle(0.7, { f1: 1200, f2: 2600, q: 2, vol: 0.06 }); },
    echo: () => { note(400, 0.5, { vol: 0.05, vers: 900 }); note(900, 0.5, { vol: 0.04, vers: 400, retard: 0.12 }); },
    antenne: () => { note(1800, 0.06, { type: 'square', vol: 0.05 }); note(60, 0.6, { type: 'sawtooth', vol: 0.05, filtre: 300, retard: 0.05 }); },
    noir: () => note(55, 1, { type: 'sine', vol: 0.08 }),
    trou: () => souffle(0.4, { f1: 900, q: 3, vol: 0.1, vitesse: 0.6 }),
    ajout: () => note(1320, 0.12, { type: 'triangle', vol: 0.05, retard: 0.05 }),
    victoire: () => {
      const g = RADIOS[prog.radio].gamme;
      [0, 2, 4, 5, 4, 5].forEach((k, i) => note(g[k] * (i > 3 ? 2 : 1), 0.4, { type: RADIOS[prog.radio].type, vol: 0.07, filtre: RADIOS[prog.radio].filtre, retard: i * 0.13 }));
    },
    defaite: () => { [392, 349, 311, 196].forEach((f, i) => note(f, 0.55, { type: 'sawtooth', vol: 0.05, filtre: 800, retard: i * 0.2 })); souffle(1, { f1: 2000, f2: 200, vol: 0.08, retard: 0.6 }); },
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(523, 0.14, { vol: 0.08 }); note(784, 0.18, { vol: 0.08, retard: 0.1 }); },
    part: () => { note(784, 0.14, { vol: 0.07 }); note(523, 0.18, { vol: 0.07, retard: 0.1 }); },
    tour: () => { note(880, 0.1, { vol: 0.06 }); note(1320, 0.12, { vol: 0.05, retard: 0.08 }); },
    non: () => note(160, 0.12, { type: 'triangle', vol: 0.06 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : outils, boutons, radio, animaux, ville
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }

  // Forme dessinée au centre d'un bouton (repère sans texte, utile sans les couleurs).
  function forme(c, f, x, y, r) {
    c.beginPath();
    if (f === 'rond') c.arc(x, y, r * 0.75, 0, Math.PI * 2);
    else if (f === 'triangle') { c.moveTo(x, y - r); c.lineTo(x + r * 0.9, y + r * 0.7); c.lineTo(x - r * 0.9, y + r * 0.7); c.closePath(); }
    else if (f === 'carre') c.rect(x - r * 0.7, y - r * 0.7, r * 1.4, r * 1.4);
    else if (f === 'losange') { c.moveTo(x, y - r); c.lineTo(x + r * 0.8, y); c.lineTo(x, y + r); c.lineTo(x - r * 0.8, y); c.closePath(); }
    else if (f === 'etoile') {
      for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.42 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
      c.closePath();
    } else {
      c.moveTo(x - r, y);
      c.bezierCurveTo(x - r * 0.5, y - r * 1.1, x, y - r * 1.1, x, y);
      c.bezierCurveTo(x, y + r * 1.1, x + r * 0.5, y + r * 1.1, x + r, y);
      c.lineWidth = Math.max(2, r * 0.32); c.lineCap = 'round'; c.stroke(); return;
    }
    c.fill();
  }

  // Un bouton lumineux. o : lum (0 à 1), morte, voix (0 à 1), neige (0 à 1), curseur, appui.
  function dessinerBouton(c, i, x, y, r, o, t) {
    const lum = o.lum || 0, teinte = TEINTES[i];
    c.save();
    // socle
    c.fillStyle = '#0b0e10'; rond(c, x, y + r * 0.12, r * 1.08); c.fill();
    if (o.morte) {
      const g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r);
      g.addColorStop(0, '#5a6066'); g.addColorStop(1, '#22272b');
      c.fillStyle = g; rond(c, x, y, r); c.fill();
      c.strokeStyle = '#ffc23a'; c.lineWidth = Math.max(2, r * 0.1); c.lineCap = 'round';
      // antenne cassée
      c.beginPath(); c.moveTo(x - r * 0.15, y + r * 0.5); c.lineTo(x - r * 0.15, y - r * 0.1); c.lineTo(x + r * 0.35, y - r * 0.55); c.stroke();
      c.beginPath(); c.moveTo(x - r * 0.45, y + r * 0.5); c.lineTo(x + r * 0.15, y + r * 0.5); c.stroke();
      c.strokeStyle = '#ff5a5a'; c.lineWidth = Math.max(2, r * 0.08);
      c.beginPath(); c.moveTo(x - r * 0.6, y - r * 0.6); c.lineTo(x + r * 0.6, y + r * 0.6); c.stroke();
      if (o.neige) { neigeDisque(c, x, y, r, o.neige); }
      c.restore();
      return;
    }
    if (lum > 0) { c.shadowColor = teinte; c.shadowBlur = r * 1.2 * lum; }
    const g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
    g.addColorStop(0, melange('#ffffff', teinte, 0.35 + 0.35 * (1 - lum)));
    g.addColorStop(0.55, lum > 0 ? teinte : melange(teinte, '#000000', 0.55));
    g.addColorStop(1, melange(teinte, '#000000', lum > 0 ? 0.35 : 0.78));
    c.fillStyle = g; rond(c, x, y, r); c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = lum > 0 ? '#ffffff' : melange(teinte, '#000000', 0.4); c.lineWidth = Math.max(2, r * 0.07);
    rond(c, x, y, r); c.stroke();
    // forme
    c.fillStyle = c.strokeStyle = lum > 0.2 ? 'rgba(255,255,255,.92)' : 'rgba(0,0,0,.45)';
    forme(c, FORMES[i], x, y, r * 0.38);
    // la Voix : anneau rouge sombre qui pulse
    if (o.voix > 0) {
      c.fillStyle = 'rgba(140,0,10,' + (0.65 * o.voix) + ')'; rond(c, x, y, r); c.fill();
      c.strokeStyle = 'rgba(255,60,70,' + o.voix + ')'; c.lineWidth = r * 0.14;
      rond(c, x, y, r * (1.1 + 0.25 * (1 - o.voix))); c.stroke();
    }
    if (o.neige) neigeDisque(c, x, y, r, o.neige);
    if (o.curseur) {
      c.strokeStyle = '#7dffb0'; c.lineWidth = 3; c.setLineDash([6, 4]);
      rond(c, x, y, r * 1.22); c.stroke(); c.setLineDash([]);
    }
    c.restore();
  }

  // Neige (parasites) sur un disque.
  function neigeDisque(c, x, y, r, k) {
    c.save();
    rond(c, x, y, r); c.clip();
    for (let n = 0; n < 40; n++) {
      c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,' + k + ')' : 'rgba(0,0,0,' + k + ')';
      c.fillRect(x - r + Math.random() * 2 * r, y - r + Math.random() * 2 * r, 3, 2);
    }
    c.restore();
  }

  function melange(a, b, k) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const ra = pa >> 16, ga = (pa >> 8) & 255, ba = pa & 255, rb = pb >> 16, gb = (pb >> 8) & 255, bb = pb & 255;
    const m = (u, v) => Math.round(u + (v - u) * k);
    return 'rgb(' + m(ra, rb) + ',' + m(ga, gb) + ',' + m(ba, bb) + ')';
  }

  // Géométrie de la radio dans une zone w × h.
  function geometrieRadio(w, h) {
    const rw = Math.min(w - 16, 460);
    const rh = Math.min(h - 40, rw * 1.18);
    const x0 = (w - rw) / 2, y0 = Math.max(34, (h - rh) / 2 + 14);
    const haut = rh * 0.33;
    const yPts = y0 + haut + 16;
    const zoneB = rh - haut - 34;
    const r = Math.max(Math.min(22, rw / 7.2), Math.min(rw / 7.2, zoneB / 4.7));
    const yb1 = yPts + 18 + zoneB * 0.27, yb2 = yPts + 18 + zoneB * 0.73;
    const boutons = [];
    for (let i = 0; i < K; i++) boutons.push({ x: x0 + rw * (1 + 2 * (i % 3)) / 6, y: i < 3 ? yb1 : yb2, r: r });
    return { x0: x0, y0: y0, rw: rw, rh: rh, haut: haut, yPts: yPts, boutons: boutons };
  }

  // La radio entière. o : { radio, lums[], morte, voix[], neige (0 à 1), noir, aiguille (0 à 1), points, curseur, eclat }
  function dessinerRadio(c, g, o, t) {
    const rd = RADIOS[o.radio || 0];
    c.save();
    // antenne télescopique
    c.strokeStyle = '#c9d2d8'; c.lineWidth = 3; c.lineCap = 'round';
    const ax = g.x0 + g.rw * 0.78, ay = g.y0;
    const pench = o.antenneTombee ? 0.9 : 0.35 + Math.sin(t / 1400) * 0.03;
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(ax + Math.sin(pench) * 60, ay - Math.cos(pench) * 60); c.stroke();
    c.fillStyle = '#e6ecef'; rond(c, ax + Math.sin(pench) * 60, ay - Math.cos(pench) * 60, 3.5); c.fill();
    // poignée
    c.strokeStyle = rd.bord; c.lineWidth = 6;
    c.beginPath(); c.moveTo(g.x0 + g.rw * 0.3, g.y0 + 2); c.quadraticCurveTo(g.x0 + g.rw * 0.4, g.y0 - 26, g.x0 + g.rw * 0.55, g.y0 + 2); c.stroke();
    // boîtier
    const gc = c.createLinearGradient(0, g.y0, 0, g.y0 + g.rh);
    gc.addColorStop(0, rd.haut); gc.addColorStop(1, rd.bas);
    c.fillStyle = gc; rr(c, g.x0, g.y0, g.rw, g.rh, 22); c.fill();
    c.strokeStyle = rd.bord; c.lineWidth = 3; c.stroke();
    // grille du haut-parleur
    const gx = g.x0 + 16, gy = g.y0 + 14, gw = g.rw * 0.5, gh = g.haut - 22;
    c.fillStyle = '#0a0c0e'; rr(c, gx, gy, gw, gh, 10); c.fill();
    c.strokeStyle = rd.grille; c.lineWidth = 2;
    for (let yy = gy + 8; yy < gy + gh - 4; yy += 7) { c.beginPath(); c.moveTo(gx + 8, yy); c.lineTo(gx + gw - 8, yy); c.stroke(); }
    // cadran des fréquences
    const dx = gx + gw + 12, dy = gy, dw = g.x0 + g.rw - 16 - dx, dh = gh * 0.58;
    const gd = c.createLinearGradient(0, dy, 0, dy + dh);
    gd.addColorStop(0, o.noir ? '#1a1608' : '#fff2c4'); gd.addColorStop(1, o.noir ? '#0c0a04' : '#d8b86a');
    c.fillStyle = gd; rr(c, dx, dy, dw, dh, 8); c.fill();
    c.strokeStyle = '#3a2a10'; c.lineWidth = 1.5;
    for (let k = 0; k <= 12; k++) { const xx = dx + 6 + (dw - 12) * k / 12; c.beginPath(); c.moveTo(xx, dy + dh - 6); c.lineTo(xx, dy + dh - (k % 3 ? 11 : 18)); c.stroke(); }
    const ag = Math.max(0, Math.min(1, o.aiguille || 0)) + (o.neige ? (Math.random() - 0.5) * 0.08 * o.neige : 0);
    c.strokeStyle = '#d0201a'; c.lineWidth = 3;
    const nx = dx + 6 + (dw - 12) * ag;
    c.beginPath(); c.moveTo(nx, dy + 4); c.lineTo(nx, dy + dh - 4); c.stroke();
    // œil magique (vert, rouge quand la fréquence se brouille)
    const ox = dx + dw / 2, oy = dy + dh + (gh - dh) / 2 + 2, orr = Math.min(16, (gh - dh) / 2 - 2);
    c.fillStyle = '#050607'; rond(c, ox, oy, orr + 3); c.fill();
    const oeil = o.eclat ? '#ff3b30' : (o.noir ? '#1d4a2c' : '#3dff8a');
    const ge = c.createRadialGradient(ox, oy, 1, ox, oy, orr);
    ge.addColorStop(0, '#ffffff'); ge.addColorStop(0.35, oeil); ge.addColorStop(1, '#02140a');
    c.fillStyle = ge; rond(c, ox, oy, orr); c.fill();
    c.fillStyle = '#050607';
    const ouv = 0.25 + 0.2 * Math.sin(t / 300);
    c.beginPath(); c.moveTo(ox, oy); c.arc(ox, oy, orr + 1, -Math.PI / 2 - ouv, -Math.PI / 2 + ouv); c.closePath(); c.fill();
    // neige sur le haut-parleur
    if (o.neige) {
      c.save(); rr(c, gx, gy, gw, gh, 10); c.clip();
      for (let n = 0; n < 160 * o.neige; n++) {
        c.fillStyle = Math.random() < 0.5 ? '#ffffff' : '#7a8a90';
        c.fillRect(gx + Math.random() * gw, gy + Math.random() * gh, 2 + Math.random() * 3, 1.5);
      }
      c.restore();
    }
    // points de la suite
    dessinerPoints(c, g, o.points, t);
    // boutons
    for (let i = 0; i < K; i++) {
      const b = g.boutons[i];
      const l = o.noir ? Math.min(o.lums[i] || 0, o.lumsMoi ? (o.lumsMoi[i] || 0) : 0) : (o.lums[i] || 0);
      const bond = l > 0 ? Math.sin(l * Math.PI) * 3 : 0;
      dessinerBouton(c, i, b.x, b.y - bond, b.r, {
        lum: l, morte: o.morte === i, voix: o.voix ? o.voix[i] || 0 : 0, neige: o.neigeB ? o.neigeB[i] || 0 : 0, curseur: o.curseur === i
      }, t);
    }
    c.restore();
  }

  // Rangée de points : progression de la suite (rediffusion, ton tour, le tour d'un autre).
  function dessinerPoints(c, g, p, t) {
    if (!p || !p.n) return;
    const n = p.n, larg = g.rw - 40;
    const pas = Math.min(22, larg / n), rr0 = Math.max(3, Math.min(7, pas * 0.32));
    const x0 = g.x0 + g.rw / 2 - pas * (n - 1) / 2, y = g.yPts;
    let faits = p.k;
    if (p.anim) faits = Math.min(p.k, Math.floor(p.k * Math.min(1, (t - p.anim.t0) / p.anim.d)));
    for (let i = 0; i < n; i++) {
      const x = x0 + i * pas;
      const ajout = p.ajout && i === n - 1;
      if (i < faits) {
        c.fillStyle = (p.coul && p.coul[i]) || '#7dffb0';
        rond(c, x, y, rr0); c.fill();
      } else {
        c.strokeStyle = ajout ? '#ffd27a' : '#5d6a72'; c.lineWidth = 2;
        rond(c, x, y, rr0); c.stroke();
        if (ajout) { c.beginPath(); c.moveTo(x - rr0 * 0.55, y); c.lineTo(x + rr0 * 0.55, y); c.moveTo(x, y - rr0 * 0.55); c.lineTo(x, y + rr0 * 0.55); c.stroke(); }
      }
    }
  }

  // Animaux des places (dessinés en formes simples).
  function embleme(c, s, x, y, r) {
    c.save();
    const coul = COUL[s];
    c.fillStyle = COUL_F[s]; rond(c, x, y, r); c.fill();
    c.strokeStyle = coul; c.lineWidth = Math.max(2, r * 0.1); rond(c, x, y, r); c.stroke();
    const k = r / 30;
    c.translate(x, y); c.scale(k, k);
    if (s === 0) {          // corbeau
      c.fillStyle = '#15171c'; ell(c, 0, 4, 15, 16); c.fill();
      c.beginPath(); c.moveTo(10, -2); c.lineTo(26, 3); c.lineTo(10, 8); c.closePath(); c.fillStyle = '#ffb347'; c.fill();
      c.fillStyle = '#fff'; rond(c, 4, -2, 4); c.fill(); c.fillStyle = '#000'; rond(c, 5, -2, 2); c.fill();
      c.fillStyle = '#15171c'; c.beginPath(); c.moveTo(-6, -10); c.lineTo(-2, -20); c.lineTo(2, -11); c.closePath(); c.fill();
    } else if (s === 1) {   // chat
      c.fillStyle = '#20232a';
      c.beginPath(); c.moveTo(-16, -6); c.lineTo(-13, -22); c.lineTo(-3, -12); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(16, -6); c.lineTo(13, -22); c.lineTo(3, -12); c.closePath(); c.fill();
      ell(c, 0, 2, 17, 15); c.fill();
      c.fillStyle = '#c8ff5a'; ell(c, -7, 0, 4, 5); c.fill(); ell(c, 7, 0, 4, 5); c.fill();
      c.fillStyle = '#000'; ell(c, -7, 0, 1.2, 4); c.fill(); ell(c, 7, 0, 1.2, 4); c.fill();
      c.fillStyle = '#ff8fa8'; c.beginPath(); c.moveTo(-2, 7); c.lineTo(2, 7); c.lineTo(0, 9.5); c.closePath(); c.fill();
    } else if (s === 2) {   // rat
      c.fillStyle = '#8a8f98'; rond(c, -13, -12, 8); c.fill(); rond(c, 13, -12, 8); c.fill();
      c.fillStyle = '#ffb3c4'; rond(c, -13, -12, 4.5); c.fill(); rond(c, 13, -12, 4.5); c.fill();
      c.fillStyle = '#9aa0a8'; c.beginPath(); c.moveTo(-14, -2); c.quadraticCurveTo(0, -14, 14, -2); c.lineTo(0, 20); c.closePath(); c.fill();
      c.fillStyle = '#ff6b8b'; rond(c, 0, 19, 3); c.fill();
      c.fillStyle = '#000'; rond(c, -6, 1, 2.4); c.fill(); rond(c, 6, 1, 2.4); c.fill();
      c.strokeStyle = '#e6ecef'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(-3, 15); c.lineTo(-16, 12); c.moveTo(3, 15); c.lineTo(16, 12); c.stroke();
    } else if (s === 3) {   // phalène
      c.fillStyle = '#d9cfa8'; ell(c, -11, -4, 12, 15, -0.5); c.fill(); ell(c, 11, -4, 12, 15, 0.5); c.fill();
      c.fillStyle = '#b8ab80'; ell(c, -9, 12, 8, 9, 0.4); c.fill(); ell(c, 9, 12, 8, 9, -0.4); c.fill();
      c.fillStyle = '#5a4a2a'; rond(c, -11, -6, 3.5); c.fill(); rond(c, 11, -6, 3.5); c.fill();
      c.fillStyle = '#3a2f1c'; ell(c, 0, 3, 3.5, 15); c.fill();
      c.strokeStyle = '#3a2f1c'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(-1, -11); c.quadraticCurveTo(-6, -20, -10, -21); c.moveTo(1, -11); c.quadraticCurveTo(6, -20, 10, -21); c.stroke();
    } else {                // hibou
      c.fillStyle = '#7a5a3a'; ell(c, 0, 3, 17, 18); c.fill();
      c.beginPath(); c.moveTo(-14, -8); c.lineTo(-12, -21); c.lineTo(-5, -12); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(14, -8); c.lineTo(12, -21); c.lineTo(5, -12); c.closePath(); c.fill();
      c.fillStyle = '#f0e2c0'; rond(c, -7, -1, 7); c.fill(); rond(c, 7, -1, 7); c.fill();
      c.fillStyle = '#ffb347'; rond(c, -7, -1, 4); c.fill(); rond(c, 7, -1, 4); c.fill();
      c.fillStyle = '#000'; rond(c, -7, -1, 2); c.fill(); rond(c, 7, -1, 2); c.fill();
      c.fillStyle = '#e09a2c'; c.beginPath(); c.moveTo(-2.5, 6); c.lineTo(2.5, 6); c.lineTo(0, 11); c.closePath(); c.fill();
    }
    c.restore();
  }

  // Petites piles sous l'animal (pleines ou vides).
  function piles(c, x, y, n, max, coul, k) {
    k = k || 1;
    const w = 9 * k, h = 14 * k, gap = 3 * k;
    const total = max * w + (max - 1) * gap;
    for (let i = 0; i < max; i++) {
      const px = x - total / 2 + i * (w + gap);
      c.fillStyle = '#2c3840'; rr(c, px, y, w, h, 2 * k); c.fill();
      c.fillRect(px + w * 0.3, y - 2 * k, w * 0.4, 2 * k);
      if (i < n) { c.fillStyle = coul; rr(c, px + 1.5 * k, y + 1.5 * k, w - 3 * k, h - 3 * k, 1.5 * k); c.fill(); }
    }
  }

  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 20, k / 20);
    c.fillStyle = '#ffd24a'; c.strokeStyle = '#7a4a00'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-18, 0); c.lineTo(-18, -16); c.lineTo(-9, -6); c.lineTo(0, -20); c.lineTo(9, -6); c.lineTo(18, -16); c.lineTo(18, 0); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  }

  // Décor de la ville morte : ciel, lune, immeubles éteints (dessiné une fois par taille).
  const decorCache = { w: 0, h: 0, cv: null, k: 0 };
  function decorVille(w, h, k) {
    if (decorCache.cv && decorCache.w === w && decorCache.h === h && decorCache.k === k) return decorCache.cv;
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(w)); cv.height = Math.max(1, Math.round(h));
    const c = cv.getContext('2d');
    const ciel = c.createLinearGradient(0, 0, 0, h);
    ciel.addColorStop(0, k ? '#1a0a0a' : '#0a1418'); ciel.addColorStop(0.7, k ? '#2a0e0c' : '#122228'); ciel.addColorStop(1, '#05080a');
    c.fillStyle = ciel; c.fillRect(0, 0, w, h);
    let graine = 13;
    const al = () => { graine = (graine * 16807) % 2147483647; return graine / 2147483647; };
    for (let i = 0; i < 60; i++) { c.fillStyle = 'rgba(255,255,255,' + (0.2 + al() * 0.5) + ')'; c.fillRect(al() * w, al() * h * 0.5, 1.5, 1.5); }
    const lx = w * 0.86, ly = h * 0.27, lr = Math.min(w, h) * 0.045;
    c.fillStyle = k ? '#ffb08a' : '#e8f0e0'; rond(c, lx, ly, lr); c.fill();
    c.fillStyle = k ? '#1a0a0a' : '#0a1418'; rond(c, lx + lr * 0.4, ly - lr * 0.2, lr * 0.9); c.fill();
    // immeubles
    let x = -10;
    while (x < w + 10) {
      const bw = 30 + al() * 60, bh = h * (0.25 + al() * 0.45);
      c.fillStyle = '#0c1216'; c.fillRect(x, h - bh, bw, bh);
      for (let yy = h - bh + 8; yy < h - 10; yy += 14) {
        for (let xx = x + 6; xx < x + bw - 8; xx += 12) {
          const v = al();
          if (v < 0.04) { c.fillStyle = k ? '#ff6a3a' : '#ffd27a'; c.fillRect(xx, yy, 5, 7); }
          else if (v < 0.35) { c.fillStyle = '#121c22'; c.fillRect(xx, yy, 5, 7); }
        }
      }
      x += bw + 4;
    }
    const sol = c.createLinearGradient(0, h * 0.85, 0, h);
    sol.addColorStop(0, 'rgba(0,0,0,0)'); sol.addColorStop(1, '#030405');
    c.fillStyle = sol; c.fillRect(0, h * 0.85, w, h * 0.15);
    decorCache.w = w; decorCache.h = h; decorCache.cv = cv; decorCache.k = k;
    return cv;
  }

  // Écran titre : rue déserte, lampadaire qui clignote, radio qui chante.
  function dessinerTitre(t) {
    const cv = $('fond');
    const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.drawImage(decorVille(w, h, 0), 0, 0, w, h);
    // lampadaire
    const px = w * 0.14, py = h * 0.3;
    c.strokeStyle = '#1e262c'; c.lineWidth = 6;
    c.beginPath(); c.moveTo(px, h); c.lineTo(px, py); c.quadraticCurveTo(px, py - 20, px + 30, py - 20); c.stroke();
    const allume = Math.sin(t / 97) + Math.sin(t / 233) > -1.2;
    if (allume) {
      const gl = c.createRadialGradient(px + 32, py - 12, 2, px + 32, py + 80, h * 0.4);
      gl.addColorStop(0, 'rgba(180,255,210,.35)'); gl.addColorStop(1, 'rgba(180,255,210,0)');
      c.fillStyle = gl; c.beginPath(); c.moveTo(px + 22, py - 14); c.lineTo(px + 42, py - 14); c.lineTo(px + 32 + h * 0.25, h); c.lineTo(px + 32 - h * 0.25, h); c.closePath(); c.fill();
    }
    c.fillStyle = allume ? '#c8ffe0' : '#2a3a32'; rr(c, px + 22, py - 18, 20, 8, 3); c.fill();
    // la radio, entre le titre et la consigne (antenne comprise)
    const haut = document.querySelector('.titre-haut').getBoundingClientRect().bottom;
    const bas = document.querySelector('#ecran-titre .panneau').getBoundingClientRect().top;
    const place = bas - haut - 78;
    const rw = Math.max(120, Math.min(w * 0.62, 300, place / 1.18));
    const ty = haut + 32 + Math.max(0, (place - rw * 1.18) / 2);
    const cx = w / 2, cy = ty + 34 + rw * 0.59;
    // ondes
    for (let i = 0; i < 4; i++) {
      const q = ((t / 1800) + i / 4) % 1;
      c.strokeStyle = 'rgba(125,255,176,' + (0.4 * (1 - q)) + ')'; c.lineWidth = 2;
      c.beginPath(); c.arc(cx, cy, rw * 0.5 + q * Math.min(w, h) * 0.5, -Math.PI * 0.85, -Math.PI * 0.15); c.stroke();
    }
    const g = geometrieRadio(rw + 16, rw * 1.18 + 40);
    c.save();
    c.translate(cx - (rw + 16) / 2, ty);
    const lums = [];
    const actif = Math.floor(t / 420) % 8;
    for (let i = 0; i < K; i++) lums.push(i === actif ? 1 - ((t % 420) / 420) * 0.6 : 0.08);
    dessinerRadio(c, g, { radio: prog.radio, lums: lums, aiguille: 0.5 + Math.sin(t / 1600) * 0.35, voix: actif === 7 ? [0, 0, 0, 0, 1, 0] : null }, t);
    c.restore();
    // brume au sol
    const br = c.createLinearGradient(0, h * 0.75, 0, h);
    br.addColorStop(0, 'rgba(120,160,150,0)'); br.addColorStop(1, 'rgba(120,160,150,.18)');
    c.fillStyle = br; c.fillRect(0, h * 0.75, w, h * 0.25);
  }

  // ---------------------------------------------------------------------
  //  État de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (20 nuits) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché (en retard sur le moteur, le temps des animations)
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let curseur = -1, clavier = false;
  let dernierAttends = 0;
  let secousse = 0;
  let attenteTuto = false;
  let diffuse = false;        // la radio rediffuse (on écoute)
  let pret = false;           // rediffusion finie : à toi de jouer
  let saisie = [];            // boutons touchés pendant mon tour
  const lueurs = {};          // bouton → heure de la dernière lumière
  const lueursMoi = {};       // mes appuis (visibles même la nuit noire)
  const voixLum = {};         // bouton → heure du dernier passage de la Voix
  const neigeB = {};          // bouton → heure du dernier grésillement
  let neigeRadio = 0;         // fin de la neige sur la radio
  let eclat = 0;              // œil rouge jusqu'à
  let aiguille = 0.1;
  let points = null;          // rangée de points affichée
  const particules = [];

  const fileAff = [];
  let occupe = false;
  let minuteurAff = 0;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom === 'titre') majTitre();
    relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function annonce(texte, duree) {
    const el = $('annonce');
    el.textContent = texte;
    el.classList.add('actif');
    clearTimeout(annonce.m);
    annonce.m = setTimeout(() => el.classList.remove('actif'), duree || 1400);
  }

  // Cartes des 5 places, en haut de l'écran, et places du salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'embleme'; cv.width = 96; cv.height = 88;
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 48; cour.height = 36;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 24, 32, 20);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 96; cv.height = 96;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Pseudo d'un autre vrai joueur à la place s (null pour toi, un robot ou en solo).
  function pseudoDe(s) {
    const info = siegesActuels()[s];
    return info && info.humain && !info.moi && info.nom ? info.nom : null;
  }
  // Nom d'une place dans les messages : pseudo, sinon l'animal.
  function nomMessage(s) { return pseudoDe(s) || tr('nom.' + s); }
  // Pseudo raccourci pour les petites étiquettes (12 caractères au plus, avec « … »).
  function court(nom) {
    const c = Array.from(nom);
    return c.length > 12 ? c.slice(0, 11).join('') + '…' : nom;
  }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = court(texte);
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function monSiege() { return partie ? partie.siege : (session === 'solo' ? 0 : -1); }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const nbPlaces = e ? e.el.filter((x) => x !== -1).length : PLACES;
    const colonnes = 'repeat(' + nbPlaces + ', 1fr)';
    if ($('places').style.gridTemplateColumns !== colonnes) $('places').style.gridTemplateColumns = colonnes;
    const tour = e && !e.fini && !attenteTuto && (!partie || partie.phase === 'jeu') ? e.tour : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: s === monSiege(), chef: false };
      const absent = !!(e && e.el[s] === -1);
      d.classList.toggle('absent', absent);
      if (absent) continue;
      const pts = e ? e.sc[s] : 0;
      const txt = nb(pts);
      const p = d.querySelector('.pts');
      if (p.textContent !== txt) p.textContent = txt;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('aplat', !!(e && e.el[s] > 0));
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const aria = tr('place.aria.' + role, { nom: tr('nom.' + s), points: pts, piles: e ? e.pi[s] : 0 }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : '');
      if (d.getAttribute('aria-label') !== aria) d.setAttribute('aria-label', aria);
    }
  }

  function dessinerPlaces() {
    const e = vue;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s);
      if (d.classList.contains('absent')) continue;
      const cv = d.querySelector('canvas.embleme');
      const cle = e ? e.pi[s] + '/' + e.pm[s] + '/' + e.el[s] : 'x';
      if (cv.dataset.cle === cle) continue;
      cv.dataset.cle = cle;
      const cb = cv.getContext('2d');
      cb.clearRect(0, 0, cv.width, cv.height);
      embleme(cb, s, 48, 32, 28);
      if (e) piles(cb, 48, 68, e.pi[s], e.pm[s] || 3, e.pi[s] <= 1 ? '#ff5a5a' : '#7dffb0', 1.15);
      if (e && e.el[s] > 0) {
        cb.strokeStyle = '#ff5a5a'; cb.lineWidth = 4;
        cb.beginPath(); cb.moveTo(26, 12); cb.lineTo(70, 54); cb.moveTo(70, 12); cb.lineTo(26, 54); cb.stroke();
      }
    }
  }

  // Ce que doit faire le joueur de l'appareil maintenant.
  function texteMessage() {
    if (!partie && session !== 'solo') return '';
    if (partie && partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || (partie && partie.phase !== 'jeu') || e.fini) return '';
    const moi = monSiege();
    if (moi < 0) return tr('multi.attente');
    if (e.el[moi] > 0) return tr('tour.aplat');
    if (e.tour === moi) {
      if (diffuse || !pret) return tr('tour.ecoute');
      if (saisie.length < e.att.length) return tr('tour.rejoue', { n: saisie.length + 1, total: e.att.length });
      return tr('tour.ajoute');
    }
    const nom = pseudoDe(e.tour);
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + e.tour);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (vue && !vue.fini) {
      info += ' · ' + tr('jeu.chaine', { n: O.normales(vue.ch), total: vue.l });
      // Solo : tours qui me restent avant l'aube (à peu près : un tour par place encore en jeu).
      if (session === 'solo' && partie) info += ' · ' + tr('jeu.aube', { n: Math.max(1, Math.ceil((vue.ntmax - vue.nt + 1) / Math.max(1, O.enJeu(vue)))) });
    }
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    majEffets();
  }

  // Effets du tour en cours (petites étiquettes sous le message).
  function majEffets() {
    const e = vue;
    const liste = [];
    if (e && !e.fini && (!partie || partie.phase === 'jeu')) {
      if (e.cfg.rouge && session === 'solo') liste.push('rouge');
      if (e.ch.some((x) => x >= 10)) liste.push('voix');
      if (e.inv) liste.push('inter');
      if (e.echo) liste.push('echo');
      if (e.morte >= 0) liste.push('antenne');
      if (e.trou >= 0) liste.push('trou');
      if (e.noir) liste.push('noir');
    }
    const cle = liste.join(',');
    const boite = $('effets');
    if (boite.dataset.cle === cle) return;
    boite.dataset.cle = cle;
    boite.textContent = '';
    liste.forEach((p) => {
      const sp = document.createElement('span');
      sp.className = 'effet ' + p;
      sp.textContent = tr('effet.' + p);
      boite.appendChild(sp);
    });
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && !e.fini && partie.phase === 'jeu' && !fileAff.length) {
      const s = e.tour, sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran === 'jeu') {
      if (enPause) return;
      const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
      tPrec = t;
      dessinerJeu(performance.now(), dt);
      dessinerPlaces();
      majTemps();
      majCompte();
    } else if (ecran === 'titre') {
      dessinerTitre(performance.now());
    }
    rafId = requestAnimationFrame(boucle);
  }

  function peutJouer() {
    return !!(partie && vue && !vue.fini && !enPause && !attenteTuto && !fileAff.length && !occupe && pret && !diffuse &&
      partie.monTour() && vue.tour === partie.siege);
  }

  // Intensité d'une lumière allumée à l'heure table[i] (1 si elle est programmée plus tard).
  function lumiere(table, i, t, duree) {
    if (!table[i]) return 0;
    const ecart = t - table[i];
    return ecart < 0 ? 1 : Math.max(0, 1 - ecart / duree);
  }

  function dessinerJeu(t, dt) {
    const cv = $('scene'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    let sx = 0, sy = 0;
    if (secousse > t) { const k = (secousse - t) / 450; sx = (Math.random() - 0.5) * 12 * k; sy = (Math.random() - 0.5) * 8 * k; }
    c.translate(sx, sy);
    c.drawImage(decorVille(w, h, vue && vue.cfg.rouge && session === 'solo' ? 1 : 0), -10, -10, w + 20, h + 20);
    geo = geometrieRadio(w, h);
    const lums = [], lumsMoi = [], voix = [], nb2 = [];
    const tempo = vue ? vue.tp : 450;
    for (let i = 0; i < K; i++) {
      lums.push(Math.max(lumiere(lueurs, i, t, tempo * 0.9), lumiere(lueursMoi, i, t, 420)));
      lumsMoi.push(lumiere(lueursMoi, i, t, 420));
      voix.push(lumiere(voixLum, i, t, Math.max(500, tempo)));
      nb2.push(lumiere(neigeB, i, t, 380));
    }
    const jouable = peutJouer();
    const neige = neigeRadio > t ? Math.min(1, (neigeRadio - t) / 300) : 0;
    const ag = vue ? Math.min(1, 0.08 + O.normales(vue.ch) / Math.max(1, vue.l) * 0.9) : 0.1;
    aiguille += (ag - aiguille) * Math.min(1, dt * 4);
    dessinerRadio(c, geo, {
      radio: prog.radio, lums: lums, lumsMoi: lumsMoi, voix: voix, neigeB: nb2, neige: neige,
      noir: !!(vue && !vue.fini && vue.noir && diffuse),
      morte: vue && !vue.fini ? vue.morte : -1, antenneTombee: !!(vue && vue.morte >= 0),
      aiguille: aiguille, points: points, curseur: jouable && clavier ? curseur : -1, eclat: eclat > t
    }, t);
    // halo de mon tour au pied des boutons
    if (jouable) {
      c.strokeStyle = 'rgba(125,255,176,' + (0.25 + 0.15 * Math.sin(t / 250)) + ')'; c.lineWidth = 3;
      const b0 = geo.boutons[3], b2 = geo.boutons[5];
      rr(c, b0.x - b0.r - 12, geo.boutons[0].y - b0.r - 12, b2.x - b0.x + 2 * b0.r + 24, b0.y - geo.boutons[0].y + 2 * b0.r + 24, 18); c.stroke();
    }
    // particules (étincelles, neige)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 260) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      rond(c, p.x, p.y, p.k); c.fill();
      c.globalAlpha = 1;
    }
    // voile rouge d'une faute
    if (secousse > t) {
      c.fillStyle = 'rgba(255,40,40,' + (0.18 * (secousse - t) / 450) + ')';
      c.fillRect(-20, -20, w + 40, h + 40);
    }
    // nuit noire : la rediffusion se fait dans le noir
    if (vue && vue.noir && diffuse) {
      c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(-20, -20, w + 40, h + 40);
    }
  }

  function jaillir(i, coul, n) {
    if (!geo || !geo.boutons[i]) return;
    const p = geo.boutons[i];
    for (let k = 0; k < (n || 10); k++) {
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 80 + Math.random() * 160;
      particules.push({ x: p.x, y: p.y - p.r * 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.5 + Math.random() * 0.4, k: 2 + Math.random() * 2.5, coul: k % 2 ? coul : '#ffffff' });
    }
  }

  function pulsePlace(s, classe) {
    const d = $('place-' + s);
    if (!d) return;
    const c = classe || 'joue';
    d.classList.remove(c); void d.offsetWidth; d.classList.add(c);
  }

  // ---------------------------------------------------------------------
  //  File d'affichage
  // ---------------------------------------------------------------------

  function pousser(item) { fileAff.push(item); pomperAff(); }
  function viderFile() { fileAff.length = 0; occupe = false; clearTimeout(minuteurAff); diffuse = false; }

  function pomperAff() {
    while (!occupe && !enPause && fileAff.length) {
      const it = fileAff.shift();
      const j = jeton;
      let d = 0;
      try { d = traiterAff(it) || 0; } catch (err) { setTimeout(() => { throw err; }, 0); d = 0; }
      if (j !== jeton) return;
      if (d > 0) {
        occupe = true;
        minuteurAff = setTimeout(() => { if (j !== jeton) return; occupe = false; pomperAff(); }, d);
      }
    }
    majInterface();
  }

  // Ordre de la rediffusion : indices de la chaîne, morceau retourné par l'interférence.
  function ordreDiffusion(e) {
    const ordre = e.ch.map((_, i) => i);
    if (e.inv) {
      const a = e.inv[0], l = e.inv[1];
      const morceau = ordre.slice(a, a + l).reverse();
      for (let i = 0; i < l; i++) ordre[a + i] = morceau[i];
    }
    return ordre;
  }

  // Annonce des effets d'un tour (avant la rediffusion).
  function annoncerEffets(e) {
    const cles = [];
    if (e.inv) cles.push('inter');
    if (e.echo) cles.push('echo');
    if (e.morte >= 0) cles.push('antenne');
    if (e.trou >= 0) cles.push('trou');
    if (e.noir) cles.push('noir');
    return cles;
  }

  // La radio rediffuse la chaîne avant mon tour.
  function diffusion(e) {
    const items = [{ t: 'debut-diffusion', e: e }];
    const cles = annoncerEffets(e);
    if (cles.length) items.push({ t: 'effets', cles: cles, d: 650 + 250 * cles.length });
    const ordre = ordreDiffusion(e);
    ordre.forEach((idx, k) => items.push({ t: 'note', idx: idx, k: k, e: e }));
    items.push({ t: 'fin-diffusion', d: 250 });
    fileAff.push.apply(fileAff, items);
  }

  function traiterAff(it) {
    switch (it.t) {
      case 'manche': {
        vue = copie(it.etat);
        particules.length = 0;
        saisie = []; pret = false; diffuse = false; points = null;
        Object.keys(lueurs).forEach((k) => delete lueurs[k]);
        annonce(tr(session === 'solo' ? 'annonce.nuit' : 'annonce.manche', { n: session === 'solo' ? niveau : (partie ? partie.manche : 1) }), 1500);
        sons.neige(0.5);
        neigeRadio = performance.now() + 500;
        apresTour(vue, 900);
        return 0;
      }
      case 'debut-diffusion': {
        diffuse = true; pret = false; saisie = [];
        const e = it.e;
        points = { n: e.ch.length, k: 0, coul: [] };
        annonce(tr('annonce.diffusion'), 900);
        return 600;
      }
      case 'effets': {
        annonce(it.cles.map((k) => tr('annonce.' + k)).join(' · '), it.d + 500);
        it.cles.forEach((k, i) => setTimeout(() => { if (sons[k]) sons[k](); }, i * 220));
        if (it.cles.indexOf('antenne') >= 0) neigeB[vue ? vue.morte : 0] = performance.now();
        return it.d;
      }
      case 'note': return jouerNoteDiffusion(it);
      case 'fin-diffusion': {
        diffuse = false; pret = true; saisie = [];
        debutTour = Date.now();
        dernierTic = -1;
        if (vue) points = { n: vue.att.length + 1, k: 0, coul: [], ajout: true };
        sons.tour();
        if (clavier && curseur < 0) curseur = 0;
        return it.d;
      }
      case 'texte': annonce(tr(it.cle, it.vars), it.d + 400); return it.d;
      case 'pause': return it.d;
      case 'action': return traiterAction(it.ev);
      case 'resultat': return montrerResultat(it);
      case 'fin': afficherFinManche(it.etat); return 0;
      default: return 0;
    }
  }

  // Une note de la rediffusion (selon les effets du tour).
  function jouerNoteDiffusion(it) {
    const e = it.e, x = e.ch[it.idx], t = performance.now();
    const tempo = Math.round(e.tp * (e.echo ? 0.5 : 1));
    const duree = Math.max(0.18, tempo / 1000 * 0.9);
    const dansInv = e.inv && it.idx >= e.inv[0] && it.idx < e.inv[0] + e.inv[1];
    let coul = '#7dffb0';
    if (it.idx === e.trou) {
      // coupure : un grésillement à la place de la note
      sons.trou();
      neigeRadio = t + tempo;
      for (let i = 0; i < K; i++) neigeB[i] = t;
      coul = '#5d6a72';
    } else if (x >= 10) {
      const b = x - 10;
      voixGrave(b, duree * 1.2);
      voixLum[b] = t;
      secousse = Math.max(secousse, t + 160);
      coul = '#ff2a3a';
    } else if (x === e.morte) {
      sons.craque();
      neigeB[x] = t;
      coul = '#ffc23a';
    } else {
      tonalite(x, duree);
      if (!e.noir) { lueurs[x] = t; jaillir(x, TEINTES[x], 6); coul = TEINTES[x]; }
      else coul = '#e6ecef';
    }
    if (dansInv) { neigeRadio = t + tempo; if (it.k === e.inv[0]) sons.inter(); }
    if (points) { points.k = it.k + 1; points.coul[it.k] = dansInv ? '#c9d2e0' : coul; }
    return tempo;
  }

  // Après un tour (ou au début d'une manche) : rediffusion si c'est à moi.
  function apresTour(e, attente) {
    if (!e || e.fini) return;
    const moi = monSiege();
    saisie = []; pret = false;
    if (moi >= 0 && e.tour === moi && e.el[moi] === 0) {
      if (attente) fileAff.push({ t: 'pause', d: attente });
      diffusion(e);
    } else {
      points = null;
      debutTour = Date.now();
      dernierTic = -1;
    }
  }

  // Coup joué (le mien revient du moteur, ceux des autres arrivent un par un).
  function traiterAction(ev) {
    const avant = ev.avant, apres = ev.apres;
    const s = ev.siege, moi = ev.moi;
    const liste = ev.action || [];
    if (ev.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    pulsePlace(s);
    if (moi && !ev.auto) {
      // Mes appuis ont déjà été vus et entendus : seulement le résultat.
      fileAff.unshift({ t: 'resultat', ev: ev });
      return 0;
    }
    // Le tour d'un autre : sa progression, puis sa note ajoutée (ou sa faute).
    const L = liste.length;
    // Coups en retard (fin de manche entre robots, retour de pause) : affichage plus court.
    const d = fileAff.length > 2 ? 220 : Math.min(800, 160 + 55 * L);
    points = { n: avant.att.length + 1, k: L, coul: liste.map(() => COUL[s]), ajout: true, anim: { t0: performance.now(), d: d } };
    sons.neige(0.12);
    fileAff.unshift({ t: 'resultat', ev: ev });
    return d;
  }

  // Résultat d'un tour : note ajoutée, fréquence captée, faute, sortie.
  function montrerResultat(it) {
    const ev = it.ev, avant = ev.avant, apres = ev.apres, der = apres.der || {};
    const s = ev.siege, moi = ev.moi && !ev.auto;
    const t = performance.now();
    vue = copie(apres);
    saisie = []; pret = false;
    let d = 500;
    if (der.r === 'ok') {
      const p = der.p;
      if (!moi) { tonalite(p, 0.4); lueurs[p] = t; jaillir(p, TEINTES[p], 10); }
      else sons.ajout();
      if (der.c) {
        sons.capte();
        annonce(tr(moi ? 'annonce.capteToi' : 'annonce.capte', { nom: nomMessage(s) }), 1700);
        for (let i = 0; i < K; i++) setTimeout(() => { lueurs[i] = performance.now(); jaillir(i, TEINTES[i], 6); }, i * 90);
        if (moi) confettis(40);
        d = 1500;
      } else {
        if (moi) annonce(tr('annonce.ajoutToi'), 800);
        d = moi ? 420 : 560;
      }
    } else {
      // Faute : parasites, une pile en moins, la fréquence se brouille.
      sons.faux();
      setTimeout(() => sons.pile(), 260);
      secousse = t + 450;
      eclat = t + 900;
      neigeRadio = t + 700;
      for (let i = 0; i < K; i++) neigeB[i] = t + 200;
      pulsePlace(s, 'choc');
      const nom = nomMessage(s);
      let cle = moi ? 'annonce.fauxToi' : 'annonce.faux';
      if (der.v) cle = moi ? 'annonce.voixToi' : 'annonce.voix';
      else if (der.m) cle = moi ? 'annonce.morteToi' : 'annonce.morte';
      if (der.x) {
        setTimeout(() => sons.aplat(), 500);
        annonce(tr(moi ? 'annonce.aplatToi' : 'annonce.aplat', { nom: nom }), 1900);
        d = 1700;
      } else {
        annonce(tr(cle, { nom: nom }) + ' ' + tr('annonce.brouille'), 1700);
        d = 1400;
      }
      // Bouton touché à tort : flash rouge.
      if (der.p >= 0 && der.p < K) { voixLum[der.p] = t; }
    }
    points = null;
    if (fileAff.length > 2) d = Math.min(d, 450);
    if (apres.fini) return d + 200;
    fileAff.unshift({ t: 'pause', d: d });
    apresTour(apres, 0);
    return 0;
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': pousser({ t: 'action', ev: ev }); break;
      case 'fin': if (session === 'ligne' && partie.mode === 'en-ligne') finEnAttente = true; pousser({ t: 'fin', etat: copie(partie.etat) }); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      case 'refus': saisie = []; if (points) points.k = 0; toast(tr('multi.refus'), 1600); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
    if (raison === 'coupe' && vue && !vue.fini && partie && partie.phase === 'jeu' && vue.tour === partie.siege && !pret && !diffuse && !fileAff.length) apresTour(vue, 0);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    viderFile();
    if (partie.etat) vue = copie(partie.etat);
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else {
      bandeau('');
      // Arrivée en pleine manche : rediffusion tout de suite si c'est à moi.
      if (partie.phase === 'jeu' && partie.etat) { apresTour(vue, 300); pomperAff(); }
    }
  }

  function surManche() {
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    pousser({ t: 'manche', etat: copie(partie.etat) });
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 96, 96);
        embleme(c, s, 48, 54, 38);
        if (info.chef) couronne(c, 48, 20, 22);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { nom: tr('nom.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) {
        const nomChef = (sieges[partie.chef] || {}).nom;
        message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + tr('nom.' + partie.chef) : tr('nom.' + partie.chef) });
      }
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const ordre = O.classer(e);
    ordre.forEach((s, k) => {
      if (e.el[s] === -1) return;
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; embleme(cv.getContext('2d'), s, 30, 30, 28);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('nom.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.el[s] > 0 ? tr('fin.aplat', { n: e.sc[s] }) : tr('fin.ligneCl', { n: e.sc[s], piles: e.pi[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFinManche(e) {
    if (session === 'ligne' && partie && partie.mode === 'en-ligne') afficherFinEnLigne(e);
    else afficherFin(e);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne(e) {
    finEnAttente = false;
    if (!e || !partie) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && O.classer(e)[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche || 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    if (partie.phase === 'salon') ouvrirSalon();
  }

  function etoilesPour(n, chaine) {
    const o = NIVEAUX[n - 1].o;
    return chaine >= o[1] ? 3 : (chaine >= o[0] ? 2 : 1);
  }

  function afficherFin(e) {
    if (!e) return;
    const moi = monSiege() >= 0 ? monSiege() : 0, sieges = siegesActuels();
    const pts = e.sc[moi];
    const gagne = e.el[moi] === 0 && e.fini && O.classer(e)[0] === moi;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = tr('fin.points', { n: pts, piles: e.pi[moi] });
    $('fin-chaine').textContent = tr('fin.chaine', { n: e.lg[moi] });
    $('fin-cadeau').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      enPartie = false;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? etoilesPour(niveau, e.lg[moi]) : 0;
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      if (e.lg[moi] > prog.chaines[i]) prog.chaines[i] = e.lg[moi];
      let debloque = false;
      const cadeaux = [];
      if (gagne) {
        const avant = totalEtoiles();
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        const apresTotal = totalEtoiles();
        RADIOS.forEach((o, k) => { if (k > 0 && avant < o.seuil && apresTotal >= o.seuil) cadeaux.push(tr('fin.radio', { nom: tr('radio.' + o.id) })); });
        CASSETTES.forEach((p, k) => { if (p.niveau === niveau && !prog.cassettes[k]) { prog.cassettes[k] = true; cadeaux.push(tr('fin.cassette', { nom: tr('cassette.' + k + '.nom') })); } });
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      const aube = e.nt >= e.ntmax && O.enJeu(e) > 1;
      $('fin-titre').textContent = gagne ? tr(etoiles === 3 ? 'fin.parfait' : (aube ? 'fin.aube' : 'fin.gagne')) : tr(e.el[moi] > 0 ? 'fin.aplatToi' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      const o = NIVEAUX[i].o;
      $('fin-chaine').textContent = tr('fin.chaine', { n: e.lg[moi] }) + ' · ' + tr('fin.objectifs', { a: o[0], b: o[1] });
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-cadeau').textContent = cadeaux.join(' ');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (monSiege() >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie ? partie.manche || 1 : 1 });
      finManche = Date.now() + R.pauseManche;
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
  }

  // Étincelles de victoire (couleurs des boutons).
  function confettis(nombre) {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < (nombre || 90); i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 60, vy: 90 + Math.random() * 140, r: Math.random() * 6, vr: (Math.random() - 0.5) * 6, coul: TEINTES[i % K], k: 4 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin(t / 300 + b.r) * 0.6; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul;
        c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux
  // ---------------------------------------------------------------------

  // Arrête le moteur (la manche affichée reste à l'écran).
  function arreterPartie() {
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
  }

  function quitterPartie() {
    jeton++;
    arreterPartie();
    viderFile();
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    saisie = []; pret = false; diffuse = false; points = null;
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  function apercu(n) { return R.depart(window.JEL_MULTI.hasard(7 + n), PLACES, { niveau: n }); }

  // Parcours solo : nuit n contre des robots (force croissante).
  function demarrerNiveau(n) {
    quitterPartie();
    session = 'solo';
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    enPartie = true;
    vue = apercu(niveau);
    particules.length = 0;
    afficherEcran('jeu');
    const aVoir = (NIVEAUX[niveau - 1].tuto || []).filter((x) => prog.tutos.indexOf(x) < 0);
    const suite = () => {
      const cle = aVoir.shift();
      if (!cle) { attenteTuto = false; lancerNiveau(); return; }
      attenteTuto = true;
      montrerTuto(cle, () => { if (prog.tutos.indexOf(cle) < 0) prog.tutos.push(cle); suite(); });
    };
    suite();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    arreterPartie();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : salon, manches, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((cfg, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;

      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, et);
      b.setAttribute('aria-label', (ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n })) + (cfg.pj < 3 ? ' · ' + tr('effet.rouge') : ''));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    remplirRadios();

  }

  function remplirRadios() {
    const boite = $('liste-radios');
    boite.textContent = '';
    RADIOS.forEach((o, i) => {
      const ouvert = radioOuverte(i);
      const b = document.createElement('button');
      b.type = 'button';

      dessinerRadio(c, g, { radio: i, lums: ouvert ? [0.6, 0, 0.6, 0, 0.6, 0] : [0, 0, 0, 0, 0, 0], aiguille: 0.4 }, 0);
      c.restore();
      const nom = document.createElement('span'); nom.textContent = tr('radio.' + o.id);

  let ecouteCassette = 0;
  function remplirCassettes() {

    CASSETTES.forEach((p, i) => {
      const ouvert = prog.cassettes[i];

      b.className = 'objet' + (ouvert ? '' : ' ferme');

      const pied = document.createElement('small');

      b.append(cv, nom, pied);

        });
