<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)

  function boutonEffacer(options) {

    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

  // Règles avec les valeurs par défaut des réglages facultatifs.
  function completer(r) {

  //   alea()                 hasard du serveur (Math.random par défaut)
  //   salon                  true (en ligne) : salon d'attente avant chaque manche, lancée par le chef
  //   enchainer              false : pas de nouvelle manche automatique (solo à niveaux)
  //   delaiJoueur            remplace celui des règles (Infinity : jamais de robot à sa place)
  //   force                  force des robots (forceEnLigne des règles par défaut)
  //   options                options des manches (ex. { niveau: 3 }) ; sinon { manche: n }
  // }

    for (var s = 0; s < this.places; s++) this.sieges.push(null);
    this.attente = [];                      // joueurs qui attendent une place (remplacement 'manche')
    this.arrivees = [];                     // vrais joueurs présents, dans l'ordre d'arrivée (le 1er est le chef)
    this.etat = null;
    this.n = 0;                             // numéro du dernier message de jeu (manche ou action)
    this.manche = 0;
    this.phase = 'attente';                 // 'attente' (rien commencé), 'salon', 'jeu', 'pause' (entre deux manches, solo)
    this.finManche = 0;                     // fin de la pause entre deux manches (ms)
    this.salonDepuis = 0;                   // ouverture du salon (ms), pour son lancement automatique
    this.echeance = null;                   // { siege, quand } : temps laissé à un vrai joueur
    this.options = null;                    // options de la manche en cours

  Arbitre.prototype.maintenant = function () { return this.reglages.maintenant ? this.reglages.maintenant() : Date.now(); };
  Arbitre.prototype.alea = function () { return this.reglages.alea ? this.reglages.alea() : Math.random(); };
  Arbitre.prototype.force = function () { return typeof this.reglages.force === 'number' ? this.reglages.force : this.r.forceEnLigne; };

  // Un vrai joueur arrive. Renvoie sa place, -1 s'il attend la manche suivante,

  // --- Partie, côté jeu -----------------------------------------------------
  // o : {
  //   regles        window.JEL_REGLES

  //                 { type: 'debut', reste } (arrivée dans une partie : etat, siege, sieges,
  //                 phase : 'salon' le plus souvent) ;
  //                 { type: 'salon', reste } (salon d'attente, en ligne : avant la 1re manche et
  //                 après chacune ; le chef peut lancer, sinon lancement seul dans reste ms) ;
  //                 { type: 'manche' } (nouvelle manche, etat de départ) ;
  //                 { type: 'action', siege, action, avant, apres, auto, moi } ;
  //                 { type: 'fin', resultat } (fin(etat) des règles) ;
  //                 { type: 'sieges' } (un vrai joueur arrive ou part, ou le chef change) ; { type: 'refus' }

  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),

  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {
    try { return racine.parent && racine.parent !== racine; } catch (e) { return false; }
  }

  // Invitation du bouton « Rejoindre » (window.JEL_REJOINDRE = { partie }, posé par le

    this.manche = 0;
    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.noms = [];            // pseudo des vrais joueurs par place (en ligne), ou null

    this.debutPause = 0;

    if (this.o.enLigne !== false && dansLanceur()) {

      racine.addEventListener('message', this.ecoute);

      var inv = invitation();
      if (inv) { demande.partie = inv.partie; invitationUtilisee = true; }   // partie d'un ami (« Rejoindre »)
      try { racine.parent.postMessage(demande, '*'); } catch (e) { /* pas de lanceur */ }

      this.minuteurConnexion = setTimeout(function () { moi.passerSolo('delai'); }, DELAI_CONNEXION);

    }

  // Arrête tout (connexion, robots locaux, file) sans rien annoncer.
  Partie.prototype.arreter = function () {

    clearTimeout(this.minuteurReveil);
    clearTimeout(this.minuteurConnexion);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'connexion' || this.mode === 'en-ligne') {

    }

  Partie.prototype.recevoirLanceur = function (e) {
    if (e.source !== racine.parent) return;

      else if (this.mode === 'en-ligne') { this.versSolo = true; this.pomper(); }

  };

  // Partie contre des robots sur l'appareil (choix, pas de site, ou serveur absent).
  Partie.prototype.passerSolo = function (raison) {

  };

  Partie.prototype.creerArbitreLocal = function () {

      enchainer: this.o.enchainer !== false,

    });
  };

  // Connexion coupée pendant une partie en ligne : la partie continue sur

  Partie.prototype.basculer = function () {

    var a = this.creerArbitreLocal();
    var sieges = [];
    for (var s = 0; s < this.r.places; s++) sieges.push(s === this.siege ? 'moi' : null);
    a.restaurer({
      v: PROTOCOLE, sieges: sieges, attente: [], etat: copie(this.etat), n: this.n, manche: this.manche,
      phase: this.phase, finManche: Date.now() + this.r.pauseManche, echeance: null, options: this.options,
    });

    this.attendEcho = false;
    this.noms = [];
    this.humains = a.flagsSieges();
    this.changerMode('solo', 'coupe');

    if (a.phase === 'jeu') a.avancer(0);
    this.programmerReveil();
  };

  Partie.prototype.programmerReveil = function () {
    clearTimeout(this.minuteurReveil);
    if (!this.local || this.enPause) return;
    var t = this.local.prochainReveil();
    if (t === null || !isFinite(t)) return;
    var moi = this;

    delaiBot: 900,
    delaiJoueur: 30000,
    pauseManche: 8000,

    remplacement: 'tour',

          d: d, c: a.c, de: de, a: de, v: 0, bl: bloque, mb: false, vol: false, ca: cache === a.a || cache === a.b

        main[a.a] = carte(alea, e.mx);
        main[a.b] = carte(alea, e.mx);
        if (cache === a.a || cache === a.b) e.cache[place] = -1;
      }

      e.tour = (place + 1) % e.pos.length;

        e.tours += 1;

    },

    // Robot : essaie toutes les paires de cartes visibles et toutes les
    // opérations ; mine le meilleur astéroïde atteignable (de plus en plus
    // souvent avec la force), sinon pose une balise sur un gros astéroïde,
    // sinon dérive vers le plus rentable. Une part de hasard le fait varier.

      for (i = 0; i < 3; i++) {
        for (j = i + 1; j < 3; j++) {

          for (k = 0; k < ops.length; k++) {
            var r = poussee(e, place, main[i], main[j], ops[k]).r;
            for (var n = 0; n < e.ast.length; n++) {

              coups.push({ act: { t: 'm', a: i, b: j, op: ops[k], c: z.p }, v: val });

      var cible = auHasard(libres, alea);

        var mieux = -1e9;

          var note = (z.v - (pirateAPortee(e, z.p) ? 1 : 0)) / (1 + dist(e, e.pos[place], z.p)) + alea() * 0.1;
          if (note > mieux) { mieux = note; cible = z; }

      var pa = auHasard(paires.length ? paires : [[0, 1]], alea);

    },

    fin: function (e) {
      if (e.ast.length && e.tours < e.tm) return null;
      var cl = [];
      for (var s = 0; s < e.cr.length; s++) cl.push(s);
      cl.sort(function (x, y) { return (e.cr[y] - e.cr[x]) || (x - y); });
      return { classement: cl, scores: e.cr.slice() };
    },

    // Outils partagés avec l'écran du jeu (mêmes calculs que les règles).
    outils: {
      dist: dist, cheb: cheb, ligne: ligne, col: col, astSur: astSur, poussee: poussee, preparer: preparer,

    }
  };

<script>
(function () {
  'use strict';

  // =====================================================================
  //  Les cargos de la ceinture d'astéroïdes — jeu de calcul et de stratégie
  //  À son tour, on combine deux cartes de poussée pour viser exactement la
  //  distance d'un astéroïde : pile dessus, on mine ses cristaux. Solo :
  //  20 secteurs contre 3 robots. En ligne : de vrais joueurs remplacent les
  //  robots (moteur commun JEL_MULTI). Règles et secteurs : bloc jel-regles.
  // =====================================================================

  const JEU = 'les-cargos-de-la-ceinture-d-asteroides';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.secteurs;               // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const copie = (x) => JSON.parse(JSON.stringify(x));

  // Une couleur par place : 0 bleu, 1 rose, 2 orange, 3 vert.
  const COUL = ['#3fc8ff', '#ff5fa8', '#ffb23f', '#5fe08a'];
  const COUL_F = ['#0f5a8a', '#8f1f57', '#8a5200', '#1d7a42'];
  // Quatre nébuleuses de cinq secteurs : fond, lueurs.
  const NEBULEUSES = [
    { a: '#1c3c96', b: '#090a26', c: '#3fc8ff', d: '#7b5cff' },
    { a: '#93304f', b: '#170a22', c: '#ff8f7a', d: '#ffb23f' },
    { a: '#17705a', b: '#06161c', c: '#5fe0b0', d: '#3fc8ff' },
    { a: '#5e2aa4', b: '#120a2c', c: '#ffb0f0', d: '#7ef0d8' }
  ];
  const neb = (n) => Math.max(0, Math.min(3, Math.floor(n / 5)));
  const SEUILS_CARGOS = [0, 9, 18, 30, 42, 54];
  const AUTOS = ['premier', 'moins', 'fois', 'geant', 'trou', 'balise', 'tempete', 'serie', 'pirates', 'corail', 'parfait', 'champion', 'enligne'];
  const AUTO_COUL = {
    premier: '#3fc8ff', moins: '#ff8f7a', fois: '#ffb23f', geant: '#ffd23f', trou: '#9b6bff', balise: '#5fd2ff', tempete: '#ff8a3d',
    serie: '#5fe08a', pirates: '#ff5f6a', corail: '#ff7f9f', parfait: '#ffe27a', champion: '#ffd23f', enligne: '#7ef0d8'
  };
  const OPS = { '+': 'plus', '-': 'moins', x: 'fois' };

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#15144a"/><circle cx="10.4" cy="8" r="1.6" fill="#15144a"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#15144a"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const ICONE_CRISTAL = '<svg viewBox="0 0 13 15" aria-hidden="true"><path d="M6.5 0l6 5-6 10-6-10z" fill="currentColor"/><path d="M6.5 0l2 5-2 10-2-10z" fill="#ffffff66"/></svg>';

  // Tutoriels : mini-secteur (dessiné comme les vrais), cargo, cartes et gestes.
  // pos : case du cargo [ligne, colonne] ; cible : case visée ; pick : cartes jouées ;
  // op ; tourne : l'astéroïde tourne d'abord ; balise : pose d'une balise ; cache : carte cachée.
  const TUTOS = {
    base: { g: ['......', '......', '.....a'], pos: [1, 0], cible: [2, 5], cartes: [2, 4, 5], pick: [0, 1], op: '+', ops: '+' },
    gros: { g: ['......', '....b.', '......'], pos: [2, 0], cible: [1, 4], cartes: [1, 4, 6], pick: [0, 1], op: '+', ops: '+' },
    moins: { g: ['......', '...a..', '......'], pos: [1, 0], cible: [1, 3], cartes: [9, 6, 2], pick: [0, 1], op: '-', ops: '+-' },
    geant: { g: ['.....c', '......', '......'], pos: [2, 0], cible: [0, 5], cartes: [4, 3, 1], pick: [0, 1], op: '+', ops: '+-' },
    fois: { g: ['......b', '.......', '.......'], pos: [2, 0], cible: [0, 6], cartes: [2, 4, 7], pick: [0, 1], op: 'x', ops: '+-x' },
    tourne: { g: ['......', '...rO.', '......'], pos: [2, 0], cible: [0, 3], cartes: [2, 3, 6], pick: [0, 1], op: '+', ops: '+-x', tourne: true },
    doubleur: { g: ['.N....', '......', '.....b'], pos: [1, 0], cible: [2, 5], cartes: [1, 2, 8], pick: [0, 1], op: '+', ops: '+-x' },
    diviseur: { g: ['.D....', '....a.', '......'], pos: [1, 0], cible: [1, 4], cartes: [5, 3, 1], pick: [0, 1], op: '+', ops: '+-x' },
    balise: { g: ['......', '....c.', '......'], pos: [1, 0], cible: [1, 4], cartes: [4, 7, 1], pick: [0], op: '+', ops: '+-x', balise: true },
    pirate: { g: ['....P.', '...a..', '......'], pos: [2, 0], cible: [1, 3], cartes: [1, 3, 6], pick: [0, 1], op: '+', ops: '+-x' },
    tempete: { g: ['......', '.....a', '......'], pos: [1, 0], cible: [1, 5], cartes: [3, 6, 2], pick: [0, 2], op: '+', ops: '+-x', cache: 1 }
  };

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], autos: [], cargo: 0, options: { son: true }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);
  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (Array.isArray(d.autos)) prog.autos = d.autos.filter((x) => AUTOS.indexOf(x) >= 0);
      prog.cargo = entier(d.cargo, 0, SEUILS_CARGOS.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try {
      const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1';
      const a = JSON.parse(localStorage.getItem(JEU + '-autos') || '[]');
      if (Array.isArray(a)) a.forEach((x) => { if (AUTOS.indexOf(x) >= 0 && prog.autos.indexOf(x) < 0) prog.autos.push(x); });
    } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (SEUILS_CARGOS[prog.cargo] > totalEtoiles()) prog.cargo = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.autos = [];
    prog.cargo = 0;
    try { localStorage.removeItem(JEU + '-autos'); } catch (e) { /* rien */ }
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), autos: prog.autos.slice(), cargo: prog.cargo, options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Son, cargo choisi, autocollants : jamais de nouvelle sauvegarde depuis
  // l'écran titre ou le hangar, seulement la mise à jour d'une sauvegarde existante.
  function sauverReglages() {
    try {
      localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0');
      localStorage.setItem(JEU + '-autos', JSON.stringify(prog.autos));
    } catch (e) { /* stockage refusé */ }
    try {
      if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, cargo: prog.cargo, autos: prog.autos.slice() });
    } catch (e) { /* rien */ }
  }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.vibrato) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vibrato; lg.gain.value = f * 0.06;
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);

    // ceinture : bande d'astéroïdes en diagonale
    const al = graineHasard(23);
    for (let i = 0; i < 26; i++) {
      const k = i / 25, x = -u + k * (w + 2 * u), y = h * 0.5 - (k - 0.5) * h * 0.22 + (al() - 0.5) * u * 1.6;
      const taille = u * (0.22 + al() * 0.38);
      asteroide(c, x, y, taille, 1 + Math.floor(al() * 3), i + 3, 0);
    }
    // les quatre cargos, en route vers les cristaux
    cargo(c, 0, 0, w * 0.2, h * 0.32, u * 0.85, 0.5, 0.8);
    cargo(c, 1, 1, w * 0.46, h * 0.41, u * 0.7, -0.3, 0.6);
    cargo(c, 5, 2, w * 0.82, h * 0.6, u * 0.62, -1.1, 0.7);
    cargo(c, 4, 3, w * 0.32, h * 0.62, u * 0.66, 0.9, 0.5);
    c.fillStyle = '#ffffff';
    [[0.12, 0.2], [0.6, 0.18], [0.9, 0.48], [0.07, 0.55], [0.55, 0.66]].forEach((p) => etincelle(c, w * p[0], h * p[1], u * 0.12));
  }

  // ---------------------------------------------------------------------
  //  Le plateau : dessin de la grille (jeu et tutoriels)
  // ---------------------------------------------------------------------

  function geometrie(e, w, h, marge) {
    const s = Math.min((w - 2 * marge) / e.W, (h - 2 * marge) / e.H, 76);
    return { s: s, ox: (w - s * e.W) / 2, oy: (h - s * e.H) / 2 };
  }
  function cellXY(e, g, p) { return [g.ox + (O.col(e, p) + 0.5) * g.s, g.oy + (O.ligne(e, p) + 0.5) * g.s]; }
  function lisse(p) { return p < 0 ? 0 : p > 1 ? 1 : p * p * (3 - 2 * p); }

  // Position animée : d'une case à l'autre, à partir de t0, en dur ms.
  function posAnim(e, g, an, pFinal, t) {
    if (!an) return cellXY(e, g, pFinal);
    const k = lisse((t - an.t0) / an.dur);
    const a = cellXY(e, g, an.de), b = cellXY(e, g, an.a);
    return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, k];
  }

  // opt : t, anims, moi (place du joueur), cible, distances, formes (forme du cargo par place), caps
  function dessinerPlateau(c, e, g, opt) {
    const s = g.s, t = opt.t || 0, W = e.W, H = e.H;
    const an = opt.anims || {};
    // cases
    for (let p = 0; p < W * H; p++) {
      const x = g.ox + O.col(e, p) * s, y = g.oy + O.ligne(e, p) * s;
      c.fillStyle = (O.ligne(e, p) + O.col(e, p)) % 2 ? 'rgba(255,255,255,.045)' : 'rgba(255,255,255,.075)';
      rr(c, x + 1.5, y + 1.5, s - 3, s - 3, s * 0.16); c.fill();
    }
    // halos des trous noirs (3 × 3) et des pirates
    e.tn.forEach((z) => {
      const x = g.ox + (O.col(e, z.p) - 1) * s, y = g.oy + (O.ligne(e, z.p) - 1) * s;
      c.fillStyle = z.d ? 'rgba(122,140,255,.14)' : 'rgba(255,138,61,.14)';
      rr(c, x + 2, y + 2, s * 3 - 4, s * 3 - 4, s * 0.3); c.fill();
    });
    e.pir.forEach((z, i) => {
      const q = posAnim(e, g, an.pir && an.pir[i], z.p, t);
      c.save(); c.setLineDash([s * 0.12, s * 0.1]); c.strokeStyle = 'rgba(255,80,100,.6)'; c.lineWidth = Math.max(1.5, s * 0.035);
      c.fillStyle = 'rgba(255,60,90,.08)';
      rr(c, q[0] - s * 1.45, q[1] - s * 1.45, s * 2.9, s * 2.9, s * 0.3); c.fill(); c.stroke(); c.restore();
    });
    // orbites et pivots
    e.piv.forEach((p) => {
      const q = cellXY(e, g, p);
      c.save(); c.setLineDash([s * 0.08, s * 0.12]); c.strokeStyle = 'rgba(154,166,255,.55)'; c.lineWidth = Math.max(1.5, s * 0.04);
      rr(c, q[0] - s, q[1] - s, s * 2, s * 2, s * 0.5); c.stroke(); c.restore();
      // petite flèche : sens des aiguilles d'une montre
      c.fillStyle = 'rgba(154,166,255,.9)';
      c.beginPath(); c.moveTo(q[0] + s * 0.12, q[1] - s - s * 0.14); c.lineTo(q[0] + s * 0.34, q[1] - s); c.lineTo(q[0] + s * 0.12, q[1] - s + s * 0.14); c.closePath(); c.fill();
      pivot(c, q[0], q[1], s * 0.38, t);
    });
    e.tn.forEach((z) => { const q = cellXY(e, g, z.p); trouNoir(c, q[0], q[1], s * 0.42, z.d, t); });
    // chemin du cargo vers l'astéroïde visé (une pastille par case à compter)
    if (opt.moi >= 0 && opt.cible >= 0 && O.astSur(e, opt.cible)) {
      const de = e.pos[opt.moi], r1 = O.ligne(e, opt.cible), c1 = O.col(e, opt.cible);
      c.fillStyle = COUL[opt.moi];
      let r = O.ligne(e, de), cc = O.col(e, de), n = 0;
      while ((r !== r1 || cc !== c1) && n < 40) {
        if (r !== r1) r += r1 > r ? 1 : -1; else cc += c1 > cc ? 1 : -1;
        n++;
        if (r === r1 && cc === c1) break;
        const x = g.ox + (cc + 0.5) * s, y = g.oy + (r + 0.5) * s;
        c.globalAlpha = 0.5 + 0.3 * Math.sin(t / 200 - n * 0.6);
        rond(c, x, y, Math.max(2.5, s * 0.08)); c.fill();
      }
      c.globalAlpha = 1;
    }
    // astéroïdes minés : éclats qui s'envolent
    (an.fantomes || []).forEach((f) => {
      const k = (t - f.t0) / 600;
      if (k < 0 || k > 1) return;
      const q = cellXY(e, g, f.p);
      c.globalAlpha = 1 - k;
      asteroide(c, q[0], q[1], s * (0.3 + f.v * 0.04) * (1 + k * 0.6), f.v, f.i, t);
      c.globalAlpha = 1;
    });
    // astéroïdes
    e.ast.forEach((z) => {
      const q = posAnim(e, g, an.ast && an.ast[z.i], z.p, t);
      const k = s * (0.27 + z.v * 0.045);
      if (opt.cible === z.p && opt.moi >= 0) {
        c.strokeStyle = COUL[opt.moi]; c.lineWidth = Math.max(3, s * 0.07);
        rond(c, q[0], q[1], s * 0.46 + Math.sin(t / 160) * s * 0.03); c.stroke();
      }
      asteroide(c, q[0], q[1], k, z.v, z.i + 1, t);
      if (z.b >= 0) balise(c, q[0] - k * 0.75, q[1] - k * 0.2, s * 0.42, z.b, t);
    });
    // pirates
    e.pir.forEach((z, i) => { const q = posAnim(e, g, an.pir && an.pir[i], z.p, t); pirate(c, q[0], q[1], s * 0.36, t); });
    // cargos
    for (let p = 0; p < e.pos.length; p++) {
      const a = an.cargo && an.cargo[p];
      const q = posAnim(e, g, a, e.pos[p], t);
      const vol = a && t - a.t0 < a.dur ? 1 : 0;
      if (p === opt.moi) { c.fillStyle = COUL[p] + '33'; rond(c, q[0], q[1], s * 0.47); c.fill(); }
      const ang = (opt.caps && opt.caps[p]) || 0;
      const dx = a && a.derive && vol ? Math.sin((t - a.t0) / 40) * s * 0.05 : 0;
      cargo(c, (opt.formes && opt.formes[p]) || 0, p, q[0] + dx, q[1], s * 0.38, ang, vol ? 0.6 + 0.4 * Math.sin(t / 50) : 0);
    }
    // distances (au tour du joueur) : petite pastille sur chaque astéroïde
    if (opt.distances && opt.moi >= 0) {
      c.font = '800 ' + Math.max(11, Math.round(s * 0.27)) + 'px system-ui, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      e.ast.forEach((z) => {
        if (an.ast && an.ast[z.i] && t - an.ast[z.i].t0 < an.ast[z.i].dur) return;
        const q = cellXY(e, g, z.p), d = O.dist(e, e.pos[opt.moi], z.p);
        const x = q[0] + s * 0.3, y = q[1] - s * 0.3, r = Math.max(9, s * 0.19);
        const prise = z.b >= 0 && z.b !== opt.moi;
        c.fillStyle = prise ? '#55536f' : (opt.cible === z.p ? '#ffd23f' : '#ffffff');
        rond(c, x, y, r); c.fill();
        c.strokeStyle = '#15144a'; c.lineWidth = 1.5; c.stroke();
        c.fillStyle = prise ? '#cfcfe0' : '#15144a';
        c.fillText(nb(d), x, y + 0.5);
      });
    }
    // libellés flottants (calcul joué, cristaux gagnés…)
    (an.libelles || []).forEach((l) => {
      const k = (t - l.t0) / l.dur;
      if (k < 0 || k > 1) return;
      const q = cellXY(e, g, l.p);
      c.globalAlpha = k < 0.8 ? 1 : (1 - k) / 0.2;
      c.font = '900 ' + Math.max(13, Math.round(s * 0.32)) + 'px system-ui, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      const y = q[1] - s * 0.6 - k * s * 0.5;
      const lw = c.measureText(l.texte).width + 14;
      const x = Math.max(g.ox + lw / 2, Math.min(g.ox + W * s - lw / 2, q[0]));
      c.fillStyle = 'rgba(10,8,40,.85)'; rr(c, x - lw / 2, y - s * 0.24, lw, s * 0.48, s * 0.2); c.fill();
      c.fillStyle = l.coul; c.fillText(l.texte, x, y + 1);
      c.globalAlpha = 1;
    });
    // tempête solaire : voile orangé qui palpite
    if (e.meteo === 2) {
      c.fillStyle = 'rgba(255,140,60,' + (0.08 + 0.05 * Math.sin(t / 130)).toFixed(3) + ')';
      c.fillRect(g.ox, g.oy, W * s, H * s);
    } else if (e.meteo === 1) {
      c.strokeStyle = 'rgba(255,160,60,' + (0.35 + 0.3 * Math.sin(t / 200)).toFixed(2) + ')'; c.lineWidth = 4;
      rr(c, g.ox - 3, g.oy - 3, W * s + 6, H * s + 6, s * 0.2); c.stroke();
    }
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#15144a'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // Écriture d'un calcul : « 4 + 3 = 7 », « (4 + 3) × 2 = 14 »… (carte cachée : « ? »).
  function equation(x, y, op, mods, r, cachee) {
    let a = x, b = y;
    // soustraction : le grand nombre d'abord (sauf si une carte est cachée)
    if (op === '-' && !cachee && b > a) { a = y; b = x; }
    const ta = cachee === 'a' ? '?' : nb(a), tb = cachee === 'b' ? '?' : nb(b);
    let texte = ta + ' ' + tr('op.' + OPS[op]) + ' ' + tb;
    (mods || []).forEach((m) => { texte = '(' + texte + ') ' + tr(m === 'x' ? 'op.fois' : 'op.div') + ' ' + nb(2); });
    return texte + ' = ' + (cachee ? '?' : nb(r));
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 secteurs) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let attenteTuto = false;
  let dernierAttends = 0;
  let anims = { cargo: {}, ast: {}, pir: {}, fantomes: [], libelles: [] };
  let caps = [0, 0, 0, 0];
  let texteCoup = '';         // ce qu'a fait le dernier cargo (montré pendant l'attente)
  let mainAvant = null;       // cartes affichées (animation de pioche)
  const particules = [];
  const sel = { c: -1, cartes: [], op: '+', balise: false };
  const stats = { serie: 0, vole: false };
  let gagnesManche = [];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'hangar', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'titre' ? 'block' : 'none';
    if (nom === 'titre') { dessinerTitre(); majTitre(); }

  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    // Au-dessus d'une fenêtre (salon, fin) : en haut de l'écran, pour ne cacher aucun bouton.
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif') || $('voile-tuto').classList.contains('actif') || ecran !== 'jeu');
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Forme du cargo d'une place : le cargo choisi au hangar pour le joueur de l'appareil.
  function formeDe(s) { return partie && s === partie.siege ? prog.cargo : 0; }

  // Cartes des 4 places, en haut de l'écran, et places du salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);

      const pts = document.createElement('span'); pts.className = 'pts';

      cour.setAttribute('aria-hidden', 'true');

      d.append(cv, pts, tag, cour);
      boite.appendChild(d);

      salon.appendChild(d);

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role;
    tag.dataset.nom = nom;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Qui est la place s, pour les messages : « Toi », le pseudo, sinon « Cargo bleu ».
  function quiEst(s) {
    const info = siegesActuels()[s] || {};
    if (partie && s === partie.siege) return tr('place.toi');
    return info.humain && info.nom ? info.nom : tr('cargo.place.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.cr[s] : 0;
      const p = d.querySelector('.pts');
      if (p.dataset.n !== String(pts)) {
        p.dataset.n = String(pts); p.innerHTML = ICONE_CRISTAL;
        const sp = document.createElement('span'); sp.textContent = nb(pts); p.appendChild(sp);
      }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const f = String(formeDe(s));
      const cv = d.querySelector('canvas.vaisseau');
      if (cv.dataset.f !== f) { cv.dataset.f = f; const c = cv.getContext('2d'); c.clearRect(0, 0, 84, 84); medaillon(c, s, formeDe(s), 42, 42, 40); }
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { cargo: tr('cargo.place.' + s), n: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const tour = e ? tr('jeu.tour', { n: Math.min(e.tours + 1, e.tm), total: e.tm }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + (tour ? ' · ' + tour : '');
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + (tour && partie.phase === 'jeu' ? ' · ' + tour : '');
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function monTour() { return !!(partie && vue && !enPause && !attenteTuto && partie.phase === 'jeu' && partie.monTour()); }

  // Cartes, opérations, ligne de calcul et bouton de propulsion.
  function majCommandes() {
    const e = vue, moi = partie ? partie.siege : -1;
    const actif = !!(e && moi >= 0 && partie && (partie.phase === 'jeu' || partie.phase === 'pause'));
    const mt = monTour();
    $('commandes').classList.toggle('attente', !mt);
    const main = actif ? e.cartes[moi] : null, cache = actif ? e.cache[moi] : -1;
    if (sel.c >= 0 && e && !O.astSur(e, sel.c)) sel.c = -1;
    for (let k = 0; k < 3; k++) {
      const b = $('carte-' + k);
      if (!main) { b.textContent = ''; b.dataset.v = ''; b.disabled = true; b.classList.remove('choisie', 'cachee'); continue; }
      const cachee = cache === k;
      const cle = (cachee ? 'c' : '') + main[k];
      if (b.dataset.v !== cle) {
        if (mainAvant && b.dataset.v) { b.classList.remove('nouvelle'); void b.offsetWidth; b.classList.add('nouvelle'); }
        b.dataset.v = cle;
        b.textContent = cachee ? '?' : nb(main[k]);
        const parite = tr(main[k] % 2 ? 'carte.impair' : 'carte.pair');
        if (cachee) { const sm = document.createElement('small'); sm.textContent = parite; b.appendChild(sm); }
        b.setAttribute('aria-label', cachee ? tr('carte.ariaCachee', { parite: parite }) : tr('carte.aria', { n: main[k] }));
      }
      b.disabled = false;
      b.classList.toggle('choisie', sel.cartes.indexOf(k) >= 0);
      b.classList.toggle('cachee', cachee);

    mainAvant = main ? main.slice() : null;
    document.querySelectorAll('.op').forEach((b) => {
      const op = b.dataset.op;

      b.disabled = !main || sel.balise;
      b.classList.toggle('choisie', sel.op === op && !sel.balise);
    });
    const bb = $('btn-balise');
    bb.hidden = !(e && e.bal);
    bb.disabled = !main;
    bb.classList.toggle('choisie', sel.balise);
    bb.setAttribute('aria-pressed', sel.balise ? 'true' : 'false');
    const pb = $('btn-propulser');
    const texteB = tr(sel.balise ? 'bouton.poserBalise' : 'bouton.propulser');
    if (pb.textContent !== texteB) pb.textContent = texteB;
    pb.disabled = !pret();
    majCalcul();
  }

  function pret() {
    if (!monTour() || sel.c < 0 || !O.astSur(vue, sel.c)) return false;
    return sel.balise ? sel.cartes.length === 1 : sel.cartes.length === 2;
  }

  // Ligne de calcul : ce que donnent les cartes choisies, comparé à la distance.
  function majCalcul() {
    const el = $('calcul');
    const e = vue, moi = partie ? partie.siege : -1;
    let html = null, texte = '';
    if (!e || moi < 0 || !partie || partie.phase !== 'jeu') texte = '';
    else if (!monTour() && sel.c < 0 && !sel.cartes.length) texte = texteCoup;
    else if (sel.c < 0) texte = tr(sel.balise ? 'calc.choisisBalise' : 'calc.choisis');
    else {
      const d = O.dist(e, e.pos[moi], sel.c), z = O.astSur(e, sel.c), main = e.cartes[moi], cache = e.cache[moi];
      const prise = z.b >= 0 && z.b !== moi;
      if (sel.balise) {
        if (z.b >= 0) texte = tr(z.b === moi ? 'calc.baliseDeja' : 'calc.baliseAutre');
        else if (!sel.cartes.length) texte = tr('calc.baliseCarte', { n: d });
        else {
          const k = sel.cartes[0];
          if (cache === k) html = [tr('calc.baliseSurprise', { n: d }), '', null];
          else html = [tr('calc.balise', { x: main[k], n: d }), main[k] === d ? tr('calc.ok') : tr('calc.rate'), main[k] === d];
        }
      } else if (sel.cartes.length < 2) {
        texte = prise ? tr('calc.reserve') : tr('calc.distance', { n: d });
      } else {
        const a = sel.cartes[0], b = sel.cartes[1];
        const px = O.poussee(e, moi, main[a], main[b], sel.op);
        const cach = cache === a || cache === b;
        const q = cach ? (cache === a ? 'a' : 'b') : null;
        const eq = equation(main[a], main[b], sel.op, px.mods, px.r, q);
        const ok = px.r === d && !prise;
        if (cach) html = [eq, tr('calc.surprise', { n: d }), null];
        else html = [eq, prise ? tr('calc.reserve') : ok ? tr('calc.pile', { n: d }) : tr('calc.derive', { n: d }), ok];
      }
    }
    const cle = html ? html.join('|') : texte;
    if (el.dataset.cle === cle) return;
    el.dataset.cle = cle;
    el.textContent = '';
    if (!html) { el.textContent = texte; return; }
    const s1 = document.createElement('span'); s1.textContent = html[0];
    el.appendChild(s1);
    if (html[1]) {
      const s2 = document.createElement('span');
      s2.className = html[2] === true ? 'ok' : html[2] === false ? 'non' : '';
      s2.textContent = ' · ' + html[1];
      el.appendChild(s2);
    }
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majCommandes();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0, dernierCalcul = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    if (t - dernierCalcul > 250) { dernierCalcul = t; majInfos(); }
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    ciel(c, w, h, vue ? neb(vue.n) : 0, t, vue ? vue.n + 5 : 5);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, Math.max(8, Math.min(w, h) * 0.025));
    const moi = partie ? partie.siege : -1;
    dessinerPlateau(c, vue, geo, {
      t: t, anims: anims, moi: moi, cible: sel.c, distances: monTour() || (moi >= 0 && sel.c >= 0),
      formes: [0, 1, 2, 3].map(formeDe), caps: caps
    });
    // particules (cristaux, étincelles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      if (t < p.depart) continue;
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.cristal) { p.r += dt * 4; cristal(c, p.x, p.y, p.k, p.v, p.r); }
      else { c.fillStyle = p.coul; etincelle(c, p.x, p.y, p.k); }
      c.globalAlpha = 1;
    }
    // ménage des animations finies
    anims.fantomes = anims.fantomes.filter((f) => t - f.t0 < 700);
    anims.libelles = anims.libelles.filter((l) => t - l.t0 < l.dur);
  }

  function jaillir(p, v, coul, retard) {
    if (!vue || !geo) return;
    const q = cellXY(vue, geo, p), depart = performance.now() + (retard || 0);
    for (let k = 0; k < 12 + v * 4; k++) {
      const a = Math.random() * Math.PI * 2, vit = 70 + Math.random() * 170;
      particules.push({
        x: q[0], y: q[1], vx: Math.cos(a) * vit, vy: Math.sin(a) * vit - 150, vie: 0.7 + Math.random() * 0.5, depart: depart,
        k: geo.s * (k % 3 ? 0.07 : 0.14), cristal: k % 3 === 0, v: v, r: Math.random() * 3, coul: k % 2 ? coul : '#ffe27a'
      });
    }
  }

  function libelle(p, texte, coul, retard, dur) {
    anims.libelles.push({ p: p, texte: texte, coul: coul || '#ffffff', t0: performance.now() + (retard || 0), dur: dur || 1700 });
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue() {
    vue = partie.etat ? copie(partie.etat) : null;
    anims = { cargo: {}, ast: {}, pir: {}, fantomes: [], libelles: [] };
    caps = [0.8, -0.8, -2.4, 2.4];
    particules.length = 0;
    mainAvant = null;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;           // heure du lancement automatique (ms)
  let resultatSalon = null;   // classement de la manche qui vient de finir
  let finEnAttente = false;   // fin de manche signalée, résultat pas encore montré
  let lancement = false;      // le chef a demandé le lancement

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + formeDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, formeDe(s), 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { cargo: tr('cargo.place.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef + ' · ' + tr('cargo.place.' + partie.chef) : tr('cargo.place.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue();
    debutTour = Date.now();
    dernierTic = -1;
    viderSel();
    texteCoup = '';
    stats.serie = 0; stats.vole = false;
    gagnesManche = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else {
      enPartie = true;
      if (vue) toast(tr('jeu.objectif', { n: Math.ceil(vue.tot * 0.5) }), 3200);
    }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function viderSel() { sel.c = -1; sel.cartes = []; sel.balise = false; }

  // Un coup vient d'être joué (par n'importe quelle place) : on l'anime.
  function surAction(ev) {
    const t = performance.now();
    const av = ev.avant || {}, ap = ev.apres, d = ap.der;
    vue = copie(ap);
    debutTour = Date.now();
    dernierTic = -1;
    if (!d) return;
    const DUR = 480;
    const qui = quiEst(d.s), moi = partie.siege === d.s;
    if (d.de !== d.a) {
      anims.cargo[d.s] = { de: d.de, a: d.a, t0: t, dur: DUR, derive: !d.ok };
      const dr = O.ligne(ap, d.a) - O.ligne(ap, d.de), dc = O.col(ap, d.a) - O.col(ap, d.de);
      caps[d.s] = Math.atan2(dc, -dr);
    }
    if (d.t === 'm') {
      sons.propulsion();
      const eq = equation(d.x, d.y, d.op, d.mods, d.r, null);
      if (d.mods && d.mods.length) sons.trou();
      if (d.ok) {
        const z = (av.ast || []).filter((x) => x.p === d.c)[0];
        anims.fantomes.push({ p: d.c, v: d.v, i: z ? z.i + 1 : 1, t0: t + DUR * 0.8 });
        jaillir(d.c, d.v, COUL[d.s], DUR * 0.8);
        libelle(d.c, '+' + nb(d.v), COUL[d.s], DUR, 1400);
        sons.mine();
        const carte = $('place-' + d.s);
        carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
        texteCoup = tr('coup.mine', { qui: qui, eq: eq, n: d.v });
      } else {
        sons.derive();
        libelle(d.a, eq, '#ffb08a', DUR * 0.6, 1500);
        texteCoup = d.bl ? tr('coup.bloque', { qui: qui }) : tr('coup.derive', { qui: qui, eq: eq, n: d.d });
      }
      if (d.vol) {
        sons.pirate();
        libelle(d.a, tr('coup.volCourt'), '#ff6a7a', DUR + 500, 1600);
        const carte = $('place-' + d.s);
        setTimeout(() => { carte.classList.remove('secoue'); void carte.offsetWidth; carte.classList.add('secoue'); }, DUR + 300);
        texteCoup += ' ' + tr('coup.vol');
        if (moi) stats.vole = true;
      }
    } else if (d.ok) {
      sons.balise(); libelle(d.c, tr('coup.baliseCourt'), COUL[d.s], 100, 1500);
      texteCoup = tr('coup.balise', { qui: qui, n: d.x });
    } else {
      sons.non(); libelle(d.c, '≠', '#ffb08a', 100, 1200);
      texteCoup = tr('coup.baliseRatee', { qui: qui, n: d.x, d: d.d });
    }
    // fin du tour de table : astéroïdes qui tournent, pirates, tempête
    const t2 = t + DUR + 150;
    (av.ast || []).forEach((z) => {
      const n = ap.ast.filter((x) => x.i === z.i)[0];
      if (n && n.p !== z.p) anims.ast[z.i] = { de: z.p, a: n.p, t0: t2, dur: 550 };
    });
    (av.pir || []).forEach((z, i) => { if (ap.pir[i] && ap.pir[i].p !== z.p) anims.pir[i] = { de: z.p, a: ap.pir[i].p, t0: t2, dur: 550 }; });
    if (av.meteo !== undefined && av.meteo !== ap.meteo) {
      if (ap.meteo === 1) setTimeout(() => toast(tr('tempete.annonce'), 2600), DUR);
      else if (ap.meteo === 2) setTimeout(() => { toast(tr('tempete.active'), 3000); sons.tempete(); }, DUR);
      else if (av.meteo === 2) setTimeout(() => toast(tr('tempete.fin'), 2200), DUR);
    }
    if (moi) { if (!ev.auto) compterAutos(d); viderSel(); sons.pioche(); }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !moi && !R.fin(vue)) setTimeout(() => { if (monTour()) sons.tour(); }, DUR);
    if (sel.c >= 0 && !O.astSur(vue, sel.c)) sel.c = -1;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1100);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.cr[moi] === Math.max.apply(null, e.cr);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    if (gagne) gagnerAuto('enligne');
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Autocollants de mission
  // ---------------------------------------------------------------------

  function gagnerAuto(id) {
    if (prog.autos.indexOf(id) >= 0) return false;
    prog.autos.push(id);
    gagnesManche.push(id);
    sauverReglages();
    setTimeout(() => { toast(tr('auto.gagne', { nom: tr('auto.' + id) }), 2800); sons.auto(); }, 900);
    return true;
  }

  // Ce que vient de réussir le joueur de l'appareil.
  function compterAutos(d) {
    if (d.t !== 'm') return;
    if (!d.ok) { stats.serie = 0; return; }
    stats.serie++;
    gagnerAuto('premier');
    if (d.op === '-') gagnerAuto('moins');
    if (d.op === 'x') gagnerAuto('fois');
    if (d.v === 3) gagnerAuto('geant');
    if (d.mods && d.mods.length) gagnerAuto('trou');
    if (d.mb) gagnerAuto('balise');
    if (d.ca) gagnerAuto('tempete');
    if (stats.serie >= 3) gagnerAuto('serie');
  }

  function etoile(c, k) {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? k * 0.45 : k; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    c.closePath(); c.fill();
  }

  // Dessin d'un autocollant (aucun texte) : rond coloré et symbole.
  function dessinerAuto(c, id, x, y, r, gagne) {
    const col = gagne ? AUTO_COUL[id] : '#3a3870';
    c.fillStyle = col; rond(c, x, y, r); c.fill();
    c.strokeStyle = gagne ? '#ffffff' : '#55538f'; c.lineWidth = r * 0.1; rond(c, x, y, r * 0.9); c.stroke();
    c.save(); c.translate(x, y);
    const k = r * 0.5, fonce = gagne ? '#15144a' : '#55538f';
    c.fillStyle = fonce; c.strokeStyle = fonce; c.lineWidth = r * 0.14; c.lineCap = 'round';
    if (id === 'premier') { if (gagne) cristal(c, 0, 0, k * 1.2, 1, 0); else etincelle(c, 0, 0, k); }
    else if (id === 'moins') { c.beginPath(); c.moveTo(-k, 0); c.lineTo(k, 0); c.stroke(); }
    else if (id === 'fois') { c.beginPath(); c.moveTo(-k * 0.75, -k * 0.75); c.lineTo(k * 0.75, k * 0.75); c.moveTo(k * 0.75, -k * 0.75); c.lineTo(-k * 0.75, k * 0.75); c.stroke(); }
    else if (id === 'geant') { if (gagne) cristal(c, 0, 0, k * 1.4, 3, 0); else etincelle(c, 0, 0, k * 1.2); }
    else if (id === 'trou') { c.lineWidth = r * 0.1; for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(0, 0, k * (0.4 + i * 0.3), i * 2, i * 2 + 2.2); c.stroke(); } rond(c, 0, 0, k * 0.3); c.fill(); }
    else if (id === 'balise') { c.beginPath(); c.moveTo(-k * 0.2, k); c.lineTo(-k * 0.2, -k); c.stroke(); c.beginPath(); c.moveTo(-k * 0.2, -k); c.lineTo(k * 0.9, -k * 0.6); c.lineTo(-k * 0.2, -k * 0.2); c.closePath(); c.fill(); }
    else if (id === 'tempete') { c.beginPath(); c.moveTo(k * 0.2, -k); c.lineTo(-k * 0.5, k * 0.1); c.lineTo(0, k * 0.1); c.lineTo(-k * 0.3, k); c.lineTo(k * 0.6, -k * 0.2); c.lineTo(k * 0.05, -k * 0.2); c.closePath(); c.fill(); }
    else if (id === 'serie') { [-0.7, 0, 0.7].forEach((dx) => { rond(c, dx * k, 0, k * 0.28); c.fill(); }); }
    else if (id === 'pirates') { c.beginPath(); c.moveTo(0, -k); c.lineTo(k * 0.85, -k * 0.55); c.lineTo(k * 0.7, k * 0.4); c.lineTo(0, k); c.lineTo(-k * 0.7, k * 0.4); c.lineTo(-k * 0.85, -k * 0.55); c.closePath(); c.fill(); }
    else if (id === 'corail') { c.lineWidth = r * 0.12; c.beginPath(); for (let a = 0; a < 12; a += 0.2) { const rr2 = k * a / 12; c.lineTo(Math.cos(a) * rr2, Math.sin(a) * rr2); } c.stroke(); }
    else if (id === 'parfait') { [-0.8, 0, 0.8].forEach((dx, i) => { c.save(); c.translate(dx * k, i === 1 ? -k * 0.25 : k * 0.15); etoile(c, k * 0.42); c.restore(); }); }
    else if (id === 'champion') { c.beginPath(); c.moveTo(-k * 0.7, -k * 0.8); c.lineTo(k * 0.7, -k * 0.8); c.lineTo(k * 0.5, 0); c.quadraticCurveTo(0, k * 0.4, -k * 0.5, 0); c.closePath(); c.fill(); c.fillRect(-k * 0.12, 0, k * 0.24, k * 0.6); c.fillRect(-k * 0.5, k * 0.6, k, k * 0.25); }
    else if (id === 'enligne') { rond(c, -k * 0.45, -k * 0.35, k * 0.3); c.fill(); rond(c, k * 0.45, -k * 0.35, k * 0.3); c.fill(); ell(c, -k * 0.45, k * 0.45, k * 0.45, k * 0.35); c.fill(); ell(c, k * 0.45, k * 0.45, k * 0.45, k * 0.35); c.fill(); }
