  // Confettis d'étoiles et de cristaux.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6, f: i % 3, v: 1 + (i % 3) });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul;
        if (b.f === 0) etoile(c, b.k * 0.8); else if (b.f === 1) cristal(c, 0, 0, b.k, b.v, 0); else c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2);
        c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const al = graineHasard(5);
    const W0 = d.g[0].length;
    const base = () => {
      const e = O.preparer({ g: d.g, ops: d.ops, mx: 9, tm: 9, bal: !!d.balise }, 1, null, false, false);
      e.pos[0] = d.pos[0] * W0 + d.pos[1];
      e.cartes[0] = d.cartes.slice();
      e.cache[0] = typeof d.cache === 'number' ? d.cache : -1;
      return e;
    };
    const cibleP = d.cible[0] * W0 + d.cible[1];
    const pas = [];
    if (d.tourne) pas.push({ type: 'tourne' });
    pas.push({ type: 'cible' });
    if (d.balise) pas.push({ type: 'balise' });
    d.pick.forEach((i) => pas.push({ type: 'carte', i: i }));
    if (!d.balise && d.op !== '+') pas.push({ type: 'op' });
    pas.push({ type: 'go' });
    const PAS = 1000, FIN = pas.length * PAS + 2400;
    let e, st, an, debut = 0, fait;
    const remise = () => { e = base(); st = { c: -1, cartes: [], op: '+', bal: false }; an = { cargo: {}, ast: {}, pir: {}, fantomes: [], libelles: [] }; fait = 0; };
    remise();
    const g = geometrie(e, 560, 236, 14);
    const carteXY = (i) => [150 + i * 86, 302];
    const opsL = d.ops.split('');
    const opXY = (op) => [430 + opsL.indexOf(op) * 46, 302];
    const baliseXY = [400, 302];
    const cibleXY = () => { const z = O.astSur(e, cibleP); return cellXY(e, g, z ? z.p : cibleP); };
    const pointDe = (p) => (p.type === 'cible' || p.type === 'tourne' ? cibleXY() : p.type === 'carte' ? carteXY(p.i) : p.type === 'op' ? opXY(d.op) : p.type === 'balise' ? baliseXY : [470, 330]);
    const j = ++tutoAnim;
    function appliquer(p, t) {
      if (p.type === 'tourne') {
        const avant = e.ast.map((z) => ({ i: z.i, p: z.p }));
        O.finTour(e, al);
        avant.forEach((v) => { const z = e.ast.filter((x) => x.i === v.i)[0]; if (z && z.p !== v.p) an.ast[z.i] = { de: v.p, a: z.p, t0: t, dur: 550 }; });
      } else if (p.type === 'cible') st.c = cibleP;
      else if (p.type === 'balise') st.bal = true;
      else if (p.type === 'carte') st.cartes.push(p.i);
      else if (p.type === 'op') st.op = d.op;
      else if (p.type === 'go') {
        const action = st.bal ? { t: 'b', a: st.cartes[0], c: st.c } : { t: 'm', a: st.cartes[0], b: st.cartes[1], op: st.op, c: st.c };
        const avant = copie(e);
        e = R.jouer(e, 0, action, al);
        const der = e.der;
        if (der.de !== der.a) an.cargo[0] = { de: der.de, a: der.a, t0: t, dur: 600 };
        if (der.t === 'm' && der.ok) {
          const z = avant.ast.filter((x) => x.p === der.c)[0];
          an.fantomes.push({ p: der.c, v: der.v, i: z ? z.i + 1 : 1, t0: t + 480 });
          an.libelles.push({ p: der.c, texte: '+' + nb(der.v), coul: COUL[0], t0: t + 600, dur: 1500 });
        }
        if (der.t === 'b') an.libelles.push({ p: der.c, texte: tr('coup.baliseCourt'), coul: COUL[0], t0: t + 100, dur: 1800 });
        if (der.vol) an.libelles.push({ p: der.a, texte: tr('coup.volCourt'), coul: '#ff6a7a', t0: t + 1000, dur: 1300 });
        st.c = -1; st.cartes = [];
      }
    }
    let tutoAnimId = 0;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      let ecoule = t - debut;
      if (ecoule > FIN) { remise(); debut = t; ecoule = 0; }
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      while (fait < pas.length && (fait < k || (fait === k && dans >= 650))) { appliquer(pas[fait], t); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      ciel(c, 560, 360, 0, t, 9);
      dessinerPlateau(c, e, g, { t: t, anims: an, moi: 0, cible: st.c, distances: st.c >= 0, formes: [prog.cargo], caps: [Math.PI / 2] });
      // ligne de calcul
      c.font = '800 22px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#ffe27a';
      let ligneCalc = '';
      const mainT = e.cartes[0];
      if (st.c >= 0 && st.bal && st.cartes.length === 1) ligneCalc = tr('calc.balise', { x: mainT[st.cartes[0]], n: O.dist(e, e.pos[0], st.c) });
      else if (st.c >= 0 && st.cartes.length === 2) {
        const px = O.poussee(e, 0, mainT[st.cartes[0]], mainT[st.cartes[1]], st.op);
        ligneCalc = equation(mainT[st.cartes[0]], mainT[st.cartes[1]], st.op, px.mods, px.r, null);
      } else if (st.c >= 0) ligneCalc = tr('calc.distance', { n: O.dist(e, e.pos[0], st.c) });
      c.fillText(ligneCalc, 280, 250);
      // cartes
      for (let i = 0; i < 3; i++) {
        const q = carteXY(i), choisie = st.cartes.indexOf(i) >= 0, cachee = e.cache[0] === i;
        const y = q[1] - (choisie ? 6 : 0);
        c.fillStyle = cachee ? '#ff9a4a' : '#f4f2ff'; c.strokeStyle = choisie ? '#ffd23f' : '#8f93ff'; c.lineWidth = choisie ? 5 : 3;
        rr(c, q[0] - 32, y - 40, 64, 80, 12); c.fill(); c.stroke();
        c.fillStyle = '#1d1a5c'; c.font = '900 36px system-ui, sans-serif';
        c.fillText(cachee ? '?' : nb(mainT[i]), q[0], y - (cachee ? 6 : 0));
        if (cachee) { c.font = '800 13px system-ui, sans-serif'; c.fillText(tr(mainT[i] % 2 ? 'carte.impair' : 'carte.pair'), q[0], y + 24); }
      }
      if (d.balise) {
        c.fillStyle = st.bal ? '#5fd2ff' : '#23215a'; c.strokeStyle = '#6d6cd8'; c.lineWidth = 3;
        rr(c, baliseXY[0] - 22, baliseXY[1] - 30, 44, 60, 10); c.fill(); c.stroke();
        balise(c, baliseXY[0] - 6, baliseXY[1] + 18, 34, 0, t);
      } else {
        opsL.forEach((op) => {
          const q = opXY(op), choisie = st.op === op;
          c.fillStyle = choisie ? '#ffd23f' : '#23215a'; c.strokeStyle = '#6d6cd8'; c.lineWidth = 2;
          rr(c, q[0] - 20, q[1] - 22, 40, 44, 10); c.fill(); c.stroke();
          c.fillStyle = choisie ? '#3b2a00' : '#eef0ff'; c.font = '900 26px system-ui, sans-serif';
          c.fillText(tr('op.' + OPS[op]), q[0], q[1] + 1);
        });
      }
      // la main
      if (fait < pas.length) {
        const de = fait > 0 ? pointDe(pas[fait - 1]) : [520, 340], vers = pointDe(pas[fait]);
        const q = Math.min(1, dans / 600);
        const x = de[0] + (vers[0] - de[0]) * lisse(q), y = de[1] + (vers[1] - de[1]) * lisse(q);
        main(c, x, y, 1.4, q >= 1 ? Math.min(1, (dans - 600) / 100) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = (ev) => { if (ev.target === $('voile-tuto')) { audio(); fermer(); } };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  // Astéroïde sous le doigt (ou le plus proche, à moins d'une case).
  function asteroideSous(px, py) {
    if (!vue || !geo) return -1;
    let best = -1, bd = Infinity;
    vue.ast.forEach((z) => {
      const q = cellXY(vue, geo, z.p), d = Math.hypot(px - q[0], py - q[1]);
      if (d < bd) { bd = d; best = z.p; }
    });
    return bd <= Math.max(26, geo.s * 0.75) ? best : -1;
  }

  function choisirCible(p) {
    if (!vue || p < 0) return;
    if (!partie || partie.siege < 0 || partie.phase !== 'jeu') return;
    sel.c = sel.c === p ? -1 : p;
    sons.cible();
    majCommandes();
  }

  function choisirCarte(k) {
    if (!vue || !partie || partie.siege < 0 || $('carte-' + k).disabled) return;
    audio();
    const i = sel.cartes.indexOf(k);
    if (i >= 0) sel.cartes.splice(i, 1);
    else {
      sel.cartes.push(k);
      const max = sel.balise ? 1 : 2;
      while (sel.cartes.length > max) sel.cartes.shift();
    }
    sons.carte();
    majCommandes();
  }

  function choisirOp(op) {
    if (!vue || vue.ops.indexOf(op) < 0 || sel.balise) return;
    audio();
    sel.op = op;
    sons.op();
    majCommandes();
  }

  function basculerBalise() {
    if (!vue || !vue.bal) return;
    audio();
    sel.balise = !sel.balise;
    if (sel.balise && sel.cartes.length > 1) sel.cartes = sel.cartes.slice(-1);
    sons.op();
    majCommandes();
  }

  function propulser() {
    audio();
    if (!monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (!pret()) { sons.non(); toast(tr(sel.c < 0 ? 'calc.choisis' : sel.balise ? 'calc.baliseCarte2' : 'calc.deuxCartes'), 1800); return; }
    const moi = partie.siege;
    const a = sel.balise ? { t: 'b', a: sel.cartes[0], c: sel.c } : { t: 'm', a: sel.cartes[0], b: sel.cartes[1], op: sel.op, c: sel.c };
    if (!R.valide(vue, moi, a)) { sons.non(); toast(tr(sel.balise ? 'calc.baliseAutre' : 'calc.impossible'), 1800); return; }
    partie.jouer(a);
    majCommandes();
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', () => { audio(); });
  plateau.addEventListener('pointerup', (ev) => {
    if (enPause || attenteTuto) return;
    const p = point(ev);
    const a = asteroideSous(p[0], p[1]);
    if (a >= 0) choisirCible(a);
  });
  for (let k = 0; k < 3; k++) $('carte-' + k).addEventListener('click', () => choisirCarte(k));
  document.querySelectorAll('.op').forEach((b) => b.addEventListener('click', () => choisirOp(b.dataset.op)));
  $('btn-balise').addEventListener('click', basculerBalise);
  $('btn-propulser').addEventListener('click', propulser);

  // Clavier : flèches pour passer d'un astéroïde à l'autre.
  function cibleSuivante(dx, dy) {
    if (!vue || !vue.ast.length || !partie || partie.siege < 0 || partie.phase !== 'jeu') return;
    const moi = partie.siege;
    const depuis = sel.c >= 0 ? sel.c : vue.pos[moi];
    const m = [O.col(vue, depuis), O.ligne(vue, depuis)];
    let best = -1, bd = Infinity;
    vue.ast.forEach((z) => {
      if (z.p === sel.c) return;
      const vx = O.col(vue, z.p) - m[0], vy = O.ligne(vue, z.p) - m[1];
      const avance = vx * dx + vy * dy;
      if (sel.c >= 0 && avance <= 0) return;
      const score = sel.c >= 0 ? avance + Math.abs(vx * dy - vy * dx) * 2 : Math.abs(vx) + Math.abs(vy);
      if (score < bd) { bd = score; best = z.p; }
    });
    if (best >= 0) { sel.c = best; sons.cible(); majCommandes(); }
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (dirs[ev.code]) { ev.preventDefault(); audio(); cibleSuivante(dirs[ev.code][0], dirs[ev.code][1]); }
    else if (chiffres[ev.code] !== undefined) { ev.preventDefault(); choisirCarte(chiffres[ev.code]); }
    else if (ev.key === '+' || ev.code === 'NumpadAdd') { ev.preventDefault(); choisirOp('+'); }
    else if (ev.key === '-' || ev.code === 'NumpadSubtract') { ev.preventDefault(); choisirOp('-'); }
    else if (ev.key === '*' || ev.key === 'x' || ev.code === 'NumpadMultiply') { ev.preventDefault(); choisirOp('x'); }
    else if (ev.code === 'KeyB') { ev.preventDefault(); basculerBalise(); }
    else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault();
      propulser();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-hangar').addEventListener('click', () => { audio(); sons.clic(); ouvrirHangar(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('hangar-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });
  ['op-plus', 'op-moins', 'op-fois'].forEach((id) => {
    const b = $(id), op = b.dataset.op;
    b.textContent = tr('op.' + OPS[op]);
    b.setAttribute('aria-label', tr('op.aria.' + OPS[op]));
  });
  $('btn-balise').setAttribute('aria-label', tr('balise.aria'));

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.cr[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
