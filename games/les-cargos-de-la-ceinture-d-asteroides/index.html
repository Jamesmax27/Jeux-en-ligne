<canvas id="confettis" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  Les cargos de la ceinture d'astéroïdes — jeu de calcul et de stratégie
  //  On combine deux cartes de poussée (+, −, ×) pour s'arrêter pile sur un
  //  astéroïde et miner ses cristaux. Solo : 20 secteurs contre 3 robots.
  //  En ligne : de vrais joueurs remplacent les robots (moteur JEL_MULTI).
  //  Les règles (et les réglages des secteurs) sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'les-cargos-de-la-ceinture-d-asteroides';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = O.SECTEURS;               // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const copie = (x) => JSON.parse(JSON.stringify(x));

  // Une couleur par cargo : 0 bleu, 1 orange, 2 vert, 3 rose.
  const COUL = ['#56a8ff', '#ff9d3d', '#4fdc8f', '#ff70b8'];
  const COUL_F = ['#1d4f9a', '#9a4f0a', '#16804a', '#a02a68'];
  const SYMB = { '+': '+', '-': '−', 'x': '×' };
  // Nébuleuses (une tous les 5 secteurs) : fond, nuages, éclat.
  const NEB = [
    { a: '#1c0a24', b: '#4a1734', n: '#ff6f61', n2: '#ffb46b' },
    { a: '#041a18', b: '#0d3f35', n: '#2fe0a0', n2: '#a2f06b' },
    { a: '#050f2b', b: '#0f2c66', n: '#4f9dff', n2: '#7af0ff' },
    { a: '#14082b', b: '#351866', n: '#b57aff', n2: '#ff7ae0' }
  ];
  const SEUIL2 = 0.35, SEUIL3 = 0.45;          // part des cristaux de la table pour 2 et 3 étoiles
  const MODELES = [0, 12, 24, 40, 54];        // étoiles pour débloquer chaque modèle de cargo
  const AUTOS = ['premier', 'moins', 'fois', 'tour', 'trou', 'balise', 'pirate', 'tempete', 'trio', 'neb1', 'neb2', 'neb3', 'neb4', 'etoiles'];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#121845"/><circle cx="10.4" cy="8" r="1.6" fill="#121845"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#121845"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const ICONE_GEMME = '<svg viewBox="0 0 13 15" aria-hidden="true"><path d="M6.5 0L13 5 6.5 15 0 5z" fill="#7af0ff"/><path d="M6.5 0L9 5H4z" fill="#d6fbff"/><path d="M0 5h13L6.5 15z" fill="#3fb6e0" opacity=".7"/></svg>';

  // Tutoriels : une bande droite de l'anneau, des cartes et une main qui
  // montre le geste. ast : [case, cristaux] ; pick : cartes touchées ; op ;
  // balise : carte lancée ; trou : [case, 'd'|'h'] ; pirate : case ; tourne ;
  // cache : carte cachée.
  const TUTOS = {
    base: { cases: 9, ast: [[5, 1], [7, 1]], cartes: [2, 3, 5], pick: [0, 1], op: '+' },
    gros: { cases: 9, ast: [[4, 1], [6, 3]], cartes: [1, 3, 5], pick: [0, 2], op: '+' },
    moins: { cases: 9, ast: [[5, 2]], cartes: [7, 4, 2], pick: [0, 2], op: '-' },
    fois: { cases: 14, ast: [[12, 2]], cartes: [3, 1, 4], pick: [0, 2], op: 'x' },
    tourne: { cases: 9, ast: [[6, 2]], cartes: [2, 6, 4], pick: [0, 2], op: '+', tourne: true },
    trou: { cases: 11, ast: [[8, 2]], cartes: [1, 6, 3], pick: [0, 2], op: '+', trou: [2, 'd'] },
    trouBleu: { cases: 11, ast: [[4, 2]], cartes: [6, 5, 2], pick: [0, 2], op: '+', trou: [2, 'h'] },
    balise: { cases: 11, ast: [[7, 3]], cartes: [4, 7, 2], balise: 1 },
    pirate: { cases: 11, ast: [[4, 1], [8, 2]], cartes: [3, 5, 2], pick: [0, 1], op: '+', pirate: 5 },
    tempete: { cases: 9, ast: [[7, 2]], cartes: [4, 6, 3], pick: [0, 2], op: '+', cache: 1 }
  };

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], autos: [], modele: 0, options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (Array.isArray(d.autos)) prog.autos = d.autos.filter((x) => AUTOS.indexOf(x) >= 0);
      prog.modele = entier(d.modele, 0, MODELES.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (MODELES[prog.modele] > totalEtoiles()) prog.modele = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.autos = [];
    prog.modele = 0;
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), autos: prog.autos.slice(), modele: prog.modele,
        options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Réglages changés hors d'une partie solo (son, cargo, autocollant en ligne) :
  // jamais de nouvelle sauvegarde, seulement une mise à jour de celle qui existe.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try {
      if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, modele: prog.modele, autos: prog.autos.slice() });
    } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(660, 0.06, { type: 'triangle', vol: 0.07 }),
    carte: () => { note(520, 0.06, { type: 'triangle', vol: 0.08 }); note(780, 0.07, { type: 'triangle', vol: 0.06, retard: 0.04 }); },
    op: () => note(880, 0.08, { type: 'square', vol: 0.04, filtre: 2200 }),
    pousse: () => { note(140, 0.5, { type: 'sawtooth', vol: 0.05, vers: 420, filtre: 900 }); note(300, 0.35, { vol: 0.04, vers: 900, retard: 0.05 }); },
    mine: (n) => [1047, 1319, 1568, 2093].slice(0, 1 + Math.min(3, n)).forEach((f, i) => note(f, 0.22, { type: 'triangle', vol: 0.08, retard: i * 0.07 })),
    rate: () => note(240, 0.4, { type: 'sine', vol: 0.1, vers: 120 }),
    trou: () => note(900, 0.7, { type: 'sine', vol: 0.08, vers: 90 }),
    balise: () => [1400, 1400, 1870].forEach((f, i) => note(f, 0.06, { type: 'square', vol: 0.035, retard: i * 0.09 })),
    pirate: () => { note(520, 0.12, { type: 'square', vol: 0.05, filtre: 1500 }); note(390, 0.18, { type: 'square', vol: 0.05, filtre: 1500, retard: 0.13 }); },
    victoire: () => [523, 659, 784, 1047].forEach((f, i) => note(f, 0.26, { type: 'triangle', vol: 0.11, retard: i * 0.13 })),
    defaite: () => [392, 330, 262].forEach((f, i) => note(f, 0.3, { vol: 0.11, retard: i * 0.18 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.035 }),
    arrive: () => { note(660, 0.12, { vol: 0.09 }); note(880, 0.16, { vol: 0.09, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.07 }); note(587, 0.16, { vol: 0.07, retard: 0.1 }); },
    tour: () => { note(988, 0.1, { vol: 0.06 }); note(1319, 0.12, { vol: 0.05, retard: 0.08 }); },
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 }),
    auto: () => [1568, 2093, 2637].forEach((f, i) => note(f, 0.18, { type: 'sine', vol: 0.06, retard: i * 0.08 }))
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas)
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }
  function etoile5(c, x, y, r) {
    c.beginPath();
    for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    c.closePath();
  }
  function etincelle(c, x, y, k) {
    c.beginPath(); c.moveTo(x, y - k); c.quadraticCurveTo(x, y, x + k, y); c.quadraticCurveTo(x, y, x, y + k); c.quadraticCurveTo(x, y, x - k, y); c.quadraticCurveTo(x, y, x, y - k); c.fill();
  }

  // Un cristal (losange taillé).
  function gemme(c, x, y, k) {
    c.fillStyle = '#7af0ff'; c.strokeStyle = '#1a6b8a'; c.lineWidth = Math.max(1, k * 0.12);
    c.beginPath(); c.moveTo(x, y - k); c.lineTo(x + k * 0.75, y - k * 0.25); c.lineTo(x, y + k); c.lineTo(x - k * 0.75, y - k * 0.25); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#e4fdff'; c.beginPath(); c.moveTo(x, y - k); c.lineTo(x + k * 0.3, y - k * 0.25); c.lineTo(x - k * 0.3, y - k * 0.25); c.closePath(); c.fill();
  }

  // Un cargo spatial vu de dessus, nez vers l'angle a ; 5 modèles.
  function cargo(c, x, y, a, k, col, colF, modele) {
    c.save(); c.translate(x, y); c.rotate(a); c.scale(k / 20, k / 20);
    c.lineJoin = 'round'; c.lineWidth = 2;
    // flamme
    c.fillStyle = '#ffb347'; c.beginPath(); c.moveTo(-14, -4); c.lineTo(-24, 0); c.lineTo(-14, 4); c.fill();
    c.fillStyle = '#fff3a8'; c.beginPath(); c.moveTo(-14, -2); c.lineTo(-19, 0); c.lineTo(-14, 2); c.fill();
    c.strokeStyle = colF; c.fillStyle = col;
    if (modele === 1) { // soucoupe de transport
      ell(c, 0, 0, 16, 13); c.fill(); c.stroke();
      c.fillStyle = '#ffffff55'; ell(c, -2, -3, 10, 6); c.fill();
      c.fillStyle = '#cfefff'; rond(c, 4, 0, 5); c.fill(); c.stroke();
    } else if (modele === 2) { // long ravitailleur à conteneurs
      c.fillStyle = colF; c.fillRect(-15, -2, 28, 4);
      c.fillStyle = col; [-13, -5, 3].forEach((cx) => { rr(c, cx, -8, 7, 16, 2); c.fill(); c.stroke(); });
      rr(c, 10, -5, 9, 10, 4); c.fill(); c.stroke();
      c.fillStyle = '#cfefff'; rond(c, 15, 0, 2.6); c.fill();
    } else if (modele === 3) { // cargo à ailes en flèche
      c.beginPath(); c.moveTo(20, 0); c.lineTo(-8, -17); c.lineTo(-12, -6); c.lineTo(-14, 0); c.lineTo(-12, 6); c.lineTo(-8, 17); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#ffffff66'; c.beginPath(); c.moveTo(14, 0); c.lineTo(-6, -11); c.lineTo(-6, 0); c.fill();
      c.fillStyle = '#cfefff'; ell(c, 6, 0, 5, 3); c.fill(); c.stroke();
    } else if (modele === 4) { // vaisseau cristal
      c.beginPath(); for (let i = 0; i < 6; i++) { const b = i * Math.PI / 3; c.lineTo(Math.cos(b) * 17, Math.sin(b) * 17); } c.closePath(); c.fill(); c.stroke();
      gemme(c, 1, 0, 8);
      c.fillStyle = '#fff'; etincelle(c, 10, -10, 4);
    } else { // modèle de base : caisson et cabine
      rr(c, -14, -10, 22, 20, 4); c.fill(); c.stroke();
      c.fillStyle = colF; c.fillRect(-10, -10, 2.5, 20); c.fillRect(-3, -10, 2.5, 20);
      c.fillStyle = col; c.beginPath(); c.moveTo(8, -8); c.lineTo(19, -3); c.lineTo(19, 3); c.lineTo(8, 8); c.closePath(); c.fill(); c.stroke();
      c.fillStyle = '#cfefff'; rr(c, 11, -3, 5, 6, 2); c.fill();
    }
    c.restore();
  }

  // Un astéroïde rocheux (forme fixe donnée par la graine).
  function rocher(c, x, y, r, graine) {
    const al = graineHasard(graine * 7919 + 3);
    c.fillStyle = '#00000040'; ell(c, x + r * 0.12, y + r * 0.18, r, r * 0.9); c.fill();
    c.fillStyle = '#8a7a6c'; c.strokeStyle = '#4b3f36'; c.lineWidth = Math.max(1.2, r * 0.08);
    c.beginPath();
    for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2, q = r * (0.78 + al() * 0.3); c.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); }
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#a99886'; ell(c, x - r * 0.25, y - r * 0.3, r * 0.4, r * 0.25, -0.5); c.fill();
    c.fillStyle = '#6b5c50'; rond(c, x + r * 0.3, y + r * 0.25, r * 0.16); c.fill(); rond(c, x - r * 0.35, y + r * 0.3, r * 0.1); c.fill();
  }

  // Astéroïde complet : rocher, cristaux (1 à 3), orbite s'il tourne, drapeau s'il est réservé.
  function asteroide(c, A, x, y, r, t) {
    if (A.r) {
      c.strokeStyle = '#9cf0ff'; c.lineWidth = Math.max(1.5, r * 0.1);
      const d = (t / 900) % (Math.PI * 2);
      c.beginPath(); c.arc(x, y, r * 1.28, d, d + 1.7); c.stroke();
      const ax = x + Math.cos(d + 1.7) * r * 1.28, ay = y + Math.sin(d + 1.7) * r * 1.28;
      c.fillStyle = '#9cf0ff'; c.beginPath();
      c.moveTo(ax + Math.cos(d + 1.7 + Math.PI / 2) * r * 0.35, ay + Math.sin(d + 1.7 + Math.PI / 2) * r * 0.35);
      c.lineTo(ax + Math.cos(d + 1.7) * r * 0.25, ay + Math.sin(d + 1.7) * r * 0.25);
      c.lineTo(ax - Math.cos(d + 1.7) * r * 0.25, ay - Math.sin(d + 1.7) * r * 0.25); c.closePath(); c.fill();
    }
    rocher(c, x, y, r, A.c + A.v * 31);
    const pos = A.v === 1 ? [[0, -0.05]] : A.v === 2 ? [[-0.3, -0.05], [0.3, 0.05]] : [[-0.38, 0.1], [0, -0.25], [0.38, 0.1]];
    const k = r * (A.v === 1 ? 0.5 : 0.4) * (1 + 0.06 * Math.sin(t / 300 + A.c));
    pos.forEach((p) => gemme(c, x + p[0] * r, y + p[1] * r, k));
    if (A.b >= 0) drapeau(c, x + r * 0.55, y - r * 0.55, r * 0.9, COUL[A.b], COUL_F[A.b]);
  }

  function drapeau(c, x, y, k, col, colF) {
    c.fillStyle = '#e8ecff'; c.fillRect(x - k * 0.05, y - k * 0.6, k * 0.1, k * 0.9);
    c.fillStyle = col; c.strokeStyle = colF; c.lineWidth = Math.max(1, k * 0.06);
    c.beginPath(); c.moveTo(x + k * 0.05, y - k * 0.6); c.lineTo(x + k * 0.65, y - k * 0.42); c.lineTo(x + k * 0.05, y - k * 0.22); c.closePath(); c.fill(); c.stroke();
  }

  // Trou noir : tourbillon violet (double) ou bleu (divise), flèches vers l'extérieur ou l'intérieur.
  function trouNoir(c, x, y, r, kind, t) {
    const col = kind === 'd' ? ['#d07aff', '#6a1fb5'] : ['#6fd6ff', '#1f5fb5'];
    const g = c.createRadialGradient(x, y, r * 0.1, x, y, r * 1.2);
    g.addColorStop(0, '#000'); g.addColorStop(0.45, col[1]); g.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = g; rond(c, x, y, r * 1.2); c.fill();
    c.strokeStyle = col[0]; c.lineWidth = Math.max(1.5, r * 0.12); c.lineCap = 'round';
    for (let b = 0; b < 3; b++) {
      c.beginPath();
      for (let i = 0; i <= 14; i++) { const q = i / 14, a = t / 500 + b * 2.09 + q * 3.4; c.lineTo(x + Math.cos(a) * r * (0.2 + 0.8 * q), y + Math.sin(a) * r * (0.2 + 0.8 * q)); }
      c.stroke();
    }
    c.fillStyle = '#000'; rond(c, x, y, r * 0.25); c.fill();
    // flèches : vers l'extérieur (poussée doublée) ou vers le centre (divisée)
    c.fillStyle = '#fff';
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4, d1 = kind === 'd' ? r * 0.95 : r * 0.55, d2 = kind === 'd' ? r * 1.3 : r * 0.85;
      const pt = kind === 'd' ? d2 : d1, ba = kind === 'd' ? d1 : d2;
      c.beginPath();
      c.moveTo(x + Math.cos(a) * pt, y + Math.sin(a) * pt);
      c.lineTo(x + Math.cos(a + 0.28) * ba, y + Math.sin(a + 0.28) * ba);
      c.lineTo(x + Math.cos(a - 0.28) * ba, y + Math.sin(a - 0.28) * ba);
      c.closePath(); c.fill();
    }
  }

  // Pirate robot : petite soucoupe rouge avec un œil.
  function pirate(c, x, y, r, t) {
    const dy = Math.sin(t / 400) * r * 0.08;
    c.fillStyle = '#3a0d14'; ell(c, x, y + dy + r * 0.15, r, r * 0.42); c.fill();
    c.fillStyle = '#d63a4a'; c.strokeStyle = '#5a0c18'; c.lineWidth = Math.max(1.2, r * 0.08);
    ell(c, x, y + dy, r, r * 0.4); c.fill(); c.stroke();
    c.fillStyle = '#5c6478'; ell(c, x, y + dy - r * 0.25, r * 0.52, r * 0.42); c.fill(); c.stroke();
    c.fillStyle = '#ffec5c'; rond(c, x, y + dy - r * 0.27, r * 0.2); c.fill();
    c.fillStyle = '#d6001c'; rond(c, x + r * 0.05, y + dy - r * 0.27, r * 0.1); c.fill();
    c.fillStyle = (Math.floor(t / 300) % 2) ? '#ffec5c' : '#ff6b6b';
    [-0.6, 0, 0.6].forEach((q) => { rond(c, x + q * r, y + dy + r * 0.12, r * 0.09); c.fill(); });
  }

  function soleil(c, x, y, r, t) {
    const g = c.createRadialGradient(x, y, r * 0.2, x, y, r * 2.2);
    g.addColorStop(0, 'rgba(255,230,140,.9)'); g.addColorStop(0.4, 'rgba(255,170,60,.35)'); g.addColorStop(1, 'rgba(255,120,40,0)');
    c.fillStyle = g; rond(c, x, y, r * 2.2); c.fill();
    c.fillStyle = '#ffd65a'; rond(c, x, y, r); c.fill();
    c.fillStyle = '#fff3b8'; rond(c, x - r * 0.25, y - r * 0.25, r * 0.5); c.fill();
    c.strokeStyle = 'rgba(255,214,90,.6)'; c.lineWidth = Math.max(1.5, r * 0.08); c.lineCap = 'round';
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2 + t / 4000; c.beginPath(); c.moveTo(x + Math.cos(a) * r * 1.25, y + Math.sin(a) * r * 1.25); c.lineTo(x + Math.cos(a) * r * 1.55, y + Math.sin(a) * r * 1.55); c.stroke(); }
  }

  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 22, k / 22);
    c.fillStyle = '#ffc21a'; c.strokeStyle = '#7a4f00'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-23, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(23, -22); c.lineTo(20, 0); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#e23b2e'; rond(c, 0, -10, 3.5); c.fill();
    c.restore();
  }

  // Ciel d'une nébuleuse (mis en cache : il ne change qu'avec la taille).
  const cacheFond = {};
  function fondNebuleuse(w, h, th) {
    const cle = w + 'x' + h + ':' + th;
    if (cacheFond.cle === cle) return cacheFond.cv;
    const cv = document.createElement('canvas'), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, Math.round(w * dpr)); cv.height = Math.max(1, Math.round(h * dpr));
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const N0 = NEB[th] || NEB[0];
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, N0.a); g.addColorStop(1, N0.b);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    const al = graineHasard(17 + th * 101);
    for (let i = 0; i < 6; i++) {
      const x = al() * w, y = al() * h, r = (0.25 + al() * 0.35) * Math.max(w, h);
      const ng = c.createRadialGradient(x, y, 0, x, y, r);
      ng.addColorStop(0, (i % 2 ? N0.n : N0.n2) + '40'); ng.addColorStop(1, (i % 2 ? N0.n : N0.n2) + '00');
      c.fillStyle = ng; c.fillRect(0, 0, w, h);
    }
    for (let i = 0; i < 160; i++) {
      c.fillStyle = 'rgba(255,255,255,' + (0.3 + al() * 0.7).toFixed(2) + ')';
      const s = al() < 0.9 ? 1 : 2;
      c.fillRect(al() * w, al() * h, s, s);
    }
    c.fillStyle = '#fff';
    for (let i = 0; i < 6; i++) etincelle(c, al() * w, al() * h, 2 + al() * 3);
    cacheFond.cle = cle; cacheFond.cv = cv;
    return cv;
  }

  // ---------------------------------------------------------------------
  //  L'anneau : géométrie et dessin (jeu et écran titre)
  // ---------------------------------------------------------------------

  function geometrie(w, h, N) {
    // marge : la piste et les bulles des distances restent dans l'écran
    const R0 = Math.max(40, Math.min(w * 0.5 - 58, h * 0.5 - 48));
    return { cx: w / 2, cy: h / 2, R: R0, N: N, s: 2 * Math.PI * R0 / N };
  }
  function angle(g, k) { return -Math.PI / 2 + k * 2 * Math.PI / g.N; }
  function surAnneau(g, k, rayon) { const a = angle(g, k); return { x: g.cx + Math.cos(a) * rayon, y: g.cy + Math.sin(a) * rayon, a: a }; }

  const modeleDe = (s) => (partie && s === partie.siege ? prog.modele : (s === 0 ? 0 : s === 1 ? 1 : s === 2 ? 2 : 3));

  // opt : t, moi (place dont on montre les distances), coup (mouvement animé), titre
  function dessinerAnneau(c, e, g, opt) {
    const t = opt.t || 0, N = e.N, s = g.s, rA = Math.min(s * 0.36, 26);
    soleil(c, g.cx, g.cy, Math.min(g.R * 0.15, 46), t);
    // la piste de la ceinture
    c.strokeStyle = 'rgba(200,210,255,.10)'; c.lineWidth = Math.min(s * 0.95, 60);
    rond(c, g.cx, g.cy, g.R); c.stroke();
    c.strokeStyle = 'rgba(200,210,255,.22)'; c.lineWidth = 1.2;
    rond(c, g.cx, g.cy, g.R - Math.min(s * 0.95, 60) / 2); c.stroke();
    rond(c, g.cx, g.cy, g.R + Math.min(s * 0.95, 60) / 2); c.stroke();
    for (let k = 0; k < N; k++) {
      const p = surAnneau(g, k, g.R);
      c.fillStyle = 'rgba(220,228,255,.35)'; rond(c, p.x, p.y, Math.max(1.5, s * 0.05)); c.fill();
    }
    // zones des pirates
    c.lineCap = 'butt';
    e.pi.forEach((P) => {
      c.strokeStyle = 'rgba(255,60,80,' + (0.22 + 0.08 * Math.sin(t / 300)).toFixed(2) + ')'; c.lineWidth = Math.min(s * 0.95, 60);
      c.beginPath(); c.arc(g.cx, g.cy, g.R, angle(g, P.c - 1.5), angle(g, P.c + 1.5)); c.stroke();
    });
    e.tr.forEach((T) => { const p = surAnneau(g, T.c, g.R); trouNoir(c, p.x, p.y, rA * 1.05, T.k, t); });
    e.ast.forEach((A) => { const p = surAnneau(g, A.c, g.R); asteroide(c, A, p.x, p.y, rA, t); });
    e.pi.forEach((P) => { const p = surAnneau(g, P.c, g.R); pirate(c, p.x, p.y, rA * 0.95, t); });
    // distances depuis le cargo du joueur (écrites par le jeu, jamais dans une image)
    const moi = opt.moi;
    if (!opt.titre && moi >= 0 && moi < e.pos.length) {
      const base = opt.coup && opt.coup.d.s === moi ? -1 : e.pos[moi];
      if (base >= 0) {
        const taille = Math.max(11, Math.min(16, s * 0.42));
        c.font = '900 ' + taille + 'px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        const bulle = (k, fond, bord, texte) => {
          const p = surAnneau(g, k, g.R + Math.min(s * 0.95, 60) / 2 + taille * 0.85);
          const tw = Math.max(taille * 1.5, c.measureText(texte).width + taille * 0.6);
          c.fillStyle = fond; rr(c, p.x - tw / 2, p.y - taille * 0.68, tw, taille * 1.36, taille * 0.6); c.fill();
          c.strokeStyle = bord; c.lineWidth = 2; c.stroke();
          c.fillStyle = '#fff'; c.fillText(texte, p.x, p.y + 1);
        };
        e.tr.forEach((T) => bulle(T.c, T.k === 'd' ? '#4a1784' : '#174a84', T.k === 'd' ? '#d07aff' : '#6fd6ff', nb(O.distance(N, base, T.c))));
        e.ast.forEach((A) => {
          const dd = O.distance(N, base, A.c), autre = A.b >= 0 && A.b !== moi;
          bulle(A.c, autre ? '#3a3f5c' : COUL_F[moi], autre ? '#8890b8' : COUL[moi], nb(dd));
        });
      }
    }
    // cargos (sur une voie intérieure ; ceux qui partagent une case se décalent)
    const voie = g.R - Math.min(s * 0.95, 60) / 2 - Math.min(s * 0.45, 22);
    const tailleC = Math.min(s * 0.5, 26);
    const parCase = {};
    for (let q = 0; q < e.pos.length; q++) {
      let k = e.pos[q], ray = voie;
      const an = opt.coup && opt.coup.d.s === q && opt.coup.d.t === 'p' ? opt.coup : null;
      if (an) {
        const p = Math.min(1, (t - an.t0) / an.dur), ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        k = an.d.de + an.d.m * ease;
        // traînée
        c.strokeStyle = COUL[q] + '88'; c.lineWidth = tailleC * 0.35; c.lineCap = 'round';
        c.beginPath(); c.arc(g.cx, g.cy, voie, angle(g, an.d.de + Math.max(0, an.d.m * ease - Math.min(6, an.d.m))), angle(g, k)); c.stroke();
      } else {
        const n = parCase[k] || 0; parCase[k] = n + 1; ray = voie - n * tailleC * 0.75;
      }
      const a = angle(g, k), x = g.cx + Math.cos(a) * ray, y = g.cy + Math.sin(a) * ray;
      if (opt.tour === q) {
        c.strokeStyle = COUL[q]; c.lineWidth = 3; c.globalAlpha = 0.5 + 0.4 * Math.sin(t / 200);
        rond(c, x, y, tailleC * 0.95); c.stroke(); c.globalAlpha = 1;
      }
      cargo(c, x, y, a + Math.PI / 2, tailleC, COUL[q], COUL_F[q], modeleDe(q));
    }
    // balise qui vole
    if (opt.coup && opt.coup.d.t === 'b') {
      const an = opt.coup, p = Math.min(1, (t - an.t0) / an.dur);
      const k = an.d.de + an.d.v * p, q = surAnneau(g, k, g.R);
      c.fillStyle = COUL[an.d.s]; rond(c, q.x, q.y, tailleC * 0.22); c.fill();
      c.fillStyle = '#fff'; etincelle(c, q.x, q.y, tailleC * 0.3);
    }
  }

  // L'écran titre : ciel, soleil, anneau d'astéroïdes et quatre cargos (sans aucun texte).
  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.drawImage(fondNebuleuse(w, h, 2), 0, 0, w, h);
    const large = w > h * 1.05;
    const g = geometrie(w, h * 0.62, 20);
    g.cy = h * 0.47;
    g.R = Math.min(w * 0.5 - 14, h * 0.27);
    // sur un écran large, l'anneau passe à gauche, à côté des boutons
    // sur un écran large : deux anneaux, à gauche et à droite des boutons
    if (large) { g.R = Math.min(h * 0.3, w * 0.14); g.cx = g.R + 24; g.cy = h * 0.6; }
    g.s = 2 * Math.PI * g.R / 20;
    if (large) {
      const e2 = { N: 20, pos: [3, 8, 13, 18], tr: [{ c: 5, k: 'h' }], pi: [], ast: [{ c: 1, v: 2, r: 0, b: -1 }, { c: 10, v: 3, r: 1, b: -1 }, { c: 15, v: 1, r: 0, b: -1 }, { c: 16, v: 2, r: 0, b: 3 }] };
      dessinerAnneau(c, e2, { cx: w - g.cx, cy: g.cy, R: g.R, N: 20, s: g.s }, { t: 2400, moi: -1, titre: true });
    }
    const e = {
      N: 20, pos: [0, 5, 10, 15], tr: [{ c: 12, k: 'd' }], pi: [{ c: 7, m: 1 }],
      ast: [{ c: 2, v: 1, r: 0, b: -1 }, { c: 3, v: 3, r: 1, b: -1 }, { c: 8, v: 2, r: 0, b: -1 }, { c: 14, v: 2, r: 0, b: 1 }, { c: 17, v: 3, r: 0, b: -1 }, { c: 19, v: 1, r: 0, b: -1 }]
    };
    dessinerAnneau(c, e, g, { t: 1200, moi: -1, titre: true });
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 secteurs) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let coup = null;            // coup en cours d'animation { ev, d, t0, dur }
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;
  let geo = null;
  let attenteTuto = false;
  let sel = [];               // cartes choisies (indices)
  let opChoisi = '';
  let mainVue = -1;           // numéro du coup dont la main est affichée (sélection remise à zéro)
  let serie = 0;              // cristaux minés d'affilée (autocollant « trio »)
  let voleMoi = false;        // un pirate m'a volé pendant ce secteur
  let nouveauxAutos = [];
  const particules = [];
  const flottants = [];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'carnet', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') dessinerTitre();
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function iconeCargo(cv, s, modele) {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    cargo(c, cv.width / 2 + cv.width * 0.06, cv.height / 2, 0, Math.min(cv.width, cv.height) * 0.5, COUL[s], COUL_F[s], modele);
  }

  // Cartes des 4 places, en haut de l'écran, et places du salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'ic'; cv.width = 88; cv.height = 72;
      const pts = document.createElement('span'); pts.className = 'pts';
      const bal = document.createElement('span'); bal.className = 'bal';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, bal, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
    const cartes = $('cartes');
    cartes.textContent = '';
    for (let k = 0; k < 3; k++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'carte-p'; b.id = 'carte-' + k;
      b.addEventListener('click', () => { audio(); toucherCarte(k); });
      cartes.appendChild(b);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : pseudo d'un vrai joueur en ligne, sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  // Nom court d'une place dans les messages : « Toi », le pseudo ou le cargo.
  function nomCourt(s) {
    if (partie && s === partie.siege) return tr('place.toi');
    const info = siegesActuels()[s] || {};
    return info.humain && info.nom ? info.nom : tr('cargo.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !O.finie(e) ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      const ptsEl = d.querySelector('.pts');
      if (ptsEl.dataset.v !== String(pts)) { ptsEl.dataset.v = String(pts); ptsEl.innerHTML = ICONE_GEMME; const sp = document.createElement('span'); sp.textContent = nb(pts); ptsEl.appendChild(sp); }
      const bal = e && NIVEAUX[e.k].ba > 0 ? tr('place.balises', { n: e.bal[s] }) : '';
      if (d.querySelector('.bal').textContent !== bal) d.querySelector('.bal').textContent = bal;
      const m = String(modeleDe(s));
      const ic = d.querySelector('canvas.ic');
      if (ic.dataset.m !== m) { ic.dataset.m = m; iconeCargo(ic, s, modeleDe(s)); }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { cargo: tr('cargo.' + s), n: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || O.finie(e)) return '';
    if (partie.siege < 0) return tr('multi.attente');
    if (coup) return '';
    const s = R.aQui(e);
    if (s === partie.siege) return tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const tours = e ? tr('jeu.tours', { n: Math.min(Math.floor(e.tt / PLACES) + 1, e.max / PLACES), total: e.max / PLACES }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + (e ? ' · ' + tours : '');
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + (e ? ' · ' + tours : '');
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if (m && $('message').textContent !== m) $('message').textContent = m;
    if (!m && !coup && $('message').textContent && (!e || partie.phase !== 'jeu')) $('message').textContent = '';
  }

  // Panneau des cartes : la main du joueur en cours ; seul le joueur de l'appareil la touche.
  function majPanneau() {
    const e = vue;
    const monTour = !!(e && partie && !coup && !enPause && !attenteTuto && partie.phase === 'jeu' && !O.finie(e) && partie.monTour());
    if (e && e.tt !== mainVue) { mainVue = e.tt; sel = []; opChoisi = ''; }
    const qui = e && partie && partie.phase === 'jeu' ? (coup ? coup.d.s : R.aQui(e)) : -1;
    $('main-qui').textContent = qui < 0 ? '' : (partie && qui === partie.siege ? tr('main.toi') : tr('main.autre', { nom: nomCourt(qui) }));
    $('panneau').style.setProperty('--c', qui >= 0 ? COUL[qui] : '#56a8ff');
    for (let k = 0; k < 3; k++) {
      const b = $('carte-' + k);
      const vals = coup ? coup.d.vals : (e ? e.main : null);
      const cache = coup ? coup.d.cache : (e ? e.cache : -1);
      const montre = coup && (k === coup.d.i || k === coup.d.j);
      const texte = !vals || qui < 0 ? '' : (k === cache && !montre ? '?' : nb(vals[k]));
      if (b.textContent !== texte) b.textContent = texte;
      b.classList.toggle('cachee', !!vals && qui >= 0 && k === cache && !montre);
      b.classList.toggle('choisie', coup ? montre : sel.indexOf(k) >= 0);
      b.classList.toggle('utilisee', !!coup && !montre);
      b.style.setProperty('--c', qui >= 0 ? COUL[qui] : '#56a8ff');
      b.disabled = !monTour;
      b.setAttribute('aria-label', texte === '?' ? tr('carte.cacheeAria') : tr('carte.aria', { n: texte || '0' }));
      b.setAttribute('aria-pressed', sel.indexOf(k) >= 0 ? 'true' : 'false');
    }
    const ops = e ? e.ops : '+';
    document.querySelectorAll('.op[data-o]').forEach((b) => {
      const o = b.dataset.o;
      b.classList.toggle('cache', ops.indexOf(o) < 0);
      b.classList.toggle('choisi', coup ? coup.d.o === o : opChoisi === o);
      b.disabled = !monTour || sel.length !== 2;
    });
    const balise = $('btn-balise');
    const avecBalises = !!e && NIVEAUX[e.k].ba > 0;
    balise.classList.toggle('cache', !avecBalises);
    $('ops').classList.toggle('avec-balise', avecBalises);
    if (avecBalises) {
      const n = partie && partie.siege >= 0 ? e.bal[partie.siege] : 0;
      $('balise-n').textContent = nb(n);
      balise.disabled = !monTour || sel.length !== 1 || n <= 0;
      balise.setAttribute('aria-label', tr('balise.aria', { n: n }));
    }
    const pousser = $('btn-pousser');
    pousser.disabled = !monTour || sel.length !== 2 || !opChoisi;
    // formule en cours
    let f = '';
    if (coup && coup.d.t === 'p') f = formule(coup.d.vals, coup.d.i, coup.d.j, coup.d.o, coup.d.cache, true);
    else if (coup && coup.d.t === 'b') f = tr('formule.balise', { n: nb(coup.d.v) });
    else if (monTour && sel.length) f = formule(e.main, sel[0], sel[1], opChoisi, e.cache, false);
    if ($('formule').textContent !== f) $('formule').textContent = f;
  }

  // « 4 × 3 » (le plus grand d'abord pour la soustraction) ; avec le résultat une fois joué.
  function formule(vals, i, j, o, cache, fini) {
    const v = (k) => (k === undefined || k < 0 ? '?' : (k === cache && !fini ? '?' : nb(vals[k])));
    let a = i, b = j;
    if (o === '-' && b !== undefined && b >= 0 && vals[b] > vals[a] && (fini || (a !== cache && b !== cache))) { a = j; b = i; }
    let txt = v(a) + ' ' + (o ? SYMB[o] : '…') + ' ' + v(b);
    if (fini) txt += ' = ' + nb(O.calcul(vals[i], vals[j], o));
    return txt;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majPanneau();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !O.finie(e) && !coup) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    const now = performance.now();
    if (coup && now - coup.t0 >= coup.dur) terminerCoup();
    dessinerJeu(now, dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const th = vue ? Math.floor(vue.k / 5) : 2;
    c.drawImage(fondNebuleuse(w, h, th), 0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(w, h, vue.N);
    const tour = partie && partie.phase === 'jeu' && !O.finie(vue) && !coup ? R.aQui(vue) : -1;
    dessinerAnneau(c, vue, geo, { t: t, moi: partie ? partie.siege : -1, coup: coup, tour: tour });
    // particules (éclats de cristal) et textes qui s'envolent
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.gemme) gemme(c, p.x, p.y, p.k); else { c.fillStyle = p.coul; etincelle(c, p.x, p.y, p.k); }
      c.globalAlpha = 1;
    }
    for (let i = flottants.length - 1; i >= 0; i--) {
      const f = flottants[i];
      f.vie -= dt; f.y -= 34 * dt;
      if (f.vie <= 0) { flottants.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, f.vie * 1.5);
      c.font = '900 ' + f.k + 'px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 4; c.strokeStyle = '#0a0d24'; c.strokeText(f.texte, f.x, f.y);
      c.fillStyle = f.coul; c.fillText(f.texte, f.x, f.y);
      c.globalAlpha = 1;
    }
  }

  function jaillir(cell, n) {
    if (!vue || !geo) return;
    const p = surAnneau(geo, cell, geo.R);
    for (let k = 0; k < 10 + n * 6; k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 170;
      particules.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140, vie: 0.7 + Math.random() * 0.5, k: 3 + Math.random() * 4, coul: '#fff6c0', gemme: k % 3 === 0 });
    }
  }
  function flotter(cell, texte, coul) {
    if (!vue || !geo) return;
    const p = surAnneau(geo, cell, geo.R * 0.78);
    flottants.push({ x: p.x, y: p.y, texte: texte, coul: coul, vie: 1.4, k: 22 });
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    coup = null;
    vue = partie.etat ? copie(partie.etat) : null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la manche.
  let finSalon = 0, resultatSalon = null, finEnAttente = false, lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + modeleDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        c.fillStyle = COUL_F[s]; rond(c, 56, 62, 44); c.fill();
        c.strokeStyle = COUL[s]; c.lineWidth = 4; rond(c, 56, 62, 42); c.stroke();
        cargo(c, 60, 62, -Math.PI / 4, 48, COUL[s], '#0a0d24', modeleDe(s));
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { cargo: tr('cargo.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { cargo: nomChef ? nomChef + ' · ' + tr('cargo.' + partie.chef) : tr('cargo.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    coup = null;
    vue = copie(partie.etat);
    particules.length = 0;
    flottants.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    mainVue = -1;
    serie = 0;
    voleMoi = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    $('coup').textContent = '';
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (partie.monTour()) sons.tour();
  }

  // Un coup arrive : on l'anime (le cargo vole), puis on montre le résultat.
  function surAction(ev) {
    if (coup) terminerCoup();
    const d = ev.apres.der;
    if (!d) { vue = copie(ev.apres); return; }
    coup = { ev: ev, d: d, t0: performance.now(), dur: d.t === 'b' ? 700 : Math.min(1050, 380 + d.m * 32) };
    vue = copie(ev.avant);
    debutTour = Date.now();
    dernierTic = -1;
    if (d.t === 'b') sons.balise(); else sons.pousse();
    // le calcul du coup, pour tout le monde
    let texte = d.t === 'b' ? tr('coup.balise', { n: d.v }) : formule(d.vals, d.i, d.j, d.o, d.cache, true);
    if (d.k === 'd') texte += ' · ' + tr('coup.double', { n: d.m });
    if (d.k === 'h') texte += ' · ' + tr('coup.moitie', { n: d.m });
    $('coup').textContent = tr('coup.qui', { nom: nomCourt(d.s), texte: texte });
    $('message').textContent = '';
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    relancerBoucle();
  }

  function terminerCoup() {
    const c0 = coup;
    if (!c0) return;
    coup = null;
    const d = c0.d, ev = c0.ev;
    vue = copie(ev.apres);
    const moi = partie && d.s === partie.siege;
    let fin = '';
    if (d.t === 'b') {
      if (d.ok) { fin = tr('coup.baliseOk'); sons.mine(0); flotter(d.a, '⚑', COUL[d.s]); }
      else { fin = tr('coup.baliseRate'); sons.rate(); }
    } else {
      if (d.k) sons.trou();
      if (d.gain > 0) {
        fin = tr('coup.mine', { n: d.gain });
        sons.mine(d.gain);
        jaillir(d.a, d.gain);
        flotter(d.a, '+' + nb(d.gain), '#7af0ff');
        const carte = $('place-' + d.s);
        carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      } else if (d.res >= 0) { fin = tr('coup.reserve'); sons.non(); }
      else { fin = tr('coup.rate'); sons.rate(); }
      if (d.vol) {
        fin += ' · ' + tr('coup.vol');
        setTimeout(() => sons.pirate(), 250);
        flotter(d.a, '−' + nb(1), '#ff6b6b');
        const carte = $('place-' + d.s);
        carte.classList.remove('secoue'); void carte.offsetWidth; carte.classList.add('secoue');
        if (moi) voleMoi = true;
      }
    }
    $('coup').textContent = $('coup').textContent + ' · ' + fin;
    if (moi) verifierAutos(d);
    if (d.tourne) setTimeout(() => toast(tr('jeu.tourne'), 1600), 300);
    if (partie && partie.phase === 'jeu' && !O.finie(vue) && R.aQui(vue) === partie.siege) sons.tour();
    majInterface();
  }

  // Autocollants de mission gagnés par un coup du joueur.
  function gagnerAuto(id) {
    if (prog.autos.indexOf(id) >= 0) return;
    prog.autos.push(id);
    nouveauxAutos.push(id);
    sons.auto();
    toast(tr('auto.gagne', { nom: tr('auto.' + id) }), 2600);
    if (session !== 'solo') sauverReglages();
  }
  function verifierAutos(d) {
    if (d.t === 'p' && d.gain > 0) {
      serie++;
      gagnerAuto('premier');
      if (d.o === '-') gagnerAuto('moins');
      if (d.o === 'x') gagnerAuto('fois');
      if (d.m >= vue.N) gagnerAuto('tour');
      if (d.k) gagnerAuto('trou');
      if (d.bonus) gagnerAuto('balise');
      if (d.cache >= 0 && (d.cache === d.i || d.cache === d.j)) gagnerAuto('tempete');
      if (serie >= 3) gagnerAuto('trio');
    } else if (d.t === 'p') serie = 0;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    const attente = coup ? Math.max(0, coup.dur - (performance.now() - coup.t0)) + 700 : 700;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (coup) terminerCoup();
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, attente);
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.k + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : étoiles, classement, autocollants
  // ---------------------------------------------------------------------

  function etoilesPour(pts, total, gagne) {
    if (!gagne) return 0;
    const p = total ? pts / total : 0;
    return p >= SEUIL3 ? 3 : p >= SEUIL2 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 72; cv.height = 60; iconeCargo(cv, s, modeleDe(s));
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('cargo.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.cristauxCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const total = e.sc.reduce((a, b) => a + b, 0);
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.cristaux', { n: pts, total: total }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, total, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        if (NIVEAUX[i].pi > 0 && !voleMoi) gagnerAuto('pirate');
        for (let n = 0; n < 4; n++) if (prog.etoiles.slice(n * 5, n * 5 + 5).every((x) => x > 0)) gagnerAuto('neb' + (n + 1));
        if (totalEtoiles() === NIVEAUX.length * 3) gagnerAuto('etoiles');
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les secteurs gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : (gagne ? '' : tr('fin.conseil')));
      const nouveaux = MODELES.filter((m, k) => k > 0 && m <= totalEtoiles() && m > totalEtoiles() - (gagne ? etoiles : 0) && m > 0);
      let autos = nouveauxAutos.map((id) => tr('auto.' + id)).join(' · ');
      if (nouveaux.length) autos = (autos ? autos + ' · ' : '') + tr('fin.nouveauCargo');
      $('fin-autos').textContent = autos ? tr('fin.autos', { liste: autos }) : '';
      nouveauxAutos = [];
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.k + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      $('fin-autos').textContent = nouveauxAutos.length ? tr('fin.autos', { liste: nouveauxAutos.map((id) => tr('auto.' + id)).join(' · ') }) : '';
      nouveauxAutos = [];
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {

    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 4 ? '#7af0ff' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function toucherCarte(k) {
    if (!monTourActif()) { attendsTonTour(); return; }

    if (!monTourActif()) { attendsTonTour(); return; }

    if (O.calcul(vue.main[sel[0]], vue.main[sel[1]], o) <= 0) { toast(tr('aide.zero'), 1800); sons.non(); return; }
    opChoisi = o;

  function pousser() {
    if (!monTourActif()) { attendsTonTour(); return; }
    if (sel.length !== 2 || !opChoisi) { toast(tr(sel.length !== 2 ? 'aide.deuxCartes' : 'aide.operation'), 1600); sons.non(); return; }
    const a = { t: 'p', i: Math.min(sel[0], sel[1]), j: Math.max(sel[0], sel[1]), o: opChoisi };
    if (partie.jouer(a)) { sel = []; opChoisi = ''; majPanneau(); }

  // Emblème d'un autocollant de mission (dessin sans texte).
  function embleme(c, id, x, y, r, oui) {
    c.save();
    c.fillStyle = oui ? '#2b3480' : '#1a1f4a'; rond(c, x, y, r); c.fill();
    c.strokeStyle = oui ? '#ffd54a' : '#3a4280'; c.lineWidth = r * 0.1; rond(c, x, y, r * 0.92); c.stroke();
    if (!oui) c.globalAlpha = 0.28;
    const k = r * 0.5;
    if (id === 'premier') gemme(c, x, y, k * 1.1);
    else if (id === 'moins') { gemme(c, x - k * 0.4, y, k * 0.8); c.fillStyle = '#ffd54a'; c.fillRect(x + k * 0.25, y - k * 0.12, k * 0.8, k * 0.24); }
    else if (id === 'fois') { gemme(c, x - k * 0.4, y, k * 0.8); c.strokeStyle = '#ffd54a'; c.lineWidth = k * 0.22; c.beginPath(); c.moveTo(x + k * 0.25, y - k * 0.4); c.lineTo(x + k * 1.05, y + k * 0.4); c.moveTo(x + k * 1.05, y - k * 0.4); c.lineTo(x + k * 0.25, y + k * 0.4); c.stroke(); }
    else if (id === 'tour') { c.strokeStyle = '#9cf0ff'; c.lineWidth = k * 0.25; c.beginPath(); c.arc(x, y, k * 0.9, -0.3, Math.PI * 1.6); c.stroke(); c.fillStyle = '#9cf0ff'; c.beginPath(); c.moveTo(x + k * 1.2, y - k * 0.2); c.lineTo(x + k * 0.6, y - k * 0.3); c.lineTo(x + k * 0.95, y + k * 0.25); c.fill(); }
    else if (id === 'trou') trouNoir(c, x, y, k * 0.85, 'd', 600);
    else if (id === 'balise') drapeau(c, x - k * 0.2, y + k * 0.4, k * 1.6, '#ffd54a', '#8a6a00');
    else if (id === 'pirate') { pirate(c, x, y + k * 0.1, k * 0.9, 0); c.strokeStyle = '#7dffa8'; c.lineWidth = k * 0.2; c.beginPath(); c.moveTo(x - k, y + k); c.lineTo(x + k, y - k); c.stroke(); }
    else if (id === 'tempete') { soleil(c, x, y, k * 0.55, 0); }
    else if (id === 'trio') { gemme(c, x - k * 0.7, y + k * 0.2, k * 0.6); gemme(c, x, y - k * 0.2, k * 0.6); gemme(c, x + k * 0.7, y + k * 0.2, k * 0.6); }
    else if (id.indexOf('neb') === 0) {
      const N0 = NEB[parseInt(id.slice(3), 10) - 1];
      [[-0.4, 0.1, 0.55], [0.3, -0.15, 0.6], [0.2, 0.35, 0.45]].forEach((p, i) => { c.fillStyle = (i % 2 ? N0.n : N0.n2) + 'cc'; rond(c, x + p[0] * k, y + p[1] * k, p[2] * k); c.fill(); });
      c.fillStyle = '#fff'; etincelle(c, x + k * 0.1, y, k * 0.3);
    } else { c.fillStyle = '#ffd54a'; etoile5(c, x, y, k); c.fill(); }
    c.restore();
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');

    const px = (k) => x0 + (x1 - x0) * k / (n - 1);
    const cartesX = [70, 160, 250], cy = 280, cw = 74, ch = 84;
    // seules les opérations déjà connues à ce moment du parcours
    const toutes = cle === 'base' || cle === 'gros' ? ['+'] : cle === 'moins' ? ['+', '-'] : ['+', '-', 'x'];
    const opsX = {};
    toutes.forEach((o, i) => { opsX[o] = 326 + i * 58; });
    const baliseX = 380, pousserX = 506;
    const etapes = [];   // positions de la main [x, y, instant]
    if (d.balise !== undefined) {
      etapes.push([cartesX[d.balise], cy, 700], [baliseX, cy, 1500]);
    } else {
      etapes.push([cartesX[d.pick[0]], cy, 700], [cartesX[d.pick[1]], cy, 1400], [opsX[d.op], cy, 2100], [pousserX, cy, 2800]);
    }
    const tLance = etapes[etapes.length - 1][2] + 150;
    const v = d.balise !== undefined ? d.cartes[d.balise] : O.calcul(d.cartes[d.pick[0]], d.cartes[d.pick[1]], d.op);
    const m = d.trou ? (d.trou[1] === 'd' ? v * 2 : Math.floor(v / 2)) : v;
    const DUREE = tLance + 1100 + 1800;
    const fond = fondNebuleuse(W, 360, 2);
    let debut = 0;
    const j = ++tutoAnim;
    let id = 0;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const q = (t - debut) % DUREE;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(fond, 0, 0, W, 360);
      // la bande de l'anneau
      c.strokeStyle = 'rgba(200,210,255,.14)'; c.lineWidth = 46; c.lineCap = 'round';
      c.beginPath(); c.moveTo(x0 - 10, yl); c.lineTo(x1 + 10, yl); c.stroke();
      for (let k = 0; k < n; k++) { c.fillStyle = 'rgba(220,228,255,.45)'; rond(c, px(k), yl, 3); c.fill(); }
      if (d.pirate !== undefined) {
        c.strokeStyle = 'rgba(255,60,80,.3)'; c.lineWidth = 46; c.lineCap = 'butt';
        c.beginPath(); c.moveTo(px(d.pirate - 1.5), yl); c.lineTo(px(d.pirate + 1.5), yl); c.stroke();
      }
      if (d.trou) trouNoir(c, px(d.trou[0]), yl, 19, d.trou[1], t);
      const fini = q > tLance + 1100;
      d.ast.forEach((a, i) => {
        let cell = a[0];
        if (d.tourne) cell = a[0] + Math.min(1, Math.max(0, (q - 200) / 500)) - 1;
        const mine = fini && d.balise === undefined && cell === m;
        if (mine) return;
        const A = { c: cell, v: a[1], r: d.tourne ? 1 : 0, b: fini && d.balise !== undefined && a[0] === v ? 0 : -1 };
        asteroide(c, A, px(cell), yl, 18, t + i * 300);
        // distance écrite au-dessus (par le jeu)
        c.font = '900 17px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillStyle = COUL_F[0]; rr(c, px(cell) - 16, yl - 56, 32, 24, 11); c.fill();
        c.fillStyle = '#fff'; c.fillText(nb(Math.round(cell)), px(cell), yl - 43);
      });
      if (d.pirate !== undefined) pirate(c, px(d.pirate), yl, 17, t);
      // le cargo
      let pos = 0;
      if (d.balise === undefined && q > tLance) pos = Math.min(1, (q - tLance) / 1100) * m;
      cargo(c, px(pos), yl + 34, 0, 22, COUL[0], COUL_F[0], 0);
      if (d.balise !== undefined && q > tLance && q < tLance + 1100) {
        const b = Math.min(1, (q - tLance) / 900) * v;
        c.fillStyle = '#ffd54a'; rond(c, px(b), yl, 6); c.fill();
      }
      if (fini && d.balise === undefined) {
        c.font = '900 26px system-ui, sans-serif'; c.fillStyle = '#7af0ff'; c.textAlign = 'center';
        const cible = d.ast.find((a) => a[0] === m);
        c.fillText('+' + nb(cible ? cible[1] : 1), px(m), yl - 50 - Math.min(20, (q - tLance - 1100) / 40));
      }
      // les cartes
      for (let k = 0; k < 3; k++) {
        const choisie = (d.balise !== undefined ? [d.balise] : d.pick).some((p, i) => p === k && q > etapes[i][2]);
        const x = cartesX[k] - cw / 2, y = cy - ch / 2 - (choisie ? 8 : 0);
        c.fillStyle = k === d.cache ? '#ff9a2e' : '#ffe9a8'; rr(c, x, y, cw, ch, 12); c.fill();
        c.strokeStyle = choisie ? COUL[0] : '#fff3c6'; c.lineWidth = choisie ? 5 : 3; c.stroke();
        c.fillStyle = k === d.cache ? '#fff' : '#23180a'; c.font = '900 40px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(k === d.cache ? '?' : nb(d.cartes[k]), cartesX[k], y + ch / 2 + 2);
      }
      if (d.balise !== undefined) {
        c.fillStyle = q > etapes[1][2] ? '#ffd54a' : '#1d2556'; rr(c, baliseX - 34, cy - 26, 68, 52, 12); c.fill();
        drapeau(c, baliseX - 8, cy + 14, 34, '#ffd54a', '#8a6a00');
      } else {
        Object.keys(opsX).forEach((o) => {
          const choisi = o === d.op && q > etapes[2][2];
          c.fillStyle = choisi ? '#ffd54a' : '#1d2556'; rr(c, opsX[o] - 26, cy - 26, 52, 52, 12); c.fill();
          c.strokeStyle = '#6f7fd6'; c.lineWidth = 2; c.stroke();
          c.fillStyle = choisi ? '#2a1a00' : '#fff'; c.font = '900 32px system-ui, sans-serif'; c.fillText(SYMB[o], opsX[o], cy + 2);
        });
        c.fillStyle = q > etapes[3][2] ? '#8ff0a6' : '#2fb75a'; rr(c, pousserX - 26, cy - 26, 48, 52, 12); c.fill();
        c.fillStyle = '#fff'; c.beginPath(); c.moveTo(pousserX - 10, cy - 14); c.lineTo(pousserX + 12, cy); c.lineTo(pousserX - 10, cy + 14); c.closePath(); c.fill();
      }
      // la main
      let mx = 300, my = 345, appui = 0;
      for (let i = 0; i < etapes.length; i++) {
        const [ex, ey, et] = etapes[i];
        const t0 = i === 0 ? 0 : etapes[i - 1][2];
        if (q < et) { const p = Math.min(1, Math.max(0, (q - t0 - 100) / (et - t0 - 250))); const ax = i === 0 ? 300 : etapes[i - 1][0], ay = i === 0 ? 345 : etapes[i - 1][1]; mx = ax + (ex - ax) * p; my = ay + (ey - ay) * p; appui = 0; break; }
        mx = ex; my = ey; appui = q - et < 220 ? (q - et) / 220 : 0;
      }
      if (q < tLance + 400) main(c, mx, my, 1.25, appui);
      id = requestAnimationFrame(image);
    }
    id = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(id);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Clavier
  // ---------------------------------------------------------------------

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (chiffres[ev.code] !== undefined) { ev.preventDefault(); audio(); toucherCarte(chiffres[ev.code]); return; }
    if (ev.key === '+' || ev.code === 'NumpadAdd') { ev.preventDefault(); audio(); choisirOp('+'); return; }
    if (ev.key === '-' || ev.code === 'NumpadSubtract' || ev.code === 'Minus') { ev.preventDefault(); audio(); choisirOp('-'); return; }
    if (ev.key === '*' || ev.code === 'NumpadMultiply' || ev.code === 'KeyX') { ev.preventDefault(); audio(); choisirOp('x'); return; }
    if (ev.code === 'KeyB') { ev.preventDefault(); audio(); lancerBalise(); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter' || ev.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio(); pousser();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-carnet').addEventListener('click', () => { audio(); sons.clic(); ouvrirCarnet(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('carnet-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami : directement dans le salon de sa partie.
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
