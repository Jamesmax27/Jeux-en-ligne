  "nv.base.titre": "Tu primera guardia",
  "nv.base.texte": "1. Ve al mostrador y abre la ficha del paciente. 2. Tócalo en la sala de espera: te sigue. 3. Llévalo a la mesa de la sala correcta y cúralo. La flecha verde te muestra qué sigue.",
  "nv.radio.titre": "Radiología",
  "nv.radio.texte": "Una fractura (hueso en la burbuja) se cura en radiología: haz flash cuando la barra verde pase por el hueso roto.",
  "nv.rideaux.titre": "Las cortinas de recepción",
  "nv.rideaux.texte": "Algo enorme ronda afuera. Tira de la palanca del mostrador para cerrar las cortinas antes de que llegue a la puerta y luego vuelve a abrirlas: si no, la fila se impacienta.",
  "nv.pharma.titre": "La farmacia",
  "nv.pharma.texte": "La fiebre se cura con un frasco del color correcto. Acuesta al paciente en una mesa, toma el frasco en la farmacia y vuelve a dárselo. Solo puedes llevar un frasco a la vez.",
  "nv.yeux.titre": "Los imitadores",
  "nv.yeux.texte": "Algunas anomalías se disfrazan de animal. En la ficha, unos ojos rojos que brillan deben alertarte: recházalas. Un imitador admitido termina transformándose.",
  "nv.patience.titre": "Una noche ajetreada",
  "nv.patience.texte": "Los pacientes tienen más prisa y los monstruos de afuera vuelven dos veces. Vigila las barras de paciencia.",
  "nv.panne.titre": "El apagón",
  "nv.panne.texte": "Todo se apaga: solo alumbra tu linterna. ¡Las cortinas dejan de funcionar! Ve al cuarto técnico y vuelve a arrancar el generador sin moverte durante la reparación.",
  "nv.rodeur.titre": "El acechador",
  "nv.rodeur.texte": "Una anomalía te persigue por los pasillos. Escóndete en un casillero o corre a encender los focos UV de recepción para ahuyentarla. Si te quedas escondido, ataca a los pacientes.",
  "nv.ombre.titre": "Sin sombra",
  "nv.ombre.texte": "Nueva pista: algunas anomalías no tienen sombra bajo las patas. Mira también la fila de afuera.",
  "nv.bloc.titre": "El quirófano",
  "nv.bloc.texte": "Las urgencias (corazón en la burbuja) van al quirófano: recuerda el orden en que se encienden los instrumentos y repite la misma secuencia.",
  "nv.vents.titre": "Las rejillas de ventilación",
  "nv.vents.texte": "Algo se arrastra por los conductos. Cuando una rejilla tiembla y brilla en rojo, corre a sellarla antes de que salga una anomalía.",
  "nv.pattes.titre": "Demasiadas patas",
  "nv.pattes.texte": "Nueva pista: cuenta las patas. Y la farmacia abre un cuarto armario, el del frasco amarillo.",
  "nv.rapides.titre": "Llegan más rápido",
  "nv.rapides.texte": "Los monstruos de afuera corren hacia la puerta y la luz se va dos veces. No pierdas de vista la entrada.",
  "nv.double.titre": "Dos curas",
  "nv.double.texte": "Algunos pacientes necesitan dos curas: una radiografía y luego vendas. Un punto amarillo en la burbuja te lo recuerda. Después de la primera, guíalo a la siguiente sala.",
  "nv.fiche.titre": "La ficha falsa",
  "nv.fiche.texte": "Nueva pista: lee la especie en la ficha. Si no coincide con el animal del dibujo, es una anomalía.",
  "nv.rodeurs.titre": "Acechadores rápidos",
  "nv.rodeurs.texte": "Los acechadores corren casi tan rápido como tú y las rejillas ceden antes. Localiza los casilleros en tu camino.",
  "nv.bouche.titre": "La sonrisa",
  "nv.bouche.texte": "Nueva pista: una sonrisa demasiado ancha, llena de colmillos. Ningún paciente de verdad sonríe así.",
  "nv.melange.titre": "Todo a la vez",
  "nv.melange.texte": "Apagones, rejillas, monstruos, imitadores: esta noche todo pasa al mismo tiempo. El quirófano pide cinco instrumentos.",
  "nv.trois.titre": "El tercer ojo",
  "nv.trois.texte": "Nueva pista: un ojo en medio de la frente. Esta noche hay muchos imitadores.",
  "nv.finale.titre": "La última noche",
  "nv.finale.texte": "Dos acechadores, cuatro monstruos afuera, todas las pistas. Aguanta hasta el amanecer y cura a diez pacientes.",

     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

function poly(c, pts, fill, stroke) {

function nuance(hex, k) {

function boite(c, x0, y0, x1, y1, h, coul, e) {

/* Patients ----------------------------------------------------------------- */

/* ---------------------------------------------------------------------------
   Mise à jour du monde
   --------------------------------------------------------------------------- */
function maj(dt) {
  if (!G || G.fini) return;
  G.tps += dt;
  // évènements programmés
  while (G.evts.length && G.evts[0].t <= G.tps) declencher(G.evts.shift());
  // arrivée des patients en attente de place dans la file
  majFile();
  majJoueur(dt);
  G.patients.slice().forEach((p) => majPatient(p, dt));
  G.rodeurs.slice().forEach((r) => majRodeur(r, dt));
  G.cogneurs.slice().forEach((c) => majCogneur(c, dt));
  majVents(dt);
  // rideaux
  const cible = G.rideaux.ferme ? 1 : 0;
  G.rideaux.anim += borne(cible - G.rideaux.anim, -dt * 1.6, dt * 1.6);
  if (G.uvRecharge > 0) G.uvRecharge -= dt;
  if (G.repar) {
    G.repar.t += dt;
    if (G.repar.t >= G.repar.duree) finirReparation();
  }
  // particules
  G.parts = G.parts.filter((q) => { q.vie -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt; if (q.sorte !== 'score') q.vz -= 160 * dt; return q.vie > 0; });

  if (panneau && proche < 3.2 && panneau.sorte !== 'fiche-ferme') { fermerPanneau(); alerte(t('msg.danger'), 'danger'); }

function declencher(e) {
  if (e.type === 'patient') { G.attente.push({ imit: e.imit }); }
  else if (e.type === 'cog') {
    G.cogneurs.push({ x: 21.5, y: 18.5, etat: 'approche', minuteur: 0, ph: 0, flip: true });
    SON.grogne(); alerte(t('msg.cogneur'), 'danger', 3.2);
  } else if (e.type === 'panne') {
    if (!G.panne) { G.panne = true; SON.panne(); G.flashRouge = 0.3; alerte(t('msg.panne'), 'danger', 3.2); }
  } else if (e.type === 'rod') {
    nouveauRodeur(3.5, 9.5, false); alerte(t('msg.rodeur'), 'danger', 3.2);
  } else if (e.type === 'vent') {
    const libres = G.vents.filter((v) => v.etat === 'ok');
    if (libres.length) {
      // de préférence une grille loin du joueur
      libres.sort((a, b) => Math.hypot(b.x - G.j.x, b.y - G.j.y) - Math.hypot(a.x - G.j.x, a.y - G.j.y));
      const v = libres[Math.min(libres.length - 1, entier(0, 2))];
      v.etat = 'tremble'; v.minuteur = G.L.vdel || 9; SON.grille();
      alerte(t('msg.vent', { salle: t(SALLES[code(v.x, v.y)].nom) }), 'danger', 3.2);
    }

function majFile() {
  // les patients prévus entrent dans la file s'il y a de la place
  while (G.attente.length) {
    const dansFile = G.patients.filter((p) => p.etat === 'arrive' || p.etat === 'file').length;
    if (dansFile >= FILE.length) break;
    const e = G.attente.shift();
    const p = nouveauPatient(e.imit);
    p.etat = 'file';
    G.patients.push(p);
    SON.cloche();
  }
  // ordre de la file
  const file = G.patients.filter((p) => p.etat === 'file').sort((a, b) => a.id - b.id);
  file.forEach((p, i) => {
    const [fx0, fy0] = FILE[i];
    if (!p.but || p.but[0] !== fx0 || p.but[1] !== fy0) {
      p.but = [fx0, fy0];
      p.chemin = cheminVers(p, fx0, fy0, (x, y) => code(x, y) === 'o');
    }
  });
  // le premier de la file avance au comptoir
  if (!patientAuComptoir() && G.rideaux.anim < 0.05 && !G.rideaux.ferme && file.length) {
    const p = file[0];
    if (Math.floor(p.x) === FILE[0][0] && Math.floor(p.y) === FILE[0][1] && (!p.chemin || !p.chemin.length) && !cogneurALaPorte()) {
      p.etat = 'versComptoir'; p.but = null;

  alerte(t('msg.revele'), 'danger', 3.2);
}
function nouveauRodeur(x, y, cri) {
  G.rodeurs.push({ x, y, etat: 'chasse', chemin: [], recalc: 0, ph: 0, flip: false, renifle: 0, cible: null, apparition: 1 });
  G.tremble = 0.5; G.flashRouge = 0.6;
  if (cri) SON.cri(); else SON.grogne();
  particules(x, y, 60, '#2a0a2e', 16);
}

/* Rôdeurs ------------------------------------------------------------------- */
function majRodeur(r, dt) {
  r.ph += dt;
  if (r.apparition > 0) { r.apparition -= dt; return; }
  const vit = (G.L.rodVit || 2.1) * (G.panne ? 1.1 : 1);
  if (r.etat === 'fuite') {
    const fini = avancer(r, 5, dt);
    if (fini) {
      if (r.y >= 17) { const i = G.rodeurs.indexOf(r); if (i >= 0) G.rodeurs.splice(i, 1); }
      else r.chemin = cheminVers(r, 10, 18, (x, y) => passePnj(x, y, true));
    }
    return;
  }
  r.recalc -= dt;
  const j = G.j;
  if (r.recalc <= 0) {
    r.recalc = 0.35;
    const passe = (x, y) => code(x, y) !== 'o' && passePnj(x, y, false);
    if (!j.cache) {
      r.etat = 'chasse';
      r.chemin = cheminVers(r, Math.floor(j.x), Math.floor(j.y), passe);
    } else {
      // le joueur s'est caché : le rôdeur renifle le casier, puis s'en prend aux patients
      if (r.etat === 'chasse') { r.etat = 'cherche'; r.renifle = 3; }
      if (r.etat === 'cherche') {
        const u = j.cache.u;
        r.chemin = cheminVers(r, u[0], u[1], passe);
        if (Math.hypot(r.x - u[0] - 0.5, r.y - u[1] - 0.5) < 0.9) { r.renifle -= 0.35; if (r.renifle <= 0) r.etat = 'proie'; }
      }
      if (r.etat === 'proie') {
        const proies = G.patients.filter((p) => ['attente', 'table', 'suit', 'comptoir', 'versSiege'].includes(p.etat) && !p.imit);
        if (proies.length) {
          proies.sort((a, b) => dist(a, r) - dist(b, r));
          r.cible = proies[0];
          const tx = Math.floor(r.cible.x), ty = Math.floor(r.cible.y);
          r.chemin = chemin(Math.floor(r.x), Math.floor(r.y), (x, y) => Math.abs(x - tx) + Math.abs(y - ty) <= 1, passe) || [];
        } else if (!r.chemin.length) {
          const x = entier(1, 20), y = entier(5, 6);
          r.chemin = cheminVers(r, x, y, passe);
        }
      }
    }
  }
  avancer(r, vit, dt);
  if (!j.cache && dist(r, j) < 0.55 && !G.fini) { attrape(); return; }
  if (r.cible && G.patients.includes(r.cible) && dist(r, r.cible) < 0.9) {
    const p = r.cible; r.cible = null;
    SON.devore(); particules(p.x, p.y, 30, '#8a0f1c', 22);
    libererPlace(p); retirerPatient(p);
    r.etat = 'cherche'; r.renifle = 2;
    perdreCoeur(t('msg.devore'), p.x, p.y);
  }
}
function attrape() {
  G.fini = true; enPartie = true;
  fermerPanneau();
  SON.cri(); G.tremble = 1;
  sautPeur(() => finNiveau(false, 'attrape', true));
}

/* Monstres du dehors ---------------------------------------------------------- */
function majCogneur(c, dt) {
  c.ph += dt;
  const vit = G.L.vcog || 0.6;
  if (c.etat === 'approche') {
    if (c.y > 17.6 && c.x > 10.5) { c.x = Math.max(10.5, c.x - vit * dt); c.flip = true; }
    else { c.x = 10.5; c.y = Math.max(17.5, c.y - vit * dt); }
    if (Math.random() < dt * 0.25) SON.grogne();
    if (c.x <= 10.5 && c.y <= 17.5) {
      if (G.rideaux.anim > 0.85) { c.etat = 'cogne'; c.minuteur = 3.6; c.coups = 0; }
      else {
        c.etat = 'entre';
      }
    }
  } else if (c.etat === 'cogne') {
    c.minuteur -= dt;
    const n = Math.floor((3.6 - c.minuteur) / 0.9);
    if (n > c.coups) { c.coups = n; SON.coup(); G.tremble = 0.25; }
    if (c.minuteur <= 0) {
      c.etat = 'repart'; G.compte.cog++; gagner(40, 10.5, 16.5); alerte(t('msg.cogneurParti'), 'ok');
    }
    if (G.rideaux.anim < 0.5) c.etat = 'entre';
  } else if (c.etat === 'repart') {
    c.x -= 1.4 * dt; c.y = Math.min(18.5, c.y + dt); c.flip = true;
    if (c.x < -2) G.cogneurs.splice(G.cogneurs.indexOf(c), 1);
  } else if (c.etat === 'entre') {
    G.cogneurs.splice(G.cogneurs.indexOf(c), 1);
    G.erreurs++;
    nouveauRodeur(10.5, 15.5, true);
    alerte(t('msg.cogneurEntre'), 'danger', 3.2);
    const p = patientAuComptoir(); if (p) { SON.devore(); libererPlace(p); retirerPatient(p); perdreCoeur(t('msg.devore'), 10.5, 15.5); }
  }
}

/* Grilles d'aération ------------------------------------------------------------ */
function majVents(dt) {
  G.vents.forEach((v) => {
    if (v.etat !== 'tremble') return;
    v.minuteur -= dt;
    if (Math.random() < dt * 2) SON.grille();
    if (v.minuteur <= 0) {
      v.etat = 'casse'; G.erreurs++;
      nouveauRodeur(v.x + 0.5, v.y + 0.5, true);
      alerte(t('msg.ventOuvert'), 'danger', 3);
    }
  });
}

/* Joueur ----------------------------------------------------------------------- */
const VIT_J = 3.4, RAYON = 0.26;
function libreJ(x, y) {
  for (const [dx, dy] of [[-RAYON, -RAYON], [RAYON, -RAYON], [-RAYON, RAYON], [RAYON, RAYON]]) {
    if (!passeJoueur(Math.floor(x + dx), Math.floor(y + dy))) return false;
  }
  return true;
}
function majJoueur(dt) {
  const j = G.j;
  if (j.cache || panneau) return;
  let mx = 0, my = 0;
  if (clavier.haut) { mx -= 1; my -= 1; }
  if (clavier.bas) { mx += 1; my += 1; }
  if (clavier.gauche) { mx -= 1; my += 1; }
  if (clavier.droite) { mx += 1; my -= 1; }
  const ax = j.x, ay = j.y;
  if (mx || my) {
    j.chemin = null; j.intention = null;
    const l = Math.hypot(mx, my), vx = mx / l * VIT_J * dt, vy = my / l * VIT_J * dt;
    if (libreJ(j.x + vx, j.y)) j.x += vx;
    if (libreJ(j.x, j.y + vy)) j.y += vy;
  } else if (j.chemin) {
    const fini = avancer(j, VIT_J, dt);
    if (j.intention && j.intention.proche && G.patients.includes(j.intention.proche) && dist(j, j.intention.proche) < 1.15) { j.chemin = null; agirIntention(); }
    else if (fini) { j.chemin = null; agirIntention(); }
  }
  const bouge = Math.hypot(j.x - ax, j.y - ay);
  if (bouge > 0) {
    if (G.repar) { G.repar = null; alerte(t('msg.reparInterrompue'), 'danger'); }
    const dx = j.x - ax, dy = j.y - ay;
    if (Math.abs(dx - dy) > 0.001) j.flip = (dx - dy) < 0;
    const avant = j.pas; j.pas += bouge * 4.2;
    if (Math.floor(avant / Math.PI) !== Math.floor(j.pas / Math.PI)) SON.pas();
    const der = j.trace[j.trace.length - 1];
    if (!der || Math.hypot(der.x - j.x, der.y - j.y) > 0.15) { j.trace.push({ x: j.x, y: j.y }); if (j.trace.length > 80) j.trace.shift(); }
  }
}
function allerVers(tx, ty, intention) {
  const j = G.j;
  if (j.cache) { sortirCasier(); return; }
  const sx = Math.floor(j.x), sy = Math.floor(j.y);
  if (sx === tx && sy === ty) { j.chemin = [[tx, ty]]; j.intention = intention || null; return; }
  const ch = chemin(sx, sy, (x, y) => x === tx && y === ty, passeJoueur);
  if (!ch) return false;
  j.chemin = ch; j.intention = intention || null;
  return true;
}
function agirIntention() {
  const it = G.j.intention; G.j.intention = null;
  if (!it) return;
  if (it.station) agirStation(it.station);
  else if (it.patient) guider(it.patient);
  else if (it.vent !== undefined) agirVent(G.vents[it.vent]);
}

/* Actions possibles -------------------------------------------------------------- */
function stationIci() {
  const j = G.j;
  let meilleure = null, md = 0.75;
  STATIONS.forEach((s) => { const d = Math.hypot(s.u[0] + 0.5 - j.x, s.u[1] + 0.5 - j.y); if (d < md) { md = d; meilleure = s; } });
  return meilleure;
}
function ventIci() {
  const j = G.j;
  return G.vents.find((v) => v.etat === 'tremble' && Math.hypot(v.x + 0.5 - j.x, v.y + 0.5 - j.y) < 1.2) || null;
}
function patientProche() {
  if (G.suiveur) return null;
  const j = G.j;
  let m = null, md = 1.4;
  G.patients.forEach((p) => {
    if (!(p.etat === 'attente' || (p.etat === 'table' && !tableAdaptee(p)))) return;
    const d = dist(p, j); if (d < md) { md = d; m = p; }
  });
  return m;
}
function tableDe(s) { return G.tables.find((tb) => tb.s === s); }
function tableDuPatient(p) { return G.tables.find((tb) => tb.patient === p); }
function tableAdaptee(p) { const tb = tableDuPatient(p); return tb && p.soins.length && SALLE_SOIN[p.soins[0]] === tb.s.salle; }
function actionCourante() {
  if (!G || G.fini) return null;
  const j = G.j;
  if (j.cache) return { texte: t('action.sortir'), f: sortirCasier };
  if (G.repar) return { texte: t('action.reparation'), f: null };
  const v = ventIci();
  if (v) return { texte: t('action.sceller'), f: () => agirVent(v) };
  const s = stationIci();
  if (s) {
    const a = actionStation(s, true);
    if (a) return a;
  }
  const p = patientProche();
  if (p) return { texte: t('action.guider'), f: () => guider(p) };
  if (G.suiveur) return { texte: t('action.suit'), f: null };
  return null;
}
function actionStation(s, apercu) {
  const j = G.j;
  switch (s.type) {
    case 'fiche': {
      const p = G.patients.find((q) => q.etat === 'comptoir');
      return p ? { texte: t('action.fiche'), f: () => ouvrirFiche(p) } : (apercu ? { texte: t('action.personne'), f: null } : null);
    }
    case 'levier':
      return { texte: G.rideaux.ferme ? t('action.ouvrir') : t('action.fermer'), f: basculerRideaux };
    case 'uv':
      if (G.uvRecharge > 0) return { texte: t('action.uvRecharge', { n: Math.ceil(G.uvRecharge) }), f: null };
      return { texte: t('action.uv'), f: activerUV };
    case 'casier': return { texte: t('action.cacher'), f: () => entrerCasier(s) };
    case 'gen': return G.panne ? { texte: t('action.courant'), f: () => commencerReparation(s) } : (apercu ? { texte: t('action.genOk'), f: null } : null);
    case 'armoire': {
      if (s.coul >= (G.L.coul || 3)) return apercu ? { texte: t('action.armoireVide'), f: null } : null;
      const nom = t('couleur.' + COULEURS[s.coul].id);
      if (j.flacon === s.coul) return { texte: t('action.reposer'), f: () => { j.flacon = null; SON.clic(); majMain(); } };
      return { texte: t('action.prendre', { couleur: nom }), f: () => prendreFlacon(s.coul) };
    }
    case 'table': {
      const tb = tableDe(s);
      if (G.suiveur && !tb.patient) return { texte: t('action.installer'), f: () => installer(tb) };
      if (tb.patient && tb.patient.etat === 'table' && tableAdaptee(tb.patient)) {
        const p = tb.patient;
        if (p.soins[0] === 'fievre') return { texte: j.flacon === p.flacon ? t('action.donner') : t('action.soigner'), f: () => soigner(tb) };
        return { texte: t('action.soigner'), f: () => soigner(tb) };
      }
      if (tb.patient && tb.patient.etat === 'table' && !G.suiveur) return { texte: t('action.guider'), f: () => guider(tb.patient) };
      return apercu ? { texte: t('action.tableVide'), f: null } : null;
    }
  }
  return null;
}
function agirStation(s) {
  const a = actionStation(s, false);
  if (a && a.f) a.f();
}
function actionBouton() {
  initAudio();
  const a = actionCourante();
  if (a && a.f) { a.f(); majAction(true); }
}

function guider(p) {
  if (!G.patients.includes(p) || G.suiveur) return;
  if (!(p.etat === 'attente' || p.etat === 'table')) return;
  if (dist(p, G.j) > 1.6) { allerProche(p); return; }
  const tb = tableDuPatient(p); if (tb) tb.patient = null;
  p.siege = null; p.etat = 'suit'; G.suiveur = p; p.chemin = null;
  G.j.trace = [{ x: p.x, y: p.y }, { x: G.j.x, y: G.j.y }];
  SON.clic();
  const salle = SALLE_SOIN[p.soins[0]];
  alerte(t('msg.suit', { salle: t(SALLES[salle].nom) }), '', 2.6);
}
function allerProche(p) {
  const tx = Math.floor(p.x), ty = Math.floor(p.y), j = G.j;
  const ch = chemin(Math.floor(j.x), Math.floor(j.y), (x, y) => Math.abs(x - tx) + Math.abs(y - ty) <= 1, passeJoueur);
  if (ch) { j.chemin = ch; j.intention = { patient: p, proche: p }; if (!ch.length) { j.chemin = null; guider(p); } }
}
function installer(tb) {
  const p = G.suiveur;
  if (!p) return;
  const salle = SALLE_SOIN[p.soins[0]];
  if (salle !== tb.s.salle) { alerte(t('msg.mauvaiseSalle', { salle: t(SALLES[salle].nom) }), 'danger'); SON.rate(); return; }
  G.suiveur = null; tb.patient = p; p.etat = 'table'; p.x = tb.s.t[0] + 0.5; p.y = tb.s.t[1] + 0.5; p.chemin = null;
  SON.admis();
  if (p.soins[0] === 'fievre' && G.j.flacon !== p.flacon) {
    alerte(t('msg.besoinFlacon', { couleur: t('couleur.' + COULEURS[p.flacon].id) }), '', 3.2);
  } else soigner(tb);
}
function prendreFlacon(c) {
  G.j.flacon = c; SON.flacon(); majMain();
  alerte(t('msg.flacon', { couleur: t('couleur.' + COULEURS[c].id) }), 'ok', 1.8);
}
function soigner(tb) {
  const p = tb.patient;
  if (!p || p.etat !== 'table') return;
  const s = p.soins[0];
  if (s === 'fievre') {
    if (G.j.flacon === p.flacon) { G.j.flacon = null; majMain(); SON.flacon(); soinTermine(p); }
    else if (G.j.flacon !== null) { alerte(t('msg.mauvaisFlacon', { couleur: t('couleur.' + COULEURS[p.flacon].id) }), 'danger'); G.j.flacon = null; majMain(); SON.rate(); }
    else alerte(t('msg.besoinFlacon', { couleur: t('couleur.' + COULEURS[p.flacon].id) }), '', 3);
  } else if (s === 'plaie') ouvrirPansement(p);
  else if (s === 'fracture') ouvrirRadio(p);
  else if (s === 'urgence') ouvrirBloc(p);
}
function soinTermine(p) {
  p.soins.shift();
  particules(p.x, p.y, 30, '#5be0b4', 14);
  if (p.soins.length) {
    SON.admis();
    alerte(t('msg.etape', { salle: t(SALLES[SALLE_SOIN[p.soins[0]]].nom) }), 'ok', 3);
    p.patience = Math.min(p.patMax, p.patience + 20);
    return;
  }
  SON.gueri();
  libererPlace(p);
  p.etat = 'sortie'; p.chemin = cheminVers(p, 10, 17, (x, y) => passePnj(x, y, true));
  G.soignes++;
  gagner(100 + Math.round(30 * p.patience / p.patMax), p.x, p.y);
  particules(p.x, p.y, 40, '#ff8ab0', 8, 'coeur');
  majHud();
  alerte(t('msg.gueri', { n: G.soignes, but: G.L.but }), 'ok', 2.4);
  if (G.soignes >= G.L.but) finNiveau(true);
}

/* Rideaux, UV, casiers, groupe électrogène, grilles ------------------------------- */
function basculerRideaux() {
  if (G.panne) { alerte(t('msg.pasCourant'), 'danger'); SON.rate(); return; }
  G.rideaux.ferme = !G.rideaux.ferme; SON.rideaux();
  alerte(G.rideaux.ferme ? t('msg.rideauxFermes') : t('msg.rideauxOuverts'), '', 2);
}
function activerUV() {
  if (G.panne) { alerte(t('msg.pasCourant'), 'danger'); SON.rate(); return; }
  if (G.uvRecharge > 0) return;
  G.uvRecharge = 20; G.flashBlanc = 0.7; SON.uv();
  const n = G.rodeurs.filter((r) => r.etat !== 'fuite').length;
  G.rodeurs.forEach((r) => { if (r.etat !== 'fuite') { r.etat = 'fuite'; r.apparition = 0; r.chemin = cheminVers(r, 10, 18, (x, y) => passePnj(x, y, true)); gagner(80, r.x, r.y); G.compte.rod++; } });
  alerte(n ? t('msg.uvFuite') : t('msg.uvRien'), n ? 'ok' : '', 2.4);
}
function entrerCasier(s) {
  G.j.cache = s; G.j.chemin = null; SON.casier();
  alerte(t('msg.cache'), '', 2);
}
function sortirCasier() {
  if (!G.j.cache) return;
  const u = G.j.cache.u; G.j.x = u[0] + 0.5; G.j.y = u[1] + 0.5; G.j.cache = null; SON.casier();
}
function commencerReparation(s) {

  G.repar = { t: 0, duree: 2.6, s }; SON.clic();
}
function finirReparation() {
  G.repar = null; G.panne = false; SON.courant(); G.flashBlanc = 0.25;

function agirVent(v) {
  if (!v || v.etat !== 'tremble') return;
  v.etat = 'scelle'; SON.scelle(); G.compte.vent++;
  particules(v.x + 0.5, v.y + 0.5, 5, '#c9d2e8', 10);
  gagner(30, v.x + 0.5, v.y + 0.5); alerte(t('msg.scelle'), 'ok');

function decider(p, admettre) {

// Radiologie : flasher quand la barre passe sur la fracture.
function ouvrirRadio(p) {
  const h = Math.min(200, window.innerHeight * 0.3);

    dessin(c, w, hh, tm) {

      c.strokeStyle = 'rgba(120,200,255,.08)'; for (let i = 0; i < w; i += 16) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i, hh); c.stroke(); }
      c.save(); c.translate(w * 0.5 - 10, hh * 0.86); c.globalAlpha = 0.35; dessinerAnimal(c, { esp: p.esp, couleur: '#7fc8ff', acc: null, tell: null }, cfg.s, { sansOmbre: true }); c.restore();
      // os

      c.restore();
      const fx0 = cfg.fx * w;
      const pu = 0.5 + 0.5 * Math.sin(tm * 8);
      c.strokeStyle = 'rgba(255,90,95,' + (0.5 + pu * 0.5) + ')'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(fx0 - 6, hh * 0.45); c.lineTo(fx0 + 3, hh * 0.52); c.lineTo(fx0 - 3, hh * 0.58); c.lineTo(fx0 + 6, hh * 0.66); c.stroke();
      c.fillStyle = 'rgba(255,90,95,.12)'; c.fillRect(fx0 - cfg.tol * w, 0, cfg.tol * w * 2, hh);
      const sx = cfg.scan * w;
      const g = c.createLinearGradient(sx - 20, 0, sx + 20, 0); g.addColorStop(0, 'rgba(91,224,180,0)'); g.addColorStop(0.5, 'rgba(91,224,180,.9)'); g.addColorStop(1, 'rgba(91,224,180,0)');
      c.fillStyle = g; c.fillRect(sx - 20, 0, 40, hh);

      for (let i = 0; i < cfg.besoin; i++) icone(c, 'etoile', w - 18 - i * 22, 16, 9, i < cfg.ok ? '#ffd479' : 'rgba(255,255,255,.2)');
    },

    key(e) { if (e.code === 'Space' || e.code === 'Enter') { cfg.flash(); return true; } if (e.code === 'Escape') { fermerPanneau(); return true; } return false; },
  };

// Bloc opératoire : retenir la suite d'instruments puis la refaire.

    sorte: 'soin', patient: p, suite: Array.from({ length: longueur }, () => entier(0, 3)), pos: 0, phase: 'montre', minuteur: 0.7, montre: -1, boutons: [],
    maj(dt) {

        cfg.montre++;

        const i = cfg.suite[cfg.montre];

        cfg.pos++;
        if (cfg.pos >= cfg.suite.length) { setTimeout(() => { if (panneau === cfg) { fermerPanneau(); soinTermine(p); } }, 300); cfg.phase = 'fini'; }
      } else {
        SON.rate(); b.classList.add('faux'); setTimeout(() => b.classList.remove('faux'), 300);
        p.patience -= 4; cfg.pos = 0; cfg.phase = 'montre'; cfg.minuteur = 0.9; cfg.montre = -1;
        $('pan-infos').textContent = t('soin.blocRate');
      }
    },
    key(e) {
      const m = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3, ArrowLeft: 0, ArrowUp: 1, ArrowRight: 2, ArrowDown: 3 };

    b.setAttribute('aria-label', t('outil.' + i));
    const oc = document.createElement('canvas'); oc.width = 120; oc.height = 120; dessinerOutil(oc.getContext('2d'), i, 120);
    b.appendChild(oc); b.addEventListener('click', () => { initAudio(); cfg.appui(i); });
    $('pan-boutons').appendChild(b); cfg.boutons.push(b);

/* ---------------------------------------------------------------------------
   Rendu du monde
   --------------------------------------------------------------------------- */
function dessiner(tm) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#07060f'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!G) return;
  const j = G.j;
  const vise = j.cache ? P(j.cache.u[0] + 0.5, j.cache.u[1] + 0.5) : P(j.x, j.y);
  G.cam[0] += (vise[0] - G.cam[0]) * 0.12; G.cam[1] += (vise[1] - 30 - G.cam[1]) * 0.12;
  let tx = 0, ty = 0;
  if (G.tremble > 0) { tx = hasard(-1, 1) * G.tremble * 12; ty = hasard(-1, 1) * G.tremble * 12; }
  const Z = ZOOM;
  ctx.setTransform(DPR * Z, 0, 0, DPR * Z, DPR * (LW / 2 - G.cam[0] * Z + tx), DPR * (LH * 0.47 - G.cam[1] * Z + ty));

  // sol
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    const k = PLAN[y][x];
    if (k === '#') continue;
    const sa = SALLES[k];
    losange(ctx, x, y, (x + y) % 2 ? sa.sol : sa.sol2);
    if (k === 'o' && y === 18) losange(ctx, x, y, (x % 3) ? '#15161d' : '#1f2029', 0.04);
  }
  // emblèmes au sol (repère de chaque salle)
  Object.keys(SALLES).forEach((k) => {
    const sa = SALLES[k]; if (!sa.emb) return;
    const [ex, ey] = P(sa.cx, sa.cy);
    ctx.save(); ctx.globalAlpha = 0.28; ctx.translate(ex, ey); ctx.scale(1, 0.5); icone(ctx, sa.emb, 0, 0, 22, '#9fd3ff'); ctx.restore();
  });
  // tapis de l'accueil et chaises
  for (let x = 9; x <= 11; x++) losange(ctx, x, 15, '#463a6e', 0.08);
  // grilles d'aération
  G.vents.forEach((v) => {
    const sh = v.etat === 'tremble' ? hasard(-1.5, 1.5) : 0;
    ctx.save(); ctx.translate(sh, 0);
    losange(ctx, v.x, v.y, v.etat === 'casse' ? '#050308' : '#3d4152', 0.18);
    if (v.etat !== 'casse') {
      ctx.strokeStyle = v.etat === 'scelle' ? '#5be0b4' : '#22242e'; ctx.lineWidth = 2;
      for (let i = 1; i < 4; i++) { const a = P(v.x + 0.18 + i * 0.16, v.y + 0.18), b = P(v.x + 0.18 + i * 0.16, v.y + 0.82); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
    }
    if (v.etat === 'tremble') { const [cx, cy] = P(v.x + 0.5, v.y + 0.5); ctx.globalAlpha = 0.4 + 0.3 * Math.sin(tm * 10); ellipse(ctx, cx, cy, 26, 13, '#ff2a35'); }
    ctx.restore();
  });
  // ombre portée sur le sol du dehors devant la porte quand les rideaux sont fermés
  // liste des choses à trier en profondeur
  const liste = [];
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) if (PLAN[y][x] === '#') liste.push({ p: x + y + 1, d: () => dessinerMur(x, y) });
  liste.push({ p: PORTE.x + PORTE.y + 1.02, d: () => dessinerPorte(tm) });
  obstacles.forEach((o) => { const [x, y] = o.t; liste.push({ p: x + y + 1, d: () => dessinerObjet(o, tm) }); });
  SIEGES.forEach(([x, y]) => liste.push({ p: x + y + 0.6, d: () => { boite(ctx, x + 0.18, y + 0.5, x + 0.82, y + 0.85, 10, '#6c5aa8'); boite(ctx, x + 0.18, y + 0.2, x + 0.82, y + 0.36, 26, '#5d4c96'); } }));
  G.patients.forEach((p) => liste.push({ p: p.x + p.y + (p.etat === 'table' ? 0.2 : 0), d: () => dessinerPatient(p, tm) }));
  G.rodeurs.forEach((r) => liste.push({ p: r.x + r.y, d: () => { const [sx, sy] = P(r.x, r.y); ctx.save(); ctx.translate(sx, sy); if (r.apparition > 0) ctx.globalAlpha = 1 - r.apparition; if (r.etat === 'fuite') ctx.globalAlpha = 0.6; dessinerRodeur(ctx, 0.36, r.ph, r.etat === 'chasse', r.flip); ctx.restore(); } }));
  G.cogneurs.forEach((c) => liste.push({ p: c.x + c.y, d: () => { const [sx, sy] = P(c.x, c.y); ctx.save(); ctx.translate(sx, sy); dessinerCogneur(ctx, 0.42, c.ph, c.flip); ctx.restore(); } }));
  if (!j.cache) liste.push({ p: j.x + j.y + 0.01, d: () => { const [sx, sy] = P(j.x, j.y); ctx.save(); ctx.translate(sx, sy); dessinerJoueur(ctx, 0.42, j.pas, j.flip, G.panne); if (j.flacon !== null) { icone(ctx, 'flacon', j.flip ? -10 : 10, -24, 8, COULEURS[j.flacon].c); } ctx.restore(); } });
  liste.sort((a, b) => a.p - b.p);
  liste.forEach((e) => e.d());

  // bulles au-dessus des patients
  G.patients.forEach((p) => dessinerBulle(p, tm));
  // particules
  G.parts.forEach((q) => {
    const [sx, sy] = P(q.x, q.y, q.z); const a = borne(q.vie / q.max, 0, 1);
    ctx.globalAlpha = a;
    if (q.sorte === 'score') { dessinerScoreFlottant(sx, sy, q.valeur); }
    else if (q.sorte === 'coeur') icone(ctx, 'coeur', sx, sy, 6, q.coul);
    else rond(ctx, sx, sy, 3, q.coul);
    ctx.globalAlpha = 1;
  });
  // repères : réparation, alertes, aide
  if (G.repar) {
    const [sx, sy] = P(j.x, j.y, 70);
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(sx, sy, 14, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#ffd479'; ctx.beginPath(); ctx.arc(sx, sy, 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * G.repar.t / G.repar.duree); ctx.stroke();
  }
  const reperes = reperesUrgents();
  reperes.forEach((r) => { const [sx, sy] = P(r.x, r.y, 64 + Math.sin(tm * 6) * 5); icone(ctx, 'alerte', sx, sy, 12); });
  const aide = cibleAide();
  if (aide) { const [sx, sy] = P(aide.x, aide.y, aide.z + Math.abs(Math.sin(tm * 4)) * 10); icone(ctx, 'fleche', sx, sy, 11); }

  // lumière : nuit, panne, présence des monstres
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const [jx, jy] = versEcran(j.cache ? j.cache.u[0] + 0.5 : j.x, j.cache ? j.cache.u[1] + 0.5 : j.y);
  dessinerLumiere(jx, jy - 20, tm);
  // flèches au bord de l'écran vers les alertes hors champ
  reperes.forEach((r) => flecheBord(r, tm));
  if (aide && !G.panne) flecheBord(aide, tm, '#5be0b4');
  if (G.flashRouge > 0) { ctx.fillStyle = 'rgba(200,0,20,' + G.flashRouge * 0.5 + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
  if (G.flashBlanc > 0) { ctx.fillStyle = 'rgba(200,180,255,' + G.flashBlanc * 0.7 + ')'; ctx.fillRect(0, 0, cv.width, cv.height); }
  dessinerMini(tm);
}
function versEcran(x, y, z) {
  const [sx, sy] = P(x, y, z);
  return [(LW / 2 + (sx - G.cam[0]) * ZOOM), (LH * 0.47 + (sy - G.cam[1]) * ZOOM)];
}
function dessinerScoreFlottant(sx, sy, v) {
  // le score s'écrit avec des petites étoiles (aucun chiffre dans le dessin)
  const n = borne(Math.round(v / 40), 1, 4);
  for (let i = 0; i < n; i++) icone(ctx, 'etoile', sx + (i - (n - 1) / 2) * 12, sy, 6);
}
function dessinerMur(x, y) {
  let h = 16, coul = '#4a4470';
  if (y === 0 || x === 0) { h = 46; coul = '#3d375e'; }
  if (y === 16) { h = 22; coul = '#4e4878'; }
  // la façade est à moitié transparente : on voit le patient au comptoir derrière
  if (y === 16) ctx.globalAlpha = 0.5;
  boite(ctx, x, y, x + 1, y + 1, h, coul);
  ctx.globalAlpha = 1;
  if (y === 16 && x >= 6 && x <= 14 && x !== PORTE.x) {
    // vitres de la façade
    const a = P(x + 0.1, y + 1, 4), b = P(x + 0.9, y + 1, 4), c = P(x + 0.9, y + 1, 21), d = P(x + 0.1, y + 1, 21);
    poly(ctx, [a, b, c, d], 'rgba(140,190,255,.25)');
    rideauSur(x, y + 1, G.rideaux.anim);
  }
  if ((y === 0 || x === 0) && h === 46 && (x + y) % 4 === 1) {
    // petites lampes murales
    const [lx, ly] = y === 0 ? P(x + 0.5, y + 1, 36) : P(x + 1, y + 0.5, 36);
    rond(ctx, lx, ly, 3, G.panne ? '#4a1015' : '#fff2c4');
  }
}
function rideauSur(x, y, anim) {
  if (anim <= 0.01) return;
  const hh = 22 * anim;
  const a = P(x + 0.05, y, 24), b = P(x + 0.95, y, 24), c = P(x + 0.95, y, 24 - hh), d = P(x + 0.05, y, 24 - hh);
  poly(ctx, [a, b, c, d], '#7a1f2c');
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { const p0 = P(x + i * 0.25, y, 24), p1 = P(x + i * 0.25, y, 24 - hh); ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke(); }
}
function dessinerPorte(tm) {
  const x = PORTE.x, y = PORTE.y;
  // cadre de la porte

    case 'radio': {

    case 'pharma': {

/* ---------------------------------------------------------------------------
   Boucle principale
   --------------------------------------------------------------------------- */
let dernier = performance.now(), cadence = 0;
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - dernier) / 1000); dernier = maintenant;
  const tm = maintenant / 1000;
  if (G && enPartie && !pause && !G.fini && $('ecran-nouveau').hidden) maj(dt);
  if (G) {
    dessiner(tm);
    if (panneau && panneau.dessin) { pctx.setTransform(DPR, 0, 0, DPR, 0, 0); panneau.dessin(pctx, panneau.w, panneau.h, tm); }
    cadence += dt;
    if (cadence > 0.15) { cadence = 0; majHud(); if (!panneau) majAction(); }
  } else if (!$('ecran-titre').hidden) { titreT += dt; dessinerTitre(); }
  if (peur) dessinerPeur(dt); else dessinerConfettis(dt);
  dessinerDemo(dt);
  requestAnimationFrame(boucle);
}
