      const sd = O.sens(ch);
      if (sd >= 0) {
        // courant : chevrons qui avancent
        c.save(); c.translate(x + s / 2, y + s / 2); c.rotate(sd * Math.PI / 2);
        c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = s * 0.06; c.lineCap = 'round';
        const dec = ((t / 900) % 1) * s * 0.3;
        for (let k = -1; k <= 1; k++) {

      c.strokeStyle = opt.mode === 'etoile' ? 'rgba(255,225,77,' + (0.6 + 0.4 * p).toFixed(2) + ')' : 'rgba(255,255,255,' + (0.55 + 0.45 * p).toFixed(2) + ')';
      c.lineWidth = Math.max(2, s * 0.05);
      opt.possibles.forEach((i) => { const x = g.ox + (i % e.W) * s, y = g.oy + Math.floor(i / e.W) * s; rr(c, x + 4, y + 4, s - 8, s - 8, s * 0.12); c.stroke(); });
      c.restore();

    for (let i = 0; i < e.W * e.H; i++) {

      const p = centreCase(e, g, i), k0 = an.etoiles[i];

    }

    for (let i = 0; i < e.W * e.H; i++) {
      if (e.k[i] < 0) continue;
      let x = g.ox + (i % e.W) * s, y = g.oy + Math.floor(i / e.W) * s;
      const gl = an.glisse[i];
      if (gl && t < gl.t0 + 500) {
        const k = Math.max(0, Math.min(1, (t - gl.t0) / 500)), ke = k * k * (3 - 2 * k);

      if (p0 && t - p0 < 420) { const k = (t - p0) / 420; z = 1 + 0.25 * Math.sin(k * Math.PI) * (1 - k); }

      let sombre = 0;
      if (e.nuit && e.k[i] !== 3 && !opt.nuitVisible) {

        if (p0 && t - p0 < 2600) sombre = 0.72 * Math.max(0, (t - p0 - 1200) / 1400);
      }
      c.save();
      if (e.nuit && e.k[i] === 3) { c.shadowColor = teinte(e.q[i * 4], 0); c.shadowBlur = s * (0.3 + 0.15 * Math.sin(t / 400 + i)); }

      const q = +qk, i = q >> 2, d = q & 3, x = g.ox + (i % e.W) * s, y = g.oy + Math.floor(i / e.W) * s;
      c.save(); rr(c, x + 1, y + 1, s - 2, s - 2, s * 0.14); c.clip();
      quartChemin(c, x, y, s, d);
      c.fillStyle = 'rgba(255,255,230,' + (0.7 * (1 - k)).toFixed(2) + ')'; c.fill();
      c.restore();
    }
    // fantôme de la tuile à poser, et aperçu des taches qu'elle fermerait
    if (opt.fantome) {
      const f = opt.fantome, x = g.ox + (f.c % e.W) * s, y = g.oy + Math.floor(f.c / e.W) * s;
      const q = [0, 1, 2, 3].map((d) => O.couleur(f.tuile, f.r, d));
      const rot = an.rot && t - an.rot.t0 < 200 ? (1 - (t - an.rot.t0) / 200) * -Math.PI / 2 : 0;
      c.save(); c.globalAlpha = 0.88;
      c.translate(x + s / 2, y + s / 2); c.rotate(rot); c.translate(-x - s / 2, -y - s / 2);
      dessinerTuile(c, x + 2, y + 2, s - 4, f.tuile[0], q, { brille: true });
      c.restore();
      if (opt.apercu && opt.apercu.length) {
        const p = 0.5 + 0.5 * Math.sin(t / 180);
        c.save();
        opt.apercu.forEach((qq) => {
          const i = qq >> 2, d = qq & 3, xx = g.ox + (i % e.W) * s, yy = g.oy + Math.floor(i / e.W) * s;
          c.save(); rr(c, xx + 1, yy + 1, s - 2, s - 2, s * 0.14); c.clip();
          quartChemin(c, xx, yy, s, d); c.fillStyle = 'rgba(255,255,200,' + (0.25 + 0.3 * p).toFixed(2) + ')'; c.fill();
          c.restore();
        });
        c.restore();
      }
      // contour pointillé jaune : la tuile n'est pas encore posée
      c.save(); c.setLineDash([s * 0.1, s * 0.07]); c.lineDashOffset = -t / 30;
      c.strokeStyle = '#ffe14d'; c.lineWidth = 4; rr(c, x + 2, y + 2, s - 4, s - 4, s * 0.14); c.stroke();
      c.restore();
    }
    if (opt.curseur >= 0) {
      const x = g.ox + (opt.curseur % e.W) * s, y = g.oy + Math.floor(opt.curseur / e.W) * s;
      c.strokeStyle = '#ffe14d'; c.lineWidth = 4; rr(c, x + 2, y + 2, s - 4, s - 4, s * 0.14); c.stroke();
    }
    // poissons installés dans leur tache
    e.fi.forEach((f, n) => {
      const nait = an.naissances[n];
      if (nait && t < nait) return;
      const p = centreCase(e, g, f[3]);
      const tier = f[1] < 12 ? f[1] % 3 : 1;
      const k = s * [0.5, 0.62, 0.8, 0.62][f[1] < 12 ? tier : 3];
      const ph = n * 1.7, vx = Math.cos(t / 1400 + ph);
      const x = p[0] + Math.sin(t / 1400 + ph) * s * 0.28, y = p[1] + Math.sin(t / 900 + ph * 2) * s * 0.14;
      let z = 1;
      if (nait && t - nait < 450) z = 0.3 + 0.7 * ((t - nait) / 450);
      c.save(); c.globalAlpha = e.nuit && !opt.nuitVisible ? 0.9 : 1;
      c.fillStyle = COUL[f[0]]; c.globalAlpha *= 0.35; ell(c, x, y + k * 0.32, k * 0.38 * z, k * 0.08 * z); c.fill();
      c.restore();
      poisson(c, x, y, k * z, f[1], vx >= 0 ? 1 : -1, t + n * 200);
    });
  }

  function nouvellesAnims() { return { poses: {}, fermes: {}, glisse: {}, etoiles: {}, naissances: {}, vols: [], rot: null }; }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let sel = -1, rot = 0, modeEtoile = false, clavier = false;
  let dernierAttends = 0;
  let anims = nouvellesAnims();
  let apercuCache = { cle: '', quarts: [] };
  let secousse = 0;
  const particules = [];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'album', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'titre' ? 'block' : 'none';
    if (nom === 'titre') { dessinerTitre(); majTitre(); }
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    const voile = salonOuvert() || $('voile-fin').classList.contains('actif');
    el.classList.toggle('haut', voile);
    // en partie : sur la barre du bas, pour ne jamais cacher le plateau
    el.classList.toggle('jeu', !voile && ecran === 'jeu');
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 4 places, en haut de l'écran, et dans le salon d'attente.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'avatar'; cv.width = 96; cv.height = 96;
      medaillon(cv.getContext('2d'), s, 48, 48, 46);
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const moi = () => (partie ? partie.siege : -1);
  const monTour = () => !!(partie && vue && partie.phase === 'jeu' && !attenteTuto && !enPause && partie.monTour());

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0, nf = e ? e.nf[s] : 0;
      const zone = d.querySelector('.pts');
      const texte = nb(pts) + '|' + nf;
      if (zone.dataset.v !== texte) {
        zone.dataset.v = texte;
        zone.textContent = nb(pts);
        const sm = document.createElement('small'); sm.textContent = tr('place.poissons', { n: nf }); zone.appendChild(sm);
      }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { animal: tr('animal.' + s), points: pts, poissons: nf }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return modeEtoile ? tr('tour.etoile') : (sel >= 0 ? tr('tour.tourne') : tr('tour.toi'));
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    const lagon = vue ? tr('lagon.' + NIVEAUX[vue.n].l) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length }) + ' · ' + lagon;
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + (lagon ? ' · ' + lagon : '');
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Bulles des poissons exigeants.
  function majExigeants() {
    const boite = $('exigeants');
    const ex = vue ? vue.ex : [];
    const cle = JSON.stringify(ex);
    if (boite.dataset.cle === cle) return;
    boite.dataset.cle = cle;
    boite.textContent = '';
    ex.forEach((x) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'exi' + (x[2] >= 0 ? ' pris' : '');
      if (x[2] >= 0) b.style.setProperty('--c', COUL[x[2]]);
      const cv = document.createElement('canvas'); cv.width = 100; cv.height = 68;
      const c = cv.getContext('2d');
      poisson(c, 52, 34, 62, 12 + O.PAIRES.findIndex((p) => p[0] === Math.min(x[0], x[1]) && p[1] === Math.max(x[0], x[1])), 1, 0);
      b.appendChild(cv);
      const vars = { a: tr('couleur.' + x[0]), b: tr('couleur.' + x[1]) };
      if (x[2] >= 0) { const co = document.createElement('span'); co.className = 'coche'; co.textContent = '✓'; b.appendChild(co); }
      b.setAttribute('aria-label', x[2] >= 0 ? tr('exigeant.pris', { a: vars.a, b: vars.b, animal: tr('animal.' + x[2]) }) : tr('exigeant.aria', vars));
      b.addEventListener('click', () => { audio(); sons.clic(); toast(tr('exigeant.explique', vars), 3600); });
      boite.appendChild(b);
    });
  }

  // Bas de l'écran : tuile du dessus, tourner, poser, étoile de mer.
  function majBas() {
    const e = vue, cv = $('apercu'), c = cv.getContext('2d');
    c.clearRect(0, 0, 140, 140);
    const tuile = e && e.pile[e.ip];
    const mien = monTour();
    if (tuile) {
      const r = mien ? rot : 0;
      dessinerTuile(c, 10, 10, 120, tuile[0], [0, 1, 2, 3].map((d) => O.couleur(tuile, r, d)), {});
    }
    const reste = e ? Math.max(0, e.pile.length - e.ip) : 0;
    const p = tr('pioche', { n: reste });
    if ($('pioche').textContent !== nb(reste)) $('pioche').textContent = nb(reste);
    $('apercu-boite').setAttribute('aria-label', p);
    $('apercu-boite').setAttribute('role', 'img');
    $('btn-tourner').disabled = !mien || !tuile;
    $('btn-poser').disabled = !mien || sel < 0;
    const L = e ? NIVEAUX[e.n] : null, m = moi();
    const montre = !!(L && L.et);
    $('btn-etoile').style.display = montre ? '' : 'none';
    const reste2 = e && m >= 0 ? e.et[m] : 0;
    $('etoile-nb').textContent = nb(reste2);
    $('btn-etoile').disabled = !mien || reste2 <= 0;
    $('btn-etoile').classList.toggle('actif', modeEtoile);
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majExigeants();
    majBas();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // Cases où le joueur de l'appareil peut agir (tuile ou étoile de mer).
  function casesPossibles() {
    if (!monTour()) return [];
    const e = vue, m = moi();
    if (modeEtoile) {
      const l = [];
      for (let i = 0; i < e.W * e.H; i++) if (e.k[i] < 0 && O.jouable(e, i) && e.res[i] < 0) l.push(i);
      return l;
    }
    return O.possibles(e, m);
  }

  // Quarts qui seraient fermés si la tuile était posée là (aide, pas la nuit).
  function quartsApercu(c, r) {
    const e = vue, tuile = e.pile[e.ip];
    const cle = c + '|' + r + '|' + e.ip + '|' + e.coups + '|' + e.fi.length;
    if (apercuCache.cle === cle) return apercuCache.quarts;
    const tmp = { W: e.W, H: e.H, g: e.g, k: e.k.slice(), q: e.q.slice(), o: e.o.slice(), pz: e.pz.slice(), res: e.res.slice(), nuit: e.nuit };
    O.poser(tmp, c, tuile, r, moi());
    const l = O.fermees(tmp, [c]), quarts = [];
    l.forEach((z) => z.qs.forEach((q) => quarts.push(q)));
    apercuCache = { cle: cle, quarts: e.nuit ? [] : quarts };
    return apercuCache.quarts;
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    if (secousse > 0) { secousse = Math.max(0, secousse - dt); c.translate(Math.sin(t / 25) * secousse * 14, 0); }
    geo = geometrie(vue, w, h, Math.max(8, Math.min(w, h) * 0.025));
    const poss = casesPossibles();
    let fantome = null, apercu = null;
    if (monTour() && !modeEtoile && sel >= 0 && poss.indexOf(sel) >= 0 && vue.pile[vue.ip]) {
      fantome = { c: sel, r: rot, tuile: vue.pile[vue.ip] };
      apercu = quartsApercu(sel, rot);
    }
    dessinerPlateau(c, vue, geo, {
      t: t, anims: anims, possibles: poss, mode: modeEtoile ? 'etoile' : 'tuile', fantome: fantome, apercu: apercu,
      curseur: clavier && monTour() && (!fantome) ? sel : -1
    });
    // points qui s'envolent vers la carte du joueur
    for (let i = anims.vols.length - 1; i >= 0; i--) {
      const v = anims.vols[i], k = (t - v.t0) / v.dur;
      if (k < 0) continue;
      if (k >= 1) {
        anims.vols.splice(i, 1);
        const carte = $('place-' + v.qui);
        if (carte) { carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }
        continue;
      }
      const ke = 1 - Math.pow(1 - k, 2);
      const x = v.x0 + (v.x1 - v.x0) * ke, y = v.y0 + (v.y1 - v.y0) * ke - Math.sin(k * Math.PI) * 40;
      c.save();
      c.font = '900 ' + Math.round(18 + 6 * Math.sin(k * Math.PI)) + 'px system-ui, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 4; c.strokeStyle = '#0b2c48'; c.fillStyle = COUL_T[v.qui];
      c.strokeText(v.texte, x, y); c.fillText(v.texte, x, y);
      c.restore();
    }
    // bulles
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt + Math.sin(t / 200 + i) * 0.3; p.y += p.vy * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.etoile) { c.fillStyle = p.coul; etincelle(c, p.x, p.y, p.k); }
      else { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1.5; rond(c, p.x, p.y, p.k); c.stroke(); }
      c.globalAlpha = 1;
    }
  }

  function etincelle(c, x, y, k) {
    c.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? k * 0.35 : k; c.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
    c.closePath(); c.fill();
  }

  function bulles(i, nbB, etoiles) {
    if (!vue || !geo) return;
    const p = centreCase(vue, geo, i);
    for (let k = 0; k < (nbB || 8); k++) {
      particules.push({ x: p[0] + (Math.random() - 0.5) * geo.s * 0.6, y: p[1] + (Math.random() - 0.5) * geo.s * 0.4, vx: (Math.random() - 0.5) * 30, vy: -40 - Math.random() * 80, vie: 0.8 + Math.random() * 0.6, k: etoiles ? geo.s * 0.1 : 2 + Math.random() * 5, etoile: !!etoiles && k % 2 === 0, coul: '#fff7b0' });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function changerLagon() {
    const l = vue ? NIVEAUX[vue.n].l : 0;
    const j = $('ecran-jeu');
    [0, 1, 2, 3].forEach((k) => j.classList.toggle('lagon-' + k, k === l));
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    anims = nouvellesAnims();
    reinitChoix();
    changerLagon();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');

  // Étoiles : 1 pour la 1re place, 2 avec au moins un tiers des poissons, 3 avec la moitié.
  function etoilesPour(mesPoissons, tousPoissons, gagne) {
    if (!gagne) return 0;
    const p = tousPoissons ? mesPoissons / tousPoissons : 0;
    return p >= 0.5 ? 3 : p >= 1 / 3 ? 2 : 1;
  }

  function remplirClassement(e, m, sieges, boite) {
    boite.textContent = '';

    ordre.forEach((s, k) => {

      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === m ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('animal.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);

      l.append(r, cv, qui, n);

  // Confettis de victoire : bulles et petits poissons de couleur.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 70; i++) bouts.push({ x: Math.random() * w, y: h + 20 + Math.random() * h * 0.4, vx: (Math.random() - 0.5) * 50, vy: -(140 + Math.random() * 200), r: Math.random() * 6, coul: COR[i % 4][0], k: 6 + Math.random() * 8, bulle: i % 3 === 0 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin(t / 300 + b.r) * 0.6; b.y += b.vy * dt; b.r += dt * 3;
        if (b.bulle) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 2; rond(c, b.x, b.y, b.k); c.stroke(); }
        else { c.save(); c.translate(b.x, b.y); c.rotate(Math.sin(b.r) * 0.4); c.fillStyle = b.coul; ell(c, 0, 0, b.k, b.k * 0.55); c.fill(); c.beginPath(); c.moveTo(-b.k * 0.8, 0); c.lineTo(-b.k * 1.5, -b.k * 0.5); c.lineTo(-b.k * 1.5, b.k * 0.5); c.closePath(); c.fill(); c.restore(); }
      });
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

    gc.textContent = '';
    const exemples = [[0, -1, -1, -1, -1], [1, 0, 0, 2, 2], [2, 1, 1, 1, 3], [3, 2, 2, 2, 2], [4, 3, 0, 3, 0], [5, 0, 0, 1, 2]];
    exemples.forEach((t, k) => {
      const ouvert = prog.debloque >= CORAIL_NIVEAU[k];
      const f = document.createElement('div'); f.className = 'fiche corail' + (ouvert ? '' : ' vide');
      const cv = document.createElement('canvas'); cv.width = 116; cv.height = 116;
      const c = cv.getContext('2d');
      dessinerTuile(c, 8, 8, 100, t[0], t.slice(1), { sombre: ouvert ? 0 : 0.7 });
      const nom = document.createElement('span'); nom.textContent = ouvert ? tr('corail.' + k) : tr('album.corailFerme', { n: CORAIL_NIVEAU[k] });
      f.append(cv, nom);
      gc.appendChild(f);
    });
    $('album-total').textContent = tr('album.total', { n: prog.album.length, max: ESPECES });
    afficherEcran('album');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : mini-lagon, main qui montre le geste
  // ---------------------------------------------------------------------

  // Tuiles : [corail, haut, droite, bas, gauche] ; couleurs 0 rose, 1 orange.
  // Trois tuiles d'une tache rose en anneau (cases 1, 2 et 4 d'un lagon 3 × 2) et une anémone orange.
  const ANNEAU = [[0, [3, 1, 1, 1, 1]], [1, [1, 1, 0, 0, 1]], [2, [1, 1, 1, 0, 0]], [4, [1, 0, 0, 1, 1]]];
  const TUTOS = {
    base: { g: ['S..'], deja: [], etapes: [{ c: 1, t: [2, 0, 0, 0, 1], tours: 1 }, { c: 2, t: [1, 1, 1, 0, 0], tours: 2 }] },
    zone: { g: ['...', '...'], deja: ANNEAU, etapes: [{ c: 5, t: [1, 1, 1, 0, 0], tours: 1 }] },
    rocher: { g: ['...', '...'], deja: ANNEAU, etapes: [{ c: 5, t: [0, -1, -1, -1, -1], tours: 0 }] },
    exigeant: { g: ['...', '...'], deja: ANNEAU, ex: [[0, 1]], etapes: [{ c: 5, t: [1, 1, 1, 0, 0], tours: 1 }] },
    courant: { g: ['S..', '>..'], deja: [[1, [1, 1, 0, 0, 1]], [2, [1, 1, 1, 0, 0]], [5, [1, 0, 1, 1, 0]]], etapes: [{ c: 3, t: [1, 0, 0, 1, 1], tours: 0, courant: true }] },
    eventail: { g: ['S..'], deja: [], etapes: [{ c: 1, t: [4, 0, 1, 0, 1], tours: 1 }, { c: 2, t: [4, 1, 0, 1, 0], tours: 0 }] },
    epave: { g: ['x.', '..'], deja: [[1, [1, 1, 1, 0, 0]], [2, [1, 0, 0, 1, 1]]], etapes: [{ c: 3, t: [1, 0, 1, 1, 0], tours: 0 }] },
    etoile: { g: ['S...'], deja: [[1, [2, 0, 0, 1, 0]]], etoile: 3, etapes: [{ e: 3 }, { c: 2, t: [1, 0, 0, 1, 1], tours: 3 }] },
    bouquet: { g: ['S..'], deja: [], etapes: [{ c: 1, t: [5, 0, 0, 1, 2], tours: 1 }] },
    nuit: { g: ['...', '...'], nuit: 1, deja: ANNEAU, etapes: [{ c: 5, t: [3, 0, 0, 0, 0], tours: 0 }] }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const base = () => {
      const e = O.preparer({ g: d.g, ex: d.ex, nuit: d.nuit, nc: 2 });
      e.n = d.nuit ? 15 : 0;
      e.sc = [0, 0, 0, 0]; e.nf = [0, 0, 0, 0]; e.et = [1, 1, 1, 1];
      d.deja.forEach((p) => O.poser(e, p[0], p[1], 0, -1));
      return e;
    };
    let e = base(), an = nouvellesAnims(), fantome = null, debut = 0, evs = [], main0 = { x: 520, y: 340, tx: 520, ty: 340, appui: -1e9 };
    const j = ++tutoAnim;
    const g = geometrie(e, 560, 360, 46);
    const centre = (i) => centreCase(e, g, i);
    function programmer() {
      evs = [];
      let t = 500;
      d.etapes.forEach((st) => {
        const cell = st.e !== undefined ? st.e : st.c;
        evs.push({ t: t, f: () => { const p = centre(cell); main0.tx = p[0]; main0.ty = p[1]; } });
        t += 800;
        if (st.e !== undefined) {
          evs.push({ t: t, f: (now) => { main0.appui = now; e.res[st.e] = 0; an.etoiles[st.e] = now; } });
          t += 1000;
          return;
        }
        evs.push({ t: t, f: (now) => { main0.appui = now; fantome = { c: st.c, r: 0, tuile: st.t }; } });
        t += 650;
        for (let k = 0; k < st.tours; k++) {
          evs.push({ t: t, f: (now) => { main0.appui = now; if (fantome) fantome.r = (fantome.r + 1) % 4; an.rot = { t0: now }; } });
          t += 650;
        }
        evs.push({ t: t, f: (now) => {
          const r = fantome ? fantome.r : 0;
          fantome = null;
          const avant = e.o.slice(), nf = e.fi.length;
          O.poser(e, st.c, st.t, r, 0);
          e.der = st.c;
          an.poses[st.c] = now;
          O.accueillir(e, [st.c], 0);
          e.o.forEach((q, i) => { if (avant[i] < 0 && q >= 0) an.fermes[i] = now; });
          for (let n = nf; n < e.fi.length; n++) an.naissances[n] = now + 300;
          main0.tx = 520; main0.ty = 340;
        } });
        t += 1000;
        if (st.courant) {
          evs.push({ t: t, f: (now) => {
            const avant = e.o.slice(), nf = e.fi.length;
            e.dm = [];
            O.courants(e);
            e.dm.forEach((m) => { an.glisse[m[1]] = { de: m[0], t0: now }; });
            e.o.forEach((q, i) => { if (avant[i] < 0 && q >= 0) an.fermes[i] = now + 400; });
            for (let n = nf; n < e.fi.length; n++) an.naissances[n] = now + 600;
          } });
          t += 1400;
        }
      });
      evs.push({ t: t + 1800, f: () => { e = base(); an = nouvellesAnims(); fantome = null; debut = 0; programmer(); } });
    }
    programmer();
    let tutoAnimId = 0;
    function image(now) {
      if (j !== tutoAnim) return;
      if (!debut) debut = now;
      const ecoule = now - debut;
      while (evs.length && evs[0].t <= ecoule) evs.shift().f(now);
      main0.x += (main0.tx - main0.x) * 0.12; main0.y += (main0.ty - main0.y) * 0.12;
      c.setTransform(1, 0, 0, 1, 0, 0);
      fondLagon(c, 560, 360, d.nuit ? 3 : 0, now);
      dessinerPlateau(c, e, g, { t: now, anims: an, possibles: [], fantome: fantome, curseur: -1 });
      const ap = Math.max(0, 1 - (now - main0.appui) / 300);
      main(c, main0.x, main0.y, 1.5, ap);
      tutoAnimId = requestAnimationFrame(image);
    }
    tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const col = Math.floor((px - geo.ox) / geo.s), row = Math.floor((py - geo.oy) / geo.s);
    if (col < 0 || row < 0 || col >= vue.W || row >= vue.H) return -1;
    return row * vue.W + col;
  }

  function attends() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  // Toucher une case : choisir la case, ou tourner la tuile si c'est la même.
  function toucherCase(i) {
    if (!partie || enPause || attenteTuto || i < 0) return;
    if (!monTour()) { attends(); return; }
    const poss = casesPossibles();
    if (modeEtoile) {
      if (poss.indexOf(i) >= 0) { partie.jouer({ e: i }); modeEtoile = false; }
      else { sons.non(); toast(tr('etoile.ici'), 1600); }
      majInterface();
      return;
    }
    if (poss.indexOf(i) < 0) { sons.non(); toast(tr(vue.res[i] >= 0 && vue.k[i] < 0 ? 'case.reservee' : 'case.non'), 1600); return; }
    if (i === sel) tourner();
    else { sel = i; sons.clic(); majInterface(); }
  }

  function tourner() {
    if (!monTour() || !vue.pile[vue.ip]) return;
    rot = (rot + 1) % 4;
    anims.rot = { t0: performance.now() };
    sons.tourne();
    majInterface();
  }

  function poserTuile() {
    if (!monTour()) { attends(); return; }
    if (sel < 0 || casesPossibles().indexOf(sel) < 0) { sons.non(); toast(tr('case.choisis'), 1600); return; }
    if (partie.jouer({ c: sel, r: rot })) { modeEtoile = false; }
    majInterface();
  }

  function basculerEtoile() {
    if (!monTour()) { attends(); return; }
    const m = moi();
    if (!vue.et[m]) { sons.non(); return; }
    modeEtoile = !modeEtoile;
    sons.clic();
    if (modeEtoile) toast(tr('tour.etoile'), 1800);
    majInterface();
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', () => { audio(); clavier = false; });
  plateau.addEventListener('pointerup', (ev) => { const p = point(ev); toucherCase(caseSous(p[0], p[1])); });

  // Déplacement du curseur au clavier : case voisine (on saute les cases hors du lagon).
  function deplacer(dx, dy) {
    if (!vue) return;
    if (sel < 0) {
      const poss = casesPossibles();
      sel = poss.length ? poss[Math.floor(poss.length / 2)] : Math.floor(vue.W * vue.H / 2);
      sons.clic(); majInterface(); return;
    }
    let c = sel % vue.W, r = Math.floor(sel / vue.W);
    for (let k = 0; k < Math.max(vue.W, vue.H); k++) {
      c += dx; r += dy;
      if (c < 0 || r < 0 || c >= vue.W || r >= vue.H) return;
      const i = r * vue.W + c;
      if (vue.g.charAt(i) !== ' ') { sel = i; sons.clic(); majInterface(); return; }
    }
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio(); clavier = true;
      deplacer(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'KeyR' || ev.code === 'Space') {
      if (ev.code === 'Space' && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio(); tourner();
    } else if (ev.code === 'KeyE') {
      ev.preventDefault(); audio(); basculerEtoile();
    } else if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio(); clavier = true;
      if (modeEtoile) toucherCase(sel); else poserTuile();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-album').addEventListener('click', () => { audio(); sons.clic(); ouvrirAlbum(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('album-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-tourner').addEventListener('click', () => { audio(); tourner(); });
  $('btn-poser').addEventListener('click', () => { audio(); poserTuile(); });
  $('btn-etoile').addEventListener('click', () => { audio(); basculerEtoile(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });
  if (I18N.surChangement) I18N.surChangement(() => { majBoutonsSon(); if (ecran === 'jeu') majInterface(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
