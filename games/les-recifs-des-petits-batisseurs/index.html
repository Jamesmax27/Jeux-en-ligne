      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Qui joue la place s, en toutes lettres : « Toi », le pseudo, ou l'animal.
  function nomTour(s) {
    const info = siegesActuels()[s] || {};
    if (info.nom) return info.nom;
    return tr('qui.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && e.cur ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0, pf = e ? e.nf[s] : 0;
      const tp = nb(pts);
      if (d.querySelector('.pts').textContent !== tp) d.querySelector('.pts').textContent = tp;
      const tf = tr('place.poissons', { n: pf });
      if (d.querySelector('.pois').textContent !== tf) d.querySelector('.pois').textContent = tf;
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { animal: tr('animal.' + s), points: pts, poissons: pf }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || !e.cur) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (modeEtoile) return tr('etoile.choisis');
      if (sel) return tr('tour.poser');
      return legMoi.size ? tr('tour.toi') : tr('tour.toi');
    }
    const info = siegesActuels()[s] || {};
    return info.nom ? tr('tour.nom', { nom: info.nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, lagon: tr('lagon.' + NIVEAUX[niveau - 1].lg) });
    else if (partie && partie.manche > 0 && vue) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche, lagon: tr('lagon.' + NIVEAUX[vue.n].lg) });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Poissons exigeants, nuit et pioche, au-dessus du récif.
  let objCle = '';
  function majObjectifs() {
    const e = vue, boite = $('objectifs');
    const cle = e ? JSON.stringify([e.ex, e.nuit, e.n, I18N.getLang ? I18N.getLang() : '']) : '';
    if (cle === objCle) return;
    objCle = cle;
    boite.textContent = '';
    if (!e) return;
    (e.ex || []).forEach((x) => {
      const d = document.createElement('span');
      d.className = 'exi' + (x.s >= 0 ? ' pris' : '');
      const cv = document.createElement('canvas'); cv.width = 76; cv.height = 52;
      const c = cv.getContext('2d');
      poisson(c, 12, 30, 26, 20, 0, 1);
      c.fillStyle = CORAIL[x.a]; c.strokeStyle = '#fff'; c.lineWidth = 2; rond(c, 62, 15, 9); c.fill(); c.stroke();
      c.fillStyle = CORAIL[x.b]; rond(c, 62, 37, 9); c.fill(); c.stroke();
      const txt = document.createElement('span'); txt.className = 'qui';
      txt.textContent = x.s < 0 ? tr('exigeant.court') : (partie && x.s === partie.siege ? tr('exigeant.chezToi') : tr('exigeant.chez', { nom: nomTour(x.s) }));
      d.append(cv, txt);
      d.setAttribute('aria-label', tr('exigeant.aria', { a: tr('couleur.' + x.a), b: tr('couleur.' + x.b) }));
      d.title = tr('exigeant.aria', { a: tr('couleur.' + x.a), b: tr('couleur.' + x.b) });
      boite.appendChild(d);
    });
    if (e.nuit) {
      const d = document.createElement('span'); d.className = 'exi';
      d.textContent = tr('obj.nuit');
      boite.appendChild(d);
    }
  }

  function majMain() {
    const e = vue, moi = partie ? partie.siege : -1;
    const monTour = !!(partie && partie.monTour() && e && e.cur && !attenteTuto);
    const cv = $('tuile-main'), c = cv.getContext('2d');
    let tu = null;
    if (e && e.cur) {
      const r = monTour ? (sel ? sel.r : rotMain) : 0;
      tu = { k: e.cur.k, ed: O.tourner(e.cur.ed, r) };
    }
    const q = Math.min(1, (performance.now() - mainT0) / 200);
    dessinerMain(c, tu, cv.width, mainDe * (1 - q));
    let qui = '';
    if (e && e.cur && partie && partie.phase === 'jeu') {
      const s = R.aQui(e);
      qui = s === moi ? tr('main.toi') : tr('main.de', { nom: nomTour(s) });
    }
    if ($('main-qui').textContent !== qui) $('main-qui').textContent = qui;
    const pi = e ? tr('pioche', { n: e.pile }) : '';
    if ($('pioche').textContent !== pi) $('pioche').textContent = pi;
    $('btn-poser').disabled = !(monTour && sel && !modeEtoile);
    $('btn-tourner').disabled = !monTour;
    const etoiles = e && moi >= 0 ? e.st[moi] : 0;
    const avecEtoiles = !!(e && NIVEAUX[e.n].st);
    $('btn-etoile').hidden = !avecEtoiles;
    $('lib-etoile').hidden = !avecEtoiles;
    $('btn-etoile').querySelector('.nb').textContent = nb(etoiles);
    $('btn-etoile').disabled = !(monTour && etoiles > 0 && !e.su);
    $('btn-etoile').classList.toggle('actif', modeEtoile);
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majObjectifs();
    majMain();
  }

  // Cases permises pour ma tuile, et cases possibles pour une étoile de mer.
  function majLegales() {
    legMoi = new Map();
    caseEtoiles = new Set();
    const e = vue;
    if (!e || !partie || !e.cur || attenteTuto || partie.phase !== 'jeu' || !partie.monTour()) { sel = null; modeEtoile = false; return; }
    const moi = partie.siege, vus = {};
    for (let r = 0; r < 4; r++) {
      const rot = O.tourner(e.cur.ed, r), cle = rot.join(',');
      if (vus[cle]) continue;
      vus[cle] = true;
      for (let i = 0; i < e.W * e.H; i++) {
        if (O.peutPoser(e, i, rot, moi)) { if (!legMoi.has(i)) legMoi.set(i, []); legMoi.get(i).push(r); }
      }
    }
    if (e.st[moi] > 0 && !e.su) {
      for (let i = 0; i < e.W * e.H; i++) {
        if (!O.caseLibre(e, i, moi) || e.res[i] !== -1) continue;
        for (let d = 0; d < 4; d++) { const j = O.voisin(e, i, d); if (j >= 0 && e.p[j]) { caseEtoiles.add(i); break; } }
      }
    }
    if (sel && (!legMoi.has(sel.i) || legMoi.get(sel.i).indexOf(sel.r) < 0)) sel = null;
    if (modeEtoile && !caseEtoiles.size) modeEtoile = false;
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && e.cur && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    majMain();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const L = LAGONS[vue ? NIVEAUX[vue.n].lg : 0];
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, L.haut); g.addColorStop(1, L.bas);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // bulles du fond
    for (let i = 0; i < 8; i++) {
      const al = graineHasard(i * 7 + 3), x = al() * w, v = 15 + al() * 25, y = h - ((t / 1000 * v + al() * h) % h);
      c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1.2; rond(c, x, y, 2 + al() * 4); c.stroke();
    }
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, Math.max(8, Math.min(w, h) * 0.025));
    const moi = partie ? partie.siege : -1;
    const monTour = partie && partie.monTour() && !attenteTuto;
    let ghost = null;
    if (sel && vue.cur && monTour) ghost = { i: sel.i, ed: O.tourner(vue.cur.ed, sel.r), k: vue.cur.k, t0: sel.t0, de: sel.de };
    dessinerPlateau(c, vue, geo, {
      t: t, anims: anims, lagon: NIVEAUX[vue.n].lg,
      legales: monTour ? (modeEtoile ? caseEtoiles : new Set(legMoi.keys())) : null,
      sel: ghost, couleur: moi, curseur: clavier && monTour ? curseur : -1
    });
    // particules (bulles et étincelles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.bulle ? -60 : 300) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.bulle) { c.strokeStyle = '#ffffff'; c.lineWidth = 1.5; rond(c, p.x, p.y, p.k); c.stroke(); }
      else etincelle(c, p.x, p.y, p.k, p.coul);
      c.globalAlpha = 1;
    }
  }

  function jaillir(i, coul, bulles) {
    if (!vue || !geo) return;
    const x = geo.ox + (i % vue.W + 0.5) * geo.s, y = geo.oy + (Math.floor(i / vue.W) + 0.5) * geo.s;
    for (let k = 0; k < (bulles ? 8 : 14); k++) {
      const a = Math.random() * Math.PI * 2, v = bulles ? 30 + Math.random() * 40 : 90 + Math.random() * 160;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (bulles ? 20 : 140), vie: 0.6 + Math.random() * 0.5, k: geo.s * (bulles ? 0.04 + Math.random() * 0.05 : 0.07 + Math.random() * 0.06), coul: k % 2 ? coul : '#ffe066', bulle: !!bulles });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majLegales();
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
    anims = { tuiles: {}, poissons: {}, zones: [], etoiles: {}, algues: null };
    sel = null; modeEtoile = false; rotMain = 0;
    objCle = '';
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;           // heure du lancement automatique (ms)
  let resultatSalon = null;   // classement de la manche qui vient de finir
  let finEnAttente = false;   // fin de manche signalée, résultat pas encore montré
  let lancement = false;      // le chef a demandé le lancement

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { animal: tr('animal.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { animal: nomChef ? nomChef + ' · ' + tr('animal.' + partie.chef) : tr('animal.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue(partie.etat);
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    especesNouvelles = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, lagon: tr('lagon.' + NIVEAUX[vue.n].lg) })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (vue && partie.monTour()) sons.tour();
  }

  // Une espèce accueillie par le joueur de l'appareil entre dans l'album.
  function ajouterAlbum(sp) {
    if (prog.album.indexOf(sp) >= 0) return;
    prog.album.push(sp);
    especesNouvelles.push(sp);
    toast(tr('album.nouvelle', { nom: tr('espece.' + sp) }), 2600);
    // En ligne, l'album est gardé seulement si une sauvegarde existe déjà.
    if (session === 'ligne') { try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { album: prog.album.slice() }); } catch (e) { /* rien */ } }
  }

  function surAction(ev) {
    const t = performance.now(), a = ev.action || {};
    vue = JSON.parse(JSON.stringify(ev.apres));
    debutTour = Date.now();
    dernierTic = -1;
    objCle = '';
    if (a.e !== undefined) {
      anims.etoiles[a.e] = t;
      sons.etoile();
      jaillir(a.e, '#ff8a3d', false);
      if (!ev.moi) toast(tr('etoile.posee', { nom: nomTour(ev.siege) }), 1800);
      return;
    }
    anims.tuiles[a.x] = t;
    sons.pose();
    jaillir(a.x, '#ffffff', true);
    if (ev.moi) { sel = null; modeEtoile = false; rotMain = 0; }
    const avant = (ev.avant && ev.avant.fi) ? ev.avant.fi.length : 0;
    let ferme = false;
    for (let n = avant; n < vue.fi.length; n++) {
      const f = vue.fi[n];
      anims.poissons[n] = t + 200;
      if (f.x === 0) {
        ferme = true;
        const z = O.zone(vue, f.i, f.c);
        anims.zones.push({ cells: z.cells, t0: t });
        z.cells.forEach((i) => jaillir(i, CORAIL[f.c], false));
      } else if (f.x === 1) { sons.exigeant(); toast(f.s === partie.siege ? tr('exigeant.prisToi') : tr('exigeant.pris', { nom: nomTour(f.s) }), 2400); }
      else { sons.lanterne(); toast(f.s === partie.siege ? tr('lanterne.prisToi') : tr('lanterne.pris', { nom: nomTour(f.s) }), 2400); }
      if (partie && f.s === partie.siege) ajouterAlbum(f.sp);
    }
    if (ferme) {
      sons.ferme(); sons.poisson();
      const carte = $('place-' + ev.siege);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
    }
    if (ev.avant && JSON.stringify(ev.avant.al) !== JSON.stringify(vue.al)) {
      anims.algues = { de: ev.avant.al.slice(), t0: t };
      sons.courant();
    }
    if (vue.jete > 0 && vue.cur) toast(tr('pioche.emportee'), 2200);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && vue.cur && R.aQui(vue) === partie.siege && !ev.moi) sons.tour();
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    objCle = '';
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    sel = null; modeEtoile = false;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1300);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] > 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles d'un niveau gagné : 1, puis 2 avec 30 % des poissons du lagon, 3 avec 40 %.
  function etoilesPour(mesPoissons, total, gagne) {
    if (!gagne) return 0;
    const p = total ? mesPoissons / total : 0;
    return p >= 0.4 ? 3 : p >= 0.3 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      const cle = e.sc[s] + '/' + e.nf[s];
      if (cle !== prec) { rang = k + 1; prec = cle; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('animal.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.ligne', { p: e.sc[s], f: e.nf[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0, mesPoissons = moi >= 0 ? e.nf[moi] : 0;
    const totalPoissons = e.nf.reduce((a, b) => a + b, 0);
    const gagne = moi >= 0 && pts > 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts, f: mesPoissons }) : '';
    $('fin-album').textContent = especesNouvelles.length ? tr('fin.album', { n: especesNouvelles.length }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(mesPoissons, totalPoissons, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      const raresAvant = corauxDebloques();
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauverProgres();
      const raresApres = corauxDebloques();
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      let deb = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (!gagne) deb = tr('fin.conseil');
      if (raresApres > raresAvant) deb = (deb ? deb + ' ' : '') + tr('fin.corail', { nom: tr('corail.' + (raresApres - 1)) });
      $('fin-debloque').textContent = deb;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire (et quelques bulles).
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    const couls = [CORAIL[1], CORAIL[2], CORAIL[3], CORAIL[4], '#ffffff'];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: couls[i % 5], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    nouvelleVue(null);
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  function apercu(n) {
    const e = O.preparer(NIVEAUX[n - 1]);
    e.n = n - 1;
    for (let s = 0; s < PLACES; s++) { e.sc.push(0); e.nf.push(0); e.st.push(NIVEAUX[n - 1].st || 0); }
    return e;
  }

  // Parcours solo : niveau n contre 3 robots (force croissante, donnée par le terrain).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    especesNouvelles = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    nouvelleVue(apercu(niveau));
    particules.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majLegales(); majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majLegales();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

    epave: { g: ['...', '.C#', '...'], cd: [1, 2, 0, 0], pre: [],
      etapes: [{ moi: true, r: 0, c: 1, k: 'A', ed: [0, 0, 1, 0] }] },
    courant: { g: ['....', '.C..', '....'], cd: [1, 2, 3, 4], cour: [[0, 0], [0, 1], [0, 2], [0, 3], [1, 3], [2, 3], [2, 2], [2, 1], [2, 0], [1, 0]], al: 1, pre: [],
      etapes: [{ courant: true }, { courant: true }, { courant: true }] },
    turquoise: { g: ['...', '.C.', '...'], cd: [0, 4, 0, 0], pre: [],
      etapes: [{ moi: true, r: 1, c: 2, k: 'A', ed: [0, 0, 0, 4] }] },
    nuit: { g: ['...', '.C.', '...'], cd: [0, 3, 0, 0], nuit: true, pre: [[2, 0, 'A', [0, 1, 0, 0]]],
      etapes: [{ moi: true, r: 1, c: 2, k: 'A', ed: [0, 0, 0, 3] }] }
  };

  function etatDemo(d) {
    const e = O.preparer({ g: d.g, cd: d.cd, pi: 0, co: 4, cour: d.cour, al: d.al, nuit: d.nuit });
    e.n = 0; e.sc = [0, 0, 0, 0]; e.nf = [0, 0, 0, 0]; e.st = [1, 1, 1, 1];
    e.ex = (d.ex || []).map((x) => ({ a: x[0], b: x[1], s: -1 }));
    (d.pre || []).forEach((q) => { e.p[q[0] * e.W + q[1]] = { k: q[2], r: 0, ed: q[3].slice() }; });
    e.coups = 1;
    return e;
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function mainDoigt(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#0d2a3f'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = 560, H = 380, BX = 506, BY = 336, SX = 54, SY = 336;
    let e = etatDemo(d), debut = 0, fait = 0, an = { tuiles: {}, poissons: {}, zones: [], etoiles: {}, algues: null };
    let ghost = null, modeE = false;
    const g = geometrie(e, W, H - 70, 26);
    const centreCase = (r, col) => [g.ox + (col + 0.5) * g.s, g.oy + (r + 0.5) * g.s];
    const duree = (st) => (st.moi ? (st.ed0 ? 2600 : 2200) : st.etoile ? 2200 : 1300);
    const j = ++tutoAnim;
    let id = 0;
    function appliquer(st, t) {
      if (st.courant) { const de = e.al.slice(); O.courant(e); an.algues = { de: de, t0: t }; return; }
      const i = st.r * e.W + st.c;
      if (st.etoile) { R.jouer(e, 0, { e: i }); an.etoiles[i] = t; return; }
      const avant = e.fi.length;
      e.cur = { k: st.k, ed: st.ed.slice() }; e.tour = st.s || 0;
      R.jouer(e, st.moi ? 0 : (st.s || 1), { x: i, r: 0 }, () => 0.5);
      an.tuiles[i] = t;
      for (let n = avant; n < e.fi.length; n++) {
        an.poissons[n] = t + 200;
        if (e.fi[n].x === 0) an.zones.push({ cells: O.zone(e, e.fi[n].i, e.fi[n].c).cells, t0: t });
      }
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      let ts = t - debut;
      // étape en cours
      let k = 0, acc = 0;
      while (k < d.etapes.length && ts >= acc + duree(d.etapes[k])) { acc += duree(d.etapes[k]); k++; }
      if (k >= d.etapes.length && ts > acc + 1800) {
        e = etatDemo(d); fait = 0; an = { tuiles: {}, poissons: {}, zones: [], etoiles: {}, algues: null }; ghost = null; modeE = false; debut = t; ts = 0; k = 0; acc = 0;
      }
      // applique les étapes finies
      while (fait < Math.min(k, d.etapes.length)) { appliquer(d.etapes[fait], t); fait++; ghost = null; modeE = false; }
      const st = d.etapes[k], dans = ts - acc;
      let main = null;
      if (st && fait === k) {
        if (st.moi) {
          const p = centreCase(st.r, st.c), i = st.r * e.W + st.c;
          const tTap2 = st.ed0 ? 1100 : -1, tBtn = st.ed0 ? 1450 : 1050, tPose = tBtn + 550;
          if (dans < 600) { const q = dans / 600; main = [300 + (p[0] - 300) * q, 400 + (p[1] - 400) * q, 0]; }
          else if (dans < tBtn) {
            ghost = { i: i, k: st.k, ed: (st.ed0 && dans < tTap2) ? st.ed0 : st.ed, t0: debut + acc + (st.ed0 && dans >= tTap2 ? tTap2 : 600), de: st.ed0 && dans >= tTap2 ? -Math.PI / 2 : 0 };
            const appui = dans < 760 ? 1 - (dans - 600) / 160 : (tTap2 > 0 && dans >= tTap2 && dans < tTap2 + 160 ? 1 - (dans - tTap2) / 160 : 0);
            main = [p[0], p[1], appui];
          } else {
            ghost = { i: i, k: st.k, ed: st.ed, t0: 0, de: 0 };
            const q = Math.min(1, (dans - tBtn) / 450);
            main = [p[0] + (BX - p[0]) * q, p[1] + (BY - p[1]) * q, dans > tPose - 150 ? 1 - (dans - tPose + 150) / 150 : 0];
          }
        } else if (st.etoile) {
          const p = centreCase(st.r, st.c);
          if (dans < 500) { const q = dans / 500; main = [300 + (SX - 300) * q, 400 + (SY - 400) * q, 0]; }
          else if (dans < 1200) { modeE = true; const q = Math.max(0, (dans - 650) / 500); main = [SX + (p[0] - SX) * q, SY + (p[1] - SY) * q, dans < 650 ? 1 - (dans - 500) / 150 : 0]; }
          else { modeE = true; main = [p[0], p[1], Math.max(0, 1 - (dans - 1900) / 200)]; }
        }
      }
      // dessin
      c.setTransform(1, 0, 0, 1, 0, 0);
      const L = LAGONS[cle === 'paroi' || cle === 'exigeant' || cle === 'etoile' ? 1 : cle === 'epave' || cle === 'courant' || cle === 'turquoise' ? 2 : cle === 'nuit' ? 3 : 0];
      const gr = c.createLinearGradient(0, 0, 0, H);
      gr.addColorStop(0, L.haut); gr.addColorStop(1, L.bas);
      c.fillStyle = gr; c.fillRect(0, 0, W, H);
      const leg = new Set();
      if (modeE) leg.add(d.etapes[k].r * e.W + d.etapes[k].c);
      dessinerPlateau(c, e, g, { t: t, anims: an, lagon: LAGONS.indexOf(L), sel: ghost, couleur: 0, legales: leg });
      // boutons de la démonstration : Poser (et étoile de mer)
      c.fillStyle = '#2fbf6c'; c.strokeStyle = '#e3ffe9'; c.lineWidth = 3; rr(c, BX - 40, BY - 24, 80, 48, 16); c.fill(); c.stroke();
      c.strokeStyle = '#06381b'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.moveTo(BX - 14, BY); c.lineTo(BX - 3, BY + 11); c.lineTo(BX + 16, BY - 12); c.stroke();
      if (d.st) { c.fillStyle = modeE ? '#ffd84d' : '#f4fbff'; c.strokeStyle = '#2d7ea6'; c.lineWidth = 3; rr(c, SX - 30, SY - 24, 60, 48, 16); c.fill(); c.stroke(); etoileDeMer(c, SX, SY, 16, '#ff8a3d', 0); }
      if (main) mainDoigt(c, main[0], main[1], 1.5, main[2] > 0 ? main[2] : 0);
      id = requestAnimationFrame(image);
    }
    id = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(id);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const col = Math.floor((px - geo.ox) / geo.s), r = Math.floor((py - geo.oy) / geo.s);
    if (col < 0 || r < 0 || col >= vue.W || r >= vue.H) return -1;
    return r * vue.W + col;
  }

  function choisirCase(i) {
    if (!partie || enPause || attenteTuto || !vue || i < 0) return;
    if (!partie.monTour() || !vue.cur) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (modeEtoile) {
      if (caseEtoiles.has(i)) { if (partie.jouer({ e: i })) { modeEtoile = false; } }
      else { toast(tr('etoile.ici'), 1600); sons.non(); }
      majInterface();
      return;
    }
    const l = legMoi.get(i);
    if (!l) {
      if (O.caseLibre(vue, i, partie.siege)) { toast(tr(vue.al.indexOf(i) >= 0 ? 'tour.algue' : 'tour.pasIci'), 1800); sons.non(); }
      else if (vue.res[i] >= 0 && vue.res[i] !== partie.siege) { toast(tr('etoile.prise'), 1800); sons.non(); }
      return;
    }
    if (sel && sel.i === i) { tournerSel(); return; }
    const r = l.indexOf(rotMain) >= 0 ? rotMain : l[0];
    sel = { i: i, r: r, t0: performance.now(), de: 0 };
    sons.bulle();
    majInterface();
  }

  function tournerSel() {
    if (!partie || !partie.monTour() || !vue || !vue.cur || attenteTuto) return;
    modeEtoile = false;
    const now = performance.now();
    if (sel) {
      const l = legMoi.get(sel.i) || [];
      if (l.length < 2) { toast(tr('tour.unSens'), 1600); sons.non(); return; }
      sel.r = l[(l.indexOf(sel.r) + 1) % l.length];
      sel.t0 = now; sel.de = -Math.PI / 2;
      rotMain = sel.r;
    } else rotMain = (rotMain + 1) % 4;
    mainT0 = now; mainDe = -Math.PI / 2;
    sons.tourne();
    majInterface();
  }

  function poserSel() {
    if (!partie || !sel || enPause || attenteTuto || !partie.monTour()) return;
    if (partie.jouer({ x: sel.i, r: sel.r })) sel = null;
    majInterface();
  }

  function basculerEtoile() {
    if (!partie || !vue || !partie.monTour() || attenteTuto) return;
    if (!caseEtoiles.size) { toast(tr('etoile.aucune'), 1600); sons.non(); return; }
    modeEtoile = !modeEtoile;
    sel = null;
    sons.clic();
    if (modeEtoile) toast(tr('etoile.choisis'), 1800);
    majInterface();
  }

  const plateau = $('plateau');
  let appui = null;
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    appui = { x: p[0], y: p[1] };
  });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    if (appui && Math.hypot(p[0] - appui.x, p[1] - appui.y) < 30) choisirCase(caseSous(p[0], p[1]));
    appui = null;
  });
  plateau.addEventListener('pointercancel', () => { appui = null; });

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    if (curseur < 0) { const l = [...legMoi.keys()]; curseur = l.length ? l[0] : vue.g.indexOf('C'); return; }
    let r = Math.floor(curseur / vue.W) + dy, col = (curseur % vue.W) + dx;
    r = Math.max(0, Math.min(vue.H - 1, r)); col = Math.max(0, Math.min(vue.W - 1, col));
    curseur = r * vue.W + col;
    sons.clic();
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio(); clavier = true;
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio(); clavier = true;
      if (curseur < 0) { deplacerCurseur(0, 0); return; }
      if (!modeEtoile && sel && sel.i === curseur) poserSel(); else choisirCase(curseur);
    } else if (ev.code === 'Space' || ev.code === 'KeyR') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && ev.code === 'Space') return;
      ev.preventDefault(); audio(); tournerSel();
    } else if (ev.code === 'KeyE') {
      ev.preventDefault(); audio(); basculerEtoile();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-album').addEventListener('click', () => { audio(); sons.clic(); ouvrirAlbum(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('album-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-tourner').addEventListener('click', () => { audio(); tournerSel(); });
  $('btn-poser').addEventListener('click', () => { audio(); poserSel(); });
  $('btn-etoile').addEventListener('click', () => { audio(); basculerEtoile(); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
