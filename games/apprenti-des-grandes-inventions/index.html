  "neuf.coin.titre": "A chain of gears",
  "neuf.coin.texte": "A gear turns its neighbours on the left, right, top and bottom. To go further, place a chain of gears, even around corners.",

  "neuf.deux.titre": "Two machines",

  "neuf.sens.titre": "Turning direction",

  "neuf.caisse.texte": "Crates are in the way on the workbench. Tap them to open them (1 move): you get iron, wood, copper or glass. At the workbench, build the missing parts for free.",
  "neuf.poulie.titre": "Pulleys",
  "neuf.poulie.texte": "Two pulleys of the same colour are joined by a belt: they turn together, the same way, even far apart, even over a wall.",
  "neuf.courroies.titre": "Two belts",
  "neuf.courroies.texte": "The red belt only joins red pulleys, the blue one only blue pulleys. A pulley placed next to another one turns it like a gear.",
  "neuf.lumiere.titre": "The lighthouse light",
  "neuf.lumiere.texte": "The lamp sends a straight beam. A prism bounces it at a right angle: tap it again in your toolbox to switch its mirror. The lens must turn AND be lit.",
  "neuf.coupe.titre": "A blocked beam",
  "neuf.coupe.texte": "A part placed in the beam's path stops the light. Lead your gears beside the beam.",
  "neuf.verre.titre": "Glass",
  "neuf.verre.texte": "With two pieces of glass, the workbench builds a prism. Careful: a crate in the beam's path also blocks the light.",
  "neuf.moteurs.titre": "Two engines",
  "neuf.moteurs.texte": "If two engines try to turn the same gear in two different directions, everything jams. Choose carefully which engine to connect to which machine.",
  "neuf.helices.titre": "Two propellers",
  "neuf.helices.texte": "Each propeller has its own arrow: one turns one way, the other turns the other way. Count the gears on each side carefully!",
  "mission.1.nom": "The potter's wheel",
  "mission.1.demande": "My wheel won't turn! Connect it to my kick wheel with a gear.",
  "mission.1.note": "The potter's wheel turns flat: the potter's hands shape the wet clay.",
  "mission.2.nom": "The gear",
  "mission.2.demande": "My wheel is further away this time. One gear won't be enough!",
  "mission.2.note": "The teeth of two gears fit together: when one turns, its neighbour turns the other way.",
  "mission.3.nom": "The gear path",
  "mission.3.demande": "A stone wall cuts my workshop in two. Go around it with your gears!",
  "mission.3.note": "A chain of gears carries movement far from the engine, even with detours.",
  "mission.4.nom": "The polishing wheel",
  "mission.4.demande": "Turn my potter's wheel AND my wheel for polishing vases.",
  "mission.4.note": "A single engine can turn several machines at the same time.",
  "mission.5.nom": "The mill shaft",
  "mission.5.demande": "I don't have many gears. Use shafts for the straight lines!",
  "mission.5.note": "A shaft is a long bar: the parts at its two ends turn the same way.",
  "mission.6.nom": "The rusty gear",
  "mission.6.demande": "An old rusty gear is jamming my mill. Remove it, then find the right path.",
  "mission.6.note": "A rusty gear doesn't turn anymore: it jams every gear touching it.",
  "mission.7.nom": "The millstone's direction",
  "mission.7.demande": "My millstone must turn the way the green arrow shows, or the flour comes out badly.",
  "mission.7.note": "Each gear flips the direction, a shaft keeps it: mix them to get the right direction.",
  "mission.8.nom": "The flour mill",
  "mission.8.demande": "I'm missing parts! Open the crates and build them at the workbench.",
  "mission.8.note": "In a watermill, the river turns the waterwheel, and the gears turn the millstone that grinds the grain.",
  "mission.9.nom": "The belt",
  "mission.9.demande": "This wall is too thick for your gears. Two pulleys and a belt will go over it.",
  "mission.9.note": "A belt joins two pulleys: they turn together, the same way, even far apart.",
  "mission.10.nom": "The press and the roller",
  "mission.10.demande": "My press and my ink roller both have to turn.",
  "mission.10.note": "The press pushes paper onto letters covered in ink: that's how the same page is printed hundreds of times.",
  "mission.11.nom": "The workshop pulley",
  "mission.11.demande": "I'm missing a pulley. And my press must turn the way the arrow shows!",
  "mission.11.note": "A pulley is built with wood and copper. The belt keeps the turning direction.",
  "mission.12.nom": "The great press",
  "mission.12.demande": "Two belts, two colours, and a rusty gear next to the engine. Your turn!",
  "mission.12.note": "By joining several belts, movement travels from one room to the next.",
  "mission.13.nom": "The light prism",
  "mission.13.demande": "My lens must turn AND get the light from the lamp.",
  "mission.13.note": "A glass prism bounces light: the beam changes direction.",
  "mission.14.nom": "The turning lantern",
  "mission.14.demande": "Careful: a part placed in the beam blocks the light!",
  "mission.14.note": "The lighthouse lens turns: its beam sweeps across the sea to guide ships at night.",
  "mission.15.nom": "The glass lens",
  "mission.15.demande": "Glass crates block the way. Their glass will be used to build a prism.",
  "mission.15.note": "Glass rings around the lamp gather the light into a beam you can see from very far away.",
  "mission.16.nom": "The great lighthouse",
  "mission.16.demande": "Tonight, the lens AND the foghorn must work. The horn must turn the way its arrow shows!",
  "mission.16.note": "When fog hides the light, the foghorn warns ships with sound.",
  "mission.17.nom": "The two engines",
  "mission.17.demande": "Two engines are running in my hangar. My propellers must turn the way the arrows show, without everything jamming!",
  "mission.17.note": "Two connected engines must turn in agreement, or the gears get stuck.",
  "mission.18.nom": "The double propeller",
  "mission.18.demande": "My two propellers must turn opposite ways. The pulleys will help you.",
  "mission.18.note": "Two propellers turning opposite ways stop the machine from spinning around itself.",
  "mission.19.nom": "The messy hangar",
  "mission.19.demande": "Rust, crates and a missing pulley: fix up my hangar and get my two propellers turning.",
  "mission.19.note": "Before every flight, mechanics check each part of the engine.",
  "mission.20.nom": "The flying machine",
  "mission.20.demande": "The big day! Light the runway lighthouse and turn my two propellers the way the arrows show.",
  "mission.20.note": "In the early 20th century, the first engine-powered planes take off: the propeller pulls the plane forward."

  "neuf.helices.texte": "Cada hélice tiene su flecha: una gira en un sentido y la otra en el otro. ¡Cuenta bien los engranajes de cada lado!",
  "mission.1.nom": "El torno del alfarero",
  "mission.1.demande": "¡Mi torno ya no gira! Únelo a mi rueda de pedal con un engranaje.",
  "mission.1.note": "El torno del alfarero gira en horizontal: las manos del alfarero dan forma al barro mojado.",
  "mission.2.nom": "El engranaje",
  "mission.2.demande": "Esta vez mi torno está más lejos. ¡Un solo engranaje no bastará!",
  "mission.2.note": "Los dientes de dos engranajes encajan: cuando uno gira, su vecino gira en el otro sentido.",
  "mission.3.nom": "El camino de engranajes",
  "mission.3.demande": "Un muro de piedras corta mi taller. ¡Rodéalo con tus engranajes!",
  "mission.3.note": "Una cadena de engranajes lleva el movimiento lejos del motor, incluso dando rodeos.",
  "mission.4.nom": "La muela de pulir",
  "mission.4.demande": "Haz girar mi torno Y mi muela para pulir las vasijas.",
  "mission.4.note": "Un solo motor puede hacer girar varias máquinas a la vez.",
  "mission.5.nom": "El eje del molino",
  "mission.5.demande": "Tengo pocos engranajes. ¡Usa ejes para las líneas rectas!",
  "mission.5.note": "Un eje es una barra larga: las piezas de sus dos extremos giran en el mismo sentido.",
  "mission.6.nom": "El engranaje oxidado",
  "mission.6.demande": "Un viejo engranaje oxidado bloquea mi molino. Quítalo y busca el buen camino.",
  "mission.6.note": "Un engranaje oxidado ya no gira: bloquea todos los engranajes que lo tocan.",
  "mission.7.nom": "El sentido de la muela",
  "mission.7.demande": "Mi muela debe girar en el sentido de la flecha verde, si no la harina sale mal.",
  "mission.7.note": "Cada engranaje invierte el sentido y un eje lo mantiene: se mezclan para conseguir el sentido correcto.",
  "mission.8.nom": "El molino de harina",
  "mission.8.demande": "¡Me faltan piezas! Abre las cajas y fabrícalas en el banco.",
  "mission.8.note": "En un molino de agua, el río hace girar la rueda de paletas, y los engranajes mueven la muela que muele el grano.",
  "mission.9.nom": "La correa",
  "mission.9.demande": "Este muro es demasiado grueso para tus engranajes. Dos poleas y una correa pasarán por encima.",
  "mission.9.note": "Una correa une dos poleas: giran juntas, en el mismo sentido, aunque estén lejos.",
  "mission.10.nom": "La prensa y el rodillo",
  "mission.10.demande": "Mi prensa y mi rodillo de tinta deben girar los dos.",
  "mission.10.note": "La prensa aprieta el papel contra letras cubiertas de tinta: así se imprime la misma página cientos de veces.",
  "mission.11.nom": "La polea del taller",
  "mission.11.demande": "Me falta una polea. ¡Y mi prensa debe girar en el sentido de la flecha!",
  "mission.11.note": "Una polea se fabrica con madera y cobre. La correa mantiene el sentido de giro.",
  "mission.12.nom": "La gran prensa",
  "mission.12.demande": "Dos correas, dos colores y un engranaje oxidado junto al motor. ¡Te toca!",
  "mission.12.note": "Uniendo varias correas, el movimiento pasa de una sala a otra.",
  "mission.13.nom": "El prisma de luz",
  "mission.13.demande": "Mi lente debe girar Y recibir la luz de la lámpara.",
  "mission.13.note": "Un prisma de vidrio desvía la luz: el rayo cambia de dirección.",
  "mission.14.nom": "La linterna giratoria",
  "mission.14.demande": "Cuidado: ¡una pieza colocada en el rayo corta la luz!",
  "mission.14.note": "La lente del faro gira: su haz barre el mar para guiar a los barcos de noche.",
  "mission.15.nom": "La lente de vidrio",
  "mission.15.demande": "Unas cajas de vidrio tapan el paso. Su vidrio servirá para fabricar un prisma.",
  "mission.15.note": "Unos anillos de vidrio alrededor de la lámpara reúnen la luz en un haz que se ve desde muy lejos.",
  "mission.16.nom": "El gran faro",
  "mission.16.demande": "Esta noche, la lente Y la sirena de niebla deben funcionar. ¡La sirena debe girar en el sentido de su flecha!",
  "mission.16.note": "Cuando la niebla oculta la luz, la sirena avisa a los barcos con su sonido.",
  "mission.17.nom": "Los dos motores",
  "mission.17.demande": "En mi hangar giran dos motores. ¡Mis hélices deben girar en el sentido de las flechas sin que todo se atasque!",
  "mission.17.note": "Dos motores unidos deben girar de acuerdo, si no los engranajes se bloquean.",
  "mission.18.nom": "La hélice doble",
  "mission.18.demande": "Mis dos hélices deben girar en sentidos contrarios. Las poleas te ayudarán.",
  "mission.18.note": "Dos hélices que giran en sentidos contrarios evitan que el aparato gire sobre sí mismo.",
  "mission.19.nom": "El hangar desordenado",
  "mission.19.demande": "Óxido, cajas y una polea que falta: arregla mi hangar y haz girar mis dos hélices.",
  "mission.19.note": "Antes de cada vuelo, los mecánicos revisan cada pieza del motor.",
  "mission.20.nom": "La máquina voladora",
  "mission.20.demande": "¡El gran día! Enciende el faro de la pista y haz girar mis dos hélices en el sentido de las flechas.",
  "mission.20.note": "A principios del siglo XX despegan los primeros aviones con motor: la hélice tira del avión hacia delante."

  "neuf.sens.titre": "O sentido de rotação",
  "neuf.sens.texte": "A seta verde mostra para que lado a máquina precisa girar. Cada engrenagem inverte o sentido; dois eixos seguidos o mantêm. Misture engrenagens e eixos para conseguir o sentido certo.",
  "neuf.caisse.titre": "As caixas e a bancada",
  "neuf.caisse.texte": "Há caixas atrapalhando a bancada. Toque nelas para abri-las (1 movimento): você ganha ferro, madeira, cobre ou vidro. Na bancada, fabrique de graça as peças que faltam.",

  "neuf.courroies.titre": "Duas correias",

  "neuf.lumiere.titre": "A luz do farol",
  "neuf.lumiere.texte": "A lâmpada manda um raio em linha reta. Um prisma o desvia em ângulo reto: toque nele de novo na sua caixa para mudar o espelho. A lente precisa girar E estar iluminada.",
  "neuf.coupe.titre": "O raio cortado",
  "neuf.coupe.texte": "Uma peça colocada no caminho do raio bloqueia a luz. Passe suas engrenagens ao lado do raio.",
  "neuf.verre.titre": "O vidro",
  "neuf.verre.texte": "Com dois pedaços de vidro, a bancada fabrica um prisma. Cuidado: uma caixa no caminho do raio também bloqueia a luz.",
  "neuf.moteurs.titre": "Dois motores",
  "neuf.moteurs.texte": "Se dois motores querem girar a mesma engrenagem em dois sentidos diferentes, tudo trava. Escolha bem qual motor ligar a qual máquina.",
  "neuf.helices.titre": "Duas hélices",
  "neuf.helices.texte": "Cada hélice tem sua seta: uma gira para um lado e a outra para o outro. Conte bem as engrenagens de cada lado!",
  "mission.1.nom": "O torno do oleiro",
  "mission.1.demande": "Meu torno parou de girar! Ligue-o à minha roda de pedal com uma engrenagem.",
  "mission.1.note": "O torno do oleiro gira deitado: as mãos do oleiro dão forma ao barro molhado.",
  "mission.2.nom": "A engrenagem",
  "mission.2.demande": "Desta vez meu torno está mais longe. Uma engrenagem só não vai bastar!",
  "mission.2.note": "Os dentes de duas engrenagens se encaixam: quando uma gira, a vizinha gira para o outro lado.",
  "mission.3.nom": "O caminho das engrenagens",
  "mission.3.demande": "Um muro de pedras corta minha oficina. Dê a volta com suas engrenagens!",
  "mission.3.note": "Uma corrente de engrenagens leva o movimento para longe do motor, mesmo dando voltas.",
  "mission.4.nom": "A roda de polir",
  "mission.4.demande": "Faça girar meu torno E minha roda de polir os vasos.",
  "mission.4.note": "Um só motor pode fazer girar várias máquinas ao mesmo tempo.",
  "mission.5.nom": "O eixo do moinho",
  "mission.5.demande": "Tenho poucas engrenagens. Use eixos nas linhas retas!",
  "mission.5.note": "Um eixo é uma barra comprida: as peças das duas pontas giram no mesmo sentido.",
  "mission.6.nom": "A engrenagem enferrujada",
  "mission.6.demande": "Uma engrenagem velha e enferrujada trava meu moinho. Tire-a e encontre o caminho certo.",
  "mission.6.note": "Uma engrenagem enferrujada não gira mais: ela trava todas as engrenagens que encostam nela.",
  "mission.7.nom": "O sentido da mó",
  "mission.7.demande": "Minha mó precisa girar no sentido da seta verde, senão a farinha sai ruim.",
  "mission.7.note": "Cada engrenagem inverte o sentido e um eixo o mantém: misturamos os dois para ter o sentido certo.",
  "mission.8.nom": "O moinho de farinha",
  "mission.8.demande": "Estão faltando peças! Abra as caixas e fabrique-as na bancada.",
  "mission.8.note": "Num moinho de água, o rio faz girar a roda de pás, e as engrenagens fazem girar a mó que mói o grão.",
  "mission.9.nom": "A correia",
  "mission.9.demande": "Este muro é grosso demais para suas engrenagens. Duas polias e uma correia vão passar por cima.",
  "mission.9.note": "Uma correia liga duas polias: elas giram juntas, no mesmo sentido, mesmo longe uma da outra.",
  "mission.10.nom": "A prensa e o rolo",
  "mission.10.demande": "Minha prensa e meu rolo de tinta precisam girar os dois.",
  "mission.10.note": "A prensa aperta o papel sobre letras cobertas de tinta: assim se imprime a mesma página centenas de vezes.",
  "mission.11.nom": "A polia da oficina",
  "mission.11.demande": "Está faltando uma polia. E minha prensa precisa girar no sentido da seta!",
  "mission.11.note": "Uma polia é feita de madeira e cobre. A correia mantém o sentido de rotação.",
  "mission.12.nom": "A grande prensa",
  "mission.12.demande": "Duas correias, duas cores e uma engrenagem enferrujada perto do motor. Sua vez!",
  "mission.12.note": "Ligando várias correias, o movimento passa de uma sala para outra.",
  "mission.13.nom": "O prisma de luz",
  "mission.13.demande": "Minha lente precisa girar E receber a luz da lâmpada.",
  "mission.13.note": "Um prisma de vidro desvia a luz: o raio muda de direção.",
  "mission.14.nom": "A lanterna giratória",
  "mission.14.demande": "Cuidado: uma peça colocada no raio bloqueia a luz!",
  "mission.14.note": "A lente do farol gira: seu facho varre o mar para guiar os barcos à noite.",
  "mission.15.nom": "A lente de vidro",
  "mission.15.demande": "Caixas de vidro bloqueiam a passagem. O vidro delas vai servir para fabricar um prisma.",
  "mission.15.note": "Anéis de vidro em volta da lâmpada juntam a luz num facho que se vê de muito longe.",
  "mission.16.nom": "O grande farol",
  "mission.16.demande": "Hoje à noite, a lente E a buzina de nevoeiro precisam funcionar. A buzina precisa girar no sentido da sua seta!",
  "mission.16.note": "Quando a neblina esconde a luz, a buzina de nevoeiro avisa os barcos com o som.",

  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

#demo { width: 100%; max-width: 300px; height: 150px; display: block; margin: 6px auto; background: #efe0bd; border-radius: 12px; border: 2px solid var(--bois3); }
.nouveau { display: inline-block; background: var(--cuivre); color: #fff; border-radius: 10px; padding: 2px 10px; font-weight: 800; font-size: 14px; }
.recette { display: flex; align-items: center; gap: 8px; justify-content: space-between; background: #efe0bd; border-radius: 12px; padding: 6px 8px; margin: 6px 0; }
.recette canvas { width: 40px; height: 40px; }
.recette .cout { display: flex; align-items: center; gap: 2px; font-weight: 800; }
.recette .cout canvas { width: 26px; height: 26px; }
.pause-aide { font-size: 13px; color: #6b4a2a; }

/* ----- Carnet et garde-robe ----- */
.pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.page { background: var(--parchemin); border: 2px solid var(--ombre); border-radius: 12px; padding: 6px; text-align: center; }
.page canvas { width: 100%; height: auto; aspect-ratio: 4 / 3; background: #efe0bd; border-radius: 8px; display: block; }
.page h3 { margin: 6px 0 2px; font-size: 14px; }
.page p { margin: 0; font-size: 12.5px; line-height: 1.3; color: #5a4430; }
.page.fermee { opacity: .7; }
.intro-ecran { color: var(--parchemin); text-align: center; margin: 4px 0 10px; }
#apercu { display: block; margin: 0 auto; width: 180px; height: 210px; background: radial-gradient(circle at 50% 40%, #fff3d6, #e3cfa4); border-radius: 50%; border: 3px solid var(--ombre); }
.choix-titre { color: var(--parchemin); margin: 12px 0 6px; font-size: 18px; }
.choix { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.choix button { min-width: 72px; min-height: 78px; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; }
.choix button canvas { width: 3rem; height: 3rem; }
.choix button.porte { background: #ffe08a; outline: 3px solid #fff3c4; }
.choix button.ferme { background: #bfae8e; }

/* ----- Tutoriel, messages ----- */
#tuto-voile { position: fixed; inset: 0; z-index: 60; display: none; }
#tuto-voile.ouvert { display: block; }
#main-tuto { position: fixed; z-index: 61; width: 64px; height: 64px; pointer-events: none; display: none; transition: left .55s ease-in-out, top .55s ease-in-out; filter: drop-shadow(0 3px 3px rgba(0,0,0,.5)); }
#main-tuto.tape svg { animation: tape .5s; }
@keyframes tape { 50% { transform: scale(.8) translateY(6px); } }
#toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 70; background: var(--encre); color: #fff; padding: 10px 16px; border-radius: 14px; font-weight: 700; max-width: 90vw; text-align: center; opacity: 0; transition: opacity .25s; pointer-events: none; }
#toast.vu { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
@media (min-width: 700px) { .outil { width: 64px; height: 64px; } .bulle p { font-size: 15px; } }

<script>
/* ==========================================================================
   L'apprenti des grandes inventions — Free Micro Games
   L'apprenti remet en marche les machines de 5 artisans à travers l'histoire :
   on pose roues dentées, axes, poulies et prismes sur un établi quadrillé pour
   relier un moteur aux machines, puis on « fait tourner ». Chaque geste coûte
   un coup ; les étoiles récompensent les coups économisés.
   ========================================================================== */
'use strict';
const JEU = 'apprenti-des-grandes-inventions';

const TAU = Math.PI * 2;

/* ---- Missions ----------------------------------------------------------

   L  machine à tourner dans le sens antihoraire
   O  lentille du phare (doit tourner ET être éclairée)
   G  roue fixée    X  roue rouillée (bloque tout ; la toucher l'enlève)

   /  \  prismes fixés
   inv : pièces de la caisse ; mats : matériaux de départ ;

const NIVEAUX = [
  // ---- Atelier de la potière (Antiquité) ----

    sol: [['c', 2, 0], ['c', 5, 2], ['x', 0, 3], ['p', 'prisme', 4, 0, '\\'], ['p', 'prisme', 4, 5, '/'], ['p', 'roue', 1, 4], ['p', 'roue', 2, 4]] },

/* ---- Règles des mécanismes (sans affichage) ---------------------------- */
const PIECES = ['roue', 'axe', 'poulieA', 'poulieB', 'prisme'];
const RECETTES = { roue: { fer: 2 }, axe: { bois: 1 }, poulieA: { bois: 1, cuivre: 1 }, poulieB: { bois: 1, cuivre: 1 }, prisme: { verre: 2 } };
const MATERIAUX = ['fer', 'bois', 'cuivre', 'verre'];
const CAISSES = { f: 'fer', w: 'bois', c: 'cuivre', y: 'verre' };
const LAMPES = { E: [1, 0], W: [-1, 0], N: [0, -1], D: [0, 1] };

function lireCarte(carte) {
  const h = carte.length, w = carte[0].length;
  const cases = [];
  let k = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = carte[y][x];
      let c = { t: 'vide' };
      if (ch === '#') c = { t: 'roche' };
      else if (ch === 'S') c = { t: 'source', d: 1 };
      else if (ch === 's') c = { t: 'source', d: -1 };
      else if (ch === 'T' || ch === 'R' || ch === 'L') c = { t: 'cible', d: ch === 'R' ? 1 : ch === 'L' ? -1 : 0, k: k++ };
      else if (ch === 'O') c = { t: 'lentille', d: 0 };
      else if (ch === 'G') c = { t: 'roue', fixe: true };
      else if (ch === 'X') c = { t: 'rouille', fixe: true };
      else if (ch === '-') c = { t: 'axe', o: 'h', fixe: true };
      else if (ch === '|') c = { t: 'axe', o: 'v', fixe: true };
      else if (ch === 'a') c = { t: 'poulieA', fixe: true };
      else if (ch === 'b') c = { t: 'poulieB', fixe: true };
      else if (CAISSES[ch]) c = { t: 'caisse', m: CAISSES[ch] };
      else if (LAMPES[ch]) c = { t: 'lampe', dir: LAMPES[ch] };
      else if (ch === '/' || ch === '\\') c = { t: 'prisme', o: ch, fixe: true };
      cases.push(c);
    }
  }
  return { w, h, cases };
}
function estRond(c) {
  return !!c && (c.t === 'roue' || c.t === 'rouille' || c.t === 'source' || c.t === 'cible' || c.t === 'lentille' || c.t === 'poulieA' || c.t === 'poulieB');
}
function tourne(c) { return estRond(c) || (!!c && c.t === 'axe'); }

// Rayons des lampes : cases traversées ; lentilles éclairées.
function rayons(plan) {
  const { w, h, cases } = plan;
  const trajets = [];
  const eclaires = new Set();
  cases.forEach((c, i) => {
    if (c.t !== 'lampe') return;
    let x = i % w, y = Math.floor(i / w);
    let [dx, dy] = c.dir;
    const trajet = [];
    for (let pas = 0; pas < w * h * 4; pas++) {
      x += dx; y += dy;
      if (x < 0 || y < 0 || x >= w || y >= h) { trajet.push(-1 - trajet.length); break; }
      const j = y * w + x;
      const d = cases[j];
      trajet.push(j);
      if (d.t === 'vide') continue;
      if (d.t === 'prisme') {
        if (d.o === '/') { const t = dx; dx = -dy; dy = -t; } else { const t = dx; dx = dy; dy = t; }
        continue;
      }
      if (d.t === 'lentille') eclaires.add(j);
      break;
    }
    trajets.push({ depart: i, trajet: trajet.filter((j) => j >= 0), sortie: trajet.some((j) => j < 0) ? [x, y] : null });
  });
  return { trajets, eclaires };
}

// Liens : [voisine, même sens ?]. Deux roues : sens inversé ; axe : par ses
// deux bouts seulement, même sens ; poulies de même couleur : même sens.
function liens(plan) {
  const { w, h, cases } = plan;
  const L = cases.map(() => []);
  const ajouter = (i, j, meme) => { L[i].push([j, meme]); L[j].push([i, meme]); };
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = y * w + x;
      const a = cases[i];
      if (!tourne(a)) continue;
      for (const [dx, dy, o] of [[1, 0, 'h'], [0, 1, 'v']]) {
        const nx = x + dx, ny = y + dy;
        if (nx >= w || ny >= h) continue;
        const j = ny * w + nx;
        const b = cases[j];
        if (!tourne(b)) continue;
        const aAxe = a.t === 'axe', bAxe = b.t === 'axe';
        if (!aAxe && !bAxe) ajouter(i, j, false);
        else if (aAxe && bAxe) { if (a.o === o && b.o === o) ajouter(i, j, true); }
        else if ((aAxe ? a : b).o === o) ajouter(i, j, true);
      }
    }
  }
  for (const t of ['poulieA', 'poulieB']) {
    const p = [];
    cases.forEach((c, i) => { if (c.t === t) p.push(i); });
    for (let k = 1; k < p.length; k++) ajouter(p[0], p[k], true);
  }
  return L;
}

// Fait tourner le mécanisme : sens (1 horaire, -1 antihoraire, 0), ordre
// d'animation, pièces coincées, état de chaque machine, raison d'un échec.
function simuler(plan) {
  const { cases } = plan;
  const L = liens(plan);
  const sens = cases.map(() => 0);
  const ordre = cases.map(() => -1);
  const coince = new Set();
  const groupe = cases.map(() => -1);
  let raisonCoince = null;
  let g = 0;
  cases.forEach((c, i) => {
    if (!tourne(c) || groupe[i] >= 0) return;
    const membres = [];
    const pile = [i];
    groupe[i] = g;
    while (pile.length) {
      const k = pile.pop();
      membres.push(k);
      for (const [j] of L[k]) if (groupe[j] < 0) { groupe[j] = g; pile.push(j); }
    }
    g++;
    const moteurs = membres.filter((k) => cases[k].t === 'source');
    if (!moteurs.length) return;
    const val = new Map();
    const file = [];
    for (const m of moteurs) { val.set(m, cases[m].d); ordre[m] = 0; file.push(m); }
    let conflit = false;
    for (let q = 0; q < file.length; q++) {
      const k = file[q];
      for (const [j, meme] of L[k]) {
        const v = meme ? val.get(k) : -val.get(k);
        if (!val.has(j)) { val.set(j, v); ordre[j] = ordre[k] + 1; file.push(j); }
        else if (val.get(j) !== v) conflit = true;
      }
    }
    const rouille = membres.some((k) => cases[k].t === 'rouille');
    if (rouille || conflit) {
      membres.forEach((k) => coince.add(k));
      raisonCoince = raisonCoince || (rouille ? 'rouille' : 'conflit');
      return;
    }
    for (const [k, v] of val) sens[k] = v;
  });
  const { trajets, eclaires } = rayons(plan);
  const machines = [];
  cases.forEach((c, i) => {
    if (c.t !== 'cible' && c.t !== 'lentille') return;
    let etat = 'ok';
    if (coince.has(i)) etat = 'coince';
    else if (!sens[i]) etat = 'immobile';
    else if (c.d && sens[i] !== c.d) etat = 'sens';
    else if (c.t === 'lentille' && !eclaires.has(i)) etat = 'noir';
    machines.push({ i, etat });
  });
  let raison = null;
  for (const p of ['coince', 'immobile', 'sens', 'noir']) {
    if (machines.some((m) => m.etat === p)) { raison = p === 'coince' ? raisonCoince : p; break; }
  }
  if (!raison && raisonCoince) raison = raisonCoince;
  return { gagne: !raison, raison, sens, ordre, coince, machines, trajets, eclaires };
}

function peutFabriquer(etat, piece) {
  const r = RECETTES[piece];
  return Object.keys(r).every((m) => (etat.mats[m] || 0) >= r[m]);
}
function fabriquer(etat, piece) {
  if (!peutFabriquer(etat, piece)) return false;
  const r = RECETTES[piece];
  for (const m in r) etat.mats[m] -= r[m];
  etat.inv[piece] = (etat.inv[piece] || 0) + 1;
  return true;
}
// Applique un geste (parcours de référence, démonstrations). Fabrique au besoin.
function appliquerGeste(etat, geste) {
  const { plan } = etat;
  if (geste[0] === 'p') {
    const [, piece, x, y, o] = geste;
    const i = y * plan.w + x;
    if (plan.cases[i].t !== 'vide') return false;
    if (!(etat.inv[piece] > 0) && !fabriquer(etat, piece)) return false;
    etat.inv[piece]--;
    const c = { t: piece, pose: true };
    if (piece === 'axe') c.o = o || 'h';
    if (piece === 'prisme') c.o = o || '/';
    plan.cases[i] = c;
    return true;
  }
  const k = geste[2] * plan.w + geste[1];
  const c = plan.cases[k];
  if (geste[0] === 'c' && c.t === 'caisse') { etat.mats[c.m] = (etat.mats[c.m] || 0) + 1; plan.cases[k] = { t: 'vide' }; return true; }
  if (geste[0] === 'x' && c.t === 'rouille') { plan.cases[k] = { t: 'vide' }; return true; }
  if (geste[0] === 'm' && c.pose) { etat.inv[c.t] = (etat.inv[c.t] || 0) + 1; plan.cases[k] = { t: 'vide' }; return true; }
  return false;
}
function etatDepart(def) {
  const inv = {};
  PIECES.forEach((p) => { inv[p] = (def.inv && def.inv[p]) || 0; });
  const mats = {};
  MATERIAUX.forEach((m) => { mats[m] = (def.mats && def.mats[m]) || 0; });

}
// Démonstrations : pièces à volonté, sauf celles qu'il faut fabriquer.
function etatDemo(def) {

  return e;
}

function fusionner(d) {
  if (!d || typeof d !== 'object') return;
  if (Array.isArray(d.etoiles)) d.etoiles.forEach((e, i) => { if (i < NIVEAUX.length && Number.isInteger(e)) P.etoiles[i] = Math.max(P.etoiles[i], Math.min(3, Math.max(0, e))); });
  if (Array.isArray(d.records)) d.records.forEach((r, i) => { if (i < NIVEAUX.length && Number.isInteger(r) && r > 0) P.records[i] = P.records[i] ? Math.min(P.records[i], r) : r; });
  if (Number.isFinite(d.xp)) P.xp = Math.max(P.xp, Math.floor(d.xp));
  if (Number.isFinite(d.score) && d.score > 0) P.xp = Math.max(P.xp, Math.floor(d.score)); // le score sauvegardé est l'expérience
  if (d.tenue && typeof d.tenue === 'object') {
    if (Number.isInteger(d.tenue.chapeau) && d.tenue.chapeau >= 0 && d.tenue.chapeau < 6) P.tenue.chapeau = d.tenue.chapeau;
    if (Number.isInteger(d.tenue.tablier) && d.tenue.tablier >= 0 && d.tenue.tablier < 6) P.tenue.tablier = d.tenue.tablier;
  }
  if (d.vus && typeof d.vus === 'object') Object.keys(d.vus).forEach((k) => { P.vus[k] = true; });
  if (typeof d.son === 'boolean') P.son = d.son;
  if (d.options && typeof d.options.son === 'boolean') P.son = d.options.son;
  if (Number.isInteger(d.niveauMax)) P.niveauMax = Math.max(P.niveauMax, Math.min(NIVEAUX.length, d.niveauMax));
}

  try {
    const d = window.JEL_SAVE.load(JEU);
    fusionner(d);
    if (window.JEL_SAVE.existe(JEU) && Number.isInteger(d.niveau)) P.niveauMax = Math.max(P.niveauMax, Math.min(NIVEAUX.length, d.niveau));
  } catch (e) { /* sauvegarde illisible : valeurs par défaut */ }

/* Disposition du plateau. */
let geo = { ox: 0, oy: 0, s: 40, W: 0, H: 0 };

/* Gestes du joueur sur l'établi (1 coup chacun, sauf exceptions dites). */
function depenser() { G.coups++; majCoups(); G.aide = null; G.echec = null; $('btn-tourner').classList.remove('brille'); }
function garderDernier() {
  if (restants() <= 1) { son('erreur'); toast(tr('toast.dernier')); return true; }
  return false;
}
function agir(x, y) {
  if (!G || G.fini || G.test || G.pause) return;
  initAudio();
  const i = y * G.plan.w + x;
  const c = G.plan.cases[i];
  G.curseur = { x, y };
  if (c.t === 'caisse') {
    if (garderDernier()) return;
    depenser();
    G.mats[c.m]++;
    G.plan.cases[i] = { t: 'vide' };
    son('caisse'); bouffee(x, y, MAT_COULEURS[c.m], 14);
    majMateriaux(c.m);
    toast(tr('toast.ramasse', { mat: tr('mat.' + c.m) }));
    return;
  }
  if (c.t === 'rouille') {
    if (garderDernier()) return;
    depenser();
    G.plan.cases[i] = { t: 'vide' };
    son('rouille'); bouffee(x, y, '#9c5a2e', 16);
    return;
  }
  if (G.outil === 'main') {
    if (c.pose) {
      if (garderDernier()) return;
      depenser();
      G.inv[c.t]++;
      G.plan.cases[i] = { t: 'vide' };
      son('reprise'); bouffee(x, y, '#ffffff', 8);
      majCaisse();
    } else { son('erreur'); toast(tr(c.t === 'vide' ? 'toast.mainVide' : 'toast.mainFixe')); }
    return;
  }
  if (c.t === 'vide') {
    if (!G.outil) { son('erreur'); toast(tr('toast.choisir')); return; }
    if (G.inv[G.outil] <= 0) {
      son('erreur');
      toast(tr(G.matsVus.length ? 'toast.fabriquer' : 'toast.plus'));
      return;
    }
    if (garderDernier()) return;
    depenser();
    G.inv[G.outil]--;
    const p = { t: G.outil, pose: true };
    if (G.outil === 'axe') p.o = G.orient.axe;
    if (G.outil === 'prisme') p.o = G.orient.prisme;
    G.plan.cases[i] = p;
    G.ang[i] = ((x + y) % 2) * (Math.PI / 10);
    son('pose'); bouffee(x, y);
    majCaisse();
    return;
  }
  if (c.pose && (c.t === 'axe' || c.t === 'prisme')) {
    if (garderDernier()) return;
    depenser();
    if (c.t === 'axe') c.o = c.o === 'h' ? 'v' : 'h'; else c.o = c.o === '/' ? '\\' : '/';
    son('pivote'); bouffee(x, y, '#ffffff', 6);
    return;
  }
  son('erreur');
  if (c.pose) toast(tr('toast.main'));
  else toast(tr('info.' + (c.t === 'cible' && c.d ? 'cibleSens' : c.t)));
}

/* « Faire tourner » : 1 coup, le mécanisme s'anime de proche en proche. */
function faireTourner() {
  if (!G || G.fini || G.test || G.pause) return;
  initAudio();
  if (restants() <= 0) return;
  depenser();
  const res = simuler(G.plan);
  const maxOrdre = Math.max(0, ...res.ordre);
  G.test = { debut: performance.now(), res, duree: maxOrdre * 0.12 + 1.0, fini: false };
  son('manivelle');
  setTimeout(() => son(res.coince.size ? 'coince' : 'mecanisme'), 380);
  if (res.trajets.length) setTimeout(() => son('rayon'), 200);
}
function conclureTest() {
  const res = G.test.res;
  if (res.gagne) {
    G.fini = true;
    confettis();
    bulle(tr('raison.gagne'), null, 'ok');
    son('victoire');
    setTimeout(victoire, 1300);
    return;
  }
  G.echec = { res, debut: performance.now() };
  bulle(tr('raison.' + res.raison), tr('essaieEncore'), 'ko');
  if (res.coince.size) { const z = $('zone-plateau'); z.classList.remove('secoue'); void z.offsetWidth; z.classList.add('secoue'); }
  else son('erreur');
  setTimeout(() => {
    if (!G || G.fini) return;
    G.test = null;
    if (restants() <= 0) defaite();
  }, 1200);
}

/* Indice : prochain geste du meilleur parcours (2 étoiles au plus). */
function memeCase(c, g) {
  if (g[0] !== 'p') return false;
  return c.t === g[1] && (g[1] !== 'axe' || c.o === (g[4] || 'h')) && (g[1] !== 'prisme' || c.o === (g[4] || '/'));
}
function indice() {
  if (!G || G.fini || G.test || G.pause) return;
  initAudio();
  const w = G.plan.w;
  const solCases = new Set(G.niv.sol.filter((g) => g[0] === 'p').map((g) => g[3] * w + g[2]));
  let conseil = null;
  for (const g of G.niv.sol) {
    if (g[0] === 'c' || g[0] === 'x') {
      const c = G.plan.cases[g[2] * w + g[1]];
      if ((g[0] === 'c' && c.t === 'caisse') || (g[0] === 'x' && c.t === 'rouille')) { conseil = { x: g[1], y: g[2], cle: g[0] === 'c' ? 'indice.ramasser' : 'indice.rouille' }; break; }
      continue;
    }
    const [, p, x, y, o] = g;
    const c = G.plan.cases[y * w + x];
    if (memeCase(c, g)) continue;
    if (c.pose) { conseil = { x, y, cle: c.t === p ? 'indice.pivoter' : 'indice.reprendre', outil: c.t === p ? null : 'main' }; break; }
    if (G.inv[p] <= 0) {
      // une pièce de ce genre posée ailleurs ?
      const k = G.plan.cases.findIndex((cc, j) => cc.pose && cc.t === p && !solCases.has(j));
      if (k >= 0) { conseil = { x: k % w, y: Math.floor(k / w), cle: 'indice.reprendre', outil: 'main' }; break; }
      if (peutFabriquer(G, p)) { conseil = { etabli: true, cle: 'indice.fabriquer', piece: p }; break; }
      const caisse = G.plan.cases.findIndex((cc) => cc.t === 'caisse');
      if (caisse >= 0) { conseil = { x: caisse % w, y: Math.floor(caisse / w), cle: 'indice.ramasser' }; break; }
    }
    conseil = { x, y, cle: 'indice.poser', piece: p, outil: p, o };
    break;
  }
  if (!conseil) {
    const k = G.plan.cases.findIndex((cc, j) => cc.pose && !solCases.has(j));

// La main montre l'élément concerné par la nouveauté.
function montrerCible(cle) {
  if (!G) return;

  const outil = (p) => { const b = $('caisse').querySelector(`[data-outil="${p}"]`); if (!b) return null; const r = b.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  let pts = [];
  if (cle === 'coin' || cle === 'deux') { const g = G.niv.sol[cle === 'deux' ? 3 : 0]; pts = [centreCase(g[2], g[3])]; }
  else if (cle === 'rocher') pts = [trouve((c) => c.t === 'roche')];
  else if (cle === 'axe') pts = [outil('axe'), outil('axe')];

  else if (cle === 'poulie') pts = [outil('poulieA')];
  else if (cle === 'courroies') pts = [outil('poulieB') || trouve((c) => c.t === 'poulieA')];
  else if (cle === 'lumiere' || cle === 'coupe') pts = [trouve((c) => c.t === 'lampe'), outil('prisme')];
  else if (cle === 'moteurs') { const k = G.plan.cases.map((c, i) => (c.t === 'source' ? i : -1)).filter((i) => i >= 0); pts = k.map((i) => centreCase(i % w, Math.floor(i / w))); }
  else if (cle === 'helices') pts = [trouve((c) => c.t === 'cible' && c.d === -1)];
  pts = pts.filter(Boolean);

// Petite scène animée de la carte « Nouveau ».
function dessinerDemo(t) {
  const cv = $('demo');
  const c = cv.getContext('2d');
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = '#efe0bd'; c.fillRect(0, 0, cv.width, cv.height);
  const { def } = demo;
  const pas = 0.9;
  const total = def.gestes.length * pas + 1.6;
  const temps = ((t - demo.debut) / 1000) % total;
  const etape = Math.min(def.gestes.length, Math.floor(temps / pas));
  if (!demo.etat || etape < demo.etape) { demo.etat = etatDemo(def); demo.etape = 0; demo.ang = new Float64Array(demo.etat.plan.cases.length); demo.test = null; demo.dernier = t; }
  while (demo.etape < etape) {
    const g = def.gestes[demo.etape];
    if (g[0] === 't') demo.test = { res: simuler(demo.etat.plan), debut: t };
    else { demo.test = null; appliquerGeste(demo.etat, g); }
    demo.etape++;
  }
  const plan = demo.etat.plan;
  const s = Math.min((cv.width - 40) / plan.w, (cv.height - 40) / plan.h, 120);
  const ox = (cv.width - s * plan.w) / 2, oy = (cv.height - s * plan.h) / 2;
  const dt = Math.min(0.05, (t - (demo.dernier || t)) / 1000);
  demo.dernier = t;
  const res = demo.test && demo.test.res;
  plan.cases.forEach((cel, i) => {
    if (res && res.sens[i]) demo.ang[i] += res.sens[i] * dt * 2.4;
    else if (cel.t === 'source') demo.ang[i] += cel.d * dt * 0.8;
    else if (res && res.coince.has(i)) demo.ang[i] += Math.sin(t / 30) * 0.02;
  });
  const sensFaux = new Set(res ? res.machines.filter((m) => m.etat === 'sens').map((m) => m.i) : []);
  dessinerPlan(c, plan, def.atelier, ox, oy, s, { ang: demo.ang, t: t / 1000, eclaires: res ? res.eclaires : new Set(), actifs: new Set(res ? res.machines.filter((m) => m.etat === 'ok').map((m) => m.i) : []), sensFaux });
  if (res) {
    res.coince.forEach((i) => { c.fillStyle = `rgba(214,58,42,${0.25 + 0.15 * Math.sin(t / 80)})`; c.fillRect(ox + (i % plan.w) * s, oy + Math.floor(i / plan.w) * s, s, s); });
    res.machines.forEach((m) => { const x = ox + (m.i % plan.w) * s + s / 2, y = oy + Math.floor(m.i / plan.w) * s + s / 2; disque(c, x, y, s * 0.5, null, m.etat === 'ok' ? '#2f8f3c' : '#d63a2a', 4); });
  }
  // main qui montre le geste en cours
  const g = def.gestes[Math.min(etape, def.gestes.length - 1)];
  if (g && g[0] !== 't' && temps < def.gestes.length * pas) {
    const x = ox + g[g[0] === 'p' ? 2 : 1] * s + s * 0.5, y = oy + g[g[0] === 'p' ? 3 : 2] * s + s * 0.55;
    const k = (temps % pas) / pas;
    c.save(); c.translate(x, y + (k < 0.5 ? (0.5 - k) * 30 : 0)); c.scale(0.9, 0.9);
    c.fillStyle = '#fff'; c.strokeStyle = '#3a2a1a'; c.lineWidth = 4; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-6, 26); c.lineTo(-6, 0); c.arc(0, 0, 6, Math.PI, 0); c.lineTo(6, 16); c.lineTo(24, 20); c.quadraticCurveTo(30, 40, 18, 56); c.lineTo(-4, 56); c.lineTo(-20, 34); c.quadraticCurveTo(-14, 26, -6, 30); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }
}

  if (G.test) {
    res = G.test.res;
    if (!enPause) G.test.ecoule = (G.test.ecoule || 0) + dt;
    ecoule = G.test.ecoule || 0;
    if (!G.test.fini && ecoule >= G.test.duree) { G.test.fini = true; conclureTest(); }
  }
  if (!enPause) {
    G.plan.cases.forEach((cel, i) => {

      else if (res && res.coince.has(i) && ecoule >= res.ordre[i] * 0.12) G.ang[i] += Math.sin(t / 25) * 0.03;
      else if (cel.t === 'source' && !(res && res.coince.has(i))) G.ang[i] += cel.d * dt * 0.9;
    });
  }
  const actifs = new Set();
  const sensFaux = new Set();
  const vue = (G.test && G.test.fini) || G.fini || G.echec ? (G.test ? G.test.res : G.echec && G.echec.res) : null;
