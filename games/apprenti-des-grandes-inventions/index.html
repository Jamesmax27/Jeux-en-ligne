  dessinerPlan(c, G.plan, G.niv.atelier, geo.ox, geo.oy, geo.s, { ang: G.ang, t: t / 1000, eclaires: rayons(G.plan).eclaires, actifs, sensFaux });
  const s = geo.s;
  const coin = (i) => [geo.ox + (i % G.plan.w) * s, geo.oy + Math.floor(i / G.plan.w) * s];
  // pièces coincées, machines ratées ou réussies
  const echec = G.echec && (t - G.echec.debut < 2600) ? G.echec.res : (G.test && G.test.fini && !G.test.res.gagne ? G.test.res : null);
  if (echec) {
    echec.coince.forEach((i) => { const [x, y] = coin(i); c.fillStyle = `rgba(214,58,42,${0.22 + 0.15 * Math.sin(t / 70)})`; c.fillRect(x, y, s, s); });
    echec.machines.forEach((m) => { const [x, y] = coin(m.i); disque(c, x + s / 2, y + s / 2, s * 0.52, null, m.etat === 'ok' ? '#2f8f3c' : '#d63a2a', Math.max(3, s * 0.07)); });
  }
  if (G.fini && G.test && G.test.res.gagne) G.test.res.machines.forEach((m) => { const [x, y] = coin(m.i); disque(c, x + s / 2, y + s / 2, s * (0.52 + 0.04 * Math.sin(t / 120)), null, '#ffd34d', Math.max(3, s * 0.08)); });
  // indice
  if (G.aide) {
    const [x, y] = coin(G.aide.y * G.plan.w + G.aide.x);
    c.save(); c.strokeStyle = `rgba(255,214,60,${0.6 + 0.4 * Math.sin(t / 120)})`; c.lineWidth = Math.max(3, s * 0.08);
    c.strokeRect(x + 3, y + 3, s - 6, s - 6); c.restore();
  }
  // curseur du clavier
  if (G.clavier && !G.fini) {
    const [x, y] = coin(G.curseur.y * G.plan.w + G.curseur.x);
    c.save(); c.setLineDash([6, 4]); c.strokeStyle = '#ffffff'; c.lineWidth = 3; c.strokeRect(x + 2, y + 2, s - 4, s - 4);
    c.strokeStyle = '#3a2a1a'; c.lineDashOffset = 5; c.strokeRect(x + 2, y + 2, s - 4, s - 4); c.restore();
  }
  // particules
  if (!enPause) G.particules.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.confetti ? 30 : 160) * dt; p.vie -= dt; if (p.r !== undefined) p.r += dt * 6; });
  G.particules = G.particules.filter((p) => p.vie > 0);
  G.particules.forEach((p) => {
    c.globalAlpha = Math.max(0, Math.min(1, p.vie / p.max * 1.5));
    c.fillStyle = p.coul;
    if (p.confetti) { c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillRect(-p.t / 2, -p.t, p.t, p.t * 2); c.restore(); }
    else { c.beginPath(); c.arc(p.x, p.y, p.t, 0, TAU); c.fill(); }
  });
  c.globalAlpha = 1;
}
function boucle(t) {
  try {
    if (ecran === 'titre') dessinerTitre(t / 1000);
    else if (ecran === 'jeu' && G) dessinerJeu(t);
    else if (ecran === 'garde') dessinerApercu(t / 1000);
    if (demo && ouverte('voile-neuf')) dessinerDemo(t);
  } catch (e) {
    console.error(e);
  }
  requestAnimationFrame(boucle);
}

/* ---- Commandes ----------------------------------------------------------- */
$('plateau').addEventListener('pointerdown', (e) => {
  if (!G) return;
  e.preventDefault();
  const k = caseSous(e);
  G.clavier = false;
  if (k) agir(k.x, k.y);
});
$('btn-tourner').addEventListener('click', faireTourner);
$('btn-indice').addEventListener('click', indice);
$('btn-etabli').addEventListener('click', ouvrirEtabli);
$('etabli-fermer').addEventListener('click', () => { son('clic'); fermer('voile-etabli'); });
$('btn-pause').addEventListener('click', () => { initAudio(); son('clic'); mettrePause(); });
$('p-reprendre').addEventListener('click', () => { son('clic'); reprendre(); });
$('p-recommencer').addEventListener('click', () => { son('clic'); fermer('voile-pause'); lancerNiveau(G.n); });
$('p-missions').addEventListener('click', () => { son('clic'); fermer('voile-pause'); G.pause = false; montrer('missions'); });
$('p-accueil').addEventListener('click', () => { son('clic'); fermer('voile-pause'); G.pause = false; montrer('titre'); });
$('neuf-ok').addEventListener('click', () => { initAudio(); son('clic'); finNeuf(); });
$('bulle').addEventListener('click', () => {
  if (!G || G.fini || G.test) return;
  initAudio();
  const cles = G.niv.neuf.filter((k) => k !== 'roue');
  if (G.niv.neuf.includes('roue')) tutoRoue();
  else if (cles.length) montrerNeuf(cles);
  else toast(tr('toast.bulle'));
});
document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
document.querySelectorAll('.btn-retour').forEach((b) => b.addEventListener('click', () => { initAudio(); son('clic'); montrer('titre'); }));
$('btn-missions').addEventListener('click', () => { initAudio(); son('clic'); montrer('missions'); });
$('btn-carnet').addEventListener('click', () => { initAudio(); son('clic'); montrer('carnet'); });
$('btn-garde').addEventListener('click', () => { initAudio(); son('clic'); montrer('garde'); });
$('btn-jouer').addEventListener('click', () => {
  initAudio(); son('clic');
  window.JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      fusionner(d);
      const n = Math.max(1, Math.floor(d.niveau) || 1);
      if (n > NIVEAUX.length) montrer('missions'); else lancerNiveau(n - 1);
    },
    onNouvelle: () => lancerNiveau(0),
  });
});
// Sauvegarde à la fermeture de la page, seulement pendant une mission.
window.JEL_SAVE.surFermeture(() => {
  if (ecran === 'jeu' && G && !G.fini) sauverPartie(G.n + 1);
});

document.addEventListener('keydown', (e) => {
  const k = e.code;
  if (ouverte('voile-neuf')) { if (k === 'Escape') { e.preventDefault(); finNeuf(); } return; }
  if (tuto && (k === 'Space' || k === 'Enter' || k === 'Escape')) { e.preventDefault(); arreterTuto(); return; }
  if (ouverte('voile-etabli')) { if (k === 'Escape') { e.preventDefault(); fermer('voile-etabli'); } return; }
  if (ouverte('voile-pause')) { if (k === 'Escape' || k === 'KeyP') { e.preventDefault(); reprendre(); } return; }
  if (ouverte('voile-fin')) return;
  if (ecran !== 'jeu' || !G) {
    if (ecran !== 'titre' && k === 'Escape') { e.preventDefault(); montrer('titre'); }
    return;
  }
  if (k === 'Escape' || k === 'KeyP') { e.preventDefault(); initAudio(); mettrePause(); return; }
  const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[k];
  if (dir) {
    e.preventDefault();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (!G.clavier) { G.clavier = true; return; }
    G.curseur.x = Math.max(0, Math.min(G.plan.w - 1, G.curseur.x + dir[0]));
    G.curseur.y = Math.max(0, Math.min(G.plan.h - 1, G.curseur.y + dir[1]));
    son('clic');
    return;
  }
  const actif = document.activeElement;
  if ((k === 'Enter' || k === 'Space') && actif && actif.tagName === 'BUTTON') return; // le bouton a le focus
  if (k === 'Enter' || k === 'Space') { e.preventDefault(); G.clavier = true; agir(G.curseur.x, G.curseur.y); return; }
  if (k === 'KeyF' || k === 'KeyT') { e.preventDefault(); faireTourner(); return; }
  if (k === 'KeyI' || k === 'KeyH') { e.preventDefault(); indice(); return; }
  if (k === 'KeyE' || k === 'KeyB') { if (G.matsVus.length) { e.preventDefault(); ouvrirEtabli(); } return; }
  if (k === 'KeyR') {
    e.preventDefault();
    if (G.outil === 'axe' || G.outil === 'prisme') choisirOutil(G.outil);
    return;
  }
  const m = /^(?:Digit|Numpad)([1-9])$/.exec(k);
  if (m) {
    const outils = [...G.piecesVues, 'main'];
    const p = outils[Number(m[1]) - 1];
    if (p) { e.preventDefault(); choisirOutil(p); }
  }
});

/* ---- Démarrage ----------------------------------------------------------- */
document.title = tr('titre');
chargerProgres();
majBoutonsSon();
majTitre();
requestAnimationFrame(boucle);
</script>
