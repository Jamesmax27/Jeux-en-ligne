<script>
(() => {
  'use strict';
  // =====================================================================
  //  Outils
  // =====================================================================
  const I = window.JEL_I18N;
  const T = (cle, v) => I.t(cle, v);
  const NB = (x) => I.nombre(x);
  const $ = (id) => document.getElementById(id);
  const JEU = 'les-fleches-qui-bougent';
  const CLE_PROGRES = 'les-fleches-qui-bougent-progres';

  // Hasard à graine fixe : un niveau est le même pour tout le monde.
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let z = Math.imul(a ^ (a >>> 15), 1 | a);
      z = (z + Math.imul(z ^ (z >>> 7), 61 | z)) ^ z;
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Directions : 0 haut, 1 droite, 2 bas, 3 gauche.
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  const cle = (x, y) => x + ',' + y;
  const dirEntre = (a, b) => (b[0] > a[0] ? 1 : b[0] < a[0] ? 3 : b[1] > a[1] ? 2 : 0);

  // =====================================================================
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // =====================================================================
  let ctxAudio = null, premierGeste = false;
  let prog = { etoiles: [], records: [], debloque: 1, tutos: {}, son: true };
  function audio() {
    if (!ctxAudio) { try { ctxAudio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctxAudio = null; } }
    if (ctxAudio && ctxAudio.state === 'suspended') ctxAudio.resume().catch(() => {});
    return ctxAudio;
  }
  function bip(freq, duree, type, vol, glisse, delai) {
    if (!prog.son || !premierGeste) return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + (delai || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + glisse), t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0 + duree + 0.05);
  }
  let tamponBruit = null;
  function bruit(duree, vol, freq, delai) {
    if (!prog.son || !premierGeste) return;
    const a = audio(); if (!a) return;
    if (!tamponBruit) {
      tamponBruit = a.createBuffer(1, a.sampleRate, a.sampleRate);
      const d = tamponBruit.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t0 = a.currentTime + (delai || 0);
    const s = a.createBufferSource(); s.buffer = tamponBruit;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
    const g = a.createGain();
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t0); s.stop(t0 + duree + 0.05);
  }
  const SON = {
    clic: () => bip(660, 0.07, 'triangle', 0.09),
    sortie: (serie) => { const f = 420 * Math.pow(1.122, Math.min(8, serie - 1)); bip(f, 0.2, 'triangle', 0.12, f * 0.9); bruit(0.2, 0.05, 2600); },
    choc: () => { bip(150, 0.25, 'square', 0.1, -70); bruit(0.16, 0.14, 500); },
    coeurPerdu: () => { bip(560, 0.14, 'sine', 0.11, -200, 0.1); bip(350, 0.26, 'sine', 0.11, -120, 0.24); },
    coeurGagne: () => { [660, 880, 1100].forEach((f, k) => bip(f, 0.12, 'sine', 0.11, 0, k * 0.08)); },
    glace: () => { bruit(0.12, 0.14, 5200); bip(1900, 0.09, 'triangle', 0.06, -700); },
    feuilles: () => { bruit(0.4, 0.09, 1600); bruit(0.3, 0.05, 3200, 0.08); },
    terrier: () => { bip(260, 0.22, 'sine', 0.12, 520); },
    tic: () => bip(1250, 0.04, 'square', 0.05),
    victoire: () => { [523, 659, 784, 1046].forEach((f, k) => bip(f, 0.24, 'triangle', 0.12, 0, k * 0.11)); },
    defaite: () => { [392, 330, 262].forEach((f, k) => bip(f, 0.32, 'sine', 0.11, 0, k * 0.17)); },
    etoile: (k) => bip(880 + k * 220, 0.16, 'triangle', 0.11),
    indice: () => { bip(990, 0.1, 'sine', 0.07); bip(1320, 0.12, 'sine', 0.07, 0, 0.08); },
  };

  // =====================================================================
  //  Jardins (décors) et couleurs des flèches
  // =====================================================================
  const MONDES = [
    { ciel: ['#bfe9ff', '#a5dd8f'], cadre: '#7a5534', c1: '#9fd77f', c2: '#8fcd70', deco: '#ffffff', motif: 'fleur' },
    { ciel: ['#ffe3c4', '#b6e08f'], cadre: '#6f4a2c', c1: '#b8e08e', c2: '#a8d47c', deco: '#ff6b6b', motif: 'fleur' },
    { ciel: ['#c6f1ff', '#8fd6c9'], cadre: '#5b6b7a', c1: '#a9e3d6', c2: '#97d8ca', deco: '#ffffff', motif: 'bulle' },
    { ciel: ['#e3f4ff', '#bfdcf2'], cadre: '#5a7590', c1: '#d6ecfa', c2: '#c7e2f5', deco: '#ffffff', motif: 'flocon' },
    { ciel: ['#ffe0f3', '#c8e7a7'], cadre: '#7b4f6f', c1: '#d3ecb6', c2: '#c4e3a3', deco: '#ff9ad5', motif: 'fleur' },
    { ciel: ['#d9f2c4', '#86c06b'], cadre: '#4f3a22', c1: '#a5d48a', c2: '#97c97c', deco: '#2f7d3a', motif: 'feuille' },
    { ciel: ['#ffe2b8', '#e3a25e'], cadre: '#5e3a1e', c1: '#f2cf96', c2: '#ebc283', deco: '#d9641c', motif: 'feuille' },
    { ciel: ['#e9f5d0', '#b9d98b'], cadre: '#6b4b30', c1: '#cfe6a6', c2: '#c1dc94', deco: '#ffffff', motif: 'fleur' },
    { ciel: ['#9fb4c9', '#6d8aa3'], cadre: '#3d4c5c', c1: '#b6c9d6', c2: '#a8bdcc', deco: '#e8f2ff', motif: 'goutte' },
    { ciel: ['#e8f7ff', '#9cc9e6'], cadre: '#46627d', c1: '#e0f1fb', c2: '#d0e8f6', deco: '#ffffff', motif: 'flocon' },
    { ciel: ['#efe0ff', '#b79be0'], cadre: '#5a3f7a', c1: '#ddcdf2', c2: '#d1bfea', deco: '#8a5fd1', motif: 'fleur' },
    { ciel: ['#d6ecd2', '#7fa98a'], cadre: '#3e5446', c1: '#b5d4b5', c2: '#a6c9a7', deco: '#dff5c4', motif: 'bulle' },
    { ciel: ['#ffd9b0', '#d98a5a'], cadre: '#6a3a22', c1: '#f3c69a', c2: '#ebb98a', deco: '#a8532a', motif: 'goutte' },
    { ciel: ['#1d2b55', '#2f6f6a'], cadre: '#1b2440', c1: '#3a5b7a', c2: '#34526f', deco: '#7dffcf', motif: 'etoile' },
    { ciel: ['#141a3a', '#3b2d6b'], cadre: '#120f2b', c1: '#3c3f7a', c2: '#34376e', deco: '#ffe58a', motif: 'etoile' },
  ];
  const COULEURS = [
    { clair: '#ff6b6b', fonce: '#b83a3a' }, { clair: '#ffa94d', fonce: '#c26a12' }, { clair: '#ffd43b', fonce: '#b38600' },
    { clair: '#69db7c', fonce: '#2b8a3e' }, { clair: '#38d9a9', fonce: '#0f8a66' }, { clair: '#4dabf7', fonce: '#1864ab' },
    { clair: '#9775fa', fonce: '#5f3dc4' }, { clair: '#f783ac', fonce: '#c2255c' }, { clair: '#a9e34b', fonce: '#5c940d' },
    { clair: '#66d9e8', fonce: '#0b7285' },
  ];
  const COULEUR_JUMELLES = [{ clair: '#ffffff', fonce: '#7a4fd6' }, { clair: '#ffffff', fonce: '#d6336c' }, { clair: '#ffffff', fonce: '#1c7ed6' }];
  const COULEURS_TERRIERS = ['#b07cff', '#29c5d6'];

  // =====================================================================
  //  Les 300 niveaux : réglages tirés du numéro, plateau produit par le
  //  générateur (graine fixe). Les nouveautés arrivent à des niveaux précis.
  // =====================================================================
  const NB_NIVEAUX = 300;
  const TUTOS_NIVEAU = {
    1: ['base'], 2: ['choc'], 6: ['coude'], 10: ['rocher'], 12: ['coeur'], 14: ['glace'], 17: ['jumelles'],
    23: ['haies'], 27: ['feuilles'], 30: ['defi'], 31: ['terriers'], 36: ['sablier'], 41: ['glace2'],
  };
  const ANNONCES = { 4: 'novLongues', 8: 'novRect', 21: 'novLongues', 81: 'novLongues', 161: 'novLongues', 151: 'novTerriers2' };

  function reglagesNiveau(i) {
    const n = i + 1, j = i % 20;
    const respire = n > 20 && j < 2; // début de jardin plus léger
    const P = {
      n, monde: Math.floor(i / 20), cols: 3, rows: 3, lenMin: 1, lenMax: 2, coude: 0, rochers: 0, coeur: 0,
      glace: 0, glace2: 0, jumelles: 0, haies: 0, feuilles: 0, terriers: 0, sablier: false, coeursMax: 3,
      remplir: 0.6, tous: false, bloque: false, melangeGlaceFeuilles: n > 120,
      durete: n < 4 ? 0 : Math.min(0.85, 0.15 + n / 160) - (respire ? 0.2 : 0),
    };
    // Taille du plateau
    let c, r;
    if (n <= 3) { c = 3; r = 3; }
    else if (n <= 7) { c = 4; r = 4; }
    else if (n <= 13) { c = 4; r = 5; }
    else if (n <= 16) { c = 5; r = 5; }
    else if (n <= 22) { c = 5; r = 6; }
    else if (n <= 40) { c = 5; r = 6 + (n % 2); }
    else if (n <= 60) { c = 6; r = 7 + (n % 2); }
    else if (n <= 120) { c = 6 + (n % 3 === 0 ? 1 : 0); r = 8 + (n % 2); }
    else if (n <= 200) { c = 7; r = 9 + (n % 2); }
    else { c = 8; r = 10 + (n % 2); }
    if (respire) r = Math.max(c, r - 1);
    if (n >= 8 && n <= 60 && n % 7 === 0 && c + 1 <= 8) { const tmp = c; c = Math.min(8, r); r = tmp; } // plateau couché de temps en temps
    P.cols = c; P.rows = r;
    // Longueur et forme des flèches
    P.lenMax = n < 4 ? 2 : n < 21 ? 3 : n < 81 ? 4 : n < 161 ? 5 : 6;
    P.lenMin = n < 61 ? 1 : 2;
    P.coude = n < 6 ? 0 : n < 8 ? 0.55 : 0.45;
    P.remplir = Math.min(0.92, 0.52 + n * 0.014) - (respire ? 0.1 : 0);
    if (n === 1) { P.tous = true; P.remplir = 0.5; }
    if (n === 2 || n === 3) P.bloque = true;
    const aire = c * r;
    // Cailloux
    if (n === 10 || n === 11) P.rochers = 2;
    else if (n > 11 && n % 3 !== 0) P.rochers = 1 + ((n * 7) % 3 === 0 ? 1 : 0) + Math.floor(aire / 40);
    // Cœur à ramasser
    if (n === 12 || n === 13) P.coeur = 1;
    else if (n > 13 && n % 4 === 0) P.coeur = 1;
    // Glace
    if (n >= 14 && n <= 16) P.glace = 2;
    else if (n > 16 && n % 2 === 0) P.glace = 1 + Math.floor(n / 70);
    if (n === 41 || n === 42) { P.glace = 2; P.glace2 = 2; }
    else if (n > 42 && P.glace && n % 3 === 1) P.glace2 = Math.ceil(P.glace / 2);
    // Jumelles
    if (n >= 17 && n <= 19) P.jumelles = 1;
    else if (n > 19 && n % 3 === 2) P.jumelles = 1 + (n > 120 ? 1 : 0);
    // Haies
    if (n === 23 || n === 24) P.haies = 2;
    else if (n > 24 && n % 4 === 1) P.haies = 2 + (n > 150 ? 1 : 0);
    // Feuilles
    if (n >= 27 && n <= 29) P.feuilles = 2;
    else if (n > 29 && (n % 5 === 2 || n % 5 === 4)) P.feuilles = 2 + Math.floor(n / 80);
    // Terriers
    if (n >= 31 && n <= 33) P.terriers = 1;
    else if (n > 33 && n % 4 === 3) P.terriers = 1 + (n > 150 && n % 8 === 7 ? 1 : 0);
    // Sablier
    if (n >= 36 && n <= 38) P.sablier = true;
    else if (n > 38 && (n % 5 === 1 || (n > 150 && n % 5 === 3))) P.sablier = true;
    // Défi : un seul cœur
    if (n >= 30 && n % 10 === 0) { P.coeursMax = 1; P.sablier = false; }
    if (respire) { P.sablier = false; P.jumelles = Math.min(P.jumelles, 1); }
    return P;
  }
  const NIVEAUX = [];
  for (let i = 0; i < NB_NIVEAUX; i++) NIVEAUX.push(reglagesNiveau(i));
  window.JEL_NIVEAUX = NIVEAUX.length;

  // =====================================================================
  //  Le plateau : cases, flèches, cailloux, haies, terriers, cœurs
  // =====================================================================
  function creerPlateau(cols, rows) {
    return {
      cols, rows, occ: new Int16Array(cols * rows).fill(-1), rochers: new Set(), haies: new Set(),
      terriers: [], terrierDe: new Map(), objets: new Map(), fleches: [],
    };
  }
  const dedans = (p, x, y) => x >= 0 && y >= 0 && x < p.cols && y < p.rows;
  const caseLibre = (p, x, y) => dedans(p, x, y) && p.occ[y * p.cols + x] < 0 && !p.rochers.has(cle(x, y)) && !p.terrierDe.has(cle(x, y));
  function ajouterTerrier(p, a, b, k) {
    p.terriers.push({ a, b, couleur: COULEURS_TERRIERS[k % 2] });
    p.terrierDe.set(cle(a[0], a[1]), b);
    p.terrierDe.set(cle(b[0], b[1]), a);
  }
  function nouvelleFleche(p, cells, dir) {
    return {
      id: p.fleches.length, cells: cells.map((q) => [q[0], q[1]]), dir, couleur: 0, glace: 0, feuilles: 0, jumeau: -1,
      etat: 'repos', s: 0, v: 0, piste: null, cible: 0, flash: 0, trem: 0, app: 1, pChoc: false, ramasse: 0,
    };
  }
  function placer(p, f) {
    f.id = p.fleches.length; p.fleches.push(f);
    for (const [x, y] of f.cells) p.occ[y * p.cols + x] = f.id;
  }
  function liberer(p, f) { for (const [x, y] of f.cells) if (p.occ[y * p.cols + x] === f.id) p.occ[y * p.cols + x] = -1; }
  function retirerDerniere(p) { const f = p.fleches.pop(); liberer(p, f); }

  // Route d'une flèche, de sa pointe jusqu'au bord (ou jusqu'à l'obstacle).
  // piste : cases traversées ; [x, y, true] = arrivée par un terrier.
  function rayon(p, f) {
    const tete = f.cells[f.cells.length - 1];
    let x = tete[0], y = tete[1];
    const d = f.dir, piste = [];
    for (let k = 0; k < 120; k++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (!dedans(p, nx, ny)) {
        if (p.haies.has(x + ',' + y + ',' + d)) return { libre: false, piste, obstacle: { type: 'haie', x: nx, y: ny } };
        return { libre: true, piste, sortie: [x, y] };
      }
      const kk = cle(nx, ny);
      if (p.rochers.has(kk)) return { libre: false, piste, obstacle: { type: 'rocher', x: nx, y: ny } };
      const o = p.occ[ny * p.cols + nx];
      if (o >= 0) return { libre: false, piste, obstacle: { type: 'fleche', id: o, x: nx, y: ny } };
      piste.push([nx, ny, false]);
      const autre = p.terrierDe.get(kk);
      if (autre) { piste.push([autre[0], autre[1], true]); x = autre[0]; y = autre[1]; }
      else { x = nx; y = ny; }
    }
    return { libre: false, piste: [], obstacle: { type: 'boucle', x, y } };
  }

  // Toucher une flèche. Renvoie ce qui se passe (feuilles, glace, sortie, choc).
  function lancer(p, f) {
    if (f.etat !== 'repos') return null;
    if (f.feuilles > 0) { f.feuilles = 0; return { type: 'feuilles', f }; }
    if (f.glace > 0) { f.glace--; return { type: 'glace', f }; }
    const groupe = f.jumeau >= 0 ? [f, p.fleches[f.jumeau]] : [f];
    if (groupe.some((g) => g.etat !== 'repos')) return null;
    const routes = groupe.map((g) => rayon(p, g));
    const ok = routes.every((r) => r.libre);
    let recul = Infinity;
    if (!ok) routes.forEach((r) => { if (!r.libre) recul = Math.min(recul, r.piste.length + 0.34); });
    groupe.forEach((g, k) => {
      const r = routes[k], L = g.cells.length;
      g.piste = g.cells.map((q) => [q[0], q[1], false]).concat(r.piste);
      g.s = 0; g.v = ok ? 4 : 12; g.ramasse = L;
      if (r.libre) {
        // cases imaginaires après le bord : la flèche sort entièrement
        let [x, y] = r.sortie;
        for (let m = 0; m <= L + 1; m++) { x += DX[g.dir]; y += DY[g.dir]; g.piste.push([x, y, false]); }
      } else g.piste.push([r.obstacle.x, r.obstacle.y, false]);
      if (ok) {
        g.cible = g.piste.length - L;
        g.etat = 'sort';
        liberer(p, g);
      } else {
        // la jumelle dont la route est libre avance aussi un peu, puis revient
        const ob = r.libre ? null : r.obstacle;
        g.cible = recul;
        g.etat = 'aller';
        g.pChoc = k === 0;
        g.obstacle = ob;
      }
    });
    return { type: ok ? 'sortie' : 'choc', groupe };
  }

  // Avance les flèches en mouvement. ev(type, donnees) signale ce qui arrive.
  function majPlateau(p, dt, ev) {
    for (const f of p.fleches) {
      if (f.app < 1) f.app = Math.min(1, f.app + dt * 3);
      if (f.flash > 0) f.flash = Math.max(0, f.flash - dt);
      if (f.trem > 0) f.trem = Math.max(0, f.trem - dt);
      if (f.etat === 'sort') {
        f.v = Math.min(24, f.v + 70 * dt);
        f.s += f.v * dt;
        const L = f.cells.length;
        const tete = Math.floor(f.s + L - 1 + 0.5);
        while (f.ramasse <= tete && f.ramasse < f.piste.length) {
          const q = f.piste[f.ramasse];
          const kk = cle(q[0], q[1]);
          if (q[2]) ev('terrier', { f, q });
          if (p.objets.get(kk) === 'coeur') { p.objets.delete(kk); ev('coeur', { f, x: q[0], y: q[1] }); }
          f.ramasse++;
        }
        if (f.s >= f.cible) { f.etat = 'parti'; ev('parti', { f }); }
      } else if (f.etat === 'aller') {
        f.s += f.v * dt;
        if (f.s >= f.cible) {
          f.s = f.cible; f.etat = 'retour'; f.trem = 0.35;
          if (f.pChoc) ev('choc', { f, obstacle: f.obstacle });
        }
      } else if (f.etat === 'retour') {
        f.s -= 7 * dt;
        if (f.s <= 0) { f.s = 0; f.etat = 'repos'; f.piste = null; }
      }
    }
  }
  const restantes = (p) => p.fleches.filter((f) => f.etat !== 'parti' && f.etat !== 'sort').length;
  const enMouvement = (p) => p.fleches.some((f) => f.etat === 'sort' || f.etat === 'aller' || f.etat === 'retour');

  // Une flèche qu'on peut toucher sans risque (indice, démonstrations).
  function trouverSure(p) {
    let secours = null;
    for (const f of p.fleches) {
      if (f.etat !== 'repos') continue;
      if (f.feuilles > 0 || f.glace > 0) { if (!secours) secours = f; continue; }
      const groupe = f.jumeau >= 0 ? [f, p.fleches[f.jumeau]] : [f];
      if (groupe.every((g) => g.etat === 'repos' && g.glace === 0 && g.feuilles === 0 && rayon(p, g).libre)) return f;
    }
    return secours;
  }

  // =====================================================================
  //  Générateur : chaque flèche posée a une route libre à ce moment-là ;
  //  les faire sortir dans l'ordre inverse vide toujours le plateau.
  // =====================================================================
  function essayer(P, rnd) {
    const p = creerPlateau(P.cols, P.rows);
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const melange = (t) => { const u = t.slice(); for (let k = u.length - 1; k > 0; k--) { const m = Math.floor(rnd() * (k + 1)); [u[k], u[m]] = [u[m], u[k]]; } return u; };
    const caseVide = () => {
      for (let k = 0; k < 80; k++) { const x = ri(0, p.cols - 1), y = ri(0, p.rows - 1); if (caseLibre(p, x, y)) return [x, y]; }
      return null;
    };
    // Terriers (jamais sur la même ligne ni la même colonne : pas de boucle)
    for (let k = 0; k < P.terriers; k++) {
      for (let e = 0; e < 60; e++) {
        const a = caseVide(), b = caseVide();
        if (!a || !b) break;
        if (a[0] === b[0] || a[1] === b[1] || Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) < 3) continue;
        if (p.terriers.some((tr) => [tr.a, tr.b].some((q) => q[0] === a[0] || q[1] === a[1] || q[0] === b[0] || q[1] === b[1]))) continue;
        ajouterTerrier(p, a, b, k); break;
      }
    }
    for (let k = 0; k < P.rochers; k++) { const c = caseVide(); if (c) p.rochers.add(cle(c[0], c[1])); }
    for (let k = 0; k < P.haies; k++) {
      const cote = ri(0, 3), lon = cote % 2 === 0 ? p.cols : p.rows;
      const len = ri(2, Math.min(3, lon - 1)), deb = ri(0, lon - len);
      for (let m = 0; m < len; m++) {
        const pos = deb + m;
        const x = cote === 0 || cote === 2 ? pos : cote === 1 ? p.cols - 1 : 0;
        const y = cote === 1 || cote === 3 ? pos : cote === 0 ? 0 : p.rows - 1;
        p.haies.add(x + ',' + y + ',' + cote);
      }
    }
    const routes = [];
    // Une flèche au hasard, posée seulement si sa route est libre.
    function pousser() {
      const debut = caseVide(); if (!debut) return null;
      const L = ri(P.lenMin, P.lenMax);
      const cells = [debut], prises = new Set([cle(debut[0], debut[1])]);
      let d = ri(0, 3);
      while (cells.length < L) {
        const [x, y] = cells[cells.length - 1];
        let options;
        if (cells.length === 1) options = melange([0, 1, 2, 3]);
        else if (P.coude <= 0) options = [d];
        else if (rnd() < P.coude) options = melange([(d + 1) % 4, (d + 3) % 4]).concat([d]);
        else options = [d].concat(melange([(d + 1) % 4, (d + 3) % 4]));
        let ok = false;
        for (const nd of options) {
          const nx = x + DX[nd], ny = y + DY[nd];
          if (caseLibre(p, nx, ny) && !prises.has(cle(nx, ny))) { cells.push([nx, ny]); prises.add(cle(nx, ny)); d = nd; ok = true; break; }
        }
        if (!ok) break;
      }
      if (cells.length < P.lenMin) return null;
      let cands;
      if (cells.length === 1) cands = melange([0, 1, 2, 3]).map((dd) => ({ cells, dir: dd }));
      else {
        const n = cells.length, inv = cells.slice().reverse();
        cands = melange([{ cells, dir: dirEntre(cells[n - 2], cells[n - 1]) }, { cells: inv, dir: dirEntre(inv[n - 2], inv[n - 1]) }]);
      }
      // Dureté : plus le niveau avance, plus on garde la route la plus longue
      // (elle traverse le plateau et crée des dépendances entre flèches).
      const longue = rnd() < P.durete;
      let choix = null;
      for (const c of cands) {
        const f = nouvelleFleche(p, c.cells, c.dir);
        placer(p, f);
        const r = rayon(p, f);
        retirerDerniere(p);
        if (!r.libre) continue;
        if (!choix || r.piste.length > choix.r.piste.length) choix = { c, r };
        if (!longue) break;
      }
      if (!choix) return null;
      if (longue && choix.r.piste.length === 0 && rnd() < 0.6) return null; // pointe collée au bord : souvent refusée
      const f = nouvelleFleche(p, choix.c.cells, choix.c.dir);
      placer(p, f);
      f.couleur = ri(0, COULEURS.length - 1);
      routes.push(choix.r.piste);
      return f;
    }
    const total = p.cols * p.rows - p.rochers.size - 2 * p.terriers.length;
    const cible = Math.floor(total * P.remplir);
    let rempli = 0, jum = 0;
    for (let a = 0; a < total * 14 && rempli < cible; a++) {
      const f = pousser();
      if (!f) continue;
      rempli += f.cells.length;
      if (jum < P.jumelles && rnd() < 0.45) {
        for (let e = 0; e < 25; e++) {
          const g = pousser();
          if (!g) continue;
          if (rayon(p, f).libre) {
            f.jumeau = g.id; g.jumeau = f.id; f.couleur = g.couleur = 100 + jum;
            rempli += g.cells.length; jum++;
            break;
          }
          retirerDerniere(p); routes.pop();
        }
      }
    }
    // Glace et feuilles sur des flèches seules (pas sur les jumelles)
    const seules = melange(p.fleches.filter((f) => f.jumeau < 0));
    let k = 0;
    for (let g = 0; g < P.glace && k < seules.length; g++, k++) seules[k].glace = g < P.glace2 ? 2 : 1;
    if (P.melangeGlaceFeuilles) k = Math.floor(k / 2);
    for (let g = 0; g < P.feuilles && k < seules.length; g++, k++) seules[k].feuilles = 1;
    // Cœur à ramasser : sur une case vide qu'une route traverse forcément
    let coeurOk = P.coeur === 0;
    if (P.coeur) {
      const cases = melange(routes.flat().filter((q) => caseLibre(p, q[0], q[1])));
      if (cases.length) { p.objets.set(cle(cases[0][0], cases[0][1]), 'coeur'); coeurOk = true; }
    }
    p.remplissage = rempli / Math.max(1, total);
    p.complet = jum >= P.jumelles && coeurOk && p.fleches.length >= 3 && p.terriers.length >= P.terriers;
    return p;
  }
  function genererNiveau(index) {
    const P = NIVEAUX[index];
    let meilleur = null, note = -1;
    for (let essai = 0; essai < 40; essai++) {
      const p = essayer(P, mulberry32(index * 9973 + essai * 131 + 17));
      const libres = p.fleches.filter((f) => rayon(p, f).libre).length;
      if (P.tous && libres < p.fleches.length) continue;
      if (P.bloque && libres === p.fleches.length) continue;
      const n = p.remplissage + (p.complet ? 1 : 0);
      if (n > note) { meilleur = p; note = n; }
      if (p.complet && p.remplissage >= P.remplir - 0.1) break;
    }
    if (!meilleur) meilleur = essayer(P, mulberry32(index + 5));
    meilleur.fleches.forEach((f, k) => { f.app = -k * 0.06; });
    return meilleur;
  }

  // =====================================================================
  //  Dessin
  // =====================================================================
  const toile = $('toile');
  const ctx = toile.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function cheminCoeur(c, x, y, r) {
    c.beginPath();
    c.moveTo(x, y + r * 0.9);
    c.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.75, y - r * 1.15, x, y - r * 0.45);
    c.bezierCurveTo(x + r * 0.75, y - r * 1.15, x + r * 1.4, y - r * 0.1, x, y + r * 0.9);
    c.closePath();
  }
  function cheminEtoile(c, x, y, r) {
    c.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rr2 = k % 2 ? r * 0.45 : r;
      const px = x + Math.cos(a) * rr2, py = y + Math.sin(a) * rr2;
      k ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  }
  const couleurDe = (f) => (f.couleur >= 100 ? COULEUR_JUMELLES[(f.couleur - 100) % COULEUR_JUMELLES.length] : COULEURS[f.couleur % COULEURS.length]);

  // Fond du jardin : dégradé et petits motifs qui flottent
  function dessinerFond(c, w, h, monde, temps) {
    const M = MONDES[monde];
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, M.ciel[0]); g.addColorStop(1, M.ciel[1]);
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // collines
    c.fillStyle = 'rgba(255,255,255,0.14)';
    c.beginPath(); c.moveTo(0, h * 0.78);
    for (let x = 0; x <= w; x += 20) c.lineTo(x, h * 0.78 - Math.sin(x / 90 + monde) * 22 - 12);
    c.lineTo(w, h); c.lineTo(0, h); c.fill();
    const rnd = mulberry32(monde * 77 + 3);
    c.fillStyle = M.deco; c.strokeStyle = M.deco;
    for (let k = 0; k < 26; k++) {
      const x = rnd() * w, y = (rnd() * h + temps * (8 + rnd() * 10) * (M.motif === 'goutte' || M.motif === 'flocon' ? 1 : 0)) % h;
      const s = 3 + rnd() * 5, a = 0.25 + 0.35 * Math.abs(Math.sin(temps * 0.8 + k));
      c.globalAlpha = a;
      if (M.motif === 'fleur') { for (let q = 0; q < 5; q++) { c.beginPath(); c.arc(x + Math.cos(q * 1.256) * s, y + Math.sin(q * 1.256) * s, s * 0.6, 0, 7); c.fill(); } }
      else if (M.motif === 'etoile') { cheminEtoile(c, x, y, s); c.fill(); }
      else if (M.motif === 'flocon') { c.lineWidth = 1.5; for (let q = 0; q < 3; q++) { c.beginPath(); c.moveTo(x - Math.cos(q * 1.047) * s, y - Math.sin(q * 1.047) * s); c.lineTo(x + Math.cos(q * 1.047) * s, y + Math.sin(q * 1.047) * s); c.stroke(); } }
      else if (M.motif === 'feuille') { c.beginPath(); c.ellipse(x, y, s * 1.2, s * 0.55, k, 0, 7); c.fill(); }
      else if (M.motif === 'goutte') { c.beginPath(); c.ellipse(x, y, s * 0.35, s, 0, 0, 7); c.fill(); }
      else { c.beginPath(); c.arc(x, y, s * 0.8, 0, 7); c.lineWidth = 1.5; c.stroke(); }
    }
    c.globalAlpha = 1;
  }

  // Lignes du corps d'une flèche entre les positions s et e de sa piste
  function lignesCorps(P, s, e) {
    const at = (u) => {
      const k = Math.max(0, Math.min(P.length - 1, Math.floor(u))), fr = u - k;
      const a = P[k], b = P[Math.min(k + 1, P.length - 1)];
      if (b[2]) return fr < 0.5 ? [a[0], a[1]] : [b[0], b[1]];
      return [a[0] + (b[0] - a[0]) * fr, a[1] + (b[1] - a[1]) * fr];
    };
    const pts = [at(s)];
    for (let k = Math.floor(s) + 1; k <= Math.floor(e); k++) if (k > s && k < e) pts.push([P[k][0], P[k][1]]);
    if (e > s) pts.push(at(e));
    const lignes = []; let cur = [];
    for (const q of pts) {
      const prec = cur[cur.length - 1];
      if (prec && Math.hypot(q[0] - prec[0], q[1] - prec[1]) > 1.01) { lignes.push(cur); cur = []; }
      if (!prec || q[0] !== prec[0] || q[1] !== prec[1] || cur.length === 0) cur.push(q);
    }
    if (cur.length) lignes.push(cur);
    return lignes;
  }

  function dessinerFleche(c, f, G, o) {
    const cs = G.cs, L = f.cells.length;
    const P = f.piste || f.cells.map((q) => [q[0], q[1], false]);
    const s = f.s, e = s + L - 1;
    let lignes = lignesCorps(P, s, e);
    // flèche d'une case : une petite tige derrière la pointe
    if (L === 1 && lignes.length === 1 && lignes[0].length === 1) {
      const q = lignes[0][0];
      lignes = [[[q[0] - DX[f.dir] * 0.24, q[1] - DY[f.dir] * 0.24], [q[0] + DX[f.dir] * 0.02, q[1] + DY[f.dir] * 0.02]]];
    }
    const tr = f.trem > 0 ? Math.sin(f.trem * 60) * cs * 0.05 : 0;
    const px = (q) => [G.ox + (q[0] + 0.5) * cs + tr * (f.dir % 2 ? 1 : 0), G.oy + (q[1] + 0.5) * cs + tr * (f.dir % 2 ? 0 : 1)];
    const coul = couleurDe(f);
    const jum = f.couleur >= 100;
    c.globalAlpha = Math.max(0, Math.min(1, f.app));
    const lw = cs * 0.34;
    c.lineCap = 'round'; c.lineJoin = 'round';
    const trace = (larg, style) => {
      c.strokeStyle = style; c.lineWidth = larg;
      for (const l of lignes) {
        c.beginPath();
        l.forEach((q, k) => { const [X, Y] = px(q); if (k) c.lineTo(X, Y); else c.moveTo(X, Y); });
        if (l.length === 1) { const [X, Y] = px(l[0]); c.lineTo(X + 0.01, Y); }
        c.stroke();
      }
    };
    if (o.indice) trace(lw + cs * 0.34 * (0.7 + 0.3 * Math.sin(o.temps * 9)), 'rgba(255,236,90,0.8)');
    if (o.sel) trace(lw + cs * 0.26, '#ffffff');
    if (f.flash > 0) trace(lw + cs * 0.3, 'rgba(255,50,50,' + Math.min(0.85, f.flash * 2) + ')');
    trace(lw + cs * 0.1, coul.fonce);
    trace(lw, jum ? coul.fonce : coul.clair);
    if (jum) trace(lw * 0.42, '#ffffff');
    else trace(lw * 0.22, 'rgba(255,255,255,0.35)');
    // pointe
    const der = lignes[lignes.length - 1], tete = der[der.length - 1];
    const [hx, hy] = px(tete);
    const ux = DX[f.dir], uy = DY[f.dir], vx = -uy, vy = ux;
    c.beginPath();
    c.moveTo(hx + ux * cs * 0.45, hy + uy * cs * 0.45);
    c.lineTo(hx - ux * cs * 0.02 + vx * cs * 0.33, hy - uy * cs * 0.02 + vy * cs * 0.33);
    c.lineTo(hx - ux * cs * 0.02 - vx * cs * 0.33, hy - uy * cs * 0.02 - vy * cs * 0.33);
    c.closePath();
    c.fillStyle = jum ? coul.fonce : coul.clair; c.strokeStyle = coul.fonce; c.lineWidth = cs * 0.06;
    c.fill(); c.stroke();
    // plumes de la queue
    const prem = lignes[0], q0 = prem[0], q1 = prem[1] || null;
    let bx = -ux, by = -uy;
    if (q1) { const dx = q0[0] - q1[0], dy = q0[1] - q1[1], n = Math.hypot(dx, dy) || 1; bx = dx / n; by = dy / n; }
    const [tx, ty] = px(q0);
    c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = cs * 0.06;
    for (const sg of [-1, 1]) {
      c.beginPath();
      c.moveTo(tx - bx * cs * 0.05, ty - by * cs * 0.05);
      c.lineTo(tx + bx * cs * 0.2 + -by * sg * cs * 0.16, ty + by * cs * 0.2 + bx * sg * cs * 0.16);
      c.stroke();
    }
    // nœud des jumelles
    if (jum) {
      const mil = lignes[0][Math.floor((lignes[0].length - 1) / 2)];
      const [mx, my] = px(mil);
      const r = cs * 0.16;
      c.fillStyle = coul.fonce; c.strokeStyle = '#fff'; c.lineWidth = cs * 0.035;
      for (const sg of [-1, 1]) {
        c.beginPath(); c.moveTo(mx, my); c.lineTo(mx + sg * r * 1.6, my - r); c.lineTo(mx + sg * r * 1.6, my + r); c.closePath(); c.fill(); c.stroke();
      }
      c.beginPath(); c.arc(mx, my, r * 0.55, 0, 7); c.fillStyle = '#fff'; c.fill();
    }
    c.globalAlpha = 1;
  }

  function dessinerPlateau(c, p, G, o) {
    const M = MONDES[o.monde || 0], cs = G.cs;
    const Wp = p.cols * cs, Hp = p.rows * cs, pad = Math.max(6, cs * 0.16);
    c.save();
    c.translate(o.sx || 0, o.sy || 0);
    c.fillStyle = 'rgba(0,0,0,0.18)'; rr(c, G.ox - pad, G.oy - pad + 6, Wp + 2 * pad, Hp + 2 * pad, pad * 1.8); c.fill();
    c.fillStyle = M.cadre; rr(c, G.ox - pad, G.oy - pad, Wp + 2 * pad, Hp + 2 * pad, pad * 1.8); c.fill();
    for (let y = 0; y < p.rows; y++) for (let x = 0; x < p.cols; x++) {
      c.fillStyle = (x + y) % 2 ? M.c1 : M.c2;
      rr(c, G.ox + x * cs + 1.5, G.oy + y * cs + 1.5, cs - 3, cs - 3, cs * 0.18); c.fill();
    }
    // haies sur le bord
    for (const h of p.haies) {
      const [x, y, d] = h.split(',').map(Number);
      const cx = G.ox + (x + 0.5) * cs + DX[d] * (cs * 0.5 + pad * 0.5);
      const cy = G.oy + (y + 0.5) * cs + DY[d] * (cs * 0.5 + pad * 0.5);
      const ax = d % 2 ? 0 : 1, ay = d % 2 ? 1 : 0;
      for (let k = -1; k <= 1; k++) {
        c.beginPath(); c.arc(cx + ax * k * cs * 0.3, cy + ay * k * cs * 0.3, cs * 0.22, 0, 7);
        c.fillStyle = '#2f8f3a'; c.fill(); c.strokeStyle = '#1d5e25'; c.lineWidth = 2; c.stroke();
      }
      c.fillStyle = '#e8394a';
      for (let k = -1; k <= 1; k += 2) { c.beginPath(); c.arc(cx + ax * k * cs * 0.18 + ay * 3, cy + ay * k * cs * 0.18 - ax * 3, cs * 0.045, 0, 7); c.fill(); }
    }
    // terriers
    for (const tr of p.terriers) for (const q of [tr.a, tr.b]) {
      const X = G.ox + (q[0] + 0.5) * cs, Y = G.oy + (q[1] + 0.5) * cs;
      c.beginPath(); c.ellipse(X, Y, cs * 0.4, cs * 0.32, 0, 0, 7); c.fillStyle = tr.couleur; c.fill();
      c.beginPath(); c.ellipse(X, Y + cs * 0.03, cs * 0.3, cs * 0.22, 0, 0, 7); c.fillStyle = '#3b2a1d'; c.fill();
      c.beginPath(); c.ellipse(X, Y + cs * 0.08, cs * 0.22, cs * 0.12, 0, 0, 7); c.fillStyle = '#1e140c'; c.fill();
    }
    // cailloux
    for (const k of p.rochers) {
      const [x, y] = k.split(',').map(Number);
      const X = G.ox + (x + 0.5) * cs, Y = G.oy + (y + 0.5) * cs;
      c.beginPath(); c.ellipse(X, Y + cs * 0.06, cs * 0.38, cs * 0.3, 0, 0, 7); c.fillStyle = '#6f737b'; c.fill();
      c.beginPath(); c.ellipse(X - cs * 0.04, Y, cs * 0.34, cs * 0.26, 0, 0, 7); c.fillStyle = '#a3a7ae'; c.fill();
      c.beginPath(); c.ellipse(X - cs * 0.12, Y - cs * 0.09, cs * 0.1, cs * 0.06, -0.4, 0, 7); c.fillStyle = '#d4d7dc'; c.fill();
    }
    // cœurs à ramasser
    for (const [k, v] of p.objets) {
      if (v !== 'coeur') continue;
      const [x, y] = k.split(',').map(Number);
      const r = cs * (0.24 + 0.03 * Math.sin((o.temps || 0) * 5));
      cheminCoeur(c, G.ox + (x + 0.5) * cs, G.oy + (y + 0.52) * cs, r);
      c.fillStyle = '#ff4d6d'; c.fill(); c.strokeStyle = '#fff'; c.lineWidth = 2.5; c.stroke();
    }
    // flèches : au repos d'abord, en mouvement par-dessus
    const ordre = p.fleches.filter((f) => f.etat !== 'parti').sort((a, b) => (a.etat === 'repos' ? 0 : 1) - (b.etat === 'repos' ? 0 : 1));
    for (const f of ordre) dessinerFleche(c, f, G, { temps: o.temps, sel: o.sel === f.id, indice: o.indice === f.id });
    // glace et feuilles par-dessus
    for (const f of ordre) {
      if (f.etat !== 'repos' || f.app <= 0) continue;
      c.globalAlpha = Math.min(1, f.app);
      if (f.glace > 0) for (const [x, y] of f.cells) {
        const X = G.ox + x * cs, Y = G.oy + y * cs;
        c.fillStyle = f.glace > 1 ? 'rgba(120,190,255,0.72)' : 'rgba(200,236,255,0.6)';
        rr(c, X + cs * 0.06, Y + cs * 0.06, cs * 0.88, cs * 0.88, cs * 0.16); c.fill();
        c.strokeStyle = '#ffffff'; c.lineWidth = f.glace > 1 ? 3.5 : 2; c.stroke();
        c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(X + cs * 0.2, Y + cs * 0.35); c.lineTo(X + cs * 0.35, Y + cs * 0.2); c.stroke();
        if (f.glace > 1) { c.beginPath(); c.moveTo(X + cs * 0.6, Y + cs * 0.8); c.lineTo(X + cs * 0.8, Y + cs * 0.6); c.stroke(); }
      }
      if (f.feuilles > 0) for (const [x, y] of f.cells) {
        const X = G.ox + (x + 0.5) * cs, Y = G.oy + (y + 0.5) * cs;
        c.fillStyle = '#9a6430'; rr(c, X - cs * 0.52, Y - cs * 0.52, cs * 1.04, cs * 1.04, cs * 0.12); c.fill();
        const rnd = mulberry32(x * 31 + y * 7 + 1);
        const teintes = ['#d9641c', '#e8a02a', '#b84a1a', '#c9861f', '#8f5a1e'];
        for (let k = 0; k < 9; k++) {
          c.save(); c.translate(X + (rnd() - 0.5) * cs * 0.6, Y + (rnd() - 0.5) * cs * 0.6); c.rotate(rnd() * 6.3);
          c.beginPath(); c.ellipse(0, 0, cs * 0.26, cs * 0.13, 0, 0, 7); c.fillStyle = teintes[k % teintes.length]; c.fill();
          c.strokeStyle = 'rgba(80,40,10,0.5)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-cs * 0.22, 0); c.lineTo(cs * 0.22, 0); c.stroke();
          c.restore();
        }
      }
      c.globalAlpha = 1;
    }
    c.restore();
  }

  // Effets : étincelles, éclats, feuilles, cœurs, textes qui montent
  const particules = [], textes = [];
  function eclabousser(x, y, couleur, n, type) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 180;
      particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, vie: 0.6 + Math.random() * 0.6, max: 1.2, couleur, taille: 3 + Math.random() * 4, type: type || 'rond', rot: Math.random() * 6 });
    }
  }
  function confettis() {
    const cols = ['#ff6b6b', '#ffd43b', '#69db7c', '#4dabf7', '#9775fa', '#f783ac'];
    for (let k = 0; k < 90; k++) {
      particules.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.3, vx: (Math.random() - 0.5) * 80, vy: 80 + Math.random() * 120, vie: 3, max: 3, couleur: cols[k % cols.length], taille: 5 + Math.random() * 4, type: 'confetti', rot: Math.random() * 6 });
    }
  }
  function texteMontant(x, y, texte, couleur) { textes.push({ x, y, texte, couleur: couleur || '#fff', vie: 1.2 }); }
  function majEffets(dt) {
    for (let k = particules.length - 1; k >= 0; k--) {
      const q = particules[k];
      q.vie -= dt; if (q.vie <= 0) { particules.splice(k, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.rot += dt * 5;
      if (q.type === 'confetti' || q.type === 'feuille') { q.vx *= 0.99; q.x += Math.sin(q.rot) * 0.6; }
      else q.vy += 320 * dt;
    }
    for (let k = textes.length - 1; k >= 0; k--) { const q = textes[k]; q.vie -= dt; q.y -= 40 * dt; if (q.vie <= 0) textes.splice(k, 1); }
  }
  function dessinerEffets(c) {
    for (const q of particules) {
      c.globalAlpha = Math.max(0, Math.min(1, q.vie / 0.4));
      c.fillStyle = q.couleur;
      if (q.type === 'etoile') { cheminEtoile(c, q.x, q.y, q.taille * 1.4); c.fill(); }
      else if (q.type === 'confetti' || q.type === 'eclat') { c.save(); c.translate(q.x, q.y); c.rotate(q.rot); c.fillRect(-q.taille / 2, -q.taille / 4, q.taille, q.taille / 2); c.restore(); }
      else if (q.type === 'feuille') { c.save(); c.translate(q.x, q.y); c.rotate(q.rot); c.beginPath(); c.ellipse(0, 0, q.taille * 1.4, q.taille * 0.6, 0, 0, 7); c.fill(); c.restore(); }
      else if (q.type === 'coeur') { cheminCoeur(c, q.x, q.y, q.taille * 1.6); c.fill(); }
      else { c.beginPath(); c.arc(q.x, q.y, q.taille, 0, 7); c.fill(); }
    }
    c.globalAlpha = 1;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const q of textes) {
      c.globalAlpha = Math.min(1, q.vie / 0.4);
      c.font = '900 ' + Math.round(Math.min(30, W / 13)) + 'px system-ui, sans-serif';
      c.lineWidth = 5; c.strokeStyle = 'rgba(30,40,60,0.75)'; c.strokeText(q.texte, q.x, q.y);
      c.fillStyle = q.couleur; c.fillText(q.texte, q.x, q.y);
    }
    c.globalAlpha = 1;
  }

  // =====================================================================
  //  Progression (étoiles, records, niveaux ouverts) et sauvegarde
  // =====================================================================
  function chargerProgres() {
    try {
      const brut = localStorage.getItem(CLE_PROGRES);
      if (brut) {
        const d = JSON.parse(brut);
        if (d && typeof d === 'object') {
          if (Array.isArray(d.etoiles)) prog.etoiles = d.etoiles.map((x) => Math.max(0, Math.min(3, x | 0)));
          if (Array.isArray(d.records)) prog.records = d.records.map((x) => Math.max(0, x | 0));
          if (d.debloque) prog.debloque = Math.max(1, Math.min(NB_NIVEAUX, d.debloque | 0));
          if (d.tutos && typeof d.tutos === 'object') prog.tutos = d.tutos;
          if (typeof d.son === 'boolean') prog.son = d.son;
        }
      }
    } catch (e) { /* stockage indisponible : on commence à zéro */ }
    // La sauvegarde commune (marche aussi dans le cadre du site)
    const s = JEL_SAVE.load(JEU);
    if (typeof s.etoiles === 'string') for (let k = 0; k < s.etoiles.length && k < NB_NIVEAUX; k++) prog.etoiles[k] = Math.max(prog.etoiles[k] || 0, Number(s.etoiles[k]) || 0);
    if (Array.isArray(s.records)) s.records.forEach((x, k) => { if (k < NB_NIVEAUX) prog.records[k] = Math.max(prog.records[k] || 0, x | 0); });
    if (s.debloque) prog.debloque = Math.max(prog.debloque, Math.min(NB_NIVEAUX, s.debloque | 0));
    if (s.niveau) prog.debloque = Math.max(prog.debloque, Math.min(NB_NIVEAUX, s.niveau | 0));
    if (Array.isArray(s.tutos)) s.tutos.forEach((k) => { prog.tutos[k] = true; });
    if (s.options && typeof s.options.son === 'boolean') prog.son = s.options.son;
  }
  function ecrireLocal() { try { localStorage.setItem(CLE_PROGRES, JSON.stringify(prog)); } catch (e) { /* rien */ } }
  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + (b || 0), 0);
  const totalScore = () => prog.records.reduce((a, b) => a + (b || 0), 0);
  function donneesSauvegarde(niveau) {
    let et = '';
    for (let k = 0; k < NB_NIVEAUX; k++) et += String(prog.etoiles[k] || 0);
    return {
      niveau, score: totalScore(), etoiles: et.replace(/0+$/, ''), records: prog.records.map((x) => x || 0),
      debloque: prog.debloque, tutos: Object.keys(prog.tutos), options: { son: prog.son },
    };
  }
  function toutEffacer() {
    prog = { etoiles: [], records: [], debloque: 1, tutos: {}, son: prog.son };
    ecrireLocal(); majTitre();
  }

  // =====================================================================
  //  Partie
  // =====================================================================
  let etat = 'titre'; // titre | niveaux | jeu
  let J = null;       // niveau en cours
  let enPause = false, tutoOuvert = false;
  let G = { ox: 0, oy: 0, cs: 40 };
  let secousse = 0, temps = 0, minuteToast = 0, affScore = 0, scoreCible = 0, pageNiveaux = 0;

  function toast(texte, duree) { const el = $('toast'); el.textContent = texte; el.classList.add('visible'); minuteToast = duree || 2.4; }

  function montrer(id) {
    for (const el of document.querySelectorAll('.ecran')) el.hidden = el.id !== id;
  }

  function calculerGeo() {
    if (!J) return;
    const hud = $('hud');
    const haut = (hud.hidden ? 70 : hud.getBoundingClientRect().bottom) + 18;
    const bas = 22;
    const dispoL = W - 36, dispoH = H - haut - bas;
    const cs = Math.max(20, Math.min(76, Math.floor(Math.min(dispoL / J.p.cols, dispoH / J.p.rows))));
    G = { cs, ox: Math.round((W - J.p.cols * cs) / 2), oy: Math.round(haut + (dispoH - J.p.rows * cs) / 2) };
  }

  function lancerNiveau(index) {
    const P = NIVEAUX[index];
    const p = genererNiveau(index);
    const nbGlace = p.fleches.reduce((a, f) => a + f.glace, 0), nbFeuilles = p.fleches.filter((f) => f.feuilles).length;
    const parFleche = Math.max(2.6, 4.6 - P.n / 140);
    const tempsMax = P.sablier ? Math.round(12 + p.fleches.length * parFleche + nbGlace * 1.5 + nbFeuilles) : 0;
    J = {
      index, P, p, coeurs: P.coeursMax, coeursMax: P.coeursMax, score: 0, serie: 0, serieMax: 0, sorties: 0, chocs: 0,
      indice: -1, indiceUtilise: false, temps: tempsMax, tempsMax, fini: false, sel: -1, total: p.fleches.length, dernierTic: 99,
    };
    etat = 'jeu'; enPause = false;
    montrer(null);
    $('hud').hidden = false;
    $('hud-temps').hidden = !P.sablier;
    particules.length = 0; textes.length = 0;
    majHud(); calculerGeo();
    // Annonces : nouveau jardin, nouveautés, défi, sablier
    const annonces = [];
    if (index % 20 === 0 && index > 0) annonces.push(T('nouveauJardin', { nom: T('jardin' + (P.monde + 1)) }));
    if (ANNONCES[P.n]) annonces.push(T(ANNONCES[P.n]));
    if (P.coeursMax === 1) annonces.push(T('defiAnnonce'));
    else if (P.sablier) annonces.push(T('sablierAnnonce'));
    if (annonces.length) toast(annonces.join(' '), 3);
    const nouveaux = (TUTOS_NIVEAU[P.n] || []).filter((k) => !prog.tutos[k]);
    if (nouveaux.length) ouvrirTuto(nouveaux[0]);
  }

  function svgCoeur(plein) {
    return '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z" fill="' + (plein ? '#ff4d6d' : 'rgba(255,255,255,0.5)') + '" stroke="' + (plein ? '#a3162f' : '#6b7a8a') + '" stroke-width="1.6"/></svg>';
  }
  function majHud(anime) {
    if (!J) return;
    $('hud-niveau').textContent = T('niveau', { n: NB(J.index + 1) });
    const box = $('hud-coeurs');
    let h = '';
    for (let k = 0; k < J.coeursMax; k++) h += svgCoeur(k < J.coeurs);
    box.innerHTML = h;
    box.setAttribute('aria-label', T('coeursAria', { n: J.coeurs }));
    if (anime) {
      const el = box.children[anime === 'gagne' ? J.coeurs - 1 : J.coeurs];
      if (el) el.classList.add(anime === 'gagne' ? 'gagne' : 'brise');
    }
    const r = restantes(J.p);
    $('hud-fleches-n').textContent = NB(r);
    $('hud-fleches').setAttribute('aria-label', T('flechesRestantes', { n: r }));
    if (J.tempsMax) {
      const sec = Math.max(0, Math.ceil(J.temps));
      $('hud-temps-n').textContent = NB(sec);
      $('hud-temps').setAttribute('aria-label', T('tempsAria', { n: sec }));
      $('hud-temps').classList.toggle('presse', sec <= 10);
    }
  }

  const centreCase = (x, y) => [G.ox + (x + 0.5) * G.cs, G.oy + (y + 0.5) * G.cs];

  // Le joueur touche une flèche
  function jouerFleche(f) {
    if (!J || J.fini || enPause || tutoOuvert) return;
    const res = lancer(J.p, f);
    if (!res) return;
    if (J.indice === f.id || (res.groupe && res.groupe.some((g) => g.id === J.indice))) J.indice = -1;
    $('b-indice').classList.remove('brille');
    if (res.type === 'feuilles') {
      SON.feuilles();
      for (const [x, y] of f.cells) { const [X, Y] = centreCase(x, y); eclabousser(X, Y, '#d9641c', 6, 'feuille'); eclabousser(X, Y, '#e8a02a', 5, 'feuille'); }
    } else if (res.type === 'glace') {
      SON.glace();
      for (const [x, y] of f.cells) { const [X, Y] = centreCase(x, y); eclabousser(X, Y, '#dff4ff', 7, 'eclat'); }
      const [X, Y] = centreCase(f.cells[0][0], f.cells[0][1]);
      texteMontant(X, Y - G.cs * 0.4, T('crac'), '#dff4ff');
    } else if (res.type === 'sortie') {
      J.serie = Math.min(5, J.serie + 1);
      J.serieMax = Math.max(J.serieMax, J.serie);
      for (const g of res.groupe) { J.score += 10 * J.serie; J.sorties++; }
      SON.sortie(J.serie);
      if (J.serie >= 2) {
        const t = f.cells[f.cells.length - 1], [X, Y] = centreCase(t[0], t[1]);
        texteMontant(X, Y - G.cs * 0.5, T('serie', { n: J.serie }), '#ffe066');
      }
    } else {
      SON.clic();
    }
    majHud();
  }

  // Événements du plateau pendant la partie
  function evenementJeu(type, d) {
    if (!J) return;
    if (type === 'choc') {
      J.chocs++; J.serie = 0;
      J.coeurs = Math.max(0, J.coeurs - 1);
      secousse = 0.35;
      SON.choc(); SON.coeurPerdu();
      if (d.obstacle && d.obstacle.type === 'fleche') { const o = J.p.fleches[d.obstacle.id]; if (o) { o.flash = 0.5; o.trem = 0.3; } }
      const [X, Y] = centreCase(d.obstacle ? Math.max(0, Math.min(J.p.cols - 1, d.obstacle.x)) : 0, d.obstacle ? Math.max(0, Math.min(J.p.rows - 1, d.obstacle.y)) : 0);
      eclabousser(X, Y, '#ffffff', 10);
      texteMontant(X, Y - G.cs * 0.4, T('aie'), '#ffb3b3');
      majHud('brise');
      if (J.coeurs <= 0) perdre('coeurs');
    } else if (type === 'coeur') {
      const [X, Y] = centreCase(d.x, d.y);
      eclabousser(X, Y, '#ff4d6d', 14, 'coeur');
      J.score += 20;
      if (J.coeurs < J.coeursMax) {
        J.coeurs++; SON.coeurGagne(); texteMontant(X, Y - G.cs * 0.4, T('coeurGagne'), '#ffccd5'); majHud('gagne');
      } else { SON.coeurGagne(); texteMontant(X, Y - G.cs * 0.4, '+' + NB(20), '#ffccd5'); }
    } else if (type === 'terrier') {
      SON.terrier();
      const [X, Y] = centreCase(d.q[0], d.q[1]);
      eclabousser(X, Y, '#c9a0ff', 8);
    } else if (type === 'parti') {
      const f = d.f, L = f.cells.length;
      const q = f.piste[Math.min(f.piste.length - 1, f.piste.length - L - 1)];
      const X = Math.max(10, Math.min(W - 10, G.ox + (q[0] + 0.5) * G.cs)), Y = Math.max(10, Math.min(H - 10, G.oy + (q[1] + 0.5) * G.cs));
      eclabousser(X, Y, couleurDe(f).clair === '#ffffff' ? couleurDe(f).fonce : couleurDe(f).clair, 12, 'etoile');
      majHud();
      if (restantes(J.p) === 0 && !enMouvement(J.p)) gagner();
    }
  }

  function etoilesGagnees() {
    let e = J.coeursMax === 1 ? 3 : Math.max(1, 3 - J.chocs);
    if (J.indiceUtilise) e = Math.min(e, 2);
    return e;
  }

  function gagner() {
    if (J.fini) return;
    J.fini = true;
    const i = J.index;
    const bonusCoeurs = J.coeurs * 30, bonusTemps = J.tempsMax ? Math.ceil(J.temps) * 2 : 0;
    J.score += bonusCoeurs + bonusTemps;
    const et = etoilesGagnees();
    const ancien = prog.records[i] || 0;
    const nouveauRecord = J.score > ancien;
    prog.etoiles[i] = Math.max(prog.etoiles[i] || 0, et);
    prog.records[i] = Math.max(ancien, J.score);
    prog.debloque = Math.max(prog.debloque, Math.min(NB_NIVEAUX, i + 2));
    ecrireLocal();
    JEL_SAVE.save(JEU, donneesSauvegarde(Math.min(NB_NIVEAUX, i + 2)));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    SON.victoire(); confettis();
    setTimeout(() => afficherFin(true, { et, nouveauRecord, record: prog.records[i], bonusTemps }), 900);
  }

  function perdre(raison) {
    if (J.fini) return;
    J.fini = true;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: J.index + 1 });
    SON.defaite();
    setTimeout(() => afficherFin(false, { raison, record: prog.records[J.index] || 0 }), 850);
  }

  const SVG_ETOILE = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#ffcc33" stroke="#b07d00" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  function afficherFin(gagne, info) {

    $('fin-titre').textContent = T(gagne ? 'victoire' : 'defaite');
    $('fin-texte').textContent = gagne ? T('victoireTexte') : T(info.raison === 'temps' ? 'defaiteTemps' : 'defaiteCoeurs');
    const boite = $('fin-etoiles');
    boite.innerHTML = SVG_ETOILE + SVG_ETOILE + SVG_ETOILE;
    boite.hidden = !gagne;
    if (gagne) {
      boite.setAttribute('aria-label', T('etoilesAria', { n: info.et }));
      for (let k = 0; k < info.et; k++) setTimeout(() => { if (boite.children[k]) { boite.children[k].classList.add('on'); SON.etoile(k); } }, 350 + k * 380);
    }
    affScore = 0; scoreCible = J.score;
    $('fin-score').textContent = NB(0);
    const rec = $('fin-record');
    rec.classList.toggle('nouveau', !!(gagne && info.nouveauRecord));
    rec.textContent = gagne && info.nouveauRecord ? T('nouveauRecord') : T('record', { n: NB(info.record) });
    const lignes = [T('bilanSorties', { n: NB(J.sorties), max: NB(J.total) }), T('bilanSerie', { n: NB(J.serieMax) })];
    if (gagne) lignes.splice(1, 0, T('bilanCoeurs', { n: NB(J.coeurs) }));
    if (gagne && J.tempsMax) lignes.push(T('bilanTemps', { n: NB(Math.ceil(J.temps)) }));
    if (gagne && J.indiceUtilise) lignes.push(T('bilanIndice'));
    const ul = $('fin-bilan'); ul.textContent = '';
    for (const l of lignes) { const li = document.createElement('li'); li.textContent = l; ul.appendChild(li); }
    $('b-suivant').hidden = !gagne;
    $('b-reessayer').hidden = gagne;
    $('b-rejouer').hidden = !gagne;
    $('b-fin-accueil').hidden = gagne;
    (gagne ? $('b-suivant') : $('b-reessayer')).focus();
  }

  function pause(oui) {
    if (etat !== 'jeu' || !J || J.fini) return;
    enPause = oui;
    montrer(oui ? 'ecran-pause' : (tutoOuvert ? 'ecran-tuto' : null));
    if (oui) $('b-reprendre').focus();
  }

  function allerTitre() {
    etat = 'titre'; enPause = false; J = null;
    $('hud').hidden = true;
    montrer('ecran-titre');
    majTitre();
    nouvelleDemoTitre();
  }
  function majTitre() {
    $('total-etoiles').textContent = T('totalEtoiles', { n: totalEtoiles(), max: NB(NB_NIVEAUX * 3) });
    if (effacerTitre && effacerTitre.maj) effacerTitre.maj();
  }

  // =====================================================================
  //  Écran des niveaux
  // =====================================================================
  const SVG_CADENAS = '<svg class="cadenas" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2.5" fill="#8a96a3"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#8a96a3" stroke-width="2.6" fill="none"/></svg>';
  const SVG_MINI = (on) => '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="' + (on ? '#ffcc33' : '#dfe5ea') + '" stroke="' + (on ? '#b07d00' : '#b9c3cc') + '" stroke-width="1.5"/></svg>';
  function ouvrirNiveaux(page) {
    etat = 'niveaux'; J = null; enPause = false;
    $('hud').hidden = true;
    pageNiveaux = page === undefined ? Math.floor((Math.min(prog.debloque, NB_NIVEAUX) - 1) / 20) : page;
    montrer('ecran-niveaux');
    dessinerNiveaux();
  }
  function dessinerNiveaux() {
    const nbPages = NB_NIVEAUX / 20;
    pageNiveaux = Math.max(0, Math.min(nbPages - 1, pageNiveaux));
    $('niv-jardin').textContent = T('jardin' + (pageNiveaux + 1));
    $('niv-jardin-num').textContent = T('jardinNum', { n: NB(pageNiveaux + 1), max: NB(nbPages) });
    let et = 0;
    for (let k = 0; k < 20; k++) et += prog.etoiles[pageNiveaux * 20 + k] || 0;
    $('niv-jardin-etoiles').textContent = T('jardinEtoiles', { n: et, max: NB(60) });
    $('b-jardin-prec').disabled = pageNiveaux === 0;
    $('b-jardin-suiv').disabled = pageNiveaux === nbPages - 1;
    const grille = $('grille-niveaux');
    grille.textContent = '';
    for (let k = 0; k < 20; k++) {
      const i = pageNiveaux * 20 + k, n = i + 1;
      const b = document.createElement('button');
      b.className = 'bniv';
      const ouvert = n <= prog.debloque;
      if (!ouvert) {
        b.classList.add('ferme'); b.innerHTML = SVG_CADENAS; b.disabled = true;
        b.setAttribute('aria-label', T('niveauFerme', { niv: NB(n) }));
      } else {
        if (n === prog.debloque) b.classList.add('actuel');

        const num = document.createElement('span'); num.textContent = NB(n);
        const mini = document.createElement('span'); mini.className = 'mini'; mini.innerHTML = SVG_MINI(e >= 1) + SVG_MINI(e >= 2) + SVG_MINI(e >= 3);
        b.appendChild(num); b.appendChild(mini);
        b.setAttribute('aria-label', T('niveauAria', { niv: NB(n), n: e }));
        b.addEventListener('click', () => { premierGeste = true; SON.clic(); lancerNiveau(i); });
      }
      grille.appendChild(b);
    }
  }

  // =====================================================================
  //  Tutoriels animés : petites scènes jouées par le même moteur
  // =====================================================================
  function scene(cols, rows, liste, extra) {
    extra = extra || {};
    const p = creerPlateau(cols, rows);
    (extra.rochers || []).forEach((q) => p.rochers.add(cle(q[0], q[1])));
    (extra.haies || []).forEach((h) => p.haies.add(h));
    (extra.terriers || []).forEach((tr, k) => ajouterTerrier(p, tr[0], tr[1], k));
    (extra.coeurs || []).forEach((q) => p.objets.set(cle(q[0], q[1]), 'coeur'));
    liste.forEach((d, k) => {
      const f = nouvelleFleche(p, d.c, d.d);
      f.couleur = d.col !== undefined ? d.col : (k * 3 + 1) % COULEURS.length;
      f.glace = d.g || 0; f.feuilles = d.f || 0;
      placer(p, f);
    });
    if (extra.jumelles) { const [a, b] = extra.jumelles; p.fleches[a].jumeau = b; p.fleches[b].jumeau = a; p.fleches[a].couleur = p.fleches[b].couleur = 100; }
    return p;
  }
  const SCENE_BASE = { faire: () => scene(3, 3, [{ c: [[0, 0], [1, 0]], d: 1 }, { c: [[1, 2], [1, 1]], d: 0 }]), script: [0, 1] };
  const SCENE_CHOC = { faire: () => scene(3, 3, [{ c: [[0, 1]], d: 1 }, { c: [[1, 2], [1, 1]], d: 0 }]), script: [0, 1, 0] };
  const TUTOS = {
    base: SCENE_BASE,
    choc: SCENE_CHOC,
    coude: { faire: () => scene(3, 3, [{ c: [[0, 2], [0, 1], [1, 1], [1, 0]], d: 0 }, { c: [[2, 2], [2, 1]], d: 0 }]), script: [0, 1] },
    rocher: { faire: () => scene(3, 3, [{ c: [[0, 1], [1, 1]], d: 1 }, { c: [[0, 2], [1, 2]], d: 1 }], { rochers: [[2, 1]] }), script: [0, 1] },
    coeur: { faire: () => scene(3, 3, [{ c: [[0, 1], [1, 1]], d: 1 }, { c: [[1, 2]], d: 2 }], { coeurs: [[2, 1]] }), script: [0, 1] },
    glace: { faire: () => scene(3, 3, [{ c: [[0, 1], [1, 1]], d: 1, g: 1 }]), script: [0, 0] },
    jumelles: { faire: () => scene(3, 3, [{ c: [[0, 0], [1, 0]], d: 1 }, { c: [[0, 2], [1, 2]], d: 1 }], { jumelles: [0, 1] }), script: [0] },
    haies: { faire: () => scene(3, 3, [{ c: [[0, 1], [1, 1]], d: 1 }, { c: [[0, 2], [1, 2]], d: 1 }], { haies: ['2,1,1'] }), script: [0, 1] },
    feuilles: { faire: () => scene(3, 3, [{ c: [[0, 1], [1, 1]], d: 1, f: 1 }]), script: [0, 0] },
    defi: SCENE_CHOC,
    terriers: { faire: () => scene(4, 3, [{ c: [[0, 0]], d: 1 }, { c: [[0, 2], [0, 1]], d: 0 }], { terriers: [[[1, 0], [2, 2]]] }), script: [0, 1] },
    sablier: SCENE_BASE,
    glace2: { faire: () => scene(3, 3, [{ c: [[0, 1], [1, 1]], d: 1, g: 2 }]), script: [0, 0, 0] },
  };
  let demoTuto = null;
  const tutoToile = $('tuto-toile'), tutoCtx = tutoToile.getContext('2d');
  function ouvrirTuto(cleTuto) {
    const def = TUTOS[cleTuto];
    tutoOuvert = true;
    $('tuto-titre').textContent = T('tuto' + cleTuto[0].toUpperCase() + cleTuto.slice(1) + 'Titre');
    $('tuto-texte').textContent = T('tuto' + cleTuto[0].toUpperCase() + cleTuto.slice(1) + 'Texte');
    montrer('ecran-tuto');
    demoTuto = { cle: cleTuto, def, p: def.faire(), etape: 0, attente: 0.9, main: null, appui: 0 };
    prog.tutos[cleTuto] = true;
    ecrireLocal();
    requestAnimationFrame(() => { taillerTuto(); $('b-tuto-ok').focus(); });
  }
  function taillerTuto() {
    const r = tutoToile.getBoundingClientRect();
    tutoToile.width = Math.max(1, Math.round(r.width * DPR)); tutoToile.height = Math.max(1, Math.round(r.height * DPR));
  }
  function fermerTuto() {
    if (!tutoOuvert) return;
    tutoOuvert = false; demoTuto = null;
    SON.clic();
    montrer(enPause ? 'ecran-pause' : null);
  }
  function majDemo(d, dt, auto) {
    majPlateau(d.p, dt, () => {});
    if (d.appui > 0) d.appui -= dt;
    d.attente -= dt;
    if (d.attente > 0) return;
    if (auto) {
      if (enMouvement(d.p)) return;
      if (restantes(d.p) === 0) { d.p = d.def.faire(); d.attente = 0.8; return; }
      const f = trouverSure(d.p);
      if (f) lancer(d.p, f);
      d.attente = 0.7;
      return;
    }
    if (d.etape >= d.def.script.length) {
      if (enMouvement(d.p)) return;
      d.p = d.def.faire(); d.etape = 0; d.attente = 1; return;
    }
    if (enMouvement(d.p)) return;
    const f = d.p.fleches[d.def.script[d.etape]];
    const mil = f.cells[Math.floor((f.cells.length - 1) / 2)];
    d.main = [mil[0], mil[1]];
    d.appui = 0.3;
    lancer(d.p, f);
    d.etape++;
    d.attente = 1.2;
  }
  function dessinerDemoTuto() {
    if (!demoTuto) return;
    const c = tutoCtx, w = tutoToile.width, h = tutoToile.height, p = demoTuto.p;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, w, h);
    c.fillStyle = '#cfeec0'; c.fillRect(0, 0, w, h);
    const cs = Math.floor(Math.min((w * 0.62) / p.cols, (h * 0.72) / p.rows));
    const g = { cs, ox: Math.round((w - p.cols * cs) / 2), oy: Math.round((h - p.rows * cs) / 2) };
    dessinerPlateau(c, p, g, { monde: 0, temps });
    if (demoTuto.main) {
      const X = g.ox + (demoTuto.main[0] + 0.62) * cs, Y = g.oy + (demoTuto.main[1] + 0.68) * cs;
      const enf = demoTuto.appui > 0 ? 0.85 : 1;
      if (demoTuto.appui > 0) { c.beginPath(); c.arc(X - cs * 0.12, Y - cs * 0.18, cs * 0.45 * (1.3 - demoTuto.appui), 0, 7); c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 3; c.stroke(); }
      dessinerMain(c, X, Y, cs * 0.55 * enf);
    }
  }
  function dessinerMain(c, x, y, r) {
    c.save(); c.translate(x, y); c.rotate(-0.35);
    c.fillStyle = '#ffe0bd'; c.strokeStyle = '#8a5a2b'; c.lineWidth = Math.max(1.5, r * 0.08);
    rr(c, -r * 0.18, -r * 0.55, r * 0.36, r * 0.75, r * 0.18); c.fill(); c.stroke();
    rr(c, -r * 0.42, -r * 0.05, r * 0.95, r * 0.8, r * 0.3); c.fill(); c.stroke();
    c.restore();
  }

  // Démonstration de l'écran titre : un plateau qui se vide tout seul
  let demoTitre = null, numDemo = 0;
  function nouvelleDemoTitre() {
    const P = Object.assign(reglagesNiveau(24), { cols: 5, rows: 6, lenMin: 2, lenMax: 4, coude: 0.5, remplir: 0.85, rochers: 1, haies: 0, terriers: 0, glace: 1, glace2: 0, feuilles: 0, jumelles: 1, coeur: 1 });
    const faire = () => { numDemo++; const p = essayer(P, mulberry32(4242 + numDemo * 17)); p.fleches.forEach((f, k) => { f.app = -k * 0.05; }); return p; };
    demoTitre = { def: { faire }, p: faire(), attente: 1.6, main: null, appui: 0, etape: 0 };
  }

  // =====================================================================
  //  Boucle principale
  // =====================================================================
  function redimensionner() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    toile.width = Math.round(W * DPR); toile.height = Math.round(H * DPR);
    calculerGeo();
    if (tutoOuvert) taillerTuto();
  }
  window.addEventListener('resize', redimensionner);

  let dernier = 0;
  function boucle(ts) {
    const dt = Math.min(0.05, dernier ? (ts - dernier) / 1000 : 0);
    dernier = ts;
    temps += dt;
    if (minuteToast > 0) { minuteToast -= dt; if (minuteToast <= 0) $('toast').classList.remove('visible'); }
    if (demoTuto) majDemo(demoTuto, dt, false);
    if (etat === 'titre' && demoTitre) majDemo(demoTitre, dt, true);
    if (etat === 'jeu' && J && !enPause && !tutoOuvert) {
      majPlateau(J.p, dt, evenementJeu);
      majEffets(dt);
      if (secousse > 0) secousse = Math.max(0, secousse - dt);
      if (J.tempsMax && !J.fini) {
        J.temps -= dt;
        const sec = Math.ceil(J.temps);
        if (sec !== J.dernierTic) { J.dernierTic = sec; majHud(); if (sec <= 10 && sec > 0) SON.tic(); }
        if (J.temps <= 0) { J.temps = 0; majHud(); perdre('temps'); }
      }
    } else if (etat !== 'jeu') majEffets(dt);
    if (affScore < scoreCible) { affScore = Math.min(scoreCible, affScore + Math.max(1, scoreCible * dt * 1.4)); $('fin-score').textContent = NB(Math.round(affScore)); }
    dessiner();
    requestAnimationFrame(boucle);
  }
  function dessiner() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const monde = J ? J.P.monde : etat === 'niveaux' ? pageNiveaux : 0;
    dessinerFond(ctx, W, H, monde, temps);
    if (J) {
      const s = secousse > 0 ? secousse * 18 : 0;
      dessinerPlateau(ctx, J.p, G, { monde, temps, sx: (Math.random() - 0.5) * s, sy: (Math.random() - 0.5) * s, sel: J.sel, indice: J.indice });
    } else if (etat === 'titre' && demoTitre) {
      const haut = document.querySelector('.haut-titre').getBoundingClientRect().bottom + 16;
      const bas = document.querySelector('.bas-titre').getBoundingClientRect().top - 16;
      const p = demoTitre.p;
      const cs = Math.max(16, Math.min(64, Math.floor(Math.min((W - 60) / p.cols, (bas - haut) / p.rows))));
      const g = { cs, ox: Math.round((W - p.cols * cs) / 2), oy: Math.round(haut + Math.max(0, (bas - haut - p.rows * cs) / 2)) };
      dessinerPlateau(ctx, p, g, { monde: 0, temps });
    }
    dessinerEffets(ctx);
    dessinerDemoTuto();
  }

  // =====================================================================
  //  Commandes : doigt, souris, clavier
  // =====================================================================
  function flecheSous(x, y) {
    if (!J) return null;
    const cx = Math.floor((x - G.ox) / G.cs), cy = Math.floor((y - G.oy) / G.cs);
    if (!dedans(J.p, cx, cy)) return null;
    const id = J.p.occ[cy * J.p.cols + cx];
    return id >= 0 ? J.p.fleches[id] : null;
  }
  toile.addEventListener('pointerdown', (e) => {
    premierGeste = true;
    if (etat !== 'jeu' || !J || enPause || tutoOuvert || J.fini) return;
    const f = flecheSous(e.clientX, e.clientY);
    if (f) { J.sel = -1; jouerFleche(f); }
  });
  // Choisir au clavier la flèche la plus proche dans une direction
  function centreFleche(f) {
    let x = 0, y = 0;
    for (const q of f.cells) { x += q[0]; y += q[1]; }
    return [x / f.cells.length, y / f.cells.length];
  }
  function deplacerSelection(d) {
    const dispo = J.p.fleches.filter((f) => f.etat === 'repos');
    if (!dispo.length) return;
    const actuelle = J.p.fleches[J.sel];
    if (!actuelle || actuelle.etat !== 'repos') { J.sel = trouverSure(J.p) ? dispo[0].id : dispo[0].id; return; }
    const [ax, ay] = centreFleche(actuelle);
    let meilleur = null, note = Infinity;
    for (const f of dispo) {
      if (f === actuelle) continue;
      const [x, y] = centreFleche(f);
      const av = (x - ax) * DX[d] + (y - ay) * DY[d];
      if (av <= 0.05) continue;
      const lat = Math.abs((x - ax) * DY[d]) + Math.abs((y - ay) * DX[d]);
      const n = av + lat * 2;
      if (n < note) { note = n; meilleur = f; }
    }
    if (meilleur) { J.sel = meilleur.id; SON.clic(); }
  }
  const TOUCHES_DIR = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 };
  document.addEventListener('keydown', (e) => {
    premierGeste = true;
    const k = e.code;
    if (tutoOuvert) {
      if (k === 'Enter' || k === 'Space' || k === 'Escape') { e.preventDefault(); fermerTuto(); }
      return;
    }
    if (etat === 'jeu' && J && !J.fini) {
      if (k === 'Escape' || k === 'KeyP') { e.preventDefault(); pause(!enPause); return; }
      if (enPause) return;
      if (k in TOUCHES_DIR) { e.preventDefault(); deplacerSelection(TOUCHES_DIR[k]); return; }
      if (k === 'Space' || k === 'Enter') {
        e.preventDefault();
        const f = J.p.fleches[J.sel];
        if (f && f.etat === 'repos') jouerFleche(f);
        else deplacerSelection(1);
        return;
      }
      if (k === 'KeyH') { e.preventDefault(); donnerIndice(); }
    } else if (etat === 'titre' && document.activeElement === document.body && (k === 'Enter' || k === 'Space')) {
      e.preventDefault(); jouer();
    }
  });

  function donnerIndice() {
    if (!J || J.fini || enPause) return;
    const f = trouverSure(J.p);
    if (!f) return;
    J.indice = f.id; J.indiceUtilise = true;
    J.sel = f.id; // au clavier, Espace lance directement la flèche montrée
    SON.indice();
    const t = f.cells[f.cells.length - 1], [X, Y] = centreCase(t[0], t[1]);
    texteMontant(X, Y - G.cs * 0.5, T('indiceAide'), '#fff3b0');
  }

  // Son : un bouton par écran, même réglage partout
  function majBoutonsSon() {
    const svg = prog.son
      ? '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#23364a"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#23364a" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#8a96a3"/><path d="M16 9l5 6M21 9l-5 6" stroke="#e5484d" stroke-width="2.4" stroke-linecap="round"/></svg>';
    for (const b of document.querySelectorAll('.bouton-son')) {
      b.innerHTML = svg;
      b.setAttribute('aria-label', T(prog.son ? 'sonActif' : 'sonCoupe'));
      b.title = T(prog.son ? 'sonActif' : 'sonCoupe');
    }
  }
  for (const b of document.querySelectorAll('.bouton-son')) {
    b.addEventListener('click', () => { premierGeste = true; prog.son = !prog.son; ecrireLocal(); majBoutonsSon(); SON.clic(); });
  }

  // =====================================================================
  //  Boutons des écrans
  // =====================================================================
  function jouer() {
    premierGeste = true; SON.clic();
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => lancerNiveau(Math.max(0, Math.min(NB_NIVEAUX - 1, (d.niveau | 0) - 1))),
      onNouvelle: () => lancerNiveau(0),
      onEffacer: () => { toutEffacer(); lancerNiveau(0); },
    });
  }
  $('b-jouer').addEventListener('click', jouer);
  $('b-niveaux').addEventListener('click', () => { premierGeste = true; SON.clic(); ouvrirNiveaux(); });
  $('b-niv-retour').addEventListener('click', () => { SON.clic(); allerTitre(); });
  $('b-jardin-prec').addEventListener('click', () => { SON.clic(); pageNiveaux--; dessinerNiveaux(); });
  $('b-jardin-suiv').addEventListener('click', () => { SON.clic(); pageNiveaux++; dessinerNiveaux(); });
  $('b-pause').addEventListener('click', () => { premierGeste = true; SON.clic(); pause(true); });
  $('b-indice').addEventListener('click', () => { premierGeste = true; donnerIndice(); });
  $('b-reprendre').addEventListener('click', () => { SON.clic(); pause(false); });
  $('b-recommencer').addEventListener('click', () => { SON.clic(); lancerNiveau(J.index); });
  $('b-pause-niveaux').addEventListener('click', () => { SON.clic(); ouvrirNiveaux(J ? Math.floor(J.index / 20) : undefined); });
  $('b-pause-accueil').addEventListener('click', () => { SON.clic(); allerTitre(); });
  $('b-tuto-ok').addEventListener('click', fermerTuto);
  $('ecran-tuto').addEventListener('pointerdown', (e) => { if (e.target === $('ecran-tuto')) fermerTuto(); });
  $('b-suivant').addEventListener('click', () => {
    SON.clic();
    if (J.index + 1 >= NB_NIVEAUX) { afficherFinale(); return; }
    lancerNiveau(J.index + 1);
  });
  $('b-reessayer').addEventListener('click', () => { SON.clic(); lancerNiveau(J.index); });
  $('b-rejouer').addEventListener('click', () => { SON.clic(); lancerNiveau(J.index); });
  $('b-fin-niveaux').addEventListener('click', () => { SON.clic(); ouvrirNiveaux(Math.floor(J.index / 20)); });
  $('b-fin-accueil').addEventListener('click', () => { SON.clic(); allerTitre(); });
  $('b-finale-niveaux').addEventListener('click', () => { SON.clic(); ouvrirNiveaux(); });
  $('b-finale-accueil').addEventListener('click', () => { SON.clic(); allerTitre(); });
  function afficherFinale() {
    montrer('ecran-finale');
    $('finale-texte').textContent = T('finaleTexte', { n: totalEtoiles(), max: NB(NB_NIVEAUX), total: NB(NB_NIVEAUX * 3) });
    confettis(); SON.victoire();
  }

  // Pause automatique quand l'écran est caché
  document.addEventListener('visibilitychange', () => { if (document.hidden && etat === 'jeu' && J && !J.fini && !enPause) pause(true); });

  // Sauvegarde à la fermeture, seulement pendant un niveau
  JEL_SAVE.surFermeture(() => {
    if (etat !== 'jeu' || !J || J.fini) return;
    JEL_SAVE.save(JEU, donneesSauvegarde(J.index + 1));
  });
  const effacerTitre = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacer-titre'), apres: toutEffacer });

  // =====================================================================
  //  Démarrage
  // =====================================================================
  chargerProgres();
  redimensionner();
  majBoutonsSon();
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
