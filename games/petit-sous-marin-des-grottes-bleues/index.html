  $('b-phare').hidden = !cfg.sombre;
  $('jauge-air').hidden = !cfg.air;
  $('info-cles').hidden = !cfg.portes;
  majHud();
  reveler(0);
  for (const k of P.aReveler) P.rev[k] = 1;
  P.aReveler = [];
  if (!prog.carnet.includes('tortue')) decouvrir('tortue');
  if (cfg.nouveau && !prog.intros.includes(cfg.nouveau)) ouvrirIntro(cfg.nouveau);
  else if (n === 0 && !prog.intros.includes('pilotage')) ouvrirIntro('pilotage');
  else afficherMessage(tr('toast.debut.' + BIOMES[cfg.b].cle), 3);
}

function majHud() {
  const p = P; if (!p) return;
  $('info-perles').innerHTML = SVG.perle + '<span></span>';
  $('info-perles').lastChild.textContent = tr('hud.perles', { n: p.perlesPrises, total: p.perlesTotal });
  $('info-geante').innerHTML = SVG.geante;
  $('info-geante').classList.toggle('eteint', !p.porte);
  $('info-geante').setAttribute('aria-label', p.porte ? tr('aria.geanteOui') : tr('aria.geanteNon'));
  let c = '';
  for (let i = 0; i < p.coeursMax; i++) c += i < p.coeurs ? SVG.coeur : SVG.coeurVide;
  $('info-coeurs').innerHTML = c;
  $('info-coeurs').setAttribute('aria-label', tr('aria.coeurs', { n: p.coeurs }));
  $('info-cles').innerHTML = SVG.cle + '<span></span>';
  $('info-cles').lastChild.textContent = nombre(p.clesTenues);
}
function sautiller(idInfo) {
  const e = $(idInfo); e.classList.remove('anime'); void e.offsetWidth; e.classList.add('anime');
}

let minuterieToast = null;
function afficherMessage(texte, duree) {
  const t = $('toast');
  t.textContent = texte;
  t.classList.add('visible');
  clearTimeout(minuterieToast);
  minuterieToast = setTimeout(() => t.classList.remove('visible'), (duree || 2.4) * 1000);
}
// Message qu'on ne répète pas trop souvent
function messageRare(cle, texte, delai) {
  const p = P; if (!p) return;
  if (p.messages[cle] && p.temps - p.messages[cle] < (delai || 5)) return;
  p.messages[cle] = p.temps;
  afficherMessage(texte);
}

// --- Découverte de la carte ---
const estSombre = (p, k) => p.sombre[k] === 1;
function rayonLumiere(p) { return p.phareAllume ? PHARE_RAYON[prog.amelio.phare] : VUE_NOIR; }
function reveler() {
  const p = P, s = p.sub;
  const rl = rayonLumiere(p);
  const rn = Math.max(VUE_NORMALE, p.phareAllume ? rl : 0);
  const rmax = Math.ceil(Math.max(rl, rn)) + 1;
  const sources = [[s.x, s.y, rn, rl]];
  if (p.lanterne && p.lanterne.etat !== 'attend') sources.push([p.lanterne.x, p.lanterne.y, 1.8, 1.8]);
  for (const [ox, oy, rN, rS] of sources) {
    const x0 = Math.floor(ox), y0 = Math.floor(oy);
    for (let y = y0 - rmax; y <= y0 + rmax; y++) {
      if (y < 0 || y >= p.H) continue;
      for (let x = x0 - rmax; x <= x0 + rmax; x++) {
        if (x < 0 || x >= p.W) continue;
        const k = y * p.W + x;
        if (p.rev[k] > 0) continue;
        const d = Math.hypot(x + 0.5 - ox, y + 0.5 - oy);
        if (d <= (estSombre(p, k) ? rS : rN)) { p.rev[k] = 0.01; p.aReveler.push(k); }
      }
    }
  }
}
function lumiereEn(p, x, y) {
  // 1 : bien éclairé, 0 : noir complet (seulement dans les zones sombres)
  const k = Math.floor(y) * p.W + Math.floor(x);
  if (!estSombre(p, k)) return 1;
  let best = 0;
  const s = p.sub;
  const r = rayonLumiere(p);
  best = Math.max(best, Math.min(1, Math.max(0, (r - Math.hypot(x - s.x, y - s.y)) / 1.2 + 0.2)));
  if (p.lanterne && p.lanterne.etat !== 'attend') best = Math.max(best, Math.min(1, (1.9 - Math.hypot(x - p.lanterne.x, y - p.lanterne.y)) / 1.0));
  for (const c of p.cristaux) best = Math.max(best, Math.min(1, (1.5 - Math.hypot(x - c.x, y - c.y)) / 0.8));
  return Math.max(0, best);
}

// --- Collisions ---
function solide(p, x, y) {
  if (x < 0 || y < 0 || x >= p.W || y >= p.H) return true;
  return p.type[y * p.W + x] !== EAU;
}
function deplacer(p, dx, dy) {
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 0.15));
  for (let i = 0; i < n; i++) {
    p.sub.x += dx / n; collisions(p);
    p.sub.y += dy / n; collisions(p);
  }
}
function collisions(p) {
  const s = p.sub, r = RAYON;
  for (let y = Math.floor(s.y - r); y <= Math.floor(s.y + r); y++) {
    for (let x = Math.floor(s.x - r); x <= Math.floor(s.x + r); x++) {
      if (!solide(p, x, y)) continue;
      const qx = Math.max(x, Math.min(s.x, x + 1)), qy = Math.max(y, Math.min(s.y, y + 1));
      let ddx = s.x - qx, ddy = s.y - qy;
      let d = Math.hypot(ddx, ddy);
      if (d >= r) continue;
      if (d < 1e-6) { ddx = s.x - (x + 0.5); ddy = s.y - (y + 0.5); d = Math.hypot(ddx, ddy) || 1; s.x += ddx / d * 0.05; s.y += ddy / d * 0.05; continue; }
      const nx = ddx / d, ny = ddy / d;
      s.x += nx * (r - d); s.y += ny * (r - d);
      const vn = s.vx * nx + s.vy * ny;
      if (vn < 0) {
        s.vx -= vn * nx; s.vy -= vn * ny;
        if (vn < -2.4 && p.temps - p.chocMinuterie > 0.35) { p.chocMinuterie = p.temps; son('choc'); p.secousse = Math.max(p.secousse, 0.12); }
      }
      const kn = s.kx * nx + s.ky * ny;
      if (kn < 0) { s.kx -= kn * nx; s.ky -= kn * ny; }
      contact(p, x, y);
    }
  }
}
function contact(p, x, y) {
  if (x < 0 || y < 0 || x >= p.W || y >= p.H) return;
  const k = y * p.W + x;
  const ty = p.type[k];
  if (ty === PORTE) {
    if (p.clesTenues > 0) {
      p.clesTenues--;
      ouvrirGroupe(p, p.groupe[k], '#ff8f7a');
      son('porte'); afficherMessage(tr('toast.porte'));
      majHud();
    } else messageRare('cle', tr('toast.besoinCle'), 5);
  } else if (ty === EBOULIS) {
    if (prog.amelio.pince) {
      ouvrirGroupe(p, p.groupe[k], '#9a8a7a');
      son('eboulis'); p.secousse = 0.3;
      afficherMessage(tr('toast.eboulis'));
    } else messageRare('pince', tr('toast.besoinPince'), 6);
  }
}
function ouvrirGroupe(p, g, couleur) {
  const gr = p.groupes[g];
  if (!gr) return;
  for (const k of gr.cases) {
    p.type[k] = EAU;
    p.rev[k] = 1;
    const x = (k % p.W) + 0.5, y = ((k / p.W) | 0) + 0.5;
    for (let i = 0; i < 10; i++) eclat(p, x, y, couleur, 3);
  }
}

// --- Effets ---
function eclat(p, x, y, couleur, vitesse, taille) {
  const a = Math.random() * Math.PI * 2, v = Math.random() * (vitesse || 2);
  p.particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.6 + Math.random() * 0.5, max: 1.1, couleur, taille: taille || 0.08 + Math.random() * 0.08, genre: 'eclat' });
}
function bulle(p, x, y, taille, vy) {
  p.particules.push({ x, y, vx: (Math.random() - 0.5) * 0.4, vy: vy || -(0.8 + Math.random() * 0.8), vie: 1 + Math.random() * 1.2, max: 2.2, taille: taille || 0.05 + Math.random() * 0.07, genre: 'bulle' });
}
function versEcran(p, x, y) { return [(x - p.cam.x) * T + LARG / 2, (y - p.cam.y) * T + HAUT / 2]; }
function volerVers(p, x, y, idInfo, dessin) {
  const [sx, sy] = versEcran(p, x, y);
  const r = $(idInfo).getBoundingClientRect();
  p.volants.push({ x: sx, y: sy, x0: sx, y0: sy, tx: r.left + r.width / 2, ty: r.top + r.height / 2, t: 0, dessin, info: idInfo });
}

// --- Pilotage ---
const touches = new Set();
const manette = { actif: false, id: null, ox: 0, oy: 0, x: 0, y: 0 };
function entree() {
  let ix = 0, iy = 0;
  if (touches.has('ArrowLeft') || touches.has('KeyA')) ix -= 1;
  if (touches.has('ArrowRight') || touches.has('KeyD')) ix += 1;
  if (touches.has('ArrowUp') || touches.has('KeyW')) iy -= 1;
  if (touches.has('ArrowDown') || touches.has('KeyS')) iy += 1;
  if (manette.actif) {
    const dx = manette.x - manette.ox, dy = manette.y - manette.oy;
    const l = Math.hypot(dx, dy);
    if (l > 8) { const f = Math.min(1, l / 60); ix += dx / l * f; iy += dy / l * f; }
  }
  const l = Math.hypot(ix, iy);
  if (l > 1) { ix /= l; iy /= l; }
  return [ix, iy];
}
canvas.addEventListener('pointerdown', (e) => {
  if (ecran !== 'jeu' || enPause || introOuverte || !P || P.fini) return;
  manette.actif = true; manette.id = e.pointerId;
  manette.ox = manette.x = e.clientX; manette.oy = manette.y = e.clientY;
  try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
  e.preventDefault();
});
canvas.addEventListener('pointermove', (e) => {
  if (!manette.actif || e.pointerId !== manette.id) return;
  manette.x = e.clientX; manette.y = e.clientY;
});
const lacher = (e) => { if (e.pointerId === manette.id) { manette.actif = false; manette.id = null; } };
canvas.addEventListener('pointerup', lacher);
canvas.addEventListener('pointercancel', lacher);

window.addEventListener('keydown', (e) => {
  const c = e.code;
  if (ecran === 'jeu' && P) {
    if (introOuverte) {
      if (c === 'Enter' || c === 'Space' || c === 'Escape') { e.preventDefault(); fermerIntro(); }
      return;
    }
    if (c === 'Escape' || c === 'KeyP') { e.preventDefault(); if (!P.fini) { if (enPause) reprendre(); else ouvrirPause(); } return; }
    if (enPause || P.fini) return;
    if (c === 'Space') { e.preventDefault(); basculerPhare(); return; }
    if (c === 'KeyM' || c === 'Semicolon') { basculerCarte(); return; }
    if (c.startsWith('Arrow')) e.preventDefault();
    touches.add(c);
  }
});
window.addEventListener('keyup', (e) => touches.delete(e.code));
window.addEventListener('blur', () => { touches.clear(); manette.actif = false; });

function basculerPhare() {
  const p = P; if (!p || !p.cfg.sombre || p.fini) return;
  if (!p.phareAllume && p.batterie <= 0.02) { messageRare('vide', tr('toast.phareVide'), 3); return; }
  p.phareAllume = !p.phareAllume;
  son(p.phareAllume ? 'phare' : 'phareOff');
  $('b-phare').classList.toggle('allume', p.phareAllume);
}
function basculerCarte() { carteVisible = !carteVisible; son('clic'); }

// --- Mise à jour d'une image de partie ---
function majPartie(dt) {
  const p = P, s = p.sub, cfg = p.cfg;
  p.temps += dt;
  const [ix, iy] = entree();
  const k = Math.floor(s.y) * p.W + Math.floor(s.x);
  const surGlace = p.glace[k] === 1, dansAlgue = p.algue[k] === 1;
  const vmax = VITESSES[prog.amelio.helice] * (dansAlgue ? 0.55 : 1);
  const raideur = surGlace ? 1.1 : 7;
  s.vx += (ix * vmax - s.vx) * Math.min(1, raideur * dt);
  s.vy += (iy * vmax - s.vy) * Math.min(1, raideur * dt);
  let ex = 0, ey = 0;
  if (p.courant[k] >= 0) { ex += DX[p.courant[k]] * cfg.force; ey += DY[p.courant[k]] * cfg.force; }
  for (const g of p.geysers) if (g.etat === 'souffle' && g.cases.has(k)) ey -= 6.5;
  s.kx *= Math.exp(-5 * dt); s.ky *= Math.exp(-5 * dt);
  deplacer(p, (s.vx + ex + s.kx) * dt, (s.vy + ey + s.ky) * dt);
  if (Math.abs(ix) > 0.15) s.dir = ix > 0 ? 1 : -1;
  s.incl += (Math.max(-0.4, Math.min(0.4, s.vy * 0.12)) * s.dir - s.incl) * Math.min(1, 6 * dt);
  const vit = Math.hypot(s.vx, s.vy);
  s.helice += dt * (4 + vit * 6);
  if (s.invul > 0) s.invul -= dt;
  p.minuterieBulles -= dt;
  if (p.minuterieBulles <= 0 && vit > 0.4) { p.minuterieBulles = 0.09; bulle(p, s.x - s.dir * 0.45, s.y + 0.05, 0.04 + Math.random() * 0.04, -0.4); }
  if (dansAlgue && Math.random() < dt * 4) eclat(p, s.x, s.y + 0.2, '#69b36d', 0.6, 0.05);

  // Lumière, batterie, cristaux
  if (p.phareAllume) {
    p.batterie -= dt / PHARE_DUREE[prog.amelio.phare];
    if (p.batterie <= 0) { p.batterie = 0; p.phareAllume = false; $('b-phare').classList.remove('allume'); son('phareOff'); afficherMessage(tr('toast.phareVide')); }
  }
  for (const c of p.cristaux) {
    if (Math.hypot(c.x - s.x, c.y - s.y) < 1.15 && p.batterie < 1) {
      const avant = p.batterie;
      p.batterie = Math.min(1, p.batterie + dt * 0.7);
      if (Math.random() < dt * 10) eclat(p, c.x, c.y - 0.2, '#9fefff', 1.2, 0.06);
      if (avant < 1 && p.batterie >= 1) { son('cristal'); if (cfg.sombre) afficherMessage(tr('toast.recharge')); }
    }
  }
  $('bat-rempli').style.width = Math.round(p.batterie * 100) + '%';

  // Air
  if (cfg.air) {
    p.air -= dt;
    if (p.bulles[k]) {
      const avant = p.air;
      p.air = Math.min(p.airMax, p.air + dt * p.airMax * 0.55);
      if (Math.random() < dt * 6) son('bulle');
      if (Math.random() < dt * 14) bulle(p, s.x + (Math.random() - 0.5) * 0.6, s.y + 0.3, 0.06 + Math.random() * 0.06);
      if (avant < p.airMax * 0.25) p.alerteAir = 0;
    }
    const frac = Math.max(0, p.air / p.airMax);
    $('air-rempli').style.width = Math.round(frac * 100) + '%';
    $('jauge-air').classList.toggle('bas', frac < 0.25);
    if (frac < 0.25) {
      p.alerteAir -= dt;
      if (p.alerteAir <= 0) { p.alerteAir = 1.6; son('alerte'); messageRare('air', tr('toast.airBas'), 8); }
    }
    if (p.air <= 0) { p.air = 0; defaite('air'); return; }
  }

  // Perles, perle géante, clés, coffres
  for (const pe of p.perles) {
    if (pe.pris || Math.hypot(pe.x - s.x, pe.y - s.y) > 0.6) continue;
    pe.pris = true; p.perlesPrises++;
    son('perle');
    for (let i = 0; i < 8; i++) eclat(p, pe.x, pe.y, '#ffffff', 2);
    volerVers(p, pe.x, pe.y, 'info-perles', 'perle');
  }
  const pg = p.perleGeante;
  if (!pg.prise && Math.hypot(pg.x - s.x, pg.y - s.y) < 0.8) {
    pg.prise = true; p.porte = true;
    son('geante'); p.secousse = 0.15;
    for (let i = 0; i < 24; i++) eclat(p, pg.x, pg.y, i % 2 ? '#ffc6e8' : '#9fd8ff', 3);
    p.distRetour = carteDistances(p);
    afficherMessage(tr('toast.geante'), 4);
    majHud(); sautiller('info-geante');
  }
  for (const c of p.cles) {
    if (c.pris || Math.hypot(c.x - s.x, c.y - s.y) > 0.65) continue;
    c.pris = true; p.clesTenues++;
    son('cle'); afficherMessage(tr('toast.cle'));
    for (let i = 0; i < 10; i++) eclat(p, c.x, c.y, '#ff9a7a', 2);
    volerVers(p, c.x, c.y, 'info-cles', 'cle');
  }
  for (const c of p.coffres) {
    if (c.pris || Math.hypot(c.x - s.x, c.y - s.y) > 0.75) continue;
    c.pris = true; p.coffresPris++;
    son('coffre'); afficherMessage(tr('toast.coffre', { n: 300 }));
    for (let i = 0; i < 20; i++) eclat(p, c.x, c.y, i % 2 ? '#ffcf3a' : '#fff6c9', 3);
  }

  // Dangers : oursins, méduses
  for (const o of p.oursins) if (Math.hypot(o.x - s.x, o.y - s.y) < RAYON + 0.27) touche(p, o.x, o.y);
  for (const m of p.meduses) {
    m.u += m.sens * m.v * dt / Math.max(1, m.max - m.min);
    if (m.u > 1) { m.u = 1; m.sens = -1; } else if (m.u < 0) { m.u = 0; m.sens = 1; }
    const pos = m.min + (m.max - m.min) * m.u;
    m.ph += dt;
    if (m.vertical) { m.x = m.fixe + Math.sin(m.ph * 1.3) * 0.12; m.y = pos; } else { m.x = pos; m.y = m.fixe + Math.sin(m.ph * 1.3) * 0.15; }
    if (Math.hypot(m.x - s.x, m.y - s.y) < RAYON + 0.33) touche(p, m.x, m.y);
  }
  if (p.fini) return;

  // Geysers
  for (const g of p.geysers) {
    const c = (p.temps + g.phase) % 4.2;
    const avant = g.etat;
    g.etat = c < 2.2 ? 'calme' : c < 3.1 ? 'alerte' : 'souffle';
    if (g.etat === 'alerte' && Math.random() < dt * 12) bulle(p, g.x + (Math.random() - 0.5) * 0.4, g.y + 0.3, 0.04, -1.5);
    if (g.etat === 'souffle') {
      if (avant !== 'souffle' && Math.hypot(g.x - s.x, g.y - s.y) < 7) son('geyser');
      if (Math.random() < dt * 40) bulle(p, g.x + (Math.random() - 0.5) * 0.7, g.y + 0.2, 0.06 + Math.random() * 0.08, -5);
    }
  }

  // Poisson-lanterne
  const L = p.lanterne;
  if (L) {
    L.ph += dt;
    if (L.etat === 'attend') {
      if (Math.hypot(L.x - s.x, L.y - s.y) < 2.4) {
        L.etat = 'guide'; L.chemin = cheminVers(p, L, L.devant); L.i = 0;
        son('lanterne'); afficherMessage(tr('toast.lanterne'));
      }
    } else if (L.etat === 'guide') {
      if (!L.chemin || L.i >= L.chemin.length) {
        L.etat = 'fini';
        ouvrirGroupe(p, L.groupe, '#ffe58a');
        son('secret'); afficherMessage(tr('toast.secret'));
      } else if (Math.hypot(L.x - s.x, L.y - s.y) < 4.2) {
        const cible = L.chemin[L.i];
        const tx = (cible % p.W) + 0.5, ty = ((cible / p.W) | 0) + 0.5;
        const d = Math.hypot(tx - L.x, ty - L.y);
        const v = 2.6 * dt;
        if (d <= v) { L.x = tx; L.y = ty; L.i++; } else { L.x += (tx - L.x) / d * v; L.y += (ty - L.y) / d * v; L.dir = tx > L.x ? 1 : -1; }
        if (Math.random() < dt * 8) eclat(p, L.x, L.y, '#ffe58a', 0.4, 0.05);
      }
    }
  }

  // Créatures du décor
  for (const c of p.decor) majCreature(p, c, dt);

  // Carnet de bord
  p.carnetMinuterie -= dt;
  if (p.carnetMinuterie <= 0) {
    p.carnetMinuterie = 0.3;
    const proches = [];
    for (const c of p.decor) proches.push([c.espece, c.x, c.y, c.fond ? 6 : 2.6]);
    for (const o of p.oursins) proches.push(['oursin', o.x, o.y, 2.2]);
    for (const m of p.meduses) proches.push(['meduse', m.x, m.y, 2.6]);
    if (L) proches.push(['lanterne', L.x, L.y, 2.6]);
    for (const [e, x, y, r] of proches) {
      if (prog.carnet.includes(e)) continue;
      if (Math.hypot(x - s.x, y - s.y) < r && lumiereEn(p, x, y) > 0.4) { decouvrir(e); break; }
    }
  }

  // Retour à Mamie Nacre
  const dT = Math.hypot(p.tortue.x - s.x, p.tortue.y - s.y);
  if (dT > 3.5) p.parti = true;
  if (dT < 1.5) {
    if (p.porte) { victoire(); return; }
    if (p.parti) messageRare('attend', tr('toast.attend'), 7);
  }

  reveler();
}

function touche(p, hx, hy) {
  const s = p.sub;
  if (s.invul > 0 || p.fini) return;
  p.coeurs--; s.invul = 1.5;
  let dx = s.x - hx, dy = s.y - hy; const d = Math.hypot(dx, dy) || 1;
  s.kx = dx / d * 5; s.ky = dy / d * 5; s.vx = 0; s.vy = 0;
  p.secousse = 0.35;
  son('aie');
  for (let i = 0; i < 10; i++) eclat(p, s.x, s.y, '#ff6b81', 2.5);
  majHud(); sautiller('info-coeurs');
  if (p.coeurs <= 0) defaite('coque');
}

function majCreature(p, c, dt) {
  c.ph += dt;
  if (c.espece === 'baleine') { c.x += dt * 0.6; if (c.x > p.W + 5) c.x = -5; c.y = p.H * 0.45 + Math.sin(c.ph * 0.3) * 2; return; }
  if (c.espece === 'etoile') return;
  if (c.pause > 0) { c.pause -= dt; return; }
  const s = p.salles[c.salle];
  if (c.cible === undefined || Math.hypot(c.cx - c.x, c.cy - c.y) < 0.15) {
    // nouvelle destination dans la même salle
    const k = s.cellules[Math.floor(Math.random() * s.cellules.length)];
    if (k === undefined || p.type[k] !== EAU) return;
    c.cx = (k % p.W) + 0.5; c.cy = c.sol ? c.y : ((k / p.W) | 0) + 0.5;
    c.cible = k;
    c.pause = Math.random() * 1.5;
    if (c.sol && (p.type[Math.floor(c.cy) * p.W + Math.floor(c.cx)] !== EAU || p.type[(Math.floor(c.cy) + 1) * p.W + Math.floor(c.cx)] === EAU)) { c.cx = c.x; }
  }
  const v = (c.sol ? 0.5 : c.espece === 'phoque' || c.espece === 'manchot' ? 1.4 : 0.9) * dt;
  const dx = c.cx - c.x, dy = c.cy - c.y, d = Math.hypot(dx, dy);
  if (d > 0.01) {
    const nx = c.x + dx / d * Math.min(v, d), ny = c.y + dy / d * Math.min(v, d);
    if (p.type[Math.floor(ny) * p.W + Math.floor(nx)] === EAU) { c.x = nx; c.y = ny; } else c.cible = undefined;
    if (Math.abs(dx) > 0.05) c.dir = dx > 0 ? 1 : -1;
  }
}

function decouvrir(e) {
  if (prog.carnet.includes(e)) return;
  prog.carnet.push(e);
  if (P && e !== 'tortue') { son('creature'); afficherMessage(tr('toast.carnet', { nom: tr('creature.' + e) }), 3); }
}

// Distances (en cases) jusqu'à Mamie Nacre, pour la flèche du retour
function carteDistances(p) {
  const dist = new Int32Array(p.W * p.H).fill(-1);
  const debut = Math.floor(p.tortue.y) * p.W + Math.floor(p.tortue.x);
  const file = [debut]; dist[debut] = 0;
  for (let q = 0; q < file.length; q++) {
    const k = file[q]; const x = k % p.W, y = (k / p.W) | 0;
    for (let d = 0; d < 4; d++) {
      const v = (y + DY[d]) * p.W + x + DX[d];
      if (dist[v] < 0 && p.type[v] === EAU) { dist[v] = dist[k] + 1; file.push(v); }
    }
  }
  return dist;
}
// Chemin du poisson-lanterne (il passe aussi par les portes de corail)
function cheminVers(p, de, versK) {
  const N = p.W * p.H;
  const prec = new Int32Array(N).fill(-2);
  const debut = Math.floor(de.y) * p.W + Math.floor(de.x);
  const file = [debut]; prec[debut] = -1;
  for (let q = 0; q < file.length; q++) {
    const k = file[q];
    if (k === versK) break;
    const x = k % p.W, y = (k / p.W) | 0;
    for (let d = 0; d < 4; d++) {
      const v = (y + DY[d]) * p.W + x + DX[d];
      if (prec[v] === -2 && (p.type[v] === EAU || p.type[v] === PORTE)) { prec[v] = k; file.push(v); }
    }
  }
  if (prec[versK] === -2) return [versK];
  const ch = [];
  for (let k = versK; k !== -1; k = prec[k]) ch.unshift(k);
  return ch;
}

// --- Fin de plongée ---
function victoire() {
  const p = P;
  if (p.fini) return;
  p.fini = true; p.gagne = true; partieEnCours = false;
  const ratio = p.perlesPrises / p.perlesTotal;
  const etoiles = ratio >= 1 ? 3 : ratio >= 0.6 ? 2 : 1;
  const score = p.perlesPrises * 100 + 500 + p.coffresPris * 300 + p.coeurs * 100;
  const ancien = prog.records[p.n];
  const record = score > ancien;
  prog.etoiles[p.n] = Math.max(prog.etoiles[p.n], etoiles);
  prog.records[p.n] = Math.max(ancien, score);
  prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, p.n + 2));
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: p.n + 1 });
  JEL_SAVE.save(JEU, { niveau: Math.min(NIVEAUX.length, p.n + 2), score: scoreTotal(), prog: copieProg(), options: { son: sonActif } });
  // Jeu terminé (dernière grotte gagnée, maintenant ou avant) : total des meilleures étoiles.
  if (prog.etoiles[NIVEAUX.length - 1] > 0) {
    if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
  }
  son('victoire');
  p.joie = 1.4;
  for (let i = 0; i < 60; i++) bulle(p, p.tortue.x + (Math.random() - 0.5) * 4, p.tortue.y + Math.random() * 2, 0.06 + Math.random() * 0.12, -(1 + Math.random() * 2));
  for (let i = 0; i < 40; i++) eclat(p, p.tortue.x, p.tortue.y - 0.5, ['#ffcf3a', '#ffc6e8', '#9fd8ff', '#ffffff'][i % 4], 4, 0.12);
  setTimeout(() => afficherFin({ gagne: true, etoiles, score, record, ancien }), 1300);
}
function defaite(raison) {
  const p = P;
  if (p.fini) return;
  p.fini = true; p.gagne = false; partieEnCours = false;
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: p.n + 1 });
  son('defaite');
  for (let i = 0; i < 30; i++) bulle(p, p.sub.x, p.sub.y, 0.05 + Math.random() * 0.1, -(1 + Math.random() * 2));
  const score = p.perlesPrises * 100 + p.coffresPris * 300;
  setTimeout(() => afficherFin({ gagne: false, raison, score, ancien: prog.records[p.n] }), 1100);
}
let compteur = null;
function afficherFin(r) {
  if (ecran !== 'jeu' || !P) return;
  const p = P;
  $('toast').classList.remove('visible');
  $('fin').hidden = false;
  $('fin-titre').textContent = r.gagne ? tr('fin.bravo') : tr('fin.perdu');
  $('fin-sous').textContent = r.gagne ? tr('fin.reussie', { n: p.n + 1 }) : tr(r.raison === 'air' ? 'fin.raisonAir' : 'fin.raisonCoque');
  const zone = $('fin-etoiles');
  zone.innerHTML = '';
  zone.hidden = !r.gagne;
  if (r.gagne) {
    for (let i = 0; i < 3; i++) {
      const sp = document.createElement('span');
      sp.innerHTML = etoileSvg(i < r.etoiles);
      zone.appendChild(sp);
      const el = sp.firstChild;
      setTimeout(() => { el.classList.add('pop'); if (i < r.etoiles) son('etoile'); }, 250 + i * 300);
    }
  }
  $('fin-perles').textContent = tr('fin.perles', { n: p.perlesPrises, total: p.perlesTotal }) + (p.coffresPris ? ' · ' + tr('fin.coffres', { n: p.coffresPris }) : '');
  const sc = $('fin-score');
  clearInterval(compteur);
  let v = 0;
  const pas = Math.max(1, Math.ceil(r.score / 30));
  compteur = setInterval(() => {
    v = Math.min(r.score, v + pas);
    sc.textContent = tr('fin.score', { n: nombre(v) });
    if (v >= r.score) clearInterval(compteur);
  }, 30);
  sc.textContent = tr('fin.score', { n: nombre(0) });
  const rec = $('fin-record');
  rec.className = '';
  if (r.gagne && r.record) { rec.textContent = tr('fin.record'); rec.className = 'record'; }
  else rec.textContent = r.ancien ? tr('fin.recordAncien', { n: nombre(r.ancien) }) : '';
  const dernier = p.n === NIVEAUX.length - 1;
  $('b-suivant').hidden = !r.gagne || dernier;
  $('b-bilan').hidden = !(r.gagne && dernier);
  $('b-reessayer').hidden = r.gagne;
  $('b-rejouer').hidden = !r.gagne;
  $('b-fin-accueil').hidden = r.gagne;
  setTimeout(() => { const b = r.gagne ? (dernier ? $('b-bilan') : $('b-suivant')) : $('b-reessayer'); try { b.focus(); } catch (e) { /* rien */ } }, 50);
}
function afficherBilan() {
  $('fin').hidden = true;
  $('bilan').hidden = false;
  $('bilan-etoiles').textContent = tr('bilan.etoiles', { n: totalEtoiles(), total: NIVEAUX.length * 3 });
  $('bilan-score').textContent = tr('bilan.score', { n: nombre(scoreTotal()) });
  $('bilan-carnet').textContent = tr('bilan.carnet', { n: prog.carnet.length, total: ESPECES.length });

}

/* ==========================================================================
   Dessin
   ========================================================================== */
function melange(c1, c2, f) {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const r = Math.round(((a >> 16) & 255) * (1 - f) + ((b >> 16) & 255) * f);
  const g = Math.round(((a >> 8) & 255) * (1 - f) + ((b >> 8) & 255) * f);
  const bl = Math.round((a & 255) * (1 - f) + (b & 255) * f);
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}

// Bulle, le sous-marin jaune. (x, y) en pixels, s : taille d'une case
function dessinerSousMarin(g, x, y, s, dir, temps, opts) {
  opts = opts || {};
  g.save();
  g.translate(x, y);
  g.rotate(opts.incl || 0);
  g.scale(dir, 1);
  if (opts.clignote) g.globalAlpha = 0.45;
  // faisceau du phare
  if (opts.phare) {
    const grad = g.createRadialGradient(s * 0.45, 0, 0, s * 0.45, 0, s * 3.2);
    grad.addColorStop(0, 'rgba(255,245,170,0.55)');
    grad.addColorStop(1, 'rgba(255,245,170,0)');
    g.fillStyle = grad;
    g.beginPath(); g.moveTo(s * 0.45, 0); g.lineTo(s * 3.4, -s * 1.3); g.lineTo(s * 3.4, s * 1.3); g.closePath(); g.fill();
  }
  // hélice
  const hl = Math.abs(Math.sin(temps * 2)) * s * 0.18 + s * 0.04;
  g.fillStyle = '#c99a12';
  g.beginPath(); g.ellipse(-s * 0.58, 0, s * 0.05, hl, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#e0ad1c';
  g.fillRect(-s * 0.58, -s * 0.03, s * 0.12, s * 0.06);
  // tourelle et périscope
  g.fillStyle = '#ffc42b';
  g.beginPath(); g.roundRect ? g.roundRect(-s * 0.16, -s * 0.44, s * 0.32, s * 0.2, s * 0.06) : g.rect(-s * 0.16, -s * 0.44, s * 0.32, s * 0.2); g.fill();
  g.strokeStyle = '#a77d0c'; g.lineWidth = s * 0.05; g.lineCap = 'round';
  g.beginPath(); g.moveTo(s * 0.04, -s * 0.44); g.lineTo(s * 0.04, -s * 0.58); g.lineTo(s * 0.15, -s * 0.58); g.stroke();
  // coque
  const grad = g.createLinearGradient(0, -s * 0.3, 0, s * 0.3);
  grad.addColorStop(0, '#ffe479'); grad.addColorStop(1, '#f3b414');
  g.fillStyle = grad;
  g.beginPath(); g.ellipse(0, 0, s * 0.5, s * 0.3, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#b5850d'; g.lineWidth = s * 0.03; g.stroke();
  // rivets
  g.fillStyle = '#d29a10';
  for (let i = -2; i <= 2; i++) { g.beginPath(); g.arc(i * s * 0.13, s * 0.18, s * 0.022, 0, Math.PI * 2); g.fill(); }
  // hublot avec un œil
  g.fillStyle = '#7a5a08'; g.beginPath(); g.arc(s * 0.16, -s * 0.03, s * 0.14, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#bff0ff'; g.beginPath(); g.arc(s * 0.16, -s * 0.03, s * 0.11, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#1b2a3a'; g.beginPath(); g.arc(s * 0.19, -s * 0.03, s * 0.05, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(s * 0.21, -s * 0.05, s * 0.018, 0, Math.PI * 2); g.fill();
  // sourire
  g.strokeStyle = '#7a5a08'; g.lineWidth = s * 0.03;
  g.beginPath(); g.arc(s * 0.3, s * 0.08, s * 0.07, 0.2, Math.PI - 0.6); g.stroke();
  // lampe avant
  g.fillStyle = opts.phare ? '#fffbd0' : '#e8d58a';
  g.beginPath(); g.arc(s * 0.47, 0.0, s * 0.06, 0, Math.PI * 2); g.fill();
  // pince (amélioration)
  if (opts.pince) {
    g.strokeStyle = '#8a8f99'; g.lineWidth = s * 0.05;
    g.beginPath(); g.moveTo(s * 0.25, s * 0.26); g.lineTo(s * 0.42, s * 0.4); g.lineTo(s * 0.52, s * 0.34); g.moveTo(s * 0.42, s * 0.4); g.lineTo(s * 0.5, s * 0.48); g.stroke();
  }
  // perle géante transportée
  if (opts.perle) {
    g.strokeStyle = '#8a8f99'; g.lineWidth = s * 0.03;
    g.beginPath(); g.moveTo(0, s * 0.28); g.lineTo(0, s * 0.42); g.stroke();
    dessinerPerle(g, 0, s * 0.56, s * 0.17, true, temps);
  }
  g.restore();
}

function dessinerPerle(g, x, y, r, geante, temps) {
  if (geante) {
    const halo = g.createRadialGradient(x, y, r * 0.5, x, y, r * 2.4);
    halo.addColorStop(0, 'rgba(255,214,240,' + (0.45 + Math.sin(temps * 3) * 0.15) + ')');
    halo.addColorStop(1, 'rgba(255,214,240,0)');
    g.fillStyle = halo; g.beginPath(); g.arc(x, y, r * 2.4, 0, Math.PI * 2); g.fill();
  }
  const grad = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  if (geante) { grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.55, '#ffd0ec'); grad.addColorStop(1, '#93cfff'); }
  else { grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.7, '#e9e4f6'); grad.addColorStop(1, '#a9a2c9'); }
  g.fillStyle = grad; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(x - r * 0.35, y - r * 0.38, r * 0.22, 0, Math.PI * 2); g.fill();
}

function dessinerCle(g, x, y, s) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#ff9a7a'; g.strokeStyle = '#ffd3b5'; g.lineWidth = s * 0.03;
  g.beginPath(); g.moveTo(0, s * 0.22);
  g.arc(0, -s * 0.02, s * 0.28, Math.PI * 1.05, Math.PI * 1.95); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = '#d9654a'; g.lineWidth = s * 0.025;
  for (const a of [-0.55, -0.27, 0, 0.27, 0.55]) { g.beginPath(); g.moveTo(0, s * 0.22); g.lineTo(Math.sin(a) * s * 0.28, -s * 0.02 - Math.cos(a) * s * 0.28); g.stroke(); }
  g.fillStyle = '#ffb59a'; g.fillRect(-s * 0.08, s * 0.18, s * 0.16, s * 0.08);
  g.restore();
}
function dessinerCoffre(g, x, y, s, ouvert) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#7a4a22'; g.fillRect(-s * 0.32, -s * 0.12, s * 0.64, s * 0.34);
  g.fillStyle = '#93602f'; g.beginPath(); g.ellipse(0, -s * 0.12, s * 0.32, s * 0.16, 0, Math.PI, 0); g.fill();
  g.fillStyle = '#ffcf3a'; g.fillRect(-s * 0.04, -s * 0.2, s * 0.08, s * 0.42); g.fillRect(-s * 0.32, s * 0.02, s * 0.64, s * 0.05);
  if (!ouvert) { g.fillStyle = '#fff6c9'; g.beginPath(); g.arc(0, s * 0.04, s * 0.05, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
function dessinerCristal(g, x, y, s, temps) {
  const halo = g.createRadialGradient(x, y, 0, x, y, s * 0.9);
  halo.addColorStop(0, 'rgba(143,240,255,' + (0.45 + Math.sin(temps * 2.5) * 0.15) + ')');
  halo.addColorStop(1, 'rgba(143,240,255,0)');
  g.fillStyle = halo; g.beginPath(); g.arc(x, y, s * 0.9, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#8ff0ff'; g.strokeStyle = '#e8feff'; g.lineWidth = s * 0.03;
  for (const [dx, h, w] of [[-0.14, 0.42, 0.12], [0.12, 0.34, 0.1], [0, 0.55, 0.14]]) {
    g.beginPath(); g.moveTo(x + dx * s - w * s, y + s * 0.3); g.lineTo(x + dx * s, y + s * 0.3 - h * s * 1.2); g.lineTo(x + dx * s + w * s, y + s * 0.3); g.closePath(); g.fill(); g.stroke();
  }
}
function dessinerOursin(g, x, y, s, temps) {
  g.save(); g.translate(x, y);
  g.strokeStyle = '#3b1f55'; g.lineWidth = s * 0.035; g.lineCap = 'round';
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * Math.PI * 2 + Math.sin(temps * 2 + i) * 0.05;
    g.beginPath(); g.moveTo(Math.cos(a) * s * 0.12, Math.sin(a) * s * 0.12); g.lineTo(Math.cos(a) * s * 0.32, Math.sin(a) * s * 0.32); g.stroke();
  }
  g.fillStyle = '#6a3a8c'; g.beginPath(); g.arc(0, 0, s * 0.17, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#8f5bb3'; g.beginPath(); g.arc(-s * 0.05, -s * 0.05, s * 0.07, 0, Math.PI * 2); g.fill();
  g.restore();
}
function dessinerMeduse(g, x, y, s, temps) {
  g.save(); g.translate(x, y);
  const pulse = 1 + Math.sin(temps * 3) * 0.08;
  g.strokeStyle = 'rgba(255,170,220,0.7)'; g.lineWidth = s * 0.03;
  for (let i = -2; i <= 2; i++) {
    g.beginPath(); g.moveTo(i * s * 0.07, 0);
    for (let k = 1; k <= 4; k++) g.lineTo(i * s * 0.07 + Math.sin(temps * 3 + k + i) * s * 0.05, k * s * 0.1);
    g.stroke();
  }
  const grad = g.createRadialGradient(0, -s * 0.08, 0, 0, -s * 0.04, s * 0.32);
  grad.addColorStop(0, 'rgba(255,220,245,0.95)'); grad.addColorStop(1, 'rgba(240,130,200,0.75)');
  g.fillStyle = grad;
  g.beginPath(); g.ellipse(0, 0, s * 0.3 * pulse, s * 0.24 / pulse, 0, Math.PI, 0); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.6)'; g.beginPath(); g.ellipse(-s * 0.1, -s * 0.12, s * 0.07, s * 0.04, -0.5, 0, Math.PI * 2); g.fill();
  g.restore();
}
function dessinerTortue(g, x, y, s, temps, joie) {
  g.save(); g.translate(x, y);
  const nage = Math.sin(temps * 1.5) * 0.25;
  // nageoires
  g.fillStyle = '#5fa36a';
  for (const [px, py, a] of [[0.45, -0.32, -0.6 + nage], [0.45, 0.32, 0.6 - nage], [-0.5, -0.25, -2.5 - nage], [-0.5, 0.25, 2.5 + nage]]) {
    g.save(); g.translate(px * s, py * s); g.rotate(a);
    g.beginPath(); g.ellipse(s * 0.22, 0, s * 0.26, s * 0.1, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  // tête
  g.fillStyle = '#6fb57a';
  g.beginPath(); g.ellipse(s * 0.78, -s * 0.05 - (joie ? Math.abs(Math.sin(temps * 8)) * s * 0.08 : 0), s * 0.24, s * 0.19, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#1b2a3a'; g.beginPath(); g.arc(s * 0.88, -s * 0.1, s * 0.045, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(s * 0.895, -s * 0.115, s * 0.015, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#2b5a33'; g.lineWidth = s * 0.025;

            g.quadraticCurveTo(bx + Math.sin(temps * 1.5 + hh + i) * T * 0.25, py + T * 0.5, bx + Math.sin(temps * 1.5 + hh + i + 1) * T * 0.15, py);
            g.stroke();
          }
        }
        if (p.glace[k]) {
          g.fillStyle = 'rgba(220,245,255,0.12)'; g.fillRect(px, py, T, T);
          if (hache(x, y) % 4 === 0) { g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(px + T * 0.2, py + T * 0.7); g.lineTo(px + T * 0.6, py + T * 0.3); g.stroke(); }
        }
        if (p.courant[k] >= 0) {
          const d = p.courant[k];
          g.strokeStyle = 'rgba(200,240,255,0.45)'; g.lineWidth = 2; g.lineCap = 'round';
          for (let i = 0; i < 2; i++) {
            const f = ((temps * p.cfg.force * 0.9 + i * 0.5 + hache(x, y) / 1000) % 1);
            const cx = px + T * 0.5 + DX[d] * (f - 0.5) * T + DY[d] * (i - 0.5) * T * 0.4;
            const cy = py + T * 0.5 + DY[d] * (f - 0.5) * T + DX[d] * (i - 0.5) * T * 0.4;
            g.beginPath(); g.moveTo(cx - DX[d] * T * 0.22, cy - DY[d] * T * 0.22); g.lineTo(cx, cy);
            g.lineTo(cx - DX[d] * T * 0.1 - DY[d] * T * 0.08, cy - DY[d] * T * 0.1 - DX[d] * T * 0.08); g.stroke();
          }
        }
        if (p.bulles[k]) {
          for (let i = 0; i < 3; i++) {
            const f = (temps * 0.9 + i / 3 + hache(x, y) / 1000) % 1;
            g.strokeStyle = 'rgba(220,250,255,0.8)'; g.lineWidth = 1.5;
            g.beginPath(); g.arc(px + T * (0.3 + i * 0.2) + Math.sin(temps * 3 + i) * T * 0.05, py + T * (1 - f), T * (0.06 + i * 0.02), 0, Math.PI * 2); g.stroke();
          }
        }
      }
    }
  }
}

function dessinerPartie(temps) {
  const p = P, g = ctx, s = p.sub, b = p.biome;
  // caméra
  const vise = { x: s.x, y: s.y };
  p.cam.x += (vise.x - p.cam.x) * 0.12; p.cam.y += (vise.y - p.cam.y) * 0.12;
  const demiL = LARG / 2 / T, demiH = HAUT / 2 / T;
  let cx = p.cam.x, cy = p.cam.y;
  cx = p.W < demiL * 2 ? p.W / 2 : Math.max(demiL, Math.min(p.W - demiL, cx));
  cy = p.H < demiH * 2 ? p.H / 2 : Math.max(demiH - 1.5, Math.min(p.H - demiH + 1.2, cy));
  p.cam.x = cx; p.cam.y = cy;
  let sx = 0, sy = 0;
  if (p.secousse > 0) { sx = (Math.random() - 0.5) * p.secousse * 14; sy = (Math.random() - 0.5) * p.secousse * 14; }
  const ox = LARG / 2 - cx * T + sx, oy = HAUT / 2 - cy * T + sy;
  const W2 = (x) => ox + x * T, H2 = (y) => oy + y * T;

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  // eau (dégradé selon la profondeur)
  const grad = g.createLinearGradient(0, H2(0), 0, H2(p.H));
  grad.addColorStop(0, b.eauHaut); grad.addColorStop(1, b.eauBas);
  g.fillStyle = grad; g.fillRect(0, 0, LARG, HAUT);
  // rayons de lumière lointains
  g.fillStyle = 'rgba(255,255,255,0.035)';
  for (let i = 0; i < 4; i++) {
    const bx = ((i * 260 + temps * 12) % (LARG + 300)) - 150;
    g.beginPath(); g.moveTo(bx, 0); g.lineTo(bx + 80, 0); g.lineTo(bx - 60, HAUT); g.lineTo(bx - 140, HAUT); g.fill();
  }
  // baleine au loin (derrière la roche)
  for (const c of p.decor) if (c.fond) { g.save(); g.globalAlpha = 0.45; dessinerCreature(g, c.espece, W2(c.x), H2(c.y), T, 1, temps); g.restore(); }

  const x0 = Math.floor(-ox / T) - 1, y0 = Math.floor(-oy / T) - 1;
  const x1 = Math.ceil((LARG - ox) / T) + 1, y1 = Math.ceil((HAUT - oy) / T) + 1;
  dessinerGrotte(p, x0, y0, x1, y1, ox, oy, temps);

  const visible = (x, y) => {
    const k = Math.floor(y) * p.W + Math.floor(x);
    return p.rev[k] > 0.3 && lumiereEn(p, x, y) > 0.25;
  };
  // geysers
  for (const ge of p.geysers) {
    if (!visible(ge.x, ge.y)) continue;
    g.fillStyle = '#5a3a32';
    g.beginPath(); g.moveTo(W2(ge.x - 0.4), H2(ge.y + 0.5)); g.lineTo(W2(ge.x - 0.18), H2(ge.y + 0.05)); g.lineTo(W2(ge.x + 0.18), H2(ge.y + 0.05)); g.lineTo(W2(ge.x + 0.4), H2(ge.y + 0.5)); g.fill();
    g.fillStyle = ge.etat === 'calme' ? '#7a4a3a' : '#ff8a4a';
    g.beginPath(); g.ellipse(W2(ge.x), H2(ge.y + 0.05), T * 0.18, T * 0.06, 0, 0, Math.PI * 2); g.fill();
    if (ge.etat === 'souffle') {
      const hgt = ge.h;
      const gr = g.createLinearGradient(0, H2(ge.y), 0, H2(ge.y - hgt + 0.5));
      gr.addColorStop(0, 'rgba(255,240,230,0.55)'); gr.addColorStop(1, 'rgba(255,240,230,0)');
      g.fillStyle = gr;
      g.beginPath(); g.moveTo(W2(ge.x - 0.2), H2(ge.y)); g.lineTo(W2(ge.x - 0.45), H2(ge.y - hgt + 0.5)); g.lineTo(W2(ge.x + 0.45), H2(ge.y - hgt + 0.5)); g.lineTo(W2(ge.x + 0.2), H2(ge.y)); g.fill();
    }
  }
  // objets
  for (const c of p.cristaux) if (visible(c.x, c.y) || p.rev[Math.floor(c.y) * p.W + Math.floor(c.x)] > 0.3) dessinerCristal(g, W2(c.x), H2(c.y), T, temps);
  for (const c of p.coffres) if (!c.pris && visible(c.x, c.y)) dessinerCoffre(g, W2(c.x), H2(c.y), T, false);
  for (const pe of p.perles) if (!pe.pris && visible(pe.x, pe.y)) dessinerPerle(g, W2(pe.x), H2(pe.y + Math.sin(temps * 2 + pe.b) * 0.06), T * 0.16, false, temps);
  if (!p.perleGeante.prise && visible(p.perleGeante.x, p.perleGeante.y)) dessinerPerle(g, W2(p.perleGeante.x), H2(p.perleGeante.y + Math.sin(temps * 2) * 0.08), T * 0.3, true, temps);
  for (const c of p.cles) if (!c.pris && visible(c.x, c.y)) dessinerCle(g, W2(c.x), H2(c.y + Math.sin(temps * 2.5) * 0.06), T);
  for (const o of p.oursins) if (visible(o.x, o.y)) dessinerOursin(g, W2(o.x), H2(o.y), T, temps);
  for (const c of p.decor) if (!c.fond && visible(c.x, c.y)) dessinerCreature(g, c.espece, W2(c.x), H2(c.y), T, c.dir, temps + c.ph);
  for (const m of p.meduses) if (visible(m.x, m.y)) dessinerMeduse(g, W2(m.x), H2(m.y), T, temps + m.ph);
  if (p.lanterne && (p.lanterne.etat !== 'attend' || visible(p.lanterne.x, p.lanterne.y))) dessinerLanterne(g, W2(p.lanterne.x), H2(p.lanterne.y + Math.sin(p.lanterne.ph * 2) * 0.08), T, temps, p.lanterne.dir || 1);
  // Mamie Nacre
  const tt = p.tortue;
  if (p.porte) {
    g.strokeStyle = 'rgba(255,214,90,' + (0.4 + Math.sin(temps * 4) * 0.3) + ')'; g.lineWidth = 3;
    g.beginPath(); g.arc(W2(tt.x), H2(tt.y), T * (1.1 + Math.sin(temps * 4) * 0.1), 0, Math.PI * 2); g.stroke();
  }
  dessinerTortue(g, W2(tt.x), H2(tt.y + Math.sin(temps * 1.2) * 0.08), T * 1.15, temps, p.joie > 0);
  // Bulle
  dessinerSousMarin(g, W2(s.x), H2(s.y), T * 1.05, s.dir, s.helice, {
    incl: s.incl, phare: p.phareAllume, perle: p.porte && !p.gagne, pince: prog.amelio.pince > 0,
    clignote: s.invul > 0 && Math.floor(temps * 10) % 2 === 0,
  });

  // particules
  for (const q of p.particules) {
    const a = Math.max(0, Math.min(1, q.vie / q.max * 1.6));
    if (q.genre === 'bulle') {
      g.strokeStyle = 'rgba(225,250,255,' + a * 0.85 + ')'; g.lineWidth = 1.3;
      g.beginPath(); g.arc(W2(q.x), H2(q.y), Math.max(1, q.taille * T), 0, Math.PI * 2); g.stroke();
    } else {
      g.globalAlpha = a; g.fillStyle = q.couleur;
      g.beginPath(); g.arc(W2(q.x), H2(q.y), Math.max(1, q.taille * T), 0, Math.PI * 2); g.fill();
      g.globalAlpha = 1;
    }
  }

  // noir des zones sombres, puis brouillard des cases jamais vues
  for (let y = Math.max(0, y0); y <= Math.min(p.H - 1, y1); y++) {
    for (let x = Math.max(0, x0); x <= Math.min(p.W - 1, x1); x++) {
      const k = y * p.W + x;
      let a = 0;
      if (p.sombre[k]) a = (1 - lumiereEn(p, x + 0.5, y + 0.5)) * 0.84;
      const brume = 1 - p.rev[k];
      a = 1 - (1 - a) * (1 - brume);
      if (a > 0.01) {
        // bords arrondis au pixel : pas de chevauchement, donc pas de quadrillage
        const xa = Math.round(W2(x)), xb = Math.round(W2(x + 1)), ya = Math.round(H2(y)), yb = Math.round(H2(y + 1));
        g.fillStyle = 'rgba(2,9,18,' + a.toFixed(3) + ')';
        g.fillRect(xa, ya, xb - xa, yb - ya);
      }
    }
  }
  // hors de la carte
  g.fillStyle = '#020912';
  if (W2(0) > 0) g.fillRect(0, 0, W2(0), HAUT);
  if (W2(p.W) < LARG) g.fillRect(W2(p.W), 0, LARG - W2(p.W), HAUT);
  if (H2(0) > 0) g.fillRect(0, 0, LARG, H2(0));
  if (H2(p.H) < HAUT) g.fillRect(0, H2(p.H), LARG, HAUT - H2(p.H));

  // flèche du retour vers Mamie Nacre
  if (p.porte && !p.fini && p.distRetour) {
    const dir = directionRetour(p);
    if (dir) {
      const r = T * (0.95 + Math.sin(temps * 5) * 0.08);
      const ax = W2(s.x) + dir[0] * r, ay = H2(s.y) + dir[1] * r;
      const ang = Math.atan2(dir[1], dir[0]);
      g.save(); g.translate(ax, ay); g.rotate(ang);
      g.fillStyle = '#ffd65a'; g.strokeStyle = '#7a5a08'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(T * 0.3, 0); g.lineTo(-T * 0.12, -T * 0.22); g.lineTo(-T * 0.04, 0); g.lineTo(-T * 0.12, T * 0.22); g.closePath(); g.fill(); g.stroke();
      g.restore();
    }
  }

  // manette sous le doigt
  if (manette.actif) {
    g.strokeStyle = 'rgba(255,255,255,0.35)'; g.lineWidth = 3;
    g.beginPath(); g.arc(manette.ox, manette.oy, 60, 0, Math.PI * 2); g.stroke();
    const dx = manette.x - manette.ox, dy = manette.y - manette.oy, l = Math.hypot(dx, dy), f = l > 60 ? 60 / l : 1;
    g.fillStyle = 'rgba(255,214,90,0.6)';
    g.beginPath(); g.arc(manette.ox + dx * f, manette.oy + dy * f, 20, 0, Math.PI * 2); g.fill();
  }

  // perles et clés qui s'envolent vers le compteur
  for (const v of p.volants) {
    const f = Math.min(1, v.t / 0.6), e = f * f * (3 - 2 * f);
    const x = v.x0 + (v.tx - v.x0) * e, y = v.y0 + (v.ty - v.y0) * e - Math.sin(f * Math.PI) * 50;
    if (v.dessin === 'perle') dessinerPerle(g, x, y, T * 0.16 * (1 - f * 0.3), false, temps);
    else dessinerCle(g, x, y, T * 0.8);
  }

  if (carteVisible) dessinerMiniCarte(p, temps);
}

function directionRetour(p) {
  const s = p.sub, d = p.distRetour;
  let k = Math.floor(s.y) * p.W + Math.floor(s.x);
  if (d[k] < 0) return null;
  for (let i = 0; i < 3; i++) {
    const x = k % p.W, y = (k / p.W) | 0;
    let best = k;
    for (let dd = 0; dd < 4; dd++) { const v = (y + DY[dd]) * p.W + x + DX[dd]; if (d[v] >= 0 && d[v] < d[best]) best = v; }
    if (best === k) break;
    k = best;
  }
  const tx = (k % p.W) + 0.5 - s.x, ty = ((k / p.W) | 0) + 0.5 - s.y;
  const l = Math.hypot(tx, ty);
  if (l < 0.05) { const a = p.tortue.x - s.x, b = p.tortue.y - s.y, m = Math.hypot(a, b) || 1; return [a / m, b / m]; }
  return [tx / l, ty / l];
}

function dessinerMiniCarte(p, temps) {
  const g = ctx;
  const maxL = Math.min(LARG * 0.5, 220), maxH = HAUT * 0.42;
  const e = Math.min(maxL / p.W, maxH / p.H);
  const w = p.W * e, h = p.H * e;
  const x0 = LARG - w - 12, y0 = 150;
  g.fillStyle = 'rgba(2,12,24,0.85)'; g.strokeStyle = '#4fa3c9'; g.lineWidth = 2;
  g.beginPath(); if (g.roundRect) g.roundRect(x0 - 6, y0 - 6, w + 12, h + 12, 10); else g.rect(x0 - 6, y0 - 6, w + 12, h + 12); g.fill(); g.stroke();
  for (let y = 0; y < p.H; y++) {
    for (let x = 0; x < p.W; x++) {
      const k = y * p.W + x;
      if (p.rev[k] < 0.3) continue;
      const ty = p.type[k];
      g.fillStyle = ty === EAU ? (p.sombre[k] ? '#2a5878' : '#5fb4dc') : ty === PORTE ? '#ff8f7a' : ty === EBOULIS ? '#a89a8b' : '#14324a';
      g.fillRect(x0 + x * e, y0 + y * e, e + 0.5, e + 0.5);
    }
  }
  for (const pe of p.perles) if (!pe.pris && p.rev[Math.floor(pe.y) * p.W + Math.floor(pe.x)] > 0.3 && !p.sombre[Math.floor(pe.y) * p.W + Math.floor(pe.x)]) { g.fillStyle = '#fff'; g.fillRect(x0 + pe.x * e - 1.5, y0 + pe.y * e - 1.5, 3, 3); }
  const pg = p.perleGeante;
  if (!pg.prise && p.rev[Math.floor(pg.y) * p.W + Math.floor(pg.x)] > 0.3) { g.fillStyle = '#ff9ad8'; g.beginPath(); g.arc(x0 + pg.x * e, y0 + pg.y * e, 3.5, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#6fd07a'; g.beginPath(); g.arc(x0 + p.tortue.x * e, y0 + p.tortue.y * e, 4, 0, Math.PI * 2); g.fill();
  if (Math.floor(temps * 3) % 2 === 0) { g.fillStyle = '#ffd23f'; g.beginPath(); g.arc(x0 + p.sub.x * e, y0 + p.sub.y * e, 4, 0, Math.PI * 2); g.fill(); }
}

function majEffets(dt) {
  const p = P;
  p.anim += dt;
  if (p.secousse > 0) p.secousse = Math.max(0, p.secousse - dt);
  if (p.joie > 0) p.joie -= dt;
  for (const q of p.particules) {
    q.vie -= dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.genre === 'bulle') q.vx = Math.sin(q.vie * 6) * 0.2; else { q.vx *= 0.94; q.vy *= 0.94; }
  }
  p.particules = p.particules.filter((q) => q.vie > 0);
  if (p.particules.length > 400) p.particules.splice(0, p.particules.length - 400);
  for (const v of p.volants) {
    v.t += dt;
    if (v.t >= 0.6 && !v.fait) { v.fait = true; majHud(); sautiller(v.info); }
  }
  p.volants = p.volants.filter((v) => v.t < 0.6);
  // les cases découvertes apparaissent en douceur
  const reste = [];
  for (const k of p.aReveler) { p.rev[k] = Math.min(1, p.rev[k] + dt * 2.5); if (p.rev[k] < 1) reste.push(k); }
  p.aReveler = reste;
}

/* --- Écran titre : une grotte bleue avec Bulle, Mamie Nacre et des perles --- */
function dessinerAccueil(temps) {
  const g = ctx, w = LARG, h = HAUT;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const grad = g.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#2a9ac0'); grad.addColorStop(0.45, '#0f5a80'); grad.addColorStop(1, '#062a44');
  g.fillStyle = grad; g.fillRect(0, 0, w, h);
  // rayons de soleil
  for (let i = 0; i < 6; i++) {
    const bx = w * (i / 5) + Math.sin(temps * 0.3 + i) * 30;
    g.fillStyle = 'rgba(255,255,230,' + (0.05 + Math.sin(temps * 0.7 + i * 2) * 0.025) + ')';
    g.beginPath(); g.moveTo(bx - 20, 0); g.lineTo(bx + 40, 0); g.lineTo(bx - 60 + 80, h * 0.8); g.lineTo(bx - 160 + 80, h * 0.8); g.fill();
  }
  const u = Math.min(w, h * 0.62) / 10; // unité de taille
  // parois de la grotte
  g.fillStyle = '#0b3a52';
  g.beginPath(); g.moveTo(0, h * 0.18);
  for (let i = 0; i <= 8; i++) g.lineTo(w * 0.16 + Math.sin(i * 1.7) * w * 0.05, h * (0.18 + i * 0.1));
  g.lineTo(0, h); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(w, h * 0.12);
  for (let i = 0; i <= 8; i++) g.lineTo(w * 0.85 + Math.cos(i * 1.3) * w * 0.05, h * (0.12 + i * 0.11));
  g.lineTo(w, h); g.closePath(); g.fill();
  // fond de sable et rochers
  g.fillStyle = '#d8c48f';
  g.beginPath(); g.moveTo(0, h * 0.86);
  for (let x = 0; x <= w; x += 20) g.lineTo(x, h * 0.86 + Math.sin(x * 0.02) * 10);
  g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fill();
  g.fillStyle = '#1d4a5e';
  for (const [rx, ry, rr] of [[0.08, 0.86, 0.12], [0.28, 0.9, 0.08], [0.78, 0.88, 0.13], [0.95, 0.84, 0.1]]) { g.beginPath(); g.ellipse(w * rx, h * ry, w * rr, h * 0.05, 0, Math.PI, 0); g.fill(); }
  // algues
  for (let i = 0; i < 9; i++) {
    const bx = w * (0.04 + i * 0.12), haut = h * (0.12 + (i % 3) * 0.05);
    g.strokeStyle = i % 2 ? '#3f9a55' : '#58b86a'; g.lineWidth = Math.max(5, u * 0.22); g.lineCap = 'round';
    g.beginPath(); g.moveTo(bx, h * 0.88);
    for (let k = 1; k <= 6; k++) g.lineTo(bx + Math.sin(temps * 1.4 + k * 0.7 + i) * u * 0.25, h * 0.88 - haut * k / 6);
    g.stroke();
  }
  // coraux
  g.strokeStyle = '#ff7f6a'; g.lineWidth = Math.max(4, u * 0.16);
  for (const cx of [0.2, 0.68]) {
    const bx = w * cx, by = h * 0.87;
    g.beginPath(); g.moveTo(bx, by); g.lineTo(bx, by - u * 1.2); g.moveTo(bx, by - u * 0.6); g.lineTo(bx - u * 0.5, by - u * 1.1); g.moveTo(bx, by - u * 0.8); g.lineTo(bx + u * 0.45, by - u * 1.3); g.stroke();
  }
  // poissons qui passent
  for (let i = 0; i < 5; i++) {
    const fx = ((temps * (30 + i * 8) + i * 170) % (w + 120)) - 60;
    const fy = h * (0.3 + i * 0.07) + Math.sin(temps + i) * 10;
    dessinerCreature(g, i % 2 ? 'poissonBleu' : 'hippocampe', fx, fy, u * 0.9, 1, temps + i);
  }
  dessinerMeduse(g, w * 0.82, h * 0.38 + Math.sin(temps) * 12, u * 1.1, temps);
  dessinerCreature(g, 'etoile', w * 0.4, h * 0.9, u, 1, temps);
  dessinerCreature(g, 'crabe', w * 0.9, h * 0.9, u, -1, temps);
  // perles qui brillent
  for (const [px, py] of [[0.3, 0.75], [0.36, 0.78], [0.6, 0.72], [0.55, 0.8], [0.15, 0.7]]) dessinerPerle(g, w * px, h * py + Math.sin(temps * 2 + px * 10) * 4, u * 0.18, false, temps);
  dessinerPerle(g, w * 0.48, h * 0.66 + Math.sin(temps * 2) * 5, u * 0.34, true, temps);
  // Mamie Nacre
  dessinerTortue(g, w * 0.7, h * 0.6 + Math.sin(temps * 1.2) * 6, u * 1.9, temps, false);
  // Bulle
  const bx = w * 0.32 + Math.sin(temps * 0.8) * w * 0.06, by = h * 0.5 + Math.sin(temps * 1.6) * h * 0.02;
  dessinerSousMarin(g, bx, by, u * 2.1, 1, temps * 3, { phare: true, incl: Math.cos(temps * 1.6) * 0.06 });
  // bulles
  for (let i = 0; i < 14; i++) {
    const f = (temps * 0.12 + i / 14) % 1;
    g.strokeStyle = 'rgba(225,250,255,' + (0.7 - f * 0.6) + ')'; g.lineWidth = 1.5;
    g.beginPath(); g.arc(w * ((i * 0.37) % 1) + Math.sin(temps + i) * 8, h * (1 - f), 3 + (i % 4) * 2, 0, Math.PI * 2); g.stroke();
  }
}

/* --- Animations des cartes de tutoriel --- */
function dessinerMain(g, x, y, s) {
  g.save(); g.translate(x, y);
  g.fillStyle = '#ffe2c7'; g.strokeStyle = '#7a5a40'; g.lineWidth = 2;
  g.beginPath(); if (g.roundRect) g.roundRect(-s * 0.12, -s * 0.05, s * 0.24, s * 0.5, s * 0.12); else g.rect(-s * 0.12, -s * 0.05, s * 0.24, s * 0.5); g.fill(); g.stroke();
  g.beginPath(); if (g.roundRect) g.roundRect(-s * 0.22, s * 0.25, s * 0.5, s * 0.4, s * 0.15); else g.rect(-s * 0.22, s * 0.25, s * 0.5, s * 0.4); g.fill(); g.stroke();
  g.restore();
}
function dessinerIntroAnim(temps) {
  const c = $('intro-canvas'), g = c.getContext('2d');
  const W = c.width, H = c.height, s = 70;
  const tps = temps - introDebut;
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#1a7aa0'); gr.addColorStop(1, '#0a3b5c');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1d3a30'; g.fillRect(0, H - 34, W, 34);
  const cle = introCle;
  const cyc = (d) => (tps % d) / d;
  if (cle === 'pilotage') {
    const etape = Math.floor(tps / 3) % 3;
    if (etape !== (dessinerIntroAnim.etape || 0)) { dessinerIntroAnim.etape = etape; majTexteIntro(etape); }
    const f = (tps % 3) / 3;
    if (etape === 0) {
      const hx = W * 0.5 + f * 110, hy = H * 0.55;
      g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 3; g.beginPath(); g.arc(W * 0.5, H * 0.55, 50, 0, Math.PI * 2); g.stroke();
      dessinerSousMarin(g, 120 + f * 260, H * 0.4, s, 1, tps * 4, {});
      dessinerMain(g, hx, hy, 90);
    } else if (etape === 1) {
      if (f < 0.55) dessinerPerle(g, 330, H * 0.45, 14, false, tps);
      else for (let i = 0; i < 6; i++) { g.fillStyle = '#fff'; g.beginPath(); g.arc(330 + Math.cos(i) * (f - 0.5) * 120, H * 0.45 + Math.sin(i) * (f - 0.5) * 120, 4, 0, Math.PI * 2); g.fill(); }
      dessinerSousMarin(g, 120 + Math.min(f / 0.55, 1) * 210, H * 0.45, s, 1, tps * 4, {});
    } else {
      dessinerTortue(g, 400, H * 0.55, 80, tps, f > 0.75);
      dessinerSousMarin(g, 100 + Math.min(f / 0.75, 1) * 200, H * 0.42, s, 1, tps * 4, { perle: true });
    }
  } else if (cle === 'oursins') {
    const f = cyc(2.6);
    dessinerOursin(g, 330, H * 0.62, 90, tps);
    const x = f < 0.5 ? 100 + f * 2 * 190 : 290 - (f - 0.5) * 2 * 80;
    dessinerSousMarin(g, x, H * 0.55, s, 1, tps * 4, { clignote: f > 0.5 && Math.floor(tps * 10) % 2 === 0 });
    if (f > 0.5) { g.globalAlpha = 1 - (f - 0.5) * 2; g.fillStyle = '#ff6b81'; g.beginPath(); const hx = 290, hy = H * 0.3 - (f - 0.5) * 80; g.moveTo(hx, hy + 14); g.bezierCurveTo(hx - 26, hy - 4, hx - 10, hy - 22, hx, hy - 8); g.bezierCurveTo(hx + 10, hy - 22, hx + 26, hy - 4, hx, hy + 14); g.fill(); g.globalAlpha = 1; }
  } else if (cle === 'phare') {
    const f = cyc(4);
    const allume = f > 0.25 && f < 0.75;
    dessinerCristal(g, 420, H * 0.62, 70, tps);
    dessinerPerle(g, 300, H * 0.45, 12, false, tps);
    dessinerSousMarin(g, 150, H * 0.45, s, 1, tps * 4, { phare: allume });
    if (!allume) { g.fillStyle = 'rgba(2,9,18,0.82)'; g.fillRect(0, 0, W, H); dessinerSousMarin(g, 150, H * 0.45, s * 0.9, 1, tps * 4, {}); }
    g.fillStyle = allume ? '#ffcf3a' : '#1d4f73'; g.beginPath(); g.arc(W - 60, H - 70, 32, 0, Math.PI * 2); g.fill();
    g.fillStyle = allume ? '#3a2a00' : '#fff'; g.fillRect(W - 68, H - 84, 16, 18); g.fillRect(W - 72, H - 66, 24, 8);
    if (f > 0.15 && f < 0.3) dessinerMain(g, W - 55, H - 70, 70);
  } else if (cle === 'courants') {
    for (let i = 0; i < 10; i++) {
      const fx = ((tps * 140 + i * 60) % (W + 60)) - 30, fy = 70 + (i % 4) * 45;
      g.strokeStyle = 'rgba(200,240,255,0.6)'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(fx - 30, fy); g.lineTo(fx, fy); g.lineTo(fx - 10, fy - 8); g.stroke();
    }
    dessinerSousMarin(g, 80 + cyc(3) * 360, H * 0.48, s, -1, tps * 4, {});
  } else if (cle === 'algues') {
    dessinerSousMarin(g, 80 + cyc(5) * 360, H * 0.45, s, 1, tps * 2, {});
    for (let i = 0; i < 9; i++) {
      const bx = 140 + i * 30;
      g.strokeStyle = i % 2 ? 'rgba(63,154,85,0.9)' : 'rgba(88,184,106,0.9)'; g.lineWidth = 7; g.lineCap = 'round';
      g.beginPath(); g.moveTo(bx, H - 30); g.quadraticCurveTo(bx + Math.sin(tps * 1.5 + i) * 20, H * 0.5, bx + Math.sin(tps * 1.5 + i + 1) * 12, 40); g.stroke();
    }
  } else if (cle === 'portes') {
    const f = cyc(4);
    if (f < 0.35) dessinerCle(g, 200, H * 0.45, 70);
    const ouvert = f > 0.7;
    if (!ouvert) {
      g.strokeStyle = '#ff7f6a'; g.lineWidth = 9; g.lineCap = 'round';
      for (let i = 0; i < 4; i++) { const bx = 380 + (i % 2) * 22; g.beginPath(); g.moveTo(bx, H - 34); g.lineTo(bx, 40); g.stroke(); }
    }
    const x = f < 0.35 ? 70 + f / 0.35 * 130 : f < 0.7 ? 200 + (f - 0.35) / 0.35 * 140 : 340 + (f - 0.7) / 0.3 * 150;
    dessinerSousMarin(g, x, H * 0.45, s, 1, tps * 4, {});
    if (f > 0.35 && f < 0.7) dessinerCle(g, x - 40, H * 0.3, 40);
  } else if (cle === 'eboulis') {
    const f = cyc(4);
    dessinerCoffre(g, 420, H * 0.62, 90, false);
    if (f < 0.55) for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#8d7f73' : '#a89a8b'; g.beginPath(); g.arc(360 + (i % 2) * 20, 60 + i * 34, 18, 0, Math.PI * 2); g.fill(); }
    dessinerSousMarin(g, 100 + Math.min(f / 0.5, 1) * 220, H * 0.45, s, 1, tps * 4, { pince: true });
  } else if (cle === 'lanterne') {
    const f = cyc(5);
    g.fillStyle = '#1d3a30'; g.fillRect(400, 0, 120, H);
    if (f > 0.65) { g.fillStyle = '#0a3b5c'; g.fillRect(400, 90, 120, 110); dessinerPerle(g, 450, 140, 12, false, tps); dessinerPerle(g, 490, 160, 12, false, tps); }
    dessinerLanterne(g, 160 + Math.min(f / 0.65, 1) * 220, H * 0.47, 70, tps, 1);
    dessinerSousMarin(g, 70 + Math.min(f / 0.65, 1) * 180, H * 0.5, s, 1, tps * 4, {});
  } else if (cle === 'air') {
    const f = cyc(5);
    const niveau = f < 0.5 ? 1 - f * 1.4 : 0.3 + (f - 0.5) * 1.4;
    g.fillStyle = '#1b3346'; g.fillRect(140, 24, 240, 20);
    g.fillStyle = niveau < 0.35 ? '#ff8a6a' : '#9fe9ff'; g.fillRect(140, 24, 240 * Math.min(1, niveau), 20);
    for (let i = 0; i < 6; i++) { const fy = H - 34 - ((tps * 70 + i * 40) % (H - 70)); g.strokeStyle = 'rgba(225,250,255,0.85)'; g.lineWidth = 2; g.beginPath(); g.arc(380 + Math.sin(tps * 3 + i) * 8, fy, 6 + (i % 3) * 3, 0, Math.PI * 2); g.stroke(); }
    dessinerSousMarin(g, f < 0.5 ? 120 + f * 2 * 260 : 380, H * 0.55, s, 1, tps * 4, {});
  } else if (cle === 'glace') {
    g.fillStyle = 'rgba(220,245,255,0.18)'; g.fillRect(0, 0, W, H);
    const f = cyc(3);
    const x = 80 + (1 - Math.pow(1 - f, 3)) * 360;
    for (let i = 0; i < 4; i++) { g.strokeStyle = 'rgba(255,255,255,' + (0.5 - i * 0.1) + ')'; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 50 - i * 18, H * 0.4 + i * 10); g.lineTo(x - 80 - i * 18, H * 0.4 + i * 10); g.stroke(); }
    dessinerSousMarin(g, x, H * 0.5, s, 1, tps * 4, {});
  } else if (cle === 'meduses') {
    const f = cyc(4);
    const my = H * 0.5 + Math.sin(tps * 1.6) * 90;
    dessinerMeduse(g, 300, my, 90, tps);
    const x = f < 0.4 ? 80 + f / 0.4 * 120 : f < 0.6 ? 200 : 200 + (f - 0.6) / 0.4 * 260;
    dessinerSousMarin(g, x, H * 0.5, s, 1, tps * 4, {});
  } else if (cle === 'geysers') {
    const f = cyc(3);
    g.fillStyle = '#5a3a32'; g.beginPath(); g.moveTo(230, H - 34); g.lineTo(250, H - 60); g.lineTo(290, H - 60); g.lineTo(310, H - 34); g.fill();
    if (f > 0.3 && f < 0.6) for (let i = 0; i < 4; i++) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.beginPath(); g.arc(260 + i * 8, H - 70 - ((tps * 60 + i * 15) % 40), 4, 0, Math.PI * 2); g.stroke(); }
    if (f >= 0.6) { const gg = g.createLinearGradient(0, H - 60, 0, 20); gg.addColorStop(0, 'rgba(255,240,230,0.7)'); gg.addColorStop(1, 'rgba(255,240,230,0)'); g.fillStyle = gg; g.beginPath(); g.moveTo(255, H - 60); g.lineTo(225, 20); g.lineTo(315, 20); g.lineTo(285, H - 60); g.fill(); }
    const y = f >= 0.6 ? H * 0.5 - (f - 0.6) * 300 : H * 0.5;
    dessinerSousMarin(g, f < 0.6 ? 120 + f / 0.6 * 150 : 270, Math.max(40, y), s, 1, tps * 4, {});
  }
}

/* ==========================================================================
   Boucle principale
   ========================================================================== */
let derniere = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.05, Math.max(0, (maintenant - derniere) / 1000));
  derniere = maintenant;
  const temps = maintenant / 1000;
  try {
    if (ecran === 'jeu' && P) {
      if (!enPause && !introOuverte && !P.fini) majPartie(dt);
      if (!enPause) majEffets(dt);
      dessinerPartie(P.anim);
    } else dessinerAccueil(temps);
    if (introOuverte) dessinerIntroAnim(temps);
  } catch (e) {
    setTimeout(() => { throw e; });
  }
  requestAnimationFrame(boucle);
}

/* ==========================================================================
   Boutons
   ========================================================================== */
function demarrer() {
  son('clic');
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => {
      const n = entier(d && d.niveau, 1, NIVEAUX.length, 1);
      prog.debloque = Math.max(prog.debloque, n);
      lancerNiveau(n - 1);
    },
    onNouvelle: () => lancerNiveau(0),
    onEffacer: () => {
      prog.etoiles = NIVEAUX.map(() => 0); prog.records = NIVEAUX.map(() => 0);
      prog.debloque = 1; prog.depense = 0; prog.carnet = []; prog.intros = [];
      AMELIOS.forEach((a) => { prog.amelio[a.cle] = 0; });
      lancerNiveau(0);
    },
  });
}
$('b-jouer').addEventListener('click', demarrer);

document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));
$('b-pause').innerHTML = SVG.pause;
$('b-pause').addEventListener('click', () => { son('clic'); ouvrirPause(); });
$('b-carte').innerHTML = SVG.carte;

$('b-reprendre').addEventListener('click', reprendre);
$('b-recommencer').addEventListener('click', () => { son('clic'); lancerNiveau(P.n); });
$('b-pause-niveaux').addEventListener('click', () => { son('clic'); montrer('niveaux'); });
$('b-pause-accueil').addEventListener('click', () => { son('clic'); montrer('titre'); });
$('b-suivant').addEventListener('click', () => { son('clic'); lancerNiveau(P.n + 1); });
$('b-reessayer').addEventListener('click', () => { son('clic'); lancerNiveau(P.n); });
$('b-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(P.n); });
$('b-fin-niveaux').addEventListener('click', () => { son('clic'); montrer('niveaux'); });
$('b-fin-accueil').addEventListener('click', () => { son('clic'); montrer('titre'); });
$('b-bilan').addEventListener('click', afficherBilan);
$('b-bilan-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(0); });
$('b-bilan-carnet').addEventListener('click', () => { son('clic'); montrer('carnet'); });
$('b-bilan-accueil').addEventListener('click', () => { son('clic'); montrer('titre'); });
window.addEventListener('keydown', (e) => {
  if (ecran === 'titre' && (e.code === 'Enter') && document.activeElement === document.body) { e.preventDefault(); demarrer(); }
});

// Sauvegarde à la fermeture de la page, seulement pendant une plongée
JEL_SAVE.surFermeture(() => {
  if (ecran === 'jeu' && P && partieEnCours && !P.fini) JEL_SAVE.save(JEU, { niveau: P.n + 1, score: scoreTotal(), prog: copieProg(), options: { son: sonActif } });
});

document.title = tr('titre');
chargerProg();
majBoutonsSon();
montrer('titre');
requestAnimationFrame(boucle);
</script>
