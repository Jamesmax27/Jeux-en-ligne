  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    // En partie et au-dessus d'une fenêtre : en haut, pour ne cacher ni l'étal ni les boutons.
    el.classList.toggle('haut', ecran === 'jeu' || salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');

  function construireEnclos() {
    const boite = $('grille-enclos');

      const tag = document.createElement('span'); tag.className = 'tag';

      tete.append(tag, esp);
      const cv = document.createElement('canvas'); cv.className = 'scene';
      const nerv = document.createElement('div'); nerv.className = 'nerv';
      nerv.innerHTML = ICONE_NERV;
      const barre = document.createElement('div'); barre.className = 'barre';
      barre.appendChild(document.createElement('i'));

      salon.appendChild(d);

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {

    txt.textContent = nom;
    tag.appendChild(txt);

  function siegesActuels() {
    if (!partie) return [];

  const especeDe = (s) => (vue && vue.sp ? vue.sp[s] : s);

  }

  function majEnclos() {

    const moi = partie ? partie.siege : -1;
    for (let s = 0; s < PLACES; s++) {

    }
  }

  function majHeures() {
    const boite = $('heures'), e = vue;

  // L'étal commun : une carte par ressource.

    if (cle === etalCle) return;
    const ancien = etalCle.split('|')[0].split(',');

    e.et.forEach((k, a) => {

  function texteMessage() {

    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (e.out[partie.siege] >= 0) return tr('tour.dehors');
    if (s === partie.siege) return choix >= 0 ? tr('tour.choisi', { res: tr('res.' + e.et[choix]) }) : tr('tour.toi');
    const info = siegesActuels()[s] || {};
    return info.nom ? tr('tour.nom', { nom: info.nom }) : tr('tour.robot', { espece: tr('espece.' + especeDe(s)) });
  }

  function majInfos() {
    let info = '';
    const e = vue;

    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majEnclos();
    if (vue) majHeures();
    majEtal();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle() {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    dessinerJeu(performance.now());
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    for (let s = 0; s < PLACES; s++) {
      const cv = document.querySelector('#enclos-' + s + ' canvas.scene');
      if (!cv) continue;
      const w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) continue;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      const c = cv.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.clearRect(0, 0, w, h);
      const e = vue;
      const st = e ? { sp: e.sp[s], v: e.v[s], l: e.l[s], c: e.c[s], nv: e.nv[s], rod: e.rdo && e.rod === s, out: e.out[s] >= 0, cl: !!e.cl }
        : { sp: s, v: 3, l: 3, c: 3, nv: 0, rod: false, out: false, cl: true };
      dessinerEnclos(c, 0, 0, w, h, st, t + s * 777);
    }
  }

  // Petit texte qui monte dans un enclos (« +2 », « −2 »…).
  function flotter(s, texte, couleur, retard) {
    const boite = document.querySelector('#enclos-' + s + ' .flot');
    if (!boite) return;
    setTimeout(() => {
      const sp = document.createElement('span');
      sp.textContent = texte; sp.style.color = couleur || '#fff';
      boite.appendChild(sp);
      setTimeout(() => sp.remove(), 1400);
    }, retard || 0);
  }

  function secouer(s) {
    const d = $('enclos-' + s);
    if (!d) return;
    d.classList.remove('secoue'); void d.offsetWidth; d.classList.add('secoue');
  }

  function flash() {
    const f = $('flash');
    f.style.transition = 'none'; f.style.opacity = '0.75';
    void f.offsetWidth;
    f.style.transition = 'opacity .6s'; f.style.opacity = '0';
  }

  // Ressource qui vole de l'étal jusqu'à l'enclos.
  function voler(a, k, s) {
    const depart = document.querySelector('#etal .res[data-a="' + a + '"]');
    const arrivee = $('enclos-' + s);
    if (!depart || !arrivee) return;
    const r1 = depart.getBoundingClientRect(), r2 = arrivee.getBoundingClientRect();
    const v = document.createElement('div'); v.className = 'vol';
    const cv = document.createElement('canvas'); cv.width = 88; cv.height = 88;
    icone(cv.getContext('2d'), k, 44, 46, 34);
    v.appendChild(cv);
    v.style.left = (r1.left + r1.width / 2 - 22) + 'px';
    v.style.top = (r1.top + r1.height / 2 - 22) + 'px';
    document.body.appendChild(v);
    const dx = (r2.left + r2.width / 2) - (r1.left + r1.width / 2), dy = (r2.top + r2.height / 2) - (r1.top + r1.height / 2);
    requestAnimationFrame(() => { v.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.25)'; v.style.opacity = '0.2'; });
    setTimeout(() => v.remove(), 520);
  }

  // Rapport de fin d'heure : liste des événements, effets et sons.
  let minuteurAlerte = 0;
  function montrerAlerte(e) {
    const boite = $('alerte');
    boite.textContent = '';
    const titre = document.createElement('b');
    titre.textContent = e.fini && e.fh >= e.H ? tr('alerte.aube') : tr('alerte.titre', { h: e.fh });
    boite.appendChild(titre);
    const lignes = [];
    let tonnerre = false, delai = 0;
    e.ev.forEach((x) => {
      const p = { nom: nomLong(x.s) };
      let cle = 'alerte.' + x.k, classe = '';
      if (x.k === 'echange') p.autre = nomLong(x.d);
      if (x.k === 'craque' || x.k === 'rodeur' || x.k === 'coupure') classe = 'grave';
      if (x.k === 'repousse') classe = 'bon';
      lignes.push([tr(cle, p), classe]);
      // effets
      if (x.k === 'vent') { tonnerre = true; flotter(x.s, '−1', '#d9a46a', 200); }
      else if (x.k === 'coupure') { setTimeout(() => sons.coupure(), delai); secouer(x.s); delai += 250; }
      else if (x.k === 'terrier') { setTimeout(() => sons.terrier(), delai); secouer(x.s); flotter(x.s, '−2', '#d9a46a', 250); delai += 250; }
      else if (x.k === 'echange') { flotter(x.s, '−2', '#ffd24d', 200); flotter(x.d, '+2', '#ffd24d', 400); }
      else if (x.k === 'rug') { setTimeout(() => sons.rugissement(), delai); secouer(x.s); delai += 400; }
      else if (x.k === 'rodeur') { setTimeout(() => sons.rodeur(), delai); secouer(x.s); delai += 400; }
      else if (x.k === 'craque') { setTimeout(() => sons.craque(), delai + 200); secouer(x.s); delai += 400; }
    });
    for (let s = 0; s < PLACES; s++) {
      const d = e.dn[s];
      if (d > 0) flotter(s, '+' + nb(d) + ' ⚡', '#ff8a7a', 650);
      else if (d < 0 && e.out[s] < 0) flotter(s, '−' + nb(-d) + ' ⚡', '#8fe0a2', 650);
    }
    if (!lignes.length) lignes.push([tr('alerte.calme'), 'bon']);
    lignes.forEach((l) => { const p = document.createElement('p'); p.textContent = l[0]; if (l[1]) p.className = l[1]; boite.appendChild(p); });
    if (tonnerre) { flash(); sons.tonnerre(); } else sons.alerte();
    if (!e.ev.length) sons.calme();
    boite.classList.add('actif');
    clearTimeout(minuteurAlerte);
    minuteurAlerte = setTimeout(() => boite.classList.remove('actif'), 2300 + lignes.length * 450);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    debutTour = Date.now();
    etalCle = '';
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + especeDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, especeDe(s), 56, 62, 44);
        if (info.chef) couronne(c, 56, 20, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { espece: tr('espece.' + especeDe(s)) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef || tr('couleur.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    debutTour = Date.now();
    dernierTic = -1;
    choix = -1;
    etalCle = '';
    aChasse = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    $('alerte').classList.remove('actif');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const avant = ev.avant, apres = ev.apres;
    const der = apres.der;
    if (der) {
      voler(der.a, der.k, der.s);
      sons.pose(der.k);
      const txt = der.k === 3 ? '−' + nb(O.EFFET[3]) + ' ⚡' : '+' + nb(O.EFFET[der.k]);
      flotter(der.s, txt, der.k === 3 ? '#8fe0a2' : '#ffd27a', 380);
      if (der.ch) { toast(tr('alerte.chasse', { nom: nomLongAvec(apres, der.s) })); if (ev.moi) aChasse = true; }
    }
    vue = JSON.parse(JSON.stringify(apres));
    if (apres.fh !== avant.fh) montrerAlerte(vue);
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.moi) choix = -1;
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.siege >= 0 && apres.out[partie.siege] >= 0 && avant.out[partie.siege] < 0 && session === 'ligne' && !apres.fini) toast(tr('tour.dehors'), 3200);
    if (partie.phase === 'jeu' && !apres.fini && R.aQui(vue) === partie.siege && !ev.moi) sons.tour();
  }
  function nomLongAvec(e, s) { const v0 = vue; vue = e; const n = nomLong(s); vue = v0; return n; }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      $('alerte').classList.remove('actif');
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1900);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    if (gagne) { gagnerBadges(e, moi, true); sauverRecompenses(); }
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement, récompenses
  // ---------------------------------------------------------------------

  function etoilesPour(nv, gagne) {
    if (!gagne) return 0;
    return nv <= 2 ? 3 : nv <= 5 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      const out = e.out[s] >= 0;
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '') + (out ? ' out' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 68; cv.height = 68; medaillon(cv.getContext('2d'), s, e.sp[s], 34, 34, 32);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('espece.' + e.sp[s]) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = out ? tr('cl.craque', { h: e.out[s] }) : tr('cl.calme', { n: e.nv[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Badges et fiches gagnés à la fin d'une nuit gagnée ; renvoie les textes à montrer.
  function gagnerBadges(e, moi, enLigne) {
    const nouveaux = [];
    const ajouter = (b) => { if (prog.badges.indexOf(b) < 0) { prog.badges.push(b); nouveaux.push(tr('fin.badge', { badge: tr('badge.' + b + '.titre') })); } };
    const sp = e.sp[moi];
    if (prog.fiches.indexOf(sp) < 0) { prog.fiches.push(sp); nouveaux.unshift(tr('fin.fiche', { espece: tr('espece.' + sp) })); }
    ajouter('aube');
    if (enLigne) ajouter('enligne');
    if (etoilesPour(e.nv[moi], true) === 3) ajouter('parfaite');
    if (e.nv[moi] === 0) ajouter('zen');
    if (aChasse) ajouter('chasseur');
    if (O.vivants(e).length === 1) ajouter('dernier');
    if (!enLigne && e.n >= 9 && e.mx[moi] <= 6) ajouter('sangfroid');
    const gagnes = prog.etoiles.filter((x) => x > 0).length;
    if (gagnes >= 10) ajouter('veteran');
    if (gagnes >= NIVEAUX.length) ajouter('legende');
    return nouveaux;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    const craque = moi >= 0 && e.out[moi] >= 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? (craque ? tr('fin.craqueHeure', { h: e.out[moi] }) : tr('fin.calme', { n: e.nv[moi] })) : '';
    $('fin-gains').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(e.nv[moi], gagne);
      const calme = craque ? 0 : 10 - e.nv[moi];
      const ancienRecord = prog.records[i];
      const record = gagne && calme > ancienRecord;
      if (record) prog.records[i] = calme;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        const gains = gagnerBadges(e, moi, false);
        $('fin-gains').textContent = gains.join(' · ');
        sauver(Math.min(niveau + 1, NIVEAUX.length), calme);
        // Parcours solo terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      let titre = 'fin.perdu';
      if (gagne) titre = O.vivants(e).length === 1 ? 'fin.dernier' : 'fin.gagne';
      else if (!craque) titre = 'fin.battu';
      $('fin-titre').textContent = tr(titre);
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = gagne ? (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, calme) })) : '';
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.toutes') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil

  // Compte à rebours avant la manche suivante (robots sur l'appareil, après « Avec d'autres joueurs »).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  // ---------------------------------------------------------------------
  //  Tutoriels animés (démonstration en boucle, se ferme d'un toucher)

  // Main qui montre le geste, doigt en (x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#1b2433'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }
  // Carte de l'étal dessinée dans le tutoriel.
  function carteTuto(c, k, x, y, lift, choisi) {
    c.save();
    c.fillStyle = '#1d2a40'; c.strokeStyle = choisi ? '#ffc23a' : '#4c6286'; c.lineWidth = 3;
    rr(c, x - 30, y - 34 - lift, 60, 68, 12); c.fill(); c.stroke();
    icone(c, k, x, y - lift, 22);
    c.restore();
  }
  function barreNerv(c, x, y, w, nv) {
    c.fillStyle = '#223049'; rr(c, x, y, w, 10, 5); c.fill();
    const g = c.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#6fd08c'); g.addColorStop(0.5, '#ffd24d'); g.addColorStop(1, '#ff5a4f');
    c.fillStyle = g; rr(c, x, y, Math.max(0.01, w * nv / 10), 10, 5); c.fill();
  }
  const lisse = (a, b, x) => Math.max(0, Math.min(1, (x - a) / (b - a)));
  const mix = (a, b, q) => a + (b - a) * q;

  // Une image de la démonstration « cle » au temps t (ms, en boucle).
  function imageTuto(c, cle, t) {
    const P = 4400, u = t % P;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, 560, 360);
    const base = { sp: 0, v: 3, l: 3, c: 3, nv: 2, rod: false, out: false, cl: true };
    // Geste « prendre puis poser » : carte en (cx, cy) vers l'enclos (ex, ey).
    const geste = (k, cx, cy, ex, ey, t0) => {
      const q1 = lisse(t0, t0 + 700, u), q2 = lisse(t0 + 900, t0 + 1700, u);
      let hx = mix(500, cx, q1), hy = mix(350, cy, q1);
      if (q2 > 0) { hx = mix(cx, ex, q2); hy = mix(cy, ey, q2); }
      if (q2 > 0 && q2 < 1) icone(c, k, hx, hy - 10, 20);
      main(c, hx, hy, 1.4, q1 >= 1 && q2 === 0 ? 1 : (q2 >= 1 && u < t0 + 2000 ? 1 : 0));
      return q2 >= 1;
    };
    if (cle === 'base' || cle === 'cloture' || cle === 'fusee' || cle === 'coupure' || cle === 'terrier') {
      const k = { base: 0, cloture: 2, fusee: 3, coupure: 1, terrier: 2 }[cle];
      const st = Object.assign({}, base, { cl: cle !== 'base' });
      if (cle === 'base') st.v = 1;
      if (cle === 'cloture') { st.c = u < 600 ? 2 : 1; st.sp = 2; }
      if (cle === 'fusee') { st.nv = 8; st.sp = 4; }
      if (cle === 'coupure') { st.l = u < 900 ? 4 : 0; st.sp = 1; }
      if (cle === 'terrier') { st.c = u < 900 ? 4 : 2; st.sp = 6; }
      const cartes = cle === 'base' ? [1, 0, 1] : cle === 'cloture' ? [0, 2, 1] : cle === 'fusee' ? [1, 3, 0] : cle === 'coupure' ? [0, 1, 2] : [1, 2, 0];
      const t0 = cle === 'coupure' || cle === 'terrier' ? 1500 : 300;
      const fait = lisse(t0 + 1700, t0 + 1900, u) >= 1;
      if (fait) {
        if (k === 0) st.v = 3; else if (k === 1) st.l = 3; else if (k === 2) st.c = Math.min(5, st.c + 2); else st.nv = 6;
      }
      dessinerEnclos(c, 150, 10, 260, 210, st, t);
      if (cle !== 'base') barreNerv(c, 150, 226, 260, st.nv);
      if (cle === 'terrier' && u > 900 && u < 1600) { // petit qui creuse : terre qui gicle
        c.fillStyle = '#6b4a2a';
        for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI; rond(c, 200 + Math.cos(a) * (u - 900) / 30, 170 - Math.sin(a) * (u - 900) / 25, 3); c.fill(); }
        dino(c, 4, 200, 185, 0.32, 0.2, t);
      }
      if (cle === 'fusee' && fait && u < t0 + 2600) { c.fillStyle = 'rgba(255,240,180,' + (0.5 * (1 - lisse(t0 + 1900, t0 + 2600, u))).toFixed(3) + ')'; c.fillRect(150, 10, 260, 210); }
      cartes.forEach((x, i) => carteTuto(c, x, 200 + i * 80, 300, x === k && lisse(t0, t0 + 700, u) >= 1 && u < t0 + 900 ? 8 : 0, x === k && u > t0 + 700 && u < t0 + 900));
      geste(k, 200 + cartes.indexOf(k) * 80, 300, 280, 120, t0);
      return;
    }
    if (cle === 'phobie') {
      const st1 = Object.assign({}, base, { sp: 1, l: 0, nv: u < 1400 ? 2 : 5 });
      const st2 = Object.assign({}, base, { sp: 0, l: 0, nv: u < 1400 ? 2 : 4 });
      dessinerEnclos(c, 20, 20, 250, 220, st1, t);
      dessinerEnclos(c, 290, 20, 250, 220, st2, t + 400);
      barreNerv(c, 20, 250, 250, st1.nv); barreNerv(c, 290, 250, 250, st2.nv);
      if (u > 1400) {
        icone(c, 4, 145, 300, 18 + Math.sin(t / 120) * 3);
        icone(c, 4, 415, 300, 16);
      }
      return;
    }
    if (cle === 'rugissement') {
      const nvs = [u < 1500 ? 3 : 4, 8, u < 1500 ? 3 : 4];
      for (let i = 0; i < 3; i++) {
        dessinerEnclos(c, 10 + i * 182, 30, 172, 200, Object.assign({}, base, { sp: [3, 4, 7][i], nv: nvs[i] }), t + i * 300);
        barreNerv(c, 10 + i * 182, 240, 172, nvs[i]);
      }
      if (u > 800 && u < 1800) { // ondes du rugissement
        c.strokeStyle = 'rgba(255,138,122,.8)'; c.lineWidth = 4;
        for (let k = 0; k < 3; k++) { const r = ((u - 800) / 6 + k * 40) % 140; c.globalAlpha = 1 - r / 140; c.beginPath(); c.arc(280, 140, r + 20, 0, Math.PI * 2); c.stroke(); }
        c.globalAlpha = 1;
      }
      return;
    }
    if (cle === 'etal' || cle === 'double') {
      if (cle === 'etal') {
        const q = lisse(1000, 1800, u);
        [0, 1, 2, 3, 1].forEach((k, i) => { c.globalAlpha = i === 4 ? 1 - q : 1; carteTuto(c, k, 120 + i * 80, 200 + (i === 4 ? q * 40 : 0), 0, false); });
        c.globalAlpha = 1;
      } else {
        dessinerEnclos(c, 30, 20, 240, 220, Object.assign({}, base, { sp: 5, l: u > 900 ? 0 : 3 }), t);
        dessinerEnclos(c, 290, 20, 240, 220, Object.assign({}, base, { sp: 3, c: u > 1900 ? 1 : 3 }), t + 300);
        [[900, 150], [1900, 410]].forEach((p) => {
          if (u > p[0] && u < p[0] + 900) { c.fillStyle = 'rgba(255,90,79,' + (0.6 * (1 - lisse(p[0], p[0] + 900, u))).toFixed(3) + ')'; rr(c, p[1] - 120, 20, 240, 220, 10); c.fill(); }
        });
      }
      return;
    }
    if (cle === 'echange') {
      const q = lisse(1000, 2200, u);
      const st1 = Object.assign({}, base, { sp: 2, l: q >= 1 ? 3 : 5 });
      const st2 = Object.assign({}, base, { sp: 6, l: q >= 1 ? 3 : 1 });
      dessinerEnclos(c, 20, 30, 230, 210, st1, t);
      dessinerEnclos(c, 310, 30, 230, 210, st2, t + 300);
      if (q > 0 && q < 1) icone(c, 4, mix(200, 380, q), 135 - Math.sin(q * Math.PI) * 60, 22);
      return;
    }
    if (cle === 'rodeur') {
      const ls = [4, 1, 3];
      const pos = u < 1600 ? 0 : 1;
      const chasse = u > 3000;
      for (let i = 0; i < 3; i++) {
        const st = Object.assign({}, base, { sp: [0, 3, 2][i], l: ls[i], nv: i === 1 ? (u > 2000 ? (chasse ? 4 : 6) : 4) : 2, rod: !chasse ? i === pos : i === 2 });
        dessinerEnclos(c, 10 + i * 182, 20, 172, 200, st, t + i * 200);
        barreNerv(c, 10 + i * 182, 228, 172, st.nv);
      }
      if (u > 1000 && u < 1600) rodeur(c, mix(70, 230, lisse(1000, 1600, u)), 70, 1.1, t, true);
      carteTuto(c, 3, 280, 305, 0, u > 2400 && u < 2700);
      geste(3, 280, 305, 280, 120, 1800);
      return;
    }
    if (cle === 'tempete') {
      const fl = (u > 600 && u < 720) || (u > 800 && u < 870);
      dessinerEnclos(c, 30, 20, 240, 220, Object.assign({}, base, { sp: 7, c: u > 700 ? 2 : 3 }), t);
      dessinerEnclos(c, 290, 20, 240, 220, Object.assign({}, base, { sp: 1, c: u > 700 ? 1 : 2 }), t + 300);
      if (fl) { c.fillStyle = 'rgba(220,230,255,.6)'; c.fillRect(0, 0, 560, 360); }
    }
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');

    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      imageTuto(c, cle, t - debut);
      id = requestAnimationFrame(image);
    }
    id = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(id);
      fermerVoile('voile-tuto');

      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };

  // ---------------------------------------------------------------------
  //  Gestes : toucher une ressource puis son enclos, ou la faire glisser ;
  //  clavier : flèches et Entrée, touches 1 à 5
  // ---------------------------------------------------------------------

  function peutJouer() { return partie && !enPause && !attenteTuto && partie.monTour(); }

  function refuser() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') {
      dernierAttends = Date.now();
      const moiOut = vue && partie.siege >= 0 && vue.out[partie.siege] >= 0;
      toast(tr(moiOut ? 'tour.dehors' : 'tour.attends'), 1400); sons.non();
    }
  }

  function choisir(a) {
    if (!peutJouer()) { refuser(); return; }
    if (choix === a) { poserChoix(); return; }
    choix = a; sons.prend();
    majInterface();
  }

  function poserChoix() {
    if (!peutJouer() || choix < 0) return;
    const a = choix;
    if (partie.jouer(a)) { choix = -1; }
    majInterface();
  }

  function toucherEnclos(s) {
    audio();
    if (!partie || choix < 0) return;
    if (s !== partie.siege) { toast(tr('tour.pasLa'), 1600); sons.non(); return; }
    poserChoix();
  }

  // Carte de l'étal : toucher = choisir (2e toucher = poser), glisser jusqu'à son enclos = poser.
  function brancherCarte(b, a) {
    let appui = null, fantome = null;
    b.addEventListener('pointerdown', (ev) => {
      audio();
      appui = { x: ev.clientX, y: ev.clientY, id: ev.pointerId, glisse: false };
      try { b.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
    });
    b.addEventListener('pointermove', (ev) => {
      if (!appui || ev.pointerId !== appui.id) return;
      if (!appui.glisse && Math.hypot(ev.clientX - appui.x, ev.clientY - appui.y) > 14 && peutJouer()) {
        appui.glisse = true;
        choix = a; majEnclos();
        fantome = document.createElement('div'); fantome.className = 'vol';
        fantome.style.transition = 'none';
        const cv = document.createElement('canvas'); cv.width = 88; cv.height = 88;
        icone(cv.getContext('2d'), vue.et[a], 44, 46, 34);
        fantome.appendChild(cv);
        document.body.appendChild(fantome);
        sons.prend();
      }
      if (fantome) { fantome.style.left = (ev.clientX - 22) + 'px'; fantome.style.top = (ev.clientY - 30) + 'px'; }
    });
    const fin = (ev, annule) => {
      if (!appui || ev.pointerId !== appui.id) return;
      const glisse = appui.glisse;
      appui = null;
      if (fantome) { fantome.remove(); fantome = null; }
      if (annule) return;
      if (glisse) {
        const cible = partie ? $('enclos-' + partie.siege) : null;
        const r = cible ? cible.getBoundingClientRect() : null;
        if (r && ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) poserChoix();
        else majInterface();
      } else choisir(a);
    };
    b.addEventListener('pointerup', (ev) => fin(ev, false));
    b.addEventListener('pointercancel', (ev) => fin(ev, true));
    // Clavier (Entrée sur une carte qui a le focus).
    b.addEventListener('keydown', (ev) => {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') { ev.preventDefault(); ev.stopPropagation(); audio(); choisir(a); }
    });
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue) return;
    const n = vue.et.length;
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      if (!peutJouer()) { refuser(); return; }
      const d = ev.code === 'ArrowLeft' ? -1 : 1;
      choix = choix < 0 ? (d > 0 ? 0 : n - 1) : (choix + d + n) % n;
      sons.clic(); majInterface();
      const b = document.querySelector('#etal .res[data-a="' + choix + '"]'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ }
    } else if (/^(Digit|Numpad)[1-5]$/.test(ev.code)) {
      const a = parseInt(ev.code.slice(-1), 10) - 1;
      if (a < n) { ev.preventDefault(); audio(); choisir(a); }
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter' || ev.code === 'ArrowDown') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && ev.code !== 'ArrowDown') return;
      ev.preventDefault(); audio();
      if (!peutJouer()) { refuser(); return; }
      if (choix < 0) { choix = 0; sons.clic(); majInterface(); return; }
      poserChoix();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-carnet').addEventListener('click', () => { audio(); sons.clic(); ouvrirCarnet(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('carnet-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 && vue.out[partie.siege] < 0 ? 10 - vue.nv[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construireEnclos();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
