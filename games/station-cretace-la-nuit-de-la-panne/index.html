    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, m, siegesActuels(), $('fin-classement'));
    const heures = Math.max(1, craque ? e.mort[m] - 1 : e.h);
    $('fin-points').textContent = m >= 0 ? tr('fin.calme', { n: e.cal[m], max: heures * O.MAXN }) : '';
    let raison = '';
    // à calme égal, c'est l'enclos le mieux tenu qui passe devant (règles : fin)
    const p1 = res ? res.classement[0] : -1, p2 = res ? res.classement[1] : -1;
    const egal = res && O.debout(e, p1) && O.debout(e, p2) && e.cal[p1] === e.cal[p2];
    if (craque) raison = tr('fin.raisonCraque', { n: e.mort[m] });
    else if (gagne) raison = e.h < e.H ? tr('fin.raisonDernier') : tr(egal ? 'fin.raisonAubeEgalite' : 'fin.raisonAube');
    else if (res) raison = tr(egal && e.cal[m] === e.cal[p1] ? 'fin.raisonEgalite' : 'fin.raisonBattu', { qui: qui(p1) });
    $('fin-raison').textContent = raison;
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = gagne ? etoilesPour(e.cal[m], e.h) : 0;
      const ancienRecord = prog.records[i];
      const record = gagne && e.cal[m] > ancienRecord;
      if (record) prog.records[i] = e.cal[m];
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
      }
      const neufs = badgesNuit(e, m, gagne);
      if (gagne) {
        sauver(Math.min(niveau + 1, NIVEAUX.length), e.cal[m]);
        // Parcours solo terminé (les 20 nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, 0);
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : (craque ? tr('fin.craque') : tr('fin.perdu'));
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = gagne ? (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, e.cal[m]) })) : (ancienRecord ? tr('fin.record', { n: ancienRecord }) : '');
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-gains').textContent = neufs.length ? neufs.map((x) => tr('fin.badge', { nom: x })).join('\n') : '';
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      // nuit perdue avant l'aube : les robots n'ont plus besoin de continuer
      if (craque && partie) { try { partie.quitter(); } catch (er) { /* rien */ } partie = null; }
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche || 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      $('fin-gains').textContent = '';
      sauverExtras();

      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }

    ouvrirVoile('voile-fin');
  }

  // Confettis de victoire (couleurs des soigneurs).
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 4 ? '#ffd166' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  // Parcours solo : nuit n contre 3 robots (force donnée par la nuit).

      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });

    if (session !== 'solo') return;

      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#1a1a1a'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // Mini-enclos des démonstrations, avec ses jauges dessinées.
  function miniEnclos(c, x, y, w, h, o, t) {
    c.save(); c.translate(x, y);
    c.beginPath(); rr(c, 0, 0, w, h, 12); c.save(); c.clip();
    scene(c, w, h * 0.74, Object.assign({ t: t, seed: o.seed || 5 }, o));
    c.restore();
    c.strokeStyle = o.bord || '#ffd166'; c.lineWidth = 3; rr(c, 0, 0, w, h, 12); c.stroke();
    // jauges : faim, carburant, clôture, nervosité
    const bars = [['jf', o.f, 8, '#e8b25a'], ['jl', o.l, 6, '#ffd14a'], ['jk', o.k, 6, '#c08a52'], ['jn', o.n, 10, '#ff6a50']];
    bars.forEach((b, i) => {
      const by = h * 0.77 + i * (h * 0.055);
      icone(c, b[0], 10, by + 4, 6);
      c.fillStyle = '#ffffff22'; rr(c, 20, by, w - 28, 8, 4); c.fill();
      c.fillStyle = b[3]; rr(c, 20, by, Math.max(0, (w - 28) * Math.min(1, (b[1] || 0) / b[2])), 8, 4); c.fill();
    });
    c.restore();
  }
  function miniCarte(c, type, x, y, choisie, g) {
    c.save(); c.translate(x, y - (choisie ? 8 : 0));
    c.fillStyle = '#233050'; c.strokeStyle = choisie ? '#ffd166' : '#4a5d8c'; c.lineWidth = 3;
    rr(c, -30, -36, 60, 72, 10); c.fill(); c.stroke();
    icone(c, type, 0, -2, 24, g);
    c.restore();
  }
  const lisse = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p));
  const mix = (a, b, p) => a + (b - a) * lisse(p);
  // Avancée dans une étape : 0 avant debut, 1 après debut + duree.
  const etape = (ec, debut, duree) => Math.max(0, Math.min(1, (ec - debut) / duree));

  // Chaque tutoriel : (c, t = temps dans la boucle de 4,5 s, T = temps total).
  const TUTOS = {
    base(c, t, T) {
      const p1 = etape(t, 500, 900), p2 = etape(t, 1500, 800), p3 = etape(t, 2300, 600);
      miniEnclos(c, 300, 20, 240, 320, { id: 'raptor', n: 2, lit: true, l: 3, k: 5, f: mix(6, 3, p3) }, T);
      ['v', 'b', 'p'].forEach((ty, i) => { if (!(i === 0 && p2 > 0)) miniCarte(c, ty, 60 + i * 76, 290, i === 0 && p1 >= 1); });
      const cx = mix(60, 420, p2), cy = mix(282, 140, p2);
      if (p2 > 0 && p2 < 1) { miniCarte(c, 'v', cx, cy, true); }
      const hx = p2 > 0 ? cx : mix(500, 60, p1), hy = p2 > 0 ? cy : mix(340, 290, p1);
      main(c, hx, hy, 1.5, p1 >= 1 && p2 === 0 ? 1 : 0);
    },
    craque(c, t, T) {
      const p = etape(t, 300, 2600), casse = t > 3000;
      const n = casse ? 10 : Math.round(mix(5, 10, p));
      miniEnclos(c, 160, 20, 240, 320, { id: 'dilo', n: n, lit: false, l: 0, k: casse ? 0 : 2, f: 7, mort: t > 3300, fxs: casse ? [{ type: 'crack', t0: T - (t - 3000), d: 1500 }] : [] }, T);
      if (n >= 7 && !casse) { c.fillStyle = 'rgba(255,80,60,' + (0.3 + 0.3 * Math.sin(T / 120)).toFixed(2) + ')'; rr(c, 160, 20, 240, 320, 12); c.fill(); }
    },
    fusee(c, t, T) {
      const p1 = etape(t, 400, 800), p2 = etape(t, 1300, 800), on = t > 2100;
      miniEnclos(c, 300, 20, 240, 320, { id: 'stego', n: on ? 4 : 6, lit: false, ecl: on, l: 0, k: 4, f: 3, fxs: on ? [{ type: 'fusee', t0: T - (t - 2100), d: 1400 }] : [] }, T);
      ['f', 'b'].forEach((ty, i) => { if (!(i === 0 && p2 > 0)) miniCarte(c, ty, 80 + i * 80, 290, i === 0 && p1 >= 1); });
      const cx = mix(80, 420, p2), cy = mix(282, 140, p2);
      if (p2 > 0 && p2 < 1) miniCarte(c, 'f', cx, cy, true);
      main(c, p2 > 0 ? cx : mix(500, 80, p1), p2 > 0 ? cy : mix(340, 290, p1), 1.5, p1 >= 1 && p2 === 0 ? 1 : 0);
    },
    coupure(c, t, T) {
      const coupe = t > 900 && t < 3300, p1 = etape(t, 1600, 700), p2 = etape(t, 2400, 800);
      miniEnclos(c, 300, 20, 240, 320, { id: 'raptor', n: coupe ? 5 : 3, lit: !coupe, coup: coupe, ecl: t > 3200, l: 4, k: 4, f: 3, fxs: t > 900 && t < 2000 ? [{ type: 'coupure', t0: T - (t - 900), d: 1100 }] : [] }, T);
      if (!(p2 > 0)) miniCarte(c, 'f', 100, 290, p1 >= 1);
      const cx = mix(100, 420, p2), cy = mix(282, 140, p2);
      if (p2 > 0 && p2 < 1) miniCarte(c, 'f', cx, cy, true);
      icone(c, 'coup', 100, 120, 40);
      main(c, p2 > 0 ? cx : mix(520, 100, p1), p2 > 0 ? cy : mix(340, 290, p1), 1.5, p1 >= 1 && p2 === 0 ? 1 : 0);
    },
    vorace(c, t, T) {
      const k = Math.floor(t / 1100);
      miniEnclos(c, 40, 20, 220, 320, { id: 'raptor', n: 2, lit: true, l: 4, k: 5, f: 2 + k, bord: '#4a5d8c' }, T);
      miniEnclos(c, 300, 20, 220, 320, { id: 'rex', n: 2 + Math.max(0, k - 1), lit: true, l: 4, k: 5, f: Math.min(8, 2 + k * 2) }, T);
      icone(c, 'v', 280, 60, 18);
      icone(c, 'v', 280, 100, 18);
    },
    fougere(c, t, T) {
      const p1 = etape(t, 400, 800), p2 = etape(t, 1300, 800), mange = t > 2100;
      miniEnclos(c, 300, 20, 240, 320, { id: 'trice', n: 3, lit: true, l: 3, k: 4, f: mange ? 2 : 5 }, T);
      ['g', 'v'].forEach((ty, i) => { if (!(i === 0 && p2 > 0)) miniCarte(c, ty, 80 + i * 80, 290, i === 0 && p1 >= 1); });
      const cx = mix(80, 420, p2), cy = mix(282, 140, p2);
      if (p2 > 0 && p2 < 1) miniCarte(c, 'g', cx, cy, true);
      // la viande ne nourrit pas un herbivore : barrée
      c.strokeStyle = '#ff4a3a'; c.lineWidth = 5; c.beginPath(); c.moveTo(136, 262); c.lineTo(184, 318); c.stroke();
      main(c, p2 > 0 ? cx : mix(520, 80, p1), p2 > 0 ? cy : mix(340, 290, p1), 1.5, p1 >= 1 && p2 === 0 ? 1 : 0);
    },
    jeunes(c, t, T) {
      const creuse = t > 500, p1 = etape(t, 2000, 600), p2 = etape(t, 2700, 800), repare = t > 3500;

  function premiereCible(depuis, sens) {

    for (let k = 1; k <= PLACES; k++) {

    // Étincelles bleues là où la bête pousse sur les fils
    c.save();
    c.strokeStyle = '#9ff4ff'; c.shadowColor = '#3fd0ff'; c.shadowBlur = 18 * k; c.lineCap = 'round';
    [[300, 488, 1], [348, 470, 0.8], [262, 520, 0.7]].forEach(([sx, sy, f]) => {
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * Math.PI * 2 + 0.3, r1 = 6 * k * f, r2 = (22 + (i % 3) * 12) * k * f;
        c.lineWidth = (i % 2 ? 2 : 3.2) * k;
        c.beginPath(); c.moveTo(X(sx) + Math.cos(a) * r1, Y(sy) + Math.sin(a) * r1);
        c.lineTo(X(sx) + Math.cos(a + 0.2) * r2 * 0.6, Y(sy) + Math.sin(a + 0.2) * r2 * 0.6);
        c.lineTo(X(sx) + Math.cos(a) * r2, Y(sy) + Math.sin(a) * r2); c.stroke();
      }
      c.fillStyle = '#eaffff'; rond(c, X(sx), Y(sy), 6 * k * f); c.fill();
    });
    c.restore();
    // Panneau d'avertissement (sans texte : triangle et empreinte de griffes)
    const px = X(150), py = Y(452);
    c.fillStyle = '#ffd84a'; c.strokeStyle = '#1a1a1a'; c.lineWidth = 3 * k;
    poly(c, [px, py - 34 * k, px + 34 * k, py + 26 * k, px - 34 * k, py + 26 * k]); c.fill(); c.stroke();
    c.fillStyle = '#1a1a1a'; ell(c, px, py + 12 * k, 7 * k, 6 * k); c.fill();
    [[-8, -1, -0.5], [0, -6, 0], [8, -1, 0.5]].forEach((p) => { ell(c, px + p[0] * k, py + p[1] * k, 2.6 * k, 6.5 * k, p[2]); c.fill(); });
    // Premier plan : flaques, planches, viande et bidon (coupés par le bas)
    c.fillStyle = 'rgba(150,170,220,.2)';
    ell(c, X(150), Y(690), 150 * k, 16 * k); c.fill(); ell(c, X(470), Y(740), 120 * k, 12 * k); c.fill();
    icone(c, 'p', X(70), Y(660), 70 * k);
    icone(c, 'v', X(200), Y(700), 50 * k);
    icone(c, 'b', X(-10), Y(740), 56 * k);
    // Le bras du soigneur (ciré jaune) qui brandit la fusée, entré par le coin du bas
    c.save();
    c.lineCap = 'round';
    c.strokeStyle = '#8a5a10'; c.lineWidth = 74 * k;
    c.beginPath(); c.moveTo(X(690), Y(860)); c.quadraticCurveTo(X(560), Y(690), X(500), Y(560)); c.stroke();
    c.strokeStyle = '#f2b52a'; c.lineWidth = 64 * k;
    c.beginPath(); c.moveTo(X(690), Y(860)); c.quadraticCurveTo(X(560), Y(690), X(500), Y(560)); c.stroke();
    c.strokeStyle = '#ffd96a'; c.lineWidth = 18 * k;
    c.beginPath(); c.moveTo(X(670), Y(850)); c.quadraticCurveTo(X(545), Y(690), X(492), Y(575)); c.stroke();
    // bande réfléchissante du ciré
    c.strokeStyle = '#e8eef2'; c.lineWidth = 66 * k; c.lineCap = 'butt';
    c.beginPath(); c.moveTo(X(552), Y(668)); c.lineTo(X(541), Y(650)); c.stroke();
    c.restore();
    // La fusée, tenue par le gant : halo, bâton rouge, gant, puis la flamme
    const fl = { x: X(466), y: Y(466) };
    const flg = c.createRadialGradient(fl.x, fl.y, 0, fl.x, fl.y, 110 * k);
    flg.addColorStop(0, 'rgba(255,240,200,.9)'); flg.addColorStop(0.2, 'rgba(255,170,90,.6)'); flg.addColorStop(0.5, 'rgba(255,70,40,.3)'); flg.addColorStop(1, 'rgba(255,40,30,0)');
    c.fillStyle = flg; rond(c, fl.x, fl.y, 110 * k); c.fill();
    c.save(); c.translate(X(492), Y(540)); c.rotate(-0.35);
    c.fillStyle = '#e0283a'; c.strokeStyle = '#5a0a14'; c.lineWidth = 2.5 * k;
    rr(c, -10 * k, -72 * k, 20 * k, 96 * k, 5 * k); c.fill(); c.stroke();
    c.fillStyle = '#ff6a72'; c.fillRect(-6 * k, -66 * k, 5 * k, 50 * k);
    c.fillStyle = '#f2e6d0'; c.fillRect(-10 * k, -46 * k, 20 * k, 8 * k);
    // gant (poing fermé)
    c.fillStyle = '#34343e'; c.strokeStyle = '#121218'; c.lineWidth = 2.5 * k;
    rr(c, -30 * k, -26 * k, 60 * k, 52 * k, 18 * k); c.fill(); c.stroke();
    c.fillStyle = '#4a4a58'; for (let i = 0; i < 4; i++) { rr(c, -27 * k + i * 14 * k, -30 * k, 13 * k, 20 * k, 6 * k); c.fill(); c.stroke(); }
    c.fillStyle = 'rgba(255,140,110,.45)'; rr(c, -24 * k, -28 * k, 46 * k, 8 * k, 4 * k); c.fill();
    c.restore();
    c.save(); c.translate(fl.x, fl.y); c.rotate(-0.35);
    c.shadowColor = '#ffd27a'; c.shadowBlur = 30 * k;
    c.fillStyle = '#ffb02e'; c.beginPath(); c.moveTo(0, -46 * k); c.quadraticCurveTo(22 * k, -12 * k, 0, 8 * k); c.quadraticCurveTo(-22 * k, -12 * k, 0, -46 * k); c.fill();
    c.fillStyle = '#fff8dc'; c.beginPath(); c.moveTo(0, -28 * k); c.quadraticCurveTo(11 * k, -6 * k, 0, 6 * k); c.quadraticCurveTo(-11 * k, -6 * k, 0, -28 * k); c.fill();
    c.restore();
    c.fillStyle = '#fff6c0';
    for (let i = 0; i < 26; i++) { const a = al() * Math.PI * 2, r = (30 + al() * 110) * k; rond(c, fl.x + Math.cos(a) * r, fl.y + Math.sin(a) * r * 0.8 - 20 * k, (1.5 + al() * 2.5) * k); c.fill(); }
    // Pluie sur toute l'image
    c.strokeStyle = 'rgba(200,215,245,.35)'; c.lineWidth = 1.4 * k;
    c.beginPath();
    for (let i = 0; i < 220; i++) { const x = al() * w, y = al() * h, l = (14 + al() * 18) * k; c.moveTo(x, y); c.lineTo(x - l * 0.2, y + l); }
    c.stroke();
  }

  function cacherInterfaceAffiche() {
    document.querySelectorAll('.ecran, .voile, #bandeau, #annonce, #toast, #fantome, .jel-langue, button').forEach((el) => el.style.setProperty('display', 'none', 'important'));
  }

  function demarrerAffiche() {
    modeAffiche = true;
    ecran = 'affiche';
    cacherInterfaceAffiche();
    // le bouton de langue est parfois créé après ce script : caché aussi un peu après
    setTimeout(cacherInterfaceAffiche, 100);
    setTimeout(cacherInterfaceAffiche, 600);
    dessinerAffiche();
    window.addEventListener('resize', dessinerAffiche);
  }

  // ---------------------------------------------------------------------
  //  Images du jeu (page du jeu) : window.JEL_APERCU = 1, 2 ou 3, posé par
  //  le robot du site seulement. Une vraie nuit solo contre les robots, avec
  //  sa vraie interface, posée par le code puis figée : aucun coup ne part,
  //  ni victoire, ni défaite, ni son, ni sauvegarde, ni réseau.
  //    1 = nuit 1 : premières cartes, la viande choisie pour le raptor ;
  //    2 = nuit 10 : coupure annoncée, jeunes qui creusent, le Tyrannosaure
  //        voisin rugit ; la fusée choisie ;
  //    3 = nuit 19 (écran d'ordinateur) : panne générale et orage, le grand
  //        carnivore rôde, un enclos a craqué ; échange de carburant visé.
  // ---------------------------------------------------------------------

  const SCENES_APERCU = {
    1: {
      niveau: 1, h: 1, f: [4, 3, 2, 5], l: [2, 1, 3, 0], k: [5, 4, 5, 3], nv: [3, 2, 1, 5], cal: [16, 17, 18, 13],
      etal: [{ t: 'b' }, { t: 'v' }, null, { t: 'p' }, { t: 'v' }], pris: [3], tour: 0,
      prev: { coup: [], terr: [], orage: 0, rod: -1 }, sel: 1, cible: -1, journal: { s: 3, t: 'p' }
    },
    2: {
      niveau: 10, h: 3, f: [3, 5, 2, 6], l: [2, 3, 4, 1], k: [4, 2, 5, 3], nv: [5, 6, 2, 8], cal: [24, 22, 31, 17],
      etal: [{ t: 'f' }, null, { t: 'g' }, { t: 'b' }, { t: 'p' }], pris: [3], tour: 0,
      prev: { coup: [1], terr: [3], orage: 0, rod: -1 }, sel: 0, cible: -1, rug: 3
    },
    3: {
      niveau: 19, h: 6, f: [3, 0, 5, 4], l: [1, 0, 4, 3], k: [3, 0, 4, 2], nv: [6, 10, 4, 7], cal: [29, 22, 38, 25], mort: [-1, 5, -1, -1],
      etal: [{ t: 'x', g: 'l' }, { t: 'f' }, null, { t: 't' }], pris: [3], tour: 0,
      prev: { coup: [3], terr: [], orage: 1, rod: 2 }, sel: 0, cible: 2, ecl: [3]
    }
  };

  function ouvrirApercu(n) {
    modeApercu = n;
    const sc = SCENES_APERCU[n];
    if (n === 3) document.body.classList.add('apercu-large');
    // Une nuit solo posée par le code (hasard à graine fixe : toujours la même image).
    const e = R.depart(graineHasard(4100 + n), PLACES, { niveau: sc.niveau });
    e.h = sc.h;
    ['f', 'l', 'k', 'nv', 'cal'].forEach((j) => { e[j] = sc[j].slice(); });
    e.pic = e.nv.slice();
    e.mort = sc.mort ? sc.mort.slice() : [-1, -1, -1, -1];
    e.etal = sc.etal.map((x) => (x ? Object.assign({}, x) : null));
    e.pris = [0, 1, 2, 3].map((s) => sc.pris.indexOf(s) >= 0 || e.mort[s] >= 0);
    // fusée déjà allumée cette heure par un robot (son enclos reste éclairé malgré la coupure)
    e.ecl = [0, 1, 2, 3].map((s) => (sc.ecl || []).indexOf(s) >= 0);
    e.prev = JSON.parse(JSON.stringify(sc.prev));
    e.rod = sc.prev.rod;
    e.tour = sc.tour; e.prem = sc.pris[0];
    e.nres = sc.h; e.fini = false;
    // Une partie figée : c'est au joueur de l'appareil, mais aucun coup ne part.
    partie = {
      mode: 'solo', phase: 'jeu', siege: 0, manche: 0, chef: -1, etat: e,
      monTour: () => true,
      sieges: () => [0, 1, 2, 3].map((s) => ({ humain: false, moi: s === 0, chef: false, nom: null })),
      jouer: () => false, pause: () => {}, quitter: () => {}, lancerManche: () => false, estChef: () => false, recommencer: () => false
    };
    session = 'solo';
    niveau = sc.niveau;
    vue = JSON.parse(JSON.stringify(e));
    sel = sc.sel;
    cibleClavier = sc.cible;
    if (sc.journal) { const c0 = { t: sc.journal.t }; journal = tr('journal.pris', { qui: qui(sc.journal.s), carte: nomCarte(c0) }); }
    afficherEcran('jeu');
    majInterface();
    // Le Tyrannosaure voisin rugit (effet relancé en boucle, sans son).
    if (sc.rug >= 0) {
      const rugir = () => { ajouterEffet(sc.rug, 'rug', 1300); };
      rugir();
      setInterval(rugir, 1300);
    }
  }

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-carnet').addEventListener('click', () => { audio(); sons.clic(); ouvrirCarnet(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('carnet-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !modeApercu && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.cal[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { etalCle = ''; relancerBoucle(); });

  document.title = tr('titre');
  // Affiche (window.JEL_AFFICHE) et images du jeu (window.JEL_APERCU), posées par
  // le robot du site seulement : ni écran titre, ni sauvegarde lue, ni réseau.
  if (window.JEL_AFFICHE) { demarrerAffiche(); return; }
  const numeroApercu = Number(window.JEL_APERCU);
  if (numeroApercu === 1 || numeroApercu === 2 || numeroApercu === 3) {
    construireEnclos();
    majBoutonsSon();
    ouvrirApercu(numeroApercu);
    return;
  }
  chargerProgression();
  construireEnclos();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
