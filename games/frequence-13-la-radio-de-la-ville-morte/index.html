  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom, eteint) {
    const cle = role + '|' + nom + '|' + (eteint ? 1 : 0);
    if (tag.dataset.cle === cle) return;
    tag.dataset.cle = cle;
    tag.innerHTML = eteint ? ICONE_ETEINT : (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      // avant le début de la nuit (tutoriel), le joueur est déjà au poste 0
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: session === 'solo' && s === 0 };
      const absent = !!(e && e.out[s] === -1);
      d.hidden = absent;
      if (absent) continue;
      const piles = e ? e.pi[s] : 3, max = e ? (e.niv ? NIVEAUX[e.niv - 1].p : 3) : 3;
      const eteint = !!(e && e.pi[s] <= 0 && e.out[s] > 0);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('eteint', eteint);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role), eteint);
      const cv = d.querySelector('canvas.icone');
      if (cv.dataset.cle !== String(eteint)) {
        cv.dataset.cle = String(eteint);
        const c = cv.getContext('2d'); c.clearRect(0, 0, 68, 68); posteIcone(c, s, 34, 38, 26, eteint);
      }
      const zp = d.querySelector('.piles');
      if (zp.dataset.n !== piles + '/' + max) {
        const avant = zp.dataset.n ? Number(zp.dataset.n.split('/')[0]) : piles;
        zp.dataset.n = piles + '/' + max;
        zp.textContent = '';
        for (let k = 0; k < max; k++) {
          const p = document.createElement('span');
          p.className = 'pile' + (k < piles ? '' : ' vide') + (k >= piles && k < avant ? ' tombe' : '');
          zp.appendChild(p);
        }
      }
      d.setAttribute('aria-label', tr('place.aria', { poste: tr('poste.' + s), role: nomPlace(info, role), piles: tr('piles', { n: piles }) }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
    $('places').style.gridTemplateColumns = 'repeat(' + (e ? e.out.filter((x) => x !== -1).length : PLACES) + ', minmax(0, 104px))';
    $('places').style.justifyContent = 'center';
  }

  function nomDuPoste(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    if (info.humain && info.nom) return info.nom;
    return tr('poste.' + s);
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (partie.siege < 0) return tr('multi.attente');
    if (e.pi[partie.siege] <= 0) return tr('tour.eteint');
    const s = R.aQui(e);
    if (s === partie.siege) return e.ph === 0 ? tr('tour.rejoue', { k: e.k, n: e.ch.length }) : tr('tour.ajoute');
    const info = siegesActuels()[s] || {};
    return info.humain && info.nom ? tr('tour.nom', { nom: info.nom }) : tr('tour.robot', { poste: tr('poste.' + s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.nuit', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    const e = vue, moi = partie ? partie.siege : -1;
    $('ruban-chaine').textContent = e ? tr('ruban.chaine', { n: e.ch.length }) : '';
    $('ruban-best').textContent = e && moi >= 0 ? tr('ruban.best', { n: e.best[moi] }) : '';
  }

  // Puces des pièges du tour, et boutons éteints par l'antenne.
  function majPieges() {
    const e = vue, boite = $('pieges');
    const liste = [];
    if (e) {
      if (e.v) liste.push('voix');
      if (e.inter) liste.push('inter');
      if (e.echo) liste.push('echo');
      if (e.jam >= 0) liste.push('antenne');
      if (e.n) liste.push('noir');

    const cle = liste.join(',');
    if (boite.dataset.cle !== cle) {
      const avant = (boite.dataset.cle || '').split(',');
      boite.dataset.cle = cle;

  function majInterface() {

  // ---------------------------------------------------------------------
  //  Boucle d'affichage : ruban, haut-parleur, temps, parasites
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0, parasitesJusqua = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu') return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (!enPause) {
      dessinerRuban(t);
      dessinerHautParleur(t, dt);
      majTemps();
    }
    dessinerParasites(t);
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function preparerCanvas(cv) {
    const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return null;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    return { c: c, w: w, h: h };
  }

  // Ruban : une case par note de la chaîne (sans montrer les notes), l'avancement
  // du poste qui joue, la partie zébrée par l'interférence.
  function dessinerRuban(t) {
    const p = preparerCanvas($('ruban'));
    if (!p) return;
    const { c, w, h } = p, e = vue;
    if (!e) return;
    const ajout = e.ph === 1 && partie && partie.phase === 'jeu';
    const n = e.ch.length + (ajout ? 1 : 0);
    if (!n) return;
    const lignes = n > 18 ? 2 : 1, parLigne = Math.ceil(n / lignes);
    const gap = 3, cw = Math.min(28, (w - gap * (parLigne - 1)) / parLigne), chh = (h - (lignes - 1) * 3) / lignes;
    const x0 = (w - (cw * parLigne + gap * (parLigne - 1))) / 2;
    const tour = R.aQui(e), coul = COUL[tour];
    for (let i = 0; i < n; i++) {
      const l = Math.floor(i / parLigne), col = i % parLigne;
      const x = x0 + col * (cw + gap), y = l * (chh + 3);
      const dansInter = e.inter && i >= e.inter[0] && i <= e.inter[1];
      const fait = i < e.k || (e.ph === 1 && i < e.ch.length);
      c.fillStyle = fait ? coul : '#1d2236';
      rrect(c, x, y, cw, chh, 4); c.fill();
      if (dansInter && !fait) {
        c.save(); rrect(c, x, y, cw, chh, 4); c.clip();
        c.strokeStyle = '#e8d34a'; c.lineWidth = 2;
        for (let z = -chh; z < cw; z += 6) { c.beginPath(); c.moveTo(x + z, y + chh); c.lineTo(x + z + chh, y); c.stroke(); }
        c.restore();
      }
      if (i === e.k && e.ph === 0 && partie && partie.phase === 'jeu') {
        c.strokeStyle = '#fff'; c.lineWidth = 2 + Math.sin(t / 160);
        rrect(c, x + 1, y + 1, cw - 2, chh - 2, 4); c.stroke();
      }
      if (ajout && i === n - 1) {
        c.strokeStyle = coul; c.globalAlpha = 0.6 + 0.4 * Math.sin(t / 200); c.lineWidth = 2;
        rrect(c, x + 1, y + 1, cw - 2, chh - 2, 4); c.stroke();
        c.beginPath(); c.moveTo(x + cw / 2, y + chh * 0.25); c.lineTo(x + cw / 2, y + chh * 0.75); c.moveTo(x + cw * 0.25, y + chh / 2); c.lineTo(x + cw * 0.75, y + chh / 2); c.stroke();
        c.globalAlpha = 1;
      }
    }
    // flèche de l'interférence (sens inverse)
    if (e.inter) {
      const a = e.inter[0], b = e.inter[1];
      const la = Math.floor(a / parLigne), lb = Math.floor(b / parLigne);
      if (la === lb) {
        const xa = x0 + (a % parLigne) * (cw + gap), xb = x0 + (b % parLigne) * (cw + gap) + cw, y = la * (chh + 3) + chh / 2;
        c.strokeStyle = '#fff3a8'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(xb - 4, y); c.lineTo(xa + 6, y); c.moveTo(xa + 12, y - 5); c.lineTo(xa + 5, y); c.lineTo(xa + 12, y + 5); c.stroke();
      }
    }
  }

  // Haut-parleur : cadran (sans chiffres) et onde de la note jouée, rouge pour la Voix.
  function dessinerHautParleur(t, dt) {
    const p = preparerCanvas($('hp'));
    if (!p) return;
    const { c, w, h } = p, r = RADIOS[prog.radio];
    onde.amp = Math.max(0, onde.amp - dt * 1.6);
    onde.voix = Math.max(0, onde.voix - dt * 0.9);
    onde.bruit = Math.max(0, onde.bruit - dt * 1.8);
    // cadran

    $('fin-objectif').textContent = tr('fin.objectif', { a: d.s2, b: d.s3 });
    remplirClassement(e, moi, sieges, $('fin-classement'), eteint ? null : R.fin(e));
    $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, best) });
    $('fin-debloque').textContent = lignes.join('\n');
    $('fin-compte').textContent = '';
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
    boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
    boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
  // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
  function afficherFinRepli(resultat) {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && resultat.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche });
    $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
    $('fin-etoiles').textContent = '';
    $('fin-etoiles').style.display = 'none';
    $('fin-points').textContent = moi >= 0 ? tr('fin.chaine', { n: e.best[moi] }) : '';
    $('fin-objectif').textContent = '';
    remplirClassement(e, moi, siegesActuels(), $('fin-classement'), resultat);
    $('fin-record').textContent = '';
    $('fin-debloque').textContent = '';
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    majCompte();
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (repli contre des robots) et salon.
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
  }

  // Étincelles de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: w / 2 + (Math.random() - 0.5) * 60, y: h * 0.45, vx: (Math.random() - 0.5) * 520, vy: -200 - Math.random() * 420, coul: i % 3 ? TOUCHES[i % 6] : '#ffd27a', k: 2 + Math.random() * 4 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.vy += 480 * dt;
        c.fillStyle = b.coul; c.globalAlpha = Math.max(0, 1 - (t - debut) / 2400);
        c.shadowColor = b.coul; c.shadowBlur = 8;
        c.beginPath(); c.arc(b.x, b.y, b.k, 0, 7); c.fill();
      });
      c.globalAlpha = 1; c.shadowBlur = 0;
      if (t - debut < 2500) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Tutoriels animés (une main montre le geste, en 3 étapes)
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  // Petite radio du tutoriel : 6 boutons (3 × 2) et le bouton Silence.
  const TX = (b) => 150 + (b % 3) * 130, TY = (b) => 120 + Math.floor(b / 3) * 110;
  const SIL = { x: 280, y: 318 };

  function main(c, x, y, k, appui) {
    c.save();
    c.translate(x, y);
    c.scale(k * (1 - 0.1 * appui), k * (1 - 0.1 * appui));
    c.fillStyle = '#f4d8b8'; c.strokeStyle = '#4a2e18'; c.lineWidth = 2;
    c.beginPath();
    c.moveTo(-6, 0); c.lineTo(-6, 26); c.quadraticCurveTo(-16, 22, -18, 32); c.quadraticCurveTo(-10, 54, 8, 58);
    c.lineTo(22, 58); c.quadraticCurveTo(32, 48, 30, 30); c.lineTo(28, 20); c.quadraticCurveTo(24, 16, 18, 20);
    c.quadraticCurveTo(14, 14, 8, 18); c.lineTo(6, 0); c.quadraticCurveTo(0, -8, -6, 0); c.closePath();
    c.fill(); c.stroke();
    c.restore();
    if (appui > 0.5) { c.strokeStyle = '#ffffffaa'; c.lineWidth = 3; c.beginPath(); c.arc(x, y, 26 * appui, 0, 7); c.stroke(); }
  }

  function demoRadio(c, eclaire, opts) {
    c.fillStyle = '#0b0d18'; c.fillRect(0, 0, 560, 360);
    c.fillStyle = '#4b3f33'; rrect(c, 40, 40, 480, 310, 30); c.fill();
    for (let b = 0; b < 6; b++) {
      const x = TX(b), y = TY(b);
      let coul = TOUCHES[b], lum = 0.45;
      if (opts.noir) lum = 0.18;
      if (eclaire[b]) lum = 0.45 + 0.55 * eclaire[b];
      if (opts.jam === b) { coul = '#333'; lum = 0.3; }
      c.fillStyle = coul;
      c.beginPath(); c.arc(x, y, 42, 0, 7); c.fill();
      c.fillStyle = 'rgba(0,0,0,' + Math.max(0, 1 - lum).toFixed(2) + ')';
      c.beginPath(); c.arc(x, y, 42, 0, 7); c.fill();
      if (eclaire[b] > 0.3) { c.strokeStyle = '#fff'; c.globalAlpha = eclaire[b]; c.lineWidth = 4; c.beginPath(); c.arc(x, y, 46, 0, 7); c.stroke(); c.globalAlpha = 1; }
      if (opts.voix) { c.fillStyle = 'rgba(255,40,60,' + (0.5 * opts.voix).toFixed(2) + ')'; c.beginPath(); c.arc(x, y, 42, 0, 7); c.fill(); }
      if (opts.jam === b) {
        c.strokeStyle = '#ffb066'; c.lineWidth = 4;
        c.beginPath(); c.moveTo(x, y - 24); c.lineTo(x - 14, y + 26); c.moveTo(x, y - 24); c.lineTo(x + 14, y + 26); c.stroke();
        c.fillStyle = '#ff6b3d'; c.beginPath(); c.arc(x, y - 28, 7, 0, 7); c.fill();
      }
    }
    // bouton Silence
    c.fillStyle = opts.silence ? '#ff6b7d' : '#2b2e3c'; c.beginPath(); c.arc(SIL.x, SIL.y, 22, 0, 7); c.fill();
    c.strokeStyle = '#9aa0b8'; c.lineWidth = 3; c.beginPath(); c.arc(SIL.x, SIL.y, 22, 0, 7); c.stroke();
    c.strokeStyle = '#e9e4d4'; c.beginPath(); c.moveTo(SIL.x - 9, SIL.y - 9); c.lineTo(SIL.x + 9, SIL.y + 9); c.stroke();
  }

  // Petit ruban du tutoriel : n cases, k faites, zone zébrée [a, b].
  function demoRuban(c, n, k, zebre) {
    const w = 30, x0 = 280 - (n * 34) / 2;
    for (let i = 0; i < n; i++) {
      const x = x0 + i * 34;
      c.fillStyle = i < k ? '#3fe0b0' : '#1d2236'; rrect(c, x, 6, w, 22, 4); c.fill();
      if (zebre && i >= zebre[0] && i <= zebre[1] && i >= k) {
        c.save(); rrect(c, x, 6, w, 22, 4); c.clip();
        c.strokeStyle = '#e8d34a'; c.lineWidth = 2;
        for (let z = -22; z < w; z += 6) { c.beginPath(); c.moveTo(x + z, 28); c.lineTo(x + z + 22, 6); c.stroke(); }
        c.restore();
      }
    }
  }

  // Chaque tutoriel : 3 étapes ; chaque étape donne une suite de gestes
  // [ cible (0-5 bouton, 's' Silence), qui ('radio' = la radio joue, 'main' = le joueur) ].
  const DEMOS = {
    base: [{ seq: [[0, 'radio'], [4, 'radio'], [2, 'radio']], n: 3 }, { seq: [[0, 'main'], [4, 'main'], [2, 'main']], n: 3, rejoue: true }, { seq: [[5, 'main']], n: 4, ajout: true }],
    piles3: [{ seq: [[1, 'radio'], [3, 'radio']], n: 2, piles: 3 }, { seq: [[1, 'main'], [5, 'main']], n: 2, rejoue: true, piles: 3, erreur: 1 }, { seq: [[1, 'main']], n: 2, rejoue: true, piles: 1, erreur: 1 }],
    voix: [{ seq: [[1, 'radio'], ['v', 'radio'], [3, 'radio']], n: 3 }, { seq: [[1, 'main'], ['s', 'main'], [3, 'main']], n: 3, rejoue: true }, { seq: [[1, 'main'], [4, 'main']], n: 3, rejoue: true, erreur: 1 }],
    inter: [{ seq: [[0, 'radio'], [1, 'radio'], [2, 'radio'], [3, 'radio']], n: 4 }, { seq: [], n: 4, zebre: [1, 3] }, { seq: [[0, 'main'], [3, 'main'], [2, 'main'], [1, 'main']], n: 4, rejoue: true, zebre: [1, 3] }],
    echo: [{ seq: [[2, 'main'], [5, 'main']], n: 2, rejoue: true, horloge: 1 }, { seq: [], n: 2, horloge: 2 }, { seq: [[2, 'main'], [5, 'main']], n: 2, rejoue: true, horloge: 2, vite: true }],
    antenne: [{ seq: [[1, 'radio'], [0, 'radio']], n: 2 }, { seq: [], n: 2, jam: 1, fleche: true }, { seq: [[4, 'main'], [0, 'main']], n: 2, rejoue: true, jam: 1 }],
    noir: [{ seq: [[3, 'radio'], [0, 'radio'], [5, 'radio']], n: 3, noir: true }, { seq: [[3, 'son'], [0, 'son'], [5, 'son']], n: 3, noir: true }, { seq: [[3, 'main'], [0, 'main'], [5, 'main']], n: 3, rejoue: true, noir: true }],
    piles: [{ seq: [], n: 2, piles: 2 }, { seq: [[0, 'main']], n: 2, rejoue: true, piles: 2, erreur: 1 }, { seq: [[0, 'main']], n: 2, rejoue: true, piles: 1, erreur: 1 }]
  };

  function montrerTuto(cle, apres) {
    const demo = DEMOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    ouvrirVoile('voile-tuto');
    const c = $('tuto-demo').getContext('2d');
    const j = ++tutoAnim;
    const PAS = 620;
    let debut = 0, etapeVue = -1;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      // durée de chaque étape : ses gestes, plus une pause
      const durees = demo.map((d) => Math.max(1800, (d.seq.length + 1) * (d.vite ? PAS / 2 : PAS) + 700));
      const totale = durees.reduce((a, b) => a + b, 0);
      let ecoule = (t - debut) % totale, e = 0;
      while (ecoule > durees[e]) { ecoule -= durees[e]; e++; }
      const d = demo[e], pas = d.vite ? PAS / 2 : PAS;
      if (e !== etapeVue) {
        etapeVue = e;
        $('tuto-etape').textContent = tr('tuto.' + cle + '.e' + (e + 1));
        document.querySelectorAll('#tuto-points span').forEach((sp, k) => sp.classList.toggle('oui', k <= e));
      }
      const g = Math.floor(ecoule / pas) - 1, dans = ecoule - (g + 1) * pas;
      const eclaire = [0, 0, 0, 0, 0, 0];
      let voix = 0, silence = false, err = false;
      const fait = Math.max(0, Math.min(d.seq.length, g + 1));
      if (g >= 0 && g < d.seq.length) {
        const [cible, qui] = d.seq[g];
        const q = Math.max(0, 1 - dans / pas);
        if (cible === 'v') voix = q;
        else if (cible === 's') silence = q > 0.3;
        else if (!(d.noir && qui !== 'main')) eclaire[cible] = q;
        if (d.erreur && g === d.seq.length - 1) err = true;
      }
      demoRadio(c, eclaire, { noir: d.noir, voix: voix, silence: silence, jam: d.jam });
      demoRuban(c, d.n + (d.ajout ? 1 : 0), d.rejoue || d.ajout ? Math.min(d.n + (d.ajout ? 1 : 0), fait + (d.ajout ? d.n : 0)) : 0, d.zebre);
      // ondes du son dans le noir
      if (d.noir && g >= 0 && g < d.seq.length && d.seq[g][1] !== 'main') {
        c.strokeStyle = '#7ff0d0'; c.lineWidth = 3;
        for (let k = 0; k < 3; k++) { c.globalAlpha = 1 - k * 0.3; c.beginPath(); c.arc(500, 200, 16 + k * 14 + (dans / pas) * 10, -0.8, 0.8); c.stroke(); }
        c.globalAlpha = 1;
        c.fillStyle = '#f4d8b8'; c.beginPath(); c.ellipse(492, 200, 9, 16, 0, 0, 7); c.fill();
      }
      // horloge (écho)
      if (d.horloge) {
        const cx = 500, cy = 70;
        c.fillStyle = '#1d2236'; c.beginPath(); c.arc(cx, cy, 26, 0, 7); c.fill();
        c.strokeStyle = d.horloge === 2 ? '#4ad6e8' : '#e9e4d4'; c.lineWidth = 3; c.beginPath(); c.arc(cx, cy, 26, 0, 7); c.stroke();
        const ang = (t / (d.horloge === 2 ? 180 : 420)) % (Math.PI * 2);
        c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ang) * 20, cy + Math.sin(ang) * 20); c.stroke();
        const reste = 1 - ((t - debut) % (d.horloge === 2 ? 1500 : 3000)) / (d.horloge === 2 ? 1500 : 3000);
        c.fillStyle = d.horloge === 2 ? '#4ad6e8' : '#3fe0b0'; c.fillRect(60, 336, 440 * reste, 8);
      }
      // flèche de l'antenne vers le bouton d'en face
      if (d.fleche) {
        const x = TX(1), y1 = TY(1) + 48, y2 = TY(4) - 48, ph = (t % 900) / 900;
        c.strokeStyle = '#ffb066'; c.lineWidth = 5; c.globalAlpha = 0.5 + 0.5 * Math.sin(ph * Math.PI);
        c.beginPath(); c.moveTo(x, y1); c.lineTo(x, y2); c.moveTo(x - 10, y2 - 12); c.lineTo(x, y2); c.lineTo(x + 10, y2 - 12); c.stroke();
        c.globalAlpha = 1;
      }
      // piles
      if (d.piles) {
        for (let k = 0; k < 3; k++) {
          const tombe = err && g === d.seq.length - 1 && k === d.piles - 1;
          const plein = k < d.piles && !(tombe && dans > pas * 0.3);
          c.fillStyle = plein ? '#7ee07e' : '#2a2f44';
          rrect(c, 470 + k * 22, 300 + (tombe ? dans / 12 : 0), 16, 26, 3); c.fill();
          c.fillRect(475 + k * 22, 296, 6, 4);
        }
      }
      // erreur : neige de parasites
      if (err && dans > pas * 0.2) {
        for (let k = 0; k < 400; k++) { c.fillStyle = Math.random() < 0.5 ? '#fff' : '#555'; c.fillRect(Math.random() * 560, Math.random() * 360, 3, 3); }
      }
      // la main pour les gestes du joueur
      const geste = g >= 0 && g < d.seq.length ? d.seq[g] : (g + 1 < d.seq.length ? d.seq[g + 1] : null);
      const prochain = g + 1 < d.seq.length ? d.seq[g + 1] : null;
      if (prochain && prochain[1] === 'main') {
        const cible = prochain[0];
        const x = cible === 's' ? SIL.x : TX(cible), y = cible === 's' ? SIL.y : TY(cible);
        const q = Math.min(1, dans / (pas * 0.75));
        main(c, x + 6, y + 8 + (1 - q) * 30, 1.2, q > 0.85 ? (q - 0.85) / 0.15 : 0);
      } else if (geste && geste[1] === 'main' && g >= 0) {
        const cible = geste[0];
        const x = cible === 's' ? SIL.x : TX(cible), y = cible === 's' ? SIL.y : TY(cible);
        main(c, x + 6, y + 8, 1.2, Math.max(0, 1 - dans / 200));
      }
      requestAnimationFrame(image);
    }
    requestAnimationFrame(image);
    $('btn-tuto-ok').onclick = () => { audio(); sons.clic(); tutoAnim++; fermerVoile('voile-tuto'); apres(); };
  }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    fileTouches = [];
    finSoloFaite = false;
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  function apercu(n) {
    return R.depart(() => 0, PLACES, { niveau: n });
  }

  // Parcours solo : nuit n contre des robots (force croissante, donnée par la nuit).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    finSoloFaite = false;
    fileTouches = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].f, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((d, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === prog.debloque ? ' actuel' : '');
      b.disabled = !ouvert;
      const num = document.createElement('span'); num.textContent = nb(n);
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const s = document.createElement('span'); s.textContent = '★'; if (k < prog.etoiles[i]) s.className = 'oui'; et.appendChild(s); }
      b.append(num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveaux.aria', { n: n, e: prog.etoiles[i] }) : tr('niveaux.ferme', { n: n }));
      b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('total.court', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
    const premier = grille.querySelector('.actuel') || grille.querySelector('button');
    if (premier) try { premier.focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  function ouvrirCassettes() {
    const boite = $('liste-cassettes');
    boite.textContent = '';
    for (let i = 0; i < NB_CASSETTES; i++) {
      const ouverte = prog.cassettes[i];
      const d = document.createElement('div');
      d.className = 'carte-liste' + (ouverte ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 192; cv.height = 128;
      const c = cv.getContext('2d'); c.scale(2, 2); dessinerCassette(c, 96, 64, i, ouverte);
      const txt = document.createElement('div'); txt.className = 'txt';
      const h = document.createElement('h3'); h.textContent = ouverte ? tr('cassette.' + i + '.nom') : tr('cassettes.inconnue');
      const p = document.createElement('p'); p.textContent = ouverte ? tr('cassette.' + i + '.texte') : tr('cassettes.fermee', { n: (i + 1) * 2 });
      txt.append(h, p);
      d.append(cv, txt);
      if (ouverte) d.appendChild(bouton('bouton.ecouter', '', () => sons.cassette(i)));
      boite.appendChild(d);
    }
    $('cas-total').textContent = tr('cassettes.compte', { n: prog.cassettes.filter(Boolean).length, max: NB_CASSETTES });
    afficherEcran('cassettes');
  }

  function ouvrirRadios() {
    const boite = $('liste-radios');
    boite.textContent = '';
    const total = totalEtoiles();
    RADIOS.forEach((r, i) => {
      const ouverte = total >= r.seuil;
      const d = document.createElement('div');
      d.className = 'carte-liste' + (ouverte ? '' : ' ferme') + (i === prog.radio ? ' choisie' : '');
      const cv = document.createElement('canvas'); cv.width = 192; cv.height = 128;
      const c = cv.getContext('2d'); c.scale(2, 2);
      if (ouverte) dessinerRadio(c, 46, 40, 62, i, 0, 1);
      else { c.globalAlpha = 0.35; dessinerRadio(c, 46, 40, 62, i, 0, 0); c.globalAlpha = 1; }
      const txt = document.createElement('div'); txt.className = 'txt';
      const h = document.createElement('h3'); h.textContent = tr('radio.' + i + '.nom');
      const p = document.createElement('p'); p.textContent = ouverte ? tr('radio.' + i + '.texte') : tr('radios.seuil', { n: r.seuil });
      txt.append(h, p);
      d.append(cv, txt);
      if (ouverte && i !== prog.radio) {
        d.appendChild(bouton('bouton.choisir', 'vert', () => { prog.radio = i; sauverReglages(); [0, 2, 4].forEach((b, k) => sons.note(b, true, k * 0.12)); ouvrirRadios(); }));
      } else if (ouverte) {
        const s = document.createElement('span'); s.className = 'petit'; s.textContent = tr('radios.choisie'); d.appendChild(s);
      }
      boite.appendChild(d);
    });
    $('rad-total').textContent = tr('total.court', { n: total, max: NIVEAUX.length * 3 });
    afficherEcran('radios');
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause || !partie || $('voile-fin').classList.contains('actif') || salonOuvert() || $('voile-tuto').classList.contains('actif')) return;
    enPause = true;
    pauseDepuis = Date.now();
    partie.pause(true);
    $('pause-ligne').style.display = session === 'ligne' && partie.mode === 'en-ligne' ? '' : 'none';
    $('btn-recommencer').style.display = session === 'solo' ? '' : 'none';
    $('btn-pause-niveaux').style.display = session === 'solo' ? '' : 'none';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    debutNote += Date.now() - pauseDepuis;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Commandes
  // ---------------------------------------------------------------------

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-cassettes').addEventListener('click', () => { audio(); sons.clic(); ouvrirCassettes(); });
  $('btn-radios').addEventListener('click', () => { audio(); sons.clic(); ouvrirRadios(); });
  ['niv-retour', 'cas-retour', 'rad-retour'].forEach((id) => $(id).addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); }));
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { audio(); sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { audio(); sons.clic(); fermerPause(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  const silence = $('btn-silence');
  silence.addEventListener('pointerdown', (ev) => { ev.preventDefault(); toucher({ t: 's' }); });
  silence.addEventListener('click', (ev) => { if (ev.detail === 0) toucher({ t: 's' }); });

  document.addEventListener('keydown', (ev) => {
    if (ev.repeat) return;
    const k = ev.code;
    if (k === 'Escape' || k === 'KeyP') {
      if (ecran === 'jeu') { ev.preventDefault(); if (enPause) fermerPause(); else ouvrirPause(); }
      else if (ecran !== 'titre' && k === 'Escape') afficherEcran('titre');
      return;
    }
    if (ecran !== 'jeu' || enPause) return;
    const m = /^(?:Digit|Numpad)([1-6])$/.exec(k);
    if (m) { ev.preventDefault(); toucher({ t: 'b', b: Number(m[1]) - 1 }); return; }
    if (k === 'Space' || k === 'Digit0' || k === 'Numpad0' || k === 'KeyS') {
      // Espace sur un bouton déjà sélectionné : le navigateur s'en charge (clic).
      const f = document.activeElement;
      if (k === 'Space' && f && f.tagName === 'BUTTON' && f.closest('#ecran-jeu') && f.id !== 'btn-silence') return;
      ev.preventDefault();
      toucher({ t: 's' });
    }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden) ouvrirPause(); });

  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.best[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(performance.now()); });
  if (I18N.surChangement) I18N.surChangement(() => { majAriaTouches(); majBoutonsSon(); majTitre(); majInterface(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  construireTouches();
  let boutonEffacer = null;
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
