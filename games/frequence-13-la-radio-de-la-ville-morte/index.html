<script>
(function () {
  'use strict';

  // =====================================================================
  //  Fréquence 13 : la radio de la ville morte — mémoire musicale à 5
  //  On rejoue la suite jouée par la radio, puis on ajoute une note ; une
  //  erreur coûte une pile. Solo : 20 nuits contre des robots. En ligne :
  //  de vrais joueurs remplacent les robots (moteur commun JEL_MULTI).
  //  Les règles (et les nuits) sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'frequence-13-la-radio-de-la-ville-morte';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.nuits;                  // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const NB = O.NB;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Couleur et forme de chaque station : 0 ambre, 1 cyan, 2 rouge, 3 violet, 4 vert.
  const COUL = ['#ffc14d', '#4fe0ff', '#ff6b6b', '#b18cff', '#7dff9a'];
  const FORMES = [
    '<circle cx="12" cy="12" r="9"/>',
    '<path d="M12 3l9.5 17h-19z"/>',
    '<rect x="3.5" y="3.5" width="17" height="17" rx="2"/>',
    '<path d="M12 2l10 10-10 10L2 12z"/>',
    '<path d="M12 2.5l8.2 4.75v9.5L12 21.5l-8.2-4.75v-9.5z"/>'
  ];
  function svgForme(s, classe) {
    return '<svg class="' + (classe || 'forme') + '" viewBox="0 0 24 24" aria-hidden="true"><g fill="' + COUL[s] + '" stroke="#000a" stroke-width="1.2">' + FORMES[s] + '</g><circle cx="12" cy="12" r="3" fill="#0008"/></svg>';
  }

  // Les 6 boutons : couleur et note (la, do, ré, mi, sol, la).
  const TOUCHE_COUL = ['#ffb000', '#3ddc84', '#2ec9ff', '#5b7cff', '#ff4fd8', '#e8f0ff'];
  const FREQ = [440, 523.25, 587.33, 659.25, 783.99, 880];

  // Radios à débloquer : couleurs du poste et timbre des notes.
  const RADIOS = [
    { id: 'bois', corps: '#6b4226', cadre: '#3b2414', verre: '#0b1a12', ecran: '#7dff9a', onde: 'triangle', seuil: 0 },
    { id: 'transistor', corps: '#9e2b25', cadre: '#4a100d', verre: '#1a0f06', ecran: '#ffb347', onde: 'square', vol: 0.45, seuil: 12 },
    { id: 'armee', corps: '#4b5a32', cadre: '#252d18', verre: '#0f160a', ecran: '#c8ff6a', onde: 'sawtooth', vol: 0.4, filtre: 1800, seuil: 27 },
    { id: 'lampes', corps: '#8a6a2f', cadre: '#3e2c0f', verre: '#171006', ecran: '#ffd27a', onde: 'sine', vib: 6, seuil: 42 },
    { id: 'fantome', corps: '#2b2f45', cadre: '#11131f', verre: '#0b0a18', ecran: '#b7a6ff', onde: 'sine', double: 7, k7: 10 }
  ];
  const NB_K7 = 10;           // une cassette par nuit paire, gagnée avec 3 étoiles
  const nuitK7 = (k) => (k + 1) * 2;

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#000"/><circle cx="10.4" cy="8" r="1.6" fill="#000"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#000"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const ICONE_SON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  const ICONE_MUET = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICONE_ANTENNE = '<svg class="antenne" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v13M7 22h10" stroke="#ffd27a" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7" r="2.4" fill="#ffd27a"/><path d="M6.5 3.5a7.5 7.5 0 0 0 0 7M17.5 3.5a7.5 7.5 0 0 1 0 7" stroke="#ffd27a" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M3 3l18 18" stroke="#ff4a3a" stroke-width="2.6" stroke-linecap="round"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    k7: [], options: { son: true, radio: 0 }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);
  const TUTO_CLES = ['base', 'stations', 'voix', 'inv', 'echo', 'antenne', 'noir', 'piles', 'double'];

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 9999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => TUTO_CLES.indexOf(x) >= 0);
      if (Array.isArray(d.k7)) prog.k7 = d.k7.filter((x, i, l) => Number.isInteger(x) && x >= 0 && x < NB_K7 && l.indexOf(x) === i);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
      if (d.options) prog.options.radio = entier(d.options.radio, 0, RADIOS.length - 1, 0);
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (!radioOuverte(prog.options.radio)) prog.options.radio = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.k7 = [];
    prog.options.radio = 0;
    appliquerRadio();
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), k7: prog.k7.slice(),
        options: { son: prog.options.son, radio: prog.options.radio }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Son et radio se règlent aussi depuis l'accueil : on ne crée jamais de sauvegarde là.
  function sauverOptions() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son, radio: prog.options.radio } }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  function radioOuverte(i) {
    const r = RADIOS[i];
    if (!r) return false;
    if (r.k7) return prog.k7.length >= r.k7;
    return totalEtoiles() >= r.seuil;
  }

  function appliquerRadio() {
    const r = RADIOS[prog.options.radio] || RADIOS[0];
    const st = document.documentElement.style;
    st.setProperty('--corps', r.corps);
    st.setProperty('--cadre', r.cadre);
    st.setProperty('--verre', r.verre);
    st.setProperty('--vert', r.ecran);
  }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, bufBruit = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const g = ac.createGain();
      const v = (o.vol || 0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.attaque || 0.012));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      sortie.connect(ac.destination);
      const freqs = o.double ? [f, f * Math.pow(2, o.double / 1200)] : [f];
      freqs.forEach((fr) => {
        const osc = ac.createOscillator();
        osc.type = o.type || 'sine';
        osc.frequency.setValueAtTime(fr, t);
        if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
        if (o.vib) {
          const lfo = ac.createOscillator(), lg = ac.createGain();
          lfo.frequency.value = o.vib; lg.gain.value = fr * 0.012;
          lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t); lfo.stop(t + d + 0.05);
        }
        osc.connect(g);
        osc.start(t);
        osc.stop(t + d + 0.05);
      });
    } catch (e) { /* son impossible */ }
  }
  function bruit(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      if (!bufBruit) {
        bufBruit = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = bufBruit.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(); src.buffer = bufBruit; src.loop = true;
      const fl = ac.createBiquadFilter(); fl.type = o.type || 'bandpass'; fl.frequency.value = o.f || 2500; fl.Q.value = o.q || 0.8;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.1, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t, Math.random() * 0.5); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }

  const sons = {
    touche(b, d, retard) {
      const r = RADIOS[prog.options.radio] || RADIOS[0];
      note(FREQ[b], d || 0.36, { type: r.onde, vol: 0.13 * (r.vol || 1), retard: retard, vib: r.vib, double: r.double, filtre: r.filtre });
    },
    voix(retard) {
      note(98, 0.55, { type: 'sawtooth', vol: 0.14, vers: 70, filtre: 520, retard: retard, double: 18 });
      note(49, 0.6, { type: 'sine', vol: 0.16, retard: retard });
    },
    crepite(d, retard) { bruit(d || 0.22, { f: 5200, q: 2.5, vol: 0.06, retard: retard }); },
    parasites() { bruit(0.6, { f: 1400, q: 0.5, vol: 0.16 }); note(130, 0.4, { type: 'square', vol: 0.05, vers: 60, filtre: 900 }); },
    pile() { note(660, 0.12, { type: 'square', vol: 0.05 }); note(330, 0.25, { type: 'square', vol: 0.05, retard: 0.12, filtre: 1200 }); },
    eteinte() { note(220, 0.9, { type: 'sawtooth', vol: 0.08, vers: 40, filtre: 700 }); bruit(0.9, { f: 800, vol: 0.06 }); },
    onde() { bruit(0.35, { f: 3500, q: 6, vol: 0.03 }); },
    ajout(b) { this.touche(b, 0.42); note(FREQ[b] * 2, 0.2, { vol: 0.04, retard: 0.05 }); },
    clic() { note(1200, 0.05, { type: 'square', vol: 0.03 }); },
    non() { note(180, 0.16, { type: 'square', vol: 0.05, filtre: 900 }); },
    tour() { note(880, 0.1, { vol: 0.06 }); note(1320, 0.14, { vol: 0.05, retard: 0.09 }); },
    tic() { note(1500, 0.04, { type: 'square', vol: 0.025 }); },
    arrive() { note(523, 0.12, { vol: 0.07 }); note(784, 0.18, { vol: 0.07, retard: 0.1 }); },
    part() { note(523, 0.12, { vol: 0.06 }); note(330, 0.2, { vol: 0.06, retard: 0.1 }); },
    victoire() { [523, 659, 784, 1046].forEach((f, i) => note(f, 0.3, { type: 'triangle', vol: 0.09, retard: i * 0.13 })); bruit(0.4, { f: 6000, q: 3, vol: 0.03, retard: 0.5 }); },
    defaite() { [392, 330, 262, 196].forEach((f, i) => note(f, 0.36, { type: 'sawtooth', vol: 0.05, filtre: 1100, retard: i * 0.17 })); },
    debloque() { [784, 988, 1175].forEach((f, i) => note(f, 0.2, { vol: 0.06, retard: i * 0.09 })); }
  };

  // Mélodie maudite d'une cassette (toujours la même pour une cassette donnée).
  function jouerCassette(k) {
    audio();
    let a = 1013 * (k + 3);
    const rnd = () => { a = (a * 1103515245 + 12345) & 0x7fffffff; return a / 0x7fffffff; };
    let t = 0;
    bruit(0.5, { f: 1800, vol: 0.05 });
    for (let i = 0; i < 12; i++) {
      const b = Math.floor(rnd() * NB), d = 0.18 + rnd() * 0.3;
      note(FREQ[b] * (rnd() < 0.3 ? 0.5 : 1), d + 0.1, { type: k % 2 ? 'triangle' : 'sine', vol: 0.1, retard: 0.4 + t, vib: 4 + k, filtre: 2200 });
      if (rnd() < 0.2) note(98, 0.4, { type: 'sawtooth', vol: 0.06, vers: 70, filtre: 500, retard: 0.4 + t });
      t += d;
    }
  }

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.innerHTML = prog.options.son ? ICONE_SON : ICONE_MUET;
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    majBoutonsSon();
    sauverOptions();
    if (prog.options.son) sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Écrans, toast, bandeau
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  function afficherEcran(nom) {
    ecran = nom;
    document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === 'ecran-' + nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom === 'titre') majTitre();
    if (nom !== 'jeu') lancerFond(); else { tPrec = 0; relancerBoucle(); }
  }

  let toastMinuteur = 0;
  function toast(texte, duree) {
    const t = $('toast');
    t.textContent = texte;
    t.classList.add('actif');
    clearTimeout(toastMinuteur);
    toastMinuteur = setTimeout(() => t.classList.remove('actif'), duree || 2400);
  }
  function bandeau(texte) {
    $('bandeau-texte').textContent = texte;
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // ---------------------------------------------------------------------
  //  Fond : la ville morte sous la lune, et la vieille radio (jaquette)
  // ---------------------------------------------------------------------

  function graine(n) { let a = n >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function dessinerVille(c, w, h, t) {
    const ciel = c.createLinearGradient(0, 0, 0, h);
    ciel.addColorStop(0, '#020407'); ciel.addColorStop(0.55, '#0a1a1c'); ciel.addColorStop(1, '#03060a');
    c.fillStyle = ciel; c.fillRect(0, 0, w, h);
    // étoiles
    const r1 = graine(7);
    c.fillStyle = '#cfe9d5';
    for (let i = 0; i < 70; i++) { const x = r1() * w, y = r1() * h * 0.5, s = r1() * 1.4 + 0.3; c.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(t * 0.0008 + i)); c.fillRect(x, y, s, s); }
    c.globalAlpha = 1;
    // lune voilée
    const lx = w * 0.78, ly = h * 0.16, lr = Math.min(w, h) * 0.07;
    const halo = c.createRadialGradient(lx, ly, lr * 0.5, lx, ly, lr * 4);
    halo.addColorStop(0, '#b9ffd055'); halo.addColorStop(1, '#00000000');
    c.fillStyle = halo; c.fillRect(0, 0, w, h);
    c.fillStyle = '#d9f5e0'; c.beginPath(); c.arc(lx, ly, lr, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#9fc7ab'; c.beginPath(); c.arc(lx - lr * 0.3, ly - lr * 0.2, lr * 0.22, 0, Math.PI * 2); c.arc(lx + lr * 0.35, ly + lr * 0.25, lr * 0.15, 0, Math.PI * 2); c.fill();
    // immeubles, deux plans
    [[0.5, '#0b1416', '#0e1d1f', 11, 0.38], [0.62, '#060a0c', '#070c0e', 23, 0.3]].forEach((p, plan) => {
      const r = graine(p[3]);
      let x = -10;
      const base = h * p[0] + h * 0.18;
      while (x < w + 10) {
        const lw = w * (0.07 + r() * 0.1), lh = h * (0.12 + r() * p[4]);
        c.fillStyle = p[1];
        c.fillRect(x, base - lh, lw, lh + h);
        if (r() < 0.3) { c.fillRect(x + lw * 0.4, base - lh - h * 0.04, 2, h * 0.04); }
        // fenêtres : presque toutes éteintes, quelques-unes vertes
        for (let fy = base - lh + 8; fy < base - 6; fy += 13) {
          for (let fx = x + 5; fx < x + lw - 6; fx += 10) {
            const k = r();
            if (k < 0.04 + plan * 0.02) { c.fillStyle = k < 0.015 ? '#7dff9a' : '#c9b46a'; c.globalAlpha = 0.35 + 0.4 * Math.abs(Math.sin(t * 0.001 * (1 + k * 30))); c.fillRect(fx, fy, 4, 6); c.globalAlpha = 1; }
            else if (k < 0.5) { c.fillStyle = p[2]; c.fillRect(fx, fy, 4, 6); }
          }
        }
        x += lw + r() * 6;
      }
    });
    // brume au sol
    const brume = c.createLinearGradient(0, h * 0.7, 0, h);
    brume.addColorStop(0, '#0f2a2200'); brume.addColorStop(0.5, '#173b2e66'); brume.addColorStop(1, '#03060aee');
    c.fillStyle = brume; c.fillRect(0, h * 0.6, w, h * 0.4);
    // lampadaire penché
    c.strokeStyle = '#0a1010'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(w * 0.12, h); c.lineTo(w * 0.12, h * 0.52); c.quadraticCurveTo(w * 0.12, h * 0.47, w * 0.2, h * 0.47); c.stroke();
    // ampoule qui clignote, halo doux
    const clig = 0.5 + 0.5 * Math.sin(t * 0.004) * Math.sin(t * 0.0013);
    const rayon = Math.min(w, h) * 0.22;
    const lampe = c.createRadialGradient(w * 0.2, h * 0.48, 2, w * 0.2, h * 0.48, rayon);
    lampe.addColorStop(0, 'rgba(201,180,106,' + (0.35 * clig).toFixed(3) + ')'); lampe.addColorStop(1, 'rgba(201,180,106,0)');
    c.fillStyle = lampe; c.fillRect(w * 0.2 - rayon, h * 0.48 - rayon, rayon * 2, rayon * 2);
    c.fillStyle = 'rgba(255,236,170,' + (0.3 + 0.6 * clig).toFixed(3) + ')';
    c.beginPath(); c.arc(w * 0.2, h * 0.48, 4, 0, Math.PI * 2); c.fill();
  }

  function dessinerRadio(c, cx, cy, s, t, rad, ondes) {
    rad = rad || RADIOS[prog.options.radio] || RADIOS[0];
    // ondes vertes qui sortent de l'antenne
    if (ondes) {
      for (let i = 0; i < 4; i++) {
        const k = ((t * 0.0004) + i / 4) % 1;
        c.strokeStyle = rad.ecran; c.globalAlpha = (1 - k) * 0.6; c.lineWidth = 3;
        c.beginPath(); c.arc(cx + s * 0.55, cy - s * 0.95, s * (0.15 + k * 1.3), Math.PI * 1.05, Math.PI * 1.95); c.stroke();
      }
      c.globalAlpha = 1;
    }
    // antenne
    c.strokeStyle = '#9aa5a0'; c.lineWidth = Math.max(2, s * 0.03);
    c.beginPath(); c.moveTo(cx + s * 0.35, cy - s * 0.42); c.lineTo(cx + s * 0.55, cy - s * 0.95); c.stroke();
    c.fillStyle = '#cfd8d4'; c.beginPath(); c.arc(cx + s * 0.55, cy - s * 0.95, s * 0.035, 0, Math.PI * 2); c.fill();
    // ombre
    c.fillStyle = '#0008'; c.beginPath(); c.ellipse(cx, cy + s * 0.48, s * 0.8, s * 0.09, 0, 0, Math.PI * 2); c.fill();
    // caisse
    const g = c.createLinearGradient(0, cy - s * 0.45, 0, cy + s * 0.45);
    g.addColorStop(0, rad.corps); g.addColorStop(1, rad.cadre);
    c.fillStyle = g; arrondi(c, cx - s * 0.75, cy - s * 0.45, s * 1.5, s * 0.9, s * 0.12); c.fill();
    c.strokeStyle = '#0006'; c.lineWidth = 2; c.stroke();
    // haut-parleur
    c.fillStyle = '#0006'; c.beginPath(); c.arc(cx - s * 0.38, cy + s * 0.05, s * 0.28, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ffffff18';
    for (let yy = -3; yy <= 3; yy++) for (let xx = -3; xx <= 3; xx++) {
      if (xx * xx + yy * yy > 10) continue;
      c.beginPath(); c.arc(cx - s * 0.38 + xx * s * 0.075, cy + s * 0.05 + yy * s * 0.075, s * 0.022, 0, Math.PI * 2); c.fill();
    }
    // cadran lumineux
    c.fillStyle = rad.verre; arrondi(c, cx - s * 0.02, cy - s * 0.32, s * 0.65, s * 0.3, s * 0.05); c.fill();
    c.save(); c.beginPath(); arrondi(c, cx - s * 0.02, cy - s * 0.32, s * 0.65, s * 0.3, s * 0.05); c.clip();
    c.strokeStyle = rad.ecran; c.lineWidth = 2; c.shadowColor = rad.ecran; c.shadowBlur = 8;
    c.beginPath();
    for (let x = 0; x <= 60; x++) {
      const px = cx - s * 0.02 + x / 60 * s * 0.65;
      const py = cy - s * 0.17 + Math.sin(x * 0.45 + t * 0.006) * s * 0.06 * Math.sin(t * 0.0013 + x * 0.05);
      if (x === 0) c.moveTo(px, py); else c.lineTo(px, py);
    }
    c.stroke(); c.restore();
    c.shadowBlur = 0;
    // six petits boutons
    for (let i = 0; i < 6; i++) {
      const bx = cx + s * 0.06 + (i % 3) * s * 0.21, by = cy + s * 0.1 + Math.floor(i / 3) * s * 0.17;
      c.fillStyle = TOUCHE_COUL[i]; c.globalAlpha = 0.4 + 0.6 * Math.max(0, Math.sin(t * 0.003 - i * 0.9));
      c.beginPath(); c.arc(bx, by, s * 0.055, 0, Math.PI * 2); c.fill();
      c.globalAlpha = 1;
    }
  }

  function arrondi(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  let fondId = 0;
  function lancerFond() { if (!fondId) fondId = requestAnimationFrame(imageFond); }
  function imageFond(t) {
    fondId = 0;
    if (ecran === 'jeu') return;
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    dessinerVille(c, w, h, t);
    if (ecran === 'titre') {
      // la radio se pose dans l'espace libre entre le titre et les boutons
      const haut = document.querySelector('#ecran-titre .entete-titre').getBoundingClientRect().bottom;
      const bas = document.querySelector('#ecran-titre .panneau').getBoundingClientRect().top;
      const libre = Math.max(80, bas - haut);
      const s = Math.max(40, Math.min(w * 0.42, libre * 0.44, h * 0.22));
      dessinerRadio(c, w / 2, haut + libre * 0.6, s, t, null, true);
    }
    fondId = requestAnimationFrame(imageFond);
  }

  // ---------------------------------------------------------------------
  //  Places (stations) et touches
  // ---------------------------------------------------------------------

  function construirePlaces() {
    const boite = $('places'), salon = $('salon-places');
    boite.textContent = ''; salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      d.setAttribute('role', 'group');
      d.innerHTML = svgForme(s) + '<div class="piles"></div><div class="pts"></div><div class="tag"></div>';
      d.appendChild(couronneCanvas());
      boite.appendChild(d);
      const p = document.createElement('div');
      p.className = 'salon-place'; p.id = 'salon-place-' + s;
      p.innerHTML = svgForme(s) + '<div class="tag"></div>';
      p.appendChild(couronneCanvas());
      salon.appendChild(p);
    }
  }
  function couronneCanvas() {
    const cv = document.createElement('canvas'); cv.className = 'couronne'; cv.width = 44; cv.height = 34;
    const c = cv.getContext('2d');
    c.fillStyle = '#ffd23f'; c.strokeStyle = '#6b4a00'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(4, 30); c.lineTo(4, 10); c.lineTo(14, 20); c.lineTo(22, 4); c.lineTo(30, 20); c.lineTo(40, 10); c.lineTo(40, 30); c.closePath(); c.fill(); c.stroke();
    return cv;
  }

  function construireTouches() {
    const boite = $('touches');
    boite.textContent = '';
    for (let b = 0; b < NB; b++) {
      const t = document.createElement('button');
      t.type = 'button'; t.className = 'touche'; t.id = 'touche-' + b;
      t.style.setProperty('--c', TOUCHE_COUL[b]);
      t.setAttribute('aria-label', tr('touche.aria', { n: b + 1 }));
      const num = document.createElement('span'); num.className = 'num'; num.textContent = nb(b + 1);
      t.appendChild(num);
      t.insertAdjacentHTML('beforeend', ICONE_ANTENNE);
      t.addEventListener('pointerdown', (ev) => { ev.preventDefault(); audio(); appuyer(b); });
      t.addEventListener('click', (ev) => { if (ev.detail === 0) { audio(); appuyer(b); } });
      t.addEventListener('keydown', (ev) => {
        const fl = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -3, ArrowDown: 3 }[ev.code];
        if (fl) { ev.preventDefault(); const n = b + fl; if (n >= 0 && n < NB) $('touche-' + n).focus(); }
      });
      boite.appendChild(t);
    }
  }

  // Lumières des touches : allume (durée en ms), effets spéciaux.
  const lumieres = [];   // { b, fin, classe }
  function allumer(b, ms, classe) {
    lumieres.push({ b: b, fin: performance.now() + ms, classe: classe || 'allume' });
    majLumieres();
  }
  function majLumieres() {
    const t = performance.now();
    for (let i = lumieres.length - 1; i >= 0; i--) if (lumieres[i].fin <= t) lumieres.splice(i, 1);
    for (let b = 0; b < NB; b++) {
      const el = $('touche-' + b);
      const l = lumieres.filter((x) => x.b === b);
      const voix = l.some((x) => x.classe === 'voix');
      el.classList.toggle('allume', l.some((x) => x.classe === 'allume' || x.classe === 'glitch'));
      el.classList.toggle('glitch', l.some((x) => x.classe === 'glitch'));
      el.classList.toggle('voix', voix);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché : le pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role; tag.dataset.nom = nom;
    tag.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : role === 'robot' ? ICONE_ROBOT : '';
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }
  function siegesActuels() {
    // avant la création de la partie solo (tutoriel) : toi à la place 0
    if (!partie) return session === 'solo' ? COUL.map((_, s) => ({ humain: s === 0, moi: s === 0, chef: false, nom: null })) : [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  let pilesAvant = [];
  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !R.fin(e) ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const actif = !e || e.ac[s] === 1;
      const piles = e ? e.pi[s] : 0;
      const max = e && e.n >= 0 ? NIVEAUX[e.n].p : 3;
      const boite = d.querySelector('.piles');
      if (boite.childElementCount !== max) { boite.textContent = ''; for (let k = 0; k < max; k++) boite.appendChild(document.createElement('i')); }
      [...boite.children].forEach((el, k) => {
        const pleine = actif && k < piles;
        if (el.classList.contains('pleine') && !pleine) { el.classList.add('vide'); setTimeout(() => el.classList.remove('vide'), 650); }
        el.classList.toggle('pleine', pleine);
      });
      d.querySelector('.pts').textContent = actif ? tr('place.notes', { n: e ? e.sc[s] : 0 }) : '';
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      d.classList.toggle('absente', !actif);
      d.classList.toggle('eteinte', actif && !!e && piles <= 0);
      const role = !actif ? 'absent' : roleDe(info);
      remplirTag(d.querySelector('.tag'), role, role === 'absent' ? tr('place.absent') : nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria', { station: tr('station.' + s), qui: role === 'absent' ? tr('place.absent') : nomPlace(info, role), n: piles }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
    pilesAvant = e ? e.pi.slice() : [];
  }

  // Touches : antenne coupée, nuit noire.
  function majTouchesEtat() {
    const e = vue;
    const p = e && e.p ? e.p : null;
    const enJeu = partie && partie.phase === 'jeu' && e && !R.fin(e);
    for (let b = 0; b < NB; b++) $('touche-' + b).classList.toggle('coupe', !!(enJeu && p && p.a === b));
    $('poste').classList.toggle('noir', !!(enJeu && p && p.o && monTour && monTour.phase === 'ecoute'));
  }

  // ---------------------------------------------------------------------
  //  État de la partie et du tour du joueur
  // ---------------------------------------------------------------------

  let partie = null, session = null, niveau = 1, vue = null;
  let enPause = false, enPartie = false, attenteTuto = false;
  let jeton = 0;
  let humainsAvant = null;
  let debutTour = Date.now(), dernierTic = -1;
  let finManche = 0;
  let occupeJusqua = 0;          // animation d'un coup des autres en cours (ms, performance.now)
  let dernierAttends = 0;

  // Tour du joueur de l'appareil : écoute (la radio joue), saisie, ajout, envoyé.
  let monTour = null;            // { k, phase, t, evts, prochain, tape, exp, p }

  function pieges(p) {
    const l = [];
    if (p.v.length > 1) l.push('voix2'); else if (p.v.length) l.push('voix');
    if (p.i) l.push('inv');
    if (p.e) l.push('echo');
    if (p.a >= 0) l.push('antenne');
    if (p.o) l.push('noir');
    return l;
  }

  function debuterEcoute(e) {
    const p = e.p, pas = p.e ? 330 : 640, allume = p.e ? 200 : 400;
    const evts = [];
    let t = 900;
    const voix = p.v.slice();
    for (let j = 0; j <= e.ch.length; j++) {
      voix.filter((v) => v[0] === j).forEach((v) => { evts.push({ t: t, b: v[1], k: 'voix', d: allume + 120 }); t += pas + 120; });
      if (j === e.ch.length) break;
      const glitch = p.i && j >= p.i[0] && j <= p.i[1];
      evts.push({ t: t, b: e.ch[j], k: glitch ? 'glitch' : 'note', d: allume, j: j });
      t += pas;
    }
    monTour = { k: e.k, phase: 'ecoute', t: 0, fin: t + 200, evts: evts, prochain: 0, tape: [], exp: O.attendu(e), p: p };
    sons.tour();
    const l = pieges(p);
    if (l.length) toast(l.map((x) => tr('piege.' + x)).join(' · '), 2600);
  }

  // Avance la lecture de la radio (dt en ms ; s'arrête avec la pause).
  function avancerEcoute(dt) {
    const m = monTour;
    if (!m || m.phase !== 'ecoute') return;
    m.t += dt;
    while (m.prochain < m.evts.length && m.evts[m.prochain].t <= m.t) {
      const ev = m.evts[m.prochain++];
      const sansLumiere = m.p.o || (m.p.a === ev.b && ev.k !== 'voix');
      if (ev.k === 'voix') { sons.voix(); if (!m.p.o) allumer(ev.b, ev.d, 'voix'); onde(1.6, '#ff3030'); }
      else {
        sons.touche(ev.b, ev.d / 1000 + 0.05);
        if (ev.k === 'glitch') { sons.crepite(ev.d / 1000); onde(1, '#c08bff', true); } else onde(1, TOUCHE_COUL[ev.b]);
        if (!sansLumiere) allumer(ev.b, ev.d, ev.k === 'glitch' ? 'glitch' : 'allume');
      }
    }
    if (m.t >= m.fin) { m.phase = 'saisie'; sons.clic(); majInfos(); majTouchesEtat(); }
  }

  function appuyer(b) {
    if (!partie || enPause || attenteTuto || ecran !== 'jeu') return;
    const m = monTour;
    if (!m || !partie.monTour() || m.k !== partie.etat.k) {
      sons.touche(b, 0.18); allumer(b, 160);
      if (partie.phase === 'jeu' && performance.now() - dernierAttends > 1500) { dernierAttends = performance.now(); toast(tr('tour.attends'), 1400); }
      return;
    }
    if (m.phase === 'ecoute') {
      if (performance.now() - dernierAttends > 1200) { dernierAttends = performance.now(); toast(tr('tour.ecoute'), 1300); sons.non(); }
      return;
    }
    if (m.phase === 'saisie') {
      const j = m.tape.length;
      m.tape.push(b);
      if (b !== m.exp[j]) {
        // erreur : la suite est perdue pour ce tour
        allumer(b, 300); $('touche-' + b).classList.add('erreur'); setTimeout(() => $('touche-' + b).classList.remove('erreur'), 420);
        m.phase = 'envoye';
        partie.jouer({ r: m.tape.slice(), a: -1 });
        return;
      }
      sons.touche(b, 0.3); allumer(b, 240); onde(0.8, TOUCHE_COUL[b]);
      if (m.tape.length === m.exp.length) { m.phase = 'ajout'; setTimeout(() => sons.tour(), 120); majInfos(); }
      else majInfos();
      return;
    }
    if (m.phase === 'ajout') {
      if (b === m.p.a) { sons.non(); toast(tr('tour.coupe'), 1600); $('touche-' + b).classList.add('erreur'); setTimeout(() => $('touche-' + b).classList.remove('erreur'), 420); return; }
      sons.ajout(b); allumer(b, 500); onde(1.4, TOUCHE_COUL[b]);
      m.phase = 'envoye';
      partie.jouer({ r: m.tape.slice(), a: b });
    }
  }

  // ---------------------------------------------------------------------
  //  Écran vert de la radio : oscilloscope et suite (points)
  // ---------------------------------------------------------------------

  let ondes = [];   // { t0, amp, coul, bruit }
  function onde(amp, coul, b) { ondes.push({ t0: performance.now(), amp: amp, coul: coul, bruit: !!b }); if (ondes.length > 8) ondes.shift(); }

  function dessinerEcranVert(t) {
    const cv = $('ecran-vert');
    const w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const rad = RADIOS[prog.options.radio] || RADIOS[0];
    c.fillStyle = rad.verre; c.fillRect(0, 0, w, h);
    // quadrillage
    c.strokeStyle = rad.ecran; c.globalAlpha = 0.09; c.lineWidth = 1;
    for (let x = 0; x < w; x += 18) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
    for (let y = 0; y < h; y += 18) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
    c.globalAlpha = 1;
    // onde
    let amp = 0.08, coul = rad.ecran, br = 0;
    ondes = ondes.filter((o) => t - o.t0 < 700);
    ondes.forEach((o) => { const k = 1 - (t - o.t0) / 700; if (o.amp * k > amp) { amp = o.amp * k; coul = o.coul; } if (o.bruit) br = Math.max(br, k); });
    if (parasitesJusqua > t) { br = 1; amp = 1.2; coul = '#ffffff'; }
    const milieuY = h * 0.42;
    c.strokeStyle = coul; c.lineWidth = 2.2; c.shadowColor = coul; c.shadowBlur = 10;
    c.beginPath();
    for (let x = 0; x <= w; x += 3) {
      let y = Math.sin(x * 0.06 + t * 0.012) * amp * h * 0.16 + Math.sin(x * 0.021 - t * 0.004) * h * 0.03;
      if (br) y += (Math.random() - 0.5) * br * h * 0.3;
      if (x === 0) c.moveTo(x, milieuY + y); else c.lineTo(x, milieuY + y);
    }
    c.stroke();
    c.shadowBlur = 0;
    // la suite : un point par note, le soleil de l'aube au bout
    const e = vue;
    if (e) {
      const total = e.aube, L = e.ch.length;
      const marge = 14, y = h * 0.82;
      const pas = Math.min(22, (w - marge * 2 - 26) / Math.max(1, total - 1));
      const r = Math.max(3, Math.min(7, pas * 0.32));
      const m = monTour && monTour.k === e.k ? monTour : null;
      for (let i = 0; i < total; i++) {
        const x = marge + i * pas;
        c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
        if (i < L) {
          let fait = m && (m.phase === 'saisie' || m.phase === 'ajout' || m.phase === 'envoye') && i < m.tape.length;
          const enInv = m && m.p.i && i >= m.p.i[0] && i <= m.p.i[1];
          c.fillStyle = fait ? '#ffffff' : (enInv ? '#c08bff' : rad.ecran);
          c.globalAlpha = fait ? 1 : 0.75;
          c.fill();
        } else {
          c.strokeStyle = rad.ecran; c.globalAlpha = 0.35; c.lineWidth = 1.5; c.stroke();
        }
        c.globalAlpha = 1;
      }
      // soleil de l'aube
      const sx = marge + (total - 1) * pas + 20, sy = y;
      c.fillStyle = '#ffd27a'; c.globalAlpha = 0.85;
      c.beginPath(); c.arc(sx, sy, 6, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#ffd27a'; c.lineWidth = 1.5;
      for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; c.beginPath(); c.moveTo(sx + Math.cos(a) * 8, sy + Math.sin(a) * 8); c.lineTo(sx + Math.cos(a) * 11, sy + Math.sin(a) * 11); c.stroke(); }
      c.globalAlpha = 1;
      // écoute : barre de progression de la lecture
      if (m && m.phase === 'ecoute') {
        c.fillStyle = rad.ecran; c.globalAlpha = 0.6;
        c.fillRect(0, h - 3, w * Math.min(1, m.t / m.fin), 3);
        c.globalAlpha = 1;
      }
    }
    // lignes de balayage
    c.fillStyle = '#000'; c.globalAlpha = 0.18;
    for (let y = 0; y < h; y += 3) c.fillRect(0, y, w, 1);
    c.globalAlpha = 1;
  }

  // Neige de parasites plein écran (erreur).
  let parasitesJusqua = 0;
  function parasites(fort) {
    parasitesJusqua = performance.now() + (fort ? 700 : 450);
    const cv = $('neige');
    cv.classList.add('actif');
    const j = ++parasites.n;
    const w = Math.ceil(window.innerWidth / 3), h = Math.ceil(window.innerHeight / 3);
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const img = c.createImageData(w, h);
    function pas() {
      if (j !== parasites.n) return;
      for (let i = 0; i < img.data.length; i += 4) { const v = Math.random() * 255; img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255; }
      c.putImageData(img, 0, 0);
      if (performance.now() < parasitesJusqua) requestAnimationFrame(pas); else cv.classList.remove('actif');
    }
    requestAnimationFrame(pas);
    const jeu = $('ecran-jeu');
    jeu.classList.remove('secousse'); void jeu.offsetWidth; jeu.classList.add('secousse');
  }
  parasites.n = 0;

  // ---------------------------------------------------------------------
  //  Infos et messages
  // ---------------------------------------------------------------------

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || R.fin(e)) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      const m = monTour && monTour.k === e.k ? monTour : null;
      if (!m || m.phase === 'ecoute') return tr('tour.ecouteMsg');
      if (m.phase === 'saisie') return tr('tour.rejoue', { n: m.tape.length, total: m.exp.length });
      if (m.phase === 'ajout') return tr('tour.ajoute');
      return '';
    }
    if (partie.siege >= 0 && e.pi[partie.siege] <= 0) return tr('tour.eteint');
    const nom = (siegesActuels()[s] || {}).nom;
    return tr('tour.autre', { qui: nom || tr('station.' + s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (vue && session === 'solo') info += ' · ' + tr('jeu.aube', { n: vue.aube });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majTouchesEtat();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !R.fin(e)) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(100, tPrec ? t - tPrec : 16);
    tPrec = t;
    // mon tour commence quand tous les coups précédents ont été montrés
    if (partie && vue && !attenteTuto && partie.monTour() && partie.etat && (!monTour || monTour.k !== partie.etat.k) && t >= occupeJusqua) {
      vue = JSON.parse(JSON.stringify(partie.etat));
      debuterEcoute(vue);
      majInterface();
    }
    avancerEcoute(dt);
    majLumieres();
    dessinerEcranVert(t);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      case 'refus': if (monTour) monTour = null; break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    monTour = null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne)
  // ---------------------------------------------------------------------

  let finSalon = 0, resultatSalon = null, finEnAttente = false, lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    monTour = null;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { station: tr('station.' + s), qui: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef + ' · ' + tr('station.' + partie.chef) : tr('station.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    monTour = null;
    lumieres.length = 0;
    occupeJusqua = performance.now() + 700;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    onde(1.2, '#ffffff', true);
    sons.crepite(0.5);
  }

  // Le coup d'une station : rapide pour les autres (le joueur ne réécoute pas
  // toute la suite) ; pour soi, la note a déjà sonné sous le doigt.
  function surAction(ev) {
    const t = performance.now();
    const jA = jetonAnim;
    vue = JSON.parse(JSON.stringify(ev.apres));
    debutTour = Date.now();
    dernierTic = -1;
    const d = ev.apres.der || {};
    if (ev.moi && !ev.auto) {
      monTour = null;
      if (d.ok) { toast(tr('coup.toiJuste', { n: d.l }), 1300); }
      else { sons.parasites(); parasites(true); sons.pile(); toast(tr(ev.apres.pi[ev.siege] <= 0 ? 'coup.toiEteint' : 'coup.toiFaux'), 2200); if (ev.apres.pi[ev.siege] <= 0) sons.eteinte(); }
    } else {
      if (ev.moi) monTour = null;
      occupeJusqua = t + 950;
      if (d.ok) {
        sons.onde();
        for (let b = 0; b < NB; b++) setTimeout(() => { if (jetonAnim === jA) allumer(b, 110); }, b * 55);
        setTimeout(() => { if (jetonAnim === jA) { sons.ajout(d.a); allumer(d.a, 420); onde(1.3, TOUCHE_COUL[d.a]); } }, 460);
      } else {
        setTimeout(() => { if (jetonAnim === jA) { sons.parasites(); sons.pile(); parasites(false); if (d.b >= 0) allumer(d.b, 260, 'voix'); if (ev.apres.pi[ev.siege] <= 0) { sons.eteinte(); toast(tr('coup.eteint', { qui: nomStation(ev.siege) }), 1800); } } }, 150);
      }
      if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    }
    const carte = $('place-' + ev.siege);
    carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
  }
  let jetonAnim = 0;

  function nomStation(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    return info.nom || tr('station.' + s);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    monTour = null;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1100);
  }

  // Gagné : personne n'a gardé plus de piles que toi (égalité à l'aube = victoire partagée).
  function aGagne(e, moi) {
    if (moi < 0 || !R.fin(e) || e.pi[moi] <= 0) return false;
    let max = 0;
    for (let s = 0; s < PLACES; s++) if (e.ac[s] === 1) max = Math.max(max, e.pi[s]);
    return e.pi[moi] === max;
  }

  // Fin d'une manche en ligne : classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = aGagne(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(lg, gagne, n) {
    if (!gagne) return 0;
    const s = O.seuils(n);
    return lg >= s.or ? 3 : lg >= s.argent ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3, 4];
    // rang partagé entre stations à égalité (mêmes piles, éteintes au même moment)
    let rang = 0, k = 0, prec = null;
    ordre.forEach((s) => {
      if (e.ac[s] !== 1) return;
      k++;
      const cle = e.pi[s] + '|' + e.el[s];
      if (cle !== prec) { rang = k; prec = cle; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      l.appendChild(r);
      l.insertAdjacentHTML('beforeend', svgForme(s));
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('station.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = e.pi[s] > 0 ? tr('fin.piles', { n: e.pi[s] }) : tr('fin.eteinte');
      l.append(qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const gagne = aGagne(e, moi);
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts, lg: e.lg[moi] }) : '';
    $('fin-cassette').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(e.lg[moi] || 0, gagne, niveau);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const radiosAvant = RADIOS.map((_, k) => radioOuverte(k));
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        // cassette maudite : nuits paires gagnées avec 3 étoiles
        const k7 = niveau % 2 === 0 ? niveau / 2 - 1 : -1;
        if (k7 >= 0 && etoiles === 3 && prog.k7.indexOf(k7) < 0) {
          prog.k7.push(k7);
          $('fin-cassette').textContent = tr('fin.cassette', { nom: tr('k7.' + k7) });
          setTimeout(() => jouerCassette(k7), 900);
        }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      const nouvelleRadio = RADIOS.findIndex((_, k) => !radiosAvant[k] && radioOuverte(k));
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr(moi >= 0 && e.pi[moi] <= 0 ? 'fin.eteint' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      const s = O.seuils(niveau);
      $('fin-record').textContent = (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) })) + ' · ' + tr('fin.seuils', { a: s.argent, o: s.or });
      let txt = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (nouvelleRadio >= 0) { txt = (txt ? txt + ' ' : '') + tr('fin.radio', { nom: tr('radio.' + RADIOS[nouvelleRadio].id) }); setTimeout(() => sons.debloque(), 1400); }
      $('fin-debloque').textContent = txt;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: partie.manche });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';

      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }

    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire (verts, comme l'écran de la radio).
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    const pal = ['#7dff9a', '#ffffff', '#ffd27a', '#4fe0ff', '#b18cff'];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: pal[i % pal.length], k: 5 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.shadowColor = b.coul; c.shadowBlur = 6; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }

    partie = null;
    session = null;
    enPartie = false;

    attenteTuto = false;

  // Parcours solo : nuit n contre des robots (force croissante, donnée par la nuit).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    jetonAnim++;
    enPartie = true;
    enPause = false;
    monTour = null;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    occupeJusqua = performance.now() + 600;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNuit(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });

    majInterface();

    afficherEcran('jeu');

    majInterface();
  }

  function dessinK7(cv, k, ouverte) {
    const c = cv.getContext('2d'), w = cv.width, h = cv.height;
    c.clearRect(0, 0, w, h);
    const teintes = ['#7a1f1f', '#1f4a7a', '#4a1f7a', '#1f7a4a', '#7a5a1f', '#3a3a3a', '#7a1f5a', '#1f6a7a', '#5a7a1f', '#2a0f0f'];
    c.fillStyle = ouverte ? teintes[k] : '#222'; arrondi(c, 4, 4, w - 8, h - 8, 8); c.fill();
    c.strokeStyle = '#000a'; c.lineWidth = 2; c.stroke();
    c.fillStyle = ouverte ? '#e8e0c8' : '#333'; c.fillRect(14, 10, w - 28, h * 0.38);
    // traits griffonnés à la place d'une étiquette écrite
    if (ouverte) { c.strokeStyle = '#7a1f1f'; c.lineWidth = 1.5; for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(20, 16 + i * 6); for (let x = 20; x < w - 22; x += 6) c.lineTo(x, 16 + i * 6 + Math.sin(x * 0.7 + k + i) * 1.5); c.stroke(); } }
    c.fillStyle = '#111'; arrondi(c, w * 0.25, h * 0.55, w * 0.5, h * 0.25, 6); c.fill();
    c.fillStyle = ouverte ? '#ddd' : '#444';
    [w * 0.36, w * 0.64].forEach((x) => { c.beginPath(); c.arc(x, h * 0.675, h * 0.08, 0, Math.PI * 2); c.fill(); });
    if (!ouverte) { c.fillStyle = '#888'; c.beginPath(); c.arc(w / 2, h / 2, 9, Math.PI, 0); c.lineWidth = 3; c.strokeStyle = '#888'; c.stroke(); c.fillRect(w / 2 - 11, h / 2, 22, 16); }
  }

  function ouvrirPause() {

  // ---------------------------------------------------------------------
  //  Tutoriels animés : petite radio, notes jouées, puis la main du joueur
  // ---------------------------------------------------------------------

  // Étapes : e = écoute (k : note, voix, glitch, sombre), m = main (b), x = erreur, a = ajout.
  const TUTOS = {
    base: [['e', 1, 'note'], ['e', 4, 'note'], ['m', 1], ['m', 4], ['a', 2]],
    stations: [['s', 1], ['e', 0, 'note'], ['s', 2], ['e', 3, 'note'], ['s', 0], ['m', 0], ['m', 3], ['a', 5]],
    voix: [['e', 1, 'note'], ['e', 5, 'voix'], ['e', 2, 'note'], ['m', 1], ['m', 2], ['a', 0]],
    inv: [['e', 0, 'note'], ['e', 3, 'glitch'], ['e', 4, 'glitch'], ['m', 0], ['m', 4], ['m', 3]],
    echo: [['e', 0, 'vite'], ['e', 2, 'vite'], ['e', 1, 'vite'], ['e', 5, 'vite'], ['m', 0], ['m', 2], ['m', 1], ['m', 5]],
    antenne: [['e', 1, 'note'], ['e', 2, 'sombre'], ['e', 0, 'note'], ['m', 1], ['m', 2], ['m', 0]],
    noir: [['e', 0, 'sombre'], ['e', 3, 'sombre'], ['e', 4, 'sombre'], ['m', 0], ['m', 3], ['m', 4]],
    piles: [['e', 1, 'note'], ['e', 3, 'note'], ['m', 1], ['x', 5]],
    double: [['e', 0, 'note'], ['e', 3, 'voix'], ['e', 1, 'note'], ['e', 5, 'voix'], ['m', 0], ['m', 1]]
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const etapes = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const j = ++tutoAnim;
    const pos = (b) => [150 + (b % 3) * 130, 175 + Math.floor(b / 3) * 110];
    let debut = 0, k = -1, piles = 3, actif = 0;
    const duree = (e) => (e[0] === 'e' && e[2] === 'vite') ? 380 : (e[0] === 's' ? 600 : 800);
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      // étape en cours
      let ecoule = t - debut, i = 0;
      while (i < etapes.length && ecoule >= duree(etapes[i])) { ecoule -= duree(etapes[i]); i++; }
      if (i >= etapes.length) { if (ecoule > 1400) { debut = t; k = -1; piles = 3; actif = 0; } i = etapes.length; }
      if (i !== k && i < etapes.length) {
        k = i;
        const e = etapes[i];
        if (e[0] === 's') actif = e[1];
        if (e[0] === 'x') piles = 2;
      }
      const e = i < etapes.length ? etapes[i] : null;
      const q = e ? Math.min(1, ecoule / duree(e)) : 1;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#0b1a12'; c.fillRect(0, 0, 560, 360);
      // stations en haut
      if (cle === 'stations') {
        for (let s = 0; s < 3; s++) {
          const x = 180 + s * 100;
          c.fillStyle = COUL[s]; c.globalAlpha = s === actif ? 1 : 0.35;
          c.beginPath(); c.arc(x, 48, s === actif ? 22 : 16, 0, Math.PI * 2); c.fill();
          c.globalAlpha = 1;
        }
      } else {
        // écran vert et onde
        c.strokeStyle = '#7dff9a'; c.lineWidth = 3; c.beginPath();
        const amp = e && (e[0] === 'e') ? (1 - q) * 22 : 4;
        for (let x = 40; x <= 520; x += 6) { const y = 52 + Math.sin(x * 0.07 + t * 0.012) * amp; if (x === 40) c.moveTo(x, y); else c.lineTo(x, y); }
        if (e && e[2] === 'voix') c.strokeStyle = '#ff3030';
        c.stroke();
        // piles
        if (cle === 'piles') for (let p = 0; p < 3; p++) { c.fillStyle = p < piles ? '#7dff9a' : '#203024'; c.fillRect(470 + p * 20, 18, 14, 24); }
      }
      // six touches
      for (let b = 0; b < 6; b++) {
        const [x, y] = pos(b);
        let lum = 0.35, coul = TOUCHE_COUL[b];
        if (e && e[1] === b && q < 0.75) {
          if (e[0] === 'e' && e[2] !== 'sombre') { lum = 1; if (e[2] === 'voix') coul = '#ff2020'; }
          if (e[0] === 'm' || e[0] === 'a') lum = q > 0.45 ? 1 : 0.35;
          if (e[0] === 'x') { lum = q > 0.45 ? 1 : 0.35; if (q > 0.45) coul = '#ff2020'; }
        }
        if (cle === 'antenne' && b === 2) lum = Math.min(lum, 0.2);
        if (cle === 'noir' && e && e[0] === 'e') lum = 0.15;
        c.fillStyle = '#151515'; arrondi(c, x - 52, y - 42, 104, 84, 18); c.fill();
        c.fillStyle = coul; c.globalAlpha = lum; c.shadowColor = coul; c.shadowBlur = lum > 0.9 ? 24 : 0;
        c.beginPath(); c.arc(x, y, 24, 0, Math.PI * 2); c.fill();
        c.globalAlpha = 1; c.shadowBlur = 0;
        if (e && e[1] === b && e[2] === 'glitch' && q < 0.75) {
          c.fillStyle = '#c08bff88';
          for (let yy = y - 40; yy < y + 40; yy += 7) c.fillRect(x - 50, yy + (t / 40 % 7), 100, 3);
        }
        if (cle === 'antenne' && b === 2) { c.strokeStyle = '#ff4a3a'; c.lineWidth = 4; c.beginPath(); c.moveTo(x - 30, y - 30); c.lineTo(x + 30, y + 30); c.stroke(); }
      }
      // ondes sonores sans lumière
      if (e && e[0] === 'e' && (e[2] === 'sombre' || cle === 'noir')) {
        for (let r = 0; r < 3; r++) { c.strokeStyle = '#7dff9a'; c.globalAlpha = (1 - q) * 0.7; c.lineWidth = 3; c.beginPath(); c.arc(280, 52, 14 + r * 16 + q * 30, 0, Math.PI * 2); c.stroke(); }
        c.globalAlpha = 1;
      }
      // erreur : neige
      if (e && e[0] === 'x' && q > 0.45) { for (let n = 0; n < 500; n++) { c.fillStyle = Math.random() < 0.5 ? '#fff' : '#555'; c.fillRect(Math.random() * 560, Math.random() * 360, 3, 3); } }
      // la main
      if (e && (e[0] === 'm' || e[0] === 'a' || e[0] === 'x')) {
        const [x, y] = pos(e[1]);
        const qq = Math.min(1, q / 0.45);
        main(c, 500 + (x - 500) * qq, 350 + (y + 10 - 350) * qq, 1.5, q > 0.45 ? 1 : 0);
        if (e[0] === 'a' && q > 0.45) { c.fillStyle = '#ffe36b'; for (let s = 0; s < 6; s++) { const a = s * Math.PI / 3 + t * 0.004; c.beginPath(); c.arc(x + Math.cos(a) * 40 * q, y + Math.sin(a) * 40 * q, 4, 0, Math.PI * 2); c.fill(); } }
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (pression : 0 à 1).
  function main(c, x, y, k, pression) {
    c.save();
    c.translate(x, y); c.scale(k, k);
    if (pression > 0) { c.strokeStyle = '#ffffffaa'; c.lineWidth = 2; c.beginPath(); c.arc(0, -4, 14 + pression * 8, 0, Math.PI * 2); c.stroke(); }
    c.fillStyle = '#f1d3b5'; c.strokeStyle = '#6b4a30'; c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(-4, 0); c.lineTo(-4, -16); c.quadraticCurveTo(0, -21, 4, -16); c.lineTo(4, -4);
    c.lineTo(9, -6); c.quadraticCurveTo(13, -6, 13, -2); c.lineTo(13, 2); c.lineTo(16, 1); c.quadraticCurveTo(19, 2, 19, 6);
    c.lineTo(19, 14); c.quadraticCurveTo(16, 24, 6, 24); c.lineTo(-2, 24); c.quadraticCurveTo(-10, 22, -12, 12); c.lineTo(-12, 4);
    c.quadraticCurveTo(-10, 0, -4, 2); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Clavier
  // ---------------------------------------------------------------------

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const m = /^(?:Digit|Numpad)([1-6])$/.exec(ev.code);
    if (m) { ev.preventDefault(); audio(); appuyer(parseInt(m[1], 10) - 1); return; }
    if (/^Arrow/.test(ev.code) && !(document.activeElement && document.activeElement.classList.contains('touche'))) {
      ev.preventDefault(); $('touche-0').focus();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-collection').addEventListener('click', () => { audio(); sons.clic(); ouvrirCollection(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('col-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  document.title = tr('titre');
  chargerProgression();
  appliquerRadio();
  construirePlaces();
  construireTouches();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
