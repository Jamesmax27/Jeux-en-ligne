}
function dessinerLoin(o, y, D, tps) {
  const s = o.s * 0.8;

    ctx.fillStyle = '#fff'; ctx.fillRect(-8, -22, 16, 22);

function dessinerMid(o, y, tps) {
  ctx.save(); ctx.translate(o.x, y + 6); ctx.scale(o.s, o.s);
  if (o.type === 'arbre' || o.type === 'pommier') {
    ctx.fillStyle = '#6b4a2e'; ctx.fillRect(-5, -36, 10, 36);
    ctx.fillStyle = '#4e9a43'; ctx.beginPath(); ctx.arc(0, -52, 28, 0, Math.PI * 2); ctx.arc(-20, -40, 18, 0, Math.PI * 2); ctx.arc(20, -40, 18, 0, Math.PI * 2); ctx.fill();

  } else if (o.type === 'haie') {

function dessinerSol(N, cx, tps) {
  const D = DECORS[N.decor] || DECORS.jour;
  const x0 = cx - 20, x1 = cx + vueW + 20;
  ctx.fillStyle = D.sol; ctx.fillRect(x0, SOL - 2, x1 - x0, H - SOL + 400);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(x0, SOL + 18, x1 - x0, H);
  // Touffes et fleurettes
  ctx.strokeStyle = '#3c8f34'; ctx.lineWidth = 2;
  for (const t of N.deco.touffes) if (t.x > x0 && t.x < x1 && solEn(N, t.x) === 'herbe') {
    ctx.beginPath(); ctx.moveTo(t.x - 4, SOL + 2); ctx.lineTo(t.x - 6, SOL - t.h); ctx.moveTo(t.x, SOL + 2); ctx.lineTo(t.x + 1, SOL - t.h - 4); ctx.moveTo(t.x + 4, SOL + 2); ctx.lineTo(t.x + 7, SOL - t.h); ctx.stroke();

      ctx.fillStyle = '#7a5a3a'; ctx.fillRect(s.a - 6, SOL - 6, 8, 12); ctx.fillRect(s.b - 2, SOL - 6, 8, 12);

function visible(x, marge) { return x > cam.x - (marge || 120) && x < cam.x + vueW + (marge || 120); }

function dessinerNiveau(N, cx, cy, tps, avecPapillon) {
  dessinerFond(N, cx, cy, tps);
  const sx = cam.sec > 0 ? (Math.random() - 0.5) * 8 * cam.sec * 3 : 0;
  ctx.setTransform(DPR * S, 0, 0, DPR * S, (-cx + sx) * DPR * S, -cy * DPR * S);
  // Nuages de pluie au-dessus des zones d'averse
  for (const z of N.pluies) {
    if (z.b < cx || z.a > cx + vueW) continue;
    ctx.fillStyle = 'rgba(110,120,145,.85)';
    for (let x = z.a; x < z.b; x += 70) { ctx.beginPath(); ctx.arc(x + 30, cy + 40 + Math.sin(x) * 10, 50, 0, Math.PI * 2); ctx.fill(); }
  }

    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 14; i++) {

      const x = v.a + ((i * 157 + tps * (Math.abs(v.fx) + 120) * sens) % per + per) % per;
      const y = SOL - 60 - ((i * 97) % 440) - (v.fy ? ((tps * -v.fy * 0.8 + i * 50) % 300 + 300) % 300 : 0) * Math.sign(-v.fy || 1) * 0.3;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - sens * 30, y - (v.fy ? Math.sign(v.fy) * -14 : 0)); ctx.stroke();
      if (i % 4 === 0) { ctx.fillStyle = '#8cc63f'; ctx.beginPath(); ctx.ellipse(x + 8 * sens, y, 6, 3, tps * 4 + i, 0, Math.PI * 2); ctx.fill(); }
    }

      const plein = p8 < 0.5 ? 0.2 : Math.min(1, 0.2 + (p8 - 0.5) * 2.2);
      c.fillStyle = 'rgba(255,255,255,.8)'; c.fillRect(110, SOL - 205, 110, 14);
      c.fillStyle = '#ffb347'; c.fillRect(112, SOL - 203, 106 * plein, 10); break;
    }
    case 'tuto3': case 'grenouille': {
      const pad1 = { x: 90, y: SOL - 12, w: 62, appui: true }, pad2 = { x: 250, y: SOL - 12, w: 62, appui: true };
      dessinerNenuphar(c, pad1); dessinerNenuphar(c, pad2); dessinerNenuphar(c, { x: 170, y: SOL - 12, w: 62, appui: false });
      const sautT = p8 > 0.35 && p8 < 0.65 ? Math.sin((p8 - 0.35) / 0.3 * Math.PI) : 0;
      dessinerGrenouille(c, { x: 170, y: SOL - 18, dy: -sautT * 110, etat: sautT > 0 ? 'saut' : p8 > 0.25 && p8 <= 0.35 ? 'pret' : 'repos' }, u);
      pap = chemin([[90, SOL - 25], [130, SOL - 190], [210, SOL - 195], [250, SOL - 25], [250, SOL - 25]], p8);
      if (k === 'tuto3') for (let i = 0; i < 4; i++) if (p8 < 0.3 + i * 0.1) dessinerPollen(c, 130 + i * 27, SOL - 192, u, false);
      tap = p8 < 0.6 ? ((p8 * 10) % 1) : null; doigt(c, 300, SOL - 30, tap); break;
    }
    case 'ronces': {
      dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      pap = chemin([[40, SOL - 133], [165, SOL - 200], [290, SOL - 143], [290, SOL - 143]], p8);
      tap = p8 < 0.6 ? ((p8 * 10) % 1) : null; doigt(c, 305, SOL - 30, tap); break;
    }
    case 'vent': case 'courant': {
      dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3;
      for (let i = 0; i < 6; i++) { const x = (i * 60 + u * 140) % 340, y = SOL - 40 - i * 28; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 30, k === 'courant' ? y + 18 : y); c.stroke(); }
      pap = chemin(k === 'courant' ? [[40, SOL - 133], [120, SOL - 150], [200, SOL - 205], [290, SOL - 143], [290, SOL - 143]] : [[40, SOL - 133], [140, SOL - 170], [230, SOL - 165], [290, SOL - 143], [290, SOL - 143]], p8);
      break;
    }
    case 'oiseau': case 'oiseau2': {
      dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      const ox = k === 'oiseau' ? 360 - p8 * 420 : -40 + p8 * 420;
      dessinerOiseau(c, ox, SOL - 180, k === 'oiseau' ? -1 : 1, u);
      pap = chemin([[40, SOL - 133], [100, SOL - 110], [190, SOL - 100], [290, SOL - 143], [290, SOL - 143]], p8);
      break;
    }
    case 'tulipe': {
      const tu = { x: 165, y: SOL - 120, w: 54, per: 3.2, ph: 0, c: 0 };
      dessinerTulipe(c, tu, u); dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      const ph = (u % 3.2) / 3.2;
      pap = ph < 0.2 ? chemin([[40, SOL - 133], [165, SOL - 150]], ph / 0.2) : ph < 0.5 ? { x: 165, y: SOL - 133 } : chemin([[165, SOL - 133], [230, SOL - 190], [290, SOL - 143]], Math.min(1, (ph - 0.5) / 0.3));
      break;
    }
    case 'toile': {
      dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      dessinerToile(c, { x: 165, y: SOL - 150, r: 34, araignee: true, ph: 0 }, u);
      pap = chemin([[40, SOL - 133], [110, SOL - 80], [220, SOL - 80], [290, SOL - 143], [290, SOL - 143]], p8);
      break;
    }
    case 'pissenlit': {
      dessinerFleur(c, f1, u);
      const pis = { x: 165, y: SOL - 120, actif: p8 < 0.45, tr: 0, ph: 0 };
      dessinerPissenlit(c, pis, u);
      pap = chemin([[40, SOL - 133], [165, SOL - 120], [230, SOL - 205], [300, SOL - 180]], p8);
      break;
    }
    case 'lezard': {
      const s = { x: 165, y: SOL - 70, w: 96 };
      dessinerPierre(c, s);
      const ph = p8;
      dessinerLezard(c, { x: 183, y: SOL - 79, etat: ph > 0.3 && ph < 0.5 ? 'langue' : 'repos', t: (ph - 0.3) * 3.2, cote: 1, portee: 110 }, u);
      dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      pap = chemin([[40, SOL - 133], [165, SOL - 200], [290, SOL - 143], [290, SOL - 143]], p8);
      break;
    }
    case 'libellule': {
      dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      const a = u * 2;
      dessinerLibellule(c, 165 + 60 * Math.sin(a), SOL - 140 + 40 * Math.sin(2 * a), Math.cos(a), u);
      pap = chemin([[40, SOL - 133], [100, SOL - 200], [230, SOL - 205], [290, SOL - 143], [290, SOL - 143]], p8);
      break;
    }
    case 'champignon': {
      const cc = { x: 165, y: SOL - 64, w: 80, ec: p8 > 0.3 && p8 < 0.4 ? 1 - (p8 - 0.3) * 10 : 0 };
      dessinerChampi(c, cc);
      pap = chemin([[40, SOL - 150], [165, SOL - 77], [200, SOL - 205], [260, SOL - 130], [300, SOL - 60]], p8);
      dessinerPollen(c, 200, SOL - 195, u, true);
      break;
    }
    case 'poisson': case 'feuille': {
      if (k === 'feuille') dessinerFeuille(c, { x: 165 + 50 * Math.sin(u * 1.5), y: SOL - 11, w: 76 });
      const ph = (u % 3) / 3;
      const f = { x: 230, per: 3, h: 150, ph: 0, saute: ph * 3 >= 0.7 && ph * 3 < 1.8 };
      if (f.saute) { const v = (ph * 3 - 0.7) / 1.1; f.fx = 160 + 140 * v; f.fy = SOL - 6 - 4 * 150 * v * (1 - v); }
      dessinerPoisson(c, f, u % 3);
      dessinerFleur(c, f1, u);
      pap = k === 'feuille' ? chemin([[40, SOL - 133], [120, SOL - 120], [165 + 50 * Math.sin(u * 1.5), SOL - 24]], Math.min(1, p8 * 1.6)) : chemin([[40, SOL - 133], [110, SOL - 175], [130, SOL - 190], [130, SOL - 190]], p8);
      break;
    }
    case 'pluie': {
      dessinerAbri(c, { x: 200, y: SOL - 150, w: 136 });
      dessinerFleur(c, { x: 200, y: SOL - 60, w: 58, c: 4, g: 0 }, u);
      c.strokeStyle = 'rgba(220,235,255,.9)'; c.lineWidth = 2;
      for (let i = 0; i < 26; i++) { const x = (i * 37) % 330, y = SOL - 210 + ((u * 300 + i * 53) % 210); if (Math.abs(x - 200) < 68 && y > SOL - 150) continue; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 2, y - 10); c.stroke(); }
      pap = chemin([[40, SOL - 160], [120, SOL - 100], [200, SOL - 73], [200, SOL - 73]], p8);
      break;
    }
    case 'chauve': {
      dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      const bx = 165 + 90 * Math.sin(u * 1.4);
      dessinerChauve(c, bx, SOL - 170 + 20 * Math.sin(u * 5), u);
      dessinerLuciole(c, { x: 165, y: SOL - 110, ph: 0 }, u);
      pap = chemin([[40, SOL - 133], [165, SOL - 105], [290, SOL - 143], [290, SOL - 143]], p8);
      break;
    }
    case 'mante': {
      dessinerFleur(c, { x: 60, y: SOL - 90, w: 58, c: 1, g: 0 }, u); dessinerFleur(c, { x: 280, y: SOL - 180, w: 58, c: 2, g: 1 }, u);
      const ph = p8;
      const h = ph > 0.3 && ph < 0.6 ? Math.sin((ph - 0.3) / 0.3 * Math.PI) * 120 : 0;
      dessinerMante(c, { x: 165, h, etat: 'frappe' }, u); dessinerTouffe(c, 165, u, ph > 0.2 && ph < 0.3);
      pap = chemin([[60, SOL - 103], [150, SOL - 200], [280, SOL - 193], [280, SOL - 193]], p8);
      break;
    }
    case 'herisson': {
      dessinerFleur(c, f1, u); dessinerFleur(c, f2, u);
      dessinerHerisson(c, { x: 165 + 70 * Math.sin(u), dir: Math.cos(u) >= 0 ? 1 : -1, dy: 0 }, u);
      pap = chemin([[40, SOL - 133], [165, SOL - 180], [290, SOL - 143], [290, SOL - 143]], p8);
      break;
    }
    default: break;
  }
  if (pap) dessinerPapillon(c, pap.x, pap.y, progres.aile, ouv != null ? ouv : 0.2 + 0.8 * Math.abs(Math.cos(u * 14)), 0.72, 0, u);
}

// ---------- Pause ----------
let modeAvantPause = 'jeu';
function mettrePause() {
  if (mode !== 'jeu' && mode !== 'carte') return;
  modeAvantPause = mode; mode = 'pause';
  touches.g = touches.d = touches.h = false; doigts.clear();
  montrer('pause');
  $('pause-niveau').textContent = tr('niveau.numero', { n: L.n }) + ' · ' + tr('niv.' + L.n);
  $('b-reprendre').focus();
}
function reprendre() {
  Son.clic();
  if (modeAvantPause === 'carte') ouvrirCarte(); else { mode = 'jeu'; montrer(null); }
}
$('b-pause').addEventListener('click', (e) => { e.stopPropagation(); Son.clic(); mettrePause(); });
$('b-reprendre').addEventListener('click', reprendre);
$('b-recommencer').addEventListener('click', () => { Son.clic(); lancerNiveau(L.n); });
$('b-accueil').addEventListener('click', () => { Son.clic(); afficherTitre(); });

// ---------- HUD ----------
const hudAvant = {};
function majHud(force) {
  if (!P) return;
  const e = Math.round(P.energie * 10) / 10;
  if (force || hudAvant.c !== P.coeurs) {
    hudAvant.c = P.coeurs;
    $('coeurs').innerHTML = [0, 1, 2].map((i) => SVG_COEUR(i < P.coeurs)).join('');
    $('coeurs').setAttribute('aria-label', tr('hud.coeurs', { n: P.coeurs }));
  }
  if (force || hudAvant.e !== e) {
    hudAvant.e = e;
    const j = $('jauge-forces'); j.style.width = (100 * P.energie / ENERGIE_MAX) + '%';
    j.classList.toggle('basse', P.energie < 3);
    $('forces').setAttribute('aria-label', tr('hud.forces', { n: Math.floor(P.energie) }));
  }
  if (force || hudAvant.p !== P.pollen) { hudAvant.p = P.pollen; $('nb-pollen').textContent = nb(P.pollen); $('pastille-pollen').setAttribute('aria-label', tr('hud.pollen', { n: P.pollen })); }
  if (force || hudAvant.d !== P.dores) {
    hudAvant.d = P.dores;
    [...$('dores').children].forEach((s, i) => s.classList.toggle('pris', i < P.dores));
    $('dores').setAttribute('aria-label', tr('hud.dores', { n: P.dores }));
  }
  const pr = Math.max(0, Math.min(1, (P.x - L.depart.x) / (L.finX - L.depart.x)));
  $('prog-barre').style.width = (pr * 100) + '%';
  $('prog-pap').style.left = (pr * 100) + '%';
  const dir = directionTenue();
  $('fl-g').classList.toggle('actif', dir === -1);
  $('fl-d').classList.toggle('actif', dir === 1);
}

// ---------- Fin de niveau ----------
let compteur = { val: 0, cible: 0 };
function finNiveau() {
  mode = 'fin';
  touches.g = touches.d = touches.h = false; doigts.clear();
  const n = L.n, i = n - 1;
  const bonus = victoire ? Math.max(0, Math.round((L.finX / 115 - tempsNiveau) * 5)) : 0;
  const score = P.pollen * 10 + P.dores * 100 + (victoire ? P.coeurs * 100 + bonus : 0);
  const etoiles = victoire ? 1 + (P.dores >= 3 ? 1 : 0) + (P.touches === 0 ? 1 : 0) : 0;
  const ancienRecord = progres.records[i];
  const record = score > ancienRecord && victoire;
  const etoilesAvant = totalEtoiles();
  if (victoire) {
    progres.etoiles[i] = Math.max(progres.etoiles[i], etoiles);
    if (record) progres.records[i] = score;
    progres.max = Math.max(progres.max, Math.min(NIVEAUX.length, n + 1));
    niveauReprise = Math.min(NIVEAUX.length, n + 1);
    garderProgres();
    try { JEL_SAVE.save(JEU, { niveau: niveauReprise, score: totalScore(), options: optionsSauvegarde() }); } catch (e) { /* rien */ }
  }
  if (victoire && n === NIVEAUX.length) { afficherBilan(); return; }
  montrer('fin');
  $('fin-titre').textContent = victoire ? tr('fin.bravo') : tr('fin.perdu');
  $('fin-nom').textContent = tr('niveau.numero', { n }) + ' · ' + tr('niv.' + n);
  $('fin-etoiles').innerHTML = [0, 1, 2].map((k) => SVG_ETOILE(k < etoiles)).join('');
  [...$('fin-etoiles').children].forEach((s, k) => setTimeout(() => { s.classList.add('vue'); if (k < etoiles) Son.etoile(k); }, 250 + k * 320));
  const lignes = [
    [tr('fin.pollen'), nb(P.pollen)],
    [tr('fin.dores'), tr('fin.sur3', { n: P.dores })],
    [tr('fin.coeurs'), tr('fin.sur3', { n: victoire ? P.coeurs : 0 })],
  ];
  if (victoire) lignes.push([tr('fin.bonus'), nb(bonus)]);
  $('fin-lignes').innerHTML = '';
  lignes.forEach(([a, b]) => { const p = document.createElement('p'); const s1 = document.createElement('span'); s1.textContent = a; const s2 = document.createElement('strong'); s2.textContent = b; p.append(s1, s2); $('fin-lignes').appendChild(p); });
  if (!victoire) { const p = document.createElement('p'); p.textContent = tr('fin.conseil'); $('fin-lignes').appendChild(p); }
  compteur = { val: 0, cible: score };
  $('fin-score').textContent = tr('fin.score', { n: nb(0) });
  const fr = $('fin-record');
  fr.classList.toggle('nouveau', record);
  fr.textContent = record ? tr('fin.record') : (ancienRecord > 0 ? tr('fin.ancien', { n: nb(ancienRecord) }) : '');
  const nouvelles = AILES.filter((A) => A.seuil > etoilesAvant && A.seuil <= totalEtoiles()).length;
  $('fin-ailes').hidden = !nouvelles;
  $('fin-ailes').textContent = nouvelles ? tr('fin.ailes') : '';
  $('b-suivant').hidden = !victoire;
  $('b-reessayer').hidden = victoire;
  $('b-rejouer').hidden = !victoire;
  setTimeout(() => { (victoire ? $('b-suivant') : $('b-reessayer')).focus(); }, 50);
}
function animerCompteur(dt) {
  if (compteur.val >= compteur.cible) return;
  compteur.val = Math.min(compteur.cible, compteur.val + Math.max(5, compteur.cible * 1.2 * dt));
  $('fin-score').textContent = tr('fin.score', { n: nb(Math.round(compteur.val)) });
}
$('b-suivant').addEventListener('click', () => { Son.clic(); lancerNiveau(Math.min(NIVEAUX.length, L.n + 1)); });
$('b-reessayer').addEventListener('click', () => { Son.clic(); lancerNiveau(L.n); });
$('b-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(L.n); });
$('b-fin-niveaux').addEventListener('click', () => { Son.clic(); afficherNiveaux(); });

function afficherBilan() {
  mode = 'fin'; montrer('bilan'); compteur = { val: 0, cible: 0 };
  $('hud').hidden = true; $('fleches').hidden = true;
  const l = $('bilan-lignes'); l.innerHTML = '';
  const debloquees = AILES.filter((A) => totalEtoiles() >= A.seuil).length;
  [[tr('bilan.etoiles'), tr('total.etoiles', { n: totalEtoiles(), max: NIVEAUX.length * 3 })], [tr('bilan.score'), nb(totalScore())], [tr('bilan.ailes'), tr('bilan.ailesNb', { n: debloquees, max: AILES.length })]].forEach(([a, b]) => {
    const p = document.createElement('p'); const s1 = document.createElement('span'); s1.textContent = a; const s2 = document.createElement('strong'); s2.textContent = b; p.append(s1, s2); l.appendChild(p);
  });
  for (let i = 0; i < 80; i++) particules.push({ x: Math.random() * 2000, y: SOL - 500, vx: (Math.random() - 0.5) * 200, vy: Math.random() * 100, vie: 3, max: 3, type: 'confetti', c: ['#ff5c8a', '#ffd23f', '#5b8cff', '#7ee08a'][i % 4], g: 1 });
  setTimeout(() => $('b-bilan-rejouer').focus(), 50);
}
$('b-bilan-rejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(NIVEAUX.length); });
$('b-bilan-niveaux').addEventListener('click', () => { Son.clic(); afficherNiveaux(); });
$('b-bilan-accueil').addEventListener('click', () => { Son.clic(); afficherTitre(); });

// ---------- Sauvegarde à la fermeture (seulement pendant une partie) ----------
JEL_SAVE.surFermeture(() => {
  if (enPartie && L) JEL_SAVE.save(JEU, { niveau: niveauReprise, score: totalScore(), options: optionsSauvegarde() });
});

// ---------- Démarrage ----------
document.title = tr('titre');
chargerProgres();
majBoutonsSon();
redimensionner();
afficherTitre();
(function animerDemo() { if (mode === 'carte' || (mode === 'pause' && modeAvantPause === 'carte')) dessinerDemo(); requestAnimationFrame(animerDemo); })();
requestAnimationFrame(boucle);
</script>
