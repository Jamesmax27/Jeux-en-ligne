<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

  #prog-fin { position: absolute; right: -4px; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 50%; background: radial-gradient(circle, #6b3f1d 30%, #ffd23f 35%); border: 2px solid #fff; }

  #fleches { position: absolute; left: 0; right: 0; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; justify-content: space-between; padding: 0 14px; pointer-events: none; z-index: 4; }
  #fleches div { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.28); display: flex; align-items: center; justify-content: center; }
  #fleches svg { width: 30px; height: 30px; opacity: .8; }

  #bulle { position: absolute; left: 50%; top: 100px; transform: translateX(-50%); background: #fffaf2; color: #5b2a86; font-weight: 800; padding: 8px 16px; border-radius: 999px; box-shadow: 0 6px 16px rgba(40,20,70,.25); z-index: 6; pointer-events: none; font-size: 17px; text-align: center; max-width: 90vw; }
  #banniere { position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); text-align: center; z-index: 6; pointer-events: none; color: #fff; text-shadow: 0 3px 8px rgba(60,20,80,.55); animation: ban 2.4s ease forwards; width: 92vw; }
  #banniere span { display: block; font-size: 20px; font-weight: 800; }

  @keyframes ban { 0% { opacity: 0; transform: translate(-50%, -40%); } 15%, 75% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -60%); } }

  /* Carte (tutoriel, nouveauté) */
  #carte .boite { cursor: pointer; }
  #demo { width: 100%; max-width: 330px; aspect-ratio: 3 / 2; border-radius: 18px; display: block; margin: 0 auto 10px; background: #bfe6ff; }

  .points span { width: 10px; height: 10px; border-radius: 50%; background: #d8cbe9; }
  .points span.on { background: #ff8a3d; }
  .indice { font-size: 15px !important; color: #7a6a93; font-weight: 700; animation: clign 1.4s infinite; }
  @keyframes clign { 50% { opacity: .45; } }

  /* Fin de niveau */

  .lignes { text-align: left; background: #f3ebff; border-radius: 16px; padding: 8px 14px; margin: 8px 0; }

  .score-fin { font-size: 28px !important; font-weight: 900; color: #ff7b39; }
  .record { color: #e0457b; font-weight: 900; }

<script>
// ==========================================================================
// Vol papillon — jeu de plateforme : un papillon vole de fleur en fleur à
// travers la campagne en évitant les animaux qui aiment croquer les papillons.
// Tout le texte passe par JEL_I18N.t ; la progression par JEL_SAVE.
// ==========================================================================
'use strict';
const JEU = 'vol-papillon';
const I = window.JEL_I18N;
const tr = (cle, vars) => I.t(cle, vars);
const nb = (x) => I.nombre(x);

// ---------- Réglages du monde (unités du monde, pas des pixels) ----------
const H = 700;            // hauteur du monde
const SOL = 640;          // niveau du sol
const PLAFOND = 150;      // le papillon ne monte pas plus haut
const R = 13;             // rayon de contact du papillon (indulgent)
const GRAV = 620;         // pesanteur
const CHUTE_MAX = 125;    // vitesse de chute en planant
const BAT_VY = -250;      // élan vertical d'un battement
const BAT_VX = 115;       // élan horizontal d'un battement
const VX_MAX = 215;
const FROTTEMENT = 0.35;  // ralentissement dans l'air
const CADENCE = 0.28;     // battements répétés quand on garde le doigt
const ENERGIE_MAX = 12;   // forces : nombre de battements possibles
const INVINCIBLE = 1.6;   // secondes de clignotement après un choc

// ---------- Motifs d'ailes à débloquer (seuil = étoiles) ----------
const AILES = [
  { a: '#ffc15e', b: '#ff7b39', bord: '#5a2d0c', pts: '#fff3c4', seuil: 0 },
  { a: '#a9ddff', b: '#4a90e2', bord: '#1d3b6b', pts: '#ffffff', seuil: 5 },
  { a: '#fff59d', b: '#ffd54f', bord: '#8d6e00', pts: '#ffffff', seuil: 10 },
  { a: '#ffc4e1', b: '#ff6fb5', bord: '#7a1f52', pts: '#ffffff', seuil: 18 },
  { a: '#b8f5d4', b: '#3fcf8e', bord: '#105c3a', pts: '#fffde0', seuil: 26 },
  { a: '#9d8cff', b: '#3b2f9e', bord: '#160f45', pts: '#ffe97a', seuil: 36 },
  { a: '#ff8a80', b: '#82b1ff', bord: '#4a2a6b', pts: '#fff59d', seuil: 48, arc: true },
  { a: '#fff3b0', b: '#ffb300', bord: '#7a4b00', pts: '#ffffff', seuil: 60, brille: true },
];

// ---------- Les 24 niveaux : suites de tronçons [modèle, difficulté, options] ----------
const NIVEAUX = [
  { decor: 'matin', segs: [['pre', 0], ['pre', 0], ['pre', 1]] },
  { decor: 'matin', segs: [['pre', 0], ['ron', 0], ['pre', 1], ['ron', 1]] },
  { decor: 'jour', segs: [['pre', 0], ['mare', 0], ['pre', 1], ['mare', 1], ['ron', 0]] },
  { decor: 'jour', segs: [['pre', 0], ['vent', 0, { dir: 1 }], ['ron', 0], ['vent', 1, { dir: -1 }], ['mare', 0]] },
  { decor: 'jour', segs: [['pre', 0], ['ois', 0], ['ron', 1], ['ois', 1], ['mare', 1]] },
  { decor: 'jour', segs: [['pre', 0], ['tul', 0], ['ois', 0], ['tul', 1], ['vent', 1, { dir: 1 }], ['ron', 1]] },
  { decor: 'matin', segs: [['pre', 0], ['toile', 0], ['mare', 1], ['toile', 1], ['tul', 1]] },
  { decor: 'jour', segs: [['pre', 0], ['pis', 0], ['toile', 1], ['ois', 1], ['pis', 1]] },
  { decor: 'soir', segs: [['pre', 0], ['lez', 0], ['ron', 1], ['lez', 1], ['pis', 1], ['mare', 2]] },
  { decor: 'jour', segs: [['pre', 1], ['mare', 2], ['ois', 2], ['toile', 2], ['vent', 2, { dir: -1 }], ['lez', 1], ['ron', 2]] },
  { decor: 'matin', segs: [['pre', 0], ['lib', 0], ['tul', 1], ['lib', 1], ['mare', 1]] },
  { decor: 'jour', segs: [['pre', 0], ['cha', 0], ['lib', 1], ['cha', 1], ['ois', 2], ['toile', 1]] },
  { decor: 'jour', segs: [['pre', 0], ['ruis', 0], ['lez', 1], ['ruis', 1], ['cha', 1]] },
  { decor: 'soir', segs: [['pre', 0], ['ruis', 1, { feuilles: true }], ['vent', 1, { dir: -1 }], ['ruis', 2, { feuilles: true }], ['lib', 2]] },
  { decor: 'pluie', segs: [['pre', 0], ['pluie', 0], ['cha', 1], ['pluie', 1], ['ois', 1]] },
  { decor: 'pluie', segs: [['pre', 0], ['pluie', 1], ['ruis', 2, { feuilles: true }], ['lib', 2], ['pluie', 2], ['toile', 2]] },
  { decor: 'nuit', segs: [['pre', 0], ['cs', 0], ['mare', 1], ['cs', 1], ['toile', 1]] },
  { decor: 'nuit', segs: [['pre', 0], ['cs', 1], ['mare', 2], ['toile', 2], ['cs', 2], ['pis', 1]] },
  { decor: 'soir', segs: [['pre', 0], ['man', 0], ['lez', 2], ['man', 1], ['tul', 2], ['ois', 2]] },
  { decor: 'jour', segs: [['pre', 0], ['vent', 2, { dir: 1, fy: -150 }], ['man', 2], ['vent', 3, { dir: -1, fy: 110 }], ['ois', 3], ['ron', 3]] },
  { decor: 'matin', segs: [['pre', 0], ['lez', 2], ['lib', 2], ['cha', 2], ['pis', 2], ['lib', 3], ['man', 1]] },
  { decor: 'orage', segs: [['pre', 0], ['pluie', 2], ['vent', 2, { dir: -1 }], ['ois', 3, { deuxSens: true }], ['pluie', 3], ['ruis', 2, { feuilles: true }], ['cha', 2]] },
  { decor: 'nuit', segs: [['pre', 0], ['her', 0], ['cs', 2], ['man', 2], ['her', 1], ['ruis', 3, { feuilles: true }], ['cs', 3], ['toile', 3]] },
  { decor: 'soir', segs: [['pre', 0], ['ron', 2], ['mare', 3], ['ois', 3, { deuxSens: true }], ['tul', 3], ['toile', 3], ['pis', 2], ['lez', 3], ['lib', 3], ['cha', 3], ['ruis', 3, { feuilles: true }], ['pluie', 3], ['man', 3], ['her', 2]] },
];
window.JEL_NIVEAUX = NIVEAUX.length;

// Ordre de présentation des nouveautés (cartes animées à leur premier niveau).
const NOUVEAUTES = ['ronces', 'grenouille', 'vent', 'oiseau', 'tulipe', 'toile', 'pissenlit', 'lezard', 'libellule', 'champignon', 'poisson', 'feuille', 'pluie', 'chauve', 'mante', 'courant', 'oiseau2', 'herisson'];

// Petit tirage pseudo-aléatoire reproductible (mêmes niveaux à chaque partie).
function alea(graine) {
  let a = graine >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Construction d'un niveau ----------
function nouveauNiveau(n, decor) {
  return {
    n, decor, r: alea(n * 7919 + 13), nf: 0, t: 0,
    fleurs: [], appuis: [], pollens: [], dores: [], sols: [], nenuphars: [], grenouilles: [], vents: [],
    oiseaux: [], tulipes: [], toiles: [], pissenlits: [], pierres: [], lezards: [], libellules: [],
    champis: [], poissons: [], feuilles: [], pluies: [], abris: [], chauves: [], mantes: [], herissons: [],
    lucioles: [], coeurs: [], risques: [], herbes: [], gouttes: [], types: new Set(),
  };
}
function fleur(L, x, h, c) {
  const f = { x, y: SOL - h, w: 58, c: c == null ? (L.nf++ % 6) : c, g: L.r() * 6.28 };
  L.fleurs.push(f); L.appuis.push({ x, y: f.y });
  return f;
}
function sol(L, a, b, type) { L.sols.push({ a, b, type }); if (type === 'ronces') L.types.add('ronces'); }
function nenuphar(L, x, appui) {
  const p = { x, y: SOL - 12, w: 62, appui };
  L.nenuphars.push(p);
  if (appui) L.appuis.push({ x, y: p.y });
}

// Modèles de tronçons : (niveau, x de départ, difficulté 0-3, options, petit décalage) → x de fin.
const MODELES = {
  // Prairie tranquille : trois fleurs.
  pre(L, x, d, o, j) {
    const hs = [150, 215, 145];
    for (let i = 0; i < 3; i++) fleur(L, x + 110 + i * 200 + j(18), hs[i] + j(15 + d * 25));
    L.risques.push({ x: x + 210, y: SOL - 330 - d * 20 });
    return x + 640;
  },
  // Roncier : le sol pique.
  ron(L, x, d, o, j) {
    const w = 720 + 120 * d;
    sol(L, x + 30, x + w - 30, 'ronces');
    const n = d >= 2 ? 2 : 3, e = (w - 60) / (n + 1);
    for (let i = 0; i < n; i++) fleur(L, x + 30 + e * (i + 1) + j(15), 170 + j(25) + (i % 2) * 45);
    L.risques.push({ x: x + 30 + e * 0.5, y: SOL - 78 });
    return x + w;
  },
  // Mare : nénuphars et grenouilles.
  mare(L, x, d, o, j) {
    const w = 780 + 110 * d, a = x + 60, b = x + w - 60, lw = b - a;
    sol(L, a, b, 'eau'); L.types.add('grenouille');
    fleur(L, x + 25, 185 + j(15));
    const pads = d >= 2 ? (d >= 3 ? [0.12, 0.88] : [0.15, 0.85]) : [0.2, 0.5, 0.8];
    const gr = [[0.35], [0.35, 0.65], [0.32, 0.68], [0.3, 0.4, 0.6, 0.7]][Math.min(d, 3)];
    pads.forEach((p) => nenuphar(L, a + lw * p, true));
    if (d >= 2) fleur(L, a + lw * 0.5, 280 + (d - 2) * 20);
    gr.forEach((p) => {
      nenuphar(L, a + lw * p, false);
      L.grenouilles.push({ x: a + lw * p, y: SOL - 18, etat: 'repos', t: 0, cool: 0.5, dy: 0, vy: 0 });
    });
    L.risques.push({ x: a + lw * gr[0], y: SOL - 175 });
    return x + w;
  },
  // Rafales (o.dir : 1 vent arrière, -1 vent de face ; o.fy : courant vertical).
  vent(L, x, d, o, j) {
    const w = 840, dir = o.dir || 1;
    L.vents.push({ a: x, b: x + w, fx: dir * (100 + 35 * d), fy: o.fy || 0 });
    L.types.add(o.fy ? 'courant' : 'vent');
    const e = dir < 0 ? 210 : 260;
    const hs = o.fy > 0 ? [150, 170, 140] : [180, 240, 160];
    for (let i = 0; i < 3; i++) fleur(L, x + 120 + i * e + j(15), hs[i] + j(20));
    L.risques.push({ x: x + w / 2, y: SOL - (o.fy > 0 ? 300 : 400) });
    return x + w;
  },
  // Mésanges qui traversent (o.deuxSens : certaines arrivent par-derrière).
  ois(L, x, d, o, j) {
    const w = 840 + 100 * d;
    if (d >= 2) sol(L, x + 30, x + w - 30, 'ronces');
    const e = (w - 60) / 4;
    for (let i = 0; i < 3; i++) fleur(L, x + 30 + e * (i + 1) + j(15), [160, 210, 150][i] + j(18));
    const alt = [SOL - 320, SOL - 200, SOL - 400, SOL - 265];
    const k = 1 + d;
    for (let i = 0; i < k; i++) {
      L.oiseaux.push({ trig: x + w * (i + 0.6) / (k + 0.2), y: alt[i % 4] + j(15), dir: o.deuxSens && i % 2 === 1 ? 1 : -1, etat: 'attente', t: 0, x: 0, v: 230 + 20 * d });
    }
    L.types.add('oiseau'); if (o.deuxSens) L.types.add('oiseau2');
    L.risques.push({ x: x + w * 0.6 / (k + 0.2), y: alt[0] + 10 });
    return x + w;
  },
  // Tulipes qui se ferment au-dessus des ronces.
  tul(L, x, d, o, j) {
    const w = 820;
    sol(L, x + 30, x + w - 30, 'ronces'); L.types.add('tulipe');
    const per = 4.6 - 0.45 * d;
    [160, 410, 660].forEach((dx, i) => {
      if (d === 0 && i === 1) { fleur(L, x + dx, 190); return; }
      const tu = { x: x + dx + j(10), y: SOL - [190, 160, 215][i] - j(12), w: 54, per, ph: i * 1.4 + L.r() * 0.5, ouvert: true, c: i % 3 };
      L.tulipes.push(tu); L.appuis.push({ x: tu.x, y: tu.y });
    });
    L.risques.push({ x: x + 285, y: SOL - 75 });
    return x + w;
  },
  // Toiles d'araignée (et araignées dès la difficulté 1).
  toile(L, x, d, o, j) {
    const w = 840;
    fleur(L, x + 120, 160 + j(12)); fleur(L, x + 420, 235 + j(12)); fleur(L, x + 720, 170 + j(12));
    const tt = [[270, SOL - 250, 40], [570, SOL - 215, 42], [420, SOL - 390, 36], [270, SOL - 110, 34]];
    const k = Math.min(4, 2 + d);
    for (let i = 0; i < k; i++) L.toiles.push({ x: x + tt[i][0], y: tt[i][1], r: tt[i][2], araignee: d >= 1 && i < d, ph: L.r() * 6 });
    L.types.add('toile');
    L.risques.push({ x: x + 270, y: SOL - 330 });
    return x + w;
  },
  // Champ de pissenlits au-dessus d'un long roncier.
  pis(L, x, d, o, j) {
    const w = 980 + 150 * d;
    sol(L, x + 40, x + w - 40, 'ronces'); L.types.add('pissenlit');
    const k = 3 + d, e = (w - 80) / (k + 1);
    for (let i = 0; i < k; i++) {
      const p = { x: x + 40 + e * (i + 1), y: SOL - (i % 2 ? 330 : 230) + j(15), actif: true, tr: 0, ph: L.r() * 6 };
      L.pissenlits.push(p); L.appuis.push({ x: p.x, y: p.y });
    }
    if (d === 0) fleur(L, x + 40 + e * 2.5, 200);
    L.risques.push({ x: x + 40 + e * 1.5, y: SOL - 440 });
    return x + w;
  },
  // Pierres chaudes et lézards.
  lez(L, x, d, o, j) {
    const w = 840; L.types.add('lezard');
    [[240, 110 + 20 * d], [580, 150]].forEach(([dx, h], i) => {
      const p = { x: x + dx, y: SOL - h, w: 96 };
      L.pierres.push(p); L.appuis.push({ x: p.x, y: p.y });
      if (i === 0 || d >= 1) L.lezards.push({ x: p.x + (i ? -18 : 18), y: p.y - 9, etat: 'repos', t: 0, cool: 0.5, cote: i ? -1 : 1, portee: 150 + 20 * d });
    });
    fleur(L, x + 80, 175 + j(12)); fleur(L, x + 410, 215 + j(12)); fleur(L, x + 750, 230 + j(12));
    L.risques.push({ x: x + 240, y: SOL - 110 - 20 * d - 80 });
    return x + w;
  },
  // Libellules qui tournent en huit.
  lib(L, x, d, o, j) {
    const w = 840; L.types.add('libellule');
    fleur(L, x + 100, 180 + j(12)); fleur(L, x + 420, 235 + j(12)); fleur(L, x + 740, 175 + j(12));
    const c = [[260, SOL - 300, 70, 55], [580, SOL - 260, 80, 65], [420, SOL - 440, 130, 40], [260, SOL - 140, 50, 35]];
    const k = Math.min(4, 1 + d);
    for (let i = 0; i < k; i++) L.libellules.push({ cx: x + c[i][0], cy: c[i][1], ax: c[i][2], ay: c[i][3], v: 1.4 + 0.2 * d + i * 0.15, ph: L.r() * 6, x: 0, y: 0 });
    L.risques.push({ x: x + 260, y: SOL - 300 });
    return x + w;
  },
  // Champignons rebondissants au-dessus des ronces.
  cha(L, x, d, o, j) {
    const w = 800; sol(L, x + 30, x + w - 30, 'ronces'); L.types.add('champignon');
    [150, 400, 650].forEach((dx) => { const c = { x: x + dx + j(10), y: SOL - 64, w: 80, ec: 0 }; L.champis.push(c); L.appuis.push({ x: c.x, y: c.y }); });
    if (d >= 1) fleur(L, x + 525, 330);
    L.risques.push({ x: x + 400, y: SOL - 340 });
    return x + w;
  },
  // Ruisseau : poissons sauteurs, nénuphars ou feuilles flottantes.
  ruis(L, x, d, o, j) {
    const w = 820 + 100 * d, a = x + 50, b = x + w - 50, lw = b - a;
    sol(L, a, b, 'eau'); L.types.add('poisson');
    fleur(L, x + 20, 190 + j(12));
    if (o.feuilles) {
      L.types.add('feuille');
      [0.28, 0.72].forEach((p, i) => { const f = { x0: a + lw * p, amp: 60 + 15 * d, ph: i * 2.2, w: 76, x: a + lw * p, px: a + lw * p, y: SOL - 11 }; L.feuilles.push(f); L.appuis.push({ x: f.x0, y: f.y }); });
    } else [0.3, 0.7].forEach((p) => nenuphar(L, a + lw * p, true));
    const pp = [0.5, 0.15, 0.85, 0.36];
    for (let i = 0; i < Math.min(4, 1 + d); i++) L.poissons.push({ x: a + lw * pp[i], per: 3.4 - 0.3 * d + i * 0.25, h: 200 + 30 * d, ph: L.r() * 3, fx: 0, fy: 0, saute: false });
    L.risques.push({ x: a + lw * 0.5, y: SOL - 165 });
    return x + w;
  },
  // Averse : gouttes et abris (grande feuille + petite fleur au sec dessous).
  pluie(L, x, d, o, j) {
    const w = 900; L.types.add('pluie');
    L.pluies.push({ a: x, b: x + w, k: 1 + 0.6 * d });
    [[230, 200], [600, 215]].forEach(([dx, h]) => {
      L.abris.push({ x: x + dx, y: SOL - h, w: 136 });
      fleur(L, x + dx, h - 95, 4);
    });
    fleur(L, x + 415, 240 + j(12));
    if (d === 0) fleur(L, x + 790, 170);
    L.risques.push({ x: x + 415, y: SOL - 360 });
    return x + w;
  },
  // Chauves-souris (la nuit).
  cs(L, x, d, o, j) {
    const w = 840; L.types.add('chauve');
    fleur(L, x + 100, 170 + j(12)); fleur(L, x + 420, 215 + j(12)); fleur(L, x + 740, 165 + j(12));
    const c = [[160, SOL - 290, 260], [470, SOL - 300, 240], [300, SOL - 420, 320], [530, SOL - 120, 160]];
    for (let i = 0; i < Math.min(4, 1 + d); i++) L.chauves.push({ x0: x + c[i][0], w: c[i][2], y0: c[i][1], v: 110 + 20 * d, ph: L.r() * 6, x: 0, y: 0 });
    L.risques.push({ x: x + 290, y: SOL - 290 });
    return x + w;
  },
  // Mantes religieuses cachées dans les hautes herbes (certaines touffes sont vides).
  man(L, x, d, o, j) {
    const w = 820; L.types.add('mante');
    fleur(L, x + 80, 150 + j(10)); fleur(L, x + 330, 265); fleur(L, x + 580, 280); fleur(L, x + 770, 150 + j(10));
    const m = [210, 460, 680, 330];
    m.forEach((dx) => L.herbes.push(x + dx));
    for (let i = 0; i < Math.min(4, 1 + d); i++) L.mantes.push({ x: x + m[i], etat: 'repos', t: 0, cool: 0.4, h: 0 });
    L.risques.push({ x: x + 205, y: SOL - 125 });
    return x + w;
  },
  // Hérissons qui trottinent dans l'herbe (la nuit).
  her(L, x, d, o, j) {
    const w = 800; L.types.add('herisson');
    fleur(L, x + 100, 150 + j(10)); fleur(L, x + 400, 200 + j(10)); fleur(L, x + 700, 160 + j(10));
    const c = [[40, 360], [380, 760], [150, 650]];
    for (let i = 0; i < Math.min(3, 1 + d); i++) L.herissons.push({ a: x + c[i][0], b: x + c[i][1], x: x + c[i][0] + L.r() * 120, dir: i % 2 ? -1 : 1, v: 55 + 15 * d, dy: 0, vy: 0 });
    L.risques.push({ x: x + 250, y: SOL - 45 });
    return x + w;
  },
};

function construireNiveau(n) {
  const def = NIVEAUX[n - 1];
  const L = nouveauNiveau(n, def.decor);
  const j = (a) => (L.r() * 2 - 1) * a;
  fleur(L, 140, 170, 0);
  L.depart = { x: 140, y: SOL - 170 };
  let x = 300;
  for (const [nom, d, o] of def.segs) x = MODELES[nom](L, x, d || 0, o || {}, j);
  L.finX = x + 220;
  L.longueur = L.finX + 380;
  if (L.types.has('oiseau2')) L.types.delete('oiseau');
  // Lucioles la nuit, près d'un appui sur deux.
  if (def.decor === 'nuit') L.appuis.forEach((a, i) => { if (i % 2 === 1) L.lucioles.push({ x: a.x + 40, y: a.y - 105, actif: true, ph: L.r() * 6 }); });
  // Cœurs à ramasser dans les longs niveaux (au-dessus d'une fleur).
  const nbC = def.segs.length >= 9 ? 3 : def.segs.length >= 6 ? 1 : 0;
  const fl = L.fleurs.slice().sort((a, b) => a.x - b.x);
  for (let k = 1; k <= nbC; k++) { const f = fl[Math.floor(k * fl.length / (nbC + 1))]; L.coeurs.push({ x: f.x, y: f.y - 70, actif: true }); }
  placerPollen(L);
  // Trois pollens dorés, répartis parmi les endroits risqués.
  const nr = L.risques.length;
  for (let k = 0; k < 3; k++) {
    const q = L.risques[Math.min(nr - 1, Math.floor((k + 0.5) * nr / 3))];
    let y = Math.max(PLAFOND + 20, q.y);
    for (const w of L.toiles) if (Math.hypot(q.x - w.x, y - w.y) < w.r + 22) y = w.y - w.r - 34;
    L.dores.push({ x: q.x, y, pris: false, ph: k * 2 });
  }
  genererDecor(L);
  return L;
}

// Grains de pollen en arc entre deux appuis voisins (le chemin conseillé).
function placerPollen(L) {
  const ap = L.appuis.slice().sort((a, b) => a.x - b.x);
  ap.push({ x: L.finX - 20, y: SOL - 260 });
  for (let i = 1; i < ap.length; i++) {
    const p = ap[i - 1], q = ap[i], dx = q.x - p.x;
    if (dx < 70 || dx > 560) continue;
    const n = Math.floor(dx / 56), haut = 55 + dx * 0.08;
    for (let k = 1; k < n; k++) {
      const u = k / n;
      const y = Math.max(PLAFOND + 15, p.y + (q.y - p.y) * u - haut * 4 * u * (1 - u) - 18);
      L.pollens.push({ x: p.x + dx * u, y, pris: false });
    }
  }
  L.pollens = L.pollens.filter((g) => {
    if (g.y > SOL - 34) return false;
    for (const w of L.toiles) if (Math.hypot(g.x - w.x, g.y - w.y) < w.r + 14) return false;
    for (const s of L.pierres) if (Math.abs(g.x - s.x) < s.w / 2 + 6 && g.y > s.y - 8) return false;
    for (const a of L.abris) if (Math.abs(g.x - a.x) < a.w / 2 && Math.abs(g.y - a.y) < 22) return false;
    return true;
  });
}

// Décor de fond : collines, fermes, arbres, nuages, touffes d'herbe.
function genererDecor(L) {
  const r = alea(L.n * 131 + 7);
  const D = { loin: [], mid: [], nuages: [], touffes: [], fleurettes: [], ph: [r() * 6, r() * 6, r() * 6, r() * 6] };
  const typesLoin = ['ferme', 'arbre', 'meules', 'moulin', 'arbre', 'silo', 'arbre'];
  for (let x = 60; x < L.longueur * 0.3 + 1400; x += 220 + r() * 260) D.loin.push({ x, type: typesLoin[Math.floor(r() * typesLoin.length)], s: 0.8 + r() * 0.4 });
  const typesMid = ['arbre', 'haie', 'cloture', 'pommier', 'haie', 'arbre'];
  for (let x = 40; x < L.longueur * 0.55 + 1400; x += 160 + r() * 220) D.mid.push({ x, type: typesMid[Math.floor(r() * typesMid.length)], s: 0.8 + r() * 0.5 });
  for (let x = 0; x < L.longueur * 0.15 + 1600; x += 180 + r() * 240) D.nuages.push({ x, y: 120 + r() * 200, s: 0.7 + r() * 0.7 });
  for (let x = 10; x < L.longueur; x += 22 + r() * 30) D.touffes.push({ x, h: 8 + r() * 10 });
  for (let x = 30; x < L.longueur; x += 60 + r() * 90) D.fleurettes.push({ x, c: Math.floor(r() * 5) });
  L.deco = D;
}

function solEn(L, x) {
  for (const s of L.sols) if (x >= s.a && x <= s.b) return s.type;
  return 'herbe';
}

// Premier niveau de chaque nouveauté (pour les cartes animées).
const PREMIERE = {};
NIVEAUX.forEach((_, i) => { const L = construireNiveau(i + 1); L.types.forEach((ty) => { if (!(ty in PREMIERE)) PREMIERE[ty] = i + 1; }); });

<script>
// ==========================================================================
// Sons (Web Audio, aucun fichier), progression et sauvegarde.
// ==========================================================================
const Son = {
  ctx: null, actif: true, bruit: null,
  pret() {
    if (!this.actif) return null;
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; return null; }
    }
    if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { /* rien */ } }
    return this.ctx;
  },
  ton(f, d, type, v, f2, delai) {
    const c = this.pret(); if (!c) return;
    const t0 = c.currentTime + (delai || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t0);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v || 0.15, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + d + 0.05);
  },
  souffle(d, v, freq, delai) {
    const c = this.pret(); if (!c) return;
    if (!this.bruit) {
      this.bruit = c.createBuffer(1, c.sampleRate * 0.6, c.sampleRate);
      const data = this.bruit.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    const t0 = c.currentTime + (delai || 0);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.bruit; f.type = 'bandpass'; f.frequency.value = freq || 900; f.Q.value = 0.8;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v || 0.1, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t0); s.stop(t0 + d + 0.05);
  },
  battement() { this.souffle(0.12, 0.05, 700 + Math.random() * 300); },
  pollen() { this.ton(880 + Math.random() * 120, 0.12, 'sine', 0.08, 1500); },
  dore() { [660, 880, 1100, 1320].forEach((f, i) => this.ton(f, 0.22, 'triangle', 0.12, null, i * 0.07)); },
  pose() { this.ton(520, 0.12, 'sine', 0.06, 700); },
  aie() { this.ton(330, 0.3, 'square', 0.07, 120); this.souffle(0.2, 0.06, 400); },
  plouf() { this.souffle(0.35, 0.12, 500); this.ton(600, 0.3, 'sine', 0.08, 150); },
  boing() { this.ton(180, 0.3, 'sine', 0.14, 620); },
  pissenlit() { this.souffle(0.5, 0.08, 2200); this.ton(700, 0.4, 'sine', 0.05, 1200); },
  coa() { this.ton(140, 0.18, 'square', 0.05, 110); this.ton(130, 0.16, 'square', 0.05, 100, 0.2); },
  cuicui() { this.ton(2400, 0.08, 'sine', 0.05, 3200); this.ton(2600, 0.08, 'sine', 0.05, 3400, 0.12); },
  fatigue() { this.ton(220, 0.15, 'triangle', 0.07, 180); },
  lumiere() { this.ton(990, 0.3, 'sine', 0.06, 1980); },
  etoile(i) { this.ton(700 + i * 220, 0.3, 'triangle', 0.13, 1400 + i * 300); },
  victoire() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => this.ton(f, 0.28, 'triangle', 0.12, null, i * 0.12)); },
  defaite() { [440, 392, 330, 262].forEach((f, i) => this.ton(f, 0.35, 'sine', 0.1, null, i * 0.18)); },
  clic() { this.ton(600, 0.07, 'sine', 0.06, 800); },
};

// Progression (étoiles, records, ailes) : gardée dans les options de la
// sauvegarde du site (JEL_SAVE) et, si possible, dans localStorage.
const CLE_PROGRES = 'vol-papillon-progres';
const progres = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), aile: 0, son: true, max: 1 };
function fusionner(o) {
  if (!o || typeof o !== 'object') return;
  NIVEAUX.forEach((_, i) => {
    if (Array.isArray(o.etoiles)) progres.etoiles[i] = Math.max(progres.etoiles[i], Math.min(3, Number(o.etoiles[i]) || 0));
    if (Array.isArray(o.records)) progres.records[i] = Math.max(progres.records[i], Number(o.records[i]) || 0);
  });
  if (Number.isInteger(o.aile) && o.aile >= 0 && o.aile < AILES.length) progres.aile = o.aile;
  if (typeof o.son === 'boolean') progres.son = o.son;
  if (Number.isInteger(o.max)) progres.max = Math.max(progres.max, Math.min(NIVEAUX.length, o.max));
}
function chargerProgres() {
  try { const d = JEL_SAVE.load(JEU); if (d) { fusionner(d.options); if (Number.isInteger(d.niveau)) progres.max = Math.max(progres.max, Math.min(NIVEAUX.length, d.niveau)); } } catch (e) { /* rien */ }
  try { const s = localStorage.getItem(CLE_PROGRES); if (s) fusionner(JSON.parse(s)); } catch (e) { /* stockage indisponible */ }
  progres.etoiles.forEach((e, i) => { if (e > 0) progres.max = Math.max(progres.max, Math.min(NIVEAUX.length, i + 2)); });
  if (totalEtoiles() < AILES[progres.aile].seuil) progres.aile = 0;
  Son.actif = progres.son;
}
function optionsSauvegarde() {
  return { etoiles: progres.etoiles.slice(), records: progres.records.slice(), aile: progres.aile, son: progres.son, max: progres.max };
}
function garderProgres() {
  try { localStorage.setItem(CLE_PROGRES, JSON.stringify(optionsSauvegarde())); } catch (e) { /* stockage indisponible */ }
}
const totalEtoiles = () => progres.etoiles.reduce((a, b) => a + b, 0);
const totalScore = () => progres.records.reduce((a, b) => a + b, 0);

<script>
// ==========================================================================
// Moteur : état, entrées, physique, animaux, caméra, rendu.
// ==========================================================================
const cv = document.getElementById('ecran');

let VW = 0, VH = 0, DPR = 1, S = 1, vueW = 400, vueH = 700;
function redimensionner() {
  VW = cv.clientWidth || window.innerWidth; VH = cv.clientHeight || window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);

}
let nuitCv = null, nuitCtx = null;
try { nuitCv = document.createElement('canvas'); nuitCtx = nuitCv.getContext('2d'); } catch (e) { nuitCv = null; }
window.addEventListener('resize', redimensionner);

let mode = 'titre';           // titre, menu, jeu, carte, pause, fin
let L = null, P = null;       // niveau et papillon
let Lt = construireNiveau(1); // décor de l'écran titre
const cam = { x: 0, y: 0, sec: 0 };
let horloge = 0;
let particules = [];

let niveauReprise = 1;        // niveau où reprendre si la page se ferme
let fini = false, tFin = 0, victoire = false;

// ---------- Entrées ----------
const touches = { g: false, d: false, h: false };
const doigts = new Map();
function directionTenue() {
  let g = touches.g, d = touches.d;
  doigts.forEach((c) => { if (c < 0) g = true; else d = true; });
  if (g && !d) return -1;
  if (d && !g) return 1;
  if (g || d || touches.h) return 0;

}
function appuyer(dir) {

}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();

const lacher = (e) => { doigts.delete(e.pointerId); };

cv.addEventListener('pointercancel', lacher);

cv.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('keydown', (e) => {

    else if (c === 'Escape') { mettrePause(); e.preventDefault(); }

// ---------- Papillon ----------
function nouveauPapillon() {
  return { x: L.depart.x, y: L.depart.y - R, vx: 0, vy: 0, dir: 1, energie: ENERGIE_MAX, coeurs: 3, pose: { type: 'fleur', obj: L.fleurs[0], yPose: L.depart.y - R }, inv: 0, ph: 0, batt: 0, dernier: -1,

}
function battre(dir) {

    return;
  }
  P.energie -= 1;
  if (dir) P.dir = dir;

  P.vx += dir ? dir * BAT_VX : P.dir * 45;

  Son.battement();
  for (let i = 0; i < 3; i++) particules.push({ x: P.x - P.dir * 6, y: P.y + 10, vx: (Math.random() - 0.5) * 40 - P.vx * 0.2, vy: 30 + Math.random() * 30, vie: 0.5, max: 0.5, type: 'poudre', c: AILES[progres.aile].a });
}
function toucher(sx) {
  if (P.inv > 0 || fini) return false;
  P.coeurs--; P.touches++; P.inv = INVINCIBLE;
  cam.sec = 0.35;
  Son.aie();
  const s = P.x >= sx ? 1 : -1;
  P.vx = s * 140; P.vy = -230; P.pose = null;
  for (let i = 0; i < 10; i++) particules.push({ x: P.x, y: P.y, vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200, vie: 0.7, max: 0.7, type: 'etoile', c: '#fff36b' });
  bulle(tr('bulle.aie'));
  secouer($('coeurs'));
  if (P.coeurs <= 0) perdre();
  return true;
}
function plouf() {
  Son.plouf();
  for (let i = 0; i < 14; i++) particules.push({ x: P.x, y: SOL - 6, vx: (Math.random() - 0.5) * 160, vy: -100 - Math.random() * 160, vie: 0.8, max: 0.8, type: 'goutte', c: '#bfe6ff', g: 1 });
  const blesse = P.inv <= 0;
  if (blesse) { P.coeurs--; P.touches++; secouer($('coeurs')); cam.sec = 0.3; }
  P.inv = INVINCIBLE;
  if (P.coeurs <= 0) { perdre(); return; }
  bulle(tr('bulle.plouf'));
  P.x = P.reprise.x; P.y = P.reprise.y - R - 30; P.vx = 0; P.vy = 0; P.pose = null;
  P.energie = Math.max(P.energie, ENERGIE_MAX * 0.5);
}
function perdre() {
  if (fini) return;
  fini = true; victoire = false; tFin = 0;
  Son.defaite();
}
function gagner() {
  if (fini) return;
  fini = true; victoire = true; tFin = 0;
  Son.victoire();
  for (let i = 0; i < 60; i++) particules.push({ x: L.finX + (Math.random() - 0.5) * 120, y: SOL - 330, vx: (Math.random() - 0.5) * 300, vy: -80 - Math.random() * 220, vie: 2, max: 2, type: 'confetti', c: ['#ff5c8a', '#ffd23f', '#5b8cff', '#7ee08a', '#c86bfa'][i % 5], g: 1 });
}

// Plateformes du moment : { x, y, w, obj, type }.
function plateformes() {
  const out = [];
  for (const f of L.fleurs) out.push({ x: f.x, y: f.y, w: f.w, obj: f, type: 'fleur' });
  for (const p of L.nenuphars) if (p.appui) out.push({ x: p.x, y: p.y, w: p.w, obj: p, type: 'nenuphar' });
  for (const tu of L.tulipes) if (tu.ouvert) out.push({ x: tu.x, y: tu.y, w: tu.w, obj: tu, type: 'tulipe' });
  for (const f of L.feuilles) out.push({ x: f.x, y: f.y, w: f.w, obj: f, type: 'feuille' });
  for (const s of L.pierres) out.push({ x: s.x, y: s.y, w: s.w * 0.6, obj: s, type: 'pierre' });
  for (const a of L.abris) out.push({ x: a.x, y: a.y - 12, w: a.w * 0.8, obj: a, type: 'abri' });

}
function recharge(type) { return type === 'fleur' || type === 'tulipe' ? 9 : type === 'nenuphar' || type === 'feuille' ? 6 : type === 'abri' || type === 'pierre' ? 5 : 2.2; }

function majPapillon(dt) {
  const ventX = { fx: 0, fy: 0 };
  for (const v of L.vents) if (P.x >= v.a && P.x <= v.b) { ventX.fx += v.fx; ventX.fy += v.fy; }
  P.ventActuel = ventX;
  if (P.pose) {
    const p = P.pose;
    let enPlace = true;
    if (p.tulipe && !p.obj.ouvert) enPlace = false;
    if (enPlace) {
      if (p.type === 'feuille') P.x += p.obj.x - p.obj.px;
      P.vx = 0; P.vy = 0; P.y = p.yPose;
      P.energie = Math.min(ENERGIE_MAX, P.energie + recharge(p.type) * dt);
    } else {
      P.pose = null; P.vy = -160;
    }
  }
  if (!P.pose) {
    P.vy += (GRAV + ventX.fy) * dt;
    const chute = CHUTE_MAX + (ventX.fy > 0 ? ventX.fy : 0) + P.pousse;
    if (P.vy > chute) P.vy = chute;
    P.pousse = Math.max(0, P.pousse - 300 * dt);
    P.vx += ventX.fx * dt;
    P.vx *= (1 - FROTTEMENT * dt);
    const vmax = VX_MAX + Math.abs(ventX.fx) * 0.4;
    P.vx = Math.max(-vmax, Math.min(vmax, P.vx));
    const yAvant = P.y;
    P.x += P.vx * dt; P.y += P.vy * dt;
    // Atterrissage (seulement en descendant, par-dessus)
    if (P.vy >= 0) {
      for (const p of plateformes()) {
        if (Math.abs(P.x - p.x) <= p.w / 2 + 2 && yAvant + R <= p.y + 4 && P.y + R >= p.y) {
          P.y = p.y - R; P.vy = 0; P.vx = 0;
          P.pose = { type: p.type, obj: p.obj, yPose: p.y - R, tulipe: p.type === 'tulipe' };
          if (p.type === 'fleur' || p.type === 'nenuphar' || p.type === 'abri' || p.type === 'tulipe') P.reprise = { x: p.x, y: p.y };
          Son.pose();
          for (let i = 0; i < 5; i++) particules.push({ x: p.x + (Math.random() - 0.5) * 30, y: p.y, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 50, vie: 0.6, max: 0.6, type: 'petale', c: p.type === 'fleur' ? COULEURS_FLEURS[p.obj.c % 6].p : '#bff5a0', g: 1 });
          break;
        }

      // Champignons : rebond
      for (const c of L.champis) {
        if (!P.pose && Math.abs(P.x - c.x) <= c.w / 2 && yAvant + R <= c.y + 6 && P.y + R >= c.y) {
          P.y = c.y - R; P.vy = -600; c.ec = 1; P.energie = Math.min(ENERGIE_MAX, P.energie + 3);
          Son.boing(); P.reprise = { x: c.x, y: c.y };
          for (let i = 0; i < 8; i++) particules.push({ x: c.x, y: c.y, vx: (Math.random() - 0.5) * 160, vy: -60 - Math.random() * 100, vie: 0.6, max: 0.6, type: 'etoile', c: '#fff' });
        }
      }
    } else {
      // Sous une grande feuille d'abri : on ne la traverse pas en montant
      for (const a of L.abris) {
        if (Math.abs(P.x - a.x) <= a.w / 2 - 6 && yAvant - R >= a.y + 6 && P.y - R < a.y + 6) { P.y = a.y + 6 + R; P.vy = 30; }
      }
    }
    // Côtés des pierres
    for (const s of L.pierres) {
      if (P.y + R > s.y + 8 && Math.abs(P.x - s.x) < s.w / 2 + R - 4) {
        P.x = s.x + Math.sign(P.x - s.x || 1) * (s.w / 2 + R - 4); P.vx = 0;
      }

    if (P.x < 30) { P.x = 30; P.vx = Math.max(0, P.vx); }
    if (P.x > L.longueur - 30) P.x = L.longueur - 30;
    // Sol
    const type = solEn(L, P.x);
    const ySol = type === 'eau' ? SOL - 6 : SOL - 4;
    if (P.y + R >= ySol) {
      if (type === 'eau') plouf();
      else if (type === 'ronces') { P.y = ySol - R; toucher(P.x + P.dir); P.vy = -340; P.pose = null; }
      else { P.y = ySol - R; P.vy = 0; P.vx = 0; P.pose = { type: 'sol', obj: null, yPose: P.y }; Son.pose(); }
    }
  }
  P.inv = Math.max(0, P.inv - dt);

// ---------- Animaux et objets ----------
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
function distSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
  const u = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
  return Math.hypot(px - ax - u * dx, py - ay - u * dy);
}
function majMonde(dt) {
  const tps = L.t;
  // Tulipes
  for (const tu of L.tulipes) { const ph = ((tps + tu.ph) % tu.per) / tu.per; tu.ouvert = ph < 0.55 || ph > 0.97; }
  // Feuilles flottantes
  for (const f of L.feuilles) { f.px = f.x; f.x = f.x0 + f.amp * Math.sin(tps * 0.8 + f.ph); }
  // Champignons (écrasement qui revient)
  for (const c of L.champis) c.ec = Math.max(0, c.ec - dt * 4);
  if (fini) return;
  // Grenouilles
  for (const g of L.grenouilles) {
    if (g.etat === 'repos') {
      g.cool -= dt;
      if (g.cool <= 0 && Math.abs(P.x - g.x) < 85 && P.y < g.y && g.y - P.y < 330) { g.etat = 'pret'; g.t = 0; if (Math.abs(P.x - g.x) < 300) Son.coa(); }
    } else if (g.etat === 'pret') {
      g.t += dt;
      if (g.t > 0.45) { g.etat = 'saut'; const h = Math.min(300, Math.max(60, g.y - P.y + 20)); g.vy = -Math.sqrt(2 * 1500 * h); g.dy = 0; }
    } else if (g.etat === 'saut') {
      g.vy += 1500 * dt; g.dy += g.vy * dt;
      if (g.dy >= 0) { g.dy = 0; g.etat = 'repos'; g.cool = 1.3; for (let i = 0; i < 6; i++) particules.push({ x: g.x, y: SOL - 6, vx: (Math.random() - 0.5) * 120, vy: -80 - Math.random() * 80, vie: 0.5, max: 0.5, type: 'goutte', c: '#bfe6ff', g: 1 }); }
    }

  }
  // Mésanges
  for (const o of L.oiseaux) {
    if (o.etat === 'attente') { if (P.x >= o.trig - 240) { o.etat = 'alerte'; o.t = 0; Son.cuicui(); } }
    else if (o.etat === 'alerte') { o.t += dt; if (o.t > 1.05) { o.etat = 'vol'; o.x = o.dir < 0 ? cam.x + vueW + 50 : cam.x - 50; } }
    else if (o.etat === 'vol') {
      o.x += o.dir * o.v * dt;
      o.yy = o.y + Math.sin(tps * 4 + o.trig) * 22;
      if (dist(P.x, P.y, o.x, o.yy) < R + 17) toucher(o.x);
      if ((o.dir < 0 && o.x < cam.x - 120) || (o.dir > 0 && o.x > cam.x + vueW + 120)) o.etat = 'parti';
    }
  }
  // Toiles et araignées
  for (const w of L.toiles) {
    if (dist(P.x, P.y, w.x, w.y) < w.r * 0.85 + R * 0.6) toucher(w.x);
    if (w.araignee && dist(P.x, P.y, w.x, posAraignee(w, tps)) < R + 10) toucher(w.x);
  }
  // Pissenlits
  for (const p of L.pissenlits) {
    if (p.actif) {

        Son.pissenlit(); bulle(tr('bulle.pissenlit'));
        for (let i = 0; i < 16; i++) particules.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 160, vy: -20 - Math.random() * 90, vie: 1.6, max: 1.6, type: 'graine', c: '#fff' });

  }
  // Lézards
  for (const l of L.lezards) {
    if (l.etat === 'repos') {

    } else if (l.etat === 'pret') { l.t += dt; if (l.t > 0.45) { l.etat = 'langue'; l.t = 0; } }

      if (dist(P.x, P.y, f.fx, f.fy) < R + 14) toucher(f.fx);
    }
  }
  // Pluie
  for (const z of L.pluies) {

    if (!g.mort && g.y >= SOL) { g.mort = true; if (Math.random() < 0.3) eclabousser(g.x, SOL - 2); }
    if (!g.mort && dist(P.x, P.y, g.x, g.y) < R + 4) {
      g.mort = true; P.pousse = Math.min(240, P.pousse + 120); if (!P.pose) P.vy += 140;

    for (let i = 0; i < 4; i++) particules.push({ x: g.x, y: g.y, vx: (Math.random() - 0.5) * 90, vy: (Math.random() - 0.5) * 90, vie: 0.4, max: 0.4, type: 'etoile', c: '#ffe066' });
  }

function eclabousser(x, y) {
  for (let i = 0; i < 3; i++) particules.push({ x, y, vx: (Math.random() - 0.5) * 70, vy: -40 - Math.random() * 50, vie: 0.3, max: 0.3, type: 'goutte', c: '#d6ecff', g: 1 });
}

function majParticules(dt) {
  for (const p of particules) {
    p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.g) p.vy += 400 * dt;
    if (p.type === 'graine') { p.vx *= 0.98; p.vy -= 10 * dt; }
  }
  particules = particules.filter((p) => p.vie > 0);
  if (particules.length > 400) particules.splice(0, particules.length - 400);
}

function majCamera(dt) {
  const cible = P.x - vueW * 0.38 + P.dir * 30;
  cam.x += (cible - cam.x) * Math.min(1, dt * 3.5);
  cam.x = Math.max(0, Math.min(L.longueur - vueW, cam.x));
  cam.y = H - vueH;
  cam.sec = Math.max(0, cam.sec - dt);
}

// ---------- Boucle principale ----------
let avant = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.033, (maintenant - avant) / 1000 || 0);
  avant = maintenant;
  horloge += dt;
  if (mode === 'jeu') majJeu(dt);
  else if (mode === 'fin' || mode === 'menu' || mode === 'titre') majParticules(dt);
  dessiner();
  if (mode === 'fin') animerCompteur(dt);
  requestAnimationFrame(boucle);
}
function majJeu(dt) {
  L.t += dt;
  if (!fini) {
    tempsNiveau += dt;
    const dir = directionTenue();
    if (dir !== null && L.t - P.dernier >= CADENCE) battre(dir);
    majPapillon(dt);
  } else {
    tFin += dt;
    if (victoire) { // le papillon rejoint la grande fleur
      P.x += (L.finX - P.x) * Math.min(1, dt * 2); P.y += (SOL - 290 - P.y) * Math.min(1, dt * 2); P.ph += dt * 10; P.pose = null;
    } else { P.y = Math.min(SOL - R, P.y + 60 * dt); P.ph += dt * 3; }

  }
  majMonde(dt);
  majParticules(dt);
  majCamera(dt);
  majHud();
}

// ---------- Rendu ----------
function collineLoin(x, D) { return SOL - 165 - 40 * Math.sin(x * 0.004 + D.ph[0]) - 22 * Math.sin(x * 0.011 + D.ph[1]); }
function collineMid(x, D) { return SOL - 72 - 28 * Math.sin(x * 0.006 + D.ph[2]) - 14 * Math.sin(x * 0.017 + D.ph[3]); }

function dessinerFond(N, cx, cy, tps) {
  const D = DECORS[N.decor] || DECORS.jour, deco = N.deco;
  // Ciel (en coordonnées écran)
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  D.ciel.forEach((c, i) => g.addColorStop(i / (D.ciel.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

    for (let i = 0; i < 60; i++) { const sx = (i * 137.5 + 20) % VW, sy = (i * 71.3) % (VH * 0.6); ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(tps * 2 + i)) + ')'; ctx.fillRect(sx, sy, 2, 2); }
    ctx.fillStyle = '#fff8d6'; ctx.beginPath(); ctx.arc(VW * 0.78, VH * 0.2, 30 * S, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = D.ciel[0]; ctx.beginPath(); ctx.arc(VW * 0.78 + 12 * S, VH * 0.2 - 8 * S, 26 * S, 0, Math.PI * 2); ctx.fill();

    sg.addColorStop(0, D.soleil); sg.addColorStop(0.4, D.soleil); sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(VW * 0.8, VH * 0.18, 80 * S, 0, Math.PI * 2); ctx.fill();

    ctx.beginPath(); ctx.arc(x, n.y, 26 * n.s, 0, Math.PI * 2); ctx.arc(x + 28 * n.s, n.y - 10 * n.s, 32 * n.s, 0, Math.PI * 2); ctx.arc(x + 60 * n.s, n.y, 24 * n.s, 0, Math.PI * 2); ctx.fill();
