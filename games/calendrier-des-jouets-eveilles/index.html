    } else if (a.t === 's') {
      sons.garde();
      const carte = $('place-' + s);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      if (!moi) toast(tr('garde.autre', { nom: nom, n: d.v }), 1600);
      else toast(tr('garde.toi', { n: d.v }), 1600);
    } else if (a.t === 'b') {
      sons.bougie();
      jaillir(a.p, '#ffd34a', 12);
      modeBougie = false;
      if (!moi) toast(tr('bougie.autre', { nom: nom }), 1500);
    }
    // le Pantin
    if (d.pris) {
      setTimeout(() => sons.pris(), 250);
      const texte = d.vol !== undefined
        ? (d.vol > 0 ? tr(moi ? 'pantin.volToi' : 'pantin.vol', { nom: nom, n: d.vol }) : tr(moi ? 'pantin.rienToi' : 'pantin.rien', { nom: nom }))
        : tr(moi ? 'pantin.prisToi' : 'pantin.pris', { nom: nom });
      setTimeout(() => alertePantin(texte, true), 300);
      const carte = $('place-' + s);
      carte.classList.remove('tremble'); void carte.offsetWidth; carte.classList.add('tremble');
    } else if (d.monte) {
      setTimeout(() => sons.monte(), 250);
      setTimeout(() => alertePantin(tr(moi ? 'pantin.monteToi' : 'pantin.monte', { nom: nom, n: d.monte }), false), 300);
    }
    if (vue.mel && vue.mel.length) {
      anims.mel = { t0: t + 500, paires: vue.mel.slice(), lit: (ev.avant.rv || []).filter((p) => ev.avant.po[p] === -1) };
      setTimeout(() => { sons.glisse(); toast(tr('melange'), 1500); }, 500);
    }
    if (d.saut) {
      d.saut.forEach((x, k) => setTimeout(() => toast(x === (partie ? partie.siege : -1) ? tr('sautToi') : tr('saut', { nom: nomMessage(x) }), 1800), 1300 + k * 1500));
    }
    if (ev.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !moi && vue.ph === 'c' && vue.nt === 0) sons.tour();
    if (curseur >= 0 && vue.po[curseur] !== -1) curseur = plusProche(curseur);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;

  // Étoiles : 1 pour la victoire, 2 avec 30 % des friandises du calendrier, 3 avec 42 %.
  function etoilesPour(pts, total, gagne) {
    if (!gagne) return 0;
    const p = total ? pts / total : 0;
    return p >= 0.42 ? 3 : p >= 0.3 ? 2 : 1;
  }

      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');

      qui.appendChild(nomEl);

  // Neige et étoiles de victoire.
  function neige() {
    const cv = $('neige'), w = window.innerWidth, h = window.innerHeight;

    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 110; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.6, vx: (Math.random() - 0.5) * 60, vy: 90 + Math.random() * 140, r: Math.random() * 6, vr: (Math.random() - 0.5) * 4, coul: i % 3 ? '#ffffff' : ['#ffd34a', '#ff5a4a', '#7dffa0'][i % 3], k: 3 + Math.random() * 5, et: i % 4 === 0 });
    let debut = 0, prec = 0;
    const j = ++neige.n;
    function pas(t) {
      if (j !== neige.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt + Math.sin(t / 400 + b.r) * 0.5; b.y += b.vy * dt; b.r += b.vr * dt;
        c.fillStyle = b.coul;

      });
      if (t - debut < 3000) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }

        else if (t < 2600) { const k = ent(t, 1500, 2500); hx = 120 + (465 - 120) * k; hy = 95 + (180 - 95) * k; ap = t > 2400 ? 1 : 0; }
        else if (t < 4900) { const k = ent(t, 3800, 4800); hx = 465 + (120 - 465) * k; hy = 180 + (275 - 180) * k; }

    },

        sapin(c, 200, 170, 300, bs);
        if (!bouge) { const p = 1 - t / 2400; c.strokeStyle = '#ffd34a'; c.lineWidth = 9; c.beginPath(); c.arc(470, 70, 28, -Math.PI / 2, -Math.PI / 2 + p * Math.PI * 2); c.stroke(); }
        cols.forEach((col, j) => { caseChoix(c, 390 + (j % 2) * 64, 150 + Math.floor(j / 2) * 64, 56, t > 4300 && j === 2 ? 'bon' : ''); boule(c, col, 418 + (j % 2) * 64, 182 + Math.floor(j / 2) * 64, 16); });
        if (t > 2600) { const k = ent(t, 2800, 4200); main(c, 540 + (418 - 540) * k, 350 + (250 - 350) * k, 1.3, t > 4100 && t < 4700 ? 1 : 0); }
      }
    },
    piege: {
      duree: 4600, scene(c, t) {
        const o = {};
        if (t > 1100) o[2] = { po: 9, pk: 6, ouverture: ent(t, 1100, 1500) };
        rangeePortes(c, 4, 60, 60, 90, 100, o);
        if (t > 1500) {
          const k = ent(t, 1500, 2100);
          jouet(c, 6, 285, 110 - k * 30, 40 + k * 30, { maudit: true });
          // les friandises du panier tombent
          for (let j = 0; j < 3; j++) { const y = 260 + ent(t, 1800, 2600) * 90; friandise(c, j + 1, 100 + j * 50, y, 16); }
          marche(c, 380, 320, 3, 1, 40);
        } else for (let j = 0; j < 3; j++) friandise(c, j + 1, 100 + j * 50, 260, 16);
        const k = ent(t, 200, 1000);
        main(c, 520 + (300 - 520) * k, 340 + (120 - 340) * k, 1.4, t > 950 && t < 1400 ? 1 : 0);
      }
    },
    bougie: {
      duree: 5000, scene(c, t) {
        const o = {};
        if (t > 2200) { o[1] = { eclairee: true, pv: 2, pk: 3 }; o[3] = { eclairee: t > 3600, pv: -1, pk: 2 }; }
        rangeePortes(c, 4, 60, 40, 90, 100, o);
        // bouton bougie
        c.fillStyle = t > 1000 && t < 1500 ? '#ffe7a0' : '#d89a2a'; rr(c, 200, 250, 150, 50, 14); c.fill();
        c.fillStyle = '#fff4dc'; c.fillRect(266, 266, 18, 26); c.fillStyle = '#c25a00'; c.beginPath(); c.moveTo(275, 250); c.quadraticCurveTo(286, 262, 275, 266); c.quadraticCurveTo(264, 262, 275, 250); c.fill();
        let hx, hy, ap = 0;
        if (t < 1500) { const k = ent(t, 200, 1000); hx = 520 + (275 - 520) * k; hy = 340 + (285 - 340) * k; ap = t > 1000 ? 1 : 0; }
        else { const k = ent(t, 1500, 2100); hx = 275 + (195 - 275) * k; hy = 285 + (105 - 285) * k; ap = t > 2050 && t < 2500 ? 1 : 0; }
        main(c, hx, hy, 1.4, ap);
      }
    },
    paquet: {
      duree: 4200, scene(c, t) {
        carteQuestion(c, 30, 20, 500, 320);
        paquet(c, 280, 110, 70, [2, 0, 1]);
        [[2, 0, 2], [2, 0, 1], [4, 0, 1]].forEach((m, j) => { caseChoix(c, 120 + j * 120, 210, 96, t > 2600 && j === 1 ? 'bon' : ''); paquet(c, 168 + j * 120, 262, 38, m); });
        const k = ent(t, 600, 2400);
        main(c, 520 + (290 - 520) * k, 340 + (265 - 340) * k, 1.4, t > 2300 && t < 2900 ? 1 : 0);
      }
    },
    double: {
      duree: 5000, scene(c, t) {
        porte(c, 60, 60, 120, 140, 1, { po: -1, px: 1 }, TH_TUTO);
        c.fillStyle = '#7dffa0'; c.strokeStyle = '#7dffa0'; c.lineWidth = 6;
        // à gauche : bonne réponse → deux friandises
        if (t > 1000) { c.beginPath(); c.moveTo(220, 110); c.lineTo(240, 130); c.lineTo(275, 90); c.stroke(); friandise(c, 3, 310, 110, 22); friandise(c, 3, 365, 110, 22); }
        // à droite : mauvaise réponse → 2 marches
        if (t > 2800) {
          c.strokeStyle = '#ff5a4a'; c.beginPath(); c.moveTo(220, 220); c.lineTo(260, 260); c.moveTo(260, 220); c.lineTo(220, 260); c.stroke();
          marche(c, 300, 290, 3, t > 3600 ? 2 : 1, 44);
          pantin(c, 420, 270, 110, { lueur: true, bouche: 0.4 });
        }
        main(c, 130, 150, 1.3, t % 2500 < 400 ? 1 : 0);
      }
    },
    vol: {
      duree: 5000, scene(c, t) {
        visage(c, 1, 120, 150, 50, { peur: true });
        pantin(c, 320, 330, 230, { lueur: true, bouche: t > 1200 ? 1 : 0.3, bras: t > 1200 ? 1 : 0.3 });
        // sac du Pantin
        c.fillStyle = '#5a3a2a'; c.beginPath(); c.moveTo(440, 230); c.quadraticCurveTo(500, 220, 510, 290); c.quadraticCurveTo(475, 320, 440, 300); c.closePath(); c.fill();
        for (let j = 0; j < 3; j++) {
          const k = ent(t, 1400 + j * 500, 2200 + j * 500);
          friandise(c, j, 120 + (470 - 120) * k, 230 - Math.sin(k * Math.PI) * 90 + k * 30, 16);
        }
      }
    },
    melange: {
      duree: 5600, scene(c, t) {
        const k = ent(t, 2200, 3400), e2 = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const xa = 70 + (370 - 70) * e2, xb = 370 + (70 - 370) * e2;
        porte(c, 220, 60, 100, 115, 1, { po: -1 }, TH_TUTO);
        porte(c, xb, 60 + Math.sin(k * Math.PI) * 60, 100, 115, 3, { po: -1, eclairee: t > 600, pv: -1, pk: 10 }, TH_TUTO);
        porte(c, xa, 60 - Math.sin(k * Math.PI) * 60, 100, 115, 0, { po: -1, eclairee: t > 600, pv: 3, pk: 2 }, TH_TUTO);
        if (t > 3600) { const k2 = ent(t, 3700, 4600); main(c, 520 + (420 - 520) * k2, 340 + (130 - 340) * k2, 1.4, t > 4500 && t < 5000 ? 1 : 0); }
      }
    },
    grande: {
      duree: 4000, scene(c, t) {
        const g = c.createRadialGradient(280, 170, 10, 280, 170, 180);
        g.addColorStop(0, '#ffd46a' + (t % 1000 < 500 ? '66' : '44')); g.addColorStop(1, '#0000'); c.fillStyle = g; c.fillRect(0, 0, 560, 360);
        porte(c, 210, 60, 140, 170, 4, { po: -1, grande: true }, TH_TUTO);
        for (let j = 0; j < 5; j++) { c.fillStyle = '#ffd34a'; c.strokeStyle = '#7a4a08'; c.lineWidth = 2; rond(c, 220 + j * 30, 270, 10); c.fill(); c.stroke(); }
        main(c, 300, 160, 1.4, t % 2000 < 400 ? 1 : 0);
      }
    },
    presse: {
      duree: 4000, scene(c, t) {
        const on = t < 1200 ? 0 : t < 2400 ? 1 : 2;
        marche(c, 250, 300, 2, on, 56);
        pantin(c, 250 + on * 66, 300 - on * 40, 160, { lueur: true, bouche: on >= 2 ? 1 : 0.4, bras: on >= 2 ? 1 : 0.3 });
        visage(c, 2, 470, 110, 46, { peur: true });
      }
    }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let debut = 0, id = 0;
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const tt = (t - debut) % d.duree;
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      c.fillStyle = '#241422'; c.fillRect(0, 0, 560, 360);
      try { d.scene(c, tt); } catch (e) { /* dessin impossible */ }
      id = requestAnimationFrame(image);
    }
    id = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(id);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function porteSous(px, py) {
    if (!vue || !geo) return -1;
    for (let i = 0; i < vue.nb; i++) {
      const p = posPorte(geo, i);
      if (px >= p[0] && px < p[0] + geo.pw && py >= p[1] && py < p[1] + geo.ph) return vue.po[i] === -1 ? i : -1;
    }
    return -1;
  }

  function plusProche(depuis) {
    if (!vue) return -1;
    const l = O.fermees(vue);
    if (!l.length) return -1;
    if (depuis < 0) return l[0];
    let best = l[0], bd = Infinity;
    l.forEach((i) => { const d = Math.abs((i % 4) - (depuis % 4)) + Math.abs(Math.floor(i / 4) - Math.floor(depuis / 4)); if (d < bd) { bd = d; best = i; } });
    return best;
  }

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    if (curseur < 0 || vue.po[curseur] !== -1) { curseur = plusProche(curseur); return; }
    const l = O.fermees(vue).filter((i) => i !== curseur);
    const cx = curseur % 4, cy = Math.floor(curseur / 4);
    let best = -1, bd = Infinity;
    l.forEach((i) => {
      const vx = (i % 4) - cx, vy = Math.floor(i / 4) - cy;
      const avance = vx * dx + vy * dy;
      if (avance <= 0) return;
      const score = avance + Math.abs(vx * dy - vy * dx) * 2.2;
      if (score < bd) { bd = score; best = i; }
    });
    if (best >= 0) { curseur = best; sons.clic(); }
  }

  function action(p) {
    if (!partie || enPause || attenteTuto || p < 0) return;
    if (!monTourChoix()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu' && !partie.monTour()) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (modeBougie) {
      if (vue.rv.indexOf(p) >= 0) return;
      if (partie.jouer({ t: 'b', p: p })) { modeBougie = false; survol = -1; majInterface(); }
      return;
    }
    if (partie.jouer({ t: 'o', p: p })) { survol = -1; }
  }

  function garder() {
    if (!monTourChoix() || !vue || vue.nt <= 0) return;
    audio();
    partie.jouer({ t: 's' });
  }

  function basculerBougie() {
    if (!monTourChoix() || !vue || !O.actif(vue, 'B') || vue.bg[partie.siege] <= 0) return;
    audio(); sons.clic();
    modeBougie = !modeBougie;
    majInterface();
  }

  const cal = $('cal');
  function point(ev) { const r = cal.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  cal.addEventListener('pointerdown', (ev) => { audio(); clavier = false; const p = point(ev); survol = porteSous(p[0], p[1]); });
  cal.addEventListener('pointermove', (ev) => { const p = point(ev); if (ev.pointerType === 'mouse' || ev.buttons) survol = porteSous(p[0], p[1]); });
  cal.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    const i = porteSous(p[0], p[1]);
    if (ev.pointerType !== 'mouse') survol = -1;
    action(i);
  });
  cal.addEventListener('pointercancel', () => { survol = -1; });
  cal.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = -1; });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    // Question : chiffres, ou flèches et Entrée
    if (qEtat && qEtat.moi && !qEtat.repondu) {
      const n = qEtat.q.ch.length;
      const m = /^(?:Digit|Numpad)([1-9])$/.exec(ev.code);
      if (m) { ev.preventDefault(); audio(); repondre(Number(m[1]) - 1); return; }
      if (ev.code === 'ArrowLeft' || ev.code === 'ArrowUp') { ev.preventDefault(); clavier = true; qVise = (qVise + n - 1) % n; majVise(); sons.clic(); return; }
      if (ev.code === 'ArrowRight' || ev.code === 'ArrowDown') { ev.preventDefault(); clavier = true; qVise = (qVise + 1) % n; majVise(); sons.clic(); return; }
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
        ev.preventDefault(); audio();
        if (!clavier) { clavier = true; majVise(); return; }
        repondre(qVise); return;
      }
      return;
    }
    if (ev.code === 'KeyS') { ev.preventDefault(); garder(); return; }
    if (ev.code === 'KeyB') { ev.preventDefault(); basculerBougie(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!clavier) { clavier = true; if (curseur < 0 || !vue || vue.po[curseur] !== -1) { curseur = plusProche(-1); return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0 || !vue || vue.po[curseur] !== -1) { clavier = true; curseur = plusProche(curseur); return; }
      action(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerTitre(performance.now()); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vitrine').addEventListener('click', () => { audio(); sons.clic(); ouvrirVitrine(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('vit-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-garder').addEventListener('click', () => garder());
  $('btn-bougie').addEventListener('click', () => basculerBougie());
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.g[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
