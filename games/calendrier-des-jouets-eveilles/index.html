<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

    bNouvelle.addEventListener('click', choisir(nouvelle));

  function boutonEffacer(options) {

    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

<script id="jel-multi">
/* ==========================================================================

   Le même fichier sert à trois endroits :

       (bloc jel-multi, juste après jel-sauvegarde) par
       node scripts/i18n-jeu.mjs : window.JEL_MULTI ;

       globalThis.JEL_MULTI ;
     - dans les tests (scripts/tester-multijoueur.mjs).

   window.JEL_REGLES) sont des fonctions pures, sans écran ni réseau :
     places        nombre de places de la partie, 2 à 10 (constante unique)
     depart(alea, places, options)  état de départ d'une manche
     aQui(etat)    place qui doit jouer (0 à places − 1)
     valide(etat, place, action)    l'action est-elle permise ? (true/false)
     jouer(etat, place, action, alea)  nouvel état (alea : hasard reproductible)
     bot(etat, place, alea, force)  action d'un robot (force de 0 à 1)
     fin(etat)     null pendant la manche, sinon { classement, scores }

   robot tout de suite ; 'manche' : à la manche suivante), delaiBot (ms entre
   deux coups affichés), delaiJoueur (ms laissées à un vrai joueur avant que
   son robot joue), pauseManche (ms entre deux manches, solo), attenteSalon
   (ms avant que le salon lance seul la manche), forceEnLigne.

   c'est le Durable Object de la partie qui l'utilise ; en solo, le jeu en crée
   un sur l'appareil. Il n'a ni minuterie ni boucle : les coups des robots sont
   calculés d'un coup, dès que c'est à eux (le jeu les affiche ensuite un par
   un, espacés de delaiBot), et seul un réveil (alarme) est programmé pour le
   temps laissé à un vrai joueur, la pause entre deux manches ou le salon.

   Salon (en ligne : réglage salon) : avant chaque manche, les joueurs se
   retrouvent dans un salon d'attente ; les places vides y sont des robots, et
   chaque joueur qui arrive prend la place d'un robot. Le « chef » (le premier

   chef. Sans lancement, la manche part seule après attenteSalon. Pendant une

  Arbitre.prototype.maintenant = function () { return this.reglages.maintenant ? this.reglages.maintenant() : Date.now(); };
  Arbitre.prototype.alea = function () { return this.reglages.alea ? this.reglages.alea() : Math.random(); };
  Arbitre.prototype.force = function () { return typeof this.reglages.force === 'number' ? this.reglages.force : this.r.forceEnLigne; };

  // Un vrai joueur arrive. Renvoie sa place, -1 s'il attend la manche suivante,

  Arbitre.prototype.valide = function (s, a) {

  // Fait jouer les robots tant que c'est à eux, jusqu'au tour d'un vrai joueur

  // --- Partie, côté jeu -----------------------------------------------------

  //                 { type: 'debut', reste } (arrivée dans une partie : etat, siege, sieges,
  //                 phase : 'salon' le plus souvent) ;
  //                 { type: 'salon', reste } (salon d'attente, en ligne : avant la 1re manche et
  //                 après chacune ; le chef peut lancer, sinon lancement seul dans reste ms) ;
  //                 { type: 'manche' } (nouvelle manche, etat de départ) ;
  //                 { type: 'action', siege, action, avant, apres, auto, moi } ;
  //                 { type: 'fin', resultat } (fin(etat) des règles) ;
  //                 { type: 'sieges' } (un vrai joueur arrive ou part, ou le chef change) ; { type: 'refus' }

  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),

  // lancerManche() (le chef, dans le salon), jouer(action), pause(oui), recommencer(options)
  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {
    try { return racine.parent && racine.parent !== racine; } catch (e) { return false; }
  }

    if (this.o.enLigne !== false && dansLanceur()) {

      var inv = invitation();
      if (inv) { demande.partie = inv.partie; invitationUtilisee = true; }   // partie d'un ami (« Rejoindre »)
      try { racine.parent.postMessage(demande, '*'); } catch (e) { /* pas de lanceur */ }

      this.minuteurConnexion = setTimeout(function () { moi.passerSolo('delai'); }, DELAI_CONNEXION);

  // Arrête tout (connexion, robots locaux, file) sans rien annoncer.
  Partie.prototype.arreter = function () {

    clearTimeout(this.minuteurReveil);
    clearTimeout(this.minuteurConnexion);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'connexion' || this.mode === 'en-ligne') {

  Partie.prototype.recevoirLanceur = function (e) {
    if (e.source !== racine.parent) return;

    if (!d || d.type !== 'jel-multi') return;
    if (d.etat) {

      else if (this.mode === 'en-ligne') { this.versSolo = true; this.pomper(); }

  // Partie contre des robots sur l'appareil (choix, pas de site, ou serveur absent).
  Partie.prototype.passerSolo = function (raison) {

    this.local.rejoindre('moi');
    this.local.demarrer();
    this.programmerReveil();
  };

  Partie.prototype.creerArbitreLocal = function () {

      envoyer: function (cle, m) { moi.file.push(m); moi.pomper(); },
      enchainer: this.o.enchainer !== false,
      delaiJoueur: Infinity,               // le joueur de l'appareil prend son temps
      force: typeof this.o.force === 'number' ? this.o.force : this.r.forceEnLigne,
      options: this.o.options || null,
    });
  };

  // Connexion coupée pendant une partie en ligne : la partie continue sur

  Partie.prototype.basculer = function () {
    racine.removeEventListener('message', this.ecoute);
    // Coupure dans le salon (ou sans place) : une nouvelle manche commence contre des robots.
    if (this.siege < 0 || !this.etat || this.phase === 'salon') { this.passerSolo('coupe'); return; }
    var a = this.creerArbitreLocal();
    var sieges = [];
    for (var s = 0; s < this.r.places; s++) sieges.push(s === this.siege ? 'moi' : null);
    a.restaurer({
      v: PROTOCOLE, sieges: sieges, attente: [], etat: copie(this.etat), n: this.n, manche: this.manche,
      phase: this.phase, finManche: Date.now() + this.r.pauseManche, echeance: null, options: this.options,
    });
    this.local = a;
    this.attendEcho = false;
    this.noms = [];
    this.humains = a.flagsSieges();
    this.changerMode('solo', 'coupe');
    this.signaler({ type: 'sieges' });
    if (a.phase === 'jeu') a.avancer(0);
    this.programmerReveil();
  };

  Partie.prototype.programmerReveil = function () {
    clearTimeout(this.minuteurReveil);
    if (!this.local || this.enPause) return;
    var t = this.local.prochainReveil();
    if (t === null || !isFinite(t)) return;
    var moi = this;
    this.minuteurReveil = setTimeout(function () {
      if (!moi.local || moi.enPause) return;
      moi.local.reveil();
      moi.programmerReveil();
    }, Math.max(0, t - Date.now()));
  };

  // Joue les messages reçus un par un : les coups des autres sont espacés de
  // delaiBot, pour qu'on les voie.
  Partie.prototype.pomper = function () {
    if (this.enPause) return;
    clearTimeout(this.minuteur);
    while (this.file.length) {
      var attente = this.libreA - Date.now();
      if (attente > 0) {
        var moi = this;
        this.minuteur = setTimeout(function () { moi.pomper(); }, attente);
        return;
      }
      var delai = this.traiter(this.file.shift());
      this.libreA = Date.now() + (this.rattrapage ? Math.min(delai, DELAI_RATTRAPAGE) : delai);
    }

    if (this.versSolo) {

      this.basculer();
    }
  };

  // Joue un message ; renvoie le temps à laisser avant le suivant (ms).
  Partie.prototype.traiter = function (m) {
    var r = this.r;

      case 'bienvenue':

        this.humains = m.sieges || [];

        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.etat = m.etat;
        this.phase = m.phase;
        this.attendEcho = false;

        this.etat = r.depart(hasard(m.g), r.places, copie(m.o));
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.phase = 'jeu';
        this.attendEcho = false;
        this.signaler({ type: 'manche' });

(function () {

  //  Le Calendrier des Jouets Éveillés — quiz en images et prise de risque

  //  à une question en images ; on continue ou l'on garde son panier, en
  //  fuyant le Pantin de bois. Solo : 20 niveaux contre 3 robots. En ligne :

  // Une couleur de bonnet par place : 0 rouge, 1 vert, 2 bleu, 3 or.
  const COUL = ['#e2483d', '#3fae6a', '#4a8fe0', '#e8b130'];
  const COUL_F = ['#7a1a14', '#145a30', '#173f80', '#7a5208'];

    { bois: '#2f5a3a', a: '#3a7048', b: '#457e52', deco: '#f4e2a0', fonce: '#16301e', etoiles: 12 },
    { bois: '#8a1f24', a: '#a52a2e', b: '#b8383a', deco: '#ffd88a', fonce: '#420c10', etoiles: 24 },
    { bois: '#5a7a9a', a: '#8aaacc', b: '#a0bedc', deco: '#ffffff', fonce: '#2a3a52', etoiles: 40 },

  const ICONE_BONBON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 5l3 3-3 3zM15 5l-3 3 3 3z" fill="#ff8ab0"/><circle cx="8" cy="8" r="4.6" fill="#ff5a8a"/><path d="M5.2 6.4c1.2-1.6 3.6-1.8 5.2-.4" stroke="#ffd0e0" stroke-width="1.4" fill="none"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    jouets: [], theme: 0, options: { son: true }

  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;

      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (Array.isArray(d.jouets)) prog.jouets = d.jouets.filter((x) => Number.isInteger(x) && x >= 0 && x < O.NB_JOUETS);

      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }

    if (THEMES[prog.theme].etoiles > totalEtoiles()) prog.theme = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.jouets = [];
    prog.theme = 0;
  }

  function donnees(niveauReprise, score) {
    return {
      niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
      debloque: prog.debloque, tutos: prog.tutos.slice(), jouets: prog.jouets.slice(), theme: prog.theme,
      options: { son: prog.options.son }
    };
  }
  function sauver(niveauReprise, score) {
    try { window.JEL_SAVE.save(JEU, donnees(niveauReprise, score)); } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Son et calendrier choisis depuis l'écran titre ou la vitrine : jamais de nouvelle sauvegarde là.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, theme: prog.theme }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.vibrato) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vibrato; lg.gain.value = f * 0.06;
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);
      }
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = o.passe || 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(700, 0.05, { type: 'triangle', vol: 0.06 }),
    grince: () => { note(380, 0.35, { type: 'sawtooth', vol: 0.035, vers: 520, vibrato: 23, filtre: 1400 }); note(240, 0.12, { type: 'triangle', vol: 0.05, retard: 0.3 }); },
    bon: () => [988, 1319, 1568].forEach((f, i) => note(f, 0.22, { type: 'triangle', vol: 0.08, retard: i * 0.07 })),
    faux: () => { note(200, 0.28, { type: 'square', vol: 0.05, filtre: 700, vers: 120 }); note(150, 0.32, { type: 'square', vol: 0.04, filtre: 600, retard: 0.12, vers: 90 }); },
    garde: () => [1568, 1760, 2093, 1760, 2349].forEach((f, i) => note(f, 0.09, { type: 'sine', vol: 0.05, retard: i * 0.05 })),
    monte: () => { note(110, 0.09, { type: 'square', vol: 0.07, filtre: 500 }); note(90, 0.12, { type: 'square', vol: 0.07, filtre: 420, retard: 0.16 }); },
    pris: () => { [147, 175, 208].forEach((f) => note(f, 1.1, { type: 'sawtooth', vol: 0.04, filtre: 900, vibrato: 5 })); note(70, 0.6, { type: 'sine', vol: 0.12, retard: 0.05 }); },
    piege: () => { note(300, 0.7, { type: 'sawtooth', vol: 0.04, vers: 170, vibrato: 17, filtre: 1100 }); note(820, 0.25, { type: 'square', vol: 0.03, filtre: 2000, retard: 0.5, vers: 1200 }); },
    bougie: () => { note(1200, 0.3, { type: 'sine', vol: 0.03, vers: 500 }); note(660, 0.4, { type: 'triangle', vol: 0.05, retard: 0.08 }); },
    glisse: () => note(260, 0.5, { type: 'triangle', vol: 0.06, vers: 520, filtre: 900 }),
    victoire: () => [784, 988, 1175, 1568, 1319, 1568].forEach((f, i) => note(f, 0.32, { type: 'triangle', vol: 0.08, retard: i * 0.13 })),
    defaite: () => [330, 294, 262, 196].forEach((f, i) => note(f, 0.36, { vol: 0.09, retard: i * 0.2 })),
    tic: () => note(1300, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(660, 0.12, { vol: 0.09 }); note(880, 0.16, { vol: 0.09, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.07 }); note(587, 0.16, { vol: 0.07, retard: 0.1 }); },

    document.querySelectorAll('.btn-son').forEach((b) => {

  // ---------------------------------------------------------------------
  //  Dessins : outils
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }

  function rr(c, x, y, w, h, r) {

    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }

  function cadre(c, x, y, r, f) { c.save(); c.translate(x, y); c.scale(r / 50, r / 50); c.lineJoin = 'round'; c.lineCap = 'round'; f(); c.restore(); }

  function objet(c, id, x, y, r) {
    cadre(c, x, y, r, () => {
      c.lineWidth = 3;
      switch (id) {
        case 0: // flocon
          c.strokeStyle = '#4aa8e8'; c.lineWidth = 6;
          for (let i = 0; i < 6; i++) {
            c.save(); c.rotate(i * Math.PI / 3);
            c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -40); c.moveTo(0, -24); c.lineTo(-11, -34); c.moveTo(0, -24); c.lineTo(11, -34); c.stroke();
            c.restore();
          }
          c.fillStyle = '#bfe4ff'; rond(c, 0, 0, 7); c.fill();
          break;
        case 1: // sapin
          c.fillStyle = '#6b3f22'; c.fillRect(-7, 26, 14, 16);
          c.fillStyle = '#2f8f4a'; poly(c, [[0, -40], [-22, -8], [22, -8]]); c.fill();
          poly(c, [[0, -24], [-30, 12], [30, 12]]); c.fill();
          poly(c, [[0, -6], [-38, 30], [38, 30]]); c.fill();
          c.fillStyle = '#ffd34a'; etoile(c, 0, -42, 10, 4, 5); c.fill();
          c.fillStyle = '#e2483d'; rond(c, -12, 8, 4); c.fill(); rond(c, 14, 22, 4); c.fill();
          break;
        case 2: // bonhomme de neige
          c.fillStyle = '#fff'; c.strokeStyle = '#9ab'; rond(c, 0, 18, 26); c.fill(); c.stroke(); rond(c, 0, -20, 18); c.fill(); c.stroke();
          c.fillStyle = '#222'; rond(c, -6, -24, 2.8); c.fill(); rond(c, 6, -24, 2.8); c.fill();
          c.fillStyle = '#f08a2a'; poly(c, [[0, -19], [16, -16], [0, -14]]); c.fill();
          c.fillStyle = '#d63a3a'; c.fillRect(-18, -6, 36, 7); c.fillRect(8, -2, 7, 18);
          c.fillStyle = '#222'; rond(c, 0, 12, 2.6); c.fill(); rond(c, 0, 22, 2.6); c.fill();
          break;
        case 3: // bonnet
          c.fillStyle = '#3a6fd8'; c.beginPath(); c.moveTo(-34, 16); c.quadraticCurveTo(-30, -36, 0, -36); c.quadraticCurveTo(30, -36, 34, 16); c.closePath(); c.fill();
          c.fillStyle = '#e8eef8'; rr(c, -38, 10, 76, 18, 8); c.fill();
          c.fillStyle = '#fff'; rond(c, 0, -38, 11); c.fill();
          c.strokeStyle = '#2a50a8'; c.beginPath(); c.moveTo(-14, -26); c.lineTo(-18, 8); c.moveTo(14, -26); c.lineTo(18, 8); c.stroke();
          break;
        case 4: // moufle
          c.fillStyle = '#d63a3a'; c.beginPath(); c.moveTo(-18, 30); c.lineTo(-20, -12); c.quadraticCurveTo(-20, -38, 4, -38); c.quadraticCurveTo(24, -38, 22, -8); c.lineTo(22, 30); c.closePath(); c.fill();
          ell(c, -24, 2, 10, 15, -0.5); c.fill();
          c.fillStyle = '#fff'; rr(c, -22, 24, 48, 16, 6); c.fill();
          c.fillStyle = '#ffd0d0'; etoile(c, 2, -10, 9, 4, 5); c.fill();
          break;
        case 5: // boule de Noël
          c.fillStyle = '#c9a03a'; c.fillRect(-8, -40, 16, 10);
          c.strokeStyle = '#c9a03a'; c.beginPath(); c.arc(0, -44, 5, 0, Math.PI * 2); c.stroke();
          c.fillStyle = '#d6303a'; rond(c, 0, 4, 34); c.fill();
          c.strokeStyle = '#ffd34a'; c.lineWidth = 4; c.beginPath(); c.moveTo(-32, 0); c.quadraticCurveTo(0, 12, 32, 0); c.stroke();
          c.fillStyle = '#ffffffaa'; ell(c, -12, -10, 8, 5, -0.6); c.fill();
          break;
        case 6: // bougie
          c.fillStyle = '#fff4dc'; rr(c, -12, -6, 24, 44, 4); c.fill();
          c.fillStyle = '#e2483d'; c.fillRect(-12, 6, 24, 5); c.fillRect(-12, 20, 24, 5);
          c.fillStyle = '#ffb02a'; c.beginPath(); c.moveTo(0, -42); c.quadraticCurveTo(12, -22, 0, -12); c.quadraticCurveTo(-12, -22, 0, -42); c.fill();
          c.fillStyle = '#fff1a8'; ell(c, 0, -20, 4, 7); c.fill();
          break;
        case 7: // chaussette de Noël
          c.fillStyle = '#d63a3a'; c.beginPath(); c.moveTo(-14, -30); c.lineTo(14, -30); c.lineTo(14, 10); c.quadraticCurveTo(14, 36, -12, 36); c.lineTo(-30, 36); c.quadraticCurveTo(-40, 24, -26, 14); c.lineTo(-14, 8); c.closePath(); c.fill();
          c.fillStyle = '#fff'; rr(c, -20, -42, 40, 16, 6); c.fill();
          c.fillStyle = '#2f8f4a'; rond(c, -2, 12, 5); c.fill();
          break;
        case 8: // sucre d'orge
          c.lineWidth = 14; c.strokeStyle = '#fff';
          c.beginPath(); c.moveTo(10, 40); c.lineTo(10, -16); c.arc(-6, -16, 16, 0, Math.PI, true); c.stroke();
          c.strokeStyle = '#e2283a'; c.lineWidth = 14; c.setLineDash([7, 9]);
          c.beginPath(); c.moveTo(10, 40); c.lineTo(10, -16); c.arc(-6, -16, 16, 0, Math.PI, true); c.stroke(); c.setLineDash([]);
          break;
        case 9: // étoile de Noël
          c.fillStyle = '#ffcf2a'; c.strokeStyle = '#c08a10'; etoile(c, 0, 2, 40, 17, 5); c.fill(); c.stroke();
          c.fillStyle = '#fff6b8'; etoile(c, -4, -2, 12, 5, 5); c.fill();

        case 10: // parasol
          c.strokeStyle = '#7a5a3a'; c.lineWidth = 4; c.beginPath(); c.moveTo(0, -20); c.lineTo(6, 42); c.stroke();
          for (let i = 0; i < 4; i++) { c.fillStyle = i % 2 ? '#fff' : '#ff7a2a'; c.beginPath(); c.moveTo(0, -30); c.arc(0, -4, 42, Math.PI + i * Math.PI / 4, Math.PI + (i + 1) * Math.PI / 4); c.closePath(); c.fill(); }
          break;
        case 11: // glace
          c.fillStyle = '#d8a050'; poly(c, [[-16, -2], [16, -2], [0, 42]]); c.fill();
          c.strokeStyle = '#a8742a'; c.lineWidth = 2; c.beginPath(); c.moveTo(-10, 8); c.lineTo(8, 28); c.moveTo(10, 8); c.lineTo(-6, 26); c.stroke();
          c.fillStyle = '#ff9ac0'; rond(c, -8, -12, 14); c.fill(); c.fillStyle = '#9ae0a0'; rond(c, 9, -14, 14); c.fill();
          c.fillStyle = '#fff4c4'; rond(c, 0, -30, 13); c.fill();
          break;
        case 12: // pastèque
          c.fillStyle = '#2f9a3a'; c.beginPath(); c.arc(0, -10, 44, 0, Math.PI); c.closePath(); c.fill();
          c.fillStyle = '#eaffd8'; c.beginPath(); c.arc(0, -10, 38, 0, Math.PI); c.closePath(); c.fill();
          c.fillStyle = '#f04a5a'; c.beginPath(); c.arc(0, -10, 33, 0, Math.PI); c.closePath(); c.fill();
          c.fillStyle = '#222'; [[-14, 0], [0, 6], [14, 0], [-6, 14], [8, 14]].forEach((p) => { ell(c, p[0], p[1], 2.5, 4); c.fill(); });
          break;
        case 13: // coquillage
          c.fillStyle = '#ffc0a0'; c.strokeStyle = '#d07a5a'; c.beginPath(); c.moveTo(0, 34); c.lineTo(-38, -6); c.quadraticCurveTo(0, -50, 38, -6); c.closePath(); c.fill(); c.stroke();
          for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(0, 32); c.lineTo(i * 15, -24 + Math.abs(i) * 6); c.stroke(); }
          c.fillStyle = '#ffc0a0'; rr(c, -10, 28, 20, 12, 4); c.fill(); c.stroke();
          break;
        case 14: // soleil
          c.strokeStyle = '#ff9a1a'; c.lineWidth = 6;
          for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5; c.beginPath(); c.moveTo(Math.cos(a) * 28, Math.sin(a) * 28); c.lineTo(Math.cos(a) * 44, Math.sin(a) * 44); c.stroke(); }
          c.fillStyle = '#ffd02a'; rond(c, 0, 0, 24); c.fill();
          c.fillStyle = '#c86a10'; rond(c, -8, -4, 3); c.fill(); rond(c, 8, -4, 3); c.fill();
          c.strokeStyle = '#c86a10'; c.lineWidth = 3; c.beginPath(); c.arc(0, 4, 9, 0.3, Math.PI - 0.3); c.stroke();
          break;
        case 15: // palmier
          c.strokeStyle = '#9a6a3a'; c.lineWidth = 10; c.beginPath(); c.moveTo(4, 44); c.quadraticCurveTo(10, 0, -2, -24); c.stroke();
          c.fillStyle = '#3aa848';
          [-2.6, -1.9, -1.2, -0.4, 0.4].forEach((a) => { c.save(); c.translate(-2, -26); c.rotate(a); ell(c, 22, 0, 24, 7); c.fill(); c.restore(); });
          c.fillStyle = '#7a4a1a'; rond(c, -8, -20, 5); c.fill(); rond(c, 4, -18, 5); c.fill();
          break;
        default: // tong
          c.fillStyle = '#2ab0d8'; ell(c, 0, 4, 20, 40); c.fill();
          c.fillStyle = '#ffe24a'; ell(c, 0, 4, 15, 34); c.fill();
          c.strokeStyle = '#ff5a8a'; c.lineWidth = 7; c.beginPath(); c.moveTo(-17, 4); c.quadraticCurveTo(0, -26, 17, 4); c.stroke();

  }

  // ---------------------------------------------------------------------
  //  Jouets (0 à 11) : questions « l'ombre » et jouets maudits des pièges
  //  sil : ombre noire ; maudit : yeux qui luisent.
  // ---------------------------------------------------------------------

  function jouet(c, id, x, y, r, opt) {
    opt = opt || {};
    const sil = !!opt.sil, maudit = !!opt.maudit;
    const P = (col) => (sil ? '#140c1a' : col);
    const yeux = (pts, rr2) => {
      if (sil) return;
      pts.forEach((p) => {
        if (maudit) { c.fillStyle = '#ff2a1a'; c.shadowColor = '#ff3a1a'; c.shadowBlur = 10; rond(c, p[0], p[1], rr2 * 1.1); c.fill(); c.shadowBlur = 0; c.fillStyle = '#ffe080'; rond(c, p[0], p[1], rr2 * 0.4); c.fill(); }
        else { c.fillStyle = '#1a1018'; rond(c, p[0], p[1], rr2); c.fill(); c.fillStyle = '#fff'; rond(c, p[0] + rr2 * 0.3, p[1] - rr2 * 0.3, rr2 * 0.35); c.fill(); }
      });
    };
    cadre(c, x, y, r, () => {
      c.lineWidth = 3;
      switch (id) {
        case 0: // poupée
          c.fillStyle = P('#c84a6a'); poly(c, [[0, -12], [-28, 42], [28, 42]]); c.fill();
          c.fillStyle = P('#f2d0b0'); rond(c, 0, -24, 16); c.fill();
          c.fillStyle = P('#8a4a1a'); c.beginPath(); c.arc(0, -28, 18, Math.PI, 0); c.fill(); rr(c, -20, -30, 8, 28, 4); c.fill(); rr(c, 12, -30, 8, 28, 4); c.fill();
          if (!sil) { c.fillStyle = '#fff'; c.fillRect(-3, 0, 6, 30); }
          yeux([[-6, -24], [6, -24]], 3.2);
          if (!sil) { c.strokeStyle = '#8a2a2a'; c.lineWidth = 2; c.beginPath(); c.arc(0, -17, 4, 0.2, Math.PI - 0.2); c.stroke(); }
          break;
        case 1: // ours
          c.fillStyle = P('#a8743a'); rond(c, -22, -36, 10); c.fill(); rond(c, 22, -36, 10); c.fill();
          rond(c, 0, 18, 26); c.fill(); rond(c, 0, -20, 22); c.fill();
          rond(c, -26, 10, 9); c.fill(); rond(c, 26, 10, 9); c.fill(); rond(c, -16, 40, 10); c.fill(); rond(c, 16, 40, 10); c.fill();
          if (!sil) { c.fillStyle = '#e8c28a'; ell(c, 0, -12, 10, 8); c.fill(); ell(c, 0, 20, 14, 16); c.fill(); c.fillStyle = '#3a2210'; ell(c, 0, -15, 4, 3); c.fill(); }
          yeux([[-8, -24], [8, -24]], 3);
          if (!sil) { c.strokeStyle = '#5a3a1a'; c.lineWidth = 1.5; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(-4, 6); c.lineTo(4, 34); c.stroke(); c.setLineDash([]); }
          break;
        case 2: // soldat
          c.fillStyle = P('#1a1a3a'); rr(c, -13, -48, 26, 22, 4); c.fill();
          c.fillStyle = P('#f2d0b0'); rr(c, -11, -28, 22, 18, 6); c.fill();
          c.fillStyle = P('#c82a2a'); rr(c, -16, -10, 32, 30, 4); c.fill();
          c.fillStyle = P('#2a2a5a'); c.fillRect(-14, 20, 11, 24); c.fillRect(3, 20, 11, 24);
          c.fillStyle = P('#c82a2a'); c.fillRect(-23, -8, 7, 24); c.fillRect(16, -8, 7, 24);
          if (!sil) { c.fillStyle = '#ffd34a'; c.fillRect(-13, -30, 26, 3); rond(c, 0, -2, 2.5); c.fill(); rond(c, 0, 8, 2.5); c.fill(); c.fillStyle = '#fff'; c.fillRect(-16, 14, 32, 4); }
          yeux([[-5, -20], [5, -20]], 2.4);
          if (!sil) { c.fillStyle = '#e04a4a'; rond(c, -7, -14, 2.5); c.fill(); rond(c, 7, -14, 2.5); c.fill(); }
          break;
        case 3: // toupie
          c.fillStyle = P('#7a4a2a'); c.fillRect(-4, -46, 8, 16);
          c.fillStyle = P('#e2483d'); c.beginPath(); c.moveTo(-36, -18); c.quadraticCurveTo(0, -40, 36, -18); c.lineTo(0, 40); c.closePath(); c.fill();
          if (!sil) { c.fillStyle = '#ffd34a'; c.beginPath(); c.moveTo(-30, -12); c.quadraticCurveTo(0, -24, 30, -12); c.lineTo(22, 0); c.quadraticCurveTo(0, -10, -22, 0); c.closePath(); c.fill(); c.fillStyle = '#4a8fe0'; c.beginPath(); c.moveTo(-16, 12); c.quadraticCurveTo(0, 4, 16, 12); c.lineTo(10, 22); c.quadraticCurveTo(0, 16, -10, 22); c.closePath(); c.fill(); }
          if (maudit) yeux([[-10, -16], [10, -16]], 4);
          break;
        case 4: // cheval à bascule
          c.strokeStyle = P('#7a4a2a'); c.lineWidth = 7; c.beginPath(); c.arc(0, -40, 80, Math.PI * 0.32, Math.PI * 0.68); c.stroke();
          c.fillStyle = P('#d8b080'); ell(c, -2, 2, 30, 14); c.fill();
          c.fillRect(-24, 6, 6, 26); c.fillRect(16, 6, 6, 26);
          c.beginPath(); c.moveTo(18, -6); c.lineTo(28, -34); c.lineTo(44, -26); c.lineTo(40, -18); c.lineTo(30, -16); c.lineTo(26, 0); c.closePath(); c.fill();
          c.fillStyle = P('#6b3a1a'); c.beginPath(); c.moveTo(22, -12); c.quadraticCurveTo(18, -36, 30, -38); c.lineTo(24, -6); c.closePath(); c.fill();
          c.strokeStyle = P('#6b3a1a'); c.lineWidth = 5; c.beginPath(); c.moveTo(-30, -2); c.quadraticCurveTo(-44, 6, -40, 22); c.stroke();
          if (!sil) { c.fillStyle = '#c82a2a'; c.fillRect(-12, -10, 16, 8); }
          yeux([[34, -28]], 2.6);
          break;
        case 5: // boîte à surprise
          c.fillStyle = P('#4a8fe0'); c.fillRect(-26, 8, 52, 36);
          c.fillStyle = P('#2a5ab0'); c.fillRect(-30, 2, 60, 8);
          c.strokeStyle = P('#9a9aa8'); c.lineWidth = 4; c.beginPath(); for (let i = 0; i < 5; i++) { c.lineTo(i % 2 ? 9 : -9, 2 - i * 5); } c.stroke();
          c.fillStyle = P('#f2d0b0'); rond(c, 0, -32, 14); c.fill();
          c.fillStyle = P('#e2483d'); poly(c, [[-14, -40], [0, -54], [14, -40]]); c.fill();
          if (!sil) { c.fillStyle = '#ffd34a'; etoile(c, 0, 26, 9, 4, 5); c.fill(); c.fillStyle = '#e2483d'; rond(c, 0, -28, 3); c.fill(); }
          yeux([[-5, -34], [5, -34]], 2.5);
          break;
        case 6: // clown de porcelaine
          c.fillStyle = P('#8a4ad0'); poly(c, [[-22, 0], [22, 0], [26, 44], [-26, 44]]); c.fill();
          c.fillStyle = P('#fff'); ell(c, 0, 0, 30, 9); c.fill();
          c.fillStyle = P('#f8f0f0'); rond(c, 0, -22, 17); c.fill();
          c.fillStyle = P('#ff7a2a'); rond(c, -18, -26, 8); c.fill(); rond(c, 18, -26, 8); c.fill();
          c.fillStyle = P('#2ab0d8'); poly(c, [[-12, -36], [0, -60], [12, -36]]); c.fill();
          if (!sil) { c.fillStyle = '#e2283a'; rond(c, 0, -20, 4); c.fill(); c.strokeStyle = '#e2283a'; c.lineWidth = 2.5; c.beginPath(); c.arc(0, -16, 7, 0.3, Math.PI - 0.3); c.stroke(); c.fillStyle = '#ffd34a'; rond(c, 0, 16, 3); c.fill(); rond(c, 0, 28, 3); c.fill(); }
          yeux([[-6, -26], [6, -26]], 2.6);
          break;
        case 7: // lapin mécanique
          c.fillStyle = P('#e8e0d8'); ell(c, -8, -46, 6, 18, -0.2); c.fill(); ell(c, 8, -46, 6, 18, 0.2); c.fill();
          ell(c, 0, 14, 24, 28); c.fill(); rond(c, 0, -22, 16); c.fill();
          rond(c, -14, 40, 8); c.fill(); rond(c, 14, 40, 8); c.fill();
          c.fillStyle = P('#b8a020'); c.fillRect(24, 6, 12, 5); rond(c, 40, 2, 7); c.fill(); rond(c, 40, 16, 7); c.fill();
          if (!sil) { c.fillStyle = '#ffb0c0'; ell(c, -8, -46, 3, 12, -0.2); c.fill(); ell(c, 8, -46, 3, 12, 0.2); c.fill(); c.fillStyle = '#ff8aa0'; rond(c, 0, -16, 3); c.fill(); }
          yeux([[-6, -24], [6, -24]], 2.6);
          break;
        case 8: // ballerine de boîte à musique
          c.fillStyle = P('#8a5a2a'); rr(c, -30, 32, 60, 14, 3); c.fill();
          c.strokeStyle = P('#f2d0b0'); c.lineWidth = 4; c.beginPath(); c.moveTo(0, -20); c.lineTo(-18, -44); c.moveTo(0, -20); c.lineTo(18, -44); c.moveTo(0, 8); c.lineTo(0, 32); c.stroke();
          c.fillStyle = P('#ffb0d0'); ell(c, 0, 8, 28, 8); c.fill(); rr(c, -7, -18, 14, 26, 5); c.fill();
          c.fillStyle = P('#f2d0b0'); rond(c, 0, -28, 9); c.fill();
          c.fillStyle = P('#4a2a1a'); rond(c, 0, -36, 6); c.fill();
          yeux([[-3, -28], [3, -28]], 1.7);
          break;
        case 9: // petit train
          c.fillStyle = P('#2f8f4a'); c.fillRect(-36, -10, 44, 30);
          c.fillStyle = P('#e2483d'); c.fillRect(4, -30, 30, 50); c.fillStyle = P('#1a1a1a'); c.fillRect(-30, -28, 12, 20);
          c.fillStyle = P('#ffd34a'); c.fillRect(-40, 18, 80, 6);
          c.fillStyle = P('#2a2a2a'); [-26, -6, 22].forEach((wx) => { rond(c, wx, 30, 10); c.fill(); });
          if (!sil) { c.fillStyle = '#bfe4ff'; c.fillRect(10, -24, 18, 14); c.fillStyle = '#999'; [-26, -6, 22].forEach((wx) => { rond(c, wx, 30, 4); c.fill(); }); }
          if (maudit) yeux([[13, -17], [25, -17]], 3);

          c.strokeStyle = P('#7a4a2a'); c.lineWidth = 5; c.beginPath(); c.moveTo(-30, -50); c.lineTo(30, -50); c.moveTo(0, -56); c.lineTo(0, -44); c.stroke();
          c.strokeStyle = P('#cfc6b5'); c.lineWidth = 1.5; c.beginPath(); c.moveTo(-28, -50); c.lineTo(-22, 0); c.moveTo(28, -50); c.lineTo(22, 0); c.moveTo(0, -46); c.lineTo(0, -34); c.stroke();
          c.fillStyle = P('#e8b070'); rond(c, 0, -24, 12); c.fill();
          c.fillStyle = P('#3a8ad0'); rr(c, -12, -12, 24, 30, 4); c.fill();

          yeux([[-4, -25], [4, -25]], 2.2);

          c.fillStyle = P('#e2483d'); rond(c, 0, -46, 4); c.fill();
          c.fillStyle = P('#9aa8c0'); rr(c, -16, -34, 32, 24, 4); c.fill();
          c.fillStyle = P('#7a88a0'); rr(c, -20, -8, 40, 32, 4); c.fill();
          c.fillRect(-30, -6, 8, 24); c.fillRect(22, -6, 8, 24); c.fillRect(-14, 24, 10, 18); c.fillRect(4, 24, 10, 18);
          if (!sil) { c.fillStyle = '#ffd34a'; c.fillRect(-10, 2, 8, 6); c.fillStyle = '#4ad0a0'; c.fillRect(2, 2, 8, 6); }
          yeux([[-7, -23], [7, -23]], 3.2);
      }
    });
  }

  // ---------------------------------------------------------------------
  //  Friandises (0 à 5), paquets, sapin et boules
  // ---------------------------------------------------------------------

  function friandise(c, id, x, y, r) {
    cadre(c, x, y, r, () => {
      c.lineWidth = 3;
      if (id === 0) { // sucre d'orge
        c.lineWidth = 13; c.strokeStyle = '#fff'; c.beginPath(); c.moveTo(8, 40); c.lineTo(8, -14); c.arc(-8, -14, 16, 0, Math.PI, true); c.stroke();
        c.strokeStyle = '#e2283a'; c.setLineDash([7, 8]); c.beginPath(); c.moveTo(8, 40); c.lineTo(8, -14); c.arc(-8, -14, 16, 0, Math.PI, true); c.stroke(); c.setLineDash([]);
      } else if (id === 1) { // chocolat emballé
        c.fillStyle = '#7a3a1a'; rr(c, -30, -22, 60, 44, 6); c.fill();
        c.fillStyle = '#d8b04a'; rr(c, -30, -22, 26, 44, 6); c.fill();

  // Emplacements des boules sur le sapin (fractions de la hauteur), 14 au total.
  const SLOTS = [[0, -0.33], [-0.08, -0.2], [0.09, -0.18], [-0.15, -0.04], [0.02, -0.06], [0.17, -0.02],

  // Le Pantin de bois : base des pieds en (x, y), hauteur h.

  // Couronne dorée du chef du salon.

  // Petits symboles des portes (aucun chiffre) : étoile, sapin, cloche, flocon, cœur, lune, houx, bougie.

  // ---------------------------------------------------------------------
  //  Le calendrier : cadre, portes (jeu, écran titre, tutoriels)
  // ---------------------------------------------------------------------

  function theme() { return THEMES[prog.theme] || THEMES[0]; }

  // Une porte : x, y (coin), w, h ; i (numéro, pour son symbole) ; etat : objet.
  // etat : { po, pv, pk, px, grande, eclairee, ouverture (0 à 1), vise, survol }
  function porte(c, x, y, w, h, i, st, th) {
    const m = Math.max(2, w * 0.06), rx = x + m, ry = y + m, rw = w - 2 * m, rh = h - 2 * m;
    const ouvert = st.po !== -1;

    if (ouvert) {

      if (st.po >= 0 && st.po < PLACES) {
        c.fillStyle = COUL[st.po] + '55'; rr(c, rx, ry, rw, rh, rw * 0.12); c.fill();
        c.globalAlpha = 0.55; friandise(c, st.pk, cx, cy, r * 0.75); c.globalAlpha = 1;
        c.strokeStyle = COUL[st.po]; c.lineWidth = Math.max(2, rw * 0.05); rr(c, rx + 1, ry + 1, rw - 2, rh - 2, rw * 0.12); c.stroke();
      } else if (st.po === 9) {
        c.fillStyle = '#3a0a1088'; rr(c, rx, ry, rw, rh, rw * 0.12); c.fill();
        jouet(c, st.pk, cx, cy, r * 1.05, { maudit: true });

      }
    }
    const k = ouvert ? (st.ouverture === undefined ? 1 : st.ouverture) : 0;
    // battant (pivote sur la gauche quand la porte s'ouvre)
    const lw = rw * (1 - k * 0.86);
    if (lw > 1) {
      const coulA = st.grande ? '#d8a830' : (i % 2 ? th.a : th.b);
      c.fillStyle = coulA; rr(c, rx, ry, lw, rh, rw * 0.12); c.fill();
      c.strokeStyle = th.fonce; c.lineWidth = Math.max(1.5, rw * 0.035); rr(c, rx, ry, lw, rh, rw * 0.12); c.stroke();
      if (k < 0.5) {
        c.strokeStyle = '#ffffff22'; c.lineWidth = Math.max(1, rw * 0.025); rr(c, rx + rw * 0.12, ry + rh * 0.1, lw - rw * 0.24, rh * 0.8, rw * 0.08); c.stroke();

          c.beginPath(); c.ellipse(rx + lw * 0.38, ry + rh * 0.4, lw * 0.14, rh * 0.07, -0.4, 0, Math.PI * 2); c.fill();
          c.beginPath(); c.ellipse(rx + lw * 0.62, ry + rh * 0.4, lw * 0.14, rh * 0.07, 0.4, 0, Math.PI * 2); c.fill();
        }
        if (st.grande) {
          c.strokeStyle = '#fff6c0'; c.lineWidth = Math.max(2, rw * 0.04); rr(c, rx + 2, ry + 2, lw - 4, rh - 4, rw * 0.1); c.stroke();
          etoile(c, rx + lw * 0.2, ry + rh * 0.18, rw * 0.08, rw * 0.03, 4); c.fillStyle = '#fffbe0'; c.fill();
          etoile(c, rx + lw * 0.8, ry + rh * 0.82, rw * 0.07, rw * 0.03, 4); c.fill();
        }
      }
    }
    // porte éclairée par une bougie : on voit à travers

      const cx = rx + rw / 2, cy = ry + rh * 0.48, r = Math.min(rw, rh) * 0.3;

      }
    }
    if (st.vise || st.survol) {
      c.strokeStyle = st.vise ? '#ffe7a0' : '#ffffffaa'; c.lineWidth = Math.max(3, rw * 0.07);
      rr(c, x + 1, y + 1, w - 2, h - 2, rw * 0.14); c.stroke();
    }
  }

  // Géométrie des portes dans une zone (w × h) : 4 colonnes.
  function geometrie(nbPortes, x0, y0, w, h) {

  // Cadre du calendrier : maison de bois, toit, guirlande.
  function cadreCalendrier(c, g, th, t) {

    c.fillStyle = '#0006'; rr(c, x + 6, y + 10, w, h, 14); c.fill();
    c.fillStyle = th.bois; rr(c, x, y, w, h, 14); c.fill();
    c.strokeStyle = th.fonce; c.lineWidth = 4; rr(c, x, y, w, h, 14); c.stroke();

    for (let i = 0; i <= 10; i++) {
      const lx = x + 10 + (w - 20) * i / 10, ly = y + 5 + Math.sin(i * 1.3) * 2;
      const on = Math.sin((t || 0) / 300 + i * 1.7) > -0.2;

  // ---------------------------------------------------------------------
  //  Écran titre : le grenier, le calendrier, le Pantin
  // ---------------------------------------------------------------------

  let flocons = [];
  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    const th = theme();
    let g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#1a0e22'); g.addColorStop(0.6, '#2a1624'); g.addColorStop(1, '#120a10');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // poutres du toit
    c.fillStyle = '#2e1a14';
    poly(c, [[0, h * 0.02], [w * 0.5, -h * 0.12], [w * 0.5, -h * 0.06], [0, h * 0.09]]); c.fill();
    poly(c, [[w, h * 0.02], [w * 0.5, -h * 0.12], [w * 0.5, -h * 0.06], [w, h * 0.09]]); c.fill();
    c.fillRect(w * 0.06, 0, w * 0.035, h);
    c.fillRect(w * 0.905, 0, w * 0.035, h);

    c.fillStyle = '#0e1a3a'; rond(c, lx, ly, lr); c.fill();
    c.save(); rond(c, lx, ly, lr); c.clip();
    c.fillStyle = '#e8eef8'; rond(c, lx - lr * 0.35, ly - lr * 0.4, lr * 0.22); c.fill();
    c.fillStyle = '#fff';
    for (let i = 0; i < 26; i++) { const al = graineHasard(i * 13 + 3); const fx = lx - lr + al() * lr * 2, fy = ly - lr + ((al() * lr * 2 + t * 0.02 * (0.5 + al())) % (lr * 2)); rond(c, fx, fy, 1.2 + al() * 1.5); c.fill(); }
    c.restore();
    c.strokeStyle = '#5a3a24'; c.lineWidth = lr * 0.16; rond(c, lx, ly, lr); c.stroke();
    c.lineWidth = lr * 0.08; c.beginPath(); c.moveTo(lx - lr, ly); c.lineTo(lx + lr, ly); c.moveTo(lx, ly - lr); c.lineTo(lx, ly + lr); c.stroke();
    // halo de bougie
    const cy0 = h * 0.6;
    g = c.createRadialGradient(w * 0.5, cy0, 10, w * 0.5, cy0, Math.max(w, h) * 0.55);
    g.addColorStop(0, '#ff9a3a40'); g.addColorStop(1, '#0000');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // plancher
    c.fillStyle = '#2a1810'; c.fillRect(0, h * 0.86, w, h * 0.14);
    c.strokeStyle = '#1a0e08'; c.lineWidth = 2;
    for (let i = 0; i < 8; i++) { c.beginPath(); c.moveTo(0, h * (0.87 + i * 0.02)); c.lineTo(w, h * (0.87 + i * 0.02)); c.stroke(); }
    // le grand calendrier
    const large = w > h * 1.05;
    // Portrait : au centre ; paysage : à gauche, à côté des boutons.
    const cw = large ? Math.min(w * 0.2, h * 0.5) : Math.min(w * 0.74, h * 0.5), ch = cw * 1.05;
    const cx0 = large ? Math.max(w * 0.11, w / 2 - 340 - cw) : w / 2 - cw / 2 - cw * 0.06, cyTop = h * (large ? 0.3 : 0.33);

    c.fillStyle = th.bois; poly(c, [[cx0 - cw * 0.02, cyTop + 4], [mx, cyTop - cw * 0.16], [cx0 + cw * 1.02, cyTop + 4]]); c.fill();

        const gl = c.createRadialGradient(p[0] + gg.pw * 0.6, p[1] + gg.ph * 0.5, 2, p[0] + gg.pw * 0.6, p[1] + gg.ph * 0.5, gg.pw);
        gl.addColorStop(0, '#ffcf6a55'); gl.addColorStop(1, '#0000'); c.fillStyle = gl; c.fillRect(p[0] - gg.pw * 0.4, p[1] - gg.ph * 0.4, gg.pw * 1.8, gg.ph * 1.8);
      } else porte(c, p[0], p[1], gg.pw, gg.ph, i, { po: -1, px: i === 2 ? 1 : 0, grande: i === 10 }, th);

    // le Pantin de bois qui se penche sur la droite du calendrier
    c.save();
    c.translate(cx0 + cw + cw * 0.06, cyTop + ch * 0.92);
    c.rotate(-0.1);
    pantin(c, 0, 0, ch * 0.66, { lueur: true, bouche: 0.3 + 0.2 * Math.sin(t / 700), bras: 0.4 });
    c.restore();

    jouet(c, 1, cx0 - cw * 0.05, h * 0.84, cw * 0.11, {});
    jouet(c, 3, cx0 + cw * 0.3, h * 0.865, cw * 0.07, {});
    friandise(c, 0, cx0 + cw * 0.62, h * 0.86, cw * 0.06);
    paquet(c, cx0 + cw * 0.9, h * 0.85, cw * 0.08, [0, 0, 3]);
    // bougies à gauche
    (large ? [[0.84, 0.8, 1], [0.9, 0.83, 0.75]] : [[0.12, 0.8, 1], [0.18, 0.83, 0.75]]).forEach((b, j) => {
      const bx = w * b[0], by = h * b[1], k = Math.min(w, h) * 0.05 * b[2];

  }

  let rafTitre = 0;

  //  Partie : état de l'écran

  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)

  let finManche = 0;

  function afficherEcran(nom) {

    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';

  }

  function toast(texte, duree) {

  }

  // Cartes des 4 places, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const haut = document.createElement('div'); haut.className = 'haut';
      const cv = document.createElement('canvas'); cv.className = 'visage'; cv.width = 80; cv.height = 80;
      const pts = document.createElement('span'); pts.className = 'pts';
      haut.append(cv, pts);
      const nom = document.createElement('span'); nom.className = 'nom';
      const bas = document.createElement('div'); bas.className = 'bas';
      const marches = document.createElement('span'); marches.className = 'marches';
      const panier = document.createElement('span'); panier.className = 'panier';
      const flamme = document.createElement('span'); flamme.className = 'flamme'; flamme.innerHTML = ICONE_FLAMME;
      bas.append(marches, panier, flamme);

      d.append(cv, nom);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : pseudo d'un vrai joueur en ligne, sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Nom d'une place dans les messages : pseudo, sinon la couleur de son bonnet.
  function nomMessage(s) {
    const info = siegesActuels()[s] || {};
    return info.humain && !info.moi && info.nom ? info.nom : tr('coul.' + s);
  }
  function remplirNom(el, role, texte) {
    if (el.dataset.role === role && el.dataset.nom === texte) return;
    el.dataset.role = role; el.dataset.nom = texte;
    el.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    el.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const g = e ? e.g[s] : 0;
      const pts = d.querySelector('.pts');
      const cleP = String(g);
      if (pts.dataset.v !== cleP) { pts.dataset.v = cleP; pts.innerHTML = ICONE_BONBON; const sp = document.createElement('span'); sp.textContent = nb(g); pts.appendChild(sp); }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const fige = !!(e && e.fz[s]);
      d.classList.toggle('figee', fige);
      d.classList.toggle('a-bougie', !!(e && O.actif(e, 'B') && e.bg[s] > 0));
      const cv = d.querySelector('canvas.visage'), cleV = (fige ? 'f' : '') + (e && e.m[s] >= (e.mar - 1) && O.actif(e, 'P') ? 'p' : '');
      if (cv.dataset.v !== cleV) { cv.dataset.v = cleV; const c = cv.getContext('2d'); c.clearRect(0, 0, 80, 80); visage(c, s, 40, 42, 38, { fige: fige, peur: cleV.indexOf('p') >= 0 }); }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (e.ph === 'q') return tr('tour.question');
      if (modeBougie) return tr('action.bougieAide');
      return e.nt > 0 ? tr('tour.encore', { n: e.pa[s] }) : tr('tour.toi');
    }
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (vue && O.actif(vue, 'V') && vue.sac > 0) info += ' · ' + tr('jeu.sac', { n: vue.sac });
    if (vue) info += ' · ' + tr('jeu.portes', { n: O.fermees(vue).length });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    majActions();
  }

  function monTourChoix() {
    return !!(partie && vue && partie.phase === 'jeu' && !attenteTuto && !enPause && partie.monTour() && vue.ph === 'c');
  }

  function majActions() {
    const e = vue, moi = partie ? partie.siege : -1;
    const garder = $('btn-garder'), bougie = $('btn-bougie');
    const peut = monTourChoix();
    const n = e && moi >= 0 ? e.pa[moi] : 0;
    const tg = tr('action.garder', { n: n });
    const cleG = tg + '|' + (peut && e.nt > 0);
    if (garder.dataset.v !== cleG) {
      garder.dataset.v = cleG;
      garder.innerHTML = ICONE_PANIER;
      const sp = document.createElement('span'); sp.textContent = tg; garder.appendChild(sp);
    }
    garder.disabled = !(peut && e.nt > 0);
    const avecBougie = !!(e && O.actif(e, 'B'));
    bougie.hidden = !avecBougie;
    if (avecBougie) {
      const reste = moi >= 0 ? e.bg[moi] : 0;
      if (!peut || reste <= 0) modeBougie = false;
      const tb = modeBougie ? tr('action.bougieAnnuler') : tr('action.bougie', { n: reste });
      if (bougie.dataset.v !== tb) { bougie.dataset.v = tb; bougie.innerHTML = ICONE_BOUGIE; const sp = document.createElement('span'); sp.textContent = tb; bougie.appendChild(sp); }
      bougie.disabled = !(peut && reste > 0);
      bougie.classList.toggle('mode', modeBougie);
    } else modeBougie = false;
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    majMemoire();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('cal'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    const th = theme();
    geo = geometrie(vue.nb, 0, 0, w, h);
    // Place libre au-dessus : toit du calendrier et Pantin qui guette.
    const libre = geo.oy - geo.bord;
    if (libre > 46) {
      const ht = Math.min(libre - 16, geo.tw * 0.2), x0 = geo.ox - geo.bord, x1 = geo.ox + geo.tw + geo.bord, yb = geo.oy - geo.bord + 4;

        pantin(c, x1 - hp * 0.22, yb + hp * 0.02, hp, { lueur: proche >= 0.5, bouche: 0.2 + 0.6 * proche + 0.1 * Math.sin(t / 500), bras: proche });
      }

    // portes qui changent de place : elles glissent de l'une à l'autre
    const mel = anims.mel, enGlisse = {};

      if (km >= 1) anims.mel = null;
      else mel.paires.forEach((p) => { enGlisse[p[0]] = p[1]; enGlisse[p[1]] = p[0]; });
    }
    // Pendant le glissement, les portes que la bougie éclairait restent visibles : on peut les suivre des yeux.
    const eclairee = (i) => {
      if (vue.rv.indexOf(i) >= 0) return true;
      if (!anims.mel) return false;
      const origine = enGlisse[i] !== undefined ? enGlisse[i] : i;
      return anims.mel.lit.indexOf(origine) >= 0;
    };
    const etatPorte = (i) => ({
      po: vue.po[i], pv: vue.pv[i], pk: vue.pk[i], px: vue.px[i], grande: i === vue.gr,
      eclairee: eclairee(i),
      ouverture: anims.portes[i] !== undefined ? Math.min(1, (t - anims.portes[i]) / 380) : undefined,

        c.lineWidth = 4; c.strokeStyle = '#1a0a10'; c.strokeText(p.texte, p.x, p.y); c.fillStyle = p.coul; c.fillText(p.texte, p.x, p.y);

  function centrePorte(i) {

  }

  // ---------------------------------------------------------------------

  function dessinerScene() {
    if (!qEtat) return;

    if (q.k === 'o') {

    } else if (q.k === 'b') {

  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }

  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }

    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';

  function surDebut(ev) {

    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {

        d.dataset.etat = cle;

      }

      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + tr('coul.' + partie.chef) : tr('coul.' + partie.chef) });
    }

    bouton.hidden = !chef;

  function surManche() {

  function surAction(ev) {

    const nom = nomMessage(s);

      if (d.t === 'piege') {

        setTimeout(() => sons.piege(), 200);
        jaillir(a.p, '#ff3a2a', 22);
        if (moi && session === 'solo' && prog.jouets.indexOf(d.k) < 0) { prog.jouets.push(d.k); nouveauxJouets.push(d.k); }
        toast(moi ? tr('piege.toi', { jouet: tr('jouet.' + d.k) }) : tr('piege.autre', { nom: nom, jouet: tr('jouet.' + d.k) }), 2400);
      } else if (vue.q) {
        ouvrirQuestion(vue.q, s);
      }
    } else if (a.t === 'r') {
      resultatQuestion(d, s);
      if (d.ok) { sons.bon(); jaillir(d.p, COUL[s]); envolTexte(d.p, tr('fx.plus', { n: d.v }), '#7dffa0'); }
      else { sons.faux(); jaillir(d.p, '#8a6a5a', 10); }
