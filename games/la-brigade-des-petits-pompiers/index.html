<script>
/* ==========================================================================
   La brigade des petits pompiers — Free Micro Games
   Jeu de réflexes : arroser les petites flammes du village avant qu'elles
   grandissent, remplir la citerne, sauver les chats avec la grande échelle,
   viser malgré le vent et diriger jusqu'à trois camions.
   Monde dessiné sur un canvas dans un repère fixe de 400 × 720 unités,
   mis à l'échelle de l'écran ; écrans (titre, niveaux, pause, fin) en HTML.
   ========================================================================== */
(function () {
  'use strict';

  const JEU = 'la-brigade-des-petits-pompiers';
  const I18N = window.JEL_I18N;
  const t = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------------------
  // Réglages du monde
  // ---------------------------------------------------------------------------
  const VW = 400, VH = 720;          // repère du monde
  const DEBIT = 32;                  // eau dépensée par seconde de jet (1 unité = 10 litres)
  const LITRES = 10;
  const EFFICACITE = 1.5;            // force de flamme éteinte par seconde au centre du jet
  const PORTEE = 150;                // portée d'un camion quand il y en a plusieurs
  const VITESSE_CAMION = 190;
  const ATTENTE_MAX = 3;             // secondes à taille maximale avant de perdre un cœur
  const RAYON_JET = 30;
  const GICLEE_MIN = 0.22;           // un toucher bref donne au moins cette giclée (s)
  const COEURS = 3;

  // ---------------------------------------------------------------------------
  // Les 24 niveaux. Chaque champ est lu par le moteur :
  //   feux (feux prévus), chats (à sauver), simul (flammes en même temps au plus),
  //   inter (secondes entre deux flammes), croiss (croissance par seconde),
  //   types (poids : cheminee, bbq, feuilles), sauteuses / geantes (combien),
  //   etincelles, citerne (capacité, 0 = illimitée), camions, vent (force),
  //   rafales, nuage, linge, nuit, patience (des chats), tutos (à montrer).
  // ---------------------------------------------------------------------------
  const BASE = { feux: 5, chats: 0, simul: 2, inter: 4, croiss: 0.06, types: { cheminee: 1 }, sauteuses: 0, geantes: 0,
    etincelles: false, citerne: 0, camions: 1, vent: 0, rafales: false, nuage: false, linge: false, nuit: false, patience: 14, tutos: [] };
  const N = (o) => Object.assign({}, BASE, o);
  const NIVEAUX = [
    N({ feux: 5, simul: 2, inter: 4.2, croiss: 0.06, tutos: ['arroser', 'clavier'] }),
    N({ feux: 7, simul: 2, inter: 3.8, croiss: 0.07, types: { cheminee: 2, bbq: 2 } }),
    N({ feux: 8, simul: 3, inter: 3.6, croiss: 0.08, types: { cheminee: 2, bbq: 1 }, etincelles: true, tutos: ['etincelles'] }),
    N({ feux: 8, simul: 3, inter: 3.5, croiss: 0.08, types: { cheminee: 2, bbq: 1 }, etincelles: true, citerne: 100, tutos: ['citerne1', 'citerne2'] }),
    N({ feux: 10, simul: 3, inter: 3.0, croiss: 0.09, types: { cheminee: 2, bbq: 2 }, etincelles: true, citerne: 100 }),
    N({ feux: 10, simul: 3, inter: 3.2, croiss: 0.09, types: { cheminee: 2, bbq: 1, feuilles: 2 }, etincelles: true, citerne: 110, tutos: ['feuilles'] }),
    N({ feux: 6, chats: 2, simul: 2, inter: 3.6, croiss: 0.08, types: { cheminee: 2, bbq: 1 }, etincelles: true, citerne: 100, patience: 15, tutos: ['chat'] }),
    N({ feux: 9, chats: 3, simul: 3, inter: 3.2, croiss: 0.09, types: { cheminee: 2, bbq: 1, feuilles: 1 }, etincelles: true, citerne: 100, patience: 14 }),
    N({ feux: 10, simul: 3, inter: 3.0, croiss: 0.1, types: { cheminee: 2, bbq: 1, feuilles: 1 }, sauteuses: 3, etincelles: true, citerne: 100, tutos: ['sauteuse'] }),
    N({ feux: 10, simul: 3, inter: 3.2, croiss: 0.09, types: { cheminee: 2, bbq: 2 }, vent: 0.7, etincelles: true, citerne: 110, tutos: ['vent'] }),
    N({ feux: 11, chats: 1, simul: 3, inter: 3.0, croiss: 0.1, types: { cheminee: 2, bbq: 1, feuilles: 1 }, vent: 0.7, rafales: true, etincelles: true, citerne: 110, tutos: ['rafales'] }),
    N({ feux: 12, chats: 2, simul: 3, inter: 2.8, croiss: 0.11, types: { cheminee: 2, bbq: 1, feuilles: 1 }, vent: 0.6, rafales: true, sauteuses: 2, etincelles: true, citerne: 100, patience: 13 }),
    N({ feux: 12, simul: 4, inter: 2.6, croiss: 0.1, types: { cheminee: 2, bbq: 2, feuilles: 1 }, camions: 2, etincelles: true, citerne: 90, tutos: ['camions', 'camionsClavier'] }),
    N({ feux: 12, chats: 1, simul: 4, inter: 2.6, croiss: 0.11, types: { cheminee: 2, bbq: 1, feuilles: 1 }, camions: 2, nuage: true, etincelles: true, citerne: 90, tutos: ['nuage'] }),
    N({ feux: 13, chats: 2, simul: 4, inter: 2.5, croiss: 0.11, types: { cheminee: 2, bbq: 2, feuilles: 1 }, camions: 2, vent: 0.6, rafales: true, nuage: true, sauteuses: 2, etincelles: true, citerne: 90, patience: 13 }),
    N({ feux: 13, simul: 4, inter: 2.5, croiss: 0.11, types: { cheminee: 2, bbq: 3, feuilles: 1 }, camions: 2, vent: 0.4, linge: true, etincelles: true, citerne: 90, tutos: ['linge'] }),
    N({ feux: 14, chats: 2, simul: 5, inter: 2.3, croiss: 0.12, types: { cheminee: 2, bbq: 2, feuilles: 1 }, camions: 3, etincelles: true, citerne: 80, patience: 12, tutos: ['trois'] }),
    N({ feux: 12, chats: 1, simul: 4, inter: 2.6, croiss: 0.11, types: { cheminee: 2, bbq: 1 }, geantes: 2, camions: 2, etincelles: true, citerne: 100, patience: 12, tutos: ['geante'] }),
    N({ feux: 14, chats: 2, simul: 4, inter: 2.4, croiss: 0.12, types: { cheminee: 2, bbq: 1, feuilles: 1 }, sauteuses: 3, nuit: true, camions: 2, etincelles: true, citerne: 90, patience: 12, tutos: ['nuit'] }),
    N({ feux: 15, chats: 3, simul: 5, inter: 2.2, croiss: 0.13, types: { cheminee: 2, bbq: 2, feuilles: 1 }, camions: 3, vent: 0.6, rafales: true, nuage: true, etincelles: true, citerne: 80, patience: 11 }),
    N({ feux: 15, chats: 2, simul: 5, inter: 2.2, croiss: 0.13, types: { cheminee: 2, bbq: 3, feuilles: 1 }, camions: 2, vent: 0.9, rafales: true, linge: true, nuage: true, etincelles: true, citerne: 90, patience: 11 }),
    N({ feux: 16, chats: 3, simul: 5, inter: 2.1, croiss: 0.13, types: { cheminee: 2, bbq: 1, feuilles: 1 }, geantes: 2, sauteuses: 2, nuit: true, camions: 3, etincelles: true, citerne: 80, patience: 11 }),
    N({ feux: 18, chats: 3, simul: 6, inter: 1.9, croiss: 0.15, types: { cheminee: 2, bbq: 2, feuilles: 2 }, sauteuses: 2, camions: 3, vent: 0.6, rafales: true, linge: true, nuage: true, etincelles: true, citerne: 80, patience: 10 }),
    N({ feux: 20, chats: 4, simul: 6, inter: 1.8, croiss: 0.16, types: { cheminee: 2, bbq: 2, feuilles: 1 }, geantes: 1, sauteuses: 3, camions: 3, vent: 0.7, rafales: true, linge: true, nuage: true, etincelles: true, citerne: 80, patience: 10 }),
  ];
  window.JEL_NIVEAUX = NIVEAUX.length;
  const NB = NIVEAUX.length;

  // Temps et eau de référence (étoiles « rapide » et « économe »), tirés des données du niveau.
  function references(L) {
    const f0 = Math.min(1, 0.25 + L.croiss * 3);
    let poids = 0, somme = 0;
    for (const k in L.types) { poids += L.types[k]; somme += L.types[k] * (k === 'feuilles' ? 2 : 1); }
    const mult = somme / poids;
    let eau = (L.feux - L.geantes) * (f0 * mult / EFFICACITE * DEBIT * 1.4) + L.geantes * (4 / EFFICACITE * DEBIT * 1.3);
    if (L.vent) eau *= 1.25;
    eau = Math.round((eau + 15) / 5) * 5;
    const temps = Math.round(L.feux * Math.min(L.inter, 2.6) * 1.15 + L.chats * 3 + 6 + (L.citerne ? L.feux * 0.35 : 0) + L.geantes * 4);
    return { eau, temps };
  }

  // ---------------------------------------------------------------------------
  // Plan du village (repère du monde)
  // ---------------------------------------------------------------------------
  const MAISONS_FOND = [{ x: 30, w: 95, base: 300, h: 80, toit: 52, cote: 0.72 }, { x: 155, w: 90, base: 300, h: 86, toit: 50, cote: 0.3 }, { x: 275, w: 100, base: 300, h: 78, toit: 55, cote: 0.72 }];
  const MAISONS_AVANT = [{ x: 62, w: 112, base: 470, h: 84, toit: 54, cote: 0.3 }, { x: 228, w: 112, base: 470, h: 88, toit: 52, cote: 0.72 }];
  const ARBRES = [{ x: 26, y: 398, r: 28 }, { x: 201, y: 386, r: 30 }, { x: 374, y: 398, r: 28 }];
  const BBQ = [{ x: 52, y: 548 }, { x: 150, y: 556 }, { x: 252, y: 548 }, { x: 348, y: 556 }];
  const FEUILLES = [{ x: 104, y: 566 }, { x: 300, y: 566 }];
  const LINGES = [{ x1: 16, x2: 88, y: 488 }, { x1: 196, x2: 276, y: 488 }];
  const BORNES = [{ x: 22, y: 580 }, { x: 378, y: 580 }];
  const VOIES = { 1: [652], 2: [630, 676], 3: [622, 650, 678] };
  const COULEURS_MURS = ['#f6d6a8', '#f2b8a2', '#cfe3f2', '#d9ecc4', '#f4e7b0', '#e6cfee', '#fbe2c7', '#c9e8e0'];
  const COULEURS_TOITS = ['#c4573a', '#8f4a3a', '#5f7fb3', '#b0703c', '#7b5ea8', '#4f8a6b', '#a8434f'];
  const RAYURES_CAMIONS = ['#ffd84a', '#ffffff', '#7fd0ff'];
  const PELAGES = [['#f2a24a', '#c9772a'], ['#9ea3ad', '#6e737c'], ['#3b3b44', '#f4f4f4'], ['#f6efe2', '#d9a35b']];

  // Petit générateur pseudo-aléatoire (décor stable pour un même niveau)
  function graine(n) { let a = n * 2654435761 >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let x = Math.imul(a ^ (a >>> 15), 1 | a); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; }; }
  const hasard = (a, b) => a + Math.random() * (b - a);
  const bornee = (x, a, b) => Math.max(a, Math.min(b, x));

  function cheminee(m, large) {
    const ax = m.x + m.w / 2, ay = m.base - m.h - m.toit;
    const cx = m.x + m.w * m.cote;
    const yToit = ay + Math.abs(cx - ax) / (m.w / 2 + 7) * m.toit;
    const haut = large ? 34 : 26;
    return { x: cx, y: yToit - haut, yBas: yToit + 8, l: large ? 30 : 15 };
  }

  // ---------------------------------------------------------------------------
  // Progression (étoiles, records, médailles…) : sauvegarde save.js + localStorage
  // ---------------------------------------------------------------------------
  const CLE_PROGRES = 'brigade-pompiers-progres';
  const CLE_SON = 'brigade-pompiers-son';
  const PALIERS_CASERNE = [0, 6, 14, 22, 32, 42, 54, 66];
  const CASQUE_ETOILES = 60;
  const MEDAILLES = [
    { id: 'premiere', couleur: '#e0913a', ok: (p) => p.etoiles[0] > 0 },
    { id: 'chats', n: 10, couleur: '#f2a24a', ok: (p) => p.chats >= 10 },
    { id: 'eau', n: 10, couleur: '#3b8de0', ok: (p) => compter(p.eauOk) >= 10 },
    { id: 'temps', n: 10, couleur: '#f2c94c', ok: (p) => compter(p.tempsOk) >= 10 },
    { id: 'calme', n: 5, couleur: '#5cbf6a', ok: (p) => compter(p.calme) >= 5 },
    { id: 'vent', couleur: '#8fd3f4', ok: (p) => p.etoiles[10] >= 3 },
    { id: 'chef', couleur: '#d8352a', ok: (p) => p.etoiles[16] > 0 },
    { id: 'fete', couleur: '#b06ad8', ok: (p) => p.etoiles[23] > 0 },
  ];
  function compter(liste) { return liste.filter(Boolean).length; }
  function progresVide() {
    return { etoiles: new Array(NB).fill(0), records: new Array(NB).fill(0), eauOk: new Array(NB).fill(false),
      tempsOk: new Array(NB).fill(false), calme: new Array(NB).fill(false), debloque: 1, chats: 0, tutos: {}, casque: false };
  }
  function fusionner(p, q) {
    if (!q || typeof q !== 'object') return;
    for (let i = 0; i < NB; i++) {
      if (Array.isArray(q.etoiles)) p.etoiles[i] = Math.max(p.etoiles[i], bornee(Number(q.etoiles[i]) || 0, 0, 3));
      if (Array.isArray(q.records)) p.records[i] = Math.max(p.records[i], Math.max(0, Number(q.records[i]) || 0));
      if (Array.isArray(q.eauOk)) p.eauOk[i] = p.eauOk[i] || !!q.eauOk[i];
      if (Array.isArray(q.tempsOk)) p.tempsOk[i] = p.tempsOk[i] || !!q.tempsOk[i];
      if (Array.isArray(q.calme)) p.calme[i] = p.calme[i] || !!q.calme[i];
    }
    p.debloque = bornee(Math.max(p.debloque, Number(q.debloque) || 1), 1, NB);
    p.chats = Math.max(p.chats, Number(q.chats) || 0);
    p.casque = p.casque || !!q.casque;
    if (q.tutos && typeof q.tutos === 'object') for (const k in q.tutos) if (q.tutos[k]) p.tutos[k] = true;
  }
  function chargerProgres() {
    const p = progresVide();
    try { fusionner(p, JSON.parse(localStorage.getItem(CLE_PROGRES) || 'null')); } catch (e) { /* stockage refusé */ }
    try { fusionner(p, window.JEL_SAVE.load(JEU).progres); } catch (e) { /* pas de sauvegarde */ }
    return p;
  }
  function ecrireProgres() {
    try { localStorage.setItem(CLE_PROGRES, JSON.stringify(progres)); } catch (e) { /* stockage refusé */ }
  }
  let progres = chargerProgres();
  const totalEtoiles = () => progres.etoiles.reduce((a, b) => a + b, 0);
  const etapeCaserne = () => PALIERS_CASERNE.filter((x) => totalEtoiles() >= x).length;

  // ---------------------------------------------------------------------------
  // Sons (Web Audio, aucun fichier ; rien avant la première action)
  // ---------------------------------------------------------------------------
  let sonActif = true;
  try { const v = localStorage.getItem(CLE_SON); if (v === '0') sonActif = false; } catch (e) { /* rien */ }
  try { const o = window.JEL_SAVE.load(JEU).options; if (o && o.son === false) sonActif = false; } catch (e) { /* rien */ }

  const Son = {
    ctx: null, maitre: null, gainJet: null, tampon: null,
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.maitre = this.ctx.createGain();
        this.maitre.gain.value = sonActif ? 0.7 : 0;
        this.maitre.connect(this.ctx.destination);
        const n = this.ctx.sampleRate * 2;
        this.tampon = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
        const d = this.tampon.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        // Bruit continu du jet d'eau (volume réglé selon les jets actifs)
        const src = this.ctx.createBufferSource(); src.buffer = this.tampon; src.loop = true;
        const f = this.ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 0.7;
        this.gainJet = this.ctx.createGain(); this.gainJet.gain.value = 0;
        src.connect(f); f.connect(this.gainJet); this.gainJet.connect(this.maitre); src.start();
      } catch (e) { this.ctx = null; }
    },
    volume() { if (this.maitre) this.maitre.gain.setTargetAtTime(sonActif ? 0.7 : 0, this.ctx.currentTime, 0.02); },
    jet(n) { if (this.gainJet) this.gainJet.gain.setTargetAtTime(n > 0 ? Math.min(0.16, 0.1 + 0.03 * n) : 0, this.ctx.currentTime, 0.05); },
    bip(f, d, type = 'sine', v = 0.2, f2 = null, delai = 0) {
      if (!this.ctx || !sonActif) return;
      const t0 = this.ctx.currentTime + delai;
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(this.maitre); o.start(t0); o.stop(t0 + d + 0.02);
    },
    bruit(d, freq, v = 0.2, type = 'bandpass', delai = 0) {
      if (!this.ctx || !sonActif || !this.tampon) return;
      const t0 = this.ctx.currentTime + delai;
      const s = this.ctx.createBufferSource(); s.buffer = this.tampon;
      const f = this.ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
      const g = this.ctx.createGain(); g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      s.connect(f); f.connect(g); g.connect(this.maitre); s.start(t0, Math.random()); s.stop(t0 + d + 0.02);
    },
    clic() { this.bip(660, 0.07, 'triangle', 0.15); },
    pschitt() { this.bruit(0.4, 3200, 0.25, 'highpass'); this.bip(880, 0.12, 'sine', 0.12, 1320, 0.08); },
    point() { this.bip(1046, 0.09, 'triangle', 0.1, 1568); },
    alerte() { this.bip(330, 0.16, 'square', 0.05, 300); },
    coeur() { this.bip(392, 0.18, 'triangle', 0.2, 262); this.bip(262, 0.28, 'triangle', 0.16, 196, 0.18); },
    miaou() { this.bip(620, 0.18, 'triangle', 0.12, 880); this.bip(880, 0.25, 'triangle', 0.1, 560, 0.17); },
    echelle() { for (let i = 0; i < 7; i++) this.bip(1250, 0.03, 'square', 0.04, null, i * 0.13); },
    glouglou() { for (let i = 0; i < 9; i++) this.bip(hasard(180, 420), 0.07, 'sine', 0.12, hasard(300, 600), i * 0.15); },
    sirene() { for (let i = 0; i < 2; i++) { this.bip(660, 0.32, 'triangle', 0.09, null, i * 0.7); this.bip(880, 0.32, 'triangle', 0.09, null, i * 0.7 + 0.35); } },
    vent() { this.bruit(1.4, 450, 0.09, 'lowpass'); },
    pluie() { this.bruit(3, 5000, 0.06, 'highpass'); },
    oups() { this.bip(520, 0.16, 'square', 0.07, 340); },
    vide() { this.bip(220, 0.18, 'square', 0.07); this.bip(180, 0.2, 'square', 0.06, null, 0.2); },
    etincelle() { this.bip(1500, 0.12, 'sawtooth', 0.04, 2600); },
    etoile(i) { this.bip(988 + i * 200, 0.18, 'triangle', 0.15, 1760 + i * 200); },
    victoire() { [523, 659, 784, 1046].forEach((f, i) => this.bip(f, 0.22, 'triangle', 0.17, null, i * 0.13)); this.bip(1318, 0.4, 'triangle', 0.15, null, 0.55); },
    defaite() { [523, 440, 349, 262].forEach((f, i) => this.bip(f, 0.26, 'triangle', 0.14, null, i * 0.2)); },
  };

  const ICONE_SON = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';
  const ICONE_MUET = '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 9l5 6M21 9l-5 6" stroke="#ff8a7a" stroke-width="2.4" stroke-linecap="round"/></svg>';
  function majBoutonsSon() { document.querySelectorAll('.b-son').forEach((b) => { b.innerHTML = sonActif ? ICONE_SON : ICONE_MUET; b.setAttribute('aria-pressed', sonActif ? 'false' : 'true'); }); }
  function basculerSon() {
    sonActif = !sonActif;
    try { localStorage.setItem(CLE_SON, sonActif ? '1' : '0'); } catch (e) { /* rien */ }
    Son.init(); Son.volume(); majBoutonsSon(); Son.clic();
  }

  // ---------------------------------------------------------------------------
  // Icônes SVG (étoiles, cœurs, cadenas, médailles)
  // ---------------------------------------------------------------------------
  const svgEtoile = (pleine) => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="${pleine ? '#ffc93c' : '#d5d0c4'}" stroke="${pleine ? '#c88a00' : '#a9a396'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
  const svgCoeur = (plein) => `<svg viewBox="0 0 24 24" class="${plein ? '' : 'perdu'}"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z" fill="#ff5a6e" stroke="#b8233a" stroke-width="1.4"/></svg>`;
  const svgCadenas = '<svg class="cadenas" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2.5" fill="#fff"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2.4" fill="none"/></svg>';
  const svgCoche = (ok) => ok
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#5cbf6a"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#c9c3b5"/><path d="M8 8l8 8M16 8l-8 8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const svgMedaille = (c, ok) => `<svg viewBox="0 0 34 40"><path d="M9 0h7l3 14H12zM18 0h7l-3 14h-7z" fill="${ok ? '#2f7fd6' : '#aaa'}"/><circle cx="17" cy="25" r="12" fill="${ok ? c : '#ccc'}" stroke="${ok ? '#7a5a10' : '#999'}" stroke-width="2"/><path d="M17 17l2.3 4.7 5.2.6-3.8 3.6 1 5.1-4.7-2.5-4.7 2.5 1-5.1-3.8-3.6 5.2-.6z" fill="#fff" opacity=".9"/></svg>`;

  // ---------------------------------------------------------------------------
  // Canvas et mise à l'échelle
  // ---------------------------------------------------------------------------
  const canvas = $('scene');
  const ctx = canvas.getContext('2d');
  let cw = 0, ch = 0, dpr = 1, ech = 1, offX = 0, offY = 0;
  function redimensionner() {
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    cw = window.innerWidth; ch = window.innerHeight;
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
    const sansHud = $('hud').classList.contains('cache');
    offX = 0;
    if (sansHud) {
      // Écran titre : on garde de la place en bas pour les boutons, le camion reste visible
      const bas = Math.min(190, ch * 0.22);
      ech = Math.min(cw / VW, (ch - bas) / VH);
      offY = ch - bas - VH * ech;
    } else {
      const hudH = $('hud').offsetHeight;
      ech = Math.min(cw / VW, (ch - hudH) / VH);
      offY = hudH + (ch - hudH - VH * ech) * 0.55;
    }
    offX = (cw - VW * ech) / 2;
  }
  window.addEventListener('resize', redimensionner);
  const versMonde = (cx, cy) => ({ x: (cx - offX) / ech, y: (cy - offY) / ech });

  // ---------------------------------------------------------------------------
  // État du jeu
  // ---------------------------------------------------------------------------
  let etat = 'titre';            // titre, niveaux, caserne, tuto, jeu, pause, fin
  let etatAvantPause = 'jeu';
  let niveau = 1;                // numéro du niveau en cours (1…24)
  let L = NIVEAUX[0];
  let ref = references(L);
  let monde = null;
  let horloge = 0;               // temps d'animation global

  function creerMonde(n, pourTitre) {
    const lv = NIVEAUX[n - 1];
    const r = graine(n * 7 + 3);
    const couleur = (liste) => liste[Math.floor(r() * liste.length)];
    const m = {
      maisons: [], lieux: [], flammes: [], chats: [], camions: [], particules: [], textes: [], etincelles: [],
      lancees: 0, eteints: 0, chatsSauves: 0, chatsVenus: 0, tChat: 0, tSpawn: -1.4, temps: 0, eau: 0, score: 0, coeurs: COEURS,
      vent: lv.vent, ventCible: lv.vent, tVent: 5, nuage: null, tNuage: 4, linges: [], tLinge: 0, secousse: 0,
      fini: false, tFin: 0, viseur: { x: 200, y: 300 }, clavier: false, camionChoisi: 0,
      geantesFaites: 0, sauteusesFaites: 0, feuillesVent: [],
    };
    // Maisons (couleurs tirées de la graine du niveau)
    MAISONS_FOND.forEach((d) => m.maisons.push({ ...d, mur: couleur(COULEURS_MURS), toitC: couleur(COULEURS_TOITS), boulangerie: false }));
    MAISONS_AVANT.forEach((d, i) => m.maisons.push({ ...d, mur: couleur(COULEURS_MURS), toitC: couleur(COULEURS_TOITS), boulangerie: i === 0 && lv.geantes > 0 }));
    // Lieux où une flamme peut s'allumer
    m.maisons.forEach((h) => {
      const c = cheminee(h, h.boulangerie);
      h.chem = c;
      m.lieux.push({ type: h.boulangerie ? 'geante' : 'cheminee', x: c.x, y: c.y, flamme: null });
    });
    if (lv.types.bbq) BBQ.forEach((b) => m.lieux.push({ type: 'bbq', x: b.x, y: b.y - 6, flamme: null, bx: b.x, by: b.y }));
    if (lv.types.feuilles) FEUILLES.forEach((f) => m.lieux.push({ type: 'feuilles', x: f.x, y: f.y - 8, flamme: null, bx: f.x, by: f.y }));
    if (lv.linge) LINGES.forEach((l) => m.linges.push({ ...l, mouille: 0, secoue: 0, teintes: [couleur(['#ff7a7a', '#ffd84a', '#7fd0ff', '#9be08a']), couleur(['#ffffff', '#c9a7ff', '#ffb36b']), couleur(['#5bb0ff', '#ff9ad5', '#ffe08a'])] }));
    // Camions
    const voies = VOIES[lv.camions];
    const xs = lv.camions === 1 ? [200] : lv.camions === 2 ? [120, 290] : [80, 200, 320];
    for (let i = 0; i < lv.camions; i++) {
      m.camions.push({ i, x: xs[i], voie: voies[i], eau: lv.citerne || 1, cap: lv.citerne || 1, tache: null, cibleX: null, angle: -1.2, ext: 0, rayure: RAYURES_CAMIONS[i], gyro: r() * 6 });
    }
    // Feuilles portées par le vent (décor)
    for (let i = 0; i < 10; i++) m.feuillesVent.push({ x: hasard(-50, 450), y: hasard(60, 560), p: hasard(0, 6), c: i % 2 ? '#e8963a' : '#c9d64a' });
    if (pourTitre) m.titre = true;
    return m;
  }

  // ---------------------------------------------------------------------------
  // Flammes, étincelles, chats, nuage
  // ---------------------------------------------------------------------------
  function taille(f) { return (14 + 26 * f.force) * (f.type === 'geante' ? 1.9 : 1) * (f.sauteuse ? 0.85 : 1); }
  function centreFlamme(f) { return { x: f.x, y: f.y - taille(f) * 0.45 }; }

  function nouvelleFlamme(lieu, force, opts = {}) {
    const f = { lieu, type: lieu.type, x: lieu.x, y: lieu.y, force, pic: force, tMax: 0, phase: Math.random() * 6,
      mult: lieu.type === 'feuilles' ? 2 : lieu.type === 'geante' ? 4 : 1, sauteuse: !!opts.sauteuse, tSaut: hasard(2, 3), saut: null, arrosee: 0, alerte: false };
    lieu.flamme = f;
    monde.flammes.push(f);
    for (let i = 0; i < 6; i++) monde.particules.push({ type: 'braise', x: f.x, y: f.y, vx: hasard(-30, 30), vy: hasard(-70, -30), vie: 0.6, max: 0.6, r: 2 });
    return f;
  }
  const lieuxLibres = (types) => monde.lieux.filter((l) => !l.flamme && types.includes(l.type) && !monde.etincelles.some((e) => e.lieu === l));

  // Allume la prochaine flamme prévue (renvoie false s'il n'y a pas de place)
  function allumer() {
    const i = monde.lancees;
    // Grand feu de boulangerie à des moments répartis dans le niveau
    if (L.geantes > monde.geantesFaites && i >= Math.floor((monde.geantesFaites + 0.5) * L.feux / L.geantes) - 1) {
      const g = lieuxLibres(['geante'])[0];
      if (g) { nouvelleFlamme(g, 0.3); monde.geantesFaites++; return true; }
    }
    // Flammèche sauteuse
    if (L.sauteuses > monde.sauteusesFaites && i >= Math.floor((monde.sauteusesFaites + 0.6) * L.feux / (L.sauteuses + 1))) {
      const libres = lieuxLibres(['cheminee']);
      if (libres.length) { nouvelleFlamme(libres[Math.floor(Math.random() * libres.length)], 0.3, { sauteuse: true }); monde.sauteusesFaites++; return true; }
    }
    // Flamme ordinaire, type tiré selon les poids du niveau
    const choix = [];
    for (const k in L.types) if (lieuxLibres([k]).length) choix.push([k, L.types[k]]);
    if (!choix.length) return false;
    let total = choix.reduce((a, c) => a + c[1], 0), tir = Math.random() * total, type = choix[0][0];
    for (const c of choix) { tir -= c[1]; if (tir <= 0) { type = c[0]; break; } }
    const libres = lieuxLibres([type]);
    nouvelleFlamme(libres[Math.floor(Math.random() * libres.length)], 0.25);
    return true;
  }

  function lancerEtincelle(f) {
    const libres = lieuxLibres(['cheminee', 'bbq', 'feuilles']).sort((a, b) => Math.hypot(a.x - f.x, a.y - f.y) - Math.hypot(b.x - f.x, b.y - f.y));
    if (!libres.length) return;
    const lieu = libres[Math.floor(Math.random() * Math.min(2, libres.length))];
    const c = centreFlamme(f);
    monde.etincelles.push({ x0: c.x, y0: c.y, lieu, t: 0, dur: 0.7 });
    Son.etincelle();
  }

  function eteindre(f) {
    const i = monde.flammes.indexOf(f);
    if (i < 0) return;
    monde.flammes.splice(i, 1);
    f.lieu.flamme = null;
    monde.eteints++;
    const pts = (f.type === 'geante' ? 40 : 10) + (f.pic < 0.5 ? 5 : 0);
    monde.score += pts;
    const c = centreFlamme(f);
    for (let k = 0; k < 10; k++) monde.particules.push({ type: 'vapeur', x: c.x + hasard(-8, 8), y: c.y + hasard(-8, 8), vx: hasard(-20, 20), vy: hasard(-50, -20), vie: hasard(0.7, 1.1), max: 1.1, r: hasard(5, 10) });
    for (let k = 0; k < 6; k++) monde.particules.push({ type: 'etincelle-or', x: c.x, y: c.y, vx: hasard(-80, 80), vy: hasard(-120, -40), vie: 0.6, max: 0.6, r: 2.5 });
    texteFlottant(c.x, c.y - 10, '+' + nb(pts), '#ffffff');
    Son.pschitt(); Son.point();
  }

  function texteFlottant(x, y, txt, couleur) { monde.textes.push({ x, y, txt, couleur, vie: 1.2 }); }

  function perdreCoeur() {
    if (monde.fini) return;
    monde.coeurs--;
    monde.secousse = 0.4;
    Son.coeur();
    majHud();
    if (monde.coeurs <= 0) finNiveau(false);
  }

  function nouveauChat() {
    const libres = ARBRES.map((a, i) => i).filter((i) => !monde.chats.some((c) => c.arbre === i && c.etat !== 'court'));
    if (!libres.length) return false;
    const i = libres[Math.floor(Math.random() * libres.length)];
    const a = ARBRES[i];
    monde.chats.push({ arbre: i, x: a.x, y: a.y - a.r + 4, patience: L.patience, max: L.patience, etat: 'attend', t: 0, pelage: PELAGES[Math.floor(Math.random() * PELAGES.length)], camion: null, vx: 0 });
    monde.chatsVenus++;
    Son.miaou();
    return true;
  }

  // ---------------------------------------------------------------------------
  // Camions : jets, déplacement, remplissage, échelle
  // ---------------------------------------------------------------------------
  const jets = new Map();   // identifiant du doigt (ou « clavier ») → jet
  const jetDe = (c) => { for (const j of jets.values()) if (j.camion === c) return j; return null; };
  const portee = () => (L.camions > 1 ? PORTEE : 9999);
  const buse = (c) => ({ x: c.x - 22, y: c.voie - 50 });

  function choisirCamion(x, prefere) {
    const libres = monde.camions.filter((c) => !c.tache && !jetDe(c));
    if (!libres.length) return null;
    if (prefere != null && libres.includes(monde.camions[prefere])) return monde.camions[prefere];
    let meilleur = null, note = Infinity;
    for (const c of libres) {
      const sec = L.citerne && c.eau <= 0.5;
      const n = (sec ? 1000 : 0) + (Math.abs(x - c.x) > portee() ? 100 : 0) + Math.abs(x - c.x) * 0.1;
      if (n < note) { note = n; meilleur = c; }
    }
    return meilleur;
  }

  function commencerJet(id, x, y) {
    const c = choisirCamion(x, id === 'clavier' && L.camions > 1 ? monde.camionChoisi : null);
    if (!c) { message(t('flot.occupe')); Son.vide(); return; }
    jets.set(id, { camion: c, x, y, t: 0, relache: false, vide: false, loin: false, impact: null, actif: false });
  }
  function bougerJet(id, x, y) { const j = jets.get(id); if (j) { j.x = x; j.y = y; } }
  function arreterJet(id) { const j = jets.get(id); if (j) j.relache = true; }
  function arreterTousJets() { jets.clear(); Son.jet(0); }

  function point(c, j) {
    const b = buse(c);
    const derive = monde.vent * 60 * bornee((b.y - j.y) / 350, 0.3, 1.3);
    return { x: j.x + derive, y: j.y };
  }

  function remplir(c) {
    if (!L.citerne || !c || c.tache) return false;
    const borne = BORNES.slice().sort((a, b) => Math.abs(a.x - c.x) - Math.abs(b.x - c.x))[0];
    for (const [k, j] of jets) if (j.camion === c) jets.delete(k);
    c.cibleX = null;
    c.tache = { type: 'remplir', phase: 'aller', borne, cible: borne.x < 200 ? 62 : 338, t: 0 };
    Son.clic();
    return true;
  }
  function camionARemplir() {
    const libres = monde.camions.filter((c) => !c.tache);
    if (!libres.length) return null;
    if (L.camions > 1 && monde.clavier && libres.includes(monde.camions[monde.camionChoisi])) return monde.camions[monde.camionChoisi];
    return libres.sort((a, b) => a.eau / a.cap - b.eau / b.cap)[0];
  }

  function sauverChat(chat) {
    if (chat.etat !== 'attend') return;
    const libres = monde.camions.filter((c) => !c.tache).sort((a, b) => Math.abs(a.x - chat.x) - Math.abs(b.x - chat.x));
    if (!libres.length) { message(t('flot.occupe')); Son.vide(); return; }
    const c = libres[0];
    for (const [k, j] of jets) if (j.camion === c) jets.delete(k);
    c.cibleX = null;
    c.tache = { type: 'echelle', phase: 'aller', chat, cible: bornee(chat.x - 8, 50, 350), t: 0 };
    chat.etat = 'echelle'; chat.camion = c;
    Son.clic();
  }

  function rouler(c, cible, dt) {
    const d = cible - c.x;
    const pas = VITESSE_CAMION * dt;
    if (Math.abs(d) <= pas) { c.x = cible; return true; }
    c.x += Math.sign(d) * pas;
    return false;
  }
  // Bout de l'échelle (vers le chat)
  function baseEchelle(c) { return { x: c.x + 4, y: c.voie - 46 }; }

  function majCamions(dt) {
    for (const c of monde.camions) {
      c.gyro += dt;
      const tc = c.tache;
      if (!tc) {
        if (c.cibleX != null && rouler(c, c.cibleX, dt)) c.cibleX = null;
        continue;
      }
      tc.t += dt;
      if (tc.type === 'remplir') {
        if (tc.phase === 'aller' && rouler(c, tc.cible, dt)) { tc.phase = 'branche'; tc.t = 0; Son.glouglou(); }
        else if (tc.phase === 'branche' && tc.t > 0.35) { tc.phase = 'remplit'; tc.t = 0; }
        else if (tc.phase === 'remplit') {
          c.eau = Math.min(c.cap, c.eau + c.cap / 1.6 * dt);
          if (Math.random() < dt * 12) monde.particules.push({ type: 'bulle', x: c.x - 38 + hasard(-4, 4), y: c.voie - 30, vx: hasard(-10, 10), vy: -30, vie: 0.5, max: 0.5, r: 3 });
          if (c.eau >= c.cap) { c.tache = null; texteFlottant(c.x, c.voie - 80, t('flot.plein'), '#bfe6ff'); Son.point(); }
        }
      } else if (tc.type === 'echelle') {
        const chat = tc.chat;
        if (tc.phase === 'aller' && rouler(c, tc.cible, dt)) { tc.phase = 'monte'; tc.t = 0; Son.echelle(); }
        else if (tc.phase === 'monte') { c.ext = Math.min(1, tc.t / 1.0); if (c.ext >= 1) { tc.phase = 'descend'; tc.t = 0; Son.miaou(); } }
        else if (tc.phase === 'descend') {
          const b = baseEchelle(c), k = Math.min(1, tc.t / 0.9);
          const a = ARBRES[chat.arbre];
          chat.x = a.x + (b.x - a.x) * k; chat.y = (a.y - a.r + 4) + (b.y - (a.y - a.r + 4)) * k;
          if (k >= 1) {
            tc.phase = 'replie'; tc.t = 0;
            chat.etat = 'court'; chat.y = c.voie - 4; chat.vx = chat.x < 200 ? -150 : 150; chat.t = 0;
            monde.chatsSauves++; monde.score += 30;
            texteFlottant(chat.x, chat.y - 60, t('flot.chat'), '#ffe08a');
            texteFlottant(chat.x, chat.y - 40, '+' + nb(30), '#ffffff');
            for (let k2 = 0; k2 < 8; k2++) monde.particules.push({ type: 'coeur', x: chat.x, y: chat.y - 20, vx: hasard(-40, 40), vy: hasard(-80, -40), vie: 1, max: 1, r: 5 });
            Son.point(); Son.miaou();
            majHud();
          }
        } else if (tc.phase === 'replie') { c.ext = Math.max(0, 1 - tc.t / 0.6); if (c.ext <= 0) c.tache = null; }
      }
    }
  }

  // Jets d'eau : dépense, déplacement des camions trop loin, extinction
  function majJets(dt) {
    let actifs = 0;
    for (const [id, j] of jets) {
      const c = j.camion;
      j.t += dt;
      j.actif = false; j.impact = null;
      if (c.tache) { jets.delete(id); continue; }
      if (j.relache && j.t >= GICLEE_MIN) { jets.delete(id); continue; }
      const dx = j.x - c.x;
      if (Math.abs(dx) > portee()) {
        c.cibleX = bornee(j.x - Math.sign(dx) * (portee() - 40), 45, 355);
        if (!j.loin) { j.loin = true; texteFlottant(c.x, c.voie - 75, t('flot.loin'), '#ffffff'); }
        continue;
      }
      if (L.citerne && c.eau <= 0) {
        // un autre camion libre a encore de l'eau : il prend le relais
        const autre = choisirCamion(j.x, null);
        if (autre && autre.eau > 0.5) { j.camion = autre; j.loin = false; continue; }
        if (!j.vide) { j.vide = true; message(t('flot.vide')); Son.vide(); }
        continue;
      }
      j.actif = true; actifs++;
      const q = DEBIT * dt;
      if (L.citerne) c.eau = Math.max(0, c.eau - q);
      monde.eau += q;
      const b = buse(c);
      const h = point(c, j);
      j.impact = h;
      c.angle = Math.atan2(h.y - b.y - 60, h.x - b.x);
      arroser(h.x, h.y, dt);
      if (Math.random() < dt * 30) monde.particules.push({ type: 'goutte', x: h.x + hasard(-6, 6), y: h.y, vx: hasard(-50, 50), vy: hasard(-60, 10), vie: 0.5, max: 0.5, r: hasard(1.5, 3) });
    }
    Son.jet(actifs);
  }

  function arroser(x, y, dt) {
    for (const f of monde.flammes.slice()) {
      if (f.saut) continue;
      const c = centreFlamme(f);
      const R = RAYON_JET + taille(f) * 0.35;
      const d = Math.hypot(x - c.x, y - c.y);
      if (d < R) {
        f.force -= dt * EFFICACITE * (1 - 0.5 * d / R) / f.mult;
        f.arrosee = 0.15;
        if (f.force <= 0) eteindre(f);
      }
    }
    // Linge qui sèche : les voisins râlent
    for (const l of monde.linges) {
      if (x > l.x1 + 2 && x < l.x2 - 2 && y > l.y - 4 && y < l.y + 30) {
        l.mouille = Math.min(1, l.mouille + dt * 2);
        if (monde.tLinge <= 0) {
          monde.tLinge = 1.2; l.secoue = 0.6;
          monde.score = Math.max(0, monde.score - 10);
          texteFlottant(x, l.y - 14, t('flot.linge'), '#ffd0d0');
          texteFlottant(x, l.y + 4, '-' + nb(10), '#ffb3b3');
          Son.oups();
        }
      }
    }
  }

  // ---------------------------------------------------------------------------
  // Boucle de mise à jour d'une partie
  // ---------------------------------------------------------------------------
  function majPartie(dt) {
    const m = monde;
    m.temps += dt;
    m.tLinge -= dt;
    // Vent et rafales
    if (L.rafales) {
      m.tVent -= dt;
      if (m.tVent <= 0) {
        m.tVent = hasard(4.5, 6.5);
        m.ventCible = (Math.random() < 0.5 ? -1 : 1) * L.vent * hasard(0.45, 1);
        Son.vent();
      }
      m.vent += (m.ventCible - m.vent) * Math.min(1, dt * 1.3);
    }
    // Apparition des flammes
    m.tSpawn += dt;
    if (m.lancees < L.feux && m.flammes.length < L.simul && (m.tSpawn >= L.inter || (m.flammes.length === 0 && m.tSpawn >= 0.8))) {
      if (allumer()) { m.lancees++; m.tSpawn = 0; }
    }
    // Apparition des chats (répartis au fil du niveau)
    m.tChat += dt;
    const enAttente = m.chats.filter((c) => c.etat === 'attend' || c.etat === 'echelle').length;
    const maxChats = L.chats >= 3 ? 2 : 1;
    if (m.chatsSauves + enAttente < L.chats && enAttente < maxChats && m.tChat >= 2.5) {
      const rang = m.chatsSauves + enAttente;
      if (m.lancees >= Math.ceil((rang + 1) * L.feux / (L.chats + 1)) || m.lancees >= L.feux) { if (nouveauChat()) m.tChat = 0; }
    }
    // Flammes : croissance, alerte, étincelles, saut des flammèches
    for (const f of m.flammes.slice()) {
      f.phase += dt;
      f.arrosee = Math.max(0, f.arrosee - dt);
      if (f.saut) {
        f.saut.t += dt;
        const k = Math.min(1, f.saut.t / 0.4);
        f.x = f.saut.x0 + (f.lieu.x - f.saut.x0) * k;
        f.y = f.saut.y0 + (f.lieu.y - f.saut.y0) * k - Math.sin(k * Math.PI) * 50;
        if (k >= 1) f.saut = null;
        continue;
      }
      if (f.sauteuse) {
        f.tSaut -= dt;
        if (f.tSaut <= 0) {
          f.tSaut = hasard(2, 3);
          const libres = lieuxLibres(['cheminee']);
          if (libres.length) {
            const dest = libres[Math.floor(Math.random() * libres.length)];
            f.lieu.flamme = null; dest.flamme = f;
            f.saut = { x0: f.x, y0: f.y, t: 0 }; f.lieu = dest;
            Son.etincelle();
          }
        }
      }
      if (f.arrosee <= 0) {
        f.force = Math.min(1, f.force + L.croiss * dt * (f.type === 'bbq' ? 1.3 : f.type === 'geante' ? 0.7 : 1));
        f.pic = Math.max(f.pic, f.force);
      }
      if (f.force >= 0.85 && !f.alerte) { f.alerte = true; Son.alerte(); }
      if (f.force < 0.8) f.alerte = false;
      if (f.force >= 1) {
        f.tMax += dt;
        if (Math.random() < dt * 6) monde.particules.push({ type: 'fumee', x: f.x + hasard(-6, 6), y: f.y - taille(f), vx: hasard(-10, 10) + m.vent * 30, vy: -25, vie: 1.4, max: 1.4, r: hasard(6, 11) });
        if (f.tMax >= ATTENTE_MAX) {
          f.tMax = 0; f.force = 0.7;
          texteFlottant(f.x, f.y - 50, t('flot.trop'), '#ffd0b0');
          if (L.etincelles) lancerEtincelle(f);
          perdreCoeur();
          if (m.fini) return;
        }
      } else f.tMax = 0;
    }
    // Étincelles en vol
    for (const e of m.etincelles.slice()) {
      e.t += dt;
      if (e.t >= e.dur) {
        m.etincelles.splice(m.etincelles.indexOf(e), 1);
        if (!e.lieu.flamme) nouvelleFlamme(e.lieu, 0.3);
      }
    }
    // Chats : patience, course après le sauvetage
    for (const c of m.chats.slice()) {
      c.t += dt;
      if (c.etat === 'attend') {
        c.patience -= dt;
        if (c.patience <= 0) {
          // Le chat saute tout seul dans un buisson, vexé : un cœur en moins
          c.etat = 'saute'; c.t = 0;
          texteFlottant(c.x, c.y - 30, t('flot.coeur'), '#ffd0d0');
          perdreCoeur();
          if (m.fini) return;
        }
      } else if (c.etat === 'saute') {
        c.y += 160 * dt; c.x += (c.x < 200 ? -30 : 30) * dt;
        if (c.t > 0.6) m.chats.splice(m.chats.indexOf(c), 1);
      } else if (c.etat === 'court') {
        c.x += c.vx * dt;
        if (c.x < -60 || c.x > 460) m.chats.splice(m.chats.indexOf(c), 1);
      }
    }
    // Nuage de pluie
    if (L.nuage) {
      if (!m.nuage) {
        m.tNuage -= dt;
        if (m.tNuage <= 0) { const g = Math.random() < 0.5; m.nuage = { x: g ? -70 : 470, y: 140, vx: g ? 26 : -26, pluie: 0, utilise: false }; }
      } else {
        const n = m.nuage;
        n.x += n.vx * dt;
        if (n.pluie > 0) {
          n.pluie -= dt;
          for (const f of m.flammes.slice()) if (!f.saut && Math.abs(f.x - n.x) < 50) { f.force -= dt * 0.9 / f.mult; f.arrosee = 0.15; if (f.force <= 0) eteindre(f); }
          for (let k = 0; k < 3; k++) m.particules.push({ type: 'pluie', x: n.x + hasard(-45, 45), y: n.y + 20, vx: m.vent * 40, vy: 420, vie: 1.2, max: 1.2, r: 1 });
        }
        if (n.x < -100 || n.x > 500) { m.nuage = null; m.tNuage = hasard(12, 17); }
      }
    }
    majCamions(dt);
    majJets(dt);
    // Clavier : déplacement continu du viseur
    if (touches.size) {
      const v = 230 * dt;
      if (touches.has('ArrowLeft')) m.viseur.x -= v;
      if (touches.has('ArrowRight')) m.viseur.x += v;
      if (touches.has('ArrowUp')) m.viseur.y -= v;
      if (touches.has('ArrowDown')) m.viseur.y += v;
      m.viseur.x = bornee(m.viseur.x, 0, VW); m.viseur.y = bornee(m.viseur.y, 80, 600);
      bougerJet('clavier', m.viseur.x, m.viseur.y);
    }
    // Fin du niveau : tous les feux prévus sont venus et éteints, tous les chats sauvés
    if (!m.fini && m.lancees >= L.feux && !m.flammes.length && !m.etincelles.length && m.chatsSauves >= L.chats) {
      m.tFin += dt;
      if (m.tFin > 0.7) finNiveau(true);
    } else m.tFin = 0;
    majHud();
  }

  // Animations communes (aussi pendant le titre, la pause et la fin)
  function majAnimations(dt) {
    const m = monde;
    for (const p of m.particules) {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.type === 'goutte' || p.type === 'confetti' || p.type === 'etincelle-or') p.vy += 260 * dt;
      if (p.type === 'confetti') p.vx *= 0.99;
    }
    m.particules = m.particules.filter((p) => p.vie > 0 && !(p.type === 'pluie' && p.y > 590));
    if (m.particules.length > 600) m.particules.splice(0, m.particules.length - 600);
    for (const tx of m.textes) { tx.vie -= dt; tx.y -= 28 * dt; }
    m.textes = m.textes.filter((x) => x.vie > 0);
    m.secousse = Math.max(0, m.secousse - dt);
    for (const l of m.linges) { l.secoue = Math.max(0, l.secoue - dt); l.mouille = Math.max(0, l.mouille - dt * 0.15); }
    for (const f of m.feuillesVent) {
      f.p += dt;
      f.x += (m.vent * 110 + 6) * dt; f.y += Math.sin(f.p * 2) * 12 * dt;
      if (f.x > 460) f.x = -50; if (f.x < -60) f.x = 450;
    }
  }

  // ---------------------------------------------------------------------------
  // Dessin
  // ---------------------------------------------------------------------------
  function arrondi(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function rond(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }

  function dessiner() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    if (!monde) return;
    const m = monde;
    const sx = m.secousse > 0 ? hasard(-4, 4) * m.secousse * 2.5 : 0;
    const sy = m.secousse > 0 ? hasard(-4, 4) * m.secousse * 2.5 : 0;
    ctx.save();
    ctx.translate(offX + sx, offY + sy);
    ctx.scale(ech, ech);
    const g = -offX / ech - 10, d = (cw - offX) / ech + 10, h = -offY / ech - 10, b = (ch - offY) / ech + 10;
    const nuit = L.nuit && !m.titre;
    dessinerFond(g, d, h, b, nuit);
    const fenetres = [];
    for (const mai of m.maisons.slice(0, 3)) dessinerMaison(mai, fenetres);
    dessinerManche();
    // pelouse devant
    for (const mai of m.maisons.slice(3)) dessinerMaison(mai, fenetres);
    ARBRES.forEach((a) => dessinerArbre(a));
    for (const l of m.lieux) {
      if (l.type === 'bbq') dessinerBBQ(l.bx, l.by);
      if (l.type === 'feuilles') dessinerTasFeuilles(l.bx, l.by);
    }
    for (const l of m.linges) dessinerLinge(l);
    dessinerRoute(g, d);
    if (L.citerne || m.titre) BORNES.forEach((bo) => dessinerBorne(bo));
    if (nuit) {
      ctx.fillStyle = 'rgba(10,14,48,0.5)'; ctx.fillRect(g, h, d - g, b - h);
      for (const f of fenetres) { ctx.fillStyle = 'rgba(255,214,110,0.95)'; ctx.fillRect(f.x, f.y, f.w, f.h); rond(f.x + f.w / 2, f.y + f.h / 2, f.w * 1.3, 'rgba(255,214,110,0.12)'); }
    }
    // tuyau de remplissage
    for (const c of m.camions) if (c.tache && c.tache.type === 'remplir' && c.tache.phase !== 'aller') {
      const bo = c.tache.borne;
      ctx.strokeStyle = '#3a5fb0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(bo.x + (bo.x < 200 ? 8 : -8), bo.y - 14);
      ctx.quadraticCurveTo((bo.x + c.x) / 2, c.voie + 6, c.x + (bo.x < 200 ? -38 : 38), c.voie - 26); ctx.stroke();
    }
    // camions (voies du fond d'abord)
    m.camions.slice().sort((a, b2) => a.voie - b2.voie).forEach((c) => dessinerCamion(c));
    for (const c of m.chats) dessinerChat(c);
    for (const f of m.flammes) dessinerFlamme(f);
    for (const e of m.etincelles) {
      const k = e.t / e.dur, c = { x: e.lieu.x, y: e.lieu.y };
      const x = e.x0 + (c.x - e.x0) * k, y = e.y0 + (c.y - e.y0) * k - Math.sin(k * Math.PI) * 60;
      rond(x, y, 10, 'rgba(255,170,40,0.35)'); rond(x, y, 5, '#ffd84a');
    }
    // jets d'eau
    for (const j of jets.values()) if (j.actif && j.impact) dessinerJet(buse(j.camion), j.impact, j);
    if (m.titre) dessinerJetTitre();
    if (m.nuage) dessinerNuage(m.nuage);
    dessinerParticules();
    if (m.titre) dessinerPompier(330, 590, 1, progres.casque);
    if (m.clavier && (etat === 'jeu')) dessinerViseur(m.viseur.x, m.viseur.y);
    for (const tx of m.textes) {
      ctx.globalAlpha = Math.min(1, tx.vie * 1.5);
      ctx.font = '800 16px ui-rounded, system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,30,60,0.85)'; ctx.strokeText(tx.txt, tx.x, tx.y);
      ctx.fillStyle = tx.couleur; ctx.fillText(tx.txt, tx.x, tx.y);
      ctx.globalAlpha = 1;
    }
    if (etat === 'tuto') dessinerTuto();
    ctx.restore();
  }

  function dessinerFond(g, d, h, b, nuit) {
    const ciel = ctx.createLinearGradient(0, h, 0, 300);
    if (nuit) { ciel.addColorStop(0, '#0d1236'); ciel.addColorStop(1, '#2a3570'); }
    else { ciel.addColorStop(0, '#5fb6ef'); ciel.addColorStop(1, '#c6ecff'); }
    ctx.fillStyle = ciel; ctx.fillRect(g, h, d - g, 320 - h);
    if (nuit) {
      const r = graine(5);
      for (let i = 0; i < 40; i++) rond(g + r() * (d - g), h + r() * (240 - h), r() * 1.4 + 0.5, 'rgba(255,255,230,' + (0.5 + 0.5 * Math.sin(horloge * 2 + i)) + ')');
      rond(330, 80, 22, '#fff6cf'); rond(340, 74, 20, '#2a3570');
    } else {
      rond(60, 80, 26, '#fff3a8'); rond(60, 80, 36, 'rgba(255,243,168,0.3)');
      // nuages de beau temps
      const dx = (horloge * 6) % 520;
      for (const [x0, y0, s] of [[40, 60, 1], [250, 110, 0.8], [420, 50, 0.9]]) {
        const x = ((x0 + dx + 60) % 520) - 60;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath(); ctx.arc(x, y0, 14 * s, 0, 7); ctx.arc(x + 16 * s, y0 - 8 * s, 16 * s, 0, 7); ctx.arc(x + 34 * s, y0, 13 * s, 0, 7); ctx.fill();
      }
    }
    // collines
    ctx.fillStyle = nuit ? '#2d5a46' : '#8fd17a';
    ctx.beginPath(); ctx.moveTo(g, 300);
    for (let x = g; x <= d; x += 20) ctx.lineTo(x, 250 + Math.sin(x / 45) * 14 + Math.sin(x / 17) * 5);
    ctx.lineTo(d, 300); ctx.fill();
    // pelouse
    ctx.fillStyle = nuit ? '#3f7a45' : '#7cc768'; ctx.fillRect(g, 296, d - g, 280);
    ctx.fillStyle = nuit ? '#376c3d' : '#6fbb5b'; ctx.fillRect(g, 470, d - g, 106);
    // allée et bas de l'écran
    ctx.fillStyle = nuit ? '#3f7a45' : '#7cc768'; ctx.fillRect(g, 700, d - g, b - 700);
  }

  function dessinerMaison(m, fenetres) {
    const x = m.x, y = m.base - m.h, w = m.w, h = m.h;
    const c = m.chem;
    // cheminée (derrière le toit)
    ctx.fillStyle = m.boulangerie ? '#9b5a3c' : '#a8644a';
    ctx.fillRect(c.x - c.l / 2, c.y, c.l, c.yBas - c.y + 6);
    ctx.fillStyle = '#5c3a2c'; ctx.fillRect(c.x - c.l / 2 - 3, c.y - 4, c.l + 6, 6);
    // mur
    ctx.fillStyle = m.boulangerie ? '#f7e3c2' : m.mur; arrondi(x, y, w, h, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2; ctx.stroke();
    // toit
    ctx.fillStyle = m.toitC;
    ctx.beginPath(); ctx.moveTo(x - 8, y + 3); ctx.lineTo(x + w / 2, y - m.toit); ctx.lineTo(x + w + 8, y + 3); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.stroke();
    // tuiles
    ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1.5;
    for (let k = 1; k < 4; k++) { const yy = y + 3 - m.toit * k / 4; const dx = (w / 2 + 8) * (1 - k / 4); ctx.beginPath(); ctx.moveTo(x + w / 2 - dx, yy); ctx.lineTo(x + w / 2 + dx, yy); ctx.stroke(); }
    // porte et fenêtres
    const pw = w * 0.2;
    ctx.fillStyle = '#7a4a2e'; arrondi(x + w / 2 - pw / 2, y + h - h * 0.45, pw, h * 0.45, 4); ctx.fill();
    rond(x + w / 2 + pw * 0.25, y + h - h * 0.22, 1.8, '#ffd84a');
    const fw = w * 0.2, fh = h * 0.24;
    for (const fx of [x + w * 0.12, x + w * 0.68]) {
      ctx.fillStyle = '#ffffff'; ctx.fillRect(fx - 2, y + h * 0.2 - 2, fw + 4, fh + 4);
      ctx.fillStyle = '#9fd4f5'; ctx.fillRect(fx, y + h * 0.2, fw, fh);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(fx + fw / 2, y + h * 0.2); ctx.lineTo(fx + fw / 2, y + h * 0.2 + fh); ctx.stroke();
      fenetres.push({ x: fx, y: y + h * 0.2, w: fw, h: fh });
      // jardinière
      ctx.fillStyle = '#9b5a3c'; ctx.fillRect(fx - 2, y + h * 0.2 + fh + 2, fw + 4, 4);
      for (let k = 0; k < 3; k++) rond(fx + 3 + k * fw / 3, y + h * 0.2 + fh + 1, 2.4, ['#ff6b8a', '#ffd84a', '#ff9a3c'][k]);
    }
    if (m.boulangerie) {
      // auvent rayé et pains dans la vitrine
      for (let k = 0; k < 8; k++) { ctx.fillStyle = k % 2 ? '#ffffff' : '#d8352a'; ctx.fillRect(x + 4 + k * (w - 8) / 8, y + h * 0.5, (w - 8) / 8, 9); }
      ctx.fillStyle = '#f6efe2'; ctx.fillRect(x + w * 0.08, y + h * 0.62, w * 0.28, h * 0.3);
      for (let k = 0; k < 2; k++) { ctx.fillStyle = '#d99a4a'; ctx.beginPath(); ctx.ellipse(x + w * 0.16 + k * 12, y + h * 0.8, 6, 4, 0, 0, 7); ctx.fill(); }
    }
  }

  function dessinerArbre(a) {
    ctx.fillStyle = '#8a5a35'; ctx.fillRect(a.x - 5, a.y, 10, 470 - a.y);
    ctx.fillStyle = '#4fa34a';
    ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, 7); ctx.arc(a.x - a.r * 0.6, a.y + 8, a.r * 0.7, 0, 7); ctx.arc(a.x + a.r * 0.6, a.y + 8, a.r * 0.7, 0, 7); ctx.fill();
    rond(a.x - 8, a.y - 10, a.r * 0.35, 'rgba(255,255,255,0.15)');
    for (const [dx, dy] of [[-12, 4], [10, -6], [4, 12]]) rond(a.x + dx, a.y + dy, 3, '#e9524a');
  }
  function dessinerBBQ(x, y) {
    ctx.strokeStyle = '#3a3a44'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x - 8, y + 4); ctx.lineTo(x - 13, y + 22); ctx.moveTo(x + 8, y + 4); ctx.lineTo(x + 13, y + 22); ctx.stroke();
    ctx.fillStyle = '#2f2f38'; ctx.beginPath(); ctx.arc(x, y - 4, 15, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = '#9aa0aa'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 16, y - 4); ctx.lineTo(x + 16, y - 4); ctx.stroke();
    rond(x + 13, y + 22, 3, '#3a3a44'); rond(x - 13, y + 22, 3, '#3a3a44');
  }
  function dessinerTasFeuilles(x, y) {
    const cs = ['#c9772a', '#e8963a', '#b5532a', '#e0b23a'];

  function dessinerFlamme(f) {

  function dessinerChat(c) {

      else if (p.type === 'goutte' || p.type === 'bulle') rond(p.x, p.y, p.r, 'rgba(120,195,255,' + a + ')');
      else if (p.type === 'braise') rond(p.x, p.y, p.r, 'rgba(255,190,60,' + a + ')');

  // Prépare le décor d'un tutoriel (flamme ou chat de démonstration)

    // 7 : camion à grande échelle garé devant
    if (etape >= 7) {
      c.save(); c.translate(36, 186); c.scale(0.55, 0.55);
      c.fillStyle = '#d8352a'; c.fillRect(-42, -40, 62, 30); c.fillStyle = '#e8463a'; c.fillRect(18, -44, 26, 34);
      c.fillStyle = '#bfe6ff'; c.fillRect(26, -40, 15, 12);
      c.strokeStyle = '#c9ced8'; c.lineWidth = 3; c.beginPath(); c.moveTo(-40, -46); c.lineTo(60, -110); c.stroke();
      c.fillStyle = '#23222b'; c.beginPath(); c.arc(-26, -8, 9, 0, 7); c.arc(28, -8, 9, 0, 7); c.fill();
      c.restore();
    }
    // 8 : guirlande de lumières
    if (etape >= 8) for (let k = 0; k < 14; k++) { c.fillStyle = ['#ff5a4a', '#ffd84a', '#4fb0ff', '#5cbf6a'][k % 4]; c.beginPath(); c.arc(80 + k * 11, 66 + Math.sin(k / 13 * Math.PI) * 8, 3, 0, 7); c.fill(); }
    dessinerPompier(270, 182, 0.9, progres.casque, c);
  }

  // ---------------------------------------------------------------------------
  // Écran titre : le village en fête, le camion arrose une cheminée
  // ---------------------------------------------------------------------------
  function preparerTitre() {
    L = Object.assign({}, NIVEAUX[6], { citerne: 0, nuit: false, vent: 0 });
    monde = creerMonde(7, true);
    monde.camions[0].x = 220;
    const l = monde.lieux.find((x) => x.type === 'cheminee' && x.x > 300) || monde.lieux[0];
    nouvelleFlamme(l, 0.55);
    const b = monde.lieux.find((x) => x.type === 'bbq');
    if (b) nouvelleFlamme(b, 0.3);
    monde.chats.push({ arbre: 0, x: ARBRES[0].x, y: ARBRES[0].y - ARBRES[0].r + 4, patience: 1, max: 1, etat: 'pose', t: 0, pelage: PELAGES[0] });
    monde.particules = [];
  }

  // ---------------------------------------------------------------------------
  // Entrées : doigt, souris, clavier
  // ---------------------------------------------------------------------------
  const touches = new Set();
  const dansCercle = (p, x, y, r) => Math.hypot(p.x - x, p.y - y) <= r;
  function toucherMonde(p, id) {
    // ordre : chat, nuage, borne, camion, sinon arroser
    for (const c of monde.chats) if (c.etat === 'attend' && dansCercle(p, c.x, c.y - 12, 30)) { sauverChat(c); return; }
    const n = monde.nuage;
    if (n && !n.utilise && dansCercle(p, n.x, n.y, 46)) { n.utilise = true; n.pluie = 3; Son.pluie(); texteFlottant(n.x, n.y - 36, t('flot.pluie'), '#d8f0ff'); return; }
    if (L.citerne) {
      for (const bo of BORNES) if (dansCercle(p, bo.x, bo.y - 14, 26)) { const c = camionARemplir(); if (!c) { message(t('flot.occupe')); } else remplir(c); return; }
      for (const c of monde.camions) if (p.x > c.x - 46 && p.x < c.x + 46 && p.y > c.voie - 56 && p.y < c.voie + 6) { if (c.tache) message(t('flot.occupe')); else remplir(c); return; }
    }
    commencerJet(id, p.x, p.y);
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    Son.init();
    if (etat === 'tuto') { avancerTuto(); return; }
    if (etat !== 'jeu') return;
    monde.clavier = false;
    try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    toucherMonde(versMonde(e.clientX, e.clientY), e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (etat !== 'jeu') return;
    const p = versMonde(e.clientX, e.clientY);
    bougerJet(e.pointerId, p.x, p.y);
  });
  const lacher = (e) => arreterJet(e.pointerId);
  canvas.addEventListener('pointerup', lacher);
  canvas.addEventListener('pointercancel', lacher);
  canvas.addEventListener('lostpointercapture', lacher);
  $('tuto').addEventListener('pointerdown', (e) => { e.preventDefault(); Son.init(); avancerTuto(); });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  // Cibles du clavier (Tab) : flammes et chats, de gauche à droite
  function cibleSuivante() {
    const liste = [...monde.flammes.map(centreFlamme), ...monde.chats.filter((c) => c.etat === 'attend').map((c) => ({ x: c.x, y: c.y - 12 }))].sort((a, b) => a.x - b.x);
    if (!liste.length) return;
    const v = monde.viseur;
    const suivante = liste.find((p) => p.x > v.x + 2) || liste[0];
    v.x = suivante.x; v.y = suivante.y;
    bougerJet('clavier', v.x, v.y);
  }

  document.addEventListener('keydown', (e) => {
    Son.init();
    const k = e.code;
    if (etat === 'jeu' || etat === 'tuto' || etat === 'pause') {
      if (k === 'Escape' || k === 'KeyP') { e.preventDefault(); if (etat === 'pause') reprendre(); else pause(); return; }
    }
    if (etat === 'tuto') {
      if (k === 'Space' || k === 'Enter' || k === 'NumpadEnter') { e.preventDefault(); avancerTuto(); }
      return;
    }
    if (etat === 'titre' && (k === 'Enter' || k === 'Space') && (document.activeElement === document.body || !document.activeElement)) { e.preventDefault(); jouer(); return; }
    if (etat !== 'jeu') return;
    if (!monde.clavier) { monde.clavier = true; const f = monde.flammes[0]; if (f) { const c = centreFlamme(f); monde.viseur.x = c.x; monde.viseur.y = c.y; } }
    if (k.startsWith('Arrow')) { e.preventDefault(); touches.add(k); return; }
    if (k === 'Tab') { e.preventDefault(); cibleSuivante(); return; }
    if (k === 'Space') { e.preventDefault(); if (!e.repeat && !jets.has('clavier')) commencerJet('clavier', monde.viseur.x, monde.viseur.y); return; }
    if (k === 'Enter' || k === 'NumpadEnter') { e.preventDefault(); if (!e.repeat) { toucherMonde({ x: monde.viseur.x, y: monde.viseur.y }, 'clavier'); arreterJet('clavier'); } return; }
    if (k === 'KeyR') { e.preventDefault(); const c = camionARemplir(); if (c) remplir(c); else message(t('flot.occupe')); return; }
    const chiffre = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[k];
    if (chiffre != null && chiffre < L.camions) { monde.camionChoisi = chiffre; message(t('flot.camion', { n: nb(chiffre + 1) })); Son.clic(); }
  });
  document.addEventListener('keyup', (e) => {
    touches.delete(e.code);
    if (e.code === 'Space' && monde) arreterJet('clavier');
  });

  // Boutons
  $('b-jouer').addEventListener('click', jouer);
  $('b-niveaux').addEventListener('click', ouvrirNiveaux);
  $('b-caserne').addEventListener('click', ouvrirCaserne);
  $('b-niveaux-retour').addEventListener('click', () => { Son.clic(); allerAccueil(); });
  $('b-caserne-retour').addEventListener('click', () => { Son.clic(); allerAccueil(); });
  $('b-pause').addEventListener('click', () => { Son.init(); Son.clic(); pause(); });
  $('b-reprendre').addEventListener('click', () => { Son.clic(); reprendre(); });
  $('b-recommencer').addEventListener('click', () => { Son.clic(); demarrerNiveau(niveau); });
  $('b-accueil').addEventListener('click', () => { Son.clic(); allerAccueil(); });
  $('b-suivant').addEventListener('click', () => { Son.clic(); demarrerNiveau(niveau + 1); });
  $('b-reessayer').addEventListener('click', () => { Son.clic(); demarrerNiveau(niveau); });
  $('b-rejouer').addEventListener('click', () => { Son.clic(); demarrerNiveau(niveau); });
  $('b-fin-niveaux').addEventListener('click', ouvrirNiveaux);
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));

  // Pause automatique quand l'écran est caché
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  window.addEventListener('blur', () => { touches.clear(); if (monde) arreterJet('clavier'); });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  const enPartie = () => etat === 'jeu' || etat === 'tuto' || (etat === 'pause' && monde && !monde.fini);
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie()) window.JEL_SAVE.save(JEU, { niveau, score: monde ? monde.score : 0, progres, options: { son: sonActif } });
  });

  // ---------------------------------------------------------------------------
  // Boucle principale
  // ---------------------------------------------------------------------------
  let avant = performance.now();
  function boucle(now) {
    const dt = Math.min(0.05, (now - avant) / 1000);
    avant = now;
    horloge += dt;
    if (etat === 'jeu') majPartie(dt);
    if (etat === 'tuto') tutoTemps += dt;
    if (monde && etat !== 'pause') {
      majAnimations(dt);
      if (monde.titre) for (const f of monde.flammes) f.phase += dt;
      if (monde.titre) for (const c of monde.camions) c.gyro += dt;
      if (etat === 'fin' || etat === 'tuto') for (const f of monde.flammes) f.phase += dt;
    }
    dessiner();
    requestAnimationFrame(boucle);
  }

  majBoutonsSon();
  redimensionner();
  preparerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
