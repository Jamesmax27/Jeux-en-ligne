const ft = document.getElementById('fond-titre');
const fc = ft.getContext('2d');
function dessinerTitre(temps) {
  const w = innerWidth, h = innerHeight;
  fc.setTransform(DPR, 0, 0, DPR, 0, 0);
  dessinerFond(fc, w, h, temps);
  // grande planète
  const px = w * 0.78, py = h * 0.2, pr = Math.min(w, h) * 0.3;
  const g = fc.createRadialGradient(px - pr * 0.4, py - pr * 0.4, pr * 0.1, px, py, pr);
  g.addColorStop(0, '#ffc6a0'); g.addColorStop(0.5, '#d0607a'); g.addColorStop(1, '#3a1450');
  fc.fillStyle = g; fc.beginPath(); fc.arc(px, py, pr, 0, 6.28); fc.fill();
  fc.strokeStyle = 'rgba(255,220,180,.55)'; fc.lineWidth = pr * 0.07;
  fc.beginPath(); fc.ellipse(px, py, pr * 1.6, pr * 0.35, -0.35, 0.1, Math.PI - 0.1, true); fc.stroke();

  fc.fillStyle = '#9fb0e8'; fc.beginPath(); fc.arc(w * 0.16, h * 0.12, Math.min(w, h) * 0.05, 0, 6.28); fc.fill();

  const H = Math.max(180, hautScene), W = Math.min(w, H * 1.25), X0 = (w - W) / 2;
  const X = (x) => X0 + x * W, Y = (y) => y * H;
  const s = Math.min(W / 7, H / 7.5);
  const pts = [[-X0 / W - 0.1, 0.36], [0.25, 0.4], [0.5, 0.22], [0.76, 0.42], [0.62, 0.7], [0.4, 0.8]];
  fc.lineCap = 'round'; fc.lineJoin = 'round';
  fc.strokeStyle = 'rgba(30,40,100,.95)'; fc.lineWidth = s * 0.8;
  fc.beginPath(); pts.forEach(([x, y], i) => i ? fc.lineTo(X(x), Y(y)) : fc.moveTo(X(x), Y(y))); fc.stroke();
  fc.strokeStyle = 'rgba(94,140,255,.4)'; fc.lineWidth = s * 0.6; fc.stroke();
  fc.setLineDash([s * 0.18, s * 0.3]); fc.lineDashOffset = -temps * s; fc.strokeStyle = 'rgba(160,200,255,.6)'; fc.lineWidth = s * 0.06; fc.stroke(); fc.setLineDash([]);

  const tourelles = [['laser', 0.22, 0.18], ['plasma', 0.5, 0.5], ['arc', 0.84, 0.2], ['cryo', 0.86, 0.66], ['lance', 0.14, 0.64]];

  drones.forEach((type, i) => {
    const k = ((temps * 0.05 + i * 0.16) % 0.85);
    const seg = k * (pts.length - 1), j = Math.min(pts.length - 2, Math.floor(seg)), q = seg - j;
    const x = X(pts[j][0] + (pts[j + 1][0] - pts[j][0]) * q), y = Y(pts[j][1] + (pts[j + 1][1] - pts[j][1]) * q);
    const a = Math.atan2(Y(pts[j + 1][1]) - Y(pts[j][1]), X(pts[j + 1][0]) - X(pts[j][0]));
    positions.push({ x, y });
    dessinerDrone(fc, type, x, y, s, a, temps + i, null);
  });
  tourelles.forEach(([type, x, y], i) => {
    const tx = X(x), ty = Y(y);
    const cible = positions[i % positions.length];
    const ang = Math.atan2(cible.y - ty, cible.x - tx);
    if (Math.sin(temps * 4 + i * 1.7) > 0.6 && type !== 'cryo') {
      fc.strokeStyle = TOURS[type].couleur; fc.lineWidth = type === 'lance' ? 4 : 2; fc.shadowColor = TOURS[type].couleur; fc.shadowBlur = 10;
      fc.beginPath(); fc.moveTo(tx, ty); fc.lineTo(cible.x, cible.y); fc.stroke(); fc.shadowBlur = 0;
    }
    if (type === 'cryo') { fc.strokeStyle = 'rgba(159,216,255,' + (0.6 - (temps % 1) * 0.6) + ')'; fc.lineWidth = 2; fc.beginPath(); fc.arc(tx, ty, s * (0.4 + (temps % 1) * 1.2), 0, 6.28); fc.stroke(); }
    dessinerTour(fc, type, tx, ty, s * 1.2, 2, ang, temps);

}

    modePanneau = 'base';
    if (pouvoirVise) info.textContent = tr('bulle.viser');
    else if (etat.vague < etat.vagues.length && (etat.tours.length || etat.vague > 0)) apercuVague(info);
    else info.textContent = tr('panneau.aide');
    panneau.appendChild(info);
    const r = document.createElement('div'); r.className = 'rangee';
    ORDRE_POUVOIRS.forEach((nom) => {
      if (!debloque(nom, 'pouvoir')) return;
      const p = etat.pouvoirs[nom];
      const btn = bouton('outil' + (pouvoirVise === nom ? ' vise' : ''), [iconePouvoirCanvas(nom), span('prix', nb(coutPouvoir(nom))), span('nom', tr('pouvoir.' + nom))], () => choisirPouvoir(nom));
      btn.dataset.pouvoir = nom;
      btn.setAttribute('aria-label', tr('aria.pouvoir', { nom: tr('pouvoir.' + nom), prix: nb(coutPouvoir(nom)) }));
      btn.title = tr('pouvoir.' + nom + '.info');
      const barre = document.createElement('div'); barre.className = 'recharge'; btn.appendChild(barre);
      r.appendChild(btn);
    });
    const v = document.createElement('button'); v.id = 'b-vague'; v.className = 'outil';
    v.addEventListener('click', (e) => { e.stopPropagation(); ac(); lancerVague(); });
    r.appendChild(v);
    panneau.appendChild(r);
    vagueTexte = '';
    majBoutonVague();
  }
  if (etat.tuto && etat.tuto.etape >= 1) majTuto();
}
/* Aperçu de la prochaine vague : une icône par sorte de drone et leur nombre. */
function apercuVague(info) {
  const comptes = {};
  etat.vagues[etat.vague].forEach((e) => { comptes[e.type] = (comptes[e.type] || 0) + 1; });
  info.appendChild(document.createTextNode(tr('panneau.prochaine')));
  Object.keys(comptes).forEach((type) => {
    const g = document.createElement('span'); g.style.display = 'inline-flex'; g.style.alignItems = 'center'; g.style.gap = '1px';
    const c = document.createElement('canvas'); c.width = 40; c.height = 40; c.style.width = '20px'; c.style.height = '20px';
    const k = c.getContext('2d');
    dessinerDrone(k, type, 20, 20, 13 / ENNEMIS[type].taille, 0, 0, null);
    g.appendChild(c);
    const b = document.createElement('b'); b.textContent = tr('hud.fois', { n: comptes[type] }); g.appendChild(b);
    g.title = tr('ennemi.' + type);
    info.appendChild(g);
  });
}
let vagueTexte = '';
function majBoutonVague() {
  const v = document.getElementById('b-vague');
  if (!v || !etat) return;
  let txt, petit = '';
  if (etat.vague >= etat.vagues.length && !etat.file.length) { txt = tr('vague.derniere'); v.disabled = true; }
  else if (etat.file.length) { txt = tr('vague.encours', { n: etat.vague, total: etat.vagues.length }); v.disabled = true; }
  else if (etat.vague === 0) { txt = tr('vague.lancer', { n: 1 }); v.disabled = false; }
  else { txt = tr('vague.lancer', { n: etat.vague + 1 }); petit = tr('vague.bonus', { s: nb(Math.ceil(Math.max(0, etat.compte))), n: nb(bonusAppel()) }); v.disabled = false; }
  const cle = txt + '|' + petit + '|' + v.disabled;
  if (cle !== vagueTexte) {
    vagueTexte = cle;
    v.textContent = txt;
    if (petit) { const s = document.createElement('small'); s.textContent = petit; v.appendChild(s); }
  }
}
function majRecharges() {
  if (!etat) return;
  if (modePanneau === 'construire') panneau.querySelectorAll('[data-tour]').forEach((b) => b.classList.toggle('trop-cher', etat.credits < TOURS[b.dataset.tour].cout));
  if (modePanneau === 'tour') panneau.querySelectorAll('[data-prix]').forEach((b) => b.classList.toggle('trop-cher', etat.credits < +b.dataset.prix));
  if (modePanneau !== 'base') return;
  panneau.querySelectorAll('[data-pouvoir]').forEach((btn) => {
    const nom = btn.dataset.pouvoir, p = etat.pouvoirs[nom];
    const barre = btn.querySelector('.recharge');
    barre.style.width = (p.recharge > 0 ? (1 - p.recharge / POUVOIRS[nom].recharge) * 100 : 100) + '%';
    barre.style.background = p.recharge > 0 ? '#5a68c8' : '#5ef0ff';
    btn.classList.toggle('trop-cher', p.recharge > 0 || etat.credits < coutPouvoir(nom));
  });
}

/* =====================================================================
   Écrans
   ===================================================================== */
function montrer(id) {
  document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('visible', e.id === id));
}
function allerTitre() {
  etat = null; ecran = 'titre'; finTutoSilencieux();
  montrer('ecran-titre');
  majPanneau();
  redimensionner();
}
function ouvrirNiveaux() {
  lireProgression();
  ecran = 'niveaux'; etat = null; finTutoSilencieux(); majPanneau();
  const g = document.getElementById('grille-niveaux'); g.innerHTML = '';
  NIVEAUX.forEach((n, i) => {
    const ouvert = i + 1 <= prog.debloque;
    const b = document.createElement('button');
    b.className = 'case-niv' + (ouvert ? '' : ' ferme');
    const num = document.createElement('span'); num.textContent = nb(i + 1); b.appendChild(num);
    if (ouvert) {
      const e = document.createElement('span'); e.className = 'etoiles-mini';
      for (let k = 0; k < 3; k++) { const s = document.createElement('span'); s.textContent = '★'; if (k >= (prog.etoiles[i] || 0)) s.className = 'vide'; e.appendChild(s); }
      b.appendChild(e);
      b.setAttribute('aria-label', tr('aria.niveau', { n: i + 1, etoiles: prog.etoiles[i] || 0 }));
      b.addEventListener('click', () => { ac(); son('clic'); demarrerNiveau(i); });
    } else {
      b.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="#a9b2e0"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#a9b2e0" stroke-width="2.4" fill="none"/></svg>');
      b.disabled = true;
      b.setAttribute('aria-label', tr('aria.ferme', { n: i + 1 }));
    }
    g.appendChild(b);
  });
  document.getElementById('total-etoiles').textContent = tr('niveaux.total', { n: nb(totalEtoiles()), max: nb(NIVEAUX.length * 3) });
  montrer('ecran-niveaux');
}

let introsVues = {};
function demarrerNiveau(idx) {
  idx = Math.max(0, Math.min(NIVEAUX.length - 1, idx));
  nouvellePartie(idx);
  ecran = 'jeu';
  montrer('');
  redimensionner();
  majHud(); majPanneau();
  // Nouveautés et tutoriel : tant que le niveau n'a pas encore été gagné.
  const premiere = !(prog.etoiles[idx] > 0);
  const nouveautes = premiere ? (NIVEAUX[idx].nouveau || []).slice() : [];
  if (idx === 0 && premiere) etat.tuto = { etape: 0 };
  montrerIntros(nouveautes, () => {
    if (!etat) return;
    if (etat.tuto) { etat.tuto.etape = 1; majTuto(); }
    else bulle(tr('bulle.debut', { n: idx + 1 }));
  });
}
function montrerIntros(liste, fin) {
  if (!liste.length) { ecran = 'jeu'; montrer(''); fin(); return; }
  const cle = liste.shift();
  const [genre, nom] = cle.split(':');
  ecran = 'intro';
  document.getElementById('intro-etiquette').textContent = tr('intro.' + genre);
  document.getElementById('intro-titre').textContent = genre === 'regle' ? tr('regle.' + nom) : tr(genre + '.' + nom);
  document.getElementById('intro-texte').textContent = tr(genre + '.' + nom + '.info');
  sceneCle = cle; sceneDebut = performance.now() / 1000;
  montrer('ecran-intro');
  const ok = document.getElementById('b-intro-ok');
  ok.onclick = () => { ac(); son('clic'); sceneCle = null; montrerIntros(liste, fin); };
  setTimeout(() => ok.focus(), 50);
}

/* ---------- Tutoriel animé (niveau 1) ---------- */
function majTuto() {
  const box = document.getElementById('tuto');
  if (!etat || !etat.tuto || etat.tuto.etape < 1) { box.classList.remove('visible'); return; }
  // Étape 2 sans case choisie (le joueur a touché ailleurs) : retour à l'étape 1.
  if (etat.tuto.etape === 2 && !(selection && selection.type === 'case')) etat.tuto.etape = 1;
  box.classList.add('visible');
  const e = etat.tuto.etape;
  // La bulle se place juste au-dessus du panneau du bas.
  document.getElementById('tuto-texte').style.bottom = Math.round(innerHeight - panneau.getBoundingClientRect().top + 10) + 'px';
  document.getElementById('tuto-etape').textContent = tr('tuto.etape', { n: e, total: 3 });
  document.getElementById('tuto-msg').textContent = tr('tuto.' + e);
  placerMain();
}
function placerMain() {
  if (!etat || !etat.tuto) return;
  const main = document.getElementById('tuto-main');
  const z = document.getElementById('zone').getBoundingClientRect();
  let x, y;
  if (etat.tuto.etape === 1) { x = z.left + OX + (2.5) * T; y = z.top + OY + (4.5) * T; }
  else if (etat.tuto.etape === 2) { const b = panneau.querySelector('[data-tour="laser"]'); if (b) { const r = b.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; } }
  else { const b = document.getElementById('b-vague'); if (b) { const r = b.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; } }
  if (x !== undefined) { main.style.left = (x - 14) + 'px'; main.style.top = (y - 4) + 'px'; }
}
function finTuto() { if (etat) etat.tuto = null; majTuto(); }
function finTutoSilencieux() { document.getElementById('tuto').classList.remove('visible'); }
document.getElementById('tuto-passer').addEventListener('click', (e) => { e.stopPropagation(); ac(); son('clic'); finTuto(); });

/* ---------- Pause ---------- */
function pause() {
  if (ecran !== 'jeu' || !etat || etat.fini) return;
  ecran = 'pause';
  document.getElementById('pause-niveau').textContent = tr('pause.niveau', { n: etat.idx + 1, vague: Math.max(1, etat.vague), total: etat.vagues.length });
  document.getElementById('tuto').classList.remove('visible');
  montrer('ecran-pause');
  if (audio && audio.state === 'running') audio.suspend().catch(() => {});
  setTimeout(() => document.getElementById('b-reprendre').focus(), 30);
}
function reprendre() {
  if (ecran !== 'pause') return;
  ecran = 'jeu'; montrer('');
  if (audio) audio.resume().catch(() => {});
  majTuto();
}

/* ---------- Fin de niveau ---------- */
function etoilesPour(vies) { return vies >= 18 ? 3 : vies >= 10 ? 2 : 1; }
function finNiveau(gagne) {
  if (etat.fini) return;
  etat.fini = true; etat.gagne = gagne;
  finTuto();
  const idx = etat.idx, n = idx + 1;
  const titre = document.getElementById('fin-titre'), detail = document.getElementById('fin-detail');
  const zoneEt = document.getElementById('fin-etoiles'), boutons = document.getElementById('fin-boutons');
  const rec = document.getElementById('fin-record'), bilan = document.getElementById('fin-bilan');
  zoneEt.innerHTML = ''; boutons.innerHTML = ''; rec.textContent = ''; bilan.textContent = '';
  let score = etat.score;
  if (gagne) {
    score += etat.vies * 50;
    const et = etoilesPour(etat.vies);
    const ancien = prog.records[idx] || 0;
    prog.etoiles[idx] = Math.max(prog.etoiles[idx] || 0, et);
    if (score > ancien) prog.records[idx] = score;
    prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, n + 1));
    enregistrer(Math.min(NIVEAUX.length, n + 1));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n });
    const toutGagne = NIVEAUX.every((_, i) => (prog.etoiles[i] || 0) > 0);
    if (toutGagne) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    titre.textContent = n === NIVEAUX.length ? tr('fin.finale') : tr('fin.gagne');
    detail.textContent = tr('fin.detailGagne', { vies: nb(etat.vies), tues: nb(etat.tues) });
    for (let k = 0; k < 3; k++) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24');
      s.innerHTML = '<path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.1l1.5-7L2 9.3l7-.8z" fill="' + (k < et ? '#ffd36b' : '#3a4380') + '" stroke="#b8862a" stroke-width="1"/>';
      s.classList.add(k < et ? 'gagnee' : 'vide'); s.style.animationDelay = (0.25 + k * 0.3) + 's';
      zoneEt.appendChild(s);
    }
    setTimeout(() => { for (let k = 0; k < et; k++) bip(880 + k * 220, 0.15, 'triangle', 0.1, null, k * 0.3); }, 250);
    if (score > ancien && ancien > 0) rec.textContent = tr('fin.record');
    else if (ancien > 0) rec.textContent = tr('fin.recordAncien', { n: nb(ancien) });
    if (toutGagne) bilan.textContent = tr('fin.bilan', { n: nb(totalEtoiles()), max: nb(NIVEAUX.length * 3) });
    if (n < NIVEAUX.length) boutons.appendChild(bouton('gros', tr('fin.suivant'), () => demarrerNiveau(n)));
    boutons.appendChild(bouton('moyen', tr('fin.rejouer'), () => demarrerNiveau(idx)));
    boutons.appendChild(bouton('moyen', tr('bouton.niveaux'), ouvrirNiveaux));
    son('victoire');
    confettis();
  } else {
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: n });
    titre.textContent = tr('fin.perdu');
    detail.textContent = tr('fin.detailPerdu', { vague: nb(etat.vague), total: nb(etat.vagues.length) });
    boutons.appendChild(bouton('gros', tr('fin.reessayer'), () => demarrerNiveau(idx)));
    boutons.appendChild(bouton('moyen', tr('bouton.niveaux'), ouvrirNiveaux));
    boutons.appendChild(bouton('moyen', tr('bouton.accueil'), allerTitre));
    son('defaite');
  }
  // compteur du score qui défile
  const el = document.getElementById('fin-score');
  const debut = performance.now();
  (function defile() { const k = Math.min(1, (performance.now() - debut) / 900); el.textContent = tr('fin.score', { n: nb(Math.round(score * k)) }); if (k < 1) requestAnimationFrame(defile); })();
  setTimeout(() => { if (etat && etat.fini) { ecran = 'fin'; montrer('ecran-fin'); const b = boutons.querySelector('button'); if (b) b.focus(); } }, 700);
}
function confettis() {
  if (!etat) return;
  for (let i = 0; i < 60; i++) etat.effets.push({ type: 'eclat', x: Math.random() * COLS, y: -0.5, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 4, t: 0, d: 2 + Math.random(), c: ['#ffd36b', '#5ef0ff', '#ff7ad9', '#7dff9a', '#c49bff'][i % 5] });
}

/* =====================================================================
   Boucle principale
   ===================================================================== */
let dernier = performance.now();
function boucle(now) {
  const dt = Math.min(0.05, (now - dernier) / 1000); dernier = now;
  const temps = now / 1000;
  if (ecran === 'titre') dessinerTitre(temps);
  if (ecran === 'intro') dessinerScene(temps);
  if (etat && (ecran === 'jeu' || (etat.fini && ecran !== 'pause'))) {
    if (ecran === 'jeu' && !etat.fini) { for (let i = 0; i < etat.vitesse; i++) simuler(dt); }
    else if (etat.fini) { for (const f of etat.effets) { f.t += dt; if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; } } etat.effets = etat.effets.filter((f) => f.t < f.d); }
    if (etat) {
      dessiner(temps);
      if (!etat.fini) { majHud(); majBoutonVague(); majRecharges(); }
      if (etat.tuto) placerMain();
    }
  } else if ((ecran === 'pause' || ecran === 'intro') && etat) dessiner(temps);
  else if (ecran === 'niveaux') dessiner(temps);
  requestAnimationFrame(boucle);
}

/* ---------- Commandes ---------- */
cv.addEventListener('pointerdown', (e) => {
  ac();
  if (ecran !== 'jeu' || !etat) return;
  const r = cv.getBoundingClientRect();
  const fx = (e.clientX - r.left - OX) / T, fy = (e.clientY - r.top - OY) / T;
  curseur.visible = false;
  toucherCase(Math.floor(fx), Math.floor(fy), fx, fy);
});
document.getElementById('b-pause').addEventListener('click', () => { ac(); son('clic'); pause(); });
document.getElementById('b-vitesse').addEventListener('click', () => { ac(); if (!etat) return; etat.vitesse = etat.vitesse === 1 ? 2 : 1; son('clic'); majHud(); });
['b-son-jeu', 'b-son-titre', 'b-son-pause'].forEach((id) => document.getElementById(id).addEventListener('click', (e) => { e.stopPropagation(); basculerSon(); }));
document.getElementById('b-reprendre').addEventListener('click', () => { son('clic'); reprendre(); });
document.getElementById('b-recommencer').addEventListener('click', () => { if (audio) audio.resume().catch(() => {}); son('clic'); demarrerNiveau(etat ? etat.idx : 0); });
document.getElementById('b-pause-niveaux').addEventListener('click', () => { if (audio) audio.resume().catch(() => {}); ouvrirNiveaux(); });
document.getElementById('b-pause-accueil').addEventListener('click', () => { if (audio) audio.resume().catch(() => {}); allerTitre(); });
document.getElementById('b-niveaux').addEventListener('click', () => { ac(); son('clic'); ouvrirNiveaux(); });
document.getElementById('b-niveaux-retour').addEventListener('click', () => { son('clic'); allerTitre(); });
function jouer() {
  ac(); son('clic');
  lireProgression();
  window.JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { lireProgression(); demarrerNiveau(Math.max(1, Math.min(NIVEAUX.length, +d.niveau || 1)) - 1); },
    onNouvelle: () => demarrerNiveau(0),
    onEffacer: () => { lireProgression(); },
  });
}
document.getElementById('b-jouer').addEventListener('click', jouer);

document.addEventListener('keydown', (e) => {
  const code = e.code;
  if (ecran === 'titre') { if (code === 'Enter' || code === 'Space') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); jouer(); } return; }
  if (ecran === 'pause') { if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); reprendre(); } return; }
  if (ecran !== 'jeu' || !etat || etat.fini) return;
  ac();
  if (code === 'Escape') {
    e.preventDefault();
    if (pouvoirVise || selection) { pouvoirVise = null; selection = null; majPanneau(); } else pause();
    return;
  }
  if (code === 'KeyP') { e.preventDefault(); pause(); return; }
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (dirs[code]) {
    e.preventDefault();
    curseur.visible = true;
    curseur.x = Math.max(0, Math.min(COLS - 1, curseur.x + dirs[code][0]));
    curseur.y = Math.max(0, Math.min(LIGNES - 1, curseur.y + dirs[code][1]));
    return;
  }
  if (code === 'Enter') {
    e.preventDefault();
    if (!curseur.visible) { curseur.visible = true; return; }
    toucherCase(curseur.x, curseur.y, curseur.x + 0.5, curseur.y + 0.5); return;
  }
  if (code === 'Space') { e.preventDefault(); lancerVague(); return; }
  const chiffre = /^(Digit|Numpad)([1-9])$/.exec(code);
  if (chiffre) {
    const k = +chiffre[2];
    e.preventDefault();
    if (k <= 6 && selection && selection.type === 'case') { const dispo = ORDRE_TOURS.filter((ty) => debloque(ty, 'tour')); if (dispo[k - 1]) construire(dispo[k - 1]); }
    else if (k >= 7) { const nom = ORDRE_POUVOIRS[k - 7]; if (nom) { choisirPouvoir(nom); if (pouvoirVise) curseur.visible = true; } }
    return;
  }
  if (code === 'KeyU') { e.preventDefault(); ameliorer(); }
  if (code === 'KeyV') { e.preventDefault(); vendre(); }
  if (code === 'KeyC') { e.preventDefault(); changerCible(); }
  if (code === 'KeyF') { e.preventDefault(); etat.vitesse = etat.vitesse === 1 ? 2 : 1; majHud(); }
  if (code === 'KeyM') { e.preventDefault(); basculerSon(); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') pause(); });
window.addEventListener('blur', () => { /* la pause automatique vient de visibilitychange */ });
window.addEventListener('resize', () => { redimensionner(); if (etat) majPanneau(); });
if (window.ResizeObserver) new ResizeObserver(() => redimensionner()).observe(document.getElementById('zone'));

/* Sauvegarde à la fermeture, seulement pendant une partie. */
if (window.JEL_SAVE) window.JEL_SAVE.surFermeture(() => { if (etat && !etat.fini) enregistrer(etat.idx + 1); });

/* Démarrage */
lireProgression();
majBoutonsSon();
redimensionner();
setTimeout(redimensionner, 300);
requestAnimationFrame(boucle);
</script>
