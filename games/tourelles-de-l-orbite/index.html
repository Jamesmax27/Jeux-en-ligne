<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

/* ---------- Les 24 niveaux ----------

  { carte: 'zigzag', vagues: 9, credits: 260, pv: 1.64, budget: 10, drones: ['eclaireur', 'rapide', 'blinde', 'essaim', 'bouclier'], nouveau: ['ennemi:bouclier', 'tour:arc'] },
  { carte: 'longue', vagues: 10, credits: 270, pv: 1.74, budget: 11, drones: ['eclaireur', 'rapide', 'blinde', 'essaim', 'bouclier'], boss: 1, nouveau: ['ennemi:mere'] },
  { carte: 'spirale', vagues: 9, credits: 290, pv: 1.84, budget: 11, drones: ['eclaireur', 'rapide', 'blinde', 'essaim', 'bouclier'], nouveau: ['tour:lance'] },
  { carte: 'fourche', vagues: 10, credits: 300, pv: 1.94, budget: 11, drones: ['eclaireur', 'rapide', 'blinde', 'bouclier', 'furtif'], nouveau: ['ennemi:furtif'] },
  { carte: 'triple', vagues: 10, credits: 310, pv: 2.04, budget: 12, drones: ['eclaireur', 'rapide', 'blinde', 'essaim', 'bouclier', 'furtif'], nouveau: ['pouvoir:surcharge'] },
  { carte: 'flancs', vagues: 10, credits: 320, pv: 2.14, budget: 12, drones: ['rapide', 'blinde', 'essaim', 'bouclier', 'furtif', 'porteur'], nouveau: ['ennemi:porteur'] },
  { carte: 'serpent', vagues: 11, credits: 220, pv: 2.24, budget: 12, drones: ['eclaireur', 'blinde', 'essaim', 'bouclier', 'furtif', 'porteur'], amplis: [[3, 5], [4, 1], [2, 9]], nouveau: ['regle:amplis', 'regle:budget'] },
  { carte: 'longue', vagues: 11, credits: 330, pv: 2.36, budget: 12, drones: ['rapide', 'blinde', 'bouclier', 'furtif', 'porteur', 'reparateur'], nouveau: ['ennemi:reparateur'] },

  { carte: 'coude', vagues: 12, credits: 360, pv: 2.72, budget: 13, drones: ['eclaireur', 'rapide', 'blinde', 'essaim', 'bouclier', 'furtif', 'porteur', 'reparateur'], amplis: [[3, 4], [4, 7]] },

  { carte: 'spirale', vagues: 12, credits: 380, pv: 2.96, budget: 14, drones: ['essaim', 'blinde', 'bouclier', 'furtif', 'porteur', 'reparateur'], rocsEnPlus: [[0, 2], [1, 3], [3, 2], [4, 3], [6, 2], [7, 5], [3, 6], [4, 8], [5, 9], [1, 6], [0, 7], [6, 5]], nouveau: ['regle:asteroides'] },

window.JEL_NIVEAUX = NIVEAUX.length;

/* ---------- Hasard à graine (vagues toujours identiques) ---------- */
function graine(n) {
  let a = n >>> 0;
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* Fabrique les vagues d'un niveau : liste de { type, delai, chemin }. */
function fabriquerVagues(idx) {
  const def = NIVEAUX[idx];
  const nbChemins = CARTES[def.carte].chemins.length;
  const vagues = [];
  for (let w = 0; w < def.vagues; w++) {
    const r = graine(idx * 1000 + w * 17 + 7);
    // Vagues doubles : chaque groupe est copié sur l'autre entrée, d'où un budget réduit.
    let budget = def.budget * (1 + 0.32 * w) * (def.doubles && nbChemins > 1 ? 0.6 : 1);
    const liste = [];
    let chemin = 0;
    // Le drone nouveau du niveau arrive dès la 2e vague, puis revient souvent.
    const nouveau = (def.nouveau || []).map((n) => n.split(':')).filter((n) => n[0] === 'ennemi' && n[1] !== 'mere').map((n) => n[1])[0];
    let tour = 0;
    while (budget > 0.3 && liste.length < 80) {
      let type;
      if (nouveau && w >= 1 && tour === 0) type = nouveau;
      else type = def.drones[Math.floor(r() * def.drones.length)];
      if (w === 0 && ENNEMIS[type].cout > 1 && idx > 0) type = def.drones[0];
      const d = ENNEMIS[type];
      const taille = d.groupe ? d.groupe : Math.max(1, Math.min(6, Math.round((budget * (0.3 + r() * 0.4)) / d.cout)));
      for (let i = 0; i < taille; i++) {
        liste.push({ type, delai: i === 0 ? (liste.length ? 1.4 : 0) : (d.groupe ? 0.22 : type === 'rapide' ? 0.55 : 0.9), chemin });
        budget -= d.cout;
      }
      if (nbChemins > 1) chemin = (chemin + 1) % nbChemins;
      tour++;
    }
    // Vagues doubles : chaque groupe part en même temps sur les deux entrées.
    if (def.doubles && nbChemins > 1) {
      const copie = liste.map((e) => ({ ...e, chemin: (e.chemin + 1) % nbChemins, delai: 0 }));
      const melange = [];
      liste.forEach((e, i) => { melange.push(e); melange.push(copie[i]); });
      liste.length = 0; liste.push(...melange);
    }
    if (def.boss && w === def.vagues - 1) {
      for (let b = 0; b < def.boss; b++) {
        liste.push({ type: 'mere', delai: b === 0 ? 2 : 6, chemin: b % nbChemins });
        if (def.escorte) for (let k = 0; k < 4; k++) liste.push({ type: 'bouclier', delai: 0.7, chemin: b % nbChemins });
      }
    }
    vagues.push(liste);
  }
  return vagues;
}

/* ---------- Progression (sauvegarde save.js) ---------- */
let prog = { debloque: 1, etoiles: [], records: [] };
let niveauSauve = 0; // niveau de reprise de la sauvegarde (0 : pas de sauvegarde)
function lireProgression() {
  let d = null;
  try { d = window.JEL_SAVE && window.JEL_SAVE.existe(JEU) ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }
  prog = { debloque: 1, etoiles: [], records: [] };
  niveauSauve = 0;
  if (d) {
    niveauSauve = Math.max(1, Math.min(NIVEAUX.length, +d.niveau || 1));
    if (d.options && typeof d.options.son === 'boolean') sonActif = d.options.son;
    prog.debloque = Math.max(1, Math.min(NIVEAUX.length, Math.max(+d.debloque || 1, +d.niveau || 1)));
    if (Array.isArray(d.etoiles)) prog.etoiles = d.etoiles.map((x) => Math.max(0, Math.min(3, +x || 0)));
    if (Array.isArray(d.records)) prog.records = d.records.map((x) => Math.max(0, +x || 0));
  }
}
function totalEtoiles() { let s = 0; for (let i = 0; i < NIVEAUX.length; i++) s += prog.etoiles[i] || 0; return s; }
function scoreTotal() { let s = 0; for (const r of prog.records) s += r || 0; return s; }
function enregistrer(niveauReprise) {
  if (!window.JEL_SAVE) return;
  niveauSauve = niveauReprise;
  try {
    window.JEL_SAVE.save(JEU, { niveau: niveauReprise, score: scoreTotal(), debloque: prog.debloque, etoiles: prog.etoiles, records: prog.records, options: { son: sonActif } });
  } catch (e) { /* stockage indisponible */ }
}

/* ---------- Son (Web Audio, rien avant la première action) ---------- */
let sonActif = true;
try { const v = localStorage.getItem('tourelles-orbite-son'); if (v === '0') sonActif = false; } catch (e) { /* sans stockage */ }
let audio = null;
const dernierSon = {};
function ac() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; } }
  if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
  return audio;
}
function bip(freq, duree, type, vol, glisse, delai) {
  if (!sonActif || !audio) return;
  const t0 = audio.currentTime + (delai || 0);
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(30, glisse), t0 + duree);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
  o.connect(g); g.connect(audio.destination); o.start(t0); o.stop(t0 + duree + 0.02);
}
function bruit(duree, vol, filtre, delai) {
  if (!sonActif || !audio) return;
  const t0 = audio.currentTime + (delai || 0);
  const n = Math.floor(audio.sampleRate * duree), buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = audio.createBufferSource(); s.buffer = buf;
  const f = audio.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filtre || 1200;
  const g = audio.createGain(); g.gain.value = vol || 0.2;
  s.connect(f); f.connect(g); g.connect(audio.destination); s.start(t0);
}
function son(nom) {
  if (!sonActif || !audio) return;
  const maintenant = performance.now();
  const ecart = { laser: 70, plasma: 120, cryo: 150, arc: 120, lance: 150, boum: 60, piece: 60 }[nom] || 0;
  if (ecart && dernierSon[nom] && maintenant - dernierSon[nom] < ecart) return;
  dernierSon[nom] = maintenant;
  switch (nom) {
    case 'laser': bip(1400, 0.06, 'square', 0.03, 700); break;

    case 'lance': bip(300, 0.3, 'sawtooth', 0.06, 1500); break;
    case 'boum': bruit(0.25, 0.12, 900); break;
    case 'construire': bip(440, 0.08, 'triangle', 0.12); bip(660, 0.1, 'triangle', 0.12, null, 0.07); break;
    case 'ameliorer': [523, 659, 784, 1046].forEach((f, i) => bip(f, 0.1, 'triangle', 0.1, null, i * 0.06)); break;
    case 'vendre': bip(700, 0.15, 'triangle', 0.1, 300); break;
    case 'piece': bip(1320, 0.05, 'square', 0.04); bip(1760, 0.08, 'square', 0.04, null, 0.04); break;
    case 'vague': bip(220, 0.35, 'sawtooth', 0.07, 330); bip(330, 0.4, 'sawtooth', 0.05, 440, 0.15); break;

    case 'stase': [1500, 1800, 2200].forEach((f, i) => bip(f, 0.4, 'sine', 0.05, null, i * 0.05)); break;
    case 'surcharge': bip(200, 0.6, 'sawtooth', 0.06, 1200); break;
    case 'victoire': [523, 659, 784, 1046, 1318].forEach((f, i) => bip(f, 0.22, 'triangle', 0.12, null, i * 0.11)); break;
    case 'defaite': [392, 330, 262, 196].forEach((f, i) => bip(f, 0.3, 'triangle', 0.12, null, i * 0.16)); break;

}
function majBoutonsSon() {

/* =====================================================================
   État d'une partie
   ===================================================================== */
let etat = null;          // partie en cours (null sur les écrans)
let ecran = 'titre';      // titre, niveaux, jeu, pause, fin, intro
let selection = null;     // { type: 'case' | 'tour', x, y }
let curseur = { x: 3, y: 5, visible: false };
let pouvoirVise = null;   // pouvoir en attente d'un toucher sur la carte

function cheminsDe(def) {
  return CARTES[def.carte].chemins.map((pts) => {
    const p = pts.map(([x, y]) => ({ x: x + 0.5, y: y + 0.5 }));
    const cum = [0];
    for (let i = 1; i < p.length; i++) cum.push(cum[i - 1] + Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y));
    return { p, cum, long: cum[cum.length - 1] };
  });
}
function positionSur(ch, d) {
  const { p, cum } = ch;
  if (d <= 0) return { x: p[0].x, y: p[0].y, a: Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x) };
  for (let i = 1; i < p.length; i++) {
    if (d <= cum[i]) {
      const k = (d - cum[i - 1]) / (cum[i] - cum[i - 1]);
      return { x: p[i - 1].x + (p[i].x - p[i - 1].x) * k, y: p[i - 1].y + (p[i].y - p[i - 1].y) * k, a: Math.atan2(p[i].y - p[i - 1].y, p[i].x - p[i - 1].x) };
    }
  }
  const z = p[p.length - 1];
  return { x: z.x, y: z.y, a: Math.PI / 2 };
}

function nouvellePartie(idx) {
  const def = NIVEAUX[idx];
  const carte = CARTES[def.carte];
  const grille = [];
  for (let y = 0; y < LIGNES; y++) { grille.push(new Array(COLS).fill(0)); }
  // 0 libre, 1 couloir, 2 astéroïde, 3 station
  const chemins = cheminsDe(def);
  carte.chemins.forEach((pts) => {
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
      for (let k = 0; k <= n; k++) {
        const x = x0 + Math.sign(x1 - x0) * k, y = y0 + Math.sign(y1 - y0) * k;
        if (x >= 0 && x < COLS && y >= 0 && y < LIGNES) grille[y][x] = 1;
      }
    }
    const fin = pts[pts.length - 1];
    grille[fin[1]][fin[0]] = 3;
  });
  [...carte.rocs, ...(def.rocsEnPlus || [])].forEach(([x, y]) => { if (grille[y] && grille[y][x] === 0) grille[y][x] = 2; });
  const amplis = {};
  (def.amplis || []).forEach(([x, y]) => { if (grille[y] && grille[y][x] === 0) amplis[x + ',' + y] = true; });
  const fin = carte.chemins[0][carte.chemins[0].length - 1];
  etat = {
    idx, def, grille, chemins, amplis, station: { x: fin[0] + 0.5, y: fin[1] + 0.5 },
    credits: def.credits, vies: VIES_MAX, score: 0, tues: 0,
    vagues: fabriquerVagues(idx), vague: 0, file: [], attenteFile: 0, compte: -1,
    tours: [], ennemis: [], tirs: [], effets: [], textes: [],
    pouvoirs: { frappe: { usages: 0, recharge: 0 }, stase: { usages: 0, recharge: 0 }, surcharge: { usages: 0, recharge: 0 } },
    surcharge: 0, secousse: 0, temps: 0, vitesse: 1, fini: false, gagne: false, usagesPouvoirs: 0, revenusVague: 0,
  };
  selection = null; pouvoirVise = null;
  curseur = { x: 3, y: 5, visible: curseur.visible };
}

function debloque(type, cle) { return etat && etat.idx + 1 >= (cle === 'tour' ? TOURS[type].debloque : POUVOIRS[type].debloque); }
function coutPouvoir(nom) { return POUVOIRS[nom].cout * Math.pow(2, etat.pouvoirs[nom].usages); }

/* ---------- Vagues ---------- */
function peutLancer() { return etat && !etat.fini && etat.vague < etat.vagues.length && etat.file.length === 0; }
function bonusAppel() { return etat.compte > 0 ? Math.ceil(etat.compte) * 2 : 0; }
function lancerVague() {
  if (!peutLancer()) return;
  const bonus = bonusAppel();
  if (bonus) { gagner(bonus); texteFlottant(etat.station.x, etat.station.y - 1, '+' + nb(bonus), '#ffd36b'); }
  // Revenus de vague : intérêts et collecteurs (à partir de la 2e vague).
  if (etat.vague > 0) {
    const interets = Math.min(25, Math.floor(etat.credits * 0.1));
    let collecte = 0;
    etat.tours.forEach((t) => { if (t.type === 'collecteur') { const r = TOURS.collecteur.revenu[t.niv]; collecte += r; texteFlottant(t.x + 0.5, t.y + 0.2, '+' + nb(r), '#ffd36b'); effet('piece', t.x + 0.5, t.y + 0.5); } });
    gagner(interets + collecte);
    etat.revenusVague = interets + collecte;
    if (interets + collecte > 0) { bulle(tr('bulle.revenus', { interets: nb(interets), collecte: nb(collecte) })); son('piece'); }
  }
  etat.file = etat.vagues[etat.vague].map((e) => ({ ...e }));
  etat.attenteFile = 0;
  etat.vague++;
  etat.compte = -1;
  son('vague');
  if (etat.tuto) finTuto();
  majPanneau(); majHud();
}
function gagner(n) { etat.credits += n; }

function creerEnnemi(type, chemin, d) {
  const b = ENNEMIS[type];
  const def = etat.def;
  const w = Math.max(0, etat.vague - 1);
  const mult = def.pv * (1 + 0.06 * w) * (b.boss ? 1 + 0.15 * (def.boss - 1) : 1);
  const pv = Math.round(b.pv * mult);
  const e = {
    type, chemin, d: d || 0, pv, pvMax: pv, vit: b.vit, armure: b.armure || 0,
    bouclier: b.bouclier ? Math.round(b.bouclier * mult) : 0, bouclierMax: b.bouclier ? Math.round(b.bouclier * mult) : 0, repos: 0,
    ralenti: 0, ralentiT: 0, fige: 0, x: 0, y: 0, a: 0, revele: !b.furtif, soinT: 0, vie: true, flash: 0, phase: Math.random() * 6,
  };
  const pos = positionSur(etat.chemins[chemin], e.d); e.x = pos.x; e.y = pos.y; e.a = pos.a;
  etat.ennemis.push(e);
  return e;
}

/* ---------- Dégâts ---------- */
function blesser(e, deg, opts) {
  if (!e.vie) return;
  opts = opts || {};
  let reste = deg;
  if (e.bouclier > 0) {
    const mult = opts.bouclier || 1;
    const absorbe = Math.min(e.bouclier, reste * mult);
    e.bouclier -= absorbe; reste -= absorbe / mult;
    e.repos = 2.5;
  }
  if (reste > 0) {
    if (!opts.perce && e.armure) reste = Math.max(reste * 0.25, reste - e.armure);
    e.pv -= reste;
  }
  e.repos = 2.5; e.flash = 0.08;
  if (e.pv <= 0) detruire(e);
}
function detruire(e) {
  e.vie = false;
  const b = ENNEMIS[e.type];
  const prime = Math.round(b.prime * (1 + 0.05 * etat.idx));
  gagner(prime); etat.score += prime * 10; etat.tues++;
  effet('explosion', e.x, e.y, b.taille);
  if (b.boss) { effet('grosse', e.x, e.y); etat.secousse = 0.5; texteFlottant(e.x, e.y - 0.6, '+' + nb(prime), '#ffd36b'); }
  son('boum');
  if (b.enfants) for (let i = 0; i < b.enfants; i++) creerEnnemi('rapide', e.chemin, Math.max(0, e.d - i * 0.35));
}

/* ---------- Effets visuels ---------- */
function effet(type, x, y, taille) {
  if (type === 'explosion' || type === 'grosse') {
    const n = type === 'grosse' ? 40 : 12;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (type === 'grosse' ? 3 : 1.6) * (0.4 + Math.random());
      etat.effets.push({ type: 'eclat', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, d: 0.4 + Math.random() * 0.4, c: ['#ffd36b', '#ff7a5c', '#ffffff', '#5ef0ff'][i % 4] });
    }
    etat.effets.push({ type: 'onde', x, y, t: 0, d: 0.35, r: (taille || 0.3) * 3, c: '#ffcf8a' });
  } else if (type === 'piece') {
    etat.effets.push({ type: 'onde', x, y, t: 0, d: 0.5, r: 0.8, c: '#ffd36b' });
  } else if (type === 'frappe') {
    etat.effets.push({ type: 'rayon', x, y, t: 0, d: 0.45 });
    etat.effets.push({ type: 'onde', x, y, t: 0, d: 0.6, r: POUVOIRS.frappe.rayon * 1.4, c: '#ffd36b' });
    for (let i = 0; i < 26; i++) { const a = Math.random() * 6.28, v = 3 * Math.random() + 1; etat.effets.push({ type: 'eclat', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, d: 0.7, c: i % 2 ? '#ffd36b' : '#ffffff' }); }
  } else if (type === 'stase') {
    etat.effets.push({ type: 'bulle', x, y, t: 0, d: POUVOIRS.stase.duree, r: POUVOIRS.stase.rayon });
  } else if (type === 'construire') {
    etat.effets.push({ type: 'onde', x, y, t: 0, d: 0.5, r: 0.9, c: '#5ef0ff' });
    for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28; etat.effets.push({ type: 'eclat', x, y, vx: Math.cos(a) * 1.5, vy: Math.sin(a) * 1.5, t: 0, d: 0.4, c: '#9ff6ff' }); }
  } else if (type === 'touche') {
    etat.effets.push({ type: 'onde', x, y, t: 0, d: 0.6, r: 1.4, c: '#ff5d73' });
  }
}
function texteFlottant(x, y, txt, c) { etat.textes.push({ x, y, txt, c, t: 0 }); }

let bulleMinuteur = 0;
function bulle(txt) {
  const b = document.getElementById('bulle');
  b.textContent = txt; b.classList.add('visible');
  clearTimeout(bulleMinuteur); bulleMinuteur = setTimeout(() => b.classList.remove('visible'), 2600);
}

/* =====================================================================
   Simulation (dt en secondes de jeu)
   ===================================================================== */
function portee(t) { const b = TOURS[t.type]; return b.portee ? b.portee[t.niv] * (etat.amplis[t.x + ',' + t.y] ? 1.15 : 1) : 0; }
function degats(t) { return TOURS[t.type].deg[t.niv] * (etat.amplis[t.x + ',' + t.y] ? 1.3 : 1); }
function visible(e) { return e.vie && e.revele && e.d > 0.2; }

function choisirCible(t, cx, cy, r) {
  let meilleur = null, valeur = -Infinity;
  for (const e of etat.ennemis) {
    if (!visible(e)) continue;
    const dist = Math.hypot(e.x - cx, e.y - cy);
    if (dist > r) continue;
    let v;
    if (t.cible === 'fort') v = e.pv + e.bouclier;
    else if (t.cible === 'proche') v = -dist;
    else v = e.d - etat.chemins[e.chemin].long; // le plus avancé
    if (v > valeur) { valeur = v; meilleur = e; }
  }
  return meilleur;
}

function simuler(dt) {
  if (!etat || etat.fini) return;
  etat.temps += dt;
  // Apparition des drones
  if (etat.file.length) {
    etat.attenteFile -= dt;
    while (etat.file.length && etat.attenteFile <= 0) {
      const s = etat.file.shift();
      creerEnnemi(s.type, s.chemin, 0);
      etat.attenteFile += etat.file.length ? etat.file[0].delai : 0;
    }
    if (!etat.file.length && etat.vague < etat.vagues.length) etat.compte = etat.def.doubles ? 8 : 12;
  } else if (etat.compte > 0) {
    etat.compte -= dt;
    if (etat.compte <= 0) { etat.compte = 0; lancerVague(); }
  }
  // Pouvoirs
  for (const n of ORDRE_POUVOIRS) etat.pouvoirs[n].recharge = Math.max(0, etat.pouvoirs[n].recharge - dt);
  etat.surcharge = Math.max(0, etat.surcharge - dt);
  // Furtifs révélés par les lances ioniques
  const lances = etat.tours.filter((t) => t.type === 'lance');
  // Drones : déplacement, soins, boucliers
  for (const e of etat.ennemis) {
    if (!e.vie) continue;
    const b = ENNEMIS[e.type];
    if (b.furtif) e.revele = lances.some((l) => Math.hypot(e.x - l.x - 0.5, e.y - l.y - 0.5) <= portee(l));
    e.flash = Math.max(0, e.flash - dt);
    e.ralentiT -= dt; if (e.ralentiT <= 0) e.ralenti = 0;
    let v = e.vit * (1 - e.ralenti);
    if (e.fige > 0) { e.fige -= dt; v = 0; }
    e.d += v * dt;
    if (e.bouclierMax) { e.repos -= dt; if (e.repos <= 0) e.bouclier = Math.min(e.bouclierMax, e.bouclier + e.bouclierMax * 0.25 * dt); }
    if (b.soin) {
      e.soinT -= dt;
      if (e.soinT <= 0) {
        e.soinT = 1;
        let soigne = false;
        for (const o of etat.ennemis) if (o !== e && o.vie && o.pv < o.pvMax && Math.hypot(o.x - e.x, o.y - e.y) < 1.6) { o.pv = Math.min(o.pvMax, o.pv + b.soin * etat.def.pv); soigne = true; }
        if (soigne) etat.effets.push({ type: 'onde', x: e.x, y: e.y, t: 0, d: 0.5, r: 1.6, c: '#7dff9a' });
      }
    }
    const ch = etat.chemins[e.chemin];
    if (e.d >= ch.long) {
      e.vie = false;
      etat.vies = Math.max(0, etat.vies - b.degats);
      etat.secousse = 0.35;
      effet('touche', etat.station.x, etat.station.y);
      son('touche');
      if (etat.vies <= 0) { finNiveau(false); return; }
    } else {
      const pos = positionSur(ch, e.d); e.x = pos.x; e.y = pos.y; e.a = pos.a;
    }
  }
  // Tourelles
  const acc = etat.surcharge > 0 ? 2 : 1;
  for (const t of etat.tours) {
    const b = TOURS[t.type];
    t.anim += dt;
    if (!b.cd) continue;
    t.cd -= dt * acc;
    if (t.cd > 0) continue;
    const cx = t.x + 0.5, cy = t.y + 0.5, r = portee(t);
    if (t.type === 'cryo') {
      let touche = false;
      for (const e of etat.ennemis) if (visible(e) && Math.hypot(e.x - cx, e.y - cy) <= r) { blesser(e, degats(t)); e.ralenti = Math.max(e.ralenti, b.ralenti[t.niv]); e.ralentiT = 1.5; touche = true; }
      if (touche) { t.cd = b.cd[t.niv]; etat.effets.push({ type: 'onde', x: cx, y: cy, t: 0, d: 0.45, r, c: '#9fd8ff' }); son('cryo'); }
      else t.cd = 0.1;
      continue;
    }
    const cible = choisirCible(t, cx, cy, r);
    if (!cible) { t.cd = 0.05; continue; }
    t.angle = Math.atan2(cible.y - cy, cible.x - cx);
    t.cd = b.cd[t.niv];
    if (t.type === 'laser') {
      blesser(cible, degats(t));
      etat.effets.push({ type: 'trait', x: cx, y: cy, x2: cible.x, y2: cible.y, t: 0, d: 0.08, c: '#5ef0ff', l: 2 });
      son('laser');
    } else if (t.type === 'lance') {
      blesser(cible, degats(t), { perce: true });
      etat.effets.push({ type: 'trait', x: cx, y: cy, x2: cible.x, y2: cible.y, t: 0, d: 0.22, c: '#7dff9a', l: 5 });
      son('lance');
    } else if (t.type === 'plasma') {
      etat.tirs.push({ x: cx, y: cy, cible, tx: cible.x, ty: cible.y, deg: degats(t), zone: b.zone[t.niv] });
      son('plasma');
    } else if (t.type === 'arc') {
      let d = degats(t), dernier = { x: cx, y: cy }, touches = [], courant = cible;
      for (let k = 0; k < b.chaine[t.niv] && courant; k++) {
        etat.effets.push({ type: 'eclair', x: dernier.x, y: dernier.y, x2: courant.x, y2: courant.y, t: 0, d: 0.15 });
        touches.push(courant);
        const pos = { x: courant.x, y: courant.y };
        blesser(courant, d, { bouclier: 2 });
        d *= 0.85; dernier = pos;
        let suivant = null, best = 1.6;
        for (const e of etat.ennemis) { if (!visible(e) || touches.includes(e)) continue; const dd = Math.hypot(e.x - pos.x, e.y - pos.y); if (dd < best) { best = dd; suivant = e; } }
        courant = suivant;
      }
      son('arc');
    }
  }
  // Obus de plasma
  for (const p of etat.tirs) {
    if (p.cible && p.cible.vie) { p.tx = p.cible.x; p.ty = p.cible.y; }
    const dx = p.tx - p.x, dy = p.ty - p.y, dist = Math.hypot(dx, dy), pas = 6 * dt;
    if (dist <= pas) {
      p.fini = true;
      for (const e of etat.ennemis) if (e.vie && Math.hypot(e.x - p.tx, e.y - p.ty) <= p.zone) blesser(e, p.deg);
      etat.effets.push({ type: 'onde', x: p.tx, y: p.ty, t: 0, d: 0.3, r: p.zone, c: '#ff7ad9' });
    } else { p.x += dx / dist * pas; p.y += dy / dist * pas; }
  }
  etat.tirs = etat.tirs.filter((p) => !p.fini);
  etat.ennemis = etat.ennemis.filter((e) => e.vie);
  // Effets
  for (const f of etat.effets) { f.t += dt; if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; } }
  etat.effets = etat.effets.filter((f) => f.t < f.d);
  for (const tx of etat.textes) { tx.t += dt; tx.y -= dt * 0.8; }
  etat.textes = etat.textes.filter((tx) => tx.t < 1.2);
  etat.secousse = Math.max(0, etat.secousse - dt);
  // Victoire : toutes les vagues lancées, plus de drone
  if (etat.vague >= etat.vagues.length && !etat.file.length && !etat.ennemis.length) finNiveau(true);
}

/* ---------- Actions du joueur ---------- */
function caseLibre(x, y) { return etat.grille[y] && etat.grille[y][x] === 0 && !tourEn(x, y); }
function tourEn(x, y) { return etat.tours.find((t) => t.x === x && t.y === y); }
function construire(type) {
  if (!selection || selection.type !== 'case') return;
  const b = TOURS[type];
  if (!debloque(type, 'tour')) return;
  if (etat.credits < b.cout) { son('refus'); bulle(tr('bulle.tropCher')); return; }
  const { x, y } = selection;
  if (!caseLibre(x, y)) return;
  etat.credits -= b.cout;
  const t = { type, x, y, niv: 0, cd: 0.2, investi: b.cout, cible: type === 'lance' ? 'fort' : 'premier', angle: -Math.PI / 2, anim: 0 };
  etat.tours.push(t);
  effet('construire', x + 0.5, y + 0.5);
  son('construire');
  selection = { type: 'tour', x, y };
  if (etat.tuto && etat.tuto.etape === 2) { etat.tuto.etape = 3; majTuto(); selection = null; }
  majPanneau(); majHud();
}
function ameliorer() {
  const t = selection && selection.type === 'tour' && tourEn(selection.x, selection.y);
  if (!t || t.niv >= 2) return;
  const prix = TOURS[t.type].ameli[t.niv];
  if (etat.credits < prix) { son('refus'); bulle(tr('bulle.tropCher')); return; }
  etat.credits -= prix; t.investi += prix; t.niv++;
  effet('construire', t.x + 0.5, t.y + 0.5);
  texteFlottant(t.x + 0.5, t.y, tr('bulle.niv', { n: t.niv + 1 }), '#5ef0ff');
  son('ameliorer'); majPanneau(); majHud();
}
function vendre() {
  const t = selection && selection.type === 'tour' && tourEn(selection.x, selection.y);
  if (!t) return;
  const rendu = Math.floor(t.investi * 0.7);
  gagner(rendu);
  etat.tours = etat.tours.filter((o) => o !== t);
  texteFlottant(t.x + 0.5, t.y + 0.4, '+' + nb(rendu), '#ffd36b');
  son('vendre'); selection = null; majPanneau(); majHud();
}
function changerCible() {
  const t = selection && selection.type === 'tour' && tourEn(selection.x, selection.y);
  if (!t || t.type === 'cryo' || t.type === 'collecteur') return;
  const modes = ['premier', 'fort', 'proche'];
  t.cible = modes[(modes.indexOf(t.cible) + 1) % 3];
  son('clic'); majPanneau();
}
function choisirPouvoir(nom) {
  if (!etat || etat.fini || !debloque(nom, 'pouvoir')) return;
  const p = etat.pouvoirs[nom];
  if (p.recharge > 0) { son('refus'); bulle(tr('bulle.recharge')); return; }
  if (etat.credits < coutPouvoir(nom)) { son('refus'); bulle(tr('bulle.tropCher')); return; }
  if (!POUVOIRS[nom].vise) { lancerPouvoir(nom, 0, 0); return; }
  pouvoirVise = pouvoirVise === nom ? null : nom;
  selection = null;
  if (pouvoirVise) bulle(tr('bulle.viser'));
  son('clic'); majPanneau();
}
function lancerPouvoir(nom, x, y) {
  const p = etat.pouvoirs[nom], b = POUVOIRS[nom];
  const prix = coutPouvoir(nom);
  if (etat.credits < prix || p.recharge > 0) return;
  etat.credits -= prix; p.usages++; p.recharge = b.recharge; etat.usagesPouvoirs++;
  if (nom === 'frappe') {
    const deg = 80 + 18 * etat.idx;
    for (const e of etat.ennemis) if (e.vie && Math.hypot(e.x - x, e.y - y) <= b.rayon) blesser(e, deg, { perce: true });
    effet('frappe', x, y); etat.secousse = 0.3; son('frappe');
  } else if (nom === 'stase') {
    for (const e of etat.ennemis) if (e.vie && Math.hypot(e.x - x, e.y - y) <= b.rayon) e.fige = b.duree;
    effet('stase', x, y); son('stase');
  } else if (nom === 'surcharge') {
    etat.surcharge = b.duree; son('surcharge'); bulle(tr('bulle.surcharge'));
  }
  pouvoirVise = null;
  majPanneau(); majHud();
}
function toucherCase(x, y, fx, fy) {
  if (!etat || etat.fini) return;
  if (pouvoirVise) { lancerPouvoir(pouvoirVise, fx, fy); return; }
  if (x < 0 || y < 0 || x >= COLS || y >= LIGNES) { selection = null; majPanneau(); return; }
  if (tourEn(x, y)) { selection = { type: 'tour', x, y }; son('clic'); }
  else if (caseLibre(x, y)) {
    if (selection && selection.type === 'case' && selection.x === x && selection.y === y) selection = null;
    else { selection = { type: 'case', x, y }; son('clic'); }
    if (etat.tuto && etat.tuto.etape === 1 && selection) { etat.tuto.etape = 2; majTuto(); }
  } else { selection = null; }
  majPanneau();
}

/* =====================================================================
   Dessin
   ===================================================================== */
const cv = document.getElementById('jeu');
const cx = cv.getContext('2d');
let T = 40, OX = 0, OY = 0, LARG = 0, HAUT = 0, DPR = 1;
const etoilesFond = [];
for (let i = 0; i < 140; i++) etoilesFond.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, p: Math.random() * 6 });

function redimensionner() {
  const z = document.getElementById('zone').getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  LARG = z.width; HAUT = z.height;
  cv.width = Math.round(LARG * DPR); cv.height = Math.round(HAUT * DPR);
  T = Math.floor(Math.min(LARG / COLS, HAUT / LIGNES));
  OX = Math.floor((LARG - T * COLS) / 2); OY = Math.floor((HAUT - T * LIGNES) / 2);
  const ft = document.getElementById('fond-titre');
  ft.width = Math.round(innerWidth * DPR); ft.height = Math.round(innerHeight * DPR);
  const h1 = document.querySelector('#ecran-titre h1');
  const haut = h1 && h1.getBoundingClientRect().top;
  if (haut > 0) hautScene = haut - 6;
}
let hautScene = 400;

/* Icône d'une tourelle (aussi dans les boutons). */
function dessinerTour(c, type, x, y, s, niv, angle, anim) {
  const b = TOURS[type];
  c.save(); c.translate(x, y);
  // socle
  c.fillStyle = '#26306e'; c.strokeStyle = '#5a68c8'; c.lineWidth = s * 0.05;
  c.beginPath();
  for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + Math.PI / 6; c.lineTo(Math.cos(a) * s * 0.44, Math.sin(a) * s * 0.44); }
  c.closePath(); c.fill(); c.stroke();
  // marques de niveau (points)
  for (let i = 0; i <= niv; i++) { c.fillStyle = '#ffd36b'; c.beginPath(); c.arc((i - niv / 2) * s * 0.16, s * 0.34, s * 0.05, 0, 6.28); c.fill(); }
  c.fillStyle = b.couleur; c.strokeStyle = '#0b1030'; c.lineWidth = s * 0.04;
  if (type === 'collecteur') {
    const r = s * 0.24;
    c.rotate((anim || 0) * 1.2);
    for (let i = 0; i < 3; i++) { c.rotate(Math.PI * 2 / 3); c.fillStyle = '#ffe9a8'; c.fillRect(-s * 0.05, -s * 0.36, s * 0.1, s * 0.16); }
    c.fillStyle = b.couleur; c.beginPath(); c.arc(0, 0, r, 0, 6.28); c.fill(); c.stroke();
    c.fillStyle = '#b8862a'; c.beginPath(); c.arc(0, 0, r * 0.45, 0, 6.28); c.fill();
  } else if (type === 'cryo') {
    c.beginPath(); c.arc(0, 0, s * 0.24, 0, 6.28); c.fill(); c.stroke();
    c.strokeStyle = '#ffffff'; c.lineWidth = s * 0.05; c.rotate((anim || 0) * 0.6);
    for (let i = 0; i < 3; i++) { c.rotate(Math.PI / 3); c.beginPath(); c.moveTo(-s * 0.2, 0); c.lineTo(s * 0.2, 0); c.stroke(); }
  } else {
    c.rotate((angle || -Math.PI / 2) + Math.PI / 2);
    if (type === 'laser') { c.fillRect(-s * 0.06, -s * 0.42, s * 0.12, s * 0.3); c.beginPath(); c.arc(0, 0, s * 0.2, 0, 6.28); c.fill(); c.stroke(); }
    if (type === 'plasma') { c.fillRect(-s * 0.12, -s * 0.4, s * 0.24, s * 0.3); c.beginPath(); c.arc(0, 0, s * 0.25, 0, 6.28); c.fill(); c.stroke(); c.fillStyle = '#fff'; c.beginPath(); c.arc(0, -s * 0.36, s * 0.06, 0, 6.28); c.fill(); }
    if (type === 'arc') { c.beginPath(); c.arc(0, 0, s * 0.2, 0, 6.28); c.fill(); c.stroke(); c.strokeStyle = '#fff'; c.lineWidth = s * 0.05; c.beginPath(); c.moveTo(0, -s * 0.12); c.lineTo(-s * 0.06, -s * 0.24); c.lineTo(s * 0.06, -s * 0.3); c.lineTo(0, -s * 0.42); c.stroke(); c.fillStyle = b.couleur; c.beginPath(); c.arc(0, -s * 0.42, s * 0.07, 0, 6.28); c.fill(); }
    if (type === 'lance') { c.fillRect(-s * 0.05, -s * 0.48, s * 0.1, s * 0.4); c.fillRect(-s * 0.13, -s * 0.2, s * 0.26, s * 0.08); c.beginPath(); c.arc(0, 0, s * 0.18, 0, 6.28); c.fill(); c.stroke(); }
  }
  c.restore();
}

/* Dessin d'un drone. */
function dessinerDrone(c, type, x, y, s, a, phase, e) {
  const b = ENNEMIS[type];
  const r = b.taille * s;
  c.save(); c.translate(x, y);
  if (e && !e.revele) c.globalAlpha = 0.28 + 0.12 * Math.sin(phase * 8);
  c.rotate(a);
  const flash = e && e.flash > 0;
  const coul = { eclaireur: '#b48cff', rapide: '#ffe066', blinde: '#9aa3b8', essaim: '#8dff8a', bouclier: '#6fb7ff', furtif: '#7f6bb0', porteur: '#ff9d4d', reparateur: '#e9fff0', mere: '#ff5d73' }[type];
  c.fillStyle = flash ? '#ffffff' : coul; c.strokeStyle = '#140a2a'; c.lineWidth = Math.max(1, s * 0.03);
  c.beginPath();
  if (type === 'eclaireur' || type === 'furtif') { c.moveTo(r, 0); c.lineTo(-r * 0.8, r * 0.8); c.lineTo(-r * 0.4, 0); c.lineTo(-r * 0.8, -r * 0.8); }
  else if (type === 'rapide') { c.moveTo(r * 1.2, 0); c.lineTo(-r, r * 0.5); c.lineTo(-r * 0.6, 0); c.lineTo(-r, -r * 0.5); }
  else if (type === 'blinde') { for (let i = 0; i < 6; i++) { const k = i / 6 * 6.28; c.lineTo(Math.cos(k) * r, Math.sin(k) * r); } }
  else if (type === 'essaim') { c.arc(0, 0, r, 0, 6.28); }
  else if (type === 'bouclier') { c.moveTo(r, 0); c.lineTo(0, r * 0.8); c.lineTo(-r, 0); c.lineTo(0, -r * 0.8); }
  else if (type === 'porteur') { c.ellipse(0, 0, r * 1.1, r * 0.75, 0, 0, 6.28); }
  else if (type === 'reparateur') { c.arc(0, 0, r * 0.85, 0, 6.28); }
  else if (type === 'mere') { c.ellipse(0, 0, r, r * 0.7, 0, 0, 6.28); }
  c.closePath(); c.fill(); c.stroke();
  // détails
  if (type === 'blinde') { c.strokeStyle = '#596178'; c.beginPath(); c.arc(0, 0, r * 0.55, 0, 6.28); c.stroke(); }
  if (type === 'essaim') { c.fillStyle = 'rgba(220,255,220,.7)'; c.beginPath(); c.ellipse(0, -r, r * 0.9, r * 0.4, 0, 0, 6.28); c.ellipse(0, r, r * 0.9, r * 0.4, 0, 0, 6.28); c.fill(); }
  if (type === 'porteur') { c.fillStyle = '#ffe066'; for (let i = -1; i <= 1; i++) { c.beginPath(); c.arc(i * r * 0.5, 0, r * 0.18, 0, 6.28); c.fill(); } }
  if (type === 'reparateur') { c.fillStyle = '#22c55e'; c.fillRect(-r * 0.15, -r * 0.5, r * 0.3, r); c.fillRect(-r * 0.5, -r * 0.15, r, r * 0.3); }
  if (type === 'mere') {
    c.fillStyle = '#ffd36b'; for (let i = 0; i < 6; i++) { const k = i / 6 * 6.28 + phase; c.beginPath(); c.arc(Math.cos(k) * r * 0.75, Math.sin(k) * r * 0.5, r * 0.08, 0, 6.28); c.fill(); }
    c.fillStyle = '#5a1030'; c.beginPath(); c.arc(0, 0, r * 0.35, 0, 6.28); c.fill();
    c.fillStyle = '#ff9db0'; c.beginPath(); c.arc(0, 0, r * 0.18, 0, 6.28); c.fill();
  }
  if (type === 'eclaireur' || type === 'rapide' || type === 'furtif') { c.fillStyle = '#ff9d4d'; c.beginPath(); c.arc(-r * 0.6, 0, r * 0.2 * (1 + 0.3 * Math.sin(phase * 20)), 0, 6.28); c.fill(); }
  c.restore();
  // bouclier
  if (e && e.bouclier > 0) {
    c.strokeStyle = 'rgba(111,183,255,' + (0.35 + 0.5 * e.bouclier / e.bouclierMax) + ')'; c.lineWidth = Math.max(1.5, s * 0.05);
    c.beginPath(); c.arc(x, y, r * 1.45, 0, 6.28); c.stroke();
  } else if (!e && type === 'bouclier') {
    c.strokeStyle = 'rgba(111,183,255,.8)'; c.lineWidth = Math.max(1.5, s * 0.05); c.beginPath(); c.arc(x, y, r * 1.45, 0, 6.28); c.stroke();
  }
  if (e && e.fige > 0) { c.fillStyle = 'rgba(160,220,255,.35)'; c.beginPath(); c.arc(x, y, r * 1.3, 0, 6.28); c.fill(); }
}

/* Station spatiale (le cœur à protéger). */
function dessinerStation(c, x, y, s, temps, touche) {
  c.save(); c.translate(x, y);
  c.strokeStyle = 'rgba(94,240,255,.6)'; c.lineWidth = s * 0.06;
  c.beginPath(); c.ellipse(0, 0, s * 0.62, s * 0.24, temps * 0.3, 0, 6.28); c.stroke();
  const g = c.createRadialGradient(-s * 0.1, -s * 0.1, s * 0.05, 0, 0, s * 0.42);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, touche ? '#ff9db0' : '#9fe8ff'); g.addColorStop(1, touche ? '#a01d3a' : '#2a5bd6');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, s * 0.38, 0, 6.28); c.fill();
  c.fillStyle = '#e8ecff';
  for (let i = 0; i < 4; i++) { c.save(); c.rotate(i * Math.PI / 2 + temps * 0.5); c.fillRect(s * 0.4, -s * 0.05, s * 0.18, s * 0.1); c.restore(); }
  c.restore();
}

function dessinerFond(c, w, h, temps) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#0a0d2e'); g.addColorStop(1, '#04051a');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // nébuleuse
  const n = c.createRadialGradient(w * 0.8, h * 0.25, 0, w * 0.8, h * 0.25, w * 0.7);
  n.addColorStop(0, 'rgba(140,80,220,.22)'); n.addColorStop(1, 'rgba(140,80,220,0)');
  c.fillStyle = n; c.fillRect(0, 0, w, h);
  const n2 = c.createRadialGradient(w * 0.15, h * 0.8, 0, w * 0.15, h * 0.8, w * 0.6);
  n2.addColorStop(0, 'rgba(40,160,220,.18)'); n2.addColorStop(1, 'rgba(40,160,220,0)');
  c.fillStyle = n2; c.fillRect(0, 0, w, h);
  for (const s of etoilesFond) { c.globalAlpha = 0.5 + 0.5 * Math.sin(temps * 1.5 + s.p); c.fillStyle = '#fff'; c.beginPath(); c.arc(s.x * w, s.y * h, s.r, 0, 6.28); c.fill(); }
  c.globalAlpha = 1;
}

function dessinerRoc(c, x, y, s, k) {
  c.save(); c.translate(x, y); c.rotate(k);
  c.fillStyle = '#5b5470'; c.strokeStyle = '#2e2940'; c.lineWidth = s * 0.04;
  c.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * 6.28, r = s * (0.3 + 0.08 * Math.sin(i * 2.3 + k * 3)); c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#433c57'; c.beginPath(); c.arc(-s * 0.08, -s * 0.05, s * 0.08, 0, 6.28); c.arc(s * 0.1, s * 0.08, s * 0.05, 0, 6.28); c.fill();
  c.restore();
}

function dessiner(tempsReel) {
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  dessinerFond(cx, LARG, HAUT, tempsReel);
  if (!etat) return;
  cx.save();
  if (etat.secousse > 0) cx.translate((Math.random() - 0.5) * 10 * etat.secousse, (Math.random() - 0.5) * 10 * etat.secousse);
  cx.translate(OX, OY);
  // cases
  for (let y = 0; y < LIGNES; y++) for (let x = 0; x < COLS; x++) {
    const v = etat.grille[y][x];
    if (v === 0) {
      cx.fillStyle = etat.amplis[x + ',' + y] ? 'rgba(255,211,107,.18)' : 'rgba(60,80,170,.13)';
      cx.strokeStyle = etat.amplis[x + ',' + y] ? 'rgba(255,211,107,.8)' : 'rgba(110,130,230,.22)';
      cx.lineWidth = 1;
      cx.beginPath(); cx.roundRect ? cx.roundRect(x * T + 2, y * T + 2, T - 4, T - 4, 6) : cx.rect(x * T + 2, y * T + 2, T - 4, T - 4); cx.fill(); cx.stroke();
      if (etat.amplis[x + ',' + y]) {
        cx.strokeStyle = 'rgba(255,211,107,' + (0.5 + 0.4 * Math.sin(tempsReel * 3)) + ')'; cx.lineWidth = 2;
        cx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * 6.28; cx.lineTo(x * T + T / 2 + Math.cos(a) * T * 0.3, y * T + T / 2 + Math.sin(a) * T * 0.3); } cx.closePath(); cx.stroke();
      }
    } else if (v === 2) dessinerRoc(cx, x * T + T / 2, y * T + T / 2, T, (x * 7 + y * 3) % 6);
  }
  // couloirs
  for (const ch of etat.chemins) {
    cx.lineCap = 'round'; cx.lineJoin = 'round';
    cx.strokeStyle = 'rgba(30,40,100,.95)'; cx.lineWidth = T * 0.8;
    cx.beginPath(); ch.p.forEach((p, i) => i ? cx.lineTo(p.x * T, p.y * T) : cx.moveTo(p.x * T, p.y * T)); cx.stroke();
    cx.strokeStyle = 'rgba(94,140,255,.35)'; cx.lineWidth = T * 0.62;
    cx.stroke();
    cx.setLineDash([T * 0.18, T * 0.32]); cx.lineDashOffset = -tempsReel * T * 0.8;
    cx.strokeStyle = 'rgba(160,200,255,.55)'; cx.lineWidth = T * 0.06; cx.stroke();
    cx.setLineDash([]);
  }
  // portée de la sélection
  const sel = selection && selection.type === 'tour' && tourEn(selection.x, selection.y);
  if (sel && portee(sel)) {
    cx.fillStyle = 'rgba(94,240,255,.08)'; cx.strokeStyle = 'rgba(94,240,255,.6)'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.arc((sel.x + 0.5) * T, (sel.y + 0.5) * T, portee(sel) * T, 0, 6.28); cx.fill(); cx.stroke();
  }
  if (selection && selection.type === 'case') {
    cx.strokeStyle = '#5ef0ff'; cx.lineWidth = 3;
    cx.strokeRect(selection.x * T + 3, selection.y * T + 3, T - 6, T - 6);
    cx.fillStyle = 'rgba(94,240,255,.18)'; cx.fillRect(selection.x * T + 3, selection.y * T + 3, T - 6, T - 6);
  }
  // station
  dessinerStation(cx, etat.station.x * T, etat.station.y * T, T * 1.1, tempsReel, etat.secousse > 0);
  // tourelles
  for (const t of etat.tours) {
    if (etat.surcharge > 0) { cx.fillStyle = 'rgba(255,211,107,' + (0.2 + 0.15 * Math.sin(tempsReel * 12)) + ')'; cx.beginPath(); cx.arc((t.x + 0.5) * T, (t.y + 0.5) * T, T * 0.5, 0, 6.28); cx.fill(); }
    dessinerTour(cx, t.type, (t.x + 0.5) * T, (t.y + 0.5) * T, T, t.niv, t.angle, t.anim);
  }
  // drones
  for (const e of etat.ennemis) {
    if (e.d < 0.05) continue;
    dessinerDrone(cx, e.type, e.x * T, e.y * T, T, e.a, e.phase + tempsReel, e);
    if (e.pv < e.pvMax || ENNEMIS[e.type].boss) {
      const w = T * (ENNEMIS[e.type].boss ? 1 : 0.6), hx = e.x * T - w / 2, hy = e.y * T - ENNEMIS[e.type].taille * T - 7;
      cx.fillStyle = 'rgba(0,0,0,.6)'; cx.fillRect(hx, hy, w, 4);
      cx.fillStyle = e.pv / e.pvMax > 0.5 ? '#7dff9a' : e.pv / e.pvMax > 0.25 ? '#ffd36b' : '#ff5d73';
      cx.fillRect(hx, hy, w * Math.max(0, e.pv / e.pvMax), 4);
    }
  }
  // obus
  for (const p of etat.tirs) { cx.fillStyle = '#ffb3ec'; cx.shadowColor = '#ff7ad9'; cx.shadowBlur = 10; cx.beginPath(); cx.arc(p.x * T, p.y * T, T * 0.1, 0, 6.28); cx.fill(); cx.shadowBlur = 0; }
  // effets
  for (const f of etat.effets) {
    const k = f.t / f.d;
    if (f.type === 'eclat') { cx.globalAlpha = 1 - k; cx.fillStyle = f.c; cx.fillRect(f.x * T - 2, f.y * T - 2, 4, 4); }
    else if (f.type === 'onde') { cx.globalAlpha = 1 - k; cx.strokeStyle = f.c; cx.lineWidth = 2.5; cx.beginPath(); cx.arc(f.x * T, f.y * T, Math.max(1, f.r * T * (0.3 + 0.7 * k)), 0, 6.28); cx.stroke(); }
    else if (f.type === 'trait') { cx.globalAlpha = 1 - k; cx.strokeStyle = f.c; cx.lineWidth = f.l; cx.shadowColor = f.c; cx.shadowBlur = 8; cx.beginPath(); cx.moveTo(f.x * T, f.y * T); cx.lineTo(f.x2 * T, f.y2 * T); cx.stroke(); cx.shadowBlur = 0; }
    else if (f.type === 'eclair') {
