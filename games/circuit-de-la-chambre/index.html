    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(cx, cy, r + 8, Math.PI, TAU); ctx.closePath(); ctx.fill();
    const ang = (v) => Math.PI + clamp(v / VBOOST, 0, 1) * Math.PI;
    ctx.lineWidth = r * 0.22; ctx.lineCap = 'butt';
    ctx.strokeStyle = '#d0ebff'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.8, Math.PI, TAU); ctx.stroke();
    ctx.strokeStyle = p.v > VTOP ? '#ff922b' : '#4dabf7'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.8, Math.PI, ang(p.v)); ctx.stroke();
    // limite du prochain virage (rouge) et élan nécessaire (bleu)
    const i = Math.floor(p.s / T.step);
    let lim = 9999, besoin = 0;
    for (let d = 0; d < 70; d++) lim = Math.min(lim, T.vlim[(i + d) % T.M]);
    for (const f of T.boucles.concat(T.sauts)) { const d = (f.i0 - i + T.M) % T.M; if (d < 90) besoin = f.vmin; }
    const trait = (v, col) => { const a = ang(v); ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r * 0.55, cy + Math.sin(a) * r * 0.55); ctx.lineTo(cx + Math.cos(a) * r * 1.02, cy + Math.sin(a) * r * 1.02); ctx.stroke(); };
    if (lim < VBOOST) trait(lim, p.v > lim ? (Math.floor(performance.now() / 150) % 2 ? '#e03131' : '#ff8787') : '#e03131');

    ctx.strokeStyle = '#343a40'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r * 0.72, cy + Math.sin(a) * r * 0.72); ctx.stroke();
    disque(ctx, cx, cy, 7, '#343a40');

    const pw = clamp(Math.min(W, H) * 0.12, 44, 70), px = 16, py = H - pw * 1.35 - 14;
    ctx.fillStyle = appui ? '#ff922b' : 'rgba(255,255,255,.8)'; rrect(ctx, px, py, pw, pw * 1.35, 14); ctx.fill();

  }

  // ---------------------------------------------------------------------
  //  Caméra et boucle principale
  // ---------------------------------------------------------------------
  function majCamera(c, dt) {
    const p = c.joueur;
    const avance = Math.min(p.v, VBOOST) * 0.32;
    const tx = p.x + Math.cos(p.a) * avance, ty = p.y + Math.sin(p.a) * avance;
    const k = 1 - Math.exp(-dt * 4);
    c.cam.x += (tx - c.cam.x) * k; c.cam.y += (ty - c.cam.y) * k;
    const z = 1.06 - Math.min(p.v, VBOOST) / VBOOST * 0.16;
    c.cam.z += (z - c.cam.z) * (1 - Math.exp(-dt * 2));
    c.secousse = Math.max(0, c.secousse - dt);
  }

  let tPrec = 0;
  function boucle(now) {
    const dt = Math.min(0.05, Math.max(0, (now - tPrec) / 1000 || 0));
    tPrec = now;
    if (mode === 'affiche') { requestAnimationFrame(boucle); return; }
    if (C) {
      const pas = enPause ? 0 : dt;
      if (pas > 0) {
        // physique en petits pas réguliers
        let reste = pas;
        while (reste > 1e-6) { const d = Math.min(reste, 1 / 120); majCourse(C, d); reste -= d; }
        majCamera(C, pas);
      }
      dessinerMonde(C, pas, C.horloge);
      if (!C.demo) { dessinerTableau(C); majHud(C); }
      if (!C.demo && mode === 'course') Son.regime(C.joueur.v, !enPause && (C.phase === 'course' || C.phase === 'arrivee') && ['piste', 'raccourci', 'boucle', 'saut'].includes(C.joueur.mode));
      else Son.regime(0, false);
    }
    if (mode === 'garage') dessinerGarage(now / 1000);
    if (!$('fiche').classList.contains('cache')) dessinerFiche(now / 1000);
    requestAnimationFrame(boucle);
  }

  function formatTemps(s) { return t('secondes', { s: nb(Math.round(s * 10) / 10, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) }); }
  let hudCache = '';
  function majHud(c) {
    const p = c.joueur;
    const place = placeDe(c, p);
    const tours = Math.min(TOURS, p.tours + 1);
    const cle = place + '|' + tours + '|' + Math.floor(c.horloge * 10);
    if (cle === hudCache) return;
    hudCache = cle;
    $('hPlace').textContent = t('place.' + place);
    $('hTour').textContent = t('tour', { n: tours, total: TOURS });
    $('hTemps').textContent = formatTemps(p.fini ? p.temps : c.horloge);
  }

  let toastMinuterie = 0;
  function toast(txt) {
    const el = $('toast');
    el.textContent = txt; el.classList.remove('cache');
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    clearTimeout(toastMinuterie);
    toastMinuterie = setTimeout(() => el.classList.add('cache'), 1300);
  }

  // ---------------------------------------------------------------------
  //  Écrans
  // ---------------------------------------------------------------------
  const ECRANS = ['titre', 'niveaux', 'garage', 'fiche', 'pause', 'fin'];
  // focus clavier seulement juste après un geste du joueur (règle du cadre isolé)
  function focusDoux(el) {
    try {
      if (!el || (navigator.userActivation && !navigator.userActivation.isActive)) return;
      el.focus({ preventScroll: true });
    } catch (e) { /* rien */ }
  }
  function montrer(id) { ECRANS.forEach((e) => $(e).classList.toggle('cache', e !== id)); }
  function etoileSVG(pleine, taille) {
    return `<svg viewBox="0 0 24 24" width="${taille || 24}" height="${taille || 24}" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z" fill="${pleine ? '#ffc626' : '#dee2e6'}" stroke="${pleine ? '#e8590c' : '#adb5bd'}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
  }
  function iconeSon() {
    const on = sonActif;
    return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#5a3d8a"/>${on ? '<path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#5a3d8a" stroke-width="2" fill="none" stroke-linecap="round"/>' : '<path d="M16 9l5 6M21 9l-5 6" stroke="#e03131" stroke-width="2.4" stroke-linecap="round"/>'}</svg>`;
  }
  function majBoutonsSon() { document.querySelectorAll('.bSon').forEach((b) => { b.innerHTML = iconeSon(); b.setAttribute('aria-pressed', sonActif ? 'false' : 'true'); }); }
  function basculerSon() { sonActif = !sonActif; Son.init(); Son.actif(); majBoutonsSon(); ecrireReglages(); Son.clic(); }

  function demarrerDemo() {
    const n = Math.min(prog.deblo, NIVEAUX.length) - 1;
    C = creerCourse(Math.max(0, n - (n % 5)), { demo: true });
    C.phase = 'demo';
    C.voitures.forEach((v, k) => { v.s = k * 50; });
  }
  function allerTitre() {
    mode = 'titre'; enPause = false;
    $('hud').classList.add('cache'); $('decompte').classList.add('cache'); $('toast').classList.add('cache');
    montrer('titre');
    if (!C || !C.demo) demarrerDemo();
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
    focusDoux($('bJouer'));
  }

  function ouvrirNiveaux() {
    Son.init(); Son.clic();
    mode = 'niveaux';
    const g = $('grille'); g.innerHTML = '';
    ['chambre', 'cuisine', 'salon', 'grenier'].forEach((piece, q) => {
      const titre = document.createElement('div'); titre.className = 'piece'; titre.textContent = t('piece.' + piece);
      const rangee = document.createElement('div'); rangee.className = 'rangee p-' + piece;
      for (let k = 0; k < 5; k++) {
        const i = q * 5 + k, ouvert = i < prog.deblo;
        const b = document.createElement('button');
        b.className = 'niv' + (ouvert ? '' : ' ferme') + (NIVEAUX[i].nuit ? ' nuit' : '');
        b.setAttribute('aria-label', t('niveauN', { n: i + 1 }) + (NIVEAUX[i].nuit ? ' · ' + t('deNuit') : ''));
        const num = document.createElement('span'); num.textContent = ouvert ? nb(i + 1) : '';
        if (!ouvert) num.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="#fff"/><path d="M8 10V7a4 4 0 018 0v3" stroke="#fff" stroke-width="2.5" fill="none"/></svg>';
        b.appendChild(num);
        if (ouvert) {

  // --- Garage ---

  function dessinerFiche(h) {

      g.save(); g.translate(x, y + (pose ? 0 : -18));

    };

      const u = (tt % 2.4) / 2.4;

        else { const f = (u - 0.45) / 0.55, p0 = chemin(0.6); voiture(p0.x + f * 90, p0.y + f * 30, p0.a + f * 8, Math.abs(Math.sin(f * 9)) * 20 * (1 - f)); for (let q = 0; q < 5; q++) { g.fillStyle = '#ffd43b'; etoilePath(g, p0.x + 90 + Math.cos(q * 1.3 + f * 4) * 30 * f, p0.y + 30 + Math.sin(q * 1.3 + f * 4) * 30 * f, 7, 3, 5); g.fill(); } }

    } else if (type === 'releve') {

      g.strokeStyle = rail.fond; g.lineWidth = 38; g.stroke();
      if (type === 'boucle') { g.fillStyle = '#e7d6c0'; g.fillRect(130, 30, 80, 80); g.strokeStyle = rail.bord; g.lineWidth = 46; g.beginPath(); g.moveTo(130, 70); g.lineTo(210, 70); g.stroke(); g.strokeStyle = rail.fond; g.lineWidth = 38; g.stroke(); g.strokeStyle = rail.bord; g.lineWidth = 20; g.beginPath(); g.ellipse(170, 46, 34, 40, 0, 0, TAU); g.stroke(); g.strokeStyle = rail.clair; g.lineWidth = 12; g.stroke(); }
      const reussi = Math.floor(tt / 2.6) % 2 === 0;
      const x = 20 + u * 300;
      let y = 70, z = 0;

  // ---------------------------------------------------------------------
  //  Lancement d'un niveau
  // ---------------------------------------------------------------------
  function lancerNiveau(n) {
    Son.init(); Son.reveil();
    n = clamp(n, 0, NIVEAUX.length - 1);
    prog.deblo = Math.max(prog.deblo, n + 1);
    mode = 'course'; enPause = false; appui = false; hudCache = '';
    montrer(null);
    C = creerCourse(n);
    $('hud').classList.remove('cache');
    $('toast').classList.add('cache');
    const def = NIVEAUX[n];
    $('dNiveau').textContent = t('niveauTitre', { n: n + 1, piece: t('piece.' + def.piece) }) + (def.nuit ? ' · ' + t('deNuit') : '');
    $('dObjectif').textContent = t('objectif');
    $('dOr').innerHTML = etoileSVG(true, 16) + etoileSVG(true, 16) + etoileSVG(true, 16) + ' ' + t('tempsOr', { t: formatTemps(C.or) });
    $('dGros').textContent = '';
    $('decompte').classList.add('cache');
    const fiches = def.intro.filter((x) => !prog.tutos.includes(x));
    const partir = () => { if (C && C.n === n && mode === 'course') { C.phase = 'decompte'; C.tDec = 3; C.decN = null; $('decompte').classList.remove('cache'); } };
    if (fiches.length) montrerFiches(fiches, partir);
    else partir();
  }

  function arrivee(c) {
    c.phase = 'arrivee'; c.tArrivee = 0;
    toast(t('toast.arrivee'));
    for (let q = 0; q < 30; q++) particule(c, { type: 'confetti', x: c.joueur.x + (Math.random() - 0.5) * 100, y: c.joueur.y + (Math.random() - 0.5) * 100, vx: (Math.random() - 0.5) * 400, vy: (Math.random() - 0.5) * 400, vie: 1.6, col: ['#ff7a00', '#2f6fe0', '#2fb34a', '#ffc626', '#e63946'][q % 5], r: 6 });
  }

  function afficherFin(c) {
    mode = 'fin';
    const p = c.joueur, n = c.n, place = p.rang;
    const gagne = place <= 3;
    let etoiles = 0;
    if (gagne) etoiles = 1;
    if (place === 1) etoiles = 2;
    if (place === 1 && p.temps <= c.or) etoiles = 3;
    const avant = totalEtoiles();
    const ancienRecord = prog.records[n];
    const record = gagne && (!ancienRecord || p.temps < ancienRecord);
    let info = '';
    if (gagne) {
      Son.victoire();
      prog.etoiles[n] = Math.max(prog.etoiles[n], etoiles);
      if (record) { prog.records[n] = Math.round(p.temps * 10) / 10; prog.fantomes[n] = coderFantome(c.enreg); }
      prog.deblo = Math.max(prog.deblo, Math.min(NIVEAUX.length, n + 2));
      // objets du garage débloqués
      const apres = totalEtoiles();
      const neufs = [];
      VOITURES.forEach((o) => { if (o.besoin > avant && o.besoin <= apres) neufs.push(t('voiture.' + o.id)); });
      COULEURS.forEach((o) => { if (o.besoin > avant && o.besoin <= apres) neufs.push(t('couleur.' + o.id)); });
      RAILS.forEach((o) => { if (o.besoin > avant && o.besoin <= apres) neufs.push(t('rail.' + o.id)); });
      if (neufs.length) info = t('debloque', { nom: neufs.join(', ') });
      const tout = prog.etoiles.every((e) => e > 0);
      if (tout && !prog.fini) { prog.fini = true; info = (info ? info + ' ' : '') + t('bilan', { n: totalEtoiles(), max: NIVEAUX.length * 3 }); }
      ecrire(n + 2);
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
      if (tout) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 }); }
    } else {
      Son.defaite();
      info = p.sorties >= 2 ? t('conseil.sortie', { n: p.sorties }) : t('conseil.lent');
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
    }
    $('finTitre').textContent = gagne ? (place === 1 ? t('fin.premier') : t('fin.podium')) : t('fin.defaite');
    $('finPlace').textContent = t('place.' + place);
    $('finTemps').textContent = t('tempsCourse', { t: formatTemps(p.temps) }) + ' · ' + t('tempsOr', { t: formatTemps(c.or) });
    const rec = $('finRecord');
    rec.classList.toggle('bat', record);
    rec.textContent = record ? t('record.nouveau') : ancienRecord ? t('record.ancien', { t: formatTemps(ancienRecord) }) : '';
    $('finInfo').textContent = info;
    $('finRegles').innerHTML = [1, 2, 3].map((k) => `<span class="e">${[0, 1, 2].map((q) => etoileSVG(q < k, 15)).join('')}</span><span>${t('regle.e' + k)}</span>`).join('');
    const box = $('finEtoiles'); box.innerHTML = [0, 1, 2].map((q) => etoileSVG(q < etoiles, 58)).join('');
    box.querySelectorAll('svg').forEach((s, q) => setTimeout(() => { s.classList.add('vient'); if (q < etoiles) Son.etoile(q); }, 350 + q * 330));
    const bS = $('bSuivant');
    bS.textContent = gagne ? (n + 1 < NIVEAUX.length ? t('suivant') : t('rejouer')) : t('reessayer');
    bS.dataset.action = gagne && n + 1 < NIVEAUX.length ? 'suivant' : 'meme';
    $('bRejouer').classList.toggle('cache', !gagne || n + 1 >= NIVEAUX.length);
    $('hud').classList.add('cache'); $('decompte').classList.add('cache');
    montrer('fin');
    focusDoux(bS);
  }

  function mettrePause(oui) {
    if (mode !== 'course' || !C || C.demo) return;
    if (oui === enPause) return;
    enPause = oui;
    appui = false;
    if (oui) { montrer('pause'); Son.regime(0, false); focusDoux($('bReprendre')); }
    else if (ficheType) montrer('fiche'); else montrer(null);
  }

  // ---------------------------------------------------------------------
  //  Commandes : doigt posé, souris, clavier
  // ---------------------------------------------------------------------
  canvas.addEventListener('pointerdown', (e) => {
    Son.init(); Son.reveil();
    if (mode === 'course' && !enPause) { appui = true; e.preventDefault(); }
  });
  const lever = () => { appui = false; };
  window.addEventListener('pointerup', lever);
  window.addEventListener('pointercancel', lever);
  window.addEventListener('blur', lever);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  const TOUCHES = ['Space', 'Enter', 'ArrowUp', 'KeyW', 'NumpadEnter'];
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (mode === 'course') { e.preventDefault(); mettrePause(!enPause); }
      return;
    }
    if (ficheType && (e.code === 'Space' || e.code === 'Enter') && !$('fiche').classList.contains('cache')) { e.preventDefault(); if (!e.repeat) fermerFiche(); return; }
    if (mode === 'course' && !enPause && TOUCHES.includes(e.code)) {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
      e.preventDefault(); Son.init(); Son.reveil(); appui = true;
    }
  });
  window.addEventListener('keyup', (e) => { if (TOUCHES.includes(e.code)) appui = false; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(true); });

  // ---------------------------------------------------------------------
  //  Affiche (jaquette) : la voiture rouge s'envole du rail orange dans un
  //  virage, au-dessus d'une peluche, sous la lumière de la lampe.
  // ---------------------------------------------------------------------
  function cacherInterface() {
    ECRANS.forEach((e) => $(e).classList.add('cache'));
    $('hud').classList.add('cache'); $('decompte').classList.add('cache');
    document.querySelectorAll('.jel-langue, jel-langue').forEach((el) => { el.style.display = 'none'; });
  }
  function dessinerAffiche() {
    redim();
    const g = ctx; g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const s = Math.min(W / 600, H / 800);
    g.save(); g.translate((W - 600 * s) / 2, (H - 800 * s) / 2); g.scale(s, s);
    // sol de la chambre (motif agrandi) et tapis
    g.save(); g.scale(1.6, 1.6); g.fillStyle = motif('chambre'); g.fillRect(-400, -400, 1400, 1400); g.restore();
    g.fillStyle = '#ffd8a8'; g.beginPath(); g.ellipse(300, 470, 420, 300, -0.2, 0, TAU); g.fill();
    g.strokeStyle = '#ffa94d'; g.lineWidth = 22; g.setLineDash([40, 26]); g.stroke(); g.setLineDash([]);
    // lumière de la lampe de chevet (en haut à gauche)
    const halo = g.createRadialGradient(80, 80, 20, 80, 80, 620);
    halo.addColorStop(0, 'rgba(255,246,200,.95)'); halo.addColorStop(0.35, 'rgba(255,220,140,.45)'); halo.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = halo; g.fillRect(-100, -100, 900, 1000);
    // rail : grand virage orange
    const rail = RAILS[0];
    const tracer = () => { g.beginPath(); g.moveTo(-60, 720); g.bezierCurveTo(120, 520, 120, 300, 300, 250); g.bezierCurveTo(470, 200, 560, 300, 680, 180); };
    g.lineCap = 'butt';
    g.save(); g.translate(14, 18); tracer(); g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 170; g.stroke(); g.restore();
    tracer(); g.strokeStyle = rail.bord; g.lineWidth = 170; g.stroke();
    g.strokeStyle = rail.fond; g.lineWidth = 152; g.stroke();
    g.strokeStyle = rail.clair; g.lineWidth = 6;
    g.save(); g.translate(0, 0); g.setLineDash([]); g.restore();
    g.strokeStyle = rail.ligne; g.lineWidth = 5; g.setLineDash([34, 28]); tracer(); g.stroke(); g.setLineDash([]);
    // chevrons du virage
    for (let q = 0; q < 7; q++) {
      const x = 470 + q * 32, y = 232 - q * 2 + (q > 3 ? (q - 3) * 10 : 0);
      g.save(); g.translate(x, y - 96); g.rotate(-0.25);
      g.fillStyle = q % 2 ? '#e03131' : '#fff'; g.beginPath(); g.moveTo(16, 0); g.lineTo(-8, -12); g.lineTo(-2, 0); g.lineTo(-8, 12); g.closePath(); g.fill();
      g.restore();
    }
    // voitures robots sur le rail, au loin
    g.save(); g.translate(150, 520); g.scale(2.4, 2.4); dessinerVoiture(g, { x: 0, y: 0, a: -1.25, z: 0, modele: 'buggy', couleur: '#2fb34a', v: 300, rouge: 0 }); g.restore();
    g.save(); g.translate(90, 640); g.scale(2.2, 2.2); dessinerVoiture(g, { x: 0, y: 0, a: -1.05, z: 0, modele: 'formule', couleur: '#8e5cd9', v: 300, rouge: 0 }); g.restore();
    // ours en peluche au premier plan (coupé par le bord)
    g.save(); g.translate(520, 560); g.scale(3.4, 3.4); g.rotate(-0.4); dessinerObjet(g, { type: 'ours', x: 0, y: 0, r: 46, rot: 0, c: 0.2 }); g.restore();
    // cube de jouet en bas à gauche
    g.save(); g.translate(60, 760); g.scale(2.6, 2.6); dessinerObjet(g, { type: 'cube', x: 0, y: 0, r: 26, rot: 0.3, c: 0.1 }); g.restore();
    // traînée de vitesse
    g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineCap = 'round';
    for (let q = 0; q < 7; q++) { g.lineWidth = 6 + (q % 3) * 3; g.beginPath(); g.moveTo(150 + q * 18, 470 - q * 26); g.lineTo(250 + q * 18, 410 - q * 26); g.stroke(); }
    // héros : la voiture rouge en plein vol, en grand
    const hx = 330, hy = 360;
    g.save(); g.translate(hx + 30, hy + 120); g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(0, 0, 150, 70, -0.6, 0, TAU); g.fill(); g.restore();
    const lueur = g.createRadialGradient(hx, hy, 20, hx, hy, 260); lueur.addColorStop(0, 'rgba(255,255,255,.75)'); lueur.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = lueur; g.beginPath(); g.arc(hx, hy, 260, 0, TAU); g.fill();
    g.save(); g.translate(hx, hy); g.scale(8.6, 8.6);
    // contour clair
    g.save(); g.scale(1.06, 1.12); dessinerVoiture(g, { x: 0, y: 0, a: -0.62, z: 0, modele: 'bolide', couleur: '#ffffff', v: 0, rouge: 0 }); g.restore();
    dessinerVoiture(g, { x: 0, y: 0, a: -0.62, z: 0, modele: 'bolide', couleur: '#e63946', v: 500, rouge: 0 });
    g.restore();
    // étoiles du rebond
    for (let q = 0; q < 11; q++) {
      const a = q * 0.57, d = 200 + (q % 3) * 28;
      g.fillStyle = q % 2 ? '#ffd43b' : '#ffffff'; g.strokeStyle = '#e8590c'; g.lineWidth = 2;
      etoilePath(g, hx + Math.cos(a) * d, hy + Math.sin(a) * d * 0.8 - 40, 15 + (q % 3) * 5, 7, 5); g.fill(); g.stroke();
    }
    // étincelles orange sous les roues
    for (let q = 0; q < 14; q++) disque(g, 200 + q * 9, 470 + Math.sin(q) * 14 - q * 3, 6 - q * 0.3, q % 2 ? '#ff922b' : '#ffd43b');
    // lampe de chevet
    g.save(); g.translate(70, 70); g.scale(1.7, 1.7); dessinerObjet(g, { type: 'lampe', x: 0, y: 0, r: 46, rot: 0, c: 0 }); g.restore();
    g.restore();
  }
  function demarrerAffiche() {
    mode = 'affiche';
    cacherInterface(); setTimeout(cacherInterface, 300); setTimeout(cacherInterface, 1200);
    dessinerAffiche();
    window.addEventListener('resize', dessinerAffiche);
  }

  // ---------------------------------------------------------------------
  //  Images du jeu (page du jeu) : 1 = niveau 1, 2 = cuisine (saut),
  //  3 = salon (looping et chat), sur ordinateur.
  // ---------------------------------------------------------------------
  function ouvrirApercu(numero) {
    sonActif = false;
    const n = numero === 1 ? 0 : numero === 2 ? 7 : 12;
    mode = 'course';
    montrer(null);
    C = creerCourse(n);
    C.phase = 'course';
    C.joueur.robot = true; C.joueur.skill = 0.97;
    $('hud').classList.remove('cache');
    const dt = 1 / 120, J = C.joueur;
    const tmax = numero === 1 ? 2.6 : 70;
    for (let k = 0; k < tmax * 120; k++) {
      majCourse(C, dt); majCamera(C, dt);
      if (numero === 2 && J.mode === 'saut' && J.z > 18 && C.horloge > 6) break;
      if (numero === 3 && J.mode === 'boucle' && J.phi > TAU * 0.42 && C.horloge > 8) break;
    }
    for (let k = 0; k < 240; k++) majCamera(C, 1 / 60);
    J.robot = false; appui = true;
    C.gele = true;
    if (numero === 1) J.rouge = 1;
  }

  // ---------------------------------------------------------------------
  //  Boutons
  // ---------------------------------------------------------------------
  $('bJouer').addEventListener('click', () => {
    Son.init(); Son.reveil(); Son.clic();
    const nouvelle = () => { lancerNiveau(0); };
    if (!SAVE) { nouvelle(); return; }
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProg(); majBoutonsSon(); lancerNiveau(clamp(Math.floor(Number(d.niveau) || 1), 1, NIVEAUX.length) - 1); },
      onNouvelle: nouvelle,
      onEffacer: () => { chargerProg(); majBoutonsSon(); nouvelle(); },
    });
  });
  $('bNiveaux').addEventListener('click', ouvrirNiveaux);
  $('bGarage').addEventListener('click', ouvrirGarage);
  document.querySelectorAll('.bRetour').forEach((b) => b.addEventListener('click', () => { Son.clic(); allerTitre(); }));
  document.querySelectorAll('.bSon').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); basculerSon(); }));
  $('bPause').addEventListener('click', () => { Son.init(); Son.clic(); mettrePause(true); });
  document.querySelectorAll('#hud button').forEach((b) => b.addEventListener('mouseup', () => b.blur()));
  $('bReprendre').addEventListener('click', () => { Son.clic(); mettrePause(false); });
  $('bRecommencer').addEventListener('click', () => { Son.clic(); const n = C ? C.n : 0; enPause = false; ficheType = null; lancerNiveau(n); });
  $('bAccueilP').addEventListener('click', () => { Son.clic(); if (C && !C.demo) ecrire(C.n + 1); enPause = false; ficheType = null; C = null; allerTitre(); });
  $('bFiche').addEventListener('click', fermerFiche);
  $('fiche').addEventListener('click', (e) => { if (e.target === $('fiche') || e.target === $('fCanvas')) fermerFiche(); });
  $('bSuivant').addEventListener('click', () => { Son.clic(); const n = C.n; lancerNiveau($('bSuivant').dataset.action === 'suivant' ? n + 1 : n); });
  $('bRejouer').addEventListener('click', () => { Son.clic(); lancerNiveau(C.n); });
  $('bNiveauxFin').addEventListener('click', ouvrirNiveaux);
  $('bAccueilFin').addEventListener('click', () => { Son.clic(); C = null; allerTitre(); });

  // Sauvegarde à la fermeture de la page (seulement pendant une course)
  if (SAVE) window.JEL_SAVE.surFermeture(() => { if (mode === 'course' && C && !C.demo && !APERCU) ecrire(C.n + 1); });

  window.addEventListener('resize', redim);

  // ---------------------------------------------------------------------
  //  Démarrage
  // ---------------------------------------------------------------------
  try { document.title = t('titre'); } catch (e) { /* rien */ }
  redim();
  chargerProg();
  majBoutonsSon();
  let boutonEffacer = null;
  if (AFFICHE) { demarrerAffiche(); return; }
  if (APERCU) { ouvrirApercu(APERCU); requestAnimationFrame(boucle); return; }
  if (SAVE) boutonEffacer = SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacerTitre'), apres: () => { chargerProg(); majBoutonsSon(); demarrerDemo(); } });
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
