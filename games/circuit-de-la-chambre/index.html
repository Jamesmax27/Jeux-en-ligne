<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

    }

  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;

    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);

  }

  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)

  // tout de suite. Renvoie true si la fenêtre s'affiche.

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);

    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

    const gros = { chambre: 'lit', cuisine: 'frigo', salon: 'canape', grenier: 'coffre' }[piece];
    T.deco.push({ type: gros, x: B.x1 + 420, y: (B.y0 + B.y1) / 2 - 80, r: 280, rot: Math.PI / 2, c: 0 });
    T.deco.push({ type: gros, x: B.x0 - 420, y: B.y1 - 60, r: 280, rot: -Math.PI / 2, c: 1 });
    // petits objets un peu partout
    const liste = OBJETS[piece];
    for (let gx = B.x0 - 1100; gx < B.x1 + 1100; gx += 210) {
      for (let gy = B.y0 - 1100; gy < B.y1 + 1100; gy += 210) {
        if (r() > 0.5) continue;
        const type = liste[Math.floor(r() * liste.length)];
        const x = gx + r() * 150, y = gy + r() * 150, rr = RAYONS[type];
        if (!loin(x, y, rr + 60)) continue;
        T.deco.push({ type, x, y, r: rr, rot: r() * TAU, c: r() });
      }
    }
  }

  // Chemins du rail préparés une fois (Path2D, en coordonnées du monde)
  function polyDecale(T, d, a, b) {
    const p = new Path2D();
    for (let i = a; i <= b; i++) {
      const k = ((i % T.M) + T.M) % T.M;
      const x = T.X[k] + T.NX[k] * d, y = T.Y[k] + T.NY[k] * d;
      if (i === a) p.moveTo(x, y); else p.lineTo(x, y);
    }
    return p;
  }
  function preparerChemins(T) {
    // morceaux du rail (coupé aux sauts)
    const coupes = T.sauts.map((s) => [s.i0, s.i1]).sort((a, b) => a[0] - b[0]);
    const morceaux = [];
    let debut = 0;
    for (const [a, b] of coupes) { morceaux.push([debut, a]); debut = b; }
    morceaux.push([debut, T.M]);
    T.morceaux = morceaux;
    T.chRail = new Path2D(); T.chBords = new Path2D(); T.chVoies = new Path2D();
    for (const [a, b] of morceaux) {
      T.chRail.addPath(polyDecale(T, 0, a, b));
      for (const d of [-DEMI + 3, DEMI - 3]) T.chBords.addPath(polyDecale(T, d, a, b));
      for (const d of [-18, 0, 18]) T.chVoies.addPath(polyDecale(T, d, a, b));
    }
    // morceaux colorés (rail arc-en-ciel)
    T.chArc = [];
    const n = 18;
    for (let q = 0; q < n; q++) {
      const a = Math.floor((q * T.M) / n), b = Math.floor(((q + 1) * T.M) / n) + 1;
      const p = new Path2D();
      for (const [m0, m1] of morceaux) {
        const x0 = Math.max(a, m0), x1 = Math.min(b, m1);
        if (x1 > x0) p.addPath(polyDecale(T, 0, x0, x1));
      }
      T.chArc.push(p);
    }
    // virages relevés (bordure rayée) et chevrons
    T.chBank = new Path2D();
    let i = 0;
    while (i < T.M) {
      if (!T.bank[i]) { i++; continue; }
      let j = i;
      while (j < T.M && T.bank[j]) j++;
      const sg = T.K[Math.floor((i + j) / 2)] > 0 ? -1 : 1;
      T.chBank.addPath(polyDecale(T, sg * (DEMI + 7), i, j - 1));
      i = j;
    }
    T.chevrons = [];
    for (const p of T.pics) {
      if (T.bank[p] || Math.abs(T.K[p]) < 1 / 120) continue;
      const [a, b] = [p - 14, p + 14];
      for (let k = a; k <= b; k += 4) {
        const m = ((k % T.M) + T.M) % T.M;
        const [ox, oy] = exterieur(T, m);
        T.chevrons.push({ x: T.X[m] + ox * (DEMI + 9), y: T.Y[m] + oy * (DEMI + 9), a: T.A[m], sg: T.K[m] > 0 ? 1 : -1, n: k });
      }
    }
    if (T.aig) {
      T.chRacc = new Path2D();
      T.aig.pts.forEach((p, q) => (q ? T.chRacc.lineTo(p[0], p[1]) : T.chRacc.moveTo(p[0], p[1])));
    }
    // plots lumineux (nuit)
    T.plots = [];
    for (const [a, b] of morceaux) for (let k = a + 2; k < b - 1; k += 9) for (const d of [-DEMI - 2, DEMI + 2]) T.plots.push([T.X[k % T.M] + T.NX[k % T.M] * d, T.Y[k % T.M] + T.NY[k % T.M] * d]);
  }

  // ---------------------------------------------------------------------
  //  Sauvegarde et progression
  // ---------------------------------------------------------------------
  function progVide() {
    return { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), fantomes: {}, deblo: 1, garage: { voiture: 'bolide', couleur: 'rouge', rail: 'orange' }, tutos: [], fini: false };
  }
  let prog = progVide();
  let sonActif = true;
  function chargerProg() {
    prog = progVide();
    let d = null;
    try { d = SAVE ? SAVE.load(JEU) : null; } catch (e) { d = null; }
    const p = d && d.prog;
    if (p && typeof p === 'object') {
      if (Array.isArray(p.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => clamp(Number(p.etoiles[i]) || 0, 0, 3));
      if (Array.isArray(p.records)) prog.records = NIVEAUX.map((_, i) => Math.max(0, Number(p.records[i]) || 0));
      if (p.fantomes && typeof p.fantomes === 'object') prog.fantomes = p.fantomes;
      if (p.garage && typeof p.garage === 'object') Object.assign(prog.garage, p.garage);
      if (Array.isArray(p.tutos)) prog.tutos = p.tutos.filter((x) => typeof x === 'string');
      prog.fini = !!p.fini;
    }
    if (d && d.niveau) prog.deblo = Math.max(prog.deblo, clamp(Math.floor(d.niveau), 1, NIVEAUX.length));
    for (let i = 0; i < NIVEAUX.length; i++) if (prog.etoiles[i] > 0) prog.deblo = Math.max(prog.deblo, Math.min(NIVEAUX.length, i + 2));
    if (d && d.options && typeof d.options.son === 'boolean') sonActif = d.options.son;
    else { try { const v = localStorage.getItem('fmg-circuit-son'); if (v !== null) sonActif = v === '1'; } catch (e) { /* stockage refusé */ } }
  }
  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  function ecrire(niveau) {
    if (!SAVE || APERCU || AFFICHE) return;
    try { window.JEL_SAVE.save(JEU, { niveau, score: totalEtoiles(), prog, options: { son: sonActif } }); } catch (e) { /* rien */ }
  }
  // Réglages (son, garage) : écrits seulement s'il existe déjà une sauvegarde
  function ecrireReglages() {
    try { localStorage.setItem('fmg-circuit-son', sonActif ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    if (!SAVE || APERCU || AFFICHE) return;
    try { if (SAVE.existe(JEU)) SAVE.save(JEU, { prog, options: { son: sonActif } }); } catch (e) { /* rien */ }
  }
  const choixDebloque = (liste, id) => { const o = liste.find((x) => x.id === id); return o && totalEtoiles() >= o.besoin ? id : liste[0].id; };

  // Voiture fantôme : positions toutes les 0,25 s, codées en base 36
  function coderFantome(pts) { return pts.map((v) => Math.round(v / 2).toString(36)).join(','); }
  function decoderFantome(txt) { try { return String(txt).split(',').map((v) => parseInt(v, 36) * 2); } catch (e) { return null; } }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, rien avant le premier geste)
  // ---------------------------------------------------------------------
  const Son = {
    ctx: null, moteur: null, gainM: null, filtre: null, maitre: null,
    init() {
      if (this.ctx || APERCU || AFFICHE) return;
      try {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        this.ctx = new C();
        this.maitre = this.ctx.createGain(); this.maitre.gain.value = sonActif ? 0.9 : 0; this.maitre.connect(this.ctx.destination);
        this.moteur = this.ctx.createOscillator(); this.moteur.type = 'sawtooth'; this.moteur.frequency.value = 60;
        this.filtre = this.ctx.createBiquadFilter(); this.filtre.type = 'lowpass'; this.filtre.frequency.value = 700;
        this.gainM = this.ctx.createGain(); this.gainM.gain.value = 0;
        this.moteur.connect(this.filtre); this.filtre.connect(this.gainM); this.gainM.connect(this.maitre);
        this.moteur.start();
      } catch (e) { this.ctx = null; }
    },
    reveil() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
    actif() { if (this.maitre) this.maitre.gain.value = sonActif ? 0.9 : 0; },
    regime(v, on) {
      if (!this.ctx) return;
      const tt = this.ctx.currentTime;
      this.moteur.frequency.setTargetAtTime(on ? 55 + v * 0.42 : 40, tt, 0.05);
      this.filtre.frequency.setTargetAtTime(500 + v * 2.5, tt, 0.05);
      this.gainM.gain.setTargetAtTime(on ? 0.035 + Math.min(v, 600) / 600 * 0.04 : 0, tt, 0.08);
    },
    note(f, d, type, vol, f2, retard) {
      if (!this.ctx || !sonActif) return;
      const c = this.ctx, t0 = c.currentTime + (retard || 0);
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      o.connect(g); g.connect(this.maitre); o.start(t0); o.stop(t0 + d + 0.05);
    },
    bruit(d, vol, fc, retard) {
      if (!this.ctx || !sonActif) return;
      const c = this.ctx, t0 = c.currentTime + (retard || 0);
      const buf = c.createBuffer(1, Math.floor(c.sampleRate * d), c.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
      const s = c.createBufferSource(); s.buffer = buf;
      const fl = c.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = fc || 1200;
      const g = c.createGain(); g.gain.value = vol || 0.2;
      s.connect(fl); fl.connect(g); g.connect(this.maitre); s.start(t0);
    },
    clic() { this.note(660, 0.07, 'triangle', 0.15); },
    bip(fort) { this.note(fort ? 880 : 520, fort ? 0.5 : 0.18, 'square', 0.12); },
    boing() { this.note(220, 0.35, 'triangle', 0.3, 760); this.note(760, 0.3, 'triangle', 0.2, 240, 0.18); },
    turbo() { this.note(300, 0.4, 'sawtooth', 0.12, 1200); this.bruit(0.35, 0.15, 2400); },
    saut() { this.note(400, 0.3, 'sine', 0.18, 900); },
    pose() { this.bruit(0.15, 0.25, 500); this.note(140, 0.12, 'square', 0.1); },
    chute() { this.note(600, 0.5, 'triangle', 0.2, 120); this.bruit(0.2, 0.2, 400, 0.45); },
    boucle() { [0, 1, 2, 3].forEach((i) => this.note(500 + i * 120, 0.12, 'triangle', 0.12, null, i * 0.08)); },
    miaou() { this.note(650, 0.45, 'triangle', 0.22, 1050); this.note(1050, 0.35, 'triangle', 0.16, 600, 0.3); },
    train() { this.note(880, 0.25, 'square', 0.1); this.note(660, 0.35, 'square', 0.1, null, 0.25); },
    aig() { this.note(1200, 0.06, 'square', 0.1); this.note(900, 0.06, 'square', 0.1, null, 0.07); },
    tour() { this.note(700, 0.12, 'triangle', 0.18); this.note(1050, 0.2, 'triangle', 0.18, null, 0.1); },
    frein() { this.bruit(0.2, 0.06, 3500); },
    victoire() { [523, 659, 784, 1046].forEach((f, i) => this.note(f, 0.3, 'triangle', 0.22, null, i * 0.12)); this.note(1318, 0.6, 'sine', 0.2, null, 0.5); },
    defaite() { [523, 440, 349].forEach((f, i) => this.note(f, 0.35, 'triangle', 0.18, null, i * 0.18)); },
    etoile(i) { this.note(880 + i * 220, 0.25, 'sine', 0.22); },
  };

  // ---------------------------------------------------------------------
  //  La course
  // ---------------------------------------------------------------------
  let C = null;          // course en cours (ou démo de l'écran titre)
  let mode = 'titre';    // titre, niveaux, garage, course, fin, affiche, apercu
  let appui = false;
  let enPause = false;

  function etatObst(o, h) {
    const ph = (h + o.off) % o.per;
    if (o.type === 'chat') {
      if (ph < 1.3) return { etat: 'ombre', f: ph / 1.3, actif: false, bientot: true };
      if (ph < 2.4) return { etat: 'patte', f: (ph - 1.3) / 1.1, actif: true, bientot: true };
      return { etat: 'rien', f: 0, actif: false, bientot: o.per - ph < 0.5 };
    }
    if (ph < 1.5) return { etat: 'alerte', f: ph / 1.5, actif: false, bientot: true };
    if (ph < 3.2) return { etat: 'train', f: (ph - 1.5) / 1.7, actif: true, bientot: true };
    return { etat: 'rien', f: 0, actif: false, bientot: o.per - ph < 0.5 };
  }
  const feuVert = (h) => Math.floor(h / 2.6) % 2 === 0;

  function creerCourse(n, opts) {
    opts = opts || {};
    const def = NIVEAUX[n];
    const T = construirePiste(def, n);
    const g = prog.garage;
    const couleurJ = COULEURS.find((c) => c.id === choixDebloque(COULEURS, g.couleur)).c;
    const autres = ['#2fb34a', '#8e5cd9', '#ffc626', '#2f6fe0', '#ff7f11', '#e63946'].filter((c) => c !== couleurJ);
    const modeles = ['buggy', 'formule', 'camion', 'retro', 'bolide', 'fusee'];
    const rr = rng(def.seed + 99);
    const voitures = [];
    const ordre = [1, 3, 0, 2]; // voie de chaque voiture (le joueur au milieu)
    for (let k = 0; k < 4; k++) {
      const joueur = k === 0;
      voitures.push({
        joueur, robot: !joueur || !!opts.demo, skill: joueur ? (opts.demo ? 0.93 : 1) : clamp(def.rb - (k - 1) * 0.05 + (rr() - 0.5) * 0.02, 0.5, 0.97),
        modele: joueur ? choixDebloque(VOITURES, g.voiture) : modeles[(k + n) % modeles.length],
        couleur: joueur ? couleurJ : autres[k - 1],
        voie: VOIES[ordre[k]], s: 0, tours: 0, v: 0, mode: 'piste', t: 0, fini: false, temps: 0, rang: 0,
        x: 0, y: 0, a: 0, z: 0, u: 0, erreur: -1, sorties: 0, fumee: 0, rouge: 0,
      });
    }
    const rail = RAILS.find((r) => r.id === choixDebloque(RAILS, g.rail));
    const c = {
      n, def, T, voitures, joueur: voitures[0], horloge: 0, phase: 'intro', tDec: 0, demo: !!opts.demo,
      particules: [], cam: { x: 0, y: 0, z: 1 }, rail, secousse: 0, enreg: [], tEnreg: 0, fantome: null,
      tArrivee: 0, gele: false, or: 0, dernierTour: false, pm: clamp(0.36 - n * 0.013, 0.1, 0.36),
    };
    voitures.forEach((v) => majPose(c, v));
    if (!opts.demo && !opts.sansOr) c.or = tempsOr(n, T);
    const fan = prog.fantomes[n];
    if (fan && !opts.demo) c.fantome = decoderFantome(fan);
    const p = c.joueur; c.cam.x = p.x; c.cam.y = p.y;
    return c;
  }

  // Temps d'or : un robot parfait fait la course seul (sans raccourci)
  const cacheOr = {};
  function tempsOr(n, T) {
    if (cacheOr[n]) return cacheOr[n];
    const fausse = { T, horloge: 0, particules: [], voitures: [], demo: true, sansRacc: true, pm: 0, joueur: null, n };
    const v = { joueur: false, robot: true, skill: 0.985, voie: 0, s: 0, tours: 0, v: 0, mode: 'piste', t: 0, fini: false, temps: 0, x: 0, y: 0, a: 0, z: 0, u: 0, erreur: -1, sorties: 0, fumee: 0, rouge: 0 };
    fausse.voitures.push(v);
    const dt = 1 / 60;
    for (let k = 0; k < 60 * 400 && !v.fini; k++) { fausse.horloge += dt; avancerVoiture(fausse, v, piloter(fausse, v), dt); }
    cacheOr[n] = Math.ceil((v.fini ? v.temps : 120) * 1.04 * 10) / 10;
    return cacheOr[n];
  }

  // Pilote automatique : robots, démo et images du jeu
  function piloter(c, v) {
    const T = c.T, M = T.M;
    if (!['piste', 'raccourci', 'boucle', 'saut'].includes(v.mode)) return false;
    const i = Math.floor(v.s / T.step) % M;
    let cible = Math.min(T.vt[i], T.vt[(i + 2) % M]) * v.skill;
    if (v.mode === 'raccourci' || v.mode === 'boucle' || v.mode === 'saut') cible = VTOP * v.skill;
    // élan avant un looping ou un saut
    for (const f of T.boucles.concat(T.sauts)) {
      const d = (f.i0 - i + M) % M;
      if (d < 70) cible = Math.max(cible, f.vmin + 45);
    }
    if (v.erreur >= 0) { const d = (v.erreur - i + M) % M; if (d < 40) cible = 9999; else if (d > M - 30) v.erreur = -1; }
    for (const o of T.obst) {
      const d = ((o.i - i + M) % M) * T.step;
      if (d > 26 && d < 260) {
        // passe si la voiture arrive avant la patte (ou le train), sinon attend
        const ph = (c.horloge + o.off) % o.per;
        const debut = o.type === 'chat' ? 1.3 : 1.5, fin = o.type === 'chat' ? 2.4 : 3.2;
        let tDeb, tFin;
        if (ph >= debut && ph < fin) { tDeb = 0; tFin = fin - ph; }
        else { tDeb = ph < debut ? debut - ph : o.per - ph + debut; tFin = tDeb + fin - debut; }
        const tArr = d / Math.max(v.v, 60);
        if (tArr + 0.3 > tDeb && tArr - 0.3 < tFin) cible = Math.min(cible, d < 80 ? 0 : 90);
      }
    }
    if (v.fini && !v.joueur) cible = Math.min(cible, 160);
    if (v.fini && v.joueur) cible = Math.min(cible, 120);
    return v.v < cible;
  }

  function majVitesse(c, v, appuye, dt) {
    const T = c.T, i = Math.floor(v.s / T.step) % T.M;
    const glisse = v.mode === 'piste' && T.flaque[i] ? 0.5 : 1;
    if (appuye) {
      if (v.v < VTOP) v.v += (ACC * (1 - v.v / VTOP) + 50) * dt * glisse;
      else v.v -= 170 * dt;
    } else {
      v.v -= FREIN * dt * (glisse < 1 ? 0.6 : 1);
      if (v.v < 0) v.v = 0;
    }
  }

  function entrerEvt(c, v, e) {
    const T = c.T;
    if (e.type === 'boost') {
      v.v = Math.min(Math.max(v.v, 200) + 190, VBOOST);
      if (v.joueur && !c.demo) { Son.turbo(); toast(t('toast.turbo')); }
      for (let q = 0; q < 10; q++) particule(c, { type: 'flamme', x: v.x, y: v.y, vx: -Math.cos(v.a) * 120 + (Math.random() - 0.5) * 80, vy: -Math.sin(v.a) * 120 + (Math.random() - 0.5) * 80, vie: 0.5, col: q % 2 ? '#ffd43b' : '#ff7a00', r: 7 });
      return false;
    }
    if (e.type === 'aig') {
      if (feuVert(c.horloge) && !(v.robot && c.sansRacc)) {
        v.mode = 'raccourci'; v.u = 0;
        if (v.joueur && !c.demo) { Son.aig(); toast(t('toast.raccourci')); }
        return true;
      }
      return false;
    }
    if (e.type === 'boucle' || e.type === 'saut') {
      if (v.robot || v.v >= e.f.vmin) {
        v.mode = e.type; v.f = e.f; v.t = 0; v.phi = 0;
        if (v.joueur && !c.demo) { if (e.type === 'boucle') Son.boucle(); else Son.saut(); }
      } else {
        v.mode = 'chute'; v.f = e.f; v.chute = e.type; v.t = 0; v.vChute = Math.max(v.v, 60);
        if (v.joueur && !c.demo) { Son.chute(); toast(t(e.type === 'boucle' ? 'toast.boucleRatee' : 'toast.sautRate')); v.sorties++; }
      }
      return true;
    }
    return false;
  }

  function demarrerVol(c, v) {
    v.mode = 'vol'; v.t = 0; v.sVol = v.s; v.erreur = -1;
    v.vol = { x: v.x, y: v.y, vx: Math.cos(v.a) * v.v * 0.8, vy: Math.sin(v.a) * v.v * 0.8, rot: v.a, vr: (Math.random() < 0.5 ? -1 : 1) * (7 + Math.random() * 4), rebond: false };
    if (v.joueur && !c.demo) { v.sorties++; Son.frein(); toast(t('toast.sortie')); c.secousse = 0.35; }
  }

  function retourRail(v, s) {
    v.mode = 'retour'; v.t = 0; v.sCible = s; v.depart = { x: v.x, y: v.y, a: v.a };
  }

  function avancerVoiture(c, v, appuye, dt) {
    const T = c.T, M = T.M;
    v.t += dt;
    switch (v.mode) {
      case 'piste': {
        majVitesse(c, v, appuye, dt);
        let ds = v.v * dt;
        while (ds > 0) {
          const iCur = Math.floor(v.s / T.step + 1e-9);
          const sNext = (iCur + 1) * T.step;
          if (v.s + ds < sNext) { v.s += ds; ds = 0; break; }
          ds -= sNext - v.s; v.s = sNext;
          let iN = iCur + 1;
          if (iN >= M) { iN = 0; v.s = 0; v.tours++; finDeTour(c, v); }
          const e = T.evt[iN];
          if (e && entrerEvt(c, v, e) && v.mode !== 'piste') { majPose(c, v); return; }
        }
        const i = Math.floor(v.s / T.step) % M;
        v.rouge = Math.max(0, v.rouge - dt * 3);
        if (v.v > T.vlim[i] * 1.03) demarrerVol(c, v);
        break;
      }
      case 'raccourci': {
        majVitesse(c, v, appuye, dt);
        v.u += v.v * dt;
        const R = T.aig;
        v.s = (R.a + (R.b - R.a) * clamp(v.u / R.Lr, 0, 1)) * T.step;
        if (v.u >= R.Lr) { v.mode = 'piste'; v.s = R.b * T.step; }
        break;
      }
      case 'boucle': case 'saut': {
        majVitesse(c, v, appuye, dt);
        v.v = Math.max(v.v, v.f.vmin * 0.9);
        if (v.mode === 'boucle') {
          // tour de l'anneau : 2π × RBOUCLE parcourus, le rail avance à peine
          v.phi = (v.phi || 0) + (v.v * dt) / RBOUCLE;
          v.s = (v.f.i0 + (v.f.i1 - v.f.i0) * Math.min(1, v.phi / TAU)) * T.step;
          if (v.phi >= TAU) v.s = v.f.i1 * T.step + 0.01;
        } else v.s += v.v * dt;
        if (v.s >= v.f.i1 * T.step) {
          v.phi = 0;
          v.s = v.f.i1 * T.step; v.mode = 'piste';
          if (v.joueur && !c.demo) Son.pose();
          for (let q = 0; q < 8; q++) particule(c, { type: 'fumee', x: v.x, y: v.y, vx: (Math.random() - 0.5) * 90, vy: (Math.random() - 0.5) * 90, vie: 0.6, col: '#ffffff', r: 9 });
        }
        break;
      }
      case 'chute': {
        if (v.chute === 'saut') {
          if (v.t < 0.45) v.s += v.vChute * dt * (1 - v.t / 0.45);
        }
        if (v.t > (v.chute === 'saut' ? 1.3 : 1.2)) retourRail(v, (v.f.i1 + 3) * T.step);
        break;
      }
      case 'vol': {
        const w = v.vol;
        const fr = Math.exp(-2.6 * dt);
        w.vx *= fr; w.vy *= fr; w.x += w.vx * dt; w.y += w.vy * dt; w.rot += w.vr * dt; w.vr *= Math.exp(-1.5 * dt);
        if (!w.rebond && v.t > 0.36) {
          w.rebond = true; w.vx *= -0.45; w.vy *= -0.45;
          if (v.joueur && !c.demo) Son.boing();
          for (let q = 0; q < 9; q++) particule(c, { type: 'etoile', x: w.x, y: w.y, vx: (Math.random() - 0.5) * 260, vy: (Math.random() - 0.5) * 260, vie: 0.8, col: q % 2 ? '#ffd43b' : '#ffffff', r: 8 });
        }
        if (v.t > 1.05) retourRail(v, v.sVol);
        break;
      }
      case 'retour': {
        if (v.t >= 0.65) { v.mode = 'piste'; v.s = v.sCible; v.v = 70; v.t = 0; }
        break;
      }
      case 'tourne': {
        if (v.t > 1.0) { v.mode = 'piste'; v.s = v.sObst; v.v = 0; v.t = 0; }
        break;
      }
      default: break;
    }
    // patte du chat et petit train
    if (v.mode === 'piste') {
      const i = Math.floor(v.s / T.step) % M;
      for (const o of T.obst) {
        const d = Math.abs(i - o.i);
        if (d <= 5 && etatObst(o, c.horloge).actif) {
          v.mode = 'tourne'; v.t = 0; v.v = 0; v.sObst = (o.i + 8) * T.step;
          if (v.joueur && !c.demo) { if (o.type === 'chat') Son.miaou(); else Son.train(); toast(t(o.type === 'chat' ? 'toast.chat' : 'toast.train')); c.secousse = 0.3; v.sorties++; }
        }
      }
    }
    majPose(c, v);
  }

  function finDeTour(c, v) {
    if (v.robot && !v.joueur && Math.random() < c.pm) {
      const pics = c.T.pics.filter((p) => !c.T.bank[p] && c.T.vlim[p] < 400);
      if (pics.length) v.erreur = pics[Math.floor(Math.random() * pics.length)];
    }
    if (v.tours >= TOURS && !v.fini) {
      v.fini = true; v.temps = c.horloge;
      v.rang = 1 + c.voitures.filter((w) => w !== v && w.fini).length;
      if (v.joueur && !c.demo) arrivee(c);
      return;
    }
    if (v.joueur && !c.demo && !v.fini) {
      Son.tour();
      toast(v.tours === TOURS - 1 ? t('toast.dernierTour') : t('toast.tour', { n: v.tours + 1, total: TOURS }));
    }
  }

  // Position et angle affichés de chaque voiture
  function majPose(c, v) {
    const T = c.T;
    if (v.mode === 'piste' || v.mode === 'tourne') {
      const p = poseSur(T, v.s, v.voie);
      v.x = p.x; v.y = p.y; v.a = p.a + (v.mode === 'tourne' ? v.t * 14 : 0); v.z = 0;
    } else if (v.mode === 'raccourci') {
      const p = poseRaccourci(T, v.u, v.voie * 0.5);
      v.x = p.x; v.y = p.y; v.a = p.a; v.z = 0;
    } else if (v.mode === 'boucle') {
      const p = pointBoucle(T, v.f, clamp((v.phi || 0) / TAU, 0, 1), v.voie * 0.5);
      v.x = p.x; v.y = p.y; v.a = p.a; v.z = p.z;

      const f = v.f, L = (f.i1 - f.i0) * T.step, u = clamp((v.s - f.i0 * T.step) / L, 0, 1);
      const p = poseSur(T, v.s, v.voie);

    } else if (v.mode === 'chute') {
      if (v.chute === 'saut') {

      } else {

        const k = v.t < 0.5 ? v.t / 0.5 : Math.max(0, 1 - (v.t - 0.5) / 0.5);
        const p = pointBoucle(T, v.f, k * 0.24, v.voie * 0.5);

        v.x = p.x - Math.cos(p.a) * recul; v.y = p.y; v.a = p.a + (v.t > 0.5 ? Math.PI * Math.min(1, (v.t - 0.5) * 2) : 0); v.z = p.z;
      }
    } else if (v.mode === 'vol') {
      const w = v.vol;
      v.x = w.x; v.y = w.y; v.a = w.rot; v.z = Math.abs(Math.sin(v.t * 6.5)) * 24 * Math.exp(-v.t * 2);
    } else if (v.mode === 'retour') {
      const p = poseSur(T, v.sCible, v.voie), f = clamp(v.t / 0.65, 0, 1), e = f * f * (3 - 2 * f);

    }
  }

  const progression = (c, v) => (v.fini ? 1e9 - v.temps * 1000 : v.tours * c.T.L + v.s);
  function placeDe(c, v) {
    if (v.fini) return v.rang;
    let r = 1;
    for (const w of c.voitures) if (w !== v && (w.fini || progression(c, w) > progression(c, v))) r++;
    return r;
  }

  function majCourse(c, dt) {
    if (c.gele) return;
    if (c.phase === 'decompte') {
      c.tDec -= dt;
      const n = Math.ceil(c.tDec);
      if (n !== c.decN) {
        c.decN = n;
        if (n > 0) { $('dGros').textContent = nb(n); Son.bip(false); }
        else { $('dGros').textContent = t('partez'); Son.bip(true); }
      }
      if (c.tDec <= 0) { c.phase = 'course'; setTimeout(() => { if (C === c && c.phase !== 'decompte') $('decompte').classList.add('cache'); }, 600); }
      return;
    }
    if (c.phase !== 'course' && c.phase !== 'arrivee' && c.phase !== 'demo') return;
    c.horloge += dt;
    for (const v of c.voitures) {
      const ap = v.robot || v.fini ? piloter(c, v) : appui;
      avancerVoiture(c, v, ap, dt);
    }
    const p = c.joueur;
    // alerte : trop vite pour le virage qui arrive
    if (!c.demo && p.mode === 'piste') {

      for (let d = 0; d < 26; d++) lim = Math.min(lim, T.vlim[(i + d) % T.M]);
      if (p.v > lim * 1.02) p.rouge = 1;
    }
    // fumée et étincelles
    for (const v of c.voitures) {
      v.fumee -= dt;
      if (v.fumee <= 0 && (v.v > 380 || v.mode === 'vol')) {
        v.fumee = 0.06;
        particule(c, { type: v.v > VTOP ? 'flamme' : 'etincelle', x: v.x - Math.cos(v.a) * 16, y: v.y - Math.sin(v.a) * 16, vx: -Math.cos(v.a) * 60 + (Math.random() - 0.5) * 50, vy: -Math.sin(v.a) * 60 + (Math.random() - 0.5) * 50, vie: 0.35, col: v.v > VTOP ? '#ff9f1c' : '#fff3bf', r: 4 });
      }
    }
    // enregistrement du fantôme
    if (!c.demo && !p.fini) {
      c.tEnreg -= dt;
      if (c.tEnreg <= 0) { c.tEnreg += 0.25; c.enreg.push(p.x, p.y); }
    }
    if (c.phase === 'arrivee') {
      c.tArrivee += dt;
      if (c.tArrivee > 0.8 && Math.random() < 0.6) particule(c, { type: 'confetti', x: p.x + (Math.random() - 0.5) * 300, y: p.y - 260, vx: (Math.random() - 0.5) * 60, vy: 120 + Math.random() * 80, vie: 2.4, col: ['#ff7a00', '#2f6fe0', '#2fb34a', '#ffc626', '#e63946', '#8e5cd9'][Math.floor(Math.random() * 6)], r: 6 });
      if (c.tArrivee > 2.1 && mode === 'course') afficherFin(c);
    }
    if (c.demo && c.voitures.every((v) => v.tours >= 2)) c.voitures.forEach((v) => { v.tours = 0; v.fini = false; });
  }

  function particule(c, p) {
    if (c.particules.length > 260) return;
    p.max = p.vie; p.rot = Math.random() * TAU;
    c.particules.push(p);
  }

  // ---------------------------------------------------------------------
  //  Dessin
  // ---------------------------------------------------------------------
  const canvas = $('scene'), ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function redim() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    if (nuitC) { nuitC.width = canvas.width; nuitC.height = canvas.height; }
  }
  let nuitC = null;

  // Motifs des sols (tuiles dessinées une fois)
  const motifs = {};
  function motif(piece) {
    if (motifs[piece]) return motifs[piece];
    const tc = document.createElement('canvas'); tc.width = tc.height = 240;
    const g = tc.getContext('2d');
    if (piece === 'chambre') {
      g.fillStyle = '#9fd0ee'; g.fillRect(0, 0, 240, 240);
      g.fillStyle = '#8fc4e6';
      for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) { g.beginPath(); g.arc(20 + i * 40 + (j % 2) * 20, 20 + j * 40, 5, 0, TAU); g.fill(); }
      g.fillStyle = 'rgba(255,255,255,.55)';
      for (const [x, y] of [[60, 50], [180, 150], [120, 210]]) { etoilePath(g, x, y, 9, 4, 5); g.fill(); }
    } else if (piece === 'cuisine') {
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { g.fillStyle = (i + j) % 2 ? '#e7d6c0' : '#fbf7ef'; g.fillRect(i * 80, j * 80, 80, 80); }
      g.strokeStyle = 'rgba(150,120,90,.35)'; g.lineWidth = 3;
      for (let i = 0; i <= 3; i++) { g.beginPath(); g.moveTo(i * 80, 0); g.lineTo(i * 80, 240); g.moveTo(0, i * 80); g.lineTo(240, i * 80); g.stroke(); }
    } else if (piece === 'salon') {
      const c = ['#c58a57', '#b97c4a', '#cf9663', '#bf8350'];
      for (let j = 0; j < 6; j++) for (let i = 0; i < 2; i++) { g.fillStyle = c[(i + j * 3) % 4]; g.fillRect(i * 120 + (j % 2) * 60 - 60, j * 40, 120, 40); g.fillRect(i * 120 + (j % 2) * 60 + 180, j * 40, 120, 40); }
      g.strokeStyle = 'rgba(80,45,20,.35)'; g.lineWidth = 2;
      for (let j = 0; j <= 6; j++) { g.beginPath(); g.moveTo(0, j * 40); g.lineTo(240, j * 40); g.stroke(); }
      for (let j = 0; j < 6; j++) for (let i = -1; i < 3; i++) { const x = i * 120 + (j % 2) * 60; g.beginPath(); g.moveTo(x, j * 40); g.lineTo(x, j * 40 + 40); g.stroke(); }
    } else {
      const c = ['#94693f', '#8a6038', '#9e7347'];
      for (let j = 0; j < 4; j++) { g.fillStyle = c[j % 3]; g.fillRect(0, j * 60, 240, 60); }
      g.strokeStyle = 'rgba(50,30,10,.4)'; g.lineWidth = 3;
      for (let j = 0; j <= 4; j++) { g.beginPath(); g.moveTo(0, j * 60); g.lineTo(240, j * 60); g.stroke(); }
      g.fillStyle = 'rgba(40,25,10,.5)';
      for (let j = 0; j < 4; j++) for (const x of [30, 150]) { g.beginPath(); g.arc(x + (j % 2) * 40, j * 60 + 12, 3, 0, TAU); g.fill(); g.beginPath(); g.arc(x + (j % 2) * 40, j * 60 + 48, 3, 0, TAU); g.fill(); }
      g.strokeStyle = 'rgba(60,35,15,.25)'; g.lineWidth = 1.5;
      for (let j = 0; j < 4; j++) { g.beginPath(); g.moveTo(10, j * 60 + 30); g.bezierCurveTo(80, j * 60 + 22, 160, j * 60 + 38, 230, j * 60 + 30); g.stroke(); }
    }

    return motifs[piece];
  }

  function etoilePath(g, x, y, R, r, n) {
    g.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / n, rr = i % 2 ? r : R;

  function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
  function disque(g, x, y, r, col) { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }

  // --- Objets du décor (vus de dessus) ---
  const TEINTES = ['#ff6b6b', '#4dabf7', '#ffd43b', '#69db7c', '#b197fc', '#ffa94d'];
  function dessinerObjet(g, o, h) {
    g.save(); g.translate(o.x, o.y); g.rotate(o.rot);
    const col = TEINTES[Math.floor(o.c * 6) % 6];
    g.fillStyle = 'rgba(0,0,0,.16)'; g.beginPath(); g.ellipse(8, 10, o.r * 0.95, o.r * 0.85, 0, 0, TAU); g.fill();
    switch (o.type) {
      case 'ours': {
        const b = o.c > 0.5 ? '#c08552' : '#e8b07a', cl = o.c > 0.5 ? '#e6b98c' : '#f8d9b4';
        disque(g, 0, 14, 26, b); disque(g, -24, 4, 11, b); disque(g, 24, 4, 11, b); disque(g, -14, 36, 11, b); disque(g, 14, 36, 11, b);
        disque(g, 0, -18, 20, b); disque(g, -15, -32, 8, b); disque(g, 15, -32, 8, b); disque(g, -15, -32, 4, cl); disque(g, 15, -32, 4, cl);
        disque(g, 0, -12, 9, cl); disque(g, 0, -15, 3.5, '#3b2414'); disque(g, -7, -22, 2.6, '#222'); disque(g, 7, -22, 2.6, '#222');
        disque(g, 0, 16, 12, cl);

        break;
      }
      case 'cube': {
        g.fillStyle = col; rrect(g, -22, -22, 44, 44, 6); g.fill();
        g.fillStyle = 'rgba(255,255,255,.85)'; rrect(g, -14, -14, 28, 28, 4); g.fill();
        g.fillStyle = col; if (o.c < 0.33) { etoilePath(g, 0, 0, 10, 4.5, 5); g.fill(); } else if (o.c < 0.66) { g.beginPath(); g.arc(0, 0, 8, 0, TAU); g.fill(); } else { g.beginPath(); g.moveTo(0, -9); g.lineTo(9, 8); g.lineTo(-9, 8); g.closePath(); g.fill(); }
        break;
      }
      case 'ballon': {

        g.save(); g.beginPath(); g.arc(0, 0, 28, 0, TAU); g.clip();
        g.fillStyle = col; g.fillRect(-30, -10, 60, 20); g.fillStyle = TEINTES[(Math.floor(o.c * 6) + 2) % 6]; g.fillRect(-10, -30, 20, 60);
        g.restore(); disque(g, -9, -10, 6, 'rgba(255,255,255,.7)');
        break;
      }
      case 'livre': {
        g.fillStyle = col; rrect(g, -32, -24, 64, 48, 4); g.fill();
        g.fillStyle = '#fffdf5'; g.fillRect(-28, -20, 54, 40);
        g.fillStyle = col; g.fillRect(-32, -24, 10, 48);
        g.fillStyle = 'rgba(0,0,0,.12)'; for (let k = 0; k < 3; k++) g.fillRect(-14, -12 + k * 10, 32, 3);
        break;
      }
      case 'chausson': {
        g.fillStyle = col; g.beginPath(); g.ellipse(0, 0, 30, 14, 0, 0, TAU); g.fill();
        disque(g, 18, 0, 10, '#fff'); disque(g, 18, -3, 3, '#222'); disque(g, 18, 3, 3, '#222');
        g.fillStyle = 'rgba(255,255,255,.4)'; g.beginPath(); g.ellipse(-8, 0, 14, 7, 0, 0, TAU); g.fill();
        break;
      }
      case 'toupie': {
        for (let k = 0; k < 8; k++) { g.fillStyle = TEINTES[k % 6]; g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, 22, (k * TAU) / 8, ((k + 1) * TAU) / 8); g.closePath(); g.fill(); }
        disque(g, 0, 0, 6, '#fff');
        break;
      }
      case 'coussin': case 'pouf': {
        const r = o.type === 'pouf' ? 46 : 44;
        g.fillStyle = col; rrect(g, -r, -r * 0.8, r * 2, r * 1.6, r * 0.5); g.fill();
        g.fillStyle = 'rgba(255,255,255,.3)'; rrect(g, -r * 0.7, -r * 0.55, r * 1.4, r * 1.1, r * 0.35); g.fill();
        disque(g, 0, 0, 5, 'rgba(0,0,0,.2)');
        break;
      }
      case 'bol': case 'tasse': {
        const r = o.type === 'bol' ? 30 : 20;
        disque(g, 0, 0, r, col); disque(g, 0, 0, r * 0.78, '#fff8ec'); disque(g, 0, 0, r * 0.62, o.type === 'bol' ? '#f4d79a' : '#8b5a2b');
        if (o.type === 'tasse') { g.strokeStyle = col; g.lineWidth = 6; g.beginPath(); g.arc(r + 6, 0, 8, -1.2, 1.2); g.stroke(); }
        break;
      }
      case 'pomme': { disque(g, 0, 0, 18, o.c > 0.5 ? '#e03131' : '#74b816'); disque(g, -6, -6, 5, 'rgba(255,255,255,.5)'); g.fillStyle = '#5c3a1e'; g.fillRect(-2, -22, 4, 8); g.fillStyle = '#40c057'; g.beginPath(); g.ellipse(7, -20, 7, 3.5, 0.4, 0, TAU); g.fill(); break; }
      case 'casserole': { disque(g, 0, 0, 34, '#adb5bd'); disque(g, 0, 0, 28, '#ced4da'); g.fillStyle = '#495057'; rrect(g, 30, -6, 44, 12, 6); g.fill(); break; }
      case 'cuillere': { g.fillStyle = '#ffd8a8'; g.beginPath(); g.ellipse(-18, 0, 14, 10, 0, 0, TAU); g.fill(); g.fillStyle = '#d9a066'; rrect(g, -6, -3, 48, 6, 3); g.fill(); break; }
      case 'torchon': { g.fillStyle = '#fff'; rrect(g, -38, -30, 76, 60, 6); g.fill(); g.fillStyle = 'rgba(230,57,70,.55)'; for (let k = -2; k <= 2; k++) { g.fillRect(-38, k * 12 - 3, 76, 5); g.fillRect(k * 14 - 3, -30, 5, 60); } break; }
      case 'chaise': { g.fillStyle = '#b07a4a'; rrect(g, -46, -46, 92, 92, 12); g.fill(); g.fillStyle = '#c98e5a'; rrect(g, -38, -38, 76, 76, 10); g.fill(); g.fillStyle = '#8a5a34'; rrect(g, -46, -56, 92, 14, 6); g.fill(); break; }

    } else if (m === 'buggy') {

      g.strokeStyle = '#343a40'; g.lineWidth = 2.2; rrect(g, -9, -7, 14, 14, 3); g.stroke(); g.beginPath(); g.moveTo(-9, 0); g.lineTo(5, 0); g.stroke();

      g.fillStyle = col; g.beginPath(); g.moveTo(20, 0); g.quadraticCurveTo(12, -9, -14, -8); g.lineTo(-14, 8); g.quadraticCurveTo(12, 9, 20, 0); g.fill();
      g.fillStyle = '#ffd43b'; g.beginPath(); g.moveTo(-10, -8); g.lineTo(-20, -13); g.lineTo(-16, -4); g.closePath(); g.fill(); g.beginPath(); g.moveTo(-10, 8); g.lineTo(-20, 13); g.lineTo(-16, 4); g.closePath(); g.fill();

      g.fillStyle = '#dee2e6'; g.fillRect(16, -8, 3, 16); g.fillRect(-19, -8, 3, 16);
      g.fillStyle = 'rgba(255,255,255,.85)'; rrect(g, -6, -6, 14, 12, 5); g.fill();
      g.fillStyle = col; rrect(g, -4, -4, 10, 8, 4); g.fill();

      g.fillStyle = '#ffffff'; g.fillRect(-17, -2, 36, 4);
      g.fillStyle = '#1c2a4a'; g.beginPath(); g.moveTo(8, -6); g.lineTo(2, -6); g.lineTo(0, 6); g.lineTo(8, 6); g.quadraticCurveTo(11, 0, 8, -6); g.fill();

  // main qui repose la voiture sur le rail
  function dessinerMain(g, x, y, f) {
    g.save(); g.translate(x, y - 40 - (1 - Math.sin(f * Math.PI)) * 30);
    g.fillStyle = 'rgba(0,0,0,.15)'; g.beginPath(); g.ellipse(14, 46, 30, 16, 0, 0, TAU); g.fill();
    g.fillStyle = '#ffd8b5'; g.strokeStyle = '#d9a37c'; g.lineWidth = 3;
    rrect(g, -18, -70, 36, 50, 14); g.fill(); g.stroke();
    for (let k = 0; k < 4; k++) { rrect(g, -20 + k * 11, -24, 10, 34, 5); g.fill(); g.stroke(); }
    rrect(g, 16, -40, 22, 10, 5); g.fill(); g.stroke();
    g.restore();
  }

  function dessinerParticules(g, c, dt) {
    const ps = c.particules;
    for (let k = ps.length - 1; k >= 0; k--) {
      const p = ps[k];
      if (dt) { p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 5; }
      if (p.vie <= 0) { ps.splice(k, 1); continue; }
      const f = p.vie / p.max;
      g.globalAlpha = Math.min(1, f * 1.5);
      if (p.type === 'etoile') { g.fillStyle = p.col; etoilePath(g, p.x, p.y, p.r * (0.6 + f), p.r * 0.45, 5); g.fill(); }
      else if (p.type === 'confetti') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.col; g.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); g.restore(); }

      else disque(g, p.x, p.y, p.r * f + 1, p.col);
    }
    g.globalAlpha = 1;
  }

  // échelle de la vue (le monde vu de dessus)
  const echelle = () => clamp(Math.min(W, H) / 350, 0.9, 1.7);
  // hauteur de la voiture à l'écran (démo du titre : au-dessus de la fenêtre)
  const ancre = (c) => (c.demo ? (H > W ? 0.24 : 0.5) : 0.55);

  function dessinerMonde(c, dt, h) {
    const T = c.T, piece = c.def.piece;
    const s = echelle() * c.cam.z;
    const sx = (Math.random() - 0.5) * c.secousse * 14, sy = (Math.random() - 0.5) * c.secousse * 14;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.save();
    const an = ancre(c);
    ctx.translate(W / 2 + sx, H * an + sy); ctx.scale(s, s); ctx.translate(-c.cam.x, -c.cam.y);
    const vx0 = c.cam.x - W / 2 / s - 50, vx1 = c.cam.x + W / 2 / s + 50, vy0 = c.cam.y - H * an / s - 50, vy1 = c.cam.y + H * (1 - an) / s + 50;
    ctx.fillStyle = motif(piece); ctx.fillRect(vx0, vy0, vx1 - vx0, vy1 - vy0);
    // grand tapis rond de la chambre et du salon
    if (piece === 'chambre' || piece === 'salon') {
      const B = T.boite, cx = (B.x0 + B.x1) / 2, cy = (B.y0 + B.y1) / 2;
      ctx.fillStyle = piece === 'chambre' ? '#ffd8a8' : '#d0bfff';
      ctx.beginPath(); ctx.ellipse(cx, cy, (B.x1 - B.x0) / 2 - 40, (B.y1 - B.y0) / 2 - 40, 0, 0, TAU); ctx.fill();
      ctx.strokeStyle = piece === 'chambre' ? '#ffa94d' : '#9775fa'; ctx.lineWidth = 18; ctx.setLineDash([30, 20]); ctx.stroke(); ctx.setLineDash([]);
    }
    for (const o of T.deco) if (o.x + o.r * 1.6 > vx0 && o.x - o.r * 1.6 < vx1 && o.y + o.r * 1.6 > vy0 && o.y - o.r * 1.6 < vy1 && o.type !== 'lampe') dessinerObjet(ctx, o, h);
    dessinerTables(ctx, T);
    dessinerRail(ctx, c, h);
    for (const f of T.boucles) dessinerBoucle(ctx, c, f, false);
    // fantôme du record
    if (c.fantome && c.fantome.length > 4 && (c.phase === 'course' || c.phase === 'arrivee')) {
      const k = c.horloge / 0.25, i = Math.floor(k), n = c.fantome.length / 2;
      if (i < n - 1) {
        const f = k - i, x0 = c.fantome[i * 2], y0 = c.fantome[i * 2 + 1], x1 = c.fantome[i * 2 + 2], y1 = c.fantome[i * 2 + 3];
        dessinerVoiture(ctx, { x: lerp(x0, x1, f), y: lerp(y0, y1, f), a: Math.atan2(y1 - y0, x1 - x0), z: 0, modele: c.joueur.modele, couleur: '#fff', v: 0, rouge: 0 }, { fantome: true });
      }
    }
    const ordre = c.voitures.slice().sort((a, b) => a.z - b.z || (a.joueur ? 1 : -1));
    for (const v of ordre) dessinerVoiture(ctx, v, { joueur: v.joueur && !c.demo });
    for (const f of T.boucles) {

      dessinerBoucle(ctx, c, f, true);

    for (const v of ordre) if (v.mode === 'boucle') dessinerVoiture(ctx, v, { joueur: v.joueur && !c.demo });
    for (const v of c.voitures) if (v.mode === 'retour') dessinerMain(ctx, v.x, v.y, clamp(v.t / 0.65, 0, 1));

    for (const o of T.deco) if (o.type === 'lampe') dessinerObjet(ctx, o, h);
    dessinerParticules(ctx, c, dt);

  function dessinerNuit(c, s) {
    const T = c.T;
    if (!nuitC) { nuitC = document.createElement('canvas'); nuitC.width = canvas.width; nuitC.height = canvas.height; }
    const n = nuitC.getContext('2d');
    n.setTransform(1, 0, 0, 1, 0, 0);
    n.globalCompositeOperation = 'source-over';
    n.clearRect(0, 0, nuitC.width, nuitC.height);

    n.setTransform(DPR, 0, 0, DPR, 0, 0);
    n.translate(W / 2, H * ancre(c)); n.scale(s, s); n.translate(-c.cam.x, -c.cam.y);
    const trou = (x, y, r, a) => { const gr = n.createRadialGradient(x, y, r * 0.15, x, y, r); gr.addColorStop(0, `rgba(0,0,0,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); n.fillStyle = gr; n.beginPath(); n.arc(x, y, r, 0, TAU); n.fill(); };
    for (const l of T.lampes) trou(l.x, l.y, 430, 1);
    for (const v of c.voitures) {
      trou(v.x, v.y, 70, 0.8);
      // phares
      n.save(); n.translate(v.x, v.y); n.rotate(v.a);
      const gr = n.createLinearGradient(10, 0, 240, 0); gr.addColorStop(0, 'rgba(0,0,0,.9)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
      n.fillStyle = gr; n.beginPath(); n.moveTo(12, -6); n.lineTo(240, -90); n.lineTo(240, 90); n.lineTo(12, 6); n.closePath(); n.fill();
      n.restore();
    }
    for (const [x, y] of T.plots) if (Math.abs(x - c.cam.x) < W / s && Math.abs(y - c.cam.y) < H / s) trou(x, y, 16, 0.9);
    for (const o of T.obst) { const p = poseSur(T, o.i * T.step, 0); trou(p.x, p.y, 160, 0.55); }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(nuitC, 0, 0);
    // petites lueurs des plots
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.save(); ctx.translate(W / 2, H * ancre(c)); ctx.scale(s, s); ctx.translate(-c.cam.x, -c.cam.y);
    ctx.fillStyle = '#ffe066';
    for (const [x, y] of T.plots) if (Math.abs(x - c.cam.x) < W / s && Math.abs(y - c.cam.y) < H / s) { ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  // Tableau de bord dessiné : jauge de vitesse, mini-carte, pédale
  function dessinerTableau(c) {
    const T = c.T, p = c.joueur;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // mini-carte
    const mm = clamp(Math.min(W, H) * 0.3, 96, 180), mx = W - mm - 10, my = 66;
    const B = T.boite, k = (mm - 16) / Math.max(B.x1 - B.x0, B.y1 - B.y0);
    ctx.fillStyle = 'rgba(255,255,255,.78)'; rrect(ctx, mx, my, mm, mm * 0.75, 14); ctx.fill();
    ctx.save(); ctx.translate(mx + mm / 2, my + mm * 0.375); ctx.scale(k, k); ctx.translate(-(B.x0 + B.x1) / 2, -(B.y0 + B.y1) / 2);
    ctx.strokeStyle = c.rail.bord; ctx.lineWidth = 7 / k * 0.6; ctx.lineJoin = 'round'; ctx.stroke(T.chRail);
    if (T.chRacc) { ctx.strokeStyle = 'rgba(47,158,68,.7)'; ctx.stroke(T.chRacc); }
    for (const v of c.voitures) if (!v.joueur) disque(ctx, v.x, v.y, 5 / k, v.couleur);
    disque(ctx, p.x, p.y, 8 / k, '#fff'); disque(ctx, p.x, p.y, 6 / k, p.couleur);
    ctx.restore();
