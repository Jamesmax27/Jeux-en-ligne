    }
    // vignette
    g = c.createRadialGradient(cx, h * 0.45, Math.min(w, h) * 0.3, cx, h * 0.45, Math.max(w, h) * 0.75);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
  }

  // ---------------------------------------------------------------------
  //  La page du manuscrit (jeu et tutoriels)
  // ---------------------------------------------------------------------

  function geometrie(N, w, h, marge) {
    const s = Math.floor(Math.min((w - 2 * marge) / N, (h - 2 * marge) / N, 66));
    return { s: s, ox: Math.round((w - s * N) / 2), oy: Math.round((h - s * N) / 2) };
  }

  function caseSpeciale(c, t, x, y, s, i, temps) {
    const m = s * 0.12;
    if (t === 'E' || t === 'G') {
      const grande = t === 'G';
      const g = c.createLinearGradient(x, y, x + s, y + s);
      if (grande) { g.addColorStop(0, '#1b3f9e'); g.addColorStop(1, '#3c6ad0'); } else { g.addColorStop(0, '#a8231b'); g.addColorStop(1, '#d4492f'); }
      c.fillStyle = g; rr(c, x + m, y + m, s - 2 * m, s - 2 * m, s * 0.12); c.fill();
      c.strokeStyle = '#f2c230'; c.lineWidth = Math.max(1.2, s * 0.05); rr(c, x + m, y + m, s - 2 * m, s - 2 * m, s * 0.12); c.stroke();
      c.fillStyle = '#f7d35c';
      const cx = x + s / 2, cy = y + s / 2, k = s * (grande ? 0.2 : 0.16);
      for (let p = 0; p < (grande ? 8 : 4); p++) {
        const a = p / (grande ? 8 : 4) * Math.PI * 2 + temps / 3000;
        ell(c, cx + Math.cos(a) * k, cy + Math.sin(a) * k, k * 0.55, k * 0.3, a); c.fill();
      }
      c.fillStyle = grande ? '#fff3c0' : '#fde6a8'; rond(c, cx, cy, k * 0.45); c.fill();
    } else if (t === 'O') {
      const cx = x + s / 2, cy = y + s / 2, k = s * 0.32;
      const g = c.createLinearGradient(cx - k, cy - k, cx + k, cy + k);
      g.addColorStop(0, '#f9df7b'); g.addColorStop(0.5, '#d9a21b'); g.addColorStop(1, '#fbe9a0');
      c.fillStyle = g;
      c.beginPath(); c.moveTo(cx, cy - k); c.lineTo(cx + k, cy); c.lineTo(cx, cy + k); c.lineTo(cx - k, cy); c.closePath(); c.fill();
      c.strokeStyle = '#8a6206'; c.lineWidth = Math.max(1, s * 0.03); c.stroke();
      c.fillStyle = 'rgba(255,255,240,' + (0.5 + 0.4 * Math.sin(temps / 300 + i)).toFixed(2) + ')';
      etincelle(c, cx + k * 0.45, cy - k * 0.45, k * 0.3);
    } else if (t === 'R') {
      const cx = x + s / 2, cy = y + s / 2, k = s * 0.3;
      c.fillStyle = 'rgba(200,220,255,' + (0.25 + 0.15 * Math.sin(temps / 500 + i)).toFixed(2) + ')'; rond(c, cx, cy, k * 1.3); c.fill();
      c.fillStyle = '#b9c2cf'; c.strokeStyle = '#4c5563'; c.lineWidth = Math.max(1, s * 0.03);
      rr(c, cx - k, cy - k * 0.35, k * 2, k * 1.1, k * 0.15); c.fill(); c.stroke();
      c.beginPath(); c.moveTo(cx - k, cy - k * 0.35); c.lineTo(cx, cy - k * 0.95); c.lineTo(cx + k, cy - k * 0.35); c.closePath(); c.fill(); c.stroke();
      c.strokeStyle = '#d9a21b'; c.lineWidth = Math.max(1.5, s * 0.05);
      c.beginPath(); c.moveTo(cx, cy - k * 0.15); c.lineTo(cx, cy + k * 0.6); c.moveTo(cx - k * 0.3, cy + k * 0.15); c.lineTo(cx + k * 0.3, cy + k * 0.15); c.stroke();
    } else if (t === '#') {
      const al = graineHasard(i * 131 + 7), cx = x + s / 2, cy = y + s / 2;
      c.fillStyle = '#0d0a10';
      c.beginPath();
      for (let p = 0; p <= 12; p++) { const a = p / 12 * Math.PI * 2, r = s * (0.3 + al() * 0.14); c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
      c.fill();
      for (let p = 0; p < 4; p++) { const a = al() * Math.PI * 2, r = s * (0.42 + al() * 0.06); rond(c, cx + Math.cos(a) * r, cy + Math.sin(a) * r, s * (0.03 + al() * 0.04)); c.fill(); }
      c.fillStyle = 'rgba(255,255,255,0.12)'; ell(c, cx - s * 0.1, cy - s * 0.1, s * 0.08, s * 0.05, -0.6); c.fill();
    }
  }

  // Une lettre écrite (ou posée) : petite tuile de parchemin, lettre à l'encre de son auteur.
  function tuileLettre(c, x, y, s, l, coul, opt) {
    const m = Math.max(1, s * 0.05);
    c.fillStyle = opt.fond || '#fbf1d6';
    rr(c, x + m, y + m, s - 2 * m, s - 2 * m, s * 0.14); c.fill();
    c.strokeStyle = opt.bord || 'rgba(120,85,40,0.55)'; c.lineWidth = opt.bordL || Math.max(1, s * 0.035);
    rr(c, x + m, y + m, s - 2 * m, s - 2 * m, s * 0.14); c.stroke();
    c.save();
    c.fillStyle = coul;
    c.font = '700 ' + Math.round(s * 0.6) + 'px ' + POLICE;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    const cx = x + s / 2;
    if (opt.miroir) { c.translate(cx, 0); c.scale(-1, 1); c.translate(-cx, 0); }
    c.fillText(l, cx, y + s * 0.52);
    c.restore();
    if (s >= 26) {
      c.fillStyle = 'rgba(90,60,25,0.8)';
      c.font = '700 ' + Math.round(s * 0.2) + 'px system-ui, sans-serif';
      c.textAlign = 'right'; c.textBaseline = 'alphabetic';
      c.fillText(nb(O.VAL[l] || 0), x + s - m * 2.2, y + s - m * 2.2);
    }
  }

  function bouclier(c, x, y, k) {
    c.fillStyle = '#c9d3e2'; c.strokeStyle = '#3e4756'; c.lineWidth = Math.max(1, k * 0.15);
    c.beginPath(); c.moveTo(x, y - k); c.lineTo(x + k * 0.85, y - k * 0.6); c.quadraticCurveTo(x + k * 0.8, y + k * 0.5, x, y + k); c.quadraticCurveTo(x - k * 0.8, y + k * 0.5, x - k * 0.85, y - k * 0.6); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle = '#d9a21b'; c.beginPath(); c.moveTo(x, y - k * 0.5); c.lineTo(x, y + k * 0.5); c.moveTo(x - k * 0.35, y - k * 0.1); c.lineTo(x + k * 0.35, y - k * 0.1); c.stroke();
  }

  // e : { N, g, mi, b, o, mots } ; opt : t, tent ([{ i, l }]), etatTent, cible, dir,
  // anims ({ case: heure }), der (cases du dernier mot), efface, flottes, particules.
  function dessinerPage(c, e, geo, opt) {
    const s = geo.s, N = e.N, t = opt.t || 0;
    const W = s * N;
    // ombre et parchemin
    c.fillStyle = 'rgba(0,0,0,0.45)'; rr(c, geo.ox + 5, geo.oy + 7, W, W, s * 0.3); c.fill();
    const g = c.createRadialGradient(geo.ox + W / 2, geo.oy + W / 2, W * 0.1, geo.ox + W / 2, geo.oy + W / 2, W * 0.75);
    g.addColorStop(0, '#f6e7c3'); g.addColorStop(0.75, '#e6cf9c'); g.addColorStop(1, '#c9a96a');
    c.fillStyle = g; rr(c, geo.ox, geo.oy, W, W, s * 0.3); c.fill();
    const al = graineHasard(N * 17 + 3);
    c.fillStyle = 'rgba(120,80,30,0.13)';
    for (let k = 0; k < N * 6; k++) { rond(c, geo.ox + al() * W, geo.oy + al() * W, al() * s * 0.08 + 0.5); c.fill(); }
    // lignes du miroir
    for (let r = 0; r < N; r++) {
      if (e.mi.charAt(r) !== '1') continue;
      const y = geo.oy + r * s;
      const gm = c.createLinearGradient(geo.ox, y, geo.ox + W, y + s);
      gm.addColorStop(0, 'rgba(150,180,215,0.45)'); gm.addColorStop(0.5, 'rgba(225,235,250,0.55)'); gm.addColorStop(1, 'rgba(150,180,215,0.45)');
      c.fillStyle = gm; c.fillRect(geo.ox, y, W, s);
      c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = Math.max(1, s * 0.04);
      for (let k = 0; k < N; k += 2) { c.beginPath(); c.moveTo(geo.ox + k * s + s * 0.2, y + s * 0.9); c.lineTo(geo.ox + k * s + s * 0.55, y + s * 0.1); c.stroke(); }
      c.strokeStyle = 'rgba(80,110,150,0.7)'; c.lineWidth = Math.max(1.5, s * 0.05);
      c.beginPath(); c.moveTo(geo.ox, y); c.lineTo(geo.ox + W, y); c.moveTo(geo.ox, y + s); c.lineTo(geo.ox + W, y + s); c.stroke();
    }
    // quadrillage léger
    c.strokeStyle = 'rgba(110,75,35,0.22)'; c.lineWidth = 1;
    c.beginPath();
    for (let k = 1; k < N; k++) { c.moveTo(geo.ox + k * s, geo.oy + 2); c.lineTo(geo.ox + k * s, geo.oy + W - 2); c.moveTo(geo.ox + 2, geo.oy + k * s); c.lineTo(geo.ox + W - 2, geo.oy + k * s); }
    c.stroke();
    c.strokeStyle = 'rgba(110,60,20,0.6)'; c.lineWidth = Math.max(2, s * 0.06); rr(c, geo.ox, geo.oy, W, W, s * 0.3); c.stroke();
    // cases spéciales libres
    const tent = opt.tent || [];
    const tentIdx = {};
    tent.forEach((x) => { tentIdx[x.i] = x.l; });
    const ctr = O.centre(e);
    let pageVide = true;
    for (let i = 0; i < N * N; i++) if (e.b[i]) { pageVide = false; break; }
    for (let i = 0; i < N * N; i++) {
      if (e.b[i] || tentIdx[i]) continue;
      const x = geo.ox + (i % N) * s, y = geo.oy + Math.floor(i / N) * s;
      const ty = e.g.charAt(i);
      if (ty !== '.') caseSpeciale(c, ty, x, y, s, i, t);
      else if (i === ctr && pageVide) { c.fillStyle = 'rgba(200,120,30,0.7)'; etincelle(c, x + s / 2, y + s / 2, s * 0.3); }
    }
    // mots protégés
    const proteges = {};
    (e.mots || []).forEach((m) => { if (m.k) m.c.forEach((i) => { proteges[i] = 1; }); });
    // lettres écrites
    const der = opt.der || null;
    for (let i = 0; i < N * N; i++) {
      const l = e.b[i];
      if (!l) continue;
      const r = Math.floor(i / N), x = geo.ox + (i % N) * s, y = geo.oy + r * s;
      const t0 = opt.anims ? opt.anims[i] : undefined;
      let k = 1;
      if (t0 !== undefined && t - t0 < 380) k = Math.max(0.05, (t - t0) / 380);
      c.save();
      if (k < 1) { c.translate(x + s / 2, y + s / 2); c.scale(k, k); c.translate(-x - s / 2, -y - s / 2); c.globalAlpha = k; }
      const lueur = der && der.t0 && der.cases && der.cases.indexOf(i) >= 0 && t - der.t0 < 1600;
      tuileLettre(c, x, y, s, l, encre(e.o[i]), {
        miroir: e.mi.charAt(r) === '1',
        fond: lueur ? '#fff6c8' : '#fbf1d6',
        bord: lueur ? 'rgba(230,170,40,' + (1 - (t - der.t0) / 1600).toFixed(2) + ')' : undefined,
        bordL: lueur ? Math.max(2, s * 0.08) : undefined
      });
      c.restore();
      if (proteges[i]) bouclier(c, x + s * 0.2, y + s * 0.22, s * 0.15);
    }
    // lettres en attente (pas encore écrites)
    const coulTent = opt.etatTent === 'ok' ? '#2fbf72' : opt.etatTent === 'err' ? '#e0402e' : '#e7a91c';
    tent.forEach((x) => {
      const r = Math.floor(x.i / N), px = geo.ox + (x.i % N) * s, py = geo.oy + r * s;
      c.save(); c.shadowColor = coulTent; c.shadowBlur = s * 0.3;
      tuileLettre(c, px, py - s * 0.04, s, x.l, encre(opt.moi >= 0 ? opt.moi : 0), { miroir: e.mi.charAt(r) === '1', fond: '#fffaf0', bord: coulTent, bordL: Math.max(2.5, s * 0.09) });
      c.restore();
    });
    // case visée (clavier ou toucher)
    if (opt.cible !== undefined && opt.cible >= 0) {
      const x = geo.ox + (opt.cible % N) * s, y = geo.oy + Math.floor(opt.cible / N) * s;
      c.save();
      c.setLineDash([s * 0.12, s * 0.08]);
      c.strokeStyle = 'rgba(160,30,20,' + (0.65 + 0.35 * Math.sin(t / 160)).toFixed(2) + ')'; c.lineWidth = Math.max(2, s * 0.07);
      rr(c, x + 2, y + 2, s - 4, s - 4, s * 0.12); c.stroke();
      c.restore();
      c.fillStyle = 'rgba(160,30,20,0.85)';
      c.beginPath();
      if (opt.dir === 1) { c.moveTo(x + s * 0.4, y + s * 0.86); c.lineTo(x + s * 0.6, y + s * 0.86); c.lineTo(x + s * 0.5, y + s * 1.02); }
      else { c.moveTo(x + s * 0.86, y + s * 0.4); c.lineTo(x + s * 0.86, y + s * 0.6); c.lineTo(x + s * 1.02, y + s * 0.5); }
      c.closePath(); c.fill();
    }
    // le moine efface un mot
    const ef = opt.efface;
    if (ef && t - ef.t0 < ef.duree) {
      const p = (t - ef.t0) / ef.duree;
      c.fillStyle = 'rgba(10,6,20,' + (0.35 * Math.sin(p * Math.PI)).toFixed(2) + ')';
      rr(c, geo.ox, geo.oy, W, W, s * 0.3); c.fill();
      ef.lettres.forEach((x) => {
        const r = Math.floor(x.i / N), px = geo.ox + (x.i % N) * s, py = geo.oy + r * s;
        const a = Math.max(0, 1 - Math.max(0, p - 0.35) / 0.4);
        if (a > 0) { c.save(); c.globalAlpha = a; tuileLettre(c, px, py, s, x.l, encre(x.o), { miroir: e.mi.charAt(r) === '1', fond: '#e8e2f0' }); c.restore(); }
        if (p > 0.3) {
          const q = (p - 0.3) / 0.7;
          c.fillStyle = 'rgba(200,200,215,' + (0.5 * (1 - q)).toFixed(2) + ')';
          rond(c, px + s / 2 + Math.sin(x.i + q * 6) * s * 0.2, py + s / 2 - q * s * 1.2, s * (0.2 + q * 0.3)); c.fill();
        }
      });
      const yMoine = geo.oy + (ef.r + 0.5) * s;
      const xMoine = geo.ox - s * 2 + (W + s * 4) * p;
      moineFigure(c, xMoine, yMoine - s * 0.6, Math.max(s * 3.2, 90), Math.sin(p * Math.PI) * 1.1, t);
    }
    // textes qui s'envolent (+12, ×2…)
    (opt.flottes || []).forEach((f) => {
      const p = (t - f.t0) / 1400;
      if (p < 0 || p > 1) return;
      c.save();
      c.globalAlpha = Math.min(1, (1 - p) * 2);
      c.font = '900 ' + Math.round(Math.max(18, s * 0.62)) + 'px ' + POLICE;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.lineWidth = 4; c.strokeStyle = '#1a1229'; c.strokeText(f.txt, f.x, f.y - p * s * 1.4);
      c.fillStyle = f.coul; c.fillText(f.txt, f.x, f.y - p * s * 1.4);
      c.restore();
    });
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (20 nuits) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // nuit solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let attenteTuto = false;
  let anims = {};
  let derAnim = null;
  let effacement = null;
  const flottes = [];
  const particules = [];
  let idees = 3;
  // Saisie : lettres posées mais pas encore écrites.
  let tentative = [];         // [{ i: case, l: lettre, k: position dans la réserve }]
  let ordre = [];             // ordre d'affichage de la réserve
  let sourceReserve = null;
  let choisie = -1;           // position choisie dans la réserve (toucher)
  let cible = -1, dir = 0;    // case visée et sens d'écriture
  let envoye = false;         // action envoyée, en attente de son retour
  let confirmeEchange = 0;
  let dernierCoup = '';       // dernier mot écrit par un autre copiste (ligne d'aperçu)

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'codex', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'titre' ? 'block' : 'none';
    if (nom === 'titre') { dessinerTitre(); majTitre(); relancerTitre(); }
    if (nom === 'jeu') relancerBoucle();
  }

  let rafTitre = 0;
  function relancerTitre() {
    if (rafTitre) return;
    const pas = () => {
      rafTitre = 0;
      if (ecran !== 'titre') return;
      dessinerTitre();
      rafTitre = requestAnimationFrame(pas);
    };
    rafTitre = requestAnimationFrame(pas);
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 4 places, en haut de l'écran, et les mêmes dans le salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s;
      const cv = document.createElement('canvas'); cv.className = 'tete'; cv.width = 84; cv.height = 84;
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 104; cv.height = 104;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom),
  // sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const monSiege = () => (partie ? partie.siege : -1);

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e && e.sc ? e.sc[s] : 0;
      d.style.setProperty('--c', vive(s));
      const ptsEl = d.querySelector('.pts');
      const texte = nb(pts);
      if (ptsEl.dataset.v !== texte) { ptsEl.dataset.v = texte; ptsEl.innerHTML = ICONE_GOUTTE; ptsEl.appendChild(document.createTextNode(texte)); }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      const cle = s + '|' + (info.moi ? 1 : 0) + '|' + prog.plume + '|' + prog.sceau + '|' + session;
      const cv = d.querySelector('canvas.tete');
      if (cv.dataset.cle !== cle) {
        cv.dataset.cle = cle;
        const c = cv.getContext('2d'); c.clearRect(0, 0, 84, 84);
        capuche(c, s, 42, 42, 40, info.moi ? prog.sceau : -1);
      }
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { copiste: tr('copiste.' + s), encre: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (e.fini) return tr('tour.aube');
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.copiste', { copiste: tr('copiste.' + s) });
  }

  function heureCourante(e) { return Math.min(e.H, Math.floor(e.j / e.sc.length) + 1); }

  function majInfos() {
    let info = '';
    const e = vue;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e && e.sc) info += ' · ' + tr('jeu.heure', { h: heureCourante(e), total: e.H });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majChevalet();
    majApercu();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', vive(s));
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // Frise des heures : une bougie par heure, cloche quand le moine passe, soleil de l'aube.
  function dessinerHeures(t) {
    const cv = $('heures'), w = cv.clientWidth, h = cv.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    const e = vue;
    if (!e || !e.sc) return;
    const H = e.H, faites = Math.floor(e.j / e.sc.length), pasX = Math.min(44, (w - 60) / (H + 1));
    const x0 = (w - pasX * (H + 1)) / 2 + pasX / 2;
    for (let k = 1; k <= H; k++) {
      const x = x0 + (k - 1) * pasX;
      const fait = k <= faites, courant = k === faites + 1 && !e.fini;
      const hb = fait ? 5 : 13;
      c.globalAlpha = fait ? 0.55 : courant ? 1 : 0.75;
      bougie(c, x, h - 3, 6, hb, courant, t);
      c.globalAlpha = 1;
      if (e.mo && k < H && k % e.mo === 0) clocheDessin(c, x + 9, h - 18, 4.5, k <= faites ? '#6d5a92' : (k === faites + 1 ? '#ff7a62' : '#e7c35a'));
    }
    const xs = x0 + H * pasX;
    c.fillStyle = e.fini ? '#ffd36b' : '#7a6a42';
    rond(c, xs, h - 10, 6); c.fill();
    c.strokeStyle = c.fillStyle; c.lineWidth = 1.5;
    for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; c.beginPath(); c.moveTo(xs + Math.cos(a) * 8, h - 10 + Math.sin(a) * 8); c.lineTo(xs + Math.cos(a) * 11, h - 10 + Math.sin(a) * 11); c.stroke(); }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    const now = performance.now();
    dessinerJeu(now, dt);
    dessinerHeures(now);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function etatTentative() {
    if (!tentative.length || !vue || !partie || partie.siege < 0) return '';
    const r = O.analyser(vue, partie.siege, actionTentative());
    return r.ok ? 'ok' : (r.err === 'inconnu' || r.err === 'ligne' || r.err === 'trou' || r.err === 'contact' || r.err === 'accroche' || r.err === 'centre') ? 'err' : '';
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue || !vue.b) { geo = null; return; }
    geo = geometrie(vue.N, w, h, 6);
    const tourMoi = partie && partie.monTour() && !envoye;
    dessinerPage(c, vue, geo, {
      t: t, tent: tentative, etatTent: etatTentative(), moi: monSiege(),
      cible: tourMoi ? cible : -1, dir: dir, anims: anims, der: derAnim, efface: effacement, flottes: flottes
    });
    for (let i = flottes.length - 1; i >= 0; i--) if (t - flottes[i].t0 > 1500) flottes.splice(i, 1);
    // gouttes d'encre
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function centreCase(i) {
    if (!vue || !geo) return [0, 0];
    return [geo.ox + (i % vue.N + 0.5) * geo.s, geo.oy + (Math.floor(i / vue.N) + 0.5) * geo.s];
  }

  function eclabousser(i, coul) {
    if (!geo) return;
    const p = centreCase(i);
    for (let k = 0; k < 9; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.6 + Math.random() * 0.4, k: geo.s * (0.08 + Math.random() * 0.08), coul: k % 3 ? coul : '#f7d35c', etoile: k % 3 === 0 });
    }
  }

  // ---------------------------------------------------------------------
  //  Réserve de lettres et saisie
  // ---------------------------------------------------------------------

  function maReserve() { return vue && vue.ch && partie && partie.siege >= 0 ? (vue.ch[partie.siege] || '') : ''; }

  function construireChevalet() {
    const boite = $('chevalet');
    boite.textContent = '';
    for (let p = 0; p < 7; p++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tuile vide'; b.dataset.p = String(p);
      b.addEventListener('pointerdown', debutGlisse);
      b.addEventListener('click', (ev) => { if (glisse && glisse.bouge) { ev.preventDefault(); return; } clicTuile(p); });
      boite.appendChild(b);
    }
  }

  function majChevalet() {
    const main = maReserve();
    if (main !== sourceReserve) {
      sourceReserve = main;
      ordre = [];
      for (let k = 0; k < main.length; k++) ordre.push(k);
      tentative = [];
      choisie = -1;
      envoye = false;
    }
    const utilises = {};
    tentative.forEach((x) => { utilises[x.k] = 1; });
    const boutons = $('chevalet').children;
    for (let p = 0; p < 7; p++) {
      const b = boutons[p];
      const k = ordre[p];
      const l = k !== undefined ? main.charAt(k) : '';
      const visible = !!l && !utilises[k];
      b.classList.toggle('vide', !visible);
      b.classList.toggle('choisie', visible && choisie === p);
      const cle = visible ? l : '';
      if (b.dataset.l !== cle) {
        b.dataset.l = cle;
        b.textContent = cle;
        if (cle) { const sm = document.createElement('small'); sm.textContent = nb(O.VAL[cle] || 0); b.appendChild(sm); }
      }
      b.setAttribute('aria-label', visible ? tr('tuile.aria', { lettre: l, n: O.VAL[l] || 0 }) : tr('tuile.vide'));
      b.disabled = !visible;
    }
    const tourMoi = !!(partie && partie.monTour() && !envoye && !attenteTuto && vue && !vue.fini);
    $('cmd-ecrire').disabled = !tourMoi || !tentative.length;
    $('cmd-reprendre').disabled = !tentative.length;
    $('cmd-melanger').disabled = main.length < 2;
    const peutEch = vue && partie && partie.siege >= 0 && vue.ch ? O.peutEchanger(vue, partie.siege) : false;
    $('cmd-echanger-texte').textContent = tr(peutEch ? 'cmd.echanger' : 'cmd.passer');
    $('cmd-echanger').disabled = !tourMoi;
    $('cmd-echanger').classList.toggle('confirme', confirmeEchange > Date.now());
    $('cmd-idee-texte').textContent = tr('cmd.idee', { n: idees });
    $('cmd-idee').disabled = !tourMoi || idees <= 0;
  }

  function actionTentative() { return { t: 'm', p: tentative.map((x) => [x.i, x.l]) }; }

  function majApercu() {
    const el = $('apercu');
    let texte = '', classe = '';
    if (vue && partie && partie.siege >= 0 && vue.ch && partie.phase === 'jeu' && !vue.fini) {
      if (tentative.length) {
        const r = O.analyser(vue, partie.siege, actionTentative());
        if (r.ok) {
          texte = tr('apercu.ok', { mot: r.mot, n: r.v });
          if (r.mult > 1) texte += ' · ' + tr('apercu.mult', { n: r.mult });
          if (r.prot) texte += ' · ' + tr('apercu.relique');
          if (r.plein) texte += ' · ' + tr('apercu.plein');
          classe = 'ok';
        } else {
          texte = tr('err.' + r.err, { mot: r.mot || '' }) + (r.miroir ? ' ' + tr('err.miroir') : '');
          classe = 'err';
        }
      } else if (dernierCoup) texte = dernierCoup;
      else if (partie.monTour() && !envoye) texte = tr('apercu.aide');
    }
    if (el.textContent !== texte) el.textContent = texte;
    el.className = classe;
  }

  function caseLibre(i) {
    return vue && i >= 0 && i < vue.N * vue.N && !vue.b[i] && vue.g.charAt(i) !== '#' && !tentative.some((x) => x.i === i);
  }

  // Case suivante dans le sens d'écriture (saute les lettres déjà écrites).
  function suivante(i) {
    if (!vue || i < 0) return -1;
    const N = vue.N;
    let r = Math.floor(i / N), c = i % N;
    for (let k = 0; k < N; k++) {
      if (dir === 0) c++; else r++;
      if (r >= N || c >= N) return i;
      const j = r * N + c;
      if (caseLibre(j)) return j;
      if (vue.g.charAt(j) === '#') return i;
    }
    return i;
  }

  function peutSaisir() { return !!(partie && partie.monTour() && !envoye && !enPause && !attenteTuto && vue && !vue.fini); }

  function placer(k, i) {
    if (!peutSaisir()) { refusTour(); return false; }
    if (!vue || i < 0) return false;
    if (vue.g.charAt(i) === '#' && !vue.b[i]) { toast(tr('err.tache')); sons.refus(); return false; }
    if (!caseLibre(i)) return false;
    const main = maReserve(), l = main.charAt(k);
    if (!l) return false;
    tentative = tentative.filter((x) => x.k !== k);
    tentative.push({ i: i, l: l, k: k });
    // sens d'écriture deviné à la 2e lettre
    if (tentative.length === 2) {
      const a = tentative[0].i, b = tentative[1].i, N = vue.N;
      if (Math.floor(a / N) === Math.floor(b / N)) dir = 0; else if (a % N === b % N) dir = 1;
    }
    choisie = -1;
    cible = suivante(i);
    sons.pose();
    majChevalet(); majApercu();
    return true;
  }

  function retirer(i) {
    const avant = tentative.length;
    tentative = tentative.filter((x) => x.i !== i);
    if (tentative.length !== avant) { sons.clic(); cible = i; majChevalet(); majApercu(); }
  }

  function reprendreTout() {
    if (!tentative.length) return;
    tentative = [];
    choisie = -1;
    sons.clic();
    majChevalet(); majApercu();
  }

  function refusTour() {
    if (Date.now() - refusTour.d > 1500 && partie && partie.phase === 'jeu') { refusTour.d = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }
  refusTour.d = 0;

  function clicTuile(p) {
    audio();
    const k = ordre[p];
    if (k === undefined) return;
    if (peutSaisir() && cible >= 0 && caseLibre(cible) && choisie < 0) { placer(k, cible); return; }
    choisie = choisie === p ? -1 : p;
    sons.clic();
    majChevalet();
  }

  function melangerReserve() {
    for (let i = ordre.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = ordre[i]; ordre[i] = ordre[j]; ordre[j] = x; }
    choisie = -1;
    sons.echange();
    majChevalet();
  }

  function ecrireMot() {
    audio();
    if (!peutSaisir()) { refusTour(); return; }
    if (!tentative.length) { toast(tr('apercu.aide')); return; }
    const a = actionTentative();
    const r = O.analyser(vue, partie.siege, a);
    if (!r.ok) { toast(tr('err.' + r.err, { mot: r.mot || '' }) + (r.miroir ? ' ' + tr('err.miroir') : ''), 2600); sons.refus(); secouerPage(); return; }
    if (partie.jouer(a)) { envoye = true; sons.plume(); majChevalet(); majApercu(); }
  }

  function echangerOuPasser() {
    audio();
    if (!peutSaisir()) { refusTour(); return; }
    if (confirmeEchange < Date.now()) {
      confirmeEchange = Date.now() + 3000;
      toast(tr(O.peutEchanger(vue, partie.siege) ? 'confirme.echanger' : 'confirme.passer'), 2600);
      sons.clic();
      majChevalet();
      setTimeout(majChevalet, 3100);
      return;
    }
    confirmeEchange = 0;
    tentative = [];
    const a = O.peutEchanger(vue, partie.siege) ? { t: 'e' } : { t: 'p' };
    if (partie.jouer(a)) { envoye = true; majChevalet(); majApercu(); }
  }

  // Idée : la meilleure suggestion, posée sur la page (3 par nuit).
  function donnerIdee() {
    audio();
    if (!peutSaisir() || idees <= 0) return;
    const l = O.coups(vue, partie.siege, 400);
    if (!l.length) { toast(tr('idee.aucune'), 2600); sons.non(); return; }
    l.sort((a, b) => b.v - a.v);
    const choix = l[Math.min(l.length - 1, Math.floor(Math.random() * Math.min(3, l.length)))];
    idees--;
    tentative = [];
    const main = maReserve(), pris = {};
    choix.p.forEach((x) => {
      for (let k = 0; k < main.length; k++) if (!pris[k] && main.charAt(k) === x[1]) { pris[k] = 1; tentative.push({ i: x[0], l: x[1], k: k }); break; }
    });
    sons.mot(false);
    majChevalet(); majApercu();
  }

  let secousse = 0;
  function secouerPage() {
    const z = $('zone');
    z.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 260 });
    secousse++;
  }

  // Glisser une lettre de la réserve vers la page.
  let glisse = null;
  function debutGlisse(ev) {
    const p = Number(ev.currentTarget.dataset.p);
    if (ordre[p] === undefined) return;
    glisse = { p: p, x: ev.clientX, y: ev.clientY, id: ev.pointerId, bouge: false };
  }
  window.addEventListener('pointermove', (ev) => {
    if (!glisse || ev.pointerId !== glisse.id) return;
    if (!glisse.bouge && Math.hypot(ev.clientX - glisse.x, ev.clientY - glisse.y) > 10) {
      glisse.bouge = true;
      const f = $('fantome');
      f.textContent = maReserve().charAt(ordre[glisse.p]);
      f.style.display = 'flex';
    }
    if (glisse.bouge) { const f = $('fantome'); f.style.left = ev.clientX + 'px'; f.style.top = ev.clientY + 'px'; }
  });
  window.addEventListener('pointerup', (ev) => {
    if (!glisse || ev.pointerId !== glisse.id) return;
    const g = glisse;
    $('fantome').style.display = 'none';
    if (g.bouge) {
      audio();
      const i = caseSous(ev.clientX, ev.clientY);
      if (i >= 0) placer(ordre[g.p], i);
      setTimeout(() => { glisse = null; }, 0);
    } else glisse = null;
  });
  window.addEventListener('pointercancel', () => { glisse = null; $('fantome').style.display = 'none'; });

  function caseSous(cx, cy) {
    if (!vue || !geo) return -1;
    const r = $('plateau').getBoundingClientRect();
    const x = cx - r.left - geo.ox, y = cy - r.top - geo.oy;
    if (x < 0 || y < 0 || x >= geo.s * vue.N || y >= geo.s * vue.N) return -1;
    return Math.floor(y / geo.s) * vue.N + Math.floor(x / geo.s);
  }

  const plateau = $('plateau');
  plateau.addEventListener('pointerup', (ev) => {
    if (glisse && glisse.bouge) return;
    audio();
    const i = caseSous(ev.clientX, ev.clientY);
    if (i < 0 || !vue) return;
    if (tentative.some((x) => x.i === i)) { retirer(i); return; }
    if (!peutSaisir()) { refusTour(); return; }
    if (vue.g.charAt(i) === '#' && !vue.b[i]) { toast(tr('err.tache')); sons.refus(); return; }
    if (vue.b[i]) { cible = suivante(i); sons.clic(); return; }
    if (choisie >= 0) { placer(ordre[choisie], i); return; }
    if (cible === i) dir = 1 - dir; else cible = i;
    sons.clic();
  });

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      case 'refus': if (envoye) { envoye = false; sons.refus(); toast(tr('multi.refus'), 2400); } break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? JSON.parse(JSON.stringify(etat)) : null;
    dernierCoup = '';
    anims = {};
    derAnim = null;
    effacement = null;
    flottes.length = 0;
    particules.length = 0;
    cible = -1;
    sourceReserve = null;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 104, 104);
        capuche(c, s, 52, 58, 42, info.moi ? prog.sceau : -1);
        if (info.chef) couronne(c, 52, 22, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { copiste: tr('copiste.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef ? nomChef : tr('copiste.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    dernierTic = -1;
    idees = 3;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else { enPartie = true; toast(tr('nuit.' + niveau), 2400); }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const t = performance.now();
    const avant = ev.avant, apres = ev.apres;
    vue = JSON.parse(JSON.stringify(apres));
    debutTour = Date.now();
    dernierTic = -1;
    const der = apres.der || {};
    const qui = tr('copiste.' + ev.siege);
    const nomQui = ev.moi ? tr('place.toi') : ((siegesActuels()[ev.siege] || {}).nom || qui);
    if (der.x === 'm') {
      der.c.forEach((i, k) => { anims[i] = t + k * 90; });
      derAnim = { t0: t, cases: der.w };
      sons.plume();
      sons.mot(der.v >= 15);
      const milieu = der.w[Math.floor(der.w.length / 2)];
      if (geo) {
        const p = centreCase(milieu);
        flottes.push({ x: p[0], y: p[1] - geo.s * 0.3, txt: tr('flotte.gain', { n: der.v }), coul: vive(ev.siege), t0: t + 200 });
        if (der.mult > 1) flottes.push({ x: p[0], y: p[1] - geo.s * 1.2, txt: tr('flotte.fois', { n: der.mult }), coul: '#ffd36b', t0: t + 450 });
        der.c.forEach((i) => eclabousser(i, encre(ev.siege)));
      }
      const carte = $('place-' + ev.siege);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      if (der.pl) toast(tr('mot.plein', { qui: nomQui }), 2400);
      dernierCoup = ev.moi ? '' : tr('mot.ecrit', { qui: nomQui, mot: der.m, n: der.v });
    } else if (der.x === 'e') {
      sons.echange();
      toast(tr('mot.echange', { qui: nomQui }), 1800);
    } else if (der.x === 'p') {
      toast(tr('mot.passe', { qui: nomQui }), 1800);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    // Passage du moine à la fin de l'heure
    const ef = apres.ef;
    if (ef) {
      sons.cloche();
      if (ef.c && ef.c.length) {
        sons.moine();
        const N = apres.N;
        // Lettres effacées : celles d'avant ce coup, et celles que ce coup vient d'écrire.
        const posees = {};
        if (der.x === 'm' && ev.action && Array.isArray(ev.action.p)) ev.action.p.forEach((y) => { posees[y[0]] = y[1]; });
        const lettres = ef.c.map((i) => (avant.b[i] ? { i: i, l: avant.b[i], o: avant.o[i] } : (posees[i] ? { i: i, l: posees[i], o: ev.siege } : null))).filter(Boolean);
        const r0 = ef.mc && ef.mc.length ? Math.floor(ef.mc[0] / N) : Math.floor(N / 2);
        effacement = { t0: t + 300, duree: 2200, lettres: lettres, r: r0 };
        const perdant = ef.p === monSiege() ? tr('place.toi') : ((siegesActuels()[ef.p] || {}).nom || tr('copiste.' + ef.p));
        setTimeout(() => {
          if (ef.p === monSiege()) toast(tr('moine.toi', { mot: ef.w, n: ef.v }), 3200);
          else toast(tr('moine.efface', { mot: ef.w, qui: perdant, n: ef.v }), 3200);
          const carte = $('place-' + ef.p);
          if (carte) { carte.classList.remove('perte'); void carte.offsetWidth; carte.classList.add('perte'); }
          if (geo && ef.mc && ef.mc.length) {
            const p = centreCase(ef.mc[Math.floor(ef.mc.length / 2)]);
            flottes.push({ x: p[0], y: p[1], txt: tr('flotte.perte', { n: ef.v }), coul: '#ff7a62', t0: performance.now() });
          }
        }, 900);
      } else setTimeout(() => toast(tr('moine.rien'), 2600), 600);
    }
    if (ev.moi) { envoye = false; sourceReserve = null; }
    else if (tentative.length) {
      tentative = tentative.filter((x) => !vue.b[x.i]);
    }
    if (partie.phase === 'jeu' && !vue.fini && R.aQui(vue) === partie.siege && !ev.moi) { sons.tour(); cible = -1; }
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    sourceReserve = null;
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1400);
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pts, total, gagne) {
    if (!gagne) return 0;
    const p = total ? pts / total : 0;
    return p >= 0.42 ? 3 : p >= 0.33 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordreCl = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordreCl.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; capuche(cv.getContext('2d'), s, 30, 30, 28, s === moi ? prog.sceau : -1);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('copiste.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.encreCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const total = e.sc.reduce((a, b) => a + b, 0);
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc) && pts > 0;
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.encre', { n: pts, total: total }) : '';
    $('fin-codex').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, total, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const plumesAvant = PLUMES.filter((p) => totalEtoiles() >= p.min).length;
      const sceauxAvant = SCEAUX.filter((m) => totalPages() >= m).length;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        let page = false;
        if (etoiles >= 2 && !prog.pages[i]) { prog.pages[i] = 1; page = true; }
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        const msgs = [];
        if (page) msgs.push(tr('fin.page'));
        if (PLUMES.filter((p) => totalEtoiles() >= p.min).length > plumesAvant) msgs.push(tr('fin.plume'));
        if (SCEAUX.filter((m) => totalPages() >= m).length > sceauxAvant) msgs.push(tr('fin.sceau'));
        if (!page && etoiles < 2 && !prog.pages[i]) msgs.push(tr('fin.pageManque'));
        $('fin-codex').textContent = msgs.join(' ');
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours terminé (toutes les nuits gagnées, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (en ligne repassé en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de feuilles d'or.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 110 + Math.random() * 150, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: ['#f7d35c', '#d9a21b', '#fff3c0', '#c4302a'][i % 4], k: 6 + Math.random() * 7 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul;
        c.beginPath(); c.moveTo(0, -b.k / 2); c.lineTo(b.k / 3, 0); c.lineTo(0, b.k / 2); c.lineTo(-b.k / 3, 0); c.closePath(); c.fill();
        c.restore();
      });
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    nouvelleVue(null);
    tentative = [];
    envoye = false;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  function apercuNuit(n) {
    const e = O.page(NIVEAUX[n - 1], (n - 1) * 7919 + 101);
    e.n = n - 1;
    for (let s = 0; s < PLACES; s++) { e.sc.push(0); e.ch.push(''); }
    return e;
  }

  // Parcours solo : nuit n contre 3 robots (force croissante, donnée par la nuit).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    idees = 3;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    nouvelleVue(apercuNuit(niveau));
    tentative = [];
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: 0.5, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  function dessinerPageCodex(c, w, h, ok, k) {
    c.clearRect(0, 0, w, h);
    if (ok) {
      const g = c.createLinearGradient(0, 0, w, h);
      g.addColorStop(0, '#f7e6bd'); g.addColorStop(1, '#d9bd84');
      c.fillStyle = g; rr(c, 2, 2, w - 4, h - 4, 6); c.fill();
      c.strokeStyle = '#8a5a22'; c.lineWidth = 2; rr(c, 2, 2, w - 4, h - 4, 6); c.stroke();
      c.fillStyle = ENCRE[k % 4]; rr(c, w * 0.14, h * 0.1, w * 0.3, w * 0.3, 3); c.fill();
      c.fillStyle = '#f2c230'; rond(c, w * 0.29, h * 0.1 + w * 0.15, w * 0.08); c.fill();
      c.strokeStyle = 'rgba(70,40,20,0.6)'; c.lineWidth = 1.5;
      for (let i = 0; i < 6; i++) {
        const y = h * (0.48 + i * 0.075), x0 = i < 1 ? w * 0.5 : w * 0.14;
        c.beginPath(); c.moveTo(x0, y); for (let x = x0; x < w * 0.86; x += 4) c.lineTo(x + 2, y + Math.sin(x + i * 3) * 1.2); c.stroke();
      }
      c.strokeStyle = ENCRE[k % 4]; c.lineWidth = 2;
      c.beginPath(); c.moveTo(w * 0.52, h * 0.14); c.quadraticCurveTo(w * 0.8, h * 0.08, w * 0.84, h * 0.3); c.stroke();
    } else {
      c.fillStyle = '#3a2f4a'; rr(c, 2, 2, w - 4, h - 4, 6); c.fill();
      c.strokeStyle = '#5b4b72'; c.lineWidth = 2; rr(c, 2, 2, w - 4, h - 4, 6); c.stroke();
      c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(w * 0.1, h * 0.5); c.lineTo(w * 0.9, h * 0.5); c.stroke();
      sceau(c, 0, w / 2, h / 2, w * 0.22);
    }
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const N = d.N;
    const base = () => {
      const g = []; for (let i = 0; i < N * N; i++) g.push('.');
      Object.keys(d.g || {}).forEach((k) => { const p = k.split(','); g[Number(p[0]) * N + Number(p[1])] = d.g[k]; });
      const mi = []; for (let r = 0; r < N; r++) mi.push((d.mi || []).indexOf(r) >= 0 ? '1' : '0');
      const e = { N: N, g: g.join(''), mi: mi.join(''), b: [], o: [], mots: [], sac: 'AAAAAAA', ch: [d.main], sc: [0, 0, 0, 0] };
      for (let i = 0; i < N * N; i++) { e.b.push(''); e.o.push(-1); }
      d.mots.forEach((m) => {
        const cases = [];
        for (let k = 0; k < m[3].length; k++) {
          const i = (m[0] + (m[2] ? k : 0)) * N + m[1] + (m[2] ? 0 : k);
          e.b[i] = m[3].charAt(k); e.o[i] = m[4]; cases.push(i);
        }
        e.mots.push({ c: cases, p: m[4], v: 6, k: 0, w: m[3], d: m[2] });
      });
      return { e: e, main: d.main.split(''), tent: [], flottes: [], efface: null, refus: null, der: null };
    };
    let s = base(), debut = 0, fait = 0, finCycle = 0;
    const g = geometrie(N, 560, 300, 8);
    const rackY = 330, rackX = (k) => 70 + k * 60, BTN = { x: 452, y: rackY - 4, w: 92, h: 58 }, BTN_E = { x: 6, y: rackY - 4, w: 54, h: 58 };
    const durees = d.etapes.map((x) => DUREES[x[0]]);
    const j = ++tutoAnim;
    const cellXY = (r, col) => [g.ox + (col + 0.5) * g.s, g.oy + (r + 0.5) * g.s];
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      let ecoule = t - debut, k = 0;
      while (k < durees.length && ecoule >= durees[k]) { ecoule -= durees[k]; k++; }
      if (k >= durees.length) {
        if (!finCycle) finCycle = t;
        if (t - finCycle > 1800) { s = base(); fait = 0; debut = t; finCycle = 0; ecoule = 0; k = 0; }
      }
      // appliquer les étapes terminées
      while (fait < k) { appliquer(d.etapes[fait], t); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 440);
      c.fillStyle = '#2a2040'; c.fillRect(0, 0, 560, 440);
      dessinerPage(c, s.e, g, { t: t, tent: s.tent, etatTent: '', moi: 0, der: s.der, efface: s.efface, flottes: s.flottes });
      // réserve et boutons
      s.main.forEach((l, i) => { if (l) tuileLettre(c, rackX(i), rackY, 52, l, '#2a180a', { fond: '#f4e3b8' }); });
      c.fillStyle = '#b8261c'; rr(c, BTN.x, BTN.y, BTN.w, BTN.h, 14); c.fill();
      c.strokeStyle = '#fff3d8'; c.lineWidth = 6; c.lineCap = 'round'; c.lineJoin = 'round';
      c.beginPath(); c.moveTo(BTN.x + 28, BTN.y + 30); c.lineTo(BTN.x + 42, BTN.y + 43); c.lineTo(BTN.x + 66, BTN.y + 16); c.stroke();
      if (cle === 'echange') {
        c.fillStyle = '#4a3a6a'; rr(c, BTN_E.x, BTN_E.y, BTN_E.w, BTN_E.h, 12); c.fill();
        c.strokeStyle = '#f2e6c9'; c.lineWidth = 4;
        c.beginPath(); c.arc(BTN_E.x + 27, BTN_E.y + 29, 13, 0.3, Math.PI * 1.6); c.stroke();
        c.fillStyle = '#f2e6c9'; c.beginPath(); c.moveTo(BTN_E.x + 36, BTN_E.y + 10); c.lineTo(BTN_E.x + 44, BTN_E.y + 20); c.lineTo(BTN_E.x + 32, BTN_E.y + 22); c.closePath(); c.fill();
      }
      if (d.cloches) {
        for (let h2 = 0; h2 < 5; h2++) { bougie(c, 120 + h2 * 80, 424, 8, 22, h2 === 1, t); clocheDessin(c, 134 + h2 * 80, 398, 6, '#e7c35a'); }
      }
      if (s.refus && t - s.refus.t0 < 900) {
        const p = cellXY(s.refus.r, s.refus.c);
        c.strokeStyle = '#ff3b2a'; c.lineWidth = 7; c.lineCap = 'round';
        c.beginPath(); c.moveTo(p[0] - 16, p[1] - 16); c.lineTo(p[0] + 16, p[1] + 16); c.moveTo(p[0] + 16, p[1] - 16); c.lineTo(p[0] - 16, p[1] + 16); c.stroke();
      }
      // la main
      const et = k < d.etapes.length ? d.etapes[k] : null;
      const q = et ? Math.min(1, ecoule / (durees[k] * 0.65)) : 0;
      if (et && et[0] === 'p') {
        const de = [rackX(et[1]) + 26, rackY + 26], vers = cellXY(et[2], et[3]);
        const x = de[0] + (vers[0] - de[0]) * q, y = de[1] + (vers[1] - de[1]) * q;
        if (s.main[et[1]]) tuileLettre(c, x - 24, y - 30, 48, s.main[et[1]], encre(0), { fond: '#fffaf0', bord: '#e7a91c', bordL: 3 });
        main(c, x, y, 1.5, q >= 1 ? 1 : 0);
      } else if (et && et[0] === 'x') {
        const vers = cellXY(et[1], et[2]);
        main(c, 500 + (vers[0] - 500) * q, 420 + (vers[1] - 420) * q, 1.5, q >= 1 ? 1 : 0);
      } else if (et && et[0] === 'ok') {
        const vx = BTN.x + BTN.w / 2, vy = BTN.y + BTN.h / 2;
        main(c, 300 + (vx - 300) * q, 420 + (vy - 420) * q, 1.5, q >= 1 ? 1 : 0);
      } else if (et && et[0] === 'e') {
        const vx = BTN_E.x + BTN_E.w / 2, vy = BTN_E.y + BTN_E.h / 2;
        main(c, 300 + (vx - 300) * q, 420 + (vy - 420) * q, 1.5, q >= 1 ? 1 : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    function appliquer(et, t) {
      if (et[0] === 'p') {
        const l = s.main[et[1]];
        s.tent.push({ i: et[2] * N + et[3], l: l });
        s.main[et[1]] = '';
      } else if (et[0] === 'x') {
        s.refus = { r: et[1], c: et[2], t0: t };
      } else if (et[0] === 'ok') {
        const a = { t: 'm', p: s.tent.map((x) => [x.i, x.l]) };
        const e2 = Object.assign({}, s.e, { ch: [s.tent.map((x) => x.l).join('') + 'AAAAAA'] });
        const r = O.analyser(e2, 0, a);
        s.tent.forEach((x) => { s.e.b[x.i] = x.l; s.e.o[x.i] = 0; });
        if (r.ok) {
          s.e.mots = s.e.mots.filter((m) => !(m.d === r.d && m.c.every((i) => r.cases.indexOf(i) >= 0)));
          s.e.mots.push({ c: r.cases, p: 0, v: r.v, k: r.prot ? 1 : 0, w: r.mot, d: r.d });
          s.der = { t0: t, cases: r.cases };
          const p = cellXY(Math.floor(r.cases[Math.floor(r.cases.length / 2)] / N), r.cases[Math.floor(r.cases.length / 2)] % N);
          s.flottes.push({ x: p[0], y: p[1] - 10, txt: tr('flotte.gain', { n: r.v }), coul: '#ffd36b', t0: t });
          if (r.mult > 1) s.flottes.push({ x: p[0], y: p[1] - 50, txt: tr('flotte.fois', { n: r.mult }), coul: '#7fe0ff', t0: t + 200 });
        }
        s.tent = [];
        sons.plume();
      } else if (et[0] === 'e') {
        s.main = (d.nouvelle || 'TOILES').split('');
        sons.echange();
      } else if (et[0] === 'm') {
        // le moine choisit le plus long mot non protégé d'un copiste
        let choix = -1;
        s.e.mots.forEach((m, k2) => { if (m.p >= 0 && m.p < 4 && !m.k && (choix < 0 || m.c.length > s.e.mots[choix].c.length)) choix = k2; });
        if (choix < 0) return;
        const m = s.e.mots[choix];
        s.e.mots.splice(choix, 1);
        const gardes = {};
        s.e.mots.forEach((x) => x.c.forEach((i) => { gardes[i] = 1; }));
        const lettres = m.c.filter((i) => !gardes[i]).map((i) => ({ i: i, l: s.e.b[i], o: s.e.o[i] }));
        lettres.forEach((x) => { s.e.b[x.i] = ''; s.e.o[x.i] = -1; });
        s.efface = { t0: t, duree: 2200, lettres: lettres, r: Math.floor(m.c[0] / N) };
        sons.cloche();
      }
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || (ev.code === 'KeyP' && ev.shiftKey)) {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    if (!vue || !vue.b) return;
    const N = vue.N;
    const dirs = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (cible < 0) { cible = O.centre(vue); return; }
      const r = Math.max(0, Math.min(N - 1, Math.floor(cible / N) + dirs[ev.code][0]));
      const c = Math.max(0, Math.min(N - 1, cible % N + dirs[ev.code][1]));
      cible = r * N + c;
      if (dirs[ev.code][0]) dir = 1; else dir = 0;
      sons.clic();
      return;
    }
    if (ev.code === 'Space') { ev.preventDefault(); dir = 1 - dir; sons.clic(); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.id !== 'cmd-ecrire') return;
      ev.preventDefault(); ecrireMot(); return;
    }
    if (ev.code === 'Backspace' || ev.code === 'Delete') {
      ev.preventDefault();
      if (tentative.length) { const x = tentative[tentative.length - 1]; retirer(x.i); cible = x.i; }
      return;
    }
    if (/^Key[A-Z]$/.test(ev.code) && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      ev.preventDefault(); audio();
      // La lettre tapée (la touche « P » sert aussi de pause : Maj + P).
      const l = (ev.key && /^[a-zA-Z]$/.test(ev.key) ? ev.key : ev.code.slice(3)).toUpperCase();
      const main = maReserve(), utilises = {};
      tentative.forEach((x) => { utilises[x.k] = 1; });
      let k = -1;
      for (let i = 0; i < main.length; i++) if (!utilises[i] && main.charAt(i) === l) { k = i; break; }
      if (k < 0) { sons.non(); toast(tr('clavier.absente', { lettre: l }), 1400); return; }
      if (cible < 0 || !caseLibre(cible)) { toast(tr('clavier.cible'), 1600); sons.non(); return; }
      placer(k, cible);
    }
  });

  $('codex-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('cmd-ecrire').addEventListener('click', ecrireMot);
  $('cmd-reprendre').addEventListener('click', () => { audio(); reprendreTout(); });
  $('cmd-melanger').addEventListener('click', () => { audio(); melangerReserve(); });
  $('cmd-echanger').addEventListener('click', echangerOuPasser);
  $('cmd-idee').addEventListener('click', donnerIdee);

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && vue.sc && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  construireChevalet();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
