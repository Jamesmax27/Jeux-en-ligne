<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();

      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {

      if (isole && !coin && hote) {

        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);

    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,

    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

  function surFermeture(f) {

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }

    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);

  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)

  // tout de suite. Renvoie true si la fenêtre s'affiche.

    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');

    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);

    h.ombre.appendChild(fond);
    isoler(h.hote);

      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);

        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };

    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();

      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });

    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

    for (i = 0; i < W * H; i++) { l += '.'; q.push(-9); }
    var m = [];
    for (i = 0; i < H; i++) m.push(nuit.m === 'tout' || (Array.isArray(nuit.m) && nuit.m.indexOf(i) >= 0) ? 1 : 0);
    return {
      W: W, H: H, c: c, l: l, q: q, m: m, r: [], sac: '', sc: [], tour: 0, coups: 0, total: 0, cl: 0, passes: 0, fini: 0,
      mots: [], o: { moine: nuit.moine || 0, tache: nuit.tache ? 1 : 0, belle: nuit.belle ? 1 : 0 }, n: 0, der: null, ev: null
    };
  }

  function poser(e, i, ch) { e.l = e.l.slice(0, i) + ch + e.l.slice(i + 1); }
  function changerType(e, i, ch) { e.c = e.c.slice(0, i) + ch + e.c.slice(i + 1); }

  // Cases d'une ligne dans le sens de lecture : rangée (de gauche à droite,
  // ou de droite à gauche sur une ligne du miroir) ou colonne (de haut en bas).
  function ligneRangee(e, r) {
    var t = [];
    for (var x = 0; x < e.W; x++) t.push(r * e.W + x);
    if (e.m[r]) t.reverse();
    return t;
  }
  function ligneColonne(e, x) {
    var t = [];
    for (var r = 0; r < e.H; r++) t.push(r * e.W + x);
    return t;
  }
  function lignes(e) {
    var l = [], i;
    for (i = 0; i < e.H; i++) l.push({ d: 'h', c: ligneRangee(e, i) });
    for (i = 0; i < e.W; i++) l.push({ d: 'v', c: ligneColonne(e, i) });
    return l;
  }

  // Mot maximal qui passe par la case i dans le sens d (h ou v), avec les
  // lettres provisoires « plus » ({ case: lettre }) : liste des cases, dans le sens de lecture.
  function lettreEn(e, plus, i) { var p = plus[i]; return p ? p : e.l.charAt(i); }
  function mot(e, plus, i, d) {
    var ligne = d === 'h' ? ligneRangee(e, Math.floor(i / e.W)) : ligneColonne(e, i % e.W);
    var k = ligne.indexOf(i), a = k, b = k;
    while (a > 0 && lettreEn(e, plus, ligne[a - 1]) !== '.') a--;
    while (b < ligne.length - 1 && lettreEn(e, plus, ligne[b + 1]) !== '.') b++;
    return ligne.slice(a, b + 1);
  }
  function texte(e, plus, cases) { var s = ''; for (var i = 0; i < cases.length; i++) s += lettreEn(e, plus, cases[i]); return s; }

  function voisins(e, i) {
    var r = Math.floor(i / e.W), x = i % e.W, v = [];
    if (r > 0) v.push(i - e.W);
    if (r < e.H - 1) v.push(i + e.W);
    if (x > 0) v.push(i - 1);
    if (x < e.W - 1) v.push(i + 1);
    return v;
  }

  function compte(texteLettres) {
    var n = {};
    for (var i = 0; i < texteLettres.length; i++) { var ch = texteLettres.charAt(i); n[ch] = (n[ch] || 0) + 1; }
    return n;
  }

  // ------------------------------------------------------------------
  //  Analyse d'un coup : { ok, raison, mots: [{ c, t, p }], total, bonus }.
  //  Raisons : vide, occupe, tache, lettre, ligne, trou, seul, accroche, mot.
  //  Partagée par valide, jouer, les robots et l'écran du jeu (aperçu).
  // ------------------------------------------------------------------
  function analyser(e, place, poses, avecReserve) {
    var res = { ok: false, raison: 'vide', mots: [], total: 0, bonus: [] };
    if (!Array.isArray(poses) || !poses.length || poses.length > RESERVE) return res;
    var plus = {}, cases = [], i, j;
    for (i = 0; i < poses.length; i++) {
      var p = poses[i];
      if (!Array.isArray(p) || p.length !== 2) { res.raison = 'lettre'; return res; }
      var k = p[0], ch = p[1];
      if (!Number.isInteger(k) || k < 0 || k >= e.W * e.H || typeof ch !== 'string' || ch.length !== 1 || ALPHA.indexOf(ch) < 0) { res.raison = 'lettre'; return res; }
      if (plus[k]) { res.raison = 'occupe'; return res; }
      if (e.c.charAt(k) === '#') { res.raison = 'tache'; return res; }
      if (e.l.charAt(k) !== '.') { res.raison = 'occupe'; return res; }
      plus[k] = ch;
      cases.push(k);
    }
    if (avecReserve !== false) {
      var dispo = compte(e.r[place] || ''), besoin = compte(poses.map(function (x) { return x[1]; }).join(''));
      for (var lt in besoin) if (besoin[lt] > (dispo[lt] || 0)) { res.raison = 'lettre'; return res; }
    }
    // Une seule ligne ou une seule colonne.
    var r0 = Math.floor(cases[0] / e.W), x0 = cases[0] % e.W, memeR = true, memeX = true;
    for (i = 1; i < cases.length; i++) {
      if (Math.floor(cases[i] / e.W) !== r0) memeR = false;
      if (cases[i] % e.W !== x0) memeX = false;
    }
    if (!memeR && !memeX) { res.raison = 'ligne'; return res; }
    var trouves = [];
    function garder(liste) {
      if (liste.length < 2) return;
      var cle = liste.join(',');
      for (var z = 0; z < trouves.length; z++) if (trouves[z].join(',') === cle) return;
      trouves.push(liste);
    }
    if (cases.length === 1) {
      garder(mot(e, plus, cases[0], 'h'));
      garder(mot(e, plus, cases[0], 'v'));
    } else {
      var d = memeR ? 'h' : 'v';
      var principal = mot(e, plus, cases[0], d);
      for (i = 0; i < cases.length; i++) if (principal.indexOf(cases[i]) < 0) { res.raison = 'trou'; return res; }
      garder(principal);
      for (i = 0; i < cases.length; i++) garder(mot(e, plus, cases[i], d === 'h' ? 'v' : 'h'));
    }
    if (!trouves.length) { res.raison = 'seul'; return res; }
    // Accroche : au moins une lettre déjà écrite dans un des mots formés.
    var accroche = false;
    for (i = 0; i < trouves.length && !accroche; i++) {
      for (j = 0; j < trouves[i].length; j++) if (!plus[trouves[i][j]]) { accroche = true; break; }
    }
    if (!accroche) { res.raison = 'accroche'; return res; }
    for (i = 0; i < trouves.length; i++) {
      var t = texte(e, plus, trouves[i]);
      if (!estMot(t)) { res.raison = 'mot'; res.faux = t; return res; }
    }
    // Encre de chaque mot.
    var total = 0;
    for (i = 0; i < trouves.length; i++) {
      var cs = trouves[i], v = 0, fois = 1;
      for (j = 0; j < cs.length; j++) {
        var ty = e.c.charAt(cs[j]), val = VAL[lettreEn(e, plus, cs[j])] || 0;
        if (plus[cs[j]]) {
          if (ty === 'o') val *= 2;
          if (ty === 'e') fois *= 2;
        }
        v += val;
      }
      v *= fois;
      if (e.o.belle && cs.length >= 5 && (i === 0 || cases.length === 1)) { v += 5; res.bonus.push('belle'); }
      res.mots.push({ c: cs, t: texte(e, plus, cs), p: v });
      total += v;
    }
    for (i = 0; i < cases.length; i++) {
      var tc = e.c.charAt(cases[i]);
      if (tc === 'p') { total += 5; res.bonus.push('page'); }
      if (tc === 'r') { total += 3; res.bonus.push('relique'); }
      if (tc === 'b') res.bonus.push('bougie');
    }
    if (poses.length === RESERVE) { total += 10; res.bonus.push('pleine'); }
    res.total = total;
    res.ok = true;
    return res;
  }

  // ------------------------------------------------------------------
  //  La cloche : le Moine sans Ombre efface, les taches s'étendent.
  // ------------------------------------------------------------------
  function sonnerCloche(e, alea) {
    e.cl += 1;
    var ev = { moine: [], tache: -1 };
    for (var fois = 0; fois < e.o.moine; fois++) {
      // Le mot le plus long d'un copiste, non protégé ; à égalité le plus riche, puis le plus ancien.
      var choix = -1;
      for (var w = 0; w < e.mots.length; w++) {
        var mw = e.mots[w];
        if (mw.q < 0 || mw.pr) continue;
        if (choix < 0) { choix = w; continue; }
        var mc = e.mots[choix];
        if (mw.c.length > mc.c.length || (mw.c.length === mc.c.length && mw.p > mc.p)) choix = w;
      }
      if (choix < 0) break;
      var efface = e.mots.splice(choix, 1)[0];
      var garde = {};
      e.mots.forEach(function (x) { x.c.forEach(function (k) { garde[k] = 1; }); });
      var parties = [], txt = '';
      efface.c.forEach(function (k) {
        txt += e.l.charAt(k);
        if (garde[k] || e.q[k] === -1) return;
        poser(e, k, '.');
        e.q[k] = -9;
        if (e.c.charAt(k) !== '#') changerType(e, k, '.');
        parties.push(k);
      });
      var perte = Math.min(e.sc[efface.q], Math.floor(efface.p / 2));
      e.sc[efface.q] -= perte;
      ev.moine.push({ q: efface.q, mot: txt, perte: perte, c: parties });
    }
    if (e.o.tache) {
      var possibles = [];
      for (var i = 0; i < e.W * e.H; i++) {
        if (e.c.charAt(i) !== '#') continue;
        var v = voisins(e, i);
        for (var z = 0; z < v.length; z++) {
          var n = v[z];
          if (e.c.charAt(n) !== '#' && e.l.charAt(n) === '.' && possibles.indexOf(n) < 0) possibles.push(n);
        }
      }
      if (possibles.length) {
        possibles.sort(function (a, b) { return a - b; });
        var cible = auHasard(possibles, alea);
        changerType(e, cible, '#');
        ev.tache = cible;
      }
    }
    e.ev = ev;
  }

  // Fin du tour d'une place (rejouer : chandelle).
  function finTour(e, place, rejoue, alea) {
    e.ev = null;
    if (!rejoue) {
      e.coups += 1;
      if (e.coups % e.sc.length === 0 && e.coups < e.total) sonnerCloche(e, alea);
      e.tour = (place + 1) % e.sc.length;
    }
  }

  // ------------------------------------------------------------------
  //  Robots : tous les mots du grimoire qui tiennent sur la page.
  // ------------------------------------------------------------------
  // Lettres de chaque mot du grimoire, comptées une fois pour toutes.
  var COMPTES = LISTE.map(function (w) { var n = compte(w); return Object.keys(n).map(function (k) { return [k, n[k]]; }); });

  function coupsPossibles(e, place, longueurMax) {
    var reserve = e.r[place] || '', dispo = compte(reserve), coups = [], vus = {};
    // Mots possibles : ceux dont les lettres manquantes (au plus 4) pourraient être sur la page.
    var candidats = [];
    for (var w0 = 0; w0 < LISTE.length; w0++) {
      if (LISTE[w0].length > longueurMax) continue;
      var pairs = COMPTES[w0], manque = 0, liste = null;
      for (var z = 0; z < pairs.length; z++) {
        var trop = pairs[z][1] - (dispo[pairs[z][0]] || 0);
        if (trop > 0) { manque += trop; (liste = liste || []).push([pairs[z][0], trop]); }
      }
      if (manque <= 4 && manque < LISTE[w0].length) candidats.push({ w: LISTE[w0], manque: manque, l: liste });
    }
    var L = lignes(e);
    for (var li = 0; li < L.length; li++) {
      var ligne = L[li].c, n = ligne.length;
      var surLigne = {}, nLettres = 0;
      for (var a = 0; a < n; a++) { var ch0 = e.l.charAt(ligne[a]); if (ch0 !== '.') { surLigne[ch0] = (surLigne[ch0] || 0) + 1; nLettres++; } }
      for (var w = 0; w < candidats.length; w++) {
        var cd = candidats[w], mt = cd.w, m = mt.length;
        if (m > n || cd.manque > nLettres) continue;
        var okL = true;
        if (cd.l) for (var z2 = 0; z2 < cd.l.length; z2++) if ((surLigne[cd.l[z2][0]] || 0) < cd.l[z2][1]) { okL = false; break; }
        if (!okL) continue;
        for (var s = 0; s + m <= n; s++) {
          if (s > 0 && e.l.charAt(ligne[s - 1]) !== '.') continue;
          if (s + m < n && e.l.charAt(ligne[s + m]) !== '.') continue;
          var poses = [], utilise = {}, sert = false, bon = true, touche = false;
          for (var k = 0; k < m; k++) {
            var cell = ligne[s + k], deja = e.l.charAt(cell), voulu = mt.charAt(k);
            if (deja !== '.') { if (deja !== voulu) { bon = false; break; } sert = true; continue; }
            if (e.c.charAt(cell) === '#') { bon = false; break; }
            utilise[voulu] = (utilise[voulu] || 0) + 1;
            if (utilise[voulu] > (dispo[voulu] || 0)) { bon = false; break; }
            poses.push([cell, voulu]);
          }
          if (!bon || !poses.length) continue;
          if (!sert) {
            for (var q2 = 0; q2 < poses.length && !touche; q2++) {
              var vs = voisins(e, poses[q2][0]);
              for (var q3 = 0; q3 < vs.length; q3++) if (e.l.charAt(vs[q3]) !== '.') { touche = true; break; }
            }
            if (!touche) continue;
          }
          var cle = poses.map(function (x) { return x[0] + x[1]; }).join('');
          if (vus[cle]) continue;
          vus[cle] = 1;
          var an = analyser(e, place, poses, false);
          if (an.ok) coups.push({ a: { t: 'pose', c: poses }, p: an.total, n: poses.length, lg: m });
        }
      }
    }
    return coups;
  }

  // Lettres que le robot rend au sac quand il ne trouve rien : rares et doubles.
  function lettresARendre(reserve, alea) {
    var garde = {}, rendre = '';
    for (var i = 0; i < reserve.length; i++) {
      var ch = reserve.charAt(i);
      if (VAL[ch] >= 6 || garde[ch] || alea() < 0.3) rendre += ch; else garde[ch] = 1;
    }
    if (!rendre) rendre = reserve;
    return rendre;
  }

  window.JEL_REGLES = {
    places: 4,
    delaiBot: 1300,
    delaiJoueur: 60000,
    pauseManche: 8000,
    attenteSalon: 90000,
    remplacement: 'tour',
    forceEnLigne: 0.55,
    nuits: NUITS,

    depart: function (alea, places, options) {
      var o = options || {}, idx;
      var solo = typeof o.niveau === 'number' && isFinite(o.niveau);
      if (solo) idx = Math.max(0, Math.min(NUITS.length - 1, Math.floor(o.niveau) - 1));
      else idx = 5 + Math.floor(alea() * (NUITS.length - 5)) % (NUITS.length - 5);
      var nuit = NUITS[idx], e = preparer(nuit);
      e.n = idx;
      e.total = nuit.T * places;
      if (solo) e.fr = forceNuit(idx + 1);
      // Le premier mot, écrit tout seul au milieu de la page.
      var possibles = DEBUTS.filter(function (w) { return w.length <= e.W - 2; });
      var premier = auHasard(possibles, alea), r = Math.floor(e.H / 2);
      var ligne = ligneRangee(e, r), debut = Math.floor((e.W - premier.length) / 2), cases = [];
      for (var k = 0; k < premier.length; k++) { var i = ligne[debut + k]; poser(e, i, premier.charAt(k)); e.q[i] = -1; changerType(e, i, '.'); cases.push(i); }
      e.mots.push({ c: cases, q: -1, p: 0, pr: 1 });
      // Sac mélangé, puis 7 lettres pour chaque copiste.
      var tout = '';
      for (var lt in SAC) for (var z = 0; z < SAC[lt]; z++) tout += lt;
      e.sac = melanger(tout, alea);
      for (var s = 0; s < places; s++) { e.r.push(''); e.sc.push(0); piocher(e, s); }
      // Solo : tu commences. En ligne : chaque nuit, le copiste suivant commence
      // (nuit 1 : la 2e place), et la nuit finit par le copiste qui l'a précédé.
      e.tour = solo ? 0 : (Math.floor(o.manche) || 0) % places;
      return e;
    },

    aQui: function (e) { return e.tour; },

    valide: function (e, place, a) {
      if (place !== e.tour || e.fini || e.coups >= e.total || !a || typeof a !== 'object') return false;
      if (a.t === 'passe') return true;
      if (a.t === 'change') {
        if (typeof a.l !== 'string' || !a.l.length || a.l.length > RESERVE || a.l.length > e.sac.length) return false;
        var dispo = compte(e.r[place]), rendu = compte(a.l);
        for (var lt in rendu) if (ALPHA.indexOf(lt) < 0 || rendu[lt] > (dispo[lt] || 0)) return false;
        return true;
      }
      if (a.t === 'pose') return analyser(e, place, a.c, true).ok;
      return false;
    },

    jouer: function (e, place, a, alea) {
      if (a.t === 'passe' || a.t === 'change') {
        if (a.t === 'change') {
          var reste = e.r[place];
          for (var i = 0; i < a.l.length; i++) { var p = reste.indexOf(a.l.charAt(i)); reste = reste.slice(0, p) + reste.slice(p + 1); }
          e.r[place] = reste;
          piocher(e, place);
          e.sac = melanger(e.sac + a.l, alea);
        }
        e.passes += 1;
        e.der = { q: place, t: a.t, c: [], mots: [], p: 0, b: [], n: a.t === 'change' ? a.l.length : 0 };
        finTour(e, place, false, alea);
        return e;
      }
      var an = analyser(e, place, a.c, true);
      var res = e.r[place], posees = [];
      a.c.forEach(function (x) {
        poser(e, x[0], x[1]);
        e.q[x[0]] = place;
        posees.push(x[0]);
        var k = res.indexOf(x[1]);
        res = res.slice(0, k) + res.slice(k + 1);
      });
      e.r[place] = res;
      var protege = an.bonus.indexOf('relique') >= 0;
      // Un mot qui en prolonge un autre le remplace dans la liste.
      an.mots.forEach(function (m) {
        e.mots = e.mots.filter(function (x) {
          if (x.q === -1) return true;
          for (var z = 0; z < x.c.length; z++) if (m.c.indexOf(x.c[z]) < 0) return true;
          return false;
        });
        var pr = 0;
        if (protege) for (var z2 = 0; z2 < m.c.length; z2++) if (e.c.charAt(m.c[z2]) === 'r' && posees.indexOf(m.c[z2]) >= 0) pr = 1;
        e.mots.push({ c: m.c, q: place, p: m.p, pr: pr });
      });
      e.sc[place] += an.total;
      e.passes = 0;
      e.der = { q: place, t: 'pose', c: posees, mots: an.mots.map(function (m) { return m.t; }), p: an.total, b: an.bonus, n: posees.length };
      piocher(e, place);
      if (!e.sac.length && !e.r[place].length) { e.fini = 1; e.sc[place] += 5; }
      var rejoue = an.bonus.indexOf('bougie') >= 0 && !e.fini;
      finTour(e, place, rejoue, alea);
      e.der.rejoue = rejoue ? 1 : 0;
      return e;
    },

    // Robot : cherche tous les coups, puis choisit selon sa force (le meilleur,
    // ou un coup moins bon tiré au hasard ; mots courts quand il est faible).
    bot: function (e, place, alea, force) {
      var fo = typeof e.fr === 'number' ? e.fr : (typeof force === 'number' ? force : 0.5);
      var lgMax = Math.min(9, 3 + Math.floor(fo * 5 + alea() * 1.5));
      var coups = coupsPossibles(e, place, lgMax);
      if (!coups.length) {
        if (e.sac.length >= 1) {
          var rendre = lettresARendre(e.r[place], alea);
          if (rendre.length > e.sac.length) rendre = rendre.slice(0, e.sac.length);
          if (rendre.length) return { t: 'change', l: rendre };
        }
        return { t: 'passe' };
      }
      // Un robot prudent se méfie du Moine : les longs mots sans relique valent un peu moins.
      coups.forEach(function (c) {
        c.v = c.p;
        if (e.o.moine && fo > 0.5 && c.lg >= 6) c.v -= c.p * 0.15 * fo;
        c.v += alea() * (1 - fo) * 6;
      });
      coups.sort(function (x, y) { return (y.v - x.v) || (y.p - x.p); });
      if (alea() < fo * 0.85) return coups[0].a;
      var idx = Math.floor(Math.pow(alea(), 0.7 + 2 * fo) * coups.length);
      return coups[Math.min(coups.length - 1, idx)].a;
    },

    fin: function (e) {
      if (!e.fini && e.coups < e.total && e.passes < e.sc.length * 2) return null;
      var cl = [];
      for (var s = 0; s < e.sc.length; s++) cl.push(s);
      cl.sort(function (x, y) { return (e.sc[y] - e.sc[x]) || (x - y); });
      return { classement: cl, scores: e.sc.slice() };
    },

    // Outils partagés avec l'écran du jeu (mêmes données, même grimoire).
    outils: {
      analyser: analyser, estMot: estMot, VAL: VAL, RESERVE: RESERVE, mot: mot, preparer: preparer,
      forceNuit: forceNuit, coupsPossibles: coupsPossibles, ligneRangee: ligneRangee, tailleGrimoire: function () { return LISTE.length; }
    }
  };
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #120d0a; color: #f1e6cf;
    font-family: system-ui, sans-serif; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #fond { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ecran { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; }
  .ecran.actif { display: flex; }
  button { font: inherit; color: inherit; cursor: pointer; min-height: 44px; min-width: 44px; border: none; border-radius: 12px; }
  button:focus-visible { outline: 3px solid #ffd77a; outline-offset: 2px; }
  button:disabled { cursor: default; opacity: .55; }
  .serif { font-family: Georgia, 'Times New Roman', serif; }

<script>
(function () {
  'use strict';

  // =====================================================================
  //  Le Scriptorium du Moine sans Ombre — jeu de mots croisés au tour par tour.
  //  Quatre copistes écrivent sur la même page ; chaque mot rapporte de
  //  l'encre. Solo : 20 nuits contre 3 robots. En ligne : de vrais joueurs
  //  remplacent les robots (moteur commun JEL_MULTI). Les règles, le
  //  grimoire et les nuits sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'le-scriptorium-du-moine-sans-ombre';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.nuits;                  // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const copie = (x) => JSON.parse(JSON.stringify(x));
  // Images du jeu (page du jeu) : window.JEL_APERCU = 1, 2 ou 3, posé seulement par le robot du site.
  const APERCU_N = [1, 2, 3].indexOf(Number(window.JEL_APERCU)) >= 0 ? Number(window.JEL_APERCU) : 0;
  let tFige = 0;               // image du jeu : instant figé des animations

  // Une couleur d'encre par place : 0 lapis, 1 carmin, 2 sinople, 3 safran.
  const COUL = ['#2b5fb0', '#b83a32', '#2f7d55', '#b7791f'];
  // Plumes : couleur de ton encre en solo, débloquées par les étoiles.
  const PLUMES = [
    { id: 'lapis', c: '#2b5fb0', min: 0 }, { id: 'pourpre', c: '#7b2d8e', min: 8 }, { id: 'indigo', c: '#3d3aa8', min: 18 },
    { id: 'azur', c: '#0f7ea8', min: 30 }, { id: 'prune', c: '#8a2c5a', min: 42 }, { id: 'argent', c: '#5a6584', min: 54 }
  ];
  // Sceaux : exploits gardés dans la sauvegarde.
  const SCEAUX = ['premier', 'long', 'riche', 'pleine', 'pages10', 'codex', 'aube', 'ligne'];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#2a1d13"/><circle cx="10.4" cy="8" r="1.6" fill="#2a1d13"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#2a1d13"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const ICONE_GOUTTE = '<svg viewBox="0 0 11 14" aria-hidden="true"><path d="M5.5 0C5.5 0 0 6.4 0 9.2A5.5 5.5 0 0 0 11 9.2C11 6.4 5.5 0 5.5 0z" fill="currentColor"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const N = NIVEAUX.length;
  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), pages: NIVEAUX.map(() => 0), sceaux: [],
    debloque: 1, reprise: 1, tutos: [], plume: 'lapis', options: { son: true }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 9999, 0));
      if (Array.isArray(d.pages)) prog.pages = NIVEAUX.map((_, i) => (d.pages[i] ? 1 : 0));
      if (Array.isArray(d.sceaux)) prog.sceaux = d.sceaux.filter((x) => SCEAUX.indexOf(x) >= 0);
      prog.reprise = entier(d.niveau, 1, N, 1);
      prog.debloque = Math.max(1, entier(d.debloque, 1, N, 1), prog.reprise);
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string' && TUTOS[x]);
      if (typeof d.plume === 'string' && PLUMES.some((p) => p.id === d.plume)) prog.plume = d.plume;
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((x, i) => { if (x > 0) prog.debloque = Math.max(prog.debloque, Math.min(N, i + 2)); });
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.pages = NIVEAUX.map(() => 0);
    prog.sceaux = [];
    prog.debloque = 1;
    prog.reprise = 1;
    prog.tutos = [];
    prog.plume = 'lapis';
  }

  function sauver(score) {
    if (APERCU_N) return; // image du jeu : rien n'est écrit dans la sauvegarde
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: prog.reprise, score: score || 0, etoiles: prog.etoiles.slice(), records: prog.records.slice(), pages: prog.pages.slice(),
        sceaux: prog.sceaux.slice(), debloque: prog.debloque, tutos: prog.tutos.slice(), plume: prog.plume, options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Le son se règle aussi depuis l'écran titre : jamais de nouvelle sauvegarde là.
  function sauverSon() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son } }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const totalPages = () => prog.pages.reduce((a, b) => a + b, 0);
  const plumeActuelle = () => PLUMES.find((p) => p.id === prog.plume) || PLUMES[0];

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.02, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = o.passe || 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  // Bruit filtré (plume qui gratte, souffle du Moine, page qui se froisse).
  function bruit(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; fl.type = o.type || 'bandpass'; fl.frequency.value = o.f || 3000; fl.Q.value = o.q || 1.2;
      g.gain.value = o.vol || 0.08;
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(660, 0.05, { type: 'triangle', vol: 0.06 }),
    plume: () => { bruit(0.09, { f: 4200, q: 2, vol: 0.07 }); note(240, 0.06, { type: 'triangle', vol: 0.04 }); },
    rappel: () => note(420, 0.08, { type: 'triangle', vol: 0.05, vers: 300 }),
    ecrit: () => [392, 494, 587].forEach((f, i) => note(f, 0.22, { type: 'triangle', vol: 0.08, retard: i * 0.06 })),
    autre: () => { bruit(0.12, { f: 3200, q: 1.5, vol: 0.05 }); note(330, 0.18, { type: 'triangle', vol: 0.06, retard: 0.05 }); },
    refus: () => { note(160, 0.18, { type: 'square', vol: 0.05, filtre: 700 }); note(120, 0.22, { type: 'square', vol: 0.04, filtre: 600, retard: 0.08 }); },
    cloche: () => { note(196, 1.6, { vol: 0.09 }); note(392.5, 1.2, { vol: 0.04 }); note(588, 0.9, { vol: 0.025 }); },
    moine: () => { bruit(1.1, { f: 500, q: 0.8, vol: 0.09, type: 'lowpass' }); note(110, 1.2, { type: 'sawtooth', vol: 0.03, filtre: 400, vers: 70 }); },
    tache: () => { note(140, 0.4, { vol: 0.1, vers: 60 }); bruit(0.25, { f: 300, vol: 0.05, type: 'lowpass' }); },
    relique: () => [988, 1175, 1480, 1760].forEach((f, i) => note(f, 0.25, { vol: 0.035, retard: i * 0.07 })),
    bougie: () => { bruit(0.3, { f: 1200, q: 0.7, vol: 0.05 }); note(523, 0.2, { type: 'triangle', vol: 0.05, retard: 0.1 }); note(784, 0.25, { type: 'triangle', vol: 0.05, retard: 0.2 }); },
    page: () => { bruit(0.35, { f: 2000, q: 0.6, vol: 0.06 }); note(220, 0.5, { type: 'sawtooth', vol: 0.03, filtre: 500, vers: 165, retard: 0.1 }); },
    victoire: () => [392, 523, 659, 784].forEach((f, i) => note(f, 0.3, { type: 'triangle', vol: 0.1, retard: i * 0.14 })),
    defaite: () => [330, 277, 220].forEach((f, i) => note(f, 0.35, { vol: 0.09, retard: i * 0.2 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(660, 0.12, { vol: 0.08 }); note(880, 0.16, { vol: 0.08, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.06 }); note(587, 0.16, { vol: 0.06, retard: 0.1 }); },
    tour: () => note(988, 0.1, { vol: 0.05 }),
    sceau: () => [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, 0.18, { type: 'triangle', vol: 0.06, retard: i * 0.08 }))
  };

  const ICONE_SON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  const ICONE_MUET = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.innerHTML = prog.options.son ? ICONE_SON : ICONE_MUET;
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverSon();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : outils, copistes, cases de la page
  // ---------------------------------------------------------------------

  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  // Hasard fixe pour le décor (même dessin à chaque fois).
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }
  function couleurPlace(s) { return session === 'solo' && s === 0 ? plumeActuelle().c : COUL[s] || '#5a4630'; }

  // Copiste encapuchonné (place s), centré en (x, y), rayon r.
  function capuche(c, s, x, y, r, coul) {
    const k = coul || couleurPlace(s);
    c.save();
    c.fillStyle = '#1d130c'; rond(c, x, y, r); c.fill();
    c.fillStyle = k; rond(c, x, y, r * 0.92); c.fill();
    // capuchon
    c.fillStyle = '#2b1c10';
    c.beginPath();
    c.moveTo(x - r * 0.62, y + r * 0.86);
    c.quadraticCurveTo(x - r * 0.7, y - r * 0.2, x, y - r * 0.72);
    c.quadraticCurveTo(x + r * 0.7, y - r * 0.2, x + r * 0.62, y + r * 0.86);
    c.closePath(); c.fill();
    // ombre du visage et deux yeux qui luisent
    c.fillStyle = '#0b0705';
    c.beginPath(); c.ellipse(x, y + r * 0.08, r * 0.34, r * 0.42, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#ffd77a';
    rond(c, x - r * 0.13, y + r * 0.02, r * 0.07); c.fill();
    rond(c, x + r * 0.13, y + r * 0.02, r * 0.07); c.fill();
    // liseré de la couleur du copiste
    c.strokeStyle = k; c.lineWidth = Math.max(1, r * 0.08);
    c.beginPath(); c.moveTo(x - r * 0.5, y + r * 0.7); c.quadraticCurveTo(x, y - r * 0.85, x + r * 0.5, y + r * 0.7); c.stroke();
    c.restore();
  }

  function couronne(c, x, y, w) {
    c.save();
    c.fillStyle = '#ffd23f'; c.strokeStyle = '#8a5a00'; c.lineWidth = 1.5;
    c.beginPath();
    c.moveTo(x - w / 2, y + w * 0.3); c.lineTo(x - w / 2, y - w * 0.15); c.lineTo(x - w / 4, y + w * 0.08);
    c.lineTo(x, y - w * 0.32); c.lineTo(x + w / 4, y + w * 0.08); c.lineTo(x + w / 2, y - w * 0.15); c.lineTo(x + w / 2, y + w * 0.3);
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // Tache d'encre (forme fixe pour chaque case).
  function tacheEncre(c, x, y, s, graine, k) {
    const h = graineHasard(graine * 7919 + 13);
    c.fillStyle = '#0d0907';
    const n = 7;
    rond(c, x, y, s * 0.36 * k); c.fill();
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + h() * 0.6, d = s * (0.2 + h() * 0.18) * k;
      rond(c, x + Math.cos(a) * d, y + Math.sin(a) * d, s * (0.1 + h() * 0.1) * k); c.fill();
    }
    c.fillStyle = '#ffffff22';
    rond(c, x - s * 0.1, y - s * 0.12, s * 0.07 * k); c.fill();
  }

  function flamme(c, x, y, s, t) {
    const v = 1 + Math.sin(t / 90) * 0.08 + Math.sin(t / 37) * 0.05;
    c.save();
    const g = c.createRadialGradient(x, y, 0, x, y, s * 0.9);
    g.addColorStop(0, '#ffcf6a66'); g.addColorStop(1, '#ffcf6a00');
    c.fillStyle = g; rond(c, x, y, s * 0.9); c.fill();
    c.fillStyle = '#ffb03a';

  // ---------------------------------------------------------------------

  // Case suivante dans le sens d'écriture (en sautant les lettres déjà posées).
  function caseSuivante(i, sens) {

      if (x < 0 || x >= W || r >= H) return i;
      const j = r * W + x;
      if (vue.c.charAt(j) === '#') return i;
      if (vue.l.charAt(j) === '.' && !poses.some((p) => p.i === j)) return j;
    }
    return i;
  }

  function sensDesPoses() {
    if (poses.length < 2 || !vue) return dir;
    return Math.floor(poses[0].i / vue.W) === Math.floor(poses[1].i / vue.W) ? 'h' : 'v';
  }

  function placer(k, i) {

    if (vue.l.charAt(i) !== '.' || poses.some((p) => p.i === i)) return false;
    if (!reserveLocale.charAt(k) || estUtilisee(k)) return false;
    poses.push({ i: i, k: k });

    anims.poses[i] = performance.now();

    curseur = caseSuivante(i, dir);

    return true;

  function retirer(i) {
    const j = poses.findIndex((p) => p.i === i);

    return true;
  }

  function rappeler() {

  function melanger() {

  let aRendre = [];
  function ouvrirChange() {

    rappeler();
    aRendre = [];
    const boite = $('change-reserve');
    boite.textContent = '';
    for (let k = 0; k < reserveLocale.length; k++) {
      const ch = reserveLocale.charAt(k);
