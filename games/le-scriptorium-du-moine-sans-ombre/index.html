        const j = aRendre.indexOf(k);
        if (j >= 0) aRendre.splice(j, 1); else aRendre.push(k);
        b.classList.toggle('choisie', j < 0);
        b.setAttribute('aria-pressed', j < 0 ? 'true' : 'false');
        majChange();
      });
      boite.appendChild(b);
    }
    majChange();
    ouvrirVoile('voile-change');
  }
  function majChange() {
    const sac = vue ? vue.sac.length : 0;
    const ok = $('btn-change-ok');
    ok.textContent = tr('change.rendre', { n: aRendre.length });
    ok.disabled = !aRendre.length || aRendre.length > sac;
    $('change-info').textContent = tr('change.sac', { n: sac });
  }
  function confirmerChange() {
    if (!peutJouer() || !aRendre.length) return;
    const l = aRendre.map((k) => reserveLocale.charAt(k)).join('');
    fermerVoile('voile-change');
    if (partie.jouer({ t: 'change', l: l })) { envoi = true; setTimeout(() => { envoi = false; }, 6000); sons.page(); }
  }
  function passer() {
    if (!peutJouer()) return;
    fermerVoile('voile-change');
    if (partie.jouer({ t: 'passe' })) { envoi = true; setTimeout(() => { envoi = false; }, 6000); sons.clic(); }
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', couleurPlace(s));
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    // Image du jeu : le moment est figé (animations à un instant choisi, rien ne bouge).
    if (APERCU_N) dessinerJeu(tFige, 0);
    else dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    majInfos();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('page'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (APERCU_N === 3) decorApercu(c, w, h, t);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, 8);
    const s = moi();
    dessinerPage(c, vue, geo, {
      t: t, plus: plusDesPoses(), anims: anims, curseur: peutJouer() && (clavier || curseurVise) ? curseur : -1, dir: dir,
      coulMoi: s >= 0 ? couleurPlace(s) : '#2a1606'
    });
    // particules : gouttes d'encre et étincelles
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 300) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.goutte) { c.beginPath(); c.moveTo(p.x, p.y - p.k); c.quadraticCurveTo(p.x + p.k * 0.8, p.y + p.k * 0.2, p.x, p.y + p.k * 0.6); c.quadraticCurveTo(p.x - p.k * 0.8, p.y + p.k * 0.2, p.x, p.y - p.k); c.fill(); }
      else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function jaillir(cases, coul, n) {
    if (!vue || !geo) return;
    cases.forEach((i) => {
      const x = geo.ox + (i % vue.W + 0.5) * geo.s, y = geo.oy + (Math.floor(i / vue.W) + 0.5) * geo.s;
      for (let k = 0; k < (n || 6); k++) {
        const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 90 + Math.random() * 170;
        particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vie: 0.6 + Math.random() * 0.4, k: geo.s * (0.1 + Math.random() * 0.08), coul: k % 3 ? coul : '#ffd77a', goutte: k % 3 !== 0 });
      }
    });
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(etat) {
    vue = etat ? copie(etat) : null;
    anims = {};
    particules.length = 0;
    poses = []; choix = -1; envoi = false;
    reserveLocale = '';
    curseur = vue ? Math.floor(vue.H / 2) * vue.W + Math.floor(vue.W / 2) : -1;
    curseurVise = false;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la nuit,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la nuit ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin'); fermerVoile('voile-change');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role, s), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 96, 96);
        capuche(c, s, 48, 52, 40, COUL[s]);
        if (info.chef) couronne(c, 48, 14, 30);
        remplirNom(d.querySelector('.nom'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { nom: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomTour(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    fermerVoile('voile-change');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    statsNuit = { page: false };
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.cloche(); }
    else {
      enPartie = true;
      const nuit = NIVEAUX[niveau - 1];
      toast(tr('objectif', { a: nuit.s2, b: nuit.s3 }), 3600);
    }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const t = performance.now();
    const avant = ev.avant, apres = ev.apres, d = apres.der || {};
    vue = copie(apres);
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.moi) { poses = []; choix = -1; envoi = false; }
    anims.cases = {};
    const coul = couleurPlace(ev.siege);
    if (d.t === 'pose') {
      d.c.forEach((i, k) => { anims.cases[i] = t + k * 90; });
      const tous = [];
      // cases des mots formés : les lettres de ce coup et celles qu'elles croisent
      d.c.forEach((i) => { tous.push(i); });
      anims.brille = { c: tous, t: t + d.c.length * 90, coul: coul };
      setTimeout(() => jaillir(d.c, coul, 5), d.c.length * 90 + 150);
      if (ev.moi) sons.ecrit(); else sons.autre();
      const b = d.b || [];
      if (b.indexOf('relique') >= 0) setTimeout(sons.relique, 300);
      if (b.indexOf('bougie') >= 0) setTimeout(sons.bougie, 300);
      if (b.indexOf('page') >= 0) setTimeout(sons.page, 250);
      const carte = $('place-' + ev.siege);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      const qui = nomTour(ev.siege);
      msgCoup = { texte: tr(ev.moi ? 'coup.toi' : 'coup.ecrit', { qui: qui, mots: d.mots.join(' · '), n: d.p }), jusqua: Date.now() + Math.max(1200, R.delaiBot - 100) };
      if (ev.moi) noterCoupJoueur(d);
      if (d.rejoue) toast(tr(ev.moi ? 'bougie.toi' : 'bougie.autre', { qui: qui }), 2200);
    } else {
      sons.clic();
      toast(tr(d.t === 'change' ? 'coup.change' : 'coup.passe', { qui: ev.moi ? tr('place.toi') : nomTour(ev.siege), n: d.n || 0 }), 1800);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    // La cloche : le Moine efface, les taches s'étendent.
    if (apres.ev) {
      const cl = apres.ev;
      setTimeout(() => {
        if (!vue) return;
        sons.cloche();
        const t2 = performance.now();
        if (cl.moine && cl.moine.length) {
          // Lettre effacée : sur la page d'avant, ou posée à ce coup même.
          const lettreAvant = (i) => {
            if (avant.l.charAt(i) !== '.') return avant.l.charAt(i);
            const p = ev.action && Array.isArray(ev.action.c) ? ev.action.c.find((x) => x[0] === i) : null;
            return p ? p[1] : '';
          };
          const efface = [];
          cl.moine.forEach((m) => m.c.forEach((i) => { const ch = lettreAvant(i); if (ch) efface.push({ i: i, ch: ch, q: m.q }); }));
          anims.efface = { c: efface, t: t2 + 300 };
          anims.moine = { c: cl.moine.reduce((a, m) => a.concat(m.c), []), t: t2 };
          setTimeout(sons.moine, 200);
          const textes = cl.moine.map((m) => tr('moine.efface', { qui: m.q === moi() ? tr('place.toi') : nomTour(m.q), mot: m.mot, n: m.perte }));
          toast(textes.join(' '), 3600);
          cl.moine.forEach((m) => { const pc = $('place-' + m.q); if (pc) { pc.classList.remove('perd'); void pc.offsetWidth; pc.classList.add('perd'); } });
        } else if (vue.o.moine) toast(tr('cloche.calme'), 1600);
        if (cl.tache >= 0) { anims.tache = { i: cl.tache, t: t2 + 500 }; setTimeout(sons.tache, 500); }
      }, 700);
    }
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !ev.moi) setTimeout(sons.tour, 500);
    if (curseur >= 0 && !caseLibre(curseur)) curseur = caseSuivante(curseur, dir);
  }

  // Ce que le joueur vient d'écrire : page maudite (solo) et sceaux.
  function noterCoupJoueur(d) {
    const b = d.b || [];
    if (b.indexOf('page') >= 0 && session === 'solo' && statsNuit && !statsNuit.page) {
      statsNuit.page = true;
      if (!prog.pages[niveau - 1]) { prog.pages[niveau - 1] = 1; toast(tr('page.trouvee', { n: totalPages(), max: N }), 3000); verifierPages(); }
    }
    gagnerSceau('premier');
    if (d.mots.some((m) => m.length >= 6)) gagnerSceau('long');
    if (d.p >= 20) gagnerSceau('riche');
    if (b.indexOf('pleine') >= 0) gagnerSceau('pleine');
  }
  function verifierPages() {
    if (totalPages() >= 10) gagnerSceau('pages10');
    if (totalPages() >= N) gagnerSceau('codex');
  }
  function gagnerSceau(id) {
    if (prog.sceaux.indexOf(id) >= 0) return;
    prog.sceaux.push(id);
    setTimeout(() => { toast(tr('sceau.gagne', { nom: tr('sceau.' + id) }), 3000); sons.sceau(); }, 900);
    if (window.JEL_SAVE.existe(JEU) || session === 'solo') sauver(0);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    fermerVoile('voile-change');
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  function gagnant(e, s) { return s >= 0 && e.sc[s] === Math.max.apply(null, e.sc); }

  // Fin d'une nuit en ligne : classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const s = partie.siege;
    const gagne = gagnant(e, s);
    if (s >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    if (gagne) gagnerSceau('ligne');
    remplirClassement(e, s, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pts, gagne, nuit) {
    if (!gagne) return 0;
    return pts >= nuit.s3 ? 3 : pts >= nuit.s2 ? 2 : 1;
  }

  function remplirClassement(e, s0, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3].sort((x, y) => e.sc[y] - e.sc[x]);
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === s0 ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; capuche(cv.getContext('2d'), s, 30, 30, 28);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === s0 ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(Object.assign({}, info, { moi: s === s0 }), role, s);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.encreCourt', { n: e.sc[s] });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const s = partie.siege, sieges = siegesActuels();
    const pts = s >= 0 ? e.sc[s] : 0;
    const gagne = gagnant(e, s);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, s, sieges, $('fin-classement'));
    $('fin-points').textContent = s >= 0 ? tr('fin.encre', { n: pts }) : '';
    $('fin-cadeau').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1, nuit = NIVEAUX[i];
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, gagne, nuit);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const cadeaux = [];
      if (gagne) {
        const avantEt = totalEtoiles();
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < N && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        // La première page du Codex est offerte à la fin de la première nuit gagnée.
        if (niveau === 1 && !prog.pages[0]) { prog.pages[0] = 1; cadeaux.push(tr('page.offerte')); verifierPages(); }
        if (niveau === N) gagnerSceau('aube');
        PLUMES.forEach((p) => { if (p.min > avantEt && p.min <= totalEtoiles()) cadeaux.push(tr('plume.gagnee', { nom: tr('plume.' + p.id) })); });
        prog.reprise = Math.min(niveau + 1, N);
        sauver(pts);
        // Les 20 nuits gagnées (maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: N * 3 });
        }
      } else {
        prog.reprise = niveau;
        sauver(pts);
      }
      if (statsNuit && statsNuit.page && niveau > 1) cadeaux.unshift(tr('page.nuit'));

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);

  // Confettis de victoire (feuilles d'or et gouttes d'encre).
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? '#e8b84a' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function apercu(n) {
    const nuit = NIVEAUX[n - 1], e = O.preparer(nuit);
    e.n = n - 1;
    for (let s = 0; s < PLACES; s++) { e.sc.push(0); e.r.push(''); }

  // Parcours solo : nuit n contre 3 copistes robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(N, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    prog.reprise = niveau;
    ['voile-fin', 'voile-pause', 'voile-change'].forEach(fermerVoile);
    nouvelleVue(apercu(niveau));
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNuit(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  function dessinerFeuillet(c, trouve) {
    c.clearRect(0, 0, 68, 88);
    c.fillStyle = trouve ? '#efe0bb' : '#3a2c20';
    c.save(); c.translate(34, 44); c.rotate(-0.06); rr(c, -26, -38, 52, 76, 4); c.fill();
    if (trouve) {
      c.strokeStyle = '#3a2410aa'; c.lineWidth = 1.5;
      for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(-18, -24 + k * 9); for (let x = -18; x < 18; x += 4) c.lineTo(x, -24 + k * 9 + Math.sin(x + k) * 1.2); c.stroke(); }
      c.fillStyle = '#2b0d12'; rond(c, 10, 24, 9); c.fill();
      c.fillStyle = '#c0392b'; c.beginPath(); c.ellipse(10, 24, 5, 3, 0, 0, Math.PI * 2); c.fill();
    } else {
      c.strokeStyle = '#5e4a33'; c.lineWidth = 2; c.setLineDash([4, 4]); rr(c, -22, -34, 44, 68, 3); c.stroke();
    }
    c.restore();
  }

  function dessinerPlume(c, k, ouvert) {
    c.clearRect(0, 0, 80, 80);
    c.save(); c.translate(40, 40); c.rotate(-0.6);
    c.fillStyle = ouvert ? k : '#4a3a2a';
    c.beginPath(); c.moveTo(0, -32); c.quadraticCurveTo(16, -8, 3, 26); c.lineTo(-3, 26); c.quadraticCurveTo(-16, -8, 0, -32); c.fill();
    c.strokeStyle = ouvert ? '#fff6' : '#0004'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -28); c.lineTo(0, 32); c.stroke();
    c.restore();
  }

  // Sceau de cire avec un symbole gravé (aucune lettre).
  function dessinerSceau(c, id, gagne) {
    c.clearRect(0, 0, 80, 80);
    const k = gagne ? '#a3221a' : '#4a3a2a';
    c.fillStyle = k;
    c.beginPath();
    for (let a = 0; a < 16; a++) { const r = a % 2 ? 34 : 37, an = a / 16 * Math.PI * 2; c.lineTo(40 + Math.cos(an) * r, 40 + Math.sin(an) * r); }
    c.closePath(); c.fill();
    c.fillStyle = gagne ? '#7a1712' : '#3a2c20'; rond(c, 40, 40, 26); c.fill();
    c.strokeStyle = gagne ? '#ffcf9a' : '#6a5a48'; c.fillStyle = c.strokeStyle; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath();
    if (id === 'premier') { c.moveTo(30, 52); c.quadraticCurveTo(42, 34, 52, 26); c.stroke(); c.beginPath(); c.moveTo(52, 26); c.quadraticCurveTo(40, 30, 36, 44); c.stroke(); }
    else if (id === 'long') { c.moveTo(24, 40); c.lineTo(56, 40); c.moveTo(48, 32); c.lineTo(56, 40); c.lineTo(48, 48); c.stroke(); }
    else if (id === 'riche') { c.moveTo(40, 24); c.quadraticCurveTo(54, 42, 40, 54); c.quadraticCurveTo(26, 42, 40, 24); c.fill(); }
    else if (id === 'pleine') { for (let i = 0; i < 7; i++) { rond(c, 40 + Math.cos(i / 7 * 6.283) * 14, 40 + Math.sin(i / 7 * 6.283) * 14, 3); c.fill(); } }
    else if (id === 'pages10') { c.strokeRect(30, 26, 20, 28); c.moveTo(34, 34); c.lineTo(46, 34); c.moveTo(34, 41); c.lineTo(46, 41); c.stroke(); }
    else if (id === 'codex') { c.moveTo(24, 30); c.quadraticCurveTo(32, 26, 40, 30); c.quadraticCurveTo(48, 26, 56, 30); c.lineTo(56, 52); c.quadraticCurveTo(48, 48, 40, 52); c.quadraticCurveTo(32, 48, 24, 52); c.closePath(); c.moveTo(40, 30); c.lineTo(40, 52); c.stroke(); }
    else if (id === 'aube') { c.arc(40, 46, 10, Math.PI, 0); c.stroke(); for (let i = 0; i < 5; i++) { const a = Math.PI + (i + 0.5) / 5 * Math.PI; c.beginPath(); c.moveTo(40 + Math.cos(a) * 14, 46 + Math.sin(a) * 14); c.lineTo(40 + Math.cos(a) * 20, 46 + Math.sin(a) * 20); c.stroke(); } c.beginPath(); c.moveTo(24, 46); c.lineTo(56, 46); c.stroke(); }
    else { rond(c, 33, 36, 5); c.fill(); rond(c, 47, 36, 5); c.fill(); c.beginPath(); c.moveTo(24, 54); c.quadraticCurveTo(33, 42, 40, 54); c.quadraticCurveTo(47, 42, 56, 54); c.stroke(); }
  }

  const TUTOS = {
    base: { g: ['.....', '.....', '.....'], l: ['.....', 'NUIT.', '.....'], etapes: [['pose', 0, 1, 'B'], ['pose', 2, 1, 'T'], ['ecrire'], ['effet']], effet: 'mot' },

    relique: { g: ['..r..', '.....', '.....'], l: ['.....', 'NUIT.', '.....'], etapes: [['pose', 0, 2, 'L'], ['pose', 2, 2, 'T'], ['ecrire'], ['effet']], effet: 'relique' },
    bougie: { g: ['.b...', '.....', '.....'], l: ['.....', 'NUIT.', '.....'], etapes: [['pose', 0, 1, 'B'], ['pose', 2, 1, 'T'], ['ecrire'], ['effet'], ['pose', 1, 4, 'S'], ['ecrire']], effet: 'bougie' },
    miroir: { g: ['.....', '.....', '.....'], l: ['.....', '.TIUN', '.....'], m: [1], etapes: [['pose', 1, 0, 'S'], ['ecrire'], ['effet']], effet: 'miroir' },
    etend: { g: ['.....', '.....', '...#.'], l: ['.....', 'NUIT.', '.....'], etapes: [['effet']], effet: 'etend', tache: [2, 2] },
    tout: { g: ['.....', '.....', '.....'], l: ['.....', '.TIUN', '.....'], m: [0, 1, 2], etapes: [['pose', 1, 0, 'S'], ['ecrire'], ['effet']], effet: 'miroir' },
    affame: { g: ['.....', '.....', '.....'], l: ['A.L..', 'NUIT.', '..T..'], auteurs: [[0, 0], [0, 2], [2, 2]], etapes: [['effet']], effet: 'moine', efface: [[0, 0], [0, 2], [2, 2]] }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = 5, H = 3;
    const base = () => {
      const e = { W: W, H: H, c: d.g.join(''), l: d.l.join(''), q: [], m: [0, 0, 0], mots: [], o: { moine: 0 } };
      for (let i = 0; i < W * H; i++) e.q.push(e.l.charAt(i) === '.' ? -9 : -1);
      (d.m || []).forEach((r) => { e.m[r] = 1; });
      (d.auteurs || []).forEach((p) => { e.q[p[0] * W + p[1]] = 1; });
      return e;
    };
    const DUREE = { pose: 1000, refus: 1100, ecrire: 600, effet: 2200 };
    const debuts = [];
    let total = 0;
    d.etapes.forEach((et) => { debuts.push(total); total += DUREE[et[0]]; });
    total += 900;
    const g = { s: 60, ox: 130, oy: 30 };
    const plateau = { x: 92, y: 250 };            // la réserve dessinée sous la page
    let debut = 0, e = base(), fait = -1, an = {};
    const j = ++tutoAnim;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      let ecoule = t - debut;
      if (ecoule > total) { debut = t; ecoule = 0; e = base(); fait = -1; an = {}; }
      let k = 0;
      while (k + 1 < debuts.length && ecoule >= debuts[k + 1]) k++;
      const et = d.etapes[k], dans = ecoule - debuts[k];
      // une étape qui commence : on applique ce qu'elle change
      while (fait < k) {
        fait++;
        const x = d.etapes[fait];
        if (fait > 0 && d.etapes[fait - 1][0] === 'pose') { /* la lettre est déjà sur la page */ }
        if (x[0] === 'effet') {

    c.fillStyle = '#c9d6e6';
    c.beginPath(); c.ellipse(wx - h * 0.01, wy + h * 0.025, h * 0.032, h * 0.026, 0.4, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#c9d6e6'; c.lineWidth = h * 0.013;
    [[-0.075, 0.06], [-0.05, 0.085], [-0.02, 0.095], [0.012, 0.085], [0.03, 0.04]].forEach((d) => {
      c.beginPath(); c.moveTo(wx - h * 0.01, wy + h * 0.03);
      c.quadraticCurveTo(wx + h * d[0] * 0.5, wy + h * d[1] * 0.9, wx + h * d[0], wy + h * d[1]); c.stroke();
    });
    c.restore();
  }

  function dessinerAffiche() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d');
    const k = Math.min(w / 600, h / 800), ox = (w - 600 * k) / 2, oy = (h - 800 * k) / 2;
    c.setTransform(dpr * k, 0, 0, dpr * k, dpr * ox, dpr * oy);
    const X0 = -ox / k, X1 = (w - ox) / k, Y0 = -oy / k, Y1 = (h - oy) / k, LW = X1 - X0;
    const t = 1800;
    // mur de pierre, la nuit (il continue jusqu'aux bords d'un écran large)
    const mur = c.createLinearGradient(0, Y0, 0, Y1);
    mur.addColorStop(0, '#2a2140'); mur.addColorStop(0.55, '#3a2a2c'); mur.addColorStop(1, '#1a110c');
    c.fillStyle = mur; c.fillRect(X0, Y0, LW, Y1 - Y0);
    c.strokeStyle = '#00000055'; c.lineWidth = 2;
    const hz = graineHasard(11);
    for (let y = Math.floor(Y0 / 34) * 34; y < 640; y += 34) {
      const dec = (Math.round(y / 34) % 2) * 32;
      for (let x = Math.floor(X0 / 64) * 64 - dec; x < X1; x += 64) c.strokeRect(x + hz() * 2, y, 64, 34);
    }
    // grande fenêtre en ogive au clair de lune, derrière le Moine
    const fx = 205, fw = 250, fy = 70, fh = 420;
    const ogive = () => {
      c.beginPath();
      c.moveTo(fx - fw / 2, fy + fh); c.lineTo(fx - fw / 2, fy + fw * 0.5);
      c.quadraticCurveTo(fx - fw / 2, fy, fx, fy - fw * 0.2); c.quadraticCurveTo(fx + fw / 2, fy, fx + fw / 2, fy + fw * 0.5);
      c.lineTo(fx + fw / 2, fy + fh); c.closePath();
    };
    c.save();
    ogive();
    const ciel = c.createLinearGradient(0, fy, 0, fy + fh);
    ciel.addColorStop(0, '#3550a8'); ciel.addColorStop(0.6, '#6f8fe0'); ciel.addColorStop(1, '#a9c2ff');
    c.fillStyle = ciel; c.fill(); c.clip();
    const lune = c.createRadialGradient(fx + 40, fy + 90, 10, fx + 40, fy + 90, 190);
    lune.addColorStop(0, 'rgba(240,250,255,.95)'); lune.addColorStop(0.3, 'rgba(200,225,255,.5)'); lune.addColorStop(1, 'rgba(200,225,255,0)');
    c.fillStyle = lune; c.fillRect(fx - fw, fy - fw, fw * 2, fh + fw);
    c.fillStyle = '#fbfdff'; rond(c, fx + 40, fy + 90, 46); c.fill();
    const hs = graineHasard(5);
    c.fillStyle = '#ffffff';
    for (let i = 0; i < 24; i++) { rond(c, fx - fw / 2 + hs() * fw, fy - 20 + hs() * fh * 0.7, 0.8 + hs() * 1.6); c.fill(); }
    c.restore();
    c.strokeStyle = '#120b08'; c.lineWidth = 12;
    c.beginPath(); c.moveTo(fx, fy - fw * 0.15); c.lineTo(fx, fy + fh); c.moveTo(fx - fw / 2, fy + fh * 0.5); c.lineTo(fx + fw / 2, fy + fh * 0.5); c.stroke();
    c.strokeStyle = '#6a5848'; c.lineWidth = 16; ogive(); c.stroke();
    c.strokeStyle = '#8e7a64'; c.lineWidth = 4; ogive(); c.stroke();
    // rayons de lune vers le manuscrit
    c.save(); c.globalAlpha = 0.16; c.fillStyle = '#cfe6ff';
    c.beginPath(); c.moveTo(fx - fw / 2, fy + fh * 0.2); c.lineTo(fx + fw / 2, fy + fh * 0.1); c.lineTo(470, 640); c.lineTo(40, 660); c.closePath(); c.fill();
    c.restore();
    // halo chaud de la chandelle, à droite
    const bx = 548, by = 330;
    const halo = c.createRadialGradient(bx, by, 6, bx, by, 380);
    halo.addColorStop(0, 'rgba(255,200,110,.75)'); halo.addColorStop(0.35, 'rgba(255,160,70,.32)'); halo.addColorStop(1, 'rgba(255,160,70,0)');
    c.fillStyle = halo; c.fillRect(X0, Y0, LW, Y1 - Y0);
    // le Moine sans Ombre, découpé sur la fenêtre
    moineAffiche(c, 190, 330, 470);
    // brume à ses pieds : il n'a pas d'ombre
    c.save(); c.globalAlpha = 0.35; c.fillStyle = '#c9e6ff';
    for (let i = 0; i < 4; i++) { c.beginPath(); c.ellipse(80 + i * 90, 560 + (i % 2) * 14, 120, 18, 0, 0, Math.PI * 2); c.fill(); }
    c.restore();
    // le copiste, en grand, à droite
    copisteAffiche(c, 440, 300, 72);
    // pupitre et manuscrit ouvert (tuiles sans lettres, en mots croisés)
    c.fillStyle = '#3a2416';
    c.beginPath(); c.moveTo(X0, 640); c.lineTo(X1, 640); c.lineTo(X1, Y1); c.lineTo(X0, Y1); c.closePath(); c.fill();
    const bois = c.createLinearGradient(0, 600, 0, 660);
    bois.addColorStop(0, '#6a4426'); bois.addColorStop(1, '#3a2416');
    c.fillStyle = bois; c.fillRect(X0, 612, LW, 40);
    c.save();
    c.translate(300, 540); c.rotate(-0.06); c.transform(1, 0, -0.18, 0.62, 0, 0);
    // couverture et pages
    c.shadowColor = '#000c'; c.shadowBlur = 30;
    c.fillStyle = '#5a1f16'; rr(c, -250, -150, 500, 300, 18); c.fill();
    c.shadowBlur = 0;
    const pg = c.createLinearGradient(-230, -130, 230, 130);
    pg.addColorStop(0, '#f3e4bd'); pg.addColorStop(0.5, '#ead6a4'); pg.addColorStop(1, '#d7bb7e');
    c.fillStyle = pg; rr(c, -236, -136, 472, 272, 12); c.fill();
    c.strokeStyle = '#7a5a2a88'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -136); c.lineTo(0, 136); c.stroke();
    // grille de la page et mots croisés
    const s = 44, gx = -198, gy = -114;
    c.strokeStyle = '#7a5a2a33'; c.lineWidth = 1;
    for (let r = 0; r < 5; r++) for (let q = 0; q < 9; q++) c.strokeRect(gx + q * s, gy + r * s, s, s);
    iconeCase(c, 'e', gx + 8 * s, gy, s, t, 1);
    iconeCase(c, 'o', gx + 6 * s, gy + 4 * s, s, t, 2);
    tacheEncre(c, gx + 8.5 * s, gy + 3.5 * s, s, 5, 1);
    iconeCase(c, 'r', gx + 0 * s, gy + 4 * s, s, t, 3);
    // le mot du manuscrit (rangée du milieu) et les mots qui le croisent
    const mots = [
      [[2, 3], [2, 4], [2, 5], [2, 6], [2, 7]], // rangée du milieu
      [[0, 5], [1, 5]], [[3, 7], [4, 7]], [[3, 4], [4, 4]]
    ];
    const couls = ['#3a2410', '#b83a32', '#2f7d55', '#2b5fb0'];
    mots.forEach((m, n) => m.forEach((p, z) => tuileAffiche(c, gx + p[1] * s, gy + p[0] * s, s, couls[n], 1 + ((z + n) % 3))));
    // les tuiles que le Moine efface (à gauche) : elles s'envolent en poussière bleue
    [[2, 0], [2, 1], [2, 2]].forEach((p, z) => {
      c.save(); c.globalAlpha = 0.95 - z * 0.12;
      c.translate(gx + p[1] * s + s / 2 + z * 14, gy + p[0] * s + s / 2 - (3 - z) * 44); c.rotate((z - 1) * 0.45);
      c.shadowColor = '#7fe3ff'; c.shadowBlur = 24;
      tuileAffiche(c, -s / 2, -s / 2, s, '#b83a32', 2);
      c.restore();
    });
    c.restore();
    // poussière bleue qui monte vers la main du Moine
    c.save();
    const hp = graineHasard(23);
    c.shadowColor = '#7fe3ff'; c.shadowBlur = 10;
    for (let i = 0; i < 46; i++) {
      const p = hp(), x = 110 + p * 170 + (hp() - 0.5) * 50, y = 520 - p * 120 + (hp() - 0.5) * 60;
      c.fillStyle = i % 4 ? 'rgba(160,236,255,.9)' : '#ffffff';
      rond(c, x, y, 1.2 + hp() * 3.2); c.fill();
    }
    c.restore();
    // la main du copiste qui pose une tuile lumineuse sur la page
    c.save();
    const tx = 352, ty = 452;
    const lueur = c.createRadialGradient(tx + 22, ty + 22, 4, tx + 22, ty + 22, 90);
    lueur.addColorStop(0, 'rgba(255,230,140,.9)'); lueur.addColorStop(1, 'rgba(255,230,140,0)');
    c.fillStyle = lueur; c.fillRect(tx - 80, ty - 80, 210, 210);
    c.translate(tx + 22, ty + 22); c.rotate(-0.18);
    c.shadowColor = '#ffd77a'; c.shadowBlur = 26;
    tuileAffiche(c, -27, -27, 54, '#2b5fb0', 3, { lumiere: true });
    c.restore();
    // manche bleue et main du copiste
    c.save();
    c.fillStyle = '#2b5fb0';
    c.beginPath(); c.moveTo(500, 470); c.quadraticCurveTo(450, 430, 405, 440); c.lineTo(400, 478); c.quadraticCurveTo(450, 490, 500, 530); c.closePath(); c.fill();
    c.strokeStyle = '#ffcf6a'; c.lineWidth = 3; c.beginPath(); c.moveTo(405, 440); c.lineTo(400, 478); c.stroke();
    // main qui tient la tuile par le haut (paume et trois doigts)
    c.fillStyle = '#e9b98c'; c.strokeStyle = '#8a5a36'; c.lineWidth = 1.5;
    c.beginPath(); c.ellipse(402, 452, 17, 13, -0.4, 0, Math.PI * 2); c.fill(); c.stroke();
    [[384, 448], [380, 458], [382, 468]].forEach((p) => { c.beginPath(); c.ellipse(p[0], p[1], 9, 5.5, -0.2, 0, Math.PI * 2); c.fill(); c.stroke(); });
    c.restore();
    // chandelle au premier plan, à droite (coupée par le bord), et encrier à gauche
    c.fillStyle = '#efe3c4'; c.fillRect(bx - 16, by + 26, 32, 300);
    c.fillStyle = '#d6c8a4'; c.fillRect(bx + 6, by + 26, 10, 300);
    c.fillStyle = '#f7edd2'; c.beginPath(); c.ellipse(bx, by + 26, 16, 6, 0, 0, Math.PI * 2); c.fill();
    flamme(c, bx, by, 70, t);
    c.fillStyle = '#120c0a'; rr(c, 18, 600, 70, 54, 12); c.fill();
    c.fillStyle = '#2b5fb0'; c.beginPath(); c.ellipse(53, 604, 26, 7, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#efe3c4'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(62, 604); c.quadraticCurveTo(80, 540, 120, 500); c.stroke();
    c.fillStyle = '#f2ead6';
    c.beginPath(); c.moveTo(120, 500); c.quadraticCurveTo(86, 522, 80, 566); c.quadraticCurveTo(104, 536, 120, 500); c.fill();
  }

  function demarrerAffiche() {
    ecran = 'affiche';
    const cacher = () => {
      for (const el of document.querySelectorAll('.ecran, .voile, #toast, #confettis, .jel-langue, button')) el.style.setProperty('display', 'none', 'important');
    };
    cacher();
    [100, 500, 1500].forEach((d) => setTimeout(cacher, d));
    dessinerAffiche();
    window.addEventListener('resize', dessinerAffiche);
  }

  // ---------------------------------------------------------------------
  //  Images du jeu (page du jeu) : window.JEL_APERCU = 1, 2 ou 3. Le jeu
  //  s'ouvre directement en pleine nuit solo contre les 3 robots, avec sa
  //  vraie interface (copistes, encre, réserve, boutons), sans écran titre,
  //  ni fenêtre « Continuer », ni tutoriel. La page est remplie par les
  //  règles mêmes du jeu (robots à chaque place, hasard à graine fixe), puis
  //  c'est à toi d'écrire : un mot est posé en lettres provisoires. Le moment
  //  est figé : ni son, ni sauvegarde, ni fin de partie, ni réseau.
  //   1 = nuit 1 : premiers mots croisés autour du mot du manuscrit ;
  //   2 = nuit 10 : enluminures, feuilles d'or, taches, reliques ;
  //   3 = nuit 19, sur ordinateur : lignes du miroir, chandelles, la cloche
  //       vient de sonner et le Moine sans Ombre efface deux mots.
  // ---------------------------------------------------------------------
  const SCENES_APERCU = {
    1: { nuit: 1, graine: 11, coups: 4 },
    2: { nuit: 10, graine: 22, coups: 12, message: true },
    3: { nuit: 19, graine: 33, coups: 12, moine: true }
  };

  function aleaFixe(graine) {
    let g = graine >>> 0;
    return () => { g = (g + 0x6D2B79F5) | 0; let x = Math.imul(g ^ (g >>> 15), 1 | g); x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  }

  // Décor des côtés sur un écran d'ordinateur (image 3) : le scriptorium la nuit.
  function decorApercu(c, w, h, t) {
    dessinerScene(c, w, h, t);
    c.fillStyle = 'rgba(10,6,4,.25)'; c.fillRect(0, 0, w, h);
  }

  function ouvrirApercu(n) {
    const sc = SCENES_APERCU[n];
    const alea = aleaFixe(sc.graine);
    Math.random = aleaFixe(sc.graine + 977);
    prog.plume = 'lapis';
    prog.options.son = false;            // aucun son (rien n'est enregistré)
    session = 'solo';
    niveau = sc.nuit;
    // La nuit jouée par les robots à chaque place, jusqu'à ton tour.
    let e = R.depart(alea, PLACES, { niveau: sc.nuit }), avant = null, action = null;
    for (let k = 0; k < 200 && !(e.coups >= sc.coups && R.aQui(e) === 0); k++) {
      const s = R.aQui(e);
      let a = R.bot(copie(e), s, alea, 0.6);
      if (!R.valide(e, s, a)) a = { t: 'passe' };
      avant = copie(e); action = a;
      e = R.jouer(copie(e), s, a, alea);
      if (R.fin(e)) break;
    }
    // Une fausse partie solo, figée : c'est ton tour, rien ne se joue.
    partie = {
      siege: 0, phase: 'jeu', mode: 'solo', manche: 1, chef: -1, etat: e,
      monTour: () => true, estChef: () => false,
      sieges: () => [0, 1, 2, 3].map((s) => ({ humain: s === 0, moi: s === 0, chef: false })),
      jouer: () => false, recommencer: () => false, lancerManche: () => false, pause: () => {}, quitter: () => {}
    };
    nouvelleVue(e);
    afficherEcran('jeu');
    synchroReserve();
    tFige = performance.now() + 100000;
    // Ton mot, posé en lettres provisoires : le meilleur coup de ta réserve.
    const coups = O.coupsPossibles(vue, 0, 7).sort((x, y) => (y.p - x.p) || (y.lg - x.lg));
    if (coups.length) {
      const pris = {};
      coups[0].a.c.forEach((p) => {
        for (let k = 0; k < reserveLocale.length; k++) if (!pris[k] && reserveLocale.charAt(k) === p[1]) { pris[k] = 1; poses.push({ i: p[0], k: k }); break; }
      });
    }
    const d = e.der || {};
    if (sc.moine && e.ev && e.ev.moine && e.ev.moine.length) {
      // La cloche vient de sonner : le Moine glisse sur les mots qu'il efface.
      const efface = [];
      e.ev.moine.forEach((m) => m.c.forEach((i) => {
        let ch = avant.l.charAt(i);
        if (ch === '.' && action && Array.isArray(action.c)) { const p = action.c.find((x) => x[0] === i); ch = p ? p[1] : ''; }
        if (ch && ch !== '.') efface.push({ i: i, ch: ch, q: m.q });
      }));
      anims.efface = { c: efface, t: tFige - 600 };
      anims.moine = { c: e.ev.moine.reduce((a, m) => a.concat(m.c), []), t: tFige - 950 };
      if (e.ev.tache >= 0) anims.tache = { i: e.ev.tache, t: tFige - 500 };
      // Ce que dit le jeu à la cloche (sur la ligne des messages, sans couvrir l'interface).
      const m0 = e.ev.moine[0];
      msgCoup = { texte: tr('moine.efface', { qui: m0.q === 0 ? tr('place.toi') : tr('copiste.' + m0.q), mot: m0.mot, n: m0.perte }), jusqua: Date.now() + 600000 };
    } else if (d.t === 'pose') {
      anims.brille = { c: d.c, t: tFige - 500, coul: couleurPlace(d.q) };
    }
    if (sc.message && d.t === 'pose') {
      msgCoup = { texte: tr('coup.ecrit', { qui: tr('copiste.' + d.q), mots: d.mots.join(' · '), n: d.p }), jusqua: Date.now() + 600000 };
    }
    majInterface();
  }

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  if (window.JEL_AFFICHE) { demarrerAffiche(); return; }
  if (APERCU_N) { ouvrirApercu(APERCU_N); return; }
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
