      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Réserve et lettres provisoires
  // ---------------------------------------------------------------------

  // Recale la réserve affichée sur celle de l'état (en gardant l'ordre choisi).
  function syncReserve() {
    const s = monSiege();
    const rs = vue && s >= 0 && vue.rs[s] ? vue.rs[s] : '';
    if (rs !== rsVu) {
      const reste = rs.split('');
      const nouv = [];
      tuiles.forEach((t) => { const j = reste.indexOf(t.ch); if (j >= 0) { reste.splice(j, 1); nouv.push({ ch: t.ch, cell: t.cell }); } });
      reste.forEach((ch) => nouv.push({ ch: ch, cell: -1 }));
      tuiles = nouv;
      rsVu = rs;
      choisi = -1;
      pile = [];
    }
    // une lettre provisoire sur une case qu'un autre vient d'écrire revient dans la réserve
    if (vue) tuiles.forEach((t) => { if (t.cell >= 0 && (vue.l[t.cell] || !O.jouable(vue, t.cell))) t.cell = -1; });
  }

  function posesActuelles() {
    return tuiles.filter((t) => t.cell >= 0).map((t) => [t.cell, t.ch]).sort((a, b) => a[0] - b[0]);
  }
  function posesCarte() {
    const m = {};
    tuiles.forEach((t) => { if (t.cell >= 0) m[t.cell] = t.ch; });
    return m;
  }

  function majReserve() {
    const boite = $('reserve');
    if (boite.children.length !== 7) {
      boite.textContent = '';
      for (let k = 0; k < 7; k++) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'tuile'; b.dataset.k = String(k);
        boite.appendChild(b);
      }
    }
    for (let k = 0; k < 7; k++) {
      const b = boite.children[k], t = tuiles[k];
      if (!t) { b.className = 'tuile vide'; b.textContent = ''; b.disabled = true; b.removeAttribute('aria-label'); continue; }
      b.disabled = false;
      b.className = 'tuile' + (t.cell >= 0 ? ' pose' : '') + (choisi === k ? ' choisi' : '');
      if (b.dataset.ch !== t.ch || !b.firstChild) {
        b.dataset.ch = t.ch;
        b.textContent = t.ch;
        const sub = document.createElement('sub'); sub.textContent = nb(O.VAL[t.ch]); b.appendChild(sub);
      }
      b.setAttribute('aria-label', tr('tuile.aria', { lettre: t.ch, v: O.VAL[t.ch] }));
    }
    const actif = !!(partie && monSiege() >= 0 && vue && !vue.fini);
    $('btn-rappeler').disabled = !actif || !posesActuelles().length;
    $('btn-melanger').disabled = !actif;
    $('btn-echanger').disabled = !actif || !partie.monTour();
    const arme = echangeArme && Date.now() - echangeArme < 3000;
    $('btn-echanger').classList.toggle('arme', !!arme);
    const txtE = tr(arme ? 'action.echangerSur' : 'action.echanger');
    if ($('txt-echanger').textContent !== txtE) $('txt-echanger').textContent = txtE;
  }

  function majApercu() {
    const el = $('apercu'), bt = $('btn-ecrire');
    const poses = posesActuelles();
    let texte = '', classe = 'neutre', ok = false;
    apercuRes = null;
    if (!vue || !partie || monSiege() < 0 || vue.fini) texte = '';
    else if (!poses.length) texte = tr(partie.monTour() ? 'apercu.vide' : 'apercu.attente');
    else {
      const r = O.analyser(vue, monSiege(), poses);
      apercuRes = r;
      if (r.ok) {
        ok = true; classe = 'ok';
        texte = tr('apercu.ok', { mots: r.mots.map((m) => m.m).join(' · '), n: r.v });
        const plus = [];
        if (r.enlu) plus.push(tr('apercu.enlu'));
        if (r.rub) plus.push(tr('apercu.rub'));
        if (r.sacre) plus.push(tr('apercu.sacre'));
        if (r.chapitre) plus.push(tr('apercu.chapitre'));
        if (r.pages) plus.push(tr('apercu.page'));
        if (vue.mo && r.prot) plus.push(tr('apercu.relique'));
        if (plus.length) texte += ' · ' + plus.join(' · ');
        if (!partie.monTour()) texte += ' · ' + tr('apercu.pasTonTour');
      } else {
        classe = 'ko';
        texte = tr('apercu.' + r.r, { mot: r.m || '' });
      }
    }
    if (el.textContent !== texte) el.textContent = texte;
    el.className = classe;
    const peut = ok && partie && partie.monTour() && !enPause;
    bt.disabled = !peut;
    const tb = ok ? tr('action.ecrirePts', { n: apercuRes.v }) : tr('action.ecrire');
    if (bt.textContent !== tb) bt.textContent = tb;
  }

  // Pose la tuile k sur la case i (ou la reprend si i < 0).
  function poserTuile(k, i) {
    const t = tuiles[k];
    if (!t || !vue) return false;
    if (i >= 0) {
      if (!O.jouable(vue, i) || vue.l[i]) { sons.non(); return false; }
      tuiles.forEach((u) => { if (u.cell === i) u.cell = -1; });
      t.cell = i;
      pile = pile.filter((x) => x !== k);
      pile.push(k);
      sons.plume();
      gouttes(i, monSiege() >= 0 ? monSiege() : 0, 5);
    } else {
      t.cell = -1;
      pile = pile.filter((x) => x !== k);
      sons.prise();
    }
    choisi = -1;
    majReserve();
    majApercu();
    return true;
  }

  // Case suivante dans le sens d'écriture (saute les lettres déjà écrites).
  function suivante(i, d) {
    if (!vue || i < 0) return -1;
    const W = vue.W, H = vue.H;
    let r = Math.floor(i / W), c = i % W;
    for (let n = 0; n < 12; n++) {
      if (d === 'v') r++; else c += vue.mi[r] ? -1 : 1;
      if (r < 0 || r >= H || c < 0 || c >= W) return -1;
      const j = r * W + c;
      if (!O.jouable(vue, j)) return -1;
      if (!vue.l[j] && !tuiles.some((t) => t.cell === j)) return j;
    }
    return -1;
  }

  function poserAuCurseur(k) {
    if (curseur < 0 || !vue) return false;
    if (vue.l[curseur] || !O.jouable(vue, curseur)) return false;
    const ici = curseur;
    if (!poserTuile(k, ici)) return false;
    const n = suivante(ici, dirC);
    if (n >= 0) curseur = n;
    return true;
  }

  function rappeler() { tuiles.forEach((t) => { t.cell = -1; }); pile = []; choisi = -1; sons.prise(); majReserve(); majApercu(); }

  function melanger() {
    for (let i = tuiles.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const x = tuiles[i]; tuiles[i] = tuiles[j]; tuiles[j] = x; }
    pile = [];
    tuiles.forEach((t, k) => { if (t.cell >= 0) pile.push(k); });
    choisi = -1;
    sons.echange();
    majReserve();
  }

  function ecrire() {
    if (!partie || !apercuRes || !apercuRes.ok) { sons.refus(); return; }
    if (!partie.monTour()) { attends(); return; }
    const poses = posesActuelles();
    if (partie.jouer({ l: poses })) { echangeArme = 0; curseur = -1; }
    else sons.refus();
  }

  function echanger() {
    if (!partie || !partie.monTour()) { attends(); return; }
    if (!echangeArme || Date.now() - echangeArme > 3000) {
      echangeArme = Date.now();
      sons.clic();
      majReserve();
      setTimeout(() => majReserve(), 3100);
      return;
    }
    echangeArme = 0;
    rappeler();
    partie.jouer({ x: 1 });
  }

  function souffler() {
    if (!partie || !vue || monSiege() < 0) return;
    if (!partie.monTour()) { attends(); return; }
    if (souffles <= 0) { toast(tr('souffle.fini')); sons.non(); return; }
    const cands = O.coups(vue, monSiege(), 8);
    if (!cands.length) { toast(tr('souffle.rien'), 3500); sons.non(); return; }
    cands.sort((a, b) => b.v - a.v);
    // un bon mot, pas forcément le meilleur
    const choix = cands[Math.min(cands.length - 1, Math.floor(Math.random() * Math.min(3, cands.length)))];
    souffles--;
    tuiles.forEach((t) => { t.cell = -1; });
    pile = [];
    choix.a.l.forEach((p) => {
      const k = tuiles.findIndex((t) => t.cell < 0 && t.ch === p[1]);
      if (k >= 0) { tuiles[k].cell = p[0]; pile.push(k); }
    });
    sons.sacre();
    toast(tr('souffle.ok'));
    majInfos();
    majReserve();
    majApercu();
  }

  function attends() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1500); sons.non(); }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    if (ecran === 'jeu') {
      dessinerJeu(performance.now(), dt);
      majTemps();
      majCompte();
    } else if (ecran === 'titre') {
      dessinerTitre(performance.now());
    } else return;
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, 8);
    const refus = apercuRes && !apercuRes.ok && apercuRes.c ? apercuRes.c : null;
    dessinerPage(c, vue, geo, {
      t: t, anims: anims, poses: posesCarte(), ok: apercuRes ? apercuRes.ok : undefined, refus: refus,
      curseur: curseur, dirC: dirC, survol: survol, couleur: monSiege(), moine: moineAnim
    });
    // gouttes d'encre
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      rond(c, p.x, p.y, p.k); c.fill();
      c.globalAlpha = 1;
    }
  }

  function gouttes(i, qui, n) {
    if (!vue || !geo) return;
    const x = geo.ox + (i % vue.W + 0.5) * geo.s, y = geo.oy + (Math.floor(i / vue.W) + 0.5) * geo.s;
    const coul = qui === monSiege() ? PLUMES[prog.plume].c : COUL[qui] || '#f3d27a';
    for (let k = 0; k < (n || 10); k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 150;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.5 + Math.random() * 0.4, k: geo.s * (0.03 + Math.random() * 0.05), coul: k % 3 ? coul : '#1a1020' });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anims = { cases: {}, der: null };
    moineAnim = null;
    debutTour = Date.now();
    rsVu = null;
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la nuit.
  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role, s), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + prog.sceau;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44, info.moi ? SCEAUX[prog.sceau].e : EMBLEMES[s]);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { copiste: tr('copiste.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomTour(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    anims = { cases: {}, der: null };
    moineAnim = null;
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    rsVu = null;
    tuiles = [];
    souffles = 2;
    mesPages = 0;
    echangeArme = 0;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function bondir(s, classe) {
    const carte = $('place-' + s);
    if (!carte) return;
    carte.classList.remove(classe); void carte.offsetWidth; carte.classList.add(classe);
  }

  function surAction(ev) {
    const t = performance.now();
    const av = ev.avant, ap = ev.apres;
    vue = JSON.parse(JSON.stringify(ap));
    debutTour = Date.now();
    dernierTic = -1;
    const d = ap.der;
    let delai = 0;
    if (d && d.x) {
      sons.echange();
      if (!ev.moi) toast(tr('echange.fait', { qui: nomTour(ev.siege) }), 1800);
      else toast(tr('echange.toi'), 1800);
    } else if (d && d.c) {
      // les lettres s'écrivent une à une (les miennes tout de suite)
      const pas = ev.moi ? 40 : 120;
      d.c.forEach((i, k) => { anims.cases[i] = t + k * pas; setTimeout(() => { if (vue) { sons.plume(); gouttes(i, ev.siege, 6); } }, k * pas); });
      delai = d.c.length * pas;
      anims.der = { t0: t + delai, c: d.c.slice() };
      setTimeout(() => {
        if (!partie) return;
        sons.mot(); sons.encre();
        bondir(ev.siege, 'bond');
        const morceaux = [tr('ecrit.mots', { qui: ev.moi ? tr('place.toi') : nomTour(ev.siege), mots: d.m.join(' · '), n: d.v })];
        if (d.ch) { morceaux.push(tr('ecrit.chapitre')); sons.chapitre(); }
        if (d.sa) { morceaux.push(tr('ecrit.sacre')); sons.sacre(); }
        if (d.pg) { morceaux.push(tr('ecrit.page')); sons.page(); if (ev.moi) mesPages += d.pg; }
        toast(morceaux.join(' · '), 2400);
      }, delai);
      if (ev.moi) { tuiles = []; rsVu = null; pile = []; choisi = -1; }
    }
    // fin d'une heure : cloche, puis le Moine
    if (ap.h > av.h) {
      setTimeout(() => { if (partie) { sons.cloche(); if (!ap.fini) toast(tr('heure.fin', { n: ap.h }), 1800); } }, delai + 500);
      if (ap.me && (!av.me || ap.me.k !== av.me.k)) {
        const me = ap.me;
        const t0 = t + delai + 1100;
        setTimeout(() => {
          if (!partie) return;
          sons.moine();
          if (me.s >= 0) {
            moineAnim = { t0: performance.now(), c: me.c, l: me.l, s: me.s, recule: false };
            setTimeout(() => { if (!partie) return; bondir(me.s, 'perte'); toast(tr('moine.efface', { mot: me.m, qui: me.s === monSiege() ? tr('place.toi') : nomTour(me.s), n: me.v }), 3200); }, 900);
          } else if (me.rel) {
            moineAnim = { t0: performance.now(), c: [], l: [], s: 0, recule: true };
            setTimeout(() => { if (!partie) return; sons.relique(); toast(tr('moine.recule'), 2800); }, 800);
          } else toast(tr('moine.rien'), 2400);
        }, t0 - t);
      }
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && !ap.fini && R.aQui(vue) === partie.siege && !ev.moi) setTimeout(() => { if (partie && partie.monTour()) sons.tour(); }, delai + 200);
    if (curseur >= 0 && vue.l[curseur]) curseur = -1;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    rsVu = null;
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    // on laisse finir les animations (lettres, cloche, Moine)
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, vue && vue.mo ? 4200 : 1900);
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const res = R.fin(e);
    const gagne = moi >= 0 && res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pts, gagne, ob) {
    if (!gagne) return 0;
    return pts >= ob[1] ? 3 : pts >= ob[0] ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30, s === moi ? SCEAUX[prog.sceau].e : EMBLEMES[s]);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.encre', { n: pts }) : '';
    $('fin-bonus').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1, ob = NIVEAUX[i].ob;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, gagne, ob);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      const bonus = [];
      // page maudite de la nuit (posée pendant la nuit, gagnée ou non)
      if (niveau >= PREMIERE_PAGE && mesPages > 0 && !prog.pages[i]) {
        const avantS = SCEAUX.map((_, k) => sceauOuvert(k));
        prog.pages[i] = 1;
        bonus.push(tr('fin.page', { n: totalPages(), max: NIVEAUX.length - PREMIERE_PAGE + 1 }));
        SCEAUX.forEach((_, k) => { if (!avantS[k] && sceauOuvert(k)) bonus.push(tr('fin.sceau', { nom: tr('codex.sceau.' + k) })); });
      }
      let debloque = false;
      if (gagne) {
        const avantP = PLUMES.map((_, k) => plumeOuverte(k));
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        PLUMES.forEach((_, k) => { if (!avantP[k] && plumeOuverte(k)) bonus.push(tr('fin.plume', { nom: tr('codex.plume.' + k) })); });
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours terminé (toutes les nuits gagnées, maintenant ou avant) : meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (bonus.length) sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = (record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) })) + ' · ' + tr('fin.objectifs', { deux: ob[0], trois: ob[1] });
      $('fin-bonus').textContent = bonus.join(' · ');
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);

  // Confettis de parchemin et d'or.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    const coul = ['#f3d27a', '#efe0bb', '#b8323a', '#4f7ae8', '#2fae74'];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 110 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: coul[i % 5], k: 6 + Math.random() * 7 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 3, b.k, b.k / 1.5); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

    const e = O.preparer(NIVEAUX[n - 1], null);

  // Les tutoriels d'une nuit : la nouveauté du terrain, et l'échange au niveau 2.
  function tutosDe(n) {
    const t = NIVEAUX[n - 1].tuto;
    return t && prog.tutos.indexOf(t) < 0 ? [t] : [];
  }

  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercuNiveau(niveau);
    anims = { cases: {}, der: null };
    moineAnim = null;
    particules.length = 0;
    tuiles = []; rsVu = null; pile = []; choisi = -1; curseur = -1;
    souffles = 2;
    mesPages = 0;
    afficherEcran('jeu');
    const liste = tutosDe(niveau);
    const suite = () => {
      if (!liste.length) { attenteTuto = false; lancerNiveau(); return; }
      const cle = liste.shift();
      attenteTuto = true;
      montrerTuto(cle, () => { if (prog.tutos.indexOf(cle) < 0) prog.tutos.push(cle); suite(); });
    };
    suite();
    majInterface();
  }

  // Une page maudite du codex : enluminure unique (sans lettre), ou silhouette.
  function dessinerPageCodex(c, i, w, h, prise) {
    const al = graineHasard(i * 131 + 17);
    c.clearRect(0, 0, w, h);
    c.fillStyle = prise ? '#e7d6ae' : '#2a2233'; c.fillRect(0, 0, w, h);
    if (!prise) {
      c.fillStyle = '#3a3044'; rr(c, w * 0.2, h * 0.2, w * 0.6, h * 0.6, 6); c.fill();
      c.fillStyle = '#8f1d25'; rond(c, w / 2, h / 2, w * 0.14); c.fill();
      c.fillStyle = '#5c4e6a'; rr(c, w * 0.43, h * 0.58, w * 0.14, h * 0.18, 3); c.fill();
      return;
    }
    const teintes = ['#6a2a8a', '#b8323a', '#1d3486', '#0f5537', '#7a4d00'];
    const coul = teintes[i % teintes.length];
    c.strokeStyle = '#b8862a'; c.lineWidth = 3; c.strokeRect(5, 5, w - 10, h - 10);
    c.strokeStyle = coul; c.lineWidth = 1.5; c.strokeRect(10, 10, w - 20, h - 20);
    // lignes d'écriture illisibles
    c.strokeStyle = '#4a3420aa'; c.lineWidth = 1.4;
    for (let k = 0; k < 6; k++) { const y = h * 0.66 + k * h * 0.045; c.beginPath(); c.moveTo(w * 0.18, y); for (let x = w * 0.18; x < w * 0.82; x += 4) c.lineTo(x, y + Math.sin(x * 0.5 + k) * 1.2); c.stroke(); }
    // motif maudit
    const cx = w / 2, cy = h * 0.38, k = w * 0.26;
    c.fillStyle = coul; c.strokeStyle = coul; c.lineWidth = 2.5;
    const m = i % 8;
    if (m === 0) { c.beginPath(); c.moveTo(cx - k, cy); c.quadraticCurveTo(cx, cy - k, cx + k, cy); c.quadraticCurveTo(cx, cy + k, cx - k, cy); c.stroke(); rond(c, cx, cy, k * 0.35); c.fill(); }
    else if (m === 1) { embleme(c, 'cle', cx, cy, k * 1.6, coul); }
    else if (m === 2) { embleme(c, 'lune', cx, cy, k * 1.6, coul); }
    else if (m === 3) { c.beginPath(); c.moveTo(cx, cy - k); c.lineTo(cx + k * 0.9, cy + k * 0.7); c.lineTo(cx - k * 0.9, cy + k * 0.7); c.closePath(); c.stroke(); rond(c, cx, cy + k * 0.1, k * 0.25); c.fill(); }
    else if (m === 4) { for (let j = 0; j < 8; j++) { const a = j / 8 * Math.PI * 2; c.beginPath(); c.moveTo(cx, cy); c.quadraticCurveTo(cx + Math.cos(a + 0.4) * k * 0.8, cy + Math.sin(a + 0.4) * k * 0.8, cx + Math.cos(a) * k, cy + Math.sin(a) * k); c.stroke(); } rond(c, cx, cy, k * 0.2); c.fill(); }
    else if (m === 5) { embleme(c, 'crane', cx, cy, k * 1.6, coul); }
    else if (m === 6) { c.beginPath(); c.moveTo(cx - k, cy - k * 0.2); c.quadraticCurveTo(cx - k * 0.5, cy - k * 0.9, cx, cy - k * 0.3); c.quadraticCurveTo(cx + k * 0.5, cy - k * 0.9, cx + k, cy - k * 0.2); c.quadraticCurveTo(cx, cy + k, cx - k, cy - k * 0.2); c.fill(); }
    else { embleme(c, 'oeil', cx, cy, k * 1.6, coul); }
    for (let j = 0; j < 5; j++) { c.fillStyle = '#b8862a'; rond(c, w * (0.15 + al() * 0.7), h * (0.12 + al() * 0.45), 1.5 + al() * 2); c.fill(); }
    // sceau
    c.fillStyle = '#8f1d25'; rond(c, w * 0.78, h * 0.88, w * 0.08); c.fill();
  }

  // ---------------------------------------------------------------------

  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const reserve = (TUTO_RESERVE[cle] || 'LNEAOSR').split('');
    const base = () => { const e = O.preparer({ g: d.g, s: d.s, mi: d.mi, tours: 1 }, null); e.sc = [0, 0, 0, 0]; return e; };
    let e = base(), debut = 0, fait = 0, an = { cases: {}, der: null }, moi = null, tirage = reserve.slice();
    const PAS = 1150, j = ++tutoAnim;
    const g = geometrie(e, 560, 270, 18);
    const rackY = 300, rackT = 52;
    const rackX = (k) => 280 - (reserve.length * (rackT + 6)) / 2 + k * (rackT + 6);
    const nEt = d.etapes.length;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      const finAnim = nEt + (d.effet ? 4 : 2) + 1;
      if (k >= finAnim) { e = base(); fait = 0; an = { cases: {}, der: null }; moi = null; tirage = reserve.slice(); debut = t; }
      else if (k >= fait && fait < nEt && dans >= 700) {
        const p = d.etapes[fait], i = p[0] * e.W + p[1];
        e.l[i] = p[2]; e.a[i] = 0; an.cases[i] = t;
        fait++;
        if (fait === nEt) an.der = { t0: t + 200, c: d.etapes.map((q) => q[0] * e.W + q[1]) };
      }
      if (d.effet === 'moine' && k === nEt + 1 && !moi) moi = { t0: t, c: d.etapes.map((q) => q[0] * e.W + q[1]), l: d.etapes.map((q) => q[2]), s: 0, recule: false };
      if (d.effet === 'moine' && moi && t - moi.t0 > 1300) d.etapes.forEach((q) => { e.l[q[0] * e.W + q[1]] = ''; });
      if (d.effet === 'relique' && k === nEt + 1 && !moi) moi = { t0: t, c: d.etapes.map((q) => q[0] * e.W + q[1]), l: d.etapes.map((q) => q[2]), s: 0, recule: true };
      if (d.effet === 'echange' && k >= 2 && tirage[0] === reserve[0]) tirage = 'EANROUS'.split('');
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 380);
      dessinerPage(c, e, g, { t: t, anims: an, couleur: 0, curseur: -1, survol: -1, moine: moi && (t - moi.t0 < 2200) ? moi : null });
      // la réserve dessinée et ses lettres
      const restantes = tirage.slice();
      for (let q = 0; q < fait; q++) { const x = restantes.indexOf(d.etapes[q][2]); if (x >= 0) restantes[x] = ''; }
      restantes.forEach((ch, q) => {
        const x = rackX(q);
        c.globalAlpha = ch ? 1 : 0.25;
        c.fillStyle = '#e0c993'; rr(c, x, rackY, rackT, rackT, 9); c.fill();
        c.strokeStyle = '#8a6a32'; c.lineWidth = 2; c.stroke();
        if (ch) { c.fillStyle = '#2a1606'; c.font = '900 30px ' + SERIF; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(ch, x + rackT / 2, rackY + rackT * 0.55); }
        c.globalAlpha = 1;
      });
      // la main : de la réserve vers la case
      if (fait < nEt) {
        const p = d.etapes[fait], i = p[0] * e.W + p[1];
        const q = Math.min(1, Math.max(0, (dans - 80) / 560));
        const src = tirage.indexOf(p[2]);
        const x0 = rackX(Math.max(0, src)) + rackT / 2, y0 = rackY + rackT / 2;
        const x1 = g.ox + (i % e.W + 0.5) * g.s, y1 = g.oy + (Math.floor(i / e.W) + 0.5) * g.s;
        const x = x0 + (x1 - x0) * q, y = y0 + (y1 - y0) * q;
        if (q > 0 && q < 1) { c.globalAlpha = 0.85; lettre(c, p[2], x - g.s / 2, y - g.s / 2, g.s, 0, 1); c.globalAlpha = 1; }
        main(c, x + 6, y + 10, 1.5, q >= 1 ? 1 : 0);
      } else if (d.effet === 'echange' && k < 2) {
        const q = Math.min(1, dans / 600);
        main(c, 520 - 30 * q, 340 - 20 * q, 1.5, q >= 1 ? 1 : 0);
        c.fillStyle = '#2b2136'; rr(c, 470, 290, 60, 60, 12); c.fill(); c.strokeStyle = '#a8864a'; c.lineWidth = 3; c.stroke();
        c.strokeStyle = '#f3d27a'; c.lineWidth = 4; c.beginPath(); c.moveTo(482, 312); c.lineTo(518, 312); c.moveTo(510, 304); c.lineTo(518, 312); c.lineTo(510, 320); c.moveTo(518, 330); c.lineTo(482, 330); c.moveTo(490, 322); c.lineTo(482, 330); c.lineTo(490, 338); c.stroke();
      } else if (nEt && k === nEt) {
        // touche « Écrire » : coche verte
        const q = Math.min(1, dans / 500);
        c.fillStyle = '#2f8f46'; rr(c, 470, 290, 70, 60, 14); c.fill();
        c.strokeStyle = '#d8ffd9'; c.lineWidth = 6; c.beginPath(); c.moveTo(488, 320); c.lineTo(500, 333); c.lineTo(523, 305); c.stroke();
        main(c, 510 - 10 * q, 340 - 10 * q, 1.5, q >= 1 ? 1 : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#1a1020'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  const plateau = $('plateau');
  function caseSous(cx, cy) {
    if (!vue || !geo) return -1;
    const r = plateau.getBoundingClientRect();
    const x = cx - r.left - geo.ox, y = cy - r.top - geo.oy;
    const col = Math.floor(x / geo.s), lig = Math.floor(y / geo.s);
    if (col < 0 || lig < 0 || col >= vue.W || lig >= vue.H) return -1;
    return lig * vue.W + col;
  }

  // Toucher une case : y poser la tuile choisie, reprendre une lettre
  // provisoire, ou y placer le curseur (deuxième toucher : changer de sens).
  function toucherCase(i) {
    if (!vue || i < 0 || monSiege() < 0 || vue.fini || attenteTuto) return;
    const k = tuiles.findIndex((t) => t.cell === i);
    if (choisi >= 0 && tuiles[choisi]) { poserTuile(choisi, i); const n = suivante(i, dirC); curseur = n; return; }
    if (k >= 0) { poserTuile(k, -1); curseur = i; return; }
    if (!O.jouable(vue, i) || vue.l[i]) { curseur = -1; return; }
    if (curseur === i) dirC = dirC === 'h' ? 'v' : 'h';
    else { curseur = i; dirC = devinerSens(i); }
    sons.clic();
  }

  // Sens le plus probable depuis une case : le long d'une lettre voisine.
  function devinerSens(i) {
    const W = vue.W, r = Math.floor(i / W), c = i % W;
    const haut = r > 0 && vue.l[i - W], bas = r < vue.H - 1 && vue.l[i + W];
    const gauche = c > 0 && vue.l[i - 1], droite = c < W - 1 && vue.l[i + 1];
    if ((haut || bas) && !(gauche || droite)) return 'v';
    return 'h';
  }

  plateau.addEventListener('pointerdown', (ev) => { audio(); survol = caseSous(ev.clientX, ev.clientY); });
  plateau.addEventListener('pointermove', (ev) => { if (ev.pointerType === 'mouse' || glisse) survol = caseSous(ev.clientX, ev.clientY); });
  plateau.addEventListener('pointerleave', () => { survol = -1; });
  plateau.addEventListener('pointerup', (ev) => {
    if (glisse) return;
    const i = caseSous(ev.clientX, ev.clientY);
    if (ev.pointerType !== 'mouse') survol = -1;
    toucherCase(i);
  });

  // Tuiles de la réserve : toucher (choisir, ou poser au curseur), ou glisser vers la page.
  let appuiTuile = null, glisse = false;
  $('reserve').addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('.tuile');
    if (!b || b.disabled) return;
    audio();
    appuiTuile = { k: +b.dataset.k, x: ev.clientX, y: ev.clientY };
    glisse = false;
  });
  document.addEventListener('pointermove', (ev) => {
    if (!appuiTuile) return;
    const t = tuiles[appuiTuile.k];
    if (!t) return;
    if (!glisse && Math.hypot(ev.clientX - appuiTuile.x, ev.clientY - appuiTuile.y) > 8) {
      glisse = true;
      const f = $('fantome');
      f.textContent = '';
      const tu = document.createElement('div'); tu.className = 'tuile'; tu.style.display = 'flex'; tu.style.alignItems = 'center'; tu.style.justifyContent = 'center';
      tu.textContent = t.ch;
      f.appendChild(tu);
      f.classList.add('actif');
      sons.prise();
    }
    if (glisse) {
      const f = $('fantome');
      f.style.left = ev.clientX + 'px'; f.style.top = ev.clientY + 'px';
      survol = caseSous(ev.clientX, ev.clientY);
    }
  });
  document.addEventListener('pointerup', (ev) => {
    if (!appuiTuile) return;
    const k = appuiTuile.k;
    appuiTuile = null;
    if (glisse) {
      $('fantome').classList.remove('actif');
      const i = caseSous(ev.clientX, ev.clientY);
      survol = -1;
      if (i >= 0) { poserTuile(k, i); curseur = suivante(i, dirC); }
      setTimeout(() => { glisse = false; }, 0);
      return;
    }
    toucherTuile(k);
  });
  document.addEventListener('pointercancel', () => { appuiTuile = null; glisse = false; $('fantome').classList.remove('actif'); survol = -1; });
  // Clavier sur une tuile (Tab puis Entrée) : même effet qu'un toucher.
  $('reserve').addEventListener('keydown', (ev) => {
    const b = ev.target.closest('.tuile');
    if (!b) return;
    if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') { ev.preventDefault(); ev.stopPropagation(); toucherTuile(+b.dataset.k); }
  });

  function toucherTuile(k) {
    const t = tuiles[k];
    if (!t || monSiege() < 0 || attenteTuto) return;
    if (t.cell >= 0) { poserTuile(k, -1); return; }
    if (curseur >= 0 && vue && !vue.l[curseur] && O.jouable(vue, curseur)) { poserAuCurseur(k); return; }
    choisi = choisi === k ? -1 : k;
    sons.prise();
    majReserve();
  }

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    if (curseur < 0) { curseur = Math.floor(vue.H / 2) * vue.W + Math.floor(vue.W / 2); return; }
    let r = Math.floor(curseur / vue.W) + dy, c = curseur % vue.W + dx;
    for (let n = 0; n < 12; n++) {
      if (r < 0 || r >= vue.H || c < 0 || c >= vue.W) return;
      const j = r * vue.W + c;
      if (vue.g.charAt(j) !== ' ') { curseur = j; sons.clic(); return; }
      r += dy; c += dx;
    }
  }

  function sansAccent(ch) { return ch.normalize ? ch.normalize('NFD').replace(/[̀-ͯ]/g, '') : ch; }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || attenteTuto) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      dirC = ev.code === 'ArrowUp' || ev.code === 'ArrowDown' ? 'v' : 'h';
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
      return;
    }
    const surBouton = document.activeElement && document.activeElement.tagName === 'BUTTON';
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (surBouton) return;
      ev.preventDefault(); audio(); ecrire();
      return;
    }
    if (ev.code === 'Space') {
      if (surBouton) return;
      ev.preventDefault(); dirC = dirC === 'h' ? 'v' : 'h'; sons.clic();
      return;
    }
    if (ev.code === 'Backspace' || ev.code === 'Delete') {
      ev.preventDefault();
      const k = pile.pop();
      if (k !== undefined && tuiles[k] && tuiles[k].cell >= 0) { const i = tuiles[k].cell; poserTuile(k, -1); curseur = i; }
      return;
    }
    const ch = sansAccent(String(ev.key || '')).toUpperCase();
    if (ch.length === 1 && ch >= 'A' && ch <= 'Z') {
      ev.preventDefault(); audio();
      if (curseur < 0) { toast(tr('clavier.curseur'), 2000); return; }
      const k = tuiles.findIndex((t) => t.cell < 0 && t.ch === ch);
      if (k < 0) { sons.non(); toast(tr('clavier.absente', { lettre: ch }), 1500); return; }
      poserAuCurseur(k);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-codex').addEventListener('click', () => { audio(); sons.clic(); ouvrirCodex(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('codex-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-souffle').addEventListener('click', () => { audio(); souffler(); });
  $('btn-rappeler').addEventListener('click', () => { audio(); rappeler(); });
  $('btn-melanger').addEventListener('click', () => { audio(); melanger(); });
  $('btn-echanger').addEventListener('click', () => { audio(); echanger(); });
  $('btn-ecrire').addEventListener('click', () => { audio(); ecrire(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  majReserve();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami : directement dans le salon de sa partie.
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
