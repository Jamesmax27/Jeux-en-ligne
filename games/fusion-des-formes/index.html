<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +

    bouton.className = 'jel-langue-bouton';

    var nom = document.createElement('span');

    menu.className = 'jel-langue-menu';
    menu.hidden = true;

      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;

      feuille.textContent = CSS_SELECTEUR;

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);

    SOURCE: SOURCE,

    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,

    surChangement: surChangement,

      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

  }

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];

    tout.date = Date.now();

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;

    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {

    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }

      b.classList.remove('armer');

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)

  //                prochaine écriture du jeu)

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');

    var bNouvelle = bouton('', texte('nouvelle'));

      fermer: function () {

    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));

    var boutons = [bContinuer, bNouvelle, bEffacer];

      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;

      var i = boutons.indexOf(actif);

    try { bContinuer.focus(); } catch (e) { /* rien */ }

  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {

    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {

})();

<script>
'use strict';
/* ==========================================================================
   Fusion des formes — puzzle de glisser-fusionner (Free Micro Games)
   On fait glisser toutes les formes ; deux formes pareilles fusionnent en la
   forme suivante de la chaîne. 24 niveaux, obstacles et objectifs variés.
   ========================================================================== */
const JEU = 'fusion-des-formes';
const I = window.JEL_I18N;
const T = (cle, vars) => I.t(cle, vars);
const nb = (x) => I.nombre(x);

/* LOGIQUE-DEBUT — règles pures du jeu (aucun accès à la page), réutilisables par un simulateur */
// Formes : 1 goutte, 2 anneau, 3 triangle, 4 carré, 5 pentagone, 6 hexagone,
// 7 étoile, 8 cœur, 9 fleur, 10 soleil, 11 cristal, 12 planète.
const FORME_MAX = 12;
// Plans des niveaux : « . » vide, « # » rocher, « x » trou (pas de case),
// « 1 »…« 9 » forme posée, « a »…« i » forme gelée (glace simple, forme 1 à 9),
// « A »…« I » forme gelée sous une glace double, « n » nuage, « j » joker.
// cible : forme à créer ; compte : { forme, n } à créer n fois ; limite : coups permis ;
// apparition : chances de chaque forme qui apparaît ; joker : chance d'un joker ;
// nuageTous : un nuage apparaît tous les N coups ; etoiles : [coups pour 3 étoiles, pour 2 étoiles] ;
// nouveau : carte de tutoriel montrée à la première partie du niveau.
const NIVEAUX = [
  { plan: ['....', '.1..', '..1.', '....'], cible: 4, etoiles: [12, 18], nouveau: 'base' },
  { plan: ['....', '1...', '...2', '....'], cible: 5, etoiles: [20, 28], nouveau: 'chaine' },
  { plan: ['2...', '....', '..3.', '...1'], cible: 6, etoiles: [34, 46] },
  { plan: ['....', '.#..', '..#.', '1..1'], cible: 5, etoiles: [22, 32], nouveau: 'rocher' },
  { plan: ['#..1', '....', '.#..', '...#'], cible: 6, etoiles: [44, 60] },
  { plan: ['...', '.1.', '...'], cible: 5, etoiles: [20, 28], nouveau: 'petit' },
  { plan: ['a...', '..b.', '....', '1..a'], cible: 5, etoiles: [22, 32], nouveau: 'glace' },
  { plan: ['#.a.', '....', '.b.#', 'c..1'], cible: 6, etoiles: [38, 52] },
  { plan: ['4...', '....', '..43', '1...'], cible: 7, apparition: { 1: 0.8, 2: 0.2 }, joker: 0.07, etoiles: [50, 66], nouveau: 'joker' },
  { plan: ['.....', '.2...', '..3..', '...2.', '.....'], cible: 7, apparition: { 1: 0.6, 2: 0.4 }, etoiles: [58, 75], nouveau: 'grand' },
  { plan: ['2..2', '....', '....', '1..1'], cible: 6, limite: 60, etoiles: [36, 48], nouveau: 'limite' },
  { plan: ['x...x', '.....', '..2..', '.....', 'x...x'], cible: 7, apparition: { 1: 0.6, 2: 0.4 }, etoiles: [62, 80], nouveau: 'trous' },
  { plan: ['3...', '....', '....', '...2'], compte: { forme: 5, n: 3 }, apparition: { 1: 0.7, 2: 0.3 }, etoiles: [40, 54], nouveau: 'compte' },
  { plan: ['n...', '..n.', '....', '.2.n'], cible: 6, etoiles: [42, 56], nouveau: 'nuage' },
  { plan: ['#...n', '.a...', '..3..', '...b.', 'n...#'], cible: 7, apparition: { 1: 0.6, 2: 0.4 }, etoiles: [62, 80] },
  { plan: ['A..3', '....', '....', '3..B'], cible: 7, apparition: { 1: 0.7, 2: 0.3 }, joker: 0.08, etoiles: [55, 72], nouveau: 'glace2' },
  { plan: ['#....', '..2..', '.3.#.', '..2..', '....#'], compte: { forme: 6, n: 2 }, limite: 80, apparition: { 1: 0.6, 2: 0.4 }, etoiles: [52, 66] },
  { plan: ['4...', '....', '....', '..43'], cible: 7, apparition: { 1: 0.6, 2: 0.4 }, nuageTous: 7, etoiles: [60, 78], nouveau: 'nuages' },
  { plan: ['...', '.3.', '...', '...', '..2'], cible: 7, apparition: { 1: 0.6, 2: 0.4 }, etoiles: [62, 80], nouveau: 'long' },
  { plan: ['x.A.x', '.n.5.', '..6..', '...n.', 'x.B.x'], cible: 8, apparition: { 1: 0.5, 2: 0.5 }, joker: 0.05, etoiles: [66, 86] },
  { plan: ['6...', '....', '...5', '..54'], cible: 8, limite: 110, apparition: { 1: 0.5, 2: 0.4, 3: 0.1 }, nuageTous: 6, etoiles: [62, 82] },
  { plan: ['#....#', '......', '..7...', '...6..', '......', '#....#'], cible: 9, apparition: { 2: 0.6, 3: 0.4 }, etoiles: [85, 110], nouveau: 'geant' },
  { plan: ['b...b', '.....', '..6..', '.....', 'c...c'], compte: { forme: 8, n: 2 }, limite: 115, apparition: { 2: 0.6, 3: 0.4 }, joker: 0.05, etoiles: [82, 100] },
  { plan: ['8....', '.....', '..7..', '...7.', '....6'], cible: 10, apparition: { 2: 0.3, 3: 0.5, 4: 0.2 }, joker: 0.05, etoiles: [80, 105] },
];

let idSuivant = 1;
function nouvelObjet(k, t, g) { return { k, t: t || 0, g: g || 0, id: idSuivant++ }; }

// État initial d'un niveau.
function creerEtat(def) {
  const rows = def.plan.length, cols = def.plan[0].length;
  const fixe = [], grille = [];
  let glaces = 0, nuages = 0;
  for (let r = 0; r < rows; r++) {
    fixe.push([]); grille.push([]);
    for (let c = 0; c < cols; c++) {
      const ch = def.plan[r][c];
      let f = null, o = null;
      if (ch === '#') f = '#';
      else if (ch === 'x') f = 'x';
      else if (ch >= '1' && ch <= '9') o = nouvelObjet('f', +ch);
      else if (ch >= 'a' && ch <= 'i') { o = nouvelObjet('f', ch.charCodeAt(0) - 96, 1); glaces++; }
      else if (ch >= 'A' && ch <= 'I') { o = nouvelObjet('f', ch.charCodeAt(0) - 64, 2); glaces++; }
      else if (ch === 'n') { o = nouvelObjet('n'); nuages++; }
      else if (ch === 'j') o = nouvelObjet('j');
      fixe[r].push(f); grille[r].push(o);
    }
  }
  let max = 0;
  grille.forEach((l) => l.forEach((o) => { if (o && o.k === 'f') max = Math.max(max, o.t); }));
  return { rows, cols, fixe, grille, coups: 0, score: 0, crees: {}, max, glacesDepart: glaces, nuagesDepart: nuages };
}

function copierEtat(e) {
  return {
    ...e,
    fixe: e.fixe,
    grille: e.grille.map((l) => l.map((o) => (o ? { ...o } : null))),
    crees: { ...e.crees },
  };
}

const DIRS = { gauche: [0, -1], droite: [0, 1], haut: [-1, 0], bas: [1, 0] };

// Peut-on fusionner a (déjà en place) avec b (qui arrive) ?
function fusionnables(a, b) {
  if (a.fus) return false;
  if (a.k === 'f' && b.k === 'f') return a.t === b.t && a.t < FORME_MAX;
  if (a.k === 'j' && b.k === 'f') return b.t < FORME_MAX;
  if (a.k === 'f' && b.k === 'j') return a.t < FORME_MAX;
  return false;
}

// Points d'une forme créée.
function pointsForme(t) { return Math.pow(2, t); }

// Fait glisser tout le plateau. Modifie e. Renvoie le compte rendu des mouvements.
function glisser(e, dir) {
  const [dr, dc] = DIRS[dir];
  const res = { bouge: false, mouvements: [], fusions: [], fontes: [], eclats: [], points: 0 };
  const lignes = [];
  if (dr === 0) {
    for (let r = 0; r < e.rows; r++) {
      const l = [];
      for (let k = 0; k < e.cols; k++) l.push([r, dc < 0 ? k : e.cols - 1 - k]);
      lignes.push(l);
    }
  } else {
    for (let c = 0; c < e.cols; c++) {
      const l = [];
      for (let k = 0; k < e.rows; k++) l.push([dr < 0 ? k : e.rows - 1 - k, c]);
      lignes.push(l);
    }
  }
  const nouvelle = e.grille.map((l) => l.map(() => null));
  const mur = (r, c) => e.fixe[r][c] || (e.grille[r][c] && e.grille[r][c].g > 0);
  for (const l of lignes) {
    let seg = [];
    const traiter = () => {
      if (!seg.length) return;
      const pile = []; // { o, ou }
      for (const [r, c] of seg) {
        const o = e.grille[r][c];
        if (!o) continue;
        const dernier = pile[pile.length - 1];
        if (dernier && fusionnables(dernier.o, o)) {
          const t = (dernier.o.k === 'j' ? o.t : dernier.o.t) + 1;
          const n = nouvelObjet('f', t);
          n.fus = true;
          const [tr, tc] = dernier.ou;
          res.mouvements.push({ id: o.id, de: [r, c], vers: [tr, tc], o });
          res.fusions.push({ a: dernier.o, b: o, n, ou: [tr, tc] });
          dernier.o = n;
          res.points += pointsForme(t);
          res.bouge = true;
        } else {
          const ou = seg[pile.length];
          pile.push({ o, ou });
          res.mouvements.push({ id: o.id, de: [r, c], vers: ou, o });
          if (ou[0] !== r || ou[1] !== c) res.bouge = true;
        }
      }
      for (const p of pile) nouvelle[p.ou[0]][p.ou[1]] = p.o;
      seg = [];
    };
    for (const [r, c] of l) {
      if (mur(r, c)) {
        traiter();
        if (!e.fixe[r][c]) nouvelle[r][c] = e.grille[r][c]; // forme gelée : reste en place
      } else seg.push([r, c]);
    }
    traiter();
  }
  // Effets des fusions sur les voisins : glaces qui fondent, nuages qui éclatent.
  for (const f of res.fusions) {
    const [r, c] = f.ou;
    for (const [vr, vc] of [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]]) {
      if (vr < 0 || vc < 0 || vr >= e.rows || vc >= e.cols) continue;
      const v = nouvelle[vr][vc];
      if (!v) continue;
      if (v.g > 0) { v.g--; res.fontes.push({ ou: [vr, vc], reste: v.g, o: v }); }
      else if (v.k === 'n') { nouvelle[vr][vc] = null; res.eclats.push({ ou: [vr, vc], o: v }); }
    }
    e.crees[f.n.t] = (e.crees[f.n.t] || 0) + 1;
    if (f.n.t > e.max) e.max = f.n.t;
  }
  nouvelle.forEach((l) => l.forEach((o) => { if (o) delete o.fus; }));
  if (res.bouge) {
    e.grille = nouvelle;
    e.score += res.points;
  }
  return res;
}

function peutBouger(e) {
  for (const d of Object.keys(DIRS)) {
    const c = copierEtat(e);
    if (glisser(c, d).bouge) return true;
  }
  return false;
}

// Fait apparaître un nouvel objet après un coup. alea() renvoie un nombre dans [0, 1[.
function faireApparaitre(e, def, alea) {
  const libres = [];
  for (let r = 0; r < e.rows; r++) for (let c = 0; c < e.cols; c++) if (!e.fixe[r][c] && !e.grille[r][c]) libres.push([r, c]);
  if (!libres.length) return null;
  const [r, c] = libres[Math.floor(alea() * libres.length)];
  let o;
  if (def.nuageTous && e.coups > 0 && e.coups % def.nuageTous === 0) o = nouvelObjet('n');
  else if (def.joker && alea() < def.joker) o = nouvelObjet('j');
  else {
    const app = def.apparition || { 1: 0.9, 2: 0.1 };
    let x = alea(), t = 1;
    for (const k of Object.keys(app)) { t = +k; x -= app[k]; if (x < 0) break; }
    o = nouvelObjet('f', t);
  }
  e.grille[r][c] = o;
  return { o, ou: [r, c] };
}

function compter(e, quoi) {
  let n = 0;
  e.grille.forEach((l) => l.forEach((o) => { if (o && quoi(o)) n++; }));
  return n;
}

// Objectifs du niveau : liste de { type, fait, ... }.
function objectifs(e, def) {
  const liste = [];
  if (def.cible) liste.push({ type: 'cible', forme: def.cible, fait: e.max >= def.cible });
  if (def.compte) {
    const n = Math.min(def.compte.n, e.crees[def.compte.forme] || 0);
    liste.push({ type: 'compte', forme: def.compte.forme, n, total: def.compte.n, fait: n >= def.compte.n });
  }
  if (e.glacesDepart) {
    const reste = compter(e, (o) => o.g > 0);
    liste.push({ type: 'glace', reste, total: e.glacesDepart, fait: reste === 0 });
  }
  if (e.nuagesDepart && !def.nuageTous) {
    const reste = compter(e, (o) => o.k === 'n');
    liste.push({ type: 'nuage', reste, total: e.nuagesDepart, fait: reste === 0 });
  }
  return liste;
}

function gagne(e, def) { return objectifs(e, def).every((o) => o.fait); }

function etoilesPour(def, coups) { return coups <= def.etoiles[0] ? 3 : coups <= def.etoiles[1] ? 2 : 1; }

function rectRond(ctx, x, y, w, h, r) {

  ctx.arcTo(x + w, y + h, x, y + h, r);

function dessinerJoker(ctx, x, y, cs, echelle, temps) {

// Dessine un objet du plateau à sa place.

/* ---------- Progression (sauvegarde save.js) ---------- */
const prog = { etoiles: [], records: [], scores: [], vus: {}, son: true, niveauSauve: 1, max: 0 };
function lireSonLocal() { try { return localStorage.getItem('fdf-son') !== 'non'; } catch (e) { return true; } }
function ecrireSonLocal(v) { try { localStorage.setItem('fdf-son', v ? 'oui' : 'non'); } catch (e) { /* stockage indisponible */ } }
function chargerProgression() {
  const d = window.JEL_SAVE ? JEL_SAVE.load(JEU) : { niveau: 1, options: {} };
  const tab = (x, max) => NIVEAUX.map((_, i) => {
    const v = Array.isArray(x) ? Number(x[i]) : 0;
    return Number.isFinite(v) && v > 0 ? Math.min(max, Math.floor(v)) : 0;
  });
  prog.etoiles = tab(d.etoiles, 3);
  prog.records = tab(d.records, 99999);
  prog.scores = tab(d.scores, 1e9);
  prog.vus = d.vus && typeof d.vus === 'object' && !Array.isArray(d.vus) ? { ...d.vus } : {};
  prog.son = d.options && d.options.son === false ? false : (d.options && d.options.son === true ? true : lireSonLocal());
  prog.niveauSauve = Math.min(NIVEAUX.length, Math.max(1, Math.floor(Number(d.niveau) || 1)));
  prog.max = Math.min(FORME_MAX, Math.max(0, Math.floor(Number(d.max) || 0)));
}
const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
const scoreTotal = () => prog.scores.reduce((a, b) => a + b, 0);
function niveauDebloque() {
  let n = 1;
  while (n < NIVEAUX.length && prog.etoiles[n - 1] > 0) n++;
  return Math.max(n, prog.niveauSauve);
}
function donneesSauvegarde(niveau) {
  return { niveau, score: scoreTotal(), etoiles: prog.etoiles, records: prog.records, scores: prog.scores, vus: prog.vus, max: prog.max, options: { son: prog.son } };
}

/* ---------- Sons (Web Audio, aucun fichier) ---------- */
let audio = null;
let gesteFait = false;
function premierGeste() {
  if (gesteFait) { if (audio && audio.state === 'suspended') audio.resume(); return; }
  gesteFait = true;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function note(freq, duree, type, volume, delai, glisse) {
  if (!audio || !prog.son || enPause) return;
  try {
    const t0 = audio.currentTime + (delai || 0);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * glisse), t0 + duree);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(volume || 0.12, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
    o.connect(g).connect(audio.destination);
    o.start(t0);
    o.stop(t0 + duree + 0.03);
  } catch (e) { /* son impossible : on continue sans */ }
}
function bruit(duree, volume, filtre, delai) {
  if (!audio || !prog.son || enPause) return;
  try {
    const t0 = audio.currentTime + (delai || 0);
    const n = Math.floor(audio.sampleRate * duree);
    const buf = audio.createBuffer(1, n, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = audio.createBufferSource();
    s.buffer = buf;
    const f = audio.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = filtre || 1200;
    const g = audio.createGain();
    g.gain.value = volume || 0.15;
    s.connect(f).connect(g).connect(audio.destination);
    s.start(t0);
  } catch (e) { /* son impossible */ }
}
const GAMME = [262, 294, 330, 392, 440, 523, 587, 659, 784, 880, 1047, 1175, 1319];
function son(nom, x) {
  switch (nom) {
    case 'glisse': bruit(0.09, 0.05, 900); break;
    case 'fusion': note(GAMME[Math.min(12, x)] , 0.18, 'triangle', 0.13); note(GAMME[Math.min(12, x)] * 2, 0.12, 'sine', 0.05, 0.03); break;
    case 'bloque': note(140, 0.12, 'square', 0.05, 0, 0.7); break;
    case 'craque': bruit(0.12, 0.12, 3200); note(1800, 0.06, 'square', 0.03); break;
    case 'fond': bruit(0.25, 0.12, 2600); note(1568, 0.15, 'sine', 0.06, 0.05); note(2093, 0.18, 'sine', 0.05, 0.12); break;
    case 'eclat': note(600, 0.12, 'sine', 0.12, 0, 2.2); bruit(0.08, 0.06, 1800); break;
    case 'joker': [0, 1, 2, 3].forEach((k) => note(880 + k * 220, 0.1, 'sine', 0.06, k * 0.04)); break;
    case 'apparait': note(520, 0.05, 'sine', 0.04); break;
    case 'objectif': [523, 659, 784].forEach((f, k) => note(f, 0.14, 'triangle', 0.1, k * 0.08)); break;
    case 'victoire': [523, 659, 784, 1047].forEach((f, k) => note(f, 0.22, 'triangle', 0.12, k * 0.12)); note(1319, 0.5, 'sine', 0.08, 0.5); break;
    case 'etoile': note(1047 + (x || 0) * 260, 0.2, 'sine', 0.1); break;
    case 'defaite': [392, 349, 311, 262].forEach((f, k) => note(f, 0.25, 'triangle', 0.1, k * 0.15)); break;
    case 'retour': note(700, 0.1, 'sine', 0.08, 0, 0.6); break;
    case 'clic': note(660, 0.05, 'sine', 0.06); break;
  }
}

/* ---------- Écran titre animé (sert aussi de jaquette) ---------- */
const titreCanvas = $('titre-fond');
const tctx = titreCanvas.getContext('2d');
let titreGeo = { w: 390, h: 844 };
const flottants = [];
for (let k = 0; k < 16; k++) flottants.push({ t: 1 + (k % 9), x: Math.random(), y: Math.random(), v: 0.012 + Math.random() * 0.02, s: 0.6 + Math.random() * 0.6, ph: Math.random() * 6 });
function redimTitre() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  titreGeo = { w: window.innerWidth, h: window.innerHeight, haut: window.innerHeight * 0.3, bas: window.innerHeight * 0.7 };
  // place libre entre le titre (en haut) et les boutons (en bas)
  const rh = document.querySelector('.titre-haut').getBoundingClientRect();
  const rb = document.querySelector('.titre-bas').getBoundingClientRect();
  if (rh.height && rb.height && rb.top > rh.bottom) { titreGeo.haut = rh.bottom; titreGeo.bas = rb.top; }
  titreCanvas.width = Math.round(titreGeo.w * dpr);
  titreCanvas.height = Math.round(titreGeo.h * dpr);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function dessinerTitre(temps) {
  const { w, h } = titreGeo;
  tctx.clearRect(0, 0, w, h);
  // petites étoiles du fond
  for (let k = 0; k < 40; k++) {
    const x = (k * 97.3) % w, y = (k * 151.7) % h;
    tctx.globalAlpha = 0.25 + 0.25 * Math.sin(temps * 1.5 + k);
    tctx.fillStyle = '#e8e2ff';
    tctx.fillRect(x, y, 2, 2);
  }
  tctx.globalAlpha = 1;
  const base = Math.min(w, h);
  // formes qui flottent doucement
  for (const f of flottants) {
    const y = ((f.y - temps * f.v) % 1 + 1) % 1;
    const x = f.x * w + Math.sin(temps * 0.7 + f.ph) * 14;
    dessinerForme(tctx, f.t, x, y * h, base * 0.025 * f.s, 0.35, temps);
  }
  // le cœur du dessin : un soleil entouré de la chaîne des formes en orbite
  const libre = Math.max(80, titreGeo.bas - titreGeo.haut);
  const cx = w / 2, cy = titreGeo.haut + libre / 2;
  const R = Math.min(w * 0.36, libre * 0.4);
  tctx.save();
  tctx.strokeStyle = 'rgba(196,181,253,.25)'; tctx.lineWidth = 2; tctx.setLineDash([4, 8]);
  tctx.beginPath(); tctx.ellipse(cx, cy, R, R * 0.92, 0, 0, Math.PI * 2); tctx.stroke();
  tctx.beginPath(); tctx.ellipse(cx, cy, R * 0.62, R * 0.58, 0, 0, Math.PI * 2); tctx.stroke();
  tctx.restore();
  const halo = tctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.7);
  halo.addColorStop(0, 'rgba(255,207,63,.45)'); halo.addColorStop(1, 'rgba(255,207,63,0)');
  tctx.fillStyle = halo; tctx.beginPath(); tctx.arc(cx, cy, R * 0.7, 0, Math.PI * 2); tctx.fill();
  dessinerForme(tctx, 10, cx, cy, R * 0.34 * (1 + 0.04 * Math.sin(temps * 2)), 1, temps);
  for (let k = 0; k < 9; k++) {
    const a = temps * 0.25 + (k * Math.PI * 2) / 9;
    const rr = k % 2 ? R * 0.62 : R;
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr * 0.92;
    const s = R * (0.1 + k * 0.012);
    tctx.save();
    tctx.fillStyle = 'rgba(33,27,79,.85)';
    rectRond(tctx, x - s * 1.35, y - s * 1.35, s * 2.7, s * 2.7, s * 0.5);
    tctx.fill();
    tctx.strokeStyle = rgba(COULEURS[k + 1], 0.8); tctx.lineWidth = 2; tctx.stroke();
    tctx.restore();
    dessinerForme(tctx, k + 1, x, y, s, 1, temps);
  }
}

/* ---------- Sélection des niveaux ---------- */
function construireNiveaux() {
  majTotal();
  const g = $('grille-niveaux');
  g.innerHTML = '';
  const deb = niveauDebloque();
  NIVEAUX.forEach((def, i) => {
    const b = document.createElement('button');
    b.className = 'case-niveau';
    const ouvert = i + 1 <= deb;
    if (!ouvert) {
      b.classList.add('ferme');
      b.innerHTML = SVG.cadenas;
      b.setAttribute('aria-label', T('niveauFerme', { n: i + 1 }));

    } else {
      if (i + 1 === deb && !prog.etoiles[i]) b.classList.add('courant');
      const num = document.createElement('span');
      num.textContent = nb(i + 1);
      const et = document.createElement('span');
      et.className = 'mini-etoiles';
      for (let k = 0; k < 3; k++) { const s = document.createElement(k < prog.etoiles[i] ? 'b' : 'span'); s.textContent = '★'; et.appendChild(s); }
      b.append(num, et);

}

/* ---------- Partie ---------- */
function lancerNiveau(i) {
  i = Math.max(0, Math.min(NIVEAUX.length - 1, i));
  const def = NIVEAUX[i];
  partie = { i, def, etat: creerEtat(def), pile: [], retours: RETOURS_PAR_NIVEAU, enCours: true, faits: 0 };
  partie.faits = objectifs(partie.etat, def).filter((o) => o.fait).length;
  anim = null; pops = new Map(); particules = []; textesVolants = []; taches = []; secousse = 0;
  enPause = false;
  fermerFenetres();
  montrerEcran('jeu');
  // formes de départ qui arrivent une à une
  partie.etat.grille.forEach((l) => l.forEach((o, c) => { if (o) pops.set(o.id, { debut: horloge + c * 0.03, type: 'arrivee' }); }));
  majHUD(true);
  if (def.nouveau && !prog.vus[def.nouveau]) {
    prog.vus[def.nouveau] = true;
    ouvrirTuto(def.nouveau);
  }
}
function fermerFenetres() {
  ['pause', 'fin', 'bilan', 'tuto'].forEach((id) => $(id).classList.add('cache'));
  finOuverte = false; tutoOuvert = null; enPause = false;
}

function majHUD(chaineAussi) {
  if (!partie) return;
  const { def, etat, i } = partie;
  $('info-niveau').textContent = T('niveauN', { n: nb(i + 1) });
  const ic = $('info-coups');

    ic.textContent = T('coupsLimite', { n: nb(etat.coups), max: nb(def.limite) });

  $('info-score').textContent = T('score', { n: nb(etat.score) });
  // jauge des étoiles encore possibles
  const possibles = etoilesPour(def, Math.max(etat.coups, 0));
  const jauge = $('jauge');
  jauge.innerHTML = '';
  for (let k = 0; k < 3; k++) { const s = document.createElement('span'); s.textContent = '★'; if (k >= possibles) s.className = 'eteinte'; jauge.appendChild(s); }
  jauge.setAttribute('aria-label', T('jaugeAria', { n: possibles }));

    else if (o.type === 'compte') { ic2 = icone('forme', o.forme, 32); txt = T('obj.compte', { n: nb(o.n), total: nb(o.total) }); aria = T('obj.compteAria', { forme: T('forme.' + o.forme), total: o.total, n: o.n }); }
    else if (o.type === 'glace') { ic2 = icone('glace', 0, 32); txt = T('obj.glace', { n: nb(o.reste) }); aria = txt; }
    else { ic2 = icone('nuage', 0, 32); txt = T('obj.nuage', { n: nb(o.reste) }); aria = txt; }
    const sp = document.createElement('span');
    sp.textContent = txt + (o.fait ? ' ✓' : '');
    d.append(ic2, sp);
    d.setAttribute('role', 'status');

  if (chaineAussi) majChaine();

// Chaîne des formes, de la goutte jusqu'à la forme visée.
function majChaine() {
  const { def, etat } = partie;
  const vise = def.cible || (def.compte && def.compte.forme) || 4;
  const fin = Math.min(FORME_MAX, Math.max(vise, 4));
  const z = $('chaine');
  z.innerHTML = '';
  for (let t = 1; t <= fin; t++) {
    if (t > 1) {
      const f = document.createElement('canvas');
      f.className = 'fl'; f.width = 14; f.height = 16;
      const x = f.getContext('2d');
      x.fillStyle = '#b9b2e0'; x.beginPath(); x.moveTo(2, 2); x.lineTo(12, 8); x.lineTo(2, 14); x.fill();
      z.appendChild(f);
    }
    const taille = 26;
    const c = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = c.height = taille * dpr;
    const x = c.getContext('2d');
    x.scale(dpr, dpr);
    if (t === vise) { x.beginPath(); x.arc(13, 13, 12, 0, Math.PI * 2); x.strokeStyle = '#ffd88a'; x.lineWidth = 2; x.stroke(); }
    dessinerForme(x, t, 13, 13, t === vise ? 8.5 : 9.5, t <= etat.max || t === vise ? 1 : 0.35, 0);
    z.appendChild(c);
  }
}

// Joue un coup dans une direction.
function jouerCoup(dir) {
  if (!partie || !partie.enCours || anim || enPause || tutoOuvert || finOuverte) return;
  premierGeste();
  const avant = copierEtat(partie.etat);
  const res = glisser(partie.etat, dir);
  if (!res.bouge) { secousse = 0.25; son('bloque'); return; }
  partie.pile.push(avant);
  if (partie.pile.length > 30) partie.pile.shift();
  anim = { debut: horloge, res, dir };
  son('glisse');
}
// Fin du glissement : fusions, effets, nouvelle forme, fin de niveau.
function finGlissement() {
  const { res } = anim;
  anim = null;
  const { etat, def } = partie;
  let plusGrande = 0;
  for (const f of res.fusions) {
    pops.set(f.n.id, { debut: horloge, type: 'fusion' });
    plusGrande = Math.max(plusGrande, f.n.t);
    const [x, y] = centreCase(f.ou[0], f.ou[1]);
    eclabousser(x, y, COULEURS[f.n.t], 8 + f.n.t * 2);
    textesVolants.push({ x, y: y - geo.cs * 0.3, texte: T('points', { n: nb(pointsForme(f.n.t)) }), vie: 1, coul: COULEURS[f.n.t] });
    if (f.a.k === 'j' || f.b.k === 'j') son('joker');
  }
  if (plusGrande) son('fusion', plusGrande);
  for (const f of res.fontes) {
    const [x, y] = centreCase(f.ou[0], f.ou[1]);
    eclabousser(x, y, '#d8f3ff', 14, 'glace');
    son(f.reste ? 'craque' : 'fond');
  }
  for (const e of res.eclats) {
    const [x, y] = centreCase(e.ou[0], e.ou[1]);
    eclabousser(x, y, '#ffffff', 16, 'nuage');
    son('eclat');
  }
  if (plusGrande >= 7) secousse = 0.15;
  etat.coups++;
  if (etat.max > prog.max) prog.max = etat.max;
  const faits = objectifs(etat, def).filter((o) => o.fait).length;
  const nouveauFait = faits > partie.faits;
  partie.faits = faits;
  if (gagne(etat, def)) {
    partie.enCours = false;
    partie.gagne = true;
    majHUD(true);
    flasherObjectifs();
    son('objectif');
    plusTard(0.75, victoire);
    return;
  }
  if (nouveauFait) { son('objectif'); }
  const nouv = faireApparaitre(etat, def, Math.random);
  if (nouv) {
    pops.set(nouv.o.id, { debut: horloge + 0.04, type: 'arrivee' });

    for (const m of anim.res.mouvements) enMouvement.add(m.id);
    // objets immobiles (formes gelées)
    for (let r = 0; r < e.rows; r++) for (let c = 0; c < e.cols; c++) {
      const o = e.grille[r][c];
      if (!o || enMouvement.has(o.id) || nouvelles.has(o.id)) continue;
      const [x, y] = centreCase(r, c);
      // la glace qui fond reste affichée jusqu'à la fin du glissement
      const fonte = anim.res.fontes.find((f) => f.o.id === o.id);
      dessinerObjet(ctx, fonte ? { ...o, g: fonte.reste + 1 } : o, x, y, cs, 1, horloge);
    }
    for (const m of anim.res.mouvements) {
      const r = m.de[0] + (m.vers[0] - m.de[0]) * ek, c = m.de[1] + (m.vers[1] - m.de[1]) * ek;
      const [x, y] = centreCase(r, c);
      dessinerObjet(ctx, m.o, x, y, cs, 1, horloge);
    }
  } else {
    for (let r = 0; r < e.rows; r++) for (let c = 0; c < e.cols; c++) {
      const o = e.grille[r][c];
      if (!o) continue;
      const [x, y] = centreCase(r, c);
      const s = echellePop(o.id);
      if (s > 0.01) dessinerObjet(ctx, o, x, y, cs, s, horloge);
    }
  }
  // particules
  for (const p of particules) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.vie / 0.4));
    ctx.fillStyle = p.coul;
    if (p.style === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2); ctx.restore(); }
    else if (p.style === 'glace') ctx.fillRect(p.x, p.y, p.taille, p.taille);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.taille, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // points qui s'envolent
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of textesVolants) {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.vie * 1.5));
    ctx.font = `800 ${Math.round(cs * 0.26)}px system-ui, sans-serif`;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(18,15,46,.9)'; ctx.strokeText(t.texte, t.x, t.y);
    ctx.fillStyle = eclaircir(t.coul, 0.3); ctx.fillText(t.texte, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------- Boucle principale ---------- */
let dernier = performance.now();
function boucle(maintenant) {
  const dt = Math.min(0.05, (maintenant - dernier) / 1000);
  dernier = maintenant;
  const actif = !enPause && !tutoOuvert;
  if (actif) {
    horloge += dt;
    if (secousse > 0) secousse = Math.max(0, secousse - dt);
    for (const p of particules) {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += (p.style === 'confetti' ? 30 : 260) * dt;
      if (p.rot != null) p.rot += dt * 5;
    }
    particules = particules.filter((p) => p.vie > 0 && p.y < geo.h + 40);
    for (const t of textesVolants) { t.vie -= dt; t.y -= dt * 40; }
    textesVolants = textesVolants.filter((t) => t.vie > 0);
    if (anim && horloge - anim.debut >= DUREE_GLISSE) finGlissement();
    const pretes = taches.filter((t) => t.quand <= horloge);
    if (pretes.length) { taches = taches.filter((t) => t.quand > horloge); pretes.forEach((t) => t.f()); }
  }
  if (ecran === 'jeu') dessinerPlateau();
  else if (ecran === 'titre') dessinerTitre(maintenant / 1000);
  if (tutoOuvert) {
    const c = $('tuto-canvas');
    const x = c.getContext('2d');
    const dpr = c.width / 280;
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    dessinerDemo(x, typeDemo(), (maintenant - tutoOuvert.debut) / 1000);
  }
  requestAnimationFrame(boucle);
}

/* ---------- Commandes ---------- */
function jouer() {
  premierGeste();
  son('clic');
  const reprendre = (d) => { chargerProgression(); lancerNiveau(Math.min(NIVEAUX.length, Math.max(1, d.niveau || 1)) - 1); };
  if (window.JEL_SAVE) {
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: reprendre,
      onNouvelle: () => lancerNiveau(0),
      onEffacer: () => { chargerProgression(); majBoutonsSon(); lancerNiveau(0); },
    });
  } else lancerNiveau(0);
}
$('b-jouer').addEventListener('click', jouer);
$('b-niveaux-titre').addEventListener('click', () => { premierGeste(); son('clic'); montrerEcran('niveaux'); });
$('b-accueil-niveaux').addEventListener('click', () => { son('clic'); montrerEcran('titre'); });
document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', () => { premierGeste(); basculerSon(); }));
$('b-pause').addEventListener('click', () => { premierGeste(); mettrePause(true); });
$('b-reprendre').addEventListener('click', () => { mettrePause(false); son('clic'); });
$('b-recommencer').addEventListener('click', () => { enPause = false; son('clic'); lancerNiveau(partie.i); });
$('b-niveaux-pause').addEventListener('click', () => { fermerFenetres(); partie = null; son('clic'); montrerEcran('niveaux'); });
$('b-accueil-pause').addEventListener('click', () => { fermerFenetres(); partie = null; son('clic'); montrerEcran('titre'); });
$('b-tuto').addEventListener('click', suivantTuto);
$('tuto').addEventListener('click', (e) => { if (e.target === $('tuto')) suivantTuto(); });
$('b-annuler').addEventListener('click', () => { premierGeste(); annuler(); });
$('b-annuler-fin').addEventListener('click', () => { annuler(); });
$('b-suivant').addEventListener('click', () => {
  son('clic');
  if (partie.i >= NIVEAUX.length - 1) ouvrirBilan();
  else lancerNiveau(partie.i + 1);
});
$('b-rejouer').addEventListener('click', () => { son('clic'); lancerNiveau(partie.i); });
$('b-niveaux-fin').addEventListener('click', () => { fermerFenetres(); partie = null; son('clic'); montrerEcran('niveaux'); });
$('b-niveaux-bilan').addEventListener('click', () => { fermerFenetres(); partie = null; son('clic'); montrerEcran('niveaux'); });
$('b-accueil-bilan').addEventListener('click', () => { fermerFenetres(); partie = null; son('clic'); montrerEcran('titre'); });
document.querySelectorAll('.fleche').forEach((b) => {
  b.innerHTML = SVG[b.dataset.dir];
  b.addEventListener('click', () => jouerCoup(b.dataset.dir));
});
$('b-pause').innerHTML = SVG.pause;
$('b-accueil-niveaux').innerHTML = SVG.maison;
$('annuler-icone').innerHTML = SVG.retour;

// Glisser le doigt ou la souris sur le plateau.
let depart = null;
const zoneGeste = $('zone-plateau');
zoneGeste.addEventListener('pointerdown', (e) => { premierGeste(); depart = { x: e.clientX, y: e.clientY, fait: false }; });
function finGeste(e, force) {
  if (!depart || depart.fait) return;
  const dx = e.clientX - depart.x, dy = e.clientY - depart.y;
  const seuil = force ? 18 : 34;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < seuil) return;
  depart.fait = true;
  if (Math.abs(dx) > Math.abs(dy)) jouerCoup(dx > 0 ? 'droite' : 'gauche');
  else jouerCoup(dy > 0 ? 'bas' : 'haut');
}
zoneGeste.addEventListener('pointermove', (e) => finGeste(e, false));
window.addEventListener('pointerup', (e) => { finGeste(e, true); depart = null; });
window.addEventListener('pointercancel', () => { depart = null; });

// Clavier : flèches, ZQSD / WASD (position des touches), U ou Retour arrière, Échap ou P.
document.addEventListener('keydown', (e) => {
  if (document.querySelector('jel-sauvegarde')) return; // fenêtre de reprise ouverte
  premierGeste();
  const code = e.code;
  if (tutoOuvert) {
    if (['Enter', 'NumpadEnter', 'Space', 'Escape'].includes(code)) { e.preventDefault(); suivantTuto(); }
    return;
  }
  if (ecran === 'jeu') {
    if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); if (!finOuverte) mettrePause(!enPause); return; }
    if (enPause || finOuverte) return;
    const dir = { ArrowLeft: 'gauche', KeyA: 'gauche', ArrowRight: 'droite', KeyD: 'droite', ArrowUp: 'haut', KeyW: 'haut', ArrowDown: 'bas', KeyS: 'bas' }[code];
    if (dir) { e.preventDefault(); jouerCoup(dir); }
    else if (code === 'KeyU' || code === 'Backspace') { e.preventDefault(); annuler(); }
  } else if (ecran === 'titre' && (code === 'Enter' || code === 'Space') && (document.activeElement === document.body || !document.activeElement)) {
    e.preventDefault(); jouer();
  } else if (ecran === 'niveaux' && code === 'Escape') montrerEcran('titre');
});

// Pause automatique quand l'écran est caché.
document.addEventListener('visibilitychange', () => { if (document.hidden && ecran === 'jeu' && partie && !finOuverte) mettrePause(true); });
window.addEventListener('resize', () => { if (ecran === 'jeu') redimensionner(); redimTitre(); });

// Sauvegarde à la fermeture, seulement pendant une partie.
if (window.JEL_SAVE) {
  JEL_SAVE.surFermeture(() => {
    if (partie && ecran === 'jeu') JEL_SAVE.save(JEU, donneesSauvegarde(partie.i + 1));
  });
}

/* ---------- Démarrage ---------- */
chargerProgression();
majBoutonsSon();
montrerEcran('titre');
requestAnimationFrame(boucle);
// les textes traduits peuvent changer la hauteur du titre : on remesure
setTimeout(redimTitre, 120);
window.addEventListener('load', redimTitre);
</script>
