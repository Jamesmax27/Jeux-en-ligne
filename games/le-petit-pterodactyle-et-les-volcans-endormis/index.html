<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

<script>
/* ==========================================================================
   Le petit ptérodactyle et les volcans endormis
   Pipo, un bébé ptérodactyle, marche tout seul vers son nid.
   Toucher = sauter, garder appuyé = planer, glisser = changer de direction
   (vers le bas = s'arrêter). 20 niveaux, 4 paysages, 3 œufs dorés par niveau.
   Tout est dessiné dans le canvas, sans aucun texte dans les dessins.
   ========================================================================== */
(function () {
  'use strict';

  const JEU = 'le-petit-pterodactyle-et-les-volcans-endormis';
  const traduire = window.JEL_I18N.t;
  const nombre = (x) => window.JEL_I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------- Réglages
  const T = 40;               // taille d'une case du monde
  const G = 1500;             // gravité
  const SAUT = 610;           // vitesse du saut (≈ 3 cases de haut)
  const VIT = 170;            // vitesse de marche
  const VIT_PLANE = 205;      // vitesse en vol plané
  const CHUTE_PLANE = 60;     // vitesse de chute en vol plané
  const ENDURANCE = 1.6;      // secondes de vol plané avant de se reposer
  const REBOND = 980;         // feuille géante
  const ACC_SOL = 2600, ACC_GLACE = 230, ACC_AIR = 1000;
  const PW = 24, PH = 30;     // taille de Pipo (boîte de collision)

  // ------------------------------------------------------- Constructeur de niveaux
  // Les niveaux s'écrivent en cases : x avance de gauche à droite, h = hauteur du sol
  // (vers le haut). Les objets se placent par rapport au curseur (dx, dy en cases).
  const Y = (h) => -h * T;
  class Plan {
    constructor(paysage) {
      this.paysage = paysage; this.x = 0; this.h = 0;
      this.solides = []; this.plates = []; this.oeufs = []; this.lesBaies = []; this.feuilles = [];
      this.brachios = []; this.nenus = []; this.geysers = []; this.lanceurs = []; this.lianes = [];
      this.glacons = []; this.vents = []; this.drapeaux = []; this.trous = [];
      this.depart = null; this.nidPos = null; this.trouOuvert = null;
    }
    sol(n, o) {
      o = o || {};
      if (this.trouOuvert) { this.trouOuvert.hApres = this.h; this.trouOuvert = null; }
      this.solides.push({ x: this.x * T, y: Y(this.h), w: n * T, h: 3000, glace: !!o.glace, sol: true });
      if (!this.depart) this.depart = { x: (this.x + 1.5) * T, y: Y(this.h) };
      this.x += n; return this;
    }
    trou(n, prof) {
      const tr = { x1: this.x * T, x2: (this.x + n) * T, hAvant: this.h, hApres: this.h, prof: prof || 2 };
      this.trous.push(tr); this.trouOuvert = tr; this.x += n; return this;
    }
    monte(k) { this.h += k; return this; }
    descend(k) { this.h -= k; return this; }
    plat(dx, dy, w, o) { this.plates.push({ x: (this.x + dx) * T, y: Y(this.h + dy), w: w * T, glace: !!(o && o.glace) }); return this; }
    bloc(dx, dyBas, w, haut, o) { this.solides.push({ x: (this.x + dx) * T, y: Y(this.h + dyBas + haut), w: w * T, h: haut * T, bloc: true, glace: !!(o && o.glace) }); return this; }
    mur(dx, haut, dyBas) { return this.bloc(dx, dyBas || 0, 0.6, haut); }
    oeuf(dx, dy) { this.oeufs.push({ x: (this.x + dx) * T, y: Y(this.h + dy) }); return this; }
    baie(dx, dy) { this.lesBaies.push({ x: (this.x + dx) * T, y: Y(this.h + dy) }); return this; }
    baies(dx, dy, n, pas) { for (let i = 0; i < n; i++) this.baie(dx + i * (pas || 1), dy); return this; }
    arc(dx, dy, n, haut) { // baies en arc de saut
      for (let i = 0; i < n; i++) { const u = n > 1 ? i / (n - 1) : 0.5; this.baie(dx + i * 0.9, dy + (haut || 1.6) * Math.sin(u * Math.PI)); }
      return this;
    }
    feuille(dx, dy) { this.feuilles.push({ x: (this.x + dx) * T, y: Y(this.h + (dy || 0)), w: 1.6 * T, ecrase: 0 }); return this; }
    brachio(n, o) {
      o = o || {};
      const x1 = this.x * T, x2 = (this.x + n - 6.3) * T;
      const b = { x1, x2, x: o.depart === 'droite' ? x2 : x1, y: Y(this.h), sens: 1, pause: 0.5, v: o.vitesse || 70,
        mode: o.continu ? 'continu' : 'attend', portage: 0, dx: 0, phase: Math.random() * 6 };
      this.brachios.push(b);
      if (o.oeufTete) this.oeufs.push({ x: 0, y: 0, porteur: b, ox: 5.9 * T, oy: -3.1 * T });
      if (o.baies) for (let i = 0; i < 3; i++) this.lesBaies.push({ x: 0, y: 0, porteur: b, ox: (1.2 + i * 1.3) * T, oy: -0.5 * T });
      this.trou(n); return this;
    }
    nenuphars(n, positions) {
      const x0 = this.x;
      for (const p of positions) this.nenus.push({ x: (x0 + p) * T, w: 1.7 * T, y0: Y(this.h) + 0.35 * T, dy: 0, etat: 'flotte', chrono: 0 });
      this.trou(n, 0.6); return this;
    }
    geyser(dx, sommet, o) {
      o = o || {};
      const base = this.h - (o.fond ? 2 : 0) + (o.dy || 0);
      const haut = (this.h + sommet) - base;
      this.geysers.push({ x: (this.x + dx) * T, w: 1.6 * T, yBase: Y(base), yHaut: Y(this.h + sommet),
        v: Math.sqrt(2 * G * 1.5 * T), periode: o.periode || 0, actifDuree: o.actif || 0, decal: o.decal || 0,
        actif: true, alerte: false, haut });
      return this;
    }
    cailloux(dx, intervalle, dy) { this.lanceurs.push({ x: (this.x + dx) * T, y: Y(this.h + (dy || 0)), intervalle, chrono: 0.6 }); return this; }
    liane(dx, dy, len) { this.lianes.push({ ax: (this.x + dx) * T, ay: Y(this.h + dy), L: len * T, attente: 0 }); return this; }
    glacon(dx, dy) {
      dy = dy || 4.5;
      this.plat(dx - 1.1, dy, 2.2, { glace: true });
      this.glacons.push({ x: (this.x + dx) * T, y0: Y(this.h + dy) + 12, y: Y(this.h + dy) + 12, vy: 0, etat: 'pendu', chrono: 0 });
      return this;
    }
    vent(dx, w, dyBas, haut, force, o) {
      o = o || {};
      this.vents.push({ x: (this.x + dx) * T, y: Y(this.h + dyBas + haut), w: w * T, h: haut * T, force,
        periode: o.periode || 0, actifDuree: o.actif || 0, decal: o.decal || 0, actif: true });
      return this;
    }
    drapeau(dx) { this.drapeaux.push({ x: (this.x + (dx === undefined ? 1 : dx)) * T, y: Y(this.h), actif: false }); return this; }
    // Escalier en zigzag : un mur arrête Pipo, il faut faire deux demi-tours pour monter de 6 cases.
    zigzag(o) {
      o = o || {};
      const X0 = this.x, H = this.h;
      this.sol(12);
      this.solides.push({ x: (X0 + 9) * T, y: Y(H + 6), w: 3 * T, h: 6 * T + 1, bloc: true, glace: !!o.glace });
      this.plates.push({ x: (X0 + 5) * T, y: Y(H + 2), w: 4 * T, glace: !!o.glace });
      this.plates.push({ x: (X0 + 1) * T, y: Y(H + 4), w: 3.3 * T, glace: !!o.glace });
      this.solides.push({ x: (X0 + 0.5) * T, y: Y(H + 5.5), w: 0.6 * T, h: 1.5 * T, bloc: true });
      this.plates.push({ x: (X0 + 5) * T, y: Y(H + 6), w: 4 * T, glace: !!o.glace });
      if (o.oeufBas) this.oeufs.push({ x: (X0 + 1.8) * T, y: Y(H + 4.6) });
      if (o.oeufHaut) { this.plates.push({ x: (X0 + 2) * T, y: Y(H + 8.4), w: 2.5 * T }); this.oeufs.push({ x: (X0 + 3.2) * T, y: Y(H + 9) }); }
      if (o.baies) { this.lesBaies.push({ x: (X0 + 6) * T, y: Y(H + 2.6) }, { x: (X0 + 7) * T, y: Y(H + 2.6) }, { x: (X0 + 6.5) * T, y: Y(H + 6.6) }); }
      this.h = H + 6; return this;
    }
    // Corniche : Pipo passe dessus, un œuf l'attend dessous, en arrière (demi-tour).
    corniche(o) {
      o = o || {};
      this.monte(2); this.sol(3);
      this.plat(0, 0, 6);
      this.descend(2);
      if (o.oeuf !== false) this.oeuf(1, 0.6);
      return this;
    }
    nid() {
      this.sol(10);
      this.nidPos = { x: (this.x - 4) * T, y: Y(this.h) };
      this.solides.push({ x: this.x * T, y: Y(this.h + 12), w: 2 * T, h: 3000, sol: true, bord: true });
      return this;
    }
  }

    for (let k = 0; k < 20; k++) {

      v.records[k] = Math.max(0, (p.records && +p.records[k]) || 0);

    for (let k = 0; k < 20; k++) { r.etoiles[k] = Math.max(r.etoiles[k], c.etoiles[k]); r.records[k] = Math.max(r.records[k], c.records[k]); r.oeufs[k] |= c.oeufs[k]; }

    const t = J.temps;
    // Brachiosaures
    for (const b of J.brachios) {
      b.dx = 0;
      b.phase += dt * (b.pause > 0 ? 1 : 4);
      const porte = p.support && p.support.ref === b;
      b.portage = porte ? b.portage + dt : 0;
      if (b.pause > 0) { b.pause -= dt; continue; }
      if (b.mode === 'attend' && b.sens === 1 && b.x <= b.x1 + 0.5 && b.portage < 0.35) continue;
      let nx = b.x + b.sens * b.v * dt;
      if (nx >= b.x2) { nx = b.x2; b.sens = -1; b.pause = 1.6; }
      if (nx <= b.x1) { nx = b.x1; b.sens = 1; b.pause = b.mode === 'continu' ? 1.3 : 0.4; }
      b.dx = nx - b.x; b.x = nx;
    }
    // Nénuphars
    for (const n of J.nenus) {
      n.ddy = 0;
      if (n.etat === 'flotte') { if (p.support && p.support.ref === n) { n.etat = 'tremble'; n.chrono = 0.65; } }
      else if (n.etat === 'tremble') { n.chrono -= dt; if (n.chrono <= 0) { n.etat = 'coule'; n.chrono = 0.5; } }
      else if (n.etat === 'coule') { n.ddy = 50 * dt; n.dy += n.ddy; n.chrono -= dt; if (n.chrono <= 0) { n.etat = 'absent'; n.chrono = 2.2; bulles(n.x + n.w / 2, n.y0, 6); } }
      else if (n.etat === 'absent') { n.chrono -= dt; if (n.chrono <= 0) { n.etat = 'revient'; } }
      else if (n.etat === 'revient') { n.dy = Math.max(0, n.dy - 60 * dt); if (n.dy <= 0) n.etat = 'flotte'; }
    }
    // Geysers
    for (const g of J.geysers) {
      if (!g.periode) { g.actif = true; g.alerte = false; continue; }
      const ph = (t + g.decal) % g.periode;
      g.actif = ph < g.actifDuree;
      g.alerte = !g.actif && ph > g.periode - 0.9;
    }
    for (const v of J.vents) {
      if (!v.periode) { v.actif = true; continue; }
      const etaitActif = v.actif;
      v.actif = ((t + v.decal) % v.periode) < v.actifDuree;
      if (v.actif && !etaitActif && Math.abs(p.x - (v.x + v.w / 2)) < 500) son('vent');
    }
    // Lanceurs de pierres
    for (const l of J.lanceurs) {
      if (Math.abs(l.x - p.x) > 720) continue;
      l.chrono -= dt;
      if (l.chrono <= 0 && Math.abs(l.x - p.x) > 70) {
        l.chrono = l.intervalle;
        J.pierres.push({ x: l.x, y: l.y - 18, vx: -140, vy: 0, r: 17, rot: 0, vie: 14 });
        if (Math.abs(l.x - p.x) < 600) son('pierre');
      }
    }
    // Pierres qui roulent
    for (const s of J.pierres) {
      s.vie -= dt;
      s.vy = Math.min(900, s.vy + G * dt);
      const ancienBas = s.y + s.r;
      s.x += s.vx * dt; s.y += s.vy * dt; s.rot += (s.vx * dt) / s.r;
      for (const o of J.solides) {
        if (s.x + s.r * 0.6 > o.x && s.x - s.r * 0.6 < o.x + o.w && s.y + s.r > o.y && s.y - s.r < o.y + o.h) {
          if (ancienBas <= o.y + 4) { s.y = o.y - s.r; s.vy = 0; }
          else { s.vie = 0; eclats(s.x, s.y, '#8a7f78', 8); }
        }
      }
      for (const o of J.plates) {
        if (s.vy >= 0 && s.x > o.x && s.x < o.x + o.w && ancienBas <= o.y + 4 && s.y + s.r >= o.y) { s.y = o.y - s.r; s.vy = 0; }
      }
      if (s.y > J.basMonde) s.vie = 0;
      for (const tr of J.trous) if (s.x > tr.x1 && s.x < tr.x2 && s.y > tr.surface) { s.vie = 0; if (J.eau) bulles(s.x, tr.surface, 5); }
    }
    J.pierres = J.pierres.filter((s) => s.vie > 0);
    // Glaçons
    for (const g of J.glacons) {
      if (g.etat === 'pendu') {
        if (Math.abs(p.x - g.x) < 150 && p.y > g.y0 && p.mort <= 0) { g.etat = 'tremble'; g.chrono = 0.5; son('craque'); }
      } else if (g.etat === 'tremble') { g.chrono -= dt; if (g.chrono <= 0) { g.etat = 'tombe'; g.vy = 0; } }
      else if (g.etat === 'tombe') {
        g.vy += G * dt; g.y += g.vy * dt;
        const pointe = g.y + 30;
        let pose = pointe > J.basMonde;
        for (const o of J.solides) if (g.x > o.x && g.x < o.x + o.w && pointe > o.y && g.y < o.y + 4) pose = true;
        for (const o of J.plates) if (g.x > o.x && g.x < o.x + o.w && pointe > o.y && pointe < o.y + 16 && o.y > g.y0 + 5) pose = true;
        if (pose) { g.etat = 'absent'; g.chrono = 4; eclats(g.x, pointe, '#bfe6ff', 10); son('brise'); }
      } else if (g.etat === 'absent') { g.chrono -= dt; if (g.chrono <= 0) { g.etat = 'pendu'; g.y = g.y0; } }
    }
    // Feuilles
    for (const f of J.feuilles) f.ecrase = Math.max(0, f.ecrase - dt * 3);
    // Particules
    for (const q of J.particules) { q.vie -= dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.g || 0) * dt; }
    J.particules = J.particules.filter((q) => q.vie > 0);
  }

  function pasPipo(dt) {
    const mob = surfacesMobiles();
    p.phase += dt;
    p.invul = Math.max(0, p.invul - dt);
    tamponSaut = Math.max(0, tamponSaut - dt);

    if (p.mort > 0) {
      p.mort -= dt;
      if (p.perdu) { p.vy += G * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
      if (p.mort <= 0) { if (p.coeurs <= 0) perdre(); else reapparaitre(); }
      return;
    }
    if (p.depart > 0) { p.depart -= dt; if (p.depart <= 0) { p.marche = p.dir || 1; } }

    // Sur une liane
    if (p.liane) { pasLiane(dt); collectes(); return; }
    p.lianeAttente = Math.max(0, p.lianeAttente - dt);

    // Porté par une surface qui bouge
    if (p.support) {
      const s = mob.plates.find((q) => q.ref === p.support.ref && q.type === p.support.type);
      if (s) { p.x += s.dx; p.y += s.dy; }
    }

    const glace = p.auSol && p.surGlace;
    let cible = p.marche * (p.plane ? VIT_PLANE : (glace ? VIT * 1.15 : VIT));
    if (p.dansGeyser) cible *= 0.25;
    // Le vent pousse Pipo en l'air (encore plus quand il plane)
    let pousse = 0;
    if (!p.auSol) {
      for (const v of J.vents) {
        if (v.actif && p.x > v.x && p.x < v.x + v.w && p.y > v.y && p.y - PH < v.y + v.h) pousse += v.force * (p.plane ? 1.5 : 1);
      }
    }
    cible += pousse * 0.45;
    const acc = p.auSol ? (glace ? ACC_GLACE : ACC_SOL) : ACC_AIR;
    p.vx = approche(p.vx, cible, acc * dt);
    p.vx += pousse * 0.3 * dt;
    p.vx = Math.max(-430, Math.min(430, p.vx));

    // Saut
    if (tamponSaut > 0 && (p.auSol || p.coyote > 0)) {
      p.vy = -SAUT; p.auSol = false; p.coyote = 0; tamponSaut = 0; p.support = null;
      son('saut'); poussiere(p.x, p.y, 5);
    }
    // Vol plané
    const planait = p.plane;
    p.plane = !p.auSol && maintenu() && p.vy > 0 && p.endurance > 0 && !p.dansGeyser;
    if (p.plane) { p.endurance -= dt; if (!planait) son('plane'); }

    p.vy += G * dt;
    if (p.plane && p.vy > CHUTE_PLANE) p.vy = approche(p.vy, CHUTE_PLANE, 4200 * dt);
    p.vy = Math.min(p.vy, 950);

    // Geysers
    const etaitDansGeyser = p.dansGeyser;
    p.dansGeyser = false;
    for (const g of J.geysers) {
      if (!g.actif) continue;
      if (p.x + PW / 2 > g.x && p.x - PW / 2 < g.x + g.w && p.y > g.yHaut && p.y - PH < g.yBase) {
        p.dansGeyser = true;
        if (p.vy > -g.v) p.vy = -g.v;
        p.endurance = ENDURANCE; p.auSol = false; p.support = null;
        if (!etaitDansGeyser) { son('geyser'); bulles(p.x, p.y, 6); }
      }
    }

    // Déplacement horizontal et murs
    const solides = J.solides.concat(mob.solides);
    p.x += p.vx * dt;
    for (const s of solides) {
      if (!chevauche(p.x, p.y, s)) continue;
      if (p.auSol && s.y >= p.y - 7 && !s.dx) { p.y = s.y; continue; } // petite marche franchie
      if (p.x < s.x + s.w / 2) p.x = s.x - PW / 2 - 0.01; else p.x = s.x + s.w + PW / 2 + 0.01;
      p.vx = 0;
    }

    // Déplacement vertical, sols et plateformes
    const ancienBas = p.y;
    p.y += p.vy * dt;
    const avant = p.auSol;
    p.auSol = false;
    let support = null;
    for (const s of solides) {
      if (!chevauche(p.x, p.y, s)) continue;
      if (p.vy >= 0 && ancienBas <= s.y + 2) { p.y = s.y; p.vy = 0; p.auSol = true; support = s; }
      else if (p.vy < 0) { p.y = s.y + s.h + PH + 0.01; p.vy = 0; }
    }
    if (p.vy >= 0) {
      const plates = J.plates.concat(mob.plates);
      for (const s of plates) {
        const prevY = s.prevY !== undefined ? s.prevY : s.y;
        if (p.x + PW / 2 - 4 > s.x && p.x - PW / 2 + 4 < s.x + s.w && ancienBas <= prevY + 2 && p.y >= s.y) {
          p.y = s.y; p.vy = 0; p.auSol = true; support = s;
        }
      }
    }
    if (p.dansGeyser) { p.auSol = false; support = null; }
    if (p.auSol) {
      if (!avant) { if (p.chuteMax > 200) { son('pose'); poussiere(p.x, p.y, 6); } p.chuteMax = 0; }
      p.endurance = ENDURANCE; p.coyote = 0.1;
    } else {
      p.coyote = Math.max(0, p.coyote - dt);
      p.chuteMax = Math.max(p.chuteMax, p.vy);
    }
    p.support = support && support.ref ? { ref: support.ref, type: support.type } : null;
    p.surGlace = !!(support && support.glace);

    // Feuilles géantes
    if (p.auSol) {
      for (const f of J.feuilles) {
        if (p.x > f.x - 4 && p.x < f.x + f.w + 4 && Math.abs(p.y - f.y) < 3) {
          p.vy = -REBOND; p.auSol = false; p.support = null; f.ecrase = 1;
          son('boing'); eclats(f.x + f.w / 2, f.y, '#7bd36b', 8);
        }
      }
    }

    // Attraper une liane
    if (!p.auSol && p.lianeAttente <= 0) {
      const cx = p.x, cy = p.y - PH / 2;
      for (const l of J.lianes) {
        const a = Math.sin(J.temps * 1.4 + l.ax) * 0.18;
        const ex = l.ax + l.L * Math.sin(a), ey = l.ay + l.L * Math.cos(a);
        const vx = ex - l.ax, vy = ey - l.ay;
        let u = ((cx - l.ax) * vx + (cy - l.ay) * vy) / (vx * vx + vy * vy);
        u = Math.max(0.35, Math.min(1, u));
        const px = l.ax + vx * u, py = l.ay + vy * u;
        if (Math.hypot(cx - px, cy - py) < 28) {
          const Lp = Math.max(60, Math.min(l.L, Math.hypot(cx - l.ax, cy - l.ay)));
          const ang = Math.atan2(cx - l.ax, cy - l.ay);
          p.liane = { l, Lp, ang, om: (p.vx * Math.cos(ang) - p.vy * Math.sin(ang)) / Lp };
          p.plane = false; p.endurance = ENDURANCE;
          son('liane');
          break;
        }
      }
    }

    // Chute dans l'eau ou dans un ravin
    for (const tr of J.trous) {
      if (p.x > tr.x1 && p.x < tr.x2 && p.y > tr.surface + 6) { tomber(tr); return; }
    }
    if (p.y > J.basMonde) { tomber(null); return; }

    collectes();
  }

  function pasLiane(dt) {
    const L = p.liane;
    const k = G / L.Lp;
    L.om += -k * Math.sin(L.ang) * dt;
    // Petit élan automatique pour que Pipo se balance toujours assez
    const E = 0.5 * L.Lp * L.Lp * L.om * L.om + G * L.Lp * (1 - Math.cos(L.ang));
    const Emin = G * L.Lp * (1 - Math.cos(0.95));
    if (E < Emin) L.om += Math.sign(L.om || p.dir || 1) * 2.4 * dt;
    L.ang += L.om * dt;
    p.x = L.l.ax + L.Lp * Math.sin(L.ang);
    p.y = L.l.ay + L.Lp * Math.cos(L.ang) + PH / 2;
    p.vx = L.Lp * L.om * Math.cos(L.ang);
    p.vy = -L.Lp * L.om * Math.sin(L.ang);
    if (Math.abs(p.vx) > 20) p.dir = Math.sign(p.vx);
    if (tamponSaut > 0) {
      tamponSaut = 0;
      p.vx *= 1.1; p.vy = p.vy * 1.1 - 220;
      p.liane = null; p.lianeAttente = 0.45;
      if (Math.abs(p.vx) > 30) { p.marche = Math.sign(p.vx); p.dir = p.marche; }
      son('saut');
    }
  }

  function collectes() {
    const cx = p.x, cy = p.y - PH / 2;
    for (const o of J.oeufs) {
      if (o.pris) continue;
      if (o.porteur) { o.x = o.porteur.x + o.ox; o.y = o.porteur.y + o.oy; }
      if (Math.hypot(o.x - cx, o.y - cy) < 28) {
        o.pris = true; J.points += 100;
        son('oeuf'); eclats(o.x, o.y, '#ffd54f', 16);
        bandeau('bandeau.oeuf', { n: J.oeufs.filter((q) => q.pris).length, total: J.oeufs.length });
        majHUD();
      }
    }
    for (const o of J.baies) {
      if (o.pris) continue;
      if (o.porteur) { o.x = o.porteur.x + o.ox; o.y = o.porteur.y + o.oy; }
      if (Math.hypot(o.x - cx, o.y - cy) < 22) { o.pris = true; J.points += 10; son('baie'); eclats(o.x, o.y, '#d1477a', 5); majHUD(); }
    }
    for (const d of J.drapeaux) {
      if (!d.actif && Math.abs(p.x - d.x) < 26 && Math.abs(p.y - d.y) < 50) {
        d.actif = true; J.reprise = { x: d.x, y: d.y };
        son('drapeau'); eclats(d.x, d.y - 50, PLUMES[0][0], 10); bandeau('bandeau.drapeau');
      }
    }
    // Pierres
    for (const s of J.pierres) {
      const qx = Math.max(p.x - PW / 2, Math.min(s.x, p.x + PW / 2));
      const qy = Math.max(p.y - PH, Math.min(s.y, p.y));
      if (Math.hypot(qx - s.x, qy - s.y) < s.r) {
        if (p.vy > 0 && p.y - 8 < s.y) { p.vy = -560; p.auSol = false; son('boing'); poussiere(s.x, s.y - s.r, 4); }
        else blesser();
      }
    }
    // Glaçons qui tombent
    for (const g of J.glacons) {
      if (g.etat !== 'tombe') continue;
      if (Math.abs(g.x - p.x) < PW / 2 + 6 && g.y + 30 > p.y - PH && g.y < p.y) blesser();
    }
    // Le nid
    if (J.nid && p.x > J.nid.x - 10 && p.auSol && !p.liane) gagner();
  }

  // --------------------------------------------------------------- Accidents
  function blesser() {
    if (p.invul > 0 || p.mort > 0 || etat !== 'jeu') return;
    p.coeurs--; p.invul = 1.6;
    p.vy = -380; p.auSol = false; p.support = null;
    p.vx = -(p.marche || p.dir) * 160;
    p.liane = null;
    secousse = 0.35; son('aie');
    eclats(p.x, p.y - 15, '#ffffff', 8);
    if (p.coeurs <= 0) { p.mort = 0.7; p.perdu = true; }
    else bandeau('bandeau.aie');
    majHUD();
  }
  function tomber(tr) {
    if (p.mort > 0) return;
    p.coeurs--; p.mort = 0.8; p.liane = null;
    secousse = 0.3;
    if (tr && J.eau) { son('plouf'); bulles(p.x, tr.surface, 14); } else { son('aie'); }
    if (p.coeurs > 0) bandeau('bandeau.chute');
    majHUD();
  }
  function reapparaitre() {
    p.x = J.reprise.x; p.y = J.reprise.y; p.vx = 0; p.vy = 0;
    p.marche = 0; p.depart = 0.8; p.dir = 1; p.invul = 1.2;
    p.liane = null; p.support = null; p.auSol = true; p.endurance = ENDURANCE;
    poussiere(p.x, p.y, 8);
  }

  // --------------------------------------------------------------- Effets
  function eclats(x, y, couleur, n) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 180;
      J.particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, g: 400, vie: 0.6 + Math.random() * 0.4, taille: 2 + Math.random() * 3, couleur, type: 'eclat' });
    }
  }
  function poussiere(x, y, n) {
    for (let k = 0; k < n; k++) J.particules.push({ x: x + (Math.random() - 0.5) * 20, y, vx: (Math.random() - 0.5) * 80, vy: -20 - Math.random() * 40, g: 0, vie: 0.4, taille: 3 + Math.random() * 3, couleur: 'rgba(255,255,255,0.7)', type: 'rond' });
  }
  function bulles(x, y, n) {
    for (let k = 0; k < n; k++) J.particules.push({ x: x + (Math.random() - 0.5) * 30, y, vx: (Math.random() - 0.5) * 60, vy: -80 - Math.random() * 120, g: 300, vie: 0.6, taille: 2 + Math.random() * 3, couleur: 'rgba(220,245,255,0.9)', type: 'rond' });
  }

  // --------------------------------------------------------------- Fin d'un niveau
  let chronoArrivee = 0;
  function gagner() {
    if (etat !== 'jeu') return;
    etat = 'arrivee'; chronoArrivee = 0;
    p.marche = 0; p.vx = 0;
    son('victoire');
    for (let k = 0; k < 30; k++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220;
      J.particules.push({ x: J.nid.x, y: J.nid.y - 30, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, g: 350, vie: 1.4, taille: 4, couleur: PLUMES[k % PLUMES.length][0] === 'arc' ? '#ff6' : PLUMES[k % PLUMES.length][0], type: 'plume' });
    }
  }
  function afficherVictoire() {
    const n = niv + 1;
    const nbOeufs = J.oeufs.filter((o) => o.pris).length;
    const etoiles = Math.max(1, nbOeufs);
    const score = J.points + p.coeurs * 50;
    const ancienRecord = prog.records[niv];
    const plumesAvant = plumesDebloquees();
    const masqueAvant = prog.oeufs[niv];
    let masque = 0;
    J.oeufs.forEach((o, k) => { if (o.pris) masque |= 1 << k; });
    prog.oeufs[niv] |= masque;
    prog.etoiles[niv] = Math.max(prog.etoiles[niv], etoiles);
    prog.records[niv] = Math.max(ancienRecord, score);
    prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, n + 1));
    ecrireLocal();
    try { window.JEL_SAVE.save(JEU, { niveau: Math.min(NIVEAUX.length, n + 1), score: totalScore(), progres: prog, options: { son: prog.son } }); } catch (e) { /* rien */ }
    enPartie = false;
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n });
    // Jeu terminé (tous les niveaux gagnés au moins une fois) : total des meilleures étoiles.
    if (NIVEAUX.every((x, k) => prog.etoiles[k] > 0)) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }

    etat = 'fin';
    montrer('ecran-fin');
    $('fin-titre').textContent = traduire('fin.gagne', { n });
    animerEtoiles(etoiles);
    animerScore(score);
    $('fin-detail').textContent = traduire('fin.detail', { oeufs: nbOeufs, total: J.oeufs.length, coeurs: p.coeurs });
    const rec = $('fin-record');
    rec.classList.toggle('battu', score > ancienRecord && ancienRecord > 0);
    rec.textContent = score > ancienRecord && ancienRecord > 0 ? traduire('fin.recordBattu')
      : (ancienRecord > 0 ? traduire('fin.record', { n: prog.records[niv] }) : traduire('fin.premierRecord'));
    const bonus = [];
    if (prog.oeufs[niv] === 7 && masqueAvant !== 7) bonus.push(traduire('fin.eclosion', { nom: traduire('bebe.' + (niv + 1)) }));
    if (plumesDebloquees() > plumesAvant) bonus.push(traduire('fin.nouvellePlume'));
    $('fin-bonus').textContent = bonus.join(' ');
    $('fin-bonus').hidden = !bonus.length;
    const principal = $('b-fin-principal');
    principal.textContent = traduire(n >= NIVEAUX.length ? 'bouton.bilan' : 'bouton.suivant');
    principal.onclick = () => { son('clic'); if (n >= NIVEAUX.length) afficherBilan(); else lancerNiveau(niv + 1); };
    const second = $('b-fin-second');
    second.textContent = traduire('bouton.rejouer');
    second.onclick = () => { son('clic'); lancerNiveau(niv); };
    principal.focus();
  }
  function perdre() {
    if (etat !== 'jeu') return;

  function animerEtoiles(n) {
    const spans = $('fin-etoiles').querySelectorAll('span');
    $('fin-etoiles').setAttribute('aria-label', traduire('fin.etoiles', { n }));
    spans.forEach((s) => s.classList.remove('gagnee'));
    spans.forEach((s, k) => { if (k < n) setTimeout(() => { s.classList.add('gagnee'); son('etoile'); }, 350 + k * 380); });
  }
  let animScore = null;
  function animerScore(cible) {
    if (animScore) clearInterval(animScore);
    let v = 0;
    const pasScore = Math.max(1, Math.ceil(cible / 30));
    $('fin-score').textContent = traduire('fin.score', { n: 0 });
    animScore = setInterval(() => {
      v = Math.min(cible, v + pasScore);
      $('fin-score').textContent = traduire('fin.score', { n: v });
      if (v % (pasScore * 3) === 0) son('tic');
      if (v >= cible) { clearInterval(animScore); animScore = null; }
    }, 30);
  }

  // ============================================================== Dessin
  const ctx = toile.getContext('2d');
  let W = 0, H = 0, DPR = 1, ECH = 1, VW = 0, VH = 0;
  function redim() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    toile.width = Math.round(W * DPR); toile.height = Math.round(H * DPR);
    ECH = Math.min(W / 380, H / 560);
    VW = W / ECH; VH = H / ECH;
  }
  window.addEventListener('resize', redim);
  redim();

  function couleurPlume(c, k, x0, y0, x1, y1) {
    const v = PLUMES[k] ? PLUMES[k][0] : PLUMES[0][0];
    if (v !== 'arc') return v;
    const g = c.createLinearGradient(x0, y0, x1, y1);
    ['#ff6b6b', '#ffd54f', '#66d9a8', '#64b5f6', '#b39ddb'].forEach((col, i) => g.addColorStop(i / 4, col));
    return g;
  }
  function ellipse(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); c.fill(); }
  function cercle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
  function rondRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }

  // Pipo, pieds en (x, y). mode : marche, repos, saut, plane, liane
  function dessinerPipo(c, x, y, sens, mode, ph, plume, echelle) {
    c.save();
    c.translate(x, y);
    c.scale(sens * (echelle || 1), echelle || 1);
    const corps = '#5fc4b0', ventre = '#fff1cf', membrane = '#9fe3d2', bec = '#f6c453';
    const pc = couleurPlume(c, plume, -20, -40, 20, 0);
    c.lineCap = 'round'; c.lineJoin = 'round';
    // Pattes
    c.strokeStyle = '#e0904a'; c.lineWidth = 3;
    c.beginPath();
    if (mode === 'marche') { const a = Math.sin(ph * 15) * 5; c.moveTo(-4, -9); c.lineTo(-4 + a, 0); c.moveTo(4, -9); c.lineTo(4 - a, 0); }
    else if (mode === 'repos') { c.moveTo(-4, -9); c.lineTo(-5, 0); c.moveTo(4, -9); c.lineTo(5, 0); }
    else { c.moveTo(-4, -9); c.lineTo(-9, -4); c.moveTo(3, -9); c.lineTo(-1, -3); }
    c.stroke();
    // Aile du fond
    const battement = mode === 'saut' ? Math.sin(ph * 22) * 0.7 : 0;
    function aile(avant) {
      c.save();
      c.translate(-1, -20);
      if (mode === 'plane') c.rotate(avant ? -0.15 : -0.55);
      else if (mode === 'saut' || mode === 'liane') c.rotate(-0.6 + battement + (avant ? 0.2 : 0));
      else c.rotate(0.9);
      const long = mode === 'plane' ? 38 : (mode === 'saut' || mode === 'liane' ? 28 : 16);
      c.fillStyle = avant ? membrane : '#7fcfbd';
      c.beginPath(); c.moveTo(0, -3); c.quadraticCurveTo(-long * 0.5, -10, -long, -2); c.quadraticCurveTo(-long * 0.55, 2, -long * 0.6, 8); c.quadraticCurveTo(-long * 0.3, 4, 0, 6); c.closePath(); c.fill();
      c.fillStyle = pc;
      c.beginPath(); c.moveTo(-long, -2); c.lineTo(-long * 0.78, -7); c.lineTo(-long * 0.72, 1); c.closePath(); c.fill();
      c.restore();
    }
    aile(false);
    // Corps
    c.fillStyle = corps; ellipse(c, 0, -16, 13, 11);
    c.fillStyle = ventre; ellipse(c, 4, -13, 8, 7);
    // Queue
    c.fillStyle = corps; c.beginPath(); c.moveTo(-11, -16); c.lineTo(-22, -12); c.lineTo(-11, -11); c.fill();
    c.fillStyle = pc; c.beginPath(); c.moveTo(-22, -12); c.lineTo(-27, -15); c.lineTo(-26, -9); c.fill();
    // Tête
    c.fillStyle = corps; cercle(c, 10, -27, 9);
    // Crête
    c.fillStyle = pc; c.beginPath(); c.moveTo(6, -33); c.quadraticCurveTo(-6, -44, -12, -38); c.quadraticCurveTo(-2, -36, 4, -27); c.fill();
    // Bec
    c.fillStyle = bec; c.beginPath(); c.moveTo(15, -30); c.quadraticCurveTo(26, -27, 31, -23); c.quadraticCurveTo(24, -21, 15, -22); c.closePath(); c.fill();
    // Oeil
    c.fillStyle = '#fff'; cercle(c, 12.5, -29, 3.8);
    c.fillStyle = '#1d2240'; cercle(c, 13.5, -29, 2.1);
    c.fillStyle = '#fff'; cercle(c, 14.2, -29.8, 0.8);
    // Joue
    c.fillStyle = 'rgba(255,120,120,0.45)'; cercle(c, 9, -23, 2.6);
    aile(true);
    c.restore();
  }

  // Bébés dinosaures de l'album
  function dessinerBebe(c, espece, coul, x, y, s) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.fillStyle = 'rgba(0,0,0,0.12)'; ellipse(c, 0, 20, 24, 4);
    const fonce = 'rgba(0,0,0,0.18)';
    c.fillStyle = coul;
    const oeil = (ox, oy) => { c.fillStyle = '#fff'; cercle(c, ox, oy, 3.2); c.fillStyle = '#1d2240'; cercle(c, ox + 0.8, oy, 1.8); c.fillStyle = coul; };
    const pattes = (xs) => { for (const px of xs) { c.fillRect(px - 2.5, 8, 5, 11); } };
    if (espece === 'tri') {
      pattes([-12, -4, 6, 13]); ellipse(c, 0, 4, 18, 11);
      c.beginPath(); c.moveTo(-16, 2); c.lineTo(-28, 8); c.lineTo(-15, 9); c.fill();
      c.fillStyle = fonce; ellipse(c, 16, -6, 10, 12); c.fillStyle = coul; ellipse(c, 18, -2, 9, 8);
      c.fillStyle = '#fff6dd'; c.beginPath(); c.moveTo(18, -8); c.lineTo(22, -18); c.lineTo(21, -8); c.fill();
      c.beginPath(); c.moveTo(25, 0); c.lineTo(30, -5); c.lineTo(27, 2); c.fill();
      oeil(19, -3);
    } else if (espece === 'steg') {
      pattes([-11, -3, 6, 12]);
      c.fillStyle = '#f2a65a'; for (let k = 0; k < 4; k++) { c.beginPath(); c.moveTo(-12 + k * 7, -4); c.lineTo(-9 + k * 7, -15); c.lineTo(-5 + k * 7, -4); c.fill(); }
      c.fillStyle = coul; ellipse(c, 0, 4, 18, 10);
      c.beginPath(); c.moveTo(-16, 3); c.lineTo(-29, 0); c.lineTo(-16, 9); c.fill();
      ellipse(c, 19, 2, 7, 6); oeil(21, 0);
    } else if (espece === 'brach') {
      pattes([-9, -2, 6, 12]); ellipse(c, 0, 6, 16, 9);
      c.beginPath(); c.moveTo(-14, 5); c.lineTo(-27, 10); c.lineTo(-13, 11); c.fill();
      c.lineWidth = 7; c.strokeStyle = coul; c.beginPath(); c.moveTo(10, 2); c.quadraticCurveTo(16, -10, 13, -18); c.stroke();
      ellipse(c, 16, -20, 7, 5); oeil(18, -21);
    } else if (espece === 'anky') {
      pattes([-11, -4, 5, 11]); ellipse(c, 0, 6, 19, 8);
      c.fillStyle = fonce; for (let k = 0; k < 5; k++) cercle(c, -12 + k * 6, 0, 2.6);
      c.fillStyle = coul; c.beginPath(); c.moveTo(-17, 5); c.lineTo(-27, 4); c.lineTo(-17, 9); c.fill(); cercle(c, -28, 5, 4);
      ellipse(c, 19, 5, 7, 6); oeil(21, 3);
    } else if (espece === 'para') {
      pattes([-6, 6]); ellipse(c, 0, 3, 13, 11);
      c.beginPath(); c.moveTo(-10, 4); c.lineTo(-25, 12); c.lineTo(-9, 11); c.fill();
      ellipse(c, 11, -12, 8, 7);
      c.fillStyle = '#e57373'; c.lineWidth = 5; c.strokeStyle = '#e57373'; c.beginPath(); c.moveTo(9, -17); c.quadraticCurveTo(0, -24, -8, -22); c.stroke();
      c.fillStyle = coul; oeil(14, -13);
    } else if (espece === 'rex') {
      pattes([-4, 6]); ellipse(c, 0, 3, 12, 12);
      c.beginPath(); c.moveTo(-9, 6); c.lineTo(-26, 14); c.lineTo(-7, 13); c.fill();
      ellipse(c, 9, -12, 11, 8);
      c.strokeStyle = coul; c.lineWidth = 3; c.beginPath(); c.moveTo(8, 0); c.lineTo(13, 3); c.stroke();
      c.fillStyle = '#fff'; c.fillRect(12, -8, 2, 2); c.fillRect(16, -8, 2, 2);
      c.fillStyle = coul; oeil(12, -15);
    } else {
      c.fillStyle = 'rgba(255,255,255,0.6)';
      c.beginPath(); c.moveTo(-2, -2); c.quadraticCurveTo(-20, -18, -30, -8); c.quadraticCurveTo(-14, -4, -2, 6); c.fill();
      c.fillStyle = coul; ellipse(c, 0, 4, 11, 10); cercle(c, 9, -7, 7);
      c.fillStyle = '#f6c453'; c.beginPath(); c.moveTo(14, -9); c.lineTo(26, -5); c.lineTo(14, -4); c.fill();
      c.fillStyle = coul; c.beginPath(); c.moveTo(5, -12); c.lineTo(-6, -20); c.lineTo(3, -7); c.fill();
      oeil(11, -8);
    }
    c.restore();
  }
  function dessinerOeufAlbum(c, x, y, nb) {
    c.save(); c.translate(x, y);
    c.fillStyle = 'rgba(0,0,0,0.1)'; ellipse(c, 0, 24, 16, 3);
    if (nb === 0) { c.fillStyle = '#e8e3d8'; ellipse(c, 0, 4, 14, 19); c.strokeStyle = '#c9c2b2'; c.setLineDash([4, 4]); c.lineWidth = 2; c.beginPath(); c.ellipse(0, 4, 14, 19, 0, 0, Math.PI * 2); c.stroke(); c.setLineDash([]); }
    else {
      const g = c.createLinearGradient(-14, -15, 14, 23); g.addColorStop(0, '#fff3c4'); g.addColorStop(1, '#f2c14e');
      c.fillStyle = g; ellipse(c, 0, 4, 14, 19);
      c.fillStyle = 'rgba(255,255,255,0.7)'; ellipse(c, -5, -4, 3, 6, -0.3);
      c.fillStyle = 'rgba(190,130,30,0.35)'; cercle(c, 5, 10, 2.5); cercle(c, -4, 14, 2);
      if (nb === 2) { c.strokeStyle = '#8a5a12'; c.lineWidth = 1.8; c.beginPath(); c.moveTo(-12, 0); c.lineTo(-6, 4); c.lineTo(-1, -1); c.lineTo(4, 4); c.lineTo(9, -1); c.lineTo(13, 2); c.stroke(); }
    }
    c.restore();
  }

  // --- Ciel et fonds (coordonnées écran) ---
  const CIELS = {
    fougeres: ['#8fd8ee', '#e9f8d2'], marais: ['#9cc9bd', '#e6efd8'],
    volcans: ['#8c6fb0', '#ffc993'], glaciers: ['#bcdcf7', '#f4fbff']
  };
  function dessinerFond(pay, decX, decY, temps) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, CIELS[pay][0]); g.addColorStop(1, CIELS[pay][1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const e = ECH;
    // Soleil ou lune pâle
    ctx.fillStyle = pay === 'volcans' ? 'rgba(255,230,170,0.9)' : 'rgba(255,255,230,0.8)';
    cercle(ctx, W * 0.78, H * 0.16, 34 * e);
    const base = H * 0.62 - decY * 0.15 * e;
    // Lointain
    const lx = -(decX * 0.12 * e) % (600 * e);
    for (let k = -1; k < W / (600 * e) + 2; k++) {
      const x0 = lx + k * 600 * e;
      if (pay === 'volcans') {
        dessinerVolcan(x0 + 150 * e, base, 170 * e, '#7a6a96', temps, k);
        dessinerVolcan(x0 + 440 * e, base + 20 * e, 120 * e, '#8a78a2', temps, k + 3);
      } else if (pay === 'glaciers') {
        ctx.fillStyle = '#c5def3';
        ctx.beginPath(); ctx.moveTo(x0, base); ctx.lineTo(x0 + 140 * e, base - 190 * e); ctx.lineTo(x0 + 300 * e, base); ctx.lineTo(x0 + 420 * e, base - 140 * e); ctx.lineTo(x0 + 600 * e, base); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffffff';

      demoSol(c, coul, sol, 0, 520);
      c.fillStyle = '#bfe6ff'; rondRect(c, 220, 50, 100, 18, 8); c.fill();
      const gy = u < 0.35 ? 68 : Math.min(sol - 40, 68 + (u - 0.35) * 900);
      const tx = u > 0.2 && u < 0.35 ? Math.sin(t * 60) * 3 : 0;
      if (u < 0.6) { c.fillStyle = '#d9f1ff'; c.beginPath(); c.moveTo(258 + tx, gy); c.lineTo(282 + tx, gy); c.lineTo(270 + tx, gy + 40); c.closePath(); c.fill(); }
      else { c.fillStyle = '#d9f1ff'; for (let k = 0; k < 6; k++) cercle(c, 250 + k * 8, sol - 6, 4); }
      const x = u < 0.2 ? 40 + u / 0.2 * 110 : (u < 0.6 ? 150 : 150 + (u - 0.6) / 0.4 * 300);
      P(x, sol, 1, u > 0.2 && u < 0.6 ? 'repos' : 'marche');
      main(c, 440, u < 0.18 ? 70 : 70 + Math.min(1, (u - 0.18) / 0.1) * 60, u > 0.16 && u < 0.3 ? 1 : 0);
    } else if (type === 'vent') {
      demoSol(c, coul, sol, 0, 120); demoSol(c, coul, sol, 430, 520);
      c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 4; c.lineCap = 'round';
      for (let k = 0; k < 6; k++) { const vx = 120 + ((t * 160 + k * 60) % 310); const vy = 70 + k * 22; c.beginPath(); c.moveTo(vx, vy); c.lineTo(vx + 40, vy); c.stroke(); }
      const x = 40 + u * 440;
      let h = 0; if (x > 110 && x < 440) { const v = (x - 110) / 330; h = v < 0.15 ? sauteHaut(v / 0.3, 90) : 90 - (v - 0.15) * 100; }
      P(x, sol - Math.max(0, h), 1, x > 110 && x < 440 ? 'plane' : 'marche');
    }
  }
  function dessinerFeuilleDemo(c, x, y, ecrase) {
    const e = 1 - ecrase * 0.45;
    c.fillStyle = '#5fc04f'; c.beginPath(); c.moveTo(x - 40, y - 10 * e); c.quadraticCurveTo(x, y - 46 * e, x + 40, y - 10 * e); c.quadraticCurveTo(x, y + 4, x - 40, y - 10 * e); c.fill();
  }
  function dessinerNidDemo(c, x, y) {
    c.fillStyle = '#b08850'; ellipse(c, x, y - 18, 44, 18);
    c.strokeStyle = '#8a6630'; c.lineWidth = 3; for (let k = -3; k <= 3; k++) { c.beginPath(); c.moveTo(x + k * 11 - 8, y - 26); c.lineTo(x + k * 11 + 10, y - 10); c.stroke(); }
  }

  // ============================================================== Boucle
  let dernier = performance.now(), reste = 0;
  function boucle(maintenant) {
    let dt = (maintenant - dernier) / 1000; dernier = maintenant;
    if (dt > 0.05) dt = 0.05;
    if (etat !== 'pause') tempsGlobal += dt;
    if (chronoBandeau > 0) { chronoBandeau -= dt; if (chronoBandeau <= 0) $('bandeau').classList.remove('visible'); }

    if (etat === 'jeu' || etat === 'arrivee') {
      // Appui long : saut après un court instant (pour distinguer un glissement)
      const now = performance.now();
      for (const d of doigts.values()) if (!d.saute && !d.glisse && now - d.t0 > 90) { d.saute = true; demanderSaut(); }
      reste += dt;
      while (reste >= PAS) {
        reste -= PAS;
        J.temps += PAS;
        majObjets(PAS);
        if (etat === 'jeu') pasPipo(PAS);
        else if (etat === 'arrivee') pasArrivee(PAS);
        if (etat !== 'jeu' && etat !== 'arrivee') break;
      }
      secousse = Math.max(0, secousse - dt);
      if (J && p) suivreCamera(dt);
      const jauge = $('jauge-plein');
      if (p) jauge.style.width = Math.round(100 * Math.max(0, p.endurance) / ENDURANCE) + '%';
    } else reste = 0;

    if (J && p && (etat === 'jeu' || etat === 'pause' || etat === 'arrivee' || etat === 'tuto' || etat === 'fin')) dessinerJeu();
    else dessinerTitre(tempsGlobal);
    if (etat === 'tuto') {
      tutoChrono += dt;
      if (tutoChrono > 3.2 && tutoEtapes.length > 1) { tutoChrono = 0; tutoIndex = (tutoIndex + 1) % tutoEtapes.length; majTuto(); }
      dessinerDemo(tutoEtapes[tutoIndex][0], tutoChrono);
    }
    if (etat === 'plumes') {
      const a = $('apercu-plume').getContext('2d');
      a.setTransform(1, 0, 0, 1, 0, 0); a.clearRect(0, 0, 300, 220);
      a.setTransform(2, 0, 0, 2, 0, 0);
      dessinerPipo(a, 75, 82 + Math.sin(tempsGlobal * 2) * 4, 1, 'plane', tempsGlobal, prog.plume, 2);
    }
    requestAnimationFrame(boucle);
  }
  function pasArrivee(dt) {
    chronoArrivee += dt;
    p.phase += dt;
    // Pipo saute dans le nid
    const cible = J.nid.x - 30;
    p.x += (cible - p.x) * Math.min(1, dt * 3);
    p.y = J.nid.y - 30 - Math.abs(Math.sin(chronoArrivee * 5)) * 30;
    p.dir = 1;
    if (chronoArrivee > 1.5) afficherVictoire();
  }
  function suivreCamera(dt) {
    const devant = (p.marche || p.dir || 1) * VW * 0.12;
    let cx = p.x + devant - VW / 2;
    let cy = p.y - VH * 0.55;
    cx = Math.max(-T, Math.min(J.finX + T - VW, cx));
    cy = Math.min(J.basMonde - VH, cy);
    // dt très grand (début de niveau) : la caméra se place d'un coup
    cam.x += (cx - cam.x) * Math.min(1, dt * 4);
    cam.y += (cy - cam.y) * Math.min(1, dt * 3.5);
  }

  // ============================================================== Démarrage
  chargerProgres();
  majBoutonsSon();
  montrer('ecran-titre');
  requestAnimationFrame(boucle);
})();
</script>
