      c.fillStyle = '#5fb6f2'; c.beginPath(); c.moveTo(0, -24); c.quadraticCurveTo(10, -12, 0, -10); c.quadraticCurveTo(-10, -12, 0, -24); c.fill();
    } else if (cat === 'ombre') {
      c.fillStyle = '#ffe9a8'; rond(c, 14, -14, 9); c.fill();
      c.restore(); dessinerVehicule(c, 'voiture', x - k * 0.04, y + k * 0.12, k * 0.9, true); return;
    } else if (cat === 'ciel') {
      c.fillStyle = '#9fd3f5'; rond(c, 0, 0, 24); c.fill();
      c.fillStyle = '#fff'; [[-8, 6, 10], [4, 2, 12], [14, 8, 8], [-16, 10, 7]].forEach((p) => { rond(c, p[0], p[1], p[2]); c.fill(); });
      c.strokeStyle = '#3a3f4a'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-14, -12); c.quadraticCurveTo(-10, -16, -6, -12); c.quadraticCurveTo(-2, -16, 2, -12); c.stroke();
    } else if (cat === 'rails') {
      c.fillStyle = '#8a5a2b'; for (let i = 0; i < 4; i++) { const yy = -18 + i * 12, l = 10 + i * 4; c.fillRect(-l - 4, yy, (l + 4) * 2, 4); }
      c.strokeStyle = '#7a8494'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(-6, -22); c.lineTo(-22, 24); c.moveTo(6, -22); c.lineTo(22, 24); c.stroke();
    } else if (cat === 'devinette') {

      rond(c, -4, -4, 16); remplir(c, '#bfe6ff', '#3a3f4a', 5);
      c.fillStyle = 'rgba(255,255,255,.8)'; ell(c, -10, -10, 4, 6, -0.6); c.fill();
    } else if (cat === 'roues') {

      ligne(c, -12, 4, 14, 4, '#e0508c', 4);
    } else if (cat === 'rapide') {
      poly(c, [6, -26, -14, 4, -1, 4, -8, 26, 16, -6, 2, -6]); remplir(c, '#ffd84d', '#a87400', 2.5);
      ligne(c, -24, -10, -14, -10, '#7a8494', 3); ligne(c, -26, 0, -18, 0, '#7a8494', 3); ligne(c, -22, 10, -14, 10, '#7a8494', 3);
    } else if (cat === 'intrus') {
      c.fillStyle = '#2f6fe0'; rond(c, -12, -10, 9); c.fill(); rond(c, 12, -10, 9); c.fill(); rond(c, -12, 12, 9); c.fill();
      rr(c, 3, 3, 18, 18, 3); remplir(c, '#f39c1e', '#a8610a');

  // Locomotive d'un train (tournée vers la droite), boîte de 100 × 60.
  function dessinerLoco(c, type, coul, fonce, x, y, w) {
    c.save(); c.translate(x, y); c.scale(w / 100, w / 100); c.lineJoin = 'round'; c.lineWidth = 2;
    const roues = (l, r) => l.forEach((xx) => { c.fillStyle = '#2b2b33'; rond(c, xx, 18, r); c.fill(); c.fillStyle = '#c9ced6'; rond(c, xx, 18, r * 0.45); c.fill(); });
    if (type === 'vapeur') {
      rr(c, -16, -12, 50, 24, 11); remplir(c, coul, fonce);
      poly(c, [20, -12, 22, -30, 32, -30, 34, -12]); remplir(c, '#2b2b33');
      rr(c, -46, -26, 30, 38, 3); remplir(c, fonce); vitre(c, -40, -20, 16, 12, 2);
      rr(c, -50, -30, 38, 6, 2); remplir(c, '#2b2b33');
      poly(c, [34, 6, 50, 18, 34, 18]); remplir(c, '#9aa1ad');
      roues([-32, -8, 14], 9);
    } else if (type === 'diesel') {
      rr(c, -48, -22, 92, 34, 6); remplir(c, coul, fonce);
      c.fillStyle = '#fff'; c.fillRect(-46, 0, 88, 4);
      vitre(c, 22, -16, 16, 12, 2); vitre(c, -42, -16, 12, 10, 2);
      c.fillStyle = fonce; for (let i = 0; i < 4; i++) c.fillRect(-22 + i * 9, -16, 4, 12);
      roues([-34, -20, 20, 34], 7);
    } else if (type === 'electrique') {
      ligne(c, -14, -22, -6, -34, '#3a3f4a', 2.5); ligne(c, -6, -34, 2, -22, '#3a3f4a', 2.5); ligne(c, -14, -34, 2, -34, '#3a3f4a', 2.5);
      rr(c, -48, -22, 92, 34, 10); remplir(c, coul, fonce);
      c.fillStyle = '#ffe27a'; c.fillRect(-44, -2, 84, 3);
      vitre(c, 26, -16, 14, 12, 4); for (let i = 0; i < 3; i++) vitre(c, -40 + i * 18, -16, 12, 10, 2);
      roues([-34, -18, 18, 34], 7);
    } else if (type === 'rapide') {
      c.beginPath(); c.moveTo(-50, -16); c.lineTo(4, -16); c.quadraticCurveTo(46, -14, 50, 12); c.lineTo(-50, 12); c.closePath(); remplir(c, '#f4f6fb', fonce);
      c.fillStyle = coul; c.beginPath(); c.moveTo(-50, 0); c.lineTo(38, 0); c.quadraticCurveTo(46, 4, 49, 8); c.lineTo(-50, 8); c.closePath(); c.fill();
      c.fillStyle = '#2c3e70'; c.beginPath(); c.moveTo(8, -12); c.quadraticCurveTo(28, -11, 36, -3); c.lineTo(8, -3); c.closePath(); c.fill();
      c.fillRect(-46, -11, 44, 6);

      c.fillStyle = '#ff8fb5'; c.beginPath(); c.moveTo(24, -16); c.bezierCurveTo(18, -26, 26, -34, 30, -26); c.bezierCurveTo(34, -34, 42, -26, 36, -16); c.closePath(); c.fill();
      rr(c, -46, -30, 32, 42, 8); remplir(c, '#ffd84d', '#a87400'); vitre(c, -40, -24, 20, 14, 4);
      c.fillStyle = '#fff'; [[-4, -2], [10, 2], [24, -4]].forEach((p) => { rond(c, p[0], p[1], 3); c.fill(); });
      roues([-30, 2, 24], 12);

    c.restore();
  }

  // Wagon de queue d'un train (petit, couleur de la place).
  function dessinerWagonTrain(c, coul, fonce, x, y, w) {

  // Couronne dorée du chef du salon (le premier joueur arrivé), base centrée en (x, y).
  function couronne(c, x, y, k) {

  // Locomotive d'une place : la mienne est celle choisie dans la collection.
  function siegeMoi() { return partie ? partie.siege : (session === 'solo' ? 0 : -1); }
  function locoDe(s) { return s === siegeMoi() ? prog.loco : LOCO_PLACE[s]; }

  // ---------------------------------------------------------------------
  //  Le décor (un paysage tous les 5 niveaux) et les gares

  function sapin(c, x, y, k, neige) {
    c.fillStyle = '#6b4220'; c.fillRect(x - k * 0.08, y - k * 0.2, k * 0.16, k * 0.25);
    c.fillStyle = '#2c7a3f';
    [[0.95, 0.55], [0.75, 0.35], [0.55, 0.15]].forEach((p, i) => { poly(c, [x - k * p[1] * 0.9, y - k * (0.2 + i * 0.28), x, y - k * (p[0] + 0.1), x + k * p[1] * 0.9, y - k * (0.2 + i * 0.28)]); c.fill(); });
    if (neige) { c.fillStyle = '#fff'; poly(c, [x - k * 0.14, y - k * 0.82, x, y - k * 1.05, x + k * 0.14, y - k * 0.82]); c.fill(); }
  }
  function arbre(c, x, y, k) {
    c.fillStyle = '#7a5230'; c.fillRect(x - k * 0.08, y - k * 0.35, k * 0.16, k * 0.4);
    c.fillStyle = '#3f9a4c'; rond(c, x, y - k * 0.6, k * 0.38); c.fill();
    c.fillStyle = '#5cbf5f'; rond(c, x - k * 0.12, y - k * 0.7, k * 0.2); c.fill();
  }
  function immeuble(c, x, y, l, h, coul) {
    c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(x + 4, y - h + 4, l, h);
    c.fillStyle = coul; c.fillRect(x, y - h, l, h);
    c.fillStyle = '#fff6c9';
    for (let r = y - h + 6; r < y - 10; r += 12) for (let q = x + 5; q < x + l - 6; q += 11) c.fillRect(q, r, 6, 7);
    c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(x, y - h, l, 3);
  }

  // Fond du plateau selon le paysage, dessiné une fois (toile hors écran).
  const fondCache = { cle: '', toile: document.createElement('canvas') };
  function fondPlateau(pay, w, h, dpr) {
    const cle = pay + '|' + w + '|' + h + '|' + dpr;
    if (fondCache.cle === cle) return fondCache.toile;
    const cv = fondCache.toile;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const al = graineHasard(31 + pay * 7);
    const m = Math.min(w, h);
    if (pay === 0) { // campagne
      c.fillStyle = '#9fd17a'; c.fillRect(0, 0, w, h);
      for (let i = 0; i < 9; i++) { c.fillStyle = ['#b4de8a', '#8cc66a', '#c8e59a', '#e6d27a'][i % 4]; c.save(); c.translate(al() * w, al() * h); c.rotate(al() - 0.5); c.fillRect(-m * 0.16, -m * 0.08, m * 0.32, m * 0.16); c.restore(); }
      c.fillStyle = '#6cc0ef'; ell(c, w * 0.14, h * 0.52, m * 0.08, m * 0.05); c.fill();
      for (let i = 0; i < 14; i++) arbre(c, al() * w, al() * h, m * 0.07);
      for (let i = 0; i < 40; i++) { c.fillStyle = ['#fff', '#ffd84d', '#ff8fb5'][i % 3]; rond(c, al() * w, al() * h, 2.2); c.fill(); }
    } else if (pay === 1) { // montagne
      c.fillStyle = '#c9dfc1'; c.fillRect(0, 0, w, h);
      const pic = (x, y, k) => { c.fillStyle = '#8c97a6'; poly(c, [x - k, y, x, y - k * 1.3, x + k, y]); c.fill(); c.fillStyle = '#fff'; poly(c, [x - k * 0.33, y - k * 0.87, x, y - k * 1.3, x + k * 0.33, y - k * 0.87, x + k * 0.1, y - k * 0.78, x - k * 0.1, y - k * 0.9]); c.fill(); };
      for (let i = 0; i < 7; i++) pic(al() * w, h * (0.1 + al() * 0.85), m * (0.09 + al() * 0.06));
      for (let i = 0; i < 16; i++) { c.fillStyle = 'rgba(255,255,255,.75)'; ell(c, al() * w, al() * h, m * 0.06, m * 0.025); c.fill(); }
      for (let i = 0; i < 18; i++) sapin(c, al() * w, al() * h, m * 0.08, al() < 0.5);
    } else if (pay === 2) { // port
      c.fillStyle = '#e8d9a6'; c.fillRect(0, 0, w, h);
      c.fillStyle = '#4aa8e0'; c.fillRect(0, h * 0.78, w, h * 0.22); c.fillRect(0, 0, w * 0.1, h); c.fillRect(w * 0.9, 0, w * 0.1, h);
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 2;
      for (let i = 0; i < 24; i++) { const x = al() * w, y = h * 0.8 + al() * h * 0.2; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 6, y - 4, x + 12, y); c.stroke(); }
      c.fillStyle = '#a8723a'; c.fillRect(w * 0.3, h * 0.72, w * 0.14, h * 0.09); c.fillRect(w * 0.6, h * 0.72, w * 0.12, h * 0.09);
      dessinerVehicule(c, 'voilier', w * 0.36, h * 0.88, m * 0.12);
      dessinerVehicule(c, 'cargo', w * 0.72, h * 0.9, m * 0.16);
      for (let i = 0; i < 10; i++) { const cols = ['#e5483b', '#f6c21c', '#2f6fe0', '#1d9a55']; c.fillStyle = cols[i % 4]; c.fillRect(w * 0.12 + al() * w * 0.74, h * (0.05 + al() * 0.6), m * 0.06, m * 0.035); }
      for (let i = 0; i < 8; i++) arbre(c, w * 0.12 + al() * w * 0.76, al() * h * 0.7, m * 0.06);
    } else { // ville
      c.fillStyle = '#d9d4c4'; c.fillRect(0, 0, w, h);
      c.fillStyle = '#b9b4a6'; c.fillRect(0, h * 0.5 - 6, w, 12); c.fillRect(w * 0.5 - 6, 0, 12, h);
      const cols = ['#e8a87c', '#9ec5e8', '#f2d27a', '#c7a6e6', '#9fd6b0', '#f0a3a3'];
      for (let i = 0; i < 16; i++) immeuble(c, al() * w, al() * h + m * 0.15, m * (0.08 + al() * 0.06), m * (0.1 + al() * 0.12), cols[i % 6]);
      for (let i = 0; i < 10; i++) arbre(c, al() * w, al() * h, m * 0.06);
    }
    fondCache.cle = cle;
    return cv;
  }

  // Petite gare d'un joueur, dans son coin.
  function petiteGare(c, x, y, k, s) {
    c.fillStyle = 'rgba(0,0,0,.18)'; ell(c, x + k * 0.05, y + k * 0.42, k * 0.62, k * 0.16); c.fill();
    rr(c, -0.5 * k + x, y - 0.1 * k, k, k * 0.5, k * 0.05); remplir(c, '#fff6e0', '#8a6a40', 2);
    poly(c, [x - k * 0.62, y - 0.08 * k, x, y - k * 0.55, x + k * 0.62, y - 0.08 * k]); remplir(c, COUL[s], COUL_F[s], 2);
    rr(c, x - k * 0.12, y + k * 0.1, k * 0.24, k * 0.3, k * 0.04); remplir(c, '#8a5a2b');
    vitre(c, x - k * 0.4, y + k * 0.04, k * 0.18, k * 0.16, 2); vitre(c, x + k * 0.22, y + k * 0.04, k * 0.18, k * 0.16, 2);
    ligne(c, x + k * 0.5, y - k * 0.1, x + k * 0.5, y - k * 0.75, '#5a4630', 2);
    c.fillStyle = COUL[s]; poly(c, [x + k * 0.5, y - k * 0.75, x + k * 0.82, y - k * 0.66, x + k * 0.5, y - k * 0.57]); c.fill();
  }

  // Grande gare centrale avec son horloge (aiguilles seulement, sans chiffres).
  function grandeGare(c, x, y, k, t) {
    c.fillStyle = 'rgba(0,0,0,.2)'; ell(c, x + k * 0.05, y + k * 0.58, k * 1.1, k * 0.22); c.fill();
    rr(c, x - k, y - k * 0.2, k * 2, k * 0.75, k * 0.06); remplir(c, '#f4e3c3', '#8a6a40', 2.5);
    rr(c, x - k * 0.45, y - k * 0.75, k * 0.9, k * 0.6, k * 0.05); remplir(c, '#f4e3c3', '#8a6a40', 2.5);
    poly(c, [x - k * 0.55, y - k * 0.72, x, y - k * 1.15, x + k * 0.55, y - k * 0.72]); remplir(c, '#5a6c86', '#2d3a4f', 2.5);
    poly(c, [x - k * 1.1, y - k * 0.18, x - k * 0.45, y - k * 0.5, x - k * 0.45, y - k * 0.18]); remplir(c, '#5a6c86', '#2d3a4f', 2);
    poly(c, [x + k * 1.1, y - k * 0.18, x + k * 0.45, y - k * 0.5, x + k * 0.45, y - k * 0.18]); remplir(c, '#5a6c86', '#2d3a4f', 2);
    for (let i = 0; i < 4; i++) {
      const ax = x - k * 0.82 + i * k * 0.45;
      c.fillStyle = '#7fb6e6'; c.beginPath(); c.moveTo(ax, y + k * 0.5); c.lineTo(ax, y + k * 0.12); c.arc(ax + k * 0.14, y + k * 0.12, k * 0.14, Math.PI, 0); c.lineTo(ax + k * 0.28, y + k * 0.5); c.closePath(); c.fill();
      c.fillStyle = COUL[i]; c.fillRect(ax, y + k * 0.46, k * 0.28, k * 0.06);
    }
    // horloge
    const hx = x, hy = y - k * 0.45, hr = k * 0.22;

  // ---------------------------------------------------------------------

  function geometrie(w, h) {

      const E = { x: C.x + sx * rs * 1.1, y: C.y + sy * rs * 0.28 };

    if (resAutre && performance.now() < resAutre.jusqua) return { mode: 'res' };
    const moi = partie.siege, s = e.tour;
    if (e.ph === 'c') return { mode: 'wagons', s: s, moi: s === moi };
    if (e.ph === 'q') return s === moi ? { mode: 'wagons', s: s, moi: true } : { mode: 'q', s: s };
    if (e.ph === 'a') return { mode: 'aig', s: s, moi: s === moi };
    return { mode: 'vide' };

    if (e.ph === 'q' && e.q) {
      const cle = 'q' + e.tt + ':' + e.q.c + ':' + e.q.ch.join(',');

    if (e.ph === 'a') {

  // Résultat de ma réponse : bonne réponse en vert, erreur secouée.
  function montrerMonResultat(avant, d) {
    if (!maQ) return;
    const okI = avant.q.ok;
    document.querySelectorAll('#q-choix .choix').forEach((b, k) => {
      b.disabled = true; b.classList.remove('cache'); b.setAttribute('aria-label', tr('vehicule.' + avant.q.ch[k]));

    let texte;
    if (d.k === 'ok') {
      if (d.w === 'x' && d.g > 0) texte = tr('res.express', { n: d.g });

      else if (d.g === 0) texte = tr('res.pontDemi');

      else texte = tr('res.bon');

      const b = document.createElement('button');

      const cv = document.createElement('canvas'); cv.width = 140; cv.height = 80; peindreLoco(cv, c);
      const nom = document.createElement('span'); nom.textContent = nomCourt(c);
      const reste = document.createElement('span'); reste.textContent = tr('aig.reste', { n: O.reste(e, c) });
      b.append(cv, nom, reste);
      b.setAttribute('aria-label', nomCourt(c) + ' · ' + reste.textContent);
      b.disabled = ok.indexOf(c) < 0;
      b.addEventListener('click', () => {
        audio();
        if (!partie || enPause || !partie.monTour() || vue.ph !== 'a' || maQ.envoye) return;
        if (partie.jouer({ t: 'a', c: c })) { maQ.envoye = true; sons.clic(); grille.querySelectorAll('button').forEach((x) => { x.disabled = true; }); }
      });
      grille.appendChild(b);
    }
    boite.appendChild(grille);
    $('q-res').textContent = '';
    $('q-bas').textContent = '';
    maQ = { cle: cle, q: null, debut: performance.now(), cache: true, res: null, jusqua: 0, envoye: false };
    $('question').classList.add('actif');
    sons.aiguillage();
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    const now = performance.now();
    for (let i = aFaire.length - 1; i >= 0; i--) {
      const a = aFaire[i];
      if (a.j !== jeton) { aFaire.splice(i, 1); continue; }
      if (a.t <= now) { aFaire.splice(i, 1); try { a.f(); } catch (e) { /* effet perdu */ } }
    }
    if (maQ && maQ.q && maQ.q.tun && !maQ.cache && !maQ.res && vue && now - maQ.debut > vue.cfg.flash) cacherChoix();
    if (maQ && maQ.res && now > maQ.jusqua) { maQ.res = null; maQ.cle = ''; fermerQuestion(); majQuestion(); }
    if (resAutre && now >= resAutre.jusqua && !resAutre.fini) { resAutre.fini = true; majPanneau(); }
    dessinerJeu(now, dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    const cle = w + 'x' + h;
    if (cle !== geoCle) { geo = geometrie(w, h); geoCle = cle; }
    for (let s = 0; s < PLACES; s++) {
      const cible = vue.pos[s];
      posAff[s] += (cible - posAff[s]) * Math.min(1, dt * 3.2);
      if (Math.abs(cible - posAff[s]) < 0.01) posAff[s] = cible;
    }
    const tour = partie && partie.phase === 'jeu' && !attenteTuto ? vue.tour : -1;
    dessinerPlateau(c, vue, geo, { t: t, anims: anims, posAff: posAff, lueur: tour, moi: partie ? partie.siege : -1, dpr: dpr });
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 380 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * 0.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function jaillir(x, y, coul, nbre) {
    for (let k = 0; k < (nbre || 12); k++) {
      const a = Math.random() * Math.PI * 2, v = 70 + Math.random() * 150;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 140, vie: 0.6 + Math.random() * 0.4, k: 4 + Math.random() * 4, coul: k % 2 ? coul : '#ffe066', etoile: k % 3 !== 0 });
    }
  }
  function pointCase(s, k) {
    if (!geo || !vue) return null;
    const voie = vue.voie[s];
    return surCase(geo, s, voie, Math.max(0, Math.min(voie.length - 1, k)), 0.5);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function remettreVue() {
    vue = partie && partie.etat ? copie(partie.etat) : null;
    anims = { rails: {}, barr: {} };
    posAff = vue ? vue.pos.slice() : [0, 0, 0, 0];
    resAutre = null;
    panneauCle = '';
    fondCache.cle = '';
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    remettreVue();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    fermerQuestion();
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + locoDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 128, 104);
        c.fillStyle = COUL[s]; rr(c, 6, 30, 116, 68, 16); c.fill();
        c.fillStyle = 'rgba(255,255,255,.85)'; rr(c, 12, 36, 104, 56, 12); c.fill();
        dessinerLoco(c, locoDe(s), COUL[s], COUL_F[s], 64, 64, 96);
        if (info.chef) couronne(c, 64, 30, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { train: nomTrain(s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { train: nomChef ? nomChef + ' · ' + nomTrain(partie.chef) : nomTrain(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    aFaire = [];
    remettreVue();
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    fermerQuestion();
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    if (vue && vue.tour === partie.siege) sons.tour();
  }

  function surAction(ev) {
    const t = performance.now();
    const a = ev.action, s = ev.siege, av = ev.avant, ap = ev.apres;
    vue = copie(ap);
    debutTour = Date.now();
    dernierTic = -1;
    const moi = partie.siege;
    if (resAutre && a.t !== 'r') resAutre.jusqua = Math.min(resAutre.jusqua, t);
    if (a.t === 'w') {
      if (!ev.moi) sons.wagon();
    } else if (a.t === 'r') {
      const d = ap.der;
      if (ev.moi && maQ && maQ.q) montrerMonResultat(av, d);
      else if (ev.moi) toast(d.k === 'ok' ? tr('res.bon') : tr('res.faux', { vehicule: tr('vehicule.' + d.v) }));
      else {
        resAutre = { id: t, s: s, q: av.q, i: d.i, ok: d.k === 'ok', g: d.g, jusqua: t + (ap.tour === moi && ap.ph === 'c' ? 1100 : 1800) };
        panneauCle = '';
      }
      if (d.k === 'ok') {
        if (ev.moi) sons.bon(); else note(880, 0.12, { type: 'triangle', vol: 0.06 });
        // rails posés un à un, avec étincelles
        for (let k = av.pos[s], j = 0; k < ap.pos[s]; k++, j++) {
          anims.rails[s + ':' + k] = t + 200 + j * 260;
          const kk = k;
          plusTard(200 + j * 260, () => { sons.rail(); const p = pointCase(s, kk); if (p) jaillir(p.x, p.y, COUL[s], ev.moi ? 14 : 8); });
        }
        if (d.pont) plusTard(150, sons.pont);
        if (d.ouvre) { const seg = av.voie[s][av.pos[s]]; if (seg && seg.charAt(0) === 'x') anims.barr[s + ':' + seg.slice(1)] = t; plusTard(100, sons.barriere); }
        if (d.ferme >= 0) {
          const I = d.ferme, autre = I === s ? (s + 1) % 4 : I;
          anims.barr[autre + ':' + I] = t + 400;
          plusTard(400, sons.barriere);
          if (autre === moi) plusTard(500, () => toast(tr('pn.toi', { nom: nomCourt(s) })));
        }
        if (ap.pos[s] > av.pos[s]) { const carte = $('place-' + s); carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }
      } else {
        if (ev.moi) sons.faux(); else note(220, 0.14, { type: 'triangle', vol: 0.05 });
      }
    } else if (a.t === 'a') {
      const d = ap.der;
      sons.aiguillage();
      const p = pointCase(d.c, d.ou);
      if (p) jaillir(p.x, p.y, COUL[s], 16);
      if (d.c === moi) toast(tr('aig.toi', { nom: nomCourt(s) }), 3000);
      else if (s === moi) toast(tr('aig.fait', { nom: nomCourt(d.c) }));
      else toast(tr('aig.autre', { nom: nomCourt(s), cible: nomCourt(d.c) }));
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (ev.auto && ev.moi) { maQ = null; fermerQuestion(); }
    if (partie.phase === 'jeu' && ap.tour === moi && av.tour !== moi && ap.fini < 0) plusTard(a.t === 'r' && !ev.moi ? 900 : 200, sons.tour);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    panneauCle = '';
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    if (geo && partie.etat && partie.etat.fini >= 0) jaillir(geo.C.x, geo.C.y, COUL[partie.etat.fini], 30);
    sons.sifflet();
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      maQ = null; fermerQuestion();
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: Math.max(1, partie.manche) });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pct, gagne) {
    if (!gagne) return 0;
    return pct >= 85 ? 3 : pct >= 60 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 92; cv.height = 52; peindreLoco(cv, s);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomTrain(s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.rails', { n: e.pos[s], total: e.voie[s].length });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    const bon = moi >= 0 ? e.bon[moi] : 0, rep = moi >= 0 ? e.rep[moi] : 0;
    const pct = rep ? Math.round(bon / rep * 100) : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.bonnes', { n: bon, total: rep, p: pct }) : '';
    const cadeau = $('fin-cadeau');
    cadeau.textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pct, gagne);
      const ancienRecord = prog.records[i];
      const record = gagne && pct > ancienRecord;
      let debloque = false;
      if (gagne) {
        const locosAvant = LOCOS.filter((l) => locoDebloquee(l.id)).length;
        if (record) prog.records[i] = pct;
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        if (prog.autos.indexOf(i) < 0) {
          prog.autos.push(i);
          const id = AUTOCOLLANTS[i];
          cadeau.append(canvasVehicule(id, 128, 90, false), document.createTextNode(tr('fin.autocollant', { nom: tr('vehicule.' + id) })));
        }
        const nouvelles = LOCOS.filter((l) => locoDebloquee(l.id));
        if (nouvelles.length > locosAvant) {
          const l = nouvelles[nouvelles.length - 1];
          const cv = document.createElement('canvas'); cv.width = 128; cv.height = 76;
          dessinerLoco(cv.getContext('2d'), l.id, COUL[0], COUL_F[0], 64, 36, 116);
          const ligne2 = document.createElement('span'); ligne2.textContent = tr('fin.loco', { nom: tr('loco.' + l.id) });
          cadeau.append(cv, ligne2);
        }
        sauver(Math.min(niveau + 1, NIVEAUX.length), bon);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr('fin.perdu', { nom: nomTrain(res ? res.classement[0] : 0) });
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord', { p: pct }) : (prog.records[i] ? tr('fin.record', { p: prog.records[i] }) : (gagne ? '' : tr('fin.conseil')));
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: Math.max(1, partie.manche) });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';

  // Compte à rebours avant la manche suivante (partie en ligne repassée sur l'appareil).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));

    } else lancerNiveau();

  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3a2a14'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }
  // Main qui va de (x0, y0) vers (x1, y1) entre t0 et t1, puis appuie.
  function geste(c, t, t0, t1, x0, y0, x1, y1) {
    if (t < t0) { main(c, x0, y0, 1.4, 0); return; }
    const q = Math.min(1, (t - t0) / (t1 - t0)), e = q * q * (3 - 2 * q);
    const appui = t > t1 && t < t1 + 300 ? Math.sin((t - t1) / 300 * Math.PI) : 0;
    main(c, x0 + (x1 - x0) * e, y0 + (y1 - y0) * e, 1.4, appui);
  }
  function wagonDemo(c, x, y, cat, type, leve) {
    c.save(); c.translate(x, y - (leve ? 10 : 0));
    rr(c, -52, -40, 104, 74, 12); remplir(c, type === 'x' ? '#ffd34d' : type === 'a' ? '#b8d4ff' : '#fffaf0', leve ? '#ffd84d' : '#2d3a4f', leve ? 5 : 3);
    dessinerSorte(c, cat, 0, -4, 52);
    c.fillStyle = '#2d3a4f'; rond(c, -30, 38, 9); c.fill(); rond(c, 30, 38, 9); c.fill();
    if (type === 'a') { c.strokeStyle = '#2f5fd0'; c.lineWidth = 4; c.beginPath(); c.moveTo(-14, 26); c.lineTo(0, 14); c.lineTo(14, 26); c.moveTo(0, 14); c.lineTo(0, 4); c.stroke(); }
    c.restore();
  }
  function carteDemo(c, x, y, id, etat, ombre) {
    c.save(); c.translate(x, y);
    rr(c, -62, -46, 124, 92, 14); remplir(c, etat === 'bon' ? '#e3fbe0' : '#fff', etat === 'bon' ? '#2e9c3b' : '#b7c3d4', etat === 'bon' ? 5 : 3);
    if (etat === 'cache') {
      c.fillStyle = '#2b2320'; rr(c, -58, -42, 116, 84, 12); c.fill();
      c.fillStyle = '#7d6a58'; c.beginPath(); c.arc(0, 42, 50, Math.PI, 0); c.lineTo(58, 42); c.lineTo(58, -42); c.lineTo(-58, -42); c.lineTo(-58, 42); c.closePath(); c.fill();
      c.fillStyle = '#1e1714'; c.beginPath(); c.arc(0, 42, 40, Math.PI, 0); c.fill();
    } else dessinerVehicule(c, id, 0, 0, 104, ombre);
    c.restore();
  }
  // Petite voie droite de n cases, de x0 à x1 ; types : tunnel, pont, passage.
  function voieDemo(c, x0, x1, y, n, posees, types, s, pa, opt) {
    opt = opt || {};
    const L = (x1 - x0) / n;
    for (let k = 0; k < n; k++) {
      const a = x0 + k * L, ty = types[k] || 'n';
      if (ty === 'p') { c.fillStyle = '#4aa8e0'; ell(c, a + L / 2, y, L * 0.45, 26); c.fill(); c.fillStyle = '#a8723a'; c.fillRect(a, y - 13, L, 26); }
      if (ty === 'x') { c.fillStyle = '#6b6f78'; c.fillRect(a + L * 0.3, y - 36, L * 0.4, 72); }
      c.fillStyle = k < posees ? '#c6b089' : 'rgba(255,255,255,.55)';
      c.fillRect(a + 2, y - 9, L - 4, 18);
      if (k < posees) {
        c.fillStyle = '#8a5a2b'; for (let i = 0; i < 4; i++) c.fillRect(a + 6 + i * (L - 12) / 3 - 3, y - 11, 6, 22);
        c.fillStyle = '#6b7280'; c.fillRect(a, y - 6, L, 3); c.fillRect(a, y + 3, L, 3);
      }
      if (ty === 't') { c.fillStyle = '#7d9a5c'; ell(c, a + L / 2, y - 6, L * 0.48, 28); c.fill(); c.fillStyle = '#1e1714'; c.beginPath(); c.arc(a + 6, y + 9, 12, Math.PI, 0); c.fill(); c.beginPath(); c.arc(a + L - 6, y + 9, 12, Math.PI, 0); c.fill(); }
      if (ty === 'x' && opt.barriere !== undefined) {
        const ang = opt.barriere;
        c.save(); c.translate(a + L * 0.24, y + 22); c.rotate(-Math.PI / 2 * (1 - ang));
        c.fillStyle = '#fff'; c.fillRect(0, -4, 44, 8); c.fillStyle = '#e0453a'; c.fillRect(8, -4, 8, 8); c.fillRect(26, -4, 8, 8);
        c.restore();
      }
    }
    if (pa !== null && pa !== undefined) dessinerLoco(c, LOCO_PLACE[s], COUL[s], COUL_F[s], x0 + pa * L, y - 18, 70);
  }
  function coche(c, x, y, k) { rond(c, x, y, k); remplir(c, '#3fae4a', '#fff', 3); c.strokeStyle = '#fff'; c.lineWidth = k * 0.25; c.beginPath(); c.moveTo(x - k * 0.45, y); c.lineTo(x - k * 0.1, y + k * 0.35); c.lineTo(x + k * 0.5, y - k * 0.35); c.stroke(); }

      c.setTransform(1, 0, 0, 1, 0, 0);
      const g = c.createLinearGradient(0, 0, 0, 360); g.addColorStop(0, '#dff4ff'); g.addColorStop(1, '#cfe9b8');
      c.fillStyle = g; c.fillRect(0, 0, 560, 360);
      try { d.dessin(c, ecoule); } catch (e) { /* dessin impossible */ }
      idAnim = requestAnimationFrame(image);

    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    clavier = true;
    const chiffre = /^(Digit|Numpad)([1-4])$/.exec(ev.code);
    if (chiffre) {
      ev.preventDefault(); audio();
      const k = +chiffre[2] - 1;
      if ($('question').classList.contains('actif')) { const b = document.querySelectorAll('#q-choix button')[k]; if (b && !b.disabled) b.click(); }
      else choisirWagon(k);
      return;
    }
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight' || ev.code === 'ArrowUp' || ev.code === 'ArrowDown') {
      const l = groupeActif();
      if (!l.length) return;
      ev.preventDefault(); audio();
      const i = l.indexOf(document.activeElement);
      const pas = ev.code === 'ArrowLeft' || ev.code === 'ArrowUp' ? -1 : 1;
      const b = l[i < 0 ? 0 : (i + pas + l.length) % l.length];
      try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ }
      sons.clic();
      return;
    }
    if ((ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) {
      const l = groupeActif();
      if (l.length) { ev.preventDefault(); try { l[0].focus({ preventScroll: true }); } catch (e) { /* rien */ } }
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-collection').addEventListener('click', () => { audio(); sons.clic(); ouvrirCollection(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('col-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.bon[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
