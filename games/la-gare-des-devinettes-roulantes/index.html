<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec

  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +

    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },

    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)

      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();

    });

    });
    bouton.addEventListener('keydown', function (e) {

    });

    var element = boite;

      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];

        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');

        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';

  var PREFIXE = 'save_';

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé

    var donnees = window.JEL_SAUVEGARDES;

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },

    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +

    var s = this.sieges.indexOf(cle);
    if (s < 0) return;
    this.sieges[s] = null;
    this.envoyerSieges();
    if (this.echeance && this.echeance.siege === s) {
      this.echeance = null;
      this.avancer(0);
    }
  };

  Arbitre.prototype.valide = function (s, a) {
    if (a === undefined || this.phase !== 'jeu') return false;
    try { return this.r.valide(copie(this.etat), s, copie(a)) === true; } catch (e) { return false; }
  };

  // Applique une action (déjà contrôlée) et l'annonce à tous.
  Arbitre.prototype.appliquer = function (s, a, auto) {
    var g = nouvelleGraine(this.alea.bind(this));
    this.etat = this.r.jouer(copie(this.etat), s, copie(a), hasard(g));
    this.n += 1;
    var m = { t: 'action', n: this.n, s: s, a: a, g: g };
    if (auto) m.auto = true;
    this.envoyer(null, m);
  };

  // Coup d'un robot (à sa place, ou à celle d'un vrai joueur trop long : auto).
  // Un robot qui ne trouve aucune action permise arrête la manche (règles fautives).
  Arbitre.prototype.jouerRobot = function (s, auto) {
    var a;
    try { a = this.r.bot(copie(this.etat), s, this.alea.bind(this), this.force()); } catch (e) { a = undefined; }
    if (!this.valide(s, a)) { this.finirManche(0); return false; }
    this.appliquer(s, a, auto);
    return true;
  };

  // Fait jouer les robots tant que c'est à eux, jusqu'au tour d'un vrai joueur
  // ou à la fin de la manche. delai : temps d'affichage des coups déjà annoncés.
  Arbitre.prototype.avancer = function (delai) {
    var tours = 0;
    while (this.phase === 'jeu') {
      if (this.r.fin(this.etat)) { this.finirManche(delai); return; }
      if (this.estVide()) return;            // plus personne : la partie va être fermée
      var s = this.r.aQui(this.etat);
      if (!(Number.isInteger(s) && s >= 0 && s < this.places)) { this.finirManche(delai); return; }
      if (this.sieges[s] !== null) {
        var d = this.reglages.delaiJoueur !== undefined ? this.reglages.delaiJoueur : this.r.delaiJoueur;
        this.echeance = isFinite(d) ? { siege: s, quand: this.maintenant() + delai + d } : null;
        return;
      }
      if (!this.jouerRobot(s, false)) return;
      delai += this.r.delaiBot;
      if (++tours > TOURS_MAX) { this.finirManche(delai); return; }
    }
  };

  Arbitre.prototype.finirManche = function (delai) {
    if (this.reglages.salon) { this.ouvrirSalon(delai); return; }
    this.phase = 'pause';
    this.echeance = null;
    this.finManche = this.maintenant() + delai + this.r.pauseManche;
  };

  // Message d'un vrai joueur (déjà lu en JSON).
  Arbitre.prototype.recevoir = function (cle, m) {
    if (!m || typeof m !== 'object') return;
    var s = this.sieges.indexOf(cle);
    if (m.t === 'resync') { this.bienvenue(cle, s); return; }
    // Le chef lance la manche depuis le salon (les autres attendent).
    if (m.t === 'lancer') {
      if (this.phase === 'salon' && cle === this.chef()) this.nouvelleManche();
      return;
    }
    if (m.t !== 'action') return;
    if (s < 0 || this.phase !== 'jeu' || m.n !== this.n || this.r.aQui(this.etat) !== s || !this.valide(s, m.a)) {
      this.envoyer(cle, { t: 'refus', n: this.n });
      return;
    }
    this.echeance = null;
    this.appliquer(s, m.a, false);
    this.avancer(0);
  };

  // Heure du prochain réveil utile (ms), ou null.
  Arbitre.prototype.prochainReveil = function () {
    if (this.phase === 'pause' && this.reglages.enchainer !== false) return this.finManche;
    if (this.phase === 'salon') return this.salonDepuis + this.r.attenteSalon;
    if (this.phase === 'jeu' && this.echeance) return this.echeance.quand;
    return null;
  };

  // Réveil (alarme) : nouvelle manche après la pause ou au bout du salon, ou
  // robot qui joue à la place d'un vrai joueur resté trop longtemps sans jouer.
  Arbitre.prototype.reveil = function () {
    var t = this.maintenant();
    if (this.phase === 'salon' && t >= this.salonDepuis + this.r.attenteSalon) {
      if (!this.estVide()) this.nouvelleManche();
      return;
    }
    if (this.phase === 'pause' && this.reglages.enchainer !== false && t >= this.finManche) {
      if (!this.estVide()) this.nouvelleManche();
      return;
    }
    if (this.phase === 'jeu' && this.echeance && t >= this.echeance.quand) {
      var s = this.echeance.siege;
      this.echeance = null;
      if (this.r.aQui(this.etat) === s && this.jouerRobot(s, true)) this.avancer(this.r.delaiBot);
    }
  };

  // --- Partie, côté jeu -----------------------------------------------------
  // o : {
  //   regles        window.JEL_REGLES
  //   surEvenement  function (e) : { type: 'mode', mode, raison } ('connexion', 'en-ligne', 'solo') ;
  //                 { type: 'debut', reste } (arrivée dans une partie : etat, siege, sieges,
  //                 phase : 'salon' le plus souvent) ;
  //                 { type: 'salon', reste } (salon d'attente, en ligne : avant la 1re manche et
  //                 après chacune ; le chef peut lancer, sinon lancement seul dans reste ms) ;
  //                 { type: 'manche' } (nouvelle manche, etat de départ) ;
  //                 { type: 'action', siege, action, avant, apres, auto, moi } ;
  //                 { type: 'fin', resultat } (fin(etat) des règles) ;
  //                 { type: 'sieges' } (un vrai joueur arrive ou part, ou le chef change) ; { type: 'refus' }
  //   enLigne       false : directement contre des robots sur l'appareil (sinon : en ligne
  //                 si le lanceur du site le permet, robots locaux à défaut)
  //   force         force des robots locaux (0 à 1)
  //   options       options des manches locales (ex. { niveau: 3 })
  //   enchainer     false : pas de nouvelle manche automatique en solo (jeu à niveaux)
  // }
  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),
  // partie.phase ('attente', 'salon', 'jeu', 'pause'), partie.sieges() ([{ humain, moi, chef, nom }] ;
  // nom : pseudo d'un vrai joueur en ligne, ou null — robot, ou joueur sans profil : libellé du jeu),
  // partie.chef (place du chef), partie.estChef(), partie.monTour(). Commandes : lancer(),
  // lancerManche() (le chef, dans le salon), jouer(action), pause(oui), recommencer(options)
  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {
    try { return racine.parent && racine.parent !== racine; } catch (e) { return false; }
  }

  // Invitation du bouton « Rejoindre » (window.JEL_REJOINDRE = { partie }, posé par le
  // lanceur) : { partie } ou null. Elle ne sert qu'une fois (première partie en ligne).
  var invitationUtilisee = false;
  function invitation() {
    if (invitationUtilisee) return null;
    var i = racine.JEL_REJOINDRE;
    return i && typeof i.partie === 'string' && RE_PARTIE.test(i.partie) ? { partie: i.partie } : null;
  }

  function Partie(o) {
    this.o = o || {};
    this.r = completer(this.o.regles);
    this.mode = 'arret';
    this.etat = null;
    this.n = 0;
    this.manche = 0;
    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.noms = [];            // pseudo des vrais joueurs par place (en ligne), ou null
    this.chef = -1;            // place du chef du salon (en ligne)
    this.options = null;
    this.file = [];            // messages reçus, joués un par un
    this.libreA = 0;           // heure à partir de laquelle le message suivant peut être joué
    this.rattrapage = false;   // coups accumulés pendant une pause en ligne : rejoués vite
    this.minuteur = 0;
    this.enPause = false;
    this.debutPause = 0;
    this.attendEcho = false;   // action envoyée, pas encore revenue
    this.versSolo = false;     // connexion coupée : bascule en solo une fois la file vidée
    this.local = null;         // arbitre local (solo)
    this.minuteurReveil = 0;
    this.minuteurConnexion = 0;
    this.ecoute = this.recevoirLanceur.bind(this);
  }

  Partie.prototype.signaler = function (e) {
    var f = this.o.surEvenement;
    if (typeof f !== 'function') return;
    // Une erreur du jeu ne bloque pas la file ; elle reste signalée (console, suivi du site).
    try { f(e); } catch (erreur) { setTimeout(function () { throw erreur; }, 0); }
  };

  Partie.prototype.changerMode = function (mode, raison) {
    this.mode = mode;
    this.signaler({ type: 'mode', mode: mode, raison: raison || '' });
  };

  Partie.prototype.lancer = function () {
    this.arreter();
    racine.JEL_MULTI.derniere = this;      // pour le robot de contrôle (scripts/tester-multijoueur.mjs)
    if (this.o.enLigne !== false && dansLanceur()) {
      this.changerMode('connexion');
      racine.addEventListener('message', this.ecoute);
      var demande = { type: 'jel-multi', op: 'rejoindre', proto: PROTOCOLE };
      var inv = invitation();
      if (inv) { demande.partie = inv.partie; invitationUtilisee = true; }   // partie d'un ami (« Rejoindre »)
      try { racine.parent.postMessage(demande, '*'); } catch (e) { /* pas de lanceur */ }
      var moi = this;
      this.minuteurConnexion = setTimeout(function () { moi.passerSolo('delai'); }, DELAI_CONNEXION);
    } else {
      this.passerSolo(this.o.enLigne === false ? 'choix' : 'seul');
    }
  };

  // Arrête tout (connexion, robots locaux, file) sans rien annoncer.
  Partie.prototype.arreter = function () {
    clearTimeout(this.minuteur);
    clearTimeout(this.minuteurReveil);
    clearTimeout(this.minuteurConnexion);
    racine.removeEventListener('message', this.ecoute);
    if (this.mode === 'connexion' || this.mode === 'en-ligne') {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'quitter' }, '*'); } catch (e) { /* pas de lanceur */ }
    }
    this.file = [];
    this.local = null;
    this.versSolo = false;
    this.attendEcho = false;
    this.noms = [];
    this.mode = 'arret';
  };

  Partie.prototype.quitter = function () { this.arreter(); };

  // Messages du lanceur : { type: 'jel-multi', m } (message du serveur) ou
  // { type: 'jel-multi', etat: 'solo' | 'coupe', raison }.
  Partie.prototype.recevoirLanceur = function (e) {
    if (e.source !== racine.parent) return;
    var d = e.data;
    if (!d || d.type !== 'jel-multi') return;
    if (d.etat) {
      if (this.mode === 'connexion') this.passerSolo(d.raison || d.etat);
      else if (this.mode === 'en-ligne') { this.versSolo = true; this.pomper(); }
      return;
    }
    var m = d.m;
    if (!m || typeof m !== 'object') return;
    if (this.mode === 'connexion') {
      if (m.t !== 'bienvenue') return;
      clearTimeout(this.minuteurConnexion);
      this.changerMode('en-ligne');
    }
    if (this.mode !== 'en-ligne') return;
    this.file.push(m);
    this.pomper();
  };

  // Partie contre des robots sur l'appareil (choix, pas de site, ou serveur absent).
  Partie.prototype.passerSolo = function (raison) {
    this.arreter();
    this.changerMode('solo', raison);
    this.local = this.creerArbitreLocal();
    this.local.rejoindre('moi');
    this.local.demarrer();
    this.programmerReveil();
  };

  Partie.prototype.creerArbitreLocal = function () {
    var moi = this;
    return new Arbitre(this.o.regles, {
      envoyer: function (cle, m) { moi.file.push(m); moi.pomper(); },
      enchainer: this.o.enchainer !== false,
      delaiJoueur: Infinity,               // le joueur de l'appareil prend son temps
      force: typeof this.o.force === 'number' ? this.o.force : this.r.forceEnLigne,
      options: this.o.options || null,
    });
  };

  // Connexion coupée pendant une partie en ligne : la partie continue sur
  // l'appareil, au même point, les autres places tenues par des robots locaux.
  Partie.prototype.basculer = function () {
    racine.removeEventListener('message', this.ecoute);
    // Coupure dans le salon (ou sans place) : une nouvelle manche commence contre des robots.
    if (this.siege < 0 || !this.etat || this.phase === 'salon') { this.passerSolo('coupe'); return; }
    var a = this.creerArbitreLocal();
    var sieges = [];
    for (var s = 0; s < this.r.places; s++) sieges.push(s === this.siege ? 'moi' : null);
    a.restaurer({
      v: PROTOCOLE, sieges: sieges, attente: [], etat: copie(this.etat), n: this.n, manche: this.manche,
      phase: this.phase, finManche: Date.now() + this.r.pauseManche, echeance: null, options: this.options,
    });
    this.local = a;
    this.attendEcho = false;
    this.noms = [];
    this.humains = a.flagsSieges();
    this.changerMode('solo', 'coupe');
    this.signaler({ type: 'sieges' });
    if (a.phase === 'jeu') a.avancer(0);
    this.programmerReveil();
  };

  Partie.prototype.programmerReveil = function () {
    clearTimeout(this.minuteurReveil);
    if (!this.local || this.enPause) return;
    var t = this.local.prochainReveil();
    if (t === null || !isFinite(t)) return;
    var moi = this;
    this.minuteurReveil = setTimeout(function () {
      if (!moi.local || moi.enPause) return;
      moi.local.reveil();
      moi.programmerReveil();
    }, Math.max(0, t - Date.now()));
  };

  // Joue les messages reçus un par un : les coups des autres sont espacés de
  // delaiBot, pour qu'on les voie.
  Partie.prototype.pomper = function () {
    if (this.enPause) return;
    clearTimeout(this.minuteur);
    while (this.file.length) {
      var attente = this.libreA - Date.now();
      if (attente > 0) {
        var moi = this;
        this.minuteur = setTimeout(function () { moi.pomper(); }, attente);
        return;
      }
      var delai = this.traiter(this.file.shift());
      this.libreA = Date.now() + (this.rattrapage ? Math.min(delai, DELAI_RATTRAPAGE) : delai);
    }
    this.rattrapage = false;
    if (this.versSolo) {
      this.versSolo = false;
      this.basculer();
    }
  };

  // Joue un message ; renvoie le temps à laisser avant le suivant (ms).
  Partie.prototype.traiter = function (m) {
    var r = this.r;
    switch (m.t) {
      case 'bienvenue':
        this.siege = m.siege;
        this.humains = m.sieges || [];
        this.chef = typeof m.chef === 'number' ? m.chef : -1;
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.etat = m.etat;
        this.phase = m.phase;
        this.attendEcho = false;
        this.signaler({ type: 'debut', reste: m.reste || 0 });
        return 0;
      case 'manche':
        this.etat = r.depart(hasard(m.g), r.places, copie(m.o));
        this.n = m.n;
        this.manche = m.manche;
        this.options = m.o || null;
        this.phase = 'jeu';
        this.attendEcho = false;
        this.signaler({ type: 'manche' });
        return 300;
      case 'action': {
        if (m.n !== this.n + 1 || !this.etat) { this.resynchroniser(); return 0; }
        var avant = this.etat, apres;
        try { apres = r.jouer(copie(avant), m.s, copie(m.a), hasard(m.g)); } catch (e) { this.resynchroniser(); return 0; }
        this.etat = apres;
        this.n = m.n;
        var moi = m.s === this.siege;
        if (moi) this.attendEcho = false;
        this.signaler({ type: 'action', siege: m.s, action: m.a, avant: avant, apres: apres, auto: !!m.auto, moi: moi });
        var resultat = r.fin(apres);
        if (resultat) {
          this.phase = 'pause';
          this.signaler({ type: 'fin', resultat: resultat });
        }
        return moi && !m.auto ? DELAI_MOI : r.delaiBot;
      }
      case 'sieges':
        this.humains = m.sieges || [];
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'salon':
        this.phase = 'salon';
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.attendEcho = false;
        this.signaler({ type: 'salon', reste: m.reste || 0 });
        return 0;
      case 'place':
        this.siege = m.siege;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'noms':
        this.noms = [];
        for (var k = 0; k < r.places; k++) {
          var x = Array.isArray(m.noms) ? m.noms[k] : null;
          this.noms.push(typeof x === 'string' && x ? x.slice(0, NOM_MAX) : null);
        }
        this.signaler({ type: 'sieges' });
        return 0;
      case 'refus':
        this.attendEcho = false;
        this.signaler({ type: 'refus' });
        return 0;
      default:
        return 0;
    }
  };

  // Messages perdus ou incohérents : en ligne, on redemande l'état au serveur.
  Partie.prototype.resynchroniser = function () {
    this.file = [];
    if (this.mode === 'en-ligne') {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'resync' } }, '*'); } catch (e) { /* pas de lanceur */ }
    }
  };

  Partie.prototype.sieges = function () {
    var liste = [];
    for (var s = 0; s < this.r.places; s++) {
      var humain = this.humains[s] === true;
      var nom = this.mode === 'en-ligne' && humain && typeof this.noms[s] === 'string' ? this.noms[s] : null;
      liste.push({ humain: humain, moi: s === this.siege, chef: this.mode === 'en-ligne' && s === this.chef, nom: nom });
    }
    return liste;
  };

  // Pseudo du vrai joueur de la place s (en ligne), ou null.
  Partie.prototype.nom = function (s) {
    var info = this.sieges()[s];
    return info ? info.nom : null;
  };

  // Le joueur de l'appareil peut-il lancer la manche ? (en ligne, dans le salon, s'il est le chef)
  Partie.prototype.estChef = function () {
    return this.mode === 'en-ligne' && this.phase === 'salon' && this.siege >= 0 && this.siege === this.chef;
  };

  // Le chef lance la manche depuis le salon. Renvoie true si la demande part.
  Partie.prototype.lancerManche = function () {
    if (!this.estChef() || this.file.length) return false;
    try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: { t: 'lancer' } }, '*'); } catch (e) { return false; }
    return true;
  };

  Partie.prototype.monTour = function () {
    if (this.phase !== 'jeu' || !this.etat || this.siege < 0 || this.attendEcho || this.file.length) return false;
    if (this.mode !== 'solo' && this.mode !== 'en-ligne') return false;
    try { return this.r.aQui(this.etat) === this.siege; } catch (e) { return false; }
  };

  // Action du joueur de l'appareil. Renvoie true si elle part (elle sera jouée
  // à son retour, comme celles des autres).
  Partie.prototype.jouer = function (action) {
    if (!this.monTour()) return false;
    try { if (this.r.valide(copie(this.etat), this.siege, copie(action)) !== true) return false; } catch (e) { return false; }
    this.attendEcho = true;
    var m = { t: 'action', n: this.n, a: copie(action) };
    if (this.mode === 'solo') {
      this.local.recevoir('moi', m);
      this.programmerReveil();
    } else {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: m }, '*'); } catch (e) { this.attendEcho = false; return false; }
    }
    return true;
  };

  // Pause (menu, écran caché) : la file et les robots locaux s'arrêtent. En
  // ligne, la partie continue sur le serveur : les coups attendent la reprise.
  Partie.prototype.pause = function (oui) {
    if (oui === this.enPause) return;
    this.enPause = oui;
    if (oui) {
      this.debutPause = Date.now();
      clearTimeout(this.minuteur);
      clearTimeout(this.minuteurReveil);
      return;
    }
    var duree = Date.now() - this.debutPause;
    if (this.local) {
      if (this.local.finManche) this.local.finManche += duree;
      if (this.local.echeance) this.local.echeance.quand += duree;
    }
    if (this.mode === 'en-ligne') { this.libreA = 0; this.rattrapage = true; }   // rattraper vite les coups joués pendant la pause
    this.pomper();
    this.programmerReveil();
  };

  // Solo : nouvelle manche tout de suite (niveau suivant, rejouer…).
  Partie.prototype.recommencer = function (options) {
    if (this.mode !== 'solo' || !this.local) return false;
    if (options) { this.o.options = options; this.local.reglages.options = options; }
    this.file = [];
    this.libreA = 0;
    this.local.nouvelleManche();
    this.programmerReveil();
    return true;
  };

  racine.JEL_MULTI = {
    PROTOCOLE: PROTOCOLE,
    hasard: hasard,
    copie: copie,
    completer: completer,
    problemesRegles: problemesRegles,
    Arbitre: Arbitre,
    Partie: Partie,
    creer: function (o) { return new Partie(o); },
    invitation: invitation,
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script id="jel-regles">
/* Règles de « La gare des devinettes roulantes » : fonctions pures
   (docs/multijoueur.md). Les mêmes règles tournent sur le serveur et sur
   chaque appareil ; le hasard passe uniquement par alea().
   Plateau : 4 voies de L rails, de la petite gare de chaque place jusqu'à la
   grande gare centrale. À son tour, on choisit un wagon-question parmi trois
   (phase « choix »), puis on répond (phase « reponse ») : bonne réponse, on
   pose des rails ; erreur, la locomotive attend. Le premier arrivé gagne.
   Cases spéciales (colonnes communes aux 4 voies) : tunnel (image brève),
   passage à niveau (le premier arrivé ferme la barrière, les autres doivent
   la rouvrir par une bonne réponse), pont (deux bonnes réponses de suite).
   Wagons : n normal (1 rail), x express (question dure, 3 rails),
   a aiguillage (1 rail, puis on dévie le dernier rail d'un rival : phase
   « aig »), m mystère (type caché, 2 rails).
   État (JSON) : niv, pay (paysage), L, r (rails par place), b (bonnes
   réponses), nr (réponses), xr (express réussis), tour, ph, w (3 wagons
   { k, q }), ws (wagon choisi), q (question en cours), pk (1 : 1re réponse du
   pont réussie), tun, pt (colonnes tunnel et pont), pn (passages :
   { p, f, o }), nt (tours joués), h (derniers véhicules), dr (dernier
   événement, pour l'écran), fr (force des robots d'un niveau solo).
   Action : un entier (wagon 0-2, réponse 0-3, ou place visée). */
(function () {
  'use strict';

  // Véhicules : identifiant, milieux, bruit (1 : il a un bruit à deviner),
  // métier, famille de forme (distracteurs proches), difficulté (1 à 3).
  var VEH = [
    ['voiture', ['route'], 1, '', 'auto', 1],
    ['bus', ['route'], 0, 'ecole', 'gros', 1],
    ['camion', ['route'], 1, '', 'gros', 2],
    ['moto', ['route'], 1, '', 'deux', 1],
    ['velo', ['route'], 1, '', 'deux', 1],
    ['tracteur', ['champ'], 1, 'champ', 'gros', 2],
    ['pompiers', ['route'], 1, 'feu', 'gros', 1],
    ['ambulance', ['route'], 0, 'malade', 'auto', 1],
    ['police', ['route'], 1, 'circulation', 'auto', 2],
    ['poubelle', ['route'], 1, 'poubelles', 'gros', 2],
    ['poste', ['route'], 0, 'lettres', 'auto', 2],
    ['depanneuse', ['route'], 0, 'panne', 'gros', 2],
    ['betonniere', ['route'], 0, 'beton', 'gros', 3],
    ['chasseneige', ['neige'], 0, 'deneiger', 'gros', 3],
    ['train', ['rails'], 1, '', 'rail', 1],
    ['tram', ['rails'], 1, '', 'rail', 2],
    ['voilier', ['eau'], 0, '', 'bateau', 1],
    ['paquebot', ['eau'], 1, '', 'bateau', 2],
    ['barque', ['eau'], 0, '', 'bateau', 2],
    ['sousmarin', ['sous'], 1, '', 'bateau', 2],
    ['avion', ['air'], 1, '', 'air', 1],
    ['helico', ['air'], 1, '', 'air', 1],
    ['montgolfiere', ['air'], 1, '', 'air', 2],
    ['fusee', ['espace'], 1, '', 'air', 2],
    ['telecabine', ['cable'], 0, '', 'rail', 3],
    ['motoneige', ['neige'], 0, '', 'deux', 3]
  ];
  var VEHICULES = VEH.map(function (v) { return { id: v[0], mil: v[1], son: v[2] === 1, met: v[3], fam: v[4], d: v[5] }; });
  var PAR_ID = {};
  VEHICULES.forEach(function (v) { PAR_ID[v.id] = v; });
  // Milieux des questions « Lequel va… » et leur difficulté.
  var MILIEUX = { eau: 1, air: 1, rails: 1, sous: 2, neige: 2, espace: 2, cable: 3 };
  var TYPES = ['bruit', 'milieu', 'ombre', 'metier', 'zoom'];

  // Les 20 niveaux solo. p : paysage (0 campagne, 1 montagne, 2 port, 3 ville) ;
  // L : rails à poser ; t : types de questions ; d : difficulté de base ;
  // c4 : part des questions normales à 4 choix ; x, a, m : wagons express,
  // aiguillage, mystère ; tun, pt, pn : colonnes tunnel, pont, passage à
  // niveau ; fr : force des robots ; tuto : nouveauté présentée.
  var Q4 = ['bruit', 'milieu', 'ombre', 'metier'];
  var Q5 = TYPES;
  var NIVEAUX = [
    { p: 0, L: 5, t: ['bruit', 'milieu'], d: 1, fr: 0.12, tuto: 'base' },
    { p: 0, L: 5, t: ['bruit', 'milieu', 'ombre'], d: 1, fr: 0.15, tuto: 'ombre' },
    { p: 0, L: 6, t: ['bruit', 'milieu', 'ombre'], d: 1, x: 1, fr: 0.2, tuto: 'express' },
    { p: 0, L: 6, t: Q4, d: 1, x: 1, fr: 0.24, tuto: 'metier' },
    { p: 0, L: 7, t: Q4, d: 1, x: 1, a: 1, fr: 0.28, tuto: 'aiguillage' },
    { p: 1, L: 7, t: Q4, d: 1, x: 1, a: 1, tun: [3], fr: 0.32, tuto: 'tunnel' },
    { p: 1, L: 7, t: Q4, d: 2, x: 1, a: 1, tun: [2, 3], fr: 0.35 },
    { p: 1, L: 8, t: Q5, d: 1, x: 1, a: 1, tun: [5], fr: 0.38, tuto: 'zoom' },
    { p: 1, L: 8, t: Q5, d: 1, x: 1, a: 1, tun: [6], pn: [3], fr: 0.42, tuto: 'passage' },
    { p: 1, L: 8, t: Q5, d: 2, x: 1, a: 1, tun: [2, 3], pn: [5], fr: 0.45 },
    { p: 2, L: 8, t: Q5, d: 1, x: 1, a: 1, pt: [4], fr: 0.48, tuto: 'pont' },
    { p: 2, L: 9, t: Q5, d: 2, x: 1, a: 1, pt: [3], fr: 0.52 },
    { p: 2, L: 9, t: Q5, d: 2, c4: 0.5, x: 1, a: 1, pt: [2, 6], fr: 0.55 },
    { p: 2, L: 9, t: Q5, d: 2, x: 1, a: 1, pt: [5], pn: [3], fr: 0.58 },
    { p: 2, L: 9, t: Q5, d: 2, x: 1, a: 1, tun: [2], pn: [4], pt: [6], fr: 0.6 },
    { p: 3, L: 9, t: Q5, d: 2, x: 1, a: 1, m: 1, fr: 0.63, tuto: 'mystere' },
    { p: 3, L: 10, t: Q5, d: 2, x: 1, a: 1, m: 1, pn: [3, 7], fr: 0.66 },
    { p: 3, L: 10, t: Q5, d: 2, c4: 0.5, x: 1, a: 1, m: 1, pt: [5], fr: 0.7 },
    { p: 3, L: 10, t: Q5, d: 2, c4: 0.5, x: 1, a: 1, m: 1, tun: [2], pt: [5], pn: [3, 7], fr: 0.75 },
    { p: 3, L: 10, t: Q5, d: 2, c4: 0.7, x: 1, a: 1, m: 1, tun: [2], pn: [4, 8], pt: [6], fr: 0.8 }
  ];
  var GAINS = { n: 1, x: 3, a: 1, m: 2 };
  var TOURS_MAX = 40;      // tours par place au plus (la manche finit toujours)

  function auHasard(liste, alea) { return liste[Math.floor(alea() * liste.length) % liste.length]; }
  function melanger(liste, alea) {
    var l = liste.slice();
    for (var i = l.length - 1; i > 0; i--) { var j = Math.floor(alea() * (i + 1)) % (i + 1); var x = l[i]; l[i] = l[j]; l[j] = x; }
    return l;
  }
  function contient(l, x) { return (l || []).indexOf(x) >= 0; }
  function niveauDe(e) { return NIVEAUX[e.niv] || NIVEAUX[0]; }

  // Une question : type t, difficulté d (3 : 4 choix et distracteurs proches),
  // c4 : part des questions à 4 choix, h : véhicules récents (à éviter comme
  // bonne réponse).
  function question(alea, t, d, c4, h) {
    var choix = d >= 3 || (c4 && alea() < c4) ? 4 : 3;
    var dmax = d >= 2 ? 3 : 2;
    var bons, m = '', z = 0;
    if (t === 'milieu') {
      var mils = Object.keys(MILIEUX).filter(function (k) { return MILIEUX[k] <= dmax; });
      m = auHasard(mils, alea);
      bons = VEHICULES.filter(function (v) { return contient(v.mil, m); });
    } else if (t === 'bruit') {
      bons = VEHICULES.filter(function (v) { return v.son && v.d <= dmax; });
    } else if (t === 'metier') {
      bons = VEHICULES.filter(function (v) { return v.met && v.d <= dmax; });
    } else {
      bons = VEHICULES.filter(function (v) { return v.d <= dmax; });
      z = Math.floor(alea() * 2) % 2;
    }
    var frais = bons.filter(function (v) { return !contient(h, v.id); });
    var bon = auHasard(frais.length ? frais : bons, alea);
    if (t === 'metier') m = bon.met;
    // Distracteurs : jamais une 2e bonne réponse.
    var faux = VEHICULES.filter(function (v) {
      if (v.id === bon.id || v.d > dmax) return false;     // question facile : des véhicules connus
      if (t === 'milieu') return !contient(v.mil, m);
      if (t === 'metier') return v.met !== m;
      return true;
    });
    var proches = melanger(faux.filter(function (v) { return v.fam === bon.fam; }), alea);
    var autres = melanger(faux.filter(function (v) { return v.fam !== bon.fam; }), alea);
    // Facile : des familles différentes ; moyen : un véhicule proche ; dur : des véhicules qui se ressemblent.
    var ordre = d >= 3 ? proches.concat(autres) : (d === 2 ? proches.slice(0, 1).concat(autres, proches) : autres.concat(proches));
    var pris = [];
    for (var i = 0; i < ordre.length && pris.length < choix - 1; i++) if (!contient(pris, ordre[i].id)) pris.push(ordre[i].id);
    var c = melanger(pris.concat([bon.id]), alea);
    return { t: t, a: c.indexOf(bon.id), c: c, m: m, z: z, d: d, tun: 0 };
  }

  // Les 3 wagons proposés à la place s.
  function wagons(e, s, alea) {
    var cfg = niveauDe(e), kinds = ['n', 'n', 'n'];
    var rivaux = e.r.some(function (x, k) { return k !== s && x > 0; });
    var cases = melanger([0, 1, 2], alea);
    var types = melanger(cfg.t, alea);
    if (cfg.x && alea() < 0.75) kinds[cases[0]] = 'x';
    if (cfg.a && rivaux && alea() < 0.6) kinds[cases[1]] = 'a';
    if (cfg.m && alea() < 0.75) kinds[cases[2]] = 'm';
    var tun = contient(e.tun, e.r[s]) ? 1 : 0;
    var vus = (e.h || []).slice();
    return kinds.map(function (k, i) {
      var d = k === 'x' ? 3 : (k === 'm' ? Math.min(3, cfg.d + 1) : cfg.d);
      var q = question(alea, types[i % types.length], d, k === 'n' || k === 'a' ? (cfg.c4 || 0) : 0, vus);
      q.tun = tun;
      vus.push(q.c[q.a]);
      return { k: k, q: q };
    });
  }

  function passageEn(e, p) {
    for (var i = 0; i < e.pn.length; i++) if (e.pn[i].p === p) return e.pn[i];
    return null;
  }
  // Barrière fermée par un autre devant la locomotive s ?
  function bloque(e, s) {
    var c = passageEn(e, e.r[s]);
    return !!c && c.f >= 0 && c.f !== s && !c.o[s];
  }
  // Rivaux qu'un aiguillage peut viser.
  function cibles(e, s) {
    var l = [];
    for (var k = 0; k < e.r.length; k++) {
      if (k === s || e.r[k] <= 0 || e.r[k] >= e.L) continue;
      if (contient(e.pt, e.r[k] - 1)) continue;      // un rail de pont ne se dévie pas
      l.push(k);
    }
    return l;
  }

  // Pose jusqu'à g rails ; s'arrête devant un pont (sauf le premier rail, si le
  // pont vient d'être réussi) et devant une barrière fermée par un autre.
  function poser(e, s, g, pontFait) {
    var pose = 0, ferme = -1;
    for (var i = 0; i < g; i++) {
      var p = e.r[s];
      if (p >= e.L) break;
      if (contient(e.pt, p) && !(i === 0 && pontFait)) break;
      var c = passageEn(e, p);
      if (c) {
        if (c.f < 0) { c.f = s; ferme = p; }
        else if (c.f !== s && !c.o[s]) break;
      }
      e.r[s] = p + 1;
      pose++;
    }
    return { pose: pose, ferme: ferme };
  }

  function finirTour(e, alea) {
    e.ph = 'choix'; e.pk = 0; e.q = null; e.ws = -1;
    e.nt++;
    var places = e.r.length;
    if (e.r.some(function (x) { return x >= e.L; }) || e.nt >= TOURS_MAX * places) { e.ph = 'fin'; e.w = []; return; }
    e.tour = (e.tour + 1) % places;
    e.w = wagons(e, e.tour, alea);
  }

  function preparer(idx, places) {
    var cfg = NIVEAUX[idx];
    var e = {
      niv: idx, pay: cfg.p, L: cfg.L, r: [], b: [], nr: [], xr: [], tour: 0, ph: 'choix', w: [], ws: -1, q: null, pk: 0,
      tun: (cfg.tun || []).slice(), pt: (cfg.pt || []).slice(), pn: [], nt: 0, h: [], dr: null
    };
    for (var s = 0; s < places; s++) { e.r.push(0); e.b.push(0); e.nr.push(0); e.xr.push(0); }
    (cfg.pn || []).forEach(function (p) { var o = []; for (var k = 0; k < places; k++) o.push(0); e.pn.push({ p: p, f: -1, o: o }); });
    return e;
  }

  // Force des robots d'un niveau solo.
  function forceNiveau(n) { return NIVEAUX[Math.max(0, Math.min(NIVEAUX.length - 1, n - 1))].fr; }

  // Chance qu'un robot de force fo réponde juste.
  function chance(fo, q) {
    var p = 0.5 + 0.45 * fo - 0.1 * (q.d - 1) - (q.tun ? 0.08 : 0);
    return Math.max(0.25, Math.min(0.97, p));
  }

  window.JEL_REGLES = {
    places: 4,
    delaiBot: 1100,
    delaiJoueur: 25000,
    pauseManche: 8000,
    remplacement: 'tour',
    forceEnLigne: 0.4,
    niveaux: NIVEAUX,

    depart: function (alea, places, options) {
      var o = options || {};
      var solo = typeof o.niveau === 'number' && isFinite(o.niveau);
      var idx = solo ? Math.max(0, Math.min(NIVEAUX.length - 1, Math.floor(o.niveau) - 1))
        : 4 + Math.floor(alea() * (NIVEAUX.length - 4)) % (NIVEAUX.length - 4);
      var e = preparer(idx, places);
      if (solo) e.fr = NIVEAUX[idx].fr;
      e.tour = Math.floor(alea() * places) % places;
      e.w = wagons(e, e.tour, alea);
      return e;
    },

    aQui: function (e) { return e.tour; },

    valide: function (e, place, a) {
      if (e.ph === 'fin' || place !== e.tour || !Number.isInteger(a)) return false;
      if (e.ph === 'choix') return a >= 0 && a < e.w.length;
      if (e.ph === 'reponse') return !!e.q && a >= 0 && a < e.q.c.length;
      if (e.ph === 'aig') return contient(cibles(e, place), a);
      return false;
    },

    jouer: function (e, s, a, alea) {
      if (e.ph === 'choix') {
        e.ws = a;
        e.q = e.w[a].q;
        e.ph = 'reponse';
        e.dr = { k: 'choix', s: s, w: a };
        return e;
      }
      if (e.ph === 'aig') {
        e.r[a] = Math.max(0, e.r[a] - 1);
        e.dr = { k: 'aig', s: s, v: a };
        finirTour(e, alea);
        return e;
      }
      // Réponse.
      var q = e.q, wag = e.w[e.ws] || { k: 'n' }, juste = a === q.a;
      e.nr[s]++;
      e.h = (e.h || []).concat([q.c[q.a]]).slice(-6);
      if (!juste) {
        e.dr = { k: 'faux', s: s, a: a, q: q, pont: e.pk };
        finirTour(e, alea);
        return e;
      }
      e.b[s]++;
      if (wag.k === 'x') e.xr[s]++;
      var p = e.r[s];
      if (contient(e.pt, p) && !e.pk) {
        // Pont : une 2e bonne réponse de suite, tout de suite.
        e.pk = 1;
        var nq = question(alea, q.t === 'bruit' ? 'ombre' : (q.t === 'ombre' ? 'milieu' : 'bruit'), q.d, 0, e.h);
        nq.tun = q.tun;
        e.dr = { k: 'pont1', s: s, a: a, q: q };
        e.q = nq;
        return e;
      }
      if (bloque(e, s)) {
        passageEn(e, p).o[s] = 1;
        e.dr = { k: 'ouvre', s: s, a: a, q: q };
        finirTour(e, alea);
        return e;
      }
      var res = poser(e, s, GAINS[wag.k] || 1, e.pk === 1);
      e.dr = { k: 'juste', s: s, a: a, q: q, g: res.pose, f: res.ferme, pont: e.pk, w: wag.k };
      if (wag.k === 'a' && e.r[s] < e.L && cibles(e, s).length) {
        e.ph = 'aig'; e.q = null; e.pk = 0;
        return e;
      }
      finirTour(e, alea);
      return e;
    },

    // Robot : choisit le wagon qui rapporte le plus (selon sa force), répond
    // juste selon sa chance, vise le rival le plus avancé.
    bot: function (e, s, alea, force) {
      var fo = typeof e.fr === 'number' ? e.fr : (typeof force === 'number' ? force : 0.5);
      if (e.ph === 'choix') {
        if (alea() > 0.35 + 0.65 * fo) return Math.floor(alea() * e.w.length) % e.w.length;
        var devant = e.r.some(function (x, k) { return k !== s && x > e.r[s]; });
        var bloqueIci = bloque(e, s);
        var pont = contient(e.pt, e.r[s]);
        var meilleur = 0, haut = -1;
        e.w.forEach(function (w, i) {
          var c = chance(fo, w.q);
          var v = bloqueIci ? c : c * (pont ? 0.85 : 1) * Math.min(GAINS[w.k], e.L - e.r[s]);
          if (w.k === 'a' && devant) v += 0.7 * c;
          v += alea() * 0.3 * (1 - fo);
          if (v > haut) { haut = v; meilleur = i; }
        });
        return meilleur;
      }
      if (e.ph === 'aig') {
        var l = cibles(e, s);
        if (!l.length) return 0;
        if (alea() < 0.5 + 0.5 * fo) {
          var top = l[0];
          l.forEach(function (k) { if (e.r[k] > e.r[top]) top = k; });
          return top;
        }
        return auHasard(l, alea);
      }
      var q = e.q;
      if (!q) return 0;
      if (alea() < chance(fo, q)) return q.a;
      var mauvais = [];
      for (var i = 0; i < q.c.length; i++) if (i !== q.a) mauvais.push(i);
      return auHasard(mauvais, alea);
    },

    fin: function (e) {
      if (e.ph !== 'fin') return null;
      var cl = [];
      for (var s = 0; s < e.r.length; s++) cl.push(s);
      cl.sort(function (x, y) { return (e.r[y] - e.r[x]) || (e.b[y] - e.b[x]) || (x - y); });
      return { classement: cl, scores: e.r.slice() };
    },

    // Outils partagés avec l'écran du jeu (mêmes données).
    outils: {
      vehicules: VEHICULES, parId: PAR_ID, milieux: MILIEUX, gains: GAINS, cibles: cibles, bloque: bloque,
      passageEn: passageEn, preparer: preparer, forceNiveau: forceNiveau
    }
  };
})();
</script>

  #zone { flex: 0 0 auto; height: clamp(170px, 30vh, 300px); position: relative; width: 100%; max-width: 680px; align-self: center; }

  /* Panneau des wagons et des questions */

  #question { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }

  #btn-ecouter { display: inline-flex; align-items: center; gap: 6px; background: #ffd84d; border: 3px solid #3a2410; padding: 6px 14px; font-weight: 900; font-size: 1rem; box-shadow: 0 3px 0 #2a180a; border-radius: 16px; }

  #reponses { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: minmax(64px, 170px); gap: 7px; flex: 1; min-height: 0; align-content: center; }

  .rep {
    background: #fffdf5; border: 3px solid #3a2410; border-radius: 16px; padding: 3px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 #2a180a; min-height: 0; position: relative; overflow: hidden;
  }
  .rep canvas { width: 100%; height: 100%; min-height: 0; object-fit: contain; }
  /* Téléphone en portrait : 3 réponses l'une sous l'autre, 4 réponses en carré, plus grandes. */
  @media (max-width: 600px) and (orientation: portrait) {

  .rep.bonne { background: #bff0b8; border-color: #1d7a2b; box-shadow: 0 0 0 4px #3fae4a, 0 4px 0 #1d5a20; animation: saute .5s ease-out; }
  .rep.mauvaise { background: #ffc9c4; border-color: #b8261b; animation: tremble .45s; }

  #cibles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; flex: 1; align-content: center; }
  .cible {
    background: #fffdf5; border: 3px solid #3a2410; border-radius: 16px; padding: 6px 3px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    font-weight: 800; font-size: .82rem; box-shadow: 0 4px 0 #2a180a; overflow-wrap: anywhere; text-align: center; line-height: 1.1;

  #pan-aide { color: #ffe9b8; font-size: .8rem; text-align: center; }

  #fin-record, #fin-debloque, #fin-compte, #fin-justes, #fin-autocollant { font-weight: 700; }

<script>
(function () {
  'use strict';

  // =====================================================================
  //  La gare des devinettes roulantes — quiz de véhicules et course de rails
  //  À son tour, on choisit un wagon-question parmi trois, puis on touche le
  //  bon véhicule : bonne réponse, des rails ; erreur, la locomotive attend.
  //  Solo : 20 niveaux contre 3 robots. En ligne : de vrais joueurs
  //  remplacent les robots (moteur commun JEL_MULTI). Les règles sont dans
  //  le bloc jel-regles (fonctions pures, partagées avec le serveur).
  // =====================================================================

  const JEU = 'la-gare-des-devinettes-roulantes';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;                // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  // Phrase qui commence par un nom (« la locomotive rose… ») : majuscule au début.
  const phrase = (cle, vars) => { const t = tr(cle, vars); return t.charAt(0).toLocaleUpperCase() + t.slice(1); };
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Une couleur par place (voie, locomotive, gare).
  const COUL = ['#2f6fe0', '#e0508c', '#f0a000', '#1d9a55'];
  const COUL_F = ['#163d8f', '#8c1f4f', '#8a5a00', '#0d5a30'];
  const COUL_T = ['#cddcfb', '#fbd2e2', '#fde7a8', '#c4ead3'];
  const STYLE_ROBOT = [1, 2, 3, 5];          // locomotives des autres places
  const SEUILS_LOCOS = [0, 6, 12, 20, 30, 40, 50, 60];
  const AUTOCOLLANTS = ['premier', 'sansfaute', 'express', 'aiguilleur', 'tunnel', 'pont', 'barriere', 'campagne', 'montagne', 'port', 'ville', 'oreille', 'enligne', 'etoiles'];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#fff"/><circle cx="10.4" cy="8" r="1.6" fill="#fff"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#fff"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    options: { son: true, loco: 0 }, autocollants: [], stats: { aig: 0, tun: 0, pont: 0, pn: 0, bruit: 0 }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 9999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => typeof x === 'string');
      if (Array.isArray(d.autocollants)) prog.autocollants = d.autocollants.filter((x) => AUTOCOLLANTS.indexOf(x) >= 0);
      if (d.stats && typeof d.stats === 'object') Object.keys(prog.stats).forEach((k) => { prog.stats[k] = entier(d.stats[k], 0, 99999, 0); });
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
      if (d.options) prog.options.loco = entier(d.options.loco, 0, 7, 0);
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (totalEtoiles() < SEUILS_LOCOS[prog.options.loco]) prog.options.loco = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.autocollants = [];
    Object.keys(prog.stats).forEach((k) => { prog.stats[k] = 0; });
    prog.options.loco = 0;
  }

  function donnees(niveauReprise, score) {
    return {
      niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(), debloque: prog.debloque,
      tutos: prog.tutos.slice(), autocollants: prog.autocollants.slice(), stats: Object.assign({}, prog.stats),
      options: { son: prog.options.son, loco: prog.options.loco }
    };
  }
  function sauver(niveauReprise, score) {
    try { window.JEL_SAVE.save(JEU, donnees(niveauReprise, score)); } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }
  // Réglages (son, locomotive) changés hors d'une partie : jamais de nouvelle sauvegarde là.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son, loco: prog.options.loco }, autocollants: prog.autocollants.slice(), stats: Object.assign({}, prog.stats) }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, bufBruit = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + (o.rampe || d));
      if (o.puis) osc.frequency.exponentialRampToValueAtTime(o.puis, t + d);
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(o.attaque || 0.02, d / 3));
      if (o.tenue) g.gain.setValueAtTime(v, t + d * o.tenue);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  // Souffle filtré (vapeur, hélice, réacteur…).
  function souffle(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      if (!bufBruit) {
        bufBruit = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const data = bufBruit.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(); src.buffer = bufBruit;
      const fl = ac.createBiquadFilter(); fl.type = o.passe || 'bandpass'; fl.frequency.setValueAtTime(o.f || 800, t);
      if (o.vers) fl.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      fl.Q.value = o.q || 1;
      const g = ac.createGain(), v = o.vol || 0.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.attaque || 0.03));
      if (o.tenue) g.gain.setValueAtTime(v, t + d * o.tenue);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t, Math.random()); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(660, 0.06, { type: 'triangle', vol: 0.07 }),
    wagon: () => { note(300, 0.08, { type: 'square', vol: 0.05, filtre: 1200 }); note(450, 0.1, { type: 'triangle', vol: 0.07, retard: 0.06 }); },
    juste: () => [659, 880, 1175].forEach((f, i) => note(f, 0.16, { type: 'triangle', vol: 0.1, retard: i * 0.08 })),
    faux: () => { note(240, 0.22, { type: 'square', vol: 0.05, filtre: 900, vers: 150 }); note(170, 0.3, { type: 'triangle', vol: 0.08, retard: 0.15 }); },
    rail: (i) => { note(1400 + i * 120, 0.05, { type: 'square', vol: 0.04, filtre: 3000, retard: i * 0.16 }); note(520, 0.08, { type: 'triangle', vol: 0.08, retard: i * 0.16 + 0.02 }); },
    aiguille: () => { note(500, 0.25, { type: 'sawtooth', vol: 0.05, filtre: 1500, vers: 200 }); note(800, 0.08, { type: 'square', vol: 0.04, retard: 0.25 }); },
    barriere: () => [0, 0.3, 0.6].forEach((r) => note(980, 0.18, { type: 'square', vol: 0.04, filtre: 2000, retard: r })),
    pont: () => [392, 523, 659, 784].forEach((f, i) => note(f, 0.14, { type: 'triangle', vol: 0.09, retard: i * 0.07 })),
    sifflet: () => { note(880, 0.5, { vol: 0.08, tenue: 0.7 }); note(1110, 0.5, { vol: 0.06, tenue: 0.7 }); },
    victoire: () => { sons.sifflet(); [523, 659, 784, 1047].forEach((f, i) => note(f, 0.26, { type: 'triangle', vol: 0.11, retard: 0.5 + i * 0.13 })); },
    defaite: () => [392, 330, 262].forEach((f, i) => note(f, 0.3, { vol: 0.11, retard: i * 0.18 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.035 }),
    arrive: () => { note(660, 0.12, { vol: 0.09 }); note(880, 0.16, { vol: 0.09, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.07 }); note(587, 0.16, { vol: 0.07, retard: 0.1 }); },
    tour: () => note(988, 0.1, { vol: 0.06 }),
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 }),
    tunnel: () => souffle(0.9, { f: 300, vers: 120, vol: 0.12, passe: 'lowpass' })
  };

  // Les bruits des véhicules (questions « Quel véhicule fait ce bruit ? »).
  const BRUITS = {
    voiture: () => { [0, 0.32].forEach((r) => { note(415, 0.22, { type: 'square', vol: 0.05, filtre: 1800, retard: r, tenue: 0.8 }); note(523, 0.22, { type: 'square', vol: 0.04, filtre: 1800, retard: r, tenue: 0.8 }); }); },
    camion: () => { note(147, 0.9, { type: 'sawtooth', vol: 0.09, filtre: 700, tenue: 0.85 }); note(185, 0.9, { type: 'sawtooth', vol: 0.07, filtre: 700, tenue: 0.85 }); },
    moto: () => { [0, 0.75].forEach((r) => note(80, 0.65, { type: 'sawtooth', vol: 0.1, filtre: 900, vers: 260, rampe: 0.4, puis: 160, retard: r })); },
    velo: () => { [0, 0.28].forEach((r) => { note(2600, 0.4, { vol: 0.06, retard: r }); note(3900, 0.3, { vol: 0.03, retard: r }); }); },
    tracteur: () => { for (let i = 0; i < 10; i++) note(70, 0.09, { type: 'square', vol: 0.09, filtre: 400, retard: i * 0.13 }); },
    pompiers: () => { for (let i = 0; i < 4; i++) note(i % 2 ? 588 : 440, 0.36, { type: 'triangle', vol: 0.1, retard: i * 0.38, tenue: 0.85 }); },
    police: () => { [0, 0.8].forEach((r) => note(600, 0.78, { vol: 0.09, vers: 1300, rampe: 0.4, puis: 600, retard: r })); },
    poubelle: () => { for (let i = 0; i < 4; i++) note(1050, 0.22, { type: 'square', vol: 0.05, filtre: 2500, retard: i * 0.42, tenue: 0.85 }); },
    train: () => { for (let i = 0; i < 4; i++) souffle(0.18, { f: 1800, q: 0.7, vol: 0.25, retard: i * 0.24 }); note(880, 0.6, { vol: 0.08, retard: 1.0, tenue: 0.8 }); note(1100, 0.6, { vol: 0.06, retard: 1.0, tenue: 0.8 }); },
    tram: () => { [0, 0.35].forEach((r) => { note(1500, 0.5, { vol: 0.07, retard: r }); note(2250, 0.35, { vol: 0.04, retard: r }); }); },
    paquebot: () => { note(98, 1.5, { type: 'sawtooth', vol: 0.1, filtre: 450, tenue: 0.85, attaque: 0.15 }); note(147, 1.5, { type: 'sawtooth', vol: 0.06, filtre: 450, tenue: 0.85, attaque: 0.15 }); },
    sousmarin: () => { [0, 0.9].forEach((r) => note(1250, 0.8, { vol: 0.1, retard: r, attaque: 0.005 })); },
    avion: () => { souffle(1.8, { f: 300, vers: 2200, q: 2, vol: 0.18, attaque: 0.3, tenue: 0.5 }); note(110, 1.8, { type: 'sawtooth', vol: 0.03, filtre: 500 }); },
    helico: () => { for (let i = 0; i < 16; i++) souffle(0.07, { f: 260, q: 0.8, vol: 0.3, passe: 'lowpass', retard: i * 0.09 }); },
    fusee: () => { souffle(2.0, { f: 120, vers: 700, vol: 0.3, passe: 'lowpass', attaque: 0.4, tenue: 0.6 }); note(60, 2, { type: 'sawtooth', vol: 0.05, filtre: 300, vers: 220 }); },
    montgolfiere: () => { [0, 0.9].forEach((r) => souffle(0.75, { f: 900, q: 0.6, vol: 0.2, attaque: 0.15, retard: r, tenue: 0.5 })); }
  };
  function jouerBruit(id) { audio(); if (BRUITS[id]) BRUITS[id](); }

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
    if (ecran === 'jeu') majPanneau(true);
  }

  // ---------------------------------------------------------------------
  //  Dessins : outils
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
  function remplir(c, coul, trait, ep) { c.fillStyle = coul; c.fill(); if (trait) { c.strokeStyle = trait; c.lineWidth = ep || 2.5; c.stroke(); } }
  function ligne(c, x1, y1, x2, y2, coul, ep) { c.strokeStyle = coul; c.lineWidth = ep; c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }
  const TRAIT = '#2a2230', VITRE = '#bfe6ff';
  function roue(c, x, y, r, jante) {
    rond(c, x, y, r); remplir(c, '#2b2b33');
    rond(c, x, y, r * 0.5); remplir(c, jante || '#c9cdd4');
    rond(c, x, y, r * 0.16); remplir(c, '#555');
  }
  function vagues(c, y) {
    c.strokeStyle = '#3a8fd8'; c.lineWidth = 3; c.lineCap = 'round';
    for (let k = 0; k < 2; k++) {
      c.beginPath();
      for (let x = 4; x <= 196; x += 4) { const yy = y + k * 7 + Math.sin(x / 9 + k) * 2.4; if (x === 4) c.moveTo(x, yy); else c.lineTo(x, yy); }
      c.stroke();
    }
  }

  // ---------------------------------------------------------------------
  //  Les 26 véhicules, dessinés dans une boîte de 200 × 120 (vers la droite)
  // ---------------------------------------------------------------------

  const DESSINS = {
    voiture(c) {
      poly(c, [55, 60, 76, 30, 134, 30, 160, 60]); remplir(c, '#e8412f', TRAIT);
      rr(c, 20, 56, 160, 36, 14); remplir(c, '#e8412f', TRAIT);
      poly(c, [66, 58, 82, 37, 103, 37, 103, 58]); remplir(c, VITRE, TRAIT, 2);
      poly(c, [111, 58, 111, 37, 129, 37, 148, 58]); remplir(c, VITRE, TRAIT, 2);
      ligne(c, 107, 62, 107, 86, '#9c2216', 2);
      rond(c, 172, 70, 6); remplir(c, '#ffe066', TRAIT, 1.5);
      rr(c, 20, 64, 8, 10, 3); remplir(c, '#ff8a7a');
      roue(c, 60, 94, 15); roue(c, 142, 94, 15);
    },
    bus(c) {
      rr(c, 10, 24, 180, 66, 12); remplir(c, '#f6c21c', TRAIT);
      [16, 48, 80, 112].forEach((x) => { rr(c, x, 32, 26, 24, 4); remplir(c, VITRE, TRAIT, 2); });
      rr(c, 146, 32, 38, 30, 5); remplir(c, VITRE, TRAIT, 2);
      c.fillStyle = '#2a2230'; c.fillRect(10, 66, 180, 5);
      rr(c, 146, 64, 4, 22, 1); remplir(c, '#8a6a00');
      rond(c, 182, 78, 4.5); remplir(c, '#fff4b0', TRAIT, 1);
      roue(c, 46, 94, 14); roue(c, 152, 94, 14);
    },
    camion(c) {
      rr(c, 8, 20, 124, 66, 5); remplir(c, '#a7b3c0', TRAIT);
      for (let x = 22; x < 130; x += 16) ligne(c, x, 24, x, 82, '#8794a3', 2);
      poly(c, [134, 38, 166, 38, 188, 62, 188, 88, 134, 88]); remplir(c, '#2f6fe0', TRAIT);
      poly(c, [140, 44, 163, 44, 178, 62, 140, 62]); remplir(c, VITRE, TRAIT, 2);
      rr(c, 128, 84, 64, 6, 3); remplir(c, '#555');
      roue(c, 34, 96, 13); roue(c, 76, 96, 13); roue(c, 162, 96, 13);

    const actif = monTour();
