<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;

      feuille.textContent = CSS_SELECTEUR;

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);

    SOURCE: SOURCE,

    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,

    surChangement: surChangement,

      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);

  }

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];

    tout.date = Date.now();

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;

    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');

  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {

    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }

      b.classList.remove('armer');

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)

  //                prochaine écriture du jeu)

    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');

    var bNouvelle = bouton('', texte('nouvelle'));

      fermer: function () {

    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));

    var boutons = [bContinuer, bNouvelle, bEffacer];

      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;

      var i = boutons.indexOf(actif);

    try { bContinuer.focus(); } catch (e) { /* rien */ }

  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');

  //   enchainer     false : pas de nouvelle manche automatique en solo (jeu à niveaux)

  // Lecture : partie.mode, partie.etat, partie.siege (place du joueur, -1 en attente),
  // partie.phase ('attente', 'salon', 'jeu', 'pause'), partie.sieges() ([{ humain, moi, chef, nom }] ;

  // (solo), quitter(). La dernière partie lancée est aussi dans JEL_MULTI.derniere.

  function dansLanceur() {

  }

  // lanceur) : { partie } ou null. Elle ne sert qu'une fois (première partie en ligne).

    this.etat = null;
    this.n = 0;
    this.manche = 0;
    this.phase = 'attente';
    this.siege = -1;
    this.humains = [];
    this.noms = [];            // pseudo des vrais joueurs par place (en ligne), ou null
    this.chef = -1;            // place du chef du salon (en ligne)
    this.options = null;
    this.file = [];            // messages reçus, joués un par un
    this.libreA = 0;           // heure à partir de laquelle le message suivant peut être joué
    this.rattrapage = false;   // coups accumulés pendant une pause en ligne : rejoués vite
    this.minuteur = 0;
    this.enPause = false;
    this.debutPause = 0;
    this.attendEcho = false;   // action envoyée, pas encore revenue
    this.versSolo = false;     // connexion coupée : bascule en solo une fois la file vidée
    this.local = null;         // arbitre local (solo)

  Partie.prototype.signaler = function (e) {

      this.changerMode('connexion');
      racine.addEventListener('message', this.ecoute);

      var inv = invitation();
      if (inv) { demande.partie = inv.partie; invitationUtilisee = true; }   // partie d'un ami (« Rejoindre »)

  Partie.prototype.arreter = function () {

    var moi = this;
    this.minuteurReveil = setTimeout(function () {
      if (!moi.local || moi.enPause) return;

        this.humains = m.sieges || [];

        this.manche = m.manche;
        this.options = m.o || null;

      }
      case 'sieges':
        this.humains = m.sieges || [];
        if (typeof m.chef === 'number') this.chef = m.chef;

      case 'salon':
        this.phase = 'salon';
        if (typeof m.chef === 'number') this.chef = m.chef;
        this.attendEcho = false;
        this.signaler({ type: 'salon', reste: m.reste || 0 });
        return 0;
      case 'place':
        this.siege = m.siege;
        this.signaler({ type: 'sieges' });
        return 0;
      case 'noms':
        this.noms = [];

        return 0;
      case 'refus':
        this.attendEcho = false;
        this.signaler({ type: 'refus' });
        return 0;
      default:
        return 0;
    }
  };

  // Messages perdus ou incohérents : en ligne, on redemande l'état au serveur.
  Partie.prototype.resynchroniser = function () {
    this.file = [];
    if (this.mode === 'en-ligne') {

    }
  };

  Partie.prototype.sieges = function () {
    var liste = [];

      var humain = this.humains[s] === true;

    }

  };

  // Pseudo du vrai joueur de la place s (en ligne), ou null.
  Partie.prototype.nom = function (s) {

  };

  // Le joueur de l'appareil peut-il lancer la manche ? (en ligne, dans le salon, s'il est le chef)
  Partie.prototype.estChef = function () {

  };

  // Le chef lance la manche depuis le salon. Renvoie true si la demande part.
  Partie.prototype.lancerManche = function () {
    if (!this.estChef() || this.file.length) return false;

    return true;
  };

    if (this.phase !== 'jeu' || !this.etat || this.siege < 0 || this.attendEcho || this.file.length) return false;
    if (this.mode !== 'solo' && this.mode !== 'en-ligne') return false;

  // à son retour, comme celles des autres).
  Partie.prototype.jouer = function (action) {

    try { if (this.r.valide(copie(this.etat), this.siege, copie(action)) !== true) return false; } catch (e) { return false; }

      this.programmerReveil();
    } else {
      try { racine.parent.postMessage({ type: 'jel-multi', op: 'envoyer', m: m }, '*'); } catch (e) { this.attendEcho = false; return false; }
    }

  };

  // Pause (menu, écran caché) : la file et les robots locaux s'arrêtent. En
  // ligne, la partie continue sur le serveur : les coups attendent la reprise.
  Partie.prototype.pause = function (oui) {

    this.enPause = oui;

    this.pomper();
    this.programmerReveil();
  };

  Partie.prototype.recommencer = function (options) {
    if (this.mode !== 'solo' || !this.local) return false;
    if (options) { this.o.options = options; this.local.reglages.options = options; }
    this.file = [];
    this.libreA = 0;
    this.local.nouvelleManche();
    this.programmerReveil();
    return true;
  };

    PROTOCOLE: PROTOCOLE,
    hasard: hasard,
    copie: copie,
    completer: completer,
    problemesRegles: problemesRegles,

    { pay: 1, cats: ['devinette', 'bruit', 'ombre', 'ciel', 'rails'], l: 7, nch: 3, px: 0.45, pa: 0.2, tu: 1, flash: 1900, tuto: 'express' },
    { pay: 1, cats: ['bruit', 'eau', 'ombre', 'ciel', 'rails', 'devinette'], l: 7, nch: 3, px: 0.3, pa: 0.3, tu: 3, flash: 1800 },
    { pay: 1, cats: ['devinette', 'ombre', 'ciel', 'rails', 'bruit'], l: 7, nch: 3, px: 0.3, pa: 0.25, tu: 1, pt: 2, flash: 1800, tuto: 'pont' },
    { pay: 1, cats: ['bruit', 'eau', 'ombre', 'ciel', 'rails', 'devinette'], l: 8, nch: 3, px: 0.3, pa: 0.3, tu: 2, pt: 1, flash: 1800 },
    { pay: 2, cats: ['eau', 'bruit', 'ombre', 'devinette', 'rails', 'ciel'], l: 8, nch: 3, px: 0.3, pa: 0.25, tu: 1, pn: 2, flash: 1800, tuto: 'pn' },
    { pay: 2, cats: ['roues', 'eau', 'bruit', 'ombre', 'devinette'], l: 8, nch: 3, px: 0.3, pa: 0.3, tu: 1, pt: 1, pn: 2, flash: 1800, tuto: 'roues' },
    { pay: 2, cats: ['bruit', 'eau', 'ombre', 'ciel', 'rails', 'devinette', 'roues'], l: 8, nch: 4, px: 0.3, pa: 0.3, tu: 2, pt: 1, pn: 2, flash: 1700, tuto: 'quatre' },
    { pay: 2, cats: ['rapide', 'eau', 'ombre', 'roues', 'bruit'], l: 8, nch: 4, px: 0.3, pa: 0.3, tu: 1, pt: 1, pn: 4, flash: 1700, tuto: 'rapide' },
    { pay: 2, cats: ['bruit', 'eau', 'ombre', 'ciel', 'rails', 'devinette', 'roues', 'rapide'], l: 9, nch: 4, px: 0.3, pa: 0.3, tu: 2, pt: 1, pn: 4, flash: 1600 },
    { pay: 3, cats: ['intrus', 'rails', 'ciel', 'rapide', 'devinette'], l: 9, nch: 4, px: 0.3, pa: 0.3, tu: 2, pt: 1, pn: 2, flash: 1600, tuto: 'intrus' },
    { pay: 3, cats: TOUTES, l: 9, nch: 4, px: 0.3, pa: 0.55, tu: 3, pt: 1, pn: 2, flash: 1300 },
    { pay: 3, cats: TOUTES, l: 9, nch: 4, px: 0.3, pa: 0.35, tu: 2, pt: 2, pn: 4, flash: 1300 },
    { pay: 3, cats: TOUTES, l: 10, nch: 4, px: 0.35, pa: 0.4, tu: 3, pt: 2, pn: 4, flash: 1200 },
    { pay: 3, cats: TOUTES, l: 10, nch: 4, px: 0.4, pa: 0.45, tu: 3, pt: 2, pn: 4, flash: 1100 }
  ];
  // En ligne : toutes les questions et tous les obstacles, paysage qui change à chaque manche.
  var EN_LIGNE = { cats: TOUTES, l: 9, nch: 3, px: 0.3, pa: 0.35, tu: 2, pt: 1, pn: 4, flash: 1500 };

  function tirer(liste, alea) { return liste[Math.floor(alea() * liste.length) % liste.length]; }
  function melanger(l, alea) {
    l = l.slice();
    for (var i = l.length - 1; i > 0; i--) { var j = Math.floor(alea() * (i + 1)) % (i + 1); var x = l[i]; l[i] = l[j]; l[j] = x; }
    return l;
  }
  function filtre(f) { return IDS.filter(f); }
  function entier(x) { return typeof x === 'number' && Math.floor(x) === x; }

  // Clés qui ne doivent pas se répéter entre les réponses d'une question.
  function cleS(x) { return 's' + at(x, 4); }
  function cleF(x) { return 'f' + at(x, 3); }
  function cleB(x) { return 'b' + (GB[x] === undefined ? x : GB[x]); }

  // Choix : la bonne réponse + des intrus tirés du pool, sans deux clés pareilles.
  function choixDistincts(bonne, pool, n, alea, cles) {
    var vus = {};
    cles(bonne).forEach(function (k) { vus[k] = 1; });
    var l = melanger(pool, alea), r = [];
    for (var i = 0; i < l.length && r.length < n - 1; i++) {
      var x = l[i];
      if (x === bonne) continue;
      var ks = cles(x);
      if (ks.some(function (k) { return vus[k]; })) continue;
      ks.forEach(function (k) { vus[k] = 1; });
      r.push(x);
    }
    var ch = melanger(r.concat([bonne]), alea);
    return { ch: ch, ok: ch.indexOf(bonne), p: '' };
  }
  function cles(dur, extra) {
    return function (x) { var k = [cleS(x)]; if (!dur) k.push(cleF(x)); if (extra) k.push(extra(x)); return k; };
  }

  // Fabrique d'une question de chaque sorte : { ch: véhicules, ok: bonne réponse, p: ce qui est montré }.
  var FAB = {
    bruit: function (n, alea, dur) {
      var bonne = tirer(filtre(function (x) { return !!at(x, 2); }), alea);
      var q = choixDistincts(bonne, IDS, n, alea, cles(dur, cleB));
      q.p = at(bonne, 2);
      return q;
    },
    eau: function (n, alea, dur) {
      var bonne = tirer(filtre(function (x) { return at(x, 0) === 'eau'; }), alea);
      return choixDistincts(bonne, filtre(function (x) { return at(x, 0) !== 'eau'; }), n, alea, cles(dur));
    },
    ombre: function (n, alea, dur) {
      var bonne = tirer(IDS, alea);
      var q = choixDistincts(bonne, IDS, n, alea, cles(dur));
      q.p = bonne;
      return q;
    },
    ciel: function (n, alea, dur) {
      var bonne = tirer(filtre(function (x) { return at(x, 0) === 'air'; }), alea);
      var pool = filtre(function (x) { var m = at(x, 0); return m === 'route' || m === 'rail' || m === 'eau' || m === 'neige'; });
      return choixDistincts(bonne, pool, n, alea, cles(dur));
    },
    rails: function (n, alea, dur) {
      var bonne = tirer(filtre(function (x) { return at(x, 0) === 'rail'; }), alea);
      var pool = filtre(function (x) { var m = at(x, 0); return m === 'route' || m === 'eau' || m === 'air' || m === 'neige'; });
      return choixDistincts(bonne, pool, n, alea, cles(dur));
    },
    devinette: function (n, alea, dur) {
      var bonne = tirer(filtre(function (x) { return at(x, 6) === 1; }), alea);
      var q = choixDistincts(bonne, IDS, n, alea, cles(dur));
      q.p = bonne;
      return q;
    },
    roues: function (n, alea, dur) {
      var bonne = tirer(filtre(function (x) { return at(x, 1) === 2; }), alea);
      var pool = filtre(function (x) { var r = at(x, 1); return r === 4 || r === 0; });
      return choixDistincts(bonne, pool, n, alea, cles(dur));
    },
    rapide: function (n, alea, dur) {
      // Le plus rapide a toujours une nette avance (2 crans, 1 avec l'express).
      var ecart = dur ? 1 : 2;
      var vmax = tirer(dur ? [4, 5, 6, 7] : [5, 6, 7], alea);
      var bonne = tirer(filtre(function (x) { return at(x, 5) === vmax; }), alea);
      var pool = filtre(function (x) { return at(x, 5) <= vmax - ecart; });
      return choixDistincts(bonne, pool, n, alea, cles(true));
    },
    intrus: function (n, alea) {
      var m = tirer(['route', 'eau', 'air', 'rail'], alea);
      var memes = melanger(filtre(function (x) { return at(x, 0) === m; }), alea).slice(0, n - 1);
      var autres = filtre(function (x) { var y = at(x, 0); return y !== m && (y === 'route' || y === 'eau' || y === 'air' || y === 'rail'); });
      var seul = tirer(autres, alea);
      var ch = melanger(memes.concat([seul]), alea);
      return { ch: ch, ok: ch.indexOf(seul), p: m };
    }
  };

  // Question d'un wagon ; on évite les 18 dernières bonnes réponses.
  function poser(e, s, w, alea) {
    var x = w.w === 'x';
    var n = Math.min(4, e.cfg.nch + (x ? 1 : 0));
    var q = null;
    for (var essai = 0; essai < 10; essai++) {
      q = FAB[w.c](n, alea, x);
      if (e.vu.indexOf(w.c + ':' + q.ch[q.ok]) < 0) break;
    }
    e.vu.push(w.c + ':' + q.ch[q.ok]);
    if (e.vu.length > 18) e.vu.shift();
    q.c = w.c;
    q.w = w.w;
    q.tun = e.voie[s][e.pos[s]] === 't';
    q.res = null;
    return q;
  }

  // Les 3 wagons d'un tour : sortes différentes, parfois un express et un aiguillage.
  function tirerWagons(e, alea) {
    var cats = melanger(e.cfg.cats, alea), l = [];
    for (var i = 0; i < 3; i++) l.push({ c: cats[i % cats.length], w: 'n' });
    var libres = melanger([0, 1, 2], alea);
    if (e.cfg.px && alea() < e.cfg.px) l[libres.pop()].w = 'x';
    if (e.cfg.pa && alea() < e.cfg.pa) l[libres.pop()].w = 'a';
    return l;
  }

  // Les 4 voies : le même dessin d'obstacles pour tout le monde (équitable).
  //   Passages à niveau : paires (0,1) et (2,3) au milieu de la voie, (1,2) et (3,0) près des gares.
  function faireVoies(cfg, alea) {
    var L = cfg.l, motif = [], pris = {}, k;
    for (k = 0; k < L; k++) motif.push('n');
    function placer(type, nombre, de, a) {
      var c = [];
      for (var j = Math.max(1, de); j <= Math.min(L - 2, a); j++) c.push(j);
      c = melanger(c, alea);
      for (var i = 0; i < c.length && nombre > 0; i++) {
        if (pris[c[i]]) continue;
        motif[c[i]] = type; pris[c[i]] = 1; nombre--;
      }
    }
    if (cfg.pn) placer('H', 1, Math.ceil(L * 0.4), L - 2);
    if (cfg.pn >= 4) placer('W', 1, 1, 2);
    placer('p', cfg.pt || 0, 2, L - 2);
    placer('t', cfg.tu || 0, 1, L - 2);
    var voies = [];
    for (var s = 0; s < 4; s++) {
      var h = s - (s % 2);                      // paire « horizontale » de la place
      var w = s % 2 ? s : (s + 3) % 4;          // paire « verticale »
      voies.push(motif.map(function (x) { return x === 'H' ? 'x' + h : x === 'W' ? 'x' + w : x; }));
    }
    return voies;
  }

  // Bonnes réponses qu'il faut pour poser le rail d'une case.
  function besoin(e, s, seg) {
    if (seg === 'p') return 2;
    if (seg && seg.charAt(0) === 'x') { var f = e.pn[+seg.slice(1)].f; return f >= 0 && f !== s ? 2 : 1; }
    return 1;
  }

  // Avance d'un nombre de bonnes réponses : ponts, barrières, rails posés.
  function avancer(e, s, pts) {
    var r = { g: 0, ouvre: false, ferme: -1, pont: false };
    for (var k = 0; k < pts; k++) {
      var seg = e.voie[s][e.pos[s]];
      if (seg === undefined) break;
      e.att[s] += 1;
      if (e.att[s] >= besoin(e, s, seg)) {
        if (seg === 'p') r.pont = true;
        if (seg.charAt(0) === 'x') { var I = +seg.slice(1); if (e.pn[I].f < 0) { e.pn[I].f = s; r.ferme = I; } }
        e.pos[s] += 1; e.att[s] = 0; r.g += 1;
      } else if (seg.charAt(0) === 'x') r.ouvre = true;
    }
    return r;
  }

  function reste(e, s) { return e.voie[s].length - e.pos[s]; }

  // Rivaux qu'un aiguillage peut dévier : 2 voies de garage au plus chacun.
  function cibles(e, s) {
    var l = [];
    for (var c = 0; c < e.pos.length; c++) if (c !== s && e.dv[c] < 2 && reste(e, c) > 0) l.push(c);
    return l;
  }

  function classement(e) {
    var cl = [];
    for (var s = 0; s < e.pos.length; s++) cl.push(s);
    cl.sort(function (x, y) {
      if (x === e.fini) return -1;
      if (y === e.fini) return 1;
      return (reste(e, x) - reste(e, y)) || (e.att[y] - e.att[x]) || (e.bon[y] - e.bon[x]) || (x - y);
    });
    return cl;
  }

  function finTour(e, s, alea) {
    var P = e.pos.length;
    if (reste(e, s) <= 0) { e.fini = s; e.ph = 'f'; return e; }
    e.tour = (s + 1) % P;
    e.tt += 1;
    if (e.tt >= 60 * P) { e.fini = classement(e)[0]; e.ph = 'f'; return e; }   // garde-fou : 60 tours de table
    e.ph = 'c';
    e.wg = tirerWagons(e, alea);
    return e;
  }

  function forceNiveau(n) {
    var k = Math.max(0, Math.min(NIVEAUX.length - 1, n - 1)) / (NIVEAUX.length - 1);
    return Math.round((0.1 + 0.75 * k) * 100) / 100;
  }
  // Chance qu'un robot réponde juste.
  function chance(fo, c, tun, x) {
    return Math.max(0.08, Math.min(0.96, 0.3 + 0.62 * fo - (DIFF[c] || 0) - (tun ? 0.12 : 0) - (x ? 0.1 : 0)));
  }

  window.JEL_REGLES = {
    places: 4,
    delaiBot: 1000,
    delaiJoueur: 30000,
    pauseManche: 8000,
    attenteSalon: 90000,
    remplacement: 'tour',
    forceEnLigne: 0.55,
    niveaux: NIVEAUX,

    depart: function (alea, places, options) {
      var o = options || {};
      var solo = typeof o.niveau === 'number' && isFinite(o.niveau);
      var idx = solo ? Math.max(0, Math.min(NIVEAUX.length - 1, Math.floor(o.niveau) - 1)) : -1;
      var b = solo ? NIVEAUX[idx] : EN_LIGNE;
      var pay = solo ? b.pay : (Math.max(1, Math.floor(o.manche) || 1) - 1) % 4;
      var cfg = {
        cats: b.cats.slice(), l: b.l, nch: b.nch, px: b.px || 0, pa: b.pa || 0,
        tu: b.tu || 0, pt: b.pt || 0, pn: b.pn || 0, flash: b.flash || 1800, pay: pay
      };
      var e = {
        n: idx, cfg: cfg, voie: faireVoies(cfg, alea), pos: [], att: [], dv: [], bon: [], rep: [],
        pn: [{ f: -1 }, { f: -1 }, { f: -1 }, { f: -1 }],
        tour: solo ? 0 : Math.floor(alea() * places) % places, ph: 'c', wg: null, q: null, der: null, tt: 0, fini: -1, vu: []
      };
      for (var s = 0; s < places; s++) { e.pos.push(0); e.att.push(0); e.dv.push(0); e.bon.push(0); e.rep.push(0); }
      e.wg = tirerWagons(e, alea);
      return e;
    },

    aQui: function (e) { return e.tour; },

    valide: function (e, s, a) {
      if (!a || typeof a !== 'object' || e.fini >= 0 || s !== e.tour) return false;
      if (a.t === 'w') return e.ph === 'c' && entier(a.i) && a.i >= 0 && a.i < e.wg.length;
      if (a.t === 'r') return e.ph === 'q' && !!e.q && entier(a.i) && a.i >= 0 && a.i < e.q.ch.length;
      if (a.t === 'a') return e.ph === 'a' && entier(a.c) && cibles(e, s).indexOf(a.c) >= 0;
      return false;
    },

    jouer: function (e, s, a, alea) {
      if (a.t === 'w') {
        e.der = { s: s, k: 'wagon', i: a.i };
        e.q = poser(e, s, e.wg[a.i], alea);
        e.ph = 'q';
        return e;
      }
      if (a.t === 'r') {
        var q = e.q, ok = a.i === q.ok;
        q.res = { ok: ok, i: a.i };
        e.rep[s] += 1;
        var d = { s: s, k: ok ? 'ok' : 'non', i: a.i, v: q.ch[q.ok], c: q.c, w: q.w, g: 0, ouvre: false, ferme: -1, pont: false, rate: false };
        if (ok) {
          e.bon[s] += 1;
          var r = avancer(e, s, q.w === 'x' ? 3 : 1);
          d.g = r.g; d.ouvre = r.ouvre; d.ferme = r.ferme; d.pont = r.pont;
          e.der = d;
          if (reste(e, s) <= 0) { e.fini = s; e.ph = 'f'; return e; }
          if (q.w === 'a' && cibles(e, s).length) { e.ph = 'a'; return e; }
          return finTour(e, s, alea);
        }
        // Erreur sur un pont : il faut recommencer les deux bonnes réponses.
        if (e.voie[s][e.pos[s]] === 'p' && e.att[s] > 0) { e.att[s] = 0; d.rate = true; }
        e.der = d;
        return finTour(e, s, alea);
      }
      if (a.t === 'a') {
        var c = a.c;
        // La voie de garage s'ajoute devant le prochain rail du rival (après un pont commencé).
        var ou = e.pos[c] + (e.att[c] > 0 ? 1 : 0);
        e.voie[c].splice(Math.min(ou, e.voie[c].length), 0, 'd');
        e.dv[c] += 1;
        e.der = { s: s, k: 'aig', c: c, ou: ou };
        return finTour(e, s, alea);
      }
      return e;
    },

    // Robot : prend le wagon qui rapporte le plus pour lui (express s'il est sûr de
    // lui, aiguillage quand un rival va gagner), répond juste selon sa force et la
    // difficulté, dévie le rival le plus avancé ; une part de hasard le fait varier.
    bot: function (e, s, alea, force) {
      var fo = typeof force === 'number' ? force : 0.5;
      var tun = e.voie[s][e.pos[s]] === 't';
      if (e.ph === 'c') {
        var meneur = 99;
        for (var c = 0; c < e.pos.length; c++) if (c !== s) meneur = Math.min(meneur, reste(e, c));
        // Un robot distrait prend un wagon au hasard ; sinon celui qui lui rapporte le plus.
        if (alea() > 0.3 + 0.65 * fo) return { t: 'w', i: Math.floor(alea() * e.wg.length) % e.wg.length };
        var mieux = 0, vmax = -1;
        for (var i = 0; i < e.wg.length; i++) {
          var w = e.wg[i], p = chance(fo, w.c, tun, w.w === 'x');
          var v = p * (w.w === 'x' ? 3 : 1) + (w.w === 'a' && meneur <= 3 ? p * 0.9 : 0) + alea() * 0.4;
          if (v > vmax) { vmax = v; mieux = i; }
        }
        return { t: 'w', i: mieux };
      }
      if (e.ph === 'q' && e.q) {
        var q = e.q;
        if (alea() < chance(fo, q.c, q.tun, q.w === 'x')) return { t: 'r', i: q.ok };
        var faux = [];
        for (var j = 0; j < q.ch.length; j++) if (j !== q.ok) faux.push(j);
        return { t: 'r', i: tirer(faux, alea) };
      }
      if (e.ph === 'a') {
        var l = cibles(e, s);
        if (alea() < 0.35 + 0.6 * fo) l.sort(function (x, y) { return (reste(e, x) - reste(e, y)) || (x - y); });
        else l = melanger(l, alea);
        return { t: 'a', c: l[0] };
      }
      return { t: 'w', i: 0 };
    },

    fin: function (e) {
      if (e.fini < 0) return null;
      return { classement: classement(e), scores: e.pos.slice() };
    },

    // Données et calculs partagés avec l'écran du jeu.
    outils: {
      V: V, TOUTES: TOUTES, NIVEAUX: NIVEAUX, EN_LIGNE: EN_LIGNE, forceNiveau: forceNiveau,
      besoin: besoin, reste: reste, cibles: cibles, classement: classement
    }
  };
})();
</script>

    font-size: clamp(1.9rem, 8.6vw, 3.3rem); line-height: 1.04; text-align: center; padding: 0 16px; color: #fff;

  .panneau-titre { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 520px; padding: 0 14px; }
  .consigne {

  #total-titre { background: #fffaf0cc; border-radius: 10px; padding: 2px 10px; font-weight: 700; }

  /* Niveaux et collection */
  #ecran-niveaux, #ecran-collection { background: linear-gradient(#bfe6ff, #f3ead2 40%); }
  .defile { overflow-y: auto; width: 100%; max-width: 640px; padding: 4px 12px 20px; flex: 1; -webkit-overflow-scrolling: touch; }
  .grille { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .case {
    min-height: 74px; border-radius: 16px; background: #fffaf0; border: 3px solid #5a6c86; display: flex; flex-direction: column;

  .case small { font-size: .85rem; letter-spacing: 1px; color: #b7bfcb; }

  .case.ferme { background: #d5dbe4; border-color: #9aa6b6; color: #6b7686; box-shadow: none; }
  .case.actuel { box-shadow: 0 0 0 4px #e0453a; }

  #niv-aide { margin: 4px 0 10px; }
  .titre-section { font-weight: 900; font-size: 1.1rem; margin: 12px 0 6px; text-align: center; }
  .locos { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .loco-choix { background: #fffaf0; border: 3px solid #b7c3d4; border-radius: 16px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 700; font-size: .85rem; }
  .loco-choix canvas { width: 92px; height: 60px; }
  .loco-choix.choisie { border-color: #e0453a; background: #fff1d6; box-shadow: 0 0 0 3px #ffd75e; }
  .loco-choix:disabled { opacity: .55; }
  .autocollants { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .autocollant { background: #fff; border-radius: 14px; border: 2px dashed #b7c3d4; display: flex; flex-direction: column; align-items: center; padding: 4px 2px; font-size: .72rem; font-weight: 700; text-align: center; min-height: 82px; }
  .autocollant.oui { border: 3px solid #f0b400; box-shadow: 0 2px 0 #c58b00; transform: rotate(-2deg); }
  .autocollant:nth-child(2n).oui { transform: rotate(2deg); }
  .autocollant canvas { width: 70px; height: 50px; }

  /* Écran de jeu */
  #ecran-jeu { background: #9fd17a; align-items: stretch; }
  #places { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: max(6px, env(safe-area-inset-top)) 6px 4px; width: 100%; max-width: 640px; align-self: center; }
  .place {
    --c: #888; position: relative; background: #fffaf0; border: 3px solid #d9dfe8; border-radius: 14px; padding: 3px 2px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 2px 0 #0002; transition: transform .2s, box-shadow .2s, border-color .2s; min-width: 0;
  }
  .place canvas.loco { width: 54px; height: 30px; display: block; }
  .place .pts { font-weight: 900; font-size: .95rem; line-height: 1.1; color: var(--c); }
  .place .barre { width: 86%; height: 6px; border-radius: 3px; background: #0000001a; overflow: hidden; }
  .place .barre > div { height: 100%; background: var(--c); width: 0; transition: width .4s; }
  .place .tag { font-size: .72rem; font-weight: 800; display: inline-flex; gap: 3px; align-items: center; padding: 1px 5px; border-radius: 8px; background: #0000000f; min-height: 20px; max-width: 100%; overflow: hidden; }
  .place .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place .tag svg { width: 14px; height: 14px; flex: none; }
  .place.moi .tag { background: #ffd84d; color: #4a2e00; }
  .place.actif { transform: translateY(-2px) scale(1.04); border-color: var(--c); box-shadow: 0 0 0 3px var(--c), 0 6px 14px #0003; z-index: 1; }
  .place.bond .pts { animation: bond .45s ease-out; }
  @keyframes bond { 0% { transform: scale(1); } 40% { transform: scale(1.6); } 100% { transform: scale(1); } }
  .place canvas.couronne { position: absolute; top: -9px; right: -5px; width: 26px; height: 20px; display: none; }
  .place.chef canvas.couronne { display: block; }
  #infos { display: flex; align-items: center; gap: 8px; padding: 2px 8px 2px; width: 100%; max-width: 640px; align-self: center; }
  #infos-texte { flex: 1; min-width: 0; text-align: center; line-height: 1.15; background: #fffaf0d9; border-radius: 12px; padding: 3px 6px; }
  #info-niveau { font-size: .82rem; font-weight: 700; color: #45546a; }
  #message { font-weight: 900; font-size: 1.02rem; min-height: 1.3em; }
  #temps { height: 8px; margin: 3px 14px 0; border-radius: 4px; background: #0000001f; overflow: hidden; visibility: hidden; align-self: stretch; }
  #temps > div { --c: #2f6fe0; height: 100%; width: 100%; background: var(--c); transform-origin: left; }
  #zone { flex: 1; position: relative; min-height: 0; }
  #plateau { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #bandeau {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #fffaf0f2; border: 3px solid #2f6fe0;
    border-radius: 18px; padding: 14px 18px; font-weight: 800; text-align: center; display: none; align-items: center; gap: 12px;
    width: min(90%, 360px); box-shadow: 0 8px 24px #0003; z-index: 3; pointer-events: none;
  }
  #bandeau.actif { display: flex; }
  .tourne { width: 30px; height: 30px; border-radius: 50%; border: 4px solid #cfe0ff; border-top-color: #2f6fe0; animation: tourne 1s linear infinite; flex: none; }
  @keyframes tourne { to { transform: rotate(360deg); } }

  /* Panneau du bas : les wagons du tour, ou la question d'un autre joueur */
  #panneau {
    background: linear-gradient(#5b6f8e, #44546d); padding: 6px 6px max(8px, env(safe-area-inset-bottom)); color: #fff;
    display: flex; flex-direction: column; gap: 4px; min-height: 132px; position: relative;
  }
  #panneau-titre { text-align: center; font-weight: 800; font-size: .92rem; min-height: 1.2em; line-height: 1.2; }
  #wagons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 520px; width: 100%; align-self: center; }
  .wagon {
    position: relative; background: #fffaf0; color: #22303f; border: 3px solid #2d3a4f; border-radius: 12px 12px 8px 8px;
    padding: 4px 2px 12px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-weight: 800; font-size: .8rem;
    box-shadow: 0 3px 0 #1d2635; min-height: 88px; transition: transform .15s, opacity .2s;
  }
  .wagon::before, .wagon::after { content: ''; position: absolute; bottom: -9px; width: 16px; height: 16px; border-radius: 50%; background: #2d3a4f; border: 3px solid #c9ced6; }
  .wagon::before { left: 14%; } .wagon::after { right: 14%; }
  .wagon canvas { width: 46px; height: 40px; }
  .wagon .badge { font-size: .68rem; font-weight: 900; padding: 0 5px; border-radius: 6px; line-height: 1.4; }
  .wagon.x { background: linear-gradient(#fff3b8, #ffd34d); border-color: #a87400; }
  .wagon.x .badge { background: #a87400; color: #fff; }
  .wagon.a { background: linear-gradient(#e4f0ff, #b8d4ff); border-color: #2f5fd0; }
  .wagon.a .badge { background: #2f5fd0; color: #fff; }
  .wagon.tunnel { box-shadow: 0 3px 0 #1d2635, inset 0 -8px 0 #4a3a2e55; }
  .wagon:disabled { opacity: .82; }
  .wagon.moi:not(:disabled) { animation: invite 1.6s ease-in-out infinite; }
  @keyframes invite { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .wagon.choisi { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 0 4px #ffd84d, 0 6px 0 #1d2635; opacity: 1; }
  .wagon.ecarte { opacity: .35; }
  #resume { display: none; flex-direction: column; align-items: center; gap: 4px; max-width: 520px; width: 100%; align-self: center; }
  #resume.actif { display: flex; }
  #resume-q { font-weight: 800; text-align: center; font-size: .95rem; background: #ffffff1f; border-radius: 10px; padding: 2px 10px; }
  #resume-choix { display: flex; gap: 6px; justify-content: center; }
  .mini { width: 70px; height: 54px; background: #fffaf0; border-radius: 10px; border: 3px solid transparent; display: flex; align-items: center; justify-content: center; }
  .mini canvas { width: 62px; height: 44px; }
  .mini.modele { background: #dfe6ef; border-color: #2d3a4f; margin-right: 8px; }
  .mini.bon { border-color: #3fae4a; box-shadow: 0 0 0 3px #b8f0b4; }
  .mini.faux { border-color: #e0453a; }
  #resume-res { font-weight: 800; min-height: 1.2em; text-align: center; font-size: .9rem; }

  /* Question (au-dessus du plateau) */
  #question { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5; padding: 6px; background: #1d263588; }
  #question.actif { display: flex; }
  .carte-q {
    background: linear-gradient(#fffaf0, #eef2f8); border: 3px solid #5a6c86; border-radius: 20px; padding: 10px; width: min(100%, 470px);
    max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; align-items: center; box-shadow: 0 10px 34px #0006; animation: arrivee .3s ease-out;
  }
  .carte-q.x { border-color: #c58b00; background: linear-gradient(#fff8d6, #ffe9a0); }
  .carte-q.secoue { animation: secoue .4s; }
  @keyframes secoue { 0%, 100% { transform: none; } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
  #q-entete { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: .82rem; color: #45546a; flex-wrap: wrap; justify-content: center; }
  #q-entete span { background: #0000000d; border-radius: 8px; padding: 1px 8px; }
  #q-entete span:empty { display: none; }
  #q-texte { font-weight: 900; font-size: 1.2rem; text-align: center; line-height: 1.2; }
  #q-media { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #q-media:empty { display: none; }
  #q-media canvas { width: 150px; height: 105px; background: #fff; border-radius: 14px; border: 2px solid #c8d1de; }
  .bulle { background: #fff; border: 3px solid #2f6fe0; border-radius: 18px; padding: 6px 14px; font-weight: 900; font-size: 1.15rem; text-align: center; position: relative; }
  .phrase { background: #fff; border-left: 6px solid #f0b400; border-radius: 10px; padding: 6px 12px; font-weight: 700; font-size: 1.05rem; line-height: 1.3; text-align: center; font-style: italic; }
  #q-choix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  #q-choix.quatre { grid-template-columns: repeat(2, 1fr); }
  .choix {
    position: relative; background: #fff; border: 3px solid #b7c3d4; border-radius: 16px; padding: 4px 2px 6px; display: flex; flex-direction: column;
    align-items: center; gap: 2px; font-weight: 800; font-size: .86rem; box-shadow: 0 3px 0 #8d9bb0; min-height: 96px; overflow: hidden; line-height: 1.1;
  }
  .choix canvas { width: 100%; max-width: 116px; aspect-ratio: 10 / 7; height: auto; }
  .choix .porte { position: absolute; inset: 0; display: none; background: radial-gradient(ellipse at 50% 100%, #2b2320 55%, #5a4636 56%, #7d6a58 70%, #9b8a77); }
  .choix.cache .porte { display: block; animation: porte .35s ease-out; }
  @keyframes porte { from { transform: translateY(-100%); } to { transform: none; } }
  .choix.bon { border-color: #2e9c3b; background: #e3fbe0; box-shadow: 0 0 0 4px #9ee59a; }
  .choix.bon .porte, .choix.faux .porte { display: none; }
  .choix.faux { border-color: #e0453a; background: #ffe4e1; }
  #q-bas { display: flex; gap: 8px; align-items: center; min-height: 0; }
  #q-bas:empty { display: none; }
  #q-res { font-weight: 900; font-size: 1.05rem; text-align: center; min-height: 1.2em; }
  #q-res:empty { display: none; }
  .rivaux { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .rival { background: #fff; border: 3px solid var(--c); border-radius: 16px; padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; font-size: .82rem; }
  .rival canvas { width: 70px; height: 40px; }
  .rival:disabled { opacity: .4; }

  /* Voiles (pause, tutoriel, fin, salon) */
  .voile { position: fixed; inset: 0; background: #0f1a2a99; display: none; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
  .voile.actif { display: flex; }
  .carte {
    background: linear-gradient(#fffaf0, #e8eef6); border: 3px solid #5a6c86; border-radius: 22px; padding: 16px 14px;
    width: min(100%, 410px); max-height: 100%; overflow-y: auto; text-align: center; display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 10px 40px #0007; animation: arrivee .35s ease-out;
  }
  @keyframes arrivee { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
  .carte h2 { font-size: 1.45rem; color: #1f4f8f; }
  .carte p { line-height: 1.35; }
  #tuto-demo { width: 100%; max-width: 320px; aspect-ratio: 560 / 360; align-self: center; background: #dff0d0; border-radius: 14px; border: 2px solid #8fa3bf; }
  #fin-etoiles { font-size: 2.7rem; letter-spacing: 6px; min-height: 52px; }
  #fin-etoiles span { display: inline-block; color: #c5ccd6; }
  #fin-etoiles span.oui { color: #ffc21a; animation: envol .6s ease-out both; text-shadow: 0 0 12px #ffd84d, 0 2px 0 #b07800; }
  @keyframes envol { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.35) rotate(10deg); } 100% { transform: none; } }
  #fin-points { font-size: 1.1rem; font-weight: 800; }
  #fin-classement, #salon-classement { display: flex; flex-direction: column; gap: 5px; }
  .ligne-cl { display: flex; align-items: center; gap: 8px; background: #ffffffa8; border-radius: 12px; padding: 3px 10px; border: 2px solid transparent; }
  .ligne-cl.moi { border-color: #f0a400; background: #fff3c4; }
  .ligne-cl .rang { font-weight: 900; width: 1.6em; text-align: right; }
  .ligne-cl canvas { width: 46px; height: 26px; flex: none; }
  .ligne-cl .qui { flex: 1; text-align: left; font-weight: 700; display: flex; align-items: center; gap: 4px; min-width: 0; }
  .ligne-cl .qui span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ligne-cl .qui svg { width: 16px; height: 16px; flex: none; }
  .ligne-cl .nb { font-weight: 900; white-space: nowrap; }
  #fin-record, #fin-debloque, #fin-compte, #fin-cadeau { font-weight: 700; }
  #fin-debloque, #fin-cadeau { color: #1d7a3b; }
  #fin-cadeau { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #fin-cadeau:empty { display: none; }
  #fin-cadeau canvas { width: 64px; height: 45px; animation: envol .7s ease-out both; }
  #fin-compte { color: #2f6fe0; }
  #fin-boutons, #pause-boutons { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
  #place-langue-pause { display: flex; justify-content: center; }
  #pause-ligne { background: #e5efff; border-radius: 12px; padding: 6px 8px; font-weight: 600; }
  #salon-resultat { display: flex; flex-direction: column; gap: 5px; }
  #salon-resultat-titre { font-weight: 800; color: #45546a; }
  #salon-places { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .salon-place { background: #ffffffc0; border: 3px solid #d9dfe8; border-radius: 14px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; min-width: 0; }
  .salon-place canvas { width: 64px; height: 52px; display: block; }
  .salon-place.moi { border-color: #f0a400; background: #fff3c4; }
  .salon-place .tag { font-size: .72rem; font-weight: 800; display: inline-flex; gap: 3px; align-items: center; padding: 1px 5px; border-radius: 8px; background: #0000000f; min-height: 20px; max-width: 100%; overflow: hidden; }
  .salon-place .tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .salon-place .tag svg { width: 14px; height: 14px; flex: none; }
  .salon-place.moi .tag { background: #ffd84d; }
  .salon-place.arrive { animation: arrivee .45s ease-out; }
  #salon-message { font-weight: 700; line-height: 1.3; }
  #salon-compte { color: #2f6fe0; font-weight: 700; }
  #salon-compte:empty, #salon-message:empty { display: none; }
  #btn-lancer { font-size: 1.3rem; padding: 10px 16px; }
  #btn-lancer[hidden] { display: none; }
  #confettis { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  #toast {
    position: fixed; left: 50%; bottom: 150px; transform: translate(-50%, 20px); opacity: 0; z-index: 25;
    background: #fffaf0; color: #22303f; font-weight: 800; padding: 10px 16px; border-radius: 14px; border: 2px solid #2f6fe0;
    transition: opacity .25s, transform .25s; pointer-events: none; text-align: center; width: max-content; max-width: 90%; box-shadow: 0 4px 14px #0004;
  }
  #toast.actif { opacity: 1; transform: translate(-50%, 0); }
  #toast.haut { bottom: auto; top: 10px; }
  @media (min-width: 700px) {
    .place canvas.loco { width: 64px; height: 36px; }
    .wagon canvas { width: 56px; height: 48px; }
    #panneau-titre { font-size: 1rem; }
  }
  @media (max-height: 700px) {
    #panneau { min-height: 116px; }
    .wagon { min-height: 76px; }
    .wagon canvas { width: 38px; height: 32px; }
    .choix { min-height: 84px; }
    #q-media canvas { width: 120px; height: 84px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>

<!-- Collection : locomotives et autocollants -->
<div id="ecran-collection" class="ecran">
  <div class="barre-haut">
    <button id="col-retour" class="rond" type="button" data-i18n-aria="bouton.retour">←</button>
    <h2 data-i18n="collection.titre"></h2>
    <span id="col-total" class="petit"></span>
  </div>
  <div class="defile">
    <p class="titre-section" data-i18n="collection.locos"></p>
    <p class="petit" data-i18n="collection.locosAide"></p>

<script>
(function () {
  'use strict';

  // =====================================================================
  //  La gare des devinettes roulantes — quiz et stratégie sur les véhicules
  //  À son tour, on choisit un wagon-question, on devine le bon véhicule et
  //  on pose un rail vers la grande gare. Solo : 20 niveaux contre 3 robots.
  //  En ligne : de vrais joueurs remplacent les robots (moteur JEL_MULTI).
  //  Les règles et les questions sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'la-gare-des-devinettes-roulantes';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = O.NIVEAUX;                // mêmes données que les règles
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const VEH = O.V;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);
  const copie = (x) => JSON.parse(JSON.stringify(x));

  // Une couleur de train par place : 0 rouge, 1 bleu, 2 jaune, 3 vert.
  const COUL = ['#e0453a', '#2f6fe0', '#f0b400', '#1d9a55'];
  const COUL_F = ['#8f2119', '#173f8f', '#8a5f00', '#0d5530'];
  const LOCO_PLACE = ['vapeur', 'diesel', 'electrique', 'rapide'];   // locomotives des autres places
  const LOCOS = [{ id: 'vapeur', et: 0 }, { id: 'diesel', et: 10 }, { id: 'electrique', et: 25 }, { id: 'rapide', et: 40 }, { id: 'jouet', et: 55 }];
  // L'autocollant gagné à la première victoire de chaque niveau.
  const AUTOCOLLANTS = ['velo', 'avion', 'tramway', 'locomotive', 'sousmarin', 'telepherique', 'tgv', 'dameuse', 'voilier', 'montgolfiere',
    'paquebot', 'moto', 'cargo', 'course', 'helico', 'pompiers', 'taxi', 'betonniere', 'fusee', 'bus'];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#fff"/><circle cx="10.4" cy="8" r="1.6" fill="#fff"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#fff"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, autos: [], loco: 'vapeur', tutos: [], options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);
  const TUTOS_CONNUS = ['base', 'ciel', 'aiguillage', 'rails', 'tunnel', 'devinette', 'express', 'pont', 'pn', 'roues', 'quatre', 'rapide', 'intrus'];

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 100, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.autos)) prog.autos = d.autos.filter((x) => Number.isInteger(x) && x >= 0 && x < NIVEAUX.length);
      if (typeof d.loco === 'string' && LOCOS.some((l) => l.id === d.loco)) prog.loco = d.loco;
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => TUTOS_CONNUS.indexOf(x) >= 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => {
      if (e > 0) { prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); if (prog.autos.indexOf(i) < 0) prog.autos.push(i); }
    });
    if (!locoDebloquee(prog.loco)) prog.loco = 'vapeur';
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.autos = [];
    prog.loco = 'vapeur';
    prog.tutos = [];
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(), debloque: prog.debloque,
        autos: prog.autos.slice(), loco: prog.loco, tutos: prog.tutos.slice(), options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Le son et la locomotive se règlent aussi hors partie : jamais de nouvelle sauvegarde là.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { loco: prog.loco, options: { son: prog.options.son } }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const locoDebloquee = (id) => { const l = LOCOS.find((x) => x.id === id); return !!l && totalEtoiles() >= l.et; };

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + (o.glisse || d));
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.att || Math.min(0.025, d / 4)));
      if (o.tenu) g.gain.setValueAtTime(v, t + d * o.tenu);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.vibrato) {
        const l = ac.createOscillator(), lg = ac.createGain();
        l.frequency.value = o.vibrato; lg.gain.value = f * (o.vibAmp || 0.05);
        l.connect(lg); lg.connect(osc.frequency); l.start(t); l.stop(t + d + 0.05);
      }
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  // Souffle filtré (vapeur, moteur, réacteur…).
  function souffle(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const n = Math.max(1, Math.floor(ac.sampleRate * d));
      const buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
      f.frequency.setValueAtTime(o.f || 1000, t);
      if (o.vers) f.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const g = ac.createGain(), v = o.vol || 0.2;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + (o.att || 0.02));
      if (o.tenu) g.gain.setValueAtTime(v, t + d * o.tenu);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(f); f.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }

  // Les bruits des véhicules (questions « bruit »).
  const BRUITS = {
    klaxon: () => [0, 0.34].forEach((r) => { note(415, 0.24, { type: 'square', vol: 0.06, filtre: 2200, retard: r, tenu: 0.7 }); note(523, 0.24, { type: 'square', vol: 0.05, filtre: 2200, retard: r, tenu: 0.7 }); }),
    corne: () => { note(185, 0.9, { type: 'sawtooth', vol: 0.07, filtre: 1100, tenu: 0.8 }); note(233, 0.9, { type: 'sawtooth', vol: 0.06, filtre: 1100, tenu: 0.8 }); },
    sonnette: () => [0, 0.22].forEach((r) => { note(2100, 0.4, { vol: 0.09, retard: r, att: 0.003 }); note(2630, 0.3, { vol: 0.05, retard: r, att: 0.003 }); }),
    vroum: () => { note(70, 1.1, { type: 'sawtooth', vol: 0.09, vers: 260, glisse: 0.7, filtre: 900, vibrato: 28, vibAmp: 0.08, tenu: 0.6 }); souffle(1.0, { f: 300, vol: 0.08, q: 0.7 }); },
    teuf: () => { for (let i = 0; i < 7; i++) { note(62, 0.1, { type: 'square', vol: 0.09, filtre: 380, retard: i * 0.16 }); souffle(0.08, { f: 220, vol: 0.09, retard: i * 0.16 }); } },
    pinpon: () => [0, 0.42, 0.84, 1.26].forEach((r, i) => note(i % 2 ? 580 : 435, 0.4, { type: 'triangle', vol: 0.1, retard: r, tenu: 0.85, att: 0.01 })),
    police: () => [0, 0.9].forEach((r) => { note(620, 0.45, { type: 'triangle', vol: 0.1, vers: 1300, retard: r, tenu: 0.9 }); note(1300, 0.45, { type: 'triangle', vol: 0.1, vers: 620, retard: r + 0.45, tenu: 0.9 }); }),
    course: () => { note(260, 1.1, { type: 'sawtooth', vol: 0.07, vers: 1100, glisse: 0.9, filtre: 2600, vibrato: 45, tenu: 0.7 }); souffle(1.0, { f: 1500, vol: 0.05, q: 2 }); },
    tchou: () => { note(880, 0.55, { vol: 0.08, tenu: 0.8, vibrato: 7, vibAmp: 0.01 }); note(1108, 0.55, { vol: 0.06, tenu: 0.8 }); for (let i = 0; i < 4; i++) souffle(0.16, { f: 700, vol: 0.18, q: 0.8, retard: 0.65 + i * 0.22 }); },
    brume: () => { note(98, 1.5, { type: 'sawtooth', vol: 0.1, filtre: 420, tenu: 0.85, att: 0.12 }); note(110, 1.5, { type: 'sawtooth', vol: 0.08, filtre: 420, tenu: 0.85, att: 0.12 }); },
    sonar: () => [0, 0.8].forEach((r) => { note(1480, 0.7, { vol: 0.1, retard: r, att: 0.003 }); note(1480, 0.5, { vol: 0.03, retard: r + 0.25, att: 0.003 }); }),
    avion: () => { souffle(1.7, { f: 300, vers: 2200, vol: 0.18, q: 0.6, att: 0.4, tenu: 0.5 }); note(1700, 1.6, { vol: 0.025, vers: 2300, att: 0.4 }); },
    helico: () => { for (let i = 0; i < 16; i++) souffle(0.06, { f: 180, vol: 0.22, q: 0.9, retard: i * 0.085 }); },
    fusee: () => { souffle(1.8, { type: 'lowpass', f: 260, vers: 900, vol: 0.3, att: 0.25, tenu: 0.6 }); note(55, 1.7, { type: 'sawtooth', vol: 0.06, filtre: 200, att: 0.3 }); }
  };
  const sons = {
    clic: () => note(660, 0.06, { type: 'triangle', vol: 0.07 }),
    wagon: () => { souffle(0.05, { f: 1800, vol: 0.12, q: 3 }); souffle(0.05, { f: 1400, vol: 0.12, q: 3, retard: 0.09 }); },
    bon: () => [784, 1175].forEach((f, i) => note(f, 0.22, { type: 'triangle', vol: 0.11, retard: i * 0.1 })),
    faux: () => { note(196, 0.3, { type: 'triangle', vol: 0.12, vers: 120 }); },
    rail: () => { note(1250, 0.08, { type: 'square', vol: 0.035, filtre: 3000 }); souffle(0.06, { f: 2600, vol: 0.08, q: 4 }); note(180, 0.12, { type: 'triangle', vol: 0.08, retard: 0.02 }); },
    aiguillage: () => { souffle(0.07, { f: 900, vol: 0.18, q: 2 }); note(330, 0.18, { type: 'square', vol: 0.05, filtre: 900, retard: 0.08 }); souffle(0.07, { f: 700, vol: 0.18, q: 2, retard: 0.2 }); },
    barriere: () => [0, 0.25, 0.5].forEach((r) => note(1500, 0.18, { vol: 0.07, retard: r, att: 0.003 })),
    pont: () => { note(140, 0.18, { type: 'triangle', vol: 0.14 }); note(110, 0.2, { type: 'triangle', vol: 0.1, retard: 0.12 }); },
    porte: () => souffle(0.35, { f: 500, vers: 160, vol: 0.12 }),
    sifflet: () => { note(1046, 0.5, { vol: 0.08, tenu: 0.7 }); note(1318, 0.5, { vol: 0.06, tenu: 0.7 }); note(1046, 0.6, { vol: 0.08, tenu: 0.7, retard: 0.6 }); },
    victoire: () => [523, 659, 784, 1047].forEach((f, i) => note(f, 0.26, { type: 'triangle', vol: 0.11, retard: i * 0.13 })),
    defaite: () => [392, 330, 262].forEach((f, i) => note(f, 0.3, { vol: 0.11, retard: i * 0.18 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.035 }),
    arrive: () => { note(660, 0.12, { vol: 0.09 }); note(880, 0.16, { vol: 0.09, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.07 }); note(587, 0.16, { vol: 0.07, retard: 0.1 }); },
    tour: () => { note(988, 0.1, { vol: 0.06 }); note(1318, 0.12, { vol: 0.05, retard: 0.09 }); },
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins : outils
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function poly(c, pts) { c.beginPath(); c.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]); c.closePath(); }
  function remplir(c, coul, trait, ep) { c.fillStyle = coul; c.fill(); if (trait) { c.strokeStyle = trait; c.lineWidth = ep || 2; c.stroke(); } }
  function ligne(c, x1, y1, x2, y2, coul, ep) { c.strokeStyle = coul; c.lineWidth = ep || 2; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
  function roue(c, x, y, r) {
    c.fillStyle = '#2b2b33'; rond(c, x, y, r); c.fill();
    c.fillStyle = '#c9ced6'; rond(c, x, y, r * 0.52); c.fill();
    c.fillStyle = '#6b7280'; rond(c, x, y, r * 0.18); c.fill();
  }
  function vitre(c, x, y, w, h, r) {
    c.fillStyle = '#bfe6ff'; rr(c, x, y, w, h, r || 2); c.fill();
    c.fillStyle = 'rgba(255,255,255,.65)'; c.fillRect(x + w * 0.15, y + h * 0.15, Math.max(1, w * 0.13), h * 0.6);
  }

  // Dessine un véhicule centré en (x, y), largeur w ; ombre = silhouette noire.
  const toile = document.createElement('canvas');
  function dessinerVehicule(c, id, x, y, w, ombre) {
    const f = DESSINS[id];
    if (!f) return;
    if (!ombre) { c.save(); c.translate(x, y); c.scale(w / 100, w / 100); c.lineWidth = 2; f(c); c.restore(); return; }
    const W = Math.ceil(w * 1.1), H = Math.ceil(w * 0.86);
    toile.width = W * 2; toile.height = H * 2;
    const t = toile.getContext('2d');
    t.setTransform(2, 0, 0, 2, 0, 0);
    t.clearRect(0, 0, W, H);
    t.save(); t.translate(W / 2, H / 2); t.scale(w / 100, w / 100); t.lineWidth = 2; f(t); t.restore();
    t.globalCompositeOperation = 'source-in';
    t.fillStyle = ombre === true ? '#1f2633' : ombre;

  }

  // Petit dessin d'une sorte de question (sur les wagons), centré, taille k.
  function dessinerSorte(c, cat, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 50, k / 50); c.lineCap = 'round'; c.lineJoin = 'round';
    if (cat === 'bruit') {
      poly(c, [-20, -8, -10, -8, 2, -18, 2, 18, -10, 8, -20, 8]); remplir(c, '#2f6fe0', '#173f8f');

    } else if (cat === 'eau') {
      c.strokeStyle = '#2f6fe0'; c.lineWidth = 5;
