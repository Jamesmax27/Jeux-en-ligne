    if (retour && performance.now() < retour.fin) cle = 'retour|' + retour.id;
    else if (e && partie && partie.phase === 'jeu' && !attenteTuto) cle = [e.ph, e.nt, e.ws, e.pk, e.tour, actif ? 1 : 0, prog.options.son ? 1 : 0, e.q ? e.q.c.join(',') : ''].join('|');
    if (!force && cle === clePanneau) return;
    const ancienne = clePanneau;
    clePanneau = cle;
    const wag = $('wagons'), qu = $('question'), cib = $('cibles'), reps = $('reponses');
    wag.textContent = ''; reps.textContent = ''; cib.textContent = '';
    wag.classList.add('cache'); qu.classList.add('cache'); cib.classList.add('cache');
    $('pan-sous').textContent = ''; $('pan-aide').textContent = '';
    $('btn-ecouter').classList.add('cache'); $('onomato').textContent = ''; $('indice-dessin').classList.add('cache');
    if (cle === 'vide') { $('pan-titre').textContent = ''; pan.style.visibility = e ? 'visible' : 'hidden'; return; }
    pan.style.visibility = 'visible';
    if (cle.indexOf('retour') === 0) { afficherQuestion(retour.q, false, retour); return; }
    const s = R.aQui(e);
    if (e.ph === 'choix') {
      $('pan-titre').textContent = actif ? tr('pan.choix') : phrase('pan.choixAutre', { nom: nomDans(s) });
      $('pan-sous').textContent = sousTitre(e, s);
      wag.classList.remove('cache');
      e.w.forEach((w, i) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'wagon k-' + w.k; b.dataset.i = String(i);
        const cv = document.createElement('canvas'); cv.width = 180; cv.height = 120;
        wagonDessin(cv.getContext('2d'), w.k, w.q.t, 180, 120);
        const nom = document.createElement('span'); nom.textContent = w.k === 'm' ? tr('wagon.mystere') : tr('type.' + w.q.t);
        const gain = document.createElement('span'); gain.className = 'gain';
        gain.textContent = tr('wagon.' + w.k, { n: O.gains[w.k] });
        b.append(cv, nom, gain);
        b.setAttribute('aria-label', (w.k === 'm' ? tr('wagon.mystere') : tr('type.' + w.q.t)) + ' · ' + tr('wagon.' + w.k, { n: O.gains[w.k] }));
        b.disabled = !actif;
        if (actif) b.addEventListener('click', () => { audio(); sons.wagon(); envoyer(i); });
        wag.appendChild(b);
      });
      $('pan-aide').textContent = actif ? tr(e.w.some((w) => w.k === 'x') ? 'pan.aideChoix' : 'pan.aideChoixSimple') : '';
    } else if (e.ph === 'reponse') {
      afficherQuestion(e.q, actif, null);
      if (ancienne.indexOf(e.ph + '|' + e.nt + '|' + e.ws + '|' + e.pk) !== 0) {
        tunnelDebut = performance.now();
        if (e.q.t === 'bruit') setTimeout(() => { if (vue === e) jouerBruit(e.q.c[e.q.a]); }, 250);
        if (e.q.tun) sons.tunnel();
      }
    } else if (e.ph === 'aig') {
      const l = O.cibles(e, s);
      $('pan-titre').textContent = actif ? tr('pan.aig') : phrase('pan.aigAutre', { nom: nomDans(s) });
      cib.classList.remove('cache');
      l.forEach((k) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'cible'; b.dataset.i = String(k);
        const cv = document.createElement('canvas'); cv.width = 140; cv.height = 92;
        locomotive(cv.getContext('2d'), styleDe(k), COUL[k], 2, 2, 136, 88, false);
        const n = document.createElement('span'); n.textContent = nomDans(k);
        const r = document.createElement('span'); r.textContent = tr('rails.compte', { n: e.r[k], total: e.L });
        b.append(cv, n, r);
        b.style.borderColor = COUL[k];
        b.disabled = !actif;
        if (actif) b.addEventListener('click', () => { audio(); envoyer(k); });
        cib.appendChild(b);
      });
      $('pan-aide').textContent = actif ? tr('pan.aideAig') : '';
    }
  }

  // Ce qui attend la locomotive de la place s (pont, barrière, tunnel).
  function sousTitre(e, s) {
    const p = e.r[s];
    if (O.bloque(e, s)) return tr('pan.bloque');
    if (e.pt.indexOf(p) >= 0) return tr('pan.pont');
    if (e.tun.indexOf(p) >= 0) return tr('pan.tunnel');
    const c = O.passageEn(e, p);
    if (c && c.f < 0) return tr('pan.passage');
    return '';
  }

  // Question (en cours, ou avec la réponse donnée : r = { a, juste }).
  function afficherQuestion(q, actif, r) {
    $('question').classList.remove('cache');
    $('pan-titre').textContent = texteQuestion(q);
    const e = vue;
    let sous = '';
    if (r) sous = r.juste ? (r.texte || tr('pan.bravo')) : tr('pan.rate', { nom: tr('v.' + q.c[q.a]) });
    else if (e && e.pk) sous = tr('pan.pont2');
    else if (q.tun) sous = tr('pan.tunnelQ');
    else if (e && e.w[e.ws] && e.w[e.ws].k === 'x') sous = tr('pan.express');
    $('pan-sous').textContent = sous;
    const id = q.c[q.a];
    if (q.t === 'bruit') {
      if (!q.tun || r) { $('btn-ecouter').classList.remove('cache'); }
      if (!prog.options.son || r) $('onomato').textContent = tr('son.' + id);
    } else if (q.t === 'ombre' || q.t === 'zoom') {
      const cv = $('indice-dessin'), c = cv.getContext('2d');
      cv.classList.remove('cache');
      delete cv.dataset.noir;
      cv.classList.toggle('rond-indice', q.t === 'zoom');
      if (q.t === 'zoom') { cv.width = 180; cv.height = 180; c.clearRect(0, 0, 180, 180); loupe(c, id, q.z, 84, 84, 70); }
      else { cv.width = 300; cv.height = 180; c.clearRect(0, 0, 300, 180); ell(c, 150, 162, 110, 10); remplir(c, 'rgba(0,0,0,.18)'); ombre(c, id, 20, 10, 260, 156); }
    }
    const reps = $('reponses');
    reps.classList.toggle('quatre', q.c.length === 4);
    q.c.forEach((vid, i) => {
      const b = boutonVehicule(vid, i, actif, (k) => envoyer(k));
      if (r) { if (i === q.a) b.classList.add('bonne'); else if (i === r.a) b.classList.add('mauvaise'); }
      reps.appendChild(b);
    });
    $('pan-aide').textContent = actif ? tr('pan.aideRep') : '';
    majTunnel();
  }

  // Tunnel : l'image (ombre, loupe) ou les dessins ne paraissent qu'un instant.
  function majTunnel() {
    const e = vue;
    if (!e || e.ph !== 'reponse' || !e.q || !e.q.tun || (retour && performance.now() < retour.fin)) return;
    const ecoule = performance.now() - tunnelDebut;
    const q = e.q;
    if (q.t === 'ombre' || q.t === 'zoom') {
      const cv = $('indice-dessin');
      if (ecoule > 2200 && !cv.dataset.noir) {
        cv.dataset.noir = '1';
        const c = cv.getContext('2d'), w = cv.width, h = cv.height;
        const g = c.createRadialGradient(w / 2, h / 2, 4, w / 2, h / 2, Math.max(w, h) * 0.6);
        g.addColorStop(0, '#3a2c20'); g.addColorStop(1, '#120c08');
        c.fillStyle = g; c.fillRect(0, 0, w, h);
        for (let i = 0; i < 3; i++) { rond(c, w * (0.3 + i * 0.2), h * 0.5, 3); remplir(c, '#ffe066'); }
      } else if (ecoule <= 2200) delete cv.dataset.noir;
    } else if (q.t === 'milieu' || q.t === 'metier') {
      const cacher = ecoule > 3000;
      document.querySelectorAll('#reponses .rep').forEach((b) => b.classList.toggle('cachee', cacher));
    }
  }

  function envoyer(a) {
    if (!monTour()) {
      if (partie && partie.phase === 'jeu' && Date.now() - (envoyer.d || 0) > 1500) { envoyer.d = Date.now(); toast(tr('tour.attends'), 1300); sons.non(); }
      return;
    }
    if (partie.jouer(a)) { envoye = true; majPanneau(true); }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    if (retour && performance.now() >= retour.fin && clePanneau.indexOf('retour') === 0) majPanneau(true);
    majTunnel();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(w, h, vue.L);
    // Les locomotives roulent jusqu'au bout de leurs rails.
    for (let s = 0; s < PLACES; s++) {
      const cible = avantLoco(geo, vue.r[s]);
      if (locosX[s] === null || Math.abs(locosX[s] - cible) > w) locosX[s] = cible;
      locosX[s] += (cible - locosX[s]) * Math.min(1, dt * 4);
    }
    const tour = partie && partie.phase === 'jeu' && vue.ph !== 'fin' ? R.aQui(vue) : -1;
    const cibles = vue.ph === 'aig' && monTour() ? O.cibles(vue, tour) : null;
    dessinerPlateau(c, vue, geo, {
      t: t, anims: anims, tour: tour, locos: locosX, cibles: cibles,
      particules: (cc) => {
        for (let i = particules.length - 1; i >= 0; i--) {
          const p = particules[i];
          p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
          if (p.vie <= 0) { particules.splice(i, 1); continue; }
          cc.globalAlpha = Math.min(1, p.vie * 2);
          etoile(cc, p.x, p.y, p.k, p.coul);
          cc.globalAlpha = 1;
        }
      }
    });
  }

  function jaillir(s, nbr) {
    if (!vue || !geo) return;
    const x = locosX[s] === null ? geo.x0 : locosX[s], y = yVoie(geo, s);
    for (let k = 0; k < (nbr || 12); k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.6 + Math.random() * 0.4, k: 3 + Math.random() * 4, coul: k % 2 ? COUL[s] : '#ffe066' });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    envoye = false;
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anims = {}; locosX = [null, null, null, null];
    envoye = false; retour = null;
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + styleDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 128, 104);
        rond(c, 64, 60, 42); remplir(c, COUL_T[s], COUL[s], 4);
        locomotive(c, styleDe(s), COUL[s], 16, 30, 96, 64, false);
        if (info.chef) couronne(c, 64, 26, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { loco: tr('loco.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef || tr('loco.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    anims = {}; locosX = [null, null, null, null];
    particules.length = 0;
    envoye = false; retour = null;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, paysage: tr('paysage.' + vue.pay) })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Compteurs d'exploits (autocollants), pour le joueur de l'appareil.
  function compter(dr) {
    if (!dr || !partie || dr.s !== partie.siege) return;
    if (dr.k === 'juste') {
      if (dr.q && dr.q.t === 'bruit') prog.stats.bruit++;
      if (dr.q && dr.q.tun) prog.stats.tun++;
      if (dr.pont) prog.stats.pont++;
      if (dr.f >= 0) prog.stats.pn++;
    } else if (dr.k === 'pont1' || dr.k === 'ouvre') {
      if (dr.q && dr.q.t === 'bruit') prog.stats.bruit++;
      if (dr.q && dr.q.tun) prog.stats.tun++;
    } else if (dr.k === 'aig') prog.stats.aig++;
  }

  let idRetour = 0;
  function surAction(ev) {
    const t = performance.now();
    const avant = ev.avant, apres = ev.apres, s = ev.siege, dr = apres.dr || {};
    vue = JSON.parse(JSON.stringify(apres));
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.moi) envoye = false;
    compter(dr);
    const moi = partie.siege;
    if (dr.k === 'choix') {
      if (!ev.moi) sons.wagon();
    } else if (dr.k === 'juste' || dr.k === 'pont1' || dr.k === 'ouvre' || dr.k === 'faux') {
      const juste = dr.k !== 'faux';
      let texte = '';
      if (dr.k === 'pont1') texte = tr('pan.pont1');
      else if (dr.k === 'ouvre') texte = tr('pan.ouvre');
      else if (dr.k === 'juste') texte = dr.g > 0 ? tr('pan.gain', { n: dr.g }) : tr('pan.bravo');
      retour = { id: ++idRetour, q: dr.q, a: dr.a, juste: juste, texte: texte, fin: t + (ev.moi ? 1300 : 1000) };
      if (juste) sons.juste(); else sons.faux();
      if (dr.k === 'juste') {
        for (let i = avant.r[s]; i < apres.r[s]; i++) { anims['r' + s + '_' + i] = t + (i - avant.r[s]) * 160; sons.rail(i - avant.r[s]); }
        if (dr.g > 0) { jaillir(s, 8 + dr.g * 4); const carte = $('place-' + s); carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }
        if (dr.pont) { sons.pont(); toast(phrase(s === moi ? 'toast.pontToi' : 'toast.pont', { qui: nomDans(s) }), 2000, 'bien'); }
        if (dr.f >= 0) { sons.barriere(); toast(phrase(s === moi ? 'toast.fermeToi' : 'toast.ferme', { qui: nomDans(s) }), 2400); }
      } else if (dr.k === 'ouvre') { sons.barriere(); }
      if (ev.moi) toast(juste ? (texte || tr('pan.bravo')) : tr('toast.attend'), 1500, juste ? 'bien' : 'mal');
    } else if (dr.k === 'aig') {
      sons.aiguille();
      jaillir(dr.v, 10);
      toast(s === moi ? phrase('toast.devieMoi', { cible: nomDans(dr.v) }) : dr.v === moi ? phrase('toast.devieToi', { qui: nomDans(s) }) : phrase('toast.devie', { qui: nomDans(s), cible: nomDans(dr.v) }), 2400, dr.v === moi ? 'mal' : '');
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && vue.ph !== 'fin' && R.aQui(vue) === moi && !ev.moi && dr.k !== 'choix') sons.tour();
    majPanneau(true);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement, autocollants
  // ---------------------------------------------------------------------

  function etoilesPour(e, moi, gagne) {
    if (!gagne) return 0;
    const p = e.nr[moi] ? e.b[moi] / e.nr[moi] : 0;
    return p >= 0.85 ? 3 : p >= 0.6 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');

    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }

      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {

      const special = d.sp ? 2 : -1;
      let rMoi = 2;
      if (e > C && d.gain > 0) rMoi = 2 + Math.min(d.gain, (e - C) / 300);
      let rRival = 3;
      if (d.aig && e > C + 700) rRival = Math.max(2, 3 - (e - C - 700) / 400);
      const barriere = d.sp === 'pn' && !(e > C);
      voie(46, 0, rMoi, d.sp, special, false);
      voie(112, 1, rRival, d.sp, special, false);
      if (d.sp === 'pn') { // la barrière fermée par le rival, devant moi
        const x = xs(2);
        if (barriere) { c.fillStyle = '#fffdf5'; c.fillRect(x + 2, 22, 62, 7); c.fillStyle = '#e8412f'; for (let k = 4; k < 62; k += 12) c.fillRect(x + k, 22, 6, 7); rond(c, x + 60, 26, 5); remplir(c, COUL[1], TRAIT, 1); }
        else ligne(c, x + 4, 22, x + 20, 8, '#e8412f', 4);
      }
      c.fillStyle = '#7b5635'; rr(c, 0, 160, 560, 200, 18); c.fill();
      let mx = 470, my = 340, appui = 0;
      if (e < B) { // 1. toucher le wagon du milieu
        wagonsTuto.forEach((cvw, i) => {
          if (i === 1 && e > 1100) { c.fillStyle = '#ffd84d'; rr(c, 20 + i * 180 - 6, 190 - 6, 172, 128, 16); c.fill(); }
          c.drawImage(cvw, 20 + i * 180, 190, 160, 116);
        });
        const q = Math.min(1, e / 900);
        mx = 470 + (280 - 470) * q; my = 340 + (270 - 340) * q; appui = e > 1000 ? Math.min(1, (e - 1000) / 150) : 0;
      } else if (e < C) { // 2. toucher la bonne réponse (deux fois pour un pont)
        const eq = (e - B) % DQ;
        const cq = d.deux && e - B >= DQ ? ['camion', 'avion', 'voilier'] : d.c;
        const bon = d.deux && e - B >= DQ ? 1 : d.a;
        const id = cq[bon];
        const clue = d.t === 'ombre' || d.t === 'zoom' || d.t === 'bruit';
        if (clue) {
          rr(c, 16, 176, 150, 96, 12); remplir(c, '#fffdf5', TRAIT, 3);
          const noir = d.sp === 'tun' && eq > 1100;
          if (noir) { c.fillStyle = '#1b1622'; rr(c, 16, 176, 150, 96, 12); c.fill(); }
          else if (d.t === 'ombre') ombre(c, id, 26, 184, 130, 80);
          else if (d.t === 'zoom') loupe(c, id, 0, 90, 222, 40);
          else { pictogramme(c, 'bruit', 90, 224, 34); }
        }
        const n = cq.length, x0 = clue ? 180 : 20, lw = (560 - x0 - 16) / n;
        cq.forEach((vid, i) => {
          const x = x0 + i * lw, ok = i === bon && eq > 1600;
          rr(c, x + 4, 186, lw - 8, 86, 12); remplir(c, ok ? '#bff0b8' : '#fffdf5', ok ? '#1d7a2b' : TRAIT, 3);
          vehicule(c, vid, x + 8, 192, lw - 16, 74);
        });
        const cx = x0 + (bon + 0.5) * lw, q = Math.min(1, eq / 1200);
        mx = 470 + (cx - 470) * q; my = 340 + (250 - 340) * q; appui = eq > 1400 ? Math.min(1, (eq - 1400) / 150) : 0;
        if (eq > 1600) { etoile(c, cx + 30, 196, 10, '#ffd84d'); }
      } else { // 3. les rails se posent (ou la barrière s'ouvre, ou on dévie un rival)
        etoile(c, 280, 260, 30 + 6 * Math.sin(e / 120), '#ffd84d');
        if (d.aig && e < D) { const q = Math.min(1, (e - C) / 600); mx = 470 + (300 - 470) * q; my = 340 + (118 - 340) * q; appui = e - C > 600 ? 1 : 0; }
        else { mx = 470; my = 360; }
      }
      main(c, mx, my, 1.5, appui);
      requestAnimationFrame(image);
    }
    requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3a2a14'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  // Toucher une voie du plateau pendant un aiguillage.
  $('plateau').addEventListener('pointerup', (ev) => {
    audio();
    if (!vue || !geo || vue.ph !== 'aig' || !monTour()) return;
    const r = $('plateau').getBoundingClientRect();
    const s = Math.floor((ev.clientY - r.top - geo.haut) / geo.lh);
    if (O.cibles(vue, R.aQui(vue)).indexOf(s) >= 0) envoyer(s);
  });

  function boutonsPanneau() {
    return Array.from(document.querySelectorAll('#panneau-jeu button')).filter((b) => !b.disabled && b.offsetParent !== null && !b.classList.contains('cache'));
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    audio();
    // Chiffres 1 à 4 : wagon, réponse ou voie à dévier.
    const m = /^(Digit|Numpad)([1-4])$/.exec(ev.code);
    if (m) {
      ev.preventDefault();
      const k = parseInt(m[2], 10) - 1;
      const liste = boutonsPanneau().filter((b) => b.dataset.i !== undefined);
      if (liste[k]) liste[k].click();
      return;
    }
    if (ev.code === 'KeyR') { const b = $('btn-ecouter'); if (!b.classList.contains('cache')) b.click(); return; }
    const dirs = { ArrowLeft: -1, ArrowUp: -1, ArrowRight: 1, ArrowDown: 1 };
    if (dirs[ev.code] !== undefined) {
      ev.preventDefault();
      const liste = boutonsPanneau().filter((b) => b.dataset.i !== undefined);
      if (!liste.length) return;
      const i = liste.indexOf(document.activeElement);
      const suivant = liste[(i < 0 ? 0 : (i + dirs[ev.code] + liste.length) % liste.length)];
      try { suivant.focus({ preventScroll: true }); } catch (e) { suivant.focus(); }
      sons.clic();
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-depot').addEventListener('click', () => { audio(); sons.clic(); ouvrirDepot(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('depot-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-ecouter').addEventListener('click', () => {
    const q = retour && performance.now() < retour.fin ? retour.q : (vue && vue.q);
    if (q && q.t === 'bruit') jouerBruit(q.c[q.a]);
  });
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? 10 * vue.b[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
