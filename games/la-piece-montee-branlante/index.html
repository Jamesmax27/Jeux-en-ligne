  function dessinerDemo(cle, k, t) {
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const D = DEMOS[cle];
    c.clearRect(0, 0, 560, 360);
    dessinerCuisine(c, 560, 360, cle === 'mariage' ? 3 : cle === 'vent' || cle === 'cerise' ? 2 : cle === 'chou' || cle === 'gelee' ? 1 : 0, t, 0, k > 1300 && D.v ? D.v / 60 : 0, 330);
    const s = 0.55, cx = 280, sol = 328;
    const e = { L: 300, M: D.M || 0, T: [], p: D.p, v: D.v };
    // la tour de départ, posée avec les mêmes calculs que le jeu
    D.T.forEach((l) => { e.p = l.t; e.v = 0; const r = O.poser(e, l.x, 1 + (e.T.length % 3)); e.T = r.T; });
    e.p = D.p; e.v = D.v;
    const r = O.poser(e, D.x, 0);
    const pose = r.T[r.T.length - 1];
    let y = 0;
    const tremble = cle === 'equilibre' && k < 2200 ? Math.sin(t / 120) * 0.01 : 0;
    const dessinerTour = (T, humeur) => {
      y = 0;
      T.forEach((l, i) => {
        const lean = tremble * (y + l.h / 2) * s;
        dessinerEtage(c, l.t, cx + l.x * s + lean, sol - y * s, l.w * s, l.h * s, { coul: COUL[l.o], t: t, humeur: humeur, graine: i + 2, ly: -1 });
        y += l.h;
      });
    };
    // 0-1300 : balancement ; 1300 : la main touche ; 1300-1800 : chute ; 1800-2200 : pose ; ensuite : immobile
    const d = O.dims(e, D.p, e.T.length);
    const xBal = k < 1300 ? D.x + Math.cos((k / 1300) * Math.PI) * 140 : D.x;
    const yj = 26, bas = 150;
    dessinerTour(e.T, cle === 'equilibre' && k < 2200 ? 1 : 0);
    const topY = sol - y * s;
    if (k < 1300) {
      dessinerGrue(c, 40, 520, yj, cx + xBal * s, bas - d.h * s - 14, 'bois', t);
      dessinerEtage(c, D.p, cx + xBal * s, bas, d.w * s, d.h * s, { coul: COUL[0], t: t, graine: 9, ly: 1 });
    } else if (k < 1800) {
      dessinerGrue(c, 40, 520, yj, cx + D.x * s, bas - d.h * s - 14, 'bois', t);
      const q = (k - 1300) / 500;
      dessinerEtage(c, D.p, cx + (D.x + (r.x0 - D.x) * q) * s, bas + (topY - bas) * q * q, d.w * s, d.h * s, { coul: COUL[0], t: t, graine: 9, ly: 1 });
    } else {
      dessinerGrue(c, 40, 520, yj, cx + D.x * s, bas - 40, 'bois', t);
      const q = Math.min(1, (k - 1800) / 400);
      const px = r.x0 + (pose.x - r.x0) * easeOut(q);
      dessinerEtage(c, pose.t, cx + px * s, topY, pose.w * s, pose.h * s, { coul: COUL[0], t: t, graine: 9, humeur: 0, sq: pose.t === 'j' ? 0 : Math.sin(q * Math.PI) * 0.3 });
      if (cle === 'cerise' && k > 2200) { c.fillStyle = '#ffd84d'; etincelle(c, cx + 40, topY - 40, 12 + Math.sin(t / 100) * 3); etincelle(c, cx - 40, topY - 30, 9); }
    }
    // la main qui touche l'écran
    const appui = k > 1150 && k < 1450;
    main(c, 420, 220 + (appui ? 10 : 0), 46);
    if (appui) { c.strokeStyle = '#2457c9'; c.lineWidth = 3; rond(c, 428, 222, 16 + (k - 1150) / 10); c.stroke(); }
    // flèche du vent
    if (D.v) {
      c.fillStyle = '#2457c9'; c.beginPath(); c.moveTo(60, 200); c.lineTo(120, 200); c.lineTo(120, 188); c.lineTo(146, 210); c.lineTo(120, 232); c.lineTo(120, 220); c.lineTo(60, 220); c.closePath(); c.fill();
    }
  }

  function dessinerTitre(t) {
    const cv = $('fond');
    const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');

    const sol = h * 0.86;
    dessinerCuisine(c, w, h, 0, t, 0, 0, sol);

    if (large) {
      // ordinateur : une pièce montée de chaque côté du panneau
      const s = Math.min(w / 1500, h / 900);
      tourTitre(c, w * 0.18, sol, s, t, 0);
      tourTitre(c, w * 0.82, sol, s * 0.9, t + 900, 1);

      // téléphone : entre le titre et le panneau des boutons

      const bas = document.querySelector('#ecran-titre .panneau').getBoundingClientRect().top - 4;
      const s = Math.max(0.2, Math.min(w / 760, (bas - haut) / 600));
      tourTitre(c, w / 2, Math.max(haut + 120, bas), s, t, 0);
    }
  }

  // Une pièce montée qui oscille doucement, sous une grue qui balance la cerise.
  function tourTitre(c, cx, sol, s, t, variante) {
    const tour = variante
      ? [['g', 0, 320, 2], ['j', -12, 250, 0], ['r', 8, 260, 3], ['c', 0, 150, 1]]
      : [['g', 0, 330, 0], ['r', 14, 300, 1], ['g', -10, 280, 2], ['j', 6, 240, 3], ['c', -4, 150, 0]];
    let y = 0;
    const sway = Math.sin(t / 500) * 0.012;
    c.fillStyle = '#00000018'; ell(c, cx, sol + 6, 320 * s, 18 * s + 4); c.fill();
    c.fillStyle = '#ffffff'; ell(c, cx, sol, 300 * s, 16 * s + 4); c.fill();
    tour.forEach(([sorte, x, lw, o], i) => {
      const lh = sorte === 'j' ? 56 : 70;
      dessinerEtage(c, sorte, cx + x * s + sway * y * s, sol - y * s, lw * s, lh * s, { coul: COUL[o], t: t, humeur: 0, ly: -1, graine: i + 1 + variante * 9, glac: o % 2 ? 'coulant' : 'lisse', deco: i === 2 ? 'vermicelles' : 'aucune' });
      y += lh;
    });
    const yj = sol - y * s - 230 * s;
    const xc = cx + Math.sin(t / 650) * 110 * s;
    dessinerGrue(c, cx - 280 * s, cx + 300 * s, yj, xc, yj + 60 * s, 'bois', t);
    dessinerEtage(c, 'k', xc, yj + 130 * s, 64 * s, 56 * s, { t: t });
  }

  // ---------------------------------------------------------------------
  //  Affiche du jeu (jaquette) : window.JEL_AFFICHE
  //  Une pièce montée géante penche dangereusement : la grue lâche un étage
  //  rose, la cerise saute, la crème gicle, la lumière de la fenêtre éclaire tout.
  // ---------------------------------------------------------------------

  function demarrerAffiche() {
    document.querySelectorAll('.ecran, .voile, #toast').forEach((el) => { el.style.display = 'none'; });
    document.querySelectorAll('.jel-langue, [class*="jel-langue"]').forEach((el) => { el.style.display = 'none'; });
    const pas = (t) => {
      document.querySelectorAll('.jel-langue, [class*="jel-langue"]').forEach((el) => { el.style.display = 'none'; });
      dessinerAffiche(t);
      requestAnimationFrame(pas);
    };
    requestAnimationFrame(pas);
  }

  function dessinerAffiche(t) {
    const cv = $('fond');
    cv.style.display = 'block';
    const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sol = h * 0.8;
    dessinerCuisine(c, w, h, 3, t, 0, 0.6, sol);
    // grand rayon de lumière depuis la fenêtre
    const lum = c.createLinearGradient(0, 0, w, h);
    lum.addColorStop(0, '#fff6d0aa'); lum.addColorStop(0.5, '#fff6d022'); lum.addColorStop(1, '#fff6d000');
    c.fillStyle = lum; c.beginPath(); c.moveTo(0, h * 0.12); c.lineTo(w * 0.35, h * 0.08); c.lineTo(w, h * 0.7); c.lineTo(w * 0.2, h); c.lineTo(0, h); c.closePath(); c.fill();
    const s = Math.min(w / 600, h / 800), cx = w * 0.47;
    // la tour (penchée vers la droite : tout le monde retient son souffle)
    const tour = [['g', 0, 360, 0], ['r', 18, 320, 1], ['g', 34, 300, 2], ['j', 48, 260, 3], ['g', 70, 230, 0], ['c', 92, 130, 1]];
    let y = 0;
    c.fillStyle = '#00000022'; ell(c, cx, sol + 8, 260 * s, 20 * s); c.fill();
    c.fillStyle = '#ffffff'; ell(c, cx, sol, 240 * s, 18 * s); c.fill();
    c.strokeStyle = '#e8cfa7'; c.lineWidth = 3; ell(c, cx, sol, 190 * s, 12 * s); c.stroke();
    tour.forEach(([sorte, x, lw, o], i) => {
      const lh = sorte === 'j' ? 54 : 72;
      c.save();
      const px = cx + x * s, pb = sol - y * s;
      c.translate(px, pb); c.rotate(0.012 * i); c.translate(-px, -pb);
      dessinerEtage(c, sorte, px, pb, lw * s, lh * s, { coul: COUL[o], t: t, humeur: i < 2 ? 1 : 2, lx: 0.8, ly: -1, graine: i + 1, glac: o === 0 ? 'coulant' : o === 2 ? 'pois' : 'lisse', deco: i === 2 ? 'vermicelles' : i === 4 ? 'fraises' : 'aucune' });
      c.restore();
      y += lh;
    });
    const topY = sol - y * s;
    // l'étage lâché par la grue, en pleine chute
    const xc = cx - 40 * s;
    dessinerGrue(c, -20, w - 30, h * 0.07, xc, h * 0.12, 'or', t);
    dessinerEtage(c, 'g', xc + 6 * s, topY - 70 * s, 250 * s, 74 * s, { coul: '#ff5fa0', t: t, humeur: 2, ly: 1, graine: 42, glac: 'coulant', deco: 'etoiles' });
    // traits de vitesse au-dessus de l'étage qui tombe
    c.strokeStyle = '#ffffffcc'; c.lineWidth = 4; c.lineCap = 'round';
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(xc + i * 40 * s, topY - 170 * s); c.lineTo(xc + i * 40 * s, topY - 230 * s); c.stroke(); }
    // la cerise qui saute et la crème qui gicle
    dessinerEtage(c, 'k', cx + 200 * s, topY - 40 * s, 76 * s, 66 * s, { t: t });
    c.fillStyle = '#fff8ec';
    const gouttes = [[150, -10, 16], [190, 30, 11], [-150, 40, 14], [-190, 0, 9], [230, 90, 10], [-120, -40, 8], [120, -60, 9]];
    gouttes.forEach(([gx, gy, r]) => { rond(c, cx + gx * s, topY + gy * s, r * s); c.fill(); });
    c.fillStyle = '#ff5fa0'; rond(c, cx + 170 * s, topY + 70 * s, 9 * s); c.fill(); rond(c, cx - 170 * s, topY + 80 * s, 7 * s); c.fill();
    // étincelles
    c.fillStyle = '#fff3a0';
    [[0.18, 0.3, 16], [0.82, 0.25, 12], [0.75, 0.55, 10], [0.12, 0.6, 9]].forEach(([fx, fy, r]) => etincelle(c, w * fx, h * fy, r * s + Math.sin(t / 200 + fx * 10) * 2));
    // premier plan : macarons et une cuillère, un peu coupés par le bord
    for (let i = 0; i < 4; i++) {
      c.fillStyle = ['#ffb3c8', '#b8e6a8', '#fff0a0', '#c9b8ff'][i];
      rr(c, w * 0.02 + i * 52 * s, h * 0.9, 50 * s, 34 * s, 16 * s); c.fill();
      c.fillStyle = '#fff8ec'; c.fillRect(w * 0.02 + i * 52 * s + 4, h * 0.9 + 15 * s, 42 * s, 5 * s);
    }
    c.fillStyle = '#d8dde6'; ell(c, w * 0.93, h * 0.9, 70 * s, 22 * s, -0.4); c.fill();
    c.fillStyle = '#b8c0cc'; c.save(); c.translate(w * 0.93, h * 0.9); c.rotate(-0.4); c.fillRect(-170 * s, -6 * s, 110 * s, 12 * s); c.restore();
  }

  // ---------------------------------------------------------------------
  //  Images du jeu (page du jeu) : window.JEL_APERCU = 1, 2 ou 3
  //  En pleine partie solo, sans écran titre, ni fenêtre, ni tutoriel, ni son,
  //  rien d'écrit dans la sauvegarde. La tour est montée par les robots des
  //  règles (hasard à graine fixe), puis la partie est figée sur mon tour.
  //    1 = niveau 1, pâtisserie, premiers étages ;
  //    2 = niveau 9, salon de thé : choux, gelée, étage rond ;
  //    3 = niveau 18, mariage : étages qui rétrécissent, vent (écran d'ordinateur).
  // ---------------------------------------------------------------------

  const MOMENTS_APERCU = { 1: { niveau: 1, etages: 2, graine: 12 }, 2: { niveau: 9, etages: 6, graine: 31 }, 3: { niveau: 18, etages: 9, graine: 77 } };

  function ouvrirApercu(n) {
    const m = MOMENTS_APERCU[n];
    niveau = m.niveau;
    session = 'solo';
    enPartie = false;
    let e = null;
    for (let g = m.graine; g < m.graine + 400; g++) {
      const al = window.JEL_MULTI.hasard(g * 7919 + 1);
      e = R.depart(al, PLACES, { niveau: niveau });
      e.tour = 1;
      let garde = 0;
      while (!e.fini && e.T.length < m.etages && garde++ < 60) {
        const s = R.aQui(e);
        R.jouer(e, s, R.bot(JSON.parse(JSON.stringify(e)), s, al, 0.75), al);
      }
      if (e.fini) continue;
      while (R.aQui(e) !== 0 && !e.fini) { const s = R.aQui(e); R.jouer(e, s, R.bot(JSON.parse(JSON.stringify(e)), s, al, 0.75), al); }
      if (!e.fini && (n !== 3 || e.v !== 0) && (n !== 2 || e.T.some((l) => l.t === 'c' || l.t === 'j'))) break;
    }
    vue = e;
    partie = {
      mode: 'solo', phase: 'jeu', siege: 0, chef: -1, manche: 1, etat: e,
      sieges: () => [0, 1, 2, 3].map((s) => ({ moi: s === 0, humain: s === 0, chef: false, nom: null })),
      monTour: () => true, jouer: () => false, pause: () => {}, quitter: () => {},
      estChef: () => false, recommencer: () => false, lancerManche: () => false
    };
    figeGrue = Math.round(e.A * (n === 1 ? -0.35 : n === 2 ? 0.45 : -0.6));
    lache = null;
    afficherEcran('jeu');
    majInterface();
    // quelques éclats de crème et un « +1 » du dernier étage posé
    const l = e.T[e.T.length - 1];
    if (l) {
      const yTop = hauteurTour(e.T) - l.h;
      for (let k = 0; k < 6; k++) particules.push({ x: l.x + (k - 3) * 30, y: yTop + 30 + k * 8, vx: 0, vy: 0, g: 0, vie: 60, k: 4 + k % 3 * 2, coul: k % 2 ? COUL[l.o] : '#fff8ec' });
      particules.push({ x: l.x, y: yTop + l.h + 60, vx: 0, vy: 0, g: 0, vie: 60, texte: tr('jeu.plus'), coul: COUL[l.o] });
    }
    // la boucle tourne, mais rien ne bouge : grue figée, aucun robot ne joue
    const figer = () => { particules.forEach((p) => { p.vx = 0; p.vy = 0; p.vie = 60; }); setTimeout(figer, 500); };
    figer();
  }

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-atelier').addEventListener('click', () => { audio(); sons.clic(); ouvrirAtelier(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('atelier-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !modeApercu && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  if (modeAffiche) { demarrerAffiche(); return; }
  if (modeApercu) { ouvrirApercu(numeroApercu); return; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement dans le salon de sa partie.
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
