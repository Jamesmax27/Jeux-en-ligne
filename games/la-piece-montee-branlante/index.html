<script>
(function () {
  'use strict';

  // =====================================================================
  //  La Pièce Montée Branlante — jeu d'empilement au tour par tour.
  //  Une grue balance l'étage suivant ; on touche pour le lâcher sur la
  //  tour commune. Qui la fait tomber perd la manche. Solo : 20 niveaux
  //  contre 3 robots. En ligne : de vrais joueurs remplacent les robots
  //  (moteur commun JEL_MULTI). Règles et niveaux : bloc jel-regles.
  // =====================================================================

  const JEU = 'la-piece-montee-branlante';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Affiche (window.JEL_AFFICHE) et images du jeu (window.JEL_APERCU) : posés par le robot du site seulement.
  const modeAffiche = !!window.JEL_AFFICHE;
  const numeroApercu = Number(window.JEL_APERCU);
  const modeApercu = !modeAffiche && (numeroApercu === 1 || numeroApercu === 2 || numeroApercu === 3);

  // Une couleur et un chef pâtissier par place : 0 fraise, 1 pistache, 2 citron, 3 myrtille.
  const COUL = ['#ef4f84', '#3fae5a', '#e8a900', '#4a6fe0'];
  const COUL_F = ['#9c1b4c', '#1b6a33', '#8a5c00', '#24409a'];
  const COUL_C = ['#ffd2e1', '#cdeed4', '#fff0b3', '#d3ddff'];

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#fff"/><circle cx="10.4" cy="8" r="1.6" fill="#fff"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#fff"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';

  // Objets de l'atelier, débloqués par le total d'étoiles.
  const GLACAGES = [{ id: 'lisse', e: 0 }, { id: 'coulant', e: 5 }, { id: 'pois', e: 14 }, { id: 'zigzag', e: 26 }, { id: 'marbre', e: 40 }];
  const DECOS = [{ id: 'aucune', e: 0 }, { id: 'vermicelles', e: 3 }, { id: 'fraises', e: 10 }, { id: 'bougies', e: 20 }, { id: 'fleurs', e: 33 }, { id: 'etoiles', e: 50 }];
  const GRUES = [{ id: 'bois', e: 0 }, { id: 'cuivre', e: 12 }, { id: 'sucre', e: 30 }, { id: 'or', e: 54 }];

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const TUTOS_CLES = ['base', 'equilibre', 'rond', 'chou', 'gelee', 'vent', 'cerise', 'mariage'];
  const prog = {
    etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [],
    options: { son: true }, choix: { g: 'lisse', d: 'aucune', c: 'bois' }
  };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);
  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const ouvert = (obj) => totalEtoiles() >= obj.e;

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => TUTOS_CLES.indexOf(x) >= 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
      if (d.choix && typeof d.choix === 'object') {
        if (GLACAGES.some((x) => x.id === d.choix.g)) prog.choix.g = d.choix.g;
        if (DECOS.some((x) => x.id === d.choix.d)) prog.choix.d = d.choix.d;
        if (GRUES.some((x) => x.id === d.choix.c)) prog.choix.c = d.choix.c;
      }
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((e, i) => { if (e > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.choix = { g: 'lisse', d: 'aucune', c: 'bois' };
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), options: { son: prog.options.son }, choix: Object.assign({}, prog.choix)
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Réglages changés hors d'une partie (son, atelier) : jamais de nouvelle sauvegarde depuis l'écran titre.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { options: { son: prog.options.son }, choix: Object.assign({}, prog.choix) }); } catch (e) { /* rien */ }
  }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null, bruitBuf = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son || modeApercu || modeAffiche) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.025, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  function bruit(d, o) {
    o = o || {};
    if (!ac || !prog.options.son || modeApercu || modeAffiche) return;
    try {
      if (!bruitBuf) {
        bruitBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const ch = bruitBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      const t = ac.currentTime + (o.retard || 0);
      const src = ac.createBufferSource(), g = ac.createGain(), fl = ac.createBiquadFilter();
      src.buffer = bruitBuf;
      fl.type = o.type || 'lowpass'; fl.frequency.setValueAtTime(o.f || 800, t);
      if (o.vers) fl.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t + Math.min(0.04, d / 3));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(700, 0.06, { type: 'triangle', vol: 0.07 }),
    lache: () => { note(900, 0.25, { type: 'sine', vol: 0.06, vers: 300 }); bruit(0.2, { f: 2000, vers: 600, vol: 0.05, type: 'bandpass' }); },
    pose: () => { note(140, 0.16, { type: 'sine', vol: 0.2, vers: 90 }); bruit(0.12, { f: 700, vol: 0.12 }); },
    gelee: () => { note(220, 0.28, { type: 'sine', vol: 0.15, vers: 520 }); note(380, 0.2, { type: 'sine', vol: 0.08, vers: 180, retard: 0.08 }); },
    roule: () => { for (let i = 0; i < 4; i++) note(320 - i * 25, 0.06, { type: 'triangle', vol: 0.05, retard: i * 0.06 }); },
    chou: () => { note(520, 0.12, { type: 'sine', vol: 0.1, vers: 760 }); },
    cerise: () => [1568, 2093, 2637].forEach((f, i) => note(f, 0.25, { type: 'sine', vol: 0.06, retard: i * 0.08 })),
    point: () => [660, 880].forEach((f, i) => note(f, 0.1, { type: 'triangle', vol: 0.07, retard: i * 0.07 })),
    craque: () => { note(110, 0.25, { type: 'sawtooth', vol: 0.04, filtre: 500, vers: 70 }); },
    chute: () => {
      bruit(0.9, { f: 1200, vers: 150, vol: 0.22 });
      for (let i = 0; i < 6; i++) note(180 - i * 15, 0.18, { type: 'sine', vol: 0.14, vers: 60, retard: 0.12 + i * 0.11 });
    },
    splotch: () => { bruit(0.18, { f: 600, vers: 200, vol: 0.16 }); note(90, 0.15, { type: 'sine', vol: 0.12, vers: 50 }); },
    vent: () => bruit(1.1, { f: 500, vers: 1400, vol: 0.06, type: 'bandpass' }),
    tour: () => note(880, 0.09, { type: 'triangle', vol: 0.06 }),
    tic: () => note(1200, 0.04, { type: 'square', vol: 0.03 }),
    victoire: () => [523, 659, 784, 1047].forEach((f, i) => note(f, 0.22, { type: 'triangle', vol: 0.1, retard: i * 0.12 })),
    defaite: () => [392, 330, 262].forEach((f, i) => note(f, 0.3, { type: 'sawtooth', vol: 0.05, filtre: 900, retard: i * 0.18 })),
    arrive: () => [440, 660].forEach((f, i) => note(f, 0.12, { type: 'sine', vol: 0.08, retard: i * 0.1 })),
    part: () => [660, 440].forEach((f, i) => note(f, 0.12, { type: 'sine', vol: 0.06, retard: i * 0.1 })),
    grue: () => note(260, 0.18, { type: 'sawtooth', vol: 0.025, filtre: 700, vers: 300 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Outils de dessin
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  // Forme à fond arrondi (étage rond).
  function fondRond(c, x, y, w, h) {
    const r = Math.min(h * 0.28, w * 0.2);
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.bezierCurveTo(x + w, y + h * 1.05, x, y + h * 1.05, x, y + r);
    c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function etincelle(c, x, y, r) {
    c.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, k = i % 2 ? r * 0.38 : r;
      c.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k);
    }
    c.closePath(); c.fill();
  }
  function melange(a, b, k) {
    const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    const r = Math.round(((pa >> 16) & 255) * (1 - k) + ((pb >> 16) & 255) * k);
    const g = Math.round(((pa >> 8) & 255) * (1 - k) + ((pb >> 8) & 255) * k);
    const bl = Math.round((pa & 255) * (1 - k) + (pb & 255) * k);
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }
  // Petit hasard reproductible (décor, gouttes) : même dessin à chaque image.
  function h01(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  // Visage d'un gâteau : humeur 0 content, 1 inquiet, 2 affolé ; regard vers (lx, ly).
  function visage(c, x, y, k, humeur, t, lx, ly, graine) {
    const cligne = ((t / 1000 + graine * 1.7) % 4.3) < 0.13;
    const ex = k * 0.55, ey = y - k * 0.1;
    for (const sx of [-1, 1]) {
      const px = x + sx * ex;
      if (cligne) { c.strokeStyle = '#4a2433'; c.lineWidth = Math.max(1.2, k * 0.12); c.beginPath(); c.moveTo(px - k * 0.2, ey); c.lineTo(px + k * 0.2, ey); c.stroke(); continue; }
      c.fillStyle = '#fff'; ell(c, px, ey, k * 0.26, k * (humeur === 2 ? 0.34 : 0.3)); c.fill();
      const dx = Math.max(-1, Math.min(1, lx)) * k * 0.08, dy = Math.max(-1, Math.min(1, ly)) * k * 0.1;
      c.fillStyle = '#3a1a26'; rond(c, px + dx, ey + dy, k * (humeur === 2 ? 0.1 : 0.14)); c.fill();
      c.fillStyle = '#fff'; rond(c, px + dx - k * 0.05, ey + dy - k * 0.06, k * 0.045); c.fill();
      if (humeur >= 1) {
        c.strokeStyle = '#6a2a3c'; c.lineWidth = Math.max(1, k * 0.09);
        c.beginPath(); c.moveTo(px - k * 0.22, ey - k * 0.42 + sx * k * 0.06); c.lineTo(px + k * 0.22, ey - k * 0.42 - sx * k * 0.06); c.stroke();
      }
    }
    c.fillStyle = '#ff8fab88'; ell(c, x - k * 0.95, y + k * 0.16, k * 0.2, k * 0.12); c.fill(); ell(c, x + k * 0.95, y + k * 0.16, k * 0.2, k * 0.12); c.fill();
    c.strokeStyle = '#4a2433'; c.fillStyle = '#7a1f3a'; c.lineWidth = Math.max(1.2, k * 0.1); c.lineCap = 'round';
    const my = y + k * 0.3;
    if (humeur === 0) { c.beginPath(); c.arc(x, my - k * 0.12, k * 0.22, 0.15 * Math.PI, 0.85 * Math.PI); c.stroke(); }
    else if (humeur === 1) { c.beginPath(); c.moveTo(x - k * 0.18, my); c.quadraticCurveTo(x, my - k * 0.08, x + k * 0.18, my + k * 0.03); c.stroke(); }
    else {
      ell(c, x, my + k * 0.02, k * 0.13, k * 0.17); c.fill();
      c.fillStyle = '#8fd3ff'; c.beginPath(); c.moveTo(x + k * 1.05, y - k * 0.55); c.quadraticCurveTo(x + k * 1.25, y - k * 0.2, x + k * 1.05, y - k * 0.12); c.quadraticCurveTo(x + k * 0.88, y - k * 0.2, x + k * 1.05, y - k * 0.55); c.fill();
    }
  }

  // Glaçage du dessus (couleur de la place) avec son style.
  function glacage(c, x, y, w, h, coul, style, graine, t) {
    const hb = Math.max(4, h * 0.26);
    c.fillStyle = coul;
    c.beginPath();
    c.moveTo(x + 4, y); c.lineTo(x + w - 4, y); c.quadraticCurveTo(x + w, y, x + w, y + 4); c.lineTo(x + w, y + hb);
    // gouttes qui coulent sur le bord
    const n = style === 'coulant' ? 7 : 4;
    for (let i = n; i >= 0; i--) {
      const gx = x + w * (i / n);
      const long = (style === 'coulant' ? 0.55 : 0.25) * h * (0.4 + h01(graine * 13 + i) * 0.8) * (0.9 + 0.1 * Math.sin(t / 600 + i));
      c.quadraticCurveTo(gx + w / n * 0.5, y + hb + long * 1.4, gx, y + hb);
    }
    c.lineTo(x, y + 4); c.quadraticCurveTo(x, y, x + 4, y); c.closePath(); c.fill();
    c.fillStyle = '#ffffff66'; rr(c, x + w * 0.08, y + hb * 0.18, w * 0.5, hb * 0.32, hb * 0.2); c.fill();
    if (style === 'marbre') {
      c.strokeStyle = '#ffffffaa'; c.lineWidth = Math.max(1, h * 0.05);
      c.beginPath();
      for (let i = 0; i <= 8; i++) c.lineTo(x + w * i / 8, y + hb * (0.45 + 0.3 * Math.sin(i * 1.7 + graine)));
      c.stroke();
    }
  }

  // Motifs sur le flanc d'un étage (glaçages « pois » et « zigzag »).
  function motif(c, x, y, w, h, style, coul) {
    if (style === 'pois') {
      c.fillStyle = '#ffffffcc';
      for (let i = 0; i < 6; i++) { rond(c, x + w * (0.1 + i * 0.16), y + h * (0.62 + (i % 2) * 0.16), Math.max(1.5, h * 0.07)); c.fill(); }
    } else if (style === 'zigzag') {
      c.strokeStyle = coul; c.lineWidth = Math.max(1.5, h * 0.07); c.lineJoin = 'round';
      c.beginPath();
      for (let i = 0; i <= 10; i++) c.lineTo(x + w * (0.04 + i * 0.092), y + h * (i % 2 ? 0.58 : 0.8));
      c.stroke();
    }
  }

  // Décoration posée sur le devant du glaçage.
  function decoration(c, x, y, w, h, style, t, graine) {
    if (style === 'vermicelles') {
      const cs = ['#ff5a8a', '#46c3ff', '#ffe14d', '#7ee06a', '#b07cff'];
      for (let i = 0; i < 12; i++) {
        c.fillStyle = cs[i % cs.length];
        c.save(); c.translate(x + w * (0.06 + h01(graine + i) * 0.88), y + h * (0.05 + h01(graine * 3 + i) * 0.16)); c.rotate(h01(i * 7 + graine) * 3);
        rr(c, -h * 0.08, -h * 0.025, h * 0.16, h * 0.05, h * 0.025); c.fill(); c.restore();
      }
    } else if (style === 'fraises') {
      for (let i = 0; i < 3; i++) {
        const fx = x + w * (0.2 + i * 0.3), fy = y - h * 0.02, k = h * 0.2;
        c.fillStyle = '#e8233f'; c.beginPath(); c.moveTo(fx - k, fy - k * 0.6); c.quadraticCurveTo(fx, fy + k * 1.4, fx + k, fy - k * 0.6); c.quadraticCurveTo(fx, fy - k * 1.1, fx - k, fy - k * 0.6); c.fill();
        c.fillStyle = '#ffe39a'; for (let j = 0; j < 3; j++) { rond(c, fx - k * 0.4 + j * k * 0.4, fy - k * 0.1 + (j % 2) * k * 0.3, k * 0.08); c.fill(); }
        c.fillStyle = '#3d9b3a'; ell(c, fx, fy - k * 0.75, k * 0.6, k * 0.22); c.fill();
      }
    } else if (style === 'bougies') {
      for (let i = 0; i < 3; i++) {
        const bx = x + w * (0.25 + i * 0.25), by = y, k = h * 0.16;
        c.fillStyle = ['#7fc8ff', '#ffd84d', '#ff8fb5'][i]; rr(c, bx - k * 0.35, by - k * 2.4, k * 0.7, k * 2.4, k * 0.2); c.fill();
        c.fillStyle = '#fff6'; c.fillRect(bx - k * 0.35, by - k * 1.6, k * 0.7, k * 0.25);
        const f = 1 + 0.15 * Math.sin(t / 90 + i * 2);
        c.fillStyle = '#ffb02e'; ell(c, bx, by - k * 3, k * 0.32, k * 0.6 * f); c.fill();
        c.fillStyle = '#fff3b0'; ell(c, bx, by - k * 2.9, k * 0.14, k * 0.3 * f); c.fill();
      }
    } else if (style === 'fleurs') {
      for (let i = 0; i < 4; i++) {
        const fx = x + w * (0.14 + i * 0.24), fy = y + h * 0.12, k = h * 0.13;
        c.fillStyle = ['#ffffff', '#ffd2e8', '#e3d4ff', '#fff2b5'][i];
        for (let p = 0; p < 5; p++) { const a = p * Math.PI * 0.4; rond(c, fx + Math.cos(a) * k * 0.7, fy + Math.sin(a) * k * 0.7, k * 0.55); c.fill(); }
        c.fillStyle = '#f2b400'; rond(c, fx, fy, k * 0.4); c.fill();
      }
    } else if (style === 'etoiles') {
      for (let i = 0; i < 5; i++) {
        c.fillStyle = i % 2 ? '#fff6c4' : '#ffd84d';
        const s = 0.7 + 0.3 * Math.sin(t / 250 + i * 1.3);
        etincelle(c, x + w * (0.1 + i * 0.2), y + h * (0.08 + (i % 2) * 0.12), h * 0.14 * s);
      }
    }
  }

  // Un étage de gâteau : centre bas (x, yb), taille (w, h) en pixels.
  // o : { coul, glac, deco, humeur, t, lx, ly, graine, sq (écrasement 0..1) }
  function dessinerEtage(c, sorte, x, yb, w, h, o) {
    o = o || {};
    const t = o.t || 0, coul = o.coul || '#ef4f84', glac = o.glac || 'lisse', graine = o.graine || 1;
    const sq = o.sq || 0;
    if (sq) { w *= 1 + sq * 0.18; h *= 1 - sq * 0.22; }
    const x0 = x - w / 2, y0 = yb - h;
    c.save();
    // ombre douce
    c.fillStyle = '#0000001f'; ell(c, x + w * 0.04, yb, w * 0.48, Math.max(2, h * 0.08)); c.fill();
    if (sorte === 'k') {
      // cerise : boule rouge brillante et sa queue
      const r = Math.min(w, h) * 0.48;
      c.strokeStyle = '#3f7a2a'; c.lineWidth = Math.max(2, r * 0.16); c.lineCap = 'round';
      c.beginPath(); c.moveTo(x, yb - r * 1.6); c.quadraticCurveTo(x + r * 0.5, yb - r * 2.4, x + r * 0.9, yb - r * 2.6); c.stroke();
      c.fillStyle = '#4aa33a'; ell(c, x + r * 0.95, yb - r * 2.55, r * 0.45, r * 0.2, -0.5); c.fill();
      const gr = c.createRadialGradient(x - r * 0.35, yb - r * 1.35, r * 0.1, x, yb - r, r);
      gr.addColorStop(0, '#ff7a85'); gr.addColorStop(0.5, '#e01b34'); gr.addColorStop(1, '#8a0a1c');
      c.fillStyle = gr; rond(c, x, yb - r, r); c.fill();
      c.fillStyle = '#ffffffcc'; ell(c, x - r * 0.38, yb - r * 1.38, r * 0.2, r * 0.13, -0.6); c.fill();
      c.restore();
      return;
    }
    if (sorte === 'c') {
      // chou à la crème : boule dorée, crème au milieu, chapeau glacé
      c.fillStyle = '#d99a45'; ell(c, x, yb - h * 0.3, w * 0.5, h * 0.32); c.fill();
      c.fillStyle = '#fff8ec'; rr(c, x0 + w * 0.04, yb - h * 0.62, w * 0.92, h * 0.2, h * 0.1); c.fill();
      for (let i = 0; i < 5; i++) { rond(c, x0 + w * (0.12 + i * 0.19), yb - h * 0.52, h * 0.1); c.fill(); }
      c.fillStyle = '#e9b45c'; ell(c, x, yb - h * 0.72, w * 0.47, h * 0.28); c.fill();
      c.fillStyle = coul; ell(c, x, yb - h * 0.86, w * 0.4, h * 0.15); c.fill();
      c.fillStyle = '#ffffff99'; for (let i = 0; i < 7; i++) { rond(c, x0 + w * (0.15 + h01(graine + i) * 0.7), yb - h * (0.7 + h01(graine * 5 + i) * 0.2), Math.max(1, h * 0.025)); c.fill(); }
      if (o.deco && o.deco !== 'aucune') decoration(c, x0 + w * 0.1, yb - h * 0.98, w * 0.8, h, o.deco, t, graine);
      visage(c, x, yb - h * 0.3, Math.min(w * 0.14, h * 0.24), o.humeur || 0, t, o.lx || 0, o.ly || 0, graine);
      c.restore();
      return;
    }
    if (sorte === 'j') {
      // gelée translucide qui tremble
      const tremble = 1 + 0.04 * Math.sin(t / 120 + graine);
      const jw = w * tremble, jh = h / tremble, jx = x - jw / 2, jy = yb - jh;
      c.globalAlpha = 0.86;
      const gr = c.createLinearGradient(0, jy, 0, yb);
      gr.addColorStop(0, melange(coul, '#ffffff', 0.35)); gr.addColorStop(1, coul);
      c.fillStyle = gr; rr(c, jx, jy, jw, jh, jh * 0.32); c.fill();
      c.globalAlpha = 1;
      c.fillStyle = '#ffffff55'; for (let i = 0; i < 4; i++) { rond(c, jx + jw * (0.15 + h01(graine + i * 3) * 0.7), jy + jh * (0.3 + h01(graine * 2 + i) * 0.5), Math.max(1.5, jh * 0.06)); c.fill(); }
      c.fillStyle = '#ffffffaa'; rr(c, jx + jw * 0.08, jy + jh * 0.12, jw * 0.35, jh * 0.14, jh * 0.07); c.fill();
      c.strokeStyle = melange(coul, '#000000', 0.25); c.lineWidth = Math.max(1, h * 0.03); rr(c, jx, jy, jw, jh, jh * 0.32); c.stroke();
      if (o.deco && o.deco !== 'aucune') decoration(c, jx, jy, jw, jh, o.deco, t, graine);
      visage(c, x, yb - jh * 0.5, Math.min(w * 0.09, h * 0.3), o.humeur || 0, t, o.lx || 0, o.ly || 0, graine);
      c.restore();
      return;
    }
    // génoise (g) ou étage rond (r)
    const pate = sorte === 'r' ? '#c98a52' : '#f2cf92';
    const gr = c.createLinearGradient(0, y0, 0, yb);
    gr.addColorStop(0, melange(pate, '#ffffff', 0.15)); gr.addColorStop(1, melange(pate, '#7a4a20', 0.25));
    c.fillStyle = gr;
    if (sorte === 'r') fondRond(c, x0, y0, w, h); else rr(c, x0, y0, w, h, Math.min(10, h * 0.16));
    c.fill();
    // fourrage de crème
    c.fillStyle = sorte === 'r' ? '#fff3e6' : '#fff8ec';
    c.fillRect(x0 + 2, y0 + h * 0.56, w - 4, Math.max(2, h * 0.08));
    c.fillStyle = sorte === 'r' ? '#8a4a2a' : '#e8506f';
    c.fillRect(x0 + 2, y0 + h * 0.64, w - 4, Math.max(1, h * 0.04));
    glacage(c, x0, y0, w, h, coul, glac, graine, t);
    motif(c, x0, y0, w, h, glac, melange(coul, '#ffffff', 0.5));
    if (o.deco && o.deco !== 'aucune') decoration(c, x0, y0, w, h, o.deco, t, graine);
    visage(c, x, y0 + h * 0.55, Math.min(w * 0.09, h * 0.3), o.humeur || 0, t, o.lx || 0, o.ly || 0, graine);
    c.restore();
  }

  // Chef pâtissier d'une place (médaillon rond, toque, couleur de la place).
  function medaillon(c, s, x, y, r) {
    c.save();
    c.fillStyle = COUL_C[s]; rond(c, x, y, r); c.fill();
    c.strokeStyle = COUL[s]; c.lineWidth = r * 0.12; rond(c, x, y, r * 0.94); c.stroke();
    // visage
    c.fillStyle = '#ffd9b8'; rond(c, x, y + r * 0.2, r * 0.5); c.fill();
    // toque
    c.fillStyle = '#ffffff';
    rond(c, x - r * 0.3, y - r * 0.42, r * 0.28); c.fill(); rond(c, x + r * 0.3, y - r * 0.42, r * 0.28); c.fill(); rond(c, x, y - r * 0.55, r * 0.32); c.fill();
    c.fillRect(x - r * 0.42, y - r * 0.45, r * 0.84, r * 0.3);
    c.fillStyle = COUL[s]; c.fillRect(x - r * 0.42, y - r * 0.2, r * 0.84, r * 0.09);
    c.fillStyle = '#3a1a26'; rond(c, x - r * 0.18, y + r * 0.15, r * 0.07); c.fill(); rond(c, x + r * 0.18, y + r * 0.15, r * 0.07); c.fill();
    c.strokeStyle = '#3a1a26'; c.lineWidth = r * 0.06; c.beginPath(); c.arc(x, y + r * 0.3, r * 0.15, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
    c.fillStyle = '#ff9fb4aa'; rond(c, x - r * 0.33, y + r * 0.32, r * 0.08); c.fill(); rond(c, x + r * 0.33, y + r * 0.32, r * 0.08); c.fill();
    // petite moustache ou ruban selon la place
    c.fillStyle = COUL_F[s];
    if (s % 2) { ell(c, x - r * 0.1, y + r * 0.43, r * 0.12, r * 0.05, 0.3); c.fill(); ell(c, x + r * 0.1, y + r * 0.43, r * 0.12, r * 0.05, -0.3); c.fill(); }
    else { c.beginPath(); c.moveTo(x, y + r * 0.66); c.lineTo(x - r * 0.18, y + r * 0.56); c.lineTo(x - r * 0.18, y + r * 0.78); c.closePath(); c.fill(); c.beginPath(); c.moveTo(x, y + r * 0.66); c.lineTo(x + r * 0.18, y + r * 0.56); c.lineTo(x + r * 0.18, y + r * 0.78); c.closePath(); c.fill(); }
    c.restore();
  }

  function couronne(c, x, y, k) {
    c.save();
    c.fillStyle = '#ffc928'; c.strokeStyle = '#a86e00'; c.lineWidth = Math.max(1, k * 0.08);
    c.beginPath(); c.moveTo(x - k, y); c.lineTo(x - k, y - k * 0.9); c.lineTo(x - k * 0.5, y - k * 0.45); c.lineTo(x, y - k * 1.1); c.lineTo(x + k * 0.5, y - k * 0.45); c.lineTo(x + k, y - k * 0.9); c.lineTo(x + k, y); c.closePath();
    c.fill(); c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Décor : les 4 cuisines, sur toute la largeur de l'écran
  // ---------------------------------------------------------------------

  const CUISINES = [
    { mur: ['#ffe1ea', '#ffc6d6'], carreau: ['#ffffff', '#ffb3c8'], bois: '#c98a52', nappe: null, lampe: '#fff1b8' },
    { mur: ['#e2f6ea', '#bfe6cf'], carreau: ['#f6fff9', '#9fd8b5'], bois: '#a86f45', nappe: '#ffffff', lampe: '#fff6d6' },
    { mur: ['#7a1f33', '#4c0f20'], carreau: ['#93283f', '#6a1529'], bois: '#6a3a20', nappe: '#f4e2b8', lampe: '#ffd47a' },
    { mur: ['#f6e3f2', '#dfc3e3'], carreau: ['#ffffff', '#efd9b9'], bois: '#d8c2a0', nappe: '#ffffff', lampe: '#fff2d0' }
  ];

  // dec : décalage vertical du mur (la caméra monte avec la tour) ; vent : force du vent visible (-1..1).
  function dessinerCuisine(c, w, h, cu, t, dec, vent, solY) {
    const C = CUISINES[cu] || CUISINES[0];
    const gr = c.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, C.mur[0]); gr.addColorStop(1, C.mur[1]);
    c.fillStyle = gr; c.fillRect(0, 0, w, h);
    const d = dec || 0;
    // motif du mur (répété sur toute la largeur et toute la hauteur)
    if (cu === 0) {
      const p = 46;
      for (let y = ((d * 0.5) % p) - p; y < h; y += p) for (let x = 0; x < w; x += p) {
        if (((Math.floor(x / p) + Math.floor((y - d * 0.5) / p + 1000)) % 2) === 0) { c.fillStyle = '#ffffff44'; c.fillRect(x, y, p, p); }
      }
    } else if (cu === 1) {
      for (let x = 0; x < w; x += 34) { c.fillStyle = '#ffffff55'; c.fillRect(x, 0, 14, h); }
    } else if (cu === 2) {
      for (let x = 0; x < w; x += 60) { c.fillStyle = '#00000022'; c.fillRect(x, 0, 6, h); }
      // motif doré
      c.fillStyle = '#e7b84a33';
      for (let y = ((d * 0.5) % 90) - 90; y < h; y += 90) for (let x = 30; x < w; x += 60) { etincelle(c, x, y, 9); }
    } else {
      c.strokeStyle = '#c99ac2aa'; c.lineWidth = 3;
      for (let x = 0; x < w; x += 120) { c.beginPath(); c.moveTo(x, h); c.lineTo(x, h * 0.3); c.arc(x + 60, h * 0.3, 60, Math.PI, 0); c.lineTo(x + 120, h); c.stroke(); }
    }
    // étagères avec bocaux, théières, chandeliers ou guirlandes, répétées vers le haut
    const per = 320;
    for (let y0 = ((d * 0.6) % per) - per + 140; y0 < h; y0 += per) {
      const ligne = Math.floor((y0 - d * 0.6) / per + 1000);
      for (let x0 = 0; x0 < w + 200; x0 += 230) {
        const k = h01(ligne * 31 + x0 * 0.13);
        if (Math.abs(x0 + 100 - w / 2) < 150) continue;        // pas derrière la tour
        dessinerEtagere(c, x0 + 15, y0, cu, k, t);
      }
    }
    // fenêtre ouverte (rideaux qui volent au vent)
    const fx = Math.max(20, w * 0.06), fy = 100 + (d * 0.6) % 900, fw = Math.min(150, w * 0.26), fh = fw * 1.25;
    if (fy < h) {
      const ciel = c.createLinearGradient(0, fy, 0, fy + fh);
      ciel.addColorStop(0, cu === 2 ? '#2a3a7a' : '#8fd3ff'); ciel.addColorStop(1, cu === 2 ? '#7a5aa8' : '#d8f2ff');
      c.fillStyle = '#ffffff'; rr(c, fx - 8, fy - 8, fw + 16, fh + 16, 10); c.fill();
      c.fillStyle = ciel; rr(c, fx, fy, fw, fh, 6); c.fill();
      c.fillStyle = cu === 2 ? '#fff6c8' : '#ffffffdd';
      if (cu === 2) { rond(c, fx + fw * 0.7, fy + fh * 0.25, fw * 0.1); c.fill(); }
      else { ell(c, fx + fw * 0.35 + Math.sin(t / 3000) * 8, fy + fh * 0.3, fw * 0.2, fw * 0.08); c.fill(); ell(c, fx + fw * 0.7, fy + fh * 0.55, fw * 0.16, fw * 0.06); c.fill(); }
      c.strokeStyle = '#ffffff'; c.lineWidth = 5; c.beginPath(); c.moveTo(fx + fw / 2, fy); c.lineTo(fx + fw / 2, fy + fh); c.moveTo(fx, fy + fh / 2); c.lineTo(fx + fw, fy + fh / 2); c.stroke();
      const vv = vent || 0, souffle = vv * (0.6 + 0.4 * Math.sin(t / 160));
      for (const cote of [0, 1]) {
        const bx = cote ? fx + fw + 6 : fx - 6;
        c.fillStyle = cu === 1 ? '#ffb3c8' : cu === 2 ? '#c8a03a' : cu === 3 ? '#ffffff' : '#ff7aa2';
        c.beginPath(); c.moveTo(bx, fy - 10);
        const ecart = (cote ? 1 : -1) * fw * 0.18 + souffle * fw * 0.55;
        c.quadraticCurveTo(bx + ecart * 0.5, fy + fh * 0.4, bx + ecart, fy + fh * 0.9);
        c.lineTo(bx + ecart + (cote ? 18 : -18) * 0, fy + fh * 0.95);
        c.quadraticCurveTo(bx + (cote ? 22 : -22) + ecart * 0.3, fy + fh * 0.45, bx + (cote ? 22 : -22), fy - 10); c.closePath(); c.fill();
      }
      // traînées du vent
      if (Math.abs(vv) > 0.05) {
        c.strokeStyle = '#ffffffaa'; c.lineWidth = 3; c.lineCap = 'round';
        for (let i = 0; i < 7; i++) {
          const ph = ((t / 900 + i * 0.37) % 1);
          const sx = vv > 0 ? fx + fw + ph * w * 0.8 : fx + fw - ph * w * 0.8 + w * 0.8;
          const sy = fy + fh * (0.2 + (i * 0.13) % 0.7) + Math.sin(t / 300 + i) * 10;
          c.globalAlpha = Math.sin(ph * Math.PI) * Math.min(1, Math.abs(vv) * 1.5);
          c.beginPath(); c.moveTo(sx, sy); c.quadraticCurveTo(sx + vv * 40, sy - 8, sx + vv * 90, sy); c.stroke();
        }
        c.globalAlpha = 1;
      }
    }
    // lampe / lustre en haut
    const lux = c.createRadialGradient(w * 0.5, 0, 10, w * 0.5, 0, Math.max(w, h) * 0.6);
    lux.addColorStop(0, C.lampe + 'aa'); lux.addColorStop(1, C.lampe + '00');
    c.fillStyle = lux; c.fillRect(0, 0, w, h);
    // table (comptoir) en bas
    if (solY !== undefined && solY < h + 200) {
      const ty = solY;
      if (C.nappe) {
        c.fillStyle = C.nappe; c.fillRect(0, ty, w, h - ty + 200);
        c.fillStyle = cu === 2 ? '#d8b25a' : cu === 3 ? '#f4d6e0' : '#ff9fb8';
        for (let x = 0; x < w; x += 40) { c.beginPath(); c.arc(x + 20, ty + 26, 20, 0, Math.PI); c.fill(); }
        c.fillStyle = '#00000014'; c.fillRect(0, ty, w, 6);
      } else {
        c.fillStyle = C.bois; c.fillRect(0, ty, w, h - ty + 200);
        c.fillStyle = '#ffffff33'; c.fillRect(0, ty, w, 6);
        c.strokeStyle = '#00000018'; c.lineWidth = 2;
        for (let x = 0; x < w; x += 90) { c.beginPath(); c.moveTo(x, ty + 8); c.lineTo(x + 30, h + 200); c.stroke(); }
      }
      // objets posés sur la table, sur toute la largeur
      for (let x0 = 30; x0 < w; x0 += 170) {
        if (Math.abs(x0 - w / 2) < 210) continue;
        dessinerObjetTable(c, x0, ty + 4, cu, h01(x0 * 0.7 + cu));
      }
    }
    if (cu === 3) {
      // guirlande de fleurs en haut
      for (let x = 0; x < w; x += 26) {
        const y = 14 + Math.sin(x / 70) * 10;
        c.fillStyle = ['#ffffff', '#ffd2e8', '#ffe8a8'][Math.floor(x / 26) % 3];
        rond(c, x, y, 7); c.fill();
      }
    }
  }

  function dessinerEtagere(c, x, y, cu, k, t) {
    c.fillStyle = cu === 2 ? '#3a1410' : '#b07a4a';
    c.fillRect(x, y, 200, 10);
    c.fillStyle = '#00000022'; c.fillRect(x, y + 10, 200, 5);
    for (let i = 0; i < 3; i++) {
      const ox = x + 20 + i * 62, kind = Math.floor((k * 10 + i * 3.3)) % 4;
      if (cu === 2) {
        // chandelier
        c.fillStyle = '#e7b84a'; c.fillRect(ox + 16, y - 30, 6, 30); c.fillRect(ox + 6, y - 6, 26, 6);
        c.fillStyle = '#fff4d6'; c.fillRect(ox + 14, y - 50, 10, 22);
        const f = 1 + 0.15 * Math.sin(t / 110 + i + k * 9);
        c.fillStyle = '#ffb02e'; ell(c, ox + 19, y - 58, 5, 9 * f); c.fill();
        const halo = c.createRadialGradient(ox + 19, y - 58, 2, ox + 19, y - 58, 40);
        halo.addColorStop(0, '#ffd47a88'); halo.addColorStop(1, '#ffd47a00'); c.fillStyle = halo; c.fillRect(ox - 20, y - 100, 80, 80);
      } else if (kind === 0 || cu === 0 && kind === 2) {
        // bocal de bonbons
        c.fillStyle = '#ffffff88'; rr(c, ox, y - 46, 38, 46, 8); c.fill();
        for (let j = 0; j < 7; j++) { c.fillStyle = ['#ff5a8a', '#ffd84d', '#6ad0ff', '#9be36a'][j % 4]; rond(c, ox + 7 + (j * 9) % 26, y - 8 - Math.floor(j / 3) * 9, 5); c.fill(); }
        c.fillStyle = cu === 1 ? '#3fae5a' : '#ef4f84'; rr(c, ox - 2, y - 52, 42, 9, 4); c.fill();
      } else if (kind === 1) {
        // théière ou pot
        c.fillStyle = cu === 1 ? '#7fd1a6' : cu === 3 ? '#ffffff' : '#ff9fb8';
        ell(c, ox + 20, y - 20, 20, 18); c.fill();
        c.fillRect(ox + 10, y - 40, 20, 6); rond(c, ox + 20, y - 42, 5); c.fill();
        c.strokeStyle = c.fillStyle; c.lineWidth = 5; c.beginPath(); c.moveTo(ox + 38, y - 24); c.lineTo(ox + 50, y - 34); c.stroke();
      } else {
        // petit gâteau sous cloche
        c.fillStyle = '#f2cf92'; rr(c, ox + 4, y - 18, 32, 18, 4); c.fill();
        c.fillStyle = cu === 1 ? '#3fae5a' : '#ef4f84'; rr(c, ox + 4, y - 22, 32, 7, 3); c.fill();
        c.fillStyle = '#ffffff55'; c.beginPath(); c.arc(ox + 20, y - 4, 24, Math.PI, 0); c.fill();
        c.strokeStyle = '#ffffffaa'; c.lineWidth = 2; c.beginPath(); c.arc(ox + 20, y - 4, 24, Math.PI, 0); c.stroke();
      }
    }
  }

  function dessinerObjetTable(c, x, y, cu, k) {
    const kind = Math.floor(k * 4);
    if (kind === 0) {
      // fouet et bol
      c.fillStyle = cu === 2 ? '#c8a03a' : '#7fc8ff'; c.beginPath(); c.arc(x, y + 4, 34, 0, Math.PI); c.fill();
      c.fillStyle = '#fff8ec'; ell(c, x, y + 4, 34, 8); c.fill();
      c.strokeStyle = '#9aa4b2'; c.lineWidth = 3; c.beginPath(); c.moveTo(x + 10, y); c.lineTo(x + 30, y - 40); c.stroke();
    } else if (kind === 1) {
      // tasse
      c.fillStyle = cu === 1 ? '#7fd1a6' : '#ffffff'; rr(c, x - 18, y - 28, 36, 30, 8); c.fill();
      c.strokeStyle = c.fillStyle; c.lineWidth = 5; c.beginPath(); c.arc(x + 20, y - 14, 8, -1.4, 1.4); c.stroke();
      c.fillStyle = '#ffffff'; ell(c, x, y + 4, 30, 6); c.fill();
    } else if (kind === 2) {
      // macarons
      for (let i = 0; i < 3; i++) { c.fillStyle = ['#ffb3c8', '#b8e6a8', '#fff0a0'][i]; rr(c, x - 40 + i * 28, y - 18, 24, 18, 9); c.fill(); c.fillStyle = '#fff8ec'; c.fillRect(x - 38 + i * 28, y - 10, 20, 3); }
    } else {
      // fleurs dans un vase
      c.fillStyle = '#9fd8ff88'; rr(c, x - 10, y - 30, 20, 30, 6); c.fill();
      for (let i = 0; i < 3; i++) { c.fillStyle = ['#ff7aa2', '#ffd84d', '#ffffff'][i]; rond(c, x - 12 + i * 12, y - 44 - (i % 2) * 8, 8); c.fill(); }
    }
  }

  // ---------------------------------------------------------------------
  //  La grue
  // ---------------------------------------------------------------------

  const STYLES_GRUE = {
    bois: { poutre: '#9a6233', clair: '#c98a52', corde: '#6b4a2a' },
    cuivre: { poutre: '#b8652e', clair: '#f0a46a', corde: '#5a3a22' },
    sucre: { poutre: '#ffffff', clair: '#ef3f5e', corde: '#c42a46' },
    or: { poutre: '#d9a520', clair: '#ffe27a', corde: '#8a6400' }
  };

  // Flèche de la grue (en haut), chariot en xc, crochet à yc.
  function dessinerGrue(c, x1, x2, yj, xc, yc, style, t) {
    const S = STYLES_GRUE[style] || STYLES_GRUE.bois;
    c.save();
    // mât à droite
    c.fillStyle = S.poutre; c.fillRect(x2 - 14, yj, 16, 4000);
    c.fillStyle = S.clair;
    for (let y = yj + 20; y < yj + 1400; y += 40) c.fillRect(x2 - 14, y, 16, 6);
    // flèche
    c.fillStyle = S.poutre; rr(c, x1, yj - 10, x2 - x1 + 10, 20, 8); c.fill();
    if (style === 'sucre') { c.fillStyle = S.clair; for (let x = x1; x < x2; x += 24) { c.beginPath(); c.moveTo(x, yj - 10); c.lineTo(x + 12, yj - 10); c.lineTo(x + 4, yj + 10); c.lineTo(x - 8, yj + 10); c.closePath(); c.fill(); } }
    else { c.strokeStyle = S.clair; c.lineWidth = 2; c.beginPath(); for (let x = x1; x < x2; x += 22) { c.moveTo(x, yj - 8); c.lineTo(x + 11, yj + 8); c.lineTo(x + 22, yj - 8); } c.stroke(); }
    if (style === 'or') { c.fillStyle = '#fff6c4'; etincelle(c, x1 + 20 + ((t / 8) % (x2 - x1 - 40)), yj - 12, 6); }
    // contrepoids en sucre
    c.fillStyle = '#ff8fb5'; rr(c, x2 - 34, yj + 10, 40, 26, 8); c.fill();
    c.fillStyle = '#fff'; rond(c, x2 - 22, yj + 20, 4); c.fill(); rond(c, x2 - 8, yj + 26, 4); c.fill();
    // chariot
    c.fillStyle = S.clair; rr(c, xc - 18, yj + 6, 36, 14, 5); c.fill();
    c.fillStyle = '#4a2433'; rond(c, xc - 10, yj + 8, 4); c.fill(); rond(c, xc + 10, yj + 8, 4); c.fill();
    // corde et crochet
    c.strokeStyle = S.corde; c.lineWidth = 3;
    c.beginPath(); c.moveTo(xc, yj + 18); c.lineTo(xc, yc); c.stroke();
    c.strokeStyle = '#8a94a6'; c.lineWidth = 4; c.beginPath(); c.arc(xc, yc + 6, 7, -Math.PI * 0.5, Math.PI * 0.9); c.stroke();
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  État de l'écran
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  let partie = null, session = null, niveau = 1, enPartie = false, enPause = false, attenteTuto = false;
  let vue = null;                 // état affiché (en retard sur partie.etat pendant les animations)
  let file = [];                  // coups à animer
  let anim = null;                // coup en cours d'animation
  let corps = [];                 // étages qui tombent (tour écroulée)
  let flaques = [];               // étages écrasés sur la table
  const particules = [];
  let debutGrue = 0;              // début du balancement du tour en cours
  let lache = null;               // { x } : mon étage lâché, en attente de son retour
  let debutTour = Date.now(), dernierTic = -1;
  let camY = 0, camCible = 0, secousse = 0;
  let humainsAvant = null, jeton = 0;
  let attenteFin = null;          // { j, t, enLigne } : fin de manche à montrer quand les animations sont finies
  let geo = null;
  let figeGrue = null;            // aperçu : position de la grue figée

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'atelier', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') { tPrec = 0; relancerBoucle(); }
    else relancerTitre();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);

      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');

    }

    sp.textContent = '';
    for (let s = 0; s < PLACES; s++) {

      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      sp.appendChild(d);

  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role; tag.dataset.nom = nom;
    tag.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }
  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  // Nom d'une place dans une phrase : pseudo, sinon « le robot Pistache »…
  function nomDans(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    if (info.humain && info.nom) return info.nom;
    return tr(info.humain ? 'qui.joueur' : 'qui.robot', { couleur: tr('couleur.' + s) });
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria', { couleur: tr('couleur.' + s), qui: nomPlace(info, role), n: pts }));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    if (partie.siege < 0) return tr('multi.attente');
    const s = R.aQui(e);
    const cerise = e.p === 'k';
    if (s === partie.siege) return tr(cerise ? 'tour.toiCerise' : 'tour.toi');
    if (cerise) return tr('tour.autreCerise', { nom: nomDans(s) });
    const info = siegesActuels()[s] || {};
    if (info.humain && info.nom) return tr('tour.autre', { nom: info.nom });
    return tr(info.humain ? 'tour.joueur' : 'tour.robot', { couleur: tr('couleur.' + s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e) info += ' · ' + tr('jeu.etages', { n: Math.min(e.T.length, e.n), total: e.n });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    let v = '';
    if (e && !e.fini && partie && partie.phase === 'jeu' && e.v) v = tr(e.v > 0 ? 'vent.droite' : 'vent.gauche') + ' ' + (Math.abs(e.v) >= 60 ? tr('vent.fort') : '');
    v = v.trim();
    if ($('vent').textContent !== v) $('vent').textContent = v;
  }

  function majInterface() { majPlaces(); majInfos(); }

  // Barre de temps : quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && !e.fini && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Géométrie de la scène : monde (unités des règles) → écran
  // ---------------------------------------------------------------------

  function hauteurTour(T) { let h = 0; for (const l of T) h += l.h; return h; }

  function calculerGeo(w, h, e) {
    const infos = $('infos').getBoundingClientRect(), aide = $('aide').getBoundingClientRect();
    const haut = Math.max(infos.bottom + 6, 60), bas = Math.min(h, aide.top) - 4;
    const A = e ? e.A : 200;
    const s = Math.max(0.28, Math.min(w / (2 * (A + 215)), (bas - haut) / 880, 1.15));
    const sol = bas - 26 * Math.min(1, s * 1.6);       // écran : dessus de la table (y monde 0) quand camY = 0
    const jib = haut + 30;
    return { w: w, h: h, s: s, cx: w / 2, haut: haut, bas: bas, sol: sol, jib: jib };
  }
  // Hauteur (monde) visible entre le crochet et la table, une fois la grue et l'étage suspendu placés.
  function cameraCible(g, e) {
    if (!e) return 0;
    const top = hauteurTour(e.T);
    const marge = 300;                 // étage suspendu + chute
    const dispo = (g.sol - g.jib) / g.s - marge - 40;
    return Math.max(0, top - dispo);
  }
  const ecranX = (g, x) => g.cx + x * g.s;
  const ecranY = (g, y) => g.sol - (y - camY) * g.s;

  // Balancement de la grue (position monde du chariot).
  function positionGrue(e, t) {
    if (!e) return 0;
    if (figeGrue !== null) return figeGrue;
    const ph = ((t - debutGrue) / e.P) * Math.PI * 2;
    return -e.A * Math.cos(ph);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu') return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    // En pause, tout est figé : la grue et les animations restent à l'instant de la pause.
    const maintenant = enPause ? pauseDebut : performance.now();
    if (!enPause) avancerAnimations(maintenant, dt);
    dessinerJeu(maintenant, enPause ? 0 : dt);
    majTemps();
    majCompte();
    verifierFin();
    rafId = requestAnimationFrame(boucle);
  }

  // Étage suspendu à la grue : sorte, propriétaire.
  function etageSuspendu() {
    if (!vue || vue.fini || !partie || partie.phase !== 'jeu' || attenteTuto) return null;
    if (anim) return null;
    return { t: vue.p, o: R.aQui(vue) };
  }

  function styleDe(o) {
    const moi = partie ? partie.siege : -1;
    if (o === moi) return { coul: COUL[o], glac: prog.choix.g, deco: prog.choix.d };
    return { coul: COUL[o] || '#ef4f84', glac: o % 2 ? 'coulant' : 'lisse', deco: 'aucune' };
  }

  function humeurDe(risque) { return risque < 0.5 ? 0 : risque < 0.78 ? 1 : 2; }

  function dessinerJeu(t, dt) {
    const cv = $('plateau');
    const w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const e = anim ? anim.avant : vue;
    geo = calculerGeo(w, h, vue || e);
    const g = geo;
    if (!anim && !corps.length) camCible = cameraCible(g, vue);
    camY += (camCible - camY) * Math.min(1, dt * 4);
    if (!dt) camY = camCible;
    if (secousse > 0) secousse = Math.max(0, secousse - dt * 1.6);
    const sx = secousse ? (Math.random() - 0.5) * 16 * secousse : 0, sy = secousse ? (Math.random() - 0.5) * 10 * secousse : 0;
    c.save();
    c.translate(sx, sy);
    const ventVu = vue && !vue.fini ? vue.v / 90 : 0;
    dessinerCuisine(c, w, h, vue ? vue.c : 0, t, camY * g.s, ventVu, ecranY(g, 0));
    if (!vue) { c.restore(); return; }
    dessinerScene(c, g, t, dt);
    c.restore();
  }

  // Tour, grue, étage qui tombe, éclats.
  function dessinerScene(c, g, t, dt) {
    const s = g.s;
    // assiette
    const ay = ecranY(g, 0);
    c.fillStyle = '#00000022'; ell(c, g.cx, ay + 6, O.assiette.w * s * 0.56, 12 * s + 4); c.fill();
    c.fillStyle = '#ffffff'; ell(c, g.cx, ay, O.assiette.w * s * 0.52, 14 * s + 3); c.fill();
    c.strokeStyle = '#e3c6d0'; c.lineWidth = 2; ell(c, g.cx, ay, O.assiette.w * s * 0.4, 9 * s + 2); c.stroke();
    // flaques de crème des chutes
    for (const f of flaques) dessinerFlaque(c, g, f, t);
    // la tour
    let T = vue.T, fixes = T.length;
    if (anim) {
      T = anim.phase === 'chute' || anim.phase === 'vise' ? anim.avant.T : anim.apres.T;
      fixes = T.length;
      if (anim.phase === 'pose') fixes = T.length - 1;
    }
    if (vue.fini && vue.chute >= 0 && !anim) { T = vue.T.slice(0, vue.ci + 1); fixes = T.length; }
    if (anim && anim.phase === 'effondre') { T = anim.apres.T.slice(0, anim.apres.ci + 1); fixes = T.length; }
    const mg = T.length ? O.marge(T) : 1;
    const risque = Math.max(0, Math.min(1, 1 - mg));
    if (risque > 0.78 && !anim && !vue.fini && !figeGrue && Math.random() < dt * 0.6) sons.craque();
    const amp = risque > 0.45 ? (risque - 0.45) * 0.07 : 0;
    const sway = amp * Math.sin(t / 260);
    const susp = etageSuspendu();
    const gx = positionGrue(vue, t);
    const crochetX = ecranX(g, anim && anim.phase === 'vise' ? anim.xVise : (anim ? anim.x : (lache ? lache.x : gx)));
    let y = 0;
    for (let i = 0; i < T.length; i++) {
      const l = T[i];
      let x = l.x, sq = 0;
      if (anim && anim.phase === 'pose' && i === T.length - 1) {
        const k = Math.min(1, (t - anim.t0) / anim.duree);
        x = anim.x0 + (anim.xf - anim.x0) * easeOut(k);
        sq = l.t === 'j' ? Math.max(0, 1 - k) * 0.6 : Math.sin(k * Math.PI) * 0.35;
      }
      const lean = sway * (y + l.h / 2);
      const px = ecranX(g, x) + lean * s * 1.0, pb = ecranY(g, y);
      const st = styleDe(l.o);
      dessinerEtage(c, l.t, px, pb, l.w * s, l.h * s, {
        coul: st.coul, glac: st.glac, deco: i === T.length - 1 || l.o === (partie ? partie.siege : -1) ? st.deco : 'aucune', t: t,
        humeur: humeurDe(risque), lx: susp ? (crochetX - px) / 120 : 0, ly: susp ? -1 : 0.3, graine: i * 7 + 3, sq: sq
      });
      y += l.h;
    }
    // la grue et l'étage suspendu (ou qui tombe)
    const x1 = ecranX(g, -vue.A - 150), x2 = Math.min(g.w - 10, ecranX(g, vue.A + 190));
    const st = styleGrue();
    let hs = null;
    if (susp) hs = suspendu(g, vue, susp.t);
    else if (anim && (anim.phase === 'vise' || anim.phase === 'chute')) hs = suspendu(g, anim.avant, anim.sorte);
    let yCrochet = hs ? hs.yc : g.jib + 40;
    if (susp) {
      const pw = hs.pw, ph = hs.ph, topEcran = hs.topEcran, bas = hs.bas;
      const balance = figeGrue !== null ? 0 : Math.sin(((t - debutGrue) / vue.P) * Math.PI * 2) * 0.06;
      dessinerGrue(c, x1, x2, g.jib, crochetX, yCrochet, st, t);
      // cordes vers l'étage
      c.strokeStyle = '#6b4a2a'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(crochetX, yCrochet + 8); c.lineTo(crochetX - pw * 0.4, bas - ph * 0.7); c.moveTo(crochetX, yCrochet + 8); c.lineTo(crochetX + pw * 0.4, bas - ph * 0.7); c.stroke();
      c.save(); c.translate(crochetX, yCrochet); c.rotate(balance); c.translate(-crochetX, -yCrochet);
      const sts = styleDe(susp.o);
      dessinerEtage(c, susp.t, crochetX, bas, pw, ph, { coul: sts.coul, glac: sts.glac, deco: sts.deco, t: t, humeur: risque > 0.6 ? 1 : 0, lx: 0, ly: 1, graine: 99 });
      c.restore();
      // fil à plomb jusqu'à la tour, quand c'est à moi
      if (partie && partie.monTour() && !lache) {
        c.save(); c.setLineDash([6, 8]); c.strokeStyle = '#2457c9aa'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(crochetX, bas + 4); c.lineTo(crochetX, topEcran); c.stroke(); c.restore();
        // petite main qui invite à toucher, au premier niveau
        if (session === 'solo' && niveau <= 2 && vue.T.length < 2) main(c, g.cx + 70, bas + 30 + Math.sin(t / 200) * 6, 30);
      }
    } else {
      dessinerGrue(c, x1, x2, g.jib, crochetX, yCrochet, st, t);
    }
    // étage qui tombe
    if (anim && hs) dessinerChute(c, g, t, hs);
    // étages qui s'envolent (tour écroulée)
    for (let i = corps.length - 1; i >= 0; i--) {
      const b = corps[i];
      if (dt) {
        b.vy -= 2200 * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        if (b.y <= b.sol) {
          b.y = b.sol;
          flaques.push({ x: b.x, w: b.l.w, t: b.l.t, o: b.l.o, graine: i * 13 + flaques.length, n: flaques.length });
          eclabousser(b.x, b.sol, b.l.o, 18);
          sons.splotch();
          corps.splice(i, 1);
          continue;
        }
      }
      const px = ecranX(g, b.x), py = ecranY(g, b.y);
      c.save(); c.translate(px, py); c.rotate(b.r);
      const sb = styleDe(b.l.o);
      dessinerEtage(c, b.l.t, 0, b.l.h * s / 2, b.l.w * s, b.l.h * s, { coul: sb.coul, glac: sb.glac, deco: 'aucune', t: t, humeur: 2, graine: i * 5 });
      c.restore();
    }
    // particules : crème, sucre, étoiles, « +1 »
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= (p.g === undefined ? 1400 : p.g) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      const px = ecranX(g, p.x), py = ecranY(g, p.y);
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.texte) {
        c.font = '900 ' + Math.round(26 * Math.max(0.8, s)) + 'px system-ui, sans-serif'; c.textAlign = 'center';
        c.lineWidth = 5; c.strokeStyle = '#fff'; c.strokeText(p.texte, px, py); c.fillStyle = p.coul; c.fillText(p.texte, px, py);
      } else if (p.etoile) { c.fillStyle = p.coul; etincelle(c, px, py, p.k * s + 3); }
      else { c.fillStyle = p.coul; rond(c, px, py, p.k * s + 1.5); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function styleGrue() {
    // Ma grue (atelier) quand c'est à moi, la grue en bois sinon.
    if (partie && vue && !vue.fini && R.aQui(vue) === partie.siege) return prog.choix.c;
    return 'bois';
  }

  function dessinerFlaque(c, g, f, t) {
    const x = ecranX(g, f.x), y = ecranY(g, 0) + 6 + (f.n % 3) * 4, w = f.w * g.s * 0.9;
    const st = styleDe(f.o);
    c.fillStyle = '#fff8ec'; ell(c, x, y, w * 0.55, 10 * g.s + 4); c.fill();
    c.fillStyle = f.t === 'j' ? st.coul + 'bb' : (f.t === 'r' ? '#c98a52' : f.t === 'k' ? '#e01b34' : '#f2cf92');
    ell(c, x, y - 4, w * 0.42, 9 * g.s + 3); c.fill();
    c.fillStyle = st.coul; ell(c, x + w * 0.1, y - 8, w * 0.25, 5 * g.s + 2); c.fill();
    for (let k = 0; k < 4; k++) { c.fillStyle = '#fff8ec'; rond(c, x + (h01(f.graine + k) - 0.5) * w * 1.3, y + (h01(f.graine * 3 + k) - 0.5) * 12, 4 * g.s + 2); c.fill(); }
  }

  // Étage suspendu à la grue : taille à l'écran, bas de l'étage, hauteur du crochet.
  function suspendu(g, e, sorte) {
    const d = O.dims(e, sorte, e.T.length);
    const pw = d.w * g.s, ph = d.h * g.s;
    const topEcran = ecranY(g, hauteurTour(e.T));
    const bas = Math.max(g.jib + 46 + ph, Math.min(topEcran - 50 * g.s - 24, g.jib + 46 + ph + 160 * g.s));
    return { pw: pw, ph: ph, bas: bas, yc: bas - ph - 14, topEcran: topEcran };
  }

  function dessinerChute(c, g, t, hs) {
    const a = anim;
    const pw = hs.pw, ph = hs.ph, depart = hs.bas;
    let x, yb;
    if (a.phase === 'vise') { x = ecranX(g, a.xVise); yb = depart; }
    else {
      const k = Math.min(1, (t - a.t0) / a.duree);
      x = ecranX(g, a.x + (a.x0 - a.x) * k);
      yb = depart + (hs.topEcran - depart) * k * k;
    }
    const st = styleDe(a.siege);
    dessinerEtage(c, a.sorte, x, yb, pw, ph, { coul: st.coul, glac: st.glac, deco: st.deco, t: t, humeur: 1, ly: 1, graine: 99 });
  }

  function main(c, x, y, k) {
    c.save();
    c.fillStyle = '#ffe0c8'; c.strokeStyle = '#7a4a3a'; c.lineWidth = 2;

    c.restore();
  }

  const easeOut = (k) => 1 - (1 - k) * (1 - k);

  function eclabousser(x, y, o, n) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI, v = 200 + Math.random() * 500;
      particules.push({ x: x + (Math.random() - 0.5) * 60, y: y + 10, vx: Math.cos(a) * v * (Math.random() < 0.5 ? -1 : 1), vy: Math.sin(a) * v, vie: 0.6 + Math.random() * 0.5, k: 4 + Math.random() * 7, coul: k % 3 === 0 ? COUL[o] || '#ef4f84' : '#fff8ec' });
    }
  }
  function etoiles(x, y, coul, n) {
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 240;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v + 200, vie: 0.7 + Math.random() * 0.4, k: 5 + Math.random() * 5, coul: k % 2 ? coul : '#ffe066', etoile: true, g: 500 });
    }
  }

  // ---------------------------------------------------------------------
  //  Animation des coups : la grue vise, l'étage tombe, se pose (ou tout s'écroule)
  // ---------------------------------------------------------------------

  function avancerAnimations(t) {
    if (!anim && file.length) commencerAnim(file.shift(), t);
    if (!anim) return;
    const presse = file.length > 0;
    if (anim.phase === 'vise' && t - anim.t0 >= anim.dureeVise) {
      anim.phase = 'chute'; anim.t0 = t; anim.duree = presse ? 220 : 430;
      sons.lache();
    } else if (anim.phase === 'vise') {
      const k = Math.min(1, (t - anim.t0) / anim.dureeVise);
      anim.xVise = anim.xDep + (anim.x - anim.xDep) * easeOut(k);
    }
    if (anim.phase === 'chute' && t - anim.t0 >= anim.duree) {
      lache = null;
      if (anim.apres.chute >= 0 && anim.apres.fini) { effondrer(anim, t); return; }
      anim.phase = 'pose'; anim.t0 = t; anim.duree = presse ? 160 : (anim.sorte === 'r' || anim.glisse ? 380 : 260);
      const l = anim.apres.T[anim.apres.T.length - 1];
      if (anim.sorte === 'j') sons.gelee(); else if (anim.sorte === 'k') sons.cerise(); else if (anim.sorte === 'c') sons.chou(); else sons.pose();
      if (anim.sorte === 'r' && anim.xf !== anim.x0) sons.roule();
      const yTop = hauteurTour(anim.avant.T);
      eclabousser(l.x, yTop, anim.siege, anim.sorte === 'j' ? 8 : 5);
      if (anim.sorte !== 'k') {
        particules.push({ x: l.x, y: yTop + l.h + 30, vx: 0, vy: 160, g: 0, vie: 0.9, texte: tr('jeu.plus'), coul: COUL[anim.siege] });
        const carte = $('place-' + anim.siege);
        if (carte) { carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }
        if (anim.moi) sons.point();
      } else etoiles(l.x, yTop + 30, COUL[anim.siege], 18);
    }
    if (anim.phase === 'pose' && t - anim.t0 >= anim.duree) finirAnim(t);
    if (anim && anim.phase === 'effondre' && !corps.length && t - anim.t0 > 900) finirAnim(t);
  }

  function commencerAnim(ev, t) {
    const avant = ev.avant, apres = ev.apres;
    const r = O.poser(avant, ev.action, ev.siege);
    const sortie = apres.T[apres.T.length - 1];
    const xDep = ev.moi ? ev.action : positionGrue(avant, t);
    anim = {
      avant: avant, apres: apres, siege: ev.siege, moi: ev.moi, sorte: avant.p, x: ev.action,
      x0: r.x0, xf: sortie ? sortie.x : r.x, glisse: avant.T.length && avant.T[avant.T.length - 1].t === 'j',
      phase: 'vise', t0: t, xDep: xDep, xVise: xDep, dureeVise: ev.moi ? 0 : (file.length ? 120 : 330), duree: 400
    };
    if (!ev.moi) sons.grue();
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
  }

  function effondrer(a, t) {
    a.phase = 'effondre'; a.t0 = t;
    const T = a.apres.T, ci = a.apres.ci;
    // sens de la chute : vers où penche ce qui est porté par l'appui qui cède
    const sup = ci < 0 ? O.assiette : T[ci];
    let SM = 0, SMX = 0;
    for (let j = ci + 1; j < T.length; j++) { SM += T[j].m; SMX += T[j].m * T[j].x; }
    const sens = SM && SMX / SM < sup.x ? -1 : 1;
    let y = 0;
    for (let i = 0; i < T.length; i++) {
      const l = T[i];
      if (i > ci) {
        const hauteur = i - ci;
        corps.push({
          l: l, x: l.x, y: y + l.h / 2, vx: sens * (120 + hauteur * 60 + Math.random() * 120), vy: 200 + Math.random() * 260,
          r: 0, vr: sens * (2 + Math.random() * 4) * (Math.random() < 0.2 ? -1 : 1), sol: -10 - Math.random() * 20
        });
      }
      y += l.h;
    }
    secousse = 1;
    sons.chute();
    const carte = $('place-' + a.siege);
    if (carte) { carte.classList.remove('tombe'); void carte.offsetWidth; carte.classList.add('tombe'); }
  }

  function finirAnim(t) {
    vue = anim.apres;
    anim = null;
    debutGrue = t;
    debutTour = Date.now();
    dernierTic = -1;
    if (vue && !vue.fini && partie && R.aQui(vue) === partie.siege && partie.phase === 'jeu') sons.tour();
    if (vue && vue.v && !vue.fini) sons.vent();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': file.push(JSON.parse(JSON.stringify(ev))); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function reinitScene() {
    file = []; anim = null; corps = []; flaques = []; particules.length = 0; lache = null;
    attenteFin = null; secousse = 0;
    debutGrue = performance.now(); debutTour = Date.now(); dernierTic = -1;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    reinitScene();
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    camY = camCible = 0;
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la manche.
  let finSalon = 0, resultatSalon = null, finEnAttente = false, lancement = false, finManche = 0;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;              // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 22);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { couleur: tr('couleur.' + s), qui: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomDans(partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    reinitScene();
    vue = JSON.parse(JSON.stringify(partie.etat));
    camY = camCible = 0;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    if (vue && vue.v) sons.vent();
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  // Fin de manche : montrée quand la tour a fini de tomber (ou de se poser).
  function surFin() {
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    attenteFin = { j: jeton, t: 0, enLigne: enLigne };
  }

  function verifierFin() {
    if (!attenteFin || !partie) return;
    if (attenteFin.j !== jeton) { attenteFin = null; return; }
    if (anim || file.length) return;
    const now = performance.now();
    if (!attenteFin.t) attenteFin.t = now + (corps.length || flaques.length ? 1100 : 600);
    if (corps.length || now < attenteFin.t) return;
    const enLigne = attenteFin.enLigne;
    attenteFin = null;
    if (enLigne) afficherFinEnLigne(); else afficherFin();
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const res = R.fin(e);
    const gagne = moi >= 0 && !!res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.T.length });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles : 0 si j'ai fait tomber la tour ; 3 tour finie ; 2 au moins 60 % de la hauteur ; sinon 1.
  function hauteurAtteinte(e) { return e.chute >= 0 ? Math.max(0, e.T.length - 1) : Math.min(e.T.length, e.n); }
  function tourFinie(e) { return e.chute < 0 && (e.K ? e.cer >= 0 : e.T.length >= e.n); }
  function etoilesPour(e, moi) {
    if (e.chute === moi) return 0;
    if (tourFinie(e)) return 3;
    return hauteurAtteinte(e) >= Math.ceil(e.n * 0.6) ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const r = R.fin(e);
    const ordre = r ? r.classement : [0, 1, 2, 3];
    const pts = r ? r.scores : e.sc;
    ordre.forEach((s, k) => {
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const rg = document.createElement('span'); rg.className = 'rang'; rg.textContent = nb(k + 1);
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span');
      nom.textContent = tr('couleur.' + s) + ' · ' + nomPlace(info, role) + (s === e.chute ? ' · ' + tr('fin.aFaitTomber') : '') + (s === e.cer ? ' · ' + tr('fin.cerise') : '');
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: pts[s] });
      l.append(rg, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  // Objets de l'atelier débloqués entre deux totaux d'étoiles.
  function nouveauxObjets(avant, apres) {
    const l = [];
    GLACAGES.forEach((x) => { if (x.e > avant && x.e <= apres) l.push(tr('glacage.' + x.id)); });
    DECOS.forEach((x) => { if (x.e > avant && x.e <= apres) l.push(tr('deco.' + x.id)); });
    GRUES.forEach((x) => { if (x.e > avant && x.e <= apres) l.push(tr('grue.' + x.id)); });
    return l;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const r = R.fin(e);
    const pts = moi >= 0 && r ? r.scores[moi] : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts }) : '';
    $('fin-hauteur').textContent = tr('fin.hauteur', { n: hauteurAtteinte(e), total: e.n });
    let titre;
    if (e.chute === moi) titre = tr('fin.perdu');
    else if (tourFinie(e)) titre = tr(e.cer === moi ? 'fin.ceriseToi' : 'fin.finie');
    else titre = tr('fin.tombeAutre', { nom: nomDans(e.chute) });
    $('fin-titre').textContent = titre;
    const gagne = moi >= 0 && e.chute !== moi;
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoilesN = etoilesPour(e, moi);
      const ancienRecord = prog.records[i];
      const record = gagne && pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false, cadeaux = [];
      if (gagne) {
        const avant = totalEtoiles();
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoilesN);
        cadeaux = nouveauxObjets(avant, totalEtoiles());
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      }
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoilesN) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoilesN }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, prog.records[i]) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-cadeau').textContent = cadeaux.length ? tr('fin.cadeau', { objets: cadeaux.join(', ') }) : '';
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      if (cadeaux.length) boutons.appendChild(bouton('bouton.atelier', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirAtelier(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil : les manches s'enchaînent.
      const gagneLigne = moi >= 0 && !!r && r.classement[0] === moi;
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagneLigne, level: e.T.length });
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      $('fin-cadeau').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
