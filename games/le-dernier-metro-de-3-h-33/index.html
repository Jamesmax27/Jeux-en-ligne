    const y = wagonY(g, w), col = s < 2 ? 0 : 1, lig = s % 2;
    const x = col === 0 ? g.x + g.pad : g.x + g.wl - g.pad - g.sw;
    return { x: x, y: y + g.pad + lig * (g.sh + g.pad), w: g.sw, h: g.sh };
  }

  // Ce que voit le joueur « moi » : sièges d'un wagon, Contrôleur dans un wagon.
  function voitSieges(e, moi, w) { return !e.noir[w] || (moi >= 0 && e.st[moi] === 0 && e.la[moi] && e.pos[moi] === w); }
  function voitControleur(e, moi, w) {
    if (!e.noir[w]) return true;
    if (moi < 0 || e.st[moi] !== 0) return true;          // dehors : on regarde tout
    return !!e.la[moi] && Math.abs(e.pos[moi] - w) <= 1;
  }
  function voitPieges(e, moi, w) { return moi >= 0 && e.st[moi] === 0 && e.la[moi] && e.pos[moi] === w; }
  function voitReflets(e, moi) { return moi >= 0 && e.st[moi] === 0 && e.ref[e.pos[moi]] === 1; }

  // Positions affichées (glissées) des figures : passagers p0…p4, Contrôleurs c0, c1.
  let figures = {};

  function placesFigures(e, g) {
    const parWagon = [];
    for (let w = 0; w < e.W; w++) parWagon.push([]);
    for (let p = 0; p < e.st.length; p++) if (e.st[p] === 0 && !e.ca[p]) parWagon[e.pos[p]].push('p' + p);

  }

  // opt : t, moi, survol ({k,w,s,p}), curseur, lampe (couleur), figures (positions lissées), dt, montrerBruit
  function dessinerRame(c, e, g, opt) {
    const t = opt.t || 0, moi = opt.moi === undefined ? -1 : opt.moi;
    const tourMoi = !!opt.tourMoi;
    const cibles = placesFigures(e, g);
    const fig = opt.figures || {};
    // lisser les positions
    Object.keys(cibles).forEach((id) => {
      const cb = cibles[id];
      if (!fig[id] || opt.sansLissage) fig[id] = { x: cb.x, y: cb.y };
      else { const k = Math.min(1, (opt.dt || 0.016) * 9); fig[id].x += (cb.x - fig[id].x) * k; fig[id].y += (cb.y - fig[id].y) * k; }
    });
    Object.keys(fig).forEach((id) => { if (!cibles[id]) delete fig[id]; });
    const rf = Math.min(g.wh * 0.3, (couloir(g).x2 - couloir(g).x1) / 7);

    // quais en gare (de part et d'autre de la rame)
    if (e.gare) {
      c.fillStyle = '#2a2f4d';
      c.fillRect(g.x - g.quai - 4, g.y0 - 6, g.quai, wagonY(g, e.W - 1) + g.wh - g.y0 + 12);
      c.fillRect(g.x + g.wl + 4, g.y0 - 6, g.quai, wagonY(g, e.W - 1) + g.wh - g.y0 + 12);
      c.fillStyle = '#d9b32e';
      c.fillRect(g.x - 7, g.y0 - 6, 3, wagonY(g, e.W - 1) + g.wh - g.y0 + 12);
      c.fillRect(g.x + g.wl + 4, g.y0 - 6, 3, wagonY(g, e.W - 1) + g.wh - g.y0 + 12);
    } else {
      // le tunnel défile : petites lumières qui filent sur les côtés
      c.fillStyle = 'rgba(255,210,140,.5)';
      const h = wagonY(g, e.W - 1) + g.wh - g.y0;
      for (let i = 0; i < 6; i++) {
        const y1 = g.y0 + ((t / 4 + i * h / 6) % h), y2 = g.y0 + ((t / 4 + (i + 0.5) * h / 6) % h);
        c.fillRect(g.x - 11, y1, 3, 10); c.fillRect(g.x + g.wl + 8, y2, 3, 10);
      }
    }

    for (let w = 0; w < e.W; w++) {
      const y = wagonY(g, w);
      // soufflet entre deux wagons (porte verrouillée en rouge)
      if (w < e.W - 1) {
        const yy = y + g.wh, mx = g.x + g.wl / 2;
        c.fillStyle = e.portes[w] ? '#5a1622' : '#2c3150';
        c.fillRect(mx - g.wl * 0.14, yy - 1, g.wl * 0.28, g.gap + 2);
        if (e.portes[w]) cadenas(c, mx, yy + g.gap / 2 - g.gap * 0.15, Math.max(4, g.gap * 0.55));
        else { c.strokeStyle = '#4b5180'; c.lineWidth = 1; for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(mx - g.wl * 0.14 + i * g.wl * 0.07, yy); c.lineTo(mx - g.wl * 0.14 + i * g.wl * 0.07, yy + g.gap); c.stroke(); } }
      }

      c.fillStyle = '#39465e'; c.strokeStyle = '#0d1122'; c.lineWidth = 3;
      if (w === 0) {
        // tête de rame : le nez arrondi
        c.beginPath(); c.moveTo(g.x, y + g.wh); c.lineTo(g.x, y + g.wh * 0.35); c.quadraticCurveTo(g.x, y - g.wh * 0.08, g.x + g.wl / 2, y - g.wh * 0.1); c.quadraticCurveTo(g.x + g.wl, y - g.wh * 0.08, g.x + g.wl, y + g.wh * 0.35); c.lineTo(g.x + g.wl, y + g.wh); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#fff3c4'; rond(c, g.x + g.wl * 0.25, y + g.wh * 0.02, Math.max(2, g.wh * 0.04)); c.fill(); rond(c, g.x + g.wl * 0.75, y + g.wh * 0.02, Math.max(2, g.wh * 0.04)); c.fill();
      } else { rr(c, g.x, y, g.wl, g.wh, g.wh * 0.12); c.fill(); c.stroke(); }
      // plancher
      c.fillStyle = '#5c6278'; rr(c, g.x + g.pad * 0.6, y + g.pad * 0.6, g.wl - g.pad * 1.2, g.wh - g.pad * 1.2, g.wh * 0.08); c.fill();
      c.strokeStyle = 'rgba(0,0,0,.15)'; c.lineWidth = 1;
      for (let i = 1; i < 6; i++) { const xx = g.x + g.wl * i / 6; c.beginPath(); c.moveTo(xx, y + g.pad); c.lineTo(xx, y + g.wh - g.pad); c.stroke(); }
      if (w === e.W - 1) { c.fillStyle = '#c0283c'; c.fillRect(g.x + g.wl * 0.2, y + g.wh - 3, g.wl * 0.1, 3); c.fillRect(g.x + g.wl * 0.7, y + g.wh - 3, g.wl * 0.1, 3); }
      // vitres (reflets)
      if (e.ref[w]) {
        c.fillStyle = 'rgba(127,227,255,' + (0.45 + 0.2 * Math.sin(t / 500 + w)).toFixed(2) + ')';
        [0.2, 0.5].forEach((p) => { c.fillRect(g.x - 2, y + g.wh * p, 4, g.wh * 0.24); c.fillRect(g.x + g.wl - 2, y + g.wh * p, 4, g.wh * 0.24); });
      }
      // portes extérieures en gare
      if (e.gare) {
        const ouvert = e.quai[w] === 1;

        if (ouvert) { c.save(); c.shadowColor = '#5fe0a0'; c.shadowBlur = 10 + 4 * Math.sin(t / 200); }
        c.fillRect(g.x - 4, y + g.wh * 0.3, 6, g.wh * 0.4); c.fillRect(g.x + g.wl - 2, y + g.wh * 0.3, 6, g.wh * 0.4);
        if (ouvert) c.restore();
      }
      // sièges et objets
      const vois = opt.toutVoir || voitSieges(e, moi, w), pieges = opt.toutVoir || voitPieges(e, moi, w);
      for (let s = 0; s < O.SIEGES; s++) {
        const r = siegeRect(g, w, s);
        c.fillStyle = '#7a2e45'; c.strokeStyle = '#3a1020'; c.lineWidth = 2;

        c.fillStyle = '#93405a'; rr(c, r.x + 3, r.y + 3, r.w - 6, r.h * 0.3, 4); c.fill();

      }
      // surbrillance : wagon voisin où l'on peut aller, sièges de son wagon
      if (tourMoi && moi >= 0 && e.st[moi] === 0) {
        const mw = e.pos[moi];
        if (Math.abs(w - mw) === 1 && O.valide(e, moi, { t: 'm', d: w - mw })) {
          const a = 0.3 + 0.2 * Math.sin(t / 250);
          c.strokeStyle = 'rgba(255,211,107,' + a.toFixed(2) + ')'; c.lineWidth = 4; rr(c, g.x + 2, y + 2, g.wl - 4, g.wh - 4, g.wh * 0.1); c.stroke();
        }

            const r = siegeRect(g, w, s);
            c.strokeStyle = 'rgba(255,255,255,' + (0.25 + 0.15 * Math.sin(t / 300 + s)).toFixed(2) + ')'; c.lineWidth = 2;
            rr(c, r.x - 2, r.y - 2, r.w + 4, r.h + 4, 8); c.stroke();
          }
        }
      }
    }

    // figures : passagers puis Contrôleurs
    const ids = Object.keys(fig);
    ids.forEach((id) => {
      const f = fig[id], cb = cibles[id];
      if (id.charAt(0) === 'p') {
        const p = +id.slice(1);
        if (cb.cache) {

          c.fillStyle = 'rgba(0,0,0,.55)'; ell(c, f.x, f.y, rf * 0.75, rf * 0.35); c.fill();
          c.fillStyle = COUL[p]; rond(c, f.x - rf * 0.22, f.y, rf * 0.11); c.fill(); rond(c, f.x + rf * 0.22, f.y, rf * 0.11); c.fill();
        } else {
          if (p === moi && e.la[p]) dessinHalo(c, f.x, f.y, rf * 2.4, opt.lampe || '#ffd36b');
          passager(c, p, f.x, f.y, rf, {});
          if (p === moi) { c.strokeStyle = '#ffd36b'; c.lineWidth = 2.5; ell(c, f.x, f.y + rf * 0.95, rf * 0.8, rf * 0.22); c.stroke(); }
          if (opt.montrerBruit) bruitAuDessus(c, f.x, f.y - rf * 1.25, rf, e.br[p]);
        }
      }
    });
    // obscurité des wagons noirs (la lampe y perce un trou)
    for (let w = 0; w < e.W; w++) {
      if (!e.noir[w] || opt.toutVoir) continue;
      const y = wagonY(g, w);
      c.save();
      rr(c, g.x + 1, y + 1, g.wl - 2, g.wh - 2, g.wh * 0.1); c.clip();
      const lampeIci = moi >= 0 && e.st[moi] === 0 && e.la[moi] && e.pos[moi] === w && fig['p' + moi];
      if (lampeIci) {
        const f = fig['p' + moi];
        const gr = c.createRadialGradient(f.x, f.y, rf * 0.5, f.x, f.y, g.wl * 0.75);
        gr.addColorStop(0, 'rgba(2,3,8,0)'); gr.addColorStop(0.55, 'rgba(2,3,8,.25)'); gr.addColorStop(1, 'rgba(2,3,8,.8)');

      // les passagers restent devinés : leurs yeux brillent dans le noir
      if (!lampeIci) {
        for (let p = 0; p < e.st.length; p++) {
          const f = fig['p' + p];
          if (!f || e.st[p] !== 0 || e.pos[p] !== w || e.ca[p]) continue;
          if (p === moi) passager(c, p, f.x, f.y, rf, { alpha: 0.85 });
          else { c.fillStyle = COUL[p]; rond(c, f.x - rf * 0.17, f.y - rf * 0.28, rf * 0.09); c.fill(); rond(c, f.x + rf * 0.17, f.y - rf * 0.28, rf * 0.09); c.fill(); }
        }
      }
    }
    ids.forEach((id) => {
      if (id.charAt(0) !== 'c') return;
      const k = +id.slice(1), f = fig[id];
      const w = e.ct[k];
      if (!opt.toutVoir && !voitControleur(e, moi, w)) return;
      // liseré rouge : le wagon où il se tient
      const y = wagonY(g, w);
      c.strokeStyle = 'rgba(255,77,109,' + (0.45 + 0.2 * Math.sin(t / 260)).toFixed(2) + ')'; c.lineWidth = 3;
      rr(c, g.x + 1.5, y + 1.5, g.wl - 3, g.wh - 3, g.wh * 0.11); c.stroke();

        const ch = O.chemin(e, k, -1, -1);
        const a = ch.length ? ch[ch.length - 1] : e.ct[k];
        const co = couloir(g), y = wagonY(g, a) + g.wh * 0.54, x = co.x2 - rf * 0.6;

    });
  }

  function dessinHalo(c, x, y, r, couleur) {

    }
  }

  // ---------------------------------------------------------------------

  let partie = null;

  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)

  let survol = null, curseur = -1, clavier = false;

  const particules = [];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';

  function toast(texte, duree, genre) {
    const el = $('toast');

  }

  // Cartes des 5 places, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'av'; cv.width = 84; cv.height = 84;
      medaillon(cv.getContext('2d'), s, 42, 42, 40);
      const statut = document.createElement('span'); statut.className = 'statut';
      const tag = document.createElement('span'); tag.className = 'tag';
      const pts = document.createElement('span'); pts.className = 'pts';
      const bruit = document.createElement('span'); bruit.className = 'bruit';
      for (let i = 0; i < 5; i++) bruit.appendChild(document.createElement('i'));
      const objets = document.createElement('span'); objets.className = 'objets';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 48; cour.height = 36;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 24, 33, 22);
      d.append(cv, statut, tag, pts, bruit, objets, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';

      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Couronne dorée du chef du salon (le premier joueur arrivé), base centrée en (x, y).
  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 22, k / 22);
    c.fillStyle = '#ffd36b'; c.strokeStyle = '#7a4f00'; c.lineWidth = 2.5; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-23, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(23, -22); c.lineTo(20, 0); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle = '#c0283c'; rond(c, 0, -10, 3.5); c.fill();
    c.restore();
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom),
  // sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    if (tag.dataset.role === role && tag.dataset.nom === nom) return;
    tag.dataset.role = role;
    tag.dataset.nom = nom;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = nom;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const moiSiege = () => (partie ? partie.siege : -1);

  function nomPassager(s) {
    const info = siegesActuels()[s] || {};
    if (info.moi) return tr('place.toi');
    return info.nom || tr('passager.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels(), moi = moiSiege();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    const cibles = e && voitReflets(e, moi) ? e.cib : [];
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      if (!e) { d.querySelector('.pts').textContent = nb(0); continue; }
      const pts = e.pts[s], st = e.st[s];
      const elPts = d.querySelector('.pts');
      if (elPts.textContent !== nb(pts)) elPts.textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('dehors', st !== 0);
      d.classList.toggle('emporte', st === 2 || st === 3);
      d.classList.toggle('cible', cibles.indexOf(s) >= 0 && st === 0);
      d.querySelector('.statut').innerHTML = st === 1 ? ICONE_PORTE : (st >= 2 ? ICONE_FANTOME : '');
      const barres = d.querySelectorAll('.bruit i');
      barres.forEach((b, i) => { b.className = i < e.br[s] ? ('on' + (e.br[s] >= 4 ? ' fort' : '')) : ''; });
      // objets : les tickets des autres sont comptés ensemble (on ne voit pas les pièges dans leur poche)
      const voitTout = s === moi || moi < 0 || (vue && moi >= 0 && vue.st[moi] !== 0);
      const tickets = voitTout ? e.tk[s] : e.tk[s] + e.pg[s];
      let html = '';
      if (tickets) html += ICONE_TICKET + '<b>' + nb(tickets) + '</b>';
      if (voitTout && e.pg[s]) html += ICONE_PIEGE + '<b>' + nb(e.pg[s]) + '</b>';
      if (e.la[s]) html += ICONE_LAMPE;
      if (e.cl[s]) html += ICONE_CLE + (e.cl[s] > 1 ? '<b>' + nb(e.cl[s]) + '</b>' : '');
      const ob = d.querySelector('.objets');
      if (ob.dataset.h !== html) { ob.dataset.h = html; ob.innerHTML = html; }
      const etat = st === 1 ? tr('etat.descendu') : st === 2 ? tr('etat.emporte') : st === 3 ? tr('etat.perdu') : (e.ca[s] ? tr('etat.cache') : '');
      d.setAttribute('aria-label', tr('place.aria', { nom: nomPassager(s), points: pts, bruit: e.br[s] }) + (etat ? ' · ' + etat : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function heure(e) {
    const total = e.S * e.R + (e.S - 1);
    const m = Math.min(33, Math.round(33 * Math.min(1, e.rd / total)));
    return tr('jeu.heure', { m: (m < 10 ? '0' : '') + m });
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue, moi = moiSiege();
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    if (moi < 0) return tr('multi.attente');
    if (e.st[moi] !== 0) return tr('jeu.spectateur');
    const s = R.aQui(e);
    if (s === moi) return modeGlisser ? tr('tour.glisser') : tr('tour.toi');
    return tr('tour.autre', { nom: nomPassager(s) });
  }

  function majInfos() {
    let info = '';
    const e = vue;
    if (e) {
      const st = e.gare ? tr('jeu.enGare', { n: e.sta, total: e.S }) : tr('jeu.station', { n: Math.min(e.S, e.sta + 1), total: e.S });
      if (session === 'solo') info = tr('jeu.niveau', { n: niveau }) + ' · ' + st + ' · ' + heure(e);
      else info = st + ' · ' + heure(e);
    } else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // Barre d'actions : déplacements, cachette, attente, piège, descente.
  function construireActions() {
    const boite = $('actions');
    boite.textContent = '';
    const liste = [['avant', 'act.avant'], ['arriere', 'act.arriere'], ['cacher', 'act.cacher'], ['attendre', 'act.attendre'], ['glisser', 'act.glisser'], ['descendre', 'act.descendre']];
    liste.forEach((x) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'act'; b.id = 'act-' + x[0];
      b.innerHTML = SVG_ACTIONS[x[0]];
      const sp = document.createElement('span'); sp.textContent = tr(x[1]);
      b.appendChild(sp);
      b.addEventListener('click', () => { audio(); boutonAction(x[0]); });
      boite.appendChild(b);
    });
    // Choix du rival à qui glisser le ticket piégé.
    for (let q = 0; q < PLACES; q++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'act cible-glisser'; b.id = 'act-q' + q; b.hidden = true;
      const cv = document.createElement('canvas'); cv.width = 52; cv.height = 52; medaillon(cv.getContext('2d'), q, 26, 26, 25);
      const sp = document.createElement('span');
      b.append(cv, sp);
      b.addEventListener('click', () => { audio(); jouerAction({ t: 'g', p: q }); });
      boite.appendChild(b);
    }
    const an = document.createElement('button');
    an.type = 'button'; an.className = 'act'; an.id = 'act-annuler'; an.hidden = true;
    an.innerHTML = SVG_ACTIONS.annuler;
    const sp = document.createElement('span'); sp.textContent = tr('act.annuler'); an.appendChild(sp);
    an.addEventListener('click', () => { sons.clic(); modeGlisser = false; majActions(); majInfos(); });
    boite.appendChild(an);
  }

  function rivauxGlisser() {
    const e = vue, moi = moiSiege(), l = [];
    if (!e || moi < 0) return l;
    for (let q = 0; q < PLACES; q++) if (O.valide(e, moi, { t: 'g', p: q })) l.push(q);
    return l;
  }

  function majActions() {
    const e = vue, moi = moiSiege();
    const mon = !!(partie && partie.monTour() && e && !attenteTuto && !enPause && moi >= 0 && e.st[moi] === 0);
    const v = (a) => mon && O.valide(e, moi, a);
    const rivaux = mon ? rivauxGlisser() : [];
    if (modeGlisser && !rivaux.length) modeGlisser = false;
    const montre = (id, oui) => { const b = $(id); if (b.hidden === !oui) return; b.hidden = !oui; };
    ['avant', 'arriere', 'cacher', 'attendre'].forEach((x) => montre('act-' + x, !modeGlisser));
    montre('act-glisser', !modeGlisser && !!(e && moi >= 0 && e.pg[moi] > 0 && e.st[moi] === 0));
    montre('act-descendre', !modeGlisser && !!(e && e.gare));
    for (let q = 0; q < PLACES; q++) {
      const b = $('act-q' + q);
      const oui = modeGlisser && rivaux.indexOf(q) >= 0;
      montre('act-q' + q, oui);
      if (oui) { const sp = b.querySelector('span'); const n = nomPassager(q); if (sp.textContent !== n) sp.textContent = n; b.disabled = !mon; }
    }
    montre('act-annuler', modeGlisser);
    $('act-avant').disabled = !v({ t: 'm', d: -1 });
    $('act-arriere').disabled = !v({ t: 'm', d: 1 });
    $('act-cacher').disabled = !v({ t: 'c' });
    $('act-attendre').disabled = !v({ t: 'a' });
    $('act-glisser').disabled = !rivaux.length;
    $('act-descendre').disabled = !v({ t: 'd' });
    $('act-descendre').classList.toggle('chaud', v({ t: 'd' }));
    $('act-glisser').classList.toggle('rouge', rivaux.length > 0);
    // en ligne, quand on est descendu ou emporté, la barre disparaît
    $('actions').style.visibility = e && moi >= 0 && e.st[moi] !== 0 ? 'hidden' : 'visible';
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majActions();
  }

  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function ciblesClavier() {
    const e = vue, moi = moiSiege(), l = [];
    if (!e || moi < 0 || e.st[moi] !== 0) return l;
    for (let s = 0; s < O.SIEGES; s++) l.push({ k: 'siege', w: e.pos[moi], s: s });
    for (let q = 0; q < PLACES; q++) if (O.valide(e, moi, { t: 'g', p: q })) l.push({ k: 'jeton', p: q });
    return l;
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h);
    const moi = moiSiege();
    const mon = !!(partie && partie.monTour() && !attenteTuto);
    const cl = ciblesClavier();
    dessinerRame(c, vue, geo, {
      t: t, dt: dt, moi: moi, tourMoi: mon, figures: figures, lampe: couleurLampe(),
      survol: mon ? survol : null, curseur: clavier && mon && curseur >= 0 ? cl[curseur % Math.max(1, cl.length)] : null
    });
    // particules
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.grav || 0) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.genre === 'ticket') dessinTicket(c, p.x, p.y, p.k, p.coul, false);
      else if (p.genre === 'fumee') { c.fillStyle = p.coul; rond(c, p.x, p.y, p.k * (1.6 - p.vie)); c.fill(); }
      else { c.fillStyle = p.coul; etincelle(c, p.x, p.y, p.k); }
      c.globalAlpha = 1;
    }
    // battement de cœur quand le Contrôleur est tout près (et qu'on le voit)
    if (moi >= 0 && vue.st[moi] === 0 && !vue.ca[moi]) {
      const proche = vue.ct.some((x) => Math.abs(x - vue.pos[moi]) <= 1 && voitControleur(vue, moi, x));
      if (proche && t - dernierCoeur > 1300) { dernierCoeur = t; sons.coeur(); }
    }
  }

  function etincelle(c, x, y, k) {
    c.beginPath(); c.moveTo(x, y - k); c.quadraticCurveTo(x, y, x + k, y); c.quadraticCurveTo(x, y, x, y + k); c.quadraticCurveTo(x, y, x - k, y); c.quadraticCurveTo(x, y, x, y - k); c.fill();
  }

  function centreSiege(w, s) { const r = siegeRect(geo, w, s); return [r.x + r.w / 2, r.y + r.h / 2]; }
  function centreFigure(p) { const f = figures['p' + p]; return f ? [f.x, f.y] : null; }

  function jaillir(x, y, coul, n, genre) {
    for (let k = 0; k < (n || 14); k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, grav: 300, vie: 0.6 + Math.random() * 0.5, k: 3 + Math.random() * 4, coul: coul, genre: genre });
    }
  }
  function envolTicket(x, y, coul) { particules.push({ x: x, y: y, vx: 0, vy: -140, grav: 60, vie: 1.1, k: 9, coul: coul, genre: 'ticket' }); }
  function fumee(x, y) {
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, v = 20 + Math.random() * 50;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, grav: -20, vie: 0.9 + Math.random() * 0.5, k: 6 + Math.random() * 6, coul: 'rgba(150,160,210,.5)', genre: 'fumee' });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    figures = {};
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  // sinon elle part toute seule au bout du temps donné par le serveur.
  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 100, 100);
        medaillon(c, s, 50, 56, 40);
        if (info.chef) couronne(c, 50, 22, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { nom: tr('passager.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef || tr('passager.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    figures = {};
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    modeGlisser = false;
    finSoloMontree = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Ce qui vient de se passer (liste ev de l'état) : sons, messages, effets.
  function raconter(ev, apres) {
    const moi = moiSiege();
    (apres.ev || []).forEach((x) => {
      const estMoi = x.p === moi;
      switch (x.k) {
        case 'm': sons.pas(); break;
        case 'cle': sons.verrou(); if (geo) jaillir(geo.x + geo.wl / 2, wagonY(geo, x.porte) + geo.wh + geo.gap / 2, '#9fe8ff', 12); if (estMoi) toast(tr('msg.cle')); break;
        case 'f': {
          sons.fouille();
          const pos = geo ? centreSiege(x.w, x.s) : null;
          const vois = voitSieges(apres, moi, x.w) || estMoi;
          if (x.o === O.VIDE || !x.pris) { if (estMoi) { setTimeout(sons.rien, 180); toast(tr(x.o === O.LAMPE ? 'msg.dejaLampe' : 'msg.rien'), 1500); } break; }
          setTimeout(x.o === O.PIEGE && estMoi ? sons.piege : sons.objet, 180);
          if (pos && vois) {
            if (x.o === O.TICKET || (x.o === O.PIEGE && !estMoi)) envolTicket(pos[0], pos[1], '#ffd36b');
            else if (x.o === O.PIEGE) { envolTicket(pos[0], pos[1], '#ff4d6d'); secouer(); }
            else jaillir(pos[0], pos[1], x.o === O.LAMPE ? '#ffd36b' : '#9fe8ff', 12);
          }
          if (estMoi) toast(tr('msg.trouve.' + x.o), 2400, x.o === O.PIEGE ? 'danger' : 'bon');
          break;
        }
        case 'c': sons.cache(); if (estMoi) toast(tr('msg.cache')); break;
        case 'g': {
          sons.piege();
          if (x.q === moi) { toast(tr('msg.glisseToi', { nom: nomPassager(x.p) }), 3000, 'danger'); secouer(); }
          else if (estMoi) toast(tr('msg.glisse', { nom: nomPassager(x.q) }), 2400, 'bon');
          else toast(tr('msg.glisseAutre', { nom: nomPassager(x.p), cible: nomPassager(x.q) }), 2200);
          break;
        }
        case 'd': {
          sons.descend();
          const f = centreFigure(x.p);
          if (f) jaillir(f[0], f[1], '#5fe0a0', 22);
          if (!estMoi) toast(tr('msg.descend', { nom: nomPassager(x.p) }), 2200, 'bon');
          bondir(x.p);
          break;
        }
        case 'a': break;
        case 'pince': {
          sons.poincon(); secouer();
          const f = centreFigure(x.p);
          if (f) envolTicket(f[0], f[1] - 10, '#ffd36b');
          toast(estMoi ? tr('msg.pinceToi') : tr('msg.pince', { nom: nomPassager(x.p) }), 2600, estMoi ? 'danger' : '');
          break;
        }
        case 'emporte': {
          sons.emporte();
          const f = centreFigure(x.p);
          if (f) fumee(f[0], f[1]);
          if (estMoi) secouer();
          toast(estMoi ? tr('msg.emporteToi') : tr('msg.emporte', { nom: nomPassager(x.p) }), 3000, 'danger');
          break;
        }
        case 'gare': sons.gare(); setTimeout(sons.portes, 500); toast(tr('msg.gare', { n: x.sta }), 2600, 'bon'); for (let p = 0; p < PLACES; p++) if (apres.st[p] === 0) bondir(p); break;
        case 'depart': sons.portes(); if (apres.ver) setTimeout(sons.verrou, 400); toast(tr(apres.ver ? 'msg.departVerrou' : 'msg.depart'), 2200); break;
        case 'terminus': sons.gare(); toast(tr('msg.terminus'), 3000); break;
        case 'express': toast(tr('msg.express'), 3000); break;
        case 'rapide': setTimeout(sons.gare, 600); toast(tr('msg.rapide'), 3000); break;
        case 'td': if (x.p === moi) sons.descend(); bondir(x.p); break;
        case 'perdu': if (x.p === moi) sons.emporte(); break;
        default: break;
      }
    });
  }

  function bondir(p) {
    const carte = $('place-' + p);
    if (!carte) return;
    carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
  }

  function surAction(ev) {
    const moi = moiSiege();
    vue = JSON.parse(JSON.stringify(ev.apres));
    debutTour = Date.now();
    dernierTic = -1;
    raconter(ev, ev.apres);
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && !vue.fini && R.aQui(vue) === moi && !ev.moi) sons.tour();
    if (modeGlisser && !rivauxGlisser().length) modeGlisser = false;
    // Mon passager vient de quitter la rame.
    if (moi >= 0 && ev.avant.st[moi] === 0 && vue.st[moi] !== 0) {
      if (session === 'solo') {
        const j = jeton;
        finSoloMontree = true;
        setTimeout(() => { if (j === jeton && partie) { partie.pause(true); afficherFin(); } }, 1100);
      } else if (!vue.fini) toast(tr(vue.st[moi] === 1 ? 'msg.spectateurBon' : 'msg.spectateur'), 3200);

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');

  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') { enPartie = false; if (finSoloMontree) return; finSoloMontree = true; }

    const enLigne = partie.mode === 'en-ligne';

  }

  function gagneManche(e, moi) {
    const r = R.fin(e);
    return moi >= 0 && !!r && r.classement[0] === moi;
  }

  // Fin d'une manche en ligne : le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = gagneManche(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));

  // ---------------------------------------------------------------------
  //  Fins : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles : ★ descendu avec un ticket ; ★★ après la moitié des stations ; ★★★ au terminus.
  function etoilesPour(e, moi) {
    if (moi < 0 || e.st[moi] !== 1) return 0;
    if (e.ga[moi] >= e.S) return 3;
    if (e.ga[moi] >= Math.ceil(e.S / 2)) return 2;
    return 1;
  }

  function ordreProvisoire(e) {
    const l = [];
    for (let s = 0; s < PLACES; s++) l.push(s);
    l.sort((x, y) => (e.pts[y] - e.pts[x]) || ((e.st[x] === 1 ? 0 : 1) - (e.st[y] === 1 ? 0 : 1)) || (x - y));
    return l;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const ordre = ordreProvisoire(e);
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.pts[s] !== prec) { rang = k + 1; prec = e.pts[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span');
      nom.textContent = role === 'robot' ? tr('passager.' + s) : nomPlace(info, role);
      qui.appendChild(nom);
      const etat = document.createElement('span'); etat.className = 'etat';
      etat.textContent = e.st[s] === 1 ? tr('etat.descendu') : e.st[s] === 2 ? tr('etat.emporte') : e.st[s] === 3 ? tr('etat.perdu') : tr('etat.aBord');
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: e.pts[s] });
      l.append(r, cv, qui, etat, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {

    b.textContent = tr(cle);

    return b;
  }

  function afficherFin() {
    const e = vue || (partie && partie.etat);
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.pts[moi] : 0;

      if (record) prog.records[i] = pts;
      let debloque = false;
      const totalAvant = totalEtoiles();
      if (gagne) {

        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);

        if (prog.etoiles.every((x) => x > 0)) {

        }
      }
      const st = moi >= 0 ? e.st[moi] : 2;

      $('fin-detail').textContent = gagne ? tr('fin.detailGagne', { n: e.ga[moi], total: e.S }) : tr(st === 3 ? 'fin.detailPerdu' : 'fin.detailEmporte', { n: moi >= 0 ? e.ga[moi] : 0 });
      const zone = $('fin-etoiles');

      let deb = '';

      else if (debloque) deb = tr('fin.debloque', { n: niveau + 1 });
      const lanterneNeuve = LANTERNES.findIndex((L, k) => k > 0 && totalAvant < L.n && totalEtoiles() >= L.n);

      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));

      $('fin-detail').textContent = '';

      $('fin-debloque').textContent = '';

      if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    }
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();

    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? COUL[i % 5] : '#ffd36b', k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }

  // Parcours solo : niveau n contre 4 robots (force croissante, donnée par le terrain).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;

    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();

  }

    }

      regles: R, enLigne: false, force: NIVEAUX[niveau - 1].fr, options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });

    majInterface();

  // Petit état de démonstration : W wagons, passagers absents sauf ceux qu'on place.
  function mini(W, o) {
    o = o || {};
    const e = {
      n: 0, W: W, S: 3, R: 2, si: [], noir: [], ref: [], portes: [], quai: [], pos: [], br: [], tk: [], pg: [], la: [], cl: [], ca: [], st: [], pts: [], ga: [],
      ct: (o.ct || [0]).slice(), cib: (o.ct || [0]).map(() => -1), pat: (o.ct || [0]).map(() => 0), gare: 0, sta: 0, traj: 2, rd: 0, o0: 0, k: 0, tour: 0, fini: 0, ev: [], ver: 0, nq: 0, ren: [0, 0, 0, 0], v: 0
    };
    for (let i = 0; i < W * 4; i++) e.si.push(0);
    for (let i = 0; i < W; i++) { e.noir.push(0); e.ref.push(0); e.quai.push(0); }
    for (let i = 0; i < W - 1; i++) e.portes.push(0);
    for (let p = 0; p < PLACES; p++) { e.pos.push(0); e.br.push(0); e.tk.push(0); e.pg.push(0); e.la.push(0); e.cl.push(0); e.ca.push(0); e.st.push(1); e.pts.push(0); e.ga.push(0); }
    (o.passagers || []).forEach((x) => { e.st[x[0]] = 0; e.pos[x[0]] = x[1]; });
    return e;
  }

    },
    bruit: {
      init: () => { const e = mini(4, { passagers: [[0, 1], [2, 3]] }); e.br[0] = 3; e.br[2] = 1; return e; },
      etapes: [
        { cible: { k: 'bouton', b: 'attendre' }, faire: (e) => { e.br[0] = 2; e.br[2] = 2; e.pos[2] = 2; } },
        { cible: { k: 'bouton', b: 'attendre' }, faire: (e) => { e.br[0] = 1; e.br[2] = 3; e.pos[2] = 3; e.cib[0] = 2; } },
        { faire: (e) => { e.ct[0] = 1; } },
        { faire: (e) => { e.ct[0] = 2; } }
      ]
    },
    noir: {
      init: () => { const e = mini(3, { passagers: [[0, 0]], ct: [] }); e.noir[1] = 1; e.si[0 * 4 + 2] = O.LAMPE; e.si[1 * 4 + 1] = O.TICKET; return e; },
      etapes: [
        { cible: { k: 'siege', w: 0, s: 2 }, faire: (e) => { e.si[2] = 0; e.la[0] = 1; } },
        { cible: { k: 'wagon', w: 1 }, faire: (e) => { e.pos[0] = 1; } },
        { cible: { k: 'siege', w: 1, s: 1 }, faire: (e) => { e.si[5] = 0; e.tk[0] = 1; } }
      ]
    },
    portes: {
      init: () => { const e = mini(3, { passagers: [[0, 1]], ct: [] }); e.portes[1] = 1; e.si[1 * 4 + 0] = O.CLE; e.si[2 * 4 + 3] = O.TICKET; return e; },
      etapes: [
        { cible: { k: 'siege', w: 1, s: 0 }, faire: (e) => { e.si[4] = 0; e.cl[0] = 1; } },
        { cible: { k: 'wagon', w: 2 }, faire: (e) => { e.portes[1] = 0; e.cl[0] = 0; e.pos[0] = 2; } },
        { cible: { k: 'siege', w: 2, s: 3 }, faire: (e) => { e.si[11] = 0; e.tk[0] = 1; } }
      ]
    },
    quai: {
      init: () => { const e = mini(3, { passagers: [[0, 0]], ct: [] }); e.tk[0] = 1; e.gare = 1; e.quai = [0, 0, 1]; return e; },
      etapes: [
        { cible: { k: 'wagon', w: 1 }, faire: (e) => { e.pos[0] = 1; } },
        { cible: { k: 'wagon', w: 2 }, faire: (e) => { e.pos[0] = 2; } },
        { cible: { k: 'bouton', b: 'descendre' }, faire: (e) => { e.st[0] = 1; } }
      ]
    },
    reflets: {
      init: () => { const e = mini(3, { passagers: [[0, 1]] }); e.ref[1] = 1; e.cib[0] = 0; e.reflets = 1; return e; },
      etapes: [
        { cible: { k: 'wagon', w: 2 }, faire: (e) => { e.pos[0] = 2; e.cib[0] = -1; e.pat[0] = 1; } },
        { faire: (e) => { e.ct[0] = 1; } }
      ]
    },
    piege: {
      init: () => { const e = mini(3, { passagers: [[0, 1], [3, 1]], ct: [] }); e.si[1 * 4 + 1] = O.PIEGE; e.la[0] = 1; return e; },
      etapes: [
        { cible: { k: 'siege', w: 1, s: 1 }, faire: (e) => { e.si[5] = 0; e.pg[0] = 1; e.br[0] = 2; } },
        { cible: { k: 'bouton', b: 'glisser' }, faire: () => {} },
        { cible: { k: 'jeton', p: 3 }, faire: (e) => { e.pg[0] = 0; e.pg[3] = 1; e.br[3] = 2; } }
      ]
    },
    presse: {
      init: () => { const e = mini(4, { passagers: [[0, 3]] }); e.cib[0] = 0; return e; },
      etapes: [
        { faire: (e) => { e.ct[0] = 2; } },
        { cible: { k: 'bouton', b: 'cacher' }, faire: (e) => { e.ca[0] = 1; } },
        { faire: (e) => { e.ct[0] = 3; } }
      ]
    },
    double: {
      init: () => { const e = mini(4, { passagers: [[0, 1]], ct: [0, 3] }); e.cib = [0, 0]; return e; },
      etapes: [
        { faire: (e) => { e.ct = [1, 2]; } },
        { cible: { k: 'bouton', b: 'cacher' }, faire: (e) => { e.ca[0] = 1; } },
        { faire: (e) => { e.ct = [1, 1]; } }
      ]
    },
    terminus: {
      init: () => { const e = mini(3, { passagers: [[0, 1], [2, 2]], ct: [] }); e.tk[0] = 1; return e; },
      etapes: [
        { faire: (e) => { e.gare = 1; e.quai = [1, 1, 1]; } },
        { faire: (e) => { e.st[0] = 1; e.st[2] = 3; } }
      ]
    }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    let e = d.init(), debut = 0, fait = 0, figs = {}, tPrecTuto = 0;
    const PAS = 1500, j = ++tutoAnim;
    const g = geometrie(e, 420, 360);
    g.x = 20 + g.quai;
    const bx = 500;
    const posBouton = (b) => [bx, 60 + BOUTONS_TUTO[b] * 80];
    function cibleXY(cb) {
      if (!cb) return null;
      if (cb.k === 'wagon') return [g.x + g.wl / 2, wagonY(g, cb.w) + g.wh / 2];
      if (cb.k === 'siege') { const r = siegeRect(g, cb.w, cb.s); return [r.x + r.w / 2, r.y + r.h / 2]; }
      if (cb.k === 'jeton') { const f = figs['p' + cb.p]; return f ? [f.x, f.y] : [g.x + g.wl / 2, wagonY(g, 1) + g.wh / 2]; }
      if (cb.k === 'bouton') return posBouton(cb.b);
      return null;
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const dt = tPrecTuto ? Math.min(0.05, (t - tPrecTuto) / 1000) : 0.016;
      tPrecTuto = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = d.init(); fait = 0; figs = {}; debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= 820) {
        d.etapes[fait].faire(e);
        fait++;
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#0a0c16'; c.fillRect(0, 0, 560, 360);
      dessinerRame(c, e, g, { t: t, dt: dt, moi: 0, figures: figs, lampe: couleurLampe(), montrerBruit: cle === 'bruit', reflets: !!e.reflets && e.st[0] === 0 && e.ref[e.pos[0]] });
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      Object.keys(BOUTONS_TUTO).forEach((b) => {
        const p = posBouton(b);
        boutonTuto(c, b, p[0], p[1], !!(prochaine && prochaine.cible && prochaine.cible.k === 'bouton' && prochaine.cible.b === b));
      });
      if (prochaine && prochaine.cible) {
        const p = cibleXY(prochaine.cible);
        if (p) {
          const q = Math.min(1, dans / 650);
          const x = 470 + (p[0] - 470) * q, y = 340 + (p[1] - 340) * q;
          main(c, x, y, 1.5, q >= 1 ? Math.min(1, (dans - 650) / 150) : 0);
        }
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  // Ce qui se trouve sous le doigt : un siège de son wagon, un rival (piège), un wagon.
  function sousLeDoigt(px, py) {
    const e = vue, moi = moiSiege();
    if (!e || !geo || moi < 0 || e.st[moi] !== 0) return null;
    let w = -1;
    for (let k = 0; k < e.W; k++) { const y = wagonY(geo, k); if (py >= y - geo.gap / 2 && py <= y + geo.wh + geo.gap / 2) { w = k; break; } }
    if (w < 0 || px < geo.x - geo.quai || px > geo.x + geo.wl + geo.quai) return null;
    if (w === e.pos[moi]) {
      if (e.pg[moi] > 0) {
        for (let q = 0; q < PLACES; q++) {
          const f = figures['p' + q];
          if (f && q !== moi && O.valide(e, moi, { t: 'g', p: q }) && Math.hypot(px - f.x, py - f.y) < Math.max(24, geo.wh * 0.32)) return { k: 'jeton', p: q };
        }
      }
      const y = wagonY(geo, w), lig = py < y + geo.wh / 2 ? 0 : 1;
      if (px < geo.x + geo.pad * 1.5 + geo.sw) return { k: 'siege', w: w, s: lig };
      if (px > geo.x + geo.wl - geo.pad * 1.5 - geo.sw) return { k: 'siege', w: w, s: 2 + lig };
      return null;
    }
    return { k: 'wagon', w: w };
  }

  function actionPour(cib) {
    const e = vue, moi = moiSiege();
    if (!cib || !e) return null;
    if (cib.k === 'siege') return { t: 'f', s: cib.s };
    if (cib.k === 'jeton') return { t: 'g', p: cib.p };
    if (cib.k === 'wagon') { const d = cib.w - e.pos[moi]; return Math.abs(d) === 1 ? { t: 'm', d: d } : null; }
    return null;
  }

  function jouerAction(a) {
    if (!partie || enPause || attenteTuto || !a) return false;
    const e = vue, moi = moiSiege();
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu' && e && moi >= 0 && e.st[moi] === 0) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return false;
    }
    if (a.t === 'm' && e && !O.valide(e, moi, a)) {
      const w2 = e.pos[moi] + a.d;
      if (w2 >= 0 && w2 < e.W && e.portes[Math.min(e.pos[moi], w2)]) { toast(tr('msg.verrouillee'), 2000, 'danger'); sons.verrou(); }
      else sons.non();
      return false;
    }
    // Entrer dans le wagon du Contrôleur (quand on le voit) : un second geste confirme.
    if (a.t === 'm' && e) {
      const w2 = e.pos[moi] + a.d;
      if (e.ct.some((x) => x === w2 && voitControleur(e, moi, x))) {
        if (!(avertissement && avertissement.w === w2 && Date.now() - avertissement.quand < 4000)) {
          avertissement = { w: w2, quand: Date.now() };
          toast(tr(e.tk[moi] > 0 && e.pg[moi] === 0 ? 'msg.avertiTicket' : 'msg.averti'), 3000, 'danger');
          sons.coeur();
          return false;
        }
      }
    }
    avertissement = null;
    if (a.t === 'c' && e && !O.valide(e, moi, a)) { toast(tr(e.ca[moi] ? 'msg.pasDeuxFois' : 'msg.cachettePrise'), 2000); sons.non(); return false; }
    if (a.t === 'd' && e && !O.valide(e, moi, a)) {
      let cle = 'msg.pasDeTicket';
      if (!e.gare) cle = 'msg.pasEnGare';
      else if (!e.quai[e.pos[moi]]) cle = 'msg.porteFermee';
      else if (e.pg[moi] > 0) cle = 'msg.piegeBloque';
      toast(tr(cle), 2200); sons.non(); return false;
    }
    if (partie.jouer(a)) { survol = null; modeGlisser = false; sons.clic(); majActions(); majInfos(); return true; }
    sons.non();
    return false;
  }

  function boutonAction(nom) {
    if (nom === 'avant') jouerAction({ t: 'm', d: -1 });
    else if (nom === 'arriere') jouerAction({ t: 'm', d: 1 });
    else if (nom === 'cacher') jouerAction({ t: 'c' });
    else if (nom === 'attendre') jouerAction({ t: 'a' });
    else if (nom === 'descendre') jouerAction({ t: 'd' });
    else if (nom === 'glisser') {
      const l = rivauxGlisser();
      if (!l.length) { toast(tr('msg.personneIci'), 2000); sons.non(); return; }
      if (l.length === 1) { jouerAction({ t: 'g', p: l[0] }); return; }
      sons.clic(); modeGlisser = true; majActions(); majInfos();
    }
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    survol = sousLeDoigt(p[0], p[1]);
  });
  plateau.addEventListener('pointermove', (ev) => {
    if (ev.pointerType === 'mouse' || ev.buttons) { const p = point(ev); survol = sousLeDoigt(p[0], p[1]); }
  });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    const cib = sousLeDoigt(p[0], p[1]);
    if (ev.pointerType !== 'mouse') survol = null;
    const a = actionPour(cib);
    if (a) jouerAction(a);
  });
  plateau.addEventListener('pointercancel', () => { survol = null; });
  plateau.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = null; });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (modeGlisser && ev.code === 'Escape') { modeGlisser = false; majActions(); majInfos(); return; }
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    audio();
    const cl = ciblesClavier();
    if (ev.code === 'ArrowUp') { ev.preventDefault(); jouerAction({ t: 'm', d: -1 }); return; }
    if (ev.code === 'ArrowDown') { ev.preventDefault(); jouerAction({ t: 'm', d: 1 }); return; }
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault();
      if (!cl.length) return;
      if (!clavier || curseur < 0) { clavier = true; curseur = 0; }
      else curseur = (curseur + (ev.code === 'ArrowRight' ? 1 : cl.length - 1)) % cl.length;
      sons.clic();
      return;
    }
    const chiffre = /^(?:Digit|Numpad)([1-4])$/.exec(ev.code);
    if (chiffre) { ev.preventDefault(); jouerAction({ t: 'f', s: +chiffre[1] - 1 }); return; }
    if (ev.code === 'KeyC') { ev.preventDefault(); jouerAction({ t: 'c' }); return; }
    if (ev.code === 'KeyG') { ev.preventDefault(); boutonAction('glisser'); return; }
    if (ev.code === 'KeyD') { ev.preventDefault(); jouerAction({ t: 'd' }); return; }
    if (ev.code === 'Space') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; ev.preventDefault(); jouerAction({ t: 'a' }); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault();
      if (!clavier || curseur < 0 || !cl.length) { clavier = true; curseur = 0; return; }
      jouerAction(actionPour(cl[curseur % cl.length]));
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    const moi = moiSiege();
    if (enPartie && session === 'solo') sauver(niveau, vue && moi >= 0 ? vue.pts[moi] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  construireActions();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
