<script>
(function () {
  'use strict';

  // =====================================================================
  //  Le Dernier Métro de 3 h 33 — aventure et stratégie au tour par tour
  //  Chaque passager trouve un ticket et descend avant que le Contrôleur
  //  sans visage ne l'attrape. Solo : 20 niveaux contre 4 robots. En ligne :
  //  de vrais joueurs remplacent les robots (moteur commun JEL_MULTI).
  //  Les règles (et les niveaux) sont dans le bloc jel-regles.
  // =====================================================================

  const JEU = 'le-dernier-metro-de-3-h-33';
  const R = window.JEL_REGLES;
  const O = R.outils;
  const NIVEAUX = R.niveaux;
  window.JEL_NIVEAUX = NIVEAUX.length;
  const PLACES = R.places;
  const KB = O.K;
  const I18N = window.JEL_I18N;
  const tr = (cle, vars) => I18N.t(cle, vars);
  const nb = (x) => I18N.nombre(x);
  const $ = (id) => document.getElementById(id);

  // Une couleur et un passager par place.
  const COUL = ['#ff8a5c', '#5cc8ff', '#c38bff', '#7be08a', '#ffd84d'];
  const PEAU = ['#f0c9a8', '#8a5a3c', '#d9a77f', '#c48a62', '#f5d6c0'];
  const LANTERNES = [
    { c: '#ffbf5a', min: 0 }, { c: '#8fd6ff', min: 8 }, { c: '#9cf08a', min: 18 },
    { c: '#ff6a5a', min: 30 }, { c: '#c99bff', min: 42 }, { c: '#f4f4ff', min: 54 }
  ];
  const NB_STATIONS = 12, NB_OUBLIES = 6;

  const ICONE_ROBOT = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="7.2" y="0.5" width="1.6" height="3" fill="currentColor"/><circle cx="8" cy="1.2" r="1.3" fill="currentColor"/><rect x="2" y="3.5" width="12" height="10" rx="3" fill="currentColor"/><circle cx="5.6" cy="8" r="1.6" fill="#12121e"/><circle cx="10.4" cy="8" r="1.6" fill="#12121e"/><rect x="5" y="11" width="6" height="1.2" rx=".6" fill="#12121e"/></svg>';
  const ICONE_JOUEUR = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="4.5" r="3.5" fill="currentColor"/><path d="M1.5 16c0-4.4 2.9-7 6.5-7s6.5 2.6 6.5 7z" fill="currentColor"/></svg>';
  const ICONE_TOI = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .8l2.2 4.6 5 .6-3.7 3.4 1 5-4.5-2.5-4.5 2.5 1-5L.8 6l5-.6z" fill="currentColor"/></svg>';
  const SVG_TICKET = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 4h14v2.5a1.5 1.5 0 0 0 0 3V12H1V9.5a1.5 1.5 0 0 0 0-3z" fill="#e8d28a"/><circle cx="5" cy="8" r="1.3" fill="#6b5320"/></svg>';
  const SVG_PIEGE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 4h14v2.5a1.5 1.5 0 0 0 0 3V12H1V9.5a1.5 1.5 0 0 0 0-3z" fill="#e2384a"/><circle cx="6" cy="8" r="1.2" fill="#fff"/><circle cx="10" cy="8" r="1.2" fill="#fff"/></svg>';
  const SVG_LAMPE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="1" width="6" height="2" rx="1" fill="#999"/><rect x="4" y="3" width="8" height="10" rx="2" fill="#ffd27a"/><rect x="5" y="13" width="6" height="2" rx="1" fill="#999"/></svg>';
  const SVG_CLE = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="5" cy="8" r="3.6" fill="none" stroke="#d9d0a0" stroke-width="2"/><path d="M8.5 8H15M13 8v3M11 8v2" stroke="#d9d0a0" stroke-width="2"/></svg>';

  // ---------------------------------------------------------------------
  //  Progression (module commun save.js)
  // ---------------------------------------------------------------------

  const prog = { etoiles: NIVEAUX.map(() => 0), records: NIVEAUX.map(() => 0), debloque: 1, tutos: [], lanterne: 0, options: { son: true } };
  const entier = (v, min, max, def) => (Number.isInteger(v) ? Math.max(min, Math.min(max, v)) : def);
  const TUTOS_CONNUS = ['base', 'controleur', 'noir', 'portes', 'reflets', 'piege', 'double', 'presse'];

  function chargerProgression() {
    let d = null;
    try { d = window.JEL_SAVE.load(JEU); } catch (e) { d = null; }
    if (d && typeof d === 'object') {
      if (Array.isArray(d.etoiles)) prog.etoiles = NIVEAUX.map((_, i) => entier(d.etoiles[i], 0, 3, 0));
      if (Array.isArray(d.records)) prog.records = NIVEAUX.map((_, i) => entier(d.records[i], 0, 999, 0));
      prog.debloque = Math.max(1, entier(d.debloque, 1, NIVEAUX.length, 1), entier(d.niveau, 1, NIVEAUX.length, 1));
      if (Array.isArray(d.tutos)) prog.tutos = d.tutos.filter((x) => TUTOS_CONNUS.indexOf(x) >= 0);
      prog.lanterne = entier(d.lanterne, 0, LANTERNES.length - 1, 0);
      if (d.options && typeof d.options.son === 'boolean') prog.options.son = d.options.son;
    }
    try { const s = localStorage.getItem(JEU + '-son'); if (s === '0' || s === '1') prog.options.son = s === '1'; } catch (e) { /* stockage refusé */ }
    prog.etoiles.forEach((x, i) => { if (x > 0) prog.debloque = Math.max(prog.debloque, Math.min(NIVEAUX.length, i + 2)); });
    if (LANTERNES[prog.lanterne].min > totalEtoiles()) prog.lanterne = 0;
  }

  function remettreAZero() {
    prog.etoiles = NIVEAUX.map(() => 0);
    prog.records = NIVEAUX.map(() => 0);
    prog.debloque = 1;
    prog.tutos = [];
    prog.lanterne = 0;
    majLanterne();
  }

  function sauver(niveauReprise, score) {
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: niveauReprise, score: score, etoiles: prog.etoiles.slice(), records: prog.records.slice(),
        debloque: prog.debloque, tutos: prog.tutos.slice(), lanterne: prog.lanterne, options: { son: prog.options.son }
      });
    } catch (e) { /* sauvegarde impossible : le jeu continue */ }
  }

  // Son et lanterne se règlent aussi hors partie : on ne crée jamais de sauvegarde là.
  function sauverReglages() {
    try { localStorage.setItem(JEU + '-son', prog.options.son ? '1' : '0'); } catch (e) { /* stockage refusé */ }
    try { if (window.JEL_SAVE.existe(JEU)) window.JEL_SAVE.save(JEU, { lanterne: prog.lanterne, options: { son: prog.options.son } }); } catch (e) { /* rien */ }
  }

  const totalEtoiles = () => prog.etoiles.reduce((a, b) => a + b, 0);
  const lanternesOuvertes = () => LANTERNES.filter((l) => l.min <= totalEtoiles()).length;
  const couleurLanterne = () => LANTERNES[prog.lanterne].c;
  function majLanterne() { document.documentElement.style.setProperty('--lan', couleurLanterne()); }

  // ---------------------------------------------------------------------
  //  Sons (Web Audio, aucun fichier ; rien avant le premier geste)
  // ---------------------------------------------------------------------

  let ac = null;
  function audio() {
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) { ac = null; }
  }
  function note(f, d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(f, t);
      if (o.vers) osc.frequency.exponentialRampToValueAtTime(o.vers, t + d);
      const v = o.vol || 0.1;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + Math.min(0.03, d / 4));
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      let sortie = g;
      if (o.filtre) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filtre; g.connect(fl); sortie = fl; }
      osc.connect(g); sortie.connect(ac.destination);
      osc.start(t); osc.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  // Bruit blanc filtré (froissement, souffle des portes, roulement).
  function souffle(d, o) {
    o = o || {};
    if (!ac || !prog.options.son) return;
    try {
      const t = ac.currentTime + (o.retard || 0);
      const n = Math.floor(ac.sampleRate * d), buf = ac.createBuffer(1, n, ac.sampleRate), data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
      const src = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = buf; fl.type = o.type || 'lowpass'; fl.frequency.value = o.f || 800;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.08, t + d * 0.25); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(fl); fl.connect(g); g.connect(ac.destination);
      src.start(t); src.stop(t + d + 0.05);
    } catch (e) { /* son impossible */ }
  }
  const sons = {
    clic: () => note(620, 0.05, { type: 'triangle', vol: 0.06 }),
    pas: () => { note(90, 0.08, { type: 'triangle', vol: 0.12 }); note(80, 0.08, { type: 'triangle', vol: 0.1, retard: 0.16 }); },
    fouille: () => souffle(0.32, { f: 2400, type: 'bandpass', vol: 0.09 }),
    trouve: () => [880, 1320].forEach((f, i) => note(f, 0.22, { type: 'sine', vol: 0.07, retard: 0.12 + i * 0.09 })),
    ticket: () => { note(1500, 0.03, { type: 'square', vol: 0.06, retard: 0.12 }); note(300, 0.08, { type: 'square', vol: 0.06, filtre: 1200, retard: 0.15 }); },
    piege: () => [523, 554, 523, 494].forEach((f, i) => note(f, 0.18, { type: 'sawtooth', vol: 0.03, filtre: 1400, retard: 0.12 + i * 0.12 })),
    rien: () => note(200, 0.2, { type: 'triangle', vol: 0.05, vers: 150, retard: 0.12 }),
    cache: () => souffle(0.5, { f: 500, vol: 0.06 }),
    cle: () => [1800, 2200, 1600].forEach((f, i) => note(f, 0.05, { type: 'square', vol: 0.03, retard: i * 0.06 })),
    controleur: () => { note(55, 0.25, { type: 'sawtooth', vol: 0.09, filtre: 300 }); note(52, 0.25, { type: 'sawtooth', vol: 0.09, filtre: 300, retard: 0.32 }); },
    pris: () => { note(420, 0.7, { type: 'sawtooth', vol: 0.09, vers: 60, filtre: 1600 }); souffle(0.6, { f: 900, vol: 0.08 }); },
    station: () => [659, 622, 466].forEach((f, i) => note(f, 0.45, { type: 'sine', vol: 0.08, retard: i * 0.28 })),
    descend: () => { souffle(0.7, { f: 1200, vol: 0.09 }); note(523, 0.3, { vol: 0.07, retard: 0.3 }); note(784, 0.4, { vol: 0.07, retard: 0.45 }); },
    roule: () => souffle(0.9, { f: 160, vol: 0.12 }),
    victoire: () => [392, 523, 659, 784].forEach((f, i) => note(f, 0.32, { type: 'triangle', vol: 0.09, retard: i * 0.14 })),
    defaite: () => [330, 311, 277, 196].forEach((f, i) => note(f, 0.42, { type: 'sawtooth', vol: 0.05, filtre: 900, retard: i * 0.22 })),
    tic: () => note(1250, 0.04, { type: 'square', vol: 0.03 }),
    arrive: () => { note(660, 0.12, { vol: 0.07 }); note(880, 0.16, { vol: 0.07, retard: 0.1 }); },
    part: () => { note(880, 0.12, { vol: 0.06 }); note(587, 0.16, { vol: 0.06, retard: 0.1 }); },
    tour: () => note(988, 0.1, { vol: 0.05 }),
    non: () => note(160, 0.14, { type: 'triangle', vol: 0.06 })
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Dessins (canvas) : outils, passagers, Contrôleur, objets
  // ---------------------------------------------------------------------

  function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
  function rond(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(0, r), 0, Math.PI * 2); }
  function rr(c, x, y, w, h, r) {
    c.beginPath();
    if (c.roundRect) c.roundRect(x, y, w, h, r);
    else { c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
  }
  function graineHasard(g) { let a = g >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }

  // Passager de la place k, pieds en (x, y), hauteur h.
  // o : { cache (accroupi sous la banquette), ombre (silhouette noire), halo (couleur) }
  function passager(c, k, x, y, h, o) {
    o = o || {};
    c.save();
    c.translate(x, y);
    const u = h / 100;
    c.scale(u, u);
    if (o.halo) {
      const g = c.createRadialGradient(0, -55, 5, 0, -55, 70);
      g.addColorStop(0, o.halo + '66'); g.addColorStop(1, o.halo + '00');
      c.fillStyle = g; rond(c, 0, -55, 70); c.fill();
    }
    if (o.cache) { c.translate(0, 8); c.scale(1, 0.55); }
    const corps = o.ombre ? '#0b0b12' : COUL[k], peau = o.ombre ? '#15151f' : PEAU[k];
    // jambes
    c.fillStyle = o.ombre ? '#0b0b12' : '#2a2a38';
    rr(c, -14, -36, 11, 36, 4); c.fill(); rr(c, 3, -36, 11, 36, 4); c.fill();
    // manteau
    c.fillStyle = corps;
    c.beginPath(); c.moveTo(-20, -72); c.quadraticCurveTo(0, -80, 20, -72); c.lineTo(25, -30); c.quadraticCurveTo(0, -24, -25, -30); c.closePath(); c.fill();
    // tête
    c.fillStyle = peau; rond(c, 0, -86, 14); c.fill();
    if (!o.ombre) {
      c.fillStyle = '#16121c'; rond(c, -5, -87, 2.2); c.fill(); rond(c, 5, -87, 2.2); c.fill();
      // accessoire de chaque passager
      if (k === 0) { // la Veilleuse : coiffe blanche
        c.fillStyle = '#f2f2f6'; rr(c, -13, -104, 26, 9, 3); c.fill(); c.fillStyle = '#e2384a'; c.fillRect(-2, -103, 4, 7); c.fillRect(-4, -101, 8, 3);
      } else if (k === 1) { // le Musicien : casque audio
        c.strokeStyle = '#1b1b2a'; c.lineWidth = 4; c.beginPath(); c.arc(0, -88, 16, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
        c.fillStyle = '#1b1b2a'; rr(c, -19, -92, 7, 12, 3); c.fill(); rr(c, 12, -92, 7, 12, 3); c.fill();
      } else if (k === 2) { // la Livreuse : casquette et sac
        c.fillStyle = '#3a2a6a'; c.beginPath(); c.arc(0, -92, 14, Math.PI, 0); c.fill(); c.fillRect(0, -94, 20, 4);
        c.fillStyle = '#e8d28a'; rr(c, 14, -64, 16, 22, 4); c.fill();
      } else if (k === 3) { // le Gardien : casquette plate et écharpe
        c.fillStyle = '#4a3a2a'; ell(c, 0, -98, 17, 6); c.fill();
        c.fillStyle = '#d94a4a'; rr(c, -14, -74, 28, 7, 3); c.fill(); c.fillRect(6, -70, 6, 16);
      } else { // l'Insomniaque : capuche
        c.fillStyle = corps; c.beginPath(); c.arc(0, -88, 18, Math.PI * 0.85, Math.PI * 2.15); c.lineTo(14, -74); c.lineTo(-14, -74); c.closePath(); c.fill();
        c.fillStyle = peau; rond(c, 0, -85, 11); c.fill();
        c.fillStyle = '#16121c'; rond(c, -4, -86, 2); c.fill(); rond(c, 4, -86, 2); c.fill();
        c.strokeStyle = '#6a4a8a'; c.lineWidth = 1.6; c.beginPath(); c.arc(-4, -82, 3, 0.2, Math.PI - 0.2); c.stroke(); c.beginPath(); c.arc(4, -82, 3, 0.2, Math.PI - 0.2); c.stroke();
      }
    } else {
      c.fillStyle = '#ffe9a8'; rond(c, -5, -87, 1.6); c.fill(); rond(c, 5, -87, 1.6); c.fill();
    }
    c.restore();
  }

  // Le Contrôleur sans visage : long manteau, casquette, visage lisse.
  function controleur(c, x, y, h, o) {
    o = o || {};
    c.save();
    c.translate(x, y);
    const u = h / 100;
    c.scale(u, u);
    c.globalAlpha *= o.alpha === undefined ? 1 : o.alpha;

    c.fillStyle = 'rgba(0,0,0,.45)'; ell(c, 0, -2, 26, 5); c.fill();
    // manteau
    const g = c.createLinearGradient(0, -90, 0, 0);
    g.addColorStop(0, '#1a1a24'); g.addColorStop(1, '#05050a');
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-15, -80); c.quadraticCurveTo(0, -86, 15, -80); c.lineTo(24, -2); c.lineTo(-24, -2); c.closePath(); c.fill();
    // boutons dorés
    c.fillStyle = '#9a7a2a'; for (let i = 0; i < 4; i++) { rond(c, 0, -70 + i * 15, 2); c.fill(); }
    // bras trop longs
    c.strokeStyle = '#0b0b12'; c.lineWidth = 7; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-14, -74); c.quadraticCurveTo(-26, -46, -22, -16); c.stroke();
    c.beginPath(); c.moveTo(14, -74); c.quadraticCurveTo(26, -46, 22, -16); c.stroke();
    // poinçonneuse
    c.fillStyle = '#6a6a7a'; rr(c, 17, -20, 12, 8, 2); c.fill();
    // visage lisse
    c.fillStyle = o.fantome ? '#cfd8ff' : '#d8d4c8'; ell(c, 0, -92, 10, 13); c.fill();
    c.fillStyle = 'rgba(0,0,0,.18)'; ell(c, 0, -86, 7, 4); c.fill();
    // casquette à visière
    c.fillStyle = '#12121a'; rr(c, -13, -110, 26, 10, 3); c.fill();
    c.fillStyle = '#05050a'; ell(c, 0, -100, 15, 3.4); c.fill();
    c.fillStyle = '#9a7a2a'; rr(c, -4, -108, 8, 5, 1.5); c.fill();
    c.restore();
  }

  // Objet trouvé (sans aucun texte), centré en (x, y), taille r.
  function objet(c, code, x, y, r) {
    c.save(); c.translate(x, y); c.scale(r / 20, r / 20);
    if (code === 'T' || code === 'P') {
      c.fillStyle = code === 'T' ? '#e8d28a' : '#e2384a';
      c.beginPath(); c.moveTo(-18, -10); c.lineTo(18, -10); c.lineTo(18, -4); c.arc(18, 0, 4, -Math.PI / 2, Math.PI / 2, true); c.lineTo(18, 10); c.lineTo(-18, 10); c.lineTo(-18, 4); c.arc(-18, 0, 4, Math.PI / 2, -Math.PI / 2, true); c.closePath(); c.fill();
      c.fillStyle = code === 'T' ? '#6b5320' : '#fff';
      if (code === 'T') { rond(c, -6, 0, 3.2); c.fill(); c.fillRect(2, -4, 10, 2); c.fillRect(2, 2, 7, 2); }
      else { rond(c, -5, -1, 2.6); c.fill(); rond(c, 5, -1, 2.6); c.fill(); c.fillRect(-5, 5, 10, 1.6); }
    } else if (code === 'L') {
      c.fillStyle = '#888'; rr(c, -7, -18, 14, 4, 2); c.fill(); rr(c, -7, 14, 14, 4, 2); c.fill();
      c.fillStyle = '#ffd27a'; rr(c, -9, -14, 18, 28, 5); c.fill();
      c.fillStyle = '#fff6d6'; rond(c, 0, 0, 5); c.fill();
    } else if (code === 'K') {
      c.strokeStyle = '#d9d0a0'; c.lineWidth = 4;
      rond(c, -8, 0, 7); c.stroke();
      c.beginPath(); c.moveTo(-1, 0); c.lineTo(18, 0); c.moveTo(14, 0); c.lineTo(14, 7); c.moveTo(9, 0); c.lineTo(9, 5); c.stroke();
    } else if (code === 'O') {

      c.fillStyle = '#c9a24a'; rond(c, 0, 2, 15); c.fill();
      c.fillStyle = '#f4eedc'; rond(c, 0, 2, 11.5); c.fill();
      c.fillStyle = '#c9a24a'; rr(c, -3, -17, 6, 5, 2); c.fill();
      c.strokeStyle = '#2a2a38'; c.lineWidth = 2; c.beginPath(); c.moveTo(0, 2); c.lineTo(3, -5); c.moveTo(0, 2); c.lineTo(0, 11); c.stroke();
    } else {

      c.fillStyle = '#8a8476'; for (let i = 0; i < 4; i++) c.fillRect(-12, -6 + i * 5, i === 0 ? 10 : 24, 2); c.restore();
    }
    c.restore();
  }

  function couronne(c, x, y, w) {
    c.save(); c.translate(x, y); c.scale(w / 26, w / 26);
    c.fillStyle = '#ffd84d'; c.strokeStyle = '#a06a00'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-12, 8); c.lineTo(-13, -6); c.lineTo(-6, 1); c.lineTo(0, -9); c.lineTo(6, 1); c.lineTo(13, -6); c.lineTo(12, 8); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // Médaillon d'une place : passager sur un disque à sa couleur.
  function medaillon(c, k, x, y, r) {
    c.save();
    c.fillStyle = '#12121e'; rond(c, x, y, r); c.fill();
    c.strokeStyle = COUL[k]; c.lineWidth = Math.max(2, r * 0.12); rond(c, x, y, r * 0.92); c.stroke();
    rond(c, x, y, r * 0.86); c.clip();

    c.restore();
  }

  function lanterneDessin(c, x, y, h, coul, eteinte) {
    c.save(); c.translate(x, y); c.scale(h / 100, h / 100);
    if (!eteinte) {
      const g = c.createRadialGradient(0, 0, 4, 0, 0, 55);
      g.addColorStop(0, coul + 'aa'); g.addColorStop(1, coul + '00');

    c.strokeStyle = '#6a6a7a'; c.lineWidth = 4; c.beginPath(); c.arc(0, -42, 9, Math.PI, 0); c.stroke();
    c.fillStyle = '#3a3a48'; rr(c, -20, -36, 40, 8, 3); c.fill(); rr(c, -22, 30, 44, 9, 3); c.fill();
    c.fillStyle = eteinte ? '#22222e' : coul; rr(c, -16, -28, 32, 58, 6); c.fill();
    c.strokeStyle = '#3a3a48'; c.lineWidth = 3; c.beginPath(); c.moveTo(0, -28); c.lineTo(0, 30); c.moveTo(-16, 0); c.lineTo(16, 0); c.stroke();
    if (!eteinte) { c.fillStyle = '#ffffffcc'; ell(c, 0, 4, 5, 9); c.fill(); }
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  La rame : géométrie et dessin (jeu et tutoriels)
  // ---------------------------------------------------------------------

  function geometrie(e, w, h) {
    const W = e.W;
    const gap = Math.max(10, Math.min(18, h * 0.025));
    const wh = Math.max(40, Math.min(118, (h - 12 - gap * (W - 1)) / W));
    const ww = Math.min(w - 20, 540, wh * 7.5);
    const total = W * wh + (W - 1) * gap;
    const x0 = (w - ww) / 2, y0 = Math.max(6, (h - total) / 2);
    const ys = [];
    for (let i = 0; i < W; i++) ys.push(y0 + i * (wh + gap));
    return { x0: x0, ww: ww, wh: wh, gap: gap, ys: ys, w: w, h: h };
  }
  const siegeX = (g, j) => g.x0 + g.ww * (0.2 + 0.3 * j);
  const SLOTS = [0.1, 0.9, 0.36, 0.64, 0.23, 0.77];

  // Position voulue de chaque passager et de chaque Contrôleur.
  function positions(e, g) {
    const pp = [], cc = [];
    const parWagon = {};
    for (let s = 0; s < e.p.length; s++) {
      const q = e.p[s];
      if (q.d !== 0) { pp.push(null); continue; }
      const k = parWagon[q.w] || 0;
      parWagon[q.w] = k + 1;
      pp.push({ x: g.x0 + g.ww * SLOTS[k % SLOTS.length], y: g.ys[q.w] + g.wh * 0.93 });
    }
    for (let i = 0; i < e.C.length; i++) {
      if (e.C[i] < 0) { cc.push(null); continue; }
      const deux = e.C.length > 1 && e.C[0] === e.C[1];
      cc.push({ x: g.x0 + g.ww * (0.5 + (deux ? (i ? 0.1 : -0.1) : 0)), y: g.ys[e.C[i]] + g.wh * 0.95 });
    }
    return { p: pp, c: cc };
  }

  // Dessin de la rame. o : { t, moi, aff (positions affichées), choix (sièges
  // cliquables), cible (wagons où aller), curseur, reflet, glisser, lanterne }
  function dessinerRame(c, e, g, o) {
    const t = o.t || 0, W = e.W;
    // tunnel derrière la rame : traits de lumière qui défilent
    c.fillStyle = '#05050a'; c.fillRect(0, 0, g.w, g.h);
    const vit = o.fige ? 0 : 0.6;
    for (let k = 0; k < 14; k++) {
      const yy = ((k * 97 + t * vit) % (g.h + 80)) - 40;
      c.fillStyle = k % 3 ? 'rgba(90,90,140,.10)' : 'rgba(255,190,90,.10)';
      c.fillRect(k % 2 ? 4 : g.w - 8, yy, 4, 40);
    }
    const moi = o.moi;
    const qm = moi >= 0 && e.p[moi] ? e.p[moi] : null;
    // portes entre les wagons
    for (let i = 0; i < W - 1; i++) {
      const y1 = g.ys[i] + g.wh, y2 = g.ys[i + 1];
      const cx = g.x0 + g.ww / 2;
      c.fillStyle = '#2a2a38'; c.fillRect(cx - 18, y1 - 2, 36, y2 - y1 + 4);
      c.fillStyle = '#14141e'; c.fillRect(cx - 12, y1, 24, y2 - y1);
      if (O.porteFermee(e, i, i + 1)) {
        const py = (y1 + y2) / 2;
        c.strokeStyle = '#e2384a'; c.lineWidth = 2.5; c.beginPath(); c.arc(cx, py - 3, 5, Math.PI, 0); c.stroke();
        c.fillStyle = '#e2384a'; rr(c, cx - 7, py - 3, 14, 10, 2); c.fill();
        c.fillStyle = '#2a0d12'; rond(c, cx, py + 2, 1.6); c.fill();
      }
    }
    for (let w = 0; w < W; w++) {
      const y = g.ys[w], x = g.x0, ww = g.ww, wh = g.wh;
      // caisse du wagon
      const grad = c.createLinearGradient(0, y, 0, y + wh);
      grad.addColorStop(0, '#3a3d52'); grad.addColorStop(1, '#22232f');
      c.fillStyle = grad; rr(c, x, y, ww, wh, Math.min(14, wh * 0.18)); c.fill();
      // fenêtres
      const fy = y + wh * 0.1, fh = wh * 0.34;
      for (let j = 0; j < 4; j++) {
        const fx = x + ww * (0.06 + j * 0.235), fw = ww * 0.2;
        if (e.quai) {
          c.fillStyle = '#a9c9b3'; rr(c, fx, fy, fw, fh, 4); c.fill();
          c.fillStyle = '#8fb39a'; for (let a = 0; a < 3; a++) c.fillRect(fx + 2, fy + fh * (0.3 + a * 0.25), fw - 4, 1);
        } else {
          c.fillStyle = e.vitre[w] ? '#3a4a6a' : '#0a0a12'; rr(c, fx, fy, fw, fh, 4); c.fill();
          if (e.vitre[w]) {
            c.fillStyle = 'rgba(220,235,255,.25)';
            c.beginPath(); const dx = ((t * 0.05 + j * 20) % (fw + 20)) - 20; c.moveTo(fx + dx, fy + fh); c.lineTo(fx + dx + 8, fy); c.lineTo(fx + dx + 14, fy); c.lineTo(fx + dx + 6, fy + fh); c.closePath(); c.fill();
          } else {
            const lx = fx + ((t * 0.25 + j * 37 + w * 53) % (fw + 30)) - 15;
            c.fillStyle = 'rgba(255,200,120,.35)'; c.fillRect(Math.max(fx, lx), fy + fh * 0.45, 6, 2);
          }
        }
      }
      // plafonnier
      if (!e.noir[w]) { c.fillStyle = '#ffe8b0'; c.fillRect(x + ww * 0.3, y + 3, ww * 0.4, 2.5); }
      // plancher
      c.fillStyle = '#18181f'; c.fillRect(x + 4, y + wh * 0.88, ww - 8, wh * 0.08);
      // banquettes
      for (let j = 0; j < KB; j++) {
        const sx = siegeX(g, j), sw = ww * 0.2, sh = wh * 0.24, sy = y + wh * 0.62;
        const code = e.s[w * KB + j];
        if (code === '') {
          c.fillStyle = '#4a2a30'; rr(c, sx - sw / 2, sy + sh * 0.35, sw, sh * 0.65, 3); c.fill();
          c.fillStyle = '#1a1015'; rr(c, sx - sw / 2 + 3, sy + sh * 0.45, sw - 6, sh * 0.4, 2); c.fill();
          c.fillStyle = '#8a3a44'; c.save(); c.translate(sx + sw * 0.32, sy + sh * 0.2); c.rotate(-0.5); rr(c, -sw * 0.3, -sh * 0.12, sw * 0.6, sh * 0.24, 3); c.fill(); c.restore();
        } else {
          c.fillStyle = '#8a2a36'; rr(c, sx - sw / 2, sy, sw, sh, 4); c.fill();
          c.fillStyle = '#a8323e'; rr(c, sx - sw / 2 + 2, sy + 2, sw - 4, sh * 0.45, 3); c.fill();
          c.fillStyle = '#3a1015'; c.fillRect(sx - sw / 2 + 4, sy + sh * 0.72, sw - 8, 2);
        }
        c.fillStyle = '#555'; c.fillRect(sx - sw / 2 + 3, sy + sh, 3, wh * 0.88 - (sy - y) - sh); c.fillRect(sx + sw / 2 - 6, sy + sh, 3, wh * 0.88 - (sy - y) - sh);
        // banquette qu'on peut fouiller
        if (o.choix && o.choix.indexOf(w * KB + j) >= 0) {
          const p = 0.5 + 0.5 * Math.sin(t / 220);
          c.strokeStyle = `rgba(255,191,90,${0.55 + 0.45 * p})`; c.lineWidth = o.curseur === w * KB + j ? 4 : 2.5;
          rr(c, sx - sw / 2 - 4, sy - 4, sw + 8, sh + 8, 6); c.stroke();
          if (o.curseur === w * KB + j) { c.strokeStyle = '#fff'; c.lineWidth = 1.5; rr(c, sx - sw / 2 - 7, sy - 7, sw + 14, sh + 14, 8); c.stroke(); }
        }
      }
    }
    // passagers et Contrôleurs (positions affichées, qui glissent)
    const aff = o.aff;
    for (let s = 0; s < e.p.length; s++) {
      const q = e.p[s], a = aff.p[s];
      if (!a || a.alpha <= 0.01) continue;
      const sombre = e.noir[q.w] && !(qm && qm.l && qm.w === q.w && qm.d === 0);
      c.save(); c.globalAlpha = a.alpha;
      passager(c, s, a.x, a.y, g.wh * 0.64, { cache: q.c, ombre: sombre, halo: s === moi ? o.lanterne : null });
      // ondes de bruit
      const bruit = Math.min(4, q.b + 2 * q.x);
      if (bruit > 0 && !q.c) {
        c.strokeStyle = q.x ? 'rgba(226,56,74,.85)' : 'rgba(235,230,242,.7)'; c.lineWidth = 1.6;
        for (let k = 0; k < bruit; k++) {
          const rr2 = g.wh * (0.1 + k * 0.07) + (t / 90 % 1) * 2;
          c.beginPath(); c.arc(a.x + g.wh * 0.1, a.y - g.wh * 0.55, rr2, -0.7, 0.7); c.stroke();
        }
      }
      // cible du glissement
      if (o.glisser && o.glisser.indexOf(s) >= 0) {
        c.strokeStyle = '#e2384a'; c.lineWidth = 3; rond(c, a.x, a.y - g.wh * 0.34, g.wh * 0.36 + Math.sin(t / 160) * 2); c.stroke();
      }
      c.restore();
    }
    // reflets : le Contrôleur là où il sera après ce tour
    if (o.reflet) {
      const pr = o.reflet;
      for (let i = 0; i < pr.C.length; i++) {
        if (pr.C[i] < 0) continue;
        const gx = g.x0 + g.ww * (0.5 + (i ? 0.12 : -0.04)), gy = g.ys[pr.C[i]] + g.wh * 0.95;
        c.save(); c.globalAlpha = 0.28 + 0.12 * Math.sin(t / 200);
        controleur(c, gx, gy, g.wh * 0.86, { fantome: true });
        c.restore();
        const cb = pr.cibles[i];
        if (cb >= 0 && aff.p[cb]) {
          c.strokeStyle = 'rgba(160,190,255,.8)'; c.setLineDash([4, 4]); c.lineWidth = 2;
          rond(c, aff.p[cb].x, aff.p[cb].y - g.wh * 0.34, g.wh * 0.38); c.stroke(); c.setLineDash([]);
        }
      }
    }
    for (let i = 0; i < e.C.length; i++) {
      const a = aff.c[i];
      if (!a) continue;
      const sombre = e.noir[e.C[i]] && !(qm && qm.l && qm.w === e.C[i]);
      if (sombre) {
        // dans le noir, on ne voit que ses boutons qui luisent
        c.fillStyle = 'rgba(200,170,80,.6)';
        for (let k = 0; k < 3; k++) { rond(c, a.x, a.y - g.wh * (0.56 - k * 0.12), 1.6); c.fill(); }
      } else controleur(c, a.x, a.y, g.wh * 0.86, { alpha: a.alpha });
    }
    // voile des wagons noirs, avec le cône de la lampe
    for (let w = 0; w < W; w++) {
      if (!e.noir[w]) continue;
      const y = g.ys[w];
      c.save(); rr(c, g.x0, y, g.ww, g.wh, Math.min(14, g.wh * 0.18)); c.clip();
      const ici = qm && qm.d === 0 && qm.w === w && qm.l && aff.p[moi];
      if (ici) {
        const a = aff.p[moi];
        const gr = c.createRadialGradient(a.x, a.y - g.wh * 0.4, g.wh * 0.2, a.x, a.y - g.wh * 0.4, g.ww * 0.7);
        gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.6, 'rgba(0,0,0,.35)'); gr.addColorStop(1, 'rgba(0,0,0,.8)');
        c.fillStyle = gr; c.fillRect(g.x0, y, g.ww, g.wh);
        c.fillStyle = (o.lanterne || '#ffbf5a') + '22'; c.fillRect(g.x0, y, g.ww, g.wh);
      } else { c.fillStyle = 'rgba(0,0,0,.78)'; c.fillRect(g.x0, y, g.ww, g.wh); }
      c.restore();
    }
    // wagons où l'on peut aller
    if (o.cible) {
      o.cible.forEach((w) => {
        const y = g.ys[w], p = 0.5 + 0.5 * Math.sin(t / 240);
        c.strokeStyle = `rgba(255,191,90,${0.35 + 0.5 * p})`; c.lineWidth = o.curseurWagon === w ? 4 : 2.5; c.setLineDash([8, 6]);
        rr(c, g.x0 - 3, y - 3, g.ww + 6, g.wh + 6, 14); c.stroke(); c.setLineDash([]);
        // chevron vers le wagon
        const cx = g.x0 + g.ww / 2, haut = qm && w < qm.w;
        const cy = haut ? y + g.wh + g.gap / 2 : y - g.gap / 2;
        c.fillStyle = '#ffbf5a'; c.beginPath();
        if (haut) { c.moveTo(cx - 9, cy + 5); c.lineTo(cx, cy - 5); c.lineTo(cx + 9, cy + 5); }
        else { c.moveTo(cx - 9, cy - 5); c.lineTo(cx, cy + 5); c.lineTo(cx + 9, cy - 5); }
        c.closePath(); c.fill();
      });
    }
    // contour de son propre wagon
    if (qm && qm.d === 0) {
      c.strokeStyle = (o.lanterne || '#ffbf5a') + 'aa'; c.lineWidth = 2;
      rr(c, g.x0 - 1, g.ys[qm.w] - 1, g.ww + 2, g.wh + 2, 14); c.stroke();
    }
    // quai : bande éclairée le long de la rame
    if (e.quai) {
      const gq = c.createLinearGradient(0, 0, 14, 0);
      gq.addColorStop(0, 'rgba(156,240,176,.5)'); gq.addColorStop(1, 'rgba(156,240,176,0)');
      c.fillStyle = gq; c.fillRect(0, 0, 14, g.h);
      c.save(); c.translate(g.w, 0); c.scale(-1, 1); c.fillStyle = gq; c.fillRect(0, 0, 14, g.h); c.restore();
    }
  }

  // ---------------------------------------------------------------------
  //  Écran titre (sert aussi de jaquette : aucun texte dessiné)
  // ---------------------------------------------------------------------

  let titreAnim = 0;
  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    const fx = w / 2, fy = h * 0.5;
    // fond du tunnel
    const g = c.createRadialGradient(fx, fy, 10, fx, fy, Math.max(w, h) * 0.8);
    g.addColorStop(0, '#2a2140'); g.addColorStop(0.35, '#120f1e'); g.addColorStop(1, '#030306');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // anneaux du tunnel
    c.strokeStyle = 'rgba(120,110,160,.16)'; c.lineWidth = 2;
    for (let k = 0; k < 9; k++) {
      const z = ((k + (t / 1800) % 1) / 9);
      const r = 30 + z * z * Math.max(w, h) * 1.1;
      c.beginPath(); c.ellipse(fx, fy, r, r * 0.86, 0, Math.PI * 1.02, Math.PI * 1.98); c.stroke();
    }
    // rails
    c.strokeStyle = 'rgba(160,150,190,.35)'; c.lineWidth = 3;
    [-1, 1].forEach((sg) => { c.beginPath(); c.moveTo(fx + sg * 14, fy + 70); c.lineTo(fx + sg * w * 0.42, h); c.stroke(); });
    c.strokeStyle = 'rgba(90,80,110,.4)'; c.lineWidth = 4;
    for (let k = 0; k < 8; k++) {
      const z = (k + 1) / 8, yy = fy + 70 + z * z * (h - fy - 70), dx = 18 + z * z * w * 0.42;
      c.beginPath(); c.moveTo(fx - dx * 1.1, yy); c.lineTo(fx + dx * 1.1, yy); c.stroke();
    }
    // la rame vue de face
    const s = Math.min(w * 0.62, h * 0.36, 330);
    const tx = fx - s / 2, ty = fy - s * 0.62;
    const halo = c.createRadialGradient(fx, fy, s * 0.2, fx, fy, s * 1.2);
    halo.addColorStop(0, 'rgba(255,180,90,.25)'); halo.addColorStop(1, 'rgba(255,180,90,0)');
    c.fillStyle = halo; c.fillRect(0, 0, w, h);
    const corps = c.createLinearGradient(0, ty, 0, ty + s);
    corps.addColorStop(0, '#4a4d66'); corps.addColorStop(1, '#1e1f2b');
    c.fillStyle = corps; rr(c, tx, ty, s, s * 1.02, s * 0.12); c.fill();
    c.strokeStyle = '#6a6d88'; c.lineWidth = 2; rr(c, tx, ty, s, s * 1.02, s * 0.12); c.stroke();
    // pare-brise
    const px = tx + s * 0.1, py = ty + s * 0.12, pw = s * 0.8, ph = s * 0.42;
    const vitre = c.createLinearGradient(0, py, 0, py + ph);
    vitre.addColorStop(0, '#ffcf7a'); vitre.addColorStop(1, '#a8602a');
    c.fillStyle = vitre; rr(c, px, py, pw, ph, s * 0.06); c.fill();
    // le Contrôleur derrière la vitre
    c.save(); rr(c, px, py, pw, ph, s * 0.06); c.clip();
    c.fillStyle = 'rgba(40,20,10,.35)'; c.fillRect(px, py + ph * 0.6, pw, ph * 0.4);
    controleur(c, px + pw * 0.5, py + ph * 1.35, ph * 1.25, {});
    c.restore();
    // reflet sur la vitre
    c.fillStyle = 'rgba(255,255,255,.12)'; c.beginPath(); c.moveTo(px + pw * 0.08, py + ph); c.lineTo(px + pw * 0.24, py); c.lineTo(px + pw * 0.34, py); c.lineTo(px + pw * 0.18, py + ph); c.closePath(); c.fill();
    // phares (ils clignotent un peu)
    const scint = 0.85 + 0.15 * Math.sin(t / 130) * Math.sin(t / 47);
    [0.22, 0.78].forEach((k) => {
      const hx = tx + s * k, hy = ty + s * 0.72;
      const ph2 = c.createRadialGradient(hx, hy, 2, hx, hy, s * 0.35);
      ph2.addColorStop(0, `rgba(255,240,200,${0.9 * scint})`); ph2.addColorStop(1, 'rgba(255,240,200,0)');
      c.fillStyle = ph2; rond(c, hx, hy, s * 0.35); c.fill();
      c.fillStyle = '#fff8e0'; rond(c, hx, hy, s * 0.06); c.fill();
    });
    // pare-chocs et attelage
    c.fillStyle = '#14151e'; rr(c, tx + s * 0.06, ty + s * 0.88, s * 0.88, s * 0.1, 6); c.fill();
    c.fillStyle = '#8a2a36'; c.fillRect(tx + s * 0.35, ty + s * 0.6, s * 0.3, s * 0.05);
    // horloge de quai : aiguilles sur 3 h 33 (aucun chiffre)
    const hxr = Math.min(w * 0.16, 64), hxx = w * 0.14 + hxr * 0.4, hyy = h * 0.3;
    c.strokeStyle = '#3a3a48'; c.lineWidth = 3; c.beginPath(); c.moveTo(hxx, 0); c.lineTo(hxx, hyy - hxr); c.stroke();
    c.fillStyle = '#e9e2cc'; rond(c, hxx, hyy, hxr); c.fill();
    c.strokeStyle = '#2a2a38'; c.lineWidth = 3; rond(c, hxx, hyy, hxr); c.stroke();
    for (let k = 0; k < 12; k++) {
      const a = k / 12 * Math.PI * 2;
      c.lineWidth = k % 3 ? 1.5 : 3;

  function texteMessage() {
    if (!partie) return '';

    const s = R.aQui(e);

  function majInfos() {
    let info = '';

    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e && partie && partie.phase === 'jeu') info += ' · ' + (e.quai ? tr('jeu.quai', { nom: nomStation(e, e.st) }) : tr('jeu.station', { n: e.st, total: e.S }));

  function nomStation(e, n) { return tr('station.' + ((e.ns + Math.max(0, n - 1)) % NB_STATIONS)); }

  // Boutons d'action : actifs seulement quand l'action est permise.

    const l = libre ? O.actions(e, moi) : [];

    majInfos();

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);

      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  État d'affichage
  // ---------------------------------------------------------------------

  let partie = null, session = null, vue = null, niveau = 1, enPartie = false, enPause = false;
  let geo = null, aff = { p: [], c: [] }, particules = [], debutTour = 0, dernierTic = -1, jeton = 0;
  let envoye = false, curseur = -1, curseurWagon = -1, clavier = false, humainsAvant = null;
  let secousse = 0, flash = null, vuReflet = false;
  let dernierAttends = 0;

  function choixSieges() {
    const e = vue, moi = partie ? partie.siege : -1;
    if (!e || !partie || moi < 0 || !partie.monTour() || e.fini || attenteTuto || envoye) return [];
    const q = e.p[moi];
    if (q.d !== 0) return [];
    const l = [];
    for (let j = 0; j < KB; j++) if (R.valide(e, moi, { t: 'f', i: j })) l.push(q.w * KB + j);
    return l;
  }
  function wagonsPossibles() {
    const e = vue, moi = partie ? partie.siege : -1;
    if (!e || !partie || moi < 0 || !partie.monTour() || e.fini || attenteTuto || envoye) return [];
    const q = e.p[moi], l = [];
    [-1, 1].forEach((d) => { if (R.valide(e, moi, { t: 'm', d: d })) l.push(q.w + d); });
    return l;
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; c.fillStyle = '#05050a'; c.fillRect(0, 0, w, h); return; }
    geo = geometrie(vue, w, h);
    // positions affichées : elles glissent vers les positions voulues
    const pv = positions(vue, geo);
    const k = Math.min(1, dt * 7);
    for (let s = 0; s < vue.p.length; s++) {
      const cible = pv.p[s];
      let a = aff.p[s];
      if (!cible) { if (a) { a.alpha = Math.max(0, a.alpha - dt * 1.5); a.y -= dt * 30; } continue; }
      if (!a || a.alpha <= 0.01) { aff.p[s] = { x: cible.x, y: cible.y, alpha: 1 }; continue; }
      a.x += (cible.x - a.x) * k; a.y += (cible.y - a.y) * k; a.alpha = Math.min(1, a.alpha + dt * 2);
    }
    for (let i = 0; i < vue.C.length; i++) {
      const cible = pv.c[i];
      if (!cible) { aff.c[i] = null; continue; }
      const a = aff.c[i];
      if (!a) { aff.c[i] = { x: cible.x, y: cible.y, alpha: 0 }; continue; }
      a.x += (cible.x - a.x) * k * 0.8; a.y += (cible.y - a.y) * k * 0.8; a.alpha = Math.min(1, a.alpha + dt * 1.5);
    }
    aff.c.length = vue.C.length;
    const moi = partie ? partie.siege : -1;
    const qm = moi >= 0 ? vue.p[moi] : null;
    // reflets : seulement depuis un wagon à vitres miroirs, pendant la partie
    let reflet = null;
    if (qm && qm.d === 0 && vue.vitre[qm.w] && !vue.fini && partie.phase === 'jeu') {
      reflet = O.prevoir(vue, moi);
      if (!vuReflet) { vuReflet = true; toast(tr('reflet.aide'), 2600); }
    }
    c.save();
    if (secousse > 0) { secousse = Math.max(0, secousse - dt); const a2 = secousse * 18; c.translate((Math.random() - 0.5) * a2, (Math.random() - 0.5) * a2); }
    const glisser = $('choix-glisser').classList.contains('actif') ? ciblesGlisser() : null;
    dessinerRame(c, vue, geo, {
      t: t, moi: moi, aff: aff, choix: choixSieges(), cible: wagonsPossibles(), curseur: clavier ? curseur : -1,
      curseurWagon: clavier ? curseurWagon : -1, reflet: reflet, glisser: glisser, lanterne: couleurLanterne()
    });
    // particules
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      if (p.code) objet(c, p.code, p.x, p.y, p.k);
      else { c.fillStyle = p.coul; rond(c, p.x, p.y, p.k); c.fill(); }
      c.globalAlpha = 1;
    }
    c.restore();
    if (flash) {
      const a = 1 - (t - flash.t0) / flash.d;
      if (a <= 0) flash = null;
      else { c.fillStyle = flash.coul; c.globalAlpha = a * flash.fort; c.fillRect(0, 0, w, h); c.globalAlpha = 1; }
    }
  }

  function centreSiege(x) {
    if (!geo) return [0, 0];
    const w = Math.floor(x / KB), j = x % KB;
    return [siegeX(geo, j), geo.ys[w] + geo.wh * 0.66];
  }
  function jaillirObjet(x, code) {
    const p = centreSiege(x);
    particules.push({ code: code, x: p[0], y: p[1], vx: 0, vy: -55, vie: 1.4, k: geo ? geo.wh * 0.2 : 14 });
    for (let k = 0; k < 10; k++) {
      const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 90;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, g: 160, vie: 0.6 + Math.random() * 0.4, k: 1.5 + Math.random() * 2, coul: code === 'P' ? '#e2384a' : '#ffd27a' });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      case 'refus': envoye = false; break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    envoye = false;
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(e) {
    vue = e ? JSON.parse(JSON.stringify(e)) : null;
    aff = { p: [], c: [] };
    particules.length = 0;
    vuReflet = false;
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    envoye = false;
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0, finManche = 0, resultatSalon = null, finEnAttente = false, lancement = false;
  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    fermerChoixGlisser();
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 96, 96);
        medaillon(c, s, 48, 52, 40);
        if (info.chef) couronne(c, 48, 14, 28);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { qui: tr('passager.' + s), role: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');

  function surManche() {
    jeton++;

  // Une action vient d'être jouée : animations, sons et messages.
  function surAction(ev) {
    const avant = vue;
    vue = JSON.parse(JSON.stringify(ev.apres));
    debutTour = Date.now();
    dernierTic = -1;
    envoye = false;
    const moi = partie.siege;
    const evs = vue.ev || [];
    let message = null, genre = '';
    evs.forEach((x) => {
      if (x.k === 'm') sons.pas();
      else if (x.k === 'cle') sons.cle();
      else if (x.k === 'f') {
        sons.fouille();
        jaillirObjet(x.x, x.o || 'J');
        if (x.o === 'T') { sons.ticket(); if (x.s === moi) { message = tr('objet.T'); genre = 'vert'; } else message = message || tr('evt.ticket', { qui: qui(x.s) }); }
        else if (x.o === 'P') { sons.piege(); if (x.s === moi) { message = tr('objet.P'); genre = 'rouge'; } }
        else if (x.o === 'J') { sons.rien(); if (x.s === moi) message = tr('objet.J'); }
        else {
          sons.trouve();
          if (x.s === moi) {
            const dbl = (x.o === 'L' && avant && avant.p[moi].l) || (x.o === 'K' && avant && avant.p[moi].k);
            message = x.o === 'O' ? tr('objet.O', { objet: tr('oublie.' + (x.x % NB_OUBLIES)) }) : tr(dbl ? 'objet.double' : 'objet.' + x.o);
            genre = 'vert';
          }
        }
        bondir(x.s);
      } else if (x.k === 'c') sons.cache();
      else if (x.k === 'g') {
        sons.piege();
        if (x.v === moi) { message = tr('evt.glisseToi', { qui: qui(x.s) }); genre = 'rouge'; }
        else if (x.s !== moi) message = tr('evt.glisse', { qui: qui(x.s), cible: qui(x.v) });
      } else if (x.k === 'ctrl') { sons.controleur(); }
      else if (x.k === 'arrivee') { sons.controleur(); message = tr('evt.arrivee'); genre = 'rouge'; secousse = 0.3; }
      else if (x.k === 'pris') {
        sons.pris();
        if (x.s === moi) { message = tr('evt.prisToi'); genre = 'rouge'; secousse = 0.6; flash = { coul: '#c4303a', t0: performance.now(), d: 700, fort: 0.55 }; }
        else { message = tr('evt.pris', { qui: qui(x.s) }); genre = 'rouge'; secousse = Math.max(secousse, 0.2); }
        if (aff.p[x.s]) aff.p[x.s].alpha = 0;
      } else if (x.k === 'emporte') {
        if (x.s === moi) { message = tr(x.terminus ? 'evt.emporteTerminus' : 'evt.emporteToi'); genre = 'rouge'; }
        else message = tr('evt.emporte', { qui: qui(x.s) });
      } else if (x.k === 'station') {
        sons.station();
        flash = { coul: '#e8f2ea', t0: performance.now(), d: 600, fort: 0.4 };
        if (!message) message = vue.st >= vue.S ? tr('evt.terminus') : tr('evt.station', { nom: nomStation(vue, x.n) });
      } else if (x.k === 'd') {
        sons.descend();
        if (x.s === moi) { message = tr('evt.descendToi', { n: vue.p[moi].d }); genre = 'vert'; }
        else message = tr('evt.descend', { qui: qui(x.s) });
        bondir(x.s);
      } else if (x.k === 'tour') sons.roule();
    });
    // prochain second Contrôleur : on prévient un tour avant
    if (vue.C.length > 1 && vue.C[1] < 0 && vue.tt + 1 >= vue.c2 && !vue.fini && evs.some((x) => x.k === 'tour')) { message = tr('evt.annonce2'); genre = 'rouge'; }
    if (ev.auto) message = tr(ev.moi ? 'multi.autoToi' : 'multi.auto');
    if (message) toast(message, 2200, genre);
    if (partie.phase === 'jeu' && !vue.fini && R.aQui(vue) === moi && !ev.moi) sons.tour();
    if (curseur >= 0 && choixSieges().indexOf(curseur) < 0) curseur = -1;
  }

    const carte = $('place-' + s);

  // Étoiles : 1 descendu avec un ticket ; 2 à la station objectif ou plus loin ; 3 sans avoir été attrapé.
  function etoilesPour(q, e) {
    if (!q || q.d <= 0) return 0;
    let n = 1;
    if (q.d >= e.obj) { n++; if (q.m === 0) n++; }
    return n;
  }

  function statutDe(q) {
    if (q.d > 0) return tr('fin.statut.descendu', { n: q.d });
    if (q.d < 0) return tr('fin.statut.emporte');
    return tr('fin.statut.bord');
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3, 4];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      const q = e.p[s];
      if (q.pts !== prec) { rang = k + 1; prec = q.pts; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28);
      const quiEl = document.createElement('span'); quiEl.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      const b = document.createElement('b'); b.textContent = tr('passager.' + s) + ' · ' + nomPlace(info, role);
      const sm = document.createElement('small'); sm.textContent = statutDe(q);
      quiEl.append(b, sm);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: q.pts });
      l.append(r, cv, quiEl, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const q = moi >= 0 ? e.p[moi] : null;
    const pts = q ? q.pts : 0;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = q ? tr('fin.points', { n: pts }) : '';
    $('fin-lanterne').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      const gagne = !!q && q.d > 0;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(q, e);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const ouvertesAvant = lanternesOuvertes();
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
        const ouvertes = lanternesOuvertes();
        if (ouvertes > ouvertesAvant) $('fin-lanterne').textContent = tr('lanterne.nouvelle', { nom: tr('lanterne.' + (ouvertes - 1)) });
      } else sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr('fin.gagne') : tr(q && q.d < 0 && q.m >= 3 ? 'fin.emporte' : 'fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-station').textContent = gagne ? tr('fin.station', { n: q.d, obj: e.obj }) : tr('fin.objectif', { n: e.obj });
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil.
      const res = R.fin(e);
      const gagne = moi >= 0 && !!res && res.classement[0] === moi;
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-station').textContent = q ? statutDe(q) : '';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
      if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    }
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (partie en ligne repassée en solo).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-debloque').textContent !== texte) $('fin-debloque').textContent = texte; }
    else bandeau(texte);
  }

  // Confettis de lumière à la victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 80; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 70, vy: 110 + Math.random() * 150, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 3 ? couleurLanterne() : COUL[i % 5], k: 5 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.globalAlpha = 0.85; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

    jeton++;

    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    envoye = false;
    vue = null;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);

    finEnAttente = false;

  // Parcours solo : niveau n contre 4 robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    envoye = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    fermerChoixGlisser();
    nouvelleVue(null);
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

      tt: 0, st: 0, quai: 0, tour: 0, dep: 0, jo: [], fini: 0, solo: 0, obj: 3, ns: 0, ev: []
    };
    for (let w = 0; w < W; w++) { e.noir.push((opts.noir || []).indexOf(w) >= 0 ? 1 : 0); e.vitre.push((opts.vitre || []).indexOf(w) >= 0 ? 1 : 0); }
    for (let w = 0; w < W - 1; w++) e.portes.push((opts.portes || []).indexOf(w) >= 0 ? 1 : 0);
    for (let i = 0; i < W * KB; i++) e.s.push((opts.s && opts.s[i]) || 'J');
    (opts.p || [[W - 1]]).forEach((x) => e.p.push({ w: x[0], b: x[1] || 0, c: 0, t: 0, x: 0, l: 0, k: 0, m: 0, d: 0, pts: 0, o: 0 }));
    (opts.C || []).forEach((w) => { e.C.push(w); e.cd.push(1); });
    return e;
  }

  // Chaque tutoriel : un état de départ, puis des étapes { main: [wagon, siège ou 'w' ou bouton], faire(e) }.
  const TUTOS = {
    base: () => ({
      e: etatDemo(3, { s: ['J', 'O', 'J', 'J', 'J', 'J', 'J', 'T', 'J'], p: [[2], [0]] }),
      etapes: [
        { main: ['s', 2, 1], faire: (e) => { e.s[7] = ''; e.p[0].t = 1; return 'T@7'; } },
        { main: ['w', 1], faire: (e) => { e.p[0].w = 1; } },
        { main: ['b', 'd'], faire: (e) => { e.quai = 1; } },
        { main: ['b', 'd'], faire: (e) => { e.p[0].d = 1; e.p[0].t = 0; } }
      ]
    }),
    controleur: () => ({
      e: etatDemo(3, { s: ['J', 'J', 'J', 'J', 'J', 'J', 'J', 'J', 'J'], p: [[2], [1]], C: [0] }),
      etapes: [
        { main: ['s', 2, 0], faire: (e) => { e.s[6] = ''; e.p[0].b = 2; } },
        { faire: (e) => { e.C[0] = 1; e.p[1].c = 1; } },
        { main: ['b', 'c'], faire: (e) => { e.p[0].c = 1; e.p[0].b = 0; } },
        { faire: (e) => { e.C[0] = 0; } }
      ]
    }),
    noir: () => ({
      e: etatDemo(2, { noir: [1], s: ['J', 'L', 'J', 'J', 'T', 'J'], p: [[0]] }),
      etapes: [
        { main: ['s', 0, 1], faire: (e) => { e.s[1] = ''; e.p[0].l = 1; return 'L@1'; } },
        { main: ['w', 1], faire: (e) => { e.p[0].w = 1; } },
        { main: ['s', 1, 1], faire: (e) => { e.s[4] = ''; e.p[0].t = 1; return 'T@4'; } }
      ]
    }),
    portes: () => ({
      e: etatDemo(2, { portes: [0], s: ['J', 'J', 'J', 'K', 'J', 'J'], p: [[1]] }),
      etapes: [
        { main: ['s', 1, 0], faire: (e) => { e.s[3] = ''; e.p[0].k = 1; return 'K@3'; } },
        { main: ['w', 0], faire: (e) => { e.p[0].w = 0; } },
        { faire: () => {} }
      ]
    }),
    reflets: () => ({
      e: etatDemo(3, { vitre: [2], p: [[2, 0], [1, 3]], C: [0] }),
      etapes: [
        { faire: (e) => { e.reflet = 1; } },
        { faire: (e) => { e.reflet = 0; e.C[0] = 1; } },
        { faire: () => {} }
      ]
    }),
    piege: () => ({
      e: etatDemo(2, { s: ['J', 'J', 'J', 'P', 'J', 'J'], p: [[1], [1]] }),
      etapes: [
        { main: ['s', 1, 0], faire: (e) => { e.s[3] = ''; e.p[0].x = 1; return 'P@3'; } },
        { main: ['b', 'g'], faire: (e) => { e.p[0].x = 0; e.p[1].x = 1; } },
        { faire: () => {} }
      ]
    }),
    double: () => ({
      e: etatDemo(4, { p: [[1, 0], [2, 2]], C: [0] }),
      etapes: [
        { faire: (e) => { e.C.push(3); e.cd.push(-1); } },
        { main: ['b', 'c'], faire: (e) => { e.p[0].c = 1; } },
        { faire: (e) => { e.C[0] = 1; e.p[1].c = 1; e.p[1].b = 0; } }
      ]
    }),
    presse: () => ({
      e: etatDemo(4, { p: [[3, 3], [1]], C: [0], r: 1 }),
      etapes: [
        { faire: (e) => { e.C[0] = 2; } },
        { main: ['b', 'c'], faire: (e) => { e.p[0].c = 1; e.p[0].b = 0; } },
        { faire: () => {} }
      ]
    })
  };

  // Main qui touche (doigt tendu), en (x, y), pression p (0 à 1).
  function main(c, x, y, s, p) {
    c.save(); c.translate(x, y); c.scale(s, s);
    if (p > 0) { c.strokeStyle = `rgba(255,191,90,${1 - p})`; c.lineWidth = 3; rond(c, 0, 0, 8 + p * 16); c.stroke(); }
    c.fillStyle = '#ffe2c4'; c.strokeStyle = '#7a4a2a'; c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(-3, 0); c.lineTo(-3, 16); c.quadraticCurveTo(-12, 14, -12, 22); c.lineTo(-10, 34); c.quadraticCurveTo(0, 40, 12, 34); c.lineTo(14, 20); c.quadraticCurveTo(12, 14, 4, 14); c.lineTo(4, 0); c.quadraticCurveTo(0, -5, -3, 0); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const fab = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const LW = 560, LH = 380, BAS = 64;
    let d = fab(), debut = 0, fait = 0, pa = { p: [], c: [] }, parts = [];
    const PAS = 1500, j = ++tutoAnim;
    let tPrecT = 0;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) { debut = t; tPrecT = t; }
      const dt = Math.min(0.05, (t - tPrecT) / 1000); tPrecT = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { d = fab(); fait = 0; pa = { p: [], c: [] }; parts = []; debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= 900) {
        const r = d.etapes[fait].faire(d.e);
        if (typeof r === 'string') { const m = r.split('@'); parts.push({ code: m[0], x: +m[1], v: 1.2 }); }
        fait++;
      }
      const e = d.e;
      const g = geometrie(e, LW, LH - BAS);
      const pv = positions(e, g);
      for (let s = 0; s < e.p.length; s++) {
        const cb = pv.p[s];
        if (!cb) { if (pa.p[s]) pa.p[s].alpha = Math.max(0, pa.p[s].alpha - dt * 1.5); continue; }
        if (!pa.p[s]) pa.p[s] = { x: cb.x, y: cb.y, alpha: 1 };
        else { pa.p[s].x += (cb.x - pa.p[s].x) * Math.min(1, dt * 6); pa.p[s].y += (cb.y - pa.p[s].y) * Math.min(1, dt * 6); }
      }
      for (let i = 0; i < e.C.length; i++) {
        const cb = pv.c[i];
        if (!cb) { pa.c[i] = null; continue; }
        if (!pa.c[i]) pa.c[i] = { x: cb.x, y: cb.y, alpha: 0 };
        else { pa.c[i].x += (cb.x - pa.c[i].x) * Math.min(1, dt * 5); pa.c[i].y += (cb.y - pa.c[i].y) * Math.min(1, dt * 5); pa.c[i].alpha = Math.min(1, pa.c[i].alpha + dt * 2); }
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, LW, LH);
      const choix = [];
      const proch = fait < d.etapes.length ? d.etapes[fait] : null;
      if (proch && proch.main && proch.main[0] === 's') choix.push(proch.main[1] * KB + proch.main[2]);
      const cibleW = proch && proch.main && proch.main[0] === 'w' ? [proch.main[1]] : null;
      dessinerRame(c, e, g, { t: t, moi: 0, aff: pa, choix: choix, cible: cibleW, reflet: e.reflet ? O.prevoir(e, 0) : null, lanterne: couleurLanterne() });
      parts.forEach((p) => {
        p.v -= dt;
        if (p.v <= 0) return;
        const w = Math.floor(p.x / KB), sj = p.x % KB;
        c.globalAlpha = Math.min(1, p.v * 1.5);
        objet(c, p.code, siegeX(g, sj), g.ys[w] + g.wh * 0.6 - (1.2 - p.v) * 50, 18);
        c.globalAlpha = 1;
      });
      // boutons d'action dessinés en bas de la démo (sans texte)
      const boutons = { c: 0, d: 1, g: 2 };
      const bx = (n) => 70 + n * 160, by = LH - BAS + 8;
      Object.keys(boutons).forEach((b) => {
        const n = boutons[b];
        const actif = proch && proch.main && proch.main[0] === 'b' && proch.main[1] === b;
        c.fillStyle = actif ? (b === 'd' ? '#2f9a55' : '#3a3a58') : '#1b1b2a'; c.strokeStyle = actif ? '#ffbf5a' : '#4b4b66'; c.lineWidth = 2;
        rr(c, bx(n), by, 120, 48, 10); c.fill(); c.stroke();
        if (b === 'c') { c.fillStyle = '#a8323e'; rr(c, bx(n) + 40, by + 18, 40, 10, 3); c.fill(); }
        else if (b === 'd') { c.fillStyle = '#5d5f7a'; c.fillRect(bx(n) + 38, by + 10, 18, 28); c.fillRect(bx(n) + 62, by + 10, 18, 28); }
        else objet(c, 'P', bx(n) + 60, by + 24, 14);
      });
      // la main
      if (proch && proch.main) {
        let x = 0, y = 0;
        const m = proch.main;
        if (m[0] === 's') { x = siegeX(g, m[2]); y = g.ys[m[1]] + g.wh * 0.72; }
        else if (m[0] === 'w') { x = g.x0 + g.ww * 0.5; y = g.ys[m[1]] + g.wh * 0.5; }
        else { x = bx(boutons[m[1]]) + 60; y = by + 26; }
        const q = Math.min(1, dans / 700);
        const hx = LW - 40 + (x - (LW - 40)) * q, hy = LH + 20 + (y - (LH + 20)) * q;
        main(c, hx, hy, 1.5, q >= 1 && dans < 1100 ? Math.min(1, (dans - 700) / 300) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier, boutons d'action
  // ---------------------------------------------------------------------

  function jouerAction(a) {
    if (!partie || !vue || enPause || attenteTuto || envoye) return false;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return false;
    }
    if (!R.valide(vue, partie.siege, a)) { sons.non(); return false; }
    if (partie.jouer(a)) { envoye = true; fermerChoixGlisser(); majActions(); return true; }
    return false;
  }

  // Pourquoi une action est refusée : un petit message clair.
  function expliquerRefus(w) {
    const e = vue, moi = partie ? partie.siege : -1;
    if (!e || moi < 0) return;
    const q = e.p[moi];
    if (Math.abs(w - q.w) === 1) {
      if (O.controleurIci(e, w)) toast(tr('evt.wagonControleur'), 1800, 'rouge');
      else if (O.porteFermee(e, q.w, w) && !q.k) { toast(tr('evt.porte'), 1800, 'rouge'); sons.cle(); }
    } else if (w === q.w && e.noir[w] && !q.l) toast(tr('evt.noir'), 1800);
  }

  function ciblesGlisser() {
    const e = vue, moi = partie ? partie.siege : -1;
    if (!e || moi < 0) return [];
    return O.actions(e, moi).filter((a) => a.t === 'g').map((a) => a.v);
  }
  function fermerChoixGlisser() { $('choix-glisser').classList.remove('actif'); $('choix-glisser').textContent = ''; }
  function ouvrirChoixGlisser() {
    const l = ciblesGlisser();
    if (!l.length) return;
    if (l.length === 1) { jouerAction({ t: 'g', v: l[0] }); return; }
    const boite = $('choix-glisser');
    boite.textContent = '';
    l.forEach((v) => {
      const b = document.createElement('button'); b.type = 'button';
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), v, 30, 30, 28);
      const sp = document.createElement('span'); sp.textContent = qui(v);
      b.append(cv, sp);
      b.setAttribute('aria-label', tr('action.glisserVers', { qui: qui(v) }));
      b.addEventListener('click', () => { audio(); jouerAction({ t: 'g', v: v }); });
      boite.appendChild(b);
    });
    boite.classList.add('actif');
  }

  function toucherPlateau(px, py) {
    if (!vue || !geo || !partie) return;
    const moi = partie.siege;
    if (moi < 0) return;
    const q = vue.p[moi];
    // choix d'un rival pour le ticket piégé
    if ($('choix-glisser').classList.contains('actif')) {
      const l = ciblesGlisser();
      for (const v of l) {
        const a = aff.p[v];
        if (a && Math.hypot(px - a.x, py - (a.y - geo.wh * 0.34)) < Math.max(26, geo.wh * 0.4)) { jouerAction({ t: 'g', v: v }); return; }
      }
    }
    let w = -1;
    for (let i = 0; i < vue.W; i++) if (py >= geo.ys[i] - geo.gap / 2 && py < geo.ys[i] + geo.wh + geo.gap / 2) w = i;
    if (w < 0 || q.d !== 0) return;
    if (w === q.w) {
      // banquette la plus proche du doigt
      let j = 0, bd = Infinity;
      for (let k = 0; k < KB; k++) { const dx = Math.abs(px - siegeX(geo, k)); if (dx < bd) { bd = dx; j = k; } }
      if (bd > geo.ww * 0.16) return;
      if (vue.s[w * KB + j] === '') { if (partie.monTour()) sons.non(); return; }
      if (!jouerAction({ t: 'f', i: j })) expliquerRefus(w);
    } else if (Math.abs(w - q.w) === 1) {
      if (!jouerAction({ t: 'm', d: w - q.w })) expliquerRefus(w);
    }
  }

  const plateau = $('plateau');
  plateau.addEventListener('pointerdown', (ev) => { audio(); clavier = false; ev.preventDefault(); });
  plateau.addEventListener('pointerup', (ev) => {
    const r = plateau.getBoundingClientRect();
    toucherPlateau(ev.clientX - r.left, ev.clientY - r.top);
  });

  $('act-cacher').addEventListener('click', () => { audio(); jouerAction({ t: 'c' }); });
  $('act-souffle').addEventListener('click', () => { audio(); jouerAction({ t: 'a' }); });
  $('act-descendre').addEventListener('click', () => { audio(); jouerAction({ t: 'd' }); });
  $('act-glisser').addEventListener('click', () => {
    audio();
    if ($('choix-glisser').classList.contains('actif')) fermerChoixGlisser(); else ouvrirChoixGlisser();
  });

  // Clavier : ↑ ↓ wagons, ← → banquettes, Entrée fouiller ou entrer, C cacher, Espace souffle, G glisser, D descendre.
  function bougerCurseur(dx) {
    const l = choixSieges();
    if (!l.length) return;
    clavier = true; curseurWagon = -1;
    let k = l.indexOf(curseur);
    k = k < 0 ? 0 : (k + dx + l.length) % l.length;
    curseur = l[k];
    sons.clic();
  }
  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue || !partie) return;
    const moi = partie.siege;
    if (moi < 0) return;
    const q = vue.p[moi];
    if (ev.code === 'ArrowUp' || ev.code === 'ArrowDown') {
      ev.preventDefault(); audio();
      const d = ev.code === 'ArrowUp' ? -1 : 1;
      if (!jouerAction({ t: 'm', d: d })) expliquerRefus(q.w + d);
    } else if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      bougerCurseur(ev.code === 'ArrowLeft' ? -1 : 1);
    } else if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (curseur >= 0 && choixSieges().indexOf(curseur) >= 0) jouerAction({ t: 'f', i: curseur % KB });
      else bougerCurseur(0);
    } else if (ev.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio(); jouerAction({ t: 'a' });
    } else if (ev.code === 'KeyC' || ev.code === 'KeyH') { audio(); jouerAction({ t: 'c' }); }
    else if (ev.code === 'KeyD') { audio(); jouerAction({ t: 'd' }); }
    else if (ev.code === 'KeyG') { audio(); ouvrirChoixGlisser(); }
    else if (ev.code === 'Digit1' || ev.code === 'Digit2' || ev.code === 'Digit3') { audio(); jouerAction({ t: 'f', i: Number(ev.code.slice(5)) - 1 }); }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-lanternes').addEventListener('click', () => { audio(); sons.clic(); ouvrirLanternes(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('lan-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.p[partie.siege].pts : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  majLanterne();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
