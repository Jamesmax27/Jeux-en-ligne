    let y = 2;
    if (tt > 0.7) y = tt < 1.1 ? 2 - ((tt - 0.7) / 0.4) ** 2 : 1;
    c.strokeStyle = 'rgba(60,60,60,.6)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(X(1), Y(y) - hb * 0.42); c.lineTo(X(1), 0); c.stroke();
    bulle(1, y, { frotte: tt > 1.3 && sale > 0 });
    if (tt < 0.75) peindreMain(c, X(1) + 6, Y(2) - hb * 0.4, 40, tt > 0.4);
    else if (tt < 1.1) { c.fillStyle = '#fff'; c.beginPath(); c.moveTo(X(1) + cw * 0.42, Y(1.7)); c.lineTo(X(1) + cw * 0.3, Y(1.9)); c.lineTo(X(1) + cw * 0.54, Y(1.9)); c.fill(); }
  } else if (cleI === 'volet') {
    const P = 3.6, tt = t % P;
    const V = { etat: tt > 1.7 && tt < 2.8 ? 'ouvert' : (tt > 0.8 && tt <= 1.7 ? 'tremble' : 'calme') };
    const v = vitre(1, 1, {}); vitre(2, 2, { atteignable: true });
    peindreVolets(c, v.wx, v.wy, v.ww, v.wh, V, th, t);
    rebord(1, 1); rebord(2, 2);
    const pos = bulleSurChemin([{ t: 0, c: 1, r: 1 }, { t: 1.35, c: 2, r: 2 }], tt);
    bulle(pos.x, pos.y);
  } else if (cleI === 'toutes') {
    const P = 4, tt = t % P;
    for (let k = 0; k < 3; k++) vitre(k, 1, { sale: tt > 0.8 + k * 0.9 ? 0 : 1, propre: tt > 0.8 + k * 0.9, coucou: tt > 0.8 + k * 0.9 ? tt - 0.8 - k * 0.9 : -1 });
    for (let k = 0; k < 3; k++) rebord(k, 1);
    toit(2, tt > 3.5);
    const kk = Math.min(2, Math.floor(Math.max(0, tt - 0.1) / 0.9));
    bulle(kk, 1, { frotte: tt < 3.5 });
  } else if (cleI === 'pigeon') {
    const P = 3.6, tt = t % P;
    vitre(1, 0.0001, {}); vitre(2, 1, {}); vitre(0, 1, { atteignable: false });
    rebord(1, 0.0001); rebord(2, 1); sol();
    const pos = bulleSurChemin([{ t: 0, c: 0, r: 0 }, { t: 0.5, c: 1, r: 0.0001 }], tt);
    bulle(pos.x, pos.y);
    if (tt < 1.0) peindrePigeon(c, X(2) + cw * 0.2, Y(1), fh * 0.6, t, -1, false);
    else if (tt < 1.8) peindrePigeon(c, X(2) + cw * 0.2, Y(1) - Math.abs(Math.sin(tt * 20)) * 4, fh * 0.6, t * 4, -1, true);
    else { const px = X(2) - (tt - 1.8) * cw * 3; peindrePigeon(c, px, Y(1) - fh * 0.3, fh * 0.6, t, -1, true); }
  } else if (cleI === 'bulles' || cleI === 'coeur') {
    const P = 3, tt = t % P;
    vitre(1, 1, {}); vitre(2, 1, { atteignable: false }); rebord(1, 1); sol();
    const pos = bulleSurChemin([{ t: 0, c: 0, r: 0 }, { t: 0.9, c: 1, r: 1 }], tt);
    if (tt < 1.25) peindreBonus(c, cleI === 'bulles' ? 'temps' : 'coeur', X(1), Y(1) - fh * 0.3, Math.min(cw, fh) * 0.55, t);
    else { c.fillStyle = '#fff6b0'; for (let k = 0; k < 6; k++) { const a = k * 1.05; etoile4(c, X(1) + Math.cos(a) * (tt - 1.25) * 60, Y(1) - fh * 0.4 + Math.sin(a) * (tt - 1.25) * 60, 6); c.fill(); } }
    bulle(pos.x, pos.y);
  } else if (cleI === 'jardiniere') {
    const P = 3, tt = t % P;
    vitre(1, 1, {}); vitre(1, 3, {}); vitre(1, 2, { atteignable: false }); vitre(0, 2, { atteignable: false }); vitre(2, 2, { atteignable: false });
    peindreJardiniere(c, x0 + cw + cw * 0.1, Y(1), cw * 0.8, t); rebord(1, 3); sol();
    const pos = bulleSurChemin([{ t: 0, c: 0, r: 0 }, { t: 0.6, c: 1, r: 1 }, { t: 0.95, c: 1, r: 3, arc: 1 }], tt);
    bulle(pos.x, pos.y);
  } else if (cleI === 'pluie') {
    const P = 4.5, tt = t % P;
    const sale = tt > 2.2 ? (tt < 3.4 ? 1 : borne(1 - (tt - 3.4) / 0.9, 0, 1)) : 0;
    vitre(1, 1, { sale, propre: sale <= 0, coucou: tt > 4.3 ? 0.5 : -1 }); vitre(0, 1, { atteignable: false }); vitre(2, 1, { atteignable: false });
    rebord(1, 1); sol();
    bulle(1, 1, { frotte: tt > 3.4 && sale > 0 });
    if (tt > 0.6 && tt < 2.4) {
      c.fillStyle = 'rgba(120,135,160,.95)';
      for (let i = 0; i < 5; i++) { c.beginPath(); c.arc(w * 0.3 + i * 30, 20 + (i % 2) * 8, 24, 0, Math.PI * 2); c.fill(); }
      c.strokeStyle = 'rgba(160,200,255,.9)'; c.lineWidth = 2; c.beginPath();
      for (let i = 0; i < 30; i++) { const x = (i * 37 + t * 60) % w, y = (i * 53 + t * 400) % h; c.moveTo(x, y); c.lineTo(x - 3, y + 10); }
      c.stroke();
    }
  } else if (cleI === 'nacelle' || cleI === 'deuxnacelles') {
    const P = 4.4, tt = t % P;
    const deux = cleI === 'deuxnacelles';
    const n1 = 0.5 + 0.5 * Math.sin(tt / P * Math.PI * 2 - Math.PI / 2); // 0 → 1 → 0
    const n2 = 1 - n1;
    const ny1 = n1 * 1, ny2 = 0.6 + n2 * 1;
    const xs = deux ? 3 : 2;
    vitre(0, 0.0001, {}); vitre(xs, 2, {}); rebord(0, 0.0001); rebord(xs, 2); sol();
    peindreNacelle(c, X(1), Y(ny1 * 1 + 0.0001), cw * 0.8, 0);
    if (deux) peindreNacelle(c, X(2), Y(ny2), cw * 0.8, 0);
    let pos;
    if (!deux) {
      if (tt < 0.9) pos = { x: 0, y: 0.0001 };
      else if (tt < 1.25) { const k = (tt - 0.9) / 0.35; pos = { x: lerp(0, 1, k), y: lerp(0, ny1, k) + 0.5 * 4 * k * (1 - k) }; }
      else if (tt < 2.2) pos = { x: 1, y: ny1 };
      else if (tt < 2.55) { const k = (tt - 2.2) / 0.35; pos = { x: lerp(1, 2, k), y: lerp(ny1, 2, k) + 0.5 * 4 * k * (1 - k) }; }
      else pos = { x: 2, y: 2 };
    } else {
      if (tt < 0.7) pos = { x: 0, y: 0.0001 };
      else if (tt < 1.05) { const k = (tt - 0.7) / 0.35; pos = { x: lerp(0, 1, k), y: lerp(0, ny1, k) + 0.5 * 4 * k * (1 - k) }; }
      else if (tt < 1.9) pos = { x: 1, y: ny1 };
      else if (tt < 2.25) { const k = (tt - 1.9) / 0.35; pos = { x: lerp(1, 2, k), y: lerp(ny1, ny2, k) + 0.5 * 4 * k * (1 - k) }; }
      else if (tt < 3.1) pos = { x: 2, y: ny2 };
      else if (tt < 3.45) { const k = (tt - 3.1) / 0.35; pos = { x: lerp(2, 3, k), y: lerp(ny2, 2, k) + 0.5 * 4 * k * (1 - k) }; }
      else pos = { x: 3, y: 2 };
    }
    bulle(pos.x, pos.y);
  }
}

        bt.addEventListener('click', () => {
          initAudio(); jouer('bulle');
          progres.tenue[type] = k;
          garderLocal();
          try { if (window.JEL_SAVE && JEL_SAVE.existe(JEU)) JEL_SAVE.save(JEU, { tenue: progres.tenue }); } catch (e) { /* rien */ }
          remplirVestiaire();
        });
      }
      zone.appendChild(bt);
    });
  });
}
function objetsDebloques(avant, apres) {
  let n = 0;
  Object.values(TENUES).forEach((liste) => liste.forEach((s) => { if (s > avant && s <= apres) n++; }));
  return n;
}

/* ---------- Fin de niveau ---------- */
let finGagne = false;
function afficherFin(gagne, raison) {
  etat = 'fin';
  partieEnCours = false;
  finGagne = gagne;
  frotteBouton = frotteTouche = false;
  const propres = vitresPropres(), total = lvl.vitres.length;
  const reste = Math.ceil(tempsRestant);
  let etoiles = 0, score = 0;
  const avant = totalEtoiles();
  let record = false;
  if (gagne) {
    etoiles = 1;
    if (propres >= total) { etoiles = 2; if (tempsRestant >= lvl.limite * 0.35) etoiles = 3; }
    score = propres * 100 + reste * 10 + coeurs * 50;
    record = score > progres.records[indexNiveau];
    progres.records[indexNiveau] = Math.max(progres.records[indexNiveau], score);
    progres.etoiles[indexNiveau] = Math.max(progres.etoiles[indexNiveau], etoiles);
    progres.atteint = Math.max(progres.atteint, Math.min(NIVEAUX.length, indexNiveau + 2));
    try { JEL_SAVE.save(JEU, donneesSauvegarde(Math.min(NIVEAUX.length, indexNiveau + 2))); } catch (e) { /* rien */ }
    garderLocal();
  }
  if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: indexNiveau + 1 });
  if (gagne && progres.etoiles.every((e) => e > 0)) {
    if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
  }
  if (!gagne) jouer('defaite');
  // Écran
  $('fin-titre').textContent = gagne ? tr('fin.gagne') : (raison === 'temps' ? tr('fin.perdu.temps') : tr('fin.perdu.coeurs'));
  const zoneEt = $('fin-etoiles');
  zoneEt.innerHTML = [0, 1, 2].map(() => SVG_ETOILE(true)).join('');
  [...zoneEt.children].forEach((s, k) => { if (k < etoiles) setTimeout(() => { s.classList.add('allumee'); jouer('etoile'); }, 350 + k * 380); });
  zoneEt.setAttribute('aria-label', tr('fin.etoilesAria', { n: etoiles }));
  zoneEt.setAttribute('role', 'img');
  const elScore = $('fin-score');
  if (gagne) {
    const debut = performance.now();
    const anim = (m) => { const k = Math.min(1, (m - debut) / 900); elScore.textContent = tr('fin.score', { n: Math.round(score * k) }); if (k < 1 && etat === 'fin') requestAnimationFrame(anim); };
    requestAnimationFrame(anim);
  } else elScore.textContent = '';
  $('fin-record').textContent = gagne ? (record ? tr('fin.record') : tr('fin.recordAncien', { n: progres.records[indexNiveau] })) : '';
  $('fin-vitres').textContent = tr('fin.vitres', { a: propres, b: total });
  $('fin-temps').textContent = gagne ? tr('fin.temps', { n: reste }) : '';
  const debloques = gagne ? objetsDebloques(avant, totalEtoiles()) : 0;
  $('fin-debloque').textContent = debloques > 0 ? tr('fin.debloque', { n: debloques }) : '';
  let conseil = '';
  if (!gagne) conseil = raison === 'temps' ? tr('fin.conseil.temps') : tr('fin.conseil.coeurs');
  else if (etoiles < 3) conseil = propres < total ? tr('fin.conseil.toutes') : tr('fin.conseil.vite');
  $('fin-conseil').textContent = conseil;
  const principal = $('btn-fin-principal'), second = $('btn-fin-second');
  if (gagne) {
    principal.textContent = indexNiveau < NIVEAUX.length - 1 ? tr('bouton.suivant') : tr('bouton.bilan');
    principal.dataset.action = indexNiveau < NIVEAUX.length - 1 ? 'suivant' : 'bilan';
    second.textContent = tr('bouton.rejouer'); second.dataset.action = 'rejouer';
  } else {
    principal.textContent = tr('bouton.reessayer'); principal.dataset.action = 'rejouer';
    second.textContent = tr('bouton.accueil'); second.dataset.action = 'accueil';
  }
  afficherEcran('ecran-fin');
  try { principal.focus({ preventScroll: true }); } catch (e) { /* rien */ }
}

  $('bilan-texte').textContent = tr('bilan.texte', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
  let ouverts = 0, tous = 0;

/* ==========================================================================
   Commandes : doigt, souris, clavier
   ========================================================================== */
let pointeur = null;
canvas.addEventListener('pointerdown', (e) => {
  if (etat !== 'jeu') return;
  initAudio();
  pointeur = { id: e.pointerId, x: e.clientX, y: e.clientY, debut: performance.now(), deplace: 0, dernier: [e.clientX, e.clientY] };
  try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointeur || e.pointerId !== pointeur.id || etat !== 'jeu') return;
  const dx = e.clientX - pointeur.dernier[0], dy = e.clientY - pointeur.dernier[1];
  const d = Math.hypot(dx, dy);
  pointeur.dernier = [e.clientX, e.clientY];
  pointeur.deplace += d;
  if (pointeur.deplace > 14) frotteDistance += d;
});
function finPointeur(e) {
  if (!pointeur || e.pointerId !== pointeur.id) return;
  const p = pointeur; pointeur = null;
  if (etat !== 'jeu') return;
  if (p.deplace <= 14 && performance.now() - p.debut < 500) {
    const rect = canvas.getBoundingClientRect();
    const G = geometrie(lvl, W, H);
    const bx = ecranX(G, b.x), by = ecranY(G, b.f, camY);
    const hb = Math.min(G.cw * 0.7, G.fh * 0.62);
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    // Toucher Bulle lui-même : il se laisse glisser au rebord du dessous
    if (Math.abs(px - bx) < Math.max(22, hb * 0.32) && py < by + 6 && py > by - hb * 1.05) descendre();
    else sauter(px < bx ? -1 : 1);
  }
}
canvas.addEventListener('pointerup', finPointeur);
canvas.addEventListener('pointercancel', (e) => { if (pointeur && e.pointerId === pointeur.id) pointeur = null; });

function boutonAppui(id, debut, fin) {
  const el = $(id);
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.classList.add('appui'); debut(); try { el.setPointerCapture(e.pointerId); } catch (er) { /* rien */ } });
  const lacher = () => { el.classList.remove('appui'); if (fin) fin(); };
  el.addEventListener('pointerup', lacher);
  el.addEventListener('pointercancel', lacher);
  el.addEventListener('lostpointercapture', lacher);
  el.addEventListener('contextmenu', (e) => e.preventDefault());
  // Clavier (Tab + Entrée) : un clic sans pointeur
  el.addEventListener('click', (e) => { if (e.detail === 0) { debut(); if (fin) setTimeout(fin, 400); } });
}
boutonAppui('btn-gauche', () => sauter(-1));
boutonAppui('btn-droite', () => sauter(1));
boutonAppui('btn-descendre', () => descendre());
boutonAppui('btn-frotter', () => { initAudio(); frotteBouton = true; }, () => { frotteBouton = false; });

const TOUCHES = { ArrowLeft: 'g', KeyA: 'g', KeyQ: 'g', ArrowRight: 'd', KeyD: 'd', Space: 'f', ArrowUp: 'f', KeyW: 'f', KeyZ: 'f', ArrowDown: 'b', KeyS: 'b' };
window.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (etat === 'jeu') { e.preventDefault(); mettrePause(); }
    else if (etat === 'pause') { e.preventDefault(); reprendre(); }
    return;
  }
  if (etat !== 'jeu') return;
  const a = TOUCHES[e.code];
  if (!a) return;
  e.preventDefault();
  initAudio();
  if (a === 'g' && !e.repeat) sauter(-1);
  else if (a === 'd' && !e.repeat) sauter(1);
  else if (a === 'b' && !e.repeat) descendre();
  else if (a === 'f') frotteTouche = true;
});
window.addEventListener('keyup', (e) => { if (TOUCHES[e.code] === 'f') frotteTouche = false; });
window.addEventListener('blur', () => { frotteTouche = frotteBouton = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

/* Boutons des écrans */
function clic(id, f) { $(id).addEventListener('click', () => { initAudio(); jouer('clic'); f(); }); }
clic('btn-jouer', () => {
  JEL_SAVE.reprise({
    jeu: JEU,
    onContinuer: (d) => { fusionnerProgres(d); lancerNiveau(borne(d.niveau | 0, 1, NIVEAUX.length) - 1); },
    onNouvelle: () => lancerNiveau(0),
    onEffacer: () => { const son = sonActif; progres = nouveauProgres(); sonActif = son; garderLocal(); lancerNiveau(0); },
  });
});
clic('btn-niveaux-titre', ouvrirNiveaux);
clic('btn-vestiaire', ouvrirVestiaire);
clic('btn-niveaux-retour', allerTitre);
clic('btn-vestiaire-retour', allerTitre);
clic('btn-intro', passerIntro);
$('demo').addEventListener('click', passerIntro);
clic('btn-pause', mettrePause);
clic('btn-reprendre', reprendre);
clic('btn-recommencer', () => lancerNiveau(indexNiveau));
clic('btn-pause-niveaux', ouvrirNiveaux);
clic('btn-accueil', allerTitre);
$('btn-son').addEventListener('click', basculerSon);
$('btn-son-titre').addEventListener('click', basculerSon);
$('btn-son-pause').addEventListener('click', basculerSon);
clic('btn-fin-principal', () => {
  const a = $('btn-fin-principal').dataset.action;
  if (a === 'suivant') lancerNiveau(indexNiveau + 1);
  else if (a === 'bilan') ouvrirBilan();
  else lancerNiveau(indexNiveau);
});
clic('btn-fin-second', () => {
  if ($('btn-fin-second').dataset.action === 'accueil') allerTitre();
  else lancerNiveau(indexNiveau);
});
clic('btn-fin-niveaux', ouvrirNiveaux);
clic('btn-bilan-vestiaire', ouvrirVestiaire);
clic('btn-bilan-niveaux', ouvrirNiveaux);
clic('btn-bilan-accueil', allerTitre);

/* Sauvegarde à la fermeture, seulement pendant une partie */
JEL_SAVE.surFermeture(() => {
  if (partieEnCours && lvl) JEL_SAVE.save(JEU, donneesSauvegarde(indexNiveau + 1));
});

/* ==========================================================================
   Boucle principale
   ========================================================================== */
let avant = performance.now();
function boucle(maintenant) {
  let dt = Math.min(0.05, Math.max(0, (maintenant - avant) / 1000));
  avant = maintenant;
  if (etat !== 'pause') tempsGlobal += dt;
  if (etat === 'jeu' && lvl) {
    majMonde(dt);
    majParticules(dt);
    secousse = Math.max(0, secousse - dt);
  } else if (etat === 'fin') {
    majParticules(dt);
  }
  dessinerJeu();
  if (etat === 'intro') dessinerDemo();
  if (etat === 'vestiaire') dessinerApercu();
  requestAnimationFrame(boucle);
}

/* ---------- Démarrage ---------- */
chargerProgres();
redimensionner();
window.addEventListener('resize', redimensionner);
majBoutonsSon();
majTitre();
if (window.JEL_I18N && JEL_I18N.surChangement) JEL_I18N.surChangement(() => { majBoutonsSon(); majTitre(); majHud(); });
requestAnimationFrame(boucle);
</script>
</body>
