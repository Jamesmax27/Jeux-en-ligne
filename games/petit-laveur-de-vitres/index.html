<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

    const r = hasard((i + 1) * 9973 + essai * 7919 + 31);
    const L = essaiFacade(def, r, essai < 300);
    if (L) { meilleur = L; essaiTrouve = essai; break; }
  }
  if (!meilleur) { meilleur = facadeSimple(def); meilleur.secours = true; }
  meilleur.essai = essaiTrouve;
  meilleur.def = def;
  meilleur.index = i;
  meilleur.theme = THEMES[QUARTIERS[def.q]];
  meilleur.quartier = QUARTIERS[def.q];
  // Chrono : hauteur + vitres à laver + obstacles
  let couches = 0;
  meilleur.vitres.forEach((v) => { couches += v.max; });
  let base = 14 + def.etages * 2.4 + couches * 3.2 + ((def.volets || 0) + (def.pigeons || 0)) * 2;
  if (def.pluie) base += (base / def.pluie.tous) * def.pluie.nb * 3;
  meilleur.limite = Math.round(base * def.temps);
  meilleur.min = Math.min(def.min, meilleur.vitres.length);
  return meilleur;
}

/* Saut « en théorie » (pour vérifier la façade) : voisin plus haut, sinon même étage, sinon plus bas */
function cibleTheorique(L, c, f, d) {
  const nc = c + d;
  if (nc < 0 || nc >= L.C) return null;
  for (const nf of [f + 1, f, f - 1]) {
    if (nf < 0 || nf > L.F) continue;
    if (nf === 0 || nf === L.F) return [nc, nf];
    const R = L.ledges.get(cle(nc, nf));
    if (R) {
      if (R.type === 'j') return L.ledges.has(cle(nc, nf + 2)) || nf + 2 === L.F ? [nc, nf + 2] : null;
      return [nc, nf];
    }
    for (const n of L.nacelles) if (n.c === nc && nf >= n.fa && nf <= n.fb) return [nc, nf];
  }
  return null;
}
function voisinsTheoriques(L, c, f, avecNacelles) {
  const res = [];
  for (const d of [-1, 1]) {
    const t = cibleTheorique(L, c, f, d);
    if (!t) continue;
    if (!avecNacelles && L.nacelles.some((n) => n.c === t[0] && t[1] >= n.fa && t[1] <= n.fb && !L.ledges.has(cle(t[0], t[1])) && t[1] !== 0 && t[1] !== L.F)) continue;
    res.push(t);
  }
  if (avecNacelles) {
    for (const n of L.nacelles) {
      if (n.c === c && f >= n.fa && f <= n.fb) for (let k = n.fa; k <= n.fb; k++) if (k !== f) res.push([c, k]);
    }
  }
  return res;
}
function explorer(L, depart, avecNacelles) {
  const vu = new Set([cle(depart[0], depart[1])]);
  const file = [depart];
  const aretes = [];
  while (file.length) {
    const [c, f] = file.shift();
    for (const v of voisinsTheoriques(L, c, f, avecNacelles)) {
      aretes.push([cle(c, f), cle(v[0], v[1])]);
      const k = cle(v[0], v[1]);
      if (!vu.has(k)) { vu.add(k); file.push(v); }
    }
  }
  return { vu, aretes };
}

function essaiFacade(def, r, exigerNacelle) {
  const C = def.cols, F = def.etages;
  const L = { C, F, ledges: new Map(), bloque: new Set(), nacelles: [], vitres: [], pigeons: [], bonus: [] };
  const poser = (c, f, type) => { L.ledges.set(cle(c, f), { c, f, type: type || 'n', vitre: null, volet: null, bonus: null }); };
  const libre = (c, f) => c >= 0 && c < C && f >= 1 && f <= F - 1 && !L.ledges.has(cle(c, f)) && !L.bloque.has(cle(c, f));
  let c = Math.floor(r() * C), f = 0;
  L.depart = c;
  let nacRestantes = def.nac || 0, jardRestantes = def.jard || 0;
  const etagesNac = [];
  for (let k = 0; k < nacRestantes; k++) etagesNac.push(Math.floor(2 + (k + 0.3 + r() * 0.4) * (F - 6) / nacRestantes));
  let garde = 0;
  while (f < F - 1 && garde++ < 200) {
    let d = r() < 0.5 ? -1 : 1;
    if (c + d < 0 || c + d >= C) d = -d;
    const nc = c + d;
    // Nacelle : une colonne sans rebords que la nacelle parcourt
    if (etagesNac.length && f >= etagesNac[0] && f + 4 <= F - 1) {
      const longueur = 3 + Math.floor(r() * 2);
      const fa = Math.max(1, f + 1), fb = Math.min(F - 2, fa + longueur);
      let ok = true;
      for (let k = fa - 1; k <= fb + 1; k++) if (k >= 1 && k <= F - 1 && L.ledges.has(cle(nc, k))) ok = false;
      const sortie = nc + (nc + d >= 0 && nc + d < C ? d : -d);
      if (ok && sortie !== nc && libre(sortie, fb + 1)) {
        L.nacelles.push({ c: nc, fa, fb, f: fa, dir: 1, attente: 0, vitesse: 0.9 + r() * 0.5 });
        for (let k = fa - 1; k <= fb + 1; k++) L.bloque.add(cle(nc, k));
        etagesNac.shift();
        poser(sortie, fb + 1);
        c = sortie; f = fb + 1;
        continue;
      }
    }
    // Jardinière : rebond de deux étages
    if (jardRestantes > 0 && f >= 1 && f + 3 <= F - 1 && r() < 0.45 && libre(nc, f + 1) && libre(nc, f + 2) && libre(nc, f + 3)) {
      poser(nc, f + 1, 'j');
      L.bloque.add(cle(nc, f + 2));
      poser(nc, f + 3);
      jardRestantes--;
      c = nc; f = f + 3;
      continue;
    }
    const x = r();
    if (def.descente && f >= 2 && x < 0.18 && libre(nc, f - 1) && libre(nc, f) && libre(nc, f + 1)) {
      poser(nc, f - 1); L.bloque.add(cle(nc, f)); L.bloque.add(cle(nc, f + 1));
      c = nc; f = f - 1;
    } else if (f >= 1 && x < 0.32 && libre(nc, f) && libre(nc, f + 1)) {
      poser(nc, f); L.bloque.add(cle(nc, f + 1));
      c = nc;
    } else if (libre(nc, f + 1) || L.ledges.has(cle(nc, f + 1))) {
      if (!L.ledges.has(cle(nc, f + 1))) poser(nc, f + 1);
      c = nc; f = f + 1;
    } else return null;
  }
  if (f < F - 1) return null;
  if (nacRestantes && L.nacelles.length < nacRestantes) return null;
  // Rebords en plus
  for (let ff = 1; ff <= F - 1; ff++) for (let cc = 0; cc < C; cc++) if (libre(cc, ff) && r() < def.densite) poser(cc, ff);
  // Jardinières en plus si le chemin n'en a pas placé assez
  for (let k = 0; k < 40 && jardRestantes > 0; k++) {
    const cc = Math.floor(r() * C), ff = 1 + Math.floor(r() * (F - 3));
    if (libre(cc, ff) && !L.ledges.has(cle(cc, ff + 1)) && L.ledges.has(cle(cc, ff + 2)) && L.ledges.get(cle(cc, ff + 2)).type === 'n') {
      poser(cc, ff, 'j'); jardRestantes--;
    }
  }
  if (jardRestantes > 0) return null;
  // Vérification : toit atteint, aucun rebord sans issue
  const { vu, aretes } = explorer(L, [L.depart, 0], true);
  let toit = false;
  vu.forEach((k) => { if (k.endsWith(',' + F)) toit = true; });
  if (!toit) return null;
  const inverse = new Map();
  aretes.forEach(([a, b]) => { if (!inverse.has(b)) inverse.set(b, []); inverse.get(b).push(a); });
  const versToit = new Set();
  const file = [];
  vu.forEach((k) => { if (k.endsWith(',' + F)) { versToit.add(k); file.push(k); } });
  while (file.length) { const k = file.shift(); (inverse.get(k) || []).forEach((a) => { if (!versToit.has(a)) { versToit.add(a); file.push(a); } }); }
  for (const k of vu) if (!versToit.has(k)) return null;
  if (L.nacelles.length && exigerNacelle) {
    const sans = explorer(L, [L.depart, 0], false);
    let toit2 = false;
    sans.vu.forEach((k) => { if (k.endsWith(',' + F)) toit2 = true; });
    if (toit2) return null;
  }
  // Rebords atteignables (pas les jardinières : on y rebondit)
  const cand = [];
  L.ledges.forEach((R) => { if (R.type === 'n' && vu.has(cle(R.c, R.f))) cand.push(R); });
  if (cand.length < def.sales + (def.pigeons || 0) + 1) return null;
  cand.sort((a, b) => a.f - b.f || a.c - b.c);
  // Vitres sales réparties sur la hauteur
  const choisis = new Set();
  for (let k = 0; k < def.sales; k++) {
    let j = Math.floor((k + r()) * cand.length / def.sales);
    j = borne(j, 0, cand.length - 1);
    let tour = 0;
    while (choisis.has(j) && tour++ < cand.length) j = (j + 1) % cand.length;
    choisis.add(j);
  }
  const vitresSales = [...choisis].map((j) => cand[j]);
  vitresSales.forEach((R, k) => {
    const tenace = def.verre || k % Math.max(1, Math.floor(def.sales / Math.max(1, def.tenaces || 0))) === 1 && (def.tenaces || 0) > vitresSales.filter((x) => x.vitre && x.vitre.max === 2).length;
    R.vitre = { c: R.c, f: R.f, max: tenace ? 2 : 1, sale: tenace ? 2 : 1, propre: false, coucou: -1, graine: Math.floor(r() * 1e6) };
    L.vitres.push(R.vitre);
  });
  // Volets (sur des rebords à partir du 2e étage)
  const autres = cand.filter((R) => R.f >= 2);
  const melanger = (t) => { for (let k = t.length - 1; k > 0; k--) { const j = Math.floor(r() * (k + 1)); [t[k], t[j]] = [t[j], t[k]]; } return t; };
  melanger(autres);
  let nv = def.volets || 0;
  for (const R of autres) { if (nv <= 0) break; R.volet = { periode: 4 + r() * 1.6, phase: r() * 5, etat: 'calme' }; nv--; }
  // Pigeons (pas sur une vitre sale ni un volet)
  let np = def.pigeons || 0;
  for (const R of autres) {
    if (np <= 0) break;
    if (R.vitre || R.volet || L.pigeons.some((p) => Math.abs(p.f - R.f) <= 1 && Math.abs(p.c - R.c) <= 1)) continue;
    L.pigeons.push({ c: R.c, f: R.f, x: R.c, etat: 'perche', t: 0, dir: 1, battement: r() * 6 });
    np--;
  }
  // Bonus : bulles de savon (+5 s) et cœur
  const libres = melanger(cand.filter((R) => !R.vitre && !R.volet && !L.pigeons.some((p) => p.c === R.c && p.f === R.f)));
  let nbB = def.bulles || 0, nbC = def.coeur || 0;
  for (const R of libres) {
    if (nbB > 0) { R.bonus = 'temps'; nbB--; } else if (nbC > 0) { R.bonus = 'coeur'; nbC--; } else break;
  }
  if (nbB > 0 || nbC > 0) return null;
  return L;
}

/* Façade de secours (escalier simple), si aucune graine ne convient */
function facadeSimple(def) {
  const C = def.cols, F = def.etages;
  const L = { C, F, ledges: new Map(), bloque: new Set(), nacelles: [], vitres: [], pigeons: [], bonus: [], depart: 0 };
  let c = 0, d = 1;
  for (let f = 1; f <= F - 1; f++) {
    c += d; if (c >= C - 1 || c <= 0) d = -d; c = borne(c, 0, C - 1);
    L.ledges.set(cle(c, f), { c, f, type: 'n', vitre: null, volet: null, bonus: null });
  }
  let k = 0;
  L.ledges.forEach((R) => {
    if (k < def.sales) { R.vitre = { c: R.c, f: R.f, max: def.verre ? 2 : 1, sale: def.verre ? 2 : 1, propre: false, coucou: -1, graine: k * 977 }; L.vitres.push(R.vitre); }
    k++;
  });
  return L;
}

function nouveauProgres() {
  return { etoiles: new Array(NIVEAUX.length).fill(0), records: new Array(NIVEAUX.length).fill(0), atteint: 1, tenue: { casquette: 0, eponge: 0, seau: 0 }, vus: {} };
}
const totalEtoiles = () => progres.etoiles.reduce((a, e) => a + Math.min(3, e || 0), 0);
const totalScore = () => progres.records.reduce((a, s) => a + (s || 0), 0);

/* ---------- Sauvegarde (save.js) et souvenirs locaux ---------- */
const CLE_LOCALE = 'fmg-petit-laveur-de-vitres';
function fusionnerProgres(d) {
  if (!d || typeof d !== 'object') return;
  if (Array.isArray(d.etoiles)) d.etoiles.forEach((e, i) => { if (i < NIVEAUX.length) progres.etoiles[i] = Math.max(progres.etoiles[i], Math.min(3, e | 0)); });
  if (Array.isArray(d.records)) d.records.forEach((s, i) => { if (i < NIVEAUX.length) progres.records[i] = Math.max(progres.records[i], s | 0); });
  if (d.atteint) progres.atteint = Math.max(progres.atteint, borne(d.atteint | 0, 1, NIVEAUX.length));
  if (d.niveau) progres.atteint = Math.max(progres.atteint, borne(d.niveau | 0, 1, NIVEAUX.length));
  if (d.tenue && typeof d.tenue === 'object') ['casquette', 'eponge', 'seau'].forEach((k) => { if (typeof d.tenue[k] === 'number') progres.tenue[k] = borne(d.tenue[k] | 0, 0, 5); });
  if (d.vus && typeof d.vus === 'object') Object.keys(d.vus).forEach((k) => { progres.vus[k] = true; });
  if (d.options && typeof d.options.son === 'boolean') sonActif = d.options.son;
}
function chargerProgres() {
  try {
    const brut = localStorage.getItem(CLE_LOCALE);
    if (brut) fusionnerProgres(JSON.parse(brut));
  } catch (e) { /* stockage indisponible : on joue quand même */ }
  try { if (window.JEL_SAVE && JEL_SAVE.existe(JEU)) fusionnerProgres(JEL_SAVE.load(JEU)); } catch (e) { /* rien */ }
}

}

}

const canvas = $('scene');
const ctx = canvas.getContext('2d');
let W = 360, H = 600, DPR = 1;
function redimensionner() {
  const zone = $('zone');
  W = Math.max(200, zone.clientWidth || window.innerWidth);
  H = Math.max(200, zone.clientHeight || window.innerHeight);
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  const demo = $('demo');
  const dw = demo.clientWidth || 300, dh = demo.clientHeight || 200;
  demo.width = Math.round(dw * DPR); demo.height = Math.round(dh * DPR);
}
function geometrie(L, w, h) {
  const cw = Math.min(w * 0.88 / L.C, 118);
  const fh = Math.min(cw * 1.22, h / 5.4, 140);
  return { cw, fh, x0: (w - cw * L.C) / 2, w, h };
}
const ecranY = (G, f, cam) => -f * G.fh - cam;
const ecranX = (G, x) => G.x0 + (x + 0.5) * G.cw;
function cibleCamera(G, L, f) {
  let c = -f * G.fh - H * 0.66;
  c = Math.min(c, G.fh * 0.75 - H);                 // le trottoir reste en bas de l'écran
  c = Math.max(c, -L.F * G.fh - Math.max(G.fh * 2.4, 200)); // le toit reste sous les messages du haut
  return c;
}

/* ==========================================================================
   Partie : lancement, intro, boucle

function lancerNiveau(i) {

  lvl = construireNiveau(indexNiveau);
  b = { x: lvl.depart, f: 0, c: lvl.depart, fi: 0, etat: 'pose', nac: -1, face: 1, invul: 0, t: 0, frotte: 0, humeur: 0 };
  tempsRestant = lvl.limite; coeurs = 3; tempsNiveau = 0;
  particules = []; secousse = 0; finAttente = null; toitMessage = 0;
  frotteBouton = frotteTouche = false; frotteDistance = 0; sautEnAttente = 0;

function commencer() {

/* ---------- Saut ---------- */
function positionBulle() {
  if (b.nac >= 0) { const n = lvl.nacelles[b.nac]; return [n.c, Math.round(n.f)]; }
  return [b.c, b.fi];
}
function cibleSaut(c, f, d) {
  const nc = c + d;
  if (nc < 0 || nc >= lvl.C) return null;
  // Sur le toit, il manque des vitres : un saut de côté reprend d'abord le rebord juste en dessous
  if (f === lvl.F && vitresPropres() < lvl.min && lvl.ledges.has(cle(nc, f - 1)) && lvl.ledges.get(cle(nc, f - 1)).type === 'n') return { c: nc, f: f - 1, nac: -1 };
  for (const nf of [f + 1, f, f - 1]) {
    if (nf < 0 || nf > lvl.F) continue;
    if (nf === 0 || nf === lvl.F) return { c: nc, f: nf, nac: -1 };
    if (lvl.ledges.has(cle(nc, nf))) return { c: nc, f: nf, nac: -1 };
    for (let k = 0; k < lvl.nacelles.length; k++) {
      const n = lvl.nacelles[k];
      if (n.c === nc && Math.abs(n.f - nf) < 0.45) return { c: nc, f: nf, nac: k };
    }
  }
  return null;
}
function sauter(d) {
  if (etat !== 'jeu' || finAttente) return;
  initAudio();
  if (b.etat === 'saut' || b.etat === 'hesite' || b.etat === 'chute') { sautEnAttente = d; return; }
  b.face = d;
  const [c, f] = positionBulle();
  const cible = cibleSaut(c, f, d);
  b.x0 = b.x; b.y0 = b.f; b.t = 0;
  if (!cible) {
    b.etat = 'hesite'; b.dur = 0.32; jouer('hesite');
    return;
  }
  b.cible = cible; b.etat = 'saut'; b.dur = 0.36; b.arc = 0.5;
  b.nac = -1;
  jouer('saut');
}
function rebondir(c, f) {
  b.x0 = b.x; b.y0 = b.f; b.t = 0;
  b.cible = { c, f: f + 2, nac: -1 }; b.etat = 'saut'; b.dur = 0.55; b.arc = 1.0;
  jouer('rebond');
  for (let k = 0; k < 10; k++) ajouterParticule('petale', c, f + 0.1);
}
function atterrir() {
  const cible = b.cible;
  b.x = cible.c; b.c = cible.c;
  if (cible.nac >= 0) {
    b.nac = cible.nac; b.etat = 'nacelle'; b.f = lvl.nacelles[cible.nac].f; b.fi = Math.round(b.f);
    jouer('pose'); jouer('nacelle');
    return;
  }
  b.f = cible.f; b.fi = cible.f; b.etat = 'pose';
  jouer('pose');
  for (let k = 0; k < 4; k++) ajouterParticule('poussiere', b.c, b.fi);
  if (b.fi === lvl.F) { arriverToit(); return; }
  const R = lvl.ledges.get(cle(b.c, b.fi));
  if (!R) { executerAttente(); return; }
  if (R.type === 'j') { rebondir(b.c, b.fi); return; }
  // Pigeon posé ici : il s'envole sans gêner
  for (const p of lvl.pigeons) if ((p.etat === 'perche' || p.etat === 'alerte') && p.c === b.c && p.f === b.fi) { p.etat = 'fuite'; p.t = 0; jouer('ailes'); }
  if (R.bonus === 'temps') {
    R.bonus = null; tempsRestant += 5; jouer('bulle'); montrerMessage(tr('msg.temps'), 1.4);
    for (let k = 0; k < 12; k++) ajouterParticule('bulle', b.c, b.fi + 0.5);
  } else if (R.bonus === 'coeur') {
    R.bonus = null; jouer('coeur');
    if (coeurs < 3) { coeurs++; montrerMessage(tr('msg.coeur'), 1.4); } else { tempsRestant += 3; montrerMessage(tr('msg.coeurPlein'), 1.4); }
    for (let k = 0; k < 10; k++) ajouterParticule('etincelle', b.c, b.fi + 0.5);
    majHud();
  }
  if (R.volet && R.volet.etat === 'ouvert') { bousculer(); return; }
  executerAttente();
}
function executerAttente() {
  if (sautEnAttente && etat === 'jeu' && !finAttente && (b.etat === 'pose' || b.etat === 'nacelle')) {
    const d = sautEnAttente; sautEnAttente = 0; sauter(d);
  } else sautEnAttente = 0;
}

/* ---------- Descendre : Bulle se laisse glisser le long de sa corde ---------- */
function rebordDessous(c, depuis) {
  for (let ff = Math.ceil(depuis - 0.01) - 1; ff >= 1; ff--) {
    if (ff > depuis - 0.4) continue;
    const R = lvl.ledges.get(cle(c, ff));
    if (R && R.type === 'n') return ff;
  }
  return 0;
}
function descendre() {
  if (etat !== 'jeu' || finAttente) return;
  initAudio();
  if (b.etat !== 'pose' && b.etat !== 'nacelle') return;
  if (b.etat === 'pose' && b.fi === 0) { b.x0 = b.x; b.y0 = b.f; b.t = 0; b.etat = 'hesite'; b.dur = 0.32; jouer('hesite'); return; }
  const depart = b.f;
  b.nac = -1; b.etat = 'chute'; b.y0 = depart; b.cibleF = rebordDessous(b.c, depart); b.t = 0;
  b.dur = 0.3 + 0.1 * Math.min(6, depart - b.cibleF);
  jouer('glisse');
}

/* ---------- Bousculade : un cœur en moins, Bulle glisse au rebord du dessous ---------- */
function bousculer() {
  if (b.invul > 0 || finAttente) return;
  coeurs--; majHud();
  secousse = 0.4;
  jouer('bouscule');
  for (let k = 0; k < 8; k++) ajouterParticule('plume', b.x, b.f + 0.5);
  b.invul = 1.6; b.humeur = 1.2;
  if (coeurs <= 0) {
    b.etat = 'ko'; b.t = 0;
    finAttente = { t: 1.1, gagne: false, raison: 'coeurs' };
    return;
  }
  montrerMessage(tr('msg.oups'), 1.4);
  // Rebord du dessous (même colonne), sinon le trottoir
  const depart = b.f;
  const cibleF = rebordDessous(b.c, depart);
  b.nac = -1; b.etat = 'chute'; b.y0 = depart; b.cibleF = cibleF; b.t = 0;
  b.dur = 0.3 + 0.1 * Math.min(6, depart - cibleF);
  sautEnAttente = 0;
}

/* ---------- Toit ---------- */
function vitresPropres() { return lvl.vitres.filter((v) => v.sale <= 0).length; }
function arriverToit() {
  const propres = vitresPropres();
  if (propres >= lvl.min) {
    b.etat = 'danse'; b.t = 0;
    finAttente = { t: 1.5, gagne: true, raison: '' };
    jouer('victoire');
    for (let k = 0; k < 40; k++) ajouterParticule('confetti', b.x + (Math.random() - 0.5) * 3, lvl.F + 1 + Math.random());
    montrerMessage(tr('msg.toit'), 1.5);
  } else {
    jouer('manque');
    montrerMessage(tr('msg.manque', { n: lvl.min - propres }), 2.4);
    toitMessage = 2.4;
    executerAttente();
  }
}

/* ---------- Lavage ---------- */
function vitreSousBulle() {
  if (b.etat !== 'pose' || b.nac >= 0) return null;
  const R = lvl.ledges.get(cle(b.c, b.fi));
  return R ? R.vitre : null;
}
let messageVitre = 0;
function frotter(dt) {
  const demande = frotteBouton || frotteTouche;
  let quantite = 0;
  if (demande) quantite += 1.3 * dt;
  if (frotteDistance > 0) { quantite += Math.min(frotteDistance, 900 * dt) / 360; frotteDistance = 0; }
  b.frotte = Math.max(0, b.frotte - dt);
  if (quantite <= 0) return;
  const v = vitreSousBulle();
  if (!v || v.sale <= 0) {
    if (messageVitre <= 0 && (b.etat === 'pose' || b.etat === 'nacelle')) {
      montrerMessage(v ? tr('msg.dejaPropre') : tr('msg.pasDeVitre'), 1.2);
      messageVitre = 1.6;
    }
    return;
  }
  b.frotte = 0.25;
  const avant = v.sale;
  v.sale = Math.max(0, v.sale - quantite);
  sonFrotte -= dt;
  if (sonFrotte <= 0) { jouer('frotte'); sonFrotte = 0.13; if (Math.random() < 0.5) ajouterParticule('bulle', b.c + (Math.random() - 0.5) * 0.5, b.fi + 0.55); }
  if (Math.ceil(avant) === 2 && Math.ceil(v.sale) === 1) { jouer('tic'); for (let k = 0; k < 4; k++) ajouterParticule('etincelle', b.c, b.fi + 0.5); }
  if (v.sale <= 0) vitreBrille(v);
}
function vitreBrille(v) {
  v.sale = 0; v.propre = true; v.coucou = 0;
  jouer('brille'); jouer('coucou');
  for (let k = 0; k < 14; k++) ajouterParticule('etincelle', v.c + (Math.random() - 0.5) * 0.7, v.f + 0.5 + (Math.random() - 0.3) * 0.5);
  majHud(true);
}

/* ---------- Mise à jour du monde ---------- */
function majMonde(dt) {
  tempsNiveau += dt;
  messageVitre -= dt;
  if (toitMessage > 0) toitMessage -= dt;
  if (b.invul > 0) b.invul -= dt;
  if (b.humeur > 0) b.humeur -= dt;
  // Fin en cours (danse ou KO)
  if (finAttente) {
    b.t += dt;
    finAttente.t -= dt;
    if (finAttente.t <= 0) { const f = finAttente; finAttente = null; afficherFin(f.gagne, f.raison); }
    majNacelles(dt);
    return;
  }
  // Chrono
  tempsRestant -= dt;
  if (tempsRestant <= 0) {
    tempsRestant = 0;
    b.etat = 'ko'; b.t = 0; b.humeur = 2;
    finAttente = { t: 0.9, gagne: false, raison: 'temps' };
    return;
  }
  majChrono();
  majNacelles(dt);
  // Bulle
  if (b.etat === 'saut') {
    b.t += dt;
    const k = Math.min(1, b.t / b.dur);
    let ty = b.cible.f;
    if (b.cible.nac >= 0) ty = lvl.nacelles[b.cible.nac].f;
    b.x = lerp(b.x0, b.cible.c, k);
    b.f = lerp(b.y0, ty, k) + b.arc * 4 * k * (1 - k);
    if (k >= 1) atterrir();
  } else if (b.etat === 'hesite') {
    b.t += dt;
    const k = Math.min(1, b.t / b.dur);
    b.f = b.y0 + 0.12 * Math.sin(k * Math.PI);
    b.x = b.x0 + b.face * 0.08 * Math.sin(k * Math.PI);
    if (b.nac >= 0) b.f = lvl.nacelles[b.nac].f + 0.12 * Math.sin(k * Math.PI);
    if (k >= 1) { b.x = b.x0; b.f = b.nac >= 0 ? lvl.nacelles[b.nac].f : b.y0; b.etat = b.nac >= 0 ? 'nacelle' : 'pose'; executerAttente(); }
  } else if (b.etat === 'chute') {
    b.t += dt;
    const k = Math.min(1, b.t / b.dur);
    b.f = b.y0 - (b.y0 - b.cibleF) * k * k;
    if (k >= 1) { b.cible = { c: b.c, f: b.cibleF, nac: -1 }; atterrir(); }
  } else if (b.etat === 'nacelle') {
    const n = lvl.nacelles[b.nac];
    b.f = n.f; b.fi = Math.round(n.f); b.x = n.c;
  }
  frotter(dt);
  majVolets(dt);
  majPigeons(dt);
  majPluie(dt);
  lvl.vitres.forEach((v) => { if (v.coucou >= 0) { v.coucou += dt; if (v.coucou > 3.4) v.coucou = -1; } });
}
function majNacelles(dt) {
  for (const n of lvl.nacelles) {
    if (n.attente > 0) { n.attente -= dt; continue; }
    n.f += n.dir * n.vitesse * dt;
    if (n.f >= n.fb) { n.f = n.fb; n.dir = -1; n.attente = 0.7; }
    if (n.f <= n.fa) { n.f = n.fa; n.dir = 1; n.attente = 0.7; }
  }
}
function majVolets() {
  lvl.ledges.forEach((R) => {
    if (!R.volet) return;
    const V = R.volet;
    const p = (tempsNiveau + V.phase) % V.periode;
    let e = 'calme';
    if (p > V.periode - 1.0) e = 'ouvert';
    else if (p > V.periode - 1.9) e = 'tremble';
    const visible = Math.abs(R.f - b.f) < 4;
    if (e !== V.etat) {
      if (e === 'ouvert' && visible) jouer('clac');
      if (e === 'tremble' && visible && Math.abs(R.f - b.f) < 2) jouer('tremble');
      V.etat = e;
    }
    if (e === 'ouvert' && b.etat === 'pose' && b.nac < 0 && b.c === R.c && b.fi === R.f) bousculer();
  });
}
function majPigeons(dt) {
  const [bc, bf] = positionBulle();
  const pose = b.etat === 'pose' || b.etat === 'nacelle';
  for (const p of lvl.pigeons) {
    p.battement += dt;
    p.t += dt;
    if (p.etat === 'perche') {
      if (pose && Math.abs(bc - p.c) === 1 && Math.abs(bf - p.f) <= 1) { p.etat = 'alerte'; p.t = 0; p.dir = bc > p.c ? 1 : -1; jouer('ailes'); }
    } else if (p.etat === 'alerte') {
      if (p.t > 0.9) { p.etat = 'vol'; p.t = 0; p.x = p.c; }
    } else if (p.etat === 'vol') {
      p.x += p.dir * 3.0 * dt;
      if (Math.abs(p.x - b.x) < 0.42 && Math.abs(p.f + 0.3 - (b.f + 0.3)) < 0.42 && b.etat !== 'ko' && b.etat !== 'danse') bousculer();
      if (p.x < -1.5 || p.x > lvl.C + 0.5) { p.etat = 'parti'; p.t = 0; }
    } else if (p.etat === 'fuite') {
      if (p.t > 1.2) { p.etat = 'parti'; p.t = 0; }
    } else if (p.etat === 'parti') {
      const loin = Math.abs(bc - p.c) > 1 || Math.abs(bf - p.f) > 1;
      const occupe = b.c === p.c && b.fi === p.f && b.nac < 0;
      if (p.t > 7 && loin && !occupe) { p.etat = 'retour'; p.t = 0; }
    } else if (p.etat === 'retour') {
      if (p.t > 0.8) { p.etat = 'perche'; p.t = 0; p.x = p.c; }
    }
  }
}
function majPluie(dt) {
  if (!pluie) return;
  pluie.t -= dt;
  if (pluie.etat === 'sec' && pluie.t <= 2.6) { pluie.etat = 'annonce'; montrerMessage(tr('msg.pluie'), 2); }
  else if (pluie.etat === 'annonce' && pluie.t <= 0) { pluie.etat = 'pluie'; pluie.t = 3.2; jouer('pluie'); }
  else if (pluie.etat === 'pluie') {
    if (Math.random() < dt * 3) jouer('pluie');
    if (pluie.t <= 0) {
      const propres = lvl.vitres.filter((v) => v.sale <= 0);
      let n = Math.min(lvl.def.pluie.nb, propres.length);
      for (let k = propres.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [propres[k], propres[j]] = [propres[j], propres[k]]; }
      for (let k = 0; k < n; k++) {
        const v = propres[k];
        v.sale = 1; v.propre = false; v.coucou = -1;
        for (let q = 0; q < 6; q++) ajouterParticule('goutte', v.c + (Math.random() - 0.5) * 0.6, v.f + 0.8);
      }
      if (n > 0) { montrerMessage(tr('msg.resali', { n }), 2); majHud(); }
      pluie.etat = 'sec'; pluie.t = lvl.def.pluie.tous;
    }
  }
}

/* ---------- Particules (coordonnées du monde : colonne, étage) ---------- */
function ajouterParticule(type, x, f) {
  const p = { type, x, f, vx: (Math.random() - 0.5) * 2, vf: Math.random() * 1.5 + 0.5, vie: 1, duree: 0.8 + Math.random() * 0.6, rot: Math.random() * 6, taille: 0.5 + Math.random() * 0.6 };
  if (type === 'confetti') { p.vx = (Math.random() - 0.5) * 3; p.vf = Math.random() * 2; p.duree = 1.6 + Math.random(); p.couleur = COULEURS[Math.floor(Math.random() * COULEURS.length)]; }
  if (type === 'plume') { p.vf = Math.random() * 0.8; p.duree = 1.3; }
  if (type === 'goutte') { p.vx = 0; p.vf = -1; p.duree = 0.8; }
  if (type === 'poussiere') { p.vf = 0.2 + Math.random() * 0.4; p.vx = (Math.random() - 0.5) * 1.6; p.duree = 0.4; }
  if (type === 'petale') { p.couleur = ['#ff8fab', '#ffd166', '#f15bb5', '#fff'][Math.floor(Math.random() * 4)]; }
  particules.push(p);
  if (particules.length > 260) particules.shift();
}
function majParticules(dt) {
  for (const p of particules) {
    p.vie -= dt / p.duree;
    p.x += p.vx * dt; p.f += p.vf * dt; p.rot += dt * 4;
    if (p.type === 'confetti' || p.type === 'petale') p.vf -= 3 * dt;
    else if (p.type === 'plume') { p.vf -= 0.6 * dt; p.vx *= 0.98; }
    else if (p.type === 'goutte') p.vf -= 4 * dt;
    else if (p.type === 'bulle') { p.vf = 0.8; p.vx *= 0.95; }
    else p.vf -= 1.5 * dt;
  }
  particules = particules.filter((p) => p.vie > 0);
}

/* ==========================================================================
   Dessin
   ========================================================================== */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function etoile4(c, x, y, r) {
  c.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; const rr2 = k % 2 ? r * 0.35 : r; c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  c.closePath();
}
function coeurForme(c, x, y, s) {
  c.beginPath();
  c.moveTo(x, y + s * 0.35);
  c.bezierCurveTo(x - s * 0.9, y - s * 0.2, x - s * 0.4, y - s * 0.85, x, y - s * 0.35);
  c.bezierCurveTo(x + s * 0.4, y - s * 0.85, x + s * 0.9, y - s * 0.2, x, y + s * 0.35);
  c.closePath();
}

/* Ciel, soleil, nuages et silhouettes lointaines */
function peindreCiel(c, w, h, th, cam, t) {
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, th.ciel1); g.addColorStop(1, th.ciel2);
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // Soleil
  c.fillStyle = 'rgba(255,240,170,.9)';
  c.beginPath(); c.arc(w * 0.82, h * 0.16 - cam * 0.02 % 40, Math.min(w, h) * 0.07, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,240,170,.25)';
  c.beginPath(); c.arc(w * 0.82, h * 0.16 - cam * 0.02 % 40, Math.min(w, h) * 0.11, 0, Math.PI * 2); c.fill();
  // Nuages (défilent lentement)
  c.fillStyle = 'rgba(255,255,255,.85)';
  for (let k = 0; k < 5; k++) {
    const nx = ((k * 157 + t * (6 + k * 2)) % (w + 160)) - 80;
    const ny = ((k * 211 - cam * 0.15) % (h + 120) + h + 120) % (h + 120) - 60;
    c.beginPath();
    c.arc(nx, ny, 18, 0, Math.PI * 2); c.arc(nx + 20, ny - 8, 22, 0, Math.PI * 2); c.arc(nx + 44, ny, 16, 0, Math.PI * 2);
    c.fill();
  }
  // Immeubles lointains
  c.fillStyle = th.loin;
  const sol = -cam * 0.3 + h * 0.2;
  for (let k = 0; k < 9; k++) {
    const bw = w / 7, bx = k * bw * 0.9 - 10;
    const bh = 120 + ((k * 73) % 5) * 45;
    c.fillStyle = th.loin;
    c.fillRect(bx, sol + h * 0.6 - bh, bw * 0.8, bh + h);
    // Petites fenêtres des immeubles lointains
    c.fillStyle = 'rgba(255,255,255,.35)';
    let rang = 0;
    for (let yy = sol + h * 0.6 - bh + 12; yy < h; yy += 22, rang++) {
      if (yy < -12) continue;
      let q = 0;
      for (let xx = bx + 8; xx < bx + bw * 0.8 - 10; xx += 16, q++) if ((k * 3 + rang * 7 + q * 5) % 4 !== 0) c.fillRect(xx, yy, 7, 10);
    }
  }
}

/* Une vitre : cadre, verre, habitant qui fait coucou, saleté, reflets */
function peindreVitre(c, x, y, w, h, o) {
  const th = o.theme;
  c.fillStyle = th.cadre;
  rr(c, x - 3, y - 3, w + 6, h + 6, 5); c.fill();
  const g = c.createLinearGradient(x, y, x + w, y + h);
  if (o.atteignable) { g.addColorStop(0, '#a9dcf7'); g.addColorStop(1, '#e3f5ff'); }
  else { g.addColorStop(0, '#8fb6cf'); g.addColorStop(1, '#bcd6e6'); }
  c.fillStyle = g; c.fillRect(x, y, w, h);
  const hasard2 = hasard(o.graine || 1);
  // Intérieur : lampe et meuble
  c.fillStyle = 'rgba(255,230,160,.35)';
  c.beginPath(); c.arc(x + w * (0.25 + hasard2() * 0.5), y + h * 0.18, w * 0.12, 0, Math.PI * 2); c.fill();
  // Habitant qui fait coucou
  if (o.coucou >= 0) {
    const montee = Math.min(1, o.coucou / 0.35) * Math.min(1, (3.4 - o.coucou) / 0.35);
    const px = x + w * 0.5, py = y + h * (1.05 - 0.5 * montee);
    const peau = ['#ffd2a8', '#c68642', '#8d5524', '#f1c27d', '#e0ac69'][o.graine % 5];
    const cheveux = ['#4a2c17', '#111', '#e0b64a', '#a0522d', '#d9d9d9', '#7b3f00'][o.graine % 6];
    const habit = ['#ff8fab', '#90be6d', '#577590', '#f9c74f', '#9b5de5'][o.graine % 5];
    c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
    c.fillStyle = habit; rr(c, px - w * 0.2, py + h * 0.12, w * 0.4, h * 0.5, 8); c.fill();
    c.fillStyle = peau; c.beginPath(); c.arc(px, py, h * 0.16, 0, Math.PI * 2); c.fill();
    c.fillStyle = cheveux; c.beginPath(); c.arc(px, py - h * 0.05, h * 0.165, Math.PI, 0); c.fill();
    c.fillStyle = '#23324a';
    c.beginPath(); c.arc(px - h * 0.055, py, h * 0.02, 0, Math.PI * 2); c.arc(px + h * 0.055, py, h * 0.02, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#23324a'; c.lineWidth = 1.6;
    c.beginPath(); c.arc(px, py + h * 0.04, h * 0.05, 0.2, Math.PI - 0.2); c.stroke();
    // Bras qui fait coucou
    const a = -0.9 + Math.sin(o.coucou * 12) * 0.45;
    c.strokeStyle = peau; c.lineWidth = Math.max(3, w * 0.08); c.lineCap = 'round';
    c.beginPath(); c.moveTo(px + w * 0.16, py + h * 0.2); c.lineTo(px + w * 0.16 + Math.cos(a) * h * 0.25, py + h * 0.2 + Math.sin(a) * h * 0.25); c.stroke();
    c.restore();
  } else if (!o.atteignable) {
    // Rideaux tirés
    const coul = ['#f7b267', '#f4845f', '#9ad1d4', '#c3aed6', '#b5e48c'][o.graine % 5];
    c.fillStyle = coul;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + w * 0.42, y); c.quadraticCurveTo(x + w * 0.2, y + h * 0.5, x + w * 0.3, y + h); c.lineTo(x, y + h); c.fill();
    c.beginPath(); c.moveTo(x + w, y); c.lineTo(x + w * 0.58, y); c.quadraticCurveTo(x + w * 0.8, y + h * 0.5, x + w * 0.7, y + h); c.lineTo(x + w, y + h); c.fill();
  }
  // Saleté
  if (o.sale > 0) {
    const frac = o.sale / Math.max(1, o.max);
    const h3 = hasard(o.graine || 7);
    c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
    for (let k = 0; k < 9; k++) {
      const sx = x + h3() * w, sy = y + h3() * h, sr = (0.14 + h3() * 0.2) * Math.min(w, h);
      c.fillStyle = `rgba(122,88,52,${0.22 + 0.5 * frac})`;
      c.beginPath(); c.ellipse(sx, sy, sr, sr * 0.75, h3() * 3, 0, Math.PI * 2); c.fill();
    }
    if (o.sale > 1) {
      for (let k = 0; k < 6; k++) {
        const sx = x + h3() * w, sy = y + h3() * h, sr = (0.08 + h3() * 0.1) * Math.min(w, h);
        c.fillStyle = 'rgba(84,58,30,.75)';
        c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(sx + sr, sy + sr * 0.6, sr * 0.5, 0, Math.PI * 2); c.fill();
      }
    }
    c.restore();
  } else if (o.propre) {
    // Reflets brillants
    c.save(); c.beginPath(); c.rect(x, y, w, h); c.clip();
    const brille = (Math.sin(o.t * 2 + (o.graine % 10)) + 1) / 2;
    c.fillStyle = `rgba(255,255,255,${0.35 + brille * 0.3})`;
    c.beginPath(); c.moveTo(x + w * 0.1, y + h); c.lineTo(x + w * 0.35, y + h); c.lineTo(x + w * 0.85, y); c.lineTo(x + w * 0.6, y); c.fill();
    c.restore();
    if (brille > 0.92) { c.fillStyle = '#fff'; etoile4(c, x + w * 0.78, y + h * 0.2, Math.min(w, h) * 0.12); c.fill(); }
  } else {
    c.fillStyle = 'rgba(255,255,255,.25)';

/* ---------- Image principale ---------- */
function dessinerJeu() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!lvl || etat === 'titre' || etat === 'niveaux' || etat === 'vestiaire' || etat === 'bilan') { dessinerTitre(); return; }
  const G = geometrie(lvl, W, H);
  const cible = cibleCamera(G, lvl, b.f);
  if (!camPrete) { camY = cible; camPrete = true; }
  if (etat === 'jeu') camY += (cible - camY) * Math.min(1, 0.12);
  ctx.save();
  if (secousse > 0) ctx.translate((Math.random() - 0.5) * secousse * 18, (Math.random() - 0.5) * secousse * 18);
  dessinerScene(ctx, W, H, lvl, b, camY, tempsGlobal, null);
  ctx.restore();
  // Pluie
  if (pluie && (pluie.etat === 'annonce' || pluie.etat === 'pluie')) {
    const k = pluie.etat === 'annonce' ? 1 - pluie.t / 2.6 : 1;
    ctx.fillStyle = `rgba(40,60,90,${0.22 * k})`; ctx.fillRect(0, 0, W, H);
    // Nuage
    ctx.fillStyle = `rgba(120,135,160,${0.95 * k})`;
    const nx = W * 0.5 - (1 - k) * W * 0.6;
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(nx - 90 + i * 36, 30 + (i % 2) * 10, 34, 0, Math.PI * 2); ctx.fill(); }
    if (pluie.etat === 'pluie') {
      ctx.strokeStyle = 'rgba(180,215,255,.75)'; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 70; i++) {
        const x = (i * 53.7 + tempsGlobal * 90) % W, y = (i * 97.3 + tempsGlobal * 620) % H;
        ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14);
      }
      ctx.stroke();
    }
  }
  // Flèches discrètes de part et d'autre de Bulle au début
  if (etat === 'jeu' && tempsNiveau < 4 && indexNiveau === 0 && b.etat === 'pose') {
    const bx = ecranX(G, b.x), by = ecranY(G, b.f, camY) - G.fh * 0.35;
    ctx.globalAlpha = 0.5 + 0.4 * Math.sin(tempsGlobal * 6);
    ctx.fillStyle = '#fff';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(bx + s * G.cw * 0.55, by - 12); ctx.lineTo(bx + s * G.cw * 0.8, by); ctx.lineTo(bx + s * G.cw * 0.55, by + 12); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
}

/* ---------- Dessin de l'écran titre (sert aussi de jaquette) ---------- */
let decorTitre = null;
function preparerDecor() {
  const L = { C: 3, F: 9, ledges: new Map(), bloque: new Set(), nacelles: [], vitres: [], pigeons: [], depart: 1, theme: THEMES.maisons, quartier: 'maisons' };
  for (let f = 1; f <= 8; f++) for (let c = 0; c < 3; c++) {
    if ((c + f) % 3 === 0 && f !== 4) continue;
    L.ledges.set(cle(c, f), { c, f, type: (c === 2 && f === 3) ? 'j' : 'n', vitre: null, volet: null, bonus: null });
  }
  const sale = (c, f, s) => { const R = L.ledges.get(cle(c, f)); if (R && R.type === 'n') { R.vitre = { c, f, max: 2, sale: s, propre: s === 0, coucou: -1, graine: c * 7 + f * 13 }; L.vitres.push(R.vitre); } };
  sale(1, 4, 1.2); sale(0, 5, 2); sale(2, 5, 0); sale(1, 2, 0); sale(0, 4, 0); sale(2, 4, 0.6); sale(1, 6, 0); sale(2, 7, 1.6);
  L.pigeons.push({ c: 0, f: 2, x: 0, etat: 'perche', t: 0, dir: 1, battement: 0 });
  decorTitre = { L, B: { x: 1, f: 4, face: 1, frotte: 1, humeur: 0, invul: 0, etat: 'pose' } };
}
function dessinerTitre() {
  if (!decorTitre) preparerDecor();
  const { L, B } = decorTitre;
  // Les habitants des vitres propres font coucou chacun leur tour
  L.vitres.forEach((v, k) => {
    if (v.sale <= 0) { const cyc = (tempsGlobal + k * 1.3) % 6; v.coucou = cyc < 3.4 ? cyc : -1; }
  });
  const G = geometrie(L, W, H);
  const cam = -4.3 * G.fh - H * 0.6;
  dessinerScene(ctx, W, H, L, B, cam, tempsGlobal, { coucou: {} });
  // Bulles de savon autour de l'éponge
  const bx = ecranX(G, B.x), by = ecranY(G, B.f, cam);
  for (let k = 0; k < 6; k++) {
    const a = tempsGlobal * 0.8 + k;
    const px = bx + Math.sin(a * 1.7 + k) * 40 + 20, py = by - 70 - ((tempsGlobal * 30 + k * 25) % 120);
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(px, py, 4 + (k % 3) * 2, 0, Math.PI * 2); ctx.stroke();
  }
}

const INTROS = {

  jardiniere: 1, coeur: 1, pluie: 1, nacelle: 1, verre: 1, deuxnacelles: 1,

}

/* Mini-scène de démonstration */
function peindreMain(c, x, y, s, appui) {
  c.save(); c.translate(x, y + (appui ? 4 : 0));
  c.fillStyle = '#fff'; c.strokeStyle = '#23324a'; c.lineWidth = 2;
  rr(c, -s * 0.1, -s * 0.05, s * 0.2, s * 0.5, s * 0.1); c.fill(); c.stroke();
  rr(c, -s * 0.22, s * 0.25, s * 0.5, s * 0.45, s * 0.18); c.fill(); c.stroke();
  c.restore();
  if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; c.beginPath(); c.arc(x, y - 2, s * 0.3, 0, Math.PI * 2); c.stroke(); }
}
function bulleSurChemin(chemin, t) {
  // chemin : [{ t, c, r }] ; saut de 0,35 s entre deux points
  let p = chemin[0];
  for (let k = 1; k < chemin.length; k++) {
    const q = chemin[k];
    if (t < q.t) return p.c === undefined ? p : { x: p.c, y: p.r, saut: false };
    if (t < q.t + 0.35) {
      const kk = (t - q.t) / 0.35;
      return { x: lerp(p.c, q.c, kk), y: lerp(p.r, q.r, kk) + (q.arc || 0.5) * 4 * kk * (1 - kk), saut: true, face: q.c >= p.c ? 1 : -1 };
    }
    p = q;
  }
  return { x: p.c, y: p.r, saut: false };
}
function dessinerDemo() {
  if (!intro) return;

  c.setTransform(DPR, 0, 0, DPR, 0, 0);

  const hb = Math.min(cw * 0.7, fh * 0.62);

    c.fillStyle = dore ? '#ffc93c' : '#c9d6e6'; c.beginPath(); c.moveTo(x0 + 10, Y(r) - fh * 0.6); c.lineTo(x0 + 40, Y(r) - fh * 0.5); c.lineTo(x0 + 10, Y(r) - fh * 0.4); c.fill();
