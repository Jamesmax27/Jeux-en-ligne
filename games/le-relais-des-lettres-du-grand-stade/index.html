  // Grand stade de l'écran titre (aussi la jaquette) : tribunes, public,
  // piste rouge et quatre coureurs qui se passent le témoin.
  let titreAnim = 0;
  function dessinerTitre(t) {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    t = t || 0;
    // ciel
    let g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#3a7bea'); g.addColorStop(0.45, '#9fd0ff'); g.addColorStop(1, '#e6f3ff');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // soleil et nuages
    c.fillStyle = '#fff6c2'; rond(c, w * 0.84, h * 0.1, Math.min(w, h) * 0.07); c.fill();
    c.fillStyle = '#ffffffd0';
    [[0.18, 0.12, 1], [0.6, 0.07, 0.8]].forEach((n) => { const x = ((n[0] * w + t * 0.008 * w * n[2]) % (w + 160)) - 80, y = n[1] * h, k = Math.min(w, h) * 0.05; ell(c, x, y, k * 1.6, k * 0.7); c.fill(); ell(c, x + k, y - k * 0.3, k, k * 0.7); c.fill(); });

      const pas = 15 + r * 1.5;
      for (let x = 6; x < w; x += pas) {

        const saut = Math.max(0, Math.sin(t * 0.006 + x * 0.05 + r)) * 3;

  let partie = null;

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'vestiaire', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') relancerTitre();

  function toast(texte, duree) {
    const el = $('toast');

  }

  // Cartes des 4 places, en haut de l'écran, et les mêmes dans le salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'tete'; cv.width = 92; cv.height = 92;

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }

  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;

  function siegesActuels() {
    if (!partie) return [];

  }
  // Comment appeler la place s dans les messages : « toi », pseudo ou « le coureur rouge ».
  function quiEst(s) {
    const info = siegesActuels()[s] || {};

    if (info.humain && info.nom) return info.nom;
    return tr('coureur.' + s);
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();

    for (let s = 0; s < PLACES; s++) {
      // Avant la création de la partie solo (tutoriel), la place 0 est déjà « Toi ».
      const d = $('place-' + s), info = sieges[s] || { humain: s === 0 && session === 'solo', moi: s === 0 && session === 'solo' };
      const pts = e ? e.sc[s] : 0, med = e ? e.md[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      const m = d.querySelector('.med');
      const texteMed = nb(med);
      if (m.dataset.n !== texteMed) { m.dataset.n = texteMed; m.innerHTML = ICONE_MEDAILLE('#ffc928'); const sp = document.createElement('span'); sp.textContent = texteMed; m.appendChild(sp); }
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { coureur: tr('coureur.' + s), points: pts, medailles: med }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (modeDon) return tr('tour.donner', { nom: quiEst((s + 1) % PLACES) });
      if (!O.jouables(e, s).length) return tr('tour.bloque');
      return tr('tour.toi');
    }
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function nomStade(st) { return tr('stade.' + st); }

  function majInfos() {
    let info = '';

    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, stade: nomStade(st) });
    else if (partie && partie.manche > 0 && vue) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche, stade: nomStade(st) });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');

  }

  // Piste du mot : 9 cases, haies, case témoin, lettres posées (couleur du coureur).
  function majPiste() {
    const boite = $('piste');
    const maintenant = Date.now();
    const f = fige && fige.jusqua > maintenant ? fige : null;
    const e = vue;
    const mot = f ? f.mot : (e ? e.mot : []);
    const haies = f ? f.h : (e ? e.h : []);
    const tm = f ? f.tm : (e ? e.tm : -1);
    const st = e ? e.st : 0;
    boite.dataset.st = String(st);
    boite.classList.toggle('fini', !!f);
    let maxLen = O.cases;
    if (e && !f) { const c = O.compat(e, O.prefixe(e)); maxLen = c.reduce((a, w) => Math.max(a, w.length), mot.length + 1); }
    const cle = JSON.stringify([mot, haies, tm, st, !!f, maxLen, partie && partie.phase]);
    if (boite.dataset.cle !== cle) {
      boite.dataset.cle = cle;
      boite.textContent = '';
      for (let i = 0; i < O.cases; i++) {
        const d = document.createElement('div');
        d.className = 'case';
        d.id = 'case-' + i;
        if (haies.indexOf(i) >= 0) { d.classList.add('haie'); d.insertAdjacentHTML('beforeend', SVG_HAIE); d.title = tr('case.haie'); }
        if (i === tm) { d.insertAdjacentHTML('beforeend', SVG_TEMOIN); d.title = tr('case.temoin'); }
        if (i < mot.length) {
          const x = mot[i];
          d.classList.add('pleine');
          if (x.q < 0) { d.classList.add('arbitre'); d.insertAdjacentHTML('beforeend', SVG_SIFFLET); d.title = tr('case.arbitre'); }
          else { d.style.setProperty('--c', COUL[x.q]); d.style.setProperty('--f', COUL_C[x.q]); }
          if (x.s) d.classList.add('sprint');
          const l = document.createElement('span'); l.className = 'lettre'; l.textContent = x.l;
          d.appendChild(l);
        } else if (i === mot.length && !f && e && partie && partie.phase === 'jeu') d.classList.add('suivante');
        else if (i >= maxLen) d.classList.add('loin');
        boite.appendChild(d);
      }
    }
    boite.setAttribute('aria-label', mot.length ? tr('piste.aria', { mot: mot.map((x) => x.l).join('') }) : tr('piste.vide'));
    // mots encore possibles
    let txt = '';
    if (f) txt = tr('piste.fini', { mot: mot.map((x) => x.l).join('') });
    else if (e && partie && partie.phase === 'jeu') {
      const c = O.compat(e, O.prefixe(e));
      if (!e.mot.length) txt = tr('piste.vide');
      else {
        const vus = c.slice(0, 4).join(' · ');
        txt = tr('piste.possibles', { mots: vus }) + (c.length > 4 ? ' ' + tr('piste.autres', { n: c.length - 4 }) : '');
      }
    }
    if ($('possibles').textContent !== txt) $('possibles').textContent = txt;
    // progression de la manche : un rond par mot
    const pr = $('progres');
    const W = e ? e.W : 0;
    const clep = e ? JSON.stringify([W, e.hist.map((x) => x.q)]) : '';
    if (pr.dataset.cle !== clep) {
      pr.dataset.cle = clep;
      pr.textContent = '';
      for (let k = 0; k < W; k++) {
        const i = document.createElement('i');
        if (k < e.hist.length) { i.className = 'fait'; i.style.setProperty('--c', COUL[e.hist[k].q]); }
        else if (k === e.hist.length) i.className = 'encours';
        pr.appendChild(i);
      }
    }
  }

  // Réserve de lettres du joueur de l'appareil.
  function majMain() {
    const boite = $('main');

    const moi = partie ? partie.siege : -1;
    const main = e && moi >= 0 ? e.m[moi] : [];
    const monTour = !!(partie && partie.phase === 'jeu' && e && moi >= 0 && R.aQui(e) === moi && !attenteTuto && !(fige && fige.jusqua > Date.now()));
    const ok = e && moi >= 0 ? O.jouables(e, moi) : [];
    if (sel >= main.length) sel = Math.max(0, main.length - 1);
    const cle = JSON.stringify([main, ok, monTour, sel, modeDon, clavierActif]);
    if (boite.dataset.cle !== cle) {
      boite.dataset.cle = cle;
      boite.textContent = '';
      main.forEach((x, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tuile';
        b.id = 'tuile-' + i;
        if (x.s) { b.classList.add('sprint'); b.insertAdjacentHTML('beforeend', ICONE_ECLAIR); }
        const l = document.createElement('span'); l.textContent = x.l; b.appendChild(l);
        if (modeDon) {
          if (i === modeDon.i) b.classList.add('pose'); else b.classList.add('don');
        } else if (monTour) b.classList.add(ok.indexOf(i) >= 0 ? 'ok' : 'non');
        if (clavierActif && i === sel && monTour) b.classList.add('sel');
        b.setAttribute('aria-label', tr(x.s ? 'main.sprint' : 'main.aria', { l: x.l }));
        b.addEventListener('click', () => { audio(); toucherTuile(i, b); });
        boite.appendChild(b);
      });
    }
    let titre = '';
    if (partie && partie.phase === 'jeu' && moi < 0) titre = tr('main.attente');
    else if (main.length) titre = tr('main.titre');
    if ($('main-titre').textContent !== titre) $('main-titre').textContent = titre;
    const bloque = monTour && !modeDon && ok.length === 0;
    $('btn-changer').hidden = !bloque;
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majPiste();
    majMain();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Bande du stade (canvas) : couloirs, coureurs qui avancent, témoin
  // ---------------------------------------------------------------------

  function dessinerStade(t, dt) {

    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const e = vue, st = e ? e.st : 0;

    const haut = Math.max(14, h * 0.2);

    else if (st === 2) { c.fillStyle = '#e9e2d4'; c.fillRect(0, 0, w, haut); c.fillStyle = '#d9a35e'; c.fillRect(0, haut, w, h - haut); c.strokeStyle = '#c48a46'; c.lineWidth = 1; for (let x = 0; x < w; x += 26) { c.beginPath(); c.moveTo(x, haut); c.lineTo(x - 10, h); c.stroke(); } }
    else { const g = c.createLinearGradient(0, 0, 0, haut); g.addColorStop(0, '#7fb4ef'); g.addColorStop(1, '#cfe4fb'); c.fillStyle = g; c.fillRect(0, 0, w, haut); c.fillStyle = '#f4f8fd'; c.fillRect(0, haut, w, h - haut); c.fillStyle = '#ffffff'; for (let k = 0; k < 6; k++) { c.beginPath(); c.moveTo(k * w / 5 - 30, haut); c.lineTo(k * w / 5, haut - 10 - (k % 2) * 6); c.lineTo(k * w / 5 + 30, haut); c.fill(); } }
    // public / décor du haut
    const hasard = graineHasard(5 + st);
    if (st === 0 || st === 2) {
      for (let x = 6; x < w; x += 11) { c.fillStyle = ['#ff5a4f', '#ffd23f', '#3fd16b', '#5ab0ff', '#ffffff'][Math.floor(hasard() * 5)]; rond(c, x, haut * 0.55 - Math.max(0, Math.sin(t * 0.006 + x)) * 2, Math.min(4.5, haut * 0.22)); c.fill(); }
    } else if (st === 1) {
      c.fillStyle = '#ffffff'; for (let x = 0; x < w; x += 18) { c.fillRect(x, haut * 0.35, 9, haut * 0.3); }
    } else {
      for (let x = 20; x < w; x += 60) { c.fillStyle = (x / 60) % 2 < 1 ? '#e0413a' : '#2f6fe0'; c.fillRect(x, haut - 16, 3, 14); c.beginPath(); c.moveTo(x + 3, haut - 16); c.lineTo(x + 13, haut - 12); c.lineTo(x + 3, haut - 8); c.fill(); }
    }
    // couloirs
    const lh = (h - haut) / PLACES;
    for (let k = 0; k <= PLACES; k++) {
      const y = haut + k * lh;
      if (st === 1 && k > 0 && k < PLACES) { for (let x = 4; x < w; x += 10) { c.fillStyle = (x / 10) % 2 < 1 ? '#e0413a' : '#ffffff'; rond(c, x, y, 2.4); c.fill(); } }
      else { c.strokeStyle = st === 3 ? '#b8cde6' : '#ffffffaa'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
    }
    // vagues de la piscine
    if (st === 1) { c.strokeStyle = '#ffffff55'; c.lineWidth = 1.5; for (let k = 0; k < PLACES; k++) { c.beginPath(); for (let x = 0; x <= w; x += 6) c.lineTo(x, haut + (k + 0.75) * lh + Math.sin(x * 0.08 + t * 0.004 + k) * 2); c.stroke(); } }
    // ligne d'arrivée en damier
    const xa = w - 22;
    for (let y = haut, k = 0; y < h; y += 6, k++) { c.fillStyle = k % 2 ? '#1d2433' : '#ffffff'; c.fillRect(xa, y, 6, 6); c.fillStyle = k % 2 ? '#ffffff' : '#1d2433'; c.fillRect(xa + 6, y, 6, 6); }
    if (!e) return;
    // coureurs : ils avancent avec leurs points
    const cible = Math.max(10, e.W * 6, Math.max.apply(null, e.sc) + 4);
    const tour = partie && partie.phase === 'jeu' ? R.aQui(e) : -1;
    if (tour !== tourAff) { if (tourAff >= 0 && tour >= 0) temoinVol = { de: tourAff, a: tour, t: t }; tourAff = tour; }
    const z = Math.max(0.42, Math.min(0.85, lh / 64));
    const xs = [], ys = [];
    for (let s = 0; s < PLACES; s++) {
      const but = Math.min(1, e.sc[s] / cible);
      posAff[s] += (but - posAff[s]) * Math.min(1, dt * 3);
      xs[s] = 24 + posAff[s] * (w - 70);
      ys[s] = haut + (s + 1) * lh - 3;
    }
    const moi = partie ? partie.siege : -1;
    const vol = temoinVol && t - temoinVol.t < 450 ? temoinVol : null;
    for (let s = 0; s < PLACES; s++) {
      const actif = s === tour;
      const course = actif ? t * 0.014 : t * 0.003 + s;
      const saut = actif ? Math.abs(Math.sin(t * 0.007)) * 3 : 0;
      const tem = actif && !vol ? (s === moi ? TEMOINS[prog.temoin].c : TEMOINS[0].c) : null;
      if (actif) { c.fillStyle = 'rgba(255,230,80,.35)'; ell(c, xs[s], ys[s] - 2, 22, 6); c.fill(); }
      coureur(c, xs[s], ys[s], z, { k: s, phase: course, st: st, temoin: tem, motif: s === moi ? MAILLOTS[prog.maillot].motif : 'uni', saut: saut });
      if (st === 1) { c.fillStyle = 'rgba(70,182,239,.7)'; c.fillRect(xs[s] - 20, ys[s] - 26 * z, 44, 26 * z); c.strokeStyle = '#ffffffaa'; c.lineWidth = 1.5; c.beginPath(); for (let x = -20; x <= 24; x += 4) c.lineTo(xs[s] + x, ys[s] - 26 * z + Math.sin(x + t * 0.01) * 1.5); c.stroke(); }
    }
    // témoin qui vole
    if (vol) {
      const k = (t - vol.t) / 450, x = xs[vol.de] + (xs[vol.a] - xs[vol.de]) * k, y = ys[vol.de] + (ys[vol.a] - ys[vol.de]) * k - Math.sin(k * Math.PI) * 26 - 40 * z;
      c.save(); c.translate(x, y); c.rotate(k * 7);
      c.fillStyle = vol.a === moi || vol.de === moi ? TEMOINS[prog.temoin].c : TEMOINS[0].c; c.strokeStyle = '#1d2433'; c.lineWidth = 1.4; rr(c, -3, -10, 6, 20, 3); c.fill(); c.stroke();
      c.restore();
    }
    // particules (étoiles, médailles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul; etoile5(c, p.x, p.y, p.k); c.fill();
      c.globalAlpha = 1;
    }
    stadePos = { xs: xs, ys: ys, w: w, h: h };
  }
  let stadePos = null;

  function jaillir(s) {
    if (!stadePos) return;
    const x = stadePos.xs[s], y = stadePos.ys[s] - 30;
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.7 + Math.random() * 0.5, k: 3 + Math.random() * 3, coul: k % 2 ? COUL[s] : '#ffd23f' });
    }
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerStade(t, dt);
    majTemps();
    majCompte();
    if (fige && fige.jusqua <= Date.now()) { fige = null; majInterface(); }
    rafId = requestAnimationFrame(boucle);
  }

  // Une tuile qui vole d'un point à un autre (lettre posée, lettre donnée).
  function voler(lettre, sprint, de, vers, couleur) {
    if (!de || !vers) return;
    const v = document.createElement('div');
    v.className = 'volante';
    v.textContent = lettre;
    if (sprint) v.style.background = 'linear-gradient(#fff4ad, #ffc61f)';
    if (couleur) v.style.borderColor = couleur;
    const x0 = de.left + de.width / 2 - 22, y0 = de.top + de.height / 2 - 26;
    const x1 = vers.left + vers.width / 2 - 22, y1 = vers.top + vers.height / 2 - 26;
    v.style.left = x0 + 'px'; v.style.top = y0 + 'px';
    document.body.appendChild(v);
    requestAnimationFrame(() => requestAnimationFrame(() => { v.style.transform = 'translate(' + (x1 - x0) + 'px,' + (y1 - y0) + 'px) scale(.85)'; }));
    setTimeout(() => { v.style.opacity = '0'; }, 380);
    setTimeout(() => v.remove(), 800);
  }
  const rectDe = (el) => (el ? el.getBoundingClientRect() : null);

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    debutTour = Date.now();
    fige = null; modeDon = null;
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    fermerVoile('voile-carnet');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44);
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { coureur: tr('coureur.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { coureur: nomChef ? nomChef + ' · ' + tr('coureur.' + partie.chef) : tr('coureur.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    particules.length = 0;
    for (let s = 0; s < PLACES; s++) posAff[s] = 0;
    debutTour = Date.now();
    dernierTic = -1;
    fige = null; modeDon = null; sel = 0; tourAff = -1; temoinVol = null;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, stade: nomStade(vue.st) })); sons.tour(); }
    else { enPartie = true; afficherObjectif(); }
    if (vue.mot.length && vue.mot[0].q < 0) setTimeout(() => { if (partie && vue) { sons.sifflet(); } }, 300);
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const apres = ev.apres, avant = ev.avant, d = apres.der || {};
    const moi = partie.siege;
    const etaitDon = modeDon;
    modeDon = null;

          let texte = d.q === moi ? tr('evt.medailleToi', { mot: d.f.w, n: v }) : tr('evt.medaille', { qui: quiEst(d.q), mot: d.f.w, n: v });

          if (d.q === moi) {

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    modeDon = null;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1300);
  }

  function gagneManche(e, moi) { return moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc); }

  // Fin d'une manche en ligne : classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = gagneManche(e, moi);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.st + 1 });
    sauverSiExiste();
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(md, obj, gagne) {
    if (!gagne) return 0;
    return 1 + (md >= obj[0] ? 1 : 0) + (md >= obj[1] ? 1 : 0);
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60; medaillon(cv.getContext('2d'), s, 30, 30, 28);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: e.sc[s] }) + ' · ' + nb(e.md[s]);
      n.insertAdjacentHTML('beforeend', ICONE_MEDAILLE('#ffc928'));
      n.lastChild.style.width = '14px'; n.lastChild.style.height = '14px'; n.lastChild.style.verticalAlign = '-2px';
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function remplirMots(e) {

      const p = document.createElement('span');

  function bouton(cle, classe, action) {

  // Ce qui s'ouvre au vestiaire entre deux moments.
  function etatObjets() {
    return { m: MAILLOTS.map((_, k) => maillotOuvert(k)), t: TEMOINS.map((_, k) => temoinOuvert(k)), c: [0, 1, 2, 3].map(coupeGagnee) };
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0, md = moi >= 0 ? e.md[moi] : 0;
    const gagne = gagneManche(e, moi);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    remplirMots(e);
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts }) + ' · ' + tr('fin.medailles', { n: md }) : '';
    $('fin-objets').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1, obj = NIVEAUX[i].obj;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const avantObjets = etatObjets();
      const etoiles = etoilesPour(md, obj, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-objectif').textContent = tr('fin.objectif', { a: obj[0], b: obj[1] });
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      // objets du vestiaire tout juste ouverts
      const apres = etatObjets(), nouveaux = [];
      apres.m.forEach((x, k) => { if (x && !avantObjets.m[k]) nouveaux.push(tr('maillot.' + k)); });
      apres.t.forEach((x, k) => { if (x && !avantObjets.t[k]) nouveaux.push(tr('temoin.' + k)); });
      apres.c.forEach((x, k) => { if (x && !avantObjets.c[k]) nouveaux.push(tr('coupe.nom', { stade: nomStade(k) })); });
      $('fin-objets').textContent = nouveaux.length ? tr('fin.vestiaire', { objets: nouveaux.join(', ') }) : '';
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.st + 1 });
      sauverSiExiste();
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-objectif').textContent = '';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (robots sur l'appareil, en ligne).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: [COUL[i % 4], '#ffd23f'][i % 2], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    fige = null; modeDon = null;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon', 'voile-carnet'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    tutoJeton++;
  }

  // Parcours solo : niveau n contre 3 robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fige = null; modeDon = null; sel = 0;
    ['voile-fin', 'voile-pause', 'voile-carnet'].forEach(fermerVoile);
    particules.length = 0;
    for (let s = 0; s < PLACES; s++) posAff[s] = 0;
    vue = null;
    afficherEcran('jeu');
    const cfg = NIVEAUX[niveau - 1];
    if (cfg.st !== stadeVu) { stadeVu = cfg.st; if (niveau > 1 && (niveau - 1) % 5 === 0) setTimeout(() => toast(tr('evt.stade', { stade: nomStade(cfg.st) }), 3000), 200); }
    const tuto = cfg.tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) + ' · ' + tr('titre.medailles', { n: prog.medailles }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // Carnet des mots du stade en cours.
  function ouvrirCarnet() {
    const st = vue ? vue.st : 0;
    const mots = O.dicos[st];
    $('carnet-titre').textContent = tr('carnet.titre', { stade: nomStade(st) });
    const liste = $('carnet-liste');
    liste.textContent = '';
    let faits = 0;
    mots.forEach((m) => {
      const s = document.createElement('span');
      const ok = prog.mots.indexOf(m) >= 0;
      if (ok) faits++;
      s.className = 'mot-carnet' + (ok ? ' fait' : '');
      s.textContent = m;
      liste.appendChild(s);
    });
    $('carnet-total').textContent = tr('carnet.total', { n: faits, total: mots.length });
    if (session === 'solo' && !enPause && partie) partie.pause(true);
    ouvrirVoile('voile-carnet');
  }
  function fermerCarnet() {
    fermerVoile('voile-carnet');
    if (session === 'solo' && !enPause && partie) partie.pause(false);
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : piste et tuiles en miniature, avec une main
  // ---------------------------------------------------------------------

  // Chaque démonstration : piste de départ, réserve, rival éventuel, étapes.
  // Étapes : main (toucher la tuile n), changer (nouvelles lettres), rival
  // (le coureur suivant pose une lettre), arbitre (lettre imposée), don
  // (toucher la tuile n pour la donner), medaille (qui gagne, bonus).
  const TUTOS = {
    base: { piste: 'SAU', cases: 4, main: ['R', 'T', 'M'], etapes: [{ main: 1 }, { medaille: 0 }] },
    passe: { piste: 'BAS', cases: 6, main: ['Z', 'Q', 'W'], etapes: [{ changer: ['E', 'K', 'N'] }, { main: 1 }] },
    piege: { piste: 'FIL', cases: 5, main: ['E', 'A', 'O'], rival: true, etapes: [{ main: 0 }, { rival: 'T' }, { medaille: 1 }] },
    long: { piste: 'MARATHO', cases: 8, main: ['N', 'S', 'E'], etapes: [{ main: 0 }, { medaille: 0, bonus: true }] },
    haie: { piste: 'B', cases: 5, haies: [1], main: ['L', 'A', 'R'], nonJouables: [0, 2], etapes: [{ main: 1 }] },
    sprint: { piste: 'NAG', cases: 4, main: ['E', 'S', 'T'], sprint: [0], etapes: [{ main: 0 }, { medaille: 0, double: true }] },
    sifflet: { piste: '', cases: 5, main: ['A', 'U', 'K'], etapes: [{ arbitre: 'S' }, { main: 0 }] },
    echange: { piste: 'PO', cases: 6, tm: 2, main: ['D', 'Z', 'E'], rival: true, etapes: [{ main: 0 }, { don: 0 }] },
    finale: { prec: 'SLALOM', piste: '', cases: 5, main: ['A', 'O', 'X'], etapes: [{ arbitre: 'M' }, { main: 0 }] }
  };

  let tutoJeton = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const j = ++tutoJeton;
    const demo = $('tuto-demo');
    // construction de la scène
    function scene() {
      demo.textContent = '';
      const prec = document.createElement('div'); prec.className = 'demo-prec';
      if (d.prec) prec.textContent = tr('tuto.motPrecedent', { mot: d.prec });
      const haut = document.createElement('div'); haut.className = 'demo-haut';
      if (d.rival) {
        const r = document.createElement('span'); r.className = 'demo-rival'; r.id = 'demo-rival';
        const cv = document.createElement('canvas'); cv.width = 52; cv.height = 52; medaillon(cv.getContext('2d'), 1, 26, 26, 25);
        const t = document.createElement('span'); t.textContent = tr('coureur.1');
        r.append(cv, t); haut.appendChild(r);
      }
      const piste = document.createElement('div'); piste.className = 'demo-piste'; piste.id = 'demo-piste';
      for (let i = 0; i < d.cases; i++) {
        const c = document.createElement('div'); c.className = 'case'; c.id = 'demo-case-' + i;
        if (d.haies && d.haies.indexOf(i) >= 0) c.insertAdjacentHTML('beforeend', SVG_HAIE);
        if (i === d.tm) c.insertAdjacentHTML('beforeend', SVG_TEMOIN);
        if (i < d.piste.length) remplirCaseDemo(c, d.piste.charAt(i), 2, false);
        else if (i === d.piste.length) c.classList.add('suivante');
        piste.appendChild(c);
      }
      const main = document.createElement('div'); main.className = 'demo-main'; main.id = 'demo-main';
      d.main.forEach((l, i) => main.appendChild(tuileDemo(l, d.sprint && d.sprint.indexOf(i) >= 0, d.nonJouables && d.nonJouables.indexOf(i) >= 0)));
      demo.append(prec, haut, piste, main);
      if (d.etapes.some((x) => x.changer)) {
        const b = document.createElement('div'); b.className = 'demo-changer'; b.id = 'demo-changer'; b.textContent = tr('bouton.changer');
        main.querySelectorAll('.tuile').forEach((t) => t.classList.add('non'));
        demo.appendChild(b);
      }
      const med = document.createElement('div'); med.className = 'demo-medaille'; med.id = 'demo-medaille'; med.innerHTML = SVG_MEDAILLE_GRANDE;
      const bonus = document.createElement('div'); bonus.className = 'demo-bonus'; bonus.id = 'demo-bonus';
      const sif = document.createElement('div'); sif.className = 'demo-sifflet'; sif.id = 'demo-sifflet'; sif.innerHTML = SVG_SIFFLET_GRAND;
      demo.append(med, bonus, sif);
      demo.insertAdjacentHTML('beforeend', SVG_MAIN);
      const m = $('tuto-main'); m.style.transform = 'translate(' + (demo.clientWidth - 50) + 'px,' + (demo.clientHeight - 40) + 'px)';
      return { long: d.piste.length };
    }
    function tuileDemo(l, sprint, non) {
      const t = document.createElement('div'); t.className = 'tuile' + (sprint ? ' sprint' : '') + (non ? ' non' : '');
      if (sprint) t.insertAdjacentHTML('beforeend', ICONE_ECLAIR);
      const s = document.createElement('span'); s.textContent = l; t.appendChild(s);
      return t;
    }
    function remplirCaseDemo(c, l, q, sprint) {
      c.classList.remove('suivante');
      c.classList.add('pleine');
      if (q < 0) { c.classList.add('arbitre'); c.insertAdjacentHTML('beforeend', SVG_SIFFLET); }
      else { c.style.setProperty('--c', COUL[q]); c.style.setProperty('--f', COUL_C[q]); }
      if (sprint) c.classList.add('sprint');
      const s = document.createElement('span'); s.className = 'lettre'; s.textContent = l; c.appendChild(s);
    }
    function centre(el) {
      const r = el.getBoundingClientRect(), b = demo.getBoundingClientRect();
      return [r.left - b.left + r.width / 2, r.top - b.top + r.height / 2];
    }
    function mainVers(el, appui) {
      const m = $('tuto-main'); if (!m || !el) return;
      const p = centre(el);
      m.style.transform = 'translate(' + (p[0] - 12) + 'px,' + (p[1] - 6) + 'px)';
      m.classList.toggle('appui', !!appui);
    }
    let etat = null;
    const PAS = 1500;
    function jouerEtape(k) {
      if (j !== tutoJeton) return;
      if (k === 0) etat = scene();
      if (k >= d.etapes.length) { setTimeout(() => jouerEtape(0), 1600); return; }
      const e = d.etapes[k];
      const tuiles = () => Array.from($('demo-main').querySelectorAll('.tuile'));
      if (e.main !== undefined) {
        const t = tuiles()[e.main];
        mainVers(t, false);
        setTimeout(() => {
          if (j !== tutoJeton) return;
          mainVers(t, true);
          const c = $('demo-case-' + etat.long);
          if (c && t) { remplirCaseDemo(c, t.textContent, 0, t.classList.contains('sprint')); t.style.visibility = 'hidden'; etat.long++; const s = $('demo-case-' + etat.long); if (s) s.classList.add('suivante'); }
          if (d.tm === etat.long - 1) tuiles().forEach((x) => { if (x.style.visibility !== 'hidden') x.classList.add('don'); });
          setTimeout(() => jouerEtape(k + 1), PAS - 650);
        }, 650);
      } else if (e.changer) {
        mainVers($('demo-changer'), false);
        setTimeout(() => {
          if (j !== tutoJeton) return;
          mainVers($('demo-changer'), true);
          const m = $('demo-main'); m.textContent = '';
          e.changer.forEach((l, i) => m.appendChild(tuileDemo(l, false, i !== 1)));
          setTimeout(() => jouerEtape(k + 1), PAS - 650);
        }, 650);
      } else if (e.rival) {
        mainVers($('demo-rival'), false);
        setTimeout(() => {
          if (j !== tutoJeton) return;
          const c = $('demo-case-' + etat.long);
          if (c) { remplirCaseDemo(c, e.rival, 1, false); etat.long++; }
          setTimeout(() => jouerEtape(k + 1), PAS - 500);
        }, 500);
      } else if (e.arbitre) {
        $('demo-sifflet').classList.add('vue');
        setTimeout(() => {
          if (j !== tutoJeton) return;
          const c = $('demo-case-' + etat.long);
          if (c) { remplirCaseDemo(c, e.arbitre, -1, false); etat.long++; const s = $('demo-case-' + etat.long); if (s) s.classList.add('suivante'); }
          $('demo-sifflet').classList.remove('vue');
          setTimeout(() => jouerEtape(k + 1), PAS - 600);
        }, 600);
      } else if (e.don !== undefined) {
        const reste = tuiles().filter((x) => x.style.visibility !== 'hidden');
        const t = reste[e.don] || reste[0];
        mainVers(t, false);
        setTimeout(() => {
          if (j !== tutoJeton) return;
          mainVers(t, true);
          if (t) { t.style.transition = 'transform .5s'; const a = centre($('demo-rival')), b = centre(t); t.style.transform = 'translate(' + (a[0] - b[0]) + 'px,' + (a[1] - b[1]) + 'px) scale(.6)'; }
          setTimeout(() => { if (t) t.style.visibility = 'hidden'; jouerEtape(k + 1); }, PAS - 500);
        }, 650);
      } else if (e.medaille !== undefined) {
        $('demo-piste').classList.add('fini');
        const m = $('demo-medaille'); m.classList.add('vue');
        m.querySelector('circle').setAttribute('fill', e.medaille === 0 ? '#ffc928' : '#ff8a80');
        if (e.bonus) { $('demo-bonus').textContent = tr('tuto.bonus'); $('demo-bonus').classList.add('vue'); }
        if (e.double) { $('demo-bonus').textContent = tr('tuto.double'); $('demo-bonus').classList.add('vue'); }
        setTimeout(() => jouerEtape(k + 1), PAS);
      } else setTimeout(() => jouerEtape(k + 1), PAS);
    }
    setTimeout(() => jouerEtape(0), 50);
    const fermer = () => {
      tutoJeton++;
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  let clavierActif = false;

  function secouer(b) { if (!b) return; b.classList.remove('secoue'); void b.offsetWidth; b.classList.add('secoue'); }

  function toucherTuile(i, b) {
    if (!partie || enPause || attenteTuto || !vue) return;
    if (fige && fige.jusqua > Date.now()) return;
    const moi = partie.siege;
    if (!partie.monTour() || moi < 0) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    const main = vue.m[moi];
    if (!main[i]) return;
    if (modeDon) {
      if (i === modeDon.i) { modeDon = null; sons.clic(); majInterface(); return; }
      const d = i > modeDon.i ? i - 1 : i;
      dernierRect = rectDe($('tuile-' + modeDon.i));
      if (partie.jouer({ i: modeDon.i, d: d })) sons.clic();
      return;
    }
    const pre = O.prefixe(vue);
    if (!O.compat(vue, pre + main[i].l).length) {
      sons.non(); secouer(b);
      const enHaie = vue.h.indexOf(vue.mot.length) >= 0 && O.voyelles.indexOf(main[i].l) < 0;
      toast(tr(enHaie ? 'lettre.haie' : 'lettre.non'), 1600);
      return;
    }
    if (vue.mot.length === vue.tm) {
      modeDon = { i: i };
      sons.clic();
      majInterface();
      return;
    }
    dernierRect = rectDe(b);
    partie.jouer({ i: i });
  }

  function changerLettres() {
    if (!partie || enPause || attenteTuto || !vue || !partie.monTour()) return;
    if (partie.jouer({ p: 1 })) sons.clic();
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if ($('voile-carnet').classList.contains('actif')) {
      if (ev.code === 'Escape') { ev.preventDefault(); fermerCarnet(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !partie || !vue) return;
    const moi = partie.siege;
    const main = moi >= 0 ? vue.m[moi] : [];
    if (ev.code === 'ArrowLeft' || ev.code === 'ArrowRight') {
      ev.preventDefault(); audio();
      clavierActif = true;
      if (main.length) sel = (sel + (ev.code === 'ArrowLeft' ? -1 : 1) + main.length) % main.length;
      sons.clic();
      majMain();
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !document.activeElement.classList.contains('tuile')) return;
      ev.preventDefault(); audio();
      if (!partie.monTour()) { toucherTuile(sel, null); return; }
      if (!modeDon && !O.jouables(vue, moi).length) { changerLettres(); return; }
      clavierActif = true;
      toucherTuile(sel, $('tuile-' + sel));
    } else if (ev.code === 'Backspace') {
      if (modeDon) { ev.preventDefault(); modeDon = null; majInterface(); }
    } else if (ev.key && ev.key.length === 1 && /[a-z]/i.test(ev.key) && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      // taper une lettre de sa réserve (la lettre elle-même, quel que soit le clavier)
      const L = ev.key.toUpperCase();
      const ok = O.jouables(vue, moi);
      let idx = -1;
      main.forEach((x, k) => { if (x.l === L && idx < 0 && (!modeDon || k !== modeDon.i) && (modeDon || ok.indexOf(k) >= 0)) idx = k; });
      if (idx < 0) main.forEach((x, k) => { if (x.l === L && idx < 0 && (!modeDon || k !== modeDon.i)) idx = k; });
      ev.preventDefault(); audio();
      if (idx < 0) { if (partie.monTour()) { sons.non(); toast(tr('lettre.absente', { l: L }), 1400); } return; }
      sel = idx; clavierActif = true;
      toucherTuile(idx, $('tuile-' + idx));
    }
  });
  document.addEventListener('pointerdown', () => { if (clavierActif) { clavierActif = false; if (ecran === 'jeu') majMain(); } }, true);

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-vestiaire').addEventListener('click', () => { audio(); sons.clic(); ouvrirVestiaire(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('ves-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-mots').addEventListener('click', () => { audio(); sons.clic(); ouvrirCarnet(); });
  $('btn-carnet-fermer').addEventListener('click', () => { sons.clic(); fermerCarnet(); });
  $('btn-changer').addEventListener('click', () => { audio(); changerLettres(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(performance.now()); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
