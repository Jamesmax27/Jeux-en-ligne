<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.

    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }

    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);

  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();

const RUES=['rue.0','rue.1','rue.2','rue.3','rue.4','rue.5','rue.6','rue.7','rue.8','rue.9'];
const AVS=['av.0','av.1','av.2','av.3','av.4','av.5','av.6'];
const PSEUDOS=['@lea.photo','@kev_du_76','@mamie.ginette','@nono_skate','@ines.reporter','@le_vrai_tom','@fan2comete','@sacha.velo','@yanis_b','@chloe.mtl','@papy_rene','@zoe.lol','@clara.ouf','@hugo_live'];
const INCIDENTS=['incident.0','incident.1','incident.2','incident.3','incident.4','incident.5','incident.6','incident.7','incident.8','incident.9'];

function cfgFor(L){return{
  need:Math.min(6,3+Math.floor(L/2)),
  walkers:Math.min(7,1+L),
  walkMs:Math.max(290,640-45*(L-1)),
  drones:L<4?0:Math.min(3,Math.floor((L-2)/2)),
  pStreet:Math.min(0.45,0.22+0.03*(L-1)),
  pPark:Math.min(0.3,0.14+0.02*(L-1)),
  pRoof:0.03,
  base:Math.max(5,9-0.5*(L-1)),
  perTile:Math.max(0.42,0.75-0.04*(L-1))
};}

/* ---------- État ---------- */
let S=null, cfg=cfgFor(1);
let grid=[], lane=[], deco=[], vLines=[], hLines=[], rueOf={}, avOf={};
let T=28, W=COLS*28, H=ROWS*28, dpr=1, bg=null, held=null;

function fresh(){return{level:1,score:0,lives:3,phase:'menu',time:0,play:0,sightings:0,fx:[],trail:[],pings:[],walkers:[],drones:[],hero:{c:0,r:0,pc:0,pr:0,mt:-1e9}};}
function ent(p,next){return{c:p.c,r:p.r,pc:p.c,pr:p.r,mt:-1e9,next,target:null,chasing:false};}

/* ---------- Génération de la ville ---------- */
function lines(n,minG,maxG){
  const out=[0];let x=0;
  for(;;){
    const nx=x+minG+rnd(maxG-minG+1);
    if(nx>=n-1||(n-1-nx)<minG){out.push(n-1);break;}
    out.push(nx);x=nx;
  }
  return out;
}
const inB=(c,r)=>c>=0&&r>=0&&c<COLS&&r<ROWS;
const isT=(c,r,t)=>inB(c,r)&&grid[r][c]===t;
const ground=t=>t!==ROOF;

function genCity(){
  vLines=lines(COLS,3,4); hLines=lines(ROWS,3,5);
  const vs=new Set(vLines), hs=new Set(hLines);
  grid=[];deco=[];
  for(let r=0;r<ROWS;r++){grid.push([]);deco.push([]);for(let c=0;c<COLS;c++){grid[r].push(vs.has(c)||hs.has(r)?STREET:ROOF);deco[r].push(Math.random());}}
  const blocks=[];
  for(let i=0;i<vLines.length-1;i++)for(let j=0;j<hLines.length-1;j++){
    const c0=vLines[i]+1,c1=vLines[i+1]-1,r0=hLines[j]+1,r1=hLines[j+1]-1;
    if(c1>=c0&&r1>=r0)blocks.push({c0,c1,r0,r1});
  }
  shuffle(blocks);
  blocks.forEach((b,i)=>{
    const w=b.c1-b.c0+1,h=b.r1-b.r0+1;
    if(i===0||Math.random()<0.1){for(let r=b.r0;r<=b.r1;r++)for(let c=b.c0;c<=b.c1;c++)grid[r][c]=PARK;return;}
    let dir=null;
    if(w>=4)dir='v';else if(h>=5)dir='h';else if(Math.random()<0.25)dir=w>=h?(w>=3?'v':null):(h>=3?'h':null);
    if(dir==='v'){const c=b.c0+Math.floor(w/2);for(let r=b.r0;r<=b.r1;r++)grid[r][c]=STREET;}
    if(dir==='h'){const r=b.r0+Math.floor(h/2);for(let c=b.c0;c<=b.c1;c++)grid[r][c]=STREET;}
  });
  lane=grid.map((row,r)=>row.map((t,c)=>{
    if(t!==STREET)return '';
    const hz=isT(c-1,r,STREET)||isT(c+1,r,STREET), vt=isT(c,r-1,STREET)||isT(c,r+1,STREET);
    return hz&&vt?'x':hz?'h':'v';
  }));
  const rues=shuffle(RUES.slice()), avs=shuffle(AVS.slice());
  rueOf={};hLines.forEach((r,i)=>rueOf[r]=rues[i%rues.length]);
  avOf={};vLines.forEach((c,i)=>avOf[c]=avs[i%avs.length]);
}
function nearest(arr,v){return arr.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);}
function placeName(c,r){
  const rue=t(rueOf[nearest(hLines,r)]), av=t(avOf[nearest(vLines,c)]), tuile=grid[r][c];
  if(tuile===ROOF)return t('lieu.toits',{rue,av});
  if(tuile===PARK)return t('lieu.square',{rue,av});
  const onH=hLines.includes(r), onV=vLines.includes(c);
  if(onH&&onV)return t('lieu.angle',{rue,av});
  if(onH)return t('lieu.rue',{rue,av});
  if(onV)return t('lieu.avenue',{rue,av});
  return t('lieu.ruelle',{rue,av});
}
function randTile(pred,from,minD){
  const o=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(!pred(grid[r][c],c,r))continue;
    if(from&&man(c,r,from.c,from.r)<minD)continue;
    o.push({c,r});
  }
  return o.length?pick(o):null;
}

/* ---------- Sauvegarde de la progression (module JEL_SAVE) ----------
   niveau = quartier en cours (à partir de 1) ; score et vies = ceux du début
   de ce quartier (on le reprend depuis le début). */
const JEU='comete-traquee';
let debut={score:0,vies:3};
function sauvegarder(){JEL_SAVE.save(JEU,{niveau:S.level,score:debut.score,vies:debut.vies});}
function jouer(){
  JEL_SAVE.reprise({jeu:JEU,
    onContinuer:d=>{
      const vies=Number(d.vies);
      S=fresh();S.level=Math.max(1,Math.min(99,d.niveau));S.score=Math.max(0,Math.floor(d.score));
      S.lives=vies>=1?Math.min(3,Math.floor(vies)):3;
      debut={score:S.score,vies:S.lives};
      clearFeed();hideOverlay();startLevel('play');
      addFeed('sys',t('appli'),t('feed.reprise',{n:S.level}));
    },
    onNouvelle:newGame});
}
// Fermeture de la page pendant une partie (en jeu, en pause ou entre deux quartiers)
JEL_SAVE.surFermeture(()=>{if(S&&(S.phase==='play'||S.phase==='paused'||S.phase==='intro'))sauvegarder();});

/* ---------- Niveaux ---------- */
function startLevel(phase){
  cfg=cfgFor(S.level);
  genCity();buildBg();
  const inter=[];for(const r of hLines)for(const c of vLines)inter.push({c,r});
  const lower=inter.filter(p=>p.r>=ROWS/2&&p.c>0&&p.c<COLS-1);
  const sp=pick(lower.length?lower:inter);
  S.hero={c:sp.c,r:sp.r,pc:sp.c,pr:sp.r,mt:-1e9};
  S.walkers=[];for(let i=0;i<cfg.walkers;i++){const p=randTile(ground,S.hero,6)||randTile(ground,S.hero,3);S.walkers.push(ent(p,500+i*150));}
  S.drones=[];for(let i=0;i<cfg.drones;i++){const p=randTile(()=>true,S.hero,7)||randTile(()=>true,S.hero,4);S.drones.push(ent(p,900+i*250));}
  Object.assign(S,{time:0,pings:[],lastPing:null,mission:null,missionAt:700,rescues:0,cable:CABLE_MAX,cableAcc:0,nextMoveAt:0,queued:null,invUntil:0,lastSightAt:-1e9,shakeUntil:0,cableFlash:0,fx:[],trail:[],demoPingAt:1500});
  setPhase(phase);updateHUD();
}
function newGame(){
  S=fresh();clearFeed();hideOverlay();
  debut={score:0,vies:S.lives};
  startLevel('play');
  addFeed('sys',t('appli'),t('feed.debut',{quartier:district(1).name,n:cfg.need}));
}
function levelDone(){
  if (window.FMG) window.FMG.reportEnd({ completed: true, level: S.level });
  const bonus=250+S.lives*50;S.score+=bonus;
  const done=district(S.level).name, healed=S.lives<3;
  S.level++;S.lives=Math.min(3,S.lives+1);saveBest();
  debut={score:S.score,vies:S.lives};sauvegarder();  // quartier sécurisé : on reprendra au suivant
  startLevel('intro');
  addFeed('sys',t('appli'),t('feed.securise',{done,suivant:district(S.level).name}));
  showOverlay('next',{done,bonus,healed});
}
function gameOver(reason){
  if (window.FMG) window.FMG.reportEnd({ completed: false, level: S.level });
  JEL_SAVE.clear(JEU);  // partie perdue : plus rien à reprendre
  setPhase('over');
  const prev=getBest(), nb=saveBest();
  showOverlay('over',{reason,best:Math.max(prev,S.score),nb});
}
function setPhase(p){
  S.phase=p;
  $('#pauseBtn').hidden=p!=='play';
  if(p!=='play'){held=null;document.querySelectorAll('.dpad .down').forEach(b=>b.classList.remove('down'));}
}

/* ---------- Boucle de jeu ---------- */
function update(dt){
  S.time+=dt;
  const demo=S.phase==='menu', h=S.hero;
  if(!demo){
    S.play+=dt;
    const want=S.queued||held;
    if(want&&S.time>=S.nextMoveAt){S.queued=null;tryMove(want);if(S.phase!=='play')return;}
    if(grid[h.r][h.c]!==ROOF){
      S.cableAcc+=dt;
      while(S.cableAcc>=CABLE_REGEN_MS){S.cableAcc-=CABLE_REGEN_MS;if(S.cable<CABLE_MAX)S.cable++;}
    }else S.cableAcc=0;
    if(!S.mission&&S.time>=S.missionAt)spawnMission();
    if(S.mission&&S.time>=S.mission.expires){missionFailed();if(S.phase!=='play')return;}
  }else if(S.time>=S.demoPingAt){
    S.pings.push({c:h.c,r:h.r,t:S.time});S.demoPingAt=S.time+3200;
  }
  for(const w of S.walkers)if(S.time>=w.next){stepWalker(w);w.next=S.time+cfg.walkMs*(0.85+Math.random()*0.3);}
  for(const d of S.drones)if(S.time>=d.next){stepDrone(d);d.next=S.time+cfg.walkMs*1.7*(0.85+Math.random()*0.3);}
  if(!demo){
    proximity();checkCatch();
    if(S.phase!=='play')return;
    if(S.lastPing&&S.time-S.lastPing.t>9000)S.lastPing=null;
  }
  S.pings=S.pings.filter(p=>S.time-p.t<2000);
  S.fx=S.fx.filter(f=>S.time-f.t<900);
}

function tryMove(d){
  const h=S.hero,[dx,dy]=DIRS[d],nc=h.c+dx,nr=h.r+dy;
  if(!inB(nc,nr))return false;
  const t=grid[nr][nc];
  if(t===ROOF){
    if(S.cable<=0){S.cableFlash=S.time+600;return false;}
    S.cable--;
  }
  h.pc=h.c;h.pr=h.r;h.c=nc;h.r=nr;h.mt=S.time;S.nextMoveAt=S.time+MOVE_MS;
  const p=t===STREET?cfg.pStreet:t===PARK?cfg.pPark:cfg.pRoof;
  if(Math.random()<p)sighting(t===ROOF?'roof':'roll');
  if(S.mission&&S.mission.c===nc&&S.mission.r===nr){rescue();if(S.phase!=='play')return true;}
  checkCatch();
  return true;
}

function bfsStep(s,tgt){
  const N=COLS*ROWS, prev=new Int16Array(N).fill(-1), dist=new Int16Array(N).fill(-1);
  const start=s.r*COLS+s.c, q=[start];dist[start]=0;
  let best=start,bestScore=man(s.c,s.r,tgt.c,tgt.r)*1000,head=0;
  while(head<q.length){
    const id=q[head++],c=id%COLS,r=(id/COLS)|0;
    const sc=man(c,r,tgt.c,tgt.r)*1000+dist[id];
    if(sc<bestScore){best=id;bestScore=sc;}
    for(const [dx,dy] of DV){
      const nc=c+dx,nr=r+dy;
      if(!inB(nc,nr))continue;
      const nid=nr*COLS+nc;
      if(dist[nid]>=0||grid[nr][nc]===ROOF)continue;
      dist[nid]=dist[id]+1;prev[nid]=id;q.push(nid);
    }
  }
  if(best===start)return null;
  let id=best;while(prev[id]!==start)id=prev[id];
  return{c:id%COLS,r:(id/COLS)|0};
}
function moveEnt(e,n){e.pc=e.c;e.pr=e.r;e.c=n.c;e.r=n.r;e.mt=S.time;}
function stepWalker(w){
  if(w.target&&w.c===w.target.c&&w.r===w.target.r){w.target=null;w.chasing=false;}
  if(!w.target){w.target=randTile(ground);w.chasing=false;}
  let n=null;
  if(Math.random()<0.1){const o=DV.map(([dx,dy])=>({c:w.c+dx,r:w.r+dy})).filter(p=>inB(p.c,p.r)&&ground(grid[p.r][p.c]));if(o.length)n=pick(o);}
  else n=bfsStep(w,w.target);
  if(n)moveEnt(w,n);else{w.target=null;w.chasing=false;}
}
function stepDrone(d){
  if(!d.target||(d.c===d.target.c&&d.r===d.target.r)){d.target=randTile(()=>true);d.chasing=false;}
  const dx=Math.sign(d.target.c-d.c),dy=Math.sign(d.target.r-d.r);
  let nc=d.c,nr=d.r;
  if(dx&&(!dy||Math.random()<0.5))nc+=dx;else if(dy)nr+=dy;
  if(nc!==d.c||nr!==d.r)moveEnt(d,{c:nc,r:nr});
}

function sightMsg(kind,where){
  if(kind==='drone')return t('vu.drone.0',{lieu:where});
  if(kind==='roof')return t(pick(['vu.roof.0','vu.roof.1']),{lieu:where});
  if(kind==='near')return t(pick(['vu.near.0','vu.near.1']),{lieu:where});
  return t(pick(['vu.roll.0','vu.roll.1','vu.roll.2']),{lieu:where});
}
function sighting(kind){
  if(S.phase!=='play'||S.time-S.lastSightAt<900)return;
  S.lastSightAt=S.time;
  const h=S.hero,p={c:h.c,r:h.r,t:S.time};
  S.pings.push(p);S.lastPing=p;S.sightings++;
  for(const e of S.walkers.concat(S.drones)){e.target={c:p.c,r:p.r};e.chasing=true;}
  addFeed('sight',kind==='drone'?'@drone_presse':pick(PSEUDOS),sightMsg(kind,placeName(h.c,h.r)));
}
function proximity(){
  const h=S.hero;
  if(grid[h.r][h.c]!==ROOF){for(const w of S.walkers)if(man(w.c,w.r,h.c,h.r)<=2){sighting('near');break;}}
  for(const d of S.drones)if(man(d.c,d.r,h.c,h.r)<=2){sighting('drone');break;}
}
function checkCatch(){
  if(S.phase!=='play'||S.time<S.invUntil)return;
  const h=S.hero;
  const w=S.walkers.find(e=>e.c===h.c&&e.r===h.r), d=S.drones.find(e=>e.c===h.c&&e.r===h.r);
  if(w||d)caught(!!d);
}
function caught(byDrone){
  S.lives--;S.invUntil=S.time+INV_MS;S.shakeUntil=S.time+350;
  addFeed('sight',byDrone?'@drone_presse':pick(PSEUDOS),t('feed.photo'));
  const h=S.hero;
  for(const w of S.walkers){const p=randTile(ground,h,6)||randTile(ground,h,3);w.c=w.pc=p.c;w.r=w.pr=p.r;w.target=null;w.chasing=false;}
  for(const d of S.drones){const p=randTile(()=>true,h,7)||randTile(()=>true,h,4);d.c=d.pc=p.c;d.r=d.pr=p.r;d.target=null;d.chasing=false;}
  S.lastPing=null;
  updateHUD();
  if(S.lives<=0)gameOver(t('fin.photos'));
}
function spawnMission(){
  const h=S.hero;
  const p=randTile((t,c,r)=>ground(t)&&!S.walkers.some(w=>w.c===c&&w.r===r),h,5)||randTile(ground,h,3)||randTile(ground);
  const inc=pick(INCIDENTS), dur=(cfg.base+man(p.c,p.r,h.c,h.r)*cfg.perTile)*1000;
  S.mission={c:p.c,r:p.r,inc,dur,expires:S.time+dur};
  addFeed('alert',t('alerte'),`${cap(t(inc))}, ${placeName(p.c,p.r)}`);
}
function rescue(){
  const m=S.mission, pts=100+Math.round(Math.max(0,m.expires-S.time)/100);
  S.score+=pts;S.rescues++;S.mission=null;S.missionAt=S.time+900;
  S.fx.push({c:m.c,r:m.r,t:S.time,text:'+'+pts});
  addFeed('sys',pick(PSEUDOS),t('feed.merci',{inc:t(m.inc),pts}));
  updateHUD();
  if(S.rescues>=cfg.need)levelDone();
}
function missionFailed(){
  const m=S.mission;S.mission=null;S.missionAt=S.time+1200;S.lives--;S.shakeUntil=S.time+250;
  addFeed('alert',t('alerte'),t('feed.personne',{inc:t(m.inc)}));
  updateHUD();
  if(S.lives<=0)gameOver(t('fin.incidents'));
}

/* ---------- Rendu ---------- */
const cv=$('#map'), ctx=cv.getContext('2d');
function drawMerged(g,type,color,inset){
  g.fillStyle=color;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]!==type)continue;
    const L=isT(c-1,r,type)?0:inset,R=isT(c+1,r,type)?0:inset,U=isT(c,r-1,type)?0:inset,D=isT(c,r+1,type)?0:inset;
    g.fillRect(c*T+L,r*T+U,T-L-R,T-U-D);
  }
}
function buildBg(){
  bg=document.createElement('canvas');bg.width=Math.round(W*dpr);bg.height=Math.round(H*dpr);
  const g=bg.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);
  g.fillStyle=C.asphalt;g.fillRect(0,0,W,H);
  g.fillStyle=rgba(C.ink,0.07);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]!==STREET)continue;
    const x=c*T,y=r*T,l=lane[r][c];
    if(l==='h')g.fillRect(x+T*0.28,y+T/2-0.75,T*0.44,1.5);
    else if(l==='v')g.fillRect(x+T/2-0.75,y+T*0.28,1.5,T*0.44);
  }
  drawMerged(g,PARK,C.park,1.5);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]!==PARK)continue;
    const d=deco[r][c],x=c*T,y=r*T;
    g.fillStyle=C.tree;
    g.beginPath();g.arc(x+T*(0.28+0.2*d),y+T*(0.3+0.25*((d*7)%1)),T*0.17,0,PI2);g.fill();
    g.beginPath();g.arc(x+T*(0.72-0.15*d),y+T*(0.72-0.2*((d*13)%1)),T*0.12,0,PI2);g.fill();
  }
  g.fillStyle='rgba(0,0,0,0.5)';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===ROOF)g.fillRect(c*T+3,r*T+4,T,T);
  drawMerged(g,ROOF,C.block,2);
  g.fillStyle=C['block-hi'];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]!==ROOF)continue;
    const L=!isT(c-1,r,ROOF),R=!isT(c+1,r,ROOF),U=!isT(c,r-1,ROOF),D=!isT(c,r+1,ROOF);
    const x0=c*T+(L?2:0),x1=c*T+T-(R?2:0),y0=r*T+(U?2:0),y1=r*T+T-(D?2:0);
    if(U)g.fillRect(x0,y0,x1-x0,1.5);
    if(L)g.fillRect(x0,y0,1.5,y1-y0);
  }
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]!==ROOF)continue;
    const d=deco[r][c],x=c*T,y=r*T;
    if(d<0.22){g.fillStyle=rgba(C.night,0.55);g.fillRect(x+T*0.28,y+T*0.34,T*0.3,T*0.24);g.fillStyle=rgba(C.ink,0.1);g.fillRect(x+T*0.28,y+T*0.34,T*0.3,1);}
    else if(d<0.36){g.fillStyle=rgba(C.amber,0.2);g.fillRect(x+T*0.52,y+T*0.22,T*0.22,T*0.32);}
    else if(d<0.46){g.strokeStyle=rgba(C.ink,0.13);g.lineWidth=1;g.beginPath();g.arc(x+T*0.4,y+T*0.55,T*0.17,0,PI2);g.stroke();}
  }
}
function lp(e,now,dur){
  let k=(now-e.mt)/dur;k=k<0?0:k>1?1:k;const q=1-(1-k)*(1-k);
  return{x:(e.pc+(e.c-e.pc)*q)*T+T/2,y:(e.pr+(e.r-e.pr)*q)*T+T/2,k};
}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,PI2);}
function drawMission(m,now,t){
  const x=m.c*T+T/2,y=m.r*T+T/2,left=Math.max(0,Math.min(1,(m.expires-now)/m.dur)),col=left<0.3?C.ping:C.alert;
  const pulse=reduceMotion?0.5:0.5+0.5*Math.sin(t/170);
  ctx.fillStyle=rgba(col,0.12+0.1*pulse);circle(x,y,T*0.5);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=rgba(col,0.22);circle(x,y,T*0.44);ctx.stroke();
  ctx.strokeStyle=col;ctx.beginPath();ctx.arc(x,y,T*0.44,-Math.PI/2,-Math.PI/2+PI2*left);ctx.stroke();
  const s=T*0.24;ctx.fillStyle=col;
  ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s,y);ctx.lineTo(x,y+s);ctx.lineTo(x-s,y);ctx.closePath();ctx.fill();
  ctx.fillStyle=C.night;ctx.fillRect(x-T*0.03,y-s*0.55,T*0.06,s*0.65);ctx.fillRect(x-T*0.03,y+s*0.22,T*0.06,T*0.06);
}
function drawHero(now,t){
  const h=S.hero,p=lp(h,now,MOVE_MS*0.9),onRoof=grid[h.r][h.c]===ROOF;
  if(S.phase==='play'||S.phase==='menu'){S.trail.push({x:p.x,y:p.y});if(S.trail.length>10)S.trail.shift();}
  const n=S.trail.length;
  for(let i=0;i<n-1;i++){const q=S.trail[i],f=(i+1)/n;ctx.fillStyle=rgba(C.amber,0.08+0.35*f);circle(q.x,q.y,T*0.26*f);ctx.fill();}
  if(onRoof&&p.k<1){
    const ax=(h.c+(h.c-h.pc)*0.7)*T+T/2, ay=(h.r+(h.r-h.pr)*0.7)*T+T/2-T*0.2;
    ctx.strokeStyle=rgba(C.ink,0.75*(1-p.k));ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(ax,ay);ctx.stroke();
  }
  const R=T*(onRoof?0.34:0.3);
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(p.x+(onRoof?4:2),p.y+(onRoof?5:2.5),R,R*0.85,0,0,PI2);ctx.fill();
  if(now<S.invUntil&&Math.floor(t/90)%2===0)return;
  ctx.fillStyle=C.amber;circle(p.x,p.y,R);ctx.fill();
  ctx.lineWidth=1.5;ctx.strokeStyle=C.night;ctx.stroke();
  ctx.fillStyle=C.night;ctx.beginPath();ctx.ellipse(p.x,p.y-R*0.08,R*0.78,R*0.27,0,0,PI2);ctx.fill();
  ctx.fillStyle=C.ink;circle(p.x-R*0.33,p.y-R*0.08,R*0.12);ctx.fill();circle(p.x+R*0.33,p.y-R*0.08,R*0.12);ctx.fill();
}
function render(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=C.asphalt;ctx.fillRect(0,0,W,H);
  if(!bg||!S)return;
  const now=S.time;
  let sx=0,sy=0;
  if(!reduceMotion&&now<S.shakeUntil&&S.phase==='play'){sx=(Math.random()-.5)*6;sy=(Math.random()-.5)*6;}
  ctx.save();ctx.translate(sx,sy);
  ctx.drawImage(bg,0,0,W,H);
  const wDur=Math.min(260,cfg.walkMs*0.6), dDur=Math.min(380,cfg.walkMs*1.02);
  for(const d of S.drones){
    const p=lp(d,now,dDur),R=T*2.5;
    ctx.fillStyle=rgba(C.drone,0.07);ctx.strokeStyle=rgba(C.drone,0.25);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(p.x,p.y-R);ctx.lineTo(p.x+R,p.y);ctx.lineTo(p.x,p.y+R);ctx.lineTo(p.x-R,p.y);ctx.closePath();ctx.fill();ctx.stroke();
  }
  if(S.lastPing){
    const x=S.lastPing.c*T+T/2,y=S.lastPing.r*T+T/2;
    ctx.setLineDash([3,3]);ctx.strokeStyle=rgba(C.ping,0.85);ctx.lineWidth=1.5;circle(x,y,T*0.44);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=C.ping;circle(x,y,Math.max(2,T*0.08));ctx.fill();
  }
  for(const p of S.pings){
    const x=p.c*T+T/2,y=p.r*T+T/2;
    for(let k=0;k<2;k++){
      const a=(now-p.t)/1300-k*0.3;if(a<0||a>1)continue;
      ctx.strokeStyle=rgba(C.ping,(1-a)*0.9);ctx.lineWidth=2;circle(x,y,T*(0.3+a*1.9));ctx.stroke();
    }
  }
  if(S.mission)drawMission(S.mission,now,t);
  for(const w of S.walkers){
    const p=lp(w,now,wDur),r=T*0.22;
    ctx.fillStyle='rgba(0,0,0,.35)';circle(p.x+1.5,p.y+2,r);ctx.fill();
    ctx.fillStyle=C.walker;circle(p.x,p.y,r);ctx.fill();
    if(w.chasing){ctx.strokeStyle=C.ping;ctx.lineWidth=2;ctx.stroke();}
    ctx.fillStyle=C.night;ctx.fillRect(p.x+r*0.1,p.y-r*0.55,r*0.55,r*0.85);
    if(w.chasing&&Math.floor(t/260)%3===0){ctx.fillStyle=C.ink;circle(p.x+r*0.38,p.y-r*0.4,r*0.2);ctx.fill();}
  }
  for(const d of S.drones){
    const p=lp(d,now,dDur),a=T*0.26;
    ctx.strokeStyle=C.drone;ctx.lineWidth=2;ctx.beginPath();
    ctx.moveTo(p.x-a,p.y-a);ctx.lineTo(p.x+a,p.y+a);ctx.moveTo(p.x+a,p.y-a);ctx.lineTo(p.x-a,p.y+a);ctx.stroke();
    ctx.lineWidth=1.5;
    for(const [ux,uy] of [[-1,-1],[1,-1],[1,1],[-1,1]]){circle(p.x+ux*a,p.y+uy*a,T*0.1);ctx.stroke();}
    ctx.fillStyle=d.chasing?C.ping:C.drone;ctx.fillRect(p.x-T*0.08,p.y-T*0.08,T*0.16,T*0.16);
  }
  for(const f of S.fx){
    const a=(now-f.t)/900,x=f.c*T+T/2,y=f.r*T+T/2;
    ctx.strokeStyle=rgba(C.alert,1-a);ctx.lineWidth=2.5;circle(x,y,T*(0.3+a*1.2));ctx.stroke();
    ctx.fillStyle=rgba(C.alert,1-a);ctx.font=`700 ${Math.round(T*0.6)}px "Barlow Condensed", "Arial Narrow", sans-serif`;ctx.textAlign='center';
    ctx.fillText(f.text,x,y-T*0.6-a*T*0.6);
  }
  drawHero(now,t);
  ctx.restore();
}

/* ---------- Interface ---------- */
const segsEl=$('#segs'), whereEl=$('#where'), feedEl=$('#feedList'), ov=$('#overlay');
for(let i=0;i<CABLE_MAX;i++)segsEl.appendChild(document.createElement('i'));
const segEls=[...segsEl.children];
const MASK=k=>`<svg viewBox="0 0 18 11" aria-hidden="true"><path class="${k}" d="M1 3.2C5 .6 13 .6 17 3.2 17 8 15 10 12.4 10 10.6 10 9.8 8.6 9 7.6 8.2 8.6 7.4 10 5.6 10 3 10 1 8 1 3.2Z"/><circle class="eye" cx="5.3" cy="5" r="1.6"/><circle class="eye" cx="12.7" cy="5" r="1.6"/></svg>`;

function updateHUD(){
  $('#district').textContent=t('hud.quartier',{n:S.level,nom:district(S.level).name});
  $('#rescues').textContent=`${S.rescues}/${cfg.need}`;
  $('#score').textContent=fmt(S.score);
  const lv=$('#lives');lv.innerHTML=[0,1,2].map(i=>MASK(i<S.lives?'on':'off')).join('');
  lv.setAttribute('aria-label',t('hud.masques',{n:S.lives}));
}
let lastCableKey='';
function hudFrame(){
  const onRoof=grid[S.hero.r][S.hero.c]===ROOF, warn=S.time<S.cableFlash;
  const key=S.cable+'|'+onRoof+'|'+warn;
  if(key===lastCableKey)return;
  lastCableKey=key;
  segEls.forEach((el,i)=>el.classList.toggle('on',i<S.cable));
  whereEl.textContent=warn?t('cable.vide'):onRoof?t('cable.toits'):t('cable.sol');
  whereEl.classList.toggle('warn',warn);
}
function clockStr(){const m=21*60+Math.floor((S?S.play:0)/2000);return pad(Math.floor(m/60)%24)+':'+pad(m%60);}
function slowHud(){
  $('#watchers').textContent=fmt(2400+S.level*2600+S.sightings*143+rnd(90));
  $('#clock').textContent=clockStr();
}
function clearFeed(){feedEl.innerHTML='';}
function addFeed(kind,who,msg,time){
  const li=document.createElement('li');li.className=kind+(reduceMotion?'':' new');
  const ts=document.createElement('span');ts.className='t';ts.textContent=time||clockStr();
  const m=document.createElement('span');m.className='m';
  const w=document.createElement('span');w.className='who';w.textContent=who;
  m.append(w,' '+msg);li.append(ts,m);feedEl.prepend(li);
  while(feedEl.children.length>4)feedEl.lastElementChild.remove();
}

/* ---------- Écrans ---------- */
function getBest(){try{return parseInt(localStorage.getItem(BEST_KEY)||'0',10)||0;}catch(_){return 0;}}
function saveBest(){if(S.score>getBest()){try{localStorage.setItem(BEST_KEY,String(S.score));}catch(_){}return true;}return false;}
const sw=k=>`<i class="sw ${k}"></i>`;
const SCREENS={
  menu:()=>{const best=getBest();return `
  <div class="card" role="dialog" aria-labelledby="ovt">
    <p class="eyebrow">${t('menu.eyebrow')}</p>
    <h2 id="ovt">${t('titre')}</h2>
    <p>${t('menu.intro')}</p>
    <ul class="rules">
      <li>${sw('alert')}<span>${t('menu.regle1')}</span></li>
      <li>${sw('roof')}<span>${t('menu.regle2')}</span></li>
      <li>${sw('walker')}<span>${t('menu.regle3')}</span></li>
    </ul>
    <div class="legend"><span>${sw('hero')}${t('legende.comete')}</span><span>${sw('walker')}${t('legende.traqueur')}</span><span>${sw('drone')}${t('legende.drone')}</span><span>${sw('ping')}${t('legende.signalement')}</span><span>${sw('alert')}${t('legende.incident')}</span></div>
    <button class="btn" type="button" data-act="start">${t('menu.lancer')}</button>
    <p class="fine">${best?t('menu.record',{n:best})+' ':''}${t('menu.controles')}</p>
  </div>`;},
  next:d=>{const dist=district(S.level);return `
  <div class="card" role="dialog" aria-labelledby="ovt">
    <p class="eyebrow">${t('next.eyebrow',{n:d.bonus})}</p>
    <h2 id="ovt">${d.done}</h2>
    <p>${t('next.score',{n:S.score})}${d.healed?' '+t('next.masque'):''}</p>
    <div class="next">
      <span class="k">${t('next.niveau',{n:S.level})}</span>
      <strong>${dist.name}</strong>
      <p>${dist.note}</p>
      <p class="fine">${t('next.incidents',{n:cfg.need})} · ${t('next.traqueurs',{n:cfg.walkers})}${cfg.drones?' · '+t('next.drones',{n:cfg.drones}):''}</p>
    </div>
    <button class="btn" type="button" data-act="go">${t('next.entrer')}</button>
  </div>`;},
  pause:()=>`
  <div class="card" role="dialog" aria-labelledby="ovt">
    <p class="eyebrow">${t('pause.eyebrow',{n:S.level})}</p>
    <h2 id="ovt">${t('pause.titre')}</h2>
    <p>${t('pause.texte')}</p>
    <div class="row"><button class="btn" type="button" data-act="resume">${t('reprendre')}</button><button class="btn ghost" type="button" data-act="menu">${t('abandonner')}</button></div>
  </div>`,
  over:d=>`
  <div class="card" role="dialog" aria-labelledby="ovt">
    <p class="eyebrow">${t('over.eyebrow')}</p>
    <h2 id="ovt">${t('over.titre')}</h2>
    <p>${d.reason}</p>
    <div class="score-grid">
      <div><span class="k">${t('stat.score')}</span><span class="v">${fmt(S.score)}</span></div>
      <div><span class="k">${t('stat.niveau')}</span><span class="v">${S.level}</span></div>
      <div><span class="k">${t('stat.record')}</span><span class="v">${fmt(d.best)}</span></div>
    </div>
    ${d.nb?'<p class="fine">'+t('over.record')+'</p>':''}
    <div class="row"><button class="btn" type="button" data-act="again">${t('rejouer')}</button><button class="btn ghost" type="button" data-act="menu">${t('menu')}</button></div>
  </div>`
};
function showOverlay(kind,data){ov.innerHTML=SCREENS[kind](data||{});ov.hidden=false;}
function hideOverlay(){ov.hidden=true;ov.innerHTML='';}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='start')jouer();
  else if(a==='again')newGame();
  else if(a==='go'||a==='resume'){hideOverlay();setPhase('play');}
  else if(a==='menu')showMenu();
});
function togglePause(){
  if(!S)return;
  if(S.phase==='play'){setPhase('paused');showOverlay('pause');}
  else if(S.phase==='paused'){hideOverlay();setPhase('play');}
}
$('#pauseBtn').addEventListener('click',togglePause);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&S.phase==='play')togglePause();});

function showMenu(){
  S=fresh();startLevel('menu');
  const m=randTile(ground,S.hero,5)||randTile(ground);
  S.mission={c:m.c,r:m.r,inc:INCIDENTS[0],dur:1e9,expires:0.62e9};
  S.lastPing={c:S.hero.c,r:S.hero.r,t:0};
  clearFeed();
  addFeed('sys',t('appli'),t('feed.ouverte'),'20:57');
  addFeed('alert',t('alerte'),`${cap(t(INCIDENTS[0]))}, ${placeName(m.c,m.r)}`,'20:58');
  addFeed('sight',pick(PSEUDOS),t('vu.roll.0',{lieu:placeName(S.hero.c,S.hero.r)}),'20:59');
  showOverlay('menu');
  // « Effacer la sauvegarde » sous le bouton de lancement (caché sans sauvegarde)
  const effacer=JEL_SAVE.boutonEffacer({jeu:JEU});
  effacer.style.alignSelf='center';
  ov.querySelector('[data-act="start"]').after(effacer);
}

/* ---------- Commandes ---------- */
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'};
function nudge(d){
  if(!S||S.phase!=='play')return;
  if(S.time>=S.nextMoveAt)tryMove(d);else S.queued=d;
}
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='KeyP'||e.code==='Escape'){
    if(S&&(S.phase==='play'||S.phase==='paused')){e.preventDefault();togglePause();}
    return;
  }
  if(e.code==='Enter'||e.code==='NumpadEnter'){
    if(e.target.closest&&e.target.closest('button'))return;
    const b=!ov.hidden&&ov.querySelector('[data-act]');
    if(b){e.preventDefault();b.click();}
    return;
  }
  const d=KEYMAP[e.code];if(!d)return;
  e.preventDefault();
  if(e.repeat)return;
  held=d;nudge(d);
});
addEventListener('keyup',e=>{if(KEYMAP[e.code]&&KEYMAP[e.code]===held)held=null;});
addEventListener('blur',()=>{held=null;});

document.querySelectorAll('.dpad button').forEach(b=>{
  const d=b.dataset.dir;
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{b.setPointerCapture(e.pointerId);}catch(_){}
    held=d;b.classList.add('down');nudge(d);
  });
  const up=()=>{if(held===d)held=null;b.classList.remove('down');};
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('click',e=>{if(e.detail===0)nudge(d);});
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

let swipe=null;
cv.addEventListener('pointerdown',e=>{
  swipe={x:e.clientX,y:e.clientY,id:e.pointerId,moved:false};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(!swipe||e.pointerId!==swipe.id)return;
  const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y,th=Math.max(14,T*0.55);
  if(Math.abs(dx)<th&&Math.abs(dy)<th)return;
  swipe.x=e.clientX;swipe.y=e.clientY;swipe.moved=true;
  nudge(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
});
cv.addEventListener('pointerup',e=>{
  if(swipe&&!swipe.moved&&S&&S.phase==='play'){
    const rect=cv.getBoundingClientRect();
    const tc=Math.floor((e.clientX-rect.left)/T),tr=Math.floor((e.clientY-rect.top)/T);
    const dx=tc-S.hero.c,dy=tr-S.hero.r;
    if(dx||dy)nudge(Math.abs(dx)>=Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));
  }
  swipe=null;
});
cv.addEventListener('pointercancel',()=>{swipe=null;});

/* ---------- Taille ---------- */
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const bs=getComputedStyle(document.body), rt=getComputedStyle(document.documentElement);
  const availW=Math.min(460,document.body.clientWidth-parseFloat(bs.paddingLeft)-parseFloat(bs.paddingRight))-2;
  const used=['.head','.cable','.bottom','.foot'].reduce((s,q)=>s+($(q)?$(q).offsetHeight:0),0)+40+24+2;
  const rootPad=(parseFloat(rt.paddingTop)||0)+(parseFloat(rt.paddingBottom)||0);
  const availH=window.innerHeight-used-rootPad;
  T=Math.max(20,Math.min(40,Math.floor(Math.min(availW/COLS,availH/ROWS))));
  W=T*COLS;H=T*ROWS;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.width=W+'px';cv.style.height=H+'px';
  if(grid.length)buildBg();
  if(S)S.trail=[];
}
let rq=0;
addEventListener('resize',()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(resize);});

/* ---------- Démarrage ---------- */
let lastT=0,hudT=0;
function loop(t){
  const dt=Math.min(50,Math.max(0,t-lastT));lastT=t;
  if(S&&(S.phase==='play'||S.phase==='menu'))update(dt);
  render(t);
  if(S){hudFrame();if(t-hudT>600){hudT=t;slowHud();}}
  requestAnimationFrame(loop);
}
function boot(data){
  resize();
  if(data&&data.level>0){
    S=fresh();S.level=data.level|0;S.score=data.score|0;S.lives=Math.max(1,Math.min(3,data.lives|0||3));
    clearFeed();startLevel('paused');
    addFeed('sys',t('appli'),t('feed.reprise',{n:S.level}));
    showOverlay('pause');
  }else showMenu();
  requestAnimationFrame(t=>{lastT=t;loop(t);});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize).catch(()=>{});
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>S&&S.phase!=='menu'&&S.phase!=='over'?{level:S.level,score:S.score,lives:S.lives}:{});}catch(_){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(boot);else boot((hot&&hot.data)||{});
})();
</script>
