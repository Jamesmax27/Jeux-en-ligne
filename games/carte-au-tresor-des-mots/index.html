<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS

      element: element,
      maj: function () {

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */

    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },

    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +

    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

.images { display: grid; grid-template-columns: repeat(2, minmax(0, 120px)); gap: 14px; justify-content: center; }
.images.trois { grid-template-columns: repeat(3, minmax(0, 104px)); }
.image-choix {
  aspect-ratio: 1; border-radius: 24px; background: #fff7e6; border: 4px solid var(--bord); box-shadow: 0 5px 0 rgba(0, 0, 0, .2);

}

/* Coffre */
.coffre { width: 90px; height: 72px; }
.coffre .couvercle { transform-origin: 12px 36px; transition: transform .5s cubic-bezier(.3, 1.6, .5, 1); }
.coffre.ouvert .couvercle { transform: rotate(-38deg); }
.coffre .eclat { opacity: 0; transition: opacity .4s .2s; }
.coffre.ouvert .eclat { opacity: 1; }
.ligne-image { display: flex; align-items: center; gap: 14px; }
.ligne-image .cadre-image { width: clamp(80px, 13vh, 110px); height: clamp(80px, 13vh, 110px); font-size: clamp(52px, 8vh, 74px); }

/* Petite carte de l'île (directions) */
.carte-mini { position: relative; width: 100%; max-width: 420px; height: min(38vh, 290px); }
.carte-mini > svg.fond { position: absolute; inset: 0; width: 100%; height: 100%; }
.lieu {
  position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: rgba(255, 250, 235, .85);
  border: 3px solid var(--bord); font-size: 42px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0, 0, 0, .2);
}
.lieu.etape { background: #c9f5c9; border-color: var(--vert); }
.bateau-mini { position: absolute; width: 44px; height: 36px; margin: -18px 0 0 -22px; transition: left 1s ease-in-out, top 1s ease-in-out; pointer-events: none; }

/* Scènes (sur, sous, à côté) */
.scenes { display: flex; gap: 10px; justify-content: center; width: 100%; }
.scene-carte {
  position: relative; flex: 0 1 112px; height: clamp(120px, 20vh, 150px); border-radius: 18px; background: linear-gradient(#cdeefc 60%, #f3d9a0 60%);
  border: 4px solid var(--bord); box-shadow: 0 5px 0 rgba(0, 0, 0, .2); overflow: hidden;
}
.scene-carte span { position: absolute; transform: translate(-50%, 0); }
.scene-carte .ref { font-size: 54px; }
.scene-carte .sujet { font-size: 30px; }
.rel-sur .ref { left: 50%; bottom: 10%; }
.rel-sur .sujet { left: 50%; bottom: 58%; }
.rel-sous .ref { left: 50%; top: 6%; }
.rel-sous .sujet { left: 50%; bottom: 5%; }
.rel-cote .ref { left: 36%; bottom: 14%; }
.rel-cote .sujet { left: 80%; bottom: 14%; }

.message {
  position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); z-index: 20; pointer-events: none; opacity: 0;
  padding: 8px 20px; border-radius: 999px; background: #fff; font-weight: 900; font-size: 26px; color: var(--vert); white-space: nowrap;
  box-shadow: 0 6px 0 rgba(0, 0, 0, .15);

@keyframes message { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%); } }
.points-volants { position: absolute; z-index: 21; pointer-events: none; font-weight: 900; font-size: 24px; color: #fff; text-shadow: 0 2px 0 var(--or-fonce), 0 0 6px var(--or); animation: volent 1s ease-out forwards; }
@keyframes volent { to { transform: translateY(-60px); opacity: 0; } }
.bulle-coco {
  position: absolute; left: 10px; right: 10px; top: 4px; z-index: 15; display: none; padding: 10px 14px; border-radius: 18px;
  background: #fff; border: 3px solid var(--vert); font-weight: 800; font-size: 24px; text-align: center; box-shadow: 0 5px 0 rgba(0, 0, 0, .15);

.bulle-coco.visible { display: block; animation: apparait .25s; }
.bulle-coco span { padding: 0 2px; }

/* Calques : pause, fin, tutoriel */
.voile { position: absolute; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(8, 40, 70, .62); padding: 12px; }
.voile.visible { display: flex; }
#pause, #fin { z-index: 56; } /* toujours au-dessus d'un tutoriel ouvert */
.carte-fin {

}
.carte-fin h2 { margin: 4px 0 8px; font-size: 28px; color: var(--bois-fonce); }

.score-fin { font-size: 30px; font-weight: 900; color: var(--bois-fonce); }
.record-nouveau { color: var(--rouge); font-weight: 900; animation: battement .8s ease-in-out infinite; }
.recompense { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 8px; border-radius: 14px; background: #fff3c4; }
.recompense svg { width: 42px; height: 42px; flex: 0 0 42px; animation: tourne 2s linear infinite; }
.pause-outils { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; }

#tuto { background: rgba(8, 40, 70, .45); align-items: flex-start; cursor: pointer; }
.tuto-bulle {
  position: absolute; left: 12px; right: 12px; padding: 12px 16px; border-radius: 20px; background: var(--parchemin); border: 4px solid var(--bord);
  text-align: center; font-weight: 700; font-size: 19px; line-height: 1.3; box-shadow: 0 6px 0 rgba(0, 0, 0, .2);
}

.tuto-bulle small { display: block; margin-top: 8px; font-size: 14px; color: var(--bois); animation: clignote .8s infinite alternate; }
.tuto-anneau { position: absolute; border: 5px solid #ffdf5e; border-radius: 22px; box-shadow: 0 0 0 4px rgba(255, 223, 94, .35); animation: battement 1s ease-in-out infinite; pointer-events: none; }
.tuto-main { position: absolute; left: 0; top: 0; width: 56px; height: 70px; pointer-events: none; filter: drop-shadow(0 4px 2px rgba(0, 0, 0, .3)); }

/* Bilan final */
#ecran-bilan { align-items: center; justify-content: center; padding: 14px; gap: 10px; background: linear-gradient(#ffd98a, #f7b24a 45%, #2a8fc7 45.3%, #17669a); }
#ecran-bilan .navire { width: min(100%, 380px); height: auto; max-height: 32vh; flex: 0 1 auto; min-height: 0; animation: tangage 4s ease-in-out infinite; }

#ecran-bilan .carte-fin { flex: 0 1 auto; min-height: 0; }

/* Pause : tout se fige */
.fige *, .fige *::before, .fige *::after { animation-play-state: paused !important; }
#pause *, #pause *::before, #pause *::after { animation-play-state: running !important; }

@media (min-height: 760px) {

<script>
/* ==========================================================================
   La carte au trésor des mots
   Jeu de lecture en français (game.json : "non_traduisible": true) : les mots
   et les phrases à lire (LEXIQUE, LIEUX, PHRASES…) sont le contenu du jeu et
   restent en français ; toute l'interface passe par t() (5 langues).
   ========================================================================== */
(function () {
  'use strict';
  const I18N = window.JEL_I18N;
  // En français, espace insécable avant ? ! : (le signe ne passe jamais seul à la ligne).
  const typo = (s) => (I18N.getLang() === 'fr' ? String(s).replace(/ ([?!:;»])/g, ' $1').replace(/« /g, '« ') : s);
  const t = (cle, variables) => typo(I18N.t(cle, variables));
  function typoDocument() {
    if (I18N.getLang() === 'fr') document.querySelectorAll('[data-i18n]').forEach((e) => { e.textContent = typo(e.textContent); });
  }
  // Après le module de traduction, qui remplit les data-i18n au chargement.
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', typoDocument);
  else typoDocument();

  // ------------------------------------------------------------------------
  // 1. Contenu de lecture (français)
  // ------------------------------------------------------------------------
  // Mots illustrés : "palier syl|la|bes image". Palier 1 = mots courts et
  // simples … palier 4 = mots longs. Les syllabes servent au coffre à syllabes
  // et à la lecture de Coco.
  const LEXIQUE_BRUT = [
    '1 chat 🐱', '1 lu|ne 🌙', '1 mo|to 🏍️', '1 vé|lo 🚲', '1 lit 🛏️', '1 rat 🐀', '1 loup 🐺', '1 ours 🐻',
    '1 bol 🥣', '1 feu 🔥', '1 clé 🔑', '1 dé 🎲', '1 pied 🦶', '1 main ✋', '1 bus 🚌', '1 ro|be 👗',
    '1 roi 🤴', '1 œuf 🥚', '1 os 🦴', '1 nez 👃', '1 riz 🍚', '1 pom|me 🍎', '1 va|che 🐮', '1 pou|le 🐔',
    '1 coq 🐓', '1 fée 🧚', '1 lion 🦁', '1 la|pin 🐰', '1 ki|wi 🥝', '1 pain 🍞', '1 lait 🥛', '1 miel 🍯',
    '1 fleur 🌸', '1 dent 🦷', '1 ro|bot 🤖', '1 sa|pin 🎄', '1 ten|te ⛺', '1 ca|fé ☕', '1 mur 🧱',
    '2 ba|teau ⛵', '2 gâ|teau 🎂', '2 pois|son 🐟', '2 mai|son 🏠', '2 so|leil ☀️', '2 tor|tue 🐢', '2 cra|be 🦀',
    '2 an|cre ⚓', '2 fu|sée 🚀', '2 ca|deau 🎁', '2 cha|peau 🎩', '2 ci|tron 🍋', '2 ti|gre 🐯', '2 zè|bre 🦓',
    '2 sou|ris 🐭', '2 re|nard 🦊', '2 hi|bou 🦉', '2 dau|phin 🐬', '2 re|quin 🦈', '2 vol|can 🌋', '2 cac|tus 🌵',
    '2 frai|se 🍓', '2 rai|sin 🍇', '2 ser|pent 🐍', '2 a|beille 🐝', '2 trac|teur 🚜', '2 ca|mion 🚚', '2 train 🚂',
    '2 bal|lon 🎈', '2 tam|bour 🥁', '2 li|vre 📖', '2 cra|yon ✏️', '2 lou|pe 🔍', '2 châ|teau 🏰', '2 pan|da 🐼',
    '2 sin|ge 🐵', '2 co|chon 🐷', '2 chien 🐶', '2 pous|sin 🐤', '2 pin|gouin 🐧', '2 gla|ce 🍦', '2 bon|bon 🍬',
    '2 pi|zza 🍕', '2 mar|teau 🔨', '2 clo|che 🔔', '2 dra|peau 🚩', '2 ca|nard 🦆', '2 mou|ton 🐑', '2 che|val 🐴',
    '2 va|gue 🌊', '2 î|le 🏝️', '2 flo|con ❄️', '2 dia|mant 💎', '2 bou|gie 🕯️', '2 a|vion ✈️', '2 lé|zard 🦎',
    '2 four|mi 🐜',
    '3 é|toi|le ⭐', '3 ce|ri|se 🍒', '3 gui|ta|re 🎸', '3 voi|tu|re 🚗', '3 pa|ra|sol ⛱️', '3 ko|a|la 🐨',
    '3 nu|a|ge ☁️', '3 cou|ron|ne 👑', '3 ca|rot|te 🥕', '3 ba|na|ne 🍌', '3 to|ma|te 🍅', '3 ba|lei|ne 🐳',
    '3 pieu|vre 🐙', '3 pal|mier 🌴', '3 es|car|got 🐌', '3 cha|meau 🐫', '3 gi|ra|fe 🦒', '3 lu|net|tes 👓',
    '3 chaus|su|re 👟', '3 cra|va|te 👔', '3 ci|seaux ✂️', '3 bous|so|le 🧭', '3 ca|de|nas 🔒', '3 che|nil|le 🐛',
    '3 li|cor|ne 🦄', '3 dra|gon 🐉', '3 hé|ris|son 🦔', '3 bis|cuit 🍪', '3 su|cet|te 🍭', '3 a|na|nas 🍍',
    '3 ai|mant 🧲', '3 fro|ma|ge 🧀', '3 mon|ta|gne ⛰️', '3 fla|mant 🦩', '3 a|vo|cat 🥑', '3 bro|co|li 🥦',
    '4 co|quil|la|ge 🐚', '4 coc|ci|nel|le 🐞', '4 cro|co|di|le 🐊', '4 té|les|co|pe 🔭', '4 hé|li|cop|tè|re 🚁',
    '4 or|di|na|teur 💻', '4 té|lé|pho|ne 📱', '4 dro|ma|dai|re 🐪', '4 mi|cros|co|pe 🔬', '4 au|ber|gi|ne 🍆',
    '4 trot|ti|net|te 🛴', '4 é|cu|reuil 🐿️', '4 hip|po|po|ta|me 🦛', '4 rhi|no|cé|ros 🦏', '4 é|lé|phant 🐘',
    '4 kan|gou|rou 🦘', '4 cham|pi|gnon 🍄', '4 ci|trouil|le 🎃', '4 pa|ra|pluie ☂️', '4 gre|nouil|le 🐸',
    '4 pa|pi|llon 🦋', '4 tour|ne|sol 🌻', '4 per|ro|quet 🦜', '4 chaus|set|te 🧦', '4 trom|pet|te 🎺'
  ];
  const LEX = LEXIQUE_BRUT.map((ligne) => {
    const [p, s, e] = ligne.split(' ');
    const syl = s.split('|');
    return { p: Number(p), syl, m: syl.join(''), e };
  });
  const MOTS = new Set(LEX.map((x) => x.m));

  // Repères des petites cartes (directions) : nom, image, genre.
  const LIEUX = [
    ['palmier', '🌴', 'm'], ['volcan', '🌋', 'm'], ['tente', '⛺', 'f'], ['maison', '🏠', 'f'], ['cactus', '🌵', 'm'],
    ['tortue', '🐢', 'f'], ['drapeau', '🚩', 'm'], ['château', '🏰', 'm'], ['arbre', '🌳', 'm'], ['sapin', '🌲', 'm'],
    ['champignon', '🍄', 'm'], ['ancre', '⚓', 'f'], ['montagne', '⛰️', 'f'], ['tournesol', '🌻', 'm'], ['parasol', '⛱️', 'm'],

  // Articles : le / au / du, avec l'élision devant une voyelle.
  const voyelle = (nom) => /^[aeiouyéèêâîô]/.test(nom);
  const le = (x) => (voyelle(x.nom) ? "l'" : x.g === 'f' ? 'la ' : 'le ') + x.nom;

  const du = (x) => (voyelle(x.nom) ? "de l'" : x.g === 'f' ? 'de la ' : 'du ') + x.nom;
  const majuscule = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  const NB = ' '; // espace insécable avant : ! ?

  const PHRASES_G = [
    (a) => `Va jusqu'${au(a)}.`,
    (a) => `Rame vers ${le(a)}.`,
    (a) => `Le trésor est près ${du(a)}.`,
    (a) => `Coco s'envole vers ${le(a)}.`,
    (a) => `Accoste à côté ${du(a)}.`,
    (a) => `Mila t'attend près ${du(a)}.`,
    (a) => `Cherche la pièce d'or près ${du(a)}.`
  ];
  const PHRASES_G2 = [
    (a, b) => `Passe par ${le(a)}, puis va jusqu'${au(b)}.`,
    (a, b) => `Va d'abord vers ${le(a)}, ensuite vers ${le(b)}.`,
    (a, b) => `Commence par ${le(a)} et finis par ${le(b)}.`,
    (a, b) => `Rame jusqu'${au(a)}, puis marche jusqu'${au(b)}.`
  ];
  // Phrases avec « ne … pas » : un seul bon endroit (b), l'autre (a) est un piège.
  const PHRASES_NEG = [
    (a, b) => `Ne va pas vers ${le(a)}${NB}: va vers ${le(b)}${NB}!`,
    (a, b) => `Le trésor n'est pas près ${du(a)}, il est près ${du(b)}.`,
    (a, b) => `Évite ${le(a)} et accoste à côté ${du(b)}.`
  ];

  // Scènes : qui est sur, sous ou à côté de quoi.
  const SUJETS = [
    ['crabe', '🦀', 'm'], ['chat', '🐱', 'm'], ['tortue', '🐢', 'f'], ['perroquet', '🦜', 'm'], ['poussin', '🐤', 'm'],
    ['escargot', '🐌', 'm'], ['grenouille', '🐸', 'f'], ['souris', '🐭', 'f'], ['pomme', '🍎', 'f'], ['ballon', '⚽', 'm']

      tamponBruit = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = tamponBruit.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

    s.buffer = tamponBruit; f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t0); f.frequency.exponentialRampToValueAtTime(freq / 3, t0 + duree);

  function jouer(nom, arg) {

  // Voix française de l'appareil (seulement une voix locale, jamais en ligne).
  function voixFr() {

      u.voice = v; u.lang = v.lang; u.rate = 0.8; u.pitch = 1.25;

  // ------------------------------------------------------------------------
  // 7. Fabrication des défis
  // ------------------------------------------------------------------------
  const niv = () => NIVEAUX[etat.niveau];
  function poolMots(n, filtre) {
    const [a, b] = n.palier || [1, 2];
    let pool = LEX.filter((x) => x.p >= a && x.p <= b && (!filtre || filtre(x)));
    if (pool.length < 4) pool = LEX.filter((x) => !filtre || filtre(x));
    return pool;
  }
  function tirerMot(n, filtre) {
    const pool = poolMots(n, filtre);
    const libres = pool.filter((x) => !etat.utilises.has(x.m));
    const x = choisir(libres.length ? libres : pool);
    etat.utilises.add(x.m);
    return x;
  }
  // Ressemblance entre deux mots (début et fin communs).
  function ressemblance(a, b) {
    let p = 0;
    while (p < a.length && p < b.length && a[p] === b[p]) p++;
    let s = 0;
    while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
    return p * 2 + s * 1.5 - Math.abs(a.length - b.length) * 0.6;
  }
  // Mots pièges : lettres inversées ou confondues (b/d, p/q, m/n…).
  const CONFUSIONS = { b: 'dp', d: 'bp', p: 'qb', q: 'pd', m: 'n', n: 'mu', u: 'n', a: 'o', o: 'a', e: 'a', i: 'u', t: 'f', f: 't', s: 'z', v: 'u', r: 'n', l: 't', c: 'e', g: 'q' };
  function mutations(m) {
    const L = [...m], res = new Set();
    for (let i = 1; i < L.length - 1; i++) {
      if (L[i] !== L[i + 1]) { const c = L.slice(); [c[i], c[i + 1]] = [c[i + 1], c[i]]; res.add(c.join('')); }
    }
    L.forEach((ch, i) => {
      for (const r of (CONFUSIONS[ch] || '')) { const c = L.slice(); c[i] = r; res.add(c.join('')); }
    });
    return melanger([...res].filter((x) => x !== m && !MOTS.has(x)));
  }
  function motsIntrus(cible, nb, n) {
    const res = [];
    if (n.pieges) {
      const mut = mutations(cible.m);
      res.push(...mut.slice(0, nb >= 3 ? 2 : 1));
      const proches = LEX.filter((x) => x.m !== cible.m && x.e !== cible.e)
        .sort((a, b) => ressemblance(cible.m, b.m) - ressemblance(cible.m, a.m)).slice(0, 4);
      for (const x of melanger(proches)) if (res.length < nb && !res.includes(x.m)) res.push(x.m);
    }
    for (const x of melanger(poolMots(n).filter((x) => x.m !== cible.m && x.e !== cible.e))) {
      if (res.length < nb && !res.includes(x.m)) res.push(x.m);
    }
    return res.slice(0, nb);
  }
  function imagesIntruses(cible, nb, n) {
    let autres = LEX.filter((x) => x.m !== cible.m && x.e !== cible.e);
    if (n.pieges) autres = autres.sort((a, b) => ressemblance(cible.m, b.m) - ressemblance(cible.m, a.m)).slice(0, 5);
    else autres = poolMots(n).filter((x) => x.m !== cible.m && x.e !== cible.e);
    return melanger(autres).slice(0, nb);
  }

  function generer(type, n) {
    const nbChoix = n.choix || 3;
    if (type === 'A') {
      const x = tirerMot(n);
      return { type, mot: x, choix: melanger([x.m, ...motsIntrus(x, nbChoix - 1, n)]), bon: x.m, lecture: x.m, morceaux: x.syl };
    }
    if (type === 'B') {
      const x = tirerMot(n);
      return { type, mot: x, choix: melanger([x, ...imagesIntruses(x, nbChoix - 1, n)]), bon: x.m, lecture: x.m, morceaux: x.syl, brume: true };
    }
    if (type === 'C') {
      const deux = !!n.c2;
      const x = tirerMot(n, (m) => [...m.m].filter((c) => /[a-z]/.test(c)).length >= (deux ? 4 : 2) && m.m.length >= 3);
      const lettres = [...x.m];
      const places = lettres.map((c, i) => (/[a-z]/.test(c) ? i : -1)).filter((i) => i >= 0);
      const positions = melanger(places).slice(0, deux ? 2 : 1).sort((a, b) => a - b);
      const sequence = positions.map((i) => lettres[i]);
      const intrus = new Set();
      const VOY = 'aeiou', CONS = 'bcdfglmnprstv';
      let essais = 0;
      while (intrus.size < (deux ? 3 : 3) && essais++ < 60) {
        const modele = choisir(sequence);
        const c = choisir(VOY.includes(modele) ? VOY : CONS);
        if (sequence.includes(c)) continue;
        if (!deux) { const autre = lettres.slice(); autre[positions[0]] = c; if (MOTS.has(autre.join(''))) continue; }
        intrus.add(c);
      }
      return { type, deux, mot: x, positions, sequence, tuiles: melanger([...sequence, ...intrus]), lecture: x.m, morceaux: x.syl };
    }
    if (type === 'D') {
      const [a, b] = n.lettres || [3, 5];
      const x = tirerMot({ palier: [1, 4] }, (m) => [...m.m].length >= a && [...m.m].length <= b && !/œ/.test(m.m));
      const lettres = [...x.m];
      return { type, mot: x, sequence: lettres, tuiles: melangerDifferent(lettres), lecture: x.m, morceaux: x.syl };
    }
    if (type === 'E') {
      const [a, b] = n.syl || [2, 2];
      const x = tirerMot({ palier: [1, 4] }, (m) => m.syl.length >= a && m.syl.length <= b);
      const intrus = [];
      const autres = melanger(LEX.flatMap((m) => m.syl)).filter((s) => !x.syl.includes(s));
      for (const s of autres) { if (intrus.length >= (n.intrus || 0)) break; if (!intrus.includes(s)) intrus.push(s); }
      return { type, mot: x, sequence: x.syl.slice(), tuiles: melangerDifferent([...x.syl, ...intrus]), intrus: intrus.length, lecture: x.m, morceaux: x.syl };
    }
    if (type === 'G' || type === 'G2') {
      const lieux = melanger(LIEUX).slice(0, 4);
      let phrase, cibles, negation = false;
      if (type === 'G') {
        cibles = [0];
        phrase = choisir(PHRASES_G)(lieux[0]);
      } else if (n.negation && Math.random() < 0.4) {
        negation = true;
        cibles = [1];
        phrase = choisir(PHRASES_NEG)(lieux[0], lieux[1]);
      } else {
        cibles = [0, 1];
        phrase = choisir(PHRASES_G2)(lieux[0], lieux[1]);
      }
      // Les repères sont placés au hasard sur l'île.
      const ordre = melanger([0, 1, 2, 3]);
      return { type, lieux, ordre, cibles, phrase, negation, lecture: phrase, morceaux: phrase.split(' '), brume: true };
    }
    if (type === 'H') {
      const s = choisir(SUJETS), r = choisir(REFS), rel = choisir(RELATIONS);
      const scenes = [{ s, r, rel, bon: true }];
      const autres = RELATIONS.filter((x) => x !== rel);
      if (n.autreSujet && Math.random() < 0.6) {
        const s2 = choisir(SUJETS.filter((x) => x !== s));
        scenes.push({ s: s2, r, rel, bon: false }, { s, r, rel: choisir(autres), bon: false });
      } else {
        scenes.push({ s, r, rel: autres[0], bon: false }, { s, r, rel: autres[1], bon: false });
      }
      const phrase = phraseScene(s, r, rel);
      return { type, scenes: melanger(scenes), phrase, lecture: phrase, morceaux: phrase.split(' '), brume: true };
    }
    if (type === 'J') {
      const libres = PHRASES_J.filter((p) => !etat.utilises.has(p[0]));
      const p = choisir(libres.length ? libres : PHRASES_J);
      etat.utilises.add(p[0]);
      const phrase = p[0].replace('_', '…');
      return { type, modele: p[0], bon: p[1], choix: melanger(p.slice(1)), lecture: phrase, morceaux: phrase.split(' '), brume: true };
    }
    // K : phrase mélangée
    const libres = PHRASES_K.filter((p) => !etat.utilises.has(p));
    const phrase = choisir(libres.length ? libres : PHRASES_K);
    etat.utilises.add(phrase);
    const mots = phrase.split(' ');
    return { type: 'K', phrase, sequence: mots, tuiles: melangerDifferent(mots), lecture: phrase, morceaux: mots };
  }

  // Ordre des défis d'un niveau : la nouveauté d'abord, puis un mélange où
  // chaque mécanique revient (la nouveauté un peu plus souvent).
  function planDefis(n) {
    const liste = [];
    if (n.nouveau) liste.push(n.nouveau);
    let sac = [];
    while (liste.length < n.defis) {
      if (!sac.length) sac = melanger(n.nouveau ? [...n.types, n.nouveau] : n.types.slice());
      const x = sac.pop();
      // Évite deux fois de suite la même mécanique, s'il en reste une autre dans le sac.
      if (liste.length && liste[liste.length - 1] === x && sac.some((y) => y !== x)) { sac.unshift(x); continue; }
      liste.push(x);
    }
    return liste;
  }

  // ------------------------------------------------------------------------
  // 8. Déroulement d'un niveau
  // ------------------------------------------------------------------------
  function lancerNiveau(i) {
    fermerCalques();
    annulerMinuteries();
    taireVoix();
    Object.assign(etat, {
      niveau: i, qi: 0, bouees: 3, score: 0, serie: 0, erreurs: 0, aides: 0, pause: false, tuto: false,
      verrou: false, fini: false, utilises: new Set(), q: null
    });
    app.classList.remove('fige');
    reprendreA = i + 1;
    etat.types = planDefis(NIVEAUX[i]);    montrer('ecran-jeu');
    $('#jeu-ile').textContent = t('ile.' + NIVEAUX[i].ile);
    $('#jeu-niveau').textContent = t('jeu.niveau', { n: i + 1, total: NIVEAUX.length });
    $('#maree').classList.toggle('active', !!NIVEAUX[i].maree);
    majBouees();
    majScore(false);
    questionSuivante();
  }

  function majBouees(perte) {
    const b = $('#bouees');
    b.innerHTML = '';
    for (let k = 0; k < 3; k++) {
      b.insertAdjacentHTML('beforeend', BOUEE_SVG);
      if (k >= etat.bouees) b.lastChild.classList.add('perdue');
    }
    b.setAttribute('aria-label', t('jeu.bouees', { n: etat.bouees }));
    b.setAttribute('role', 'img');
    if (perte) { b.classList.remove('coule'); void b.offsetWidth; b.classList.add('coule'); }
  }
  let scoreAffiche = 0;
  function majScore(anime) {
    const cible = etat.score;
    if (!anime) { scoreAffiche = cible; $('#score').textContent = t('jeu.score', { n: nombre(cible) }); return; }
    const depart = scoreAffiche, t0 = performance.now();
    const pas = (now) => {
      const k = Math.min(1, (now - t0) / 600);
      scoreAffiche = Math.round(depart + (cible - depart) * k);
      $('#score').textContent = t('jeu.score', { n: nombre(scoreAffiche) });
      if (k < 1) requestAnimationFrame(pas);
    };
    requestAnimationFrame(pas);
  }
  function majProgression() {
    const p = $('#prog');
    p.innerHTML = '';
    for (let k = 0; k < niv().defis; k++) p.appendChild(el('i', k < etat.qi ? 'fait' : k === etat.qi ? 'courant' : ''));
    p.setAttribute('aria-label', t('jeu.defi', { n: Math.min(etat.qi + 1, niv().defis), total: niv().defis }));
    p.setAttribute('role', 'img');
  }

  function questionSuivante() {
    const n = niv();
    if (etat.qi >= n.defis) { victoire(); return; }
    const q = generer(etat.types[etat.qi], n);
    q.erreurs = 0; q.aide = false; q.etape = 0;
    etat.q = q; etat.qT = 0; etat.maree = 0; etat.brumeT = 0; etat.verrou = false;
    $('#bulle').classList.remove('visible');
    majMaree();
    majProgression();
    rendre(q, n);
    const tutos = tutosPour(q, n);
    if (tutos.length) { etat.tuto = true; plusTard(() => enchainerTutos(tutos), 350); }
  }

  // ---------- Affichage d'un défi ----------
  function motColore(syl, colore) {

    syl.forEach((x, i) => s.appendChild(el('span', colore ? (i % 2 ? 'syl-b' : 'syl-a') : '', x)));

  function boutonBouteille(texte, bon) {

  function rendre(q, n) {
    defiEl.innerHTML = '';

        b.dataset.bon = x.m === q.bon ? '1' : '0';
        b.setAttribute('aria-label', t('aria.image', { n: i + 1 }));

        zone.appendChild(b);

      repEl.appendChild(zone);
    } else if (q.type === 'C' || q.type === 'D' || q.type === 'E') {
      const ligne = el('div', 'ligne-image');
      ligne.appendChild(el('div', 'cadre-image emoji', q.mot.e));
      if (q.type === 'E') { const c = el('div'); c.innerHTML = COFFRE_SVG; ligne.appendChild(c.firstChild); }
      defiEl.appendChild(ligne);
      const cases = el('div', 'ligne-cases' + ([...q.mot.m].length > 8 ? ' serre' : ''));
      q.cases = [];
      if (q.type === 'C') {
        [...q.mot.m].forEach((c, i) => {
          const k = q.positions.indexOf(i);
          const cs = el('span', 'case' + (k >= 0 ? ' vide' : ''), k >= 0 ? '' : c);
          if (k >= 0) q.cases.push(cs);
          cases.appendChild(cs);
        });
      } else {
        q.sequence.forEach(() => { const cs = el('span', 'case vide' + (q.type === 'E' ? ' large' : '')); q.cases.push(cs); cases.appendChild(cs); });
      }
      defiEl.appendChild(cases);
      ajouterTuiles(q, false);
    } else if (q.type === 'G' || q.type === 'G2') {
      const p = el('div', 'parchemin phrase');
      p.appendChild(el('span', 'texte-defi', q.phrase));
      defiEl.appendChild(p);
      const carte = el('div', 'carte-mini');
      carte.innerHTML = '<svg class="fond" viewBox="0 0 300 200" preserveAspectRatio="none"><path d="M30 100Q20 30 110 22Q190 6 250 40Q300 80 270 140Q240 196 150 186Q50 192 30 100Z" fill="#f3d9a0" stroke="#fff" stroke-width="4"/><path d="M60 100Q55 50 120 44Q190 34 230 62Q262 92 240 130Q210 168 150 160Q70 162 60 100Z" fill="#7cc87a" opacity=".85"/></svg>' + BATEAU_MINI;
      const places = [[26, 30], [74, 26], [27, 74], [73, 72]];
      q.boutons = [];
      q.ordre.forEach((li, k) => {
        const l = q.lieux[li];
        const b = el('button', 'lieu emoji', l.e);
        b.type = 'button';
        b.style.left = (places[k][0] + alea(5) - 2) + '%';
        b.style.top = (places[k][1] + alea(5) - 2) + '%';
        b.setAttribute('aria-label', t('aria.lieu', { n: k + 1 }));
        b.dataset.lieu = li;
        b.addEventListener('click', () => choixLieu(b));
        q.boutons[li] = b;
        carte.appendChild(b);
      });
      const bateau = carte.querySelector('.bateau-mini');
      bateau.style.left = '50%'; bateau.style.top = '96%';
      q.bateau = bateau;
      repEl.appendChild(carte);
    } else if (q.type === 'H') {
      const p = el('div', 'parchemin phrase');
      p.appendChild(el('span', 'texte-defi', q.phrase));
      defiEl.appendChild(p);
      const zone = el('div', 'scenes');
      q.scenes.forEach((sc, i) => {
        const b = el('button', 'choix scene-carte rel-' + sc.rel);
        b.type = 'button';
        b.appendChild(el('span', 'ref emoji', sc.r.e));
        b.appendChild(el('span', 'sujet emoji', sc.s.e));
        b.dataset.bon = sc.bon ? '1' : '0';
        b.setAttribute('aria-label', t('aria.image', { n: i + 1 }));

    } else if (q.type === 'J') {
      const p = el('div', 'parchemin phrase');

      // Le mot collé au trou (« l' ») et le point restent sur la même ligne que lui.
      const [avant, apres] = q.modele.split('_');
      const [, debut, colle] = /^([\s\S]*?)(\S*)$/.exec(avant);
      span.appendChild(document.createTextNode(debut));
      const bloc = el('span', '', colle);

      bloc.appendChild(document.createTextNode(fin));
      span.appendChild(bloc);
      span.appendChild(document.createTextNode(suite));
      p.appendChild(span);

      repEl.appendChild(zone);
    } else if (q.type === 'K') {
      const cases = el('div', 'ligne-cases');
      q.cases = q.sequence.map(() => { const cs = el('span', 'case vide mot-k'); cases.appendChild(cs); return cs; });
      const p = el('div', 'parchemin phrase');

  function ajouterTuiles(q, motsK) {
    const zone = el('div', 'ligne-cases');
    zone.style.gap = '10px';
    q.tuilesEl = q.tuiles.map((x) => {
      const b = el('button', 'choix tuile' + (motsK ? ' mot-tuile' : ''), x);

      b.addEventListener('click', () => choixTuile(b));
      zone.appendChild(b);
      return b;

    repEl.appendChild(zone);

  // ---------- Réponses ----------
  const peutJouer = () => etat.ecran === 'ecran-jeu' && etat.q && !etat.verrou && !etat.pause && !etat.tuto && !etat.fini;

  function choixSimple(b) {
    if (!peutJouer()) return;
    if (b.dataset.bon === '1') {
      b.classList.add('bon');
      if (etat.q.type === 'J') { etat.q.trou.textContent = etat.q.bon; etat.q.trou.classList.add('case', 'pleine'); }
      if (b.classList.contains('bouteille')) jouer('plouf');
      reussite(b);
    } else {
      b.disabled = true;
      rate(b);
    }
  }
  function choixTuile(b) {
    if (!peutJouer()) return;
    const q = etat.q;
    const attendu = q.sequence[q.etape];
    if (b.dataset.valeur === attendu) {
      const cs = q.cases[q.etape];
      cs.textContent = attendu;
      cs.classList.remove('vide');
      cs.classList.add('pleine');
      b.classList.add('utilisee');
      b.disabled = true;
      q.etape++;
      jouer('lettre');
      if (q.etape >= q.sequence.length) {
        if (q.type === 'E') { const c = defiEl.querySelector('.coffre'); if (c) c.classList.add('ouvert'); jouer('coffre'); }
        reussite(cs);
      } else {
        const suivant = q.tuilesEl.find((x) => !x.disabled);
        if (document.activeElement === b && suivant) suivant.focus({ preventScroll: true });
      }
    } else {
      rate(b);
    }
  }
  function choixLieu(b) {
    if (!peutJouer()) return;
    const q = etat.q;
    const li = Number(b.dataset.lieu);
    if (li === q.cibles[q.etape]) {
      b.classList.add(q.etape + 1 >= q.cibles.length ? 'bon' : 'etape');
      q.bateau.style.left = b.style.left; q.bateau.style.top = b.style.top;
      jouer('bateau');
      q.etape++;
      if (q.etape >= q.cibles.length) reussite(b);
    } else {
      b.disabled = true;
      rate(b);
    }
  }

  function reussite(cible) {
    const q = etat.q;
    etat.verrou = true;
    let pts = 100 + Math.max(0, Math.round(50 - etat.qT * 5));
    if (q.erreurs === 0) { etat.serie++; pts += 10 * Math.min(etat.serie, 10); }
    if (q.aide) pts = Math.round(pts / 2);
    etat.score += pts;
    majScore(true);
    jouer('bon');
    pointsVolants(cible, pts);
    const r = cible.getBoundingClientRect(), ra = app.getBoundingClientRect();
    confettis(r.left + r.width / 2 - ra.left, r.top + r.height / 2 - ra.top, 26);
    message(etat.serie >= 3 && q.erreurs === 0 ? t('jeu.serie', { n: etat.serie }) : t('bravo.' + alea(6)), false);
    defiEl.classList.remove('dans-brume');
    plusTard(() => { etat.qi++; questionSuivante(); }, q.type === 'G' || q.type === 'G2' ? 1400 : 1150);
  }
  function rate(cible) {
    const q = etat.q;
    q.erreurs++; etat.erreurs++; etat.serie = 0; etat.bouees--;
    jouer('erreur');
    cible.classList.remove('faux'); void cible.offsetWidth; cible.classList.add('faux');
    plusTard(() => cible.classList.remove('faux'), 600);
    majBouees(true);
    message(t('jeu.oups'), true);
    if (etat.bouees <= 0) { etat.verrou = true; plusTard(defaite, 1000); }
  }
  // La marée emporte la bouteille : une bouée perdue, la réponse est montrée.
  function mareeEmporte() {
    const q = etat.q;
    etat.verrou = true;
    q.erreurs++; etat.erreurs++; etat.serie = 0; etat.bouees--;
    jouer('vague');
    majBouees(true);
    message(t('jeu.maree'), true);
    defiEl.classList.remove('dans-brume');
    montrerReponse(q);
    plusTard(() => { if (etat.bouees <= 0) defaite(); else { etat.qi++; questionSuivante(); } }, 1900);
  }
  function montrerReponse(q) {
    repEl.querySelectorAll('[data-bon="1"]').forEach((b) => b.classList.add('bon'));
    if (q.cases) q.cases.forEach((cs, i) => { if (i >= q.etape) { cs.textContent = q.sequence[i]; cs.classList.remove('vide'); cs.classList.add('pleine'); } });
    if (q.boutons) q.cibles.forEach((li) => q.boutons[li].classList.add('bon'));
    if (q.trou) q.trou.textContent = q.bon;
  }

  // ---------- Effets ----------
  let minuterieMessage = null;
  function message(texte, oups) {
    const m = $('#message');
    m.textContent = texte;
    m.className = 'message' + (oups ? ' oups' : '');
    void m.offsetWidth;
    m.classList.add('montre');
    clearTimeout(minuterieMessage);
    minuterieMessage = setTimeout(() => m.classList.remove('montre'), 1300);
  }
  function pointsVolants(cible, pts) {
    const r = cible.getBoundingClientRect(), ra = app.getBoundingClientRect();
    const p = el('div', 'points-volants', t('jeu.points', { n: pts }));
    p.style.left = (r.left + r.width / 2 - ra.left - 20) + 'px';
    p.style.top = (r.top - ra.top - 10) + 'px';

  }
  // Confettis (canvas par-dessus le jeu, figés pendant la pause).
  const canvas = $('#confettis'), c2d = canvas.getContext('2d');
  let particules = [];
  function confettis(x, y, n) {
    const couleurs = ['#f5c542', '#e2574c', '#3fbf5a', '#5fc3f0', '#ffffff', '#f7a6c1'];
    for (let k = 0; k < n; k++) {
      const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
      particules.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 180, r: 3 + Math.random() * 4, c: choisir(couleurs), vie: 1.2 + Math.random() * 0.6, rot: Math.random() * 6 });
    }
  }
  function majConfettis(dt) {
    const w = app.clientWidth, h = app.clientHeight;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    c2d.clearRect(0, 0, w, h);
    particules = particules.filter((p) => (p.vie -= dt) > 0);
    for (const p of particules) {
      p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 8;
      c2d.save(); c2d.translate(p.x, p.y); c2d.rotate(p.rot);
      c2d.globalAlpha = Math.min(1, p.vie * 1.5);
      c2d.fillStyle = p.c; c2d.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      c2d.restore();
    }
  }

  // ---------- Coco le perroquet ----------
  let minuterieCoco = [];
  function aideCoco() {
    if (!peutJouer()) return;
    const q = etat.q;
    if (!q.aide) { q.aide = true; etat.aides++; }
    etat.brumeT = 0;
    defiEl.classList.remove('dans-brume');
    minuterieCoco.forEach(clearTimeout);
    minuterieCoco = [];
    const bulle = $('#bulle');
    bulle.innerHTML = '';
    const morceaux = q.morceaux.map((m, i) => {
      const s = el('span', '', m);
      bulle.appendChild(s);
      if (q.type === 'G' || q.type === 'G2' || q.type === 'H' || q.type === 'J' || q.type === 'K') { if (i < q.morceaux.length - 1) bulle.appendChild(document.createTextNode(' ')); }
      return s;
    });
    bulle.classList.add('visible');
    $('#coco').classList.add('parle');
    jouer('coco');
    parler(q.lecture);
    const pas = q.morceaux.length > 5 ? 380 : 480;
    morceaux.forEach((s, i) => {
      minuterieCoco.push(setTimeout(() => {
        morceaux.forEach((x) => x.classList.remove('lu'));
        s.classList.add('lu');
        if (!etat.pause) jouer('coco');
      }, 250 + i * pas));
    });
    minuterieCoco.push(setTimeout(() => {
      bulle.classList.remove('visible');
      $('#coco').classList.remove('parle');
    }, 250 + morceaux.length * pas + 1400));
  }

  // ---------- Marée et brume ----------
  function majMaree() {
    $('#maree-remplie').style.width = (Math.min(1, etat.maree) * 100) + '%';
    $('#maree').classList.toggle('presse', etat.maree > 0.75);
    $('#mer-montante').style.height = (niv() && niv().maree ? Math.min(1, etat.maree) * 22 : 0) + '%';
  }

  // ------------------------------------------------------------------------
  // 9. Tutoriels animés
  // ------------------------------------------------------------------------
  function tutosPour(q, n) {
    const ids = [];
    const vu = (id) => !!sauve.tutos[id];
    const type = q.type === 'C' && q.deux ? 'C2' : q.type;
    if (!vu(type)) ids.push(type);
    if (type === 'A' && !vu('coco')) ids.push('coco');
    if ((type === 'A' || type === 'B') && n.choix === 4 && !vu('choix4') && vu('A') && vu('B')) ids.push('choix4');
    if (type === 'A' && n.derive && !vu('derive')) ids.push('derive');
    if ((type === 'A' || type === 'B') && n.pieges && !vu('pieges')) ids.push('pieges');
    if (type === 'E' && q.intrus && !vu('intrus')) ids.push('intrus');
    if (n.maree && !vu('maree')) ids.push('maree');
    if (n.brume && q.brume && !vu('brume')) ids.push('brume');
    if (q.negation && !vu('negation')) ids.push('negation');
    return ids.slice(0, 3);
  }
  function cibleTuto(id) {
    const q = etat.q;
    if (id === 'coco') return $('#coco');
    if (id === 'maree') return $('#maree');
    if (id === 'brume') return defiEl;
    if (q.tuilesEl) return q.tuilesEl.find((b) => b.dataset.valeur === q.sequence[0]) || q.tuilesEl[0];
    if (q.boutons) return q.boutons[q.cibles[0]];
    return repEl.querySelector('[data-bon="1"]') || repEl;
  }
  let animMain = null, tutoListe = [], tutoDepuis = 0;
  function enchainerTutos(liste) {
    if (etat.fini || etat.ecran !== 'ecran-jeu') { etat.tuto = false; return; }
    tutoListe = liste.slice();
    etat.tuto = true;
    afficherTuto();
  }
  function afficherTuto() {
    const id = tutoListe[0];
    const voile = $('#tuto');
    voile.classList.add('visible');
    const bulle = $('#tuto-bulle');
    bulle.innerHTML = '';
    bulle.appendChild(el('b', '', t('tuto.nouveau')));
    bulle.appendChild(document.createTextNode(t('tuto.' + id)));
    bulle.appendChild(el('small', '', t('tuto.toucher')));
    const cible = cibleTuto(id);
    const ra = app.getBoundingClientRect(), rc = cible.getBoundingClientRect();
    const x = rc.left - ra.left, y = rc.top - ra.top;
    const anneau = $('#tuto-anneau');
    Object.assign(anneau.style, { left: (x - 6) + 'px', top: (y - 6) + 'px', width: (rc.width + 12) + 'px', height: (rc.height + 12) + 'px' });
    // La bulle se place loin de la cible.
    const enBas = y + rc.height / 2 < ra.height / 2;
    bulle.style.top = enBas ? '' : '70px';
    bulle.style.bottom = enBas ? '24px' : '';
    // Main animée : elle glisse vers la cible et « tape ».
    const main = $('#tuto-main');
    const cx = x + rc.width / 2 - 24, cy = y + rc.height / 2 - 2;
    const dx = ra.width / 2 - 28, dy = enBas ? ra.height * 0.62 : ra.height * 0.5;
    if (animMain) animMain.cancel();
    try {
      animMain = main.animate([
        { transform: `translate(${dx}px, ${dy}px)`, opacity: 0 },
        { transform: `translate(${dx}px, ${dy}px)`, opacity: 1, offset: 0.1 },
        { transform: `translate(${cx}px, ${cy}px)`, offset: 0.55 },
        { transform: `translate(${cx}px, ${cy}px) scale(.82)`, offset: 0.68 },
        { transform: `translate(${cx}px, ${cy}px)`, offset: 0.8 },
        { transform: `translate(${cx}px, ${cy}px)`, opacity: 0 }
      ], { duration: 2200, iterations: Infinity });
    } catch (e) { main.style.transform = `translate(${cx}px, ${cy}px)`; }
    tutoDepuis = performance.now();
  }
  function fermerTuto() {
    if (performance.now() - tutoDepuis < 500) return;
    jouer('toucher');
    sauve.tutos[tutoListe.shift()] = 1;
    enregistrer();
    if (tutoListe.length) { afficherTuto(); return; }
    $('#tuto').classList.remove('visible');
    if (animMain) { animMain.cancel(); animMain = null; }
    etat.tuto = false;
    const premier = repEl.querySelector('button:not(:disabled)');
    if (premier) premier.focus({ preventScroll: true });
  }
  $('#tuto').addEventListener('click', fermerTuto);

  // ------------------------------------------------------------------------
  // 10. Pause
  // ------------------------------------------------------------------------
  function mettrePause() {
    if (etat.ecran !== 'ecran-jeu' || etat.pause || etat.fini) return;
    etat.pause = true;
    app.classList.add('fige');
    taireVoix();
    if (ctx) { try { ctx.suspend(); } catch (e) { /* rien */ } }
    if (animMain) animMain.pause();
    $('#pause').classList.add('visible');
    $('#p-reprendre').focus({ preventScroll: true });
  }
  function reprendre() {
    if (!etat.pause) return;
    etat.pause = false;
    app.classList.remove('fige');
    $('#pause').classList.remove('visible');
    if (ctx) { try { ctx.resume(); } catch (e) { /* rien */ } }
    if (animMain) animMain.play();
    dernier = performance.now();
    jouer('toucher');
  }
  function fermerCalques() {
    ['#pause', '#fin', '#tuto'].forEach((s) => $(s).classList.remove('visible'));
    if (animMain) { animMain.cancel(); animMain = null; }
    etat.pause = false; etat.tuto = false;
    app.classList.remove('fige');
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch (e) { /* rien */ } }
  }
  $('#btn-pause').addEventListener('click', () => { jouer('toucher'); mettrePause(); });
  $('#p-reprendre').addEventListener('click', reprendre);
  $('#p-recommencer').addEventListener('click', () => { jouer('toucher'); lancerNiveau(etat.niveau); });
  $('#p-carte').addEventListener('click', () => { jouer('toucher'); afficherCarte(); });
  $('#p-accueil').addEventListener('click', () => { jouer('toucher'); afficherAccueil(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

  // ------------------------------------------------------------------------
  // 11. Fin de niveau, défaite, trésor
  // ------------------------------------------------------------------------
  function victoire() {
    const i = etat.niveau, n = niv();
    etat.fini = true;
    etat.verrou = true;
    const etoiles = etat.aides === 0 && etat.erreurs <= 1 ? 3 : etat.erreurs + etat.aides <= 3 ? 2 : 1;
    const ancien = sauve.records[i] || 0;
    const record = etat.score > ancien;
    if (record) sauve.records[i] = etat.score;
    const avant = ileFaite(n.ile), piecesAvant = nbPieces();
    sauve.etoiles[i] = Math.max(sauve.etoiles[i] || 0, etoiles);
    const nouvelleIle = !avant && ileFaite(n.ile);
    if (i + 2 > sauve.debloque) sauve.debloque = Math.min(NIVEAUX.length, i + 2);
    enregistrer();
    // Niveau réussi : on reprendra au suivant (au dernier si tout est fini).
    scorePartie += etat.score;
    reprendreA = Math.min(NIVEAUX.length, i + 2);
    JEL_SAVE.save(JEU, { niveau: reprendreA, score: scorePartie });
    const pieces = nbPieces();
    const deco = nouvelleIle && pieces % 2 === 0 && pieces > piecesAvant ? pieces / 2 : 0;

    const c = $('#fin-contenu');
    c.innerHTML = '';
    c.appendChild(el('h2', '', t(nouvelleIle ? 'fin.ile' : 'fin.escale')));
    const et = el('div', 'grandes-etoiles');
    for (let k = 0; k < 3; k++) {
      et.insertAdjacentHTML('beforeend', etoileSVG(k < etoiles, k < etoiles ? 'gagnee' : ''));
      if (k < etoiles) et.lastChild.style.animationDelay = (0.25 + k * 0.35) + 's';
    }
    c.appendChild(et);
    for (let k = 0; k < etoiles; k++) plusTard(() => jouer('etoile', k), 300 + k * 350);
    c.appendChild(el('p', '', t('fin.etoiles.' + etoiles)));
    const sc = el('div', 'score-fin', t('fin.score', { n: 0 }));
    c.appendChild(sc);
    compter(sc, etat.score);
    c.appendChild(el('p', record ? 'record-nouveau' : '', record ? t('fin.record.nouveau') : t('fin.record', { n: nombre(ancien) })));
    c.appendChild(el('p', '', t('fin.erreurs', { n: etat.erreurs }) + ' · ' + t('fin.aides', { n: etat.aides })));
    if (nouvelleIle) {
      const r = el('div', 'recompense');
      r.innerHTML = PIECE_SVG;
      r.appendChild(el('span', '', t('fin.piece')));
      c.appendChild(r);
      plusTard(() => { jouer('piece'); jouer('morceau'); }, 1500);
    }
    if (deco) c.appendChild(el('p', '', t('fin.deco', { deco: t('deco.' + deco) })));
    const bt = el('div', 'boutons');
    if (i === NIVEAUX.length - 1) {
      bt.appendChild(bouton(t('fin.tresor'), '', afficherBilan));
    } else {
      bt.appendChild(bouton(t('fin.suivant'), '', () => lancerNiveau(i + 1)));
    }
    bt.appendChild(bouton(t('fin.rejouer'), 'bleu', () => lancerNiveau(i)));
    bt.appendChild(bouton(t('fin.niveaux'), 'blanc', afficherCarte));
    c.appendChild(bt);
    $('#fin').classList.add('visible');
    jouer('victoire');
    confettis(app.clientWidth / 2, app.clientHeight * 0.3, 90);
    bt.firstChild.focus({ preventScroll: true });
  }
  function defaite() {
    etat.fini = true;
    etat.verrou = true;
    const ancien = sauve.records[etat.niveau] || 0;
    const c = $('#fin-contenu');
    c.innerHTML = '';
    c.appendChild(el('h2', '', t('fin.defaite')));
    const b = el('div', 'grandes-etoiles');
    b.innerHTML = BOUEE_SVG + BOUEE_SVG + BOUEE_SVG;
    b.querySelectorAll('svg').forEach((s) => { s.style.opacity = '.35'; });
    c.appendChild(b);
    c.appendChild(el('p', '', t('fin.defaite.texte')));
    c.appendChild(el('div', 'score-fin', t('fin.score', { n: nombre(etat.score) })));
    c.appendChild(el('p', '', t('fin.record', { n: nombre(ancien) })));
    const bt = el('div', 'boutons');
    bt.appendChild(bouton(t('fin.reessayer'), '', () => lancerNiveau(etat.niveau)));
    bt.appendChild(bouton(t('fin.niveaux'), 'blanc', afficherCarte));
    c.appendChild(bt);
    $('#fin').classList.add('visible');
    jouer('defaite');
    bt.firstChild.focus({ preventScroll: true });
  }
  function bouton(texte, cls, action) {
    const b = el('button', 'btn ' + cls, texte);
    b.type = 'button';
    b.addEventListener('click', () => { jouer('toucher'); action(); });
    return b;
  }
  function compter(elm, cible) {
    const t0 = performance.now();
    const pas = (now) => {
      const k = Math.min(1, (now - t0) / 1000);
      elm.textContent = t('fin.score', { n: nombre(Math.round(cible * k)) });
      if (k < 1) requestAnimationFrame(pas);
    };
    requestAnimationFrame(pas);
  }
  function afficherBilan() {
    fermerCalques();
    const b = $('#ecran-bilan');
    b.innerHTML = '';
    b.appendChild(el('h1', '', t('bilan.titre')));
    const n = el('div');
    n.innerHTML = navireSVG('bilan');
    majDecorations(n);
    b.appendChild(n.firstElementChild);
    const carte = el('div', 'carte-fin');
    carte.appendChild(el('p', '', t('bilan.texte')));
    const et = el('div', 'compteur');
    et.innerHTML = etoileSVG(true);
    et.appendChild(el('span', '', t('bilan.etoiles', { n: totalEtoiles(), total: NIVEAUX.length * 3 })));
    carte.appendChild(et);
    const pc = el('div', 'compteur');
    pc.style.marginLeft = '8px';
    pc.innerHTML = PIECE_SVG;
    pc.appendChild(el('span', '', t('accueil.pieces', { n: nbPieces() })));
    carte.appendChild(pc);
    carte.appendChild(el('p', '', t('bilan.score', { n: nombre(sauve.records.reduce((s, x) => s + (x || 0), 0)) })));
    const bt = el('div', 'boutons');
    bt.appendChild(bouton(t('fin.rejouer'), '', () => lancerNiveau(NIVEAUX.length - 1)));
    bt.appendChild(bouton(t('fin.niveaux'), 'bleu', afficherCarte));
    bt.appendChild(bouton(t('bilan.accueil'), 'blanc', afficherAccueil));
    carte.appendChild(bt);
    b.appendChild(carte);
    montrer('ecran-bilan');
    jouer('tresor');
    confettis(app.clientWidth / 2, app.clientHeight * 0.35, 160);
    bt.firstChild.focus({ preventScroll: true });
  }

  // ------------------------------------------------------------------------
  // 12. Boucle principale (marée, brume, confettis)
  // ------------------------------------------------------------------------
  let dernier = performance.now();
  function boucle(now) {
    const dt = Math.min(0.1, (now - dernier) / 1000);
    dernier = now;
    if (!etat.pause) {
      if (peutJouer()) {
        const n = niv(), q = etat.q;
        etat.qT += dt;        if (n.maree) {
          etat.maree += dt / (n.maree * (TEMPS_MAREE[q.type] || 1));
          if (etat.maree > 0.75 && now - etat.dernierTic > 500) { etat.dernierTic = now; jouer('tic'); }
          majMaree();
          if (etat.maree >= 1) mareeEmporte();
        }
        if (n.brume && q.brume && !$('#bulle').classList.contains('visible')) {
          etat.brumeT += dt;
          // Une phrase longue reste visible un peu plus longtemps qu'un mot.
          const seuil = n.brume + (q.type === 'B' ? 0 : q.morceaux.length * 0.35);
          if (etat.brumeT >= seuil && !defiEl.classList.contains('dans-brume')) defiEl.classList.add('dans-brume');
        }
      }
      majConfettis(dt);
    }
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------------
  // 13. Commandes : toucher, souris, clavier
  // ------------------------------------------------------------------------
  $('#btn-jouer').addEventListener('click', () => {
    jouer('toucher');
    JEL_SAVE.reprise({
      jeu: JEU,
      // Continuer : directement au niveau gardé (même s'il est encore fermé sur la carte).
      onContinuer: (d) => {
        const i = Math.min(NIVEAUX.length, d.niveau) - 1;
        scorePartie = d.score;
        sauve.debloque = Math.max(sauve.debloque, i + 1);
        lancerNiveau(i);
      },
      onNouvelle: () => {
        // Une sauvegarde plus avancée reste tant qu'aucun niveau n'est lancé.
        scorePartie = 0; reprendreA = JEL_SAVE.existe(JEU) ? 0 : 1;
        if (sauve.debloque <= 1 && !(sauve.etoiles[0] > 0)) lancerNiveau(0);
        else afficherCarte();
      }
    });
  });
  const effacerTitre = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('.titre-bas') });
  $('#carte-accueil').addEventListener('click', () => { jouer('toucher'); afficherAccueil(); });
  document.querySelectorAll('.bouton-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('#coco').innerHTML = PERROQUET_SVG;
  $('#coco').addEventListener('click', aideCoco);
  window.addEventListener('resize', () => { if (etat.ecran === 'ecran-carte') dessinerChemin(); });
  // Le premier geste réveille le son (jamais avant).
  const reveil = () => { if (sauve.son) audio(); };
  window.addEventListener('pointerdown', reveil, { once: true });
  window.addEventListener('keydown', reveil, { once: true });

  const sansAccent = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function boutonsVisibles() {
    const calque = ['#pause', '#fin'].map((s) => $(s)).find((c) => c.classList.contains('visible'));
    const racine = calque || $('#' + etat.ecran);
    return [...racine.querySelectorAll('button:not(:disabled)')].filter((b) => b.offsetParent !== null && !b.classList.contains('utilisee'));
  }
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.closest && e.target.closest('jel-langue')) return;
    const touche = e.code;
    if ($('#tuto').classList.contains('visible')) {
      if (touche === 'Enter' || touche === 'Space' || touche === 'NumpadEnter') { e.preventDefault(); fermerTuto(); }
      return;
    }
    if (touche === 'Escape' || touche === 'KeyP') {
      if (etat.pause) reprendre(); else mettrePause();
      e.preventDefault();
      return;
    }
    if (etat.ecran === 'ecran-jeu' && peutJouer()) {
      if (touche === 'KeyH' && !(etat.q.tuilesEl && etat.q.type !== 'K' && etat.q.tuiles.some((x) => sansAccent(x) === 'h'))) { aideCoco(); e.preventDefault(); return; }
      const chiffre = /^(Digit|Numpad)([1-9])$/.exec(touche);
      if (chiffre) {
        const liste = [...repEl.querySelectorAll('button:not(:disabled)')].filter((b) => !b.classList.contains('utilisee'));
        const b = liste[Number(chiffre[2]) - 1];
        if (b) { b.click(); e.preventDefault(); }
        return;
      }
      // Lettres tapées au clavier (lettre manquante, lettres mélangées).
      if (etat.q.tuilesEl && (etat.q.type === 'C' || etat.q.type === 'D') && e.key && e.key.length === 1 && /\p{L}/u.test(e.key)) {
        const q = etat.q, k = sansAccent(e.key);
        const libres = q.tuilesEl.filter((b) => !b.disabled);
        const b = libres.find((x) => x.dataset.valeur === q.sequence[q.etape] && sansAccent(x.dataset.valeur) === k) ||
                  libres.find((x) => sansAccent(x.dataset.valeur) === k);
        if (b) { b.click(); e.preventDefault(); }
        return;
      }
    }
    if (/^Arrow/.test(touche)) {
      const liste = boutonsVisibles();
      if (!liste.length) return;
      let i = liste.indexOf(document.activeElement);
      const avance = touche === 'ArrowRight' || touche === 'ArrowDown' ? 1 : -1;
      i = i < 0 ? 0 : (i + avance + liste.length) % liste.length;
      liste[i].focus({ preventScroll: true });
      e.preventDefault();
    }
  });

  // ------------------------------------------------------------------------
  // 14. Démarrage
  // ------------------------------------------------------------------------
  majBoutonsSon();
  afficherAccueil();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
