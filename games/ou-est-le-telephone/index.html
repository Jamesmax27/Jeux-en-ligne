        L.push({ t: 'carrelage', x: o, y: hz, w: 1, h: 1 - hz, plein: true });
        L.push({ t: 'fenetre', x: o + (v ? 0.08 : 0.4), y: 0.06, w: 0.28, h: 0.2 });
        L.push({ t: 'comptoir', x: o + (v ? 0 : 0.28), y: hz - 0.17, w: 0.72, h: 0.2, plein: 'x' });
        L.push({ t: 'frigo', x: o + (v ? 0.76 : 0.03), y: hz - 0.4, w: 0.22, h: 0.44 });
      } else if (decor === 'salle') {
        L.push({ t: 'guirlande', x: o, y: 0.05, w: 1, h: 0.1, plein: 'x' });
        L.push({ t: 'etagere', x: o + (v ? 0.06 : 0.5), y: 0.12, w: 0.42, h: 0.2 });
        L.push({ t: 'tente', x: o + (v ? 0.62 : 0.06), y: hz - 0.24, w: 0.34, h: 0.3 });
        L.push({ t: 'tapis', x: o + 0.12, y: 0.66, w: 0.76, h: 0.22, k: pick(['#ffd84a', '#ff9fb0', '#8fd0f5']) });
      } else if (decor === 'grenier') {
        L.push({ t: 'poutre', x: o + 0.05, y: 0, w: 0.5, h: hz });
        L.push({ t: 'lucarne', x: o + (v ? 0.62 : 0.3), y: 0.07, w: 0.2, h: 0.2 });
        L.push({ t: 'malle', x: o + (v ? 0.05 : 0.6), y: hz - 0.12, w: 0.34, h: 0.2 });
        L.push({ t: 'cartons', x: o + (v ? 0.66 : 0.12), y: hz - 0.2, w: 0.3, h: 0.28 });
      } else if (decor === 'jardin') {
        L.push({ t: 'soleil', x: o + (v ? 0.75 : 0.1), y: 0.04, w: 0.14, h: 0.14 });
        L.push({ t: 'nuage', x: o + (v ? 0.2 : 0.5), y: 0.08, w: 0.3, h: 0.1 });
        L.push({ t: 'barriere', x: o, y: hz - 0.08, w: 1, h: 0.1, plein: 'x' });
        L.push({ t: 'arbre', x: o + (v ? 0.04 : 0.6), y: hz - 0.32, w: 0.36, h: 0.4 });
        L.push({ t: 'buisson', x: o + (v ? 0.6 : 0.1), y: hz - 0.08, w: 0.32, h: 0.12 });
      } else if (decor === 'plage') {
        L.push({ t: 'soleil', x: o + (v ? 0.12 : 0.72), y: 0.05, w: 0.14, h: 0.14 });
        L.push({ t: 'nuage', x: o + 0.4, y: 0.1, w: 0.28, h: 0.1 });
        L.push({ t: 'mer', x: o, y: hz - 0.12, w: 1, h: 0.13, plein: 'xy' });
        L.push({ t: 'parasol', x: o + (v ? 0.62 : 0.1), y: hz - 0.08, w: 0.32, h: 0.34 });
      } else if (decor === 'parc') {
        L.push({ t: 'nuage', x: o + (v ? 0.1 : 0.55), y: 0.06, w: 0.3, h: 0.1 });
        L.push({ t: 'arbre', x: o + (v ? 0.62 : 0.02), y: hz - 0.3, w: 0.34, h: 0.38 });
        L.push({ t: 'banc', x: o + (v ? 0.08 : 0.5), y: hz - 0.06, w: 0.38, h: 0.13 });
        L.push({ t: 'chemin', x: o, y: hz + 0.1, w: 1, h: 0.3, plein: 'x' });
        if (rnd() < 0.6) L.push({ t: 'mare', x: o + (v ? 0.55 : 0.1), y: 0.82, w: 0.35, h: 0.1 });
      }
    }
    return L.map((e) => Object.assign(e, { V: V() }));
  }

  // Zones où l'on peut poser des objets (fractions : x en largeurs d'écran, y en hauteur).
  function zones(sc) {
    const hz = DECORS[sc.decor].horizon;
    return { x0: 0.06, x1: sc.pano - 0.06, y0: hz + 0.06, y1: 0.93 };
  }
  // Dessus des meubles (canapé, lit, comptoir, malle, banc) : on peut aussi y poser des objets.
  // Chaque surface : x0, x1 (largeurs d'écran) et y (hauteur), la ligne où l'objet est posé.
  const SURFACES = { canape: [0.15, 0.85, 0.52], lit: [0.38, 0.95, 0.36], comptoir: [0.06, 0.94, 0.02], malle: [0.12, 0.88, 0.28], banc: [0.05, 0.95, 0.02] };
  function surfacesMeubles(sc) {
    const V = Math.min(W, H * 0.75), hz = DECORS[sc.decor].horizon * H;
    const L = [];
    for (const m of sc.meubles) {
      const s = SURFACES[m.t]; if (!s) continue;
      let w = m.w * V; const h = m.h * V;
      if (m.plein === 'x') w = m.w * W;
      const x = m.x * W, y = hz + H * 0.06 - h;
      L.push({ x0: (x + w * s[0]) / W, x1: (x + w * s[1]) / W, y: (y + h * s[2]) / H });
    }
    return L.filter((s) => s.x1 - s.x0 > 0.08 && s.y > 0.12);
  }

  function creerScene(niv, man, decor) {
    const pano = man.p || 1;
    const sc = {
      decor, pano, objs: [], tels: [], couvrants: [], cachettes: [], roulants: [], marques: [], parts: [], ondes: [],
      noir: man.n || 0, flash: man.f || 0, bon: !!man.b, telScale: niv.tel, temps: 0, cam: 0,
      lumiere: { x: 0, y: 0 }, curseur: { x: 0, y: 0, voir: false }, vibre: man.v || 1,
    };
    sc.meubles = genererMeubles(decor, Math.ceil(pano));
    const z = zones(sc);
    const facteur = clamp((W * H) / (390 * 600), 1, 1.5);
    const tt = tailleTel(niv.tel);
    const rTel = Math.hypot(tt.w, tt.h) / 2;
    const place = [];
    const proche = (x, y, r) => place.some((p) => Math.hypot((p.x - x) * W, (p.y - y) * H) < (p.r + r));
    function point(r, essais, evite) {
      let best = null;
      for (let i = 0; i < (essais || 30); i++) {
        const x = rf(z.x0, z.x1), y = rf(z.y0, z.y1);
        if (!evite || !proche(x, y, r)) return { x, y };
        best = { x, y };
      }
      return best;
    }

    // --- Les téléphones ---
    const nbTel = man.m || 1;
    const proprios = melanger(FAMILLE.slice());
    const cible = proprios[0];
    const listeTel = [];
    for (let i = 0; i < nbTel; i++) listeTel.push({ prop: proprios[i], cible: true });
    if (man.b) {
      const autres = proprios.slice(1);
      for (let i = 0; i < man.b; i++) {
        let prop;
        if (man.mc && i % 2 === 0) {
          const formes = FORMES.filter((f) => f !== cible.forme);
          prop = { id: 'x', couleur: cible.couleur, forme: formes[i % formes.length] };
        } else prop = autres[i % autres.length];
        listeTel.push({ prop, cible: false });
      }
    }
    const reserve = man.k ? 0 : 1;
    const surf = surfacesMeubles(sc);
    // un point sur le dessus d'un meuble, pour un objet de hauteur h (px)
    function surMeuble(h, r) {
      for (let i = 0; i < 12; i++) {
        const s = pick(surf);
        const x = rf(s.x0, s.x1), y = s.y - (h * 0.35) / H;
        if (!proche(x, y, r)) return { x, y };
      }
      return null;
    }
    listeTel.forEach((t) => {
      const p = (!man.k && surf.length && rnd() < 0.3 && surMeuble(tt.h, rTel * 1.4)) || point(rTel * 1.4, 40, true) || { x: rf(z.x0, z.x1), y: rf(z.y0, z.y1) };
      const tel = { prop: t.prop, cible: t.cible, x: p.x, y: p.y, rot: rf(-0.6, 0.6), w: tt.w, h: tt.h, trouve: false, porteur: null, cachette: null, visible: true, secoue: 0, rate: 0 };
      sc.tels.push(tel);
      if (reserve) place.push({ x: p.x, y: p.y, r: rTel * 1.2 });
    });

    // --- Cachettes ---
    if (man.k) {
      const types = melanger(CACHETTES.slice());
      const taille = U * 1.15;
      const pos = [];
      for (let i = 0; i < man.k; i++) {
        const p = point(taille * 0.9, 60, true) || { x: rf(z.x0, z.x1), y: rf(z.y0, z.y1) };
        place.push({ x: p.x, y: p.y, r: taille * 0.75 });
        pos.push(p);
        const t = types[i % types.length];
        sc.cachettes.push({ t, k: pick(COULEURS), x: p.x, y: p.y, w: OBJ[t].w * taille, h: OBJ[t].h * taille, leve: 0, levee: false, tel: null, dessous: pick(['chaussette', 'cles', 'pomme', 'crayon', null, null]), minuteur: rf(0.5, 2.5), secousse: 0 });
      }
      // le téléphone va sous une cachette au hasard
      sc.tels.forEach((tel, i) => {
        const ca = sc.cachettes[i % sc.cachettes.length];
        ca.tel = tel; ca.dessous = null; tel.cachette = ca; tel.x = ca.x; tel.y = ca.y + 0.004; tel.visible = false;
      });
    }

    // --- Objets qui roulent (porteurs du téléphone) ---
    const nbRoul = (man.r ? 1 : 0) + (man.mv || 0);
    const vitesse = 0.6 + niv.tel * 0 + (NIVEAUX.indexOf(niv) >= 15 ? 0.35 : 0.15);
    for (let i = 0; i < nbRoul; i++) {
      const t = i === 0 && man.r ? pick(PORTEURS) : (i === 1 && man.b && man.r ? pick(PORTEURS) : pick(ROULANTS));
      const s = U * rf(1.0, 1.15);
      const p = { x: rf(z.x0 + 0.15, z.x1 - 0.15), y: rf(z.y0 + 0.04, z.y1 - 0.02) };
      const ro = { t, k: pick(COULEURS), x0: p.x, y0: p.y, ax: Math.min(0.3, (z.x1 - z.x0) / 2 - 0.05) * rf(0.6, 1), ay: rf(0, 0.05), vit: rf(0.5, 0.9) * vitesse, ph: rf(0, 6.28), w: OBJ[t].w * s, h: OBJ[t].h * s, x: p.x, y: p.y, dir: 1, roule: t === 'ballon' };
      sc.roulants.push(ro);
    }
    if (man.r && sc.roulants.length) {
      const tel = sc.tels.find((t) => t.cible); tel.porteur = sc.roulants[0]; tel.rot = rf(-0.25, 0.25);
      if (man.b && sc.roulants.length > 1) { const autre = sc.tels.find((t) => !t.cible); if (autre) { autre.porteur = sc.roulants[1]; autre.rot = rf(-0.25, 0.25); } }
    }

    // --- Objets à moitié couvrants ---
    const nbCouv = Math.min(man.c || 0, sc.tels.length);
    for (let i = 0; i < nbCouv; i++) {
      const tel = sc.tels.filter((t) => t.cible && !t.porteur && !t.cachette)[i];
      if (!tel) break;
      const t = pick(COUVRANTS);
      const s = (Math.max(tt.w, tt.h) * 1.25) / Math.max(OBJ[t].w, OBJ[t].h);
      const ang = rf(0, Math.PI * 2);
      const dist = tt.h * rf(0.42, 0.55);
      sc.couvrants.push({ t, k: pick(COULEURS), x: tel.x + Math.cos(ang) * dist / W, y: tel.y + Math.sin(ang) * dist / H, rot: rf(-0.8, 0.8), w: OBJ[t].w * s, h: OBJ[t].h * s });
    }

    // --- Objets ordinaires et leurres ---
    const pool = OBJ_COMMUNS.concat(DECORS[decor].objets, DECORS[decor].objets);
    const total = Math.round((man.o || 12) * facteur);
    const nbL = Math.round((man.l || 0) * facteur);
    // pas trop d'objets entassés sur les meubles : environ un par largeur d'objet
    let placeMeubles = Math.round(surf.reduce((a, s) => a + ((s.x1 - s.x0) * W) / (U * 0.85), 0));
    for (let i = 0; i < total; i++) {
      const leurre = i < nbL;
      const t = leurre ? LEURRES[i % LEURRES.length] : pick(pool);
      const s = leurre ? U * niv.tel * rf(0.95, 1.1) : U * rf(0.85, 1.15);
      const w = OBJ[t].w * s, h = OBJ[t].h * s;
      const r = Math.hypot(w, h) / 2;
      // les objets évitent le téléphone (sauf les couvrants, placés exprès)
      const p = (surf.length && placeMeubles > 0 && rnd() < 0.28 && (placeMeubles--, surMeuble(h, r * 0.55))) || point(r * 0.55, 25, true) || { x: rf(z.x0, z.x1), y: rf(z.y0, z.y1) };
      sc.objs.push({ t, k: pick(COULEURS), x: p.x, y: p.y, rot: rf(-0.7, 0.7), w, h, leurre });
    }
    sc.objs.sort((a, b) => a.y - b.y);
    // lumière et curseur au centre de l'écran
    sc.lumiere.x = W / 2; sc.lumiere.y = H * 0.6;
    sc.curseur.x = W / 2; sc.curseur.y = H * 0.6;
    return sc;
  }

  // ---------- Dessin du fond (décor + objets immobiles) ----------
  function dessinerFond() {
    if (!scene) return;
    const SW = W * scene.pano;
    let d = DPR;
    if (SW * d > 4096) d = 4096 / SW;
    scene.fondDpr = d;
    fondCv.width = Math.round(SW * d); fondCv.height = Math.round(H * d);
    const c = fondCtx;
    c.setTransform(d, 0, 0, d, 0, 0);
    const dec = DECORS[scene.decor];
    const hz = dec.horizon * H;
    let g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, dec.mur[0]); g.addColorStop(1, dec.mur[1]);
    c.fillStyle = g; c.fillRect(0, 0, SW, hz);
    g = c.createLinearGradient(0, hz, 0, H);
    g.addColorStop(0, dec.sol[0]); g.addColorStop(1, dec.sol[1]);
    c.fillStyle = g; c.fillRect(0, hz, SW, H - hz);
    // texture du mur et du sol
    if (scene.decor === 'chambre' || scene.decor === 'salon' || scene.decor === 'salle') {
      c.fillStyle = 'rgba(255,255,255,.35)';
      for (let x = 10; x < SW; x += 28) for (let y = 10; y < hz - 6; y += 28) { c.beginPath(); c.arc(x + ((y / 28) % 2) * 14, y, 2.2, 0, 7); c.fill(); }
    }
    if (scene.decor === 'grenier') { c.strokeStyle = 'rgba(0,0,0,.18)'; c.lineWidth = 2; for (let x = 0; x < SW; x += 34) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, hz); c.stroke(); } }
    if (['chambre', 'salon', 'grenier'].includes(scene.decor)) {
      c.strokeStyle = 'rgba(80,40,10,.25)'; c.lineWidth = 2;
      for (let y = hz + 30; y < H; y += 38) { c.beginPath(); c.moveTo(0, y); c.lineTo(SW, y); c.stroke(); }
    }
    if (['jardin', 'parc'].includes(scene.decor)) {
      c.strokeStyle = 'rgba(40,110,40,.45)'; c.lineWidth = 2;
      for (let i = 0; i < SW * 0.12; i++) { const x = (i * 97.3) % SW, y = hz + ((i * 53.7) % (H - hz)); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 3, y - 7); c.moveTo(x, y); c.lineTo(x + 3, y - 8); c.stroke(); }
    }
    if (scene.decor === 'plage') { c.fillStyle = 'rgba(180,140,60,.35)'; for (let i = 0; i < SW * 0.25; i++) { c.beginPath(); c.arc((i * 73.1) % SW, hz + ((i * 41.3) % (H - hz)), 1.5, 0, 7); c.fill(); } }
    if (!['jardin', 'plage', 'parc'].includes(scene.decor)) { c.fillStyle = 'rgba(0,0,0,.12)'; c.fillRect(0, hz - 3, SW, 6); }
    // meubles
    for (const m of scene.meubles) {
      const V = Math.min(W, H * 0.75);
      let x = m.x * W, y = m.y * H, w = m.w * V, h = m.h * V;
      if (m.plein === true) { w = m.w * W; h = m.h * H; }
      if (m.plein === 'x' || m.plein === 'xy') w = m.w * W;
      if (m.plein === 'xy') h = m.h * H;
      // posé sur le sol : le bas du meuble touche l'horizon
      if (['lit', 'canape', 'plantegrande', 'comptoir', 'frigo', 'tente', 'malle', 'cartons', 'arbre', 'buisson', 'parasol', 'banc', 'lampe'].includes(m.t)) y = hz + H * 0.06 - h;
      if (m.t === 'barriere') y = hz - h + 4;
      if (m.t === 'mer') { y = hz - h; }
      c.save(); c.strokeStyle = CONTOUR;
      MEUBLES[m.t](c, x, y, w, h, m.k);
      c.restore();
    }
    // objets immobiles
    for (const o of scene.objs) dessinerObjet(c, o, o.x * W, o.y * H);
  }

  function dessinerObjet(c, o, x, y, rot, alpha) {
    c.save(); c.translate(x, y); c.rotate(rot === undefined ? (o.rot || 0) : rot);
    if (alpha !== undefined) c.globalAlpha = alpha;
    // petite ombre
    c.fillStyle = 'rgba(0,0,0,.14)'; c.beginPath(); c.ellipse(2, o.h * 0.42, o.w * 0.45, Math.max(3, o.h * 0.12), 0, 0, 7); c.fill();
    lw(c, o.w, o.h); c.strokeStyle = CONTOUR;
    OBJ[o.t].d(c, o.w, o.h, o.k);
    c.restore();
  }

  // Position actuelle d'un téléphone (il peut être porté par un objet qui roule), en pixels de scène.
  function posTel(t) {
    if (t.porteur) return { x: t.porteur.x * W, y: t.porteur.y * H - t.porteur.h * 0.32 };
    return { x: t.x * W, y: t.y * H };
  }

  // ---------- Animation et dessin de chaque image ----------
  function majScene(dt) {
    const sc = scene;
    sc.temps += dt;
    for (const r of sc.roulants) {
      const a = sc.temps * r.vit + r.ph;
      const nx = r.x0 + r.ax * Math.sin(a);
      r.dir = Math.cos(a) >= 0 ? 1 : -1;
      r.x = clamp(nx, 0.05, sc.pano - 0.05);
      r.y = r.y0 + r.ay * Math.sin(a * 1.7);
      r.angle = r.roule ? (r.x * W) / (r.w / 2) : 0;
    }
    // vibration de la cachette du téléphone
    for (const ca of sc.cachettes) {
      if (ca.secousse > 0) ca.secousse = Math.max(0, ca.secousse - dt);
      if (ca.tel && !ca.levee && etat.phase === 'cherche') {
        ca.minuteur -= dt;
        if (ca.minuteur <= 0) {
          ca.minuteur = 4.6 - sc.vibre * 1.6;
          ca.secousse = 0.3 + sc.vibre * 0.35;
          Son.bzz(panDe(ca.x * W - sc.cam), 0.02 + sc.vibre * 0.04);
        }
      }
      if (ca.levee && ca.leve < 1) ca.leve = Math.min(1, ca.leve + dt * 3);
    }
    for (const t of sc.tels) { if (t.secoue > 0) t.secoue = Math.max(0, t.secoue - dt); if (t.rate > 0) t.rate = Math.max(0, t.rate - dt); }
    for (const p of sc.parts) { p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.rot += p.vr * dt; }
    sc.parts = sc.parts.filter((p) => p.vie > 0);
    for (const mq of sc.marques) mq.vie -= dt;
    sc.marques = sc.marques.filter((m) => m.vie > 0);
    for (const o of sc.ondes) o.vie -= dt;
    sc.ondes = sc.ondes.filter((o) => o.vie > 0);
    // caméra : suit le curseur clavier
    if (sc.pano > 1 && sc.curseur.voir) {
      const sx = sc.curseur.x - sc.cam;
      if (sx < W * 0.2) sc.cam -= (W * 0.2 - sx) * Math.min(1, dt * 6);
      if (sx > W * 0.8) sc.cam += (sx - W * 0.8) * Math.min(1, dt * 6);
    }
    sc.cam = clamp(sc.cam, 0, W * sc.pano - W);
  }

  function panDe(sx) { return clamp((sx - W / 2) / (W / 2), -1, 1) * 0.9; }

  function dessiner() {
    const c = ctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);
    if (!scene) return;
    const sc = scene;
    let sx = 0, sy = 0;
    if (etat.secousse > 0) { sx = rf(-6, 6) * etat.secousse * 3; sy = rf(-4, 4) * etat.secousse * 3; }
    c.save();
    c.translate(-sc.cam + sx, sy);
    const fd = sc.fondDpr || DPR;
    c.drawImage(fondCv, 0, 0, fondCv.width / fd, fondCv.height / fd);
    // objets qui roulent et téléphones portés
    const roul = sc.roulants.slice().sort((a, b) => a.y - b.y);
    for (const r of roul) {
      c.save(); c.translate(r.x * W, r.y * H); if (r.dir < 0 && !r.roule) c.scale(-1, 1);
      dessinerObjet(c, r, 0, 0, r.roule ? r.angle : 0);
      c.restore();
      for (const t of sc.tels) if (t.porteur === r) dessinerTel(c, t);
    }
    // téléphones posés
    for (const t of sc.tels) if (!t.porteur && !t.cachette) dessinerTel(c, t);
    // téléphones sous une cachette soulevée
    for (const t of sc.tels) if (t.cachette && t.cachette.leve > 0.15) dessinerTel(c, t);
    // objets sous les cachettes soulevées
    for (const ca of sc.cachettes) if (ca.levee && ca.dessous) dessinerObjet(c, { t: ca.dessous, k: '#3c7be0', w: OBJ[ca.dessous].w * U * 0.7, h: OBJ[ca.dessous].h * U * 0.7, rot: 0.3 }, ca.x * W, ca.y * H + 4, 0.3, Math.min(1, ca.leve * 1.5));
    // objets qui couvrent en partie
    for (const o of sc.couvrants) dessinerObjet(c, o, o.x * W, o.y * H);
    // cachettes
    for (const ca of sc.cachettes) {
      const sec = ca.secousse > 0 ? Math.sin(sc.temps * 70) * 0.06 * (0.4 + sc.vibre) : 0;
      const dy = -ca.leve * ca.h * 1.1;
      dessinerObjet(c, ca, ca.x * W + (ca.secousse > 0 ? Math.sin(sc.temps * 90) * 2 * sc.vibre : 0), ca.y * H + dy, sec, 1 - ca.leve * 0.55);
      if (ca.secousse > 0 && !ca.levee) {
        c.save(); c.strokeStyle = 'rgba(255,138,61,' + (0.3 + sc.vibre * 0.6) + ')'; c.lineWidth = 3; c.lineCap = 'round';
        const x = ca.x * W, y = ca.y * H;
        for (const s of [-1, 1]) { c.beginPath(); c.moveTo(x + s * (ca.w * 0.62), y - ca.h * 0.2); c.quadraticCurveTo(x + s * (ca.w * 0.72), y, x + s * (ca.w * 0.62), y + ca.h * 0.2); c.stroke(); }
        c.restore();
      }
    }
    // particules et marques
    for (const p of sc.parts) {
      c.save(); c.globalAlpha = clamp(p.vie / p.max, 0, 1); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = p.k;
      if (p.forme === 'etoile') dessinerForme(c, 'etoile', p.t, p.k); else if (p.forme === 'nuage') { c.beginPath(); c.arc(0, 0, p.t * (1.6 - p.vie / p.max), 0, 7); c.fillStyle = 'rgba(255,255,255,.85)'; c.fill(); } else c.fillRect(-p.t / 2, -p.t / 4, p.t, p.t / 2);
      c.restore();
    }
    c.restore();

    // le noir et la lampe de poche
    if (sc.noir && etat.phase !== 'fini') {
      const n = noirCtx;
      n.setTransform(DPR, 0, 0, DPR, 0, 0);
      n.globalCompositeOperation = 'source-over';
      n.clearRect(0, 0, W, H);
      n.fillStyle = 'rgba(8,8,24,0.985)'; n.fillRect(0, 0, W, H);
      n.globalCompositeOperation = 'destination-out';
      const R = sc.noir * Math.min(W, H);
      const g = n.createRadialGradient(sc.lumiere.x, sc.lumiere.y, R * 0.55, sc.lumiere.x, sc.lumiere.y, R);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      n.fillStyle = g; n.beginPath(); n.arc(sc.lumiere.x, sc.lumiere.y, R, 0, 7); n.fill();
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.drawImage(noirCv, 0, 0);
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      // halo jaune de la lampe
      c.save(); c.strokeStyle = 'rgba(255,230,140,.35)'; c.lineWidth = 3; c.beginPath(); c.arc(sc.lumiere.x, sc.lumiere.y, R * 0.98, 0, 7); c.stroke(); c.restore();
      // téléphones trouvés ou qui sonnent : visibles même dans le noir
      c.save(); c.translate(-sc.cam, 0);
      for (const t of sc.tels) if (t.trouve || t.secoue > 0) dessinerTel(c, t, true);
      c.restore();
    }

    // ondes de la sonnerie
    c.save(); c.translate(-sc.cam, 0);
    for (const o of sc.ondes) {
      const k = 1 - o.vie / o.max;
      for (let i = 0; i < 3; i++) {
        const kk = (k * 2 + i / 3) % 1;
        c.strokeStyle = 'rgba(255,138,61,' + (1 - kk) * 0.9 + ')'; c.lineWidth = 4;
        c.beginPath(); c.arc(o.x, o.y, 14 + kk * U * 1.3, 0, 7); c.stroke();
      }
    }
    // marques (bonne réponse, erreur)
    for (const mq of sc.marques) {
      c.save(); c.globalAlpha = clamp(mq.vie / 0.4, 0, 1); c.translate(mq.x, mq.y); c.lineCap = 'round';
      const r = 16 + (1 - mq.vie / mq.max) * 6;
      if (mq.ok) { c.strokeStyle = '#2fa35a'; c.lineWidth = 6; c.beginPath(); c.arc(0, 0, r + 12, 0, 7); c.stroke(); }
      else { c.strokeStyle = '#ffffff'; c.lineWidth = 9; c.beginPath(); c.moveTo(-r, -r); c.lineTo(r, r); c.moveTo(r, -r); c.lineTo(-r, r); c.stroke(); c.strokeStyle = '#e3485a'; c.lineWidth = 5; c.stroke(); }
      c.restore();
    }
    c.restore();

    // flèches du panorama et barre de position
    if (sc.pano > 1) {
      const SW = W * sc.pano;
      const pul = 0.55 + Math.sin(performance.now() / 250) * 0.25;
      c.save(); c.fillStyle = 'rgba(255,255,255,' + pul + ')'; c.strokeStyle = CONTOUR; c.lineWidth = 2.5;
      if (sc.cam > 4) { c.beginPath(); c.moveTo(10, H / 2); c.lineTo(32, H / 2 - 22); c.lineTo(32, H / 2 + 22); c.closePath(); c.fill(); c.stroke(); }
      if (sc.cam < SW - W - 4) { c.beginPath(); c.moveTo(W - 10, H / 2); c.lineTo(W - 32, H / 2 - 22); c.lineTo(W - 32, H / 2 + 22); c.closePath(); c.fill(); c.stroke(); }
      const bw = W * 0.5, bx = (W - bw) / 2, by = H - (etat.phase === 'regarde' ? 34 : 14);
      c.fillStyle = 'rgba(0,0,0,.35)'; rr(c, bx, by, bw, 8, 4); c.fill();
      c.fillStyle = '#ffffff'; rr(c, bx + (sc.cam / SW) * bw, by, (W / SW) * bw, 8, 4); c.fill();
      c.restore();
      // téléphone qui sonne hors de l'écran : flèche vers lui
      for (const t of sc.tels) {
        if (t.secoue <= 0) continue;
        const p = posTel(t); const x = p.x - sc.cam;
        if (x < 0 || x > W) { const g = x < 0; c.save(); c.fillStyle = '#ff8a3d'; c.beginPath(); const ax = g ? 40 : W - 40; c.moveTo(ax + (g ? -18 : 18), p.y); c.lineTo(ax + (g ? 8 : -8), p.y - 18); c.lineTo(ax + (g ? 8 : -8), p.y + 18); c.closePath(); c.fill(); c.restore(); }
      }
    }

    // curseur du clavier
    if (sc.curseur.voir && etat.phase !== 'fini') {
      const x = sc.curseur.x - sc.cam, y = sc.curseur.y;
      c.save(); c.lineWidth = 5; c.strokeStyle = '#ffffff';
      c.beginPath(); c.arc(x, y, 18, 0, 7); c.moveTo(x - 28, y); c.lineTo(x - 10, y); c.moveTo(x + 10, y); c.lineTo(x + 28, y); c.moveTo(x, y - 28); c.lineTo(x, y - 10); c.moveTo(x, y + 10); c.lineTo(x, y + 28); c.stroke();
      c.lineWidth = 2.5; c.strokeStyle = '#e3485a'; c.stroke(); c.restore();
    }
  }

  function dessinerTel(c, t, forceAllume) {
    if (!t.visible && !t.trouve) return;
    const p = posTel(t);
    c.save(); c.translate(p.x, p.y);
    let rot = t.rot;
    if (t.secoue > 0) rot += Math.sin(scene.temps * 60) * 0.12;
    if (t.rate > 0) c.translate(Math.sin(scene.temps * 80) * 4, 0);
    c.rotate(rot);
    if (t.trouve) { c.save(); c.fillStyle = 'rgba(255,240,120,.55)'; c.beginPath(); c.arc(0, 0, Math.max(t.w, t.h) * 0.85, 0, 7); c.fill(); c.restore(); }
    c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(3, t.h * 0.45, t.w * 0.5, t.h * 0.1, 0, 0, 7); c.fill();
    c.strokeStyle = CONTOUR;
    dessinerTelephone(c, t.w, t.h, t.prop, t.trouve || t.secoue > 0 || forceAllume);
    c.restore();
  }

  // ---------- Effets ----------
  function confettis(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = rf(0, Math.PI * 2), v = rf(80, 260);
      scene.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: rf(0.7, 1.2), max: 1.2, t: rf(6, 11), k: pick(COULEURS.concat(['#ffd84a', '#ffffff'])), rot: rf(0, 6), vr: rf(-8, 8), forme: i % 3 === 0 ? 'etoile' : 'rect' });
    }
  }
  function pouf(x, y) {
    for (let i = 0; i < 8; i++) { const a = i * 0.785; scene.parts.push({ x: x + Math.cos(a) * 10, y: y + Math.sin(a) * 10, vx: Math.cos(a) * 50, vy: Math.sin(a) * 50 - 30, vie: 0.6, max: 0.6, t: 10, k: '#fff', rot: 0, vr: 0, forme: 'nuage' }); }
  }
  let toastMinuteur = 0;
  function toast(cle, vars, bon) {
    const el = $('toast');
    el.textContent = tr(cle, vars);
    el.classList.toggle('bon', !!bon);
    el.classList.add('voir');
    clearTimeout(toastMinuteur);
    toastMinuteur = setTimeout(() => el.classList.remove('voir'), 1300);
  }

  // ---------- Interface de la partie ----------
  const SVG_COEUR = '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="#ff5a6e" stroke="#2a2238" stroke-width="2"/></svg>';
  const SVG_ETOILE = (k) => '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="' + k + '" stroke="#2a2238" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  const SVG_CADENAS = '<svg class="cadenas" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2.5" fill="#b9a993" stroke="#7a6a5c" stroke-width="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#7a6a5c" stroke-width="2.5"/></svg>';

  function majCoeurs(eclate) {
    const el = $('coeurs');
    if (!el.children.length) el.innerHTML = SVG_COEUR + SVG_COEUR + SVG_COEUR;
    [...el.children].forEach((s, i) => {
      s.classList.toggle('perdu', i >= etat.coeurs);
      if (eclate && i === etat.coeurs) { s.classList.remove('eclate'); void s.getBoundingClientRect(); s.classList.add('eclate'); }
    });
  }
  function majHud() {
    $('hud-niveau').textContent = tr('hud.niveau', { n: nb(etat.n + 1) });
    $('hud-manche').textContent = tr('hud.manche', { m: nb(etat.m + 1), t: nb(NIVEAUX[etat.n].manches.length) }) + ' · ' + tr('lieu.' + scene.decor);
    majCoeurs(false);
    majSonner();
  }
  function majSonner() {
    const b = $('b-sonner');
    const niv = NIVEAUX[etat.n];
    b.classList.toggle('cache', !niv.sonner);
    b.disabled = etat.sonnerDispo <= 0 || etat.phase !== 'cherche';
    $('sonner-n').textContent = nb(Math.max(0, etat.sonnerDispo));
  }

  // Icônes des téléphones à trouver (petits dessins).
  function majIcones() {
    const box = $('mission-icones');
    box.innerHTML = '';
    for (const t of scene.tels) {
      if (!t.cible) continue;
      const k = document.createElement('canvas');
      k.width = 60; k.height = 100;
      const c = k.getContext('2d');
      c.translate(30, 50); c.strokeStyle = CONTOUR;
      c.globalAlpha = t.trouve ? 0.55 : 1;
      dessinerTelephone(c, 40, 76, t.prop, false);
      if (t.trouve) { c.globalAlpha = 1; c.strokeStyle = '#2fa35a'; c.lineWidth = 12; c.lineCap = 'round'; c.beginPath(); c.moveTo(-18, 0); c.lineTo(-4, 16); c.lineTo(22, -18); c.stroke(); }
      box.appendChild(k);
    }
  }
  function majMission() {
    const sc = scene;
    const cibles = sc.tels.filter((t) => t.cible);
    const tel = tr('tel.' + cibles[0].prop.id);
    let cle, vars = { tel, n: cibles.length };
    if (sc.flash && etat.phase === 'regarde') cle = cibles.length > 1 ? 'mission.regardePlus' : 'mission.regarde';
    else if (sc.flash) cle = cibles.length > 1 ? 'mission.ouEtaientIls' : 'mission.ouEtaitIl';
    else if (sc.cachettes.length) cle = 'mission.cachettes';
    else if (sc.bon) cle = 'mission.bon';
    else if (cibles.length > 1) cle = 'mission.plusieurs';
    else if (sc.noir) cle = 'mission.noir';
    else if (sc.roulants.some((r) => sc.tels.some((t) => t.porteur === r))) cle = 'mission.roule';
    else cle = 'mission.un';
    const el = $('mission-texte');
    el.textContent = tr(cle, vars);
    const aide = sc.pano > 1 ? 'aide.pano' : sc.noir ? 'aide.noir' : null;
    if (aide) { const s = document.createElement('small'); s.textContent = tr(aide); el.appendChild(s); }
    majIcones();
  }

  // ---------- Déroulement d'un niveau ----------
  let attenteManche = 0;
  function lancerNiveau(i) {
    etat.n = clamp(i, 0, NIVEAUX.length - 1);
    etat.m = 0; etat.coeurs = 3; etat.score = 0; etat.erreurs = 0; etat.sonneries = 0;
    etat.enPartie = true; etat.pause = false; etat.phase = 'attente';
    clearTimeout(attenteManche);
    $('bandeau').classList.remove('voir');
    fermerVoiles();
    montrerEcran('partie');
    mesurer();
    demarrerManche(0);
    // tutoriels des nouveautés de ce niveau (une seule fois)
    etat.tutoFile = NIVEAUX[etat.n].tutos.filter((k) => !progres.tutos[k]);
    if (etat.tutoFile.length) montrerTuto(etat.tutoFile.shift());
  }

  function demarrerManche(m) {
    const niv = NIVEAUX[etat.n];
    etat.m = m;
    const man = niv.manches[m];
    const decor = niv.decors[m % niv.decors.length];
    scene = creerScene(niv, man, decor);
    dessinerFond();
    etat.tempsMax = man.temps || niv.temps;
    etat.temps = etat.tempsMax;
    etat.sonnerDispo = niv.sonner;
    etat.tic = 0;
    etat.secousse = 0;
    if (scene.flash) {
      etat.phase = 'regarde'; etat.regardMax = scene.flash; etat.regard = scene.flash;
      $('regard').classList.add('voir');
    } else { etat.phase = 'cherche'; $('regard').classList.remove('voir'); }
    if (scene.pano > 1) scene.cam = rf(0, W * scene.pano - W) * 0.5;
    $('barre-temps').classList.remove('urgent');
    majHud(); majMission();
  }

  function finManche() {
    etat.phase = 'fini';
    etat.score += Math.ceil(etat.temps) * 10;
    const niv = NIVEAUX[etat.n];
    if (etat.m + 1 < niv.manches.length) {
      const prochain = niv.decors[(etat.m + 1) % niv.decors.length];
      const b = $('bandeau');
      b.textContent = tr('bandeau.bravo');
      const s = document.createElement('small'); s.textContent = tr('bandeau.suite', { lieu: tr('lieu.' + prochain) }); b.appendChild(s);
      b.classList.add('voir');
      attenteManche = setTimeout(() => { b.classList.remove('voir'); if (etat.enPartie) demarrerManche(etat.m + 1); }, 1500);
    } else {
      attenteManche = setTimeout(() => victoire(), 900);
    }
  }

  function trouver(t) {
    t.trouve = true; t.visible = true;
    const p = posTel(t);
    confettis(p.x, p.y, 26);
    scene.marques.push({ x: p.x, y: p.y, vie: 0.8, max: 0.8, ok: true });
    Son.trouve();
    etat.score += 100;
    toast(pick(['bravo.1', 'bravo.2', 'bravo.3', 'bravo.4']), null, true);
    majIcones();
    if (scene.tels.filter((x) => x.cible).every((x) => x.trouve)) finManche();
  }

  function erreur(x, y, cle) {
    etat.erreurs++;
    etat.coeurs--;
    etat.secousse = 0.25;
    Son.erreur();
    scene.marques.push({ x, y, vie: 0.7, max: 0.7, ok: false });
    toast(cle);
    majCoeurs(true);
    if (etat.coeurs <= 0) { etat.phase = 'fini'; attenteManche = setTimeout(() => defaite('coeurs'), 700); }
  }

  // Le joueur touche la scène au point (sx, sy) de l'écran.
  function toucherScene(sx, sy) {
    if (!scene || !etat.enPartie || etat.pause) return;
    if (etat.phase === 'regarde') { toast('toast.attends'); return; }
    if (etat.phase !== 'cherche') return;
    const sc = scene;
    // dans le noir : toucher hors de la lumière déplace seulement la lampe
    if (sc.noir) {
      const R = sc.noir * Math.min(W, H);
      if (Math.hypot(sx - sc.lumiere.x, sy - sc.lumiere.y) > R * 0.9) { sc.lumiere.x = sx; sc.lumiere.y = sy; Son.clic(); return; }
    }
    const x = sx + sc.cam, y = sy;
    Son.toucher();
    // 1) coup d'œil : l'endroit où était un téléphone
    if (sc.flash) {
      for (const t of sc.tels) {
        if (t.trouve || !t.cible) continue;
        const p = posTel(t);
        if (Math.hypot(p.x - x, p.y - y) <= Math.max(t.h * 0.85, 34)) { trouver(t); return; }
      }
      erreur(x, y, 'toast.pasLa');
      return;
    }
    // 2) cachettes : soulever celle qu'on touche
    if (sc.cachettes.length) {
      let meilleure = null, dmin = Infinity;
      for (const ca of sc.cachettes) {
        if (ca.levee) continue;
        const d = Math.hypot(ca.x * W - x, ca.y * H - y);
        if (d < Math.max(ca.w, ca.h) * 0.6 + 6 && d < dmin) { dmin = d; meilleure = ca; }
      }
      if (meilleure) {
        meilleure.levee = true; Son.souleve();
        if (meilleure.tel) { trouver(meilleure.tel); }
        else erreur(x, y, 'toast.vide');
        return;
      }
      // déjà trouvé ? sinon simple rappel, sans perdre de cœur
      toast('toast.sousCachette');
      return;
    }
    // 3) téléphones (le plus proche du doigt)
    let choix = null, dmin = Infinity;
    for (const t of sc.tels) {
      if (!t.visible || t.cachette) continue;
      const p = posTel(t);
      const dx = x - p.x, dy = y - p.y;
      const ca = Math.cos(-t.rot), sa = Math.sin(-t.rot);
      const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
      const hw = Math.max(t.w / 2 + 6, 22), hh = Math.max(t.h / 2 + 6, 24);
      if (Math.abs(lx) <= hw && Math.abs(ly) <= hh) { const d = Math.hypot(dx, dy); if (d < dmin) { dmin = d; choix = t; } }
    }
    if (choix) {
      if (choix.trouve) { toast('toast.deja'); return; }
      if (!choix.cible) { choix.rate = 0.4; erreur(x, y, 'toast.pasBon'); return; }
      trouver(choix);
      return;
    }
    // 4) un leurre ?
    const leurre = sc.objs.some((o) => o.leurre && Math.abs(o.x * W - x) < o.w * 0.6 && Math.abs(o.y * H - y) < o.h * 0.6);
    erreur(x, y, leurre ? 'toast.pasTel' : 'toast.rien');
  }

  function faireSonner() {
    if (!scene || etat.phase !== 'cherche' || etat.pause || etat.sonnerDispo <= 0) return;
    const t = scene.tels.find((x) => x.cible && !x.trouve);
    if (!t) return;
    etat.sonnerDispo--; etat.sonneries++;
    const p = posTel(t);
    t.secoue = 2.0;
    if (t.cachette) t.cachette.secousse = 2.0;
    scene.ondes.push({ x: p.x, y: p.y, vie: 2.0, max: 2.0 });
    Son.sonnerie(panDe(p.x - scene.cam));
    majSonner();
  }

  // ---------- Fins de niveau ----------
  function calculerEtoiles() {
    const fautes = etat.erreurs + etat.sonneries;
    return fautes === 0 ? 3 : fautes === 1 ? 2 : 1;
  }

  function victoire() {
    if (!etat.enPartie) return;
    etat.enPartie = false; etat.phase = 'fini';
    const i = etat.n;
    etat.score += etat.coeurs * 50;
    const etoiles = calculerEtoiles();
    const ancien = progres.records[i];
    const nouveau = etat.score > ancien;
    progres.etoiles[i] = Math.max(progres.etoiles[i], etoiles);
    if (nouveau) progres.records[i] = etat.score;
    progres.max = Math.max(progres.max, Math.min(NIVEAUX.length, i + 2));
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: i + 1 });
    window.JEL_SAVE.save(JEU, { niveau: Math.min(NIVEAUX.length, i + 2), score: totalScore(), etoiles: progres.etoiles, records: progres.records, max: progres.max, tutos: progres.tutos, options: { son: progres.son } });
    garderLocal();
    // Jeu terminé (dernier niveau gagné, maintenant ou avant) : total des meilleures étoiles.
    if (progres.etoiles[NIVEAUX.length - 1] > 0) {
      if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
    }
    Son.victoire();
    pluieConfettis();
    afficherFin(true, etoiles, nouveau, ancien);
  }

  function defaite(raison) {
    if (!etat.enPartie) return;
    etat.enPartie = false; etat.phase = 'fini';
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: etat.n + 1 });
    Son.defaite();
    afficherFin(false, 0, false, progres.records[etat.n], raison);
  }

  let compteur = 0;
  function afficherFin(gagne, etoiles, nouveau, ancien, raison) {
    const dernier = gagne && etat.n === NIVEAUX.length - 1;
    $('fin-titre').textContent = tr(gagne ? 'fin.bravo' : 'fin.perdu');
    $('fin-raison').textContent = gagne ? tr('fin.trouves', { n: nb(etat.n + 1) }) : tr(raison === 'temps' ? 'fin.raisonTemps' : 'fin.raisonCoeurs');
    const box = $('fin-etoiles');
    box.innerHTML = SVG_ETOILE('#ffc93c') + SVG_ETOILE('#ffc93c') + SVG_ETOILE('#ffc93c');
    box.style.display = gagne ? 'flex' : 'none';
    [...box.children].forEach((s, k) => { if (k < etoiles) setTimeout(() => { s.classList.add('gagnee'); Son.etoile(k); }, 450 + k * 380); });
    // score qui défile
    const cible = etat.score;
    let v = 0; clearInterval(compteur);

        if (i === 1 && t > 0.4 && t < 1.1) { c.save(); c.strokeStyle = '#ff8a3d'; c.lineWidth = 3; c.beginPath(); c.arc(140, 125, 42, -0.5, 0.5); c.moveTo(140 - 42 * Math.cos(0.5), 125 - 42 * Math.sin(0.5)); c.arc(140, 125, 42, Math.PI - 0.5, Math.PI + 0.5); c.stroke(); c.restore(); }
      }
      if (t > 1.8) demoOk(c, 140, 125);
      main(c, lerp(240, 142, (t - 0.6) / 0.9), lerp(185, 130, (t - 0.6) / 0.9), t > 1.5 && t < 1.8);
    } else if (k === 'noir') {

      demoTel(c, 215, 100, papa, 1, t > 2.2, 0.2);
      const lx = lerp(50, 210, t / 1.8), ly = lerp(140, 104, t / 1.8);
      c.save(); c.fillStyle = 'rgba(8,8,24,.94)'; c.beginPath(); c.rect(0, 0, 280, 190); c.arc(lx, ly, 46, 0, 7, true); c.fill('evenodd'); c.restore();
      if (t > 2.2) demoOk(c, 215, 100);

  // ---------- Boucle principale ----------
  let avant = performance.now();
  function boucle(maintenant) {
    const dt = Math.min(0.05, (maintenant - avant) / 1000);
    avant = maintenant;
    if (etat.ecran === 'partie' && scene) {
      const actif = etat.enPartie && !etat.pause;
      if (actif) {
        majTouchesCurseur(dt);
        majScene(dt);
        if (etat.secousse > 0) etat.secousse = Math.max(0, etat.secousse - dt);
        if (etat.phase === 'regarde') {
          etat.regard -= dt;
          $('regard').firstElementChild.style.transform = 'scaleX(' + clamp(etat.regard / etat.regardMax, 0, 1) + ')';
          if (etat.regard <= 0) {
            etat.phase = 'cherche';
            $('regard').classList.remove('voir');
            for (const t of scene.tels) { t.visible = false; const p = posTel(t); pouf(p.x, p.y); }
            Son.pouf();
            majMission(); majSonner();
          }
        } else if (etat.phase === 'cherche') {
          etat.temps -= dt;
          if (etat.temps <= 5 && Math.ceil(etat.temps) !== etat.tic) { etat.tic = Math.ceil(etat.temps); if (etat.tic > 0) Son.tic(); $('barre-temps').classList.add('urgent'); }
          if (etat.temps <= 0) { etat.temps = 0; etat.phase = 'fini'; toast('toast.temps'); attenteManche = setTimeout(() => defaite('temps'), 700); }
        }
        $('barre-temps').firstElementChild.style.transform = 'scaleX(' + clamp(etat.temps / etat.tempsMax, 0, 1) + ')';
      } else if (etat.phase === 'fini' && !etat.pause) {
        majScene(dt); // les confettis continuent
      }
      dessiner();
    }
    dessinerTuto(dt);
    majPluie(dt);
    requestAnimationFrame(boucle);
  }

  // ---------- Commandes : toucher, souris ----------
  let appui = null;
  function pointScene(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  cv.addEventListener('pointerdown', (e) => {
    Son.pret();
    if (!scene) return;
    e.preventDefault();
    const p = pointScene(e);
    appui = { x: p.x, y: p.y, x0: p.x, y0: p.y, cam: scene.cam, glisse: false, id: e.pointerId };
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
    scene.curseur.voir = false;
  });
  cv.addEventListener('pointermove', (e) => {
    if (!scene) return;
    const p = pointScene(e);
    // souris sans bouton : la lampe suit
    if (!appui) { if (e.pointerType === 'mouse' && scene.noir && etat.enPartie && !etat.pause) { scene.lumiere.x = p.x; scene.lumiere.y = p.y; } return; }
    if (Math.hypot(p.x - appui.x0, p.y - appui.y0) > 10) appui.glisse = true;
    if (appui.glisse && etat.enPartie && !etat.pause) {
      if (scene.pano > 1) scene.cam = clamp(appui.cam - (p.x - appui.x0), 0, W * scene.pano - W);
      if (scene.noir) { scene.lumiere.x = p.x; scene.lumiere.y = p.y; }
    }
  });
  function finAppui(e) {
    if (!appui || !scene) { appui = null; return; }
    const p = pointScene(e);
    const a = appui; appui = null;
    if (!a.glisse) toucherScene(p.x, p.y);
  }
  cv.addEventListener('pointerup', finAppui);
  cv.addEventListener('pointercancel', () => { appui = null; });
  cv.addEventListener('wheel', (e) => { if (scene && scene.pano > 1 && etat.enPartie && !etat.pause) { e.preventDefault(); scene.cam = clamp(scene.cam + (e.deltaX || e.deltaY), 0, W * scene.pano - W); } }, { passive: false });

  // ---------- Commandes : clavier ----------
  const touches = new Set();
  function majTouchesCurseur(dt) {
    if (!scene || !touches.size) return;
    const v = 300 * dt;
    const cu = scene.curseur;
    let bouge = false;
    if (touches.has('ArrowLeft')) { cu.x -= v; bouge = true; }
    if (touches.has('ArrowRight')) { cu.x += v; bouge = true; }
    if (touches.has('ArrowUp')) { cu.y -= v; bouge = true; }
    if (touches.has('ArrowDown')) { cu.y += v; bouge = true; }
    if (bouge) {
      cu.voir = true;
      cu.x = clamp(cu.x, 8, W * scene.pano - 8); cu.y = clamp(cu.y, 8, H - 8);
      if (scene.noir) { scene.lumiere.x = cu.x - scene.cam; scene.lumiere.y = cu.y; }
    }
  }
  document.addEventListener('keydown', (e) => {
    Son.pret();
    const code = e.code;
    if ($('tuto').classList.contains('actif')) {
      if (code === 'Enter' || code === 'Space' || code === 'Escape' || code === 'NumpadEnter') { e.preventDefault(); Son.bouton(); fermerTuto(); }
      return;
    }
    if ($('pause').classList.contains('actif')) {
      if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); reprendre(); }
      return;
    }
    if ($('fin').classList.contains('actif') || $('bilan').classList.contains('actif')) return; // boutons au clavier (Tab, Entrée)
    if (etat.ecran === 'titre') {
      if ((code === 'Enter' || code === 'Space') && document.activeElement === document.body) { e.preventDefault(); $('b-jouer').click(); }
      return;
    }
    if (etat.ecran === 'niveaux') { if (code === 'Escape') { e.preventDefault(); montrerEcran('titre'); } return; }
    if (etat.ecran !== 'partie' || !etat.enPartie) return;
    if (code === 'Escape' || code === 'KeyP') { e.preventDefault(); mettrePause(); return; }
    if (code.startsWith('Arrow')) {
      e.preventDefault();
      if (scene && !scene.curseur.voir) { scene.curseur.x = scene.cam + W / 2; scene.curseur.y = H * 0.6; }
      touches.add(code); return;
    }
    if (code === 'Enter' || code === 'Space' || code === 'NumpadEnter') {
      e.preventDefault();
      if (scene) {
        if (!scene.curseur.voir) { scene.curseur.voir = true; scene.curseur.x = scene.cam + W / 2; scene.curseur.y = H * 0.6; return; }
        const sx = scene.curseur.x - scene.cam, sy = scene.curseur.y;
        if (scene.noir) { scene.lumiere.x = sx; scene.lumiere.y = sy; }
        toucherScene(sx, sy);
      }
      return;
    }
    if (code === 'KeyS') { e.preventDefault(); faireSonner(); }
  });
  document.addEventListener('keyup', (e) => touches.delete(e.code));
  window.addEventListener('blur', () => touches.clear());

  // ---------- Boutons ----------
  function majBoutonsSon() { document.querySelectorAll('.b-son').forEach((b) => { b.classList.toggle('coupe', !progres.son); b.setAttribute('aria-pressed', progres.son ? 'true' : 'false'); }); }
  function basculerSon() { progres.son = !progres.son; Son.actif = progres.son; garderSon(); garderLocal(); majBoutonsSon(); Son.pret(); Son.bouton(); }
  document.querySelectorAll('.b-son').forEach((b) => b.addEventListener('click', basculerSon));
  majBoutonsSon();

  $('b-jouer').addEventListener('click', () => {
    Son.pret(); Son.bouton();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => lancerNiveau(clamp((Number(d.niveau) || 1) - 1, 0, NIVEAUX.length - 1)),
      // Nouvelle partie : au niveau 1 (étoiles et niveaux débloqués sont gardés)
      onNouvelle: () => lancerNiveau(0),
      onEffacer: () => {
        progres.etoiles = NIVEAUX.map(() => 0); progres.records = NIVEAUX.map(() => 0); progres.max = 1; progres.tutos = {};
        garderLocal();
      },
    });
  });
  $('b-niveaux').addEventListener('click', () => { Son.pret(); Son.bouton(); montrerEcran('niveaux'); });
  $('b-retour').addEventListener('click', () => { Son.bouton(); montrerEcran('titre'); });
  $('b-pause').addEventListener('click', () => { Son.pret(); Son.bouton(); mettrePause(); });
  $('b-reprendre').addEventListener('click', () => { Son.bouton(); reprendre(); });
  $('b-recommencer').addEventListener('click', () => { Son.bouton(); lancerNiveau(etat.n); });
  $('b-accueil').addEventListener('click', () => { Son.bouton(); allerAccueil(); });
  $('b-sonner').addEventListener('click', () => { Son.pret(); faireSonner(); });
  $('b-tuto-ok').addEventListener('click', () => { Son.pret(); Son.bouton(); fermerTuto(); });
  $('tuto').addEventListener('click', (e) => { if (e.target === $('tuto') || e.target === tcv) { Son.bouton(); fermerTuto(); } });
  $('b-fin-niveaux').addEventListener('click', () => { Son.bouton(); fermerVoiles(); scene = null; montrerEcran('niveaux'); });
  $('b-bilan-niveaux').addEventListener('click', () => { Son.bouton(); fermerVoiles(); scene = null; montrerEcran('niveaux'); });
  $('b-bilan-accueil').addEventListener('click', () => { Son.bouton(); allerAccueil(); });

  // Pause automatique quand l'écran est caché
  document.addEventListener('visibilitychange', () => { if (document.hidden && etat.enPartie && !$('tuto').classList.contains('actif')) mettrePause(); });

  // Sauvegarde à la fermeture, seulement pendant une partie
  window.JEL_SAVE.surFermeture(() => {
    if (etat.enPartie) {
      window.JEL_SAVE.save(JEU, { niveau: etat.n + 1, score: totalScore(), etoiles: progres.etoiles, records: progres.records, max: progres.max, tutos: progres.tutos, options: { son: progres.son } });
    }
  });

  // Taille de l'écran
  window.addEventListener('resize', () => { if (mesurer() && scene) dessinerFond(); });
  if (window.ResizeObserver) new ResizeObserver(() => { if (etat.ecran === 'partie' && mesurer() && scene) dessinerFond(); }).observe($('zone'));

  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
