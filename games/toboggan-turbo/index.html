  $('res-fin').classList.toggle('cache', !(dernier && S.etoiles.every((e) => e > 0)));
  $('resultats').classList.toggle('podium', rang <= 3);
  $('resultats').classList.remove('cache');
  majBourses();
}

// --- Entrées --------------------------------------------------------------------------------------
function brancherEntrees() {
  const zone = $('scene'); let x0 = 0, doigt = null;
  zone.addEventListener('pointerdown', (e) => {
    audioPret();
    if (JEUX.ecran !== 'course' || enPause()) return;
    doigt = e.pointerId; x0 = e.clientX; entree.glisse = true; entree.dx = 0; entree.rebase = true;
    try { zone.setPointerCapture(e.pointerId); } catch (x) { /* rien */ }
  });
  zone.addEventListener('pointermove', (e) => { if (entree.glisse && e.pointerId === doigt) entree.dx = (e.clientX - x0) / Math.max(320, window.innerWidth); });
  const fin = (e) => { if (e.pointerId === doigt) { entree.glisse = false; doigt = null; } };
  zone.addEventListener('pointerup', fin); zone.addEventListener('pointercancel', fin);
  zone.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    const c = e.code;
    if (c === 'ArrowLeft' || c === 'KeyA') { entree.gauche = true; e.preventDefault(); }
    else if (c === 'ArrowRight' || c === 'KeyD') { entree.droite = true; e.preventDefault(); }
    else if (c === 'Space') {
      if (e.target && e.target.tagName === 'BUTTON') return;      // Espace active déjà le bouton qui a le focus
      e.preventDefault();
      if (JEUX.tuto) suiteTuto(); else if (JEUX.ecran === 'course') utiliserObjetJoueur();
    } else if (c === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      if (JEUX.tuto) suiteTuto(); else if (JEUX.ecran === 'titre') jouer();
    } else if (c === 'Escape' || c === 'KeyP') {
      if (JEUX.ecran === 'course') { if (JEUX.pause) reprendre(); else mettreEnPause(); }
      else if (JEUX.ecran === 'niveaux' || JEUX.ecran === 'boutique') allerTitre();
    } else if (c === 'KeyF') { JEUX.debug = !JEUX.debug; $('debug').classList.toggle('cache', !JEUX.debug); }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') entree.gauche = false;
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') entree.droite = false;
  });
  window.addEventListener('blur', () => { entree.gauche = entree.droite = false; });
  window.addEventListener('resize', redimensionner);
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettreEnPause(); });

  const clic = (id, f) => $(id).addEventListener('click', f);
  clic('b-jouer', jouer);
  clic('b-niveaux', () => { audioPret(); SON.clic(); allerNiveaux(); });
  clic('b-boutique', () => { audioPret(); SON.clic(); JEUX.vitrineBouee = S.bouee; allerBoutique('bouees'); });
  for (const el of document.querySelectorAll('.b-son')) el.addEventListener('click', basculerSon);
  for (const el of document.querySelectorAll('.b-retour')) el.addEventListener('click', () => { audioPret(); SON.clic(); allerTitre(); });
  clic('onglet-bouees', () => { SON.clic(); allerBoutique('bouees'); });
  clic('onglet-amelios', () => { SON.clic(); allerBoutique('amelios'); });
  clic('b-pause', () => { audioPret(); mettreEnPause(); });
  clic('b-objet', utiliserObjetJoueur);
  clic('p-reprendre', reprendre);
  clic('p-recommencer', () => { reprendre(); lancerCourse(JEUX.niveau); });
  clic('p-accueil', () => { reprendre(); allerTitre(); });
  clic('tuto-suivant', suiteTuto);
  clic('res-suivant', () => { SON.clic(); lancerCourse(Math.min(NIVEAUX.length, JEUX.niveau + 1)); });
  clic('res-rejouer', () => { SON.clic(); lancerCourse(JEUX.niveau); });
  clic('res-niveaux', () => { SON.clic(); allerNiveaux(); });
  clic('res-boutique', () => { SON.clic(); JEUX.vitrineBouee = S.bouee; allerBoutique('bouees'); });

  // fermeture de la page pendant une course : on garde le niveau en cours
  window.JEL_SAVE.surFermeture(() => { if (JEUX.ecran === 'course' && JEUX.course && !JEUX.resultats) sauver(JEUX.niveau); });
  // changement de langue sans rechargement (jeu ouvert seul)
  window.JEL_I18N.surChangement(() => {
    majSon();
    if (JEUX.ecran === 'niveaux') allerNiveaux(); else if (JEUX.ecran === 'boutique') allerBoutique();
    if (JEUX.course) for (const c of JEUX.course.concurrents) c.nomAffiche = c.estJoueur ? tr('res.toi') : tr('bot.' + c.nom);
  });
}


// --------------------------------------------------------------------------
// BOUCLE PRINCIPALE
// --------------------------------------------------------------------------
const MESURE = { dernier: 0, images: 0, cumul: 0, ips: 60, ms: 16, lent: 0 };

function boucle(t) {
  requestAnimationFrame(boucle);
  const brut = MESURE.dernier ? (t - MESURE.dernier) / 1000 : 0.016;
  MESURE.dernier = t;
  const dt = Math.min(0.05, Math.max(0.001, brut));
  // mesure du nombre d'images par seconde (affichée avec la touche F)
  MESURE.images++; MESURE.cumul += brut;
  if (MESURE.cumul >= 0.5) {
    MESURE.ips = MESURE.images / MESURE.cumul; MESURE.ms = MESURE.cumul / MESURE.images * 1000; MESURE.images = 0; MESURE.cumul = 0;
    // image trop lente plusieurs fois de suite : on dessine moins de pixels
    if (MESURE.ips < CONFIG.ipsMin && !document.hidden) { if (++MESURE.lent >= 4 && R3.pixelRatio > 0.75) { R3.pixelRatio = Math.max(0.75, R3.pixelRatio - 0.25); redimensionner(); MESURE.lent = 0; } } else MESURE.lent = 0;
    if (JEUX.debug) majDebug();
  }
  if (JEUX.sans3d) return;
  const co = JEUX.course;
  if (JEUX.ecran === 'course' && co) {
    if (!enPause()) {
      const pas = dt > 0.022 ? 2 : 1;
      for (let k = 0; k < pas; k++) majCourse(co, dt / pas);
      traiterEvenements(co);
      majVisuels(co, dt);
      cameraCourse(co, dt, false);
      majHUD(co, false);
      if (co.joueur.fini && !JEUX.resultats && co.temps > co.joueur.tempsFin + 2.2) montrerResultats();
      dessiner(dt);
    } else dessiner(0);
  } else if (R3.vis) {
    cameraVitrine(dt, JEUX.ecran === 'boutique');
    dessiner(dt);
  }
}

function majDebug() {
  const info = R3.renderer ? R3.renderer.info.render : { calls: 0, triangles: 0 }, co = JEUX.course;
  let ligne = tr('debug.ligne', { ips: Math.round(MESURE.ips), ms: MESURE.ms.toFixed(1), appels: info.calls, tri: info.triangles, pr: R3.pixelRatio.toFixed(2) });
  if (co) { const J = co.joueur; ligne += ' · ' + J.etat + ' s=' + J.s.toFixed(0) + '/' + co.piste.sFin + ' v=' + J.v.toFixed(1) + ' φ=' + J.phi.toFixed(2); }
  $('debug').textContent = ligne;
}

function demarrer() {
  chargerSauvegarde();
  brancherEntrees();
  if (!initRendu()) { JEUX.sans3d = true; $('erreur').classList.remove('cache'); montrer('titre'); majBourses(); majSon(); return; }
  allerTitre();
  requestAnimationFrame(boucle);
}

// Pour la mise au point (console du navigateur) : TT.simuler(niveau, { raccourci: 'toujours' })
window.TT = { CONFIG, NIVEAUX, simuler, etat: () => ({ ecran: JEUX.ecran, niveau: JEUX.niveau, course: JEUX.course, sauvegarde: S, mesure: MESURE }) };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer); else demarrer();
})();
</script>
