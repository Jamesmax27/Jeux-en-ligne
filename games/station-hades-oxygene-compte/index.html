  }

  const FOND_SALLE = ['#12301f', '#0f2a36', '#33290e', '#341626', '#2e2114', '#2e2114', '#141c2e', '#0f1f3a'];
  const BORD_SALLE = ['#2f7a4f', '#2d6f8a', '#8c6d1f', '#8a3a5c', '#7a5426', '#7a5426', '#34466a', '#2f5a96'];

  // Plan de la station : 2 colonnes, Coursive au milieu, Capsules en bas.
  function disposition(w, h, e) {
    const capsules = !!(e && e.lv && e.lv.ca);
    const lignes = capsules ? [[0, 1], [6], [2, 3], [4, 5], [7]] : [[0, 1], [6], [2, 3], [4, 5]];
    const poids = capsules ? [1, 0.78, 1, 0.86, 0.66] : [1, 0.78, 1, 0.86];
    const m = 6, gap = Math.max(6, Math.min(12, w * 0.02));
    const W = Math.min(w - 2 * m, 620);
    const somme = poids.reduce((a, b) => a + b, 0);
    const u = Math.max(20, Math.min((h - 2 * m - gap * (lignes.length - 1)) / somme, W * 0.34));
    const H = u * somme + gap * (lignes.length - 1);
    const ox = (w - W) / 2;
    let y = Math.max(m, (h - H) / 2);
    const salles = [];
    lignes.forEach((l, i) => {
      const hh = u * poids[i];
      const lw = (W - gap * (l.length - 1)) / l.length;
      l.forEach((z, j) => { salles[z] = { x: ox + j * (lw + gap), y: y, w: lw, h: hh }; });
      y += hh + gap;
    });
    return { salles: salles, x: ox, y: (h - H) / 2, w: W, h: H };
  }

  // Place de chaque astronaute vivant dans sa salle (clé « équipe-membre »).
  function positionsJetons(e, L) {
    const pos = {};
    for (let z = 0; z < 8; z++) {
      const r = L.salles[z];
      if (!r) continue;
      const liste = [];
      e.eq.forEach((eqp, s) => eqp.forEach((mb, m) => { if (mb.z === z && mb.s < 2) liste.push([s, m]); }));
      if (!liste.length) continue;
      const haut = r.y + r.h * 0.4, zoneH = r.h * 0.56;
      const largeur = r.w - 14 - (z === 7 ? r.w * 0.34 : r.h * 0.62);
      let rayon = Math.min(r.h * 0.17, 15), parLigne = 1;
      for (let essai = 0; essai < 30; essai++) {
        parLigne = Math.max(1, Math.floor(largeur / (rayon * 2.2)));
        if (Math.ceil(liste.length / parLigne) * rayon * 2.15 <= zoneH || rayon <= 5) break;
        rayon -= 0.5;
      }
      liste.forEach((sm, i) => {
        const li = Math.floor(i / parLigne), co = i % parLigne;
        pos[sm[0] + '-' + sm[1]] = { x: r.x + 7 + rayon * 1.1 + co * rayon * 2.2, y: haut + rayon * 1.05 + li * rayon * 2.15, r: rayon, s: sm[0], m: sm[1] };
      });
    }
    return pos;
  }

  // Dessine la station. opt : t, moi, sel, valides (salles possibles), curseur,
  // flash { z: { t, coul } }, jetons (positions affichées), combi, ondes (pour la démo).
  function dessinerStation(c, e, L, opt) {
    const t = opt.t || 0;
    for (let z = 0; z < 8; z++) {
      const r = L.salles[z];
      if (!r) continue;
      c.save();
      const g = c.createLinearGradient(0, r.y, 0, r.y + r.h);
      g.addColorStop(0, FOND_SALLE[z]); g.addColorStop(1, '#0a0f1c');
      c.fillStyle = g; rr(c, r.x, r.y, r.w, r.h, 12); c.fill();
      // détails du décor
      c.globalAlpha = 0.18; c.strokeStyle = BORD_SALLE[z]; c.lineWidth = 1;
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(r.x + 8, r.y + r.h * i / 4); c.lineTo(r.x + r.w - 8, r.y + r.h * i / 4); c.stroke(); }
      c.globalAlpha = 1;
      const enPanne = z < 4 && e.mo[z] === 0;
      if (enPanne) { c.fillStyle = 'rgba(255,40,60,' + (0.16 + 0.12 * Math.sin(t * 0.008)) + ')'; rr(c, r.x, r.y, r.w, r.h, 12); c.fill(); }
      const f = opt.flash && opt.flash[z];
      if (f) {
        const a = 1 - (t - f.t) / 700;
        if (a > 0) { c.globalAlpha = a * 0.55; c.fillStyle = f.coul; rr(c, r.x, r.y, r.w, r.h, 12); c.fill(); c.globalAlpha = 1; }
      }
      // contour : salle possible, curseur
      let bord = BORD_SALLE[z], large = 2;
      if (opt.valides) { if (opt.valides[z]) { bord = '#7ef0ff'; large = 2.5 + Math.sin(t * 0.006) * 0.8; } }
      c.strokeStyle = bord; c.lineWidth = large; rr(c, r.x, r.y, r.w, r.h, 12); c.stroke();
      // pictogramme et nom
      const k = Math.max(12, Math.min(22, r.h * 0.22));
      icone(c, z, r.x + 6 + k / 2, r.y + 6 + k / 2, k);
      c.fillStyle = '#e8eef8'; c.font = '800 ' + Math.round(Math.max(10, Math.min(15, r.h * 0.17))) + 'px system-ui, sans-serif';
      c.textBaseline = 'middle'; c.textAlign = 'left';
      const nom = tr('salle.' + z);
      c.fillText(nom, r.x + 10 + k, r.y + 6 + k / 2, r.w - k - (z < 4 ? 52 : 18));
      // santé des modules : 3 barrettes
      if (z < 4) {
        const h = e.mo[z], bw = Math.max(7, Math.min(12, r.w * 0.05)), bh = Math.max(8, k * 0.6);
        const couls = ['#ff4d5e', '#ffb020', '#ffd166', '#6fe39a'];
        for (let i = 0; i < 3; i++) {
          c.fillStyle = i < h ? couls[h] : '#ffffff1a';
          rr(c, r.x + r.w - 8 - (3 - i) * (bw + 3), r.y + 6 + (k - bh) / 2, bw, bh, 2); c.fill();
        }
        if (enPanne) { // bande d'alerte en bas
          c.save(); rr(c, r.x, r.y, r.w, r.h, 12); c.clip();
          c.fillStyle = '#ff4d5e55';
          for (let i = -2; i < r.w / 12 + 2; i++) { c.beginPath(); c.moveTo(r.x + i * 12, r.y + r.h); c.lineTo(r.x + i * 12 + 6, r.y + r.h); c.lineTo(r.x + i * 12 + 12, r.y + r.h - 6); c.lineTo(r.x + i * 12 + 6, r.y + r.h - 6); c.fill(); }
          c.restore();
        }
      }
      // soutes : caisses empilées
      if (z === 4 || z === 5) {
        const cx = r.x + r.w - r.h * 0.34, cy = r.y + r.h * 0.72, s2 = r.h * 0.2;
        if (!(e.cr && e.cr.z === z && !e.cache)) { icone(c, 4, cx, cy, s2 * 1.6); icone(c, 4, cx - s2 * 1.2, cy + s2 * 0.2, s2 * 1.2); }
      }
      // capsules : sièges libres ou pris
      if (z === 7) {
        const tot = e.lv.ca, pris = tot - e.caL, sw = Math.min(r.h * 0.36, r.w * 0.09);
        for (let i = 0; i < tot; i++) {
          const px = r.x + r.w - 10 - (tot - i) * (sw + 6) + sw / 2, py = r.y + r.h * 0.6;
          c.fillStyle = i < pris ? '#8fd0ff' : '#0b1224'; c.strokeStyle = '#8fd0ff'; c.lineWidth = 2;
          ell(c, px, py, sw * 0.42, sw * 0.62); c.fill(); c.stroke();
        }
        if (e.mo[2] === 0) { c.fillStyle = '#ff4d5e33'; rr(c, r.x, r.y, r.w, r.h, 12); c.fill(); }
      }
      // porte étanche fermée : cadre rayé + cycles restants
      if (z < 6 && e.po[z] > 0) {
        c.save(); rr(c, r.x + 2, r.y + 2, r.w - 4, r.h - 4, 10); c.lineWidth = 6; c.strokeStyle = '#ffd166'; c.setLineDash([10, 8]); c.lineDashOffset = -t * 0.01; c.stroke(); c.setLineDash([]); c.restore();
        for (let i = 0; i < e.po[z]; i++) { c.fillStyle = '#ffd166'; rond(c, r.x + r.w / 2 - 8 + i * 16, r.y + r.h - 9, 4); c.fill(); }
      }
      // la créature (si les capteurs marchent)
      if (e.cr && e.cr.z === z && !e.cache) {
        const cr = Math.min(r.h * 0.3, r.w * 0.2);
        creature(c, r.x + r.w - cr * 1.25, r.y + r.h * 0.6, cr, t, e.cr.pg > 0 ? 1 : (e.lv.cr === 2 ? 2 : 0));
      }
      if (opt.curseur === z) {
        c.strokeStyle = '#ffffff'; c.lineWidth = 2.5; c.setLineDash([7, 5]); c.lineDashOffset = t * 0.02;
        rr(c, r.x - 4, r.y - 4, r.w + 8, r.h + 8, 15); c.stroke(); c.setLineDash([]);
      }
      if (opt.valides && !opt.valides[z]) { c.fillStyle = 'rgba(4,6,12,.5)'; rr(c, r.x, r.y, r.w, r.h, 12); c.fill(); }
      c.restore();
    }
    // astronautes
    const jetons = opt.jetons || {};
    Object.keys(jetons).forEach((cle) => {
      const p = jetons[cle], mb = e.eq[p.s] && e.eq[p.s][p.m];
      if (!mb || mb.s >= 2) return;
      const moi = p.s === opt.moi;
      if (moi && p.m === opt.sel && opt.valides) {
        c.strokeStyle = '#ffffff'; c.lineWidth = 2; rond(c, p.x, p.y, p.r + 3 + Math.sin(t * 0.008) * 1.5); c.stroke();
      }
      casque(c, p.x, p.y, p.r, p.s, moi ? opt.combi : null, mb.s, moi);
    });
    // alarme : capteurs coupés, brouillage sur tout le plan
    if (e.cache) {
      c.save();
      const al = graineHasard(Math.floor(t / 90));
      c.globalAlpha = 0.16; c.fillStyle = '#9fb4d8';
      for (let i = 0; i < 70; i++) c.fillRect(L.x + al() * L.w, L.y + al() * L.h, 2 + al() * 30, 1.5);
      c.globalAlpha = 0.12 + 0.1 * Math.sin(t * 0.01); c.fillStyle = '#ff2040';
      c.fillRect(L.x - 6, L.y - 6, L.w + 12, L.h + 12);
      c.restore();
    }
  }

  // Écran titre : la station dans l'espace (sert aussi de jaquette).
  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fond = c.createLinearGradient(0, 0, 0, h);
    fond.addColorStop(0, '#05060f'); fond.addColorStop(0.6, '#130b26'); fond.addColorStop(1, '#1d0b19');
    c.fillStyle = fond; c.fillRect(0, 0, w, h);
    const al = graineHasard(31);
    [[0.75, 0.25, '#3a1a6a'], [0.2, 0.4, '#0f3a4a'], [0.6, 0.7, '#4a1030']].forEach((n) => {
      const g = c.createRadialGradient(w * n[0], h * n[1], 0, w * n[0], h * n[1], Math.max(w, h) * 0.45);
      g.addColorStop(0, n[2] + 'aa'); g.addColorStop(1, n[2] + '00'); c.fillStyle = g; c.fillRect(0, 0, w, h);
    });
    for (let i = 0; i < 220; i++) {
      c.globalAlpha = 0.3 + al() * 0.7; c.fillStyle = al() < 0.15 ? '#ffd7a0' : '#ffffff';
      rond(c, al() * w, al() * h, al() * 1.4 + 0.3); c.fill();
    }
    c.globalAlpha = 1;
    // planète rouge
    const S = Math.min(w, h * 0.62);
    const px = w * 0.12, py = h * 1.02, pr = S * 0.62;
    const pg = c.createRadialGradient(px + pr * 0.35, py - pr * 0.45, pr * 0.1, px, py, pr);
    pg.addColorStop(0, '#ff8a4d'); pg.addColorStop(0.55, '#a8321e'); pg.addColorStop(1, '#2a0808');
    c.fillStyle = pg; rond(c, px, py, pr); c.fill();
    c.fillStyle = '#00000033'; [[0.3, -0.5, 0.1], [0.55, -0.25, 0.07], [0.1, -0.7, 0.06]].forEach((k) => { rond(c, px + pr * k[0], py + pr * k[1], pr * k[2]); c.fill(); });
    c.strokeStyle = '#ff8a4d55'; c.lineWidth = 4; rond(c, px, py, pr + 3); c.stroke();
    // station : anneau, rayons, moyeu, panneaux solaires
    const sx = w * 0.52, sy = h * 0.47, R0 = S * 0.42;
    c.save(); c.translate(sx, sy); c.rotate(-0.18);
    c.fillStyle = '#1f3a66'; c.strokeStyle = '#7ea6d8'; c.lineWidth = 1.5;
    [-1, 1].forEach((d) => {
      c.save(); c.translate(d * R0 * 1.35, 0);
      c.fillRect(-R0 * 0.3, -R0 * 0.16, R0 * 0.6, R0 * 0.32); c.strokeRect(-R0 * 0.3, -R0 * 0.16, R0 * 0.6, R0 * 0.32);
      for (let i = 1; i < 4; i++) { c.beginPath(); c.moveTo(-R0 * 0.3 + i * R0 * 0.15, -R0 * 0.16); c.lineTo(-R0 * 0.3 + i * R0 * 0.15, R0 * 0.16); c.stroke(); }
      c.restore();
      c.strokeStyle = '#6a7891'; c.lineWidth = 3; c.beginPath(); c.moveTo(d * R0 * 0.2, 0); c.lineTo(d * R0 * 1.05, 0); c.stroke();
      c.strokeStyle = '#7ea6d8'; c.lineWidth = 1.5;
    });
    c.strokeStyle = '#3a4459'; c.lineWidth = R0 * 0.2; ell(c, 0, 0, R0, R0 * 0.4); c.stroke();
    c.strokeStyle = '#8a97b0'; c.lineWidth = R0 * 0.12; ell(c, 0, 0, R0, R0 * 0.4); c.stroke();
    for (let i = 0; i < 24; i++) {
      const a = i / 24 * Math.PI * 2, wx = Math.cos(a) * R0, wy = Math.sin(a) * R0 * 0.4;
      const alerte = i === 5 || i === 6;
      c.fillStyle = alerte ? '#ff3b3b' : (i % 3 ? '#7ef0ff' : '#ffd166');
      if (alerte) { c.shadowColor = '#ff3b3b'; c.shadowBlur = 12; }
      rond(c, wx, wy, R0 * 0.025); c.fill(); c.shadowBlur = 0;
    }
    c.strokeStyle = '#5a6680'; c.lineWidth = 3;
    [0.8, 2.35, 3.95, 5.5].forEach((a) => { c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(a) * R0, Math.sin(a) * R0 * 0.4); c.stroke(); });
    const mg = c.createRadialGradient(-R0 * 0.08, -R0 * 0.08, 0, 0, 0, R0 * 0.24);
    mg.addColorStop(0, '#c9d4e8'); mg.addColorStop(1, '#3a4459');
    c.fillStyle = mg; rond(c, 0, 0, R0 * 0.24); c.fill();
    c.fillStyle = '#7ef0ff'; rond(c, 0, 0, R0 * 0.08); c.fill();
    // conduit, tentacule et yeux dans l'ombre
    c.fillStyle = '#10141f'; rr(c, -R0 * 0.09, R0 * 0.2, R0 * 0.18, R0 * 0.1, 3); c.fill();
    c.strokeStyle = '#2b0d3d'; c.lineCap = 'round'; c.lineWidth = R0 * 0.07;
    c.beginPath(); c.moveTo(0, R0 * 0.26); c.bezierCurveTo(R0 * 0.25, R0 * 0.55, -R0 * 0.2, R0 * 0.7, R0 * 0.12, R0 * 0.9); c.quadraticCurveTo(R0 * 0.3, R0 * 0.98, R0 * 0.22, R0 * 0.82); c.stroke();
    c.strokeStyle = '#5a2378'; c.lineWidth = R0 * 0.03; c.stroke();
    c.fillStyle = '#c47ad6'; [[0.1, 0.45], [0.02, 0.62], [0.08, 0.78]].forEach((p) => { rond(c, p[0] * R0, p[1] * R0, R0 * 0.012); c.fill(); });
    c.shadowColor = '#d6ff4a'; c.shadowBlur = 10; c.fillStyle = '#d6ff4a';
    ell(c, -R0 * 0.035, R0 * 0.25, R0 * 0.018, R0 * 0.01); c.fill(); ell(c, R0 * 0.035, R0 * 0.25, R0 * 0.018, R0 * 0.01); c.fill();
    c.shadowBlur = 0;
    c.restore();
    // astronaute à la dérive
    casque(c, w * 0.84, h * 0.24, S * 0.07, 0, prog.combi, 0, false);
    c.strokeStyle = '#ffffff55'; c.lineWidth = 1; c.setLineDash([3, 4]);
    c.beginPath(); c.moveTo(w * 0.84 - S * 0.06, h * 0.24 + S * 0.05); c.quadraticCurveTo(w * 0.7, h * 0.33, sx + R0 * 0.6, sy - R0 * 0.2); c.stroke(); c.setLineDash([]);
  }

  // Couronne du chef (salon).
  function couronne(c, x, y, k) {
    c.save(); c.translate(x, y); c.scale(k / 24, k / 24);
    c.fillStyle = '#ffc21a'; c.strokeStyle = '#8a5a00'; c.lineWidth = 2.2; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-20, 0); c.lineTo(-22, -22); c.lineTo(-10, -10); c.lineTo(0, -26); c.lineTo(10, -10); c.lineTo(22, -22); c.lineTo(20, 0); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(126,240,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#1b2540'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;             // disposition des salles à l'écran
  let sel = 0;                // astronaute choisi
  let modePorte = false;
  let curseur = -1, survol = -1, clavier = false;
  let dernierAttends = 0;
  let affiches = {};          // positions affichées des astronautes (glissement)
  let flashs = {};
  let secousse = 0;
  const particules = [];
  const flottants = [];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'combis', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') dessinerTitre();
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree, alerte) {
    const el = $('toast');
    el.textContent = texte;
    // En haut pendant la partie et au-dessus des fenêtres : le plan et les boutons restent visibles.
    el.classList.toggle('haut', ecran === 'jeu' || salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.toggle('alerte', !!alerte);
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  const moiSiege = () => (partie ? partie.siege : -1);
  const combiDe = (s) => (s === moiSiege() ? prog.combi : null);

  // Casque d'une équipe dans une petite toile (cartes des places).
  function tete(cv, s) { const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height); casque(c, cv.width / 2, cv.height / 2, cv.width * 0.42, s, combiDe(s), 0, false); }

  // Cartes des 5 équipes, en haut de l'écran, et places du salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.width = 84; cv.height = 84; cv.className = 'tete';
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const eqp = document.createElement('span'); eqp.className = 'eqp';
      for (let i = 0; i < O.EQUIPE; i++) eqp.appendChild(document.createElement('i'));
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, tag, eqp, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 104; cv.height = 104;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Boutons des 3 astronautes du joueur (en bas).
  function construireEquipe() {
    const boite = $('equipe'), porte = $('btn-porte');
    for (let i = 0; i < O.EQUIPE; i++) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'membre'; b.id = 'membre-' + i;
      const cv = document.createElement('canvas'); cv.width = 60; cv.height = 60;
      const sp = document.createElement('span');
      const titre = document.createElement('b'); const etat = document.createElement('small');
      sp.append(titre, etat);
      b.append(cv, sp);
      b.addEventListener('click', () => { audio(); choisirMembre(i); });
      boite.insertBefore(b, porte);
    }
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  // Pseudo d'un autre vrai joueur, à ajouter aux étiquettes lues à voix haute.
  function pseudoAria(info, role) { return role === 'joueur' && info.nom ? ' · ' + info.nom : ''; }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels(), moi = moiSiege();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const cv = d.querySelector('canvas.tete'), cle = String(s === moi ? prog.combi : -1);
      if (cv.dataset.k !== cle) { cv.dataset.k = cle; tete(cv, s); }
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const pastilles = d.querySelectorAll('.eqp i');
      for (let i = 0; i < pastilles.length; i++) {
        const mb = e && e.eq[s] ? e.eq[s][i] : null;
        pastilles[i].className = !mb ? '' : mb.s >= 2 ? 'm' : mb.z === 7 ? 'c' : mb.s === 1 ? 'b' : '';
      }
      d.setAttribute('aria-label', tr('place.aria.' + role, { equipe: tr('equipe.' + s), points: pts }) + pseudoAria(info, role) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function majEtat() {
    const e = vue, moi = moiSiege();
    if (!e) { $('o2-texte').textContent = ''; $('etat-cycle').textContent = ''; $('etat-pieces').textContent = ''; $('etat-capsules').textContent = ''; return; }
    $('o2-texte').textContent = tr('etat.o2', { n: e.o2, max: O.O2_MAX });
    $('o2-barre').firstElementChild.style.width = Math.round(e.o2 / O.O2_MAX * 100) + '%';
    $('o2').classList.toggle('bas', e.o2 <= 3);
    $('etat-cycle').textContent = tr('etat.cycle', { n: Math.min(e.cyc, e.lv.cy), total: e.lv.cy });
    $('etat-pieces').textContent = moi >= 0 ? tr('etat.pieces', { n: e.pi[moi] }) : '';
    $('etat-capsules').textContent = e.lv.ca ? tr('etat.capsules', { n: e.caL }) : '';
  }

  function etatMembre(e, mb) {
    if (mb.s >= 2) return 'mort';
    if (mb.z === 7) return 'capsule';
    if (O.enferme(e, mb)) return 'enferme';
    return mb.s === 1 ? 'blesse' : 'sain';
  }

  function premierLibre() {
    const e = vue, moi = moiSiege();
    if (!e || moi < 0) return -1;
    for (let i = 0; i < e.eq[moi].length; i++) if (O.libre(e, e.eq[moi][i])) return i;
    return -1;
  }

  function majEquipe() {
    const e = vue, moi = moiSiege();
    const monTour = !!(partie && partie.monTour() && !attenteTuto && !enPause);
    if (e && moi >= 0 && (sel < 0 || !O.libre(e, e.eq[moi][sel]))) sel = premierLibre();
    for (let i = 0; i < O.EQUIPE; i++) {
      const b = $('membre-' + i);
      const mb = e && moi >= 0 ? e.eq[moi][i] : null;
      const etat = mb ? etatMembre(e, mb) : 'sain';
      const lieu = mb ? tr('salle.' + mb.z) : '';
      const cle = [moi, etat, lieu, prog.combi].join('|');
      if (b.dataset.k !== cle) {
        b.dataset.k = cle;
        const c = b.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 60, 60);
        if (moi >= 0) { c.globalAlpha = etat === 'mort' ? 0.3 : 1; casque(c, 30, 30, 26, moi, prog.combi, mb && mb.s === 1 ? 1 : 0, false); c.globalAlpha = 1; }
        b.querySelector('b').textContent = tr('membre.court', { n: i + 1 });
        b.querySelector('small').textContent = mb ? (etat === 'sain' ? lieu : tr('membre.' + etat)) : '';
        b.setAttribute('aria-label', tr('membre.aria', { n: i + 1, etat: tr('membre.' + etat), salle: lieu }));
      }
      b.disabled = !mb || !O.libre(e, mb);
      b.classList.toggle('sel', !!mb && i === sel && !modePorte && monTour);
    }
    const porte = $('btn-porte');
    porte.hidden = !(e && e.lv.po);
    porte.disabled = !(monTour && e && moi >= 0 && e.pi[moi] >= 1 && e.mo[2] > 0);
    if (porte.disabled) modePorte = false;
    porte.classList.toggle('actif', modePorte);
    porte.setAttribute('aria-pressed', modePorte ? 'true' : 'false');
    porte.setAttribute('aria-label', tr('bouton.porteAria'));
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    if (e.fini) return tr('tour.fin');
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr('tour.toi');
    // Un autre vrai joueur en ligne : son pseudo à la place du nom de son équipe.
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.autre', { equipe: tr('equipe.' + s) });
  }

  // Ce que ferait l'astronaute choisi dans la salle z (aide sous le plan).
  function apercu(z) {
    const e = vue, moi = moiSiege();
    if (!e || moi < 0 || z < 0 || !e.eq[moi]) return '';
    const salle = tr('salle.' + z);
    const visible = e.cr && e.cr.z === z && !e.cache;
    if (modePorte) {
      if (z >= 6) return tr('apercu.porteSalle');
      if (e.po[z] > 0) return tr('apercu.porteFermee');
      if (!O.portePermise(e, moi, z)) return tr('apercu.porteNon');
      return visible && e.cr.pg === 0 ? tr('apercu.piege', { salle: salle }) : tr('apercu.porte', { salle: salle });
    }
    if (sel < 0) return tr('apercu.impossible');
    if (!O.destinationPermise(e, moi, sel, z)) {
      if (z < 6 && e.po[z] > 0) return tr('apercu.fermee');
      if (z === 7 && e.caL <= 0) return tr('apercu.capsulePleine');
      if (z === 7 && e.mo[2] === 0) return tr('apercu.sansCourant');
      return tr('apercu.impossible');
    }
    const mb = e.eq[moi][sel];
    let texte;
    if (z < 4) {
      const piece = e.pi[moi] > 0;
      const pts = O.pointsReparation(e.mo[z], piece);
      texte = pts > 0 ? tr(piece ? 'apercu.reparerPiece' : 'apercu.reparer', { salle: salle, n: pts }) : tr('apercu.intact', { salle: salle });
      if (z === 3 && mb.s === 1) texte += ' · ' + tr('apercu.soin');
    } else if (z < 6) texte = tr('apercu.fouille', { salle: salle });
    else if (z === 6) texte = tr('apercu.coursive');
    else texte = tr('apercu.capsule');
    if (visible && mb.z !== z) texte += ' · ' + tr('apercu.danger');
    return texte;
  }

  function majAide() {
    let texte = '';
    if (partie && vue && partie.phase === 'jeu' && !vue.fini) {
      if (partie.monTour() && !attenteTuto) {
        const vise = clavier ? curseur : survol;
        if (vise >= 0) texte = apercu(vise);
        else texte = modePorte ? tr('aide.porte') : tr('aide.jeu');
      } else texte = tr('aide.attente');
    }
    if ($('aide').textContent !== texte) $('aide').textContent = texte;
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, station: tr('station.' + Math.floor((niveau - 1) / PAR_STATION)) });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  function majInterface() {
    majPlaces();
    majEtat();
    majEquipe();
    majInfos();
    majAide();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function sallesValides() {
    const e = vue, moi = moiSiege();
    if (!e || !partie || !partie.monTour() || attenteTuto || e.fini) return null;
    const v = [];
    for (let z = 0; z < 8; z++) v.push(modePorte ? O.portePermise(e, moi, z) : (sel >= 0 && O.destinationPermise(e, moi, sel, z)));
    return v;
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = disposition(w, h, vue);
    if (t < secousse) { const a = (secousse - t) / 60; c.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a); }
    // astronautes : glissement vers leur nouvelle place
    const cibles = positionsJetons(vue, geo);
    const nouv = {};
    Object.keys(cibles).forEach((k) => {
      const p = cibles[k], a = affiches[k];
      if (!a) nouv[k] = Object.assign({}, p);
      else {
        const f = Math.min(1, dt * 7);
        nouv[k] = Object.assign({}, p, { x: a.x + (p.x - a.x) * f, y: a.y + (p.y - a.y) * f, r: a.r + (p.r - a.r) * f });
      }
    });
    affiches = nouv;
    dessinerStation(c, vue, geo, {
      t: t, moi: moiSiege(), sel: modePorte ? -1 : sel, valides: sallesValides(), curseur: clavier ? curseur : survol,
      flash: flashs, jetons: affiches, combi: prog.combi
    });
    // étincelles
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2); c.fillStyle = p.coul;
      rond(c, p.x, p.y, p.k); c.fill(); c.globalAlpha = 1;
    }
    // nombres qui s'envolent (+2…)
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let i = flottants.length - 1; i >= 0; i--) {
      const f = flottants[i], a = (t - f.t) / 1200;
      if (a >= 1) { flottants.splice(i, 1); continue; }
      c.globalAlpha = 1 - a; c.fillStyle = f.coul; c.font = '900 ' + Math.round(18 + 6 * (1 - a)) + 'px system-ui, sans-serif';
      c.fillText(f.texte, f.x, f.y - a * 40);
      c.globalAlpha = 1;
    }
  }

  function centre(z) { const r = geo && geo.salles[z]; return r ? [r.x + r.w / 2, r.y + r.h / 2] : null; }
  function etincelles(z, coul, n) {
    const p = centre(z); if (!p) return;
    for (let k = 0; k < (n || 16); k++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 160;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, vie: 0.6 + Math.random() * 0.4, k: 1.5 + Math.random() * 2.5, coul: k % 2 ? coul : '#ffffff' });
    }
  }
  function flottant(z, texte, coul) { const p = centre(z); if (p) flottants.push({ x: p[0], y: p[1], t: performance.now(), texte: texte, coul: coul || '#ffd166' }); }
  function flash(z, coul) { flashs[z] = { t: performance.now(), coul: coul }; }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    affiches = {}; flashs = {};
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + prog.combi + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 104, 104);
        casque(c, 52, 58, 40, s, info.moi ? prog.combi : null, 0, false);
        if (info.chef) couronne(c, 52, 22, 24);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { equipe: tr('equipe.' + s) }) + pseudoAria(info, role) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) {
        const nomChef = (sieges[partie.chef] || {}).nom;
        message = tr('salon.attente', { equipe: tr('equipe.' + partie.chef) + (nomChef ? ' · ' + nomChef : '') });
      }
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = copie(partie.etat);
    affiches = {}; flashs = {};
    particules.length = 0; flottants.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    modePorte = false;
    sel = premierLibre();
    $('journal').textContent = '';
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    $('ecran-jeu').className = 'ecran actif st' + Math.floor((vue.n || 0) / PAR_STATION);
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Une ligne de journal pour le coup qui vient d'être joué.
  function ligneJournal(evs, siege) {
    const equipe = tr('equipe.' + siege);
    let cle = null, vars = { equipe: equipe };
    const trouve = (k) => evs.find((x) => x.k === k);
    let x;
    if ((x = trouve('piege'))) { cle = 'j.piege'; vars.salle = tr('salle.' + x.z); vars.n = x.pts; }
    else if ((x = trouve('porte'))) { cle = 'j.porte'; vars.salle = tr('salle.' + x.z); }
    else if ((x = trouve('surprise'))) { cle = 'j.surprise'; vars.salle = tr('salle.' + x.z); }
    else if ((x = trouve('repare'))) { cle = x.sauve ? 'j.sauve' : 'j.repare'; vars.salle = tr('salle.' + x.z); vars.n = x.pts; }
    else if ((x = trouve('soin'))) { cle = 'j.soin'; }
    else if ((x = trouve('fouille'))) { cle = 'j.fouille'; vars.salle = tr('salle.' + x.z); vars.n = x.g; }
    else if ((x = trouve('capsule'))) { cle = 'j.capsule'; }
    else if ((x = trouve('va'))) { cle = 'j.va'; vars.salle = tr('salle.' + x.z); }
    else if (trouve('passe')) cle = 'j.passe';
    if (!cle) return;
    const el = $('journal');
    el.textContent = '';
    const point = document.createElement('b');
    point.textContent = '● ';
    point.style.setProperty('--c', COUL[siege]);
    el.append(point, document.createTextNode(tr(cle, vars)));
  }

  function surAction(ev) {
    const t = performance.now();
    const avant = ev.avant;
    vue = copie(ev.apres);
    debutTour = Date.now();
    dernierTic = -1;
    const evs = vue.ev || [];
    const moi = moiSiege();
    ligneJournal(evs, ev.siege);
    let bruitCoup = 'pas';
    const resume = [];
    let attaques = 0, mesBlesses = 0;
    evs.forEach((x) => {
      switch (x.k) {
        case 'repare':
          flash(x.z, '#6fe39a'); etincelles(x.z, '#ffd166'); flottant(x.z, tr('flottant.points', { n: x.pts }), COUL[x.p]);
          bruitCoup = x.sauve ? 'sauve' : 'repare'; break;
        case 'fouille': flottant(x.z, tr('flottant.pieces', { n: x.g }), '#ffd166'); etincelles(x.z, '#ffd166', 8); bruitCoup = 'fouille'; break;
        case 'soin': flash(3, '#ff7f9e'); etincelles(3, '#ff7f9e', 10); bruitCoup = 'soin'; break;
        case 'capsule': flash(7, '#8fd0ff'); bruitCoup = 'capsule'; break;
        case 'porte': flash(x.z, '#ffd166'); bruitCoup = 'porte'; break;
        case 'piege': flash(x.z, '#ffd166'); etincelles(x.z, '#ffd166', 22); flottant(x.z, tr('flottant.points', { n: x.pts }), COUL[x.p]); bruitCoup = 'piege'; break;
        case 'surprise': flash(x.z, '#ff4d5e'); secousse = t + 380; bruitCoup = 'attaque'; if (x.p === moi) mesBlesses++; break;
        case 'o2': resume.push(tr('cycle.fin', { n: x.c })); resume.push(x.d > 0 ? tr('cycle.o2plus', { n: x.d }) : x.d < 0 ? tr('cycle.o2moins', { n: -x.d }) : tr('cycle.o2stable')); break;
        case 'panne': flash(x.z, '#ff4d5e'); resume.push(tr('cycle.panne', { salle: tr('salle.' + x.z) })); break;
        case 'chaine': flash(x.z, '#ff8a4d'); resume.push(tr('cycle.chaine', { salle: tr('salle.' + x.z) })); break;
        case 'bouge': resume.push(vue.cache ? tr('cycle.cachee') : tr('cycle.creature', { salle: tr('salle.' + x.z) })); break;
        case 'griffe': resume.push(tr('cycle.piegee')); break;
        case 'attaque': attaques++; if (!vue.cache) flash(x.z, '#ff4d5e'); if (x.p === moi) mesBlesses++; break;
        case 'ouvre': resume.push(tr('cycle.ouvre', { salle: tr('salle.' + x.z) })); break;
        case 'alarme': resume.push(tr('cycle.alarme')); break;
        default: break;
      }
    });
    if (attaques) resume.push(tr('cycle.attaque', { n: attaques }));
    if (sons[bruitCoup]) sons[bruitCoup]();
    if (resume.length) {
      const fin = evs.find((x) => x.k === 'fin');
      if (!fin) toast(resume.join(' · '), 3800, attaques > 0 || evs.some((x) => x.k === 'panne'));
      if (evs.some((x) => x.k === 'panne' || x.k === 'chaine')) setTimeout(() => sons.panne(), 250);
      if (evs.some((x) => x.k === 'bouge' || x.k === 'griffe')) setTimeout(() => sons.grogne(), 450);
      if (attaques) setTimeout(() => { sons.attaque(); secousse = performance.now() + 450; }, 800);
      if (evs.some((x) => x.k === 'alarme')) setTimeout(() => sons.alarme(), 1100);
      if (vue.o2 <= 3 && avant && vue.o2 < avant.o2) setTimeout(() => sons.o2(), 1300);
    }
    if (mesBlesses && moi >= 0) {
      const carte = $('place-' + moi);
      carte.classList.remove('touche'); void carte.offsetWidth; carte.classList.add('touche');
    }
    if (avant && vue.sc[ev.siege] > avant.sc[ev.siege]) {
      const carte = $('place-' + ev.siege);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && !vue.fini && R.aQui(vue) === partie.siege && !ev.moi) sons.tour();
    if (moi >= 0 && (sel < 0 || !O.libre(vue, vue.eq[moi][sel]))) sel = premierLibre();
    if (modePorte && !(moi >= 0 && vue.pi[moi] >= 1)) modePorte = false;
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1100);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles : finir 1er (égalité comprise) ; 2 si 2 astronautes rentrent, 3 si les 3.
  function etoilesPour(gagne, surv) {
    if (!gagne) return 0;
    return surv >= O.EQUIPE ? 3 : surv >= O.EQUIPE - 1 ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3, 4];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 56; cv.height = 56;
      casque(cv.getContext('2d'), 28, 28, 25, s, s === moi ? prog.combi : null, 0, false);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('equipe.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb';
      n.textContent = tr('fin.ligne', { n: e.sc[s], s: e.surv ? e.surv[s] : 0, total: O.EQUIPE });
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function raisonFin(e) {
    const f = (e.ev || []).find((x) => x.k === 'fin');
    return f ? tr('fin.' + f.r) : '';
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const surv = moi >= 0 && e.surv ? e.surv[moi] : 0;
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-raison').textContent = raisonFin(e);
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts }) : '';
    $('fin-equipage').textContent = moi >= 0 ? tr('fin.equipage', { n: surv, total: O.EQUIPE }) : '';
    $('fin-combi').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(gagne, surv);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      const combisAvant = nbCombisOuvertes();
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      const combisApres = nbCombisOuvertes();
      if (combisApres > combisAvant) $('fin-combi').textContent = tr('fin.combi', { nom: tr('combi.' + (combisApres - 1)) });
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (repli contre des robots).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 5], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, combinaisons
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    modePorte = false;
    bandeau('');
    fermerVoile('voile-pause');
    fermerVoile('voile-fin');
    fermerVoile('voile-tuto');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    $('journal').textContent = '';
  }

  // Parcours solo : niveau n contre 4 robots (force croissante, donnée par le niveau).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = R.depart(graineHasard(niveau), PLACES, { niveau: niveau });
    affiches = {}; flashs = {};
    particules.length = 0; flottants.length = 0;
    $('journal').textContent = '';
    $('ecran-jeu').className = 'ecran st' + Math.floor((niveau - 1) / PAR_STATION);
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    $('ecran-jeu').className = 'ecran st2';
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const liste = $('liste-niveaux');
    liste.textContent = '';
    for (let g = 0; g < Math.ceil(NIVEAUX.length / PAR_STATION); g++) {
      const h = document.createElement('h3'); h.className = 'station-titre';
      h.textContent = tr('station.titre', { nom: tr('station.' + g) });
      const grille = document.createElement('div'); grille.className = 'grille';
      for (let i = g * PAR_STATION; i < Math.min(NIVEAUX.length, (g + 1) * PAR_STATION); i++) {
        const n = i + 1, ouvert = n <= prog.debloque;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
        const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
        const et = document.createElement('small');
        for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
        b.append(num, et);
        b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
        if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
        else b.disabled = true;
        grille.appendChild(b);
      }
      liste.append(h, grille);
    }
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirCombis() {
    const grille = $('grille-combis');
    grille.textContent = '';
    COMBIS.forEach((k, i) => {
      const ouverte = combiOuverte(i);
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'combi' + (i === prog.combi ? ' portee' : '') + (ouverte ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 144; cv.height = 144;
      const c = cv.getContext('2d');
      casque(c, 72, 72, 60, 0, i, 0, false);
      if (!ouverte) { c.fillStyle = '#060912aa'; rond(c, 72, 72, 62); c.fill(); }
      const nom = document.createElement('span'); nom.textContent = tr('combi.' + i);
      const info = document.createElement('small');
      info.textContent = !ouverte ? tr('combi.seuil', { n: k.seuil }) : i === prog.combi ? tr('combi.portee') : tr('combi.choisir');
      b.append(cv, nom, info);
      b.setAttribute('aria-label', tr('combi.aria', { nom: tr('combi.' + i) }) + ' · ' + info.textContent);
      if (ouverte) b.addEventListener('click', () => { audio(); sons.repare(); prog.combi = i; sauverReglages(); ouvrirCombis(); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('combi-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('combis');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés : la station en petit, une main joue 1 à 3 gestes
  // ---------------------------------------------------------------------

  function placer(e, s, m, z) { e.eq[s][m].z = z; }
  function disperser(e) { // quelques robots déjà au travail
    placer(e, 1, 0, 4); placer(e, 2, 0, 1); placer(e, 3, 0, 5); placer(e, 4, 0, 3); placer(e, 2, 1, 0);
  }
  const TUTOS = {
    base: { niv: 1, prep: (e) => { disperser(e); e.mo = [1, 3, 0, 3]; e.pi[0] = 0; },
      etapes: [{ z: 0, f: (e, a) => { placer(e, 0, 0, 0); e.mo[0] = 2; a.vert(0); } }, { z: 2, f: (e, a) => { placer(e, 0, 1, 2); e.mo[2] = 1; a.vert(2); } }] },
    soute: { niv: 2, prep: (e) => { disperser(e); placer(e, 1, 0, 6); e.mo = [2, 1, 3, 2]; e.pi[0] = 0; },
      etapes: [{ z: 4, f: (e, a) => { placer(e, 0, 0, 4); e.pi[0] = 2; a.or(4); } }, { z: 1, f: (e, a) => { placer(e, 0, 0, 1); e.mo[1] = 3; e.pi[0] = 1; a.vert(1); } }] },
    oxygene: { niv: 3, prep: (e) => { disperser(e); placer(e, 2, 0, 6); placer(e, 2, 1, 6); e.mo = [1, 1, 3, 3]; e.o2 = 6; },
      etapes: [{ z: -1, f: (e, a) => { e.o2 = 4; a.rouge(0); a.rouge(1); } }, { z: 0, f: (e, a) => { placer(e, 0, 0, 0); e.mo[0] = 2; a.vert(0); } }, { z: 1, f: (e, a) => { placer(e, 0, 1, 1); e.mo[1] = 2; a.vert(1); } }] },
    chaine: { niv: 4, prep: (e) => { disperser(e); placer(e, 2, 0, 6); e.mo = [3, 1, 2, 3]; },
      etapes: [{ z: -1, f: (e, a) => { e.mo[1] = 0; a.rouge(1); } }, { z: -1, f: (e, a) => { e.mo[2] = 1; a.rouge(2); } }, { z: 1, f: (e, a) => { placer(e, 0, 0, 1); e.mo[1] = 1; a.vert(1); } }] },
    creature: { niv: 6, prep: (e) => { placer(e, 1, 0, 4); placer(e, 3, 0, 1); e.cr.z = -1; },
      etapes: [{ z: -1, f: (e, a) => { e.cr.z = 6; e.eq[2][0].s = 1; a.rouge(6); } }, { z: 4, f: (e) => { placer(e, 0, 0, 4); } }, { z: 5, f: (e) => { placer(e, 0, 1, 5); } }] },
    soin: { niv: 7, prep: (e) => { disperser(e); e.eq[0][0].s = 1; e.mo[3] = 2; },
      etapes: [{ z: 3, f: (e, a) => { placer(e, 0, 0, 3); e.eq[0][0].s = 0; e.mo[3] = 3; a.rose(3); } }] },
    porte: { niv: 9, prep: (e) => { disperser(e); e.cr.z = 5; placer(e, 1, 1, 5); placer(e, 2, 2, 5); e.pi[0] = 1; },
      etapes: [{ z: 5, porte: true, f: (e, a) => { e.po[5] = 2; e.cr.pg = 2; e.pi[0] = 0; a.or(5); } }, { z: -1, f: (e, a) => { e.eq[1][1].s = 1; a.rouge(5); } }] },
    capsule: { niv: 11, prep: (e) => { disperser(e); e.cyc = e.lv.cy; e.cr.z = 6; },
      etapes: [{ z: 7, f: (e, a) => { placer(e, 0, 0, 7); e.caL--; a.bleu(7); } }, { z: 7, f: (e, a) => { placer(e, 0, 1, 7); e.caL--; a.bleu(7); } }] },
    enragee: { niv: 13, prep: (e) => { disperser(e); placer(e, 1, 1, 3); placer(e, 2, 2, 3); placer(e, 0, 0, 3); },
      etapes: [{ z: -1, f: (e, a) => { e.cr.z = 3; e.eq[1][1].s = 1; e.eq[2][2].s = 1; a.rouge(3); } }, { z: 6, f: (e) => { placer(e, 0, 0, 6); } }] },
    alarme: { niv: 14, prep: (e) => { disperser(e); e.mo[2] = 0; e.cache = true; e.cr.z = 4; },
      etapes: [{ z: 2, f: (e, a) => { placer(e, 0, 0, 2); e.mo[2] = 1; e.cache = false; a.vert(2); } }] }
  };

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    if (!d) { apres(); return; }
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const W = 560, H = 360, BARRE = 26;
    const base = () => { const e = R.depart(graineHasard(5), PLACES, { niveau: d.niv }); e.tour = 0; d.prep(e); return e; };
    let e = base(), debut = 0, fait = 0, fl = {};
    const PAS = 1500, j = ++tutoAnim;
    const L = disposition(W, H - BARRE, e);
    L.salles.forEach((r) => { if (r) r.y += BARRE; });
    L.y += BARRE;
    const anim = (coul) => (z) => { fl[z] = { t: performance.now(), coul: coul }; };
    const fx = { vert: anim('#6fe39a'), rouge: anim('#ff4d5e'), or: anim('#ffd166'), rose: anim('#ff7f9e'), bleu: anim('#8fd0ff') };
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = base(); fait = 0; fl = {}; debut = t; return void (tutoAnimId = requestAnimationFrame(image)); }
      const etape = fait < d.etapes.length ? d.etapes[fait] : null;
      if (etape && k >= fait && dans >= (etape.z >= 0 ? 820 : 450)) { etape.f(e, fx); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, W, H);
      // barre d'oxygène de la démo
      c.fillStyle = '#ffffff18'; rr(c, 14, 7, W - 28, 12, 6); c.fill();
      c.fillStyle = e.o2 <= 4 ? '#ff4d5e' : '#35c6e8'; rr(c, 14, 7, (W - 28) * e.o2 / O.O2_MAX, 12, 6); c.fill();
      dessinerStation(c, e, L, { t: performance.now(), moi: 0, sel: 0, flash: fl, jetons: positionsJetons(e, L), combi: prog.combi });
      if (etape && etape.z >= 0 && k >= fait) {
        const r = L.salles[etape.z];
        const mx = r.x + r.w * 0.5, my = r.y + r.h * 0.55;
        const q = Math.min(1, dans / 650);
        const x = W - 40 + (mx - (W - 40)) * q, y = H - 20 + (my - (H - 20)) * q;
        if (etape.porte) { c.save(); c.strokeStyle = '#ffd166'; c.lineWidth = 3; rr(c, x + 18, y - 40, 22, 28, 4); c.stroke(); c.beginPath(); c.moveTo(x + 18, y - 26); c.lineTo(x + 40, y - 26); c.stroke(); c.restore(); }
        main(c, x, y, 1.3, q >= 1 ? Math.min(1, (dans - 650) / 120) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function salleSous(px, py) {
    if (!geo) return -1;
    for (let z = 0; z < 8; z++) { const r = geo.salles[z]; if (r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return z; }
    return -1;
  }
  // Un de mes astronautes sous le doigt ? (zone de toucher élargie)
  function membreSous(px, py) {
    const moi = moiSiege();
    if (moi < 0 || !vue) return -1;
    let best = -1, bd = Infinity;
    Object.keys(affiches).forEach((k) => {
      const p = affiches[k];
      if (p.s !== moi || !O.libre(vue, vue.eq[moi][p.m])) return;
      const d = Math.hypot(px - p.x, py - p.y);
      if (d < Math.max(22, p.r + 8) && d < bd) { bd = d; best = p.m; }
    });
    return best;
  }

  function choisirMembre(i) {
    const moi = moiSiege();
    if (!vue || moi < 0 || !O.libre(vue, vue.eq[moi][i])) { sons.non(); return; }
    sel = i; modePorte = false; sons.clic();
    majEquipe(); majAide();
  }

  function basculerPorte() {
    if ($('btn-porte').hidden || $('btn-porte').disabled) { sons.non(); return; }
    modePorte = !modePorte; sons.clic();
    majEquipe(); majAide();
  }

  function raison(z) { return apercu(z) || tr('apercu.impossible'); }

  function agir(z) {
    if (!partie || enPause || attenteTuto || !vue || z < 0) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    const moi = partie.siege;
    if (modePorte) {
      if (O.portePermise(vue, moi, z)) { modePorte = false; partie.jouer({ p: z }); }
      else { toast(raison(z), 1800); sons.non(); }
      majInterface();
      return;
    }
    if (sel < 0 || !O.libre(vue, vue.eq[moi][sel])) sel = premierLibre();
    if (sel >= 0 && O.destinationPermise(vue, moi, sel, z)) partie.jouer({ m: sel, z: z });
    else { toast(raison(z), 1800); sons.non(); }
    majInterface();
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => { audio(); clavier = false; const p = point(ev); survol = salleSous(p[0], p[1]); majAide(); });
  plateau.addEventListener('pointermove', (ev) => {
    if (ev.pointerType !== 'mouse') return;
    const p = point(ev), z = salleSous(p[0], p[1]);
    if (z !== survol) { survol = z; majAide(); }
  });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    if (ev.pointerType !== 'mouse') survol = -1;
    if (!modePorte && partie && partie.monTour()) {
      const m = membreSous(p[0], p[1]);
      if (m >= 0 && m !== sel) { choisirMembre(m); return; }
    }
    agir(salleSous(p[0], p[1]));
  });
  plateau.addEventListener('pointercancel', () => { survol = -1; });
  plateau.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') { survol = -1; majAide(); } });

  // Curseur clavier : salle voisine dans la direction de la flèche.
  function deplacerCurseur(dx, dy) {
    if (!geo) return;
    const ok = (z) => !!geo.salles[z];
    if (curseur < 0 || !ok(curseur)) { curseur = 6; return; }
    const a = centre(curseur);
    let best = -1, bd = Infinity;
    for (let z = 0; z < 8; z++) {
      if (!ok(z) || z === curseur) continue;
      const q = centre(z), vx = q[0] - a[0], vy = q[1] - a[1];
      const avance = vx * dx + vy * dy;
      if (avance <= 1) continue;
      const score = avance + Math.abs(vx * dy - vy * dx) * 1.6;
      if (score < bd) { bd = score; best = z; }
    }
    if (best >= 0) { curseur = best; sons.clic(); }
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (chiffres[ev.code] !== undefined) { ev.preventDefault(); audio(); choisirMembre(chiffres[ev.code]); return; }
    if (ev.code === 'KeyD') { ev.preventDefault(); audio(); basculerPorte(); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!clavier) { clavier = true; if (curseur < 0) { curseur = 6; majAide(); return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
      majAide();
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (!clavier || curseur < 0) { clavier = true; if (curseur < 0) curseur = 6; majAide(); return; }
      agir(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-combis').addEventListener('click', () => { audio(); sons.clic(); ouvrirCombis(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('combi-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-porte').addEventListener('click', () => { audio(); basculerPorte(); });
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  construireEquipe();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); dessinerTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
