    const tourTxt = e ? tr('jeu.tour', { n: Math.min(e.N, Math.floor(e.k / PLACES) + 1), total: e.N }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, pays: tr('pays.' + paysDe(niveau - 1)) }) + (tourTxt ? ' · ' + tourTxt : '');
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + (tourTxt ? ' · ' + tourTxt : '');
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
  }

  // La main de tuiles (en bas) : celles de ta jeep.
  function majMain() {
    const e = vue, moi = partie ? partie.siege : -1;
    const v = e && moi >= 0 ? e.v[moi] : null;
    const monTour = !!(partie && partie.monTour() && !attenteTuto && !animEnCours());
    document.querySelectorAll('#main .tuile').forEach((b) => {
      const k = Number(b.dataset.k);
      const t = k === 3 ? 4 : (v ? v.h[k] : 0);
      const ok = !!v && (k === 3 || O.cible(e, moi, k) !== null);
      const cle = t + '|' + ok + '|' + monTour + '|' + (choix === k);
      if (b.dataset.cle !== cle) {
        b.dataset.cle = cle;
        const cv = b.querySelector('canvas');
        iconeTuile(cv.getContext('2d'), t, cv.width, cv.height, ok && monTour);
        b.classList.toggle('bloquee', !ok);
        b.classList.toggle('attente', ok && !monTour);
        b.classList.toggle('choisie', choix === k && monTour);
        b.setAttribute('aria-label', k === 3 ? tr('tuile.demi') : tr('tuile.' + t) + (ok ? '' : ' · ' + tr('tuile.bloquee')));
      }
    });
  }

  function majInterface() {
    majPlaces();
    majInfos();
    majMain();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  const animEnCours = () => !!anim && performance.now() - anim.t0 < DUREE;
  let rafId = 0, tPrec = 0, mainCle = '';
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    const cle = String(animEnCours()) + (partie ? partie.monTour() : '');
    if (cle !== mainCle) { mainCle = cle; majMain(); }
    rafId = requestAnimationFrame(boucle);
  }

  function fantomes() {
    if (!vue || !partie || !partie.monTour() || attenteTuto || animEnCours()) return [];
    const moi = partie.siege, l = [];
    for (let k = 0; k < 3; k++) { const m = O.cible(vue, moi, k); if (m) l.push({ k: k, r: m.r, c: m.c, d: m.d }); }
    return l;
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, Math.max(10, Math.min(w, h) * 0.03));
    const moi = partie ? partie.siege : -1;
    effets = effets.filter((f) => t - f.t0 < f.duree);
    dessinerPlateau(c, vue, geo, {
      t: t, moi: moi, anim: anim, fantomes: fantomes(), choix: choix, effets: effets, peinture: prog.options.peinture,
      actif: partie && partie.phase === 'jeu' ? R.aQui(vue) : -1
    });
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      etincelle(c, p.x, p.y, p.k);
      c.globalAlpha = 1;
    }
  }

  function jaillir(r, col, coul) {
    if (!vue || !geo) return;
    const x = geo.ox + (col + 0.5) * geo.s, y = geo.oy + (r + 0.5) * geo.s;
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 180;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, vie: 0.7 + Math.random() * 0.4, k: geo.s * (0.07 + Math.random() * 0.07), coul: k % 2 ? coul : '#ffe066' });
    }
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anim = null; effets = [];
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44, peintureDe(s, info));
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { jeep: tr('jeep.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { jeep: nomChef ? nomChef + ' · ' + tr('jeep.' + partie.chef) : tr('jeep.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    anim = null; effets = [];
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    choix = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') {
      toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour();
      // nouveau terrain en ligne : son tutoriel, s'il n'a jamais été vu (sans arrêter la partie)
      const tu = NIVEAUX[vue.n] && NIVEAUX[vue.n].tuto;
      if (tu && prog.tutos.indexOf(tu) < 0 && tu !== 'base') { prog.tutos.push(tu); toast(tr('tuto.' + tu + '.titre') + ' : ' + tr('tuto.' + tu + '.texte'), 6000); }
    } else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const t = performance.now();
    const avant = ev.avant, apres = ev.apres;
    vue = JSON.parse(JSON.stringify(apres));
    const der = apres.der || { s: ev.siege, de: [avant.v[ev.siege].r, avant.v[ev.siege].c, avant.v[ev.siege].d], ch: [], p: -1, f: [], j: 0, t: [] };
    anim = { t0: t, siege: ev.siege, de: der.de, ch: der.ch || [], avant: avant, fuites: der.f || [] };
    debutTour = Date.now();
    dernierTic = -1;
    choix = -1;
    sons.moteur();
    const j = jeton, moi = ev.moi;
    const v = apres.v[ev.siege];
    if (der.j) { effets.push({ genre: 'texte', texte: tr('jumelles.prises'), r: v.r, c: v.c, t0: t + DUREE, duree: 1300, coul: '#9fe0ff' }); setTimeout(() => { if (j === jeton) sons.jumelles(); }, DUREE); }
    (der.f || []).forEach((i) => {
      const a = apres.a[i];
      effets.push({ genre: 'texte', texte: tr('fuite', { animal: nomEsp(a.s) }), r: a.r, c: a.c, t0: t + 200, duree: 1500, coul: '#bfe6ff' });
      setTimeout(() => { if (j === jeton) sons.fuite(); }, 120);
    });
    if (der.t && der.t.length) setTimeout(() => { if (j === jeton) sons.galop(); }, DUREE * 0.6);
    if (der.p >= 0) {
      const a = apres.a[der.p], val = ESP[a.s].v;
      const voitAnimal = !apres.nu || (partie && partie.siege >= 0 && voit(apres, partie.siege, a.r, a.c)) || moi;
      effets.push({ genre: 'flash', r: a.r, c: a.c, t0: t + DUREE * 0.8, duree: 450 });
      effets.push({ genre: 'texte', texte: voitAnimal ? tr('photo.prise', { animal: nomEsp(a.s), n: val }) : tr('photo.points', { n: val }), r: a.r, c: a.c, t0: t + DUREE * 0.85, duree: 1500, coul: val === 3 ? '#ffd84d' : '#fff', gros: val === 3 });
      if (val === 3) effets.push({ genre: 'etoiles', r: a.r, c: a.c, t0: t + DUREE * 0.85, duree: 900 });
      sons.photo(DUREE * 0.8 / 1000);
      if (val === 3) sons.rare(DUREE * 0.8 / 1000);
      setTimeout(() => {
        if (j !== jeton) return;
        const carte = $('place-' + ev.siege);
        if (carte) { carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }
        if (val === 3) jaillir(a.r, a.c, COUL[ev.siege]);
        if (moi && val === 3) toast(tr('photo.rare', { animal: nomEsp(a.s) }), 1800);
      }, DUREE);
    }
    if (ev.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !moi) setTimeout(() => { if (j === jeton) sons.tour(); }, DUREE);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1300);
  }

  // Album : espèces photographiées par ta jeep dans cette manche. Renvoie les nouvelles.
  function remplirAlbum(e, moi) {
    const nouvelles = [];
    if (moi < 0) return nouvelles;
    e.a.forEach((a) => {
      if (a.ph !== moi) return;
      if (!prog.album[a.s]) nouvelles.push(a.s);
      prog.album[a.s] = (prog.album[a.s] || 0) + 1;
    });
    return nouvelles.filter((x, i) => nouvelles.indexOf(x) === i);
  }

  function texteAlbum(nouvelles) {
    return nouvelles.length ? tr('fin.album', { animaux: nouvelles.map(nomEsp).join(', ') }) : '';
  }

  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    const nouvelles = remplirAlbum(e, moi);
    if (moi >= 0) sauverAlbum();
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (nouvelles.length) toast(texteAlbum(nouvelles), 3500);
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins d'expédition : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(gagne, rares) {
    if (!gagne) return 0;
    return 1 + (rares >= 1 ? 1 : 0) + (rares >= 2 ? 1 : 0);
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64; medaillon(cv.getContext('2d'), s, 32, 32, 30, s === moi ? prog.options.peinture : 'sable');
      const qui = document.createElement('span'); qui.className = 'qui';
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('jeep.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: e.sc[s] });
      if (e.ra[s]) { const sm = document.createElement('small'); sm.textContent = tr('fin.raresCourt', { n: e.ra[s] }); n.appendChild(sm); }
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0;
    const rares = moi >= 0 ? e.ra[moi] : 0;
    const gagne = moi >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    $('fin-points').textContent = moi >= 0 ? tr('fin.points', { n: pts }) : '';
    $('fin-rares').textContent = moi >= 0 ? tr('fin.rares', { n: rares }) : '';
    const etoilesAvant = totalEtoiles();
    const nouvelles = remplirAlbum(e, moi);
    $('fin-album').textContent = texteAlbum(nouvelles);
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(gagne, rares);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else sauver(niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      const peinture = PEINTURES.find((p) => p.min > etoilesAvant && p.min <= totalEtoiles());
      let deb = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const base = () => {
      const e = O.preparer({ g: d.g, N: 99, lg: d.lg ? 1 : 0, nu: d.nu }, 1, graineHasard(5), niveau - 1);
      if (d.d !== undefined) e.v[0].d = d.d;
      e.v[0].h = d.etapes[0][0].slice();
      return e;
    };
    let e = base(), debut = 0, fait = 0, an = null, fx = [];
    const PAS = 1900, j = ++tutoAnim;
    const g = geometrie(e, 560, 300, 18);
    const boutonX = (k) => 560 / 2 + (k - 1.5) * 112;
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = base(); fait = 0; an = null; fx = []; debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= 900) {
        const pa = d.etapes[fait];
        e.v[0].h = pa[0].slice();
        const avant = JSON.parse(JSON.stringify(e));
        R.jouer(e, 0, pa[1], graineHasard(9 + fait));
        const der = e.der;
        an = { t0: t, siege: 0, de: der.de, ch: der.ch, avant: avant, fuites: der.f };
        fx = [];
        if (der.p >= 0) {
          const a = e.a[der.p];
          fx.push({ genre: 'flash', r: a.r, c: a.c, t0: t + DUREE * 0.8, duree: 450 });
          fx.push({ genre: 'texte', texte: tr('photo.prise', { animal: nomEsp(a.s), n: ESP[a.s].v }), r: a.r, c: a.c, t0: t + DUREE * 0.85, duree: 1300, coul: ESP[a.s].v === 3 ? '#ffd84d' : '#fff' });
        }
        der.f.forEach((i) => { const a = e.a[i]; fx.push({ genre: 'texte', texte: tr('fuite', { animal: nomEsp(a.s) }), r: a.r, c: a.c, t0: t + 200, duree: 1400, coul: '#bfe6ff' }); });
        if (der.j) fx.push({ genre: 'texte', texte: tr('jumelles.prises'), r: e.v[0].r, c: e.v[0].c, t0: t + DUREE, duree: 1200, coul: '#9fe0ff' });
        fait++;
        if (fait < d.etapes.length) e.v[0].h = d.etapes[fait][0].slice();
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 400);
      const fan = [];
      if (!(an && t - an.t0 < DUREE)) for (let q = 0; q < 3; q++) { const m = O.cible(e, 0, q); if (m) fan.push({ k: q, r: m.r, c: m.c, d: m.d }); }
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      dessinerPlateau(c, e, g, { t: t, moi: 0, anim: an, effets: fx, fantomes: fan, choix: prochaine && dans > 650 ? prochaine[1] : -1, peinture: prog.options.peinture });
      // la main de tuiles, en bas
      for (let q = 0; q < 4; q++) {
        const bx = boutonX(q), by = 350;
        c.fillStyle = prochaine && prochaine[1] === q && dans > 650 ? '#dbe8ff' : '#fff8e6';
        c.strokeStyle = prochaine && prochaine[1] === q && dans > 650 ? '#2f6fe0' : '#9a6a33'; c.lineWidth = 3;
        rr(c, bx - 50, by - 38, 100, 76, 14); c.fill(); c.stroke();
        c.save(); c.translate(bx - 46, by - 34);
        iconeTuile(c, q === 3 ? 4 : e.v[0].h[q], 92, 68, true, true);
        c.restore();
      }
      if (prochaine) {
        const q = Math.min(1, dans / 800);
        const cx = boutonX(prochaine[1]), cy = 350;
        main(c, 520 + (cx - 520) * q, 395 + (cy - 395) * q, 1.5, q >= 1 && dans < 1000 ? Math.min(1, (dans - 800) / 100) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function jouerTuile(k) {
    if (!partie || enPause || attenteTuto || k < 0) return;
    if (!partie.monTour() || animEnCours()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (k < 3 && !O.cible(vue, partie.siege, k)) { toast(tr('tuile.bloquee'), 1400); sons.non(); return; }
    if (partie.jouer(k)) { choix = -1; sons.clic(); }
  }

  // Touche fléchée : la tuile de ta main qui va dans cette direction.
  function tuileVers(type) {
    if (!vue || !partie || partie.siege < 0) return -1;
    const h = vue.v[partie.siege].h;
    const ordre = type === 0 ? [0, 3] : [type];
    for (const t of ordre) for (let k = 0; k < 3; k++) if (h[k] === t && O.cible(vue, partie.siege, k)) return k;
    for (const t of ordre) for (let k = 0; k < 3; k++) if (h[k] === t) return k;
    return -1;
  }

  document.querySelectorAll('#main .tuile').forEach((b) => {
    const k = Number(b.dataset.k);
    b.addEventListener('click', () => { audio(); jouerTuile(k); });
    b.addEventListener('pointerenter', (ev) => { if (ev.pointerType === 'mouse') { choix = k; majMain(); } });
    b.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse' && choix === k) { choix = -1; majMain(); } });
    b.addEventListener('focus', () => { choix = k; majMain(); });
    b.addEventListener('blur', () => { if (choix === k) { choix = -1; majMain(); } });
  });

  const plateau = $('plateau');
  function caseSous(ev) {
    if (!geo || !vue) return null;
    const r = plateau.getBoundingClientRect();
    const col = Math.floor((ev.clientX - r.left - geo.ox) / geo.s), row = Math.floor((ev.clientY - r.top - geo.oy) / geo.s);
    return row >= 0 && row < vue.H && col >= 0 && col < vue.W ? [row, col] : null;
  }
  // Toucher une arrivée possible (fantôme) joue la tuile correspondante.
  plateau.addEventListener('pointerup', (ev) => {
    audio();
    const q = caseSous(ev);
    if (!q) return;
    const f = fantomes().find((x) => x.r === q[0] && x.c === q[1]);
    if (f) jouerTuile(f.k);
    else if (partie && partie.monTour()) {
      if (Date.now() - dernierAttends > 1500) { dernierAttends = Date.now(); toast(tr('tuile.choisis'), 1600); }
    }
  });
  plateau.addEventListener('pointermove', (ev) => {
    if (ev.pointerType !== 'mouse') return;
    const q = caseSous(ev);
    const f = q ? fantomes().find((x) => x.r === q[0] && x.c === q[1]) : null;
    const k = f ? f.k : -1;
    if (k !== choix) { choix = k; majMain(); }
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const fleches = { ArrowUp: 0, ArrowLeft: 1, ArrowRight: 2, KeyW: 0, KeyA: 1, KeyD: 2 };
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3, Numpad1: 0, Numpad2: 1, Numpad3: 2, Numpad4: 3 };
    if (fleches[ev.code] !== undefined) {
      ev.preventDefault(); audio();
      const k = tuileVers(fleches[ev.code]);
      if (k < 0) { toast(tr('tuile.absente'), 1400); sons.non(); return; }
      jouerTuile(k);
    } else if (ev.code === 'ArrowDown' || ev.code === 'KeyS') { ev.preventDefault(); audio(); jouerTuile(3); }
    else if (chiffres[ev.code] !== undefined) { ev.preventDefault(); audio(); jouerTuile(chiffres[ev.code]); }
  });

  // ---------------------------------------------------------------------
  //  Affiche (jaquette du jeu)
  //  Avec window.JEL_AFFICHE (posé par le robot du site, jamais par le jeu) :
  //  une scène composée, sans interface ni texte, d'où sort la jaquette
  //  (CONSIGNES-JEU.md, section 5). La jeep bleue fonce sur la piste au
  //  coucher du soleil ; le flash de son appareil photographie un lion au
  //  cadre doré, la photo s'envole ; girafe, zèbre et éléphant attendent.
  // ---------------------------------------------------------------------

  let modeAffiche = false;
  let modeApercu = 0;          // 1, 2 ou 3 : image du jeu préparée pour sa page (window.JEL_APERCU)

  function dessinerAffiche() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Composition dans une boîte de 600 × 800 centrée ; ciel et sol vont jusqu'aux bords.
    const k = Math.min(w / 600, h / 800), ox = (w - 600 * k) / 2, oy = (h - 800 * k) / 2;
    const X = (x) => ox + x * k, Y = (y) => oy + y * k;
    const hz = Y(400);
    // Ciel du couchant
    let g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, '#ff9a64'); g.addColorStop(0.5, '#ffc872'); g.addColorStop(1, '#fff0b4');
    c.fillStyle = g; c.fillRect(0, 0, w, hz + 2);
    // Grand soleil derrière le lion : la vraie source de lumière
    const sx = X(420), sy = Y(300);
    g = c.createRadialGradient(sx, sy, 10 * k, sx, sy, 330 * k);
    g.addColorStop(0, 'rgba(255,252,220,1)'); g.addColorStop(0.35, 'rgba(255,240,180,.7)'); g.addColorStop(1, 'rgba(255,220,150,0)');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = 'rgba(255,244,196,.8)'; rond(c, sx, sy, 135 * k); c.fill();
    // Oiseaux
    c.strokeStyle = '#8a3f2a'; c.lineWidth = 3 * k; c.lineCap = 'round';
    [[90, 120, 1], [130, 100, 0.8], [520, 70, 0.9], [555, 95, 0.7]].forEach((p) => {
      const bx = X(p[0]), by = Y(p[1]), q = 12 * k * p[2];
      c.beginPath(); c.moveTo(bx - q, by); c.quadraticCurveTo(bx - q * 0.5, by - q * 0.6, bx, by); c.quadraticCurveTo(bx + q * 0.5, by - q * 0.6, bx + q, by); c.stroke();
    });
    // Collines lointaines, acacias
    c.fillStyle = '#e39a58';
    c.beginPath(); c.moveTo(0, hz + 10 * k);
    c.bezierCurveTo(X(100), hz - 60 * k, X(220), hz - 10 * k, X(330), hz - 34 * k);
    c.bezierCurveTo(X(450), hz - 70 * k, X(540), hz - 20 * k, w, hz - 30 * k);
    c.lineTo(w, hz + 40 * k); c.lineTo(0, hz + 40 * k); c.fill();
    acacia(c, X(70), hz + 6 * k, 120 * k, '#8a4a2a');
    acacia(c, X(585), hz + 4 * k, 80 * k, '#9a5a32');
    acacia(c, X(-40), hz + 30 * k, 190 * k, '#6a3a22');
    // Sol de la savane
    g = c.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, '#f0c260'); g.addColorStop(1, '#cf9334');
    c.fillStyle = g; c.fillRect(0, hz + 20 * k, w, h);
    const al = graineHasard(21);
    c.strokeStyle = '#a8742a'; c.lineWidth = 2.4 * k;
    for (let i = 0; i < 160; i++) {
      const x = al() * w, y = hz + 30 * k + al() * (h - hz);
      const q = (0.6 + (y - hz) / (h - hz)) * 9 * k;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x - q * 0.35, y - q); c.moveTo(x + q * 0.2, y); c.lineTo(x + q * 0.55, y - q * 0.9); c.stroke();
    }
    // La piste de terre posée par la jeep, du bas de l'image jusqu'à elle
    const piste = () => { c.beginPath(); c.moveTo(X(130), h + 20 * k); c.bezierCurveTo(X(170), Y(700), X(200), Y(620), X(250), Y(540)); };
    c.lineCap = 'round';
    c.strokeStyle = '#b48a52'; c.lineWidth = 120 * k; piste(); c.stroke();
    c.strokeStyle = '#ecd8a8'; c.lineWidth = 92 * k; piste(); c.stroke();
    c.strokeStyle = COUL[0]; c.globalAlpha = 0.55; c.lineWidth = 5 * k; c.setLineDash([18 * k, 16 * k]); piste(); c.stroke();
    c.setLineDash([]); c.globalAlpha = 1;
    // Animaux du fond : éléphant et girafe, puis un zèbre au premier plan
    pion(c, 'E', X(78), Y(345), 48 * k, {});
    pion(c, 'G', X(560), Y(418), 50 * k, {});
    const lx = X(430), ly = Y(250), lr = 104 * k;
    const jx = X(285), jy = Y(470), ja = 0.42;
    // Poussière soulevée derrière la jeep
    c.fillStyle = 'rgba(255,238,200,.75)';
    [[-70, 175, 34], [-30, 205, 28], [-110, 205, 26], [-80, 240, 22], [10, 230, 20]].forEach((p) => {
      const x = jx + (p[0] * Math.cos(ja) - p[1] * Math.sin(ja)) * k * 0.5, y = jy + (p[0] * Math.sin(ja) + p[1] * Math.cos(ja)) * k * 0.9;
      rond(c, x, y, p[2] * k); c.fill();
    });
    // Rayon lumineux de l'appareil, de la jeep jusqu'au lion
    g = c.createLinearGradient(jx, jy, lx, ly);
    g.addColorStop(0, 'rgba(255,255,230,0)'); g.addColorStop(0.4, 'rgba(255,255,230,.3)'); g.addColorStop(1, 'rgba(255,255,255,.55)');
    c.fillStyle = g;
    const an = Math.atan2(ly - jy, lx - jx), nx = -Math.sin(an), ny = Math.cos(an);
    c.beginPath();
    c.moveTo(jx + nx * 18 * k, jy + ny * 18 * k); c.lineTo(lx + nx * 80 * k, ly + ny * 80 * k);
    c.lineTo(lx - nx * 80 * k, ly - ny * 80 * k); c.lineTo(jx - nx * 18 * k, jy - ny * 18 * k); c.closePath(); c.fill();
    // Flash de l'appareil sur le lion
    g = c.createRadialGradient(lx, ly, lr * 0.6, lx, ly, lr * 2.3);
    g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(0.5, 'rgba(255,250,215,.45)'); g.addColorStop(1, 'rgba(255,250,215,0)');
    c.fillStyle = g; rond(c, lx, ly, lr * 2.3); c.fill();
    c.strokeStyle = '#ffffff'; c.lineCap = 'round';
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6 + 0.13, l1 = lr * 1.22, l2 = lr * (i % 2 ? 1.62 : 1.9);
      c.lineWidth = (i % 2 ? 5 : 8) * k;
      c.beginPath(); c.moveTo(lx + Math.cos(a) * l1, ly + Math.sin(a) * l1); c.lineTo(lx + Math.cos(a) * l2, ly + Math.sin(a) * l2); c.stroke();
    }
    // Le lion au cadre doré (animal rare), en grand
    pion(c, 'L', lx, ly, lr, { t: 1300 });
    // Étincelles dorées autour de la photo rare
    [[-1.4, 1.5, 22], [-0.4, 1.75, 16], [0.7, 1.6, 20], [2.3, 1.5, 15], [3.3, 1.7, 18], [1.6, 1.45, 12]].forEach((p, i) => {
      c.fillStyle = i % 2 ? '#fff' : '#ffd84d'; c.shadowColor = '#ffc21a'; c.shadowBlur = 14 * k;
      etincelle(c, lx + Math.cos(p[0]) * lr * p[1], ly + Math.sin(p[0]) * lr * p[1], p[2] * k);
    });
    c.shadowBlur = 0;
    // La jeep bleue de l'expédition, en grand, qui fonce vers le lion
    c.save(); c.shadowColor = 'rgba(255,255,255,.9)'; c.shadowBlur = 20 * k;
    jeep(c, jx, jy, 400 * k, ja, 0, 'zebre');
    c.restore();
    jeep(c, jx, jy, 400 * k, ja, 0, 'zebre');
    // Petit appareil photo sur le capot, qui lance son flash
    c.save(); c.translate(jx, jy); c.rotate(ja);
    appareil(c, 0, -128 * k, 26 * k, '#1b2f6a');
    c.fillStyle = '#fffbe0'; c.shadowColor = '#fff'; c.shadowBlur = 18 * k; etincelle(c, 0, -160 * k, 22 * k); c.shadowBlur = 0;
    c.restore();
    // La photo du lion qui vient de sortir et s'envole
    photoTitre(c, 'L', X(118), Y(175), 150 * k, -0.24);
    c.fillStyle = '#ffd84d'; etincelle(c, X(190), Y(110), 16 * k); etincelle(c, X(52), Y(260), 12 * k);
    // Zèbre au premier plan, coupé par le bord droit
    pion(c, 'z', X(560), Y(560), 78 * k, {});
    // Premier plan : grandes herbes dans les coins du bas
    [[X(20), 1.6], [X(70), 1.2], [X(470), 1.1], [X(590), 1.7], [X(540), 1.3]].forEach((p, i) => {
      const fx = p[0], f = p[1];
      c.strokeStyle = i % 2 ? '#7a4e14' : '#9a6a1e'; c.lineWidth = 7 * k * f; c.lineCap = 'round';
      for (let b = -1; b <= 1; b++) {
        c.beginPath(); c.moveTo(fx + b * 10 * k, h + 6 * k);
        c.quadraticCurveTo(fx + b * 18 * k, h - 70 * k * f, fx + b * 40 * k + 8 * k, h - 120 * k * f); c.stroke();
      }
    });
  }

  function demarrerAffiche() {
    modeAffiche = true;
    ecran = 'affiche';
    const cacher = () => {
      for (const el of document.querySelectorAll('.ecran, .voile, #toast, #confettis, button, .jel-langue')) el.style.setProperty('display', 'none', 'important');
      $('fond').style.setProperty('display', 'block', 'important');
    };
    cacher();
    dessinerAffiche();
    // Le bouton de langue peut être créé après ce script : on le recache un peu plus tard.
    setTimeout(cacher, 50); setTimeout(cacher, 400); setTimeout(cacher, 1200);
    window.addEventListener('resize', dessinerAffiche);
  }

  // ---------------------------------------------------------------------
  //  Images du jeu (page du jeu)
  //  Avec window.JEL_APERCU = 1, 2 ou 3 (posé par le robot du site, jamais
  //  par le jeu) : une vraie partie solo contre les 3 robots, avec sa vraie
  //  interface (places et points, niveau, tour, main de tuiles), sans écran
  //  titre, ni fenêtre « Continuer », ni tutoriel. Les coups sont joués
  //  d'avance par les règles (hasard à graine fixe), puis la partie est figée
  //  au moment où c'est à toi de jouer : ni robot, ni réseau, ni son, ni
  //  sauvegarde, ni FMG.
  //    1 = niveau 1, la plaine : premières photos ;
  //    2 = niveau 8, le marais : rivières, gué, flamants et hippopotames ;
  //    3 = niveau 20, la forêt la nuit : yeux qui brillent, jumelles, léopard.
  // ---------------------------------------------------------------------

  const SCENES_APERCU = {
    1: { niveau: 1, coups: 12, graine: 44, peinture: 'sable' },
    2: { niveau: 8, coups: 16, graine: 324, peinture: 'girafe' },
    3: { niveau: 20, coups: 16, graine: 368, peinture: 'leopard' }
  };

  function ouvrirApercu(numero) {
    modeApercu = numero;
    const sc = SCENES_APERCU[numero];
    prog.options.son = false;
    prog.options.peinture = sc.peinture;
    const alea = graineHasard(sc.graine);
    const e = O.preparer(NIVEAUX[sc.niveau - 1], PLACES, alea, sc.niveau - 1);
    e.fr = O.forceNiveau(sc.niveau);
    let photo = null;
    for (let i = 0; i < sc.coups; i++) {
      const s = e.tour, fr = e.fr;
      e.fr = s === 0 ? 0.95 : fr;               // ta jeep joue bien
      const k = R.bot(e, s, alea);
      e.fr = fr;
      R.jouer(e, s, k, alea);
      if (s === 0 && e.der && e.der.p >= 0) photo = e.der.p;
    }
    session = 'solo';
    niveau = sc.niveau;
    enPartie = false;                           // rien n'est écrit à la fermeture
    vue = e;
    // Partie figée : c'est à toi de jouer, mais rien ne bouge (pas de moteur, pas de robot).
    partie = {
      siege: 0, phase: 'jeu', mode: 'solo', manche: 0, chef: -1,
      monTour: () => true, estChef: () => false, jouer: () => false, pause: () => {}, quitter: () => {},
      sieges: () => [{ humain: true, moi: true }, { humain: false }, { humain: false }, { humain: false }]
    };
    // La tuile que ta jeep s'apprête à jouer est mise en avant.
    const fr = e.fr; e.fr = 0.95;
    const prochaine = R.bot(e, 0, graineHasard(sc.graine + 1));
    e.fr = fr;
    choix = prochaine < 3 ? prochaine : -1;
    // La photo que tu viens de prendre, encore affichée au-dessus de l'animal.
    const t = performance.now();
    if (photo !== null) {
      const a = e.a[photo], val = ESP[a.s].v, longue = 1e9;
      effets.push({ genre: 'texte', texte: tr('photo.prise', { animal: nomEsp(a.s), n: val }), r: a.r, c: a.c, t0: t - longue * 0.12, duree: longue, coul: val === 3 ? '#ffd84d' : '#fff', gros: val === 3 });
      if (val === 3) effets.push({ genre: 'etoiles', r: a.r, c: a.c, t0: t - longue * 0.35, duree: longue });
    }
    afficherEcran('jeu');
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-album').addEventListener('click', () => { audio(); sons.clic(); ouvrirAlbum(); });
  $('btn-garage').addEventListener('click', () => { audio(); sons.clic(); ouvrirGarage(); });
  ['niv-retour', 'album-retour', 'garage-retour'].forEach((id) => $(id).addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); }));
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && !modeApercu && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre' && !modeAffiche) dessinerTitre(); });

  document.title = tr('titre');
  const numeroApercu = Number(window.JEL_APERCU);
  if (window.JEL_AFFICHE) {
    // Affiche : ni écran titre, ni bouton, ni son, ni invitation en ligne.
    demarrerAffiche();
  } else if (numeroApercu === 1 || numeroApercu === 2 || numeroApercu === 3) {
    // Image du jeu : progression neuve en mémoire seulement (rien n'est lu ni écrit).
    construirePlaces();
    majBoutonsSon();
    ouvrirApercu(numeroApercu);
  } else {
    chargerProgression();
    construirePlaces();
    majBoutonsSon();
    try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); dessinerTitre(); } }); } catch (e) { boutonEffacer = null; }
    afficherEcran('titre');
    // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
    // dans le salon de sa partie en ligne (le moteur la demande au serveur).
    if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
  }
})();
</script>
