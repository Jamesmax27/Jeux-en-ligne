  // Couche du terrain gardée en mémoire (redessinée seulement si le terrain ou la taille change).
  const cache = { cv: document.createElement('canvas'), cle: '' };
  function coucheTerrain(e, g, w, h, dpr) {
    const cle = e.n + '|' + e.W + 'x' + e.H + '|' + e.c + '|' + w + 'x' + h + '|' + g.s.toFixed(2) + '|' + e.pay;
    if (cache.cle !== cle) {
      cache.cle = cle;
      cache.cv.width = Math.round(w * dpr); cache.cv.height = Math.round(h * dpr);
      const c = cache.cv.getContext('2d');
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.fillStyle = 'rgba(80,50,10,.2)'; c.fillRect(g.ox + 5, g.oy + 7, g.s * e.W, g.s * e.H);
      for (let i = 0; i < e.W * e.H; i++) tuileTerrain(c, e, i, g.ox + (i % e.W) * g.s, g.oy + Math.floor(i / e.W) * g.s, g.s);
      c.strokeStyle = 'rgba(90,55,20,.55)'; c.lineWidth = 3; c.strokeRect(g.ox, g.oy, g.s * e.W, g.s * e.H);
    }
    return cache.cv;
  }

  function pistes(c, e, g) {
    const s = g.s, larg = s * 0.42;
    c.fillStyle = '#efd9a6';
    for (let i = 0; i < e.p.length; i++) {
      if (e.p[i] < 0) continue;
      const cx = g.ox + (i % e.W + 0.5) * s, cy = g.oy + (Math.floor(i / e.W) + 0.5) * s;
      rr(c, cx - larg / 2, cy - larg / 2, larg, larg, larg * 0.3); c.fill();
      const r = Math.floor(i / e.W), col = i % e.W;
      if (col + 1 < e.W && e.p[i + 1] >= 0) c.fillRect(cx, cy - larg / 2, s, larg);
      if (r + 1 < e.H && e.p[i + e.W] >= 0) c.fillRect(cx - larg / 2, cy, larg, s);
    }
    // traces de pneus et petit caillou de la couleur de qui a posé la piste
    c.strokeStyle = 'rgba(150,110,60,.45)'; c.lineWidth = Math.max(1, s * 0.02);
    c.setLineDash([s * 0.06, s * 0.06]);
    for (let i = 0; i < e.p.length; i++) {
      if (e.p[i] < 0) continue;
      const cx = g.ox + (i % e.W + 0.5) * s, cy = g.oy + (Math.floor(i / e.W) + 0.5) * s;
      if (i % e.W + 1 < e.W && e.p[i + 1] >= 0) { c.beginPath(); c.moveTo(cx, cy - larg * 0.22); c.lineTo(cx + s, cy - larg * 0.22); c.moveTo(cx, cy + larg * 0.22); c.lineTo(cx + s, cy + larg * 0.22); c.stroke(); }
      if (Math.floor(i / e.W) + 1 < e.H && e.p[i + e.W] >= 0) { c.beginPath(); c.moveTo(cx - larg * 0.22, cy); c.lineTo(cx - larg * 0.22, cy + s); c.moveTo(cx + larg * 0.22, cy); c.lineTo(cx + larg * 0.22, cy + s); c.stroke(); }
    }
    c.setLineDash([]);
    for (let i = 0; i < e.p.length; i++) {
      const q = e.p[i];
      if (q < 0 || q > 3) continue;
      c.fillStyle = COUL[q];
      rond(c, g.ox + (i % e.W + 0.5) * s + larg * 0.32, g.oy + (Math.floor(i / e.W) + 0.5) * s + larg * 0.32, Math.max(2, s * 0.045)); c.fill();
    }
  }

  // Centre d'une case.
  function centre(e, g, i) { return [g.ox + (i % e.W + 0.5) * g.s, g.oy + (Math.floor(i / e.W) + 0.5) * g.s]; }

  // opt : t, anims ({ jeeps: {s: {chemin, t0}}, animaux: {k: {de, t0}}, photo: {k, t0} }),
  //       cibles (cases à toucher), chemin (aperçu), viseurs (animaux à photographier),
  //       couleur, curseur, peinture (de la place moi), moi, faces
  function dessinerSavane(c, e, g, opt, w, h, dpr) {
    const s = g.s, t = opt.t || 0, an = opt.anims || { jeeps: {}, animaux: {} };
    if (opt.cacheOk !== false) c.drawImage(coucheTerrain(e, g, w, h, dpr), 0, 0, w, h);
    else for (let i = 0; i < e.W * e.H; i++) tuileTerrain(c, e, i, g.ox + (i % e.W) * s, g.oy + Math.floor(i / e.W) * s, s);
    pistes(c, e, g);
    // jumelles posées
    e.it.forEach((i) => {
      const p = centre(e, g, i);
      c.fillStyle = 'rgba(255,250,200,' + (0.35 + 0.25 * Math.sin(t / 250)).toFixed(2) + ')'; rond(c, p[0], p[1], s * 0.3); c.fill();
      jumelles(c, p[0], p[1], s * 0.3);
    });
    // cases où l'on peut rouler
    if (opt.cibles && opt.cibles.length) {
      const a = 0.38 + 0.2 * Math.sin(t / 200);
      opt.cibles.forEach((i) => {
        const x = g.ox + (i % e.W) * s, y = g.oy + Math.floor(i / e.W) * s;
        c.fillStyle = '#fffbe6'; c.globalAlpha = a; rr(c, x + s * 0.06, y + s * 0.06, s * 0.88, s * 0.88, s * 0.16); c.fill(); c.globalAlpha = 1;
        c.strokeStyle = COUL[opt.couleur] || '#fff'; c.lineWidth = Math.max(3, s * 0.06);
        rr(c, x + s * 0.08, y + s * 0.08, s * 0.84, s * 0.84, s * 0.15); c.stroke();
        c.strokeStyle = '#fff'; c.lineWidth = Math.max(1.5, s * 0.025); c.setLineDash([s * 0.1, s * 0.07]);
        rr(c, x + s * 0.08, y + s * 0.08, s * 0.84, s * 0.84, s * 0.15); c.stroke(); c.setLineDash([]);
      });
    }
    // aperçu du trajet
    if (opt.chemin && opt.chemin.length > 1) {
      c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = Math.max(3, s * 0.08); c.setLineDash([s * 0.12, s * 0.08]);
      c.beginPath();
      opt.chemin.forEach((i, k) => { const p = centre(e, g, i); if (k) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); });
      c.stroke(); c.setLineDash([]);
    }
    // animaux
    const nuit = e.nuit;
    e.a.forEach((A, k) => {
      let p = centre(e, g, A.c);
      const m = an.animaux[k];
      let saut = 0;
      if (m) {
        const q = Math.max(0, Math.min(1, (t - m.t0) / 420));
        if (q < 1) { const p0 = centre(e, g, m.de); p = [p0[0] + (p[0] - p0[0]) * q, p0[1] + (p[1] - p0[1]) * q]; saut = Math.sin(q * Math.PI) * s * 0.15; }
      }
      if (nuit && !A.v) return;           // la nuit : seulement les yeux (plus bas)
      c.fillStyle = 'rgba(0,0,0,.18)'; ell(c, p[0], p[1] + s * 0.36, s * 0.3, s * 0.07); c.fill();
      const respire = 1 + 0.03 * Math.sin(t / 380 + k);
      tete(c, A.k, p[0], p[1] - saut, s * 0.36 * respire);
      if (A.pr >= 0) { // déjà dans l'album de quelqu'un : petit appareil de sa couleur
        const bx = p[0] + s * 0.3, by = p[1] - s * 0.3;
        c.fillStyle = COUL[A.pr]; c.strokeStyle = '#fff'; c.lineWidth = Math.max(1.5, s * 0.03);
        rr(c, bx - s * 0.13, by - s * 0.09, s * 0.26, s * 0.18, s * 0.04); c.fill(); c.stroke();
        c.fillStyle = '#fff'; rond(c, bx, by, s * 0.05); c.fill();
      }
    });
    // jeeps
    e.j.forEach((J, q) => {
      if (J.c < 0) return;
      let p = centre(e, g, J.c);
      const m = an.jeeps[q];
      let roule = 0;
      if (m && m.chemin.length > 1) {
        const pas = 170, tot = (m.chemin.length - 1) * pas, ec = Math.max(0, Math.min(tot, t - m.t0));
        if (ec < tot) {
          const k = Math.floor(ec / pas), f = (ec - k * pas) / pas;
          const a = centre(e, g, m.chemin[k]), b = centre(e, g, m.chemin[k + 1]);
          p = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
          roule = t;
        }
      }
      const face = (opt.faces && opt.faces[q]) || 1;
      const bonds = roule ? Math.abs(Math.sin(t / 60)) * s * 0.04 : 0;
      jeep(c, p[0], p[1] + s * 0.05 - bonds, s * 0.86, q, face, q === opt.moi ? opt.peinture : 0, roule);
      if (J.bl) { c.fillStyle = 'rgba(122,82,48,.85)'; ell(c, p[0], p[1] + s * 0.32, s * 0.4, s * 0.1); c.fill(); }
      if (J.jum > 0) jumelles(c, p[0] + s * 0.32, p[1] - s * 0.32, s * 0.16);
    });
    // nuit : obscurité, sauf autour des phares des jeeps ; yeux qui brillent
    if (nuit) {
      c.save();
      c.fillStyle = 'rgba(12,18,52,.68)';
      c.beginPath(); c.rect(g.ox - 2, g.oy - 2, s * e.W + 4, s * e.H + 4);
      e.j.forEach((J, q) => {
        if (J.c < 0) return;
        const p = centre(e, g, J.c), rv = (O.portee(e, q) + 0.5) * s;
        c.moveTo(p[0] + rv, p[1]); c.arc(p[0], p[1], rv, 0, Math.PI * 2, true);
      });
      c.fill('evenodd');
      c.restore();
      e.a.forEach((A, k) => {
        if (A.v) return;
        const p = centre(e, g, A.c), cl = Math.sin(t / 700 + k * 1.7) > 0.93 ? 0.2 : 1;
        c.fillStyle = '#ffe866'; c.shadowColor = '#fff27a'; c.shadowBlur = s * 0.2;
        ell(c, p[0] - s * 0.1, p[1], s * 0.06, s * 0.06 * cl); c.fill(); ell(c, p[0] + s * 0.1, p[1], s * 0.06, s * 0.06 * cl); c.fill();
        c.shadowBlur = 0;
        c.fillStyle = '#1b1b1b'; ell(c, p[0] - s * 0.1, p[1], s * 0.02, s * 0.04 * cl); c.fill(); ell(c, p[0] + s * 0.1, p[1], s * 0.02, s * 0.04 * cl); c.fill();
      });
    }
    // viseurs sur les animaux à photographier
    if (opt.viseurs && opt.viseurs.length) {
      const z = 1 + 0.06 * Math.sin(t / 160);
      opt.viseurs.forEach((k) => {
        const p = centre(e, g, e.a[k].c), d = s * 0.44 * z, l = s * 0.16;
        c.strokeStyle = '#fff'; c.lineWidth = Math.max(3, s * 0.06);
        [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach((q) => {
          c.beginPath(); c.moveTo(p[0] + q[0] * d, p[1] + q[1] * (d - l)); c.lineTo(p[0] + q[0] * d, p[1] + q[1] * d); c.lineTo(p[0] + q[0] * (d - l), p[1] + q[1] * d); c.stroke();
        });
        c.fillStyle = '#e0463c'; rond(c, p[0] + d * 0.7, p[1] - d * 0.7, s * 0.05); c.fill();
      });
    }
    // curseur du clavier
    if (opt.curseur >= 0) {
      const x = g.ox + (opt.curseur % e.W) * s, y = g.oy + Math.floor(opt.curseur / e.W) * s;
      c.strokeStyle = 'rgba(255,255,255,' + (0.6 + 0.4 * Math.sin(t / 150)).toFixed(2) + ')'; c.lineWidth = Math.max(4, s * 0.08);
      rr(c, x + 2, y + 2, s - 4, s - 4, s * 0.16); c.stroke();
      c.strokeStyle = COUL[opt.couleur] || '#333'; c.lineWidth = 2; rr(c, x + 5, y + 5, s - 10, s - 10, s * 0.14); c.stroke();
    }
    // flash de la dernière photo
    if (an.photo) {
      const q = (t - an.photo.t0) / 400;
      if (q < 1) {
        const p = centre(e, g, e.a[an.photo.k].c);
        c.fillStyle = 'rgba(255,255,255,' + (0.85 * (1 - q)).toFixed(2) + ')';
        rond(c, p[0], p[1], s * (0.4 + q * 0.5)); c.fill();
      }
    }
  }

  function geometrie(e, w, h, marge) {
    const s = Math.min((w - 2 * marge) / e.W, (h - 2 * marge) / e.H, 104);
    return { s: s, ox: Math.round((w - s * e.W) / 2), oy: Math.round((h - s * e.H) / 2) };
  }

  // Main qui montre le geste (pointe du doigt en x, y).
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#3b2510'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Partie : état de l'écran
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;         // 'solo' (parcours de 20 niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let ecran = 'titre';
  let enPartie = false;       // partie solo commencée (sauvegarde à la fermeture)
  let enPause = false;
  let vue = null;             // état affiché
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let survol = -1, curseur = -1, clavier = false;
  let dernierAttends = 0;
  let anims = { jeeps: {}, animaux: {}, photo: null };
  let faces = [1, 1, -1, -1];
  let nouvellesEspeces = [];  // espèces ajoutées à l'album pendant la manche
  const particules = [];

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'album', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'jeu' ? 'none' : 'block';
    if (nom !== 'jeu') dessinerTitre();
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif') || ecran === 'jeu');
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  function dessinerIconeJeep(cv, s, p) {
    const c = cv.getContext('2d');
    c.clearRect(0, 0, cv.width, cv.height);
    jeep(c, cv.width / 2, cv.height * 0.56, cv.width * 0.74, s, s === 2 || s === 3 ? -1 : 1, p, 0);
  }

  // Cartes des 4 places, en haut de l'écran.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'icone'; cv.width = 132; cv.height = 80;
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 132; cv.height = 108;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  // Le rôle d'une place : toi, un vrai joueur ou un robot.
  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const monSiege = () => (partie ? partie.siege : -1);
  const peintureDe = (s) => (s === monSiege() ? prog.peinture : 0);

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !e.fini ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      // Avant que la partie solo commence (tutoriel), la jeep bleue est déjà la tienne.
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: session === 'solo' && s === 0 };
      const pts = e ? e.sc[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      const cv = d.querySelector('canvas.icone'), cle = s + '|' + peintureDe(s);
      if (cv.dataset.cle !== cle) { cv.dataset.cle = cle; dessinerIconeJeep(cv, s, peintureDe(s)); }
      d.setAttribute('aria-label', tr('place.aria', { jeep: tr('jeep.' + s), qui: nomPlace(info, role), points: pts }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || e.fini) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return e.ph === 1 ? tr('tour.photo') : tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    const e = vue;
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, paysage: tr('paysage.' + NIVEAUX[niveau - 1].pay) });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if (e && !e.fini && partie && partie.phase === 'jeu') info += ' · ' + tr('jeu.tours', { n: e.reste });
    $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    let aide = '';
    if (e && partie && partie.monTour() && !attenteTuto) {
      if (e.ph === 1) aide = tr('jeu.aidePhoto');
      else aide = cibles().length === 1 && cibles()[0] === e.j[partie.siege].c ? tr('tour.bloque') : tr('jeu.aide');
    } else if (e && e.nuit) aide = tr('jeu.nuit');
    if ($('aide').textContent !== aide) $('aide').textContent = aide;
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !e.fini) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // Cases ou animaux qu'on peut toucher maintenant.
  function cibles() {
    const e = vue;
    if (!e || !partie || !partie.monTour() || enPause || attenteTuto || e.fini) return [];
    if (e.ph === 1) return e.vis.map((k) => e.a[k].c);
    return Object.keys(O.chemins(e, partie.siege)).map(Number);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, Math.max(8, Math.min(w, h) * 0.025));
    const moi = monSiege(), mon = partie && partie.monTour() && !enPause && !attenteTuto && !vue.fini;
    const lesCibles = mon && vue.ph === 0 ? cibles() : [];
    let chemin = null;
    const vise = clavier ? curseur : survol;
    if (lesCibles.length && vise >= 0) {
      const ch = O.chemins(vue, moi)[vise];
      if (ch) chemin = [vue.j[moi].c].concat(ch);
    }
    dessinerSavane(c, vue, geo, {
      t: t, anims: anims, cibles: lesCibles, chemin: chemin, viseurs: mon && vue.ph === 1 ? vue.vis : null,
      couleur: moi, curseur: clavier && mon ? curseur : -1, peinture: prog.peinture, moi: moi, faces: faces
    }, w, h, dpr);
    // particules (poussière, étoiles)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      if (p.etoile) etincelle(c, p.x, p.y, p.k); else { rond(c, p.x, p.y, p.k * (1.4 - p.vie * 0.4)); c.fill(); }
      c.globalAlpha = 1;
    }
  }

  function poussiere(i) {
    if (!vue || !geo) return;
    const p = centre(vue, geo, i);
    for (let k = 0; k < 8; k++) {
      particules.push({ x: p[0] + (Math.random() - 0.5) * geo.s * 0.6, y: p[1] + geo.s * 0.3, vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 30, vie: 0.5 + Math.random() * 0.4, k: geo.s * 0.06, coul: 'rgba(200,160,100,.7)' });
    }
  }
  function etoiles(i, s) {
    if (!vue || !geo) return;
    const p = centre(vue, geo, i);
    for (let k = 0; k < 16; k++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 180;
      particules.push({ x: p[0], y: p[1], vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160, g: 420, vie: 0.7 + Math.random() * 0.4, k: geo.s * (0.07 + Math.random() * 0.06), coul: k % 2 ? COUL[s] : '#ffe066', etoile: true });
    }
  }

  // Polaroïd qui s'envole de l'animal vers la carte du photographe.
  function envolerPhoto(k, i, s) {
    if (!vue || !geo) return;
    const rz = $('plateau').getBoundingClientRect();
    const p = centre(vue, geo, i), carte = $('place-' + s).getBoundingClientRect();
    const el = document.createElement('canvas');
    el.className = 'polaroid'; el.width = 104; el.height = 120;
    photoPolaroid(el.getContext('2d'), k, 104, 120);
    const x0 = rz.left + p[0] - 26, y0 = rz.top + p[1] - 30;
    el.style.transform = 'translate(' + x0 + 'px,' + y0 + 'px) scale(.4) rotate(-8deg)';
    document.body.appendChild(el);
    void el.offsetWidth;
    el.style.transform = 'translate(' + x0 + 'px,' + (y0 - 30) + 'px) scale(1.1) rotate(4deg)';
    setTimeout(() => {
      el.style.transform = 'translate(' + (carte.left + carte.width / 2 - 26) + 'px,' + (carte.top + 4) + 'px) scale(.35) rotate(-10deg)';
      el.style.opacity = '0.2';
    }, 380);
    setTimeout(() => el.remove(), 1300);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function regarderFaces(e) {
    faces = e ? e.j.map((J) => (J.c >= 0 && J.c % e.W >= e.W / 2 ? -1 : 1)) : [1, 1, -1, -1];
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? JSON.parse(JSON.stringify(partie.etat)) : null;
    anims = { jeeps: {}, animaux: {}, photo: null };
    regarderFaces(vue);
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom + '|' + peintureDe(s);
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const cv = d.querySelector('canvas'), c = cv.getContext('2d');
        c.clearRect(0, 0, cv.width, cv.height);
        jeep(c, 66, 66, 96, s, s >= 2 ? -1 : 1, peintureDe(s), 0);
        if (info.chef) couronne(c, 100, 26, 22);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place', { jeep: tr('jeep.' + s), qui: nom }) + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { qui: nomChef || tr('jeep.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = JSON.parse(JSON.stringify(partie.etat));
    anims = { jeeps: {}, animaux: {}, photo: null };
    regarderFaces(vue);
    particules.length = 0;
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    nouvellesEspeces = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  function surAction(ev) {
    const t = performance.now(), av = ev.avant, ap = ev.apres, s = ev.siege, moi = ev.moi;
    vue = JSON.parse(JSON.stringify(ap));
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.action && Number.isInteger(ev.action.c)) {
      // déplacement : trajet de la jeep, piste, poussière
      const ch = (O.chemins(av, s)[ev.action.c] || []);
      const chemin = [av.j[s].c].concat(ch);
      anims.jeeps[s] = { chemin: chemin, t0: t };
      const dx = (ap.j[s].c % ap.W) - (av.j[s].c % av.W);
      if (dx) faces[s] = dx > 0 ? 1 : -1;
      sons.moteur(ch.length);
      if (ch.some((i) => av.p[i] < 0)) setTimeout(() => sons.piste(), 120);
      setTimeout(() => poussiere(ap.j[s].c), 80);
      if (av.it.length > ap.it.length) { setTimeout(() => sons.jumelles(), 300); if (moi) toast(tr('jumelles.prises')); }
      if (ap.j[s].bl && !av.j[s].bl) { setTimeout(() => sons.boue(), 300); if (moi) toast(tr('boue.prise')); }
    } else if (ev.action && Number.isInteger(ev.action.p)) {
      // photo : flash, polaroïd vers la carte, points
      const k = ev.action.p, A = ap.a[k];
      anims.photo = { k: k, t0: t };
      sons.declic();
      if (ESP[A.k].pts >= 3) sons.rare(); else sons.photo();
      etoiles(A.c, s);
      envolerPhoto(A.k, A.c, s);
      if (moi) {
        flash();
        if (!prog.album[A.k]) nouvellesEspeces.push(A.k);
        prog.album[A.k] = Math.min(9999, prog.album[A.k] + 1);
        if (session === 'ligne') sauverReglages();
        if (ESP[A.k].pts >= 3) toast(tr('photo.rare', { animal: tr('espece.' + A.k) }));
      }
      const carte = $('place-' + s);
      setTimeout(() => { carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond'); }, 700);
    }
    // animaux qui ont bougé (fuite des timides, troupeaux)
    let fuite = false, troupeau = false;
    ap.a.forEach((A, k) => {
      const de = av.a[k] ? av.a[k].c : A.c;
      if (de !== A.c) {
        anims.animaux[k] = { de: de, t0: t + (ev.action && Number.isInteger(ev.action.c) ? 260 : 0) };
        if (A.d >= 0) troupeau = true; else fuite = true;
      }
    });
    if (fuite) { setTimeout(() => sons.fuite(), 300); if (moi) toast(tr('fuite')); }
    if (troupeau) setTimeout(() => sons.troupeau(), 250);
    if (ev.auto) toast(tr(moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && !ap.fini && R.aQui(ap) === partie.siege && !moi) sons.tour();
    if (clavier) { const cs = cibles(); if (cs.indexOf(curseur) < 0) curseur = cs.length ? cs[0] : -1; }
  }

  function flash() {
    const f = $('flash');
    f.classList.add('actif');
    setTimeout(() => f.classList.remove('actif'), 60);
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 900);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const res = R.fin(e);
    const gagne = moi >= 0 && res && res.classement[0] === moi;
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // 1 étoile pour la victoire, +1 par photo rare (3 au plus).
  function etoilesPour(gagne, rares) { return gagne ? Math.min(3, 1 + rares) : 0; }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      const cle = e.sc[s] + '|' + e.rr[s];
      if (cle !== prec) { rang = k + 1; prec = cle; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 92; cv.height = 56; dessinerIconeJeep(cv, s, s === moi ? prog.peinture : 0);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === moi ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.pointsCourt', { n: e.sc[s] }) + (e.rr[s] ? ' · ★' + nb(e.rr[s]) : '');
      l.append(r, cv, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherPhotos(e, moi) {
    const boite = $('fin-photos');
    boite.textContent = '';
    const liste = moi >= 0 ? e.al[moi] : [];
    $('fin-photos-titre').textContent = liste.length ? tr('fin.photos') : tr('fin.aucunePhoto');
    liste.forEach((k, i) => {
      const cv = document.createElement('canvas'); cv.width = 92; cv.height = 108;
      photoPolaroid(cv.getContext('2d'), k, 92, 108);
      cv.style.animationDelay = (0.15 + i * 0.08) + 's';
      cv.setAttribute('role', 'img'); cv.setAttribute('aria-label', tr('espece.' + k));
      boite.appendChild(cv);
    });
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege, sieges = siegesActuels();
    const pts = moi >= 0 ? e.sc[moi] : 0, rares = moi >= 0 ? e.rr[moi] : 0;
    const res = R.fin(e);
    const meilleur = Math.max.apply(null, e.sc);
    const gagne = moi >= 0 && pts === meilleur;
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, moi, sieges, $('fin-classement'));
    afficherPhotos(e, moi);
    $('fin-points').textContent = moi >= 0 ? tr('fin.bilan', { points: tr('fin.points', { n: pts }), rares: tr('fin.rares', { n: rares }) }) : '';
    const noms = nouvellesEspeces.map((k) => tr('espece.' + k));
    $('fin-album').textContent = noms.length ? tr('fin.nouvelles', { n: noms.length, liste: noms.join(', ') }) : '';
    if (session === 'solo') {
      const i = niveau - 1;
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoilesGagnees = etoilesPour(gagne, rares);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      const totalAvant = totalEtoiles();
      let debloque = false;
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoilesGagnees);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Parcours solo terminé (tous les niveaux gagnés, maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else {
        sauver(niveau, pts);
      }
      const nouvellePeinture = PEINTURES.findIndex((seuil, k) => k > 0 && seuil > totalAvant && seuil <= totalEtoiles());
      if (nouvellePeinture > 0) $('fin-album').textContent += ($('fin-album').textContent ? ' ' : '') + tr('fin.peinture', { nom: tr('peinture.' + nouvellePeinture) });
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoilesGagnees) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoilesGagnees }));
      zone.style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les manches s'enchaînent seules.
      const premier = res && res.classement[0] === moi;
      if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: premier, level: e.n + 1 });
      sauverReglages();
      $('fin-titre').textContent = premier ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    nouvellesEspeces = [];
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la manche suivante (robots locaux d'une partie en ligne).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, niveaux, album
  // ---------------------------------------------------------------------

  let attenteTuto = false;

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    nouvellesEspeces = [];
  }

  function apercu(n) {
    const e = O.preparer(NIVEAUX[n - 1], PLACES);
    e.n = n - 1;
    return e;
  }

  // Parcours solo : niveau n contre 3 robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    nouvellesEspeces = [];
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    vue = apercu(niveau);
    anims = { jeeps: {}, animaux: {}, photo: null };
    regarderFaces(vue);
    particules.length = 0;
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majInterface(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  // Partie avec d'autres joueurs : manches qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  // Petit pictogramme du paysage (case des niveaux).
  function pictoPaysage(cv, pay, nuit) {
    const c = cv.getContext('2d'), w = cv.width, h = cv.height;
    c.clearRect(0, 0, w, h);
    c.fillStyle = nuit ? '#27306a' : '#ffd98a'; rr(c, 0, 0, w, h, 6); c.fill();
    c.fillStyle = PAYS[pay].herbe[0]; c.fillRect(0, h * 0.6, w, h * 0.4);
    if (pay === 0) acacia(c, w * 0.5, h * 0.75, h * 0.7, '#6b4a24');
    else if (pay === 1) { c.fillStyle = PAYS[1].eau; ell(c, w * 0.5, h * 0.78, w * 0.32, h * 0.14); c.fill(); c.strokeStyle = '#3f7a2a'; c.lineWidth = 2; [0.3, 0.38, 0.7].forEach((x) => { c.beginPath(); c.moveTo(w * x, h * 0.8); c.lineTo(w * x, h * 0.3); c.stroke(); }); }
    else if (pay === 2) { c.fillStyle = '#c99a5a'; c.beginPath(); c.moveTo(0, h * 0.7); c.quadraticCurveTo(w * 0.3, h * 0.1, w * 0.6, h * 0.7); c.fill(); c.fillStyle = '#b8884a'; c.beginPath(); c.moveTo(w * 0.4, h * 0.7); c.quadraticCurveTo(w * 0.75, h * 0.25, w, h * 0.7); c.fill(); }
    else { c.fillStyle = '#2f7a2a'; [0.25, 0.55, 0.8].forEach((x, k) => { rond(c, w * x, h * (0.45 + k * 0.05), h * 0.25); c.fill(); }); }
    if (nuit) { c.fillStyle = '#fff4b0'; rond(c, w * 0.82, h * 0.22, h * 0.13); c.fill(); }
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((t, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const pic = document.createElement('canvas'); pic.width = 68; pic.height = 40; pictoPaysage(pic, t.pay, !!t.nuit);
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(pic, num, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  function ouvrirAlbum() {
    const grille = $('album-grille');
    grille.textContent = '';
    let vues = 0;
    ESP.forEach((esp, k) => {
      const n = prog.album[k];
      if (n) vues++;
      const f = document.createElement('div');
      f.className = 'fiche' + (n ? '' : ' inconnue') + (esp.pts >= 3 ? ' r3' : '');
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
      if (n) tete(cv.getContext('2d'), k, 64, 64, 50); else silhouette(cv, k);
      const nom = document.createElement('b'); nom.textContent = n ? tr('espece.' + k) : tr('album.inconnu');
      const info = document.createElement('span'); info.textContent = n ? tr('album.photos', { n: n }) : tr('rarete.' + esp.pts);
      const rar = document.createElement('span'); rar.textContent = n ? tr('rarete.' + esp.pts) : '';
      f.append(cv, nom, info);
      if (n) f.appendChild(rar);
      grille.appendChild(f);
    });
    $('album-aide').textContent = tr('album.especes', { n: vues, total: ESP.length });
    const garage = $('garage');
    garage.textContent = '';
    const tot = totalEtoiles();
    PEINTURES.forEach((seuil, p) => {
      const ouvert = tot >= seuil;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'peinture' + (p === prog.peinture ? ' choisie' : '') + (ouvert ? '' : ' ferme');
      const cv = document.createElement('canvas'); cv.width = 224; cv.height = 144;
      jeep(cv.getContext('2d'), 112, 82, 168, 0, 1, p, 0);
      const nom = document.createElement('span'); nom.textContent = tr('peinture.' + p);
      const etat = document.createElement('span');
      etat.textContent = p === prog.peinture ? tr('album.choisie') : (ouvert ? '' : tr('album.besoin', { n: seuil }));
      b.append(cv, nom, etat);
      b.setAttribute('aria-label', tr('album.peintureAria', { nom: tr('peinture.' + p) }) + (ouvert ? '' : ' · ' + tr('album.besoin', { n: seuil })));
      b.setAttribute('aria-pressed', p === prog.peinture ? 'true' : 'false');
      if (ouvert) b.addEventListener('click', () => { audio(); sons.jumelles(); prog.peinture = p; sauverReglages(); ouvrirAlbum(); });
      else b.disabled = true;
      garage.appendChild(b);
    });
    if (ecran !== 'album') afficherEcran('album');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const base = () => {
      const e = O.preparer({ g: d.g, a: d.a, tours: 99, pay: d.pay || 0, nuit: d.nuit }, PLACES);
      e.n = -1 - Object.keys(TUTOS).indexOf(cle);
      return e;
    };
    let e = base(), debut = 0, fait = 0, an = { jeeps: {}, animaux: {}, photo: null };
    const PAS = 1500, j = ++tutoAnim;
    const g = geometrie(e, 560, 360, 40);
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 2) { e = base(); fait = 0; an = { jeeps: {}, animaux: {}, photo: null }; debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= 760) {
        const act = d.etapes[fait], avant = JSON.parse(JSON.stringify(e));
        e.tour = 0;
        if (act.c !== undefined) {
          e.ph = 0;
          const ch = O.chemins(e, 0)[act.c] || [];
          an.jeeps[0] = { chemin: [e.j[0].c].concat(ch), t0: t };
        } else an.photo = { k: act.p, t0: t };
        if (R.valide(e, 0, act)) e = R.jouer(e, 0, act);
        e.a.forEach((A, q) => { if (avant.a[q].c !== A.c) an.animaux[q] = { de: avant.a[q].c, t0: t + 300 }; });
        fait++;
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      dessinerSavane(c, e, g, {
        t: t, anims: an, cacheOk: false, couleur: 0, moi: 0, peinture: prog.peinture, faces: [1, 1, 1, 1],
        viseurs: e.ph === 1 ? e.vis : null, cibles: prochaine && prochaine.c !== undefined && e.ph === 0 ? Object.keys(O.chemins(e, 0)).map(Number) : null
      }, 560, 360, 1);
      // la main qui montre le geste suivant
      if (prochaine) {
        const cible = prochaine.c !== undefined ? prochaine.c : (e.a[prochaine.p] ? e.a[prochaine.p].c : -1);
        if (cible >= 0) {
          const p = centre(e, g, cible);
          const q = Math.min(1, dans / 650);
          const x = 500 + (p[0] - 500) * q, y = 340 + (p[1] - 340) * q;
          main(c, x, y + g.s * 0.1, 1.6, q >= 1 ? Math.min(1, (dans - 650) / 110) : 0);
        }
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const col = Math.floor((px - geo.ox) / geo.s), r = Math.floor((py - geo.oy) / geo.s);
    if (col < 0 || col >= vue.W || r < 0 || r >= vue.H) return -1;
    return r * vue.W + col;
  }

  // Case touchée → action (rouler ou photographier).
  function agir(i) {
    if (!partie || enPause || attenteTuto || i < 0 || !vue) return;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return;
    }
    if (vue.ph === 1) {
      const k = vue.vis.find((q) => vue.a[q].c === i);
      if (k === undefined) { sons.non(); return; }
      partie.jouer({ p: k });
    } else {
      if (cibles().indexOf(i) < 0) { sons.non(); return; }
      partie.jouer({ c: i });
    }
    survol = -1;
  }

  // Touche fléchée : cible la plus proche dans cette direction.
  function deplacerCurseur(dx, dy) {
    const cs = cibles();
    if (!cs.length || !vue) return;
    if (cs.indexOf(curseur) < 0) { curseur = cs[0]; return; }
    const cx = curseur % vue.W, cy = Math.floor(curseur / vue.W);
    let best = -1, bd = Infinity;
    cs.forEach((i) => {
      if (i === curseur) return;
      const vx = i % vue.W - cx, vy = Math.floor(i / vue.W) - cy, avance = vx * dx + vy * dy;
      if (avance <= 0) return;
      const sc = avance + Math.abs(vx * dy - vy * dx) * 2.2;
      if (sc < bd) { bd = sc; best = i; }
    });
    if (best >= 0) { curseur = best; sons.clic(); }
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  let appui = false;
  plateau.addEventListener('pointerdown', (ev) => { audio(); clavier = false; appui = true; const p = point(ev); survol = caseSous(p[0], p[1]); });
  plateau.addEventListener('pointermove', (ev) => { if (appui || ev.pointerType === 'mouse') { const p = point(ev); survol = caseSous(p[0], p[1]); } });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    appui = false;
    const i = caseSous(p[0], p[1]);
    if (ev.pointerType !== 'mouse') survol = -1;
    agir(i);
  });
  plateau.addEventListener('pointercancel', () => { appui = false; survol = -1; });
  plateau.addEventListener('pointerleave', (ev) => { if (ev.pointerType === 'mouse') survol = -1; });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (!clavier) { clavier = true; const cs = cibles(); if (cs.indexOf(curseur) < 0) { curseur = cs.length ? cs[0] : -1; return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      const cs = cibles();
      if (!clavier || cs.indexOf(curseur) < 0) { clavier = true; curseur = cs.length ? cs[0] : -1; return; }
      agir(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-album').addEventListener('click', () => { audio(); sons.clic(); ouvrirAlbum(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('album-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); dessinerTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
