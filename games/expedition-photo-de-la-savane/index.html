  function dessinerTitre() {
    const cv = $('fond'), w = window.innerWidth, h = window.innerHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const ciel = c.createLinearGradient(0, 0, 0, h * 0.6);
    ciel.addColorStop(0, '#ff9a4c'); ciel.addColorStop(0.5, '#ffc46e'); ciel.addColorStop(1, '#ffe2a2');
    c.fillStyle = ciel; c.fillRect(0, 0, w, h);
    // La scène se pose entre le titre et le panneau des boutons.
    let haut = h * 0.25, bas = h * 0.7;
    try {
      const rt = document.querySelector('#ecran-titre h1').getBoundingClientRect(), rp = document.querySelector('#ecran-titre .panneau').getBoundingClientRect();
      if (rt.height && rp.height) { haut = rt.bottom; bas = rp.top; }
    } catch (e) { /* mesures impossibles : valeurs par défaut */ }
    const k = Math.max(140, Math.min(w * 0.9, (bas - haut) * 1.15, 520));
    const horizon = Math.min(h * 0.7, bas - k * 0.36);
    // soleil
    const sx = w * 0.62, sy = horizon - h * 0.05, sr = Math.min(w, h) * 0.2;
    const halo = c.createRadialGradient(sx, sy, sr * 0.4, sx, sy, sr * 2);
    halo.addColorStop(0, 'rgba(255,240,180,.8)'); halo.addColorStop(1, 'rgba(255,240,180,0)');
    c.fillStyle = halo; c.fillRect(0, 0, w, h);
    c.fillStyle = '#fff1b8'; rond(c, sx, sy, sr); c.fill();
    // oiseaux
    c.strokeStyle = 'rgba(90,40,10,.6)'; c.lineWidth = 2;
    [[0.2, 0.3], [0.27, 0.27], [0.8, 0.22]].forEach((p) => { const bx = p[0] * w, by = p[1] * h; c.beginPath(); c.moveTo(bx - 8, by); c.quadraticCurveTo(bx - 4, by - 5, bx, by); c.quadraticCurveTo(bx + 4, by - 5, bx + 8, by); c.stroke(); });
    // collines lointaines
    c.fillStyle = '#e59a5a';
    c.beginPath(); c.moveTo(0, horizon); for (let x = 0; x <= w; x += 20) c.lineTo(x, horizon - 18 - Math.sin(x / 70) * 12); c.lineTo(w, horizon); c.closePath(); c.fill();
    // sol de la savane
    const sol = c.createLinearGradient(0, horizon, 0, h);
    sol.addColorStop(0, '#e2b45a'); sol.addColorStop(1, '#c98f3a');
    c.fillStyle = sol; c.fillRect(0, horizon, w, h - horizon);
    const g = graineHasard(11);
    c.strokeStyle = 'rgba(150,100,30,.5)'; c.lineWidth = 2;
    for (let i = 0; i < 80; i++) { const x = g() * w, y = horizon + 6 + g() * (h - horizon); c.beginPath(); c.moveTo(x, y); c.lineTo(x - 3, y - 8); c.moveTo(x, y); c.lineTo(x + 3, y - 9); c.stroke(); }
    // piste qui serpente
    c.fillStyle = '#f0d49a';
    c.beginPath(); c.moveTo(w * 0.42, horizon); c.quadraticCurveTo(w * 0.2, horizon + h * 0.12, w * 0.55, h); c.lineTo(w * 0.95, h); c.quadraticCurveTo(w * 0.3, horizon + h * 0.12, w * 0.46, horizon); c.closePath(); c.fill();
    acacia(c, w * 0.14, horizon + 4, k * 0.42);
    acacia(c, w * 0.9, horizon + 2, k * 0.3);
    girafeProfil(c, w * 0.78, horizon + k * 0.06, k * 0.4);
    elephantProfil(c, w * 0.2, horizon + k * 0.14, k * 0.42);
    zebreProfil(c, w * 0.52, horizon + k * 0.06, k * 0.3);
    jeepProfil(c, w * 0.5, horizon + k * 0.33, k * 0.62, COUL[0], prog.peinture, true);
    // petit flash de l'appareil photo
    c.fillStyle = 'rgba(255,255,255,.9)'; etincelle(c, w * 0.5 + k * 0.62 * 0.17, horizon + k * 0.33 - k * 0.62 * 0.53, k * 0.05);
  }

  // ---------------------------------------------------------------------
  //  Plateau : terrain, pistes, animaux, nuit, jeeps, cases lumineuses
  // ---------------------------------------------------------------------

  const DUREE = 360;   // ms d'un déplacement animé

  function geometrie(e, w, h, marge) {
    const s = Math.max(10, Math.floor(Math.min((w - 2 * marge) / e.W, (h - 2 * marge) / e.H)));
    return { s: s, ox: Math.round((w - s * e.W) / 2), oy: Math.round((h - s * e.H) / 2) };
  }
  const cx = (e, g, c) => g.ox + (c % e.W + 0.5) * g.s;
  const cy = (e, g, c) => g.oy + (Math.floor(c / e.W) + 0.5) * g.s;
  const lisse = (k) => (k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k));

  function caseTerrain(c, e, g, i, pay, t) {
    const x = g.ox + (i % e.W) * g.s, y = g.oy + Math.floor(i / e.W) * g.s, s = g.s, ch = e.t.charAt(i);
    const col = (i % e.W + Math.floor(i / e.W)) % 2;
    const P = PAYSAGES[pay];
    const eau = ch === '~' || ch === '=';
    c.fillStyle = eau ? '#5aa7d6' : P.herbe[col];
    c.fillRect(x, y, s + 0.5, s + 0.5);
    if (eau) {
      c.strokeStyle = 'rgba(220,245,255,.55)'; c.lineWidth = Math.max(1, s * 0.04);
      for (let k = 0; k < 2; k++) {
        const yy = y + s * (0.32 + k * 0.38), dx = Math.sin(t / 700 + i + k) * s * 0.08;
        c.beginPath(); c.moveTo(x + s * 0.18 + dx, yy); c.quadraticCurveTo(x + s * 0.35 + dx, yy - s * 0.07, x + s * 0.52 + dx, yy); c.stroke();
      }
      if (ch === '=') {
        c.fillStyle = '#c9c1b0'; c.strokeStyle = '#8a8270'; c.lineWidth = Math.max(1, s * 0.03);
        [[0.3, 0.3], [0.62, 0.52], [0.34, 0.76]].forEach((p) => { ell(c, x + p[0] * s, y + p[1] * s, s * 0.17, s * 0.11); c.fill(); c.stroke(); });
      }
      return;
    }
    c.strokeStyle = P.touffe; c.lineWidth = Math.max(1, s * 0.035);
    for (let k = 0; k < 2; k++) {
      const tx = x + s * (0.2 + hache(i * 3 + k) * 0.6), ty = y + s * (0.25 + hache(i * 5 + k) * 0.6);
      c.beginPath(); c.moveTo(tx, ty); c.lineTo(tx - s * 0.05, ty - s * 0.1); c.moveTo(tx, ty); c.lineTo(tx + s * 0.05, ty - s * 0.11); c.stroke();
    }
    if (ch === '#') {
      c.fillStyle = '#8f8a84'; c.strokeStyle = '#5e5953'; c.lineWidth = Math.max(1, s * 0.04);
      ell(c, x + s * 0.5, y + s * 0.58, s * 0.36, s * 0.28); c.fill(); c.stroke();
      c.fillStyle = '#a9a49d'; ell(c, x + s * 0.32, y + s * 0.5, s * 0.18, s * 0.17); c.fill(); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.35)'; ell(c, x + s * 0.42, y + s * 0.42, s * 0.12, s * 0.06, -0.4); c.fill();
    } else if (ch === 'A') {
      c.fillStyle = 'rgba(0,0,0,.18)'; ell(c, x + s * 0.55, y + s * 0.78, s * 0.36, s * 0.12); c.fill();
      if (P.arbre === 'rond') {
        c.fillStyle = '#6b4424'; c.fillRect(x + s * 0.45, y + s * 0.5, s * 0.1, s * 0.3);
        c.fillStyle = '#2f6b33'; rond(c, x + s * 0.5, y + s * 0.42, s * 0.36); c.fill();
        c.fillStyle = '#3f8a3f'; rond(c, x + s * 0.38, y + s * 0.34, s * 0.2); c.fill(); rond(c, x + s * 0.62, y + s * 0.4, s * 0.18); c.fill();
      } else acacia(c, x + s * 0.5, y + s * 0.82, s * 0.62);
    } else if (ch === '^') {
      c.fillStyle = 'rgba(120,80,30,.35)'; ell(c, x + s * 0.5, y + s * 0.62, s * 0.48, s * 0.34); c.fill();
      c.fillStyle = pay === 2 ? '#c99a52' : '#b8a060'; ell(c, x + s * 0.5, y + s * 0.56, s * 0.44, s * 0.32); c.fill();
      c.fillStyle = 'rgba(255,255,255,.3)'; ell(c, x + s * 0.4, y + s * 0.44, s * 0.2, s * 0.1, -0.3); c.fill();
    } else if (ch === '*') {
      c.fillStyle = 'rgba(0,0,0,.15)'; ell(c, x + s * 0.5, y + s * 0.8, s * 0.42, s * 0.12); c.fill();
    } else if (ch === 'j') {
      const p = 0.5 + 0.5 * Math.sin(t / 260);
      c.fillStyle = 'rgba(255,255,200,' + (0.35 + p * 0.35) + ')'; rond(c, x + s * 0.5, y + s * 0.5, s * (0.34 + p * 0.06)); c.fill();
      jumellesDessin(c, x + s * 0.5, y + s * 0.52, s * 0.5);
    }
  }

  function jumellesDessin(c, x, y, k) {
    c.fillStyle = '#2b2b2b'; c.strokeStyle = '#000'; c.lineWidth = Math.max(1, k * 0.05);
    rr(c, x - k * 0.45, y - k * 0.3, k * 0.36, k * 0.62, k * 0.12); c.fill();
    rr(c, x + k * 0.09, y - k * 0.3, k * 0.36, k * 0.62, k * 0.12); c.fill();
    c.fillRect(x - k * 0.12, y - k * 0.1, k * 0.24, k * 0.16);
    c.fillStyle = '#7fc8ff'; rond(c, x - k * 0.27, y + k * 0.22, k * 0.12); c.fill(); rond(c, x + k * 0.27, y + k * 0.22, k * 0.12); c.fill();
  }

  // Feuillage d'un buisson, dessiné par-dessus l'animal qui s'y cache.
  function feuillage(c, e, g, i) {
    const x = g.ox + (i % e.W) * g.s, y = g.oy + Math.floor(i / e.W) * g.s, s = g.s;
    c.fillStyle = '#3d7a34';
    [[0.24, 0.66, 0.24], [0.5, 0.6, 0.28], [0.76, 0.66, 0.24], [0.38, 0.78, 0.22], [0.64, 0.8, 0.22]].forEach((p) => { rond(c, x + p[0] * s, y + p[1] * s, p[2] * s); c.fill(); });
    c.fillStyle = '#56a046';
    [[0.32, 0.56, 0.12], [0.6, 0.52, 0.12], [0.5, 0.72, 0.1]].forEach((p) => { rond(c, x + p[0] * s, y + p[1] * s, p[2] * s); c.fill(); });
  }

  function dessinerPistes(c, e, g, an, t) {
    const s = g.s;
    for (let p = 0; p < e.tr.length; p++) {
      const l = e.tr[p];
      for (let k = 0; k < l.length; k++) {
        const i = l[k], x = g.ox + (i % e.W) * s, y = g.oy + Math.floor(i / e.W) * s;
        let z = 1;
        const pose = an.poses[i];
        if (pose) z = 0.6 + 0.4 * lisse((t - pose) / 260);
        const m = s * (1 - 0.86 * z) / 2;
        c.fillStyle = 'rgba(243,222,172,.92)'; rr(c, x + m, y + m, s - 2 * m, s - 2 * m, s * 0.16); c.fill();
        c.strokeStyle = COUL[p]; c.globalAlpha = 0.55; c.lineWidth = Math.max(1.5, s * 0.05);
        rr(c, x + m, y + m, s - 2 * m, s - 2 * m, s * 0.16); c.stroke(); c.globalAlpha = 1;
      }
      c.strokeStyle = '#d9b877'; c.lineWidth = s * 0.3;
      c.beginPath();
      for (let k = 0; k < l.length; k++) { const X = cx(e, g, l[k]), Y = cy(e, g, l[k]); if (k) c.lineTo(X, Y); else c.moveTo(X, Y); }
      c.stroke();
      c.strokeStyle = 'rgba(120,80,30,.35)'; c.lineWidth = Math.max(1, s * 0.035); c.setLineDash([s * 0.12, s * 0.1]);
      c.stroke(); c.setLineDash([]);
    }
  }

  // Position affichée d'un objet qui glisse d'une case à l'autre.
  function position(e, g, cible, a, t) {
    const X = cx(e, g, cible), Y = cy(e, g, cible);
    if (!a) return [X, Y];
    const k = lisse((t - a.t0) / DUREE);
    return [cx(e, g, a.de) + (X - cx(e, g, a.de)) * k, cy(e, g, a.de) + (Y - cy(e, g, a.de)) * k];
  }

  // Cases éclairées la nuit pour la jeep de la place s.
  function eclairees(e, s) {
    const l = new Set();
    if (s < 0 || !e.j[s]) return l;
    const jp = e.j[s];
    for (let i = 0; i < e.W * e.H; i++) if (O.cheb(e, jp.c, i) <= 1) l.add(i);
    let c = jp.c;
    for (let k = 0; k < 3; k++) { c = O.voisine(e, c, jp.d); if (c < 0) break; l.add(c); }
    return l;
  }

  function dessinerPlateau(c, e, g, opt) {
    const t = opt.t, an = opt.anims, s = g.s, moi = opt.moi;
    const pay = paysageDe(e.n || 0);
    for (let i = 0; i < e.W * e.H; i++) caseTerrain(c, e, g, i, pay, t);
    dessinerPistes(c, e, g, an, t);
    // animaux
    const lumiere = e.nuit ? eclairees(e, moi) : null;
    e.an.forEach((a, i) => {
      const p = position(e, g, a.c, an.an[i], t);
      const buisson = e.t.charAt(a.c) === '*';
      const pris = a.ph >= 0;
      // la nuit, un animal hors de la lumière n'est que deux yeux (dessinés plus bas)
      if (lumiere && moi >= 0 && !pris && !lumiere.has(a.c)) { if (buisson) feuillage(c, e, g, a.c); return; }
      c.save();
      if (pris) c.globalAlpha = 0.5;
      if (!pris && O.esp(a.k).ra && (!e.nuit || (lumiere && lumiere.has(a.c)))) {
        const k = 0.5 + 0.5 * Math.sin(t / 300 + i);
        const halo = c.createRadialGradient(p[0], p[1], s * 0.1, p[0], p[1], s * 0.55);
        halo.addColorStop(0, 'rgba(255,220,80,' + (0.45 + 0.3 * k) + ')'); halo.addColorStop(1, 'rgba(255,220,80,0)');
        c.fillStyle = halo; rond(c, p[0], p[1], s * 0.55); c.fill();
      }
      if (a.d >= 0 && !pris) {
        c.fillStyle = 'rgba(255,255,255,.75)';
        const ax = p[0] + O.DX[a.d] * s * 0.42, ay = p[1] + O.DY[a.d] * s * 0.42;
        c.beginPath();
        c.moveTo(ax + O.DX[a.d] * s * 0.08, ay + O.DY[a.d] * s * 0.08);
        c.lineTo(ax - O.DY[a.d] * s * 0.08 - O.DX[a.d] * s * 0.04, ay + O.DX[a.d] * s * 0.08 - O.DY[a.d] * s * 0.04);
        c.lineTo(ax + O.DY[a.d] * s * 0.08 - O.DX[a.d] * s * 0.04, ay - O.DX[a.d] * s * 0.08 - O.DY[a.d] * s * 0.04);
        c.closePath(); c.fill();
      }
      const saut = an.an[i] ? Math.sin(lisse((t - an.an[i].t0) / DUREE) * Math.PI) * s * 0.12 : 0;
      dessinerAnimal(c, a.k, p[0], p[1] - (buisson ? s * 0.12 : 0) - saut, s * (buisson ? 0.34 : 0.4));
      c.restore();
      if (buisson) feuillage(c, e, g, a.c);
      if (pris) {
        const x = p[0] + s * 0.2, y = p[1] - s * 0.34;
        c.fillStyle = '#fff'; c.strokeStyle = COUL[a.ph]; c.lineWidth = Math.max(1.5, s * 0.05);
        rr(c, x - s * 0.14, y - s * 0.12, s * 0.28, s * 0.26, s * 0.03); c.fill(); c.stroke();
        c.fillStyle = COUL[a.ph]; c.fillRect(x - s * 0.1, y - s * 0.08, s * 0.2, s * 0.13);
      }
    });
    for (let i = 0; i < e.W * e.H; i++) if (e.t.charAt(i) === '*' && O.animalEn(e, i) < 0) feuillage(c, e, g, i);
    // nuit : seuls les yeux brillent hors de la lumière de ta jeep
    if (e.nuit && moi >= 0) {
      c.fillStyle = 'rgba(10,14,40,.82)';
      for (let i = 0; i < e.W * e.H; i++) {
        if (lumiere.has(i)) continue;
        c.fillRect(g.ox + (i % e.W) * s, g.oy + Math.floor(i / e.W) * s, s + 0.5, s + 0.5);
      }
      e.an.forEach((a, i) => {
        if (a.ph >= 0 || lumiere.has(a.c)) return;
        const p = position(e, g, a.c, an.an[i], t);
        const cligne = Math.sin(t / 900 + i * 2.1) > 0.93 ? 0.15 : 1;
        c.fillStyle = '#ffe14d'; c.shadowColor = '#ffe14d'; c.shadowBlur = s * 0.3;
        ell(c, p[0] - s * 0.1, p[1], s * 0.06, s * 0.06 * cligne); c.fill();
        ell(c, p[0] + s * 0.1, p[1], s * 0.06, s * 0.06 * cligne); c.fill();
        c.shadowBlur = 0;
      });
    }
    // jeeps
    e.j.forEach((jp, p) => {
      const aj = an.jeeps[p];
      const pos = position(e, g, jp.c, aj, t);
      let ang = jp.d * Math.PI / 2;
      if (aj) {
        let a0 = aj.dd * Math.PI / 2, d = ang - a0;
        while (d > Math.PI) d -= Math.PI * 2;
        while (d < -Math.PI) d += Math.PI * 2;
        ang = a0 + d * lisse((t - aj.t0) / DUREE);
      }
      if (e.nuit) {
        c.save(); c.translate(pos[0], pos[1]); c.rotate(ang);
        const f = c.createLinearGradient(0, 0, 0, -s * 3.2);
        f.addColorStop(0, 'rgba(255,240,160,.45)'); f.addColorStop(1, 'rgba(255,240,160,0)');
        c.fillStyle = f; c.beginPath(); c.moveTo(-s * 0.2, -s * 0.3); c.lineTo(-s * 0.5, -s * 3.4); c.lineTo(s * 0.5, -s * 3.4); c.lineTo(s * 0.2, -s * 0.3); c.closePath(); c.fill();
        c.restore();
      }
      const peint = p === moi ? prog.peinture : 'sable';
      jeepDessus(c, pos[0], pos[1], s, ang, COUL[p], peint, opt.monTour && p === moi);
      if (jp.jm > 0) jumellesDessin(c, pos[0] + s * 0.32, pos[1] - s * 0.32, s * 0.26);
    });
    // cases lumineuses : où avancer, ou quel animal photographier
    const pul = 0.5 + 0.5 * Math.sin(t / 220);
    if (opt.options) {
      opt.options.forEach((o, k) => {
        const x = g.ox + (o.c % e.W) * s, y = g.oy + Math.floor(o.c / e.W) * s;
        c.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.2 * pul) + ')'; rr(c, x + s * 0.06, y + s * 0.06, s * 0.88, s * 0.88, s * 0.18); c.fill();
        c.strokeStyle = opt.curseur === k ? '#ffd21a' : '#fff'; c.lineWidth = Math.max(2, s * (opt.curseur === k ? 0.1 : 0.06));
        rr(c, x + s * 0.06, y + s * 0.06, s * 0.88, s * 0.88, s * 0.18); c.stroke();
        const X = x + s / 2, Y = y + s / 2;
        c.fillStyle = COUL[moi >= 0 ? moi : 0];
        c.beginPath();
        c.moveTo(X + O.DX[o.d] * s * 0.22, Y + O.DY[o.d] * s * 0.22);
        c.lineTo(X - O.DY[o.d] * s * 0.16 - O.DX[o.d] * s * 0.1, Y + O.DX[o.d] * s * 0.16 - O.DY[o.d] * s * 0.1);
        c.lineTo(X + O.DY[o.d] * s * 0.16 - O.DX[o.d] * s * 0.1, Y - O.DX[o.d] * s * 0.16 - O.DY[o.d] * s * 0.1);
        c.closePath(); c.fill();
      });
    }
    if (opt.vis) {
      opt.vis.forEach((i, k) => {
        const p = position(e, g, e.an[i].c, an.an[i], t);
        const r = s * (0.44 + 0.04 * pul), L = s * 0.18;
        c.strokeStyle = opt.curseur === k ? '#ffd21a' : '#fff'; c.lineWidth = Math.max(2, s * (opt.curseur === k ? 0.09 : 0.06));
        [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach((q) => {
          c.beginPath(); c.moveTo(p[0] + q[0] * r, p[1] + q[1] * (r - L)); c.lineTo(p[0] + q[0] * r, p[1] + q[1] * r); c.lineTo(p[0] + q[0] * (r - L), p[1] + q[1] * r); c.stroke();
        });
      });
    }
    // flashs des photos
    an.flash = an.flash.filter((f) => t - f.t0 < 450);
    an.flash.forEach((f) => {
      const k = 1 - (t - f.t0) / 450, X = cx(e, g, f.c), Y = cy(e, g, f.c);
      const gr = c.createRadialGradient(X, Y, 0, X, Y, s * 1.2);
      gr.addColorStop(0, 'rgba(255,255,255,' + k + ')'); gr.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = gr; rond(c, X, Y, s * 1.2); c.fill();
    });
  }

  // ---------------------------------------------------------------------
  //  État de la partie à l'écran
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  let partie = null;          // partie JEL_MULTI en cours
  let session = null;         // 'solo' (niveaux) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let vue = null;             // état affiché (copie)
  let enPartie = false;
  let enPause = false;
  let humainsAvant = null;
  let debutTour = 0;
  let dernierTic = -1;
  let finManche = 0;
  let jeton = 0;              // change à chaque nouvelle partie (minuteries périmées)
  let geo = null;
  let curseur = -1;           // choix au clavier (case ou animal)
  let dernierAttends = 0;
  let anims = { jeeps: {}, an: {}, poses: {}, flash: [] };
  let especesManche = [];     // espèces ajoutées à l'album pendant la manche
  const particules = [];

  const animsVides = () => ({ jeeps: {}, an: {}, poses: {}, flash: [] });

  function afficherEcran(nom) {
    ecran = nom;
    ['titre', 'niveaux', 'album', 'garage', 'jeu'].forEach((n) => $('ecran-' + n).classList.toggle('actif', n === nom));
    $('fond').style.display = nom === 'titre' ? 'block' : 'none';
    if (nom === 'titre') { dessinerTitre(); majTitre(); }
    if (nom === 'jeu') relancerBoucle();
  }

  function toast(texte, duree) {
    const el = $('toast');
    el.textContent = texte;
    el.classList.toggle('haut', salonOuvert() || $('voile-fin').classList.contains('actif'));
    el.classList.add('actif');
    clearTimeout(toast.m);
    toast.m = setTimeout(() => el.classList.remove('actif'), duree || 2600);
  }

  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }

  // Cartes des 4 places, en haut de l'écran, et les mêmes dans le salon.
  function construirePlaces() {
    const boite = $('places');
    boite.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      const cv = document.createElement('canvas'); cv.className = 'jeep'; cv.width = 100; cv.height = 84;
      const pts = document.createElement('span'); pts.className = 'pts';
      const tag = document.createElement('span'); tag.className = 'tag';
      const cour = document.createElement('canvas'); cour.className = 'couronne'; cour.width = 52; cour.height = 40;
      cour.setAttribute('aria-hidden', 'true');
      couronne(cour.getContext('2d'), 26, 36, 24);
      d.append(cv, pts, tag, cour);
      boite.appendChild(d);
    }
    const salon = $('salon-places');
    salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'salon-place'; d.id = 'salon-place-' + s;
      const cv = document.createElement('canvas'); cv.width = 112; cv.height = 112;
      const tag = document.createElement('span'); tag.className = 'tag';
      d.append(cv, tag);
      salon.appendChild(d);
    }
  }

  function peindrePlace(s, moi) {
    const cv = $('place-' + s).querySelector('canvas.jeep');
    const cle = s + '|' + (moi ? prog.peinture : 'sable');
    if (cv.dataset.cle === cle) return;
    cv.dataset.cle = cle;
    const c = cv.getContext('2d');
    c.clearRect(0, 0, 100, 84);
    jeepProfil(c, 50, 78, 92, COUL[s], moi ? prog.peinture : 'sable', true);
  }

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom affiché d'une place : le pseudo d'un vrai joueur en ligne (donné par le
  // serveur, partie.sieges()[s].nom), sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = (role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT);
    const txt = document.createElement('span');
    txt.textContent = texte;
    tag.appendChild(txt);
  }

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      // Avant le premier coup d'un niveau solo (tutoriel), la jeep orange est déjà la tienne.
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: session === 'solo' && s === 0 };
      const pts = e && e.sc[s] !== undefined ? e.sc[s] : 0;
      d.querySelector('.pts').textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
      peindrePlace(s, !!info.moi);
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { jeep: tr('jeep.' + s), points: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function monTour() { return !!(partie && vue && !attenteTuto && !enPause && partie.monTour()); }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu') return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) {
      if (e.ph === 1) return tr('tour.photo');
      return O.options(e, s).length ? tr('tour.toi') : tr('tour.coince');
    }
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.' + s);
  }

  function majInfos() {
    let info = '';
    const e = vue;
    const tours = e ? tr('jeu.tours', { n: Math.min(e.T, e.rd + 1), total: e.T }) : '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, paysage: tr('paysage.' + paysageDe(niveau - 1)) }) + ' · ' + tours;
    else if (partie && partie.manche > 0 && e) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche }) + ' · ' + tours;
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    const aide = e && e.ph === 1 && monTour() ? tr('jeu.aidePhoto') : tr('jeu.aide');
    if ($('aide').textContent !== aide) $('aide').textContent = aide;
    const ej = $('ecran-jeu');
    const pay = e ? paysageDe(e.n || 0) : 0;
    for (let k = 1; k <= 3; k++) ej.classList.toggle('p' + k, pay === k);
    ej.classList.toggle('nuit', !!(e && e.nuit));
  }

  function majInterface() {
    majPlaces();
    majInfos();
  }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu') {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage
  // ---------------------------------------------------------------------

  let rafId = 0, tPrec = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle(t) {
    rafId = 0;
    if (ecran !== 'jeu' || enPause) return;
    const dt = Math.min(0.05, tPrec ? (t - tPrec) / 1000 : 0.016);
    tPrec = t;
    dessinerJeu(performance.now(), dt);
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  function choixAffiches() {
    if (!monTour()) return { options: null, vis: null };
    if (vue.ph === 1) return { options: null, vis: vue.vis };
    return { options: O.options(vue, partie.siege), vis: null };
  }

  function dessinerJeu(t, dt) {
    const cv = $('plateau'), zone = $('zone');
    const w = zone.clientWidth, h = zone.clientHeight, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!w || !h) return;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    const c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, w, h);
    if (!vue) { geo = null; return; }
    geo = geometrie(vue, w, h, 6);
    const moi = partie ? partie.siege : 0;
    const ch = choixAffiches();
    c.fillStyle = 'rgba(0,0,0,.18)'; rr(c, geo.ox - 4, geo.oy - 2, geo.s * vue.W + 8, geo.s * vue.H + 8, 14); c.fill();
    c.save(); rr(c, geo.ox, geo.oy, geo.s * vue.W, geo.s * vue.H, 12); c.clip();
    dessinerPlateau(c, vue, geo, { t: t, anims: anims, moi: moi, options: ch.options, vis: ch.vis, curseur: curseur, monTour: !!(ch.options || ch.vis) });
    c.restore();
    // particules (étoiles, photos qui s'envolent vers la carte du joueur)
    for (let i = particules.length - 1; i >= 0; i--) {
      const p = particules[i];
      p.vie -= dt;
      if (p.vie <= 0) { particules.splice(i, 1); continue; }
      if (p.photo) {
        const k = lisse(1 - p.vie / p.duree);
        const x = p.x + (p.tx - p.x) * k, y = p.y + (p.ty - p.y) * k - Math.sin(k * Math.PI) * 40;
        c.save(); c.translate(x, y); c.rotate(k * 0.6 - 0.3); c.scale(1 - k * 0.4, 1 - k * 0.4);
        c.fillStyle = '#fff'; c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1;
        rr(c, -p.k * 0.6, -p.k * 0.7, p.k * 1.2, p.k * 1.4, 3); c.fill(); c.stroke();
        dessinerAnimal(c, p.esp, 0, -p.k * 0.12, p.k * 0.48);
        c.restore();
        continue;
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt;
      c.globalAlpha = Math.min(1, p.vie * 2);
      c.fillStyle = p.coul;
      etincelle(c, p.x, p.y, p.k);
      c.globalAlpha = 1;
    }
  }

  function jaillir(i, qui) {
    if (!vue || !geo) return;
    const x = cx(vue, geo, i), y = cy(vue, geo, i);
    for (let k = 0; k < 12; k++) {
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 170;
      particules.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 150, vie: 0.7 + Math.random() * 0.4, k: geo.s * (0.07 + Math.random() * 0.06), coul: k % 2 ? COUL[qui] : '#ffe066' });
    }
  }

  // Une petite photo s'envole de l'animal vers la carte du photographe.
  function envolerPhoto(i, qui, k) {
    if (!vue || !geo) return;
    const zone = $('plateau').getBoundingClientRect(), carte = $('place-' + qui).getBoundingClientRect();
    particules.push({ photo: true, esp: k, x: cx(vue, geo, i), y: cy(vue, geo, i), tx: carte.left + carte.width / 2 - zone.left, ty: carte.top + carte.height / 2 - zone.top, vie: 0.8, duree: 0.8, k: Math.max(26, geo.s * 0.7) });
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(ev.resultat); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majInterface();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    vue = partie.etat ? copie(partie.etat) : null;
    anims = animsVides();
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // ---------------------------------------------------------------------
  //  Salon d'attente (en ligne) : le premier joueur arrivé lance la manche,
  //  sinon elle part toute seule au bout du temps donné par le serveur.
  // ---------------------------------------------------------------------

  let finSalon = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;

  const salonOuvert = () => $('voile-salon').classList.contains('actif');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;            // le résultat de la manche ouvrira le salon
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        const c = d.querySelector('canvas').getContext('2d');
        c.clearRect(0, 0, 112, 112);
        medaillon(c, s, 56, 62, 44, info.moi ? prog.peinture : 'sable');
        if (info.chef) couronne(c, 56, 24, 26);
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { jeep: tr('jeep.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { jeep: nomChef ? nomChef + ' · ' + tr('jeep.' + partie.chef) : tr('jeep.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    vue = copie(partie.etat);
    anims = animsVides();
    particules.length = 0;
    especesManche = [];
    debutTour = Date.now();
    dernierTic = -1;
    curseur = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche, paysage: tr('paysage.' + paysageDe(vue.n)) })); sons.tour(); }
    else enPartie = true;
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
  }

  // Une espèce rejoint l'album (photo prise par le joueur de l'appareil).
  function ajouterAlbum(k) {
    if (!especeConnue(k) || prog.album.indexOf(k) >= 0) return false;
    prog.album.push(k);
    especesManche.push(k);
    if (session === 'ligne') sauverReglages();
    return true;
  }

  function surAction(ev) {
    const t = performance.now();
    const av = ev.avant, ap = ev.apres, s = ev.siege;
    vue = copie(ap);
    debutTour = Date.now();
    dernierTic = -1;
    // la jeep avance sur sa nouvelle tuile de piste
    if (av.j[s].c !== ap.j[s].c) {
      anims.jeeps[s] = { de: av.j[s].c, dd: av.j[s].d, t0: t };
      anims.poses[ap.j[s].c] = t;
      sons.moteur(); sons.pose();
      if (ap.t.charAt(ap.j[s].c) === '=') sons.gue();
    }
    if (ap.j[s].jm === 3 && av.j[s].jm < 3) { sons.jumelles(); if (ev.moi) toast(tr('jumelles.prises')); }
    // animaux qui bougent : troupeaux, fuite des timides
    let troupeau = false, fuite = null;
    ap.an.forEach((a, i) => {
      const b = av.an[i];
      if (!b || b.c === a.c) return;
      anims.an[i] = { de: b.c, t0: t };
      if (a.d >= 0) troupeau = true; else fuite = a.k;
    });
    if (troupeau) sons.sabots();
    if (fuite) { sons.fuite(); if (ev.moi) toast(tr('photo.fuite', { espece: tr('espece.' + fuite) })); }
    // photos prises
    ap.an.forEach((a, i) => {
      const b = av.an[i];
      if (!b || b.ph >= 0 || a.ph < 0) return;
      anims.flash.push({ c: a.c, t0: t });
      sons.declic();
      if (O.esp(a.k).ra) sons.rare();
      envolerPhoto(a.c, a.ph, a.k);
      jaillir(a.c, a.ph);
      const carte = $('place-' + a.ph);
      carte.classList.remove('bond'); void carte.offsetWidth; carte.classList.add('bond');
      if (partie && a.ph === partie.siege) {
        const nouvelle = ajouterAlbum(a.k);
        toast(tr(nouvelle ? 'photo.album' : (O.esp(a.k).ra ? 'photo.rare' : 'photo.prise'), { espece: tr('espece.' + a.k), n: O.valeur(a.k) }));
      }
    });
    curseur = -1;
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (partie.phase === 'jeu' && R.aQui(vue) === partie.siege && !R.fin(vue) && !ev.moi) sons.tour();
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 900);
  }

  // Fin d'une manche en ligne : on garde le classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const moi = partie.siege;
    const gagne = moi >= 0 && e.sc[moi] === Math.max.apply(null, e.sc);
    if (moi >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    remplirClassement(e, moi, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de manche : victoire, défaite, classement
  // ---------------------------------------------------------------------

  // Étoiles d'un niveau gagné : selon les photos rares prises.
  function etoilesPour(rares, total, gagne) {
    if (!gagne) return 0;
    if (!total) return 3;
    return rares >= Math.ceil(total * 2 / 3) ? 3 : rares >= Math.ceil(total / 3) ? 2 : 1;
  }

  function remplirClassement(e, moi, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordre = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordre.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === moi ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const cv = document.createElement('canvas'); cv.width = 72; cv.height = 60;
      jeepProfil(cv.getContext('2d'), 36, 56, 66, COUL[s], s === moi ? prog.peinture : 'sable', false);

  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 4 ? '#ffd84d' : COUL[i % 4], k: 6 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; c.fillRect(-b.k / 2, -b.k / 4, b.k, b.k / 2); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  let tutoAnim = 0;
  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k);
    c.fillStyle = '#ffe0bd'; c.strokeStyle = '#8a5a2a'; c.lineWidth = 2; c.lineJoin = 'round';
    const z = 1 - appui * 0.12;
    c.scale(z, z);
    c.beginPath();
    c.moveTo(-4, 0); c.lineTo(-4, -26); c.quadraticCurveTo(0, -31, 4, -26); c.lineTo(4, -8);
    c.lineTo(10, -10); c.quadraticCurveTo(14, -10, 14, -5); c.lineTo(18, -7); c.quadraticCurveTo(22, -6, 22, -1);
    c.lineTo(24, -2); c.quadraticCurveTo(28, -1, 27, 5); c.lineTo(25, 18); c.quadraticCurveTo(22, 26, 12, 27); c.lineTo(2, 27);
    c.quadraticCurveTo(-6, 26, -10, 18); c.lineTo(-16, 6); c.quadraticCurveTo(-17, 1, -12, 1); c.closePath();
    c.fill(); c.stroke();
    if (appui > 0) { c.strokeStyle = 'rgba(255,255,255,' + appui + ')'; c.lineWidth = 3; rond(c, 0, -28, 12 + appui * 6); c.stroke(); }
    c.restore();
  }

  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const base = () => {
      const e = O.preparer({ g: d.g, T: 99, nuit: d.nuit, galop: d.galop }, 1);
      e.n = NIVEAUX.findIndex((x) => x.tuto === cle);
      if (e.n < 0) e.n = 0;
      return e;
    };
    let e = base(), debut = 0, fait = 0, an = animsVides();
    const PAS = 1500, j = ++tutoAnim;
    const g = geometrie(e, 420, 420, 18);
    const cible = (et) => (et.m ? et.m[1] * e.W + et.m[0] : e.an[et.f].c);
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = base(); fait = 0; an = animsVides(); debut = t; }
      else if (k >= fait && fait < d.etapes.length && dans >= 760) {
        const et = d.etapes[fait], avant = copie(e);
        R.jouer(e, 0, et.m ? { m: cible(et) } : { f: et.f });
        const tt = performance.now();
        if (avant.j[0].c !== e.j[0].c) { an.jeeps[0] = { de: avant.j[0].c, dd: avant.j[0].d, t0: tt }; an.poses[e.j[0].c] = tt; }
        e.an.forEach((a, i) => {
          if (avant.an[i].c !== a.c) an.an[i] = { de: avant.an[i].c, t0: tt };
          if (avant.an[i].ph < 0 && a.ph >= 0) an.flash.push({ c: a.c, t0: tt });
        });
        fait++;
      }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 420, 420);
      c.save(); rr(c, g.ox, g.oy, g.s * e.W, g.s * e.H, 12); c.clip();
      const prochaine = fait < d.etapes.length ? d.etapes[fait] : null;
      const opts = prochaine && prochaine.m ? O.options(e, 0) : null;
      const vis = prochaine && prochaine.f !== undefined ? e.vis : null;
      dessinerPlateau(c, e, g, { t: performance.now(), anims: an, moi: 0, options: opts, vis: vis, curseur: -1, monTour: true });
      c.restore();
      if (prochaine) {
        const ci = cible(prochaine), mx = cx(e, g, ci), my = cy(e, g, ci) + g.s * 0.25;
        const q = Math.min(1, dans / 650);
        const x = 380 + (mx - 380) * q, y = 410 + (my - 410) * q;
        main(c, x, y, 1.5, q >= 1 ? Math.min(1, (dans - 650) / 110) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  function caseSous(px, py) {
    if (!vue || !geo) return -1;
    const x = Math.floor((px - geo.ox) / geo.s), y = Math.floor((py - geo.oy) / geo.s);
    if (x < 0 || y < 0 || x >= vue.W || y >= vue.H) return -1;
    return y * vue.W + x;
  }

  function attendsTonTour() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function jouerAction(a) {
    if (!partie || enPause || attenteTuto) return;
    if (!partie.monTour()) { attendsTonTour(); return; }
    if (partie.jouer(a)) curseur = -1;
  }

  // Toucher une case : avancer dessus, ou photographier l'animal qui s'y trouve.
  function toucherCase(i) {
    if (!vue || i < 0) return;
    if (!monTour()) { attendsTonTour(); return; }
    const moi = partie.siege;
    if (vue.ph === 1) {
      const a = O.animalEn(vue, i);
      if (a >= 0 && vue.vis.indexOf(a) >= 0) jouerAction({ f: a });
      else { sons.non(); toast(tr('tour.ailleursPhoto'), 1400); }
      return;
    }
    const l = O.options(vue, moi);
    if (!l.length) { jouerAction({ m: -1 }); return; }
    if (l.some((o) => o.c === i)) jouerAction({ m: i });
    else { sons.non(); toast(tr('tour.ailleurs'), 1400); }
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerdown', (ev) => { audio(); ev.preventDefault(); });
  plateau.addEventListener('pointerup', (ev) => {
    const p = point(ev);
    toucherCase(caseSous(p[0], p[1]));
  });

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;            // salon : on choisit avec ses boutons (Tab, Entrée)
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif') || !vue) return;
    const dirs = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
    const entree = ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter';
    if (dirs[ev.code] === undefined && !entree) return;
    if (entree && document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    ev.preventDefault(); audio();
    if (!monTour()) { attendsTonTour(); return; }
    const moi = partie.siege;
    if (vue.ph === 1) {
      // photo : les flèches passent d'un animal à l'autre, Entrée déclenche
      const n = vue.vis.length;
      if (entree) { if (curseur >= 0 && curseur < n) jouerAction({ f: vue.vis[curseur] }); else { curseur = 0; sons.clic(); } }
      else {
        const pas = dirs[ev.code] === 1 || dirs[ev.code] === 2 ? 1 : -1;
        curseur = curseur < 0 ? 0 : (curseur + pas + n) % n;
        sons.clic();
      }
      return;
    }
    const l = O.options(vue, moi);
    if (!l.length) { if (entree) jouerAction({ m: -1 }); return; }
    if (entree) { if (l.length === 1) jouerAction({ m: l[0].c }); else { sons.non(); toast(tr('tour.fleches'), 1600); } return; }
    // flèche : la case voisine dans cette direction (haut, droite, bas, gauche de l'écran)
    const o = l.find((x) => x.d === dirs[ev.code]);
    if (o) jouerAction({ m: o.c }); else { sons.non(); }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); dessinerTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-album').addEventListener('click', () => { audio(); sons.clic(); ouvrirAlbum(); });
  $('btn-garage').addEventListener('click', () => { audio(); sons.clic(); ouvrirGarage(); });
  ['niv-retour', 'album-retour', 'garage-retour'].forEach((id) => $(id).addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); }));
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });
  I18N.surChangement && I18N.surChangement(() => { majBoutonsSon(); majInterface(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); dessinerTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
