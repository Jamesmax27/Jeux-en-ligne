<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;

  }

  function trouver(lang, cle) {
    var d = dicos[lang];

  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {

  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }

    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {

  function t(cle, variables) {

    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  function changerSurPlace(c) {

    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).

    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {

      if (isole && !coin && hote) {

        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();

    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }

    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();

    document.addEventListener('pointerdown', function (e) {

    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);

  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {

    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
'use strict';
/* =====================================================================
   Le rallye des tracteurs — course vue de dessus.
   Le tracteur avance tout seul ; le joueur le dirige à gauche / à droite.
   Monde : « d » = distance parcourue le long du chemin, « o » = décalage
   latéral par rapport au milieu du chemin (unités ≈ pixels pour 400 px).
   ===================================================================== */

const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const VMAX = 260;                 // vitesse maximale (unités par seconde)

// Générateur pseudo-aléatoire reproductible (un circuit = toujours le même tracé)
function alea(graine) {
  return function () {
    graine |= 0; graine = graine + 0x6D2B79F5 | 0;
    let t = Math.imul(graine ^ graine >>> 15, 1 | graine);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hasard(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

/* ---------- Les circuits ---------- */

let AC = null, maitre = null, moteur = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      maitre = AC.createGain(); maitre.gain.value = sauve.son ? 1 : 0; maitre.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended' && etat !== 'pause') AC.resume().catch(() => {});
  return AC;
}
function bip(f, dur, type = 'sine', vol = .15, f2 = 0, delai = 0) {
  if (!AC || !sauve.son || demo) return;
  const t = AC.currentTime + delai, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(maitre); o.start(t); o.stop(t + dur + .05);
}
function bruit(dur, vol = .2, freq = 800, q = 1, delai = 0, freq2 = 0) {
  if (!AC || !sauve.son || demo) return;
  const t = AC.currentTime + delai, n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (freq2) f.frequency.exponentialRampToValueAtTime(freq2, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(maitre); s.start(t);
}

// Moteur : un ronronnement grave qui suit la vitesse
function moteurDemarrer() {
  if (!AC || moteur) return;
  const o = AC.createOscillator(), f = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'sawtooth'; o.frequency.value = 45; f.type = 'lowpass'; f.frequency.value = 380; g.gain.value = .035;
  o.connect(f); f.connect(g); g.connect(maitre); o.start();
  moteur = { o, g };
}

/* =====================================================================
   CIRCUIT : tracé, obstacles, bonus
   ===================================================================== */
function genererCircuit(n) {
  const N = NIVEAUX[n], r = alea(4242 + n * 977);
  const c = { n, N, L: 11000 + Math.min(n, 11) * 900, hw: N.largeur, objets: [], raccourcis: [], troupeaux: [], foinTotal: 0 };
  const a = N.courbe;
  const harm = [
    { a: 120 * a, p: 850 + r() * 300, f: r() * 6.28 },
    { a: 55 * a,  p: 380 + r() * 150, f: r() * 6.28 },
    { a: 15 * a,  p: 230 + r() * 60,  f: r() * 6.28 }
  ];
  // Milieu du chemin selon la distance (départ en ligne droite)
  c.centre = d => {
    let x = 0;
    for (const h of harm) x += h.a * (Math.sin(d / h.p + h.f) - Math.sin(h.f));
    return x * clamp(d / 900, 0, 1);
  };
  const libre = (d, o, ecartD, ecartO) => c.objets.every(b => Math.abs(b.d - d) > ecartD || Math.abs(b.o - o) > ecartO);

  // Raccourcis cachés dans le blé
  for (let i = 0; i < N.raccourci; i++) {
    const d0 = c.L * (.22 + .5 * i / N.raccourci) + r() * 500;
    c.raccourcis.push({ d0, d1: d0 + 900 + r() * 300, cote: r() < .5 ? -1 : 1, vu: false });
  }
  const dansRac = d => c.raccourcis.some(rc => d > rc.d0 - 250 && d < rc.d1 + 250);
  // Troupeaux qui traversent
  for (let i = 0; i < N.troupeau; i++) {
    let d = c.L * (.28 + .6 * (i + .5) / N.troupeau);
    while (dansRac(d)) d += 300;
    const nb = 3 + Math.min(3, Math.floor(n / 3));
    c.troupeaux.push({ d, base: (r() - .5) * c.hw, dir: r() < .5 ? -1 : 1, vit: 38 + n * 2, nb, boost: 0, vu: false });
  }
  const presTroupeau = d => c.troupeaux.some(t => Math.abs(t.d - d) < 260);
  // Foin sur les raccourcis (récompense de l'exploration)
  for (const rc of c.raccourcis) {
    for (const f of [.4, .62]) {
      const d = rc.d0 + (rc.d1 - rc.d0) * f;
      c.objets.push({ type: 'foin', d, o: oRaccourci(c, rc, d), pris: false });
      if (N.foin) c.foinTotal++;
    }
  }
  // Bottes de foin et flaques de boue sur le chemin
  const place = (type, nb) => {
    for (let i = 0; i < nb; i++) {
      for (let essai = 0; essai < 30; essai++) {
        const d = 1500 + (c.L - 2300) * ((i + r()) / nb);
        const o = (r() * 2 - 1) * (c.hw - 40);
        if (presTroupeau(d) || !libre(d, o, 130, 80)) continue;
        if (type === 'boue') c.objets.push({ type, d, o, w: 70 + r() * 30 + n * 2, h: 44 + r() * 20, touche: false });
        else { c.objets.push({ type, d, o, pris: false }); c.foinTotal++; }
        break;
      }
    }
  };
  place('boue', N.boue);
  if (N.foin) place('foin', N.foin);
  if (!N.foin) c.objets = c.objets.filter(o => o.type !== 'foin');
  c.foinBut = Math.ceil(c.foinTotal * .6);
  c.objets.sort((x, y) => x.d - y.d);
  return c;
}
// Décalage du chemin caché d'un raccourci : il s'écarte du chemin puis le rejoint
function oRaccourci(c, rc, d) {
  const t = clamp((d - rc.d0) / (rc.d1 - rc.d0), 0, 1);
  return rc.cote * (c.hw - 10 + 120 * Math.sin(Math.PI * t));
}

/* =====================================================================
   ÉTAT DU JEU
   ===================================================================== */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 400, H = 800, DPR = 1, K = 1, PY = 600;
let etat = 'demo', demo = true, etatAvantPause = null;
let C = null, P = null, R = [], temps = 0, decompte = 0, arriveeT = 0, nbFinis = 0;
let cam = { x: 0, d: 0 }, secousse = 0, placeAff = 4, bumpCd = 0, klaxonCd = 0;
let partMonde = [], partEcran = [], gouttes = [], message = { txt: '', t: 0 };
let resultat = null;
const touches = { g: 0, d: 0 };
let glisse = null;              // geste en cours : { id, x, base }

function redimensionner() {
  const r = $('#app').getBoundingClientRect();
  W = r.width; H = r.height; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  K = W / 400; PY = H * .76;
}
window.addEventListener('resize', redimensionner);

function nouveauVehicule(d, o, coul) {
  return { d, o, v: 0, vo: 0, cible: o, coul, boueT: 0, turboT: 0, stopT: 0, foin: 0, bascule: 0, fini: false, rang: 0 };
}
function preparerCourse(n, estDemo) {
  demo = estDemo;
  C = genererCircuit(n);
  const maCoul = COULEURS[sauve.couleur].c;
  const autres = COUL_RIVAUX.filter(c => c !== maCoul);
  P = nouveauVehicule(0, 0, maCoul);
  R = [];
  const voies = [-.5, .5, 0];
  for (let i = 0; i < 3; i++) {
    const v = nouveauVehicule(70 + i * 75, voies[i] * C.hw, autres[i]);
    v.base = (C.N.bonus ? .95 : .8 + n * .018) - i * .035;
    v.voie = v.o; v.voieT = 2 + i; v.ph = i * 2;
    R.push(v);
  }
  temps = 0; nbFinis = 0; placeAff = 4; partMonde = []; partEcran = []; secousse = 0;
  cam.x = 0; cam.d = 0; glisse = null; touches.g = touches.d = 0;
  gouttes = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), v: .8 + Math.random() * .6 }));
}

/* =====================================================================
   MISE À JOUR
   ===================================================================== */
function dansRaccourci(e) {
  for (const rc of C.raccourcis) {
    if (e.d > rc.d0 && e.d < rc.d1 && Math.abs(e.o - oRaccourci(C, rc, e.d)) < 42) return rc;
  }
  return null;
}
function majVitesse(e, dt, joueur) {
  let vmax = joueur ? 1 : e.vmax;
  if (Math.abs(e.o) > C.hw - 6) {
    const rc = joueur ? dansRaccourci(e) : null;
    if (rc) {
      vmax = 1.3;
      if (!rc.vu && !demo) { rc.vu = true; afficherMessage(t('raccourci')); SONS.raccourci(); }
    } else vmax = .5;
  }
  if (e.boueT > 0) { vmax = Math.min(vmax, .38); e.boueT -= dt; }
  if (e.turboT > 0) { vmax *= 1.38; e.turboT -= dt; }
  if (e.stopT > 0) { vmax = 0; e.stopT -= dt; }
  const acc = e.v < vmax ? .55 : 2.5;
  e.v += clamp(vmax - e.v, -acc * dt, acc * dt);
  e.d += e.v * VMAX * dt;
}

function majCourse(dt) {
  temps += dt;
  bumpCd -= dt; klaxonCd -= dt;
  const pluie = C.N.meteo === 'pluie';
  const enCourse = etat === 'course' || etat === 'demo';

  // ---- Joueur ----
  const d0 = P.d;
  if (enCourse || etat === 'arrivee') majVitesse(P, dt, true);
  const dc = C.centre(P.d) - C.centre(d0);       // déplacement du chemin (virage)
  if (demo || etat === 'arrivee') {
    // Pilote automatique (démonstration de l'accueil, ou après la ligne d'arrivée)
    P.cible = demo ? Math.sin(temps * .5) * C.hw * .5 : P.cible * .97;
    for (const o of C.objets) if (o.type === 'boue' && o.d > P.d && o.d < P.d + 260 && Math.abs(o.o - P.cible) < o.w / 2 + 25)
      P.cible = o.o + (o.o > 0 ? -1 : 1) * (o.w / 2 + 40);
  } else {
    // le virage déporte le tracteur : un peu au début, davantage ensuite et sous la pluie
    const derive = .3 + Math.min(C.n, 11) * .02 + (pluie ? .12 : 0);
    P.cible -= dc * derive;
    if (glisse) glisse.base -= dc * derive;
    P.cible += (touches.d - touches.g) * 230 * dt;
  }
  P.cible = clamp(P.cible, -C.hw - 140, C.hw + 140);
  const reac = pluie ? 3.2 : 9;
  let vo = clamp((P.cible - P.o) * reac, -290, 290);
  if (pluie && enCourse) vo += Math.sin(temps * 1.7) * 16;   // ça glisse !
  P.o += vo * dt;
  P.vo = vo;

  // ---- Remorque : se renverse si on tourne trop fort ----
  if (C.N.remorque && etat === 'course') {
    const vMonde = Math.abs(vo + dc / Math.max(dt, .001));
    const exces = Math.max(0, vMonde - 150) / 90 * (P.turboT > 0 ? 1.3 : 1);
    P.bascule = clamp(P.bascule + (exces * (1 + C.n * .05) - .5) * dt, 0, 1);
    if (P.bascule >= 1) {
      P.bascule = 0; P.stopT = 1; P.v = 0;
      const perte = Math.min(2, P.foin); P.foin -= perte;
      secousse = .5; SONS.renverse();
      afficherMessage(perte ? t('foinTombe', { n: perte }) : t('oupsRemorque'));
      for (let i = 0; i < 14; i++) partMonde.push({ d: P.d - 50, o: P.o, vd: (Math.random() - .5) * 120, vo: (Math.random() - .5) * 160, vie: .9, coul: '#f2c94c', t: 5 });
    }
  }

  // ---- Rivaux ----
  if (enCourse || etat === 'arrivee') for (const r of R) {
    r.voieT -= dt;
    if (r.voieT <= 0) { r.voie = [-.55, 0, .55][Math.floor(Math.random() * 3)] * C.hw; r.voieT = 2.5 + Math.random() * 3; }
    let base = r.base * (1 + .025 * Math.sin(temps * .8 + r.ph));
    const ecart = r.d - P.d;
    if (ecart > 800) base *= .93; else if (ecart < -800) base *= 1.08;   // la course reste serrée
    r.vmax = base;
    majVitesse(r, dt, false);
    r.o += clamp((r.voie - r.o) * 2, -90, 90) * dt;
    if (r.d >= C.L && !r.fini) { r.fini = true; r.rang = ++nbFinis; }
  }

  // ---- Bousculades avec les rivaux ----
  for (const r of R) {
    const dd = r.d - P.d, doo = r.o - P.o;
    if (Math.abs(dd) < 58 && Math.abs(doo) < 42) {
      const pousse = (42 - Math.abs(doo)) * .5 * (doo >= 0 ? 1 : -1);
      r.o += pousse; P.o -= pousse; P.cible -= pousse * .6;
      if (dd > 0) P.v *= .97; else r.v *= .97;
      if (bumpCd <= 0) { bumpCd = .4; SONS.choc(); secousse = Math.max(secousse, .12); }
    }
  }

  // ---- Objets ----
  const tous = [P, ...R];
  for (const ob of C.objets) {
    if (ob.d < P.d - 400 && ob.d < Math.min(R[0].d, R[1].d, R[2].d) - 100) continue;
    if (ob.type === 'boue') {
      for (const e of tous) {
        if (Math.abs(ob.d - e.d) < ob.h / 2 + 18 && Math.abs(ob.o - e.o) < ob.w / 2 + 6) {
          e.boueT = .55;
          if (e === P && !ob.touche) {
            ob.touche = true; SONS.boue(); secousse = Math.max(secousse, .25);
            for (let i = 0; i < 12; i++) partMonde.push({ d: P.d + 10, o: P.o, vd: (Math.random() - .3) * 150, vo: (Math.random() - .5) * 220, vie: .6, coul: '#6b4423', t: 4 });
          }
        }
      }
    } else if (ob.type === 'foin' && !ob.pris && !demo) {
      if (Math.abs(ob.d - P.d) < 36 && Math.abs(ob.o - P.o) < 38) {
        ob.pris = true; P.foin++; P.turboT = 1.4;
        SONS.foin(); SONS.turbo();
        afficherFlottant(t('turbo'), '#ffd34d');
        for (let i = 0; i < 16; i++) partMonde.push({ d: ob.d, o: ob.o, vd: (Math.random() - .5) * 260, vo: (Math.random() - .5) * 260, vie: .7, coul: i % 2 ? '#ffe066' : '#fff', t: 3 });
      }
    }
  }

  // ---- Troupeaux ----
  for (const t of C.troupeaux) {
    t.boost -= dt;
    if (Math.abs(t.d - P.d) < 1300 || R.some(r => Math.abs(t.d - r.d) < 600))
      t.base += t.dir * t.vit * (t.boost > 0 ? 3.2 : 1) * dt;
    if (!t.vu && !demo && t.d - P.d < 520 && t.d > P.d) { t.vu = true; SONS.animal(C.N.animal); $('#btn-klaxon').classList.add('attire'); setTimeout(() => $('#btn-klaxon').classList.remove('attire'), 2500); }
    for (const a of animaux(t)) {
      for (const e of tous) {
        // seul un animal devant le tracteur l'arrête (on ne recule jamais)
        if (a.d >= e.d && a.d - e.d < 44 && Math.abs(a.o - e.o) < 40) {
          e.d = a.d - 44; e.v = 0; e.stopT = .35;
          if (e === P && bumpCd <= 0) { bumpCd = .9; SONS.animal(C.N.animal); secousse = Math.max(secousse, .2); afficherFlottant(window.JEL_I18N.t(C.N.animal === 'mouton' ? 'bee' : C.N.animal === 'oie' ? 'coin' : 'meuh'), '#fff'); }
        }
      }
    }
  }

  // ---- Place ----
  if (etat === 'course') {
    const place = 1 + R.filter(r => r.fini || r.d > P.d).length;
    if (place < placeAff) { SONS.depasse(); afficherFlottant(t('depasse'), '#9cff7a'); }
    else if (place > placeAff && temps > 3) SONS.recule();
    placeAff = place;
    if (P.d >= C.L) {
      etat = 'arrivee'; arriveeT = 1.6;
      resultat = { place: 1 + R.filter(r => r.fini).length, temps };
      moteurArreter(); SONS.arrivee();
      afficherMessage(t(resultat.place === 1 ? 'victoire' : 'arrivee'));
      confettis(resultat.place <= 3 ? 90 : 20);
    }
  }
  if (demo && P.d > C.L - 300) preparerCourse(0, true);

  // ---- Caméra et moteur ----
  cam.d = P.d;
  cam.x += (C.centre(P.d) + P.o * .45 - cam.x) * (1 - Math.exp(-dt * 5));
  if (moteur) moteur.o.frequency.setTargetAtTime(40 + P.v * 55 + (P.turboT > 0 ? 25 : 0), AC.currentTime, .1);
}

// Positions des animaux d'un troupeau (ils traversent puis reviennent de l'autre côté)
function animaux(t) {
  const L = 2 * (C.hw + 150), res = [];
  for (let i = 0; i < t.nb; i++) {
    let o = t.base + i * 48 * -t.dir;
    o = ((o + C.hw + 150) % L + L) % L - C.hw - 150;
    res.push({ d: t.d + (i % 2) * 14 - 7, o, i });
  }
  return res;
}

function majParticules(dt) {
  for (const p of partMonde) { p.d += p.vd * dt; p.o += p.vo * dt; p.vie -= dt; }
  partMonde = partMonde.filter(p => p.vie > 0);
  for (const p of partEcran) {
    p.vie -= dt;
    if (p.conf) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.rot += p.vr * dt; }
    else p.y -= 50 * dt;
  }
  partEcran = partEcran.filter(p => p.vie > 0 && p.y < H + 30);
  secousse = Math.max(0, secousse - dt);
  if (message.t > 0) { message.t -= dt; if (message.t <= 0) $('#message').textContent = ''; }
}
function afficherMessage(txt) { message = { txt, t: 1.6 }; $('#message').textContent = txt; }
function afficherFlottant(txt, coul) {
  const x = clamp(ecranX(P.d, P.o), 90, W - 90);
  partEcran.push({ x, y: PY - 70, txt, coul, vie: 1.1 });
}
function confettis(nb) {
  const cs = ['#ffd34d', '#e0402a', '#2f7de0', '#3fae3a', '#f065a8', '#fff'];
  for (let i = 0; i < nb; i++) partEcran.push({ conf: true, x: Math.random() * W, y: -20 - Math.random() * 120, vx: (Math.random() - .5) * 120,
    vy: Math.random() * 120, rot: Math.random() * 6, vr: (Math.random() - .5) * 10, coul: cs[i % cs.length], vie: 3.5 });
}

/* =====================================================================
   DESSIN
   ===================================================================== */
const ecranY = d => PY - (d - cam.d) * K;
const ecranX = (d, o) => W / 2 + (C.centre(d) + o - cam.x) * K;
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rond(x, y, r, coul) { ctx.fillStyle = coul; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
function plusClair(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = s => clamp(Math.round(((n >> s) & 255) + (255 - ((n >> s) & 255)) * f), 0, 255);
  return 'rgb(' + c(16) + ',' + c(8) + ',' + c(0) + ')';
}

function dessiner() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (!C) { ctx.fillStyle = '#5aa33e'; ctx.fillRect(0, 0, W, H); return; }
  const m = C.N.meteo;
  ctx.save();
  if (secousse > 0) ctx.translate((Math.random() - .5) * 10 * secousse, (Math.random() - .5) * 10 * secousse);
  const herbe = m === 'pluie' ? '#4f8a37' : m === 'couchant' ? '#6f9a3a' : '#62ad44';
  ctx.fillStyle = herbe; ctx.fillRect(-20, -20, W + 40, H + 40);
  const dHaut = cam.d + (PY + 20) / K, dBas = cam.d - (H - PY + 40) / K;

  // Bandes d'herbe tondue (sensation de vitesse)
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (let b = Math.floor(dBas / 80); b * 80 < dHaut; b++) if (b % 2 === 0) { const y = ecranY(b * 80 + 80); ctx.fillRect(0, y, W, 80 * K); }

  // Raccourcis (chemin caché dans le blé)
  for (const rc of C.raccourcis) {
    if (rc.d1 < dBas || rc.d0 > dHaut) continue;
    // champ de blé autour du chemin
    ctx.fillStyle = '#e2c25a';
    ctx.beginPath();
    for (let d = rc.d0 - 150; d <= rc.d1 + 150; d += 40) ctx.lineTo(ecranX(d, rc.cote * (C.hw + 10)), ecranY(d));
    for (let d = rc.d1 + 150; d >= rc.d0 - 150; d -= 40) ctx.lineTo(ecranX(d, rc.cote * (C.hw + 230)), ecranY(d));
    ctx.fill();
    ctx.strokeStyle = '#c9a43b'; ctx.lineWidth = 2 * K;
    for (let d = Math.ceil((rc.d0 - 140) / 26) * 26; d < rc.d1 + 140; d += 26) {
      for (let j = 0; j < 7; j++) {
        const o = rc.cote * (C.hw + 25 + j * 30 + (hasard(d + j) * 12));
        const x = ecranX(d, o), y = ecranY(d);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 3 * K, y - 8 * K); ctx.stroke();
      }

    ctx.beginPath();

    ctx.stroke();

    ctx.strokeStyle = 'rgba(214,180,72,.85)'; ctx.lineWidth = 2.5 * K;
    for (let d = rc.d0 + 40; d < rc.d1; d += 34) {

      const x = ecranX(d, o), y = ecranY(d);

    }
    // panneau en bois
    const px = ecranX(rc.d0 - 120, rc.cote * (C.hw + 18)), py = ecranY(rc.d0 - 120);
    ctx.fillStyle = '#6b4423'; ctx.fillRect(px - 2 * K, py - 4 * K, 4 * K, 22 * K);
    ctx.fillStyle = '#a8763e'; rr(px - 18 * K, py - 18 * K, 36 * K, 16 * K, 3 * K); ctx.fill();
    // flèche blanche vers le raccourci
    ctx.strokeStyle = '#fff8e6'; ctx.lineWidth = 3 * K; ctx.lineCap = 'round';
    const fx = px, fy = py - 10 * K, s = rc.cote * 10 * K;
    ctx.beginPath(); ctx.moveTo(fx - s, fy); ctx.lineTo(fx + s, fy); ctx.moveTo(fx + s * .4, fy - 5 * K); ctx.lineTo(fx + s, fy); ctx.lineTo(fx + s * .4, fy + 5 * K); ctx.stroke();
  }

  // Le chemin
  const terre = m === 'pluie' ? '#9c7448' : '#c99c62';
  ctx.fillStyle = terre;
  ctx.beginPath();
  for (let y = -12; y <= H + 12; y += 10) { const d = cam.d + (PY - y) / K; ctx.lineTo(ecranX(d, -C.hw), y); }
  for (let y = H + 12; y >= -12; y -= 10) { const d = cam.d + (PY - y) / K; ctx.lineTo(ecranX(d, C.hw), y); }
  ctx.fill();
  // bordures et ornières
  ctx.lineWidth = 6 * K; ctx.strokeStyle = 'rgba(70,110,40,.55)';
  for (const s of [-1, 1]) {
    ctx.beginPath();
    for (let y = -12; y <= H + 12; y += 10) { const d = cam.d + (PY - y) / K; ctx.lineTo(ecranX(d, s * C.hw), y); }
    ctx.stroke();
  }
  ctx.lineWidth = 10 * K; ctx.strokeStyle = 'rgba(120,80,40,.22)';
  for (const s of [-.5, .5]) {
    ctx.beginPath();
    for (let y = -12; y <= H + 12; y += 10) { const d = cam.d + (PY - y) / K; ctx.lineTo(ecranX(d, s * C.hw), y); }
    ctx.stroke();
  }
  // cailloux
  ctx.fillStyle = 'rgba(90,60,30,.35)';
  for (let b = Math.floor(dBas / 30); b * 30 < dHaut; b++) {
    const o = (hasard(b) * 2 - 1) * (C.hw - 10);
    ctx.beginPath(); ctx.arc(ecranX(b * 30, o), ecranY(b * 30), 2.2 * K, 0, 6.28); ctx.fill();
  }

  // Ligne de départ et d'arrivée
  ligne(0, false); ligne(C.L, true);

  // Décor : arbres, buissons, fleurs, clôtures, vignes
  for (let b = Math.floor(dBas / 140) - 1; b * 140 < dHaut + 200; b++) {
    for (const s of [-1, 1]) {
      if (C.raccourcis.some(rc => rc.cote === s && b * 140 > rc.d0 - 300 && b * 140 < rc.d1 + 300)) continue;
      const h = hasard(b * 2 + (s > 0 ? 1 : 0) + C.n * 1000), h2 = hasard(b * 7 + s + 3);
      const d = b * 140 + h2 * 60;
      if (C.N.bonus) { dessinerVignes(b, s); continue; }
      const o = s * (C.hw + 40 + h2 * 150);
      const x = ecranX(d, o), y = ecranY(d);
      if (h < .22) dessinerArbre(x, y, 22 + h2 * 10);
      else if (h < .4) { rond(x, y, 13 * K, '#3c7f2c'); rond(x + 9 * K, y + 4 * K, 10 * K, '#478f33'); }
      else if (h < .58) for (let i = 0; i < 5; i++) rond(x + (hasard(b + i) - .5) * 40 * K, y + (hasard(b - i) - .5) * 40 * K, 3.5 * K, ['#fff', '#ffd34d', '#f065a8'][i % 3]);
      else if (h < .7) { rond(x + 3 * K, y + 3 * K, 12 * K, 'rgba(0,0,0,.18)'); rond(x, y, 12 * K, '#9a9a92'); rond(x - 3 * K, y - 3 * K, 6 * K, '#b9b9b0'); }
      else if (h < .82) {
        // clôture : deux lisses et des piquets
        ctx.strokeStyle = '#a8763e'; ctx.lineWidth = 2.5 * K;
        for (const dec of [-3, 3]) {
          ctx.beginPath();
          for (let dd = 0; dd <= 140; dd += 35) ctx.lineTo(ecranX(b * 140 + dd, s * (C.hw + 22) + dec), ecranY(b * 140 + dd));
          ctx.stroke();
        }
        for (let dd = 0; dd < 140; dd += 35) rond(ecranX(b * 140 + dd, s * (C.hw + 22)), ecranY(b * 140 + dd), 4 * K, '#6b4423');
      }
    }
  }

  // Objets
  for (const ob of C.objets) {
    if (ob.d < dBas - 60 || ob.d > dHaut + 60) continue;
    const x = ecranX(ob.d, ob.o), y = ecranY(ob.d);
    if (ob.type === 'boue') {
      ctx.fillStyle = '#6b4423'; ctx.beginPath(); ctx.ellipse(x, y, ob.w / 2 * K, ob.h / 2 * K, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = '#7d5430'; ctx.beginPath(); ctx.ellipse(x - 4 * K, y + 2 * K, ob.w / 3 * K, ob.h / 3.2 * K, 0, 0, 6.28); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.ellipse(x + ob.w / 6 * K, y - ob.h / 6 * K, 8 * K, 3 * K, -.4, 0, 6.28); ctx.fill();
    } else if (ob.type === 'foin' && !ob.pris) {
      const pul = 1 + Math.sin(temps * 6 + ob.d) * .06;
      ctx.save(); ctx.translate(x, y); ctx.scale(K * pul, K * pul);
      if (C.N.bonus) {
        ctx.fillStyle = '#3c7f2c'; ctx.beginPath(); ctx.ellipse(0, -14, 9, 5, .4, 0, 6.28); ctx.fill();
        for (const [gx, gy] of [[-8, -6], [0, -6], [8, -6], [-4, 2], [4, 2], [0, 10]]) rond(gx, gy, 6, '#7d3c98');
        for (const [gx, gy] of [[-9, -8], [-1, -8], [7, -8]]) rond(gx, gy, 2, 'rgba(255,255,255,.5)');
      } else {
        ctx.fillStyle = 'rgba(0,0,0,.2)'; rr(-14, -9, 32, 24, 6); ctx.fill();
        ctx.fillStyle = '#f2c94c'; rr(-17, -13, 34, 26, 7); ctx.fill();
        ctx.strokeStyle = '#c99a1c'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); for (const lx of [-7, 0, 7]) { ctx.moveTo(lx, -12); ctx.lineTo(lx, 12); } ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Troupeaux
  for (const t of C.troupeaux) {
    if (t.d < dBas - 60 || t.d > dHaut + 60) continue;
    for (const a of animaux(t)) dessinerAnimal(ecranX(a.d, a.o), ecranY(a.d), t.dir, C.N.animal, a.i);
  }

  // Particules du monde (boue, foin)
  for (const p of partMonde) { ctx.globalAlpha = clamp(p.vie * 1.5, 0, 1); rond(ecranX(p.d, p.o), ecranY(p.d), p.t * K, p.coul); }
  ctx.globalAlpha = 1;

  // Tracteurs (du plus loin au plus proche)
  const vehicules = [...R, P].sort((a, b) => b.d - a.d);
  for (const e of vehicules) {
    const y = ecranY(e.d);
    if (y < -80 || y > H + 80) continue;
    const ang = clamp((e === P ? P.vo : 0) * .0016 + (C.centre(e.d + 30) - C.centre(e.d - 30)) / 60 * .6, -.5, .5);
    dessinerTracteur(ecranX(e.d, e.o), y, e.coul, ang, C.N.remorque, e === P ? e.bascule : 0, e.turboT > 0, e.boueT > 0);
  }

    ctx.fillStyle = '#fff8e6'; rr(x - 22, y - 14, 44, 24, 10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 6, y + 9); ctx.lineTo(x + 6, y + 9); ctx.lineTo(x, y + 16); ctx.fill();
    ctx.fillStyle = '#5a3a1c'; ctx.font = 'bold 15px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(t('toi'), x, y - 2);
  }
  ctx.restore();

  // Météo
  if (m === 'pluie') {
    ctx.fillStyle = 'rgba(30,45,70,.18)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(220,235,255,.55)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (const g of gouttes) {
      const y = ((g.y + temps * g.v * 1.6) % 1) * H, x = ((g.x - temps * .05 * g.v) % 1 + 1) % 1 * W;
      ctx.moveTo(x, y); ctx.lineTo(x - 5, y + 16);
    }
    ctx.stroke();
  } else if (m === 'brouillard') {
    const g = ctx.createLinearGradient(0, 0, 0, PY - 60);
    g.addColorStop(0, 'rgba(232,236,236,.97)'); g.addColorStop(.55, 'rgba(232,236,236,.9)'); g.addColorStop(1, 'rgba(232,236,236,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, PY - 60);
  } else if (m === 'couchant') {

  }

  // Compte à rebours
  if (etat === 'decompte') {
    const n = Math.ceil(decompte);
    ctx.font = '900 ' + Math.round(110 * Math.min(1.2, K)) + 'px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 10; ctx.strokeStyle = '#5a3a1c'; ctx.fillStyle = '#ffd34d';
    const s = 1 + (decompte - Math.floor(decompte)) * .4;
    ctx.save(); ctx.translate(W / 2, H * .38); ctx.scale(s, s);
    ctx.strokeText(n, 0, 0); ctx.fillText(n, 0, 0); ctx.restore();
  }

  // Particules d'écran : textes et confettis
  for (const p of partEcran) {
    ctx.globalAlpha = clamp(p.vie, 0, 1);
    if (p.conf) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.coul; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); }
    else {
      ctx.font = '900 26px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 5; ctx.strokeStyle = '#5a3a1c'; ctx.strokeText(p.txt, p.x, p.y); ctx.fillStyle = p.coul; ctx.fillText(p.txt, p.x, p.y);
    }
  }
  ctx.globalAlpha = 1;
}

function ligne(d, arrivee) {
  const y = ecranY(d);
  if (y < -60 || y > H + 60) return;
  const x0 = ecranX(d, -C.hw), x1 = ecranX(d, C.hw), n = 12, t = (x1 - x0) / n;
  if (arrivee) {
    for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? '#222' : '#fff'; ctx.fillRect(x0 + i * t, y - 12 * K + j * 12 * K, t + 1, 12 * K); }
    for (const x of [x0 - 10 * K, x1 + 10 * K]) { rond(x, y, 7 * K, '#5a3a1c'); }
    ctx.fillStyle = '#e0402a'; rr(x0 + (x1 - x0) / 2 - 60 * K, y - 50 * K, 120 * K, 26 * K, 8 * K); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(16 * K) + 'px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(window.JEL_I18N.t('arriveeMaj'), (x0 + x1) / 2, y - 37 * K);
  } else { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(x0, y - 4 * K, x1 - x0, 8 * K); }
}
function dessinerArbre(x, y, r) {
  rond(x + 6 * K, y + 6 * K, r * K, 'rgba(0,0,0,.18)');
  rond(x, y, r * K, '#2f6e25'); rond(x - r * .3 * K, y - r * .3 * K, r * .65 * K, '#3d8a2e');
  rond(x + r * .25 * K, y - r * .4 * K, r * .3 * K, '#5aa83f');
}
function dessinerVignes(b, s) {
  for (let j = 0; j < 4; j++) {
    const o = s * (C.hw + 34 + j * 42);
    const x = ecranX(b * 140, o), y = ecranY(b * 140), x2 = ecranX(b * 140 + 140, o), y2 = ecranY(b * 140 + 140);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 2 * K; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
    for (let i = 0; i < 4; i++) {
      const d = b * 140 + i * 35 + 10, xx = ecranX(d, o), yy = ecranY(d);
      rond(xx, yy, 11 * K, '#3f8a2a');
      if (hasard(b * 13 + i * 5 + j) < .6) rond(xx + 4 * K, yy + 3 * K, 4 * K, '#7d3c98');
    }
  }
}
function dessinerAnimal(x, y, dir, type, i) {
  ctx.save(); ctx.translate(x, y); ctx.scale(K * dir, K);
  const pas = Math.sin(temps * 9 + i) * 2;
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(3, 4, 22, 14, 0, 0, 6.28); ctx.fill();
  if (type === 'mouton') {
    for (const [a, b] of [[-10, -6], [0, -8], [10, -6], [-12, 4], [0, 6], [12, 4], [0, -1]]) rond(a, b, 8, '#f6f3ea');
    rond(22, pas * .5, 7, '#333'); rond(24, -5 + pas * .5, 2.5, '#333'); rond(24, 5 + pas * .5, 2.5, '#333');
  } else if (type === 'oie') {
    ctx.fillStyle = '#fbfbf5'; ctx.beginPath(); ctx.ellipse(0, 0, 16, 10, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#e9e7dd'; ctx.beginPath(); ctx.ellipse(-4, 0, 9, 7, 0, 0, 6.28); ctx.fill();
    rond(17, pas * .4, 6, '#fbfbf5'); ctx.fillStyle = '#f08a1c'; ctx.beginPath(); ctx.moveTo(22, -2 + pas * .4); ctx.lineTo(29, pas * .4); ctx.lineTo(22, 2 + pas * .4); ctx.fill();
  } else {
    ctx.fillStyle = '#fbfbf5'; rr(-20, -12, 38, 24, 10); ctx.fill();
    rond(-8, -4, 6, '#2b2b2b'); rond(6, 5, 5, '#2b2b2b'); rond(-14, 7, 3.5, '#2b2b2b');
    ctx.fillStyle = '#fbfbf5'; rr(16, -8 + pas * .4, 14, 16, 6); ctx.fill();
    ctx.fillStyle = '#f4a6a6'; rr(25, -6 + pas * .4, 7, 12, 4); ctx.fill();
    rond(19, -10 + pas * .4, 3, '#2b2b2b'); rond(19, 10 + pas * .4, 3, '#2b2b2b');
  }
  ctx.restore();
}
function dessinerTracteur(x, y, coul, ang, remorque, bascule, turbo, boue) {
  ctx.save(); ctx.translate(x, y); ctx.scale(K, K); ctx.rotate(ang);
  if (remorque) {
    // la remorque suit derrière, en penchant si la jauge monte
    ctx.save(); ctx.translate(0, 30); ctx.rotate(-ang * .6 + Math.sin(temps * 14) * bascule * .12);
    ctx.strokeStyle = '#444'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(0, 10); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.22)'; rr(-17, 14, 40, 44, 5); ctx.fill();
    ctx.fillStyle = '#222'; rr(-24, 30, 6, 16, 2); ctx.fill(); rr(18, 30, 6, 16, 2); ctx.fill();
    ctx.fillStyle = bascule > .7 ? '#d9534f' : '#a8763e'; rr(-20, 10, 40, 44, 5); ctx.fill();
    ctx.fillStyle = '#f2c94c'; rr(-16, 14, 32, 16, 4); ctx.fill(); rr(-16, 34, 32, 16, 4); ctx.fill();
    ctx.restore();
  }
  // ombre
  ctx.fillStyle = 'rgba(0,0,0,.22)'; rr(-20, -30, 46, 64, 9); ctx.fill();
  // roues arrière (grandes) et avant
  ctx.fillStyle = '#222';
  rr(-27, 2, 13, 26, 4); ctx.fill(); rr(14, 2, 13, 26, 4); ctx.fill();
  rr(-21, -30, 9, 15, 3); ctx.fill(); rr(12, -30, 9, 15, 3); ctx.fill();
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
  const roul = (temps * 30) % 6;
  ctx.beginPath(); for (let i = 0; i < 5; i++) { const yy = 3 + ((i * 6 + roul) % 26); ctx.moveTo(-26, yy); ctx.lineTo(-15, yy); ctx.moveTo(15, yy); ctx.lineTo(26, yy); } ctx.stroke();
  // capot
  ctx.fillStyle = coul; rr(-11, -34, 22, 36, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(-8, -33, 16, 4, 2); ctx.fill();
  // cabine
  ctx.fillStyle = coul; rr(-16, -4, 32, 30, 6); ctx.fill();
  ctx.fillStyle = plusClair(coul, .55); rr(-12, -1, 24, 22, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)'; rr(-9, 1, 9, 5, 2); ctx.fill();
  // pot d'échappement et fumée
  rond(7, -16, 3.2, '#444');
  if (turbo) for (let i = 0; i < 3; i++) rond(7 + Math.sin(temps * 20 + i) * 3, -22 - i * 8 - (temps * 40 % 8), 4 + i * 1.5, 'rgba(240,240,240,' + (.6 - i * .15) + ')');
  if (boue) for (let i = 0; i < 2; i++) rond((i ? 20 : -20), 32 + Math.sin(temps * 30 + i) * 3, 4, '#6b4423');
  ctx.restore();
}

   ===================================================================== */
let dernier = 0;
function boucle(ts) {
  const dt = Math.min(.05, (ts - dernier) / 1000 || 0); dernier = ts;
  if (etat === 'demo' || etat === 'course' || etat === 'arrivee') majCourse(dt);
  if (etat === 'decompte') {
    const avant = Math.ceil(decompte); decompte -= dt;
    cam.x += (C.centre(P.d) + P.o * .45 - cam.x) * .1;
    if (Math.ceil(decompte) < avant && decompte > 0) SONS.decompte();
    if (decompte <= 0) { etat = 'course'; SONS.partez(); moteurDemarrer(); afficherMessage(t('partez')); }
  }
  if (etat === 'arrivee') { arriveeT -= dt; if (arriveeT <= 0) montrerBilan(); }
  if (etat !== 'pause' && etat !== 'tuto') majParticules(dt);
  if (etat === 'course' || etat === 'arrivee' || etat === 'decompte') majHud();
  dessiner();
  requestAnimationFrame(boucle);
}

let niveauCourant = 0;
function lancerNiveau(n) {
  audio(); moteurArreter();

  for (const e of ecrans) $('#' + e).hidden = true;
  $('#bilan').hidden = true; $('#pause').hidden = true;

  $('#foin').hidden = !N.foin; $('#jauge').hidden = !N.remorque;
  $('#btn-klaxon').classList.remove('attire');
  // pastilles de la barre de progression
  const pr = $('#progres'); pr.querySelectorAll('i').forEach(i => i.remove());
  for (const v of [...R, P]) { const i = document.createElement('i'); i.style.background = v.coul; if (v === P) { i.style.width = i.style.height = '17px'; i.style.top = '0'; i.style.zIndex = 2; } pr.appendChild(i); v.point = i; }
  hudPlace = hudFoin = -1;
  majHud();
  const depart = () => {
    etat = 'decompte'; decompte = 3; SONS.decompte();
    afficherMessage(N.bonus ? t('bonusNom', { nom: N.nom }) : t('circuitNom', { n: n + 1, nom: N.nom }));
    message.t = 2.4;
  };
  const aMontrer = [];
  if (n === 0 || !sauve.vus.base) aMontrer.push('base');
  if (N.nouveau && N.nouveau !== 'base' && !sauve.vus[N.nouveau]) aMontrer.push(N.nouveau);
  if (n === 0 && sauve.vus.base && (sauve.etoiles[0] || 0) > 0) aMontrer.length = 0;   // déjà gagné : pas besoin de revoir
  const enchainer = () => { const k = aMontrer.shift(); if (k) montrerTuto(k, enchainer); else depart(); };
  etat = 'tuto';
  enchainer();
}
function niveauConseille() {
  for (let n = 0; n < NB_NORMAUX; n++) if (!(sauve.etoiles[n] >= 1)) return n;
  if (niveauOuvert(NB_NORMAUX) && !sauve.etoiles[NB_NORMAUX]) return NB_NORMAUX;
  for (let n = 0; n < NB_NORMAUX; n++) if (sauve.etoiles[n] < 3) return n;
  return NB_NORMAUX - 1;
}

    onNouvelle: () => lancerNiveau(niveauConseille())
  });
}

/* ---------- Bilan ---------- */
function montrerBilan() {
  etat = 'bilan';
  const n = niveauCourant, place = resultat.place;
  const avecFoin = C.foinTotal > 0 && C.N.foin > 0;
  const foinOk = !avecFoin || P.foin >= C.foinBut;
  let et;
  if (!avecFoin) et = place === 1 ? 3 : place === 2 ? 2 : place === 3 ? 1 : 0;
  else { et = place === 1 ? 2 : place <= 3 ? 1 : 0; if (et > 0 && foinOk) et++; }
  if (window.FMG) window.FMG.reportEnd({ completed: et > 0, level: n + 1 });
  const par = C.L / 235;
  const score = [600, 400, 250, 100][place - 1] + P.foin * 50 + Math.max(0, Math.round((par - resultat.temps) * 10));
  const totalAvant = totalEtoiles();
  const ancien = sauve.records[n] || 0;
  const record = score > ancien;
  if (record) sauve.records[n] = score;
  if (et > (sauve.etoiles[n] || 0)) sauve.etoiles[n] = et;
  enregistrer();
  const totalApres = totalEtoiles();

  $('#bilan-titre').textContent = t(place === 1 ? 'victoire' : place <= 3 ? 'bravo' : 'presque');
  $('#bilan-place').textContent = t('tuArrives', { p: t('ordinal.' + place) });
  const spans = $('#bilan-etoiles').children;
  for (let i = 0; i < 3; i++) { spans[i].className = ''; spans[i].style.animationDelay = (.3 + i * .35) + 's'; }
  for (let i = 0; i < et; i++) { spans[i].className = 'gagnee'; setTimeout(() => { if (etat === 'bilan') SONS.etoile(i); }, 300 + i * 350); }
  let stats = '';
  if (avecFoin) stats += t('statFoin', { nom: t(C.N.bonus ? 'raisins' : 'foin'), a: P.foin, b: C.foinTotal }) + (foinOk ? ' ✔' : ' ' + t('ilEnFallait', { n: C.foinBut })) + '<br>';
  stats += t('temps', { t: Number(resultat.temps.toFixed(1)) });
  if (et === 0) stats += '<br>' + t('top3');
  $('#bilan-stats').innerHTML = stats;
  // score qui défile
  const el = $('#bilan-score'), debut = performance.now();
  const defile = t => { const f = Math.min(1, (t - debut) / 1200); el.textContent = window.JEL_I18N.t('points', { n: Math.round(score * f) }); if (f < 1 && etat === 'bilan') requestAnimationFrame(defile); };
  requestAnimationFrame(defile);
  $('#bilan-record').textContent = record ? t('nouveauRecord') : t('recordPoints', { n: ancien });
  if (record && ancien > 0) setTimeout(() => SONS.record(), 1400);
  // déblocages
  const neufs = [];
  COULEURS.forEach((c, i) => { if (c.e > totalAvant && c.e <= totalApres) neufs.push(t('neufTracteur', { c: t('couleurMin.' + i) })); });
  for (const k of KLAXONS) if (k.e > totalAvant && k.e <= totalApres) neufs.push(t('neufKlaxon', { k: k.nom }));
  if (ETOILES_BONUS > totalAvant && ETOILES_BONUS <= totalApres) neufs.push(t('neufBonus'));
  let deb = neufs.length ? t('nouveauGarage', { liste: neufs.join(', ') }) : '';
  if (n === NB_NORMAUX - 1 && et > 0) deb = t('finiRallye') + ' ' + (totalApres >= ETOILES_BONUS ? t('essaieBonus') : t('gagnePourBonus', { n: ETOILES_BONUS })) + (deb ? ' ' + deb : '');
  $('#bilan-debloque').textContent = deb;
  if (et > 0) confettis(60); else SONS.perdu();
  const suivant = n + 1 < NIVEAUX.length && niveauOuvert(n + 1);
  // circuit réussi : on reprendra au suivant (ou au circuit conseillé s'il n'y en a pas d'ouvert)
  if (et > 0) JEL_SAVE.save(JEU, { niveau: (suivant ? n + 1 : niveauConseille()) + 1, score, etoiles: Object.assign({}, sauve.etoiles) });
  // Jeu terminé (les 13 circuits, bonus compris, gagnés au moins une fois) : total des meilleures étoiles.
  if (et > 0 && NIVEAUX.every((_, k) => (sauve.etoiles[k] || 0) >= 1)) { if (window.FMG) window.FMG.reportComplete({ stars: NIVEAUX.reduce((s, _, k) => s + Math.min(3, sauve.etoiles[k] || 0), 0), maxStars: NIVEAUX.length * 3 }); }
  $('#b-suivant').hidden = !suivant;
  $('#jauge').hidden = true;
  $('#bilan').hidden = false;
}

/* ---------- Pause ---------- */
function mettrePause() {
  if (!['course', 'decompte', 'arrivee'].includes(etat)) return;
  etatAvantPause = etat; etat = 'pause'; glisse = null; touches.g = touches.d = 0;
  if (AC) AC.suspend().catch(() => {});
  $('#pause').hidden = false;
}
function reprendre() {
  if (etat !== 'pause') return;
  etat = etatAvantPause; $('#pause').hidden = true;
  if (AC) AC.resume().catch(() => {});
  dernier = performance.now();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

/* =====================================================================
   CONTRÔLES : glisser le doigt (ou la souris), flèches du clavier
   ===================================================================== */
cv.addEventListener('pointerdown', e => {
  audio();
  if (etat !== 'course' && etat !== 'decompte') return;
  glisse = { id: e.pointerId, x: e.clientX, base: P.cible };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!glisse || glisse.id !== e.pointerId || !P) return;
  P.cible = glisse.base + (e.clientX - glisse.x) / K * 1.3;
});
const finGlisse = e => { if (glisse && glisse.id === e.pointerId) glisse = null; };
cv.addEventListener('pointerup', finGlisse);
cv.addEventListener('pointercancel', finGlisse);

function klaxonner() {
  if (etat !== 'course' || klaxonCd > 0) return;
  klaxonCd = .6; SONS.klaxon();
  afficherFlottant('♪ ♪', '#fff');
  for (const t of C.troupeaux) if (t.d > P.d - 60 && t.d < P.d + 800) t.boost = 2.5;
}
$('#btn-klaxon').addEventListener('pointerdown', e => { e.preventDefault(); audio(); klaxonner(); });

document.addEventListener('keydown', e => {
  const k = e.key;
  if (etat === 'tuto') { if (tutoFin) { audio(); tutoFin(); } e.preventDefault(); return; }
  if (k === 'Escape' || k === 'p' || k === 'P') { if (etat === 'pause') reprendre(); else mettrePause(); e.preventDefault(); return; }
  if (k === 'ArrowLeft' || k === 'q' || k === 'a') { touches.g = 1; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd') { touches.d = 1; e.preventDefault(); }
  if ((k === ' ' || k === 'h' || k === 'k') && etat === 'course') { audio(); klaxonner(); e.preventDefault(); }
  if (k === 'Enter' && !$('#accueil').hidden) { audio(); jouer(); }
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'q' || e.key === 'a') touches.g = 0;
  if (e.key === 'ArrowRight' || e.key === 'd') touches.d = 0;
});

// Boutons
const sur = (id, f) => $(id).addEventListener('click', () => { audio(); SONS.clic(); f(); });
sur('#btn-jouer', jouer);
// « Effacer la sauvegarde » sous le bouton Jouer (caché sans sauvegarde)
effacerSauvegarde = JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('#accueil .boutons') });
$('#btn-jouer').after(effacerSauvegarde);
sur('#btn-carte', () => montrerEcran('carte'));
sur('#btn-garage', () => montrerEcran('garage'));
sur('#carte-retour', () => montrerEcran('accueil'));
sur('#garage-retour', () => montrerEcran('accueil'));
sur('#btn-pause', mettrePause);
$('#btn-son').addEventListener('click', basculerSon);
$('#btn-son-a').addEventListener('click', basculerSon);
$('#p-reprendre').addEventListener('click', () => { reprendre(); SONS.clic(); });
$('#p-recommencer').addEventListener('click', () => { $('#pause').hidden = true; if (AC) AC.resume().catch(() => {}); lancerNiveau(niveauCourant); });
$('#p-accueil').addEventListener('click', () => { $('#pause').hidden = true; allerAccueil(); });
sur('#b-suivant', () => lancerNiveau(niveauCourant + 1));
sur('#b-rejouer', () => lancerNiveau(niveauCourant));
sur('#b-carte', () => { allerAccueil(); montrerEcran('carte'); });

// Démarrage : démonstration silencieuse derrière l'écran d'accueil
redimensionner();
majSon();
allerAccueil();
requestAnimationFrame(boucle);
</script>
