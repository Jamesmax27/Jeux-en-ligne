  "tuto.avancer.texte": "Hold your finger down (or Space) to move. A breath, trembling candles, a pounding heart: it's about to open its eyes. Let go before it does.",

  "carnet.1": "Day 1. The house was for sale for almost nothing. Now I know why: something walks behind me. It only moves when I move.",
  "carnet.2": "I found a key in the dining room. Every door in this house is locked from the inside.",

<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  function appliquer(racine) {
    racine = racine || document;

      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],

      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],

    ];

      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }

        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }

      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }

    try {
      var adresse = new URL(location.href);

  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +

    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });

      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });

    document.addEventListener('pointerdown', function (e) {

    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {

    var ok = false;
    if (direct) {

      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.

    try { texte = JSON.stringify(tout); } catch (e) { return false; }

      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }

    }

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });

    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060c; color: #ece4d2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  button { font: inherit; color: inherit; cursor: pointer; min-height: 44px; min-width: 44px;

    padding: 10px 18px; font-size: 17px; font-weight: 600; letter-spacing: .01em; transition: transform .12s, background .2s; }
  button:hover, button:focus-visible { background: rgba(60,40,70,.92); border-color: #ffb36b; outline: none; }
  button:active { transform: scale(.96); }

  button.rond { width: 48px; height: 48px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }

  /* Barre du haut pendant la partie */
  #hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px;
    padding: calc(8px + env(safe-area-inset-top)) 10px 8px; pointer-events: none; z-index: 5; }
  #hud > * { pointer-events: auto; }
  #hudCentre { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; pointer-events: none; }
  #hudNom { font-size: 14px; opacity: .85; text-align: center; text-shadow: 0 1px 3px #000; white-space: normal; }
  #hudPas { display: flex; gap: 4px; align-items: center; }
  #hudPas span { width: 20px; height: 24px; display: inline-block; }
  #hudPas svg { width: 100%; height: 100%; fill: #ece4d2; filter: drop-shadow(0 0 4px rgba(255,220,170,.6)); transition: fill .3s, opacity .3s; }
  #hudPas span.perdu svg { fill: #9b2330; opacity: .55; filter: none; }
  #hudBas { display: flex; gap: 8px; align-items: center; }
  #flamme { width: 110px; height: 10px; border-radius: 6px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,190,120,.45); overflow: hidden; }
  #flammeBarre { height: 100%; width: 100%; background: linear-gradient(90deg,#ff6a2a,#ffd27a); transition: width .2s linear; }
  #flamme.vide { border-color: #d8333f; animation: clignote .6s infinite alternate; }
  #hudCle { width: 22px; height: 22px; opacity: .25; }
  #hudCle.pris { opacity: 1; filter: drop-shadow(0 0 5px #ffd35a); }
  #hudCle svg { width: 100%; height: 100%; fill: #ffcf5a; }
  @keyframes clignote { to { opacity: .45; } }

  /* Zone d'appui (repère visuel : tout l'écran sert à appuyer) */
  #pad { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 4; opacity: .9; }
  #padRond { width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(236,228,210,.5); display: flex; align-items: center; justify-content: center; background: rgba(10,8,16,.45); transition: transform .1s, background .1s, border-color .1s; }
  #padRond svg { width: 38px; height: 38px; fill: rgba(236,228,210,.85); }
  #pad.appuye #padRond { transform: scale(.88); background: rgba(255,140,60,.3); border-color: #ffb36b; }
  #padTexte { font-size: 13px; text-shadow: 0 1px 3px #000; opacity: .8; text-align: center; max-width: 80vw; }
  #indice { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 4; pointer-events: none;
    font-size: 19px; font-weight: 700; text-align: center; max-width: 92vw; text-shadow: 0 2px 8px #000, 0 0 2px #000; opacity: 0; transition: opacity .25s; }
  #indice.vu { opacity: 1; }
  #indice.danger { color: #ff8c8c; }
  #banniere { position: fixed; left: 0; right: 0; top: 34%; text-align: center; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .6s; }
  #banniere.vu { opacity: 1; }
  #banniereEtage { font-size: 15px; letter-spacing: .25em; text-transform: uppercase; color: #ffb36b; }
  #banniereNom { font-size: 28px; font-weight: 700; margin-top: 6px; text-shadow: 0 2px 10px #000; padding: 0 12px; }

  /* Écrans */
  .ecran { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(8,6,14,.35), rgba(4,3,8,.82)); overflow-y: auto; touch-action: pan-y; }
  .carte { width: min(94vw, 520px); max-height: 94vh; overflow-y: auto; background: rgba(16,12,24,.94); border: 2px solid rgba(255,179,107,.35);
    border-radius: 20px; padding: 20px 18px; text-align: center; box-shadow: 0 12px 60px rgba(0,0,0,.7); }
  .carte h2 { margin: 0 0 10px; font-size: 26px; }
  .carte p { margin: 8px 0; line-height: 1.4; }
  .ligne { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  #ecranTitre { background: linear-gradient(180deg, rgba(4,3,8,.55) 0%, rgba(4,3,8,.15) 40%, rgba(4,3,8,.75) 100%); align-items: flex-end; }
  .titreBloc { text-align: center; max-width: 560px; padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .titreBloc h1 { font-size: clamp(38px, 10vw, 68px); margin: 0; line-height: 1; letter-spacing: .02em;
    color: #f2ead8; text-shadow: 0 0 18px rgba(255,140,60,.55), 0 4px 0 #2b0d12, 0 6px 20px #000; }
  .age { display: inline-block; margin: 10px 0 4px; padding: 4px 12px; border-radius: 999px; border: 1px solid #ff8c8c; color: #ffb0b0; font-size: 14px; background: rgba(40,8,12,.6); }
  .consigne { font-size: 17px; line-height: 1.4; margin: 10px auto 16px; max-width: 460px; text-shadow: 0 1px 4px #000; }
  #ecranTitre .ligne button { font-size: 16px; }
  .grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 6px 0 14px; }
  .etageTitre { grid-column: 1 / -1; text-align: left; font-size: 14px; color: #ffb36b; letter-spacing: .12em; text-transform: uppercase; margin-top: 6px; }
  .grille button { padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 18px; min-height: 58px; }
  .grille button .et { font-size: 11px; color: #ffd27a; letter-spacing: 1px; }
  .grille button[disabled] { opacity: .4; cursor: default; }
  .grille button svg { width: 18px; height: 18px; }
  .etoiles { font-size: 40px; letter-spacing: 6px; margin: 4px 0 6px; }
  .etoiles span { display: inline-block; color: #3a3346; transform: scale(.6); transition: transform .35s cubic-bezier(.3,1.8,.5,1), color .3s; }
  .etoiles span.on { color: #ffd35a; transform: scale(1); text-shadow: 0 0 14px rgba(255,211,90,.8); }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; text-align: left; margin: 8px auto; max-width: 340px; font-size: 16px; }
  .stats b { text-align: right; }
  .score { font-size: 30px; font-weight: 800; color: #ffd27a; margin: 6px 0 0; }
  .record { color: #8fe3a8; font-weight: 700; min-height: 1.3em; }
  .carnets { text-align: left; display: flex; flex-direction: column; gap: 10px; margin: 8px 0; }
  .carnets .page { background: rgba(232,220,190,.08); border-left: 3px solid #c9a36a; padding: 8px 10px; border-radius: 6px; font-style: italic; line-height: 1.4; }
  .carnets .page.ferme { font-style: normal; opacity: .45; }
  .compte { display: flex; gap: 18px; justify-content: center; font-size: 16px; margin: 6px 0; }
  #tuto .carte { border-color: rgba(207,230,255,.45); }
  #tutoCanvas { width: 100%; max-width: 320px; height: 170px; display: block; margin: 4px auto 8px; border-radius: 12px; background: #0b0912; }
  #tutoTexte { font-size: 17px; }
  .petit { font-size: 13px; opacity: .7; }
  #fond-attrape { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  .jel-langue { display: inline-block; }
  html.affiche .jel-langue, html.affiche .ecran, html.affiche #hud, html.affiche #pad { display: none !important; }
</style>
</head>

    { mur: '#4d5a45', motif: '#66745a', lambris: '#3b2a1f', sol: '#4a3324', ombre: 0.5, lumiere: [255, 170, 90] },
    { mur: '#465572', motif: '#5f6f90', lambris: '#7f7a70', sol: '#55402e', ombre: 0.55, lumiere: [255, 180, 110] },
    { mur: '#5a4634', motif: '#6e5741', lambris: '#3f3024', sol: '#4f3b29', ombre: 0.56, lumiere: [255, 175, 100] },
    { mur: '#4c4846', motif: '#5f5a56', lambris: '#3a3532', sol: '#3d3835', ombre: 0.62, lumiere: [255, 150, 80] },

    ['fenetre', 'tableau', 'horloge', 'canape', 'cheminee', 'console', 'tableau'],
    ['lit', 'cheval', 'armoire', 'fenetre', 'cubes', 'tableau', 'lit'],
    ['malle', 'drap', 'lucarne', 'mannequin', 'malle', 'drap'],
    ['tonneau', 'bocaux', 'chaudiere', 'tonneau', 'bocaux', 'grille'],
  ];

  // Hasard reproductible (décor de chaque pièce)

  const dans = (zones, x, marge) => zones.some(([a, b]) => x >= a - (marge || 0) && x <= b + (marge || 0));
  const decorCache = {};

  (function charger() {
    let d = null;
    try { d = window.JEL_SAVE ? window.JEL_SAVE.load(JEU) : null; } catch (e) { d = null; }

  function calculerDeblocage() {

  function donneesSauvegarde(niveau) {

  function majBoutonsSon() {

  // ------------------------------------------------------------------------

  const cv = $('scene'), ctx = cv.getContext('2d');

  // ------------------------------------------------------------------------
  // État d'une partie (sert aussi à la scène de l'écran titre)
  // ------------------------------------------------------------------------
  function nouvelleScene(n) {
    const p = NIVEAUX[n];
    return {
      n, p, x: 0.6, v: 0, marche: 0, pasCompte: 0, pas: p.pas, dist: p.pas * PAS_M, temps: p.temps, ticFlamme: 0,

      items: p.items.map((o) => Object.assign({ pris: false, prog: 0 }, o)),
      cle: false, recul: 0, noirV: dans(p.noirs, 0.6) ? 1 : 0, coeur: 0, flash: 0, secousse: 0, grinceTm: 0, grinceFlash: 0,
      sortie: 0, attrape: 0, fin: null, temps0: 0, erreurs: 0, particules: [], miroirV: 0, regardMiroir: 0, bloqueCle: false,
      dejaBouge: false, gouttesTm: 2, ventTm: 3, sonsMuets: [],
    };
  }
  function alea(intervalle) { return intervalle[0] + Math.random() * (intervalle[1] - intervalle[0]); }

  let S = nouvelleScene(0);       // scène affichée
  let ecran = 'titre';            // titre | jeu | pause | tuto | fin
  let enPartie = false;           // une partie est en cours (sauvegarde à la fermeture)
  let tenir = false;              // le joueur appuie
  const pointeurs = new Set();
  const tutosVus = new Set();
  let horloge = 0;                // temps qui passe pour les animations (s)
  let fige = false;               // images du jeu : partie figée

  // ------------------------------------------------------------------------
  // Logique de la partie
  // ------------------------------------------------------------------------
  function dansMiroir(s) { return dans(s.p.miroirs, s.x); }
  function majChose(s, dt) {
    const c = s.chose, p = s.p;
    c.tm += dt;
    const miroir = dansMiroir(s);
    if (c.phase === 'calme' && c.tm >= c.duree) {
      c.tm = 0;
      if (c.rapide) { c.phase = 'alerte'; c.duree = 0.55; c.rapide = false; c.coeurTm = 0; signes(s, true); }
      else if (Math.random() < p.faux) { c.phase = 'faux'; c.duree = p.alerte * (0.9 + Math.random() * 0.3); signes(s, false); }
      else { c.phase = 'alerte'; c.duree = p.alerte * (0.85 + Math.random() * 0.3); c.coeurTm = 0; signes(s, true); }
    } else if (c.phase === 'alerte' && c.tm >= c.duree) {
      c.phase = 'regard'; c.tm = 0; c.duree = p.regard * (0.85 + Math.random() * 0.3); Son.yeux();
    } else if (c.phase === 'faux' && c.tm >= c.duree) {
      c.phase = 'calme'; c.tm = 0; c.duree = alea(p.calme);
    } else if (c.phase === 'regard' && c.tm >= c.duree) {
      c.phase = 'calme'; c.tm = 0;
      Son.osc('sine', 320, 0.35, 0.05, 170);   // elle referme les yeux (utile dans le noir)
      if (Math.random() < p.double) { c.duree = 0.45; c.rapide = true; } else c.duree = alea(p.calme);
    }
    c.yeux += ((c.phase === 'regard' ? 1 : 0) - c.yeux) * Math.min(1, dt * 14);
    // Battement du cœur : seulement avant un vrai regard (et jamais devant un miroir)
    if (c.phase === 'alerte') {
      c.coeurTm -= dt;
      if (c.coeurTm <= 0) {
        const avance = c.tm / c.duree;
        c.coeurTm = 0.55 - avance * 0.3;
        if (!miroir) { Son.coeur(avance > 0.5); s.coeur = 1; legende(s, 'coeur'); }
      }
    }
    s.regardMiroir = miroir ? (c.phase === 'alerte' ? Math.min(1, c.tm / c.duree) : c.phase === 'regard' ? 1 : 0) : 0;
  }
  // Souffle et bougies : vrais signes et faux signes
  function signes(s, vrai) {
    Son.souffle(); legende(s, 'souffle');
    s.souffleTm = 1.3;
    const px = s.x - s.dist + 0.45;
    for (let i = 0; i < 14; i++) s.particules.push({ x: px + Math.random() * 0.3, y: 2.6 + Math.random() * 0.2, vx: 0.6 + Math.random() * 0.8, vy: -0.05 + Math.random() * 0.12, vie: 0, max: 1.6 + Math.random() * 0.8, type: 'brume' });
    if (!vrai && s.p.faux > 0.5 && Math.random() < 0.6) Son.vent();
  }
  function majPoupee(s, dt) {
    const d = s.poupee, q = s.p.poupee;
    if (!d) return;
    d.tm += dt;
    if (d.phase === 'calme' && d.tm >= d.duree) { d.phase = 'alerte'; d.tm = 0; d.duree = q.alerte * (0.85 + Math.random() * 0.3); d.note = 0; d.noteTm = 0; }
    else if (d.phase === 'alerte' && d.tm >= d.duree) { d.phase = 'regard'; d.tm = 0; d.duree = q.regard * (0.85 + Math.random() * 0.3); Son.osc('triangle', 1975, 0.6, 0.06); Son.osc('sine', 98, 0.6, 0.1); }
    else if (d.phase === 'regard' && d.tm >= d.duree) { d.phase = 'calme'; d.tm = 0; d.duree = alea(q.calme); }
    if (d.phase === 'alerte') {
      d.noteTm -= dt;
      if (d.noteTm <= 0) { d.noteTm = 0.2; Son.boite(d.note++); legende(s, 'boite'); }
    }
    const but = d.phase === 'calme' ? 0 : d.phase === 'alerte' ? Math.min(1, d.tm / d.duree) : 1;
    d.tete += (but - d.tete) * Math.min(1, dt * 6);

  }
  let cooldownErreur = 0;
  function erreur(s, cause) {
    if (cooldownErreur > 0) return;
    cooldownErreur = 1.1;
    s.pas--; s.erreurs++;
    s.secousse = 0.55; s.flash = 1;
    Son.erreur();
    try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) { /* rien */ }
    if (s.pas <= 0) { attraper(s); return; }
    indice(t(cause === 'poupee' ? 'indPoupeeVu' : cause === 'flamme' ? 'indFlamme' : 'indVu'), 1.6, true);
  }
  function majPartie(dt) {
    const s = S, p = s.p;
    if (s.fin) { majFin(s, dt); return; }
    s.temps0 += dt;
    cooldownErreur = Math.max(0, cooldownErreur - dt);
    // Mouvement du joueur
    const pousse = tenir;
    if (pousse && !s.bloqueCle) s.v = s.v < VMIN ? VMIN : Math.min(VMAX, s.v + ACCEL * dt);
    else s.v = Math.max(0, s.v - FREIN * dt);
    let nx = s.x + s.v * dt;
    // Clé : on s'arrête de force dessus tant qu'on ne l'a pas prise
    s.bloqueCle = false;
    s.items.forEach((o) => { if (o.type === 'cle' && !o.pris && s.x <= o.x && nx >= o.x) { nx = o.x; s.v = 0; s.bloqueCle = true; } });
    if (s.bloqueCle && pousse) indice(t('indCle'), 0.3);
    const dx = nx - s.x; s.x = nx;
    if (dx > 0 && !s.dejaBouge) s.dejaBouge = true;
    s.marche += dx * 3.2;
    s.pasCompte += dx;
    const surGrince = dans(p.grinc, s.x);
    if (s.pasCompte > 0.55) { s.pasCompte = 0; Son.pas(surGrince && s.v > SEUIL_GRINCE); }
    // Planches qui grincent
    s.grinceTm -= dt; s.grinceFlash = Math.max(0, s.grinceFlash - dt * 2);
    if (surGrince && s.v > SEUIL_GRINCE && s.grinceTm <= 0) {
      s.grinceTm = 1.2; s.grinceFlash = 1; Son.grince(); legende(s, 'grince');
      const c = s.chose;
      if (c.phase === 'calme' || c.phase === 'faux') { c.phase = 'alerte'; c.tm = 0; c.duree = 0.7; c.coeurTm = 0; Son.souffle(); }
      else if (c.phase === 'alerte') c.duree = Math.min(c.duree, c.tm + 0.5);
      indice(t('indGrince'), 1.4, true);
    }
    // Regards
    majChose(s, dt);
    majPoupee(s, dt);
    const bouge = s.v > 0.12;
    if (s.chose.phase === 'regard' && s.chose.tm > GRACE && bouge) erreur(s, 'chose');
    if (s.poupee && s.poupee.phase === 'regard' && s.poupee.tm > GRACE && bouge) erreur(s, 'poupee');
    if (s.fin) return;
    // Objets : rester immobile dessus
    s.items.forEach((o) => {
      if (o.pris) return;
      if (Math.abs(s.x - o.x) < 0.5 && s.v < 0.05 && !tenir) {
        o.prog += dt / TEMPS_RAMASSER;
        if (o.prog >= 1) prendre(s, o);
      } else o.prog = Math.max(0, o.prog - dt * 2);

    // Flamme
    s.temps = Math.max(0, s.temps - dt);
    if (s.temps <= 0) {
      s.ticFlamme += dt;
      if (s.ticFlamme >= TIC_FLAMME) { s.ticFlamme = 0; cooldownErreur = 0; Son.flamme(); erreur(s, 'flamme'); }
    }
    // Noir total
    s.noirV += ((dans(p.noirs, s.x) ? 1 : 0) - s.noirV) * Math.min(1, dt * 2.5);
    if (dans(p.noirs, s.x) && !s.dansNoirVu) { s.dansNoirVu = true; Son.flamme(); indice(t('indNoir'), 2.2); }
    // Distance affichée de la Chose
    s.dist += (s.pas * PAS_M - s.dist) * Math.min(1, dt * 7);
    s.coeur = Math.max(0, s.coeur - dt * 2.6);
    s.flash = Math.max(0, s.flash - dt * 2.5);
    s.secousse = Math.max(0, s.secousse - dt);
    // Ambiance
    if (p.etage === 3) { s.gouttesTm -= dt; if (s.gouttesTm <= 0) { s.gouttesTm = 1.5 + Math.random() * 3; Son.goutte(); } }
    if (p.etage === 2) { s.ventTm -= dt; if (s.ventTm <= 0) { s.ventTm = 6 + Math.random() * 6; Son.vent(); } }
    // Indices du début
    if (s.n === 0 && !s.dejaBouge && s.temps0 > 0.5) indice(t('indAppuie'), 0.3);
    if (s.n <= 1 && s.chose.phase === 'regard') indice(t('indFige'), 0.3, true);
    // Porte
    if (s.x >= p.L - 0.4) gagner(s);
    majParticules(s, dt);
    majHud();
  }
  function prendre(s, o) {
    o.pris = true;

    else if (o.type === 'lampe') { s.temps = Math.min(s.p.temps, s.temps + 15); s.ticFlamme = 0; Son.ramasse(); indice(t('indLampe'), 1.4); }
    else { Son.ramasse(); indice(t('indCarnet'), 1.4); }
    for (let i = 0; i < 18; i++) s.particules.push({ x: o.x, y: 0.4, vx: (Math.random() - 0.5) * 2, vy: 1 + Math.random() * 2, vie: 0, max: 0.9 + Math.random() * 0.5, type: 'etincelle' });
  }
  function majParticules(s, dt) {
    s.particules = s.particules.filter((q) => { q.vie += dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.type === 'etincelle') q.vy -= 3 * dt; return q.vie < q.max; });

  function gagner(s) {

  }
  function attraper(s) {

    }
  }

  // Légendes visuelles des sons quand le son est coupé (noir total, miroirs)
  function legende(s, type) { if (!prog.son) s.sonsMuets.push({ type, vie: 0 }); }

  // ------------------------------------------------------------------------
  // HUD et messages
  // ------------------------------------------------------------------------
  const SVG_PAS = '<svg viewBox="0 0 20 24"><ellipse cx="10" cy="15" rx="5.5" ry="7.5"/><circle cx="5" cy="5" r="2"/><circle cx="9" cy="3.2" r="2"/><circle cx="13.2" cy="4" r="1.8"/><circle cx="16" cy="7" r="1.6"/></svg>';
  let hudPasCompte = -1;
  function preparerHud() {
    const p = S.p, box = $('hudPas');
    box.innerHTML = '';
    for (let i = 0; i < p.pas; i++) { const sp = document.createElement('span'); sp.innerHTML = SVG_PAS; box.appendChild(sp); }
    hudPasCompte = -1;
    $('hudNom').textContent = t('pieceNum', { n: S.n + 1, nom: t('piece.' + (S.n + 1)) });
    $('hudCle').classList.toggle('cache', !p.aCle);
    $('padTexte').textContent = t('pad');
    majHud();
  }
  function majHud() {
    const s = S;
    if (hudPasCompte !== s.pas) {
      hudPasCompte = s.pas;
      [...$('hudPas').children].forEach((sp, i) => sp.classList.toggle('perdu', i >= s.pas));
      $('hudPas').setAttribute('aria-label', t('pasRestants', { n: Math.max(0, s.pas) }));
    }
    $('flammeBarre').style.width = (100 * s.temps / s.p.temps).toFixed(1) + '%';
    $('flamme').classList.toggle('vide', s.temps <= 0);
    $('hudCle').classList.toggle('pris', s.cle);
    $('pad').classList.toggle('appuye', tenir);
  }
  let indiceTm = 0;
  function indice(texte, duree, danger) {
    const el = $('indice');
    if (el.textContent !== texte) el.textContent = texte;
    el.classList.add('vu'); el.classList.toggle('danger', !!danger);
    indiceTm = Math.max(indiceTm, duree);
  }
  function majIndice(dt) { if (indiceTm > 0) { indiceTm -= dt; if (indiceTm <= 0) $('indice').classList.remove('vu'); } }
  let banniereTimer = null;
  function banniere(etage, nom) {
    $('banniereEtage').textContent = etage; $('banniereNom').textContent = nom;

    clearTimeout(banniereTimer);
    banniereTimer = setTimeout(() => $('banniere').classList.remove('vu'), 2200);
  }

  // ------------------------------------------------------------------------
  // Écrans
  // ------------------------------------------------------------------------
  const ECRANS = ['ecranTitre', 'ecranNiveaux', 'ecranCarnets', 'tuto', 'ecranPause', 'ecranVictoire', 'ecranDefaite', 'ecranFin'];
  function montrer(id) {
    ECRANS.forEach((e) => $(e).classList.toggle('cache', e !== id));
    const jeu = id === null || id === 'tuto' || id === 'ecranPause';
    $('hud').classList.toggle('cache', !jeu || id === 'tuto');
    $('pad').classList.toggle('cache', id !== null);
    if (id) { const b = $(id).querySelector('button.gros, button'); if (b && !('ontouchstart' in window)) setTimeout(() => { try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }, 30); }
  }
  function allerTitre() {
    ecran = 'titre'; enPartie = false; Son.stopAmbiance();
    S = nouvelleScene(0); S.x = 5.5; S.titre = true;
    montrer('ecranTitre');
    majEffacer();
  }
  let boutonEffacerTitre = null;
  function majEffacer() {
    if (!window.JEL_SAVE || !window.JEL_SAVE.boutonEffacer) return;
    if (!boutonEffacerTitre) boutonEffacerTitre = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('effacerTitre'), apres: () => { prog.etoiles.fill(0); prog.records.fill(0); prog.trouves = {}; prog.debloque = 0; } });
    else if (boutonEffacerTitre.maj) boutonEffacerTitre.maj();
  }
  function ouvrirNiveaux() {
    Son.init(); Son.clic();
    const g = $('grilleNiveaux'); g.innerHTML = '';
    const cadenas = '<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/></svg>';
    for (let i = 0; i < NB; i++) {
      if (i % 5 === 0) { const h = document.createElement('div'); h.className = 'etageTitre'; h.textContent = t('etage.' + NIVEAUX[i].etage); g.appendChild(h); }
      const b = document.createElement('button'); b.type = 'button';
      const ouvert = i <= prog.debloque;
      b.disabled = !ouvert;
      const e = prog.etoiles[i];
      b.innerHTML = ouvert ? '<span>' + JEL_I18N.nombre(i + 1) + '</span><span class="et">' + '★'.repeat(e) + '<span style="opacity:.3">' + '★'.repeat(3 - e) + '</span></span>' : cadenas;
      b.setAttribute('aria-label', ouvert ? t('pieceAria', { n: i + 1, nom: t('piece.' + (i + 1)), e }) : t('pieceFermee', { n: i + 1 }));

  function ouvrirCarnets() {
    Son.init(); Son.clic();

    let lampes = 0, cles = 0, carnets = 0;
    NIVEAUX.forEach((p) => p.items.forEach((o) => {
      const vu = !!prog.trouves[o.id];
      if (o.type === 'lampe' && vu) lampes++;
      if (o.type === 'cle' && vu) cles++;
      if (o.type === 'carnet') {
        if (vu) carnets++;
        const d = document.createElement('div'); d.className = 'page' + (vu ? '' : ' ferme');
        d.textContent = vu ? t('carnet.' + o.page) : t('carnetFerme', { n: o.page });
        liste.appendChild(d);
      }
    }));
    $('compteObjets').textContent = t('compteCarnets', { n: carnets, max: nbCarnets }) + ' · ' + t('compteLampes', { n: lampes, max: nbLampes }) + ' · ' + t('compteCles', { n: cles, max: nbCles });

  }

  // Lancement d'une pièce
  function lancerNiveau(n) {
    Son.init();
    n = Math.max(0, Math.min(NB - 1, n));
    S = nouvelleScene(n);
    enPartie = true; tenir = false; pointeurs.clear(); cooldownErreur = 0;
    preparerHud();
    const p = S.p;
    if (n % 5 === 0) banniere(t('etage.' + p.etage), t('pieceNum', { n: n + 1, nom: t('piece.' + (n + 1)) }));
    else banniere('', t('pieceNum', { n: n + 1, nom: t('piece.' + (n + 1)) }));
    Son.ambiance(p.etage);
    if (p.tuto && !tutosVus.has(p.tuto)) ouvrirTuto(p.tuto);
    else { ecran = 'jeu'; montrer(null); }
  }

  // Tutoriels animés
  let tutoType = null;
  function ouvrirTuto(type) {
    tutoType = type; tutosVus.add(type);

    $('tutoTexte').textContent = t('tuto.' + type + '.texte');

  }
  function fermerTuto() { if (ecran !== 'tuto') return; Son.clic(); ecran = 'jeu'; montrer(null); }
  let tutoT0 = 0;

  function pause() {
    if (ecran !== 'jeu' || S.fin) return;
    ecran = 'pause'; tenir = false; pointeurs.clear(); montrer('ecranPause');

  }
  function reprendre() {
    if (ecran !== 'pause') return;
    if (Son.ctx) { try { Son.ctx.resume(); } catch (e) { /* rien */ } }

  }

  function etoilesDe(s) { const perdus = s.p.pas - s.pas; return perdus <= 0 ? 3 : perdus <= 2 ? 2 : 1; }
  function montrerVictoire(s) {
    const n = s.n, et = etoilesDe(s);
    const objets = s.items.filter((o) => o.pris).length;
    const score = s.pas * 200 + objets * 100 + Math.round(s.temps) * 10;
    const ancien = prog.records[n];
    const nouveauRecord = score > ancien;
    prog.etoiles[n] = Math.max(prog.etoiles[n], et);
    if (nouveauRecord) prog.records[n] = score;
    s.items.forEach((o) => { if (o.pris) prog.trouves[o.id] = 1; });
    prog.debloque = Math.max(prog.debloque, Math.min(NB - 1, n + 1));
    enPartie = false;
    sauver(n + 2 > NB ? NB : n + 2);
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
    if (prog.etoiles.every((e) => e > 0)) { if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NB * 3 }); }
    Son.stopAmbiance();
    const spans = $('etoilesVictoire').children;
    [...spans].forEach((sp) => sp.classList.remove('on'));
    for (let i = 0; i < et; i++) setTimeout(() => { spans[i].classList.add('on'); Son.osc('sine', 660 + i * 220, 0.4, 0.08); }, 350 + i * 320);
    $('statsVictoire').innerHTML = '';
    ligneStat('statsVictoire', t('statPas'), t('surMax', { n: s.pas, max: s.p.pas }));
    if (s.items.length) ligneStat('statsVictoire', t('statObjets'), t('surMax', { n: objets, max: s.items.length }));
    ligneStat('statsVictoire', t('statFlamme'), t('secondes', { n: Math.round(s.temps) }));
    compteur($('scoreVictoire'), score);
    $('recordVictoire').textContent = nouveauRecord ? t('nouveauRecord') : t('record', { n: ancien });
    $('bSuivant').textContent = n + 1 >= NB ? t('sortir') : t('suivant');
    ecran = 'fin'; montrer('ecranVictoire');
  }
  function montrerDefaite(s) {
    enPartie = false;
    sauver(s.n + 1);
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: s.n + 1 });
    Son.stopAmbiance();
    $('texteDefaite').textContent = t(s.x > s.p.L * 0.75 ? 'defaitePres' : 'defaiteTexte', { m: Math.max(1, Math.round(s.p.L - s.x)) });
    $('statsDefaite').innerHTML = '';

    g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.arc(mx, my, 28, 0, 7); g.fill();
    g.strokeStyle = pr ? '#ffb36b' : 'rgba(255,255,255,.5)'; g.lineWidth = 4; g.beginPath(); g.arc(mx, my, 28, 0, 7); g.stroke();
    g.fillStyle = '#ece4d2'; g.fillRect(mx - 6, my - 40 + pr * 22, 12, 34); g.beginPath(); g.arc(mx, my - 40 + pr * 22, 6, 0, 7); g.fill(); g.fillRect(mx - 14, my - 10 + pr * 22, 28, 22);
  }

  // ------------------------------------------------------------------------
  // Écran titre : la Chose respire derrière toi
  // ------------------------------------------------------------------------
  function majTitre(dt) {
    const s = S, c = s.chose;
    c.tm += dt;
    if (c.phase === 'calme' && c.tm > 3.5) { c.phase = 'alerte'; c.tm = 0; signes(s, true); }
    else if (c.phase === 'alerte' && c.tm > 1.4) { c.phase = 'regard'; c.tm = 0; }
    else if (c.phase === 'regard' && c.tm > 1.8) { c.phase = 'calme'; c.tm = 0; }
    c.yeux += ((c.phase === 'regard' ? 1 : 0) - c.yeux) * Math.min(1, dt * 10);
    s.dist = 2.6; s.v = 0;
    majParticules(s, dt);
  }

  // ------------------------------------------------------------------------
  // Affiche du jeu (jaquette) : composition plein écran, sans interface
  // ------------------------------------------------------------------------
  function dessinerAffiche() {
    const k = Math.min(W / 3.2, H / 4.4);
    // Fond : salon au clair de lune
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2a3150'); g.addColorStop(0.7, '#3a3a52'); g.addColorStop(1, '#1c1420');
    rect(0, 0, W, H, g);
    const sol = H * 0.8;
    // Grande fenêtre et lune
    const fx = W * 0.72, fy = H * 0.08, fw = W * 0.42, fh = H * 0.5;
    rect(fx - fw / 2 - 10, fy - 10, fw + 20, fh + 20, '#1a1218');
    const gf = ctx.createLinearGradient(0, fy, 0, fy + fh); gf.addColorStop(0, '#9db4ec'); gf.addColorStop(1, '#3a4c80');
    rect(fx - fw / 2, fy, fw, fh, gf);
    const gl = ctx.createRadialGradient(fx + fw * 0.15, fy + fh * 0.25, 0, fx + fw * 0.15, fy + fh * 0.25, fw * 0.5);
    gl.addColorStop(0, 'rgba(255,255,255,1)'); gl.addColorStop(0.18, 'rgba(240,246,255,.95)'); gl.addColorStop(0.22, 'rgba(200,215,255,.5)'); gl.addColorStop(1, 'rgba(160,180,255,0)');
    ctx.fillStyle = gl; ctx.fillRect(fx - fw / 2, fy, fw, fh);
    rect(fx - 4, fy, 8, fh, '#1a1218'); rect(fx - fw / 2, fy + fh * 0.48, fw, 8, '#1a1218');
    // Arbres derrière la vitre
    ctx.fillStyle = 'rgba(20,24,40,.85)';
    for (let i = 0; i < 5; i++) { ctx.beginPath(); const bx = fx - fw / 2 + i * fw / 4; ctx.moveTo(bx, fy + fh); ctx.lineTo(bx + 8, fy + fh * (0.35 + (i % 2) * 0.15)); ctx.lineTo(bx + 16, fy + fh); ctx.fill(); }
    // Rideaux
    ctx.fillStyle = '#6a1f2e'; ctx.beginPath(); ctx.moveTo(fx - fw / 2 - 40, fy - 20); ctx.lineTo(fx - fw / 2 + 40, fy - 20); ctx.quadraticCurveTo(fx - fw / 2 + 5, fy + fh * 0.6, fx - fw / 2 + 20, sol); ctx.lineTo(fx - fw / 2 - 40, sol); ctx.fill();
    // Mur à médaillons
    ctx.fillStyle = 'rgba(120,140,110,.35)';
    for (let x = 0; x < W; x += 54) for (let y = 30; y < sol - 120; y += 60) { if (x > fx - fw / 2 - 60 && x < fx + fw / 2 + 20 && y < fy + fh + 20) continue; ctx.beginPath(); ctx.moveTo(x + ((y / 60) % 2) * 27, y - 12); ctx.lineTo(x + 8 + ((y / 60) % 2) * 27, y); ctx.lineTo(x + ((y / 60) % 2) * 27, y + 12); ctx.lineTo(x - 8 + ((y / 60) % 2) * 27, y); ctx.fill(); }
    rect(0, sol - 120, W, 120, '#3b2a1f'); rect(0, sol - 120, W, 5, 'rgba(255,230,190,.2)');
    // Sol
    rect(0, sol, W, H - sol, '#4a3324'); for (let x = 0; x < W; x += 70) rect(x, sol, 3, H - sol, 'rgba(0,0,0,.35)');
    // La Chose, immense, derrière
    vue.s = k * 1.05;
    const ck = k * 1.08;
    const tete = dessinerChose(W * 0.2, sol + 0.1 * ck, ck, 1, 1.3, 0.22);
    // Héros figé, au premier plan, lanterne levée
    const jk = k * 1.25;
    const lant = dessinerJoueur(W * 0.6, sol + 0.05 * jk, jk, 0.6, 0, true, 1);
    // Bougies au premier plan
    [[W * 0.06, H * 0.5], [W * 0.95, H * 0.62]].forEach(([bx, by]) => {
      rect(bx - 6, by, 12, 40, '#e9e0c8'); ellipse(bx, by - 10, 7, 16, '#ffd27a'); ellipse(bx, by - 8, 3, 8, '#fff4d0');
    });
    // Lumières : lune, lanterne, bougies
    const lumieres = [
      { x: fx + fw * 0.15, y: fy + fh * 0.25, r: W * 0.75, a: 0.85, c: [150, 180, 255] },
      { x: lant.lx, y: lant.ly, r: W * 0.55, a: 1, c: [255, 170, 80] },
      { x: W * 0.06, y: H * 0.48, r: W * 0.3, a: 0.7, c: [255, 180, 90] },
      { x: W * 0.95, y: H * 0.6, r: W * 0.3, a: 0.7, c: [255, 180, 90] },
      { x: W * 0.2, y: H * 0.3, r: W * 0.45, a: 0.4 },
    ];
    appliquerLumieres(lumieres, 0.42);
    // Contre-jour violet sur la Chose et ses yeux
    yeuxChose(tete.yx, tete.yy, ck, 1, 1.6);
    // Brume du souffle
    for (let i = 0; i < 9; i++) ellipse(tete.yx + 40 + i * 26, tete.yy + 30 + i * 18 + Math.sin(i) * 8, 30 + i * 6, 12 + i * 3, 'rgba(210,220,245,' + (0.12 - i * 0.008) + ')');
    // Halo rouge du cœur
    const gv = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.7);
    gv.addColorStop(0, 'rgba(170,0,20,0)'); gv.addColorStop(1, 'rgba(170,0,20,.35)');
    ctx.fillStyle = gv; ctx.fillRect(0, 0, W, H);
  }

  // ------------------------------------------------------------------------
  // Images du jeu (window.JEL_APERCU) : vraie partie, figée
  // ------------------------------------------------------------------------
  function ouvrirApercu(n) {
    const reglages = {
      1: { niv: 0, x: 7.5, v: 1.8, pas: 5, phase: 'alerte', tm: 0.9, temps: 0.8 },
      2: { niv: 7, x: 19.3, v: 0, pas: 3, phase: 'regard', tm: 0.6, temps: 0.55, poupee: 'alerte', pris: [0] },
      3: { niv: 12, x: 12.2, v: 0, pas: 4, phase: 'alerte', tm: 0.95, temps: 0.6, poupee: 'calme', pris: [0] },
    }[n] || { niv: 0, x: 7.5, v: 1.8, pas: 5, phase: 'calme', tm: 0, temps: 0.8 };
    S = nouvelleScene(reglages.niv);
    S.x = reglages.x; S.v = reglages.v; S.marche = 1.2; S.pas = reglages.pas; S.dist = S.pas * PAS_M;
    S.temps = S.p.temps * reglages.temps;
    S.noirV = dans(S.p.noirs, S.x) ? 1 : 0;
    S.chose.phase = reglages.phase; S.chose.tm = reglages.tm; S.chose.duree = 2; S.chose.yeux = reglages.phase === 'regard' ? 1 : 0;
    if (reglages.phase === 'alerte') { S.coeur = 0.8; S.regardMiroir = dansMiroir(S) ? 0.6 : 0; if (dansMiroir(S)) S.coeur = 0; }
    if (S.poupee && reglages.poupee === 'alerte') { S.poupee.phase = 'alerte'; S.poupee.tete = 0.7; }
    (reglages.pris || []).forEach((i) => { if (S.items[i]) S.items[i].pris = true; });
    if (reglages.phase === 'alerte') for (let i = 0; i < 10; i++) S.particules.push({ x: S.x - S.dist + 0.5 + i * 0.18, y: 2.6 - i * 0.05, vx: 0, vy: 0, vie: i * 0.08, max: 3, type: 'brume' });
    preparerHud(); majHud();
    ecran = 'jeu'; fige = true; enPartie = false;
    montrer(null);
    if (n === 1) indice(t('indAppuie'), 999);
  }

  // ------------------------------------------------------------------------
  // Boucle principale
  // ------------------------------------------------------------------------
  let avant = performance.now();
  function boucle(maintenant) {
    let dt = Math.min(0.05, (maintenant - avant) / 1000); avant = maintenant;
    horloge += dt;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (affiche) { dessinerAffiche(); requestAnimationFrame(boucle); return; }
    if (ecran === 'jeu' && !fige) majPartie(dt);
    else if (ecran === 'titre' || ecran === 'menu') { if (S.titre) majTitre(dt); }
    else if (ecran === 'fin' && S.fin) majFin(S, dt);
    if (!fige || ecran !== 'jeu') majIndice(dt);
    dessinerScene(S);
    if (ecran === 'tuto') dessinerTuto();
    requestAnimationFrame(boucle);
  }

  // ------------------------------------------------------------------------
  // Démarrage
  // ------------------------------------------------------------------------
  majBoutonsSon();
  if (affiche) {
    document.documentElement.classList.add('affiche');
    document.querySelectorAll('.ecran, #hud, #pad, #indice, #banniere, .jel-langue').forEach((e) => { e.style.display = 'none'; });
    requestAnimationFrame(boucle);
    return;
  }
  if (apercu) {
    document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; });
    ouvrirApercu(apercu);
    requestAnimationFrame(boucle);
    return;
  }
  allerTitre();
  requestAnimationFrame(boucle);
})();
</script>
