      return e;
    };
    let e = base(), debut = 0, fait = 0, an = { pose: {}, perce: {} }, luneT = 0;
    const PAS = 1700, j = ++tutoAnim;
    // l'aile occupe la partie gauche, la « carte » de réception est à droite
    const g = geoAile(e, 400, 360);
    const carteX = 480, carteY = 120;
    function cible(et) {
      if (et[0] === 'l') return geo2(et[2]);
      if (et[0] === 'b' || et[0] === 'x') return geo2(et[1]);
      if (et[0] === 'k') return geo2(e.N);
      return null;
    }
    function geo2(i) { const q = g.ch[i]; return [q.x + q.w / 2, q.y + q.h / 2]; }
    function appliquer(et, t) {
      const a = e.ai[0];
      if (et[0] === 'l') { a.ch[et[2]] = et[1]; an.pose[et[2]] = t; }
      else if (et[0] === 'b') a.b[et[1]] = 1;
      else if (et[0] === 'x') a.ch[et[1]] = '';
      else if (et[0] === 'k') a.cv = 1;
      else if (et[0] === 'lune') { a.ch[et[2]] = a.ch[et[1]]; a.ch[et[1]] = ''; an.pose[et[2]] = t; luneT = t; }
      else if (et[0] === 'goutte') { for (let z = 0; z < a.k.length; z++) if (a.k[z] > 0) { a.k[z]--; if (!a.k[z]) an.perce[z] = t; } }
      O.recalculer(e, null);
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = base(); fait = 0; an = { pose: {}, perce: {} }; debut = t; luneT = 0; }
      else if (k >= fait && fait < d.etapes.length && dans >= 900) { appliquer(d.etapes[fait], t); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, 560, 360);
      dessinerAile(c, e, e.ai[0], g, t, { anims: an });
      const et = fait < d.etapes.length ? d.etapes[fait] : null;
      // la carte (ou l'outil) en jeu, à droite
      c.fillStyle = '#2e2448'; rr(c, carteX - 55, carteY - 70, 110, 140, 14); c.fill();
      c.strokeStyle = '#5fe0b0'; c.lineWidth = 3; c.stroke();
      if (et) {
        if (et[0] === 'l') revenant(c, et[1], carteX, carteY, 0.8, t, 0);
        else if (et[0] === 'k') revenant(c, 'cle', carteX, carteY, 0.8, t, 0);
        else if (et[0] === 'b') picto(c, 'bougie', carteX, carteY, 70);
        else if (et[0] === 'x') { c.save(); c.translate(carteX, carteY); c.rotate(t / 400); c.strokeStyle = '#c38bff'; c.lineWidth = 6; for (let z = 0; z < 3; z++) { c.beginPath(); c.arc(0, 0, 12 + z * 12, z, z + 3.6); c.stroke(); } c.restore(); }
        else if (et[0] === 'lune') lunePleine(c, carteX, carteY, 34);
        else if (et[0] === 'goutte') { c.fillStyle = '#c0283c'; ell(c, carteX, carteY + Math.sin(t / 200) * 10, 14, 22); c.fill(); }
      }
      if (luneT && t - luneT < 1200) { c.fillStyle = 'rgba(10,6,24,' + (0.4 * Math.sin((t - luneT) / 1200 * Math.PI)).toFixed(2) + ')'; c.fillRect(0, 0, 400, 360); }
      // la main : de la carte vers la chambre visée
      const vise = et ? cible(et) : null;
      if (vise) {
        const q = Math.min(1, dans / 800);
        const x = carteX + (vise[0] - carteX) * q, y = carteY + 20 + (vise[1] - carteY - 20) * q;
        if (q < 1 && et[0] !== 'x') { c.globalAlpha = 0.7; if (et[0] === 'l') revenant(c, et[1], x, y - 20, 0.45, t, 0); c.globalAlpha = 1; }
        main(c, x, y, 1.5, q >= 1 ? Math.min(1, (dans - 800) / 120) : 0);
      } else if (et && (et[0] === 'lune' || et[0] === 'goutte')) {
        main(c, carteX + 10, carteY + 60 + Math.sin(t / 200) * 6, 1.5, 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function monTourOk() {
    if (!partie || enPause || attenteTuto || !vue || vue.fini) return false;
    if (!partie.monTour()) {
      if (Date.now() - dernierAttends > 1500 && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
      return false;
    }
    return true;
  }

  function jouerAction(a) {
    if (!partie || !R.valide(vue, maPlace(), a)) { sons.non(); return false; }
    if (partie.jouer(a)) { sel = null; majInterface(); return true; }
    return false;
  }

  function choisirCarte(g) {
    audio();
    if (!monTourOk() || !vue.rec[g]) return;
    const carte = vue.rec[g];
    if (carte === 'cle') {
      if (sel && sel.m === 'k' && sel.g === g) { jouerAction({ t: 'k', g: g }); return; }
      sel = { m: 'k', g: g };
    } else sel = sel && sel.m === 'l' && sel.g === g ? null : { m: 'l', g: g };
    sons.carte();
    if (sel && sel.m === 'l' && clavier && (curseur < 0 || !O.estLibre(vue, monAile(), curseur))) curseur = O.libres(vue, monAile())[0];
    majInterface();
  }

  function choisirOutil(m) {
    audio();
    if (!monTourOk()) return;
    const a = monAile();
    if ((m === 'b' && a.al <= 0) || (m === 'x' && a.ex <= 0)) { sons.non(); return; }
    sel = sel && sel.m === m ? null : { m: m };
    sons.clic();
    majInterface();
  }

  function toucherChambre(i) {
    if (!monTourOk()) return;
    const a = monAile();
    if (!sel) {
      if (a.ch[i] || (i === vue.N && !a.cv)) { infoChambre(i); return; }
      toast(tr('msg.choisis'), 1600); sons.non(); return;
    }
    if (sel.m === 'l') {
      if (!O.estLibre(vue, a, i)) { toast(tr(i === vue.N && !a.cv ? 'msg.caveFermee' : 'msg.occupee'), 1400); sons.non(); return; }
      jouerAction({ t: 'l', g: sel.g, r: i });
    } else if (sel.m === 'k') {
      jouerAction({ t: 'k', g: sel.g });
    } else if (sel.m === 'b') {
      if (a.b[i]) { toast(tr('msg.dejaBougie'), 1400); sons.non(); return; }
      jouerAction({ t: 'b', r: i });
    } else if (sel.m === 'x') {
      if (!a.ch[i]) { sons.non(); return; }
      sel = { m: 'x', r: i }; sons.clic();
      if (clavier) curseurCible = premiereCible(-1, 1);
      majInterface();
    }
  }

  // Sans choix : toucher un client rappelle son exigence.
  function infoChambre(i) {
    const a = monAile();
    if (i === vue.N && !a.cv) { toast(tr('msg.caveFermee'), 2000); return; }
    const t = a.ch[i];
    toast(tr('fantome.' + t) + ' : ' + tr('exig.' + t) + (a.h[i] ? ' · ' + tr('msg.hurle') : ' · ' + tr('msg.apaise')), 2200, !!a.h[i]);
  }

  function toucherPlace(s) {
    if (!sel || sel.m !== 'x' || sel.r === undefined) return;
    audio();
    if (!ciblePossible(s)) { toast(tr('msg.pasCible'), 1500); sons.non(); return; }
    jouerAction({ t: 'x', r: sel.r, j: s });
  }

  let curseurCible = -1;
  function premiereCible(depuis, sens) {
    for (let k = 1; k <= PLACES; k++) { const s = (depuis + sens * k + PLACES * 4) % PLACES; if (ciblePossible(s)) return s; }
    return -1;
  }

  // Chambre sous le doigt.
  function chambreSous(px, py) {
    if (!vue || !geo) return -1;
    for (let i = 0; i <= vue.N; i++) {
      if (i === vue.N && !vue.ca) break;
      const q = geo.ch[i];
      if (px >= q.x && px <= q.x + q.w && py >= q.y && py <= q.y + q.h) return i;
    }
    return -1;
  }

  const plateau = $('plateau');
  plateau.addEventListener('pointerdown', (ev) => { audio(); clavier = false; ev.preventDefault(); });
  plateau.addEventListener('pointerup', (ev) => {
    const r = plateau.getBoundingClientRect();
    const i = chambreSous(ev.clientX - r.left, ev.clientY - r.top);
    if (i >= 0) toucherChambre(i);
  });

  for (let g = 0; g < 3; g++) $('fiche-' + g).addEventListener('click', () => { clavier = false; choisirCarte(g); });
  $('btn-bougie').addEventListener('click', () => choisirOutil('b'));
  $('btn-exo').addEventListener('click', () => choisirOutil('x'));

  // Clavier : 1 2 3 cartes, B allumette, X exorcisme, flèches et Entrée.
  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    const N = vue.N, C = vue.C;
    if (curseur < 0) { curseur = 0; return; }
    if (curseur === N) { if (dy < 0) curseur = (vue.R - 1) * C + Math.floor((C - 1) / 2); return; }
    const r = Math.floor(curseur / C), c = curseur % C;
    let nr = r + dy, nc = c + dx;
    if (nr >= vue.R) { if (vue.ca) { curseur = N; return; } nr = vue.R - 1; }
    nr = Math.max(0, nr); nc = Math.max(0, Math.min(C - 1, nc));
    curseur = nr * C + nc;
    sons.clic();
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const num = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 }[ev.code];
    if (num !== undefined) { ev.preventDefault(); clavier = true; choisirCarte(num); return; }
    if (ev.code === 'KeyB') { ev.preventDefault(); clavier = true; if (!$('btn-bougie').hidden) choisirOutil('b'); return; }
    if (ev.code === 'KeyX') { ev.preventDefault(); clavier = true; if (!$('btn-exo').hidden) choisirOutil('x'); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (sel && sel.m === 'x' && sel.r !== undefined) {
        curseurCible = premiereCible(curseurCible < 0 ? -1 : curseurCible, dirs[ev.code][0] < 0 || dirs[ev.code][1] < 0 ? -1 : 1);
        if (curseurCible >= 0) toast(tr('mode.exoCible', { nom: nomAile(curseurCible) }), 1500);
        return;
      }
      if (!clavier) { clavier = true; if (curseur < 0) { curseur = 0; return; } }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (sel && sel.m === 'x' && sel.r !== undefined) { if (curseurCible < 0) curseurCible = premiereCible(-1, 1); if (curseurCible >= 0) toucherPlace(curseurCible); return; }
      if (sel && sel.m === 'k') { toucherChambre(vue.N); return; }
      if (!clavier || curseur < 0) { clavier = true; curseur = 0; return; }
      toucherChambre(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-registre').addEventListener('click', () => { audio(); sons.clic(); ouvrirRegistre(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('reg-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une partie solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? O.points(vue, partie.siege) : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'titre') dessinerTitre(); });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
