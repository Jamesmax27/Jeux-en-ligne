      zone.style.display = '';
      $('fin-regle').style.display = '';
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : (prog.records[i] ? tr('fin.record', { n: prog.records[i] }) : '');
      let deb = '';
      if (gagne && niveau === NIVEAUX.length) deb = tr('fin.dernier');
      else if (debloque && niveau % 5 === 0) deb = tr('fin.etage', { etage: tr('etage.' + (niveau / 5)) });
      else if (debloque) deb = tr('fin.debloque', { n: niveau + 1 });
      $('fin-debloque').textContent = deb;
      $('fin-compte').textContent = '';
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
      // Gardien enfui : la nuit s'arrête là (les robots ne continuent pas derrière la fenêtre).
      if (fuite) { enPartie = false; try { partie.pause(true); } catch (er) { /* rien */ } }
    } else {
      if (partie.siege >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-regle').style.display = 'none';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if ($('voile-fin').classList.contains('actif')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis de victoire : gouttes de cire et étincelles aux couleurs des lanternes.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 120 + Math.random() * 160, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: i % 5 === 0 ? '#ffd27a' : COUL[i % 4], k: 5 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul; ell(c, 0, 0, b.k / 2, b.k / 3); c.fill(); c.restore();
      });
      if (t - debut < 2600) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits, registre
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    sel = -1; exoChambre = -1;
    journal = '';
    finSoloFaite = false;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  function apercu(n) {
    const e = R.depart(() => 0.5, PLACES, { niveau: n });
    e.mar = [];
    return e;
  }

  // Parcours solo : nuit n contre 3 robots (force croissante).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    quitterPartie();
    session = 'solo';
    jeton++;
    enPartie = true;
    fermerVoile('voile-fin');
    vue = apercu(niveau);
    viderAnims();
    particules.length = 0;
    vueAile = 0;
    noterVus(niveau);
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majInterface();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majInterface();
  }

  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majInterface();
  }

  function ouvrirNiveaux() {
    const boite = $('grille-niveaux');
    boite.textContent = '';
    for (let et = 0; et < 4; et++) {
      const h = document.createElement('h3'); h.className = 'etage'; h.textContent = tr('etage.' + et);
      boite.appendChild(h);
      const grille = document.createElement('div'); grille.className = 'grille';
      for (let i = et * 5; i < et * 5 + 5 && i < NIVEAUX.length; i++) {
        const n = i + 1, ouvert = n <= prog.debloque;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
        const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
        const etl = document.createElement('small');
        for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; etl.appendChild(sp); }
        b.append(num, etl);
        b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
        if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
        else b.disabled = true;
        grille.appendChild(b);
      }
      boite.appendChild(grille);
    }
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });

  }

  function ouvrirRegistre() {
    const grille = $('grille-registre');
    grille.textContent = '';
    TYPES.forEach((k) => {
      const vu = prog.vus.indexOf(k) >= 0;
      const f = document.createElement('div'); f.className = 'fiche' + (vu ? '' : ' inconnue');
      const cv = document.createElement('canvas'); cv.width = 168; cv.height = 168;
      fantome(cv.getContext('2d'), k, 84, 88, 136, vu ? 0 : 3, 0);
      const nom = document.createElement('b'); nom.textContent = vu ? tr('fantome.' + k) : tr('registre.inconnu');
      const bes = document.createElement('span'); bes.className = 'besoin'; bes.textContent = vu ? tr('besoin.' + k) + ' · ' + tr('registre.valeur', { n: O.VAL[k] }) : '';
      const p = document.createElement('p'); p.textContent = vu ? tr('histoire.' + k) : tr('registre.inconnuTexte');
      f.append(cv, nom, bes, p);

    });

  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    ouvrirVoile('voile-pause');
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    tPrec = 0;
    relancerBoucle();
    majInterface();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés
  // ---------------------------------------------------------------------

  let tutoAnim = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const cv = $('tuto-demo'), c = cv.getContext('2d');
    const base = () => {
      const e = { C: d.C, d: d.d, m: d.m || [], cave: !!d.cave, a: [[], [], [], []], pr: [[], [], [], []], ouv: [false, false, false, false], fr: [0, 0, 0, 0] };
      for (let s = 0; s < 4; s++) { for (let i = 0; i <= 2 * d.C; i++) e.a[s].push(''); e.pr[s] = e.m.map(() => false); }
      Object.keys(d.a).forEach((i) => { e.a[0][+i] = d.a[i]; e.a[1][+i] = d.a[i]; });
      return e;
    };
    let e = base(), debut = 0, fait = 0, an = { pose: {}, cri: {} }, flash = 0;
    const PAS = 1700, j = ++tutoAnim;
    const g = geoAile(e, 560, 360, 26);
    function appliquer(et, t) {
      if (et.g) {
        const avant = O.cris(e, 0);
        e.a[0][et.r] = et.g; an.pose[et.r] = t;
        const apres = O.cris(e, 0);
        let n = 0; apres.forEach((x, i) => { if (x && !avant[i]) n++; });
        e.m.forEach((p, w) => { if (!e.pr[0][w] && e.a[0][p[0]] && e.a[0][p[1]]) { e.pr[0][w] = true; n++; } });
        e.fr[0] = Math.min(3, e.fr[0] + n);
      } else if (et.exo !== undefined) { e.a[0][et.exo] = ''; flash = t; }
      else if (et.cle) e.ouv[0] = true;
      else if (et.lune) { for (let k = 0; k < e.C; k++) { const x = e.a[0][k]; e.a[0][k] = e.a[0][k + e.C]; e.a[0][k + e.C] = x; } flash = t; }
    }
    function cibleDe(et) {
      if (et.g) { const r = rectChambre(g, et.r); return [r.x + r.w / 2, r.y + r.h / 2]; }
      if (et.exo !== undefined) { const r = rectChambre(g, et.exo); return [r.x + r.w / 2, r.y + r.h / 2]; }
      if (et.cle && g.cave) return [g.cave.x + g.cave.w / 2, g.cave.y + g.cave.h / 2];
      return null;
    }
    function image(t) {
      if (j !== tutoAnim) return;
      if (!debut) debut = t;
      const ecoule = t - debut;
      const k = Math.floor(ecoule / PAS), dans = ecoule - k * PAS;
      if (k >= d.etapes.length + 1) { e = base(); fait = 0; an = { pose: {}, cri: {} }; debut = t; flash = 0; }
      else if (k >= fait && fait < d.etapes.length && dans >= 900) { appliquer(d.etapes[fait], t); fait++; }
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#140d1f'; c.fillRect(0, 0, 560, 360);
      dessinerAile(c, e, g, { t: t, p: 0, anims: an, frayeur: d.peur ? e.fr[0] : undefined });
      if (flash && t - flash < 500) { c.fillStyle = 'rgba(230,240,255,' + (0.6 * (1 - (t - flash) / 500)).toFixed(2) + ')'; c.fillRect(0, 0, 560, 360); }
      const et = fait < d.etapes.length ? d.etapes[fait] : null;
      const cible = et ? cibleDe(et) : null;
      if (cible) {
        // la carte part du bas de l'écran (le registre), puis la main touche la chambre
        const q = Math.min(1, dans / 800);
        const x = 280 + (cible[0] - 280) * q, y = 380 + (cible[1] - 380) * q;
        if (et.g) fantome(c, et.g, x, y - 30, 60, 2, t);
        if (et.cle) fantome(c, 'K', x, y - 30, 50, 0, t);
        main(c, x, y, 1.5, q >= 1 ? Math.min(1, (dans - 800) / 100) : 0);
      }
      tutoAnimId = requestAnimationFrame(image);
    }
    let tutoAnimId = requestAnimationFrame(image);
    const fermer = () => {
      tutoAnim++;
      cancelAnimationFrame(tutoAnimId);
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
      majInterface();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  function main(c, x, y, k, appui) {
    c.save(); c.translate(x, y); c.scale(k, k); c.rotate(-0.4);
    if (appui) { c.strokeStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 3; rond(c, 0, 0, 14 * appui + 4); c.stroke(); }
    c.fillStyle = '#fff'; c.strokeStyle = '#2a1606'; c.lineWidth = 2.5;
    rr(c, -5, 0, 10, 30, 5); c.fill(); c.stroke();
    rr(c, -13, 20, 28, 26, 9); c.fill(); c.stroke();
    ell(c, -14, 30, 5, 9, -0.6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(-4, 18, 8, 6);
    c.restore();
  }

  // ---------------------------------------------------------------------
  //  Gestes : doigt, souris, clavier
  // ---------------------------------------------------------------------

  function attends() {
    if (Date.now() - dernierAttends > 1500 && partie && partie.phase === 'jeu') { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function jouerCoup(a) {
    if (!partie || !monTour()) return false;
    if (!R.valide(vue, moi(), a)) { sons.non(); return false; }
    if (partie.jouer(a)) { sel = -1; exoChambre = -1; majInterface(); return true; }
    return false;
  }

  function choisirCarte(m) {
    if (!vue || !partie || partie.phase !== 'jeu') return;
    if (!monTour()) { attends(); return; }
    const k = vue.mar[m];
    if (!k) return;
    vueAile = moi();
    if (sel === m) { sel = -1; exoChambre = -1; sons.clic(); majInterface(); return; }
    if (k === 'K' && !O.coupOk(vue, moi(), { m: m })) { toast(tr('refus.cle')); sons.non(); return; }
    if (k === 'X' && !O.listeCoups(vue, moi()).some((c) => c.m === m)) { toast(tr('refus.exo')); sons.non(); return; }
    sel = m; exoChambre = -1;
    sons.choix();
    if (clavier && (curseur < 0 || curseur > 2 * vue.C)) curseur = 0;
    majInterface();
  }

  function toucherChambre(i) {
    if (!vue || !partie || partie.phase !== 'jeu') return;
    if (vueAile !== moi()) {
      // Aile d'un rival : un toucher sur un revenant dit ce qu'il veut ; sinon retour à la mienne.
      if (i >= 0 && vue.a[vueAile][i]) { infoRevenant(vueAile, i); return; }
      vueAile = moi(); sons.clic(); majInterface(); return;
    }
    if (!monTour()) { if (i >= 0 && vue.a[moi()][i]) infoRevenant(moi(), i); else attends(); return; }
    if (sel < 0) {
      if (i >= 0 && vue.a[moi()][i]) infoRevenant(moi(), i);
      else { toast(tr('refus.choisir'), 1800); sons.non(); }
      return;
    }
    const k = vue.mar[sel];
    if (k === 'K') { jouerCoup({ m: sel }); return; }
    if (i < 0) return;
    if (k === 'X') {
      if (i < 2 * vue.C && vue.a[moi()][i]) { exoChambre = i; sons.choix(); majInterface(); }
      else { toast(tr('refus.exo'), 1800); sons.non(); }
      return;
    }
    if (O.coupOk(vue, moi(), { m: sel, r: i })) jouerCoup({ m: sel, r: i });
    else if (i === 2 * vue.C && !vue.ouv[moi()]) { toast(tr('refus.cave')); sons.non(); }
    else { toast(tr('refus.chambre'), 1800); sons.non(); }
  }

  function infoRevenant(p, i) {
    const g = vue.a[p][i];
    const ok = O.calme(vue, p, i);
    toast(tr('fantome.' + g) + ' : ' + tr('besoin.' + g) + ' · ' + tr(ok ? 'etat.calme' : 'etat.hurle'), 2600);
    sons.clic();
  }

  function toucherPlace(s) {
    if (!vue) return;
    if (enModeExo2() && s !== moi()) {
      if (O.coupOk(vue, moi(), { m: sel, r: exoChambre, p: s })) jouerCoup({ m: sel, r: exoChambre, p: s });
      else { toast(tr('refus.cible')); sons.non(); }
      return;
    }
    vueAile = vueAile === s ? moi() : s;
    sons.clic();
    majInterface();
  }

  function chambreSous(px, py) {
    if (!vue || !geo) return -1;
    const fin = vue.cave ? 2 * vue.C : 2 * vue.C - 1;
    for (let i = 0; i <= fin; i++) {
      const r = rectChambre(geo, i);
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return i;
    }
    return -1;
  }

  const plateau = $('plateau');
  function point(ev) { const r = plateau.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; }
  plateau.addEventListener('pointerup', (ev) => {
    audio();
    clavier = false;
    const p = point(ev);
    toucherChambre(chambreSous(p[0], p[1]));
  });

  function deplacerCurseur(dx, dy) {
    if (!vue) return;
    const C = vue.C, cave = 2 * C;
    if (curseur < 0) { curseur = 0; return; }
    if (curseur === cave) { if (dy < 0) curseur = C + Math.floor(C / 2); sons.clic(); return; }
    const nord = curseur < C, col = curseur % C;
    if (dx) curseur = (nord ? 0 : C) + Math.max(0, Math.min(C - 1, col + dx));
    if (dy > 0) { if (nord) curseur = col + C; else if (vue.cave) curseur = cave; }
    if (dy < 0 && !nord) curseur = col;
    sons.clic();
  }

  function rivauxPossibles() {
    const l = [];
    for (let s = 0; s < PLACES; s++) if (s !== moi() && O.coupOk(vue, moi(), { m: sel, r: exoChambre, p: s })) l.push(s);
    return l;
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if ($('voile-tuto').classList.contains('actif')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (salonOuvert()) return;
    if (ev.code === 'Escape' || ev.code === 'KeyP') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!$('voile-fin').classList.contains('actif')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || $('voile-fin').classList.contains('actif')) return;
    const chiffres = { Digit1: 0, Digit2: 1, Digit3: 2, Numpad1: 0, Numpad2: 1, Numpad3: 2 };
    if (chiffres[ev.code] !== undefined) { ev.preventDefault(); audio(); clavier = true; choisirCarte(chiffres[ev.code]); return; }
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    if (dirs[ev.code]) {
      ev.preventDefault(); audio();
      if (enModeExo2()) {
        // choix du rival qui reçoit le revenant : les lanternes s'allument une à une
        const l = rivauxPossibles();
        if (l.length) {
          const i = l.indexOf(vueAile), pas = dirs[ev.code][0] + dirs[ev.code][1] >= 0 ? 1 : -1;
          vueAile = i < 0 ? l[0] : l[(i + pas + l.length) % l.length];
          sons.clic(); majInterface();
        }
        return;
      }
      clavier = true;
      if (vueAile !== moi()) { vueAile = moi(); majInterface(); }
      deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]);
    } else if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); audio();
      if (enModeExo2()) {
        const l = rivauxPossibles();
        const cible = l.indexOf(vueAile) >= 0 ? vueAile : l[0];
        if (cible !== undefined) { vueAile = moi(); toucherPlace(cible); }
        return;
      }
      if (!clavier || curseur < 0) { clavier = true; curseur = 0; return; }
      toucherChambre(curseur);
    }
  });

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-registre').addEventListener('click', () => { audio(); sons.clic(); ouvrirRegistre(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('reg-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-passer').addEventListener('click', () => { audio(); sons.clic(); jouerCoup({ passe: true }); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !$('voile-fin').classList.contains('actif') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran !== 'jeu') dessinerTitre(); });
  // L'écran titre s'anime doucement (brume, chauves-souris).
  setInterval(() => { if (ecran === 'titre' && document.visibilityState === 'visible') dessinerTitre(); }, 120);

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami : directement dans le salon de sa partie.
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
</body>
</html>
