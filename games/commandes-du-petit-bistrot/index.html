  function construireComptoir() {
    const c = $('comptoir');
    c.innerHTML = '';
    c.style.gridTemplateColumns = `repeat(${etat.comptoir.length <= 4 ? 4 : etat.comptoir.length <= 6 ? 3 : 4}, 1fr)`;
    etat.comptoir.forEach((p, k) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'plat' + (p.placard ? ' placard' : '');
      b.dataset.k = k;
      b.innerHTML = svgPlat(p.id) + (p.placard ? `<span class="porte">${PORTE}</span>` : '');
      b.addEventListener('click', () => toucherPlat(k));
      c.appendChild(b);
    });
    majComptoir();
  }
  function majComptoir() {
    const boutons = $('comptoir').children;
    etat.comptoir.forEach((p, k) => {
      const b = boutons[k];
      if (!b) return;
      b.querySelector('svg').outerHTML = svgPlat(p.id);
      b.setAttribute('aria-label', p.placard && !b.classList.contains('ouvert') ? t('placard') : t('plat.' + p.id));
      b.classList.toggle('bloque', etat.phase !== 'service');
    });
  }

  function majPlateau() {
    const pl = $('plateau');
    pl.setAttribute('aria-label', t('plateau.aria'));
    pl.setAttribute('role', 'group');
    if (!etat.plateau.length) {
      pl.innerHTML = `<span class="vide">${t(etat.phase === 'service' ? 'plateau.vide' : 'plateau.attends')}</span>`;
    } else {
      pl.innerHTML = '';
      etat.plateau.forEach((x, k) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = x.cache ? svgCloche() : svgPlat(x.id);
        b.setAttribute('aria-label', t('plateau.retirer', { plat: x.cache ? t('cloche') : t('plat.' + x.id) }));
        b.addEventListener('click', () => retirerDuPlateau(k));
        pl.appendChild(b);
      });
    }
    $('b-servir').disabled = etat.phase !== 'service';
    $('b-servir').style.opacity = etat.phase === 'service' ? '1' : '.55';
  }

  // --- Messages, bulles et effets ---
  let minuteurMessage = null;
  function message(txt, ms) {
    const m = $('message');
    m.textContent = txt;
    m.classList.add('vu');
    clearTimeout(minuteurMessage);
    minuteurMessage = setTimeout(() => m.classList.remove('vu'), ms || 1800);
  }
  function retirerBulles(client) {
    if (!client || !client.el) return;
    client.el.querySelectorAll('.bulle').forEach((b) => {
      b.classList.add('sort');
      setTimeout(() => b.remove(), 260);
    });
  }
  function bulle(client, contenu, classe, duree) {
    client.el.querySelectorAll('.bulle').forEach((b) => b.remove());
    const b = document.createElement('div');
    b.className = 'bulle ' + (classe || '');
    b.innerHTML = contenu + (duree ? `<div class="jauge"><i style="--duree:${duree}ms"></i></div>` : '');
    client.el.appendChild(b);
    return b;
  }
  const itemsHtml = (liste) => `<div class="items">${liste.map((id) => `<span class="item">${svgPlat(id)}</span>`).join('')}</div>`;

  function confettis(x, y) {
    const app = $('app'), r = app.getBoundingClientRect();
    for (let k = 0; k < 22; k++) {
      const c = document.createElement('i');
      c.className = 'confetti';
      c.style.left = (x - r.left) + 'px';
      c.style.top = (y - r.top) + 'px';
      c.style.background = COULEURS_ARC[k % COULEURS_ARC.length];
      c.style.setProperty('--dx', (Math.random() * 220 - 110) + 'px');
      c.style.setProperty('--dy', (Math.random() * 160 - 30) + 'px');
      app.appendChild(c);
      setTimeout(() => c.remove(), 1200);
    }
  }
  function pieces(depuis, gain) {
    const app = $('app'), ra = app.getBoundingClientRect();
    const rd = depuis.getBoundingClientRect(), rs = $('score').getBoundingClientRect();
    const g = document.createElement('div');
    g.className = 'gain';
    g.textContent = '+' + nombre(gain);
    g.style.left = (rd.left - ra.left + rd.width / 2 - 16) + 'px';
    g.style.top = (rd.top - ra.top + 10) + 'px';
    app.appendChild(g);
    setTimeout(() => g.remove(), 1000);
    for (let k = 0; k < 4; k++) {
      const p = document.createElement('div');
      p.className = 'piece';
      p.innerHTML = ICONES.piece;
      const x0 = rd.left - ra.left + rd.width / 2 + (k - 1.5) * 14, y0 = rd.top - ra.top + rd.height / 2;
      p.style.left = x0 + 'px'; p.style.top = y0 + 'px';
      app.appendChild(p);
      setTimeout(() => {
        p.style.transform = `translate(${rs.left - ra.left + 10 - x0}px, ${rs.top - ra.top + 6 - y0}px) scale(.7)`;
        p.style.opacity = '.3';
      }, 30 + k * 80);
      setTimeout(() => { p.remove(); if (k === 0) Son.piece(); }, 800 + k * 80);
    }
  }

  // ==========================================================================
  // Déroulement d'un groupe de clients
  // ==========================================================================
  function tempsBulle(groupe) {
    const v = VUES[etat.def.vue];
    if (groupe.length === 1 && groupe[0].defile) return groupe[0].commande.length * Math.max(850, v[1] * 1.6) + 300;
    const plats = groupe.reduce((s, c) => s + c.commande.length, 0);
    return Math.round(v[0] + v[1] * plats * (groupe.length > 1 ? 0.9 : 1));
  }
  function groupeSuivant() {
    if (etat.g >= etat.groupes.length) { victoire(); return; }
    const groupe = etat.groupes[etat.g];
    etat.actif = 0;
    etat.plateau = [];
    etat.phase = 'attente';
    majPlateau(); majComptoir();
    const zone = $('clients');
    zone.innerHTML = '';
    groupe.forEach((c) => {
      const el = document.createElement('div');
      el.className = 'client entre';
      el.innerHTML = svgAnimal(c.type, 'neutre', c.chemise);
      el.setAttribute('role', 'img');
      el.setAttribute('aria-label', t('client.aria', { animal: t('animal.' + c.type) }));
      zone.appendChild(el);
      c.el = el;
    });
    Son.clochette();
    planifier(750, () => (etat.placardIdx.length ? montrerPlacards(groupe) : montrerCommandes(groupe)));
  }

  // Placards : on mélange leur contenu, on les ouvre un instant, puis on les ferme
  function montrerPlacards(groupe) {
    const contenus = melanger(etat.placardIdx.map((k) => etat.comptoir[k].id));
    etat.placardIdx.forEach((k, j) => { etat.comptoir[k].id = contenus[j]; });
    const boutons = $('comptoir').children;
    etat.placardIdx.forEach((k) => boutons[k].classList.add('ouvert'));
    majComptoir();
    Son.porte();
    message(t('msg.placards'), 2000);
    const duree = 1500 + 450 * etat.placardIdx.length - (['courte', 'tres'].includes(etat.def.vue) ? 300 : 0);
    planifier(duree, () => {
      etat.placardIdx.forEach((k) => boutons[k].classList.remove('ouvert'));
      majComptoir();
      Son.porte();
      planifier(550, () => montrerCommandes(groupe));
    });
  }

  function montrerCommandes(groupe) {
    etat.phase = 'bulle';
    const duree = tempsBulle(groupe);
    message(t(groupe.length > 1 ? 'msg.regardeDeux' : 'msg.regarde'), Math.min(duree, 2200));
    Son.bulle();
    groupe.forEach((c) => {
      if (c.defile && groupe.length === 1) {
        const pas = (duree - 300) / c.commande.length;
        const b = bulle(c, '<div class="items"></div>', 'defile', duree);
        c.commande.forEach((id, k) => planifier(k * pas, () => {
          b.querySelector('.items').innerHTML = `<span class="item">${svgPlat(id)}</span>`;
          Son.note(600 + k * 90, 0.08, { type: 'triangle', vol: 0.07 });
        }));
        planifier(c.commande.length * pas, () => { b.querySelector('.items').innerHTML = ''; });
      } else {
        bulle(c, itemsHtml(c.commande), '', duree);
      }
    });
    planifier(duree, () => {
      groupe.forEach(retirerBulles);
      Son.cacher();
      const changeants = groupe.filter((c) => c.change);
      if (changeants.length) planifier(500, () => montrerChangements(groupe, changeants));
      else planifier(300, () => debutService(groupe));
    });
  }

  function montrerChangements(groupe, changeants) {
    etat.phase = 'change';
    const duree = 2200 + (changeants.some((c) => c.change.ajoute) ? 500 : 0) - (['courte', 'tres'].includes(etat.def.vue) ? 300 : 0);
    message(t('msg.change'), duree);
    Son.note(700, 0.12, { vers: 500 }); Son.note(700, 0.12, { vers: 500, delai: 0.15 });
    changeants.forEach((c) => {
      const ajout = c.change.ajoute ? `<span class="fleche">${ICONES.fleche}</span><span class="item">${svgPlat(c.change.ajoute)}</span>` : '';
      bulle(c, `<div class="items"><span class="item barre">${svgPlat(c.change.retire)}</span>${ajout}</div>`, 'change', duree);
    });
    planifier(duree, () => { changeants.forEach(retirerBulles); Son.cacher(); planifier(300, () => debutService(groupe)); });
  }

  function debutService(groupe) {
    etat.phase = 'service';
    etat.plateau = [];
    marquerActif(groupe);
    majPlateau(); majComptoir();
    message(t(groupe.length > 1 ? 'msg.servirDuo' : 'msg.aToi'), 1600);
    if (document.activeElement === document.body || !document.activeElement || document.activeElement.classList.contains('plat')) {
      const b = $('comptoir').querySelector('.plat'); if (b) b.focus({ preventScroll: true });
    }
  }
  function marquerActif(groupe) {
    groupe.forEach((c, k) => {
      const f = c.el.querySelector('.fleche-actif');
      if (f) f.remove();
      if (k === etat.actif && groupe.length > 1) c.el.insertAdjacentHTML('afterbegin', ICONES.flecheBas);
    });
  }

  // ==========================================================================
  // Actions du joueur
  // ==========================================================================
  function toucherPlat(k) {
    Son.pret();
    const b = $('comptoir').children[k];
    if (etat.phase !== 'service' || etat.enPause) {
      if (b) b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 200);
      if (etat.phase === 'bulle') message(t('msg.attends'), 1200);
      return;
    }
    if (etat.plateau.length >= PLATEAU_MAX) {
      $('plateau').classList.remove('secoue'); void $('plateau').offsetWidth; $('plateau').classList.add('secoue');
      message(t('plateau.plein'), 1400); Son.erreur(); return;
    }
    const p = etat.comptoir[k];
    etat.plateau.push({ id: p.id, cache: p.placard });
    b.classList.remove('tape'); void b.offsetWidth; b.classList.add('tape');
    Son.poser();
    majPlateau();
  }
  function retirerDuPlateau(k) {
    Son.pret();
    if (etat.phase !== 'service' || etat.enPause) return;
    etat.plateau.splice(k, 1);
    Son.retirer();
    majPlateau();
    const reste = $('plateau').querySelectorAll('button');
    if (reste.length) reste[Math.min(k, reste.length - 1)].focus();
  }
  const memes = (a, b) => a.length === b.length && a.slice().sort().join('|') === b.slice().sort().join('|');

  function servir() {
    Son.pret();
    if (etat.phase !== 'service' || etat.enPause) return;
    const groupe = etat.groupes[etat.g];
    const client = groupe[etat.actif];
    if (!etat.plateau.length) {
      $('plateau').classList.remove('secoue'); void $('plateau').offsetWidth; $('plateau').classList.add('secoue');
      message(t('msg.plateauVide'), 1400);
      return;
    }
    etat.phase = 'verdict';
    // Les cloches se soulèvent
    const servi = etat.plateau.map((x) => x.id);
    etat.plateau = etat.plateau.map((x) => ({ id: x.id, cache: false }));
    majPlateau();
    etat.servis++;
    const juste = memes(servi, client.finale);
    const r = client.el.getBoundingClientRect();
    if (juste) {
      etat.justes++;
      etat.serie++;
      const gain = 10 + (etat.serie >= 2 ? 5 : 0);
      etat.score += gain;
      client.el.classList.add('content');
      client.el.querySelector('svg.perso').outerHTML = svgAnimal(client.type, 'content', client.chemise);
      bulle(client, t('merci.' + hasard(1, 4)), 'texte');
      Son.juste();
      confettis(r.left + r.width / 2, r.top + 20);
      pieces(client.el, gain);
      majHud();
      planifier(1400, () => clientSuivant(groupe));
    } else {
      etat.serie = 0;
      etat.coeurs--;
      majHud();
      client.el.classList.add('etonne');
      client.el.querySelector('svg.perso').outerHTML = svgAnimal(client.type, 'etonne', client.chemise);
      $('plateau').classList.remove('secoue'); void $('plateau').offsetWidth; $('plateau').classList.add('secoue');
      Son.erreur();
      message(t(etat.coeurs > 0 ? 'msg.oups' : 'msg.plusDeCoeurs'), 2400);
      // On remontre la bonne commande : on apprend de son erreur
      planifier(500, () => bulle(client, itemsHtml(client.finale), 'correction'));
      planifier(2600, () => {
        if (etat.coeurs <= 0) defaite();
        else clientSuivant(groupe);
      });
    }
  }
  function clientSuivant(groupe) {
    const client = groupe[etat.actif];
    retirerBulles(client);
    client.el.classList.remove('entre');
    client.el.classList.add('sort');
    planifier(550, () => {
      client.el.style.visibility = 'hidden';
      etat.actif++;
      if (etat.actif < groupe.length) {
        etat.phase = 'service';
        etat.plateau = [];
        marquerActif(groupe);
        majPlateau(); majComptoir();
        message(t('msg.clientSuivant'), 1400);
      } else {
        etat.g++;
        planifier(250, groupeSuivant);
      }
    });
  }
  function coupDOeil() {
    Son.pret();
    if (etat.phase !== 'service' || etat.oeilUtilise || etat.enPause) return;
    etat.oeilUtilise = true;
    majHud();
    const groupe = etat.groupes[etat.g];
    const client = groupe[etat.actif];
    etat.phase = 'oeil';
    majComptoir(); majPlateau();
    Son.bulle();
    bulle(client, itemsHtml(client.finale), '', 1500);
    planifier(1500, () => { retirerBulles(client); etat.phase = 'service'; majComptoir(); majPlateau(); });
  }

  // ==========================================================================
  // Fin du service
  // ==========================================================================
  function calculerEtoiles() {
    const erreurs = COEURS - etat.coeurs;
    if (erreurs === 0 && !etat.oeilUtilise) return 3;
    if (erreurs <= 1) return 2;
    return 1;
  }
  function victoire() {
    etat.phase = 'fin';
    etat.enPartie = false;
    const n = etat.n;
    if (window.FMG) window.FMG.reportEnd({ completed: true, level: n + 1 });
    const bonus = etat.coeurs * 5 + (etat.oeilUtilise ? 0 : 10);
    etat.score += bonus;
    const etoiles = calculerEtoiles();
    const avant = totalEtoiles();
    const ancienRecord = progres.records[n];
    const record = etat.score > ancienRecord;
    progres.etoiles[n] = Math.max(progres.etoiles[n], etoiles);
    progres.records[n] = Math.max(ancienRecord, etat.score);
    progres.niveauMax = Math.max(progres.niveauMax, Math.min(NIVEAUX.length, n + 2));
    garderLocal();
    const apres = totalEtoiles();
    const nouvellesDecos = [];
    Object.keys(DECOS).forEach((type) => DECOS[type].forEach((o) => { if (o.seuil > avant && o.seuil <= apres) nouvellesDecos.push(t('deco.' + type + '.' + o.id)); }));
    try {
      window.JEL_SAVE.save(JEU, {
        niveau: Math.min(NIVEAUX.length, n + 2), score: etat.score,
        etoiles: progres.etoiles, records: progres.records, deco: progres.deco, tutos: progres.tutos, niveauMax: progres.niveauMax,
        options: { son: progres.son },
      });
    } catch (e) { /* sauvegarde indisponible */ }
    const dernier = n === NIVEAUX.length - 1;
    const total = etat.servis;
    $('fin-boite').innerHTML = `
      <h2 id="fin-titre">${t('victoire.titre')}</h2>
      <div class="grandes-etoiles" role="img" aria-label="${t('etoilesSur3', { n: etoiles })}">${[0, 1, 2].map(() => ICONES.etoile(true)).join('')}</div>
      <div class="gros-score" id="fin-score">0</div>
      <p>${t('fin.justes', { n: etat.justes, total })}</p>
      <p>${t('fin.bonus', { n: bonus })}</p>
      <p>${record ? `<span class="record">${t('fin.record')}</span>` : t('fin.recordAncien', { n: ancienRecord })}</p>
      ${nouvellesDecos.length ? `<p class="debloque">${t('deco.debloquee', { nom: nouvellesDecos.join(', ') })}</p>` : ''}
      ${dernier ? `<p class="debloque">${t('final.titre')}</p><p>${t('final.texte', { n: apres, max: NIVEAUX.length * 3 })}</p>` : ''}
      <div class="boutons">
        ${dernier ? `<button class="bouton principal" id="f-deco" type="button">${t('monBistrot')}</button>` : `<button class="bouton principal" id="f-suivant" type="button">${t('suivant')}</button>`}
        <div class="rangee"><button class="bouton" id="f-rejouer" type="button">${t('rejouer')}</button><button class="bouton" id="f-niveaux" type="button">${t('services')}</button></div>
      </div>`;
    $('fin-boite').setAttribute('aria-labelledby', 'fin-titre');
    brancherFin();
    ouvrirVoile('fin');
    Son.victoire();
    const r = $('fin-boite').getBoundingClientRect();
    confettis(r.left + r.width / 2, r.top + 40);
    // Étoiles qui s'allument une à une, score qui défile
    const svgs = $('fin-boite').querySelectorAll('.grandes-etoiles svg');
    for (let k = 0; k < etoiles; k++) setTimeout(() => { svgs[k].classList.add('allume'); Son.etoile(k); }, 450 + k * 380);
    const cible = etat.score, el = $('fin-score'), debut = performance.now();
    (function compter(now) {
      const p = Math.min(1, (now - debut) / 900);
      el.textContent = nombre(Math.round(cible * p));
      if (p < 1 && el.isConnected) requestAnimationFrame(compter);
    })(debut);
  }
  function defaite() {
    etat.phase = 'fin';
    etat.enPartie = false;
    const n = etat.n;
    if (window.FMG) window.FMG.reportEnd({ completed: false, level: n + 1 });
    $('fin-boite').innerHTML = `
      <h2 id="fin-titre">${t('defaite.titre')}</h2>
      <p>${t('defaite.texte')}</p>
      <div class="grandes-etoiles" aria-hidden="true">${[0, 1, 2].map(() => ICONES.etoile(false)).join('')}</div>
      <div class="gros-score">${nombre(etat.score)}</div>
      <p>${t('fin.justes', { n: etat.justes, total: etat.servis })}</p>
      <p>${t('fin.recordAncien', { n: progres.records[n] })}</p>
      <p>${t('defaite.conseil')}</p>
      <div class="boutons">
        <button class="bouton principal" id="f-reessayer" type="button">${t('reessayer')}</button>
        <div class="rangee"><button class="bouton" id="f-niveaux" type="button">${t('services')}</button><button class="bouton" id="f-accueil" type="button">${t('accueil')}</button></div>
      </div>`;
    $('fin-boite').setAttribute('aria-labelledby', 'fin-titre');
    brancherFin();
    ouvrirVoile('fin');
    Son.defaite();
  }
  function brancherFin() {
    const lier = (id, f) => { const b = $(id); if (b) b.addEventListener('click', () => { Son.pret(); Son.bouton(); f(); }); };
    lier('f-suivant', () => lancerNiveau(Math.min(NIVEAUX.length - 1, etat.n + 1)));
    lier('f-rejouer', () => lancerNiveau(etat.n));
    lier('f-reessayer', () => lancerNiveau(etat.n));
    lier('f-niveaux', () => { fermerVoile('fin'); montrerEcran('niveaux'); });
    lier('f-accueil', () => { fermerVoile('fin'); montrerEcran('titre'); });
    lier('f-deco', () => { fermerVoile('fin'); montrerEcran('deco'); });
  }

  // ==========================================================================
  // Pause
  // ==========================================================================
  function mettrePause() {
    if (etat.ecran !== 'jeu' || etat.enPause || etat.phase === 'fin' || $('tuto').classList.contains('actif')) return;
    etat.enPause = true;
    $('ecran-jeu').classList.add('fige');
    if (Son.ctx && Son.ctx.state === 'running') Son.ctx.suspend().catch(() => {});
    ouvrirVoile('pause');
  }
  function reprendre() {
    if (!etat.enPause) return;
    etat.enPause = false;
    $('ecran-jeu').classList.remove('fige');
    fermerVoile('pause');
    Son.pret();
  }
  $('b-pause').addEventListener('click', () => { Son.pret(); mettrePause(); });
  $('b-reprendre').addEventListener('click', reprendre);
  $('b-recommencer').addEventListener('click', () => { fermerVoile('pause'); lancerNiveau(etat.n); });
  $('b-accueil-pause').addEventListener('click', () => {
    oublierTaches(); fermerVoile('pause'); etat.enPause = false; etat.enPartie = false; $('ecran-jeu').classList.remove('fige'); montrerEcran('titre');
  });
  $('b-revoir').addEventListener('click', () => {
    fermerVoile('pause');
    // Explication de la dernière nouveauté rencontrée (jusqu'à ce service)
    let cle = 'base';
    for (let k = 0; k <= etat.n; k++) if (NIVEAUX[k].tuto) cle = NIVEAUX[k].tuto;
    tutoCle = cle;
    montrerTuto(cle, () => ouvrirVoile('pause'));
  });
  document.addEventListener('visibilitychange', () => { if (document.hidden) mettrePause(); });

  // ==========================================================================
  // Boutons, clavier, lancement
  // ==========================================================================
  $('b-pause').innerHTML = ICONES.pause;
  $('b-oeil').innerHTML = ICONES.oeil;
  $('b-retour-niveaux').innerHTML = ICONES.retour;
  $('b-retour-deco').innerHTML = ICONES.retour;
  $('dessin-titre').innerHTML = svgTitre();
  function libelles() {
    $('b-pause').setAttribute('aria-label', t('pause')); $('b-pause').title = t('pause');
    $('b-retour-niveaux').setAttribute('aria-label', t('retour'));
    $('b-retour-deco').setAttribute('aria-label', t('retour'));
    majBoutonsSon();
  }
  libelles();
  majTotal();
  ['b-son', 'b-son-titre', 'b-son-pause'].forEach((id) => $(id).addEventListener('click', basculerSon));
  $('b-oeil').addEventListener('click', coupDOeil);
  $('b-servir').addEventListener('click', servir);
  $('b-retour-niveaux').addEventListener('click', () => { Son.pret(); Son.bouton(); montrerEcran('titre'); });
  $('b-retour-deco').addEventListener('click', () => { Son.pret(); Son.bouton(); montrerEcran('titre'); });
  $('b-niveaux').addEventListener('click', () => { Son.pret(); Son.bouton(); montrerEcran('niveaux'); });
  $('b-deco').addEventListener('click', () => { Son.pret(); Son.bouton(); montrerEcran('deco'); });
  $('b-jouer').addEventListener('click', () => {
    Son.pret(); Son.bouton();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => lancerNiveau(Math.max(0, Math.min(NIVEAUX.length - 1, (Number(d.niveau) || 1) - 1))),
      // Nouvelle partie : depuis le service 1 (étoiles et décor sont gardés)
      onNouvelle: () => lancerNiveau(0),
      onEffacer: () => {
        progres.etoiles = NIVEAUX.map(() => 0); progres.records = NIVEAUX.map(() => 0); progres.niveauMax = 1;
        garderLocal(); majTotal();
      },
    });
  });

  // Sauvegarde à la fermeture, seulement pendant un service
  window.JEL_SAVE.surFermeture(() => {
    if (etat.enPartie) {
      window.JEL_SAVE.save(JEU, {
        niveau: etat.n + 1, score: etat.score,
        etoiles: progres.etoiles, records: progres.records, deco: progres.deco, tutos: progres.tutos, niveauMax: progres.niveauMax,
        options: { son: progres.son },
      });
    }
  });

  document.addEventListener('pointerdown', () => Son.pret(), { passive: true });
  document.addEventListener('keydown', (e) => {
    Son.pret();
    const code = e.code;
    if ($('tuto').classList.contains('actif')) {
      if (code === 'Escape') { e.preventDefault(); fermerTuto(); }
      return;
    }
    if (etat.ecran !== 'jeu') {
      if (code === 'Escape' && (etat.ecran === 'niveaux' || etat.ecran === 'deco')) montrerEcran('titre');
      return;
    }
    if (code === 'Escape' || code === 'KeyP') {
      e.preventDefault();
      if (etat.enPause) reprendre(); else mettrePause();
      return;
    }
    if (voileOuvert()) return;
    if (code === 'Backspace' || code === 'Delete') { e.preventDefault(); if (etat.plateau.length) retirerDuPlateau(etat.plateau.length - 1); return; }
    if (code === 'KeyO') { coupDOeil(); return; }
    if (code === 'KeyS') { servir(); return; }
    if ((code === 'Enter' || code === 'NumpadEnter') && !(document.activeElement && document.activeElement.tagName === 'BUTTON')) { e.preventDefault(); servir(); return; }
    const chiffre = /^(Digit|Numpad)([1-8])$/.exec(code);
    if (chiffre) { const k = Number(chiffre[2]) - 1; if (k < etat.comptoir.length) toucherPlat(k); return; }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(code)) {
      const plats = [...$('comptoir').children];
      const i = plats.indexOf(document.activeElement);
      const cols = getComputedStyle($('comptoir')).gridTemplateColumns.split(' ').length;
      let j = i < 0 ? 0 : i;
      if (i >= 0) {
        if (code === 'ArrowLeft') j = Math.max(0, i - 1);
        if (code === 'ArrowRight') j = Math.min(plats.length - 1, i + 1);
        if (code === 'ArrowUp') j = i - cols >= 0 ? i - cols : i;
        if (code === 'ArrowDown') j = i + cols < plats.length ? i + cols : i;
      }
      e.preventDefault();
      if (plats[j]) plats[j].focus();
    }
  });
  // Touche Entrée sur l'écran titre (sans bouton choisi) : Jouer
  document.addEventListener('keydown', (e) => {
    if (etat.ecran === 'titre' && !voileOuvert() && (e.code === 'Enter' || e.code === 'Space') && document.activeElement === document.body) { e.preventDefault(); $('b-jouer').click(); }
  });

  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
