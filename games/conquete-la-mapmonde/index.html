<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }

    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {

      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],

    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');

  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }

  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +

    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },

    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #0f3a63; font-family: system-ui, sans-serif; color: #fff;

  /* Barre du haut pendant la partie */

  #txtObjectif { font-size: 14px; font-weight: 800; }
  #txtChrono { font-size: 13px; opacity: .9; font-variant-numeric: tabular-nums; margin-top: 2px; }

  /* Barre du bas : moitié / tout et pouvoirs */
  #barre { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; display: flex; align-items: center;
    justify-content: center; gap: 10px; padding: 8px; padding-bottom: max(8px, env(safe-area-inset-bottom));
    background: linear-gradient(#0a214000, #0a2140f0); z-index: 4; }
  .outil { min-width: 58px; height: 54px; border-radius: 14px; background: #1d3e66; border: 2px solid #8db4e6;
    display: flex; align-items: center; justify-content: center; gap: 6px; position: relative; padding: 0 10px;

  .outil svg { width: 28px; height: 28px; flex: none; position: relative; z-index: 1; }
  .outil span { position: relative; z-index: 1; }
  .outil .voile { position: absolute; left: 0; right: 0; top: 0; height: 0; background: #000a; z-index: 2; pointer-events: none; }
  .outil.actif { border-color: #ffd34d; box-shadow: 0 0 14px #ffd34d, 0 3px 0 #0a1d35; }
  .outil.pret { animation: pret 1.2s ease-in-out infinite; }
  @keyframes pret { 50% { border-color: #ffe9a3; } }

  /* Bulle d'explication et petits messages */
  #bulle { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); width: min(92vw, 380px);
    background: #fff8e1; color: #3b2a12; border-radius: 16px; padding: 10px 14px; font-size: 15px; font-weight: 600;
    line-height: 1.3; box-shadow: 0 6px 18px #0006; z-index: 6; text-align: center; border: 3px solid #e8b84a; }
  #bulle small { display: block; font-size: 12px; opacity: .7; margin-top: 4px; font-weight: 500; }
  #toasts { position: absolute; left: 0; right: 0; top: 64px; display: flex; flex-direction: column; align-items: center;
    gap: 6px; pointer-events: none; z-index: 7; }
  #bulle:not(.cache) ~ #toasts { top: 190px; }
  .toast { background: #0b2445ee; border: 2px solid #ffd34d; border-radius: 999px; padding: 6px 14px; font-weight: 700;
    font-size: 14px; max-width: 90vw; text-align: center; animation: toast 2.6s ease forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-10px) scale(.9); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  /* Écrans (menus) */
  .ecran { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px;
    background: #061426a8; z-index: 10; }
  .panneau { background: linear-gradient(#173a66, #102a4c); border: 3px solid #e8c65a; border-radius: 22px; padding: 18px 16px;
    max-width: 430px; width: 100%; max-height: 100%; overflow: auto; text-align: center; box-shadow: 0 12px 40px #000a;
    touch-action: pan-y; animation: arrivee .35s ease; }
  @keyframes arrivee { from { transform: scale(.9) translateY(14px); opacity: 0; } }
  .panneau h2 { font-size: 25px; margin-bottom: 8px; color: #ffe08a; text-shadow: 0 2px 0 #0005; }
  .panneau p { font-size: 16px; line-height: 1.35; margin: 6px 0; }
  .gros { display: block; width: 100%; min-height: 58px; font-size: 21px; font-weight: 900; border-radius: 18px;
    background: linear-gradient(#ffd75e, #f2a51f); color: #3a2300; margin-top: 10px; box-shadow: 0 5px 0 #a8670a; padding: 6px 12px; }
  .gros:active { transform: translateY(3px); box-shadow: 0 2px 0 #a8670a; }
  .moyen { display: block; width: 100%; min-height: 48px; font-size: 17px; font-weight: 800; border-radius: 14px;
    background: #2b5a92; border: 2px solid #8fb6ea; padding: 6px 14px; margin-top: 8px; box-shadow: 0 3px 0 #0b2442; }
  .moyen:active { transform: translateY(2px); box-shadow: none; }
  .ligne { display: flex; gap: 8px; } .ligne > * { flex: 1; }

  /* Titre */
  #ecranTitre { background: linear-gradient(#081a33e6 0%, #081a3300 34%, #081a3300 66%, #081a33e6 100%);
    flex-direction: column; justify-content: space-between; padding: 12px 16px max(14px, env(safe-area-inset-bottom)); }
  .titreHaut { width: 100%; max-width: 460px; text-align: center; }
  .coinTitre { display: flex; justify-content: space-between; align-items: center; min-height: 46px; }
  #titreJeu { font-size: clamp(30px, 9vw, 46px); font-weight: 900; line-height: 1.02; color: #ffe08a; margin-top: 4px;
    text-shadow: 0 3px 0 #7a4b00, 0 6px 16px #000c; letter-spacing: .5px; }
  #consigneTitre { font-size: 16px; margin-top: 8px; font-weight: 600; text-shadow: 0 1px 4px #000; line-height: 1.3; }
  .titreBas { width: 100%; max-width: 420px; }

  /* Niveaux */
  .groupeCarte { margin: 12px 0 4px; text-align: left; }
  .groupeCarte h3 { font-size: 16px; color: #bfe0ff; margin-bottom: 6px; }
  .grilleNiv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .btNiv { min-height: 58px; border-radius: 14px; background: #2e64a3; border: 2px solid #9cc4f2; font-weight: 900;
    font-size: 19px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .btNiv .et { font-size: 12px; letter-spacing: 1px; color: #ffd34d; }
  .btNiv .et i { font-style: normal; color: #ffffff40; }
  .btNiv.ferme { background: #1b2f4a; border-color: #3d5676; color: #7d93ad; }
  .btNiv.ferme svg { width: 20px; height: 20px; }
  .btNiv.courant { border-color: #ffd34d; box-shadow: 0 0 10px #ffd34d88; }
  #totalEtoiles { font-weight: 800; color: #ffd34d; }

  /* Partie libre */
  .choix { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .choix button { flex: 1 1 30%; min-height: 46px; border-radius: 12px; background: #24507f; border: 2px solid #6f9bd0;
    font-weight: 700; font-size: 15px; padding: 4px 6px; }
  .choix button.oui { background: #f2b632; color: #3a2300; border-color: #fff0b0; }
  .choix button:disabled { opacity: .45; }
  .etiquette { text-align: left; font-weight: 800; color: #bfe0ff; margin-top: 6px; }

  /* Fiches nouveauté et aide */
  .dessin { width: 100%; max-width: 300px; height: 150px; display: block; margin: 6px auto; border-radius: 14px;
    background: #2b6aa8; border: 2px solid #ffffff33; }
  #listeForces { text-align: left; margin-top: 8px; font-size: 15px; line-height: 1.35; }
  #listeForces li { margin: 4px 0 4px 18px; }

  /* Fin de niveau */
  #etoilesFin { display: flex; justify-content: center; gap: 10px; margin: 8px 0; }
  #etoilesFin svg { width: 58px; height: 58px; transform: scale(.4); opacity: .25; transition: transform .35s cubic-bezier(.3,1.8,.5,1), opacity .2s; }
  #etoilesFin svg.allumee { transform: scale(1); opacity: 1; }
  #etoilesFin svg.allumee path { fill: #ffd34d; stroke: #b07800; }
  #bilanFin { font-size: 17px; line-height: 1.5; margin: 6px 0; }
  #bilanFin b { color: #ffe08a; }
  #recordFin.nouveau { color: #7dff9a; font-weight: 900; animation: pret .8s infinite; }
  #conseilFin { font-size: 15px; background: #ffffff14; border-radius: 12px; padding: 8px; margin-top: 6px; }
  .placeLangue { display: inline-flex; min-height: 46px; align-items: center; }
</style>
</head>

<div id="jeu">
  <canvas id="carte"></canvas>

  <div id="hud" class="cache">

    </button>
    <button id="btSon" class="rond btSon" data-i18n-aria="aria.son" data-i18n-title="aria.son"></button>
    <div id="infoObjectif"><div id="txtObjectif"></div><div id="txtChrono"></div></div>
    <button id="btAide" class="rond" data-i18n-aria="aria.aide" data-i18n-title="aria.aide">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M12 6c-2-1.6-5-2-8-1.5v14c3-.5 6-.1 8 1.5 2-1.6 5-2 8-1.5v-14c-3-.5-6-.1-8 1.5z"/><path d="M12 6v14"/></svg>
    </button>
  </div>

  <div id="barre" class="cache">
    <button id="btRatio" class="outil" data-i18n-aria="aria.ratio" data-i18n-title="aria.ratio">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2.4"/><path id="ratioRemplissage" d="M12 3a9 9 0 0 1 0 18z" fill="#fff"/></svg>
      <span id="txtRatio"></span>
    </button>
    <button id="btCor" class="outil" data-i18n-aria="aria.cor" data-i18n-title="aria.cor">
      <svg viewBox="0 0 24 24" fill="#ffd34d" stroke="#7a4b00" stroke-width="1.2" stroke-linejoin="round"><path d="M3 10h4l11-6v16L7 14H3z"/><path d="M7 14l1.5 5h3L10 15.6" fill="#e9b33a"/></svg>
      <div class="voile"></div>
    </button>
    <button id="btBouclier" class="outil" data-i18n-aria="aria.bouclier" data-i18n-title="aria.bouclier">
      <svg viewBox="0 0 24 24" fill="#8fd3ff" stroke="#1b4f7a" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/><path d="M12 5v14" stroke="#fff" stroke-width="1.6"/></svg>
      <div class="voile"></div>
    </button>
    <button id="btEtendard" class="outil" data-i18n-aria="aria.etendard" data-i18n-title="aria.etendard">
      <svg viewBox="0 0 24 24" stroke-linejoin="round"><path d="M5 2v20" stroke="#e9d7a6" stroke-width="2.4" stroke-linecap="round"/><path d="M6 3h13l-3 4.5 3 4.5H6z" fill="#ff7a59" stroke="#8a2a12" stroke-width="1.2"/><path d="M1 16h3M1 19h3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>

  <div id="bulle" class="cache" role="status"></div>

  <!-- Écran titre -->

      <div class="coinTitre">
        <div id="langueAccueil" class="placeLangue"></div>

    </div>
    <div class="titreBas">
      <button id="btJouer" class="gros" data-i18n="bt.jouer"></button>

      <p data-i18n="libre.texte"></p>

      <div id="choixCarte" class="choix"></div>
      <div class="etiquette" data-i18n="libre.rivaux"></div>
      <div id="choixRivaux" class="choix"></div>
      <div class="etiquette" data-i18n="libre.force"></div>
      <div id="choixForce" class="choix"></div>
      <p id="recordLibre"></p>
      <button id="btLancerLibre" class="gros" data-i18n="bt.commencer"></button>
      <button id="btRetourLibre" class="moyen" data-i18n="bt.accueil"></button>
    </div>
  </div>

  <!-- Fiche nouveauté -->
  <div id="ecranFiche" class="ecran cache">
    <div class="panneau">
      <h2 id="ficheTitre"></h2>
      <canvas id="ficheDessin" class="dessin" width="600" height="300"></canvas>
      <p id="ficheTexte"></p>
      <button id="btFicheOk" class="gros" data-i18n="bt.compris"></button>
    </div>
  </div>

  <!-- Forces des troupes -->

    <div class="panneau">
      <h2 data-i18n="aide.titre"></h2>
      <canvas id="aideDessin" class="dessin" width="600" height="300"></canvas>
      <ul id="listeForces"></ul>
      <button id="btAideOk" class="gros" data-i18n="bt.reprendre"></button>
    </div>
  </div>

  <!-- Pause -->
  <div id="ecranPause" class="ecran cache">
    <div class="panneau">
      <h2 data-i18n="pause.titre"></h2>
      <button id="btReprendre" class="gros" data-i18n="bt.reprendre"></button>
      <button id="btRecommencer" class="moyen" data-i18n="bt.recommencer"></button>
      <button id="btPauseNiveaux" class="moyen" data-i18n="bt.niveaux"></button>
      <button id="btPauseAccueil" class="moyen" data-i18n="bt.accueil"></button>
      <div class="ligne" style="margin-top:10px;align-items:center;justify-content:center">
        <div id="languePause" class="placeLangue" style="flex:none"></div>
        <button id="btSonPause" class="rond btSon" style="flex:none" data-i18n-aria="aria.son" data-i18n-title="aria.son"></button>
      </div>

    const niv = numero >= 0 ? numero : S.deb - 1;
    Q.ratioDispo = niv >= DEBLOCAGE.ratio;
    ['cor', 'bouclier', 'etendard'].forEach((p) => { if (niv >= DEBLOCAGE[p]) Q.pouvoirs[p] = { actif: 0, recharge: 6, cible: null }; });
    return Q;
  }

  // Le joueur a choisi son point de départ : on installe tous les royaumes.
  function placer(idx) {
    const Q = P; const def = Q.def;
    installer(Q, idx, 1);
    const places = [idx];
    let libres = Q.carte.departs.filter((d) => d !== idx);
    if (def.allie) {
      const d = sauts(Q, idx);
      libres.sort((a, b) => d[a] - d[b]);
      const a = libres.shift(); installer(Q, a, 5); places.push(a);
      Q.ia[5] = { p: IA.allie, t: IA.allie.delai };
      Q.bonus[5] = 1;
    }
    def.rivaux.forEach((caractere, k) => {
      const o = 2 + k;
      const dist = places.map((p) => sauts(Q, p));
      let meilleur = libres[0], score = -1;
      for (const l of libres) {
        const s = Math.min(...dist.map((d) => d[l])) * 10 + (dist[0][l]);
        if (s > score) { score = s; meilleur = l; }
      }
      libres = libres.filter((l) => l !== meilleur);
      installer(Q, meilleur, o); places.push(meilleur);
      Q.chateauxRivaux.push(meilleur);
      Q.ia[o] = { p: IA[caractere], t: IA[caractere].delai };
      Q.bonus[o] = IA[caractere].bonus * (def.bonus || 1);
      Q.vivants[o] = true;
    });
    Q.phase = 'jeu';
    Q.selection = null;
    Q.curseur = idx;
    SONS.conquete();
    effetConquete(Q, Q.noeuds[idx]);
    if (Q.tuto === 1) { Q.tuto = 2; bulle(traduire('tuto.2')); }
    else cacherBulle();
    majHud();
  }
  function installer(Q, i, o) {
    const nd = Q.noeuds[i];
    nd.owner = o; nd.type = 'chateau'; nd.n = 10; nd.depart = o;
  }

  // ========================================================================
  // 6. Moteur de la partie (temps réel)
  // ========================================================================
  function vitesse(Q, g, e) {
    let v = UNITES[g.u].vit;
    if (e.k === 'mont') v *= g.u === 'cavalier' ? 0.33 : 0.5;
    if (e.k === 'mer') v = 8;
    if (g.o === 1 && Q.pouvoirs.etendard && Q.pouvoirs.etendard.actif > 0) v *= 1.6;
    return v;
  }
  // Force réelle d'une troupe qui attaque une région (forteresse comprise).
  function forceContre(u, nd) {
    let k = force(u, BATIMENTS[nd.type].unite);
    if (nd.type === 'fort' || nd.type === 'cite') k *= u === 'catapulte' ? 3 : 0.5;
    return k;
  }
  function vitesseProd(Q, nd, fermes) {
    const b = BATIMENTS[nd.type];
    let r = (1 / b.prod) * (1 + 0.2 * (fermes[nd.owner] || 0));
    if (nd.owner === 1 && Q.pouvoirs.cor && Q.pouvoirs.cor.actif > 0) r *= 2;
    if (Q.bonus[nd.owner]) r *= Q.bonus[nd.owner];
    return r;
  }
  function compterFermes(Q) {
    const f = {};
    for (const nd of Q.noeuds) if (nd.type === 'ferme' && nd.owner) f[nd.owner] = (f[nd.owner] || 0) + 1;
    return f;
  }

  // Chemin du joueur : il traverse ses propres régions jusqu'à la cible.
  function chemin(Q, o, s, c) {
    if (s === c) return null;
    const prec = {}; const vus = new Set([s]); const file = [s];
    while (file.length) {
      const u = file.shift();
      for (const v of Q.noeuds[u].voisins) {
        if (v.e.ferme > 0) continue;
        if (v.n === c) {
          const ch = [c]; let x = u;
          while (x !== s) { ch.unshift(x); x = prec[x]; }
          ch.unshift(s);
          return ch;
        }
        if (!vus.has(v.n) && Q.noeuds[v.n].owner === o) { vus.add(v.n); prec[v.n] = u; file.push(v.n); }
      }
    }
    return null;
  }
  function creerGroupe(Q, o, src, ch, q) {
    src.n -= q;
    const g = { id: ++Q.idGroupe, o, u: BATIMENTS[src.type].unite, n: q, ch, s: 0, d: 0, x: src.x, y: src.y };
    Q.groupes.push(g);
    return g;
  }

  function maj(Q, dt) {
    if (Q.phase !== 'jeu' && Q.phase !== 'fin') { majEffets(Q, dt); return; }
    if (Q.phase === 'jeu') Q.temps += dt;
    const fermes = compterFermes(Q);

    // Production
    for (const nd of Q.noeuds) {
      if (nd.bouclier > 0) nd.bouclier -= dt;
      if (nd.secousse > 0) nd.secousse = Math.max(0, nd.secousse - dt * 2);
      if (nd.eclat > 0) nd.eclat = Math.max(0, nd.eclat - dt * 1.5);
      if (!nd.owner) continue;
      const cap = BATIMENTS[nd.type].cap;
      if (nd.n < cap) nd.n = Math.min(cap, nd.n + vitesseProd(Q, nd, fermes) * dt);
    }

    // Pouvoirs
    for (const nom in Q.pouvoirs) {
      const p = Q.pouvoirs[nom];
      if (p.actif > 0) p.actif = Math.max(0, p.actif - dt);
      if (p.recharge > 0) {
        p.recharge = Math.max(0, p.recharge - dt);
        if (p.recharge === 0 && Q.phase === 'jeu') SONS.pret();
      }
    }

    // Tempêtes sur les routes de mer
    if (Q.def.tempetes && Q.phase === 'jeu') {
      for (const e of Q.aretes) if (e.ferme > 0) e.ferme = Math.max(0, e.ferme - dt);
      Q.tempeteT -= dt;
      if (Q.tempeteT <= 0) {
        const mers = Q.aretes.filter((e) => e.k === 'mer' && e.ferme <= 0);
        if (mers.length) {
          const e = mers[Math.floor(Math.random() * mers.length)];
          e.ferme = 9; SONS.tempete(); toast(traduire('toast.tempete'));
        }
        Q.tempeteT = 14 + Math.random() * 5;
      }
    }

    // Déplacement des troupes
    for (const g of Q.groupes) {
      if (g.mort) continue;
      const a = g.ch[g.s], b = g.ch[g.s + 1];
      const e = Q.paires[a * 100 + b];
      g.d += vitesse(Q, g, e) * dt;
      if (g.d >= e.len) {
        const nb = Q.noeuds[b];
        if (g.s + 1 < g.ch.length - 1 && nb.owner === g.o) { g.s++; g.d -= e.len; }
        else { arrivee(Q, g, nb); g.mort = true; }
      }
      if (!g.mort) {
        const e2 = Q.paires[g.ch[g.s] * 100 + g.ch[g.s + 1]];
        const na = Q.noeuds[g.ch[g.s]], nb2 = Q.noeuds[g.ch[g.s + 1]];
        const k = Math.min(1, g.d / e2.len);
        g.x = lerp(na.x, nb2.x, k); g.y = lerp(na.y, nb2.y, k);
      }
    }

    // Rencontres sur les routes : deux armées ennemies qui se croisent se battent.
    for (let i = 0; i < Q.groupes.length; i++) {
      const g1 = Q.groupes[i]; if (g1.mort) continue;
      for (let j = i + 1; j < Q.groupes.length; j++) {
        const g2 = Q.groupes[j]; if (g2.mort || !ennemis(g1.o, g2.o)) continue;
        if (Math.abs(g1.x - g2.x) > 3 || Math.abs(g1.y - g2.y) > 3) continue;
        const e1 = Q.paires[g1.ch[g1.s] * 100 + g1.ch[g1.s + 1]];
        const e2 = Q.paires[g2.ch[g2.s] * 100 + g2.ch[g2.s + 1]];
        if (e1 !== e2 || g1.ch[g1.s] === g2.ch[g2.s]) continue; // même route, sens opposés
        const k = force(g1.u, g2.u);
        if (g1.n * k > g2.n) { g1.n -= g2.n / k; g2.mort = true; } else { g2.n -= g1.n * k; g1.mort = true; }
        if (g1.n < 0.5) g1.mort = true;
        if (g2.n < 0.5) g2.mort = true;
        effetPouf(Q, (g1.x + g2.x) / 2, (g1.y + g2.y) / 2);
        if (g1.o === 1 || g2.o === 1) SONS.choc();
      }
    }

    // Les tours d'archers repoussent un soldat ennemi qui passe près d'elles.
    for (const nd of Q.noeuds) {
      if (nd.type !== 'tour' || !nd.owner || nd.n < 1) continue;
      nd.tir -= dt;
      if (nd.tir > 0) continue;
      let cible = null, dmin = 17;
      for (const g of Q.groupes) {
        if (g.mort || !ennemis(nd.owner, g.o)) continue;
        const d = Math.hypot(g.x - nd.x, g.y - nd.y);
        if (d < dmin) { dmin = d; cible = g; }
      }
      if (cible) {
        cible.n -= 1; if (cible.n < 0.5) cible.mort = true;
        Q.effets.push({ type: 'fleche', x1: nd.x, y1: nd.y, x2: cible.x, y2: cible.y, v: 0.35, max: 0.35 });
        if (nd.owner === 1 || cible.o === 1) SONS.tir();
        nd.tir = 1.2;
      } else nd.tir = 0.2;
    }
    Q.groupes = Q.groupes.filter((g) => !g.mort);

    // Royaumes de l'ordinateur
    if (Q.phase === 'jeu') {
      for (const o in Q.ia) {
        const ia = Q.ia[o];
        ia.t -= dt;
        if (ia.t <= 0) { iaJouer(Q, +o); ia.t = ia.p.intervalle * (0.85 + Math.random() * 0.3); }
      }
      verifierFin(Q);
    }
    majEffets(Q, dt);
  }

  // Une troupe arrive dans une région.
  function arrivee(Q, g, nd) {
    if (!ennemis(g.o, nd.owner)) { nd.n = Math.min(199, nd.n + g.n); nd.eclat = 0.4; return; }
    if (nd.bouclier > 0) { effetPouf(Q, nd.x, nd.y); nd.eclat = 0.6; if (g.o === 1 || nd.owner === 1) SONS.bouclier(); return; }
    const k = forceContre(g.u, nd);
    const attaque = g.n * k;
    if (attaque > nd.n) {
      const ancien = nd.owner;
      nd.n = Math.max(1, g.n - nd.n / k);
      nd.owner = g.o;
      nd.eclat = 1;
      effetConquete(Q, nd);
      if (g.o === 1) { SONS.conquete(); if (Q.tuto === 2) { Q.tuto = 3; bulle(traduire('tuto.3')); setTimeout(() => { if (P === Q && Q.tuto === 3) { Q.tuto = 0; cacherBulle(); } }, 6000); } }
      else if (ancien === 1) { SONS.perte(); nd.secousse = 1; }
      if (Q.selection === nd && ancien === 1) Q.selection = null;
    } else {
      nd.n -= attaque;
      nd.secousse = 0.6;
      effetPouf(Q, nd.x, nd.y);
      if (g.o === 1 || nd.owner === 1) SONS.choc();
    }
  }

  function vivant(Q, o) { return Q.noeuds.some((n) => n.owner === o) || Q.groupes.some((g) => g.o === o); }
  function nbRegions(Q, o) { return Q.noeuds.filter((n) => n.owner === o).length; }

  function verifierFin(Q) {
    const def = Q.def;
    // Rivaux battus
    for (const o in Q.vivants) {
      if (Q.vivants[o] && !vivant(Q, +o)) {
        Q.vivants[o] = false; SONS.battu(); toast(traduire('toast.battu.' + o));
        delete Q.ia[o];
      }
    }
    const rivauxEnVie = Object.keys(Q.vivants).filter((o) => Q.vivants[o]).length;
    if (!vivant(Q, 1)) return terminer(Q, false, 'perdu');
    let gagne = false;
    switch (def.obj.type) {
      case 'tout': gagne = Q.noeuds.every((n) => equipe(n.owner) === 1); break;
      case 'eliminer': gagne = rivauxEnVie === 0; break;
      case 'regions': gagne = nbRegions(Q, 1) >= def.obj.n; break;
      case 'chateaux': gagne = rivauxEnVie === 0 || Q.chateauxRivaux.every((i) => equipe(Q.noeuds[i].owner) === 1); break;
      case 'cite': gagne = Q.noeuds[def.cite].owner === 1; break;
      case 'tenir': gagne = Q.temps >= def.obj.temps || rivauxEnVie === 0; break;
    }
    if (gagne) return terminer(Q, true);
    if (def.limite && Q.temps >= def.limite) terminer(Q, false, 'temps');
  }

  function terminer(Q, victoire, raison) {
    Q.phase = 'fin'; Q.fin = { victoire, raison }; Q.finT = 1.4; Q.selection = null; Q.modeBouclier = false;
    cacherBulle();
    if (victoire) { SONS.victoire(); lancerConfettis(); } else SONS.defaite();
  }

  // ---------- Intelligence des royaumes rivaux ----------
  function iaJouer(Q, o) {
    const p = Q.ia[o].p;
    const mes = Q.noeuds.filter((n) => n.owner === o);
    if (!mes.length) return;
    const fermes = compterFermes(Q);
    for (let action = 0; action < p.actions; action++) {
      let meilleur = null, meilleurScore = 0;
      for (const src of mes) {
        if (src.n < p.seuil) continue;
        const u = BATIMENTS[src.type].unite;
        for (const v of src.voisins) {
          if (v.e.ferme > 0) continue;
          const nb = Q.noeuds[v.n];
          if (!ennemis(o, nb.owner) || nb.bouclier > 0) continue;
          const k = forceContre(u, nb);
          let def = nb.n;
          if (nb.owner) def += (v.e.len / vitesse(Q, { u, o }, v.e)) * vitesseProd(Q, nb, fermes);
          const dispo = src.n * p.part;
          if (dispo * k <= def + 1) continue;
          let val = 1;
          if (nb.type === 'chateau') val = 1.6;
          else if (nb.type === 'ferme') val = 1.4;
          else if (nb.type === 'cite') val = 1.8;
          if (!nb.owner) val *= 1.1;
          else if (equipe(nb.owner) === 1) val *= p.agress * Q.agressionJoueur;
          let s = val / (def + 6);
          if (p.ruse) s *= k;
          if (s > meilleurScore) { meilleurScore = s; meilleur = { src, nb, k, def, dispo }; }
        }
      }
      if (meilleur) {
        let q = p.ruse ? Math.min(meilleur.dispo, meilleur.def / meilleur.k * 1.35 + 3) : meilleur.dispo;
        q = Math.floor(q);
        if (q >= 1) creerGroupe(Q, o, meilleur.src, [meilleur.src.i, meilleur.nb.i], q);
        continue;
      }
      // Sinon : renforcer le front avec les troupes de l'arrière.
      const front = mes.filter((n) => n.voisins.some((v) => ennemis(o, Q.noeuds[v.n].owner)));
      if (!front.length) return;
      const dist = {}; const file = [];
      front.forEach((n) => { dist[n.i] = 0; file.push(n.i); });
      while (file.length) {
        const u = file.shift();
        for (const v of Q.noeuds[u].voisins) if (Q.noeuds[v.n].owner === o && dist[v.n] == null) { dist[v.n] = dist[u] + 1; file.push(v.n); }
      }
      const arriere = mes.filter((n) => dist[n.i] > 0 && n.n > 14);
      if (!arriere.length) return;
      const src = arriere[Math.floor(Math.random() * arriere.length)];
      const pas = src.voisins.filter((v) => v.e.ferme <= 0 && Q.noeuds[v.n].owner === o && dist[v.n] < dist[src.i]);
      if (pas.length) creerGroupe(Q, o, src, [src.i, pas[0].n], Math.floor(src.n * 0.7));
    }
  }

  // ---------- Effets visuels ----------
  function effetConquete(Q, nd) {
    Q.effets.push({ type: 'onde', x: nd.x, y: nd.y, v: 0.7, max: 0.7, c: COULEURS[nd.owner] });
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 8 + Math.random() * 14;
      Q.effets.push({ type: 'part', x: nd.x, y: nd.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 6, v: 0.9, max: 0.9,
        c: i % 3 ? COULEURS[nd.owner] : '#ffe066' });
    }
    Q.effets.push({ type: 'drapeau', x: nd.x, y: nd.y, v: 1.1, max: 1.1, c: COULEURS[nd.owner] });
  }
  function effetPouf(Q, x, y) {
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2;
      Q.effets.push({ type: 'pouf', x, y, vx: Math.cos(a) * 6, vy: Math.sin(a) * 6, v: 0.5, max: 0.5 });
    }
  }
  function majEffets(Q, dt) {
    for (const f of Q.effets) {
      f.v -= dt;
      if (f.vx != null) { f.x += f.vx * dt; f.y += f.vy * dt; if (f.type === 'part') f.vy += 30 * dt; }
    }
    Q.effets = Q.effets.filter((f) => f.v > 0);
  }

  // Confettis de victoire (sur tout l'écran)
  let confettis = [];
  function lancerConfettis() {
    for (let i = 0; i < 120; i++) {
      confettis.push({ x: Math.random() * LARG, y: -20 - Math.random() * HAUT * 0.5, vx: (Math.random() - 0.5) * 80,
        vy: 80 + Math.random() * 140, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8,
        c: ['#ffd34d', '#2f7de1', '#ff7a59', '#7dff9a', '#ffffff'][i % 5] });
    }
  }

  // ========================================================================
  // 7. Dessin
  // ========================================================================
  const toile = $('carte');
  const ctx = toile.getContext('2d');
  let LARG = 0, HAUT = 0, DPR = 1;
  function redimensionner() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    LARG = window.innerWidth; HAUT = window.innerHeight;
    toile.width = Math.round(LARG * DPR); toile.height = Math.round(HAUT * DPR);
    if (P) P.vue = null;
    if (demo) demo.vue = null;
  }

  // Place de la carte à l'écran (la carte se couche sur un écran large).
  // Marges autour de la carte : sous le titre et au-dessus des boutons (écran titre), ou entre les barres (partie).
  function marges(Q) {
    if (Q === demo) {
      const h = document.querySelector('.titreHaut').getBoundingClientRect();
      const b = document.querySelector('.titreBas').getBoundingClientRect();
      if (h.height && b.height) return [Math.round(h.bottom + 6), Math.round(HAUT - b.top + 8)];
      return [HAUT * 0.27, HAUT * 0.25];
    }
    return [62, $('barre').classList.contains('cache') ? 12 : 78];
  }
  function calculerVue(Q) {
    const [haut, bas] = marges(Q);
    const marge = 8;
    const aw = LARG - marge * 2, ah = Math.max(80, HAUT - haut - bas);
    const rot = aw > ah * 1.15;
    const MW = rot ? 150 : 100, MH = rot ? 100 : 150;
    const s = Math.min(aw / MW, ah / MH);
    const v = { s, rot, ox: (LARG - MW * s) / 2, oy: haut + (ah - MH * s) / 2, cle: LARG + 'x' + HAUT + 'x' + haut + 'x' + bas };
    v.r = Math.max(17, Math.min(30, s * 5.6));
    Q.vue = v;
    construireChemins(Q);
  }
  function vers(Q, x, y) {
    const v = Q.vue;
    return v.rot ? [v.ox + y * v.s, v.oy + x * v.s] : [v.ox + x * v.s, v.oy + y * v.s];
  }

  // Formes de la terre (îles) : cercles autour des régions + bandes le long des routes de terre.
  function formeTerre(Q, rayon, demiLargeur) {
    const chemin2 = new Path2D();
    const s = Q.vue.s;
    for (const nd of Q.noeuds) {
      const [x, y] = vers(Q, nd.x, nd.y);
      chemin2.moveTo(x + rayon * s, y);
      chemin2.arc(x, y, rayon * s, 0, Math.PI * 2);
    }
    for (const e of Q.aretes) {
      if (e.k === 'mer') continue;
      const [ax, ay] = vers(Q, Q.noeuds[e.a].x, Q.noeuds[e.a].y);
      const [bx, by] = vers(Q, Q.noeuds[e.b].x, Q.noeuds[e.b].y);
      const l = Math.hypot(bx - ax, by - ay) || 1;
      const nx = -(by - ay) / l * demiLargeur * s, ny = (bx - ax) / l * demiLargeur * s;
      let pts = [[ax + nx, ay + ny], [bx + nx, by + ny], [bx - nx, by - ny], [ax - nx, ay - ny]];
      // même sens que les cercles, sinon les formes s'annulent
      let aire = 0;
      for (let i = 0; i < 4; i++) { const p = pts[i], q = pts[(i + 1) % 4]; aire += p[0] * q[1] - q[0] * p[1]; }
      if (aire < 0) pts = pts.reverse();
      chemin2.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < 4; i++) chemin2.lineTo(pts[i][0], pts[i][1]);
      chemin2.closePath();
    }
    return chemin2;
  }
  function construireChemins(Q) {
    Q.terre = formeTerre(Q, 14, 10);
    Q.rivage = formeTerre(Q, 16.5, 12.5);
    if (!Q.carte.decorListe) Q.carte.decorListe = genererDecor(Q);
  }

  // Décor (arbres, maisons, rochers…) placé une fois pour toutes, loin des routes.
  function genererDecor(Q) {
    const r = alea(Q.ic * 977 + 5);
    const liste = [];
    const sorte = Q.carte.decor;
    for (const nd of Q.noeuds) {
      for (let k = 0; k < 7; k++) {
        const a = r() * Math.PI * 2, d = 7.5 + r() * 6;
        const x = nd.x + Math.cos(a) * d, y = nd.y + Math.sin(a) * d;
        if (Q.noeuds.some((m) => Math.hypot(m.x - x, m.y - y) < 7.5)) continue;
        if (Q.aretes.some((e) => e.k !== 'mer' && distSegment(x, y, Q.noeuds[e.a].x, Q.noeuds[e.a].y, Q.noeuds[e.b].x, Q.noeuds[e.b].y) < 3.2)) continue;
        if (liste.some((o) => Math.hypot(o.x - x, o.y - y) < 3.4)) continue;
        let type = sorte;
        if (sorte === 'mixte') type = ['arbre', 'sapin', 'maison', 'rocher'][Math.floor(r() * 4)];

  // ---------- Icônes (dessinées, jamais de texte) ----------

  // Pastille d'une région (sans le nombre).
  function pastille(c, x, y, r, owner, type, opts) {
    opts = opts || {};

      c.fillStyle = coul; c.strokeStyle = '#4a4238'; c.lineWidth = 1.5;

        c.fillRect(-r * 0.2, -r * 0.2, r * 0.4, r * 0.4); c.strokeRect(-r * 0.2, -r * 0.2, r * 0.4, r * 0.4); c.restore();
      }

    if (type === 'chateau' || type === 'cite') {

    c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fillStyle = COULEURS[owner]; c.fill();

  function visible(Q, nd) {
    if (!Q.def || !Q.def.brouillard || Q.phase === 'fin') return true;
    if (equipe(nd.owner) === 1) return true;
    return nd.voisins.some((v) => equipe(Q.noeuds[v.n].owner) === 1);
  }

  function dessinerMonde(Q, now) {
    if (!Q.vue || Q.vue.cle !== cleVue(Q)) calculerVue(Q);
    const s = Q.vue.s, R = Q.vue.r;
    const c = ctx;
    // Mer
    const fond = c.createLinearGradient(0, 0, 0, HAUT);
    fond.addColorStop(0, '#2c74b8'); fond.addColorStop(1, '#1b4f86');
    c.fillStyle = fond; c.fillRect(0, 0, LARG, HAUT);
    const decor = Q.carte.decorListe || [];
    c.strokeStyle = 'rgba(255,255,255,0.22)'; c.lineWidth = Math.max(1.2, s * 0.35); c.lineCap = 'round';
    for (const d of decor) {

    c.save(); c.clip(Q.terre);

      for (let k = 0; k < 2; k++) {

    for (const e of Q.aretes) {

      else if (e.k === 'mont') { c.strokeStyle = '#6f6a63'; c.lineWidth = s * 1.1; c.setLineDash([s * 1.6, s * 1.1]); }
      else { c.strokeStyle = '#b98e52'; c.lineWidth = s * 1.1; c.setLineDash([s * 1.8, s * 1.0]); }
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();

        c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(mx, my - s * 2.8); c.lineTo(mx + s * 1.6, my - s * 0.3); c.lineTo(mx, my - s * 0.3); c.closePath(); c.fill();

    // Cibles possibles autour de la région choisie
    if (Q.selection && Q.phase === 'jeu') {
      const sel = Q.selection;
      for (const v of sel.voisins) {
        if (v.e.ferme > 0) continue;
        const nb = Q.noeuds[v.n];
        const [x, y] = vers(Q, nb.x, nb.y);
        c.save(); c.setLineDash([5, 5]); c.lineDashOffset = -now * 20; c.strokeStyle = '#fffbe0'; c.lineWidth = 2.5;
        c.beginPath(); c.arc(x, y, R + 7, 0, Math.PI * 2); c.stroke(); c.restore();
      }
    }

    // Régions
    for (const nd of Q.noeuds) {
      let [x, y] = vers(Q, nd.x, nd.y);
      if (!visible(Q, nd)) continue;
      if (nd.secousse > 0) x += Math.sin(now * 70) * nd.secousse * 4;
      const r = R * (nd.type === 'cite' ? 1.25 : 1) * (1 + nd.eclat * 0.12);
      if (Q.phase === 'placement' && Q.def && Q.def.departs.includes(nd.i)) {
        const pulse = (Math.sin(now * 5) + 1) / 2;
        c.beginPath(); c.arc(x, y, r + 6 + pulse * 6, 0, Math.PI * 2); c.fillStyle = 'rgba(255,224,102,' + (0.25 + pulse * 0.35) + ')'; c.fill();
      }
      if (Q.selection === nd) {
        const pulse = (Math.sin(now * 7) + 1) / 2;
        c.beginPath(); c.arc(x, y, r + 5 + pulse * 3, 0, Math.PI * 2); c.fillStyle = 'rgba(255,240,150,0.55)'; c.fill();
      }
      pastille(c, x, y, r, nd.owner, nd.type, { port: nd.port });
      if (Q.phase === 'placement' && Q.def && Q.def.departs.includes(nd.i)) {

        c.fillStyle = COULEURS[1]; c.beginPath(); c.moveTo(dx, dy - h); c.lineTo(dx + r * 0.9, dy - h + r * 0.3 + Math.sin(now * 6) * 2); c.lineTo(dx, dy - h + r * 0.6); c.closePath(); c.fill();
      }
      if (nd.bouclier > 0) {
        c.beginPath(); c.arc(x, y, r * 1.55, 0, Math.PI * 2);
        c.fillStyle = 'rgba(143,211,255,' + (0.25 + Math.sin(now * 6) * 0.08) + ')'; c.fill();
        c.strokeStyle = '#d6f0ff'; c.lineWidth = 2.5; c.stroke();
      }
      if (!Q.sansNombres) {
        const txt = String(Math.floor(nd.n));

      }
    }
    // Brouillard
    if (Q.def && Q.def.brouillard && Q.phase !== 'fin') {
      for (const nd of Q.noeuds) {
        if (visible(Q, nd)) continue;
        const [x, y] = vers(Q, nd.x, nd.y);
        nuage(c, x + Math.sin(now * 0.6 + nd.i) * 3, y, R * 1.6, 0.93);
      }
    }

    // Troupes en marche
    for (const g of Q.groupes) {
      const na = Q.noeuds[g.ch[g.s]], nb = Q.noeuds[g.ch[g.s + 1]];
      if (Q.def && Q.def.brouillard && g.o !== 1 && !visible(Q, na) && !visible(Q, nb)) continue;
      const [x, y] = vers(Q, g.x, g.y);
      const rg = R * 0.55;
      // petits soldats qui suivent
      const [ax, ay] = vers(Q, na.x, na.y);
      const l = Math.hypot(x - ax, y - ay) || 1;
      const ux = (ax - x) / l, uy = (ay - y) / l;
      c.fillStyle = COULEURS[g.o];
      const nbPoints = Math.min(4, Math.ceil(g.n / 6));
      for (let i = 1; i <= nbPoints; i++) {
        c.beginPath(); c.arc(x + ux * rg * 1.3 * i + Math.sin(now * 9 + i) * 1.5, y + uy * rg * 1.3 * i, rg * 0.36, 0, Math.PI * 2); c.fill();
      }
      jeton(c, x, y, rg, g.o, g.u);
      if (!Q.sansNombres) texteContour(c, String(Math.max(1, Math.floor(g.n))), x + rg * 1.45, y - rg * 0.9, Math.round(rg * 0.95), '#fff');
    }

    // Effets
    for (const f of Q.effets) {
      const a = f.v / f.max;
      if (f.type === 'onde') {
        const [x, y] = vers(Q, f.x, f.y);
        c.beginPath(); c.arc(x, y, R * (1 + (1 - a) * 2.2), 0, Math.PI * 2); c.strokeStyle = f.c; c.globalAlpha = a; c.lineWidth = 4; c.stroke(); c.globalAlpha = 1;
      } else if (f.type === 'part') {

        c.globalAlpha = Math.min(1, a * 1.5); c.fillStyle = f.c; c.fillRect(x - 3, y - 3, 6, 6); c.globalAlpha = 1;
      } else if (f.type === 'pouf') {
        const [x, y] = vers(Q, f.x, f.y);
        c.globalAlpha = a * 0.8; c.fillStyle = '#f4f1ea'; c.beginPath(); c.arc(x, y, R * 0.3 * (2 - a), 0, Math.PI * 2); c.fill(); c.globalAlpha = 1;
      } else if (f.type === 'fleche') {
        const [x1, y1] = vers(Q, f.x1, f.y1); const [x2, y2] = vers(Q, f.x2, f.y2);
        const k = 1 - a;
        c.strokeStyle = '#fff6c9'; c.lineWidth = 2; c.globalAlpha = Math.min(1, a * 2);
        c.beginPath(); c.moveTo(lerp(x1, x2, Math.max(0, k - 0.25)), lerp(y1, y2, Math.max(0, k - 0.25))); c.lineTo(lerp(x1, x2, k), lerp(y1, y2, k)); c.stroke();
        c.globalAlpha = 1;
      } else if (f.type === 'drapeau') {
        const [x, y] = vers(Q, f.x, f.y);
        const k = 1 - a; const h = R * 1.6;

        c.fillStyle = f.c; c.beginPath(); c.moveTo(bx, by - h); c.lineTo(bx + R, by - h + R * 0.3); c.lineTo(bx, by - h + R * 0.6); c.closePath(); c.fill();
        c.globalAlpha = 1;
      }
    }

    // Flèche du glisser
    if (Q.glisse && Q.glisse.bouge && Q.selection) {
      const [x, y] = vers(Q, Q.selection.x, Q.selection.y);
      const gx = Q.glisse.x, gy = Q.glisse.y;
      c.save(); c.strokeStyle = '#fffbe0'; c.lineWidth = 5; c.setLineDash([10, 7]); c.lineCap = 'round';
      c.beginPath(); c.moveTo(x, y); c.lineTo(gx, gy); c.stroke(); c.restore();

      c.fillStyle = '#fffbe0'; c.beginPath(); c.moveTo(gx + Math.cos(a) * 12, gy + Math.sin(a) * 12);

  function ouvrirLibre() {

  // ---------- Fin de niveau ----------
  function afficherFin() {
    const Q = P; const def = Q.def; const v = Q.fin.victoire;
    const regions = nbRegions(Q, 1);
    let etoiles = 0, score = 0;
    if (v) {
      if (def.obj.type === 'tenir') etoiles = regions >= def.et[0] ? 3 : regions >= def.et[1] ? 2 : 1;
      else etoiles = Q.temps <= def.et[0] ? 3 : Q.temps <= def.et[1] ? 2 : 1;
      score = 500 + regions * 40 + (def.obj.type === 'tenir' ? 0 : Math.max(0, Math.round((def.et[1] * 1.4 - Q.temps) * 4))) + etoiles * 200;
    }
    let ancien = 0, nouveau = false;
    if (Q.numero >= 0) {
      ancien = S.rec[Q.numero] || 0;
      if (v) {
        S.et[Q.numero] = Math.max(S.et[Q.numero] || 0, etoiles);
        if (score > ancien) { S.rec[Q.numero] = score; nouveau = true; }
        S.deb = Math.max(S.deb, Math.min(NIVEAUX.length, Q.numero + 2));
      }
    } else if (v) {
      ancien = S.lib[def.carte] || 0;
      if (score > ancien) { S.lib[def.carte] = score; nouveau = true; }
    }
    sauver();
    const dernier = Q.numero === NIVEAUX.length - 1;
    $('titreFin').textContent = v ? traduire(dernier ? 'fin.titreFinal' : 'fin.victoire') : traduire('fin.defaite');
    $('sousTitreFin').textContent = v
      ? (dernier ? traduire('fin.bilanFinal', { n: S.et.reduce((a, b) => a + (b || 0), 0), max: NIVEAUX.length * 3 }) : traduire('fin.bravo'))
      : traduire(Q.fin.raison === 'temps' ? 'fin.raisonTemps' : 'fin.raisonPerdu');

    zone.classList.toggle('cache', !v);
    for (let i = 0; i < 3; i++) {
      zone.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#3a4a63" stroke="#22324a" stroke-width="1.2" stroke-linejoin="round"/></svg>');
    }
    for (let i = 0; i < etoiles; i++) setTimeout(() => { if (zone.children[i]) zone.children[i].classList.add('allumee'); SONS.etoile(i); }, 450 + i * 380);
    // Score qui défile
    const elScore = $('scoreFin');
    if (v) {
      const debut = performance.now();
      const defiler = (now) => {
        const k = Math.min(1, (now - debut) / 1200);
        elScore.textContent = traduire('fin.score', { s: Math.round(score * k) });
        if (k < 1 && ecranOuvert === 'ecranFin') requestAnimationFrame(defiler);
      };
      requestAnimationFrame(defiler);
    } else elScore.textContent = '';
    const detail = def.obj.type === 'tenir'

    else if (v && Q.numero < 0) { principal.textContent = traduire('bt.autrePartie'); principal.dataset.action = 'libre'; }
    else if (v) { principal.textContent = traduire('bt.niveaux'); principal.dataset.action = 'niveaux'; }
    else { principal.textContent = traduire('bt.reessayer'); principal.dataset.action = 'rejouer'; }
    $('btFinRejouer').classList.toggle('cache', !v);
    $('btFinNiveaux').textContent = traduire(Q.numero < 0 ? 'bt.accueil' : (v && dernier ? 'bt.accueil' : 'bt.niveaux'));

    montrer('ecranFin');
  }

  // ========================================================================
  // 11. Commandes : toucher, souris, clavier
  // ========================================================================
  function noeudSous(Q, px, py) {
    if (!Q.vue) return null;
    let meilleur = null, dmin = Math.max(Q.vue.r + 12, 30);
    for (const nd of Q.noeuds) {
      const [x, y] = vers(Q, nd.x, nd.y);
      const d = Math.hypot(px - x, py - y);
      if (d < dmin) { dmin = d; meilleur = nd; }
    }
    return meilleur;
  }
  let dernierConseil = 0;
  function conseil(cle) {
    const t = performance.now();
    if (t - dernierConseil < 2500) return;
    dernierConseil = t; toast(traduire(cle));
  }

  // Le joueur envoie ses troupes de src vers cible.
  function envoyerJoueur(src, cible) {
    const Q = P;
    if (!src || !cible || src === cible || src.owner !== 1) return false;
    const ch = chemin(Q, 1, src.i, cible.i);
    if (!ch) { SONS.erreur(); src.secousse = 0.5; conseil('toast.loin'); return false; }
    const q = Math.floor(src.n * Q.ratio);
    if (q < 1) { SONS.erreur(); src.secousse = 0.5; conseil('toast.vide'); return false; }
    creerGroupe(Q, 1, src, ch, q);
    SONS.envoi();
    if (Q.tuto === 2) bulle(traduire('tuto.2b'));
    return true;
  }

  function toucherNoeud(nd) {
    const Q = P;
    if (!Q || Q.pause || Q.attente) return;
    if (Q.phase === 'placement') {
      if (nd && Q.def.departs.includes(nd.i)) placer(nd.i);
      else { SONS.erreur(); conseil('bulle.placement'); }
      return;
    }
    if (Q.phase !== 'jeu') return;
    if (Q.modeBouclier) {
      if (nd && nd.owner === 1) activerBouclier(nd);
      else { Q.modeBouclier = false; cacherBulle(); majHud(); }
      return;
    }
    if (Q.selection && nd && nd !== Q.selection) {
      envoyerJoueur(Q.selection, nd);
      Q.selection = null;
      return;
    }
    if (nd && nd.owner === 1) {
      Q.selection = Q.selection === nd ? null : nd;
      if (Q.selection) SONS.selection();
      return;
    }
    Q.selection = null;
    if (nd) conseil('toast.choisir');
  }

  function positionPointeur(e) { const r = toile.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  toile.addEventListener('pointerdown', (e) => {
    debloquerAudio();
    if (!P || ecranOuvert || P.pause || P.attente) return;
    const [x, y] = positionPointeur(e);
    const nd = noeudSous(P, x, y);
    P.curseurVisible = false;
    if (P.phase === 'jeu' && !P.modeBouclier && nd && nd.owner === 1 && (!P.selection || P.selection === nd)) {
      // début d'un glisser possible depuis une de mes régions
      const dejaChoisi = P.selection === nd;
      P.selection = nd;
      if (!dejaChoisi) SONS.selection();
      P.glisse = { x, y, x0: x, y0: y, bouge: false, deja: dejaChoisi, id: e.pointerId };
      try { toile.setPointerCapture(e.pointerId); } catch (err) { /* rien */ }
      return;
    }
    P.glisse = null;
    toucherNoeud(nd);
  });
  toile.addEventListener('pointermove', (e) => {
    if (!P || !P.glisse) return;
    const [x, y] = positionPointeur(e);
    P.glisse.x = x; P.glisse.y = y;
    if (Math.hypot(x - P.glisse.x0, y - P.glisse.y0) > 14) P.glisse.bouge = true;
  });
  function finGlisse(e, annule) {
    if (!P || !P.glisse) return;
    const g = P.glisse; P.glisse = null;
    if (annule) return;
    const [x, y] = positionPointeur(e);
    if (g.bouge) {
      const cible = noeudSous(P, x, y);
      if (cible && cible !== P.selection) envoyerJoueur(P.selection, cible);
      P.selection = null;
    } else if (g.deja) P.selection = null; // second toucher : on relâche la région
  }
  toile.addEventListener('pointerup', (e) => finGlisse(e, false));
  toile.addEventListener('pointercancel', (e) => finGlisse(e, true));

  // Clavier : flèches pour choisir une région, Espace / Entrée pour agir.
  function deplacerCurseur(dx, dy) {
    const Q = P; if (!Q.vue) return;
    const cur = Q.noeuds[Q.curseur] || Q.noeuds[0];
    const [cx, cy] = vers(Q, cur.x, cur.y);
    let meilleur = null, best = Infinity;
    for (const nd of Q.noeuds) {
      if (nd === cur) continue;
      const [x, y] = vers(Q, nd.x, nd.y);
      const vx = x - cx, vy = y - cy;
      const proj = vx * dx + vy * dy;
      if (proj <= 4) continue;
      const perp = Math.abs(vx * dy - vy * dx);
      const s = proj + perp * 2.2;
      if (s < best) { best = s; meilleur = nd; }
    }
    if (meilleur) { Q.curseur = meilleur.i; SONS.clic(); }
  }
  document.addEventListener('keydown', (e) => {
    debloquerAudio();
    if (ecranOuvert) {
      if ((e.code === 'Escape' || e.code === 'KeyP') && ecranOuvert === 'ecranPause') { e.preventDefault(); reprendre(); }
      else if (e.code === 'Escape' && ecranOuvert === 'ecranAide') { e.preventDefault(); fermerAide(); }
      return;
    }
    if (!P) return;
    if (e.code === 'Escape' || e.code === 'KeyP') {
      e.preventDefault();
      if (e.code === 'Escape' && (P.selection || P.modeBouclier)) { P.selection = null; P.modeBouclier = false; cacherBulle(); majHud(); return; }
      pauser(); return;
    }
    if (P.pause || P.attente || P.phase === 'fin') return;
    const fl = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.code];
    if (fl) { e.preventDefault(); P.curseurVisible = true; deplacerCurseur(fl[0], fl[1]); return; }
    if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      e.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      P.curseurVisible = true;
      toucherNoeud(P.noeuds[P.curseur]);
      return;
    }
    if (e.code === 'KeyR' || e.code === 'KeyT') { e.preventDefault(); basculerRatio(); return; }
    if (e.code === 'Digit1' || e.code === 'Numpad1') { e.preventDefault(); utiliserPouvoir('cor'); return; }
    if (e.code === 'Digit2' || e.code === 'Numpad2') { e.preventDefault(); utiliserPouvoir('bouclier'); return; }
    if (e.code === 'Digit3' || e.code === 'Numpad3') { e.preventDefault(); utiliserPouvoir('etendard'); }
  });

  function basculerRatio() {
    if (!P || !P.ratioDispo) return;
    P.ratio = P.ratio === 1 ? 0.5 : 1; SONS.clic(); majHud();
  }
  function utiliserPouvoir(nom) {
    const Q = P;
    if (!Q || Q.phase !== 'jeu' || Q.pause || Q.attente) return;
    const p = Q.pouvoirs[nom];
    if (!p) return;
    if (p.recharge > 0 || p.actif > 0) { SONS.erreur(); conseil('toast.recharge'); return; }
    if (nom === 'bouclier') {
      Q.modeBouclier = !Q.modeBouclier;
      if (Q.modeBouclier) { bulle(traduire('bulle.bouclier')); SONS.clic(); } else cacherBulle();
      majHud(); return;
    }
    p.actif = POUVOIRS[nom].duree; p.recharge = POUVOIRS[nom].recharge;
    SONS[nom]();
    toast(traduire('toast.' + nom));
    if (nom === 'cor') Q.noeuds.forEach((nd) => { if (nd.owner === 1) Q.effets.push({ type: 'onde', x: nd.x, y: nd.y, v: 0.8, max: 0.8, c: '#ffd34d' }); });
    majHud();
  }
  function activerBouclier(nd) {
    const Q = P; const p = Q.pouvoirs.bouclier;
    nd.bouclier = POUVOIRS.bouclier.duree; p.recharge = POUVOIRS.bouclier.recharge;
    Q.modeBouclier = false; cacherBulle(); SONS.bouclier();
    Q.effets.push({ type: 'onde', x: nd.x, y: nd.y, v: 0.8, max: 0.8, c: '#8fd3ff' });
    majHud();
  }
  function fermerAide() { if (!P) return; montrer(null); P.pause = false; }

  // Boutons
  $('btJouer').addEventListener('click', () => {
    debloquerAudio(); SONS.clic();
    if (!S.et[0]) lancerNiveau(0); else ouvrirNiveaux();
  });
  $('btNiveaux').addEventListener('click', () => { debloquerAudio(); SONS.clic(); ouvrirNiveaux(); });
  $('btLibre').addEventListener('click', () => { debloquerAudio(); SONS.clic(); ouvrirLibre(); });
  $('btRetourNiveaux').addEventListener('click', () => { SONS.clic(); montrer('ecranTitre'); });
  $('btRetourLibre').addEventListener('click', () => { SONS.clic(); montrer('ecranTitre'); });
  $('btLancerLibre').addEventListener('click', () => { SONS.clic(); lancerLibre(); });
  document.querySelectorAll('.btSon').forEach((b) => b.addEventListener('click', basculerSon));
  $('btPause').addEventListener('click', () => { debloquerAudio(); SONS.clic(); pauser(); });
  $('btAide').addEventListener('click', () => { debloquerAudio(); SONS.clic(); ouvrirAide(); });
  $('btAideOk').addEventListener('click', () => { SONS.clic(); fermerAide(); });
  $('btReprendre').addEventListener('click', () => { reprendre(); SONS.clic(); });
  $('btRecommencer').addEventListener('click', () => { if (actx) actx.resume().catch(() => {}); SONS.clic(); rejouer(); });
  $('btPauseNiveaux').addEventListener('click', () => { quitterPartie(); SONS.clic(); ouvrirNiveaux(); });
  $('btPauseAccueil').addEventListener('click', () => { allerAccueil(); SONS.clic(); });
  $('btFicheOk').addEventListener('click', () => {
    SONS.clic();
    if (ficheCle && !S.vus.includes(ficheCle)) { S.vus.push(ficheCle); sauver(); }
    suiteFiches();
  });
  $('btRatio').addEventListener('click', () => { debloquerAudio(); basculerRatio(); });
  $('btCor').addEventListener('click', () => { debloquerAudio(); utiliserPouvoir('cor'); });
  $('btBouclier').addEventListener('click', () => { debloquerAudio(); utiliserPouvoir('bouclier'); });
  $('btEtendard').addEventListener('click', () => { debloquerAudio(); utiliserPouvoir('etendard'); });
  $('btFinPrincipal').addEventListener('click', (e) => {
    SONS.clic();
    const a = e.currentTarget.dataset.action;
    if (a === 'suivant') { quitterPartie(); lancerNiveau(Math.min(NIVEAUX.length - 1, niveauCourant + 1)); }
    else if (a === 'rejouer') rejouer();
    else if (a === 'libre') { quitterPartie(); ouvrirLibre(); }
    else { quitterPartie(); ouvrirNiveaux(); }
  });
  $('btFinRejouer').addEventListener('click', () => { SONS.clic(); rejouer(); });
  $('btFinNiveaux').addEventListener('click', (e) => {
    SONS.clic();
    if (e.currentTarget.dataset.action === 'accueil') allerAccueil(); else { quitterPartie(); ouvrirNiveaux(); }
  });
  $('bulle').addEventListener('pointerdown', () => { if (P && P.tuto === 3) { P.tuto = 0; cacherBulle(); } });

  // Pause automatique quand l'écran est caché
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauser(); });
  window.addEventListener('resize', redimensionner);

  // ========================================================================
  // 12. Boucle principale
  // ========================================================================
  let dernier = performance.now();
  let hudT = 0;
  function boucle(now) {
    const dt = Math.min(0.05, (now - dernier) / 1000);
    dernier = now;
    const t = now / 1000;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (P) {
      if (!P.pause && !P.attente) {
        maj(P, dt);
        if (P.phase === 'fin') { P.finT -= dt; if (P.finT <= 0 && ecranOuvert !== 'ecranFin') { P.finT = Infinity; afficherFin(); } }
      }
      dessinerMonde(P, t);
      hudT -= dt;
      if (hudT <= 0) { majHud(); hudT = 0.2; }
    } else {
      if (!demo) demo = creerDemo();
      majDemo(demo, dt);
      dessinerMonde(demo, t);
    }
    // Confettis
    if (confettis.length) {
      for (const f of confettis) { f.x += f.vx * dt; f.y += f.vy * dt; f.r += f.vr * dt; }
      confettis = confettis.filter((f) => f.y < HAUT + 20);
      for (const f of confettis) { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.r); ctx.fillStyle = f.c; ctx.fillRect(-5, -3, 10, 6); ctx.restore(); }
    }
    // Animations des fiches
    if (ecranOuvert === 'ecranFiche' && ficheCle) { const c2 = $('ficheDessin').getContext('2d'); scene(c2, ficheCle, t, 600, 300); }
    if (ecranOuvert === 'ecranAide') { const c2 = $('aideDessin').getContext('2d'); scene(c2, 'aide', t, 600, 300); }
    requestAnimationFrame(boucle);
  }

  // Démarrage
  document.title = traduire('titre');
  redimensionner();
  iconeSon();
  requestAnimationFrame(boucle);
})();
</script>
