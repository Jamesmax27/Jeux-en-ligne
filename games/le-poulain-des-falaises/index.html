<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }

      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }

  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +

    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +

    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();

<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }

      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};

  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

<script>
(function () {
  'use strict';
  // ======================================================================
  // Le poulain des falaises — jeu de plateforme (Free Micro Games)
  // Pépite, un jeune poulain, remonte la montagne pour retrouver sa harde.
  // ======================================================================
  const JEU = 'le-poulain-des-falaises';
  const I18N = window.JEL_I18N;
  const t = I18N ? I18N.t : function (k) { return k; };
  const nb = function (x) { return I18N ? I18N.nombre(x) : String(x); };
  const SAVE = window.JEL_SAVE;

  // --------------------------------------------------------------------
  // Constantes physiques (unités : pixels du monde, secondes)
  // --------------------------------------------------------------------
  const TUILE = 40;
  const GRAVITE = 2300;
  const SAUT = 840;          // vitesse du bond : environ 150 px de haut
  const SAUT_RONCES = 560;
  const COURSE = 255;        // vitesse du trot
  const COEURS_MAX = 3;
  const FERS_PAR_NIVEAU = 5;

  // --------------------------------------------------------------------
  // Paysages et niveaux
  // --------------------------------------------------------------------
  const PAYSAGES = [
    { id: 'prairie', ciel: ['#7cc8f5', '#e6f7ff'], loin: '#a7c3e0', colline: '#9fd27a', herbe: '#6cbf4a', terre: '#9a6b43', roche: '#b48a5e', bord: '#5aa23b' },
    { id: 'gorges', ciel: ['#f2a96a', '#ffe7c4'], loin: '#cf9474', colline: '#c98b5c', herbe: '#97b24a', terre: '#93573a', roche: '#a8664a', bord: '#7a9a36' },
    { id: 'cascade', ciel: ['#86d0dc', '#ecfbf4'], loin: '#7fb6ae', colline: '#69b98a', herbe: '#4fae6a', terre: '#6d5a48', roche: '#7f8f8a', bord: '#3a9255' },
    { id: 'sommet', ciel: ['#9bb8ea', '#f3f7ff'], loin: '#d4e0f2', colline: '#e6eef8', herbe: '#f7fbff', terre: '#8792a8', roche: '#9aa6ba', bord: '#cfe0f2' }
  ];

  // Membres de la harde retrouvés à la fin de chaque paysage
  const HARDE = {
    caramel: { robe: 'palomino', criniere: 'simple', taille: 1.35 },
    bruyere: { robe: 'gris', criniere: 'tressee', taille: 1.45 },
    silex: { robe: 'bai', criniere: 'simple', taille: 1.55 },
    aurore: { robe: 'alezan', criniere: 'fleurs', taille: 1.5 }
  };
  const ORDRE_HARDE = ['caramel', 'bruyere', 'silex', 'aurore'];

  // n : nombre de passages ; pool : passages possibles (poids) ; debut : passages imposés
  // tuto : mécaniques présentées par une carte animée à leur première apparition
  const NIVEAUX = [
    { p: 0, n: 10, pool: { plat: 2, marche: 3, trou: 2, descente: 1 }, debut: ['marche', 'trou'], tuto: ['trot', 'bond', 'fers'] },
    { p: 0, n: 12, pool: { plat: 1, marche: 3, trou: 2, arbre: 3 }, debut: ['arbre'], tuto: ['ruade'] },

  // --------------------------------------------------------------------

  function construireNiveau(num) {

      corniche(fragile) {

          const dy = 40 + Math.round(rnd() * 40);

    });

    // Arrivée : pré fleuri (ou membre de la harde)
    const wf = TUILE * 10; sol(x, wf, y); sol(x + wf, 400, y - 400);
    M.but = { x: x + TUILE * 5, y, harde: def.harde || null };
    M.fin = x + wf;

    // Fers à cheval : 5 places réparties dans tout le niveau
    const c = M.candidats.slice().sort((a, b) => a.x - b.x);
    if (c.length < FERS_PAR_NIVEAU) for (let i = c.length; i < FERS_PAR_NIVEAU; i++) c.push({ x: M.but.x - 250 + i * 40, y: y - 60 });
    const pris = [];
    for (let i = 0; i < FERS_PAR_NIVEAU; i++) {
      const debut = Math.floor(i * c.length / FERS_PAR_NIVEAU), fin = Math.floor((i + 1) * c.length / FERS_PAR_NIVEAU);
      let best = c[debut];
      for (let j = debut; j < fin; j++) if (c[j].poids > best.poids) best = c[j];
      pris.push(best);
    }
    M.fers = pris.map((p) => ({ x: p.x, y: p.y, pris: false }));
    M.solides.forEach((r) => { r.x0 = r.x; r.y0 = r.y; });
    return M;
  }

  // --------------------------------------------------------------------
  // État du jeu
  // --------------------------------------------------------------------
  let etat = 'titre'; // titre | jeu | pause | tuto | fin | niveaux | ecurie
  const P = { x: 0, y: 0, w: 50, h: 42, vx: 0, vy: 0, sol: false, appui: null, face: 1, coyote: 0, tampon: 0,
    inv: 0, ruade: 0, refY: 0, pas: 0, phase: 0, vent: 0, glisse: false, ronces: false };
  const partie = { coeurs: COEURS_MAX, fers: 0, pommes: 0, temps: 0, reprise: { x: 80, y: 0 }, victoire: 0, defaite: 0, cailloux: 0 };
  let particules = [];
  let secousse = 0;
  let horloge = 0;
  const touches = { g: false, d: false };
  const cam = { x: 0, y: 0 };
  let vue = { w: 440, h: 800, s: 1 };
  let tutoFile = [], tutoIndex = 0, tutoT = 0;

  function lancerNiveau(num) {
    num = Math.max(1, Math.min(NIVEAUX.length, num));
    prog.niveau = num;
    prog.max = Math.max(prog.max, num);
    monde = construireNiveau(num);
    partie.coeurs = COEURS_MAX; partie.fers = 0; partie.pommes = 0; partie.temps = 0;
    partie.victoire = 0; partie.defaite = 0; partie.cailloux = 0;
    partie.reprise = { x: monde.depart.x, y: monde.depart.y - P.h };
    particules = [];
    placerPoulain(partie.reprise.x, partie.reprise.y);
    cam.x = P.x - vue.w * 0.35; cam.y = P.y - vue.h * 0.6;
    montrer('hud'); montrer('commandes');
    cacher('titre'); cacher('niveaux'); cacher('fin'); cacher('pause'); cacher('ecurie');
    majHud();
    etat = 'jeu';
    sauver({ niveau: num });
    // Cartes du tutoriel pour les nouveautés jamais vues
    const nouveaux = NIVEAUX[num - 1].tuto.filter((k) => prog.vus.indexOf(k) < 0);
    if (nouveaux.length) ouvrirTuto(nouveaux);
    else bandeau(t('niveau.nom', { n: num, paysage: t('paysage.' + monde.paysage.id) }));
  }

  function placerPoulain(x, y) {
    P.x = x; P.y = y; P.vx = 0; P.vy = 0; P.sol = false; P.appui = null; P.refY = y + P.h; P.inv = 1.2; P.ruade = 0; P.face = 1;
  }

  // --------------------------------------------------------------------
  // Collisions
  // --------------------------------------------------------------------
  function chevauche(a, r) { return a.x < r.x + r.w && a.x + a.w > r.x && a.y < r.y + r.h && a.y + a.h > r.y; }
  function proches(x0, x1) {
    const res = [];
    for (const r of monde.solides) if (!r.tombe && r.x < x1 && r.x + r.w > x0) res.push(r);
    return res;
  }

  // Déplace une boîte {x,y,w,h,vx,vy} contre les solides. Renvoie {sol, appui, mur}
  function deplacer(b, dx, dy) {
    const res = { sol: false, appui: null, mur: false, plafond: false };
    const px = b.x, py = b.y;
    const voisins = proches(Math.min(px, px + dx) - 10, Math.max(px, px + dx) + b.w + 10);
    b.x += dx;
    for (const r of voisins) {
      if (!chevauche(b, r)) continue;
      if (py + b.h <= r.y + 6 || py >= r.y + r.h - 2) continue; // collision verticale, traitée après
      if (dx > 0) b.x = r.x - b.w; else if (dx < 0) b.x = r.x + r.w;
      else { // plateforme qui pousse : sortir du côté le plus proche
        if (b.x + b.w / 2 < r.x + r.w / 2) b.x = r.x - b.w; else b.x = r.x + r.w;
      }
      res.mur = true;
    }
    b.y += dy;
    for (const r of voisins) {
      if (!chevauche(b, r)) continue;
      if (dy >= 0 && py + b.h <= r.y + 8) { b.y = r.y - b.h; res.sol = true; res.appui = r; }
      else if (dy < 0 && py >= r.y + r.h - 8) { b.y = r.y + r.h; res.plafond = true; }
      else if (b.y + b.h - r.y < 14) { b.y = r.y - b.h; res.sol = true; res.appui = r; }
    }
    return res;
  }

  // --------------------------------------------------------------------
  // Commandes
  // --------------------------------------------------------------------
  function bondir() { P.tampon = 0.14; }
  function ruer() {
    if (etat !== 'jeu' || P.ruade > 0) return;
    P.ruade = 0.42;
    son('ruade');
    secousse = Math.max(secousse, 0.08);
    const cx = P.x + P.w / 2, cy = P.y + P.h;
    // Pommiers proches
    for (const a of monde.arbres) {
      if (Math.abs(a.x - cx) < 105 && Math.abs(a.y - cy) < 70) {
        a.secoue = 0.6;
        if (a.pommes.length) {
          a.pommes.forEach((p, i) => monde.pommes.push({ x: a.x + p.dx - 8, y: a.y + p.dy, w: 16, h: 16, vx: (p.dx / 28) * 40 + (Math.random() - 0.5) * 30, vy: -60 - i * 20, rebond: 2, sol: false }));
          a.pommes = [];
          son('pomme');
        }
      }
    }
    // Rochers et boules de neige brisés
    for (const r of monde.rochers) {
      if (!r.casse && Math.hypot(r.x - cx, r.y - (P.y + P.h / 2)) < 92) casserRocher(r, true);
    }
    // Chèvres têtues : elles secouent la tête, rien de plus
    for (const c of monde.chevres) {
      if (Math.abs(c.x - cx) < 110 && Math.abs(c.y - cy) < 60) { c.tete = 0.8; son('chevre'); }
    }
    for (let i = 0; i < 8; i++) particules.push({ x: cx - P.face * 26, y: cy - 4, vx: -P.face * (60 + Math.random() * 120), vy: -Math.random() * 160, vie: 0.5, c: '#d8c39a', r: 3 + Math.random() * 3 });
  }
  function casserRocher(r, parRuade) {
    r.casse = true;
    son('caillou');
    if (parRuade) partie.cailloux++;
    for (let i = 0; i < 12; i++) particules.push({ x: r.x, y: r.y, vx: (Math.random() - 0.5) * 320, vy: -Math.random() * 300, vie: 0.7, c: r.neige ? '#ffffff' : '#8f8a84', r: 3 + Math.random() * 4, g: true });
  }

  const CODES_GAUCHE = ['ArrowLeft', 'KeyA'];
  const CODES_DROITE = ['ArrowRight', 'KeyD'];
  const CODES_BOND = ['Space', 'ArrowUp', 'KeyW'];
  const CODES_RUADE = ['KeyX', 'ArrowDown', 'KeyS'];

  window.addEventListener('keydown', (e) => {
    audio();
    const c = e.code;
    if (etat === 'tuto') {
      if (['Space', 'Enter', 'NumpadEnter', 'Escape'].indexOf(c) >= 0) { e.preventDefault(); suiteTuto(); }
      return;
    }
    if (etat === 'jeu') {
      if (CODES_GAUCHE.indexOf(c) >= 0) { touches.g = true; e.preventDefault(); }
      else if (CODES_DROITE.indexOf(c) >= 0) { touches.d = true; e.preventDefault(); }
      else if (CODES_BOND.indexOf(c) >= 0) { if (!e.repeat) bondir(); e.preventDefault(); }
      else if (CODES_RUADE.indexOf(c) >= 0) { if (!e.repeat) ruer(); e.preventDefault(); }
      else if (c === 'Escape' || c === 'KeyP') { mettrePause(); e.preventDefault(); }
    } else if (etat === 'pause') {
      if (c === 'Escape' || c === 'KeyP') { reprendre(); e.preventDefault(); }
    } else if (etat === 'titre') {
      if ((c === 'Enter' || c === 'NumpadEnter') && document.activeElement === document.body) { e.preventDefault(); jouer(); }
    }
  });
  window.addEventListener('keyup', (e) => {
    if (CODES_GAUCHE.indexOf(e.code) >= 0) touches.g = false;
    if (CODES_DROITE.indexOf(e.code) >= 0) touches.d = false;
  });
  window.addEventListener('blur', () => { touches.g = false; touches.d = false; });

  // Boutons tactiles : on garde appuyé pour trotter
  function boutonMaintenu(id, debut, fin) {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault(); audio();
      try { el.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
      el.classList.add('appui'); debut();
    });
    const lacher = () => { el.classList.remove('appui'); if (fin) fin(); };
    el.addEventListener('pointerup', lacher);
    el.addEventListener('pointercancel', lacher);
    el.addEventListener('lostpointercapture', lacher);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
    el.addEventListener('click', (e) => e.preventDefault());
  }
  boutonMaintenu('c-gauche', () => { touches.g = true; }, () => { touches.g = false; });
  boutonMaintenu('c-droite', () => { touches.d = true; }, () => { touches.d = false; });
  boutonMaintenu('c-bond', () => { if (etat === 'jeu') bondir(); });
  boutonMaintenu('c-ruade', () => { ruer(); });

  // Glisser vers le haut sur l'écran de jeu : ruade
  // Coins arrondis pour les navigateurs qui n'ont pas roundRect
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
    };
  }
  const canvas = document.getElementById('jeu');
  const ctx = canvas.getContext('2d');
  let glisse = null;
  canvas.addEventListener('pointerdown', (e) => { audio(); glisse = { x: e.clientX, y: e.clientY, t: performance.now(), fait: false }; });
  canvas.addEventListener('pointermove', (e) => {
    if (!glisse || glisse.fait) return;
    if (glisse.y - e.clientY > 40 && Math.abs(e.clientX - glisse.x) < 90 && performance.now() - glisse.t < 600) { glisse.fait = true; ruer(); }
  });
  canvas.addEventListener('pointerup', () => { glisse = null; });
  canvas.addEventListener('pointercancel', () => { glisse = null; });

  // --------------------------------------------------------------------
  // Mise à jour du monde
  // --------------------------------------------------------------------
  function mettreAJour(dt) {
    horloge += dt;
    const M = monde;
    partie.temps += dt;

    // Planches des ponts de lianes
    for (const p of M.planches) {
      const nx = p.cx - 36 + Math.sin(horloge * Math.PI * 2 / p.per + p.phase) * p.amp;
      const ny = p.base + Math.abs(Math.cos(horloge * Math.PI * 2 / p.per + p.phase)) * 7;
      p.r.dx = nx - p.r.x; p.r.dy = ny - p.r.y; p.r.x = nx; p.r.y = ny;
    }
    // Pierres du ruisseau qui s'enfoncent
    for (const s of M.pierres) {
      const dessus = P.sol && P.appui === s.r;
      if (dessus) { s.t += dt; s.libre = 0; } else { s.libre += dt; if (s.libre > 1.4) s.t = 0; }
      let cible = s.enfonce;
      if (s.t > s.delai) cible = Math.min(56, s.enfonce + 70 * dt);
      else if (s.libre > 1.4) cible = Math.max(0, s.enfonce - 45 * dt);
      const ny = s.base + cible;
      s.r.dx = 0; s.r.dy = ny - s.r.y; s.r.y = ny; s.enfonce = cible;
      if (dessus && s.t > s.delai && s.t - dt <= s.delai) son('plouf');
    }
    // Corniches de neige fragiles
    for (const f of M.fragiles) {
      const dessus = P.sol && P.appui === f.r;
      f.r.dx = 0; f.r.dy = 0;
      if (f.etat === 'ok' && dessus) { f.etat = 'tremble'; f.t = 0; son('craque'); }
      if (f.etat === 'tremble') { f.t += dt; if (f.t > 0.75) { f.etat = 'tombe'; f.t = 0; f.r.tombe = true; f.dy = 0; } }
      else if (f.etat === 'tombe') { f.t += dt; f.dy += 600 * dt * f.t * 3; if (f.t > 3.2) { f.etat = 'ok'; f.r.tombe = false; f.dy = 0; } }
    }
    // Vent : calme → alerte (feuilles) → rafale
    for (const v of M.vents) {
      v.t -= dt;
      if (v.t <= 0) {
        if (v.etat === 'calme') { v.etat = 'alerte'; v.t = 0.8; v.n++; v.dir = (v.n % 3 === 0) ? 1 : -1; }
        else if (v.etat === 'alerte') { v.etat = 'rafale'; v.t = 1.9; if (P.x > v.x0 - 200 && P.x < v.x1 + 200) son('vent'); }
        else { v.etat = 'calme'; v.t = 1.6 - M.d * 0.5; }
      }
    }
    for (const a of M.arbres) if (a.secoue > 0) a.secoue -= dt;
    // Chèvres têtues
    for (const c of M.chevres) {
      if (c.tete > 0) c.tete -= dt;
      if (c.pause > 0) { c.pause -= dt; continue; }
      c.x += c.dir * c.v * dt;
      if (c.x < c.a) { c.x = c.a; c.dir = 1; c.pause = 0.6 + Math.random(); }
      if (c.x > c.b) { c.x = c.b; c.dir = -1; c.pause = 0.6 + Math.random(); }
      if (Math.random() < dt * 0.25) c.pause = 0.8;
    }
    // Lanceurs de rochers
    for (const l of M.lanceurs) {
      if (P.x > l.x - 760 && P.x < l.x - 30) {
        l.t -= dt;
        if (l.t <= 0) {
          l.t = l.intervalle * (0.85 + Math.random() * 0.3);
          const r = l.neige ? 19 : 18;
          M.rochers.push({ x: l.x, y: l.y - r - 1, r, vx: -l.vitesse, vy: 0, ang: 0, neige: l.neige, casse: false, vie: 9 });
        }
      } else l.t = Math.min(l.t, 0.6);
    }
    // Rochers qui roulent
    for (const r of M.rochers) {
      if (r.casse) continue;
      r.vie -= dt;
      r.vy += GRAVITE * dt;
      const b = { x: r.x - r.r, y: r.y - r.r, w: r.r * 2, h: r.r * 2 };
      const res = deplacer(b, r.vx * dt, r.vy * dt);
      r.x = b.x + r.r; r.y = b.y + r.r;
      if (res.mur) { casserRocher(r, false); continue; }
      if (res.sol) { if (r.neige && r.vy > 220) r.vy = -r.vy * 0.55; else r.vy = 0; }
      r.ang += r.vx * dt / r.r;
      if (r.vie <= 0 || r.y > P.refY + 900) r.casse = true;
    }
    M.rochers = M.rochers.filter((r) => !r.casse);
    // Pommes qui tombent
    for (const p of M.pommes) {
      if (p.prise) continue;
      if (!p.sol) {
        p.vy += GRAVITE * 0.8 * dt;
        const res = deplacer(p, p.vx * dt, p.vy * dt);
        if (res.mur) p.vx = -p.vx * 0.5;
        if (res.sol) {
          if (p.rebond > 0 && p.vy > 120) { p.vy = -p.vy * 0.45; p.rebond--; p.vx *= 0.6; }
          else { p.vy = 0; p.vx = 0; p.sol = true; }
        }
      }
      if (chevauche({ x: P.x - 6, y: P.y - 6, w: P.w + 12, h: P.h + 12 }, p)) prendrePomme(p);
    }
    M.pommes = M.pommes.filter((p) => !p.prise && p.y < P.refY + 1200);

    if (partie.victoire > 0) { // marche vers le membre de la harde
      partie.victoire -= dt;
      const arret = monde.but.harde ? monde.but.x - 20 : monde.but.x + 60;
      if (P.x + P.w < arret) { P.vx = 70; P.x += P.vx * dt; P.phase += dt * 8; } else P.vx = 0;
      P.face = 1;
      if (partie.victoire <= 0) finNiveau(true);
      majCamera(dt); majParticules(dt);
      return;
    }
    if (partie.defaite > 0) {
      partie.defaite -= dt;
      if (partie.defaite <= 0) finNiveau(false);
      majParticules(dt);
      return;
    }

    majPoulain(dt);
    majCamera(dt);
    majParticules(dt);
    if (secousse > 0) secousse -= dt;
  }

  function prendrePomme(p) {
    p.prise = true;
    partie.pommes++;
    if (partie.coeurs < COEURS_MAX) { partie.coeurs++; bandeau(t('bandeau.coeur')); }
    son('pomme');
    for (let i = 0; i < 8; i++) particules.push({ x: p.x + 8, y: p.y + 8, vx: (Math.random() - 0.5) * 200, vy: -Math.random() * 200, vie: 0.5, c: i % 2 ? '#ff4d4d' : '#ffd166', r: 3 });
    majHud();
  }

  function majPoulain(dt) {
    const M = monde;
    // Transport par la plateforme sous les sabots
    if (P.sol && P.appui && (P.appui.dx || P.appui.dy)) {
      const dxp = P.appui.dx || 0, dyp = P.appui.dy || 0;
      deplacer(P, dxp, 0);
      P.y += dyp;
    }
    if (P.appui && P.appui.tombe) { P.sol = false; P.appui = null; }

    // Sol glissant ? Ronces ?
    const surGlace = P.sol && P.appui && P.appui.glace;
    let dansRonces = false;
    for (const r of M.ronces) if (P.x + P.w > r.x0 + 6 && P.x < r.x1 - 6 && P.y + P.h >= r.y - 3) dansRonces = true;
    let dansCascade = false;
    for (const c of M.cascades) if (P.x + P.w > c.x0 && P.x < c.x1 && P.y + P.h > c.y - 260) dansCascade = true;
    P.glisse = surGlace; P.ronces = dansRonces;

    const dir = (touches.d ? 1 : 0) - (touches.g ? 1 : 0);
    if (dir) P.face = dir;
    const vmax = COURSE * (dansRonces ? 0.42 : 1);
    const accel = surGlace ? 360 : (P.sol ? 2600 : 1700);
    const frein = surGlace ? 150 : (P.sol ? 3200 : 900);
    const cible = dir * vmax;
    if (dir !== 0) {
      const a = (Math.sign(cible - P.vx) === Math.sign(P.vx) || P.vx === 0) ? accel : accel + frein * 0.5;
      if (P.vx < cible) P.vx = Math.min(cible, P.vx + a * dt); else P.vx = Math.max(cible, P.vx - a * dt);
    } else {
      if (P.vx > 0) P.vx = Math.max(0, P.vx - frein * dt); else P.vx = Math.min(0, P.vx + frein * dt);
    }
    if (dansRonces && Math.abs(P.vx) > vmax) P.vx = Math.sign(P.vx) * vmax;
    if (dansRonces && Math.abs(P.vx) > 20 && Math.random() < dt * 8) particules.push({ x: P.x + P.w / 2, y: P.y + P.h - 8, vx: (Math.random() - 0.5) * 80, vy: -80, vie: 0.4, c: '#5a2a6a', r: 2.5 });

    // Vent
    let vent = 0;
    for (const v of M.vents) if (v.etat === 'rafale' && P.x + P.w > v.x0 && P.x < v.x1) vent += v.dir * v.force;
    P.vent += (vent - P.vent) * Math.min(1, dt * 4);

    // Bond (avec un petit délai de grâce au bord des corniches)
    if (P.sol) P.coyote = 0.1; else P.coyote -= dt;
    if (P.tampon > 0) P.tampon -= dt;
    if (P.tampon > 0 && P.coyote > 0) {
      P.vy = -(dansRonces ? SAUT_RONCES : SAUT);
      P.sol = false; P.appui = null; P.coyote = 0; P.tampon = 0;
      son('bond');
      for (let i = 0; i < 5; i++) particules.push({ x: P.x + P.w / 2, y: P.y + P.h, vx: (Math.random() - 0.5) * 120, vy: -Math.random() * 60, vie: 0.35, c: monde.paysage.id === 'sommet' ? '#ffffff' : '#c9b48a', r: 3 });
    }
    // Gravité (plus forte sous une cascade)
    P.vy += (GRAVITE + (dansCascade ? 2000 : 0)) * dt;
    if (dansCascade && Math.random() < dt * 20) particules.push({ x: P.x + Math.random() * P.w, y: P.y, vx: 0, vy: 200, vie: 0.3, c: '#e8fbff', r: 2.5 });
    P.vy = Math.min(P.vy, dansCascade ? 1300 : 1100);

    const etaitAuSol = P.sol;
    const vyAvant = P.vy;
    const res = deplacer(P, (P.vx + P.vent) * dt, P.vy * dt);
    if (res.mur) P.vx = 0;
    if (res.plafond) P.vy = 0;
    P.sol = res.sol; P.appui = res.appui;
    if (P.sol) {
      P.vy = 0; P.refY = P.y + P.h;
      if (!etaitAuSol && vyAvant > 300) son('atterrir');
    }
    if (P.x < -300) { P.x = -300; P.vx = 0; }

    // Animation du trot
    if (P.sol && Math.abs(P.vx) > 20) {
      P.phase += dt * Math.abs(P.vx) / 26;
      P.pas += dt * Math.abs(P.vx);
      if (P.pas > 46) { P.pas = 0; son('sabot'); }
    }
    if (P.ruade > 0) P.ruade -= dt;
    if (P.inv > 0) P.inv -= dt;

    // Fers à cheval
    for (const f of M.fers) {
      if (f.pris) continue;
      const cx = P.x + P.w / 2, cy = P.y + P.h / 2;
      if (Math.abs(f.x - cx) < 38 && Math.abs(f.y - cy) < 38) {
        f.pris = true; partie.fers++;
        son('fer');
        for (let i = 0; i < 14; i++) particules.push({ x: f.x, y: f.y, vx: Math.cos(i / 14 * 6.28) * 180, vy: Math.sin(i / 14 * 6.28) * 180, vie: 0.6, c: '#ffd34d', r: 3, etoile: true });
        majHud();
      }
    }
    // Drapeaux de passage
    for (const dr of M.drapeaux) {
      if (!dr.actif && P.x + P.w / 2 > dr.x - 10) {
        dr.actif = true; partie.reprise = { x: dr.x - P.w / 2, y: dr.y - P.h };
        son('drapeau'); bandeau(t('bandeau.drapeau'));
        for (let i = 0; i < 16; i++) particules.push({ x: dr.x, y: dr.y - 70, vx: (Math.random() - 0.5) * 260, vy: -Math.random() * 260, vie: 0.8, c: ['#ff6b6b', '#ffd166', '#6cc24a', '#4dabf7'][i % 4], r: 3, g: true });
      }
    }
    // Dangers : rochers, chèvres
    if (P.inv <= 0) {
      const boite = { x: P.x + 6, y: P.y + 6, w: P.w - 12, h: P.h - 8 };
      for (const r of M.rochers) {
        if (!r.casse && chevauche(boite, { x: r.x - r.r + 4, y: r.y - r.r + 4, w: r.r * 2 - 8, h: r.r * 2 - 8 })) { blesser(r.x < P.x + P.w / 2 ? 1 : -1); casserRocher(r, false); break; }
      }
      for (const c of M.chevres) {
        if (P.inv <= 0 && chevauche(boite, { x: c.x - 22, y: c.y - 38, w: 44, h: 36 })) { son('chevre'); c.tete = 0.6; blesser(c.x < P.x + P.w / 2 ? 1 : -1); }
      }
    }
    // Chutes : vide et eau
    for (const e of M.eaux) {
      if (P.x + P.w - 8 > e.x && P.x + 8 < e.x + e.w && P.y + P.h > e.y + 6) { son('plouf'); chute(true); return; }
    }
    if (P.y > P.refY + 420) { chute(false); return; }

    // Arrivée
    if (P.x + P.w > M.but.x - (M.but.harde ? 90 : 10)) {
      partie.victoire = M.but.harde ? 1.6 : 0.9;
      touches.g = false; touches.d = false;
      if (M.but.harde) son('hennir');
      for (let i = 0; i < 30; i++) particules.push({ x: P.x + P.w / 2, y: P.y, vx: (Math.random() - 0.5) * 400, vy: -100 - Math.random() * 400, vie: 1.2, c: ['#ff6b6b', '#ffd166', '#6cc24a', '#4dabf7', '#c77dff'][i % 5], r: 4, g: true, carre: true });
    }
  }

  function blesser(sens) {
    partie.coeurs--;
    P.inv = 1.6; P.vx = sens * 260; P.vy = -420; P.sol = false; P.appui = null;
    secousse = 0.3;
    son('aie');
    majHud();
    if (partie.coeurs <= 0) perdre();
  }
  function chute(eau) {
    partie.coeurs--;
    secousse = 0.25;
    if (!eau) son('aie');
    for (let i = 0; i < 12; i++) particules.push({ x: P.x + P.w / 2, y: P.y + P.h, vx: (Math.random() - 0.5) * 200, vy: -Math.random() * 300, vie: 0.6, c: eau ? '#7cc8f5' : '#c9b48a', r: 3, g: true });
    majHud();
    if (partie.coeurs <= 0) { perdre(); return; }
    placerPoulain(partie.reprise.x, partie.reprise.y);
    bandeau(t('bandeau.chute'));
  }
  function perdre() {
    partie.coeurs = 0;
    partie.defaite = 0.9;
    touches.g = false; touches.d = false;
    son('defaite');
  }

  function majCamera(dt) {
    const cx = P.x + P.w / 2 - vue.w * 0.36;
    const cy = P.y - vue.h * 0.6;
    cam.x += (cx - cam.x) * Math.min(1, dt * 6);
    cam.y += (cy - cam.y) * Math.min(1, dt * 3.5);
    cam.x = Math.max(-200, Math.min(cam.x, monde.fin + 300 - vue.w));
  }
  function majParticules(dt) {
    for (const p of particules) {
      p.vie -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.g) p.vy += 900 * dt; else { p.vx *= 0.96; p.vy *= 0.96; }
    }
    particules = particules.filter((p) => p.vie > 0);
    if (particules.length > 400) particules.splice(0, particules.length - 400);
  }

  // --------------------------------------------------------------------
  // Fin de niveau : victoire ou défaite
  // --------------------------------------------------------------------
  function etoilesDuNiveau() { return partie.fers >= FERS_PAR_NIVEAU ? 3 : (partie.fers >= 3 ? 2 : 1); }
  function calculScore() {
    const par = monde.fin / 170 + 10; // temps de référence en secondes
    const bonus = Math.max(0, Math.round(par - partie.temps)) * 10;
    return { total: partie.fers * 100 + partie.pommes * 25 + partie.coeurs * 50 + partie.cailloux * 10 + bonus, bonus };
  }

  let finTimers = [];
  function finNiveau(gagne) {
    etat = 'fin';
    touches.g = false; touches.d = false;
    const num = monde.num;
    const i = num - 1;
    const sc = calculScore();
    const score = gagne ? sc.total : partie.fers * 100 + partie.pommes * 25;
    const ancienRecord = prog.records[i];
    let nouveauRecord = false;
    let etoiles = 0;
    if (gagne) {
      if (window.FMG) window.FMG.reportEnd({ completed: true, level: num });
      etoiles = etoilesDuNiveau();
      const avantTotal = totalEtoiles();
      prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
      if (score > ancienRecord) { prog.records[i] = score; nouveauRecord = true; }
      prog.max = Math.max(prog.max, Math.min(NIVEAUX.length, num + 1));
      prog.score = score;
      sauver({ niveau: Math.min(NIVEAUX.length, num + 1), score });
      if (tousGagnes()) {
        if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
      }
      son('victoire');
      afficherFin(true, num, etoiles, score, nouveauRecord, avantTotal);
    } else {
      if (window.FMG) window.FMG.reportEnd({ completed: false, level: num });
      sauver({ niveau: num, score: prog.score });
      afficherFin(false, num, 0, score, false, totalEtoiles());
    }
  }

  const SVG_ETOILE = '<svg viewBox="0 0 50 50"><path d="M25 3 L31 18 L47 19 L35 30 L39 46 L25 37 L11 46 L15 30 L3 19 L19 18 Z" fill="FILL" stroke="#c48a00" stroke-width="2.5" stroke-linejoin="round"/></svg>';
  function afficherFin(gagne, num, etoiles, score, record, avantTotal) {
    finTimers.forEach(clearTimeout); finTimers = [];
    cacher('hud'); cacher('commandes'); cacher('bandeau');
    const harde = NIVEAUX[num - 1].harde;
    const dernier = num === NIVEAUX.length;
    document.getElementById('fin-titre').textContent = gagne ? t(dernier ? 'fin.titreFinal' : 'fin.bravo') : t('fin.perdu');
    document.getElementById('fin-msg').textContent = gagne
      ? t(dernier ? 'fin.msgFinal' : 'fin.msgVictoire', { n: num })
      : t('fin.msgDefaite');
    const zoneE = document.getElementById('fin-etoiles');
    zoneE.innerHTML = '';
    if (gagne) {
      for (let k = 0; k < 3; k++) {
        const plein = k < etoiles;
        zoneE.insertAdjacentHTML('beforeend', SVG_ETOILE.replace('FILL', plein ? '#ffd34d' : '#efe6d6'));
        const el = zoneE.lastElementChild;
        if (!plein) el.classList.add('vide');
        finTimers.push(setTimeout(() => { el.classList.add('vue'); if (plein) son('etoile', k); }, 400 + k * 350));
      }
    }
    // Score qui défile
    const zoneS = document.getElementById('fin-score');
    zoneS.textContent = t('fin.score', { n: nb(0) });
    const debut = performance.now();
    const defile = () => {
      const k = Math.min(1, (performance.now() - debut) / 900);
      zoneS.textContent = t('fin.score', { n: nb(Math.round(score * k)) });
      if (k < 1 && etat === 'fin') requestAnimationFrame(defile);
    };
    requestAnimationFrame(defile);
    document.getElementById('fin-record').textContent = gagne
      ? (record ? t('fin.record') : t('fin.recordAncien', { n: nb(prog.records[num - 1]) }))
      : '';
    document.getElementById('fin-details').textContent = t('fin.details', { fers: partie.fers, total: FERS_PAR_NIVEAU, pommes: partie.pommes });
    const zoneH = document.getElementById('fin-harde');
    let msgH = '';
    if (gagne && harde) msgH = t('harde.retrouve', { nom: t('harde.' + harde) });
    const apres = totalEtoiles();
    const debloques = [];
    [[ROBES, 'robe'], [CRINIERES, 'criniere'], [CLOCHETTES, 'clochette']].forEach(([liste, type]) => {
      liste.forEach((o) => { if (o.seuil > avantTotal && o.seuil <= apres) debloques.push(t(type + '.' + o.id)); });
    });
    if (debloques.length) msgH += (msgH ? ' ' : '') + t('fin.debloque', { liste: debloques.join(', ') });
    zoneH.textContent = msgH;
    zoneH.classList.toggle('cache', !msgH);

    const zoneB = document.getElementById('fin-boutons');
    zoneB.innerHTML = '';
    const ajout = (cle, f, classe) => {
      const b = document.createElement('button');
      b.className = 'btn' + (classe ? ' ' + classe : '');
      b.textContent = t(cle);
      b.addEventListener('click', () => { audio(); son('clic'); f(); });
      zoneB.appendChild(b);
      return b;
    };
    let premier;
    if (gagne) {
      if (!dernier) premier = ajout('fin.suivant', () => lancerNiveau(num + 1), 'principal');
      ajout('fin.rejouer', () => lancerNiveau(num), dernier ? 'principal' : '');
      ajout('niveaux', ouvrirNiveaux);
      if (dernier || debloques.length) ajout('ecurie', ouvrirEcurie, 'vert');
      if (dernier) premier = zoneB.firstElementChild;
    } else {
      premier = ajout('fin.reessayer', () => lancerNiveau(num), 'principal');
      ajout('niveaux', ouvrirNiveaux);
      ajout('accueil', allerAccueil);
    }
    montrer('fin');
    try { (premier || zoneB.firstElementChild).focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  function majHud() {
    let c = '';
    for (let i = 0; i < COEURS_MAX; i++) c += SVG_COEUR(i < partie.coeurs);
    $('hud-coeurs').innerHTML = c;
    $('hud-coeurs').setAttribute('aria-label', t('hud.coeurs', { n: partie.coeurs }));
    $('hud-fers').innerHTML = SVG_FER + '<span></span>';
    $('hud-fers').lastElementChild.textContent = t('hud.fers', { n: partie.fers, total: FERS_PAR_NIVEAU });
    $('hud-pommes').innerHTML = SVG_POMME + '<span></span>';
    $('hud-pommes').lastElementChild.textContent = nb(partie.pommes);

  $('b-pause').innerHTML = SVG_PAUSE;
  function majBoutonsSon() {
    ['b-son', 'b-son2'].forEach((id) => {
      const b = $(id);
      b.innerHTML = SVG_SON(prog.son);
      b.setAttribute('aria-label', t(prog.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('title', t(prog.son ? 'son.couper' : 'son.remettre'));
    });
  }
  function basculerSon() { audio(); prog.son = !prog.son; majBoutonsSon(); sauverReglages(); son('clic'); }
  $('b-son').addEventListener('click', basculerSon);
  $('b-son2').addEventListener('click', basculerSon);
  majBoutonsSon();

  function mettrePause() {
    if (etat !== 'jeu') return;
    etat = 'pause';
    touches.g = false; touches.d = false;
    $('pause-niveau').textContent = t('niveau.nom', { n: monde.num, paysage: t('paysage.' + monde.paysage.id) }) + ' · ' + t('hud.fers', { n: partie.fers, total: FERS_PAR_NIVEAU });
    montrer('pause');
    try { $('b-reprendre').focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }
  function reprendre() { cacher('pause'); etat = 'jeu'; dernierTemps = performance.now(); }
  $('b-pause').addEventListener('click', () => { audio(); son('clic'); mettrePause(); });
  $('b-reprendre').addEventListener('click', () => { son('clic'); reprendre(); });
  $('b-recommencer').addEventListener('click', () => { son('clic'); lancerNiveau(monde.num); });
  $('b-pause-niveaux').addEventListener('click', () => { son('clic'); sauver({ niveau: monde.num }); ouvrirNiveaux(); });
  $('b-accueil').addEventListener('click', () => { son('clic'); sauver({ niveau: monde.num }); allerAccueil(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && etat === 'jeu') mettrePause(); });

  function allerAccueil() {
    etat = 'titre';
    ['hud', 'commandes', 'pause', 'fin', 'niveaux', 'ecurie', 'tuto', 'bandeau'].forEach(cacher);
    montrer('titre');
    try { $('b-jouer').focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }

  function jouer() {
    audio(); son('clic');
    if (!SAVE) { lancerNiveau(1); return; }
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => lancerNiveau(Math.max(1, Math.min(NIVEAUX.length, parseInt(d.niveau, 10) || 1))),
      onNouvelle: () => lancerNiveau(1),
      // Sauvegarde effacée : toute la progression repart de zéro, on reste sur l'écran titre
      onEffacer: () => {
        prog.niveau = 1; prog.score = 0; prog.max = 1; prog.vus = [];
        prog.etoiles = NIVEAUX.map(() => 0); prog.records = NIVEAUX.map(() => 0);
        prog.robe = 'alezan'; prog.criniere = 'simple'; prog.clochette = 'aucune';
        allerAccueil();
      }
    });
  }
  $('b-jouer').addEventListener('click', jouer);

  // Sélection des niveaux
  function ouvrirNiveaux() {
    etat = 'niveaux';
    ['hud', 'commandes', 'pause', 'fin', 'titre', 'bandeau'].forEach(cacher);
    const zone = $('liste-paysages');
    zone.innerHTML = '';
    $('niveaux-total').textContent = t('niveaux.total', { n: totalEtoiles(), total: NIVEAUX.length * 3 });
    const m = maxDebloque();
    PAYSAGES.forEach((pay, pi) => {
      const bloc = document.createElement('div');
      bloc.className = 'paysage';
      const h = document.createElement('h3');
      const nom = document.createElement('span'); nom.textContent = t('paysage.' + pay.id);
      h.appendChild(nom);
      const hd = ORDRE_HARDE[pi];
      const idxH = (pi + 1) * 5 - 1;
      if (prog.etoiles[idxH] > 0) { const s = document.createElement('small'); s.textContent = t('niveaux.retrouve', { nom: t('harde.' + hd) }); h.appendChild(s); }
      bloc.appendChild(h);
      const g = document.createElement('div'); g.className = 'grille';
      NIVEAUX.forEach((def, i) => {
        if (def.p !== pi) return;
        const n = i + 1;
        const b = document.createElement('button');
        b.className = 'case';
        if (n > m) {
          b.classList.add('ferme'); b.innerHTML = SVG_CADENAS; b.disabled = true;
          b.setAttribute('aria-label', t('niveaux.ferme', { n }));
        } else {
          const e = prog.etoiles[i];
          const bn = document.createElement('b'); bn.textContent = nb(n);
          const st = document.createElement('span'); st.textContent = '★'.repeat(e) + '☆'.repeat(3 - e);
          b.append(bn, st);
          if (def.harde) b.classList.add('harde');
          b.setAttribute('aria-label', t('niveaux.case', { n, e }));
          b.addEventListener('click', () => { audio(); son('clic'); cacher('niveaux'); lancerNiveau(n); });
        }
        g.appendChild(b);
      });
      bloc.appendChild(g);
      zone.appendChild(bloc);
    });
    montrer('niveaux');
    try { $('b-niveaux-retour').focus({ preventScroll: true }); } catch (e) { /* rien */ }
  }
  $('b-niveaux').addEventListener('click', () => { audio(); son('clic'); ouvrirNiveaux(); });
  $('b-niveaux-retour').addEventListener('click', () => { son('clic'); cacher('niveaux'); allerAccueil(); });

  // Écurie : apparence
  function ouvrirEcurie() {
    etat = 'ecurie';
    ['hud', 'commandes', 'pause', 'fin', 'titre', 'niveaux', 'bandeau'].forEach(cacher);
    $('ecurie-total').textContent = t('ecurie.total', { n: totalEtoiles() });
    const tot = totalEtoiles();
    const remplir = (id, liste, type, cle) => {
      const z = $(id); z.innerHTML = '';
      liste.forEach((o) => {
        const b = document.createElement('button');
        const ouvert = tot >= o.seuil;
        if (type === 'robe') {
          const p = document.createElement('i'); p.className = 'pastille'; p.style.background = o.corps; b.appendChild(p);
        }
        const s = document.createElement('span');
        s.textContent = ouvert ? t(type + '.' + o.id) : t('ecurie.verrou', { n: o.seuil });
        b.appendChild(s);
        if (!ouvert) { b.classList.add('ferme'); b.setAttribute('aria-label', t(type + '.' + o.id) + ' — ' + t('ecurie.verrou', { n: o.seuil })); }
        if (prog[cle] === o.id) b.classList.add('actif');
        b.addEventListener('click', () => {
          audio();
          if (!ouvert) { son('aie'); return; }
          prog[cle] = o.id; son('clic'); sauverReglages(); ouvrirEcurie();
        });
        z.appendChild(b);
      });
    };
    if (tot < trouver(ROBES, prog.robe).seuil) prog.robe = 'alezan';
    if (tot < trouver(CRINIERES, prog.criniere).seuil) prog.criniere = 'simple';
    if (tot < trouver(CLOCHETTES, prog.clochette).seuil) prog.clochette = 'aucune';
    remplir('choix-robe', ROBES, 'robe', 'robe');
    remplir('choix-criniere', CRINIERES, 'criniere', 'criniere');
    remplir('choix-clochette', CLOCHETTES, 'clochette', 'clochette');
    montrer('ecurie');
  }
  $('b-ecurie').addEventListener('click', () => { audio(); son('clic'); ouvrirEcurie(); });
  $('b-ecurie-retour').addEventListener('click', () => { son('clic'); cacher('ecurie'); allerAccueil(); });

  function ouvrirTuto(liste) {
    tutoFile = liste; tutoIndex = 0; tutoT = 0;

  function afficherTuto() {
    const k = tutoFile[tutoIndex];

    son('clic');

    if (prog.vus.indexOf(k) < 0) prog.vus.push(k);

      cacher('tuto'); etat = 'jeu'; dernierTemps = performance.now();
      sauver({ niveau: monde.num });
      bandeau(t('niveau.nom', { n: monde.num, paysage: t('paysage.' + monde.paysage.id) }));

  }

  // Petite scène animée de la carte du tutoriel (dessin seul, sans texte)
  const mini = $('mini');
  const mctx = mini.getContext('2d');
  function dessinerMain(c, x, y, appui) {
