      c.fillStyle = '#2f6b2a'; c.beginPath(); c.arc(x + pas / 2, y - r * 0.6, r, 0, 6.28); c.fill();
    }
    for (let x = x0 + 6; x < x1 - 4; x += pas * 0.7) {
      c.fillStyle = '#4b1f5a'; c.beginPath(); c.arc(x, y - 14 - ((x * 7) % 14), 3.5, 0, 6.28); c.fill();
      c.fillStyle = '#7a3d8a'; c.beginPath(); c.arc(x + 3, y - 10 - ((x * 11) % 12), 3, 0, 6.28); c.fill();
    }
    c.strokeStyle = '#1f4a1c'; c.lineWidth = 2;
    for (let x = x0; x < x1; x += pas * 1.3) { c.beginPath(); c.moveTo(x, y - 6); c.lineTo(x + 5, y - 24 - ((x * 3) % 8)); c.stroke(); }
  }
  function dessinerChevre(c, x, y, ech, dir, tete) {
    c.save(); c.translate(x, y); c.scale(ech * dir, ech);
    c.fillStyle = 'rgba(0,0,0,.15)'; c.beginPath(); c.ellipse(0, 0, 20, 4, 0, 0, 6.28); c.fill();
    c.fillStyle = '#8a7a6a'; [-12, -6, 8, 13].forEach((jx) => c.fillRect(jx - 2, -16, 4, 16));
    c.fillStyle = '#f2ece2'; c.beginPath(); c.ellipse(0, -22, 19, 10, 0, 0, 6.28); c.fill();
    c.fillStyle = '#e0d6c6'; c.beginPath(); c.ellipse(-4, -19, 10, 5, 0, 0, 6.28); c.fill();
    const s = tete > 0 ? Math.sin(tete * 30) * 0.25 : 0;
    c.save(); c.translate(17, -28); c.rotate(0.3 + s);
    c.fillStyle = '#f2ece2'; c.beginPath(); c.ellipse(5, 2, 9, 6, 0.3, 0, 6.28); c.fill();
    c.strokeStyle = '#7a6040'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(1, -3); c.quadraticCurveTo(-6, -14, -10, -8); c.stroke();
    c.fillStyle = '#d6cbb8'; c.beginPath(); c.moveTo(9, 7); c.lineTo(7, 14); c.lineTo(12, 8); c.fill();
    c.fillStyle = '#1d140e'; c.beginPath(); c.arc(6, 0, 1.6, 0, 6.28); c.fill();
    c.restore();
    c.restore();
  }
  function dessinerCorniche(c, x, y, w, h, pay, fragile) {
    c.fillStyle = fragile ? '#e9f3ff' : pay.roche;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x + w, y); c.lineTo(x + w - 8, y + h); c.lineTo(x + w * 0.5, y + h + 10); c.lineTo(x + 8, y + h); c.closePath(); c.fill();
    c.fillStyle = fragile ? '#ffffff' : pay.herbe; c.fillRect(x, y, w, 7);
    if (fragile) { c.strokeStyle = '#a8c6e6'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + w * 0.3, y + 2); c.lineTo(x + w * 0.4, y + h); c.moveTo(x + w * 0.7, y + 2); c.lineTo(x + w * 0.6, y + h - 4); c.stroke(); }
  }
  function dessinerCascadeMini(c, x0, x1, y, tt) {
    c.fillStyle = 'rgba(160,220,255,.75)'; c.fillRect(x0, 0, x1 - x0, 340);
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 3;
    for (let i = 0; i < 6; i++) { const lx = x0 + 10 + i * (x1 - x0 - 20) / 5; const ly = (tt * 300 + i * 50) % 340; c.beginPath(); c.moveTo(lx, ly); c.lineTo(lx, ly + 30); c.stroke(); }
  }

  // Décor lointain (parallaxe)
  function dessinerFond(pay, decX, decY, W, H) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, pay.ciel[0]); g.addColorStop(1, pay.ciel[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // Soleil
    ctx.fillStyle = pay.id === 'gorges' ? 'rgba(255,230,160,.9)' : 'rgba(255,250,210,.9)';
    ctx.beginPath(); ctx.arc(W * 0.8, H * 0.16, 34, 0, 6.28); ctx.fill();
    // Nuages
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 260 - decX * 0.08 + horloge * 6) % (W + 300) + W + 300) % (W + 300) - 150;
      const cy = H * (0.12 + i * 0.07);
      ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 6.28); ctx.arc(cx + 26, cy - 8, 28, 0, 6.28); ctx.arc(cx + 54, cy, 20, 0, 6.28); ctx.fill();
    }
    // Montagnes lointaines
    const montagnes = (vit, base, haut, couleur, neige, pas) => {
      ctx.fillStyle = couleur;
      ctx.beginPath(); ctx.moveTo(0, H);
      const off = decX * vit;
      for (let x = -pas; x <= W + pas; x += 20) {
        const wx = x + off;
        const h = Math.sin(wx / pas) * 0.5 + Math.sin(wx / (pas * 0.43) + 1.3) * 0.3 + Math.sin(wx / (pas * 0.19)) * 0.1;
        ctx.lineTo(x, base - (h + 1) * haut * 0.5);
      }
      ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
      if (neige) {
        // Calotte de neige : la partie de la crête au-dessus d'une ligne
        const ligne = base - 1.66 * haut * 0.5;
        ctx.fillStyle = 'rgba(255,255,255,.88)';
        ctx.beginPath(); ctx.moveTo(-pas, ligne);
        for (let x = -pas; x <= W + pas; x += 20) {
          const wx = x + off;
          const h = Math.sin(wx / pas) * 0.5 + Math.sin(wx / (pas * 0.43) + 1.3) * 0.3 + Math.sin(wx / (pas * 0.19)) * 0.1;
          ctx.lineTo(x, Math.min(ligne + Math.sin(wx * 0.09) * 7, base - (h + 1) * haut * 0.5));
        }
        ctx.lineTo(W + pas, ligne); ctx.closePath(); ctx.fill();
      }
    };
    const base = H * 0.62 - Math.max(-120, Math.min(120, decY * 0.04));
    montagnes(0.1, base, H * 0.4, pay.loin, pay.id === 'sommet' || pay.id === 'cascade', 220);
    montagnes(0.25, base + H * 0.12, H * 0.22, pay.colline, false, 160);
    // Cascades au loin
    if (pay.id === 'cascade') {
      for (let i = 0; i < 3; i++) {
        const cx = ((i * 380 - decX * 0.25) % (W + 400) + W + 400) % (W + 400) - 100;
        ctx.fillStyle = 'rgba(230,250,255,.7)';
        ctx.fillRect(cx, base - H * 0.15, 16, H * 0.4);
      }
    }
  }

  function dessinerMonde() {
    const W = vue.w, H = vue.h, M = monde, pay = M.paysage;
    dessinerFond(pay, cam.x, cam.y, W, H);
    ctx.save();
    let sx = 0, sy = 0;
    if (secousse > 0) { sx = (Math.random() - 0.5) * 10; sy = (Math.random() - 0.5) * 10; }
    ctx.translate(-Math.round(cam.x) + sx, -Math.round(cam.y) + sy);
    const x0 = cam.x - 60, x1 = cam.x + W + 60;
    const vis = (a, b) => b > x0 && a < x1;

    // Cascades (derrière)
    for (const cs of M.cascades) {
      if (!vis(cs.x0, cs.x1)) continue;
      const top = cs.y - 420;
      const g = ctx.createLinearGradient(0, top, 0, cs.y + 200);
      g.addColorStop(0, 'rgba(200,240,255,.2)'); g.addColorStop(0.3, 'rgba(170,225,255,.85)'); g.addColorStop(1, 'rgba(170,225,255,.9)');
      ctx.fillStyle = g; ctx.fillRect(cs.x0, top, cs.x1 - cs.x0, 640);
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        const lx = cs.x0 + 8 + i * (cs.x1 - cs.x0 - 16) / 5;
        const ly = top + ((horloge * 420 + i * 70) % 600);
        ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx, ly + 34); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.8)';
      for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.arc(cs.x0 + i * (cs.x1 - cs.x0) / 4, cs.y + 40 + Math.sin(horloge * 5 + i) * 4, 12, 0, 6.28); ctx.fill(); }
    }
    // Lianes des ponts (derrière les planches)
    for (const p of M.planches) {
      if (!vis(p.r.x - 40, p.r.x + 110)) continue;
      ctx.strokeStyle = '#3f7a2a'; ctx.lineWidth = 3;
      const ax = p.cx - 36, top = p.base - 230;
      ctx.beginPath(); ctx.moveTo(ax + 6, top); ctx.lineTo(p.r.x + 6, p.r.y); ctx.moveTo(ax + 66, top); ctx.lineTo(p.r.x + 66, p.r.y); ctx.stroke();
      ctx.fillStyle = '#5aa23b';
      for (let k = 1; k < 4; k++) { const fx = ax + 6 + (p.r.x - ax) * k / 4, fy = top + (p.r.y - top) * k / 4; ctx.beginPath(); ctx.ellipse(fx + 4, fy, 5, 2.5, 0.5, 0, 6.28); ctx.fill(); }
    }
    // Eau des ruisseaux
    for (const e of M.eaux) {
      if (!vis(e.x, e.x + e.w)) continue;
      ctx.fillStyle = pay.id === 'sommet' ? '#7cc0e8' : '#4fb3e8';
      ctx.fillRect(e.x, e.y, e.w, 600);
      ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2;
      for (let i = 0; i < e.w; i += 26) { const yy = e.y + 6 + Math.sin(horloge * 3 + i * 0.2) * 2; ctx.beginPath(); ctx.moveTo(e.x + i, yy); ctx.lineTo(e.x + i + 12, yy); ctx.stroke(); }
    }
    // Solides
    for (const r of M.solides) {
      if (!vis(r.x, r.x + r.w)) continue;
      if (r.pierre) continue;
      if (r.planche) { ctx.fillStyle = '#9a6b3a'; ctx.fillRect(r.x, r.y, r.w, r.h); ctx.fillStyle = '#7a4f28'; for (let i = 1; i < 4; i++) ctx.fillRect(r.x + i * r.w / 4, r.y, 2, r.h); continue; }
      if (r.buche) {
        ctx.fillStyle = '#8a5a30'; ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 9); ctx.fill();
        ctx.fillStyle = '#c99a6a'; ctx.beginPath(); ctx.ellipse(r.x + r.w - 6, r.y + r.h / 2, 5, r.h / 2 - 1, 0, 0, 6.28); ctx.fill();
        ctx.fillStyle = '#5a3a1a'; ctx.fillRect(r.x + 14, r.y + r.h, 6, 70); ctx.fillRect(r.x + r.w - 20, r.y + r.h, 6, 70);
        continue;
      }
      if (r.fragile) {
        const f = M.fragiles.find((q) => q.r === r);
        const tr = f && f.etat === 'tremble' ? Math.sin(horloge * 70) * 2.5 : 0;
        if (f && f.etat === 'tombe') {
          if (f.t < 1.4) { ctx.globalAlpha = Math.max(0, 1 - f.t / 1.4); dessinerCorniche(ctx, r.x, r.y + f.dy, r.w, r.h, pay, true); }
          else if (f.t > 2.4) { ctx.globalAlpha = Math.min(1, (f.t - 2.4) / 0.8) * 0.6; dessinerCorniche(ctx, r.x, r.y, r.w, r.h, pay, true); }
          ctx.globalAlpha = 1;
        } else dessinerCorniche(ctx, r.x + tr, r.y, r.w, r.h, pay, true);
        continue;
      }
      if (r.mince) { dessinerCorniche(ctx, r.x, r.y, r.w, r.h, pay, false); if (r.glace) { ctx.fillStyle = '#d6f0ff'; ctx.fillRect(r.x, r.y, r.w, 7); } continue; }
      // Falaise
      const bas = Math.min(r.y + r.h, cam.y + H + 80);
      const g = ctx.createLinearGradient(0, r.y, 0, r.y + 260);
      g.addColorStop(0, pay.terre); g.addColorStop(1, pay.roche);
      ctx.fillStyle = g; ctx.fillRect(r.x, r.y, r.w, bas - r.y);
      // Strates de roche
      ctx.fillStyle = 'rgba(0,0,0,.08)';
      for (let yy = r.y + 40; yy < bas; yy += 46) ctx.fillRect(r.x, yy, r.w, 5);
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      for (let xx = r.x + ((r.x0 * 7) % 30); xx < r.x + r.w - 10; xx += 58) { ctx.beginPath(); ctx.arc(xx + 10, r.y + 60 + ((xx * 13) % 70), 7, 0, 6.28); ctx.fill(); }
      // Dessus : herbe, neige ou glace
      ctx.fillStyle = r.glace ? '#cdebff' : pay.herbe;
      ctx.fillRect(r.x, r.y, r.w, 12);
      ctx.fillStyle = r.glace ? '#ffffff' : pay.bord;
      if (r.glace) { ctx.fillRect(r.x + 6, r.y + 3, r.w * 0.3, 2); ctx.fillRect(r.x + r.w * 0.55, r.y + 4, r.w * 0.25, 2); }
      else for (let xx = r.x + 4; xx < r.x + r.w - 4; xx += 13) { ctx.beginPath(); ctx.moveTo(xx, r.y + 1); ctx.lineTo(xx + 3, r.y - 6 - ((xx * 7) % 4)); ctx.lineTo(xx + 6, r.y + 1); ctx.fill(); }
      // Fleurs dans la prairie
      if (pay.id === 'prairie' || pay.id === 'cascade') {
        for (let xx = r.x + 20; xx < r.x + r.w - 10; xx += 71) {
          const col = ['#ff8fab', '#ffd166', '#ffffff', '#b197fc'][Math.floor(Math.abs(xx) / 71) % 4];
          ctx.fillStyle = col; ctx.beginPath(); ctx.arc(xx + ((xx * 3) % 20), r.y - 3, 3, 0, 6.28); ctx.fill();
        }
      }
    }
    // Pierres du ruisseau
    for (const s of M.pierres) {
      if (!vis(s.r.x, s.r.x + s.r.w)) continue;
      const tremble = s.t > 0 && s.t < s.delai ? Math.sin(horloge * 50) * 1.5 : 0;
      dessinerPierre(ctx, s.r.x + s.r.w / 2 + tremble, s.r.y, s.r.w + 8);
      if (s.enfonce > 0) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(s.r.x + s.r.w / 2, s.base + 26, s.r.w / 2 + 8, 4, 0, 0, 6.28); ctx.fill(); }
    }
    // Ronces
    for (const rc of M.ronces) if (vis(rc.x0, rc.x1)) dessinerRonces(ctx, rc.x0, rc.x1, rc.y, 1);
    // Arbres
    for (const a of M.arbres) {
      if (!vis(a.x - 60, a.x + 60)) continue;
      dessinerArbre(ctx, a.x, a.y, 1, 0, a.secoue, a.neige);
      const pos = [[-28, -112], [0, -134], [28, -112]];
      a.pommes.forEach((p, i) => dessinerPomme(ctx, a.x + pos[i][0] + (a.secoue > 0 ? Math.sin(a.secoue * 40) * 4 : 0), a.y + pos[i][1], 1));
    }
    // Drapeaux de passage
    for (const dr of M.drapeaux) {
      if (!vis(dr.x - 20, dr.x + 60)) continue;
      ctx.fillStyle = '#7a5a3a'; ctx.fillRect(dr.x - 2, dr.y - 80, 5, 80);
      ctx.fillStyle = dr.actif ? '#6cc24a' : '#ff6b6b';
      const ond = Math.sin(horloge * 6) * 4;
      ctx.beginPath(); ctx.moveTo(dr.x + 3, dr.y - 80); ctx.quadraticCurveTo(dr.x + 22, dr.y - 74 + ond, dr.x + 40, dr.y - 68); ctx.lineTo(dr.x + 3, dr.y - 56); ctx.fill();
      if (dr.actif) { ctx.fillStyle = '#ffd34d'; ctx.beginPath(); ctx.arc(dr.x + 1, dr.y - 84, 5, 0, 6.28); ctx.fill(); }
    }
    // Arrivée
    const b = M.but;
    if (vis(b.x - 200, b.x + 300)) {
      for (let i = 0; i < 18; i++) {
        const fx = b.x - 150 + i * 22, col = ['#ff8fab', '#ffd166', '#b197fc', '#ffffff', '#4dabf7'][i % 5];
        ctx.strokeStyle = '#3f8a28'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(fx, b.y); ctx.lineTo(fx + 2, b.y - 14 - (i % 3) * 5); ctx.stroke();
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(fx + 2, b.y - 16 - (i % 3) * 5, 4.5, 0, 6.28); ctx.fill();
      }
      if (b.harde) {
        const h = HARDE[b.harde];
        dessinerCheval(ctx, b.x + 40, b.y, h.taille, { robe: h.robe, criniere: h.criniere, clochette: 'aucune', face: -1, phase: horloge * 2, court: false });
        if (partie.victoire > 0) for (let i = 0; i < 3; i++) dessinerCoeur(ctx, b.x - 10 + i * 20, b.y - 110 - ((horloge * 60 + i * 20) % 50), 8);
      } else {
        // Arche de fleurs du pré suivant
        ctx.strokeStyle = '#6a8a3a'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(b.x + 30, b.y, 70, Math.PI, 0); ctx.stroke();
        for (let i = 0; i <= 10; i++) {
          const a = Math.PI + i / 10 * Math.PI;
          ctx.fillStyle = ['#ff8fab', '#ffd166', '#ffffff', '#b197fc'][i % 4];
          ctx.beginPath(); ctx.arc(b.x + 30 + Math.cos(a) * 70, b.y + Math.sin(a) * 70, 7, 0, 6.28); ctx.fill();
        }
      }
    }
    // Fers à cheval
    for (const f of M.fers) if (!f.pris && vis(f.x - 30, f.x + 30)) dessinerFer(ctx, f.x, f.y, 1.2, horloge + f.x);
    // Pommes tombées
    for (const p of M.pommes) dessinerPomme(ctx, p.x + 8, p.y + 8, 1);
    // Chèvres
    for (const cv of M.chevres) if (vis(cv.x - 40, cv.x + 40)) dessinerChevre(ctx, cv.x, cv.y, 1.15, cv.dir, cv.tete);
    // Rochers
    for (const r of M.rochers) dessinerRocher(ctx, r.x, r.y, r.r, r.ang, r.neige);
    // Poulain (clignote quand il vient d'être bousculé)
    if (partie.defaite <= 0 && !(P.inv > 0 && Math.floor(horloge * 12) % 2 === 0)) {
      dessinerCheval(ctx, P.x + P.w / 2, P.y + P.h, 1, {
        robe: prog.robe, criniere: prog.criniere, clochette: prog.clochette, face: P.face,
        phase: P.phase, court: P.sol && Math.abs(P.vx) > 20, saut: !P.sol, ruade: P.ruade > 0
      });
    } else if (partie.defaite > 0) {
      ctx.globalAlpha = Math.max(0, partie.defaite);
      dessinerCheval(ctx, P.x + P.w / 2, P.y + P.h, 1, { robe: prog.robe, criniere: prog.criniere, clochette: prog.clochette, face: P.face });
      ctx.globalAlpha = 1;
    }
    // Vent : feuilles d'alerte, puis traits de rafale
    for (const v of M.vents) {
      if (!vis(v.x0, v.x1) || v.etat === 'calme') continue;
      for (let i = 0; i < 10; i++) {
        const span = v.x1 - v.x0;
        const prog2 = ((horloge * (v.etat === 'rafale' ? 500 : 120) + i * 97) % span);
        const lx = v.dir < 0 ? v.x1 - prog2 : v.x0 + prog2;
        const ly = cam.y + 90 + ((i * 71) % (H - 260));
        if (v.etat === 'rafale') { ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx - v.dir * 50, ly); ctx.stroke(); }
        else dessinerFeuille(ctx, lx, ly, horloge + i);
      }
    }
    // Particules
    for (const p of particules) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.vie * 2));
      ctx.fillStyle = p.c;
      if (p.etoile) dessinerEtoile(ctx, p.x, p.y, p.r * 2, true);
      else if (p.carre) ctx.fillRect(p.x, p.y, p.r * 2, p.r * 1.4);
      else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.restore();

  }
  function dessinerCoeur(c, x, y, r) {
    c.fillStyle = '#ff5470';
    c.beginPath(); c.moveTo(x, y + r);
    c.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.4, x, y - r * 0.4);
    c.bezierCurveTo(x + r * 0.6, y - r * 1.4, x + r * 1.6, y - r * 0.2, x, y + r);
    c.fill();
  }

  // Scène de l'écran titre : falaises, poulain, harde déjà retrouvée
  function dessinerTitre() {
    const W = vue.w, H = vue.h;
    const pay = PAYSAGES[0];
    dessinerFond(pay, horloge * 20, 0, W, H);
    const sy = H * 0.74;
    // Falaise en escalier à droite
    const marches = [[W * 0.55, sy - 40], [W * 0.72, sy - 110], [W * 0.86, sy - 190]];
    ctx.fillStyle = pay.terre;
    ctx.fillRect(0, sy, W, H - sy);
    marches.forEach(([x, y]) => { ctx.fillStyle = pay.roche; ctx.fillRect(x, y, W - x, H - y); ctx.fillStyle = pay.herbe; ctx.fillRect(x, y, W - x, 12); });
    ctx.fillStyle = pay.herbe; ctx.fillRect(0, sy, W * 0.55, 12);
    // Sommet enneigé au fond
    ctx.fillStyle = '#e8eef8'; ctx.beginPath(); ctx.moveTo(W * 0.62, sy - 190); ctx.lineTo(W * 0.86, H * 0.3); ctx.lineTo(W * 1.1, sy - 190); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(W * 0.8, H * 0.36); ctx.lineTo(W * 0.86, H * 0.3); ctx.lineTo(W * 0.92, H * 0.36); ctx.fill();
    dessinerArbre(ctx, W * 0.16, sy, Math.min(1.3, W / 360), 3, 0, false);
    // Fers à cheval qui flottent
    dessinerFer(ctx, W * 0.64, sy - 120, 1.3, horloge);
    dessinerFer(ctx, W * 0.8, sy - 200, 1.3, horloge + 1);
    // Harde retrouvée
    const ech = Math.min(1.9, W / 230);
    ORDRE_HARDE.forEach((id, i) => {
      if (prog.etoiles[(i + 1) * 5 - 1] > 0) {
        const h = HARDE[id];
        dessinerCheval(ctx, W * (0.08 + i * 0.1), sy, ech * 0.85 * h.taille / 1.4, { robe: h.robe, criniere: h.criniere, clochette: 'aucune', phase: horloge, face: 1 });
      }
    });
    // Pépite qui trotte sur place
    dessinerCheval(ctx, W * 0.42, sy, ech, { robe: prog.robe, criniere: prog.criniere, clochette: prog.clochette, phase: horloge * 8, court: true, face: 1 });
  }

  // Aperçu de l'écurie
  const apercu = $('apercu');
  const actx = apercu.getContext('2d');
  function dessinerApercu() {
    actx.clearRect(0, 0, 440, 300);
    dessinerCheval(actx, 220, 250, 3, { robe: prog.robe, criniere: prog.criniere, clochette: prog.clochette, phase: horloge * 6, court: true, face: 1 });
  }

  // --------------------------------------------------------------------
  // Boucle principale
  // --------------------------------------------------------------------
  function redimensionner() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    const s = Math.min(W / 440, H / 560);
    vue = { w: W / s, h: H / s, s: s, dpr: dpr };
    ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
  }
  window.addEventListener('resize', redimensionner);
  redimensionner();

  let dernierTemps = performance.now();
  function boucle(maintenant) {
    let dt = (maintenant - dernierTemps) / 1000;
    dernierTemps = maintenant;
    if (!(dt > 0)) dt = 0;
    dt = Math.min(dt, 1 / 30);
    ctx.setTransform(vue.dpr * vue.s, 0, 0, vue.dpr * vue.s, 0, 0);
    if (etat === 'jeu' && monde) {
      // Deux demi-pas pour des collisions plus sûres
      mettreAJour(dt / 2); if (etat === 'jeu') mettreAJour(dt / 2);
      dessinerMonde();
    } else if ((etat === 'pause' || etat === 'tuto' || etat === 'fin') && monde) {
      if (etat !== 'pause') horloge += dt;
      if (etat === 'fin') majParticules(dt);
      dessinerMonde();
      if (etat === 'tuto') dessinerTuto(dt);
    } else {
      horloge += dt;
      dessinerTitre();
      if (etat === 'ecurie') dessinerApercu();
    }
    requestAnimationFrame(boucle);
  }

  // Sauvegarde à la fermeture de la page, seulement pendant une partie
  if (SAVE) window.JEL_SAVE.surFermeture(() => {
    if (monde && (etat === 'jeu' || etat === 'pause' || etat === 'tuto')) sauver({ niveau: monde.num, score: prog.score });
  });

  document.title = t('titre');
  allerAccueil();
  requestAnimationFrame(boucle);
})();
</script>
</body>
</html>
