   "one": "Insgesamt {n} geknackter Knochen",
   "other": "Insgesamt {n} geknackte Knochen"
  }
 }
}
</script>
<script id="jel-i18n">
/* ==========================================================================
   Jeux-en-ligne — module commun de traduction (site ET jeux)        jel-i18n v1
   JavaScript pur, sans dépendance, fonctionne hors ligne.

   Langues : fr (source), en, es, pt (Brésil), de. Langue de secours : en.
   Détection, dans l'ordre :
     1. paramètre d'adresse ?lang=xx (enregistré comme choix) ;
     2. choix enregistré : localStorage « lang » (dans un jeu affiché par le
        site, le lanceur transmet ce choix par window.JEL_LANG, car le cadre
        isolé n'a pas accès au stockage du site) ;
     3. navigator.languages (préfixe seul : « pt-BR » → « pt ») ;
     4. « en ».

   API (window.JEL_I18N, et raccourci global t() s'il est libre) :
     getLang()            langue courante
     setLang(code)        change de langue (enregistre, <html lang>, textes)
     t(cle, variables)    texte traduit ; {variables} remplacées ; pluriels
                          via Intl.PluralRules si la valeur est un objet
                          { "one": "…", "other": "…" } (variable n)
     has(cle)             la clé existe-t-elle (langue courante ou fr) ?
     nombre(x, options)   nombre formaté selon la langue (Intl.NumberFormat)
     date(d, options)     date formatée selon la langue (Intl.DateTimeFormat)
     appliquer(racine)    traduit le DOM : data-i18n (texte), data-i18n-html
                          (dictionnaire de confiance seulement),
                          data-i18n-placeholder, data-i18n-title, data-i18n-aria
     ajouter(lang, dico)  ajoute des textes ; charger(dossier) : site seulement
     surChangement(f)     appelle f(lang) après chaque changement de langue
     creerSelecteur(opts) sélecteur de langue (code + nom dans sa langue)

   Clé absente dans la langue choisie : texte français, sinon la clé brute,
   avec un avertissement dans la console (une seule fois par clé).

   Dans un jeu : ce fichier est recopié tel quel dans index.html, juste après
   le bloc <script type="application/json" id="jel-i18n-textes"> qui contient
   { "fr": {…}, "en": {…}, … }. Un petit bouton de langue s'ajoute dans le coin
   indiqué par data-coin (haut-gauche, haut-droite, bas-gauche, bas-droite ;
   data-coin-decalage="52px" l'éloigne du bord haut ou bas, ex. sous une barre ;
   data-place="id1 id2" le met plutôt dans ces éléments du jeu (barre d'outils…) ;
   data-coin="aucun" pour le placer soi-même avec creerSelecteur). Changer de
   langue relance le jeu dans la nouvelle langue.
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie ce fichier).
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_I18N) return;

  var LANGUES = ['fr', 'en', 'es', 'pt', 'de'];
  var NOMS = { fr: 'Français', en: 'English', es: 'Español', pt: 'Português', de: 'Deutsch' };
  var ETIQUETTE = { fr: 'Langue', en: 'Language', es: 'Idioma', pt: 'Idioma', de: 'Sprache' }; // nom du bouton
  var SOURCE = 'fr';
  var SECOURS = 'en';
  var CLE_STOCKAGE = 'lang';

  var dicos = {};          // { fr: { cle: texte }, en: {…} }
  var ecouteurs = [];
  var avertis = {};
  var dossierSite = null;  // site : dossier des fichiers JSON (charger)
  var blocJeu = document.getElementById('jel-i18n-textes');
  var modeJeu = !!blocJeu;

  // --- Outils ---------------------------------------------------------------

  function valide(code) {
    var c = String(code || '').trim().toLowerCase().split(/[-_]/)[0];
    return LANGUES.indexOf(c) >= 0 ? c : null;
  }
  function lireStockage() { try { return localStorage.getItem(CLE_STOCKAGE); } catch (e) { return null; } }
  function ecrireStockage(v) { try { localStorage.setItem(CLE_STOCKAGE, v); } catch (e) { /* stockage refusé */ } }
  function paramAdresse() { try { return new URLSearchParams(location.search).get('lang'); } catch (e) { return null; } }

  function detecter() {
    var c = valide(paramAdresse());
    if (c) { ecrireStockage(c); return c; }
    c = valide(window.JEL_LANG) || valide(lireStockage());
    if (c) return c;
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < liste.length; i++) {
      c = valide(liste[i]);
      if (c) return c;
    }
    return SECOURS;
  }

  var langue = detecter();
  document.documentElement.lang = langue;

  function avertir(texte) {
    if (avertis[texte]) return;
    avertis[texte] = true;
    try { console.warn('[i18n] ' + texte); } catch (e) { /* pas de console */ }
  }

  function trouver(lang, cle) {
    var d = dicos[lang];
    return d && Object.prototype.hasOwnProperty.call(d, cle) ? d[cle] : undefined;
  }

  function nombre(x, options) {
    try { return new Intl.NumberFormat(langue, options).format(x); } catch (e) { return String(x); }
  }

  function date(d, options) {
    try { return new Intl.DateTimeFormat(langue, options).format(d instanceof Date ? d : new Date(d)); } catch (e) { return String(d); }
  }

  // Valeur au pluriel : { one, other, … } selon Intl.PluralRules (variable n).
  function pluriel(valeur, lang, variables) {
    var n = variables && typeof variables.n === 'number' ? variables.n : 0;
    var forme = 'other';
    try { forme = new Intl.PluralRules(lang).select(n); } catch (e) { /* navigateur ancien */ }
    if (n === 0 && typeof valeur.zero === 'string') return valeur.zero;
    return typeof valeur[forme] === 'string' ? valeur[forme] : valeur.other;
  }

  function remplacer(texte, variables) {
    if (!variables) return texte;
    return texte.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!Object.prototype.hasOwnProperty.call(variables, nom)) return tout;
      var v = variables[nom];
      return typeof v === 'number' ? nombre(v) : String(v);
    });
  }

  // --- Traduction -----------------------------------------------------------

  function t(cle, variables) {
    var lang = langue;
    var valeur = trouver(lang, cle);
    if (valeur === undefined) {
      lang = SOURCE;
      valeur = trouver(SOURCE, cle);
      if (langue !== SOURCE || valeur === undefined) avertir('clé manquante en ' + langue + ' : ' + cle);
      if (valeur === undefined) return cle;
    }
    if (valeur && typeof valeur === 'object') valeur = pluriel(valeur, lang, variables);
    return remplacer(String(valeur), variables);
  }

  function has(cle) {
    return trouver(langue, cle) !== undefined || trouver(SOURCE, cle) !== undefined;
  }

  // Traduit tous les éléments marqués sous « racine » (document par défaut).
  function appliquer(racine) {
    racine = racine || document;
    if (!racine.querySelectorAll) return;
    var regles = [
      ['data-i18n', function (el, v) { el.textContent = v; }],
      ['data-i18n-html', function (el, v) { el.innerHTML = v; }],
      ['data-i18n-placeholder', function (el, v) { el.setAttribute('placeholder', v); }],
      ['data-i18n-title', function (el, v) { el.setAttribute('title', v); }],
      ['data-i18n-aria', function (el, v) { el.setAttribute('aria-label', v); }],
    ];
    regles.forEach(function (regle) {
      var liste = racine.querySelectorAll('[' + regle[0] + ']');
      for (var i = 0; i < liste.length; i++) regle[1](liste[i], t(liste[i].getAttribute(regle[0])));
    });
  }

  function ajouter(lang, dico) {
    var c = valide(lang);
    if (!c || !dico || typeof dico !== 'object') return;
    dicos[c] = dicos[c] || {};
    for (var cle in dico) {
      if (Object.prototype.hasOwnProperty.call(dico, cle)) dicos[c][cle] = dico[cle];
    }
  }

  // Site : charge <dossier><lang>.json (fr toujours, pour le repli).
  function chargerUne(lang) {
    if (dicos[lang] || !dossierSite) return Promise.resolve();
    return fetch(dossierSite + lang + '.json')
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { ajouter(lang, d); })
      .catch(function (e) { avertir('textes « ' + lang + ' » indisponibles (' + e.message + ')'); });
  }

  function charger(dossier) {
    dossierSite = dossier;
    return Promise.all([chargerUne(SOURCE), chargerUne(langue)]).then(function () { appliquer(document); });
  }

  function surChangement(f) { if (typeof f === 'function') ecouteurs.push(f); }

  function prevenir() {
    for (var i = 0; i < ecouteurs.length; i++) {
      try { ecouteurs[i](langue); } catch (e) { setTimeout(function () { throw e; }); }
    }
  }

  // Changement de langue appliqué sur place (sans recharger la page).
  function changerSurPlace(c) {
    langue = c;
    document.documentElement.lang = c;
    appliquer(document);
    majSelecteurs();
    prevenir();
  }

  function setLang(code) {
    var c = valide(code);
    if (!c) return Promise.resolve(langue);
    ecrireStockage(c);
    if (modeJeu) {
      if (c === langue) return Promise.resolve(langue);
      // Jeu affiché par le site : le lanceur enregistre le choix et relance le jeu.
      if (window.parent && window.parent !== window) {
        try { window.parent.postMessage({ type: 'jel-langue', lang: c }, '*'); } catch (e) { /* cadre isolé */ }
        // Si personne ne répond (jeu ouvert ailleurs), on change sur place.
        setTimeout(function () { changerSurPlace(c); }, 700);
        return Promise.resolve(c);
      }
      // Jeu ouvert seul : on le relance dans la nouvelle langue.
      if (/^https?:$/.test(location.protocol)) {
        var u = new URL(location.href);
        u.searchParams.set('lang', c);
        location.replace(u.href);
        return Promise.resolve(c);
      }
      changerSurPlace(c);
      return Promise.resolve(c);
    }
    // Site : l'adresse suit le choix si elle porte déjà ?lang=.
    try {
      var adresse = new URL(location.href);
      if (adresse.searchParams.has('lang')) {
        adresse.searchParams.set('lang', c);
        history.replaceState(history.state, '', adresse.href);
      }
    } catch (e) { /* adresse spéciale */ }
    return chargerUne(c).then(function () { changerSurPlace(c); return c; });
  }

  // --- Sélecteur de langue ---------------------------------------------------
  // Bouton (code de la langue) qui ouvre la liste des 5 langues, chacune avec
  // son code et son nom dans sa propre langue. Pas de drapeaux. Doigt et clavier
  // (Entrée, Espace, flèches, Échap).
  // Dans un jeu, il est isolé dans un Shadow DOM (élément <jel-langue>) : le CSS
  // du jeu (button {…}, * {…}) ne peut pas le déformer, et inversement.

  var CSS_SELECTEUR =
    '.jel-langue{position:relative;display:inline-block;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:left;color:#eceae4}' +
    '.jel-langue *{box-sizing:border-box}' +
    '.jel-langue-bouton{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;margin:0;padding:0 10px;border:0;border-radius:999px;background:rgba(11,16,32,.55);color:#eceae4;font:inherit;line-height:1;cursor:pointer;box-shadow:none}' +
    '.jel-langue-code{font-weight:800;letter-spacing:.04em}' +
    '.jel-langue-menu{position:absolute;z-index:2147483001;min-width:170px;margin:6px 0 0;padding:6px;list-style:none;border-radius:14px;background:#161f38;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid #434e6b}' +
    '.jel-langue-menu[hidden]{display:none}' +
    '.jel-langue-menu li{margin:0;padding:0}' +
    '.jel-langue-menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;margin:0;padding:0 12px;border:0;border-radius:10px;background:none;color:#eceae4;font:inherit;text-align:left;cursor:pointer;box-shadow:none;white-space:nowrap}' +
    '.jel-langue-menu button b{min-width:2.2em;color:#a8b3f0}' +
    '.jel-langue-menu button[aria-current="true"]{background:#a8b3f0;color:#0b1020}' +
    '.jel-langue-menu button[aria-current="true"] b{color:#0b1020}' +
    '.jel-langue-menu button:hover:not([aria-current="true"]),.jel-langue-menu button:focus-visible{background:#1d2745}' +
    '.jel-langue :focus-visible{outline:3px solid #a8b3f0;outline-offset:2px}' +
    // Jeu : petit bouton discret (code seul) ; liste ouverte vers l'intérieur de l'écran.
    '.jel-langue.compact .jel-langue-bouton{min-width:40px;min-height:40px;padding:0 8px;font-size:12px;background:rgba(11,16,32,.45);border:1px solid rgba(255,255,255,.3)}' +
    '.jel-langue.compact .jel-langue-nom{display:none}' +
    '.jel-langue.vers-gauche .jel-langue-menu{right:0}' +
    '.jel-langue.vers-haut .jel-langue-menu{bottom:100%;margin:0 0 6px}';

  // Place du bouton dans un jeu, selon le coin choisi (data-coin).
  var COINS = {
    'haut-gauche': { top: 'max(6px, env(safe-area-inset-top))', left: 'max(6px, env(safe-area-inset-left))' },
    'haut-droite': { top: 'max(6px, env(safe-area-inset-top))', right: 'max(6px, env(safe-area-inset-right))' },
    'bas-gauche': { bottom: 'max(6px, env(safe-area-inset-bottom))', left: 'max(6px, env(safe-area-inset-left))' },
    'bas-droite': { bottom: 'max(6px, env(safe-area-inset-bottom))', right: 'max(6px, env(safe-area-inset-right))' },
  };

  var selecteurs = [];

  function majSelecteurs() {
    selecteurs.forEach(function (s) { s.maj(); });
  }

  // options : { conteneur, classe, coin, decalage, isole } ;
  // - coin : sélecteur de jeu isolé, fixé dans ce coin, éloigné du bord haut ou bas de
  //   « decalage » (longueur CSS, ex. « 52px ») s'il est donné ;
  // - isole : sélecteur de jeu isolé, placé dans « conteneur » (ex. la barre du jeu).
  function creerSelecteur(options) {
    options = options || {};
    var coin = options.coin && COINS[options.coin] ? options.coin : null;
    var isole = !!(coin || options.isole);
    var boite = document.createElement('div');
    boite.className = 'jel-langue' + (options.classe ? ' ' + options.classe : '') +
      (isole ? ' compact' : '') + (coin && /droite/.test(coin) ? ' vers-gauche' : '') + (coin && /bas/.test(coin) ? ' vers-haut' : '');

    var bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.className = 'jel-langue-bouton';
    bouton.setAttribute('aria-haspopup', 'true');
    bouton.setAttribute('aria-expanded', 'false');
    var code = document.createElement('span');
    code.className = 'jel-langue-code';
    var nom = document.createElement('span');
    nom.className = 'jel-langue-nom';
    bouton.append(code, nom);

    var menu = document.createElement('ul');
    menu.className = 'jel-langue-menu';
    menu.hidden = true;
    var choix = LANGUES.map(function (l) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.lang = l;
      b.dataset.lang = l;
      var c = document.createElement('b');
      c.textContent = l.toUpperCase();
      b.append(c, document.createTextNode(' ' + NOMS[l]));
      b.addEventListener('click', function () { fermer(true); setLang(l); });
      li.append(b);
      menu.append(li);
      return b;
    });

    var hote = null; // jeu : élément <jel-langue> (un peu transparent, sauf liste ouverte)
    function opacite(v) { if (hote) hote.style.setProperty('opacity', v, 'important'); }
    function ouvrir() {
      // Dans une barre : la liste s'ouvre vers l'intérieur de l'écran.
      if (isole && !coin && hote) {
        var r = hote.getBoundingClientRect();
        boite.classList.toggle('vers-gauche', r.left > window.innerWidth / 2);
        boite.classList.toggle('vers-haut', r.top > window.innerHeight / 2);
      }
      menu.hidden = false;
      opacite('1');
      bouton.setAttribute('aria-expanded', 'true');
      var actuel = choix[LANGUES.indexOf(langue)] || choix[0];
      actuel.focus();
    }
    function fermer(rendreFocus) {
      if (menu.hidden) return;
      menu.hidden = true;
      opacite('.85');
      bouton.setAttribute('aria-expanded', 'false');
      if (rendreFocus) bouton.focus();
    }

    bouton.addEventListener('click', function (e) {
      e.stopPropagation();
      if (menu.hidden) ouvrir(); else fermer(false);
    });
    menu.addEventListener('keydown', function (e) {
      var racine = boite.getRootNode();
      var i = choix.indexOf(racine.activeElement || document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); fermer(true); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); choix[(i + 1) % choix.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); choix[(i - 1 + choix.length) % choix.length].focus(); }
      else if (e.key === 'Tab') fermer(false);
      e.stopPropagation(); // les touches du menu ne pilotent pas le jeu
    });
    bouton.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' && menu.hidden) { e.preventDefault(); ouvrir(); }
      e.stopPropagation();
    });
    // Un toucher ailleurs referme la liste (sans gêner le jeu).
    document.addEventListener('pointerdown', function (e) {
      var chemin = e.composedPath ? e.composedPath() : [e.target];
      if (chemin.indexOf(boite) < 0) fermer(false);
    }, true);
    // Les gestes sur le sélecteur ne doivent pas arriver au jeu.
    ['pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'click'].forEach(function (type) {
      boite.addEventListener(type, function (e) { e.stopPropagation(); });
    });
    boite.append(bouton, menu);

    // Élément ajouté à la page : la boîte elle-même (site), ou un hôte isolé (jeu).
    var element = boite;
    if (isole) {
      element = hote = document.createElement('jel-langue');
      element.className = 'jel-langue';
      var place = coin ? COINS[coin] : {};
      var style = coin
        ? { position: 'fixed', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'block' }
        : { position: 'relative', 'z-index': '2147483000', opacity: '.85', margin: '0', padding: '0', display: 'inline-block', 'vertical-align': 'middle', flex: 'none' };
      for (var p in place) style[p] = options.decalage && /^(top|bottom)$/.test(p) ? 'calc(' + place[p] + ' + ' + options.decalage + ')' : place[p];
      for (var nomStyle in style) element.style.setProperty(nomStyle, style[nomStyle], 'important');
      var ombre = element.attachShadow ? element.attachShadow({ mode: 'open' }) : element;
      var feuille = document.createElement('style');
      feuille.textContent = CSS_SELECTEUR;
      ombre.append(feuille, boite);
    }

    var s = {
      element: element,
      maj: function () {
        code.textContent = langue.toUpperCase();
        nom.textContent = NOMS[langue];
        var etiquette = ETIQUETTE[langue] + ' : ' + NOMS[langue];
        bouton.setAttribute('aria-label', etiquette);
        bouton.title = etiquette;
        choix.forEach(function (b) {
          if (b.dataset.lang === langue) b.setAttribute('aria-current', 'true');
          else b.removeAttribute('aria-current');
        });
      },
    };
    s.maj();
    selecteurs.push(s);
    if (options.conteneur) options.conteneur.append(element);
    return element;
  }

  // Site : style de base du sélecteur dans la page (style.css le complète).
  function ajouterStyle() {
    if (document.getElementById('jel-langue-style')) return;
    var style = document.createElement('style');
    style.id = 'jel-langue-style';
    style.textContent = CSS_SELECTEUR;
    (document.head || document.documentElement).append(style);
  }

  // --- Démarrage ----------------------------------------------------------------

  if (modeJeu) {
    try {
      var textes = JSON.parse(blocJeu.textContent);
      for (var l in textes) if (Object.prototype.hasOwnProperty.call(textes, l)) ajouter(l, textes[l]);
    } catch (e) {
      avertir('textes du jeu illisibles (' + e.message + ')');
    }
  }

  window.JEL_I18N = {
    LANGUES: LANGUES.slice(),
    NOMS: NOMS,
    SOURCE: SOURCE,
    getLang: function () { return langue; },
    setLang: setLang,
    t: t,
    has: has,
    nombre: nombre,
    date: date,
    appliquer: appliquer,
    ajouter: ajouter,
    charger: charger,
    surChangement: surChangement,
    creerSelecteur: creerSelecteur,
  };
  if (!('t' in window)) window.t = t;

  if (!modeJeu) ajouterStyle();

  if (modeJeu) {
    var demarrer = function () {
      appliquer(document);
      // data-place="id1 id2" : bouton(s) dans ces éléments du jeu ; sinon dans le coin data-coin.
      var places = (blocJeu.getAttribute('data-place') || '').split(/\s+/).map(function (id) { return id && document.getElementById(id); }).filter(Boolean);
      var coin = blocJeu.getAttribute('data-coin') || 'haut-gauche';
      if (places.length) places.forEach(function (el) { creerSelecteur({ conteneur: el, isole: true }); });
      else if (coin !== 'aucun' && document.body) {
        creerSelecteur({ conteneur: document.body, coin: coin, decalage: blocJeu.getAttribute('data-coin-decalage') || '' });
      }
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', demarrer);
    else demarrer();
  }
})();
</script>
<script id="jel-sauvegarde">
/* ==========================================================================
   Free Micro Games — module commun de sauvegarde des jeux     jel-sauvegarde v1
   JavaScript pur, sans dépendance, sans compte ni serveur, hors ligne.

   Garde la progression d'un jeu sur l'appareil, sous la clé « save_<id> »
   (ex. « save_pommes-du-poney ») du localStorage du site.

   Où sont les données ?
     - Jeu ouvert seul (adresse /games/<id>/, test local) : localStorage direct.
     - Jeu affiché par le site (cadre isolé, sans accès au stockage) : le
       lanceur (public/play.js) donne la sauvegarde au démarrage
       (window.JEL_SAUVEGARDES = { "save_<id>": "<JSON>" }) et enregistre
       chaque écriture reçue par le message { type: "jel-sauvegarde", cle,
       valeur } (valeur null = effacer). Le jeu ne peut écrire que sa clé.
     - Sans aucun stockage : la sauvegarde vit le temps de la page.

   Données (version de format SAUVEGARDE_VERSION) :
     { v: 1, niveau: 1, score: 0, options: {}, date: <ms> }
     niveau  numéro du niveau où reprendre (1 = premier)
     score   score à ce moment-là
     options réglages utiles (son coupé, difficulté…)
     Le jeu peut ajouter ses propres champs (étoiles, record…).
   Sauvegarde absente, illisible ou d'un format inconnu : valeurs par défaut.

   API (window.JEL_SAVE) :
     save(jeu, donnees)     enregistre (fusionné avec la sauvegarde actuelle) ;
                            renvoie true si c'est fait
     load(jeu)              données (valeurs par défaut si rien d'utilisable)
     clear(jeu)             efface la sauvegarde
     existe(jeu)            une sauvegarde utilisable existe-t-elle ?
     surFermeture(f)        appelle f() quand la page est cachée ou quittée
                            (visibilitychange, pagehide, beforeunload)
     reprise(options)       fenêtre « Continuer » / « Nouvelle partie » /
                            « Effacer la sauvegarde » (voir plus bas)
     boutonEffacer(options) bouton « Effacer la sauvegarde » seul
     texte(cle, vars)       textes du module dans la langue du jeu

   Dans un jeu : ce fichier est recopié tel quel dans index.html, dans une
   balise script d'identifiant « jel-sauvegarde », juste après le module de
   traduction (jel-i18n). Il ne doit jamais contenir la fermeture de balise
   script (elle couperait le jeu).
   Mise à jour des jeux : node scripts/i18n-jeu.mjs (recopie aussi ce fichier).
   Règles d'intégration : CONSIGNES-JEU.md, section « Sauvegarde ».
   ========================================================================== */
(function () {
  'use strict';
  if (window.JEL_SAVE) return;

  var SAUVEGARDE_VERSION = 1;
  var PREFIXE = 'save_';
  var TAILLE_MAX = 100000; // caractères : le lanceur refuse au-delà

  // --- Stockage -------------------------------------------------------------

  var direct = (function () {
    try {
      var essai = '__jel_essai__';
      localStorage.setItem(essai, '1');
      localStorage.removeItem(essai);
      return localStorage;
    } catch (e) { return null; } // cadre isolé du site, stockage refusé
  })();

  var memoire = {};
  try {
    var donnees = window.JEL_SAUVEGARDES;
    if (donnees && typeof donnees === 'object') {
      for (var c in donnees) {
        if (Object.prototype.hasOwnProperty.call(donnees, c) && typeof donnees[c] === 'string') memoire[c] = donnees[c];
      }
    }
  } catch (e) { /* rien reçu du lanceur */ }

  function lire(cle) {
    if (direct) { try { return direct.getItem(cle); } catch (e) { /* stockage devenu indisponible */ } }
    return Object.prototype.hasOwnProperty.call(memoire, cle) ? memoire[cle] : null;
  }

  // valeur null = effacer
  function ecrire(cle, valeur) {
    if (valeur === null) delete memoire[cle]; else memoire[cle] = valeur;
    var ok = false;
    if (direct) {
      try {
        if (valeur === null) direct.removeItem(cle); else direct.setItem(cle, valeur);
        ok = true;
      } catch (e) { /* stockage plein ou refusé */ }
    }
    if (!ok && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: 'jel-sauvegarde', cle: cle, valeur: valeur }, '*'); ok = true; } catch (e) { /* pas de lanceur */ }
    }
    return ok;
  }

  // --- Données ----------------------------------------------------------------

  function cleDe(jeu) { return PREFIXE + String(jeu || '').trim(); }

  function defauts() { return { v: SAUVEGARDE_VERSION, niveau: 1, score: 0, options: {} }; }

  function objet(x) { return !!x && typeof x === 'object' && !Array.isArray(x); }

  // Données relues, ou null si absentes, illisibles ou d'un format inconnu.
  function lireDonnees(jeu) {
    var brut = lire(cleDe(jeu));
    if (typeof brut !== 'string' || !brut) return null;
    var d;
    try { d = JSON.parse(brut); } catch (e) { return null; }
    if (!objet(d) || d.v !== SAUVEGARDE_VERSION) return null;
    var propre = defauts();
    for (var k in d) if (Object.prototype.hasOwnProperty.call(d, k)) propre[k] = d[k];
    var n = Number(propre.niveau);
    propre.niveau = isFinite(n) && n >= 1 ? Math.floor(n) : 1;
    var s = Number(propre.score);
    propre.score = isFinite(s) ? s : 0;
    if (!objet(propre.options)) propre.options = {};
    return propre;
  }

  function load(jeu) { return lireDonnees(jeu) || defauts(); }

  function existe(jeu) { return lireDonnees(jeu) !== null; }

  function save(jeu, donnees) {
    if (!String(jeu || '').trim()) return false;
    var tout = load(jeu);
    if (objet(donnees)) for (var k in donnees) if (Object.prototype.hasOwnProperty.call(donnees, k)) tout[k] = donnees[k];
    tout.v = SAUVEGARDE_VERSION;
    tout.date = Date.now();
    var texte;
    try { texte = JSON.stringify(tout); } catch (e) { return false; }
    if (texte.length > TAILLE_MAX) {
      try { console.warn('[sauvegarde] trop grosse, ignorée (' + texte.length + ' caractères)'); } catch (e) { /* pas de console */ }
      return false;
    }
    return ecrire(cleDe(jeu), texte);
  }

  function clear(jeu) { return ecrire(cleDe(jeu), null); }

  // --- Fermeture de la page -------------------------------------------------

  function surFermeture(f) {
    if (typeof f !== 'function') return;
    var appeler = function () { try { f(); } catch (e) { setTimeout(function () { throw e; }); } };
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') appeler(); });
    window.addEventListener('pagehide', appeler);
    window.addEventListener('beforeunload', appeler);
  }

  // --- Textes (5 langues) -----------------------------------------------------

  var TEXTES = {
    fr: { titre: 'Une partie est sauvegardée', niveau: 'Niveau {n}', score: 'Score : {n}', continuer: 'Continuer', nouvelle: 'Nouvelle partie', effacer: 'Effacer la sauvegarde', confirmer: 'Toucher encore pour effacer', efface: 'Sauvegarde effacée' },
    en: { titre: 'You have a saved game', niveau: 'Level {n}', score: 'Score: {n}', continuer: 'Continue', nouvelle: 'New game', effacer: 'Delete saved game', confirmer: 'Tap again to delete', efface: 'Saved game deleted' },
    es: { titre: 'Tienes una partida guardada', niveau: 'Nivel {n}', score: 'Puntos: {n}', continuer: 'Continuar', nouvelle: 'Nueva partida', effacer: 'Borrar la partida guardada', confirmer: 'Toca otra vez para borrar', efface: 'Partida guardada borrada' },
    pt: { titre: 'Você tem um jogo salvo', niveau: 'Nível {n}', score: 'Pontos: {n}', continuer: 'Continuar', nouvelle: 'Novo jogo', effacer: 'Apagar o jogo salvo', confirmer: 'Toque de novo para apagar', efface: 'Jogo salvo apagado' },
    de: { titre: 'Du hast einen gespeicherten Spielstand', niveau: 'Level {n}', score: 'Punkte: {n}', continuer: 'Weiterspielen', nouvelle: 'Neues Spiel', effacer: 'Spielstand löschen', confirmer: 'Zum Löschen noch mal tippen', efface: 'Spielstand gelöscht' },
  };

  function langue() {
    var l = '';
    try { l = window.JEL_I18N ? window.JEL_I18N.getLang() : (window.JEL_LANG || document.documentElement.lang); } catch (e) { /* rien */ }
    l = String(l || '').toLowerCase().split(/[-_]/)[0];
    return TEXTES[l] ? l : 'fr';
  }

  function texte(cle, vars) {
    var l = langue();
    var s = TEXTES[l][cle] || TEXTES.fr[cle] || cle;
    return s.replace(/\{(\w+)\}/g, function (tout, nom) {
      if (!vars || !Object.prototype.hasOwnProperty.call(vars, nom)) return tout;
      var v = vars[nom];
      if (typeof v === 'number') { try { return new Intl.NumberFormat(l).format(v); } catch (e) { return String(v); } }
      return String(v);
    });
  }

  // --- Interface ------------------------------------------------------------------
  // Isolée dans un Shadow DOM (comme le bouton de langue) : le CSS du jeu ne la
  // déforme pas. Les gestes et les touches n'arrivent pas au jeu.

  var CSS =
    ':host{all:initial}' +
    '*{box-sizing:border-box}' +
    '.fond{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(7,10,20,.72);font:600 16px/1.3 ui-rounded,"Segoe UI",system-ui,sans-serif;color:#eceae4}' +
    '.carte{width:min(360px,100%);padding:20px 18px 14px;border-radius:20px;background:#161f38;border:1px solid #5a6688;box-shadow:0 14px 40px rgba(0,0,0,.5);text-align:center}' +
    'h2{margin:0 0 6px;font-size:19px;line-height:1.25;color:#eceae4}' +
    'p{margin:0 0 16px;color:#a3adc2;font-size:15px}' +
    'button{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin:0 0 10px;padding:8px 14px;border-radius:999px;border:2px solid #a8b3f0;background:transparent;color:#eceae4;font:inherit;font-size:17px;line-height:1.2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}' +
    'button.principal{background:#a8b3f0;color:#0b1020;border-color:#a8b3f0}' +
    'button.discret{min-height:44px;margin:4px 0 0;border:0;color:#a3adc2;font-size:14px;text-decoration:underline}' +
    'button.discret.armer{color:#f2d27a;text-decoration:none}' +
    'button:focus-visible{outline:3px solid #f2d27a;outline-offset:2px}' +
    '.seul{display:inline-flex;width:auto;min-height:44px;margin:0;padding:6px 14px;border:1px solid #5a6688;background:rgba(11,16,32,.6);color:#eceae4;font:600 14px/1.2 ui-rounded,"Segoe UI",system-ui,sans-serif}' +
    '.seul.armer{border-color:#f2d27a;color:#f2d27a}';

  function isoler(element) {
    ['pointerdown', 'pointerup', 'pointermove', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove', 'click', 'keydown', 'keyup', 'wheel'].forEach(function (type) {
      element.addEventListener(type, function (e) { e.stopPropagation(); });
    });
  }

  function creerHote(nom, style) {
    var hote = document.createElement(nom);
    for (var p in style) hote.style.setProperty(p, style[p], 'important');
    var ombre = hote.attachShadow ? hote.attachShadow({ mode: 'open' }) : hote;
    var feuille = document.createElement('style');
    feuille.textContent = CSS;
    ombre.appendChild(feuille);
    return { hote: hote, ombre: ombre };
  }

  function bouton(classe, contenu) {
    var b = document.createElement('button');
    b.type = 'button';
    if (classe) b.className = classe;
    b.textContent = contenu;
    return b;
  }

  // Bouton d'effacement en deux temps (les fenêtres du navigateur sont interdites) :
  // 1er toucher → « Toucher encore pour effacer », 2e toucher dans les 3 s → efface.
  function armerEffacement(b, jeu, fait) {
    var minuteur = null;
    b.addEventListener('click', function () {
      if (!b.classList.contains('armer')) {
        b.classList.add('armer');
        b.textContent = texte('confirmer');
        clearTimeout(minuteur);
        minuteur = setTimeout(function () { b.classList.remove('armer'); b.textContent = texte('effacer'); }, 3000);
        return;
      }
      clearTimeout(minuteur);
      b.classList.remove('armer');
      clear(jeu);
      fait();
    });
  }

  var ouverte = null; // fenêtre de reprise affichée

  // Fenêtre de reprise. options :
  //   jeu          identifiant du jeu (obligatoire)
  //   onContinuer  f(donnees) : reprendre au niveau donnees.niveau
  //   onNouvelle   f() : partie depuis le début (la sauvegarde reste jusqu'à la
  //                prochaine écriture du jeu)
  //   onEffacer    f() facultatif, après effacement (par défaut : onNouvelle)
  //   sansNiveau   true pour un jeu sans niveaux (partie sans fin) : la fenêtre
  //                montre seulement le score (rien s'il est nul)
  // Sans sauvegarde utilisable : rien ne s'affiche, onNouvelle() est appelé
  // tout de suite. Renvoie true si la fenêtre s'affiche.
  function reprise(options) {
    options = options || {};
    var jeu = options.jeu;
    var nouvelle = typeof options.onNouvelle === 'function' ? options.onNouvelle : function () {};
    var continuer = typeof options.onContinuer === 'function' ? options.onContinuer : nouvelle;
    var effacer = typeof options.onEffacer === 'function' ? options.onEffacer : nouvelle;
    var d = lireDonnees(jeu);
    if (!d) { nouvelle(); return false; }
    if (ouverte) ouverte.fermer();

    var precedent = document.activeElement;
    var h = creerHote('jel-sauvegarde', { position: 'fixed', inset: '0', 'z-index': '2147483002', display: 'block', margin: '0', padding: '0' });
    var fond = document.createElement('div');
    fond.className = 'fond';
    var carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'dialog');
    carte.setAttribute('aria-modal', 'true');
    var titre = document.createElement('h2');
    titre.id = 'jel-sauvegarde-titre';
    titre.textContent = texte('titre');
    carte.setAttribute('aria-labelledby', titre.id);
    var detail = document.createElement('p');
    detail.textContent = options.sansNiveau
      ? (d.score ? texte('score', { n: d.score }) : '')
      : texte('niveau', { n: d.niveau }) + (d.score ? ' · ' + texte('score', { n: d.score }) : '');
    if (!detail.textContent) detail.hidden = true;
    var bContinuer = bouton('principal', texte('continuer'));
    var bNouvelle = bouton('', texte('nouvelle'));
    var bEffacer = bouton('discret', texte('effacer'));
    carte.append(titre, detail, bContinuer, bNouvelle, bEffacer);
    fond.appendChild(carte);
    h.ombre.appendChild(fond);
    isoler(h.hote);

    var fenetre = {
      fermer: function () {
        if (h.hote.parentNode) h.hote.parentNode.removeChild(h.hote);
        if (ouverte === fenetre) ouverte = null;
        try { if (precedent && precedent.focus) precedent.focus(); } catch (e) { /* rien */ }
      },
    };
    ouverte = fenetre;
    var choisir = function (f, arg) { return function () { fenetre.fermer(); f(arg); }; };
    bContinuer.addEventListener('click', choisir(continuer, d));
    bNouvelle.addEventListener('click', choisir(nouvelle));
    armerEffacement(bEffacer, jeu, function () { fenetre.fermer(); effacer(); });

    // Clavier : Tab et les flèches restent dans la fenêtre, Entrée et Espace
    // activent le bouton choisi. Échap ne ferme pas : le choix doit être explicite.
    var boutons = [bContinuer, bNouvelle, bEffacer];
    fond.addEventListener('keydown', function (e) {
      if (e.key !== 'Tab' && e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      var actif = h.ombre.activeElement || document.activeElement;
      var i = boutons.indexOf(actif);
      var recul = e.key === 'ArrowUp' || (e.key === 'Tab' && e.shiftKey);
      boutons[(i + (recul ? boutons.length - 1 : 1)) % boutons.length].focus();
    });

    (document.body || document.documentElement).appendChild(h.hote);
    try { bContinuer.focus(); } catch (e) { /* rien */ }
    return true;
  }

  // Bouton « Effacer la sauvegarde » seul (écran titre, menu pause…). options :
  //   jeu, conteneur (élément où le placer), apres f() facultatif.
  // Caché tant qu'il n'y a pas de sauvegarde ; appeler .maj() pour le rafraîchir.
  // Renvoie l'élément ajouté (avec sa méthode maj).
  function boutonEffacer(options) {
    options = options || {};
    var h = creerHote('jel-sauvegarde-effacer', { display: 'inline-block', margin: '0', padding: '0', 'vertical-align': 'middle' });
    var b = bouton('seul', texte('effacer'));
    h.ombre.appendChild(b);
    isoler(h.hote);
    h.hote.maj = function () {
      b.classList.remove('armer');
      b.textContent = texte('effacer');
      h.hote.style.setProperty('display', existe(options.jeu) ? 'inline-block' : 'none', 'important');
    };
    armerEffacement(b, options.jeu, function () {
      h.hote.maj();
      if (typeof options.apres === 'function') options.apres();
    });
    h.hote.maj();
    if (options.conteneur) options.conteneur.appendChild(h.hote);
    return h.hote;
  }

  window.JEL_SAVE = {
    VERSION: SAUVEGARDE_VERSION,
    save: save,
    load: load,
    clear: clear,
    existe: existe,
    surFermeture: surFermeture,
    reprise: reprise,
    boutonEffacer: boutonEffacer,
    texte: texte,
  };
})();
</script>

(function (racine) {

  // pts : points de l'engin [x, y, rayon] autour du point de départ ; pose : position du pantin ;

  /* ---------- Géométrie ---------- */
  function boite(pts) {
    let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
    for (const p of pts) { a = Math.min(a, p[0]); b = Math.min(b, p[1]); c = Math.max(c, p[0]); d = Math.max(d, p[1]); }
    return [a, b, c, d];
  }
  function dedans(x, y, P) {
    let c = false;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const xi = P[i][0], yi = P[i][1], xj = P[j][0], yj = P[j][1];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }

  /* ---------- Création du monde ---------- */
  function creerMonde(n, opt) {
    opt = opt || {};
    const N = NIVEAUX[n], d = N.f();
    const M = {
      n, N, d, t: 0, tVol: 0, etat: 'vise', p: [], liens: [], mini: [], att: [], vehLiens: [], ev: [],
      solides: [], ronds: [], ventilos: d.ventilos || [], eaux: d.eaux || [], benne: d.benne || null,
      brut: 0, mult: 1, cracs: 0, cdCrac: 0, calme: 0, tEau: 0, plouf: false, vitres: 0, cloches: 0,
      engin: opt.engin && ENGINS[opt.engin] ? opt.engin : null, attache: false, poussee: 0, dirPoussee: [1, 0],
      depart: d.depart, bornes: d.bornes, resultat: null, vitesse: 0,
    };
    // Défis déjà réussis pendant les lancers précédents du niveau : vitres restées cassées, eau, benne.
    M.acquis = opt.acquis || {};
    let iv = 0;
    for (const s of d.solides) {
      s.bb = boite(s.pts); s.vivant = true; s.ox = 0; s.oy = 0; s.vx = 0; s.vy = 0; s.cd = 0;
      if (s.type === 'vitre') { s.iv = iv++; if (opt.vitres && opt.vitres.indexOf(s.iv) >= 0) { s.vivant = false; M.vitres++; } }
      M.solides.push(s);
    }
    M.vitres0 = M.vitres;
    for (const r of d.ronds || []) { r.vivant = true; r.balance = 0; r.vx = 0; r.vy = 0; r.cd = 0; if (r.type === 'pendule') placerPendule(r, 0); M.ronds.push(r); }
    M.bornes = [M.bornes[0], Math.min(M.bornes[1], -4000), M.bornes[2], M.bornes[3]];
    // Les cloches déjà sonnées pendant les lancers précédents du niveau restent sonnées.
    let ic = 0;
    for (const o of M.ronds) if (o.type === 'cloche') { o.ic = ic; if (opt.cloches && opt.cloches.indexOf(ic) >= 0) { o.sonnee = true; M.cloches++; } ic++; }
    M.nCloches = ic; M.cloches0 = M.cloches;
    placer(M);
    return M;
  }

  function particule(x, y, r, part, veh) { return { x, y, ox: x, oy: y, r, part, veh, im: veh ? 0.4 : 1, cd: 0, eau: false }; }

  // Place le pantin (et son engin) au départ
  function placer(M) {
    const [sx, sy] = M.depart;
    const E = M.engin ? ENGINS[M.engin] : null;
    const pose = E ? E.pose : POSE;
    M.p = pose.map((q, i) => particule(sx + q[0], sy + q[1], RAYONS[i], PARTS[i], false));
    M.liens = OS.map(([a, b]) => [a, b, dist(M.p[a], M.p[b])]);
    M.mini = MINI.map(([a, b, l]) => [a, b, Math.min(l, dist(M.p[a], M.p[b]))]);
    M.nPantin = M.p.length;
    M.vehLiens = []; M.att = [];
    if (E) {
      const base = M.p.length;
      E.pts.forEach((q) => M.p.push(particule(sx + q[0], sy + q[1], q[2], 'engin', true)));
      for (let i = base; i < M.p.length; i++) for (let j = i + 1; j < M.p.length; j++) M.vehLiens.push([i, j, dist(M.p[i], M.p[j])]);
      M.att = E.att.map(([a, b]) => [a, base + b, dist(M.p[a], M.p[base + b])]);
      M.attache = true;
    }
    M.pose = M.p.map((q) => [q.x - sx, q.y - sy]);
  }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function placerPendule(r, t) {
    const th = r.A * Math.sin(r.w * t + r.ph), dth = r.A * r.w * Math.cos(r.w * t + r.ph);
    r.ang = th;
    r.x = r.px + r.L * Math.sin(th); r.y = r.py + r.L * Math.cos(th);
    r.vx = r.L * Math.cos(th) * dth; r.vy = -r.L * Math.sin(th) * dth;
  }

  /* ---------- Lancer ---------- */
  // angle en radians (0 = vers la droite, positif vers le haut), puissance de 0 à 1
  function vitesseLancer(M, puissance) { const E = M.engin ? ENGINS[M.engin] : null; return (480 + 1420 * puissance) * (E ? E.facteur : 1); }
  function lancer(M, angle, puissance) {
    if (M.etat !== 'vise') return;
    const v = vitesseLancer(M, puissance);
    const vx = Math.cos(angle) * v, vy = -Math.sin(angle) * v;
    const c = M.p[2];
    const om = M.engin ? 0 : 5 * (vx >= 0 ? 1 : -1) * (0.5 + puissance);
    for (const q of M.p) {
      const dx = q.x - c.x, dy = q.y - c.y;
      const ux = vx - om * dy, uy = vy + om * dx;
      q.ox = q.x - ux * H; q.oy = q.y - uy * H;
    }
    if (M.engin && ENGINS[M.engin].poussee) M.poussee = ENGINS[M.engin].duree;
    M.etat = 'vol'; M.tVol = 0;
    M.ev.push({ t: 'lancer', x: c.x, y: c.y, v });
  }

  // Trajectoire prévue (pointillés) depuis le bassin
  function prevision(M, angle, puissance, n) {
    const v = vitesseLancer(M, puissance), c = M.p[2], out = [];
    for (let i = 1; i <= (n || 12); i++) { const t = i * 0.055; out.push([c.x + Math.cos(angle) * v * t, c.y - Math.sin(angle) * v * t + 0.5 * GRAV * t * t]); }
    return out;
  }

  /* ---------- Points ---------- */
  function choc(M, q, vit, x, y) {
    if (q.veh) {
      if (M.attache && vit > ENGINS[M.engin].ejecte && M.poussee <= 0) ejecter(M, x, y);
      return;
    }
    if (M.attache && vit > ENGINS[M.engin].ejecte * 1.25 && M.poussee <= 0) ejecter(M, x, y);
    if (vit < SEUIL_CHOC || q.cd > 0) return;
    const pts = Math.round((vit / 100) * (vit / 100) * 4 * COEF[q.part]);
    M.brut += pts; q.cd = 0.12;
    M.ev.push({ t: 'choc', x, y, pts, part: q.part, vit });
    if (vit > SEUIL_CRAC && M.cdCrac <= 0) {
      M.mult = Math.min(MULT_MAX, Math.round((M.mult + MULT_PAS) * 10) / 10); M.cracs++; M.cdCrac = 0.22;
      M.ev.push({ t: 'crac', x, y, mult: M.mult, vit });
    }
  }
  function bonus(M, pts, t, x, y) { M.brut += pts; M.ev.push({ t, x, y, pts }); }
  function ejecter(M, x, y) {
    if (!M.attache) return;
    M.attache = false; M.att = []; M.poussee = 0;
    bonus(M, 250, 'ejecte', x, y);
  }
  function casser(M, s, x, y) {
    s.vivant = false;
    const [a, b, c, d] = s.bb;
    if (s.type === 'vitre') { M.vitres++; bonus(M, 400, 'vitre', (a + c) / 2 + s.ox, (b + d) / 2); }
    else bonus(M, 150, 'casse', (a + c) / 2 + s.ox, (b + d) / 2);
    M.ev.push({ t: 'debris', mat: s.mat, bb: s.bb, x, y });
  }
  function exploser(M, r) {
    if (!r.vivant) return;
    r.vivant = false;
    bonus(M, 300, 'boum', r.x, r.y);
    const R = 190;
    for (const q of M.p) {
      const dx = q.x - r.x, dy = q.y - r.y, d = Math.hypot(dx, dy) || 1;
      if (d > R) continue;
      const k = (1 - d / R) * 1600 + 350;
      q.ox -= (dx / d * k) * H; q.oy -= (dy / d * k - 450) * H;
    }
    for (const o of M.ronds) if (o.vivant && o.type === 'baril' && o.chaine === undefined && Math.hypot(o.x - r.x, o.y - r.y) < R) o.chaine = 0.12;
    if (M.attache) ejecter(M, r.x, r.y);
  }

  /* ---------- Collisions ---------- */
  function collSolide(M, q, s) {
    const px = q.x - s.ox, py = q.y - s.oy, a = s.bb, r = q.r;
    if (px < a[0] - r || px > a[2] + r || py < a[1] - r || py > a[3] + r) return;
    const P = s.pts;
    let best = Infinity, cx = 0, cy = 0;
    for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
      const x1 = P[j][0], y1 = P[j][1], ex = P[i][0] - x1, ey = P[i][1] - y1;
      const l2 = ex * ex + ey * ey;
      let u = l2 ? ((px - x1) * ex + (py - y1) * ey) / l2 : 0;
      u = u < 0 ? 0 : u > 1 ? 1 : u;
      const kx = x1 + ex * u, ky = y1 + ey * u, dd = (px - kx) * (px - kx) + (py - ky) * (py - ky);
      if (dd < best) { best = dd; cx = kx; cy = ky; }
    }
    const inside = dedans(px, py, P);
    if (!inside && best >= r * r) return;
    let nx, ny;
    if (inside) { nx = cx - px; ny = cy - py; } else { nx = px - cx; ny = py - cy; }
    const l = Math.hypot(nx, ny);
    if (l < 1e-6) { nx = 0; ny = -1; } else { nx /= l; ny /= l; }
    const mvx = s.vx * H, mvy = s.vy * H;
    const vx = q.x - q.ox - mvx, vy = q.y - q.oy - mvy;
    const vn = vx * nx + vy * ny;
    const vit = -vn / H;
    if (vn < 0 && (s.type === 'vitre' || s.type === 'casse')) {
      const seuil = s.type === 'vitre' ? 280 : 110;
      if (vit > seuil) {
        casser(M, s, q.x, q.y);
        q.ox = q.x - vx * 0.75 - mvx; q.oy = q.y - vy * 0.75 - mvy;
        if (!q.veh) choc(M, q, vit * 0.7, q.x, q.y);
        return;
      }
    }
    const nxp = cx + s.ox + nx * r, nyp = cy + s.oy + ny * r;
    if (vn < 0) {
      q.x = nxp; q.y = nyp;
      const E = q.veh ? ENGINS[M.engin] : null;
      let e = E ? E.rebond : REBOND;
      const f = E ? E.frot : FROT;
      if (s.type === 'trampo') {
        e = Math.max(1, 1050 * H / -vn);
        if (s.cd <= 0) { s.cd = 0.35; bonus(M, 40, 'boing', q.x, q.y); }
      }
      let tx = vx - vn * nx, ty = vy - vn * ny;
      tx *= 1 - f; ty *= 1 - f;
      const ux = tx - vn * e * nx, uy = ty - vn * e * ny;
      q.ox = q.x - ux - mvx; q.oy = q.y - uy - mvy;
      if (vit > 60) choc(M, q, vit, q.x, q.y);
    } else {
      const dx = nxp - q.x, dy = nyp - q.y;
      q.x = nxp; q.y = nyp; q.ox += dx; q.oy += dy;
    }
  }

  function collRond(M, q, o) {
    const dx = q.x - o.x, dy = q.y - o.y, R = o.r + q.r;
    const d2 = dx * dx + dy * dy;
    if (d2 >= R * R) return;
    const d = Math.sqrt(d2) || 1, nx = dx / d, ny = dy / d;
    if (o.type === 'baril') { exploser(M, o); return; }
    const mvx = o.vx * H, mvy = o.vy * H;
    const vx = q.x - q.ox - mvx, vy = q.y - q.oy - mvy;
    const vn = vx * nx + vy * ny, vit = -vn / H;
    q.x = o.x + nx * R; q.y = o.y + ny * R;
    if (vn < 0) {
      let e = 0.35;

const SVG_OK = '<svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.15em"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#4fd17a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

/* ---------- Garage ---------- */
let ongletGarage = 'engins';
function montrerGarage() { G.phase = 'garage'; majGarage(); montrer('eGarage'); }
function majGarage() {
  $('gPieces').textContent = t('pieces', { n: P.pieces });
  document.querySelectorAll('[data-onglet]').forEach((b) => b.classList.toggle('actif', b.dataset.onglet === ongletGarage));
  const liste = $('gListe'); liste.textContent = '';
  const cle = TYPE_CLE[ongletGarage];
  for (const o of BOUTIQUE[ongletGarage]) {
    const ligne = el('div', 'objet');
    const c = document.createElement('canvas'); c.width = 152; c.height = 152;
    ligne.appendChild(c);
    const txt = el('div');
    txt.appendChild(el('div', 'nom', t(cle + '.' + o.id)));
    txt.appendChild(el('div', 'des', t(cle + 'Des.' + o.id)));
    ligne.appendChild(txt);
    const b = el('button', 'act');
    const possede = !!P.possede[ongletGarage][o.id];
    if (possede) {
      const choisi = P.choix[cle] === o.id;
      b.textContent = t(choisi ? 'garage.choisi' : 'garage.choisir');
      if (choisi) { b.classList.add('choisi'); b.disabled = true; }
      b.addEventListener('click', () => { audio(); son('clic'); P.choix[cle] = o.id; ecrireReglages(); majGarage(); });
    } else if (o.offert) {
      b.textContent = t('garage.offert', { n: o.offert }); b.disabled = true;
    } else if (o.des && P.atteint < o.des) {
      b.textContent = t('garage.des', { n: o.des }); b.disabled = true;
    } else {
      b.textContent = t('garage.acheter', { n: nb(o.prix) });
      if (P.pieces < o.prix) b.disabled = true;
      b.addEventListener('click', () => {
        if (P.pieces < o.prix) return;
        audio(); P.pieces -= o.prix; P.possede[ongletGarage][o.id] = true; P.choix[cle] = o.id;
        son('pieces'); ecrireReglages(); majGarage(); majPieces();
      });
    }
    ligne.appendChild(b);
    liste.appendChild(ligne);
    dessinerVignette(c, ongletGarage, o.id);
  }
}

// Petite image d'un objet du garage
function dessinerVignette(c, type, id) {
  const x = c.getContext('2d'), w = c.width, h = c.height;
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#3b2a5a'); g.addColorStop(1, '#f07a4a');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(0,0,0,0.35)'; x.fillRect(0, h * 0.8, w, h * 0.2);
  const costume = type === 'costumes' ? id : P.choix.costume;
  x.save();
  if (type === 'engins' && id !== 'aucun') {
    const E = CM.ENGINS[id];
    x.translate(w / 2, h * 0.8); x.scale(1.25, 1.25);
    const pts = E.pose.map((q) => ({ x: q[0], y: q[1] })).concat(E.pts.map((q) => ({ x: q[0], y: q[1] })));
    const faux = { engin: id, nPantin: 11, p: pts, poussee: id === 'fusee' ? 1 : 0, t: 0 };
    dessinerEngin(x, faux, true);
    dessinerPantin(x, pts, costume, 0);
    dessinerEngin(x, faux, false);
  } else if (type === 'ralentis') {
    x.translate(w / 2, h * 0.62); x.scale(1.2, 1.2); x.rotate(-0.6);
    const pose = [[10, -66], [4, -52], [-4, -28], [-14, -58], [-22, -72], [16, -44], [30, -40], [-18, -20], [-28, -6], [8, -12], [20, 0]];
    const pts = pose.map((q) => ({ x: q[0], y: q[1] + 30 }));
    if (id === 'chocs') { x.globalAlpha = 0.25; for (let i = 3; i > 0; i--) { x.save(); x.translate(-i * 9, i * 3); dessinerPantin(x, pts, costume, 0); x.restore(); } x.globalAlpha = 1; }
    dessinerPantin(x, pts, costume, id !== 'aucun' ? 1 : 0);
    x.restore(); x.save();
    if (id === 'cinema') { x.fillStyle = '#000'; x.fillRect(0, 0, w, h * 0.16); x.fillRect(0, h * 0.84, w, h * 0.16); }
    if (id === 'retro') { x.globalCompositeOperation = 'color'; x.fillStyle = '#9b6a2f'; x.fillRect(0, 0, w, h); }
  } else {
    x.translate(w / 2, h * 0.82); x.scale(1.5, 1.5);
    dessinerPantin(x, CM.POSE.map((q) => ({ x: q[0], y: q[1] })), costume, 0);
  }
  x.restore();
}

/* ---------- Démarrage d'un niveau ---------- */
function enginsPossedes() { return BOUTIQUE.engins.filter((o) => P.possede.engins[o.id]).map((o) => o.id); }
function nouveauMonde() {
  const e = P.choix.engin === 'aucun' ? null : P.choix.engin;
  G.M = CM.creerMonde(G.n, { engin: e, acquis: G.acquis, vitres: G.vitres, cloches: G.cloches });
  G.acc = 0; G.scoreAff = 0; G.zoomFin = 1; G.ralenti = 0; G.camSnap = true; G.etourdi = 0;
  G.fx.length = 0; G.txt.length = 0;
  $('scene').style.filter = '';
}
function demarrerNiveau(n) {
  G.demo = null;
  G.n = n; G.essais = 3; G.meilleur = 0; G.acquis = {}; G.vitres = []; G.cloches = []; G.attenteFin = 0;
  const N = NIVEAUX[n];
  G.cadeau = null;
  if (N.engin && !P.possede.engins[N.engin]) { P.possede.engins[N.engin] = true; P.choix.engin = N.engin; G.cadeau = N.engin; }
  if (!P.possede.engins[P.choix.engin]) P.choix.engin = 'aucun';
  nouveauMonde();
  $('grosScore').classList.remove('visible');
  G.phase = 'intro'; hud(true); majHud();
  remplirIntro();
  montrer('eIntro');
}
function remplirIntro() {
  const N = NIVEAUX[G.n];
  $('iTitre').textContent = t('niveauDecor', { n: G.n + 1, decor: t('decor.' + N.decor) });
  const nouv = N.nouveau && (!P.vus[N.nouveau] || G.n === 0);
  $('iNouveau').style.display = nouv ? '' : 'none';
  G.tuto = { cle: nouv ? N.nouveau : null, t: 0 };
  if (nouv) {
    $('iNouveauTitre').textContent = t('nouveau.' + N.nouveau + '.titre');
    $('iNouveauTexte').textContent = t('nouveau.' + N.nouveau + '.texte');
    $('iEtapes').style.display = N.nouveau === 'lancer' ? '' : 'none';
  }
  $('iCadeau').textContent = G.cadeau ? t('cadeau', { nom: t('engin.' + G.cadeau) }) : '';
  $('iObjectif').textContent = t('objectif', { n: nb(N.obj[0]) });
  const ul = $('iDefis'); ul.textContent = '';
  for (const d of N.defis || []) ul.appendChild(el('li', '', t('defi.' + d.type, { n: d.n || 0 })));
  if (!(N.defis || []).length) ul.appendChild(el('li', '', t('defi.aucun')));
}
function commencer() {
  if (G.phase !== 'intro') return;
  audio(); son('clic');
  const N = NIVEAUX[G.n];
  if (N.nouveau) P.vus[N.nouveau] = true;
  G.phase = 'vise'; montrer(null); majHud();
}

/* ---------- HUD ---------- */
let objectifAffiche = '';
function majHud() {
  if (!G.M) return;
  const N = NIVEAUX[G.n];
  $('hNiveau').textContent = t('niveauDecor', { n: G.n + 1, decor: t('decor.' + N.decor) });
  const restants = G.essais - (G.phase === 'vol' ? 1 : 0);
  const e = $('hEssais'); e.textContent = '';
  for (let i = 0; i < 3; i++) { const k = el('i'); if (i >= restants) k.className = 'use'; e.appendChild(k); }
  e.setAttribute('role', 'img'); e.setAttribute('aria-label', t('essaisAria', { n: restants }));
  objectifAffiche = ''; majObjectif();
  const vise = G.phase === 'vise';
  $('bEngin').style.display = vise && enginsPossedes().length > 1 ? '' : 'none';
  $('bEngin').textContent = t('enginBouton', { nom: t('engin.' + P.choix.engin) });
  $('hAide').style.display = vise ? '' : 'none';
  $('hAide').textContent = t('aide.vise');
  $('hScore').classList.toggle('visible', G.phase === 'vol');
  $('hMult').textContent = t('fx.mult', { m: nb(G.M.mult) });
}
function majObjectif() {
  const N = NIVEAUX[G.n];
  const etats = CM.etatDefis(G.M);
  const cle = JSON.stringify(etats.map((d) => [d.ok, d.a])) + G.n + (window.JEL_I18N.langue ? window.JEL_I18N.langue() : '');
  if (cle === objectifAffiche) return;
  objectifAffiche = cle;
  const o = $('hObjectif'); o.textContent = '';
  o.appendChild(el('span', '', t('objectif', { n: nb(N.obj[0]) })));
  for (const d of etats) {
    o.appendChild(document.createTextNode(' · '));
    const s = el('span', d.ok ? 'ok' : '');
    s.innerHTML = d.ok ? SVG_OK + ' ' : '';
    s.appendChild(document.createTextNode(t('hud.' + d.type, { a: d.a, b: d.b })));
    o.appendChild(s);
  }
}
function majHudDirect(dt) {
  const M = G.M; if (!M) return;
  const cible = Math.round(M.brut * M.mult);
  G.scoreAff += (cible - G.scoreAff) * Math.min(1, dt * 9);
  if (Math.abs(cible - G.scoreAff) < 1) G.scoreAff = cible;
  $('hPts').textContent = nb(Math.round(G.scoreAff));
  majObjectif();
}
function popMult() {
  const m = $('hMult'); m.textContent = t('fx.mult', { m: nb(G.M.mult) });
  m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop');
}
function changerEngin() {
  if (G.phase !== 'vise') return;
  const liste = enginsPossedes(); if (liste.length < 2) return;
  P.choix.engin = liste[(liste.indexOf(P.choix.engin) + 1) % liste.length];
  audio(); son('clic'); nouveauMonde(); majHud();
}

/* ---------- Visée et lancer ---------- */
const cv = $('scene'), cx = cv.getContext('2d');
let W = 0, HT = 0, DPR = 1;
function redim() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; HT = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(HT * DPR);
  G.camSnap = true;
  if (window.JEL_AFFICHE) dessinerAffiche();
}
function viser(d) {
  const dx = d.x0 - d.x, dy = d.y0 - d.y, len = Math.hypot(dx, dy);
  if (len < 12) return false;
  G.vise.a = clamp(Math.atan2(-dy, dx), -0.9, 1.5);
  G.vise.p = clamp(len / (Math.min(W, HT) * 0.42), 0.05, 1);
  return true;
}
function tirer() {
  if (G.phase !== 'vise' || !G.M) return;
  audio();
  CM.lancer(G.M, G.vise.a, G.vise.p);
  G.phase = 'vol';
  if (P.choix.ralenti === 'retro') $('scene').style.filter = 'sepia(0.85) contrast(1.12) brightness(1.04)';
  if (G.M.engin === 'fusee') son('fusee');
  majHud();
}
cv.addEventListener('pointerdown', (e) => {
  audio();
  if (G.phase !== 'vise' || G.fige) return;
  G.vise.drag = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, id: e.pointerId, ok: false };
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* rien */ }
});
cv.addEventListener('pointermove', (e) => {
  const d = G.vise.drag; if (!d || d.id !== e.pointerId) return;
  d.x = e.clientX; d.y = e.clientY; d.ok = viser(d) || d.ok;
});
function finGlisser(e) {
  const d = G.vise.drag; if (!d || d.id !== e.pointerId) return;
  d.x = e.clientX; d.y = e.clientY;
  const ok = viser(d);
  G.vise.drag = null;
  if (ok && G.vise.p > 0.08 && e.type === 'pointerup') tirer();
}
cv.addEventListener('pointerup', finGlisser);
cv.addEventListener('pointercancel', finGlisser);

document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' || e.code === 'KeyP') {
    if (G.phase === 'vise' || G.phase === 'vol') { mettrePause(); e.preventDefault(); }
    else if (G.phase === 'pause') { reprendre(); e.preventDefault(); }
    return;
  }
  if (G.phase !== 'vise' || G.fige) return;
  const pas = 3 * Math.PI / 180;
  let pris = true;
  switch (e.code) {
    case 'ArrowUp': case 'KeyW': G.vise.a = clamp(G.vise.a + pas, -0.9, 1.5); break;
    case 'ArrowDown': case 'KeyS': G.vise.a = clamp(G.vise.a - pas, -0.9, 1.5); break;
    case 'ArrowRight': case 'KeyD': G.vise.p = clamp(G.vise.p + 0.04, 0.05, 1); break;
    case 'ArrowLeft': case 'KeyA': G.vise.p = clamp(G.vise.p - 0.04, 0.05, 1); break;
    case 'Space': case 'Enter': case 'NumpadEnter': tirer(); break;
    case 'KeyE': changerEngin(); break;
    default: pris = false;
  }
  if (pris) { e.preventDefault(); audio(); }
});

/* ---------- Pause ---------- */
function mettrePause() {
  if (G.phase !== 'vise' && G.phase !== 'vol') return;
  G.avant = G.phase; G.phase = 'pause'; G.vise.drag = null;
  montrer('ePause');
  if (SON.ctx && SON.ctx.suspend) SON.ctx.suspend().catch(() => {});
}
function reprendre() {
  if (G.phase !== 'pause') return;
  G.phase = G.avant || 'vise'; montrer(null); dernier = 0;
  if (SON.ctx && SON.ctx.resume) SON.ctx.resume().catch(() => {});
  son('clic');
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') mettrePause(); });

/* ---------- Événements du monde : effets et sons ---------- */
const COUL_PART = { tete: '#ff6b6b', tronc: '#ffd23f', bras: '#ffffff', jambe: '#9fe7ff' };
const COUL_MAT = { pot: '#c0643a', carton: '#c89b5c', cone: '#ff7a1a', vitre: '#bfeaff', decor: '#e8c07f' };
function texte(x, y, txt, col, taille, gros) { G.txt.push({ x, y, txt, col, taille, gros: !!gros, t: 0, vie: gros ? 1.3 : 1.05 }); if (G.txt.length > 40) G.txt.shift(); }
function particules(x, y, n, opts) {
  for (let i = 0; i < n; i++) {
    const a = (opts.angle !== undefined ? opts.angle : -Math.PI / 2) + (Math.random() - 0.5) * (opts.ecart || Math.PI * 2);
    const v = (opts.v || 200) * (0.4 + Math.random() * 0.8);
    G.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, vie: (opts.vie || 0.8) * (0.6 + Math.random() * 0.6), col: opts.col || '#fff', taille: (opts.taille || 4) * (0.6 + Math.random() * 0.8), type: opts.type || 'rond', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, g: opts.g === undefined ? 900 : opts.g });
  }
  if (G.fx.length > 500) G.fx.splice(0, G.fx.length - 500);
}
function declencherRalenti(kind) {
  const r = P.choix.ralenti;
  if (r === 'chocs' && kind === 'crac') { G.ralenti = 0.45; G.ralentiK = 0.3; }
  else if (r === 'cinema') { G.ralenti = 0.7; G.ralentiK = 0.22; }
  else if (r === 'retro' && kind !== 'casse') { G.ralenti = 0.5; G.ralentiK = 0.35; }
}
function traiterEv(M, muet) {
  const jouer = (nom, x) => { if (!muet) son(nom, x); };
  for (const e of M.ev) {
    switch (e.t) {
      case 'lancer': jouer('lancer'); particules(M.depart[0], M.depart[1], 10, { col: 'rgba(230,220,200,0.8)', v: 160, vie: 0.6, taille: 6, type: 'fumee', g: -40 }); break;
      case 'choc': {
        // les chocs rapprochés s'additionnent dans un même nombre (lisible)
        const proche = G.txt.find((x) => x.val !== undefined && x.t < 0.3 && Math.abs(x.x - e.x) < 70 && Math.abs(x.y - e.y) < 70);
        if (proche) { proche.val += e.pts; proche.txt = t('fx.plus', { n: nb(proche.val) }); proche.taille = 15 + Math.min(18, proche.val / 45); proche.t = Math.min(proche.t, 0.1); }
        else if (e.pts >= 12) { texte(e.x, e.y - 40, t('fx.plus', { n: nb(e.pts) }), COUL_PART[e.part], 15 + Math.min(18, e.pts / 45)); G.txt[G.txt.length - 1].val = e.pts; }
      }
        if (e.part === 'tete' && e.pts > 240 && !G.txt.some((x) => x.tete && x.t < 0.6)) { texte(e.x - 10, e.y - 150, t('fx.tete'), '#ff6b6b', 19, true); G.txt[G.txt.length - 1].tete = true; }
        jouer('choc', e.vit);
        particules(e.x, e.y, Math.min(9, Math.round(e.vit / 140)), { col: 'rgba(235,225,205,0.85)', v: e.vit * 0.25, vie: 0.5, taille: 4, type: 'fumee', g: 200 });
        if (e.vit > 600) G.secousse = Math.max(G.secousse, Math.min(9, e.vit / 160));
        break;
      case 'crac':
        texte(e.x, e.y - 78, t('fx.crac'), '#ffd23f', 30, true);
        texte(e.x + 30, e.y - 112, t('fx.mult', { m: nb(e.mult) }), '#ff7a1a', 22, true);
        particules(e.x, e.y, 3, { col: '#fff7e0', v: 280, vie: 0.9, taille: 7, type: 'os', g: 700 });
        particules(e.x, e.y, 10, { col: '#ffd23f', v: 360, vie: 0.45, taille: 3, type: 'etincelle', g: 0 });
        jouer('crac'); G.secousse = 12; G.etourdi = 1.6;
        if (M === G.M) { declencherRalenti('crac'); popMult(); }
        break;
      case 'boing': texte(e.x, e.y - 20, t('fx.plus', { n: nb(e.pts) }), '#9fe7ff', 16); jouer('boing'); break;
      case 'bumper': texte(e.x, e.y - 20, t('fx.plus', { n: nb(e.pts) }), '#ff9ad5', 16); jouer('bumper'); particules(e.x, e.y, 8, { col: '#ff9ad5', v: 260, vie: 0.4, taille: 3, type: 'etincelle', g: 0 }); break;
      case 'cloche': texte(e.x, e.y - 34, t('fx.cloche'), '#ffd23f', 24, true); jouer('cloche'); particules(e.x, e.y, 14, { col: '#ffe680', v: 260, vie: 0.7, taille: 4, type: 'etincelle', g: 0 }); break;
      case 'ding': jouer('ding'); break;
      case 'vitre':
        texte(e.x, e.y - 40, t('fx.vitre'), '#bfeaff', 26, true); jouer('vitre');
        if (M === G.M) declencherRalenti('vitre');
        break;
      case 'casse': texte(e.x, e.y - 24, t('fx.plus', { n: nb(e.pts) }), '#ffb36b', 17); jouer('casse'); break;
      case 'debris': {
        const [a, b, c, d] = e.bb, cx0 = (a + c) / 2, cy0 = (b + d) / 2;
        if (e.mat === 'vitre') particules(cx0, cy0, 26, { col: 'rgba(200,240,255,0.9)', v: 420, vie: 1.3, taille: 9, type: 'eclat', ecart: Math.PI * 2 });
        else particules(cx0, cy0, 14, { col: COUL_MAT[e.mat] || '#c89b5c', v: 300, vie: 1.2, taille: 7, type: 'eclat' });
        break;
      }
      case 'boum':
        texte(e.x, e.y - 50, t('fx.boum'), '#ff7a1a', 34, true); jouer('boum');

/* ---------- Boucle ---------- */

function avancer(M, dt) {

      c.fillStyle = touche ? '#ffe066' : '#d49a1e'; c.beginPath(); c.moveTo(X(fx) - 6, h * fy - 8); c.lineTo(X(fx) + 6, h * fy - 8); c.lineTo(X(fx) + 13, h * fy + 10); c.lineTo(X(fx) - 13, h * fy + 10); c.closePath(); c.fill();
      if (touche) etincelle(c, X(fx), h * fy + 2, 14, 'rgba(255,240,150,0.7)');
    });
    fig(c, q.x, q.y, T * 14, k);
  } else if (cle === 'engin') {
    const choc = X(0.68);
    c.fillStyle = '#7c8089'; c.fillRect(choc, sol - 30, 18, 30);
    let cxp = T < 0.4 ? X(0.08) + (choc - 32 - X(0.08)) * T / 0.4 : choc - 32;
    c.strokeStyle = '#c9d1da'; c.lineWidth = 2.5; c.strokeRect(cxp - 22, sol - 34, 44, 22);
    c.fillStyle = '#1b1b1f'; c.beginPath(); c.arc(cxp - 16, sol - 6, 5, 0, 7); c.arc(cxp + 16, sol - 6, 5, 0, 7); c.fill();
    if (T < 0.4) fig(c, cxp, sol - 48 * k, 0, k);
    else { const q = arc((T - 0.4) / 0.6, cxp, sol - 48 * k, X(0.95), sol - 14 * k, h * 0.4); fig(c, q.x, q.y, T * 16, k); }
  } else if (cle === 'benne') {
    c.fillStyle = '#d07a1c'; c.fillRect(X(0.68), sol - 34, 8, 34); c.fillRect(X(0.88), sol - 34, 8, 34);
    c.fillStyle = 'rgba(79,209,122,0.35)'; c.fillRect(X(0.68) + 8, sol - 34, X(0.2) - 8, 34);
    const q = arc(T, X(0.08), sol - h * 0.3, X(0.79), sol - 14 * k, h * 0.45);
    fig(c, q.x, q.y, T * 12, k);
  } else if (cle === 'bumper') {
    const bx = X(0.62), by = sol - h * 0.35;
    [['#e8413c', 1], ['#fff', 0.7], ['#e8413c', 0.45]].forEach(([col, f]) => { c.fillStyle = col; c.beginPath(); c.arc(bx, by, 20 * f * k, 0, 7); c.fill(); });
    const q = T < 0.45 ? arc(T / 0.45 * 0.6, X(0.05), sol - 14 * k, bx - 22, by, h * 0.3) : arc((T - 0.45) / 0.55, bx - 22, by, X(0.08), h * 0.1, -h * 0.1);
    fig(c, q.x, q.y, T * 16, k);
    if (T > 0.43 && T < 0.6) etincelle(c, bx - 18, by, 16, '#ff9ad5');
  } else if (cle === 'eau' || cle === 'piscine') {
    c.fillStyle = cle === 'eau' ? '#615c55' : '#3a3142'; c.fillRect(0, h * 0.3, X(0.3), h);
    c.fillStyle = cle === 'eau' ? 'rgba(50,140,210,0.85)' : 'rgba(80,210,235,0.85)'; c.fillRect(X(0.4), sol - 8, X(0.6), h);
    const q = arc(Math.min(1, T * 1.3), X(0.2), h * 0.3 - 14 * k, X(0.7), sol + 4, h * 0.25);
    fig(c, q.x, q.y, T * 10, k);
    if (T > 0.72) for (let i = 0; i < 9; i++) { const u = (T - 0.72) / 0.28; c.fillStyle = '#bfe9ff'; c.beginPath(); c.arc(X(0.7) + (i - 4) * 8 * u, sol - 8 - Math.sin((i + 1) / 10 * Math.PI) * 50 * u + u * u * 30, 3, 0, 7); c.fill(); }
  } else if (cle === 'fusee') {
    const q = arc(T, X(0.05), sol - 20, X(1.05), h * 0.15, h * 0.35);
    const q2 = arc(Math.min(1, T + 0.02), X(0.05), sol - 20, X(1.05), h * 0.15, h * 0.35), a = Math.atan2(q2.y - q.y, q2.x - q.x);
    c.save(); c.translate(q.x, q.y); c.rotate(a);
    c.fillStyle = '#ff7a1a'; c.beginPath(); c.moveTo(-26, -6); c.lineTo(-48 - Math.random() * 14, 0); c.lineTo(-26, 6); c.closePath(); c.fill();
    c.fillStyle = '#f4f1ea'; c.fillRect(-26, -8, 44, 16); c.fillStyle = '#e8413c'; c.beginPath(); c.moveTo(18, -8); c.lineTo(32, 0); c.lineTo(18, 8); c.closePath(); c.fill();
    c.restore();
    fig(c, q.x, q.y - 22 * k, a, k * 0.9);
  } else if (cle === 'pendule') {
    const px0 = X(0.45), py0 = 0, Lp = h * 0.62, ang = Math.sin(T * Math.PI * 2) * 0.9;
    const bx = px0 + Math.sin(ang) * Lp, by = py0 + Math.cos(ang) * Lp;
    c.strokeStyle = '#8a8f99'; c.lineWidth = 3; c.beginPath(); c.moveTo(px0, py0); c.lineTo(bx, by); c.stroke();
    c.fillStyle = '#2b2f37'; c.beginPath(); c.arc(bx, by, 18 * k, 0, 7); c.fill();
    const frappe = T > 0.25 && T < 0.75;
    if (!frappe) fig(c, X(0.68), sol - 14 * k, 0, k);
    else { const u = (T - 0.25) / 0.5; const q = arc(u, X(0.68), sol - 14 * k, X(0.98), sol - 14 * k, h * 0.4); fig(c, q.x, q.y, u * 12, k); }
  } else if (cle === 'mobile') {
    c.fillStyle = '#211b27'; c.fillRect(X(0.25), sol, X(0.5), h);
    const mx = X(0.38) + Math.sin(G.tuto.t * 2) * X(0.1);
    c.fillStyle = '#4f5d6e'; c.fillRect(mx - X(0.08), sol - h * 0.35, X(0.16), 8); c.fillStyle = '#a8bbd0'; c.fillRect(mx - X(0.08), sol - h * 0.35, X(0.16), 3);
    const q = arc(T, X(0.05), sol - 14 * k, mx, sol - h * 0.35 - 14 * k, h * 0.35);
    fig(c, q.x, q.y, T < 0.95 ? T * 10 : 0, k);
  }
}

/* ---------- Affiche du jeu (window.JEL_AFFICHE) ---------- */
function dessinerAffiche() {
  const c = cx, w = W, h = HT;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#24195a'); g.addColorStop(0.4, '#8a3768'); g.addColorStop(0.72, '#f0784a'); g.addColorStop(1, '#ffc56b');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // soleil couchant et halo
  const sx = w * 0.72, sy = h * 0.3;
  const gs = c.createRadialGradient(sx, sy, 0, sx, sy, w * 0.75);
  gs.addColorStop(0, 'rgba(255,248,200,1)'); gs.addColorStop(0.12, 'rgba(255,214,120,0.9)'); gs.addColorStop(0.45, 'rgba(255,140,80,0.25)'); gs.addColorStop(1, 'rgba(255,120,80,0)');
  c.fillStyle = gs; c.fillRect(0, 0, w, h);
  // rayons de lumière
  c.save(); c.globalCompositeOperation = 'lighter'; c.fillStyle = 'rgba(255,230,170,0.08)';
  for (let i = 0; i < 9; i++) { const a = i / 9 * Math.PI * 2 + 0.2; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + Math.cos(a) * w * 1.5, sy + Math.sin(a) * w * 1.5); c.lineTo(sx + Math.cos(a + 0.12) * w * 1.5, sy + Math.sin(a + 0.12) * w * 1.5); c.closePath(); c.fill(); }
  c.restore();
  // ville en ombres chinoises
  const ville = (base, larg, hMin, hMax, col, fen, gr) => {
    for (let x = -10, i = 0; x < w + 10; i++) {
      const bw = larg * (0.7 + hash(i * 3 + gr) * 0.5), bh = hMin + hash(i + gr) * (hMax - hMin);
      c.fillStyle = col; c.fillRect(x, base - bh, bw, h);
      c.fillStyle = fen;
      for (let y = base - bh + 10; y < base - 6; y += 15) for (let fx = x + 6; fx < x + bw - 8; fx += 12) if (hash(i * 7 + fx * 0.07 + y * 0.03) > 0.55) c.fillRect(fx, y, 5, 7);
      x += bw + 3;
    }
  };
  ville(h * 0.66, w * 0.11, h * 0.08, h * 0.26, '#5a2f62', 'rgba(255,214,140,0.5)', 3);
  ville(h * 0.8, w * 0.17, h * 0.12, h * 0.36, '#2c1c3d', 'rgba(255,220,150,0.8)', 11);
  // grand escalier au premier plan (descend vers la droite)
  c.fillStyle = '#b7a993';
  const n = 6, x0 = -w * 0.05, y0 = h * 0.6, mw = w * 0.2, mh = h * 0.07;
  c.beginPath(); c.moveTo(x0, y0);
  for (let i = 0; i < n; i++) { c.lineTo(x0 + (i + 1) * mw, y0 + i * mh); c.lineTo(x0 + (i + 1) * mw, y0 + (i + 1) * mh); }
  c.lineTo(w * 1.2, h); c.lineTo(x0, h); c.closePath(); c.fill();
  c.strokeStyle = '#f5e8cc'; c.lineWidth = 6;
  for (let i = 0; i < n; i++) { c.beginPath(); c.moveTo(x0 + i * mw, y0 + i * mh + 3); c.lineTo(x0 + (i + 1) * mw, y0 + i * mh + 3); c.stroke(); }
  c.fillStyle = 'rgba(60,40,50,0.35)';
  for (let i = 0; i < n; i++) c.fillRect(x0 + (i + 1) * mw - 6, y0 + i * mh, 6, mh);
  // poubelle renversée et cône
  c.save(); c.translate(w * 0.84, h * 0.72); c.rotate(0.5);
  c.fillStyle = '#2f6b49'; c.fillRect(-28, -44, 56, 70); c.fillStyle = '#5bb07f'; c.fillRect(-32, -52, 64, 10); c.restore();
  c.fillStyle = '#ff7a1a'; c.beginPath(); c.moveTo(w * 0.12, h * 0.66); c.lineTo(w * 0.155, h * 0.57); c.lineTo(w * 0.19, h * 0.66); c.closePath(); c.fill();
  c.fillStyle = '#fff'; c.fillRect(w * 0.137, h * 0.605, w * 0.036, h * 0.015);
  // halo derrière le héros
  const hx = w * 0.5, hy = h * 0.42;
  const gh = c.createRadialGradient(hx, hy, 0, hx, hy, w * 0.5); gh.addColorStop(0, 'rgba(255,250,220,0.75)'); gh.addColorStop(0.35, 'rgba(255,190,90,0.35)'); gh.addColorStop(1, 'rgba(255,150,60,0)');
  c.fillStyle = gh; c.fillRect(0, 0, w, h);
  // vitre qui vole en éclats
  c.save(); c.translate(w * 0.3, h * 0.42); c.rotate(-0.15);
  c.strokeStyle = 'rgba(70,60,80,0.9)'; c.lineWidth = 8; c.strokeRect(-w * 0.1, -h * 0.17, w * 0.06, h * 0.34);
  c.restore();
  for (let i = 0; i < 26; i++) {
    const a = hash(i * 5.1) * Math.PI * 2, r = w * (0.08 + hash(i * 2.7) * 0.34);
    const px = hx - w * 0.12 + Math.cos(a) * r * 0.9, py = hy + Math.sin(a) * r * 0.6, sz = 8 + hash(i) * 20;
    c.save(); c.translate(px, py); c.rotate(a * 3);
    c.fillStyle = 'rgba(200,240,255,0.75)'; c.strokeStyle = 'rgba(255,255,255,0.95)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(-sz, -sz * 0.4); c.lineTo(sz, 0); c.lineTo(-sz * 0.3, sz * 0.7); c.closePath(); c.fill(); c.stroke();
    c.restore();
  }
  // traînées de vitesse
  c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineCap = 'round';
  for (let i = 0; i < 7; i++) { c.lineWidth = 3 + i % 3; const y = hy - h * 0.12 + i * h * 0.035; c.beginPath(); c.moveTo(hx - w * 0.42 + i * 6, y + 14); c.lineTo(hx - w * 0.18, y); c.stroke(); }
  // le cascadeur, en grand (environ 45 % de la hauteur)
  const pose = [[16, -70], [6, -55], [-8, -30], [-14, -66], [-24, -84], [24, -48], [40, -36], [-26, -24], [-36, -4], [8, -12], [26, -4]];
  const k = h * 0.43 / 90;
  c.save(); c.translate(hx, hy + h * 0.17); c.rotate(-0.38); c.scale(k, k);
  const pts = pose.map((q) => ({ x: q[0], y: q[1] }));
  // contour de lumière
  c.save(); c.shadowColor = 'rgba(255,240,200,0.95)'; c.shadowBlur = 18; dessinerPantin(c, pts, 'rouge', 1); c.restore();
  dessinerPantin(c, pts, 'rouge', 1);
  c.restore();
  // éclats d'impact (étoiles jaunes) et os qui craque
  const impact = (x, y, r) => { etincelle(c, x, y, r, '#ffd23f'); etincelle(c, x, y, r * 0.55, '#ffffff'); };
  impact(w * 0.33, h * 0.2, w * 0.07); impact(w * 0.78, h * 0.47, w * 0.06); impact(w * 0.24, h * 0.56, w * 0.045);
  c.save(); c.translate(w * 0.7, h * 0.2); c.rotate(0.6); c.fillStyle = '#fff7e0'; c.strokeStyle = '#5a4a3a'; c.lineWidth = 2;
  const os = w * 0.05; c.fillRect(-os, -4, os * 2, 8); c.strokeRect(-os, -4, os * 2, 8);
  [-1, 1].forEach((s) => { c.beginPath(); c.arc(s * os, -6, 7, 0, 7); c.fill(); c.stroke(); c.beginPath(); c.arc(s * os, 6, 7, 0, 7); c.fill(); c.stroke(); });
  c.restore();
  // vignette douce
  const gv = c.createRadialGradient(w / 2, h * 0.45, h * 0.3, w / 2, h * 0.45, h * 0.8); gv.addColorStop(0, 'rgba(0,0,0,0)'); gv.addColorStop(1, 'rgba(20,10,30,0.45)');
  c.fillStyle = gv; c.fillRect(0, 0, w, h);
}

/* ---------- Images du jeu (window.JEL_APERCU) ---------- */
function ouvrirApercu(k) {
  G.apercu = k;
  const cacher = () => document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; });
  cacher(); setTimeout(cacher, 300);
  const cfg = [null,
    { n: 0, a: 0.15, p: 0.3, f: 70, vise: 520, cos: 'mannequin' },
    { n: 7, a: 0.5, p: 0.6, f: 80, vise: 760, cos: 'rouge' },
    { n: 16, a: 0.5, p: 0.6, f: 85, vise: 900, cos: 'dore' }][k] || null;
  majSon();
  if (!cfg) return;
  P.choix.costume = cfg.cos; P.choix.engin = 'aucun'; P.choix.ralenti = 'aucun';
  G.n = cfg.n; G.essais = 3; G.acquis = {}; G.vitres = []; G.cloches = cfg.cloches || [];
  // Choisit, parmi quelques lancers, celui qui a le plus cogné à ce moment-là (pantin encore en mouvement)
  let meilleur = null;
  for (let a = -0.2; a <= 1.0; a += 0.2) for (let p = 0.2; p <= 1.0; p += 0.2) {
    const M = CM.creerMonde(G.n, { cloches: G.cloches });
    for (let i = 0; i < 20; i++) CM.etape(M);
    CM.lancer(M, a, p);
    for (let i = 0; i < cfg.f && M.etat === 'vol'; i++) CM.etape(M);
    if (M.etat !== 'vol') continue;
    const note = M.brut * M.mult - Math.abs(M.p[2].x - cfg.vise) * 12;
    if (!meilleur || note > meilleur.note) meilleur = { note, a, p };
  }
  if (meilleur) { cfg.a = meilleur.a; cfg.p = meilleur.p; }
  nouveauMonde(); hud(true);
  for (let i = 0; i < 20; i++) CM.etape(G.M);
  G.phase = 'vise';
  CM.lancer(G.M, cfg.a, cfg.p); G.phase = 'vol';
  for (let i = 0; i < cfg.f && G.M.etat === 'vol'; i++) { CM.etape(G.M); traiterEv(G.M, true); majFx(CM.DT); }
  G.ralenti = 0; G.camSnap = true; G.scoreAff = Math.round(G.M.brut * G.M.mult);
  majHud(); majHudDirect(1);
  G.fige = true;
  requestAnimationFrame(boucle);
}

/* ---------- Boutons ---------- */
function brancher() {
  $('bJouer').addEventListener('click', () => {
    audio(); son('clic');
    JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { chargerProgression(); majSon(); demarrerNiveau(clamp(Math.floor(Number(d && d.niveau) || 1), 1, NIVEAUX.length) - 1); },
      onNouvelle: () => { chargerProgression(); majSon(); demarrerNiveau(0); },
      onEffacer: () => { chargerProgression(); majSon(); montrerTitre(); },
    });
  });
  $('bNiveaux').addEventListener('click', () => { audio(); son('clic'); montrerNiveaux(); });
  $('bGarage').addEventListener('click', () => { audio(); son('clic'); montrerGarage(); });
  $('bRetourN').addEventListener('click', () => { son('clic'); montrerTitre(); });
  $('bRetourG').addEventListener('click', () => { son('clic'); montrerTitre(); });
  document.querySelectorAll('[data-onglet]').forEach((b) => b.addEventListener('click', () => { audio(); son('clic'); ongletGarage = b.dataset.onglet; majGarage(); }));
  $('bGo').addEventListener('click', commencer);
  $('bPause').addEventListener('click', () => { audio(); son('clic'); mettrePause(); });
  $('bReprendre').addEventListener('click', reprendre);
  $('bRecommencer').addEventListener('click', () => { son('clic'); demarrerNiveau(G.n); });
  $('bPauseNiveaux').addEventListener('click', () => { son('clic'); montrerNiveaux(); });
  $('bAccueil').addEventListener('click', () => { son('clic'); montrerTitre(); });
  $('bRelancer').addEventListener('click', relancer);
  $('bEngin').addEventListener('click', changerEngin);
  $('bBilanNiveaux').addEventListener('click', () => { son('clic'); montrerNiveaux(); });
  $('bBilanAccueil').addEventListener('click', () => { son('clic'); montrerTitre(); });
  ['bSon', 'bSonJeu', 'bSonPause'].forEach((id) => $(id).addEventListener('click', basculerSon));
  JEL_SAVE.surFermeture(() => {
    if (G.apercu || !G.M) return;
    if (['intro', 'vise', 'vol', 'pause', 'rate'].indexOf(G.phase) >= 0) ecrire(G.n + 1);
  });
  if (window.JEL_I18N && window.JEL_I18N.surChangement) window.JEL_I18N.surChangement(() => {
    majSon(); majPieces();
    if (G.M) majHud();
    if (G.phase === 'niveaux') montrerNiveaux();
    else if (G.phase === 'garage') majGarage();
    else if (G.phase === 'intro') remplirIntro();
  });
  window.addEventListener('resize', redim);
}

/* ---------- Démarrage ---------- */
function init() {
  redim();
  chargerProgression();
  if (window.JEL_AFFICHE) {
    ECRANS.forEach((e) => $(e).classList.remove('visible'));
    const cacher = () => document.querySelectorAll('.jel-langue').forEach((e) => { e.style.display = 'none'; });
    cacher(); setTimeout(cacher, 300);
    dessinerAffiche();
    return;
  }
  if (window.JEL_APERCU) { ouvrirApercu(Number(window.JEL_APERCU)); return; }
  brancher();
  majSon();
  montrerTitre();
  requestAnimationFrame(boucle);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
