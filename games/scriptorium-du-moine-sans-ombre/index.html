    part: () => { note(784, 0.12, { vol: 0.06 }); note(523, 0.16, { vol: 0.06, retard: 0.1 }); },
    tour: () => note(988, 0.12, { type: 'triangle', vol: 0.06 }),
    non: () => note(180, 0.12, { type: 'triangle', vol: 0.06 }),
    sceau: () => { note(523, 0.2, { vol: 0.07 }); note(784, 0.4, { vol: 0.07, retard: 0.12 }); note(1047, 0.5, { vol: 0.05, retard: 0.24 }); }
  };

  function majBoutonsSon() {
    document.querySelectorAll('.btn-son').forEach((b) => {
      b.textContent = prog.options.son ? '🔊' : '🔇';
      b.setAttribute('aria-label', tr(prog.options.son ? 'son.couper' : 'son.remettre'));
      b.setAttribute('aria-pressed', prog.options.son ? 'false' : 'true');
    });
  }
  function basculerSon() {
    audio();
    prog.options.son = !prog.options.son;
    sauverReglages();
    majBoutonsSon();
    sons.clic();
  }

  // ---------------------------------------------------------------------
  //  Écrans, messages
  // ---------------------------------------------------------------------

  let ecran = 'titre';
  function afficherEcran(nom) {
    ecran = nom;
    document.querySelectorAll('.ecran').forEach((e) => e.classList.toggle('actif', e.id === 'ecran-' + nom));
    $('decor').style.display = nom === 'titre' ? '' : 'none';
    if (nom === 'titre') majTitre();
    if (nom === 'jeu') { ajusterPage(); relancerBoucle(); }
  }

  let toastMinuterie = 0;
  function toast(texte, duree) {
    const t = $('toast');
    t.textContent = texte;
    // en partie : en haut de la page, pour ne cacher ni l'aperçu ni la réserve
    if (ecran === 'jeu') { t.style.top = Math.max(8, $('zone').getBoundingClientRect().top + 4) + 'px'; t.style.bottom = 'auto'; }
    else { t.style.top = ''; t.style.bottom = ''; }
    t.classList.add('actif');
    clearTimeout(toastMinuterie);
    toastMinuterie = setTimeout(() => t.classList.remove('actif'), duree || 2400);
  }
  function bandeau(texte) {
    $('bandeau-texte').textContent = texte || '';
    $('bandeau').classList.toggle('actif', !!texte);
  }
  function ouvrirVoile(id) { $(id).classList.add('actif'); const b = $(id).querySelector('button:not([hidden])'); if (b) try { b.focus({ preventScroll: true }); } catch (e) { /* rien */ } }
  function fermerVoile(id) { $(id).classList.remove('actif'); }
  const voileOuvert = (id) => $(id).classList.contains('actif');

  // ---------------------------------------------------------------------
  //  Partie : état affiché, places
  // ---------------------------------------------------------------------

  let partie = null;
  let session = null;          // 'solo' (20 nuits) ou 'ligne' (avec d'autres joueurs)
  let niveau = 1;
  let vue = null;              // copie de l'état affiché
  let enPartie = false;        // nuit solo en cours (pour la sauvegarde à la fermeture)
  let enPause = false;
  let attenteTuto = false;
  let jeton = 0;               // change à chaque partie : ignore les minuteries d'avant
  let humainsAvant = null;
  let debutTour = Date.now(), dernierTic = -1;
  let souffles = SOUFFLES;

  function siegesActuels() {
    if (!partie) return [];
    try { return partie.sieges(); } catch (e) { return []; }
  }
  const moi = () => (partie ? partie.siege : -1);

  function roleDe(info) { return info.moi ? 'toi' : (info.humain ? 'joueur' : 'robot'); }
  // Nom d'une place : le pseudo d'un vrai joueur en ligne (partie.sieges()[s].nom),
  // sinon « Toi », « Joueur » ou « Robot ».
  function nomPlace(info, role) { return role === 'joueur' && info.nom ? info.nom : tr('place.' + role); }
  function nomCopiste(s) {
    const info = siegesActuels()[s] || {};
    if (s === moi()) return tr('place.toi');
    return info.humain && info.nom ? info.nom : tr('copiste.' + s);
  }
  function remplirTag(tag, role, nom) {
    const texte = nom || tr('place.' + role);
    if (tag.dataset.role === role && tag.dataset.nom === texte) return;
    tag.dataset.role = role;
    tag.dataset.nom = texte;
    tag.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
    const sp = document.createElement('span');
    sp.textContent = texte;
    tag.appendChild(sp);
  }

  function construirePlaces() {
    const box = $('places'), salon = $('salon-places');
    box.textContent = ''; salon.textContent = '';
    for (let s = 0; s < PLACES; s++) {
      const d = document.createElement('div');
      d.className = 'place'; d.id = 'place-' + s; d.style.setProperty('--c', COUL[s]);
      d.innerHTML = '<span class="ico">' + svgCopiste(COUL[s]) + '</span><span class="pts">' + GOUTTE + '<b>0</b></span><span class="tag"></span>' + COURONNE;
      box.appendChild(d);
      const sd = document.createElement('div');
      sd.className = 'salon-place'; sd.id = 'salon-place-' + s;
      sd.innerHTML = COURONNE + '<span class="ico">' + svgCopiste(COUL[s]) + '</span><span class="tag"></span>';
      salon.appendChild(sd);
    }
  }

  function majPlaces() {
    const e = vue, sieges = siegesActuels();
    const tour = e && partie && partie.phase === 'jeu' && !attenteTuto && !O.finie(e) ? R.aQui(e) : -1;
    for (let s = 0; s < PLACES; s++) {
      const d = $('place-' + s), info = sieges[s] || { humain: false, moi: false };
      const pts = e ? e.sc[s] : 0;
      d.querySelector('.pts b').textContent = nb(pts);
      d.classList.toggle('actif', s === tour);
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef && session === 'ligne');
      const role = roleDe(info);
      remplirTag(d.querySelector('.tag'), role, nomPlace(info, role));
      d.setAttribute('aria-label', tr('place.aria.' + role, { copiste: tr('copiste.' + s), n: pts }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef && session === 'ligne' ? ' · ' + tr('salon.chefMarque') : ''));
    }
  }

  function texteMessage() {
    if (!partie) return '';
    if (partie.mode === 'connexion') return tr('multi.recherche');
    const e = vue;
    if (!e || attenteTuto || partie.phase !== 'jeu' || O.finie(e)) return '';
    const s = R.aQui(e);
    if (partie.siege < 0) return tr('multi.attente');
    if (s === partie.siege) return tr('tour.toi');
    const nom = (siegesActuels()[s] || {}).nom;
    return nom ? tr('tour.nom', { nom: nom }) : tr('tour.copiste', { nom: tr('copiste.' + s) });
  }

  function majInfos() {
    let info = '';
    if (session === 'solo') info = tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, nom: tr('nuit.' + niveau) });
    else if (partie && partie.manche > 0) info = tr(partie.mode === 'en-ligne' ? 'jeu.enLigne' : 'jeu.robots', { n: partie.manche });
    else if (partie && partie.mode === 'connexion') info = tr('jeu.connexion');
    if ($('info-niveau').textContent !== info) $('info-niveau').textContent = info;
    const m = texteMessage();
    if ($('message').textContent !== m) $('message').textContent = m;
    // ronde, Moine, miroir
    const b = $('barre-nuit');
    let html = '';
    if (vue && partie && partie.phase === 'jeu') {
      const ronde = Math.min(vue.max / PLACES, Math.floor(vue.k / PLACES) + 1);
      html += '<span>' + SABLIER + esc(tr('nuit.ronde', { n: ronde, total: vue.max / PLACES })) + '</span>';
      if (vue.mo) {
        const n = O.avantMoine(vue);
        html += '<span class="' + (n > 0 && n <= PLACES ? 'alerte' : '') + '">' + CLOCHE + esc(n > 0 ? tr('moine.dans', { n: n }) : tr('moine.aube')) + '</span>';
      }
      if (vue.mi) html += '<span>' + MIROIR + esc(tr('miroir.actif')) + '</span>';
    }
    if (b.dataset.html !== html) { b.dataset.html = html; b.innerHTML = html; }
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // Barre de temps : seulement quand c'est à un vrai joueur, en ligne.
  function majTemps() {
    const barre = $('temps');
    const e = vue;
    let visible = false;
    if (partie && partie.mode === 'en-ligne' && e && partie.phase === 'jeu' && !O.finie(e)) {
      const s = R.aQui(e), sieges = siegesActuels();
      if (sieges[s] && sieges[s].humain) {
        visible = true;
        const reste = Math.max(0, 1 - (Date.now() - debutTour) / R.delaiJoueur);
        const div = barre.firstElementChild;
        div.style.setProperty('--c', COUL[s]);
        div.style.transform = 'scaleX(' + reste.toFixed(3) + ')';
        barre.setAttribute('aria-valuenow', String(Math.round(reste * 100)));
        const sec = Math.ceil(reste * R.delaiJoueur / 1000);
        if (s === partie.siege && sec <= 5 && sec > 0 && sec !== dernierTic) { dernierTic = sec; sons.tic(); }
      }
    }
    barre.style.visibility = visible ? 'visible' : 'hidden';
  }

  // ---------------------------------------------------------------------
  //  La page (plateau) : cases, lettres, encre de chaque copiste
  // ---------------------------------------------------------------------

  let cellules = [];
  let pageCle = '';
  let pose = [];               // lettres posées pas encore écrites : [{ k: case, i: n° dans la réserve }]
  let selection = -1;          // tuile choisie dans la réserve
  let curseur = -1;            // case choisie (clavier, ou toucher d'une case vide)
  let sens = 'H';              // sens d'écriture au clavier
  let ordre = [];              // ordre d'affichage de la réserve
  let reserveCle = '';
  let envoye = false;          // coup envoyé, en attente de son retour
  let analyse = null;          // analyse du coup en préparation
  let tombe = {};              // cases qui viennent d'être écrites (animation)

  function couleurEncre(a) {
    if (a < 0) return ENCRE_MANUSCRIT;
    if (a === moi() && prog.plume > 0) return PLUMES[prog.plume].c;
    return COUL[a] || ENCRE_MANUSCRIT;
  }

  function construirePage(e) {
    const cle = e.W + 'x' + e.H + ':' + e.g + (e.mi ? 'm' : '');
    const page = $('page');
    page.classList.toggle('miroir', !!e.mi);
    if (cle === pageCle) return;
    pageCle = cle;
    page.textContent = '';
    page.style.setProperty('--w', e.W);
    cellules = [];
    for (let i = 0; i < e.W * e.H; i++) {
      const ch = e.g.charAt(i);
      const d = document.createElement('div');
      d.className = 'cel' + (CLASSE_CASE[ch] ? ' ' + CLASSE_CASE[ch] : '');
      d.dataset.i = String(i);
      if (SVG_CASE[ch]) { const f = document.createElement('span'); f.className = 'fond'; f.innerHTML = SVG_CASE[ch]; d.appendChild(f); }
      const l = document.createElement('span'); l.className = 'l'; d.appendChild(l);
      const v = document.createElement('span'); v.className = 'v'; d.appendChild(v);
      page.appendChild(d);
      cellules.push(d);
    }
    const fx = document.createElement('div'); fx.id = 'fx-page'; page.appendChild(fx);
    const om = document.createElement('div'); om.id = 'ombre-moine'; page.appendChild(om);
    ajusterPage();
  }

  function ajusterPage() {
    if (!vue) return;
    const zone = $('zone'), page = $('page');
    const w = zone.clientWidth - 12, h = zone.clientHeight - 8;
    if (w <= 0 || h <= 0) return;
    const n = Math.max(vue.W, vue.H);
    const cote = Math.max(22, Math.floor((Math.min(w, h) - 10 - (n - 1) * 2) / n));
    page.style.setProperty('--cote', Math.min(56, cote) + 'px');
    const t = Math.max(36, Math.min(54, Math.floor((window.innerWidth - 24) / 7) - 6));
    document.documentElement.style.setProperty('--tuile', t + 'px');
  }

  // Auteur de chaque case : le premier mot qui l'a écrite.
  function auteursCases(e) {
    const a = {};
    e.m.forEach((w) => w.c.forEach((y) => { if (a[y] === undefined) a[y] = w.a; }));
    return a;
  }

  function maReserve() { return vue && partie && partie.siege >= 0 && vue.r[partie.siege] ? vue.r[partie.siege] : []; }
  function poseActions() { const r = maReserve(); return pose.map((p) => [p.k, r[p.i]]); }
  function lettreEnAttente(k) { const p = pose.find((x) => x.k === k); return p ? maReserve()[p.i] : ''; }
  function ecrivable(k) { const ch = vue.g.charAt(k); return ch !== '#' && ch !== ' '; }
  function caseLibre(k) { return !!vue && k >= 0 && k < vue.l.length && !vue.l[k] && ecrivable(k) && !pose.some((p) => p.k === k); }

  function majPage() {
    const e = vue;
    if (!e) return;
    construirePage(e);
    const auteurs = auteursCases(e);
    const prot = {}, marque = {};
    e.m.forEach((w) => w.c.forEach((y) => { if (w.p) prot[y] = 1; if (w.o && !w.p) marque[y] = 1; }));
    const run = analyse && analyse.c ? analyse.c : [];
    const cible = e.mo ? O.cibleMoine(e) : -1;
    const menace = {};
    if (cible >= 0 && O.avantMoine(e) > 0 && O.avantMoine(e) <= PLACES) e.m[cible].c.forEach((y) => { menace[y] = 1; });
    const ma = moi();
    for (let i = 0; i < cellules.length; i++) {
      const d = cellules[i];
      const att = !e.l[i] ? lettreEnAttente(i) : '';
      const L = e.l[i] || att;
      const l = d.children[d.children.length - 2], v = d.lastChild;
      if (l.textContent !== L) l.textContent = L;
      const vt = L ? String(O.valeur(L)) : '';
      if (v.textContent !== vt) v.textContent = vt;
      d.classList.toggle('pleine', !!L);
      d.classList.toggle('attente', !!att);
      d.style.setProperty('--ec', e.l[i] ? couleurEncre(auteurs[i] === undefined ? -1 : auteurs[i]) : couleurEncre(ma));
      d.classList.toggle('ok', !!(analyse && analyse.ok && run.indexOf(i) >= 0));
      d.classList.toggle('ko', !!(analyse && !analyse.ok && run.indexOf(i) >= 0));
      d.classList.toggle('curseur', i === curseur);
      d.classList.toggle('dir-h', i === curseur && sens === 'H');
      d.classList.toggle('dir-v', i === curseur && sens === 'V');
      d.classList.toggle('protege', !!prot[i]);
      d.classList.toggle('marque', !!marque[i]);
      d.classList.toggle('cible', !!menace[i]);
      d.classList.toggle('tombe', !!tombe[i]);
    }
  }

  // Réserve : 7 tuiles ; une tuile posée sur la page laisse une place vide.
  function majReserve() {
    const r = maReserve(), cle = r.join('');
    if (cle !== reserveCle) { reserveCle = cle; ordre = r.map((_, i) => i); pose = []; selection = -1; envoye = false; }
    const box = $('reserve');
    box.textContent = '';
    const ec = couleurEncre(moi());
    for (let j = 0; j < Math.max(O.reserve, ordre.length); j++) {
      const i = ordre[j];
      if (i === undefined || pose.some((p) => p.i === i)) {
        const v = document.createElement('span'); v.className = 'vide-t'; v.style.setProperty('--t', 'var(--tuile, 46px)'); box.appendChild(v);
        continue;
      }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tuile' + (i === selection ? ' choisie' : '');
      b.dataset.i = String(i);
      b.style.setProperty('--t', 'var(--tuile, 46px)');
      b.style.setProperty('--ec', ec);
      b.textContent = r[i];
      const v = document.createElement('span'); v.className = 'v'; v.textContent = String(O.valeur(r[i]));
      b.appendChild(v);
      b.setAttribute('aria-label', tr('tuile.aria', { lettre: r[i], n: O.valeur(r[i]) }));
      box.appendChild(b);
    }
  }

  // Aperçu du mot en préparation : mot lu, encre, ou raison du refus.
  function majApercu() {
    const a = $('apercu');
    analyse = null;
    let texte = '', classe = '';
    if (vue && partie && partie.siege >= 0 && pose.length) {
      analyse = O.analyser(vue, partie.siege, poseActions());
      if (analyse.ok) {
        classe = 'ok';
        let bonus = '';
        if (analyse.mult > 1) bonus += ' ×' + analyse.mult;
        if (analyse.prot) bonus += ' · ' + tr('apercu.relique');
        if (analyse.oeil) bonus += ' · ' + tr('apercu.oeil');
        if (analyse.entiere) bonus += ' · ' + tr('apercu.entiere');
        texte = '<span class="mot">' + esc(analyse.mot) + '</span> · ' + esc(tr('apercu.gain', { n: analyse.pts })) + esc(bonus);
      } else {
        classe = 'ko';
        texte = analyse.err === 'inconnu' ? '<span class="mot">' + esc(analyse.mot) + '</span> · ' + esc(tr('refus.inconnu')) : esc(tr('refus.' + analyse.err));
      }
    } else if (vue && partie && partie.phase === 'jeu' && partie.siege >= 0 && !O.finie(vue)) {
      texte = esc(tr(partie.monTour() ? 'apercu.aide' : 'apercu.prepare'));
    }
    if (a.dataset.html !== texte) { a.dataset.html = texte; a.innerHTML = texte; }
    a.className = classe;
    const monTour = !!(partie && partie.monTour() && !enPause && !attenteTuto);
    $('btn-ecrire').disabled = !(monTour && analyse && analyse.ok && !envoye);
    $('btn-changer').disabled = !monTour || envoye;
    $('btn-rappel').disabled = !pose.length;
    $('btn-souffle').disabled = !monTour || souffles <= 0 || envoye;
    $('souffle-nb').textContent = String(souffles);
    if (!monTour) { $('btn-changer').classList.remove('arme'); confirmeChanger = 0; }
  }

  function majTout() {
    majPlaces();
    majInfos();
    majReserve();
    majApercu();
    majPage();
  }

  // ---------------------------------------------------------------------
  //  Gestes : poser, reprendre, écrire
  // ---------------------------------------------------------------------

  function peutPreparer() {
    return !!(partie && partie.siege >= 0 && partie.phase === 'jeu' && !enPause && !attenteTuto && vue && !O.finie(vue) && !envoye);
  }

  function placerTuile(i, k) {
    if (!peutPreparer()) return false;
    if (!caseLibre(k)) { sons.non(); return false; }
    if (pose.some((p) => p.i === i)) return false;
    pose.push({ k: k, i: i });
    selection = -1;
    sons.pose();
    majTout();
    return true;
  }
  function retirer(k) {
    const n = pose.findIndex((p) => p.k === k);
    if (n < 0) return;
    pose.splice(n, 1);
    sons.prise();
    majTout();
  }
  function rappeler() {
    if (!pose.length) return;
    pose = []; selection = -1;
    sons.prise();
    majTout();
  }
  function avancerCurseur() {
    if (curseur < 0 || !vue) return;
    const W = vue.W, H = vue.H;
    let r = Math.floor(curseur / W), c = curseur % W;
    // miroir : on écrit les lignes de droite à gauche
    const dc = sens === 'H' ? (vue.mi ? -1 : 1) : 0, dr = sens === 'V' ? 1 : 0;
    for (let n = 0; n < Math.max(W, H); n++) {
      r += dr; c += dc;
      if (r < 0 || c < 0 || r >= H || c >= W) return;
      const k = r * W + c;
      if (!ecrivable(k)) return;
      if (caseLibre(k)) { curseur = k; return; }
    }
  }

  function toucherTuile(i) {
    if (!peutPreparer()) { if (partie && partie.phase === 'jeu') sons.non(); return; }
    audio();
    if (curseur >= 0 && caseLibre(curseur)) {
      if (placerTuile(i, curseur)) { avancerCurseur(); majTout(); }
      return;
    }
    selection = selection === i ? -1 : i;
    sons.prise();
    majTout();
  }

  function toucherCase(k) {
    if (!vue || k < 0) return;
    audio();
    if (pose.some((p) => p.k === k)) { retirer(k); return; }
    if (!peutPreparer()) return;
    if (!caseLibre(k)) { if (!ecrivable(k)) sons.non(); return; }
    if (selection >= 0) { placerTuile(selection, k); return; }
    if (curseur === k) sens = sens === 'H' ? 'V' : 'H';
    else curseur = k;
    sons.clic();
    majTout();
  }

  let dernierAttends = 0;
  function attendsTonTour() {
    if (Date.now() - dernierAttends > 1500) { dernierAttends = Date.now(); toast(tr('tour.attends'), 1400); sons.non(); }
  }

  function ecrire() {
    if (!partie || enPause || attenteTuto || envoye) return;
    if (!pose.length) { toast(tr('apercu.aide')); sons.non(); return; }
    if (!partie.monTour()) { attendsTonTour(); return; }
    const an = O.analyser(vue, partie.siege, poseActions());
    if (!an.ok) {
      sons.refus();
      const p = $('page'); p.classList.remove('secoue'); void p.offsetWidth; p.classList.add('secoue');
      toast(an.err === 'inconnu' ? tr('refus.inconnuMot', { mot: an.mot }) : tr('refus.' + an.err), 2600);
      return;
    }
    if (partie.jouer({ p: poseActions() })) { envoye = true; curseur = -1; sons.ecrit(); majApercu(); }
  }

  let confirmeChanger = 0;
  function changer() {
    if (!partie || enPause || attenteTuto || envoye) return;
    if (!partie.monTour()) { attendsTonTour(); return; }
    if (confirmeChanger && Date.now() - confirmeChanger < 3500) {
      confirmeChanger = 0;
      $('btn-changer').classList.remove('arme');
      if (partie.jouer({ x: 1 })) { envoye = true; pose = []; selection = -1; sons.change(); majApercu(); }
      return;
    }
    confirmeChanger = Date.now();
    $('btn-changer').classList.add('arme');
    sons.clic();
    toast(tr('changer.confirmer'), 3200);
  }

  function melanger() {
    if (!ordre.length) return;
    for (let j = ordre.length - 1; j > 0; j--) { const x = Math.floor(Math.random() * (j + 1)); const t = ordre[j]; ordre[j] = ordre[x]; ordre[x] = t; }
    sons.change();
    majReserve();
  }

  // Inspiration : le cierge souffle un mot possible (3 fois par nuit).
  function souffler() {
    if (!partie || !partie.monTour() || souffles <= 0 || envoye || enPause) return;
    const liste = O.coups(vue, partie.siege, 7);
    if (!liste.length) { toast(tr('souffle.rien'), 2600); sons.non(); return; }
    liste.sort((a, b) => b.a.pts - a.a.pts);
    // un bon mot, pas forcément le meilleur
    const choix = liste[Math.min(liste.length - 1, Math.floor(liste.length * 0.25 * Math.random()))];
    const r = maReserve().slice(), pris = [];
    pose = [];
    choix.p.forEach((q) => {
      for (let i = 0; i < r.length; i++) if (r[i] === q[1] && pris.indexOf(i) < 0) { pris.push(i); pose.push({ k: q[0], i: i }); break; }
    });
    souffles--;
    selection = -1;
    sons.relique();
    toast(tr('souffle.vu'), 2200);
    majTout();
  }

  // Doigt et souris : toucher une tuile puis une case, ou faire glisser.
  let glisse = null;
  const fantome = $('glisse');
  function celluleSous(x, y) {
    const el = document.elementFromPoint(x, y);
    const c = el && el.closest ? el.closest('#page .cel') : null;
    return c ? Number(c.dataset.i) : -1;
  }
  $('reserve').addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('.tuile');
    if (!b) return;
    audio();
    glisse = { i: Number(b.dataset.i), x: ev.clientX, y: ev.clientY, id: ev.pointerId, actif: false };
    try { b.setPointerCapture(ev.pointerId); } catch (e) { /* rien */ }
  });
  document.addEventListener('pointermove', (ev) => {
    if (!glisse || ev.pointerId !== glisse.id) return;
    if (!glisse.actif && Math.hypot(ev.clientX - glisse.x, ev.clientY - glisse.y) > 10 && peutPreparer()) {
      glisse.actif = true;
      const L = maReserve()[glisse.i] || '';
      fantome.textContent = L;
      fantome.style.setProperty('--t', 'var(--tuile, 46px)');
      fantome.style.setProperty('--ec', couleurEncre(moi()));
      fantome.classList.add('actif');
      sons.prise();
    }
    if (glisse.actif) { fantome.style.left = ev.clientX + 'px'; fantome.style.top = ev.clientY + 'px'; }
  });
  function finGlisse(ev) {
    if (!glisse || ev.pointerId !== glisse.id) return;
    const g = glisse;
    glisse = null;
    fantome.classList.remove('actif');
    if (ev.type === 'pointercancel') return;
    if (g.actif) { const k = celluleSous(ev.clientX, ev.clientY); if (k >= 0) placerTuile(g.i, k); else majTout(); }
    else toucherTuile(g.i);
  }
  document.addEventListener('pointerup', finGlisse);
  document.addEventListener('pointercancel', finGlisse);
  $('page').addEventListener('click', (ev) => {
    const c = ev.target.closest('.cel');
    if (c) toucherCase(Number(c.dataset.i));
  });

  // Clavier : flèches pour la case, lettre tapée pour la poser, Espace pour le sens,
  // Retour arrière pour reprendre, Entrée pour écrire, Échap pour la pause.
  function deplacerCurseur(dr, dc) {
    if (!vue) return;
    const W = vue.W, H = vue.H;
    if (curseur < 0) { curseur = Math.floor(H / 2) * W + Math.floor(W / 2); sons.clic(); majTout(); return; }
    let r = Math.floor(curseur / W) + dr, c = curseur % W + dc;
    r = Math.max(0, Math.min(H - 1, r)); c = Math.max(0, Math.min(W - 1, c));
    curseur = r * W + c;
    if (dr) sens = 'V'; else if (dc) sens = 'H';
    sons.clic();
    majTout();
  }
  function taperLettre(L) {
    if (!peutPreparer()) { if (partie && partie.phase === 'jeu') sons.non(); return; }
    if (curseur < 0 || !caseLibre(curseur)) { if (curseur < 0) deplacerCurseur(0, 0); sons.non(); return; }
    const r = maReserve();
    for (const j of ordre) {
      if (r[j] === L && !pose.some((p) => p.i === j)) { if (placerTuile(j, curseur)) { avancerCurseur(); majTout(); } return; }
    }
    sons.non();
    toast(tr('clavier.pasLettre', { lettre: L }), 1500);
  }

  document.addEventListener('keydown', (ev) => {
    if (ecran !== 'jeu') return;
    if (voileOuvert('voile-tuto')) {
      if (ev.code === 'Enter' || ev.code === 'Space' || ev.code === 'Escape') { ev.preventDefault(); $('btn-tuto-ok').click(); }
      return;
    }
    if (voileOuvert('voile-salon')) return;
    if (ev.code === 'Escape') {
      ev.preventDefault();
      if (enPause) fermerPause(); else if (!voileOuvert('voile-fin')) { audio(); ouvrirPause(); }
      return;
    }
    if (enPause || voileOuvert('voile-fin')) return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const dirs = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] };
    if (dirs[ev.code]) { ev.preventDefault(); audio(); deplacerCurseur(dirs[ev.code][0], dirs[ev.code][1]); return; }
    if (ev.code === 'Enter' || ev.code === 'NumpadEnter') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON' && document.activeElement.id !== 'btn-ecrire') return;
      ev.preventDefault(); audio(); ecrire(); return;
    }
    if (ev.code === 'Backspace' || ev.code === 'Delete') {
      ev.preventDefault();
      if (ev.code === 'Delete') { rappeler(); return; }
      const der = pose[pose.length - 1];
      if (der) { curseur = der.k; retirer(der.k); }
      return;
    }
    if (ev.code === 'Space') {
      if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
      ev.preventDefault(); sens = sens === 'H' ? 'V' : 'H'; sons.clic(); majTout(); return;
    }
    const k = (ev.key || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
    if (/^[A-Z]$/.test(k)) { ev.preventDefault(); audio(); taperLettre(k); }
  });

  // ---------------------------------------------------------------------
  //  Effets : encre qui s'envole, lettres effacées, passage du Moine
  // ---------------------------------------------------------------------

  function centreCases(cs) {
    let x = 0, y = 0, n = 0;
    cs.forEach((k) => { const d = cellules[k]; if (!d) return; const r = d.getBoundingClientRect(); x += r.left + r.width / 2; y += r.top + r.height / 2; n++; });
    return n ? [x / n, y / n] : [window.innerWidth / 2, window.innerHeight / 2];
  }
  function envolGain(depuis, s, texte, perte) {
    const g = document.createElement('div');
    g.className = 'gain' + (perte ? ' perte' : '');
    g.textContent = texte;
    g.style.left = depuis[0] + 'px'; g.style.top = depuis[1] + 'px';
    g.style.transform = 'translate(-50%, -50%) scale(.6)';
    $('fx').appendChild(g);
    const carte = $('place-' + s);
    const r = carte ? carte.getBoundingClientRect() : null;
    requestAnimationFrame(() => {
      g.style.transform = 'translate(-50%, -50%) scale(1.2)';
      setTimeout(() => {
        if (r) g.style.transform = 'translate(' + (r.left + r.width / 2 - depuis[0]) + 'px, ' + (r.top + r.height / 2 - depuis[1]) + 'px) translate(-50%, -50%) scale(.7)';
        g.style.opacity = '0.2';
      }, 420);
    });
    setTimeout(() => {
      g.remove();
      if (carte) { carte.classList.remove(perte ? 'perd' : 'bond'); void carte.offsetWidth; carte.classList.add(perte ? 'perd' : 'bond'); }
    }, 1350);
  }

  function passageMoine(ef, j) {
    setTimeout(() => {
      if (j !== jeton || !vue) return;
      sons.cloche();
      const om = $('ombre-moine');
      if (om) { om.innerHTML = SVG_MOINE; om.classList.remove('actif'); void om.offsetWidth; om.classList.add('actif'); }
      setTimeout(() => {
        if (j !== jeton) return;
        sons.moine();
        const fx = $('fx-page');
        (ef.c || []).forEach((k, n) => {
          const d = cellules[k];
          if (!d || !fx) return;
          const f = document.createElement('div');
          f.className = 'fantome';
          f.style.left = d.offsetLeft + 'px'; f.style.top = d.offsetTop + 'px';
          f.style.width = d.offsetWidth + 'px'; f.style.height = d.offsetHeight + 'px';
          f.style.fontSize = Math.round(d.offsetHeight * 0.58) + 'px';
          f.style.color = couleurEncre(ef.a);
          f.textContent = (ef.l && ef.l[n]) || '';
          f.style.animationDelay = (n * 0.08) + 's';
          fx.appendChild(f);
          setTimeout(() => f.remove(), 2000 + n * 80);
        });
        if (!ef.c || !ef.c.length) toast(tr('moine.rien'), 2600);
        else {
          toast(ef.a >= 0 ? tr('moine.efface', { mot: ef.mot, nom: nomCopiste(ef.a), n: ef.pen }) : tr('moine.effaceManuscrit', { mot: ef.mot }), 3200);
          if (ef.a >= 0 && ef.pen > 0) envolGain(centreCases(ef.c), ef.a, '−' + nb(ef.pen), true);
          if (ef.a >= 0 && moi() >= 0 && ef.a !== moi()) gagnerSceau('moine');
        }
        setTimeout(() => { if (om) om.classList.remove('actif'); }, 1600);
      }, 650);
    }, 750);
  }

  // Sceaux : petits exploits gardés dans la sauvegarde.
  function gagnerSceau(cle) {
    if (prog.sceaux.indexOf(cle) >= 0) return;
    prog.sceaux.push(cle);
    sauverReglages();
    setTimeout(() => { sons.sceau(); toast(tr('sceau.gagne', { nom: tr('sceau.' + cle) }), 3000); }, 1500);
  }

  // ---------------------------------------------------------------------
  //  Boucle d'affichage (temps en ligne, salon, comptes à rebours)
  // ---------------------------------------------------------------------

  let rafId = 0;
  function relancerBoucle() { if (!rafId) rafId = requestAnimationFrame(boucle); }
  function boucle() {
    rafId = 0;
    if (ecran !== 'jeu') return;
    majTemps();
    majCompte();
    rafId = requestAnimationFrame(boucle);
  }

  // ---------------------------------------------------------------------
  //  Événements de la partie (moteur commun JEL_MULTI)
  // ---------------------------------------------------------------------

  function surEvenement(ev) {
    if (!partie) return;
    switch (ev.type) {
      case 'mode': surMode(ev); break;
      case 'debut': surDebut(ev); break;
      case 'manche': surManche(); break;
      case 'action': surAction(ev); break;
      case 'fin': surFin(); break;
      case 'sieges': surSieges(); break;
      case 'salon': surSalon(ev); break;
      default: break;
    }
    majTout();
  }

  function surMode(ev) {
    if (ev.mode === 'connexion') { bandeau(tr('multi.recherche')); return; }
    bandeau('');
    if (session !== 'ligne') return;
    if (ev.mode === 'en-ligne') { toast(tr('multi.enLigne')); sons.arrive(); return; }
    const raison = ev.raison;
    let cle = 'multi.personne';
    if (raison === 'coupe' || raison === 'cache') cle = 'multi.coupe';
    else if (raison === 'hors-ligne') cle = 'multi.horsLigne';
    else if (raison === 'site' || raison === 'seul') cle = 'multi.ici';
    toast(tr(cle), 3800);
  }

  function nouvelleVue(e) {
    vue = e ? copie(e) : null;
    pose = []; selection = -1; curseur = -1; envoye = false; tombe = {};
    reserveCle = '';
    if (vue) construirePage(vue);
  }

  function surDebut(ev) {
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    nouvelleVue(partie.etat);
    debutTour = Date.now();
    if (partie.phase === 'salon') { bandeau(''); finSalon = Date.now() + (ev.reste || 0); resultatSalon = null; ouvrirSalon(); }
    else if (partie.phase === 'pause') { finManche = Date.now() + (ev.reste || 0); bandeau(tr('manche.attente')); }
    else if (partie.siege < 0) bandeau(tr('multi.attente'));
    else bandeau('');
  }

  // Salon d'attente (en ligne) : le premier joueur arrivé lance la nuit,
  // sinon elle part toute seule au bout du temps donné par le serveur.
  let finSalon = 0, finManche = 0;
  let resultatSalon = null;
  let finEnAttente = false;
  let lancement = false;
  const salonOuvert = () => voileOuvert('voile-salon');

  function surSalon(ev) {
    finSalon = Date.now() + (ev.reste || 0);
    lancement = false;
    bandeau('');
    if (finEnAttente) return;
    ouvrirSalon();
  }

  function ouvrirSalon() {
    if (!partie) return;
    if (enPause) { enPause = false; fermerVoile('voile-pause'); partie.pause(false); }
    fermerVoile('voile-fin');
    const r = resultatSalon;
    $('salon-titre').textContent = r ? tr(r.gagne ? 'manche.gagnee' : 'manche.finie') : tr('salon.titre');
    $('salon-resultat').style.display = r ? '' : 'none';
    if (r) $('salon-resultat-titre').textContent = tr('salon.resultat', { n: r.manche });
    majSalon(true);
    if (!salonOuvert()) ouvrirVoile('voile-salon');
  }

  function majSalon(tout) {
    if (!partie || (!tout && !salonOuvert())) return;
    const sieges = siegesActuels();
    const enSalon = partie.phase === 'salon' && partie.mode === 'en-ligne';
    for (let s = 0; s < PLACES; s++) {
      const d = $('salon-place-' + s), info = sieges[s] || { humain: false, moi: false, chef: false };
      const role = roleDe(info), nom = nomPlace(info, role), cle = role + (info.chef ? '+chef' : '') + '|' + nom;
      if (d.dataset.etat !== cle) {
        if (d.dataset.etat && role !== 'robot' && d.dataset.etat.indexOf('robot') === 0) { d.classList.remove('arrive'); void d.offsetWidth; d.classList.add('arrive'); }
        d.dataset.etat = cle;
        remplirTag(d.querySelector('.tag'), role, nom);
        d.setAttribute('aria-label', tr('salon.place.' + role, { copiste: tr('copiste.' + s) }) + (role === 'joueur' && info.nom ? ' · ' + info.nom : '') + (info.chef ? ' · ' + tr('salon.chefMarque') : ''));
      }
      d.classList.toggle('moi', !!info.moi);
      d.classList.toggle('chef', !!info.chef);
    }
    let message = '';
    if (enSalon) {
      const nomChef = partie.chef >= 0 ? (sieges[partie.chef] || {}).nom : null;
      if (partie.siege < 0) message = tr('multi.attente');
      else if (partie.estChef()) message = tr('salon.chef');
      else if (partie.chef >= 0) message = tr('salon.attente', { nom: nomChef ? nomChef + ' · ' + tr('copiste.' + partie.chef) : tr('copiste.' + partie.chef) });
    }
    if ($('salon-message').textContent !== message) $('salon-message').textContent = message;
    const bouton = $('btn-lancer');
    const chef = enSalon && partie.estChef();
    bouton.hidden = !chef;
    bouton.disabled = lancement;
    const texteBouton = tr(resultatSalon || partie.manche > 0 ? 'salon.lancerSuivante' : 'salon.lancer');
    if (bouton.textContent !== texteBouton) bouton.textContent = texteBouton;
    const compte = enSalon ? tr('salon.auto', { n: Math.max(0, Math.ceil((finSalon - Date.now()) / 1000)) }) : '';
    if ($('salon-compte').textContent !== compte) $('salon-compte').textContent = compte;
  }

  function surManche() {
    jeton++;
    nouvelleVue(partie.etat);
    souffles = SOUFFLES;
    debutTour = Date.now();
    dernierTic = -1;
    fermerVoile('voile-fin');
    fermerVoile('voile-salon');
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
    if (partie.siege >= 0) bandeau('');
    if (session === 'ligne') { toast(tr('manche.nouvelle', { n: partie.manche })); sons.tour(); }
    else {
      enPartie = true;
      const nuit = NIVEAUX[niveau - 1];
      toast(tr('nuit.objectif', { s2: nuit.s2, s3: nuit.s3 }), 3400);
    }
    humainsAvant = siegesActuels().map((x) => x.humain && !x.moi);
    ajusterPage();
  }

  function surAction(ev) {
    const j = jeton;
    const apres = ev.apres, d = apres.der;
    vue = copie(apres);
    debutTour = Date.now();
    dernierTic = -1;
    if (ev.moi) { pose = []; selection = -1; envoye = false; }
    else pose = pose.filter((p) => !vue.l[p.k]);
    if (curseur >= 0 && vue.l[curseur]) curseur = -1;
    tombe = {};
    if (d && d.c) {
      (d.nv || []).forEach((k) => { tombe[k] = 1; });
      setTimeout(() => { if (j === jeton) { tombe = {}; majPage(); } }, 600);
      if (!ev.moi) sons.pose();
      setTimeout(() => {
        if (j !== jeton) return;
        sons.encre(d.pts);
        envolGain(centreCases(d.c), d.s, '+' + nb(d.pts), false);
        if (d.prot) sons.relique();
      }, 250);
      if (d.entiere) toast(tr('jeu.entiere', { nom: nomCopiste(d.s) }), 2600);
      else if (d.mult > 1) toast(tr('jeu.mult', { nom: nomCopiste(d.s), mot: d.mot, n: d.mult }), 2200);
      if (ev.moi) verifierSceaux(d);
    } else if (d && d.x) {
      sons.change();
      toast(ev.moi ? tr('changer.toi') : tr('changer.autre', { nom: nomCopiste(d.s) }), 2000);
    }
    if (ev.auto) toast(tr(ev.moi ? 'multi.autoToi' : 'multi.auto'));
    if (apres.ef) passageMoine(apres.ef, j);
    if (partie.phase === 'jeu' && !O.finie(vue) && R.aQui(vue) === partie.siege && !ev.moi) setTimeout(() => { if (j === jeton) sons.tour(); }, 500);
  }

  function verifierSceaux(d) {
    if (d.mot && d.mot.length >= 6) gagnerSceau('long');
    if (d.en > 0) gagnerSceau('enlu');
    if (d.prot) gagnerSceau('relique');
    if (vue && vue.mi && d.d === 'H') gagnerSceau('miroir');
    if (d.entiere) gagnerSceau('entiere');
  }

  function surSieges() {
    const flags = siegesActuels().map((x) => x.humain && !x.moi);
    if (humainsAvant && session === 'ligne' && partie.mode === 'en-ligne') {
      const avant = humainsAvant.filter(Boolean).length, apres = flags.filter(Boolean).length;
      if (apres > avant) { toast(tr('multi.arrive')); sons.arrive(); }
      else if (apres < avant) { toast(tr('multi.part')); sons.part(); }
    }
    humainsAvant = flags;
    if (partie.siege >= 0 && $('bandeau-texte').textContent === tr('multi.attente')) bandeau('');
    majSalon();
  }

  function surFin() {
    const j = jeton;
    if (session === 'solo') enPartie = false;
    finManche = Date.now() + R.pauseManche;
    const enLigne = partie.mode === 'en-ligne';
    if (enLigne) finEnAttente = true;
    setTimeout(() => {
      if (j !== jeton || !partie) return;
      if (enLigne) afficherFinEnLigne(); else afficherFin();
    }, 1500);
  }

  // Fin d'une nuit en ligne : classement, puis le salon (même écran).
  function afficherFinEnLigne() {
    finEnAttente = false;
    const e = partie.etat;
    if (!e) return;
    const m = partie.siege;
    const gagne = m >= 0 && e.sc[m] === Math.max.apply(null, e.sc);
    if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
    if (m >= 0) { gagnerSceau('ligne'); if (e.sc[m] >= 100) gagnerSceau('cent'); }
    remplirClassement(e, m, siegesActuels(), $('salon-classement'));
    resultatSalon = { gagne: gagne, manche: partie.manche };
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirSalon();
  }

  // ---------------------------------------------------------------------
  //  Fins de nuit : victoire, défaite, classement
  // ---------------------------------------------------------------------

  function etoilesPour(pts, nuit, gagne) {
    if (!gagne) return 0;
    return pts >= nuit.s3 ? 3 : pts >= nuit.s2 ? 2 : 1;
  }

  function remplirClassement(e, m, sieges, boite) {
    boite.textContent = '';
    const res = R.fin(e);
    const ordreCl = res ? res.classement : [0, 1, 2, 3];
    let rang = 0, prec = null;
    ordreCl.forEach((s, k) => {
      if (e.sc[s] !== prec) { rang = k + 1; prec = e.sc[s]; }
      const l = document.createElement('div');
      l.className = 'ligne-cl' + (s === m ? ' moi' : '');
      const r = document.createElement('span'); r.className = 'rang'; r.textContent = nb(rang);
      const ico = document.createElement('span'); ico.className = 'ico'; ico.innerHTML = svgCopiste(COUL[s]);
      const qui = document.createElement('span'); qui.className = 'qui';
      const info = sieges[s] || {};
      const role = s === m ? 'toi' : (info.humain ? 'joueur' : 'robot');
      qui.innerHTML = role === 'toi' ? ICONE_TOI : role === 'joueur' ? ICONE_JOUEUR : ICONE_ROBOT;
      const nom = document.createElement('span'); nom.textContent = tr('copiste.' + s) + ' · ' + nomPlace(info, role);
      qui.appendChild(nom);
      const n = document.createElement('span'); n.className = 'nb'; n.textContent = tr('fin.encreCourt', { n: e.sc[s] });
      l.append(r, ico, qui, n);
      boite.appendChild(l);
    });
  }

  function bouton(cle, classe, action) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (classe ? ' ' + classe : '');
    b.textContent = tr(cle);
    b.addEventListener('click', () => { audio(); sons.clic(); action(); });
    return b;
  }

  function afficherFin() {
    const e = partie.etat;
    if (!e) return;
    const m = partie.siege, sieges = siegesActuels();
    const pts = m >= 0 ? e.sc[m] : 0;
    const gagne = m >= 0 && pts === Math.max.apply(null, e.sc);
    const egalite = gagne && e.sc.filter((x) => x === pts).length > 1;
    const boutons = $('fin-boutons');
    boutons.textContent = '';
    remplirClassement(e, m, sieges, $('fin-classement'));
    $('fin-points').textContent = m >= 0 ? tr('fin.encre', { n: pts }) : '';
    $('fin-page').textContent = '';
    if (session === 'solo') {
      const i = niveau - 1, nuit = NIVEAUX[i];
      if (window.FMG) window.FMG.reportEnd({ completed: gagne, level: niveau });
      const etoiles = etoilesPour(pts, nuit, gagne);
      const ancienRecord = prog.records[i];
      const record = pts > ancienRecord;
      if (record) prog.records[i] = pts;
      const pageNeuve = gagne && prog.etoiles[i] === 0;
      let debloque = false;
      if (pts >= 100) gagnerSceau('cent');
      if (gagne) {
        prog.etoiles[i] = Math.max(prog.etoiles[i], etoiles);
        if (niveau < NIVEAUX.length && prog.debloque < niveau + 1) { prog.debloque = niveau + 1; debloque = true; }
        sauver(Math.min(niveau + 1, NIVEAUX.length), pts);
        // Les 20 nuits gagnées (maintenant ou avant) : total des meilleures étoiles.
        if (prog.etoiles.every((x) => x > 0)) {
          if (window.FMG) window.FMG.reportComplete({ stars: totalEtoiles(), maxStars: NIVEAUX.length * 3 });
        }
      } else if (record) sauver(prog.niveau, pts);
      $('fin-titre').textContent = gagne ? tr(egalite ? 'fin.egalite' : 'fin.gagne') : tr('fin.perdu');
      const zone = $('fin-etoiles');
      zone.textContent = '';
      for (let k = 0; k < 3; k++) {
        const sp = document.createElement('span'); sp.textContent = '★';
        if (k < etoiles) { sp.className = 'oui'; sp.style.animationDelay = (0.2 + k * 0.25) + 's'; }
        zone.appendChild(sp);
      }
      zone.setAttribute('aria-label', tr('fin.etoiles', { n: etoiles }));
      zone.style.display = '';
      $('fin-objectif').textContent = tr('nuit.objectif', { s2: nuit.s2, s3: nuit.s3 });
      $('fin-record').textContent = record ? tr('fin.nouveauRecord') : tr('fin.record', { n: Math.max(ancienRecord, pts) });
      $('fin-page').textContent = pageNeuve ? tr('fin.page', { n: niveau }) : '';
      $('fin-debloque').textContent = gagne && niveau === NIVEAUX.length ? tr('fin.dernier') : (debloque ? tr('fin.debloque', { n: niveau + 1 }) : '');
      $('fin-compte').textContent = '';
      if (!gagne) $('fin-debloque').textContent = tr('fin.conseil');
      if (gagne && niveau < NIVEAUX.length) boutons.appendChild(bouton('bouton.suivant', 'vert', () => demarrerNiveau(niveau + 1)));
      boutons.appendChild(bouton(gagne ? 'bouton.rejouer' : 'bouton.reessayer', gagne ? '' : 'vert', () => demarrerNiveau(niveau)));
      boutons.appendChild(bouton('bouton.niveaux', '', () => { fermerVoile('voile-fin'); quitterPartie(); ouvrirNiveaux(); }));
    } else {
      // Partie « avec d'autres joueurs » repassée contre des robots sur l'appareil
      // (serveur absent, connexion perdue) : les nuits s'enchaînent seules.
      if (m >= 0 && window.FMG) window.FMG.reportEnd({ completed: gagne, level: e.n + 1 });
      $('fin-titre').textContent = gagne ? tr('manche.gagnee') : tr('manche.finie');
      $('fin-etoiles').textContent = '';
      $('fin-etoiles').style.display = 'none';
      $('fin-objectif').textContent = '';
      $('fin-record').textContent = '';
      $('fin-debloque').textContent = '';
      majCompte();
      boutons.appendChild(bouton('bouton.quitter', '', () => { fermerVoile('voile-fin'); quitterPartie(); afficherEcran('titre'); }));
    }
    if (gagne) { sons.victoire(); confettis(); } else sons.defaite();
    ouvrirVoile('voile-fin');
  }

  // Compte à rebours avant la nuit suivante (partie avec d'autres joueurs, repassée en local).
  function majCompte() {
    majSalon();
    if (session !== 'ligne' || !partie || partie.mode !== 'solo' || partie.phase !== 'pause') return;
    const n = Math.max(0, Math.ceil((finManche - Date.now()) / 1000));
    const texte = tr('manche.prochaine', { n: n });
    if (voileOuvert('voile-fin')) { if ($('fin-compte').textContent !== texte) $('fin-compte').textContent = texte; }
    else if ($('bandeau').classList.contains('actif')) bandeau(texte);
  }

  // Confettis d'encre dorée.
  function confettis() {
    const cv = $('confettis'), w = window.innerWidth, h = window.innerHeight;
    cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    const bouts = [];
    const teintes = ['#ffd98a', '#d9a93b', '#b8402c', '#f3ead6', '#8a55c4'];
    for (let i = 0; i < 90; i++) bouts.push({ x: Math.random() * w, y: -20 - Math.random() * h * 0.5, vx: (Math.random() - 0.5) * 80, vy: 110 + Math.random() * 150, r: Math.random() * 6, vr: (Math.random() - 0.5) * 8, coul: teintes[i % teintes.length], k: 5 + Math.random() * 6 });
    let debut = 0, prec = 0;
    const j = ++confettis.n;
    function pas(t) {
      if (j !== confettis.n) return;
      if (!debut) { debut = t; prec = t; }
      const dt = Math.min(0.05, (t - prec) / 1000); prec = t;
      c.clearRect(0, 0, w, h);
      bouts.forEach((b) => {
        b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
        c.save(); c.translate(b.x, b.y); c.rotate(b.r); c.fillStyle = b.coul;
        c.beginPath(); c.ellipse(0, 0, b.k / 2, b.k / 3, 0, 0, Math.PI * 2); c.fill(); c.restore();
      });
      if (t - debut < 2800) requestAnimationFrame(pas); else c.clearRect(0, 0, w, h);
    }
    requestAnimationFrame(pas);
  }
  confettis.n = 0;

  // ---------------------------------------------------------------------
  //  Lancer, quitter, nuits
  // ---------------------------------------------------------------------

  function quitterPartie() {
    jeton++;
    if (partie) { try { partie.quitter(); } catch (e) { /* rien */ } }
    partie = null;
    session = null;
    enPartie = false;
    enPause = false;
    attenteTuto = false;
    vue = null;
    pose = []; selection = -1; curseur = -1; envoye = false;
    bandeau('');
    ['voile-pause', 'voile-fin', 'voile-tuto', 'voile-salon'].forEach(fermerVoile);
    resultatSalon = null;
    finEnAttente = false;
    lancement = false;
  }

  // Parcours solo : nuit n contre 3 robots (force croissante, donnée par la nuit).
  function demarrerNiveau(n) {
    niveau = Math.max(1, Math.min(NIVEAUX.length, n));
    if (session !== 'solo') { quitterPartie(); session = 'solo'; }
    jeton++;
    enPartie = true;
    enPause = false;
    souffles = SOUFFLES;
    fermerVoile('voile-fin');
    fermerVoile('voile-pause');
    afficherEcran('jeu');
    const tuto = NIVEAUX[niveau - 1].tuto;
    if (tuto && prog.tutos.indexOf(tuto) < 0) {
      attenteTuto = true;
      montrerTuto(tuto, () => { if (prog.tutos.indexOf(tuto) < 0) prog.tutos.push(tuto); attenteTuto = false; lancerNiveau(); });
    } else lancerNiveau();
    majTout();
  }

  function lancerNiveau() {
    if (session !== 'solo') return;
    if (partie && partie.mode === 'solo' && partie.recommencer({ niveau: niveau })) { majTout(); return; }
    if (partie) partie.quitter();
    partie = window.JEL_MULTI.creer({
      regles: R, enLigne: false, force: O.forceNiveau(niveau), options: { niveau: niveau }, enchainer: false, surEvenement: surEvenement
    });
    partie.lancer();
    majTout();
  }

  // Partie avec d'autres joueurs : nuits qui s'enchaînent, robots aux places vides.
  function lancerEnLigne() {
    quitterPartie();
    session = 'ligne';
    vue = null;
    afficherEcran('jeu');
    partie = window.JEL_MULTI.creer({ regles: R, enLigne: true, surEvenement: surEvenement });
    partie.lancer();
    majTout();
  }

  function ouvrirNiveaux() {
    const grille = $('grille-niveaux');
    grille.textContent = '';
    NIVEAUX.forEach((_, i) => {
      const n = i + 1, ouvert = n <= prog.debloque;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'case' + (ouvert ? '' : ' ferme') + (n === Math.min(prog.debloque, NIVEAUX.length) ? ' actuel' : '');
      const num = document.createElement('span'); num.textContent = ouvert ? nb(n) : '🔒';
      const nom = document.createElement('span'); nom.className = 'nom-nuit'; nom.textContent = ouvert ? tr('nuit.' + n) : '';
      const et = document.createElement('small');
      for (let k = 0; k < 3; k++) { const sp = document.createElement('span'); sp.textContent = '★'; if (k < prog.etoiles[i]) sp.className = 'oui'; et.appendChild(sp); }
      b.append(num, nom, et);
      b.setAttribute('aria-label', ouvert ? tr('niveau.aria', { niveau: n, nom: tr('nuit.' + n), n: prog.etoiles[i] }) : tr('niveau.ferme', { niveau: n }));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); demarrerNiveau(n); });
      else b.disabled = true;
      grille.appendChild(b);
    });
    $('niv-total').textContent = tr('etoiles.total', { n: totalEtoiles(), max: NIVEAUX.length * 3 });
    afficherEcran('niveaux');
  }

  // Codex : une page maudite par nuit gagnée, plumes et sceaux.
  function ouvrirCodex() {
    const pages = $('codex-pages');
    pages.textContent = '';
    let nPages = 0;
    NIVEAUX.forEach((_, i) => {
      const a = prog.etoiles[i] > 0;
      if (a) nPages++;
      const d = document.createElement('div');
      d.className = 'page-c' + (a ? '' : ' ferme');
      d.innerHTML = a ? svgPage(i) : '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M14 18v-4a6 6 0 0 1 12 0v4" fill="none" stroke="#7f7075" stroke-width="3"/><rect x="11" y="18" width="18" height="14" rx="3" fill="#7f7075"/></svg>';
      const n = document.createElement('span'); n.textContent = nb(i + 1);
      d.appendChild(n);
      d.setAttribute('role', 'img');
      d.setAttribute('aria-label', a ? tr('codex.pageAria', { n: i + 1, nom: tr('nuit.' + (i + 1)) }) : tr('codex.pageFermee', { n: i + 1 }));
      pages.appendChild(d);
    });
    $('codex-total').textContent = tr('codex.compte', { n: nPages, max: NIVEAUX.length });
    const plumes = $('codex-plumes');
    plumes.textContent = '';
    const tot = totalEtoiles();
    PLUMES.forEach((p, i) => {
      const ouvert = tot >= p.e;
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'plume' + (prog.plume === i ? ' choisie' : '') + (ouvert ? '' : ' ferme');
      b.innerHTML = svgPlume(p.c || '#efe3c6');
      const t = document.createElement('span');
      t.textContent = ouvert ? tr('plume.' + i) : tr('plume.ferme', { n: p.e });
      b.appendChild(t);
      b.setAttribute('aria-pressed', prog.plume === i ? 'true' : 'false');
      b.setAttribute('aria-label', tr('plume.' + i) + (ouvert ? '' : ' · ' + tr('plume.ferme', { n: p.e })));
      if (ouvert) b.addEventListener('click', () => { audio(); sons.clic(); prog.plume = i; sauverReglages(); ouvrirCodex(); });
      else b.disabled = true;
      plumes.appendChild(b);
    });
    const sceaux = $('codex-sceaux');
    sceaux.textContent = '';
    SCEAUX.forEach((cle) => {
      const a = prog.sceaux.indexOf(cle) >= 0;
      const d = document.createElement('div');
      d.className = 'sceau' + (a ? '' : ' ferme');
      d.innerHTML = svgSceau(cle);
      const t = document.createElement('span'); t.textContent = tr('sceau.' + cle);
      const c = document.createElement('span'); c.className = 'cond'; c.textContent = tr('sceau.' + cle + '.cond');
      d.append(t, c);
      sceaux.appendChild(d);
    });
    afficherEcran('codex');
  }

  function majTitre() {
    const n = totalEtoiles();
    $('total-titre').textContent = n ? tr('etoiles.total', { n: n, max: NIVEAUX.length * 3 }) : '';
    if (boutonEffacer && boutonEffacer.maj) boutonEffacer.maj();
  }

  // ---------------------------------------------------------------------
  //  Pause
  // ---------------------------------------------------------------------

  function ouvrirPause() {
    if (ecran !== 'jeu' || enPause || attenteTuto) return;
    enPause = true;
    if (partie) partie.pause(true);
    const ligne = session === 'ligne';
    $('pause-ligne').style.display = ligne ? '' : 'none';
    $('btn-recommencer').style.display = ligne ? 'none' : '';
    $('btn-pause-niveaux').style.display = ligne ? 'none' : '';
    const nuit = NIVEAUX[niveau - 1];
    $('pause-objectif').textContent = ligne ? '' : tr('jeu.niveau', { n: niveau, total: NIVEAUX.length, nom: tr('nuit.' + niveau) }) + ' · ' + tr('nuit.objectif', { s2: nuit.s2, s3: nuit.s3 });
    ouvrirVoile('voile-pause');
    majApercu();
  }
  function fermerPause() {
    if (!enPause) return;
    enPause = false;
    fermerVoile('voile-pause');
    if (partie) partie.pause(false);
    relancerBoucle();
    majTout();
  }

  // ---------------------------------------------------------------------
  //  Tutoriels animés (petite page, main qui pose les lettres)
  // ---------------------------------------------------------------------

  let tutoJeton = 0;
  function montrerTuto(cle, apres) {
    const d = TUTOS[cle];
    $('tuto-titre').textContent = tr('tuto.' + cle + '.titre');
    $('tuto-texte').textContent = tr('tuto.' + cle + '.texte');
    ouvrirVoile('voile-tuto');
    const j = ++tutoJeton;
    const page = $('tuto-page'), res = $('tuto-res'), main = $('tuto-main'), bulle = $('tuto-bulle'), ombre = $('tuto-ombre');
    const W = 7, H = 5;
    let cels = [];
    const attendre = (ms) => new Promise((ok) => setTimeout(ok, ms));
    const vivant = () => j === tutoJeton;
    const pos = (el) => { const b = $('tuto-demo').getBoundingClientRect(), r = el.getBoundingClientRect(); return [r.left - b.left + r.width / 2, r.top - b.top + r.height / 2]; };
    const mainVers = (el) => { const p = pos(el); main.style.transform = 'translate(' + (p[0] - 12) + 'px, ' + (p[1] - 4) + 'px)'; };
    function preparer() {
      page.textContent = ''; res.textContent = ''; cels = [];
      page.classList.toggle('miroir', !!d.mi);
      for (let i = 0; i < W * H; i++) {
        const ch = (d.g && d.g[i]) || '.';
        const c = document.createElement('div');
        c.className = 'cel' + (CLASSE_CASE[ch] ? ' ' + CLASSE_CASE[ch] : '');
        if (SVG_CASE[ch]) { const f = document.createElement('span'); f.className = 'fond'; f.innerHTML = SVG_CASE[ch]; c.appendChild(f); }
        const l = document.createElement('span'); l.className = 'l'; c.appendChild(l);
        const v = document.createElement('span'); v.className = 'v'; c.appendChild(v);
        if (d.l[i]) { c.classList.add('pleine'); l.textContent = d.l[i]; v.textContent = String(O.valeur(d.l[i])); c.style.setProperty('--ec', d.auteurs ? COUL[d.auteurs[i]] : ENCRE_MANUSCRIT); }
        page.appendChild(c); cels.push(c);
      }
      d.res.split('').forEach((L) => {
        const t = document.createElement('span'); t.className = 'tuile'; t.textContent = L; t.style.setProperty('--ec', COUL[0]);
        const v = document.createElement('span'); v.className = 'v'; v.textContent = String(O.valeur(L)); t.appendChild(v);
        res.appendChild(t);
      });
      main.style.transition = 'none';
      main.style.transform = 'translate(220px, 200px)';
      void main.offsetWidth;
      main.style.transition = '';
      bulle.classList.remove('vue');
      ombre.classList.remove('actif');
    }
    async function jouer() {
      while (vivant()) {
        preparer();
        await attendre(700);
        for (const et of d.etapes) {
          if (!vivant()) return;
          if (et[0] === 'pose') {
            const t = res.children[et[1]];
            mainVers(t); await attendre(700); if (!vivant()) return;
            t.classList.add('choisie'); await attendre(250);
            mainVers(cels[et[2]]); await attendre(700); if (!vivant()) return;
            const c = cels[et[2]];
            c.classList.add('pleine', 'attente');
            c.children[c.children.length - 2].textContent = t.firstChild.textContent;
            c.lastChild.textContent = String(O.valeur(t.firstChild.textContent));
            c.style.setProperty('--ec', COUL[0]);
            t.style.visibility = 'hidden';
            await attendre(450);
          } else if (et[0] === 'refus') {
            mainVers(cels[et[1]]); await attendre(750); if (!vivant()) return;
            cels[et[1]].classList.add('ko');
            page.classList.remove('secoue'); void page.offsetWidth; page.classList.add('secoue');
            await attendre(700);
            cels[et[1]].classList.remove('ko');
          } else if (et[0] === 'ecrire') {
            et[1].forEach((k) => { cels[k].classList.remove('attente'); cels[k].classList.add('ok'); });
            const p = pos(cels[et[1][Math.floor(et[1].length / 2)]]);
            bulle.textContent = et[2];
            bulle.style.left = (p[0] + 14) + 'px'; bulle.style.top = (p[1] - 26) + 'px';
            bulle.classList.add('vue');
            await attendre(1300);
            bulle.classList.remove('vue');
            et[1].forEach((k) => cels[k].classList.remove('ok'));
          } else if (et[0] === 'changer') {
            mainVers(res); await attendre(700); if (!vivant()) return;
            res.classList.remove('secoue'); void res.offsetWidth; res.classList.add('secoue');
            const lettres = et[1].split('');
            Array.from(res.children).forEach((t, n) => { t.style.visibility = ''; t.firstChild.textContent = lettres[n] || ''; t.lastChild.textContent = String(O.valeur(lettres[n] || 'A')); });
            await attendre(1000);
          } else if (et[0] === 'moine') {
            ombre.innerHTML = SVG_MOINE; ombre.classList.remove('actif'); void ombre.offsetWidth; ombre.classList.add('actif');
            await attendre(800); if (!vivant()) return;
            et[1].forEach((k) => { const c = cels[k]; c.classList.remove('pleine', 'attente'); c.children[c.children.length - 2].textContent = ''; c.lastChild.textContent = ''; });
            if (et[2]) {
              const p = pos(cels[et[1][0]]);
              bulle.textContent = et[2]; bulle.style.left = (p[0] + 10) + 'px'; bulle.style.top = (p[1] - 26) + 'px'; bulle.classList.add('vue');
            }
            await attendre(1300);
            bulle.classList.remove('vue');
          }
        }
        await attendre(1200);
      }
    }
    jouer();
    const fermer = () => {
      tutoJeton++;
      fermerVoile('voile-tuto');
      $('btn-tuto-ok').onclick = null;
      $('voile-tuto').onclick = null;
      apres();
    };
    $('btn-tuto-ok').onclick = (ev) => { ev.stopPropagation(); audio(); sons.clic(); fermer(); };
    $('voile-tuto').onclick = () => { audio(); fermer(); };
  }

  // ---------------------------------------------------------------------
  //  Boutons et démarrage
  // ---------------------------------------------------------------------

  let boutonEffacer = null;

  $('btn-jouer').addEventListener('click', () => {
    audio(); sons.clic();
    window.JEL_SAVE.reprise({
      jeu: JEU,
      onContinuer: (d) => { const n = entier(d && d.niveau, 1, NIVEAUX.length, 1); prog.debloque = Math.max(prog.debloque, n); demarrerNiveau(n); },
      onNouvelle: () => demarrerNiveau(1),
      onEffacer: () => { remettreAZero(); majTitre(); }
    });
  });
  $('btn-multi').addEventListener('click', () => { audio(); sons.clic(); lancerEnLigne(); });
  $('btn-niveaux').addEventListener('click', () => { audio(); sons.clic(); ouvrirNiveaux(); });
  $('btn-codex').addEventListener('click', () => { audio(); sons.clic(); ouvrirCodex(); });
  $('niv-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  $('codex-retour').addEventListener('click', () => { audio(); sons.clic(); afficherEcran('titre'); });
  document.querySelectorAll('.btn-son').forEach((b) => b.addEventListener('click', basculerSon));
  $('btn-pause').addEventListener('click', () => { audio(); sons.clic(); ouvrirPause(); });
  $('btn-reprendre').addEventListener('click', () => { sons.clic(); fermerPause(); });
  $('btn-recommencer').addEventListener('click', () => { sons.clic(); enPause = false; fermerVoile('voile-pause'); if (partie) partie.pause(false); demarrerNiveau(niveau); });
  $('btn-pause-niveaux').addEventListener('click', () => { sons.clic(); quitterPartie(); ouvrirNiveaux(); });
  $('btn-accueil').addEventListener('click', () => { sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-lancer').addEventListener('click', () => {
    audio();
    if (partie && !lancement && partie.lancerManche()) { lancement = true; sons.clic(); majSalon(); }
  });
  $('btn-salon-quitter').addEventListener('click', () => { audio(); sons.clic(); quitterPartie(); afficherEcran('titre'); });
  $('btn-ecrire').addEventListener('click', () => { audio(); ecrire(); });
  $('btn-changer').addEventListener('click', () => { audio(); changer(); });
  $('btn-rappel').addEventListener('click', () => { audio(); rappeler(); });
  $('btn-melange').addEventListener('click', () => { audio(); melanger(); });
  $('btn-souffle').addEventListener('click', () => { audio(); souffler(); });

  // Écran caché : pause automatique.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && ecran === 'jeu' && !enPause && !voileOuvert('voile-fin') && !salonOuvert() && !attenteTuto) ouvrirPause();
  });

  // Sauvegarde à la fermeture de la page, seulement pendant une nuit solo.
  window.JEL_SAVE.surFermeture(() => {
    if (enPartie && session === 'solo') sauver(niveau, vue && partie && partie.siege >= 0 ? vue.sc[partie.siege] : 0);
  });

  window.addEventListener('resize', () => { if (ecran === 'jeu') { ajusterPage(); majReserve(); } });

  document.title = tr('titre');
  chargerProgression();
  construirePlaces();
  majBoutonsSon();
  try { boutonEffacer = window.JEL_SAVE.boutonEffacer({ jeu: JEU, conteneur: $('place-effacer'), apres: () => { remettreAZero(); majTitre(); } }); } catch (e) { boutonEffacer = null; }
  afficherEcran('titre');
  // Ouvert par le bouton « Rejoindre » d'un ami (docs/consigne-amis.md) : directement
  // dans le salon de sa partie en ligne (le moteur la demande au serveur).
  if (window.JEL_MULTI && window.JEL_MULTI.invitation()) lancerEnLigne();
})();
</script>
