<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeux-en-ligne — mini-jeux à jouer partout</title>
  <meta name="description" content="Des mini-jeux gratuits, sans publicité, à jouer sur téléphone ou ordinateur.">
  <meta name="theme-color" content="#fff7ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17131f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <h1 class="marque">
      <img class="marque-logo" src="assets/logo.svg" alt="">
      <span>Jeux-en-ligne<small>Des mini-jeux à jouer partout, sans publicité</small></span>
    </h1>

    <label class="recherche">
      <span class="sr-only">Chercher un jeu</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="recherche" type="search" placeholder="Chercher un jeu…" autocomplete="off" enterkeyhint="search">
    </label>
  </header>

  <nav class="barre-filtres" aria-label="Tri et filtres">
    <div class="barre-filtres-int">
      <div class="ligne-tri">
        <label class="tri">
          <span class="sr-only">Trier par</span>
          <svg class="tri-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>
          <select id="tri">
            <option value="notes">Mieux notés</option>
            <option value="votes">Plus populaires</option>
            <option value="semaine">Populaires cette semaine</option>
            <option value="nouveautes">Nouveautés</option>
          </select>
          <svg class="tri-fleche" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </label>
      </div>
      <div class="filtres">
        <div class="groupe-puces" id="genres" role="group" aria-label="Genres"></div>
        <span class="separateur" id="separateur" aria-hidden="true"></span>
        <div class="groupe-puces" id="etiquettes" role="group" aria-label="Thèmes"></div>
      </div>
    </div>
  </nav>

  <main class="catalogue">
    <div class="ligne-infos">
      <p class="compte" id="compte" aria-live="polite"></p>
      <div class="portee" id="portee" role="group" aria-label="Votes pris en compte" hidden>
        <button type="button" data-portee="monde" aria-pressed="true">Monde</button>
        <button type="button" data-portee="pays" aria-pressed="false">Mon pays</button>
      </div>
    </div>
    <p class="note-tri" id="note-tri" hidden></p>
    <ul class="grille" id="grille"></ul>
    <div class="vide" id="vide" hidden>
      <strong id="vide-titre">Aucun jeu trouvé</strong>
      <span id="vide-texte">Essaie un autre mot, un autre genre ou un autre thème.</span>
    </div>

    <section class="archives" id="archives" hidden aria-labelledby="archives-titre">
      <h2 id="archives-titre">Archives</h2>
      <p>Les jeux les moins appréciés. Tu peux quand même y jouer !</p>
      <ul class="grille" id="grille-archives"></ul>
    </section>
  </main>

  <footer class="pied">
    Jeux originaux, gratuits et sans publicité.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
