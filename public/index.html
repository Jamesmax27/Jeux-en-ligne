<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeux-en-ligne — mini-jeux à jouer partout</title>
  <meta name="description" content="Des mini-jeux gratuits, sans publicité, à jouer sur téléphone ou ordinateur.">
  <meta name="theme-color" content="#fff7ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17131f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <h1 class="marque">
      <img class="marque-logo" src="assets/logo.svg" alt="">
      <span>Jeux-en-ligne<small>Des mini-jeux à jouer partout, sans publicité</small></span>
    </h1>

    <label class="recherche">
      <span class="sr-only">Chercher un jeu</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="recherche" type="search" placeholder="Chercher un jeu…" autocomplete="off" enterkeyhint="search">
    </label>
  </header>

  <nav class="barre-filtres" aria-label="Filtres">
    <div class="barre-filtres-int">
      <div class="onglets" role="tablist" aria-label="Classement">
        <button class="onglet" role="tab" data-onglet="tous" aria-selected="true">Tous les jeux</button>
        <button class="onglet" role="tab" data-onglet="nouveautes" aria-selected="false">Nouveautés</button>
      </div>
      <div class="etiquettes" id="etiquettes" aria-label="Thèmes"></div>
    </div>
  </nav>

  <main class="catalogue">
    <p class="compte" id="compte" aria-live="polite"></p>
    <ul class="grille" id="grille"></ul>
    <div class="vide" id="vide" hidden>
      <strong id="vide-titre">Aucun jeu trouvé</strong>
      <span id="vide-texte">Essaie un autre mot ou un autre thème.</span>
    </div>
  </main>

  <footer class="pied">
    Jeux originaux, gratuits et sans publicité.
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
