    <clipPath id="planete"><circle cx="32" cy="33" r="15"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b1020"/>
  <g fill="#eceae4">
    <circle cx="13" cy="12" r="1" opacity=".6"/>
    <circle cx="52" cy="10" r="1.3" opacity=".8"/>
    <circle cx="55" cy="53" r="1" opacity=".5"/>
    <circle cx="9" cy="50" r=".8" opacity=".5"/>
  </g>
  <g transform="translate(32 32) scale(.84) translate(-32 -33)">
