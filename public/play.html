<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeu — Free Micro Games</title>
  <!-- Le lanceur n'est pas indexé : la page de chaque jeu proposée aux moteurs
       de recherche est sa fiche (/jeux/<id>/…, générée par scripts/pages-seo.mjs). -->
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <!-- Consentement aux cookies (Google Consent Mode v2, choix fait dans le bandeau
       des autres pages) puis mesure d'audience Google Analytics, chargée seulement
       si le visiteur a accepté. Jamais dans le cadre du jeu. -->
  <script src="consentement.js" defer></script>
  <script src="mesure.js" defer></script>
  <!-- Traductions : i18n/i18n.js (module commun), textes dans i18n/site/<langue>.json -->
  <script src="i18n/i18n.js" defer></script>
</head>
<body class="lanceur">
  <header class="barre-jeu">
    <!-- Retour : vers la fiche du jeu dans la langue choisie (play.js), sinon l'accueil. -->
    <a class="bouton-rond" id="retour" href="./" aria-label="Retour à la présentation du jeu" data-i18n-aria="jeu.retour">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 id="titre-jeu">Chargement…</h1>
    <!-- Votes : toucher le même pouce une 2e fois annule, toucher l'autre remplace.
         Pouces au trait ; le pouce de mon vote est rempli (style.css). -->
    <button class="bouton-rond bouton-vote" id="vote-plus" type="button" aria-label="J'aime ce jeu" data-i18n-aria="jeu.jaime" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10.5v9.5M7 10.5l3.4-6.2a1.9 1.9 0 0 1 3.6.9V9h4.4a2 2 0 0 1 2 2.4l-1.3 6.7a2.3 2.3 0 0 1-2.3 1.9H4.8A1.8 1.8 0 0 1 3 18.2v-5.9a1.8 1.8 0 0 1 1.8-1.8z"/></svg>
    </button>
    <button class="bouton-rond bouton-vote" id="vote-moins" type="button" aria-label="Je n'aime pas ce jeu" data-i18n-aria="jeu.jaimePas" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path transform="rotate(180 12 12)" d="M7 10.5v9.5M7 10.5l3.4-6.2a1.9 1.9 0 0 1 3.6.9V9h4.4a2 2 0 0 1 2 2.4l-1.3 6.7a2.3 2.3 0 0 1-2.3 1.9H4.8A1.8 1.8 0 0 1 3 18.2v-5.9a1.8 1.8 0 0 1 1.8-1.8z"/></svg>
    </button>
    <button class="bouton-rond" id="plein-ecran" type="button" aria-label="Plein écran" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <div class="scene" id="scene">
    <!--
      Le jeu tourne dans un cadre isolé : sandbox="allow-scripts" SANS allow-same-origin.
      Il ne peut donc ni lire les données du site, ni ouvrir d'autres pages.
      La langue du site lui est transmise par play.js (window.JEL_LANG) ; son
      bouton de langue demande au lanceur de le relancer dans une autre langue.
    -->
    <iframe id="cadre-jeu" title="Jeu" sandbox="allow-scripts allow-pointer-lock" allow="autoplay; fullscreen; gamepad" referrerpolicy="no-referrer"></iframe>

    <div class="message-jeu" id="message" hidden>
      <strong id="message-titre">Jeu introuvable</strong>
      <span id="message-texte">Ce jeu n'existe pas ou a été retiré.</span>
      <a class="bouton" href="./" data-i18n="jeu.voirTous">Voir tous les jeux</a>
    </div>

    <p class="info-vote" id="info-vote" role="status" hidden></p>
  </div>

  <script type="module" src="play.js"></script>
</body>
</html>
