<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jeu — Jeux-en-ligne</title>
  <meta name="theme-color" content="#2a2140">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="lanceur">
  <header class="barre-jeu">
    <a class="bouton-rond" href="./" aria-label="Retour au catalogue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 id="titre-jeu">Chargement…</h1>
    <!-- Phase 2 : les boutons pouce en l'air / pouce en bas viendront ici. -->
    <button class="bouton-rond" id="plein-ecran" type="button" aria-label="Plein écran" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <div class="scene" id="scene">
    <!--
      Le jeu tourne dans un cadre isolé : sandbox="allow-scripts" SANS allow-same-origin.
      Il ne peut donc ni lire les données du site, ni ouvrir d'autres pages.
    -->
    <iframe id="cadre-jeu" title="Jeu" sandbox="allow-scripts allow-pointer-lock" allow="autoplay; fullscreen; gamepad" referrerpolicy="no-referrer"></iframe>

    <div class="message-jeu" id="message" hidden>
      <strong id="message-titre">Jeu introuvable</strong>
      <span id="message-texte">Ce jeu n'existe pas ou a été retiré.</span>
      <a class="bouton" href="./">Voir tous les jeux</a>
    </div>
  </div>

  <script type="module" src="play.js"></script>
</body>
</html>
