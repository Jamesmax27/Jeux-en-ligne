# Formulaire « Nouvelle idée de jeu » (onglet Issues → New issue).
# Le workflow .github/workflows/idee-jeu.yml ajoute l'idée à idees.json
# puis ferme l'issue. Les libellés « ### … » sont lus par ce workflow :
# les modifier ensemble. Listes Genre et Univers : exactement les libellés de
# public/taxonomie.js, dans le même ordre (vérifié par scripts/controle-taxonomie.mjs).
# Le formulaire ne demande que le classement (genre, univers) et l'âge : les
# textes pour les moteurs de recherche (titre_seo, description_seo,
# presentation, regles, competences, jaquette_alt de game.json) sont rédigés
# par l'agent créateur d'après le jeu fini.

name: Nouvelle idée de jeu
description: Proposer un mini-jeu ; il est ajouté tout seul à la file d'idées.
labels: ["idee-jeu"]
body:
  - type: markdown
    attributes:
      value: |
        Le **titre** de la demande devient le titre du jeu (ex. « Memory de la ferme »).
        L'idée est ajoutée à `idees.json`, puis la demande se ferme toute seule.

        Rien à écrire pour Google : le titre et la description pour les moteurs de recherche, le texte de la page du jeu, les compétences travaillées et le texte de la vignette sont rédigés automatiquement d'après le jeu fini. Ici, il suffit de dire de quoi parle le jeu, son genre et l'âge conseillé.

  - type: textarea
    id: principe
    attributes:
      label: Principe du jeu
      description: En une ou deux phrases, ce que fait le joueur.
      placeholder: Retrouve les paires d'animaux de la ferme, avec de plus en plus de cartes.
    validations:
      required: true

  - type: dropdown
    id: genre
    attributes:
      label: Genre
      description: Comment on joue (liste fermée du site, filtres du catalogue).
      options:
        - Puzzle, logique et labyrinthes
        - Mémoire et observation
        - Quiz et culture
        - Mots et lettres
        - Calcul et nombres
        - Arcade et réflexes
        - Plateforme
        - Course
        - Aventure et jeu de rôle
        - Stratégie, défense et jeux de société
        - Simulation, soin et gestion
        - Habillage, dessin et construction
        - Musique et rythme
        - Autre
    validations:
      required: true

  - type: dropdown
    id: age
    attributes:
      label: Âge conseillé
      options: ["4+", "5+", "6+", "7+", "8+", "10+", "12+"]
      default: 2
    validations:
      required: true

  - type: dropdown
    id: univers
    attributes:
      label: Univers
      description: Facultatif. De quoi parle le jeu ; 2 univers au plus. Rien de coché = l'agent les choisit.
      multiple: true
      options:
        - Animaux
        - Chevaux
        - Dinosaures et préhistoire
        - Océan et pirates
        - Nature et saisons
        - Magie et monstres
        - Espace et robots
        - Monde et histoire
        - Ville et métiers
        - Véhicules
        - Sport
        - Cuisine et nourriture
        - Autre

  - type: input
    id: competences
    attributes:
      label: Compétences travaillées
      description: Facultatif. Quelques mots, séparés par des virgules ; ce n'est qu'une indication, le texte final est rédigé d'après le jeu fini.
      placeholder: mémoire visuelle, concentration
    validations:
      required: false

  - type: checkboxes
    id: priorite
    attributes:
      label: Priorité
      options:
        - label: Le fabriquer cette nuit en priorité
