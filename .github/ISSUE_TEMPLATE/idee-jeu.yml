# Formulaire « Nouvelle idée de jeu » (onglet Issues → New issue).
# Le workflow .github/workflows/idee-jeu.yml ajoute l'idée à idees.json
# puis ferme l'issue. Les libellés « ### … » sont lus par ce workflow :
# les modifier ensemble. Listes Genre et Univers : exactement les libellés de
# public/taxonomie.js, dans le même ordre (vérifié par scripts/controle-taxonomie.mjs).

name: Nouvelle idée de jeu
description: Proposer un mini-jeu ; il est ajouté tout seul à la file d'idées.
labels: ["idee-jeu"]
body:
  - type: markdown
    attributes:
      value: |
        Le **titre** de la demande devient le titre du jeu (ex. « Memory de la ferme »).
        L'idée est ajoutée à `idees.json`, puis la demande se ferme toute seule.

  - type: textarea
    id: principe
    attributes:
      label: Principe du jeu
      description: En une ou deux phrases, ce que fait le joueur.
      placeholder: Retrouve les paires d'animaux de la ferme, avec de plus en plus de cartes.
    validations:
      required: true

  - type: dropdown
    id: genre
    attributes:
      label: Genre
      description: Comment on joue (liste fermée du site, filtres du catalogue).
      options:
        - Puzzle et logique
        - Mémoire
        - Quiz et culture
        - Mots et lettres
        - Calcul et nombres
        - Réflexes et clic rapide
        - Arcade
        - Plateforme
        - Course
        - Sport
        - Tir et visée
        - Combat
        - Labyrinthe
        - Aventure et exploration
        - Objets cachés et observation
        - Stratégie
        - Défense de tour
        - Gestion et tycoon
        - Simulation et soin
        - Habillage et création
        - Bac à sable et construction
        - Musique et rythme
        - Jeux de société et de cartes
        - Coloriage et dessin
        - Jeu de rôle et progression
        - Autre
    validations:
      required: true

  - type: dropdown
    id: age
    attributes:
      label: Âge conseillé
      options: ["4+", "5+", "6+", "7+", "8+", "10+", "12+"]
      default: 2
    validations:
      required: true

  - type: dropdown
    id: univers
    attributes:
      label: Univers
      description: Facultatif. De quoi parle le jeu ; 2 univers au plus. Rien de coché = l'agent les choisit.
      multiple: true
      options:
        - Ferme
        - Chevaux
        - Animaux de compagnie
        - Animaux sauvages
        - Dinosaures et préhistoire
        - Océan
        - Espace
        - Fantasy et magie
        - Chevaliers et Moyen Âge
        - Pirates
        - Monstres et créatures
        - Robots et futur
        - Nature et jardin
        - Cuisine et nourriture
        - Véhicules
        - Sport
        - Monde et pays
        - Histoire
        - Corps humain et santé
        - Ville et métiers
        - Saisons et fêtes
        - Contes et légendes
        - Abstrait
        - Autre

  - type: checkboxes
    id: priorite
    attributes:
      label: Priorité
      options:
        - label: Le fabriquer cette nuit en priorité
