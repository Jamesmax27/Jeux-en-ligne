# ==========================================================================
# Correction d'un jeu proposé : un commentaire contenant « @claude » dans
# une pull request (auteurs autorisés : Jamesmax27, celest27) demande à
# l'agent de modifier le jeu de cette pull request.
#
#  1. Vérifications : pull request ouverte, venant de ce dépôt, qui ne
#     concerne qu'un seul jeu (games/<id>/).
#  2. L'agent applique la demande, puis se teste (3 corrections au maximum).
#     Si le jeu change, il met à jour ses textes de référencement dans les
#     5 langues (i18n-jeu/<id>/*.json → scripts/i18n-jeu.mjs --meta).
#  3. Garde-fou : seul games/<id>/ peut changer.
#  4. Jaquette automatique refaite + contrôle final dans un vrai navigateur,
#     traductions et référencement (scripts/verifier-seo.mjs : bloquant pour
#     un jeu de la boucle ou ajouté depuis REGLES_SEO_DEPUIS, sinon indicatif).
#  5. Si tout passe : correction poussée sur la branche de la pull request.
#     Dans tous les cas : réponse en commentaire.
#  6. Pull request de la boucle (nouveau-jeu/…) : l'étiquette « valide » est
#     retirée après une correction ajoutée, pour que la boucle de nuit
#     (boucle-de-nuit.yml) la revérifie à son prochain passage.
# ==========================================================================

name: Corriger un jeu

on:
  issue_comment:
    types: [created]

jobs:
  preparer:
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["Jamesmax27", "celest27"]'), github.event.comment.user.login) &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      ok: ${{ steps.pr.outputs.ok }}
      id: ${{ steps.pr.outputs.id }}
      branche: ${{ steps.pr.outputs.branche }}
      publie: ${{ steps.pr.outputs.publie }}
    env:
      GH_TOKEN: ${{ github.token }}
      NUMERO: ${{ github.event.issue.number }}

    steps:
      - name: Accuser réception (👀 sur le commentaire)
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=eyes > /dev/null

      - name: Lire la pull request
        id: pr
        run: |
          set -euo pipefail
          pr=$(gh pr view "$NUMERO" --repo "$GITHUB_REPOSITORY" --json state,headRefName,isCrossRepository,files)
          ids=$(jq -r '.files[].path' <<<"$pr" | { grep -E '^games/[a-z0-9-]+/' || true; } | cut -d/ -f2 | sort -u)
          nb=$(grep -c . <<<"$ids" || true)
          probleme=""
          if [ "$(jq -r .state <<<"$pr")" != "OPEN" ]; then probleme="elle n'est plus ouverte."
          elif [ "$(jq -r .isCrossRepository <<<"$pr")" = "true" ]; then probleme="elle vient d'un autre dépôt."
          elif [ "$nb" -ne 1 ]; then probleme="elle doit concerner exactement un jeu (dossiers games/ touchés : $nb)."
          fi
          if [ -n "$probleme" ]; then
            gh pr comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body "Je ne peux pas corriger cette pull request : $probleme"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Déjà publié sur main ? Alors toute modification du jeu augmente sa version.
          publie=false
          if gh api "repos/$GITHUB_REPOSITORY/contents/games/$ids/game.json?ref=main" > /dev/null 2>&1; then publie=true; fi
          { echo "ok=true"; echo "id=$ids"; echo "branche=$(jq -r .headRefName <<<"$pr")"; echo "publie=$publie"; } >> "$GITHUB_OUTPUT"

  corriger:
    needs: preparer
    if: needs.preparer.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Une correction à la fois par pull request.
    concurrency:
      group: corriger-jeu-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write          # retirer l'étiquette « valide »
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NUMERO: ${{ github.event.issue.number }}
      ID: ${{ needs.preparer.outputs.id }}
      BRANCHE: ${{ needs.preparer.outputs.branche }}

    steps:
      - name: Récupérer la branche de la pull request
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preparer.outputs.branche }}
          fetch-depth: 1

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer le navigateur de test
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: L'agent applique la demande
        uses: anthropics/claude-code-action@v1
        with:
          # Abonnement Claude (jeton créé avec « claude setup-token »), comme boucle-de-nuit.yml.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: |
            --max-turns 120
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(node scripts/validate-games.mjs:*),Bash(node scripts/check-i18n.js:*),Bash(node scripts/i18n-jeu.mjs --meta:*),Bash(node scripts/regles-seo.mjs:*),Bash(node scripts/verifier-seo.mjs:*)"
          prompt: |
            Tu es le développeur de jeux du site Free Micro Games. Le propriétaire demande une correction
            du jeu games/${{ needs.preparer.outputs.id }}/ (pull request #${{ github.event.issue.number }}).

            La demande :
            <<<
            ${{ github.event.comment.body }}
            >>>

            1. Lis CLAUDE.md, puis CONSIGNES-JEU.md (règles obligatoires), puis
               games/${{ needs.preparer.outputs.id }}/index.html et game.json.
            2. Applique la demande au jeu en respectant CONSIGNES-JEU.md. Si une partie de la demande
               est contraire aux consignes ou impossible, ne l'applique pas et explique pourquoi dans le résumé.
            3. Ce jeu est déjà publié sur le site : ${{ needs.preparer.outputs.publie == 'true' && 'oui' || 'non' }}.
               S'il l'est et que tu modifies index.html, augmente "version" de 1 dans game.json.
               Sinon, ne change pas "version".
            4. Lance : node scripts/validate-games.mjs --browser ${{ needs.preparer.outputs.id }}
               Corrige toutes les erreurs et relance jusqu'à « Tout est bon ». 3 tentatives de correction au maximum.
               Pour voir le jeu sur téléphone : node scripts/validate-games.mjs --jouer ${{ needs.preparer.outputs.id }}
               (captures dans captures/${{ needs.preparer.outputs.id }}/, à regarder avec Read).
               Avant de terminer, vérifie que le jeu respecte toujours la grille de validation (CONSIGNES-JEU.md, section 7).
               Langues : tout texte ajouté ou modifié dans le jeu l'est dans les 5 langues du bloc jel-i18n-textes de
               index.html (fr, en, es, pt, de ; aucun texte en dur). Lance :
               node scripts/check-i18n.js ${{ needs.preparer.outputs.id }} --sans-site jusqu'à « Traductions : tout est bon ».
            5. Textes de la fiche et de la page du jeu : title, description et textes de référencement (titre_seo,
               description_seo, presentation, regles, competences, jaquette_alt ; règles : CONSIGNES-JEU.md et
               scripts/regles-seo.mjs). Si le jeu change (règles, gestes ou touches, niveaux, univers, écran titre…)
               ou si la demande les concerne, mets-les à jour dans les 5 langues : ils restent fidèles au code (nombre
               réel de niveaux, gestes au doigt ET touches du clavier, étoiles, âge de "ages"), sans marque, sans
               formule passe-partout, sans promesse fausse. Bornes, dans chaque langue : titre_seo 50 à 60 caractères,
               description_seo 140 à 160, presentation 70 à 150 mots, regles 50 à 130 mots, competences 2 à 4
               compétences séparées par des virgules (20 à 160 caractères), jaquette_alt 40 à 125 caractères (ce que
               montre l'écran titre, d'après lequel la jaquette est refaite).
               - Ne les modifie jamais directement dans game.json : écris les champs à changer dans
                 i18n-jeu/${{ needs.preparer.outputs.id }}/fr.json, en.json, es.json, pt.json et de.json, sous la forme
                 {"meta": {"champ": "…"}} (un champ absent ne change pas ; pars des textes actuels de game.json :
                 français à la racine, traductions dans "i18n").
               - Puis lance : node scripts/i18n-jeu.mjs --meta ${{ needs.preparer.outputs.id }}
                 (il les range dans game.json et pose "maj", la date de modification ; index.html n'est pas touché),
                 puis : node scripts/regles-seo.mjs ${{ needs.preparer.outputs.id }} jusqu'à « Textes SEO : tout est bon »,
                 et enfin : node scripts/verifier-seo.mjs ${{ needs.preparer.outputs.id }} (il construit le site et
                 contrôle la page du jeu) jusqu'à « Référencement : tout est bon » ; les lignes « attention » qui ne
                 concernent pas ce jeu sont à ignorer.
               Un jeu ancien qui n'a pas encore ces textes : ne les écris que si la demande le prévoit.
            6. Écris dans resume-correction.md (à la racine du dépôt) un résumé en français pour le propriétaire :
               3 à 6 puces courtes sur ce qui a changé, puis ce qu'il faut vérifier en jouant.

            Interdits : modifier un autre fichier que ceux de games/${{ needs.preparer.outputs.id }}/,
            i18n-jeu/${{ needs.preparer.outputs.id }}/ et resume-correction.md ; toucher à la jaquette (elle est
            refaite automatiquement) ; utiliser la moindre ressource Internet dans le jeu ; modifier idees.json,
            idees-archive.json ou le champ "idee" de game.json.

      - name: Vérifier ce que l'agent a modifié
        id: garde
        run: |
          set -euo pipefail
          # Pages générées (dans .gitignore) suivies par git par erreur, réécrites par le build de l'agent : remises
          # comme sur la branche, ce n'est pas une modification de l'agent.
          git ls-files -ci --exclude-standard -z | xargs -0 -r git checkout --
          git status --porcelain --untracked-files=all > "$RUNNER_TEMP/modifs.txt"
          cat "$RUNNER_TEMP/modifs.txt"
          # Seuls games/<id>/ et le résumé de l'agent peuvent changer.
          if grep -v -E "^.. games/$ID/|^\?\? resume-correction\.md$" "$RUNNER_TEMP/modifs.txt"; then
            echo "::error::L'agent a modifié des fichiers non autorisés (liste ci-dessus)."
            exit 1
          fi
          # Le résumé sert à la réponse, il n'est pas enregistré dans le dépôt.
          if [ -f resume-correction.md ]; then mv resume-correction.md "$RUNNER_TEMP/resume.md"; fi
          if grep -q -E "^.. games/$ID/" "$RUNNER_TEMP/modifs.txt"; then modifie=true; else modifie=false; fi
          echo "modifie=$modifie" >> "$GITHUB_OUTPUT"

      - name: Refaire la jaquette + contrôle final
        id: controle
        if: steps.garde.outputs.modifie == 'true'
        run: |
          # La jaquette automatique (cover.jpg) est refaite ; une jaquette faite à la main est gardée.
          rm -f "games/$ID/cover.jpg"
          if node scripts/validate-games.mjs --browser --covers "$ID" > "$RUNNER_TEMP/rapport.txt" 2>&1 \
             && node scripts/check-i18n.js "$ID" --sans-site >> "$RUNNER_TEMP/rapport.txt" 2>&1; then
            valide=true
          else
            valide=false
          fi
          # Référencement : site construit avec ce jeu, puis ses textes et sa page contrôlés (scripts/verifier-seo.mjs).
          # Le rapport en garde les erreurs, les remarques sur ce jeu et le bilan (les « attention » des autres
          # jeux, nombreuses, sont laissées de côté).
          echo "Référencement :" >> "$RUNNER_TEMP/rapport.txt"
          code=0
          node scripts/verifier-seo.mjs "$ID" > "$RUNNER_TEMP/seo.txt" 2>&1 || code=$?
          {
            grep -E '^ERREUR :' "$RUNNER_TEMP/seo.txt" | head -n 60
            grep -E '^attention :' "$RUNNER_TEMP/seo.txt" | grep -F -- "$ID" | head -n 20
            grep -E "^(Panne|Référencement : tout est bon|[0-9]+ erreur\(s\) à corriger)" "$RUNNER_TEMP/seo.txt" | tail -n 3
          } >> "$RUNNER_TEMP/rapport.txt"
          # Erreurs bloquantes pour un jeu de la boucle (sa vérification le refuserait) ou ajouté depuis
          # REGLES_SEO_DEPUIS (scripts/regles-seo.mjs : il ne serait pas publié) ; pour un jeu plus ancien, sa page
          # reste seulement hors des moteurs de recherche : simple information. Panne de l'outil : jamais bloquante.
          case "$BRANCHE" in
            nouveau-jeu/*) soumis=oui ;;
            *) soumis=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; import { REGLES_SEO_DEPUIS } from './scripts/regles-seo.mjs'; const j = JSON.parse(readFileSync('games/' + process.env.ID + '/game.json', 'utf8').replace(/^﻿/, '')); console.log(String(j.added || '') >= REGLES_SEO_DEPUIS ? 'oui' : 'non');" || echo oui) ;;
          esac
          case "$code" in
            0) seo=ok ;;
            1) seo=erreurs; if [ "$soumis" = oui ]; then valide=false; else seo=indicatif; fi ;;
            *) seo=panne ;;
          esac
          { echo "valide=$valide"; echo "seo=$seo"; } >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/rapport.txt"

      - name: Pousser la correction sur la branche
        if: steps.controle.outputs.valide == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "games/$ID"
          git commit -m "Correction du jeu $ID (demande dans la PR #$NUMERO)"
          git push origin "HEAD:refs/heads/$BRANCHE"

      # Pull request de la boucle : après une correction, elle doit être revérifiée par la boucle de nuit.
      - name: Retirer l'étiquette « valide »
        if: startsWith(needs.preparer.outputs.branche, 'nouveau-jeu/') && steps.controle.outputs.valide == 'true'
        run: gh pr edit "$NUMERO" --repo "$GITHUB_REPOSITORY" --remove-label valide || true

      - name: Répondre dans la pull request
        env:
          MODIFIE: ${{ steps.garde.outputs.modifie }}
          VALIDE: ${{ steps.controle.outputs.valide }}
          SEO: ${{ steps.controle.outputs.seo }}
          RELANCE: ${{ startsWith(needs.preparer.outputs.branche, 'nouveau-jeu/') && steps.controle.outputs.valide == 'true' }}
        run: |
          {
            if [ "$MODIFIE" != "true" ]; then
              echo "Je n'ai rien modifié dans \`games/$ID/\`."
            elif [ "$VALIDE" = "true" ]; then
              echo "✅ Correction ajoutée à la pull request. L'aperçu Cloudflare se met à jour dans quelques minutes."
            else
              echo "⚠️ Correction **non ajoutée** : le contrôle qualité échoue encore (rapport ci-dessous). Précise ta demande, ou corrige à la main."
            fi
            # Référencement non bloquant (jeu ancien) ou contrôle interrompu : signalé à part.
            case "$SEO" in
              indicatif) echo; echo "ℹ️ Textes de référencement non conformes (rapport ci-dessous) : sans effet sur la publication de ce jeu ancien, mais sa page reste hors des moteurs de recherche." ;;
              panne) echo; echo "ℹ️ Contrôle du référencement interrompu (panne de scripts/verifier-seo.mjs) : il n'a pas bloqué la correction." ;;
            esac
            if [ "$RELANCE" = "true" ]; then
              echo
              echo "🔁 La boucle de nuit revérifiera ce jeu à son prochain passage (ou tout de suite : onglet Actions → « Créer des jeux (boucle de nuit) » → nombre de jeux 0)."
            fi
            echo
            if [ -s "$RUNNER_TEMP/resume.md" ]; then cat "$RUNNER_TEMP/resume.md"; else echo "_(pas de résumé de l'agent)_"; fi
            if [ -f "$RUNNER_TEMP/rapport.txt" ]; then
              echo
              echo "<details><summary>Contrôle qualité</summary>"
              echo
              echo '```'
              cat "$RUNNER_TEMP/rapport.txt"
              echo '```'
              echo "</details>"
            fi
          } > "$RUNNER_TEMP/reponse.md"
          gh pr comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/reponse.md"

      - name: Signaler un échec
        if: failure()
        run: >-
          gh pr comment "$NUMERO" --repo "$GITHUB_REPOSITORY" --body
          "❌ La correction a échoué ou a été bloquée par le garde-fou : rien n'a été ajouté à la pull request.
          Détails : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
