# ==========================================================================
# Idées de jeux depuis le téléphone : une issue ouverte avec le formulaire
# « Nouvelle idée de jeu » (étiquette idee-jeu) est ajoutée à idees.json
# (source « humain », statut « en_attente »), enregistrée sur main, puis
# l'issue reçoit une confirmation et se ferme.
#
#  - Case « priorité » cochée : en tête de la file, donc fabriquée au
#    prochain passage de la boucle de nuit (boucle-de-nuit.yml).
#  - Sinon : à la fin de la file (les idées humaines passent toujours avant
#    celles de l'agent).
#  - Contrôles (genre, doublons…) : scripts/idees.mjs ajouter-humain.
#  - Seules les issues du propriétaire et des collaborateurs sont traitées :
#    la file est lue par les agents de nuit.
# ==========================================================================

name: Idée de jeu

on:
  issues:
    types: [opened]

# Une idée à la fois : deux envois rapprochés ne se marchent pas dessus.
concurrency:
  group: idee-jeu
  cancel-in-progress: false

jobs:
  ajouter:
    if: >-
      contains(github.event.issue.labels.*.name, 'idee-jeu') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write

    steps:
      - name: Récupérer main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ajouter l'idée, enregistrer et répondre
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const FICHIER = 'idees.json';

            // Commentaire sous l'issue, puis fermeture si l'idée est traitée.
            const repondre = async (texte, fermer) => {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: texte });
              if (fermer) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
            };

            // Réponses du formulaire : rubriques « ### Libellé » suivies de la valeur.
            const reponses = {};
            for (const bloc of (issue.body || '').split(/^###\s+/m).slice(1)) {
              const [libelle, ...reste] = bloc.split(/\r?\n/);
              const valeur = reste.join(' ').trim();
              reponses[libelle.trim()] = valeur === '_No response_' ? '' : valeur;
            }
            const champs = {
              TITRE: issue.title || '',
              PRINCIPE: reponses['Principe du jeu'] || '',
              GENRE: reponses['Genre'] || '',
              AGE: reponses['Âge conseillé'] || '',
              THEMES: reponses['Thèmes'] || '',
              PRIORITE: /\[x\]/i.test(reponses['Priorité'] || '') ? 'oui' : 'non',
            };

            // Ajout par scripts/idees.mjs, puis commit sur main. Si main a bougé entre-temps
            // (la boucle de nuit vient d'enregistrer), l'ajout est refait sur la nouvelle version.
            const git = (...args) => exec.exec('git', args);
            let r;
            try {
              await git('config', 'user.name', 'github-actions[bot]');
              await git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com');
              for (let essai = 1; ; essai++) {
                await git('fetch', '--depth=1', 'origin', 'main');
                await git('reset', '--hard', 'FETCH_HEAD');
                const { stdout } = await exec.getExecOutput('node', ['scripts/idees.mjs', 'ajouter-humain'], { env: { ...process.env, ...champs } });
                r = JSON.parse(stdout.trim().split('\n').pop());
                if (r.resultat !== 'ajoutee') break;
                // [CF-Pages-Skip] : Cloudflare Pages ne reconstruit pas le site pour une idée.
                await git('commit', '-q', '-m', `Idée de jeu : ${r.titre} (#${issue.number}) [CF-Pages-Skip]`, '--', FICHIER);
                const envoi = await exec.exec('git', ['push', 'origin', 'HEAD:main'], { ignoreReturnCode: true });
                if (envoi === 0) break;
                if (essai === 3) throw new Error('main a bougé trois fois de suite');
              }
            } catch (e) {
              await repondre("L'enregistrement a échoué : l'idée n'a pas été ajoutée. Détails dans l'onglet Actions → « Idée de jeu ».", false);
              throw e;
            }

            if (r.resultat === 'invalide') {
              return repondre(`Je n'ai pas pu lire cette idée (${r.message}) : rien n'a été ajouté. Ouvre une nouvelle demande avec le formulaire « Nouvelle idée de jeu ».`, false);
            }
            if (r.resultat === 'doublon') return repondre(`Rien n'a été ajouté : ${r.message}.`, true);

            const lien = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/${FICHIER}`;
            // La boucle de nuit fabrique 5 idées par passage, deux passages par nuit.
            const place = r.avant < 5
              ? 'Elle sera fabriquée au prochain passage de la boucle de nuit (vers 1 h ou 6 h du matin).'
              : `${r.avant} idée${r.avant > 1 ? 's passent' : ' passe'} avant elle (5 idées par passage, deux passages par nuit).`;
            await repondre([
              `✅ Idée ajoutée à [${FICHIER}](${lien}) :`, '',
              `**${r.titre}** — ${r.description}`,
              `Genre : ${r.genre} ; thèmes : ${r.tags.length ? r.tags.join(', ') : "choisis par l'agent"}.`, '',
              place,
            ].join('\n'), true);
