# ==========================================================================
# Robot de contrôle : vérifie chaque pull request qui touche les jeux, les
# textes du site, la taxonomie, les pages du site et leur référencement ou
# les outils de contrôle (proposée par vous, un autre agent ou une autre IA).
#
# Il ne fait que ce qui est utile pour ce qui a changé :
#   - jeux modifiés          → ces jeux dans le navigateur (validate-games,
#                              tester-sauvegarde), genres et univers, traductions, référencement
#                              (seules les erreurs de ces jeux bloquent) ;
#   - outils de contrôle     → TOUS les jeux dans le navigateur (un outil
#     modifiés                 modifié peut changer le verdict de chaque jeu),
#                              référencement de tout le site ;
#   - textes du site,        → genres et univers, traductions du site (accueil,
#     taxonomie, gabarits      fiche, catégorie, lanceur et mentions ouverts
#     (textes des catégories   dans les 5 langues, avec un seul jeu) et
#     compris), générateur     référencement de tout le site, sans tester
#     des pages ou pages du    tous les jeux ;
#     site modifiés
#   - règles ou vérificateur → référencement de tout le site (rapide, sans
#     du référencement         navigateur), sans tester tous les jeux ;
#   - style.css ou icônes    → seulement le contrôle du bloc d'icônes généré
#                              (rapide, sans navigateur) ;
#   - fonctions Cloudflare,  → tests des demandes publiques et des votes
#     formulaire public ou     (scripts/tester-demandes.mjs : rapide, sans
#     modération IA            navigateur ni réseau) ;
#   - fonctions Cloudflare,  → tests des statistiques de jeu (scripts/tester-stats.mjs :
#     suivi des parties        collecte, calcul par jour, onglet « Stats » ; avec le
#     (suivi.js, play.js)      lanceur dans le navigateur si suivi.js ou play.js changent).
#   - profil joueur          → tests du profil (scripts/tester-profil.mjs : code de
#     (fonctions, réglages,    sauvegarde, expérience, étoiles, anti-triche, classement ;
#     Worker, amis)            sans navigateur ni réseau) et des amis (scripts/tester-amis.mjs :
#                              amitiés, présence, classement entre amis, docs/consigne-amis.md) ;
#   - multijoueur (Worker,   → parties simulées, Worker avec de faux Durable Objects et jeux
#     moteur, lanceur ou jeu   multijoueurs dans le lanceur (scripts/tester-multijoueur.mjs
#     multijoueur)             --navigateur, docs/multijoueur.md) ; moteur modifié : les jeux
#                              multijoueurs passent aussi au robot.
# Le reste (documentation, autres fichiers du site…) ne déclenche rien.
#
# Trois jobs : « quoi » (ce qui a changé), « jeux » (les jeux dans le
# navigateur, partagés entre 4 machines au plus qui travaillent en même temps :
# robot, sauvegarde, traductions des jeux ; un jeu prend environ 50 s, d'où
# environ 15 min au lieu d'une heure quand tous les jeux sont contrôlés), puis
# « controle » (site, référencement, fonctions) qui donne le verdict
# d'ensemble : c'est lui qu'il faut rendre obligatoire dans la protection de main.
#
# Navigateur : le Google Chrome déjà installé sur les machines de GitHub
# (CHROMIUM_PATH), sans télécharger Chromium à chaque fois ; Chromium de
# Playwright seulement si Chrome est absent.
# ==========================================================================

name: Contrôle des jeux

on:
  pull_request:
    paths:
      - "games/**"
      - "public/i18n/**"
      - "public/save.js"
      - "public/taxonomie.js"
      - "public/style.css"
      - "public/chemins.js"
      - "public/app.js"
      - "public/langue.js"
      - "public/play.html"
      - "public/play.js"
      - "public/suivi.js"
      - "public/idees/**"
      - "public/sw.js"
      - "public/_headers"
      - "public/consentement.js"
      - "public/mesure.js"
      - "public/pub.js"
      - "public/votes.js"
      - "public/turnstile.js"
      - "public/proposer.js"
      - "public/demandes-regles.js"
      - "public/multijoueur/**"
      - "multijoueur/**"
      - "functions/**"
      - "gabarits/**"
      - "idees.json"
      - "idees-archive.json"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/validate.yml"
      - "scripts/validate-games.mjs"
      - "scripts/controle-taxonomie.mjs"
      - "scripts/check-i18n.js"
      - "scripts/i18n-jeu.mjs"
      - "scripts/tester-sauvegarde.mjs"
      - "scripts/jaquette-sans-texte.mjs"
      - "scripts/icones/**"
      - "scripts/build-catalog.mjs"
      - "scripts/pages-seo.mjs"
      - "scripts/regles-seo.mjs"
      - "scripts/verifier-seo.mjs"
      - "scripts/moderation.mjs"
      - "scripts/tester-demandes.mjs"
      - "scripts/tester-stats.mjs"
      - "scripts/tester-profil.mjs"
      - "scripts/tester-amis.mjs"
      - "scripts/d1-local.mjs"
      - "scripts/etoiles-jeu.mjs"
      - "public/profil*.js"
      - "public/classement.js"
      - "public/amis*.js"
      - "scripts/multijoueur.mjs"
      - "scripts/tester-multijoueur.mjs"
      - "schema.sql"
      - "migrations/**"
  workflow_dispatch:

jobs:
  # 1. Ce qui a changé, et donc ce qu'il faut contrôler (quelques secondes).
  quoi:
    # Pas pour les pull requests de la boucle de nuit (robot github-actions[bot],
    # branches nouveau-jeu/…) : la boucle contrôle déjà ces jeux avant de fusionner.
    # (Le déclencheur pull_request ne sait pas filtrer sur l'auteur ni sur la
    # branche de la pull request : le tri ne peut se faire qu'ici.)
    if: ${{ !(github.event.pull_request.user.login == 'github-actions[bot]' && startsWith(github.head_ref, 'nouveau-jeu/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ids: ${{ steps.quoi.outputs.ids }}
      tous: ${{ steps.quoi.outputs.tous }}
      site: ${{ steps.quoi.outputs.site }}
      seo: ${{ steps.quoi.outputs.seo }}
      navigateur: ${{ steps.quoi.outputs.navigateur }}
      demandes: ${{ steps.quoi.outputs.demandes }}
      stats: ${{ steps.quoi.outputs.stats }}
      multi: ${{ steps.quoi.outputs.multi }}
      profil: ${{ steps.quoi.outputs.profil }}
      jeux: ${{ steps.quoi.outputs.jeux }}
      lots: ${{ steps.quoi.outputs.lots }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      #   ids        jeux modifiés (vide : aucun) ;
      #   tous       1 = tous les jeux dans le navigateur (outils modifiés, ou lancement à la main) ;
      #   site       1 = textes du site, taxonomie, gabarits, générateur des pages
      #                  (pages-seo, build-catalog) ou pages du site modifiés ;
      #   seo        1 = référencement de tout le site (0 : seulement celui des jeux modifiés) ;
      #   navigateur 1 = un test du site dans le navigateur est utile (job « controle ») ;
      #   jeux       jeux à tester dans le navigateur (tous, ou les jeux modifiés) ;
      #   lots       machines qui se partagent ces jeux, en JSON (« [0,1,2,3] », « [] » : aucune).
      - name: Voir ce qui a changé
        id: quoi
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            fichiers=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            fichiers=""
          fi
          # (bash de GitHub : -e et pipefail ; d'où « || true » et les « if » plutôt que « && ».)
          ids=$(printf '%s\n' "$fichiers" | { grep '^games/' || true; } | cut -d/ -f2 | sort -u | while read -r id; do if [ -n "$id" ] && [ -d "games/$id" ]; then echo "$id"; fi; done | tr '\n' ' ')
          # Moteur multijoueur (recopié dans chaque jeu multijoueur) : ces jeux passent aussi au robot.
          if printf '%s\n' "$fichiers" | grep -q '^public/multijoueur/moteur\.js$'; then
            ids=$(printf '%s\n' $ids $( (grep -l '"multijoueur": *true' games/*/game.json || true) | cut -d/ -f2) | sort -u | tr '\n' ' ')
          fi
          # Multijoueur : Worker, moteur, lanceur, outils, ou un jeu multijoueur modifié.
          multi=0
          if [ "${{ github.event_name }}" != "pull_request" ]; then multi=1; fi
          if printf '%s\n' "$fichiers" | grep -Eq '^(public/multijoueur/|multijoueur/|scripts/(multijoueur|tester-multijoueur)\.mjs$|public/play\.js$)'; then multi=1; fi
          for id in $ids; do if grep -q '"multijoueur": *true' "games/$id/game.json" 2>/dev/null; then multi=1; fi; done
          tous=0
          if [ "${{ github.event_name }}" != "pull_request" ]; then tous=1; fi
          # Modules communs de traduction et de sauvegarde : recopiés dans chaque jeu, donc tous les jeux sont concernés.
          if printf '%s\n' "$fichiers" | grep -Eq '^(scripts/(validate-games\.mjs|controle-taxonomie\.mjs|check-i18n\.js|i18n-jeu\.mjs|jaquette-sans-texte\.mjs|tester-sauvegarde\.mjs)|public/i18n/i18n\.js|public/save\.js|\.github/workflows/validate\.yml)$'; then tous=1; fi
          # Textes, taxonomie, gabarits (textes des catégories compris), générateur
          # des pages et pages du site : le site est testé avec un seul jeu.
          site=0
          if printf '%s\n' "$fichiers" | grep -Eq '^(public/i18n/|gabarits/|public/(taxonomie|chemins|app|langue|play|suivi|sw|consentement|mesure|pub|votes|turnstile|proposer|demandes-regles|profil[a-z-]*|classement)\.js$|public/play\.html$|public/_headers$|scripts/(build-catalog|pages-seo)\.mjs$)'; then site=1; fi
          # Statistiques de jeu : fonctions Cloudflare, migration, tests (sans navigateur) ;
          # suivi des parties du lanceur : aussi dans le navigateur.
          stats=0
          if [ "${{ github.event_name }}" != "pull_request" ]; then stats=2; fi
          if printf '%s\n' "$fichiers" | grep -Eq '^(functions/|migrations/|schema\.sql$|public/idees/|scripts/tester-stats\.mjs$)'; then stats=1; fi
          if printf '%s\n' "$fichiers" | grep -Eq '^(public/(suivi|play|consentement)\.js$|scripts/tester-stats\.mjs$)'; then stats=2; fi
          # Fonctions Cloudflare, formulaire public et modération : tests des demandes (sans navigateur).
          demandes=0
          if [ "${{ github.event_name }}" != "pull_request" ]; then demandes=1; fi
          if printf '%s\n' "$fichiers" | grep -Eq '^(functions/|public/(demandes-regles|taxonomie)\.js$|scripts/(moderation|tester-demandes)\.mjs$|schema\.sql$)'; then demandes=1; fi
          # Profil joueur (docs/cadrage-fidelisation.md) : fonctions, réglages, code de
          # sauvegarde, Worker multijoueur (ticket, résultats) : tests sans navigateur.
          profil=0
          if [ "${{ github.event_name }}" != "pull_request" ]; then profil=1; fi
          if printf '%s\n' "$fichiers" | grep -Eq '^(functions/|migrations/|schema\.sql$|public/(profil|amis)[a-z-]*\.js$|multijoueur/src/|scripts/(tester-profil|tester-amis|d1-local)\.mjs$)'; then profil=1; fi
          # Référencement de tout le site : tout ce qui précède, plus les règles et
          # le vérificateur du référencement (sans navigateur).
          seo=0
          if [ "$tous" = 1 ] || [ "$site" = 1 ]; then seo=1; fi
          if printf '%s\n' "$fichiers" | grep -Eq '^scripts/(regles-seo|verifier-seo)\.mjs$'; then seo=1; fi
          navigateur=0
          if [ -n "$ids" ] || [ "$tous" = 1 ] || [ "$site" = 1 ] || [ "$stats" = 2 ] || [ "$multi" = 1 ]; then navigateur=1; fi
          # Jeux à tester dans le navigateur, partagés entre LOTS_MAX machines au plus
          # (un jeu prend environ 50 s : robot, sauvegarde, 5 langues).
          if [ "$tous" = 1 ]; then
            jeux=$(find games -mindepth 1 -maxdepth 1 -type d ! -name '.*' ! -name '_*' -printf '%f\n' | sort | tr '\n' ' ')
          else
            jeux="$ids"
          fi
          nb=$(printf '%s\n' $jeux | { grep -c . || true; })
          LOTS_MAX=4
          lots=$(( nb < LOTS_MAX ? nb : LOTS_MAX ))
          if [ "$lots" -gt 0 ]; then lots_json="[$(seq -s, 0 $((lots - 1)))]"; else lots_json="[]"; fi
          {
            echo "ids=$ids"
            echo "tous=$tous"
            echo "site=$site"
            echo "seo=$seo"
            echo "navigateur=$navigateur"
            echo "demandes=$demandes"
            echo "stats=$stats"
            echo "multi=$multi"
            echo "profil=$profil"
            echo "jeux=$jeux"
            echo "lots=$lots_json"
          } >> "$GITHUB_OUTPUT"
          echo "Jeux modifiés : ${ids:-aucun} | tous les jeux : $tous | site : $site | référencement du site : $seo | navigateur : $navigateur | demandes : $demandes | statistiques : $stats | multijoueur : $multi | profil : $profil | jeux à tester : $nb sur $lots machine(s)"

  # 2. Les jeux dans le navigateur, partagés entre plusieurs machines en même
  #    temps (un jeu sur LOTS_MAX chacune) : robot, sauvegarde, traductions.
  jeux:
    needs: quoi
    if: ${{ needs.quoi.outputs.lots != '[]' }}
    name: Jeux (lot ${{ matrix.lot }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lot: ${{ fromJSON(needs.quoi.outputs.lots) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Préparer le navigateur de test
        run: |
          npm install --no-save --no-package-lock playwright
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -n "$chrome" ]; then
            echo "Navigateur déjà installé : $chrome"
            echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"
          else
            echo "Pas de Chrome sur la machine : installation de Chromium (Playwright)."
            npx playwright install --with-deps chromium
          fi

      - name: Choisir les jeux de ce lot
        id: lot
        env:
          JEUX: ${{ needs.quoi.outputs.jeux }}
          LOTS: ${{ needs.quoi.outputs.lots }}
          LOT: ${{ matrix.lot }}
        run: |
          nb_lots=$(printf '%s' "$LOTS" | tr -cd ',' | wc -c)
          nb_lots=$((nb_lots + 1))
          liste=$(printf '%s\n' $JEUX | awk -v n="$nb_lots" -v k="$LOT" 'NF && (NR - 1) % n == k' | tr '\n' ' ')
          echo "liste=$liste" >> "$GITHUB_OUTPUT"
          echo "Lot $LOT sur $nb_lots : $liste"

      - name: Contrôler les jeux
        run: node scripts/validate-games.mjs --browser ${{ steps.lot.outputs.liste }}

      # Sauvegarde (public/save.js) dans le lanceur : écrite à la fermeture,
      # relue après rechargement (« Continuer »), effacée. Voir CONSIGNES-JEU.md.
      - name: Contrôler la sauvegarde
        if: ${{ !cancelled() }}
        run: node scripts/tester-sauvegarde.mjs ${{ steps.lot.outputs.liste }}

      # Traductions des jeux (5 langues), sans les pages du site (job « controle »).
      - name: Contrôler les traductions des jeux
        if: ${{ !cancelled() }}
        run: node scripts/check-i18n.js ${{ steps.lot.outputs.liste }} --sans-site

  # 3. Le reste (site, référencement, fonctions), puis le verdict d'ensemble :
  #    « controle » est le contrôle à rendre obligatoire dans la protection de main.
  controle:
    needs: [quoi, jeux]
    if: ${{ always() && needs.quoi.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Résultat des jeux
        run: |
          echo "Jeux dans le navigateur : ${{ needs.jeux.result }}"
          if [ "${{ needs.jeux.result }}" != "success" ] && [ "${{ needs.jeux.result }}" != "skipped" ]; then
            echo "::error::Au moins un lot de jeux a échoué (voir les jobs « Jeux (lot …) »)."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Préparer le navigateur de test
        if: needs.quoi.outputs.navigateur == '1'
        run: |
          npm install --no-save --no-package-lock playwright
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -n "$chrome" ]; then
            echo "Navigateur déjà installé : $chrome"
            echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"
          else
            echo "Pas de Chrome sur la machine : installation de Chromium (Playwright)."
            npx playwright install --with-deps chromium
          fi

      # Genres et univers : uniquement ceux de public/taxonomie.js (jeux, idées, libellés, formulaire).
      - name: Contrôler les genres et les univers
        run: node scripts/controle-taxonomie.mjs ${{ needs.quoi.outputs.ids }}

      # Référencement (pages générées dans les 5 langues, sitemap.xml, robots.txt,
      # liens internes) : bloquant, rapide, sans navigateur. Voir scripts/verifier-seo.mjs.
      # Jeux modifiés seulement : seules les erreurs de ces jeux bloquent (les
      # autres sont affichées en « attention ») ; sinon tout le site est contrôlé.
      - name: Contrôler le référencement
        if: needs.quoi.outputs.ids != '' || needs.quoi.outputs.seo == '1'
        run: |
          if [ "${{ needs.quoi.outputs.seo }}" = 1 ]; then
            node scripts/verifier-seo.mjs
          else
            node scripts/verifier-seo.mjs ${{ needs.quoi.outputs.ids }}
          fi

      # Traductions du site (fr, en, es, pt, de) : bloquant. Voir I18N.md.
      # L'accueil, les fiches, les catégories, les pages légales et le lanceur
      # sont testés avec un seul jeu (les jeux eux-mêmes : job « jeux »).
      - name: Contrôler les traductions du site
        run: |
          if [ "${{ needs.quoi.outputs.navigateur }}" = 1 ]; then
            node scripts/check-i18n.js pommes-du-poney
          else
            node scripts/check-i18n.js --statique
          fi

      # Formulaire public de demandes (functions/api/demandes.js, moderation.js,
      # actions de /idees) et votes : base SQLite en mémoire, faux GitHub et
      # Turnstile. Voir DEMANDES.md.
      - name: Contrôler les demandes publiques
        if: needs.quoi.outputs.demandes == '1'
        run: node scripts/tester-demandes.mjs

      # Statistiques de jeu (sessions, calcul par jour, onglet « Stats ») : base
      # SQLite en mémoire ; avec le lanceur dans le navigateur (window.FMG.reportEnd
      # présent dans le jeu, un seul envoi par session) si le suivi a changé.
      - name: Contrôler les statistiques de jeu
        if: needs.quoi.outputs.stats != '0'
        run: |
          if [ "${{ needs.quoi.outputs.stats }}" = 2 ]; then
            node scripts/tester-stats.mjs --navigateur
          else
            node scripts/tester-stats.mjs
          fi

      # Profil joueur (functions/api/profil.js, classement.js, profil-multi.js,
      # functions/_profil.js, Worker : ticket et résultats) : code de sauvegarde,
      # expérience, séries, étoiles, anti-triche multijoueur, classement,
      # indicateurs ; base SQLite en mémoire, faux Turnstile. Voir docs/cadrage-fidelisation.md.
      - name: Contrôler le profil joueur
        if: needs.quoi.outputs.profil == '1'
        run: node scripts/tester-profil.mjs

      # Amis (functions/api/amis.js, functions/_amis.js, Worker : présence) : demandes,
      # acceptation, blocage, limites, présence (ticket, amis seulement, invisible,
      # délai, lecture toutes les 10 s au plus), classement entre amis, indicateurs.
      # Voir docs/consigne-amis.md.
      - name: Contrôler les amis
        if: needs.quoi.outputs.profil == '1'
        run: node scripts/tester-amis.mjs

      # Multijoueur (docs/multijoueur.md) : moteur et Worker (faux Durable Objects),
      # parties simulées de chaque jeu multijoueur, puis chacun dans le lanceur avec un
      # faux serveur (table pleine, départs, coupure du réseau). Sans réseau ni Cloudflare.
      - name: Contrôler le multijoueur
        if: needs.quoi.outputs.multi == '1'
        run: node scripts/tester-multijoueur.mjs --navigateur

      # Captures du contrôle multijoueur (salon, table pleine, coupure…), à télécharger
      # depuis la page du passage (« Artifacts ») quand quelque chose ne va pas.
      - name: Garder les captures du multijoueur
        if: ${{ !cancelled() && needs.quoi.outputs.multi == '1' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: captures-multijoueur
          path: captures/multijoueur/
          retention-days: 7
          if-no-files-found: ignore

      # Icônes des regroupements : le bloc généré de public/style.css doit
      # correspondre aux dessins de scripts/icones/sources (sans navigateur).
      - name: Contrôler les icônes
        run: node scripts/icones/generer.mjs --verifier
